游消费节奏，预订决策明显前置，长线目的地预订窗口期显著拉长（同程研究院观点经南京晨报报道，2026-08-07，为平台方观点）"],"scripts":[{"angle":"干货直给","text":"国庆还有快两个月，出境长线已经开抢了。同程八月四号的数据，七月三十一号到八月四号这五天，中秋国庆期间出发的机票搜索热度比前五天翻了一倍，度假产品的出境游预订热度环比涨了六成。抢得最凶的不是东南亚，是澳新和欧洲。澳大利亚、新西兰靠户外体验吸年轻人；法国、瑞士、意大利、英国、西班牙这几条欧洲线，卖的是秋季限定景观。第二梯队是签证友好型：俄罗斯、巴西、马尔代夫、乌兹别克斯坦，热度都在涨。周边的韩国、新加坡、马来西亚、泰国照样稳。还有个数据，八月的跨境机票预订比七月涨了超过一成二，说明暑期旺季本身在后移。结论很直接：长线产品的库存和价格是随预订量走的，现在动手和九月动手，差的可能不止一个数量级。"},{"angle":"趋势判断","text":"今年国庆出境游有个很明显的变化：大家把行程留得更长了。同程研究院八月的说法是，中秋国庆双节叠加形成的超长出行窗口，正在重塑跨境游的节奏。落到数据上有两条。第一，预订决策明显前置。七月底到八月初这五天，中秋国庆的机票搜索热度环比翻倍，出境度假产品预订涨六成。距离出发还有两个月，抢票已经开始。第二，目的地结构在变。以前长假主力是东南亚短线，今年澳新和欧洲长线的攀升最显著。原因不复杂——假期够长，飞十几个小时才划算。供给侧也在配合，航司加密国际航线，目的地推签证便利化措施。这两股力一叠加，长线目的地的预订窗口被明显拉长。对普通人的意思是：想去远的地方，今年是近几年门槛最低的一次，但要早。"},{"angle":"反常识开场","text":"国庆出境游最热的不是泰国，是澳大利亚和新西兰。同程八月四号的数据里，度假产品预订热度攀升最显著的就是澳新和欧洲长线，法国、瑞士、意大利、英国、西班牙都在涨。这事往回推一层就明白了。今年中秋国庆连着，请三天假能凑出很长的窗口，假期一长，人的选择逻辑就变了。短线三五天的性价比优势没了，飞十几个小时反而值。南半球这时候是春天，欧洲是秋色最好的一段，两边都卡在最佳季节。第二梯队也有意思，俄罗斯、巴西、马尔代夫、乌兹别克斯坦这几个涨得快的，共同点是免签或者签证便利。签证这一关一松，目的地立刻上榜。八月的跨境机票预订已经比七月涨了一成二。想赶这波，别等九月看价格，那时候看到的就是抢完之后的价。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"阿里Wan3.0公测，一次直出30秒，720P六毛一秒","hook":"AI视频终于能一次生成30秒，还能把PPT直接变成片子。","why":"对短视频创作者是直接的生产力变化，30秒意味着一条完整叙事不用拼接。价格公开且低，能算出具体成本，实操性极强，是今天最值得做的一条。","heat":"高","tags":["AI视频","强时效","创作工具"],"facts":["阿里新一代视频生成模型Wan3.0于2026年8月6日开启公测，单次可生成30秒视频，支持连续运镜、一镜到底等复杂镜头语言，并配有智能时长功能可按提示词自动推荐时长（阿里云公众号，2026-08-06；腾讯研究院AI速递，2026-08-07）","在文本、图片、音频、视频四种基础模态之外，Wan3.0首次支持doc、xls、ppt、pdf、txt、key、pages、numbers、md等文档格式输入，最多输入一个文件或链接，文件大小不超过100MB、页数不超过50页（阿里云公众号，2026-08-06）","Wan3.0的480P/720P/1080P的API价格分别为0.3元、0.6元、1.2元每秒；API接口将于近期全量开放（阿里云公众号，2026-08-06；爱范儿，2026-08-06）","公测入口包括阿里云百炼、万镜一刻、万相官网和千问创作PC端，千问APP灰度开放（阿里云公众号，2026-08-06）","从Wan1.0到Wan3.0，万相模型家族一共迭代了8个版本（阿里云公众号，2026-08-06）","Wan官网列出的能力包括原生30秒时长、最多支持20个参考素材、12种语言长文本渲染、最多9张图融合、最多12张连续一致的图（wan.video官网，2026-08-07）","官方承认Wan3.0在声音质感与文字准确度方面仍有进步空间（阿里云公众号，2026-08-06）","有媒体称720P每秒0.6元约为主流模型六折，并对比竞品Seedance 2.5定价480p每秒0.67元、720p每秒1.51元（爱范儿2026-08-06、ITBEAR 2026-08-07，竞品定价为知情人士透露，待核实）","有报道称目前单次可生成30秒视频的只有两家（爱范儿，2026-08-06，单一来源，待核实）"],"scripts":[{"angle":"干货直给","text":"阿里的Wan3.0八月六号开公测了，三个变化跟做内容的人直接相关。第一，单次能生成三十秒。以前十秒一段，一条片子要抽几十次卡再拼，现在三十秒够装下一段完整叙事，连续运镜、一镜到底都能在一次生成里跑完。它还带智能时长，按提示词自动推荐该多长，不够可以再延。第二，能吃文档。除了文字图片音频视频，这次第一次支持doc、xls、ppt、pdf、md这些格式，一个文件不超过一百兆、五十页。上传一份产品PPT加一句提示词，直接出形象片。第三，价格公开了。四百八十P三毛一秒，七百二十P六毛，一千零八十P一块二。七百二十P生成三十秒，成本大概十八块。入口在阿里云百炼、万相官网和千问创作PC端，千问APP在灰度。官方也说了短板，声音质感和文字准确度还在打磨。"},{"angle":"功能详解","text":"把Wan3.0这次升级拆开看，真正值钱的是三个点。第一个是时长。三十秒是个门槛数字，因为一段有起承转的叙事大概就需要这么长。以前模型只给五到十秒，创作者被迫用碎片拼，人物一换镜就走样。三十秒之内，角色、道具、声音、空间关系和风格能保持一致，这才叫能用。第二个是输入端。它现在能读文档、表格、网页，一个文件最多一百兆、五十页。这意味着教学课件、产品演示、动态图表、业务汇报这类东西，可以直接从原始素材转成视频，中间那道改脚本的活省了。第三个是编辑。支持改画面、改剧情、改台词，可以定位到某个时间区间只改出问题的那几秒，其余保留。从Wan1.0到3.0一共迭代了八个版本，这一版是第一次让工作流成立。"},{"angle":"成本账","text":"算清楚一条AI视频现在要花多少钱。Wan3.0公布的价格是按秒计：四百八十P三毛，七百二十P六毛，一千零八十P一块二。做短视频最常用七百二十P，一条三十秒就是十八块。假设你一条成片要试五版，九十块。再假设十条里出一条能用的，单条爆款的模型成本一千八百块左右。这个数字放在两年前想都不敢想，那时候光渲染就不止这个价。横向看，有媒体拿它跟同规格竞品比，七百二十P的定价差了一倍多，说是主流水平的六折，不过竞品价格是知情人士口径，这条打个问号。真正要注意的是另一笔账：便宜之后，成本瓶颈就从生成转到筛选了。你每天能看多少条、判断多少条，才是产能上限。工具降价，眼力才值钱。"}]},{"id":"ai2","title":"DeepSeek要涨价了，而且说涨幅较大","hook":"把整个行业价格打下来的那家，自己先宣布要涨了。","why":"标志性转折事件，五家以上权威媒体同日报道，官方公告一手可查。对所有用AI工具的人都是成本变化，普通人也听得懂，讨论度天然高。","heat":"高","tags":["强时效","行业趋势","成本"],"facts":["2026年8月6日，DeepSeek在开放平台发布公告，计划近期整体上调DeepSeek API服务的定价，预计涨幅较大，提醒用户合理安排使用，具体调价方案以正式通知为准（DeepSeek开放平台公告，经证券时报、新浪财经、科创板日报、China Daily报道，2026-08-06）","当前DeepSeek V4-Flash平时价格为缓存命中输入0.02元每百万Tokens、缓存未命中输入1元、输出2元；V4-Pro对应为0.025元、3元、6元（DeepSeek开放平台定价，经证券时报、新浪财经报道，2026-08-06）","今年6月底DeepSeek引入峰谷分时计费机制，工作日9:00-12:00和14:00-18:00高峰时段价格为平时的两倍，其余时段执行平时价格（证券时报、科创板日报，2026-08-06）","今年5月DeepSeek宣布V4-Pro限时折扣转为永久价格，API价格维持在原定价的四分之一，折合每百万Token输入约0.44美元、输出约0.87美元；同期OpenAI GPT-5.5为5美元和30美元，Anthropic Claude Opus 4.7为5美元和25美元（证券时报，2026-08-06）","据海外开发者平台OpenCode披露，8月1日V4-Flash单日处理Token总量达8万亿，其中5万亿来自免费试用、3万亿来自付费调用（证券时报，2026-08-06）","今年3月国家数据局披露，我国日均Token调用量已突破140万亿，较2024年初的1000亿增长超过千倍（证券时报引国家数据局，2026-08-06）","年内智谱、月之暗面、MiniMax等多家机构已进行价格上调；腾讯云连续两次宣布涨价，智谱AI年内三次上调API价格（金融时报经腾讯新闻2026-08-06、科创板日报2026-08-06）","工信部信息通信经济专家委员会委员盘和林分析，此次涨价主要源于成本上升，是否持续上涨还要看后续AI算力成本情况（金融时报，2026-08-06）","OpenRouter周榜显示DeepSeek V4 Flash调用量位居全球首位，8月4日曾因访问量过大出现容量不足（新浪财经2026-08-06；注：不同报道调用量有6.6万亿与7.22万亿两种口径，待核实）"],"scripts":[{"angle":"干货直给","text":"八月六号，DeepSeek在开放平台发了个公告：计划近期整体上调API服务定价，预计涨幅较大，提醒用户合理安排使用。具体涨多少、什么时候生效，还没说。先看现在的价。V4-Flash每百万token，缓存命中输入两分钱，未命中一块，输出两块；V4-Pro是两分五、三块、六块。另外六月底已经加过一次峰谷计费，工作日上午九点到十二点、下午两点到六点，价格翻倍。这次是整体上调，跟上次那种分时段不一样。原因摆在明面上：调用量顶不住了。八月一号V4-Flash单日处理八万亿token，其中五万亿是免费试用。八月四号还因为访问量太大出现过容量不足。行业不止它一家，年内智谱、月之暗面、MiniMax都涨过，腾讯云涨了两次。用API做产品的，现在就该重算成本。"},{"angle":"趋势判断","text":"把DeepSeek这次涨价放进两年的时间线里看，是一个拐点。二零二四年四月，它把API价格打到输入一块、输出两块，直接引爆国内价格战。今年五月，又宣布把限时折扣转成永久价，定价只有原来的四分之一，折合下来每百万token输入四毛四美元、输出八毛七美元。同期OpenAI是五美元和三十美元，Anthropic是五美元和二十五美元。十倍以上的差价，这才有了全球开发者往中国模型迁的那一波。六月底开始转向，先是峰谷计费高峰翻倍，八月六号直接预告整体上调、涨幅较大。逻辑不复杂：算力供需紧、芯片和运营成本涨，靠低价换规模撑不住。工信部专家委员会的盘和林说得直白，主因是成本上升。整个行业正在从抢用户，回到成本能扛得住的定价。"},{"angle":"反常识开场","text":"AI越用越便宜，这个共识今年可能要打个折。八月六号DeepSeek公告说要整体涨价，涨幅较大。往前数，年内智谱涨了三次，腾讯云涨了两次，月之暗面、MiniMax也都动过价。反常识的点在于，涨价恰恰不是因为没人用，是因为用的人太多。八月一号V4-Flash一天处理八万亿token，四号直接被挤到容量不足。高盛的看法也是，高峰时段调价不代表需求走弱，反而说明算力资源趋紧。更大的背景是国家数据局今年三月披露的数字：全国日均token调用量突破一百四十万亿，比二零二四年初的一千亿涨了一千多倍。一千倍的用量涨上去，单价再低也扛不住总成本。所以接下来省钱的思路要变：不是找更便宜的模型，是让同一件事少烧token。"}]},{"id":"ai3","title":"ChatGPT免费用户能无限聊了，还多了个思考按钮","hook":"纯文字聊天的算力，OpenAI已经不打算收钱了。","why":"覆盖人群最广的一条AI消息，免费用户直接受益。多个来源同日确认且有官方公告，配合价格下调背景能讲出行业逻辑，普通观众也听得进去。","heat":"高","tags":["强时效","工具更新","免费"],"facts":["2026年8月6日OpenAI宣布更新ChatGPT，取消所有用户基于文本的聊天使用限制，相关更新预计从下周开始发布（OpenAI官网公告，经财联社2026-08-07、cnBeta 2026-08-07报道）","免费版和Go用户的默认模型更新为GPT-5.6 Luna，取代此前的GPT-5.5 Instant（界面新闻2026-08-06、财联社2026-08-07、网易科技2026-08-07）","免费用户以及每月8美元的Go套餐订阅者将获得新的Think思考按钮，可让模型花更多时间推理以回答更复杂的问题（财联社，2026-08-07）","文件上传、图片分析、语音对话、AI绘图等更消耗算力的功能仍保留单独的配额限制（财联社2026-08-07、cnBeta 2026-08-07）","Plus和Pro用户获得升级后的GPT-5.6 Sol，新增可调节思考深度的滑块；该版本与用于Codex和Work的GPT-5.6 Sol不同，后者保持不变（cnBeta 2026-08-07、网易科技2026-08-07）","OpenAI内部评估显示，相比GPT-5.5-Instant，GPT-5.6 Luna的事实性错误率降低62%，GPT-5.6 Sol降低68%（cnBeta引OpenAI内部评估，2026-08-07）","此次更新发布之际ChatGPT全球每周活跃用户数刚突破10亿（cnBeta，2026-08-07）","上月底OpenAI曾宣布下调GPT-5.6家族价格，其中Luna下调80%至每百万输入词元0.20美元、输出1.20美元，此前分别为1美元和6美元；Terra下调20%（财联社，2026-08-07）","有消息称OpenAI最快下周推出全新预训练模型Astra，内部代号mewfour（IT之家、界面新闻，2026-08-07，待核实）"],"scripts":[{"angle":"干货直给","text":"八月六号OpenAI更新了ChatGPT，免费用户这次是真受益。第一条，文字聊天不限次数了。以前免费号聊几轮就被限速，现在纯文本对话取消上限。第二条，免费版和Go用户的默认模型换成GPT-5.6 Luna，替掉原来的GPT-5.5 Instant。按OpenAI自己的内部评估，Luna比原来那个模型的事实性错误率低了六成二。第三条，多了个Think按钮，遇到复杂问题点一下，让它多想一会再答。有几个限制要说清楚：无限的只是文字。上传文件、图片分析、语音对话、AI画图这些吃算力的，配额照旧。发布节奏上，Plus和Pro的Sol更新已经生效，免费版和Go版这周陆续推，无限聊天和Think按钮下周全量。这个时间点它的周活刚过十亿。"},{"angle":"横向对比","text":"同一周里，两家头部公司走了相反的方向，对比着看很有意思。八月六号OpenAI宣布ChatGPT文字聊天不限量，免费用户默认模型升到GPT-5.6 Luna，还送了个Think按钮。同一天，DeepSeek发公告说要整体上调API定价，预计涨幅较大。看起来矛盾，其实是两个市场。OpenAI放开的是C端纯文本对话，这部分算力现在最便宜——它上月底刚把Luna的价格降了八成，每百万输入词元从一美元降到两毛，输出从六美元降到一块二。成本降到这个程度，聊天当赠品送得起。DeepSeek要涨的是B端API，那边跑的是智能体和代码任务，单个任务的token消耗比聊天高一个量级，还得抢GPU。结论是：以后闲聊会越来越免费，真干活会越来越贵。你的钱该花在哪一头，很清楚了。"},{"angle":"反常识开场","text":"OpenAI把聊天免费了，不是因为大方，是因为聊天已经不值钱了。八月六号的更新里，文字对话取消次数限制，免费用户默认换成GPT-5.6 Luna。关键在上个月底的另一条消息：Luna的调用价格降了百分之八十，每百万输入词元从一美元降到零点二美元，输出从六美元降到一点二美元。成本掉到这个量级，十亿周活的纯文本聊天才送得起。同时被保留的限制更说明问题——文件、图片、语音、画图，全部还有配额。这些才是真烧算力的部分。给Plus和Pro的升级也一样，重点是那个思考深度滑块，让你自己决定花多少推理量。整件事的信号是：AI公司的收费点正在从对话次数，转到推理强度和多模态。以后区分免费和付费的，不是你能问多少句，是你要它想多深。"}]},{"id":"ai4","title":"AI短剧成本从四十万砍到四万，钱正在疯狂涌进来","hook":"三个月，四家AI视频公司融了将近三百亿。","why":"对做内容的人是直接的行业风向，成本从三十万降到三万这个数字冲击力极强。融资数据来自权威财经媒体，可讲赛道格局也可讲个人机会，延展性好。","heat":"高","tags":["AI视频","行业趋势","短剧"],"facts":["近三个月可灵AI、生数科技、爱诗科技、演语科技四家公司披露的新增融资合计已接近300亿元人民币（经济参考报，2026-08-07）","可灵AI落地近30亿美元融资，投后估值有望达到180亿美元，创全球视频大模型公司最大额融资纪录；由CPE源峰、国方创投、BlueFive、腾讯、中关村科学城基金、中信证券联合领投，阿里云、百度等产业资本及华策影视等文娱产业方参与（经济参考报，2026-08-07）","中影年年CTO、首席科学家蔡一铭表示，AI短剧制作成本已从传统实拍的30万至50万元压缩至3万至5万元，质量已达到可商用标准（经济参考报，2026-08-07）","7月生数科技完成5亿美元融资由阿里云领投；同月爱诗科技C轮累计融资29.8亿元由阿里巴巴领投；6月演语科技完成近3亿美元B轮融资，投后估值超20亿美元（经济参考报，2026-08-07）","可灵AI 2026年6月初全球用户突破1亿，较2025年底的6000万增长约67%，覆盖224个国家和地区；2026年第一季度营业收入超6.5亿元人民币，同比增长超300%（经济参考报引可灵AI产品及运营负责人温园旭，2026-08-07）","昆仑万维董事长兼CEO方汉称，2026年3月底公司短剧及AI短剧平台单月流水超4800万美元，截至2026年6月底AI短剧平台业务ARR已突破7亿美元（经济参考报，2026-08-07）","中信证券研报以游戏引擎行业近三十年演化为参照，认为AI视频生成模型行业能够穿越周期的有效玩家数量或收敛至个位数，终局格局或呈现3至4家头部差异化并存的寡头竞争态势（经济参考报，2026-08-07）","行业共同面临的挑战包括算力成本高企、C端用户留存率偏低、版权合规风险（经济参考报，2026-08-07）","爆款AI短剧虚拟女主角单条短广告报价高达数十万元的消息在业内引发热议（经济参考报，2026-08-07，属行业传闻，待核实）"],"scripts":[{"angle":"数据向","text":"先看几个数。近三个月，可灵、生数科技、爱诗科技、演语科技这四家AI视频公司，披露的新增融资加起来接近三百亿人民币。其中可灵拿了近三十亿美元，投后估值有望到一百八十亿美元，是全球视频大模型公司里最大的一笔。领投方名单很有意思，腾讯、阿里云、百度罕见同台，中信证券和中关村科学城基金也在里面。这些平时是对手的公司，一起投了同一家。再看一个更接地气的数：中影年年的CTO蔡一铭说，AI短剧的制作成本已经从传统实拍的三十万到五十万，压到三万到五万，质量到了可商用标准。降一个数量级。产能这边，可灵今年六月初全球用户破一亿，一季度营收超六点五亿，同比涨了三倍多。钱、成本、用户三条线同时动，这个赛道今年的变化会很快。"},{"angle":"故事切入","text":"一部短剧，以前要三十万到五十万，现在三万到五万能做完，质量还能商用。说这话的是中影年年的CTO蔡一铭，八月七号经济参考报的报道。这句话背后是一整个行业在换算法。同一篇报道里，近三个月四家AI视频公司融了将近三百亿人民币，可灵一家就拿了近三十亿美元，估值奔着一百八十亿美元去。腾讯、阿里云、百度这三家平时打得厉害的，这回一起进了可灵的股东名单。为什么资本这么急？因为账已经算得清了。昆仑万维说，到今年六月底，它的AI短剧平台业务年度经常性收入超过七亿美元。可灵一季度营收六点五亿人民币，同比涨超三倍。成本降一个数量级，收入涨三倍，中间那块差价就是所有人在抢的东西。对个人创作者，机会窗口也就是这一两年。"},{"angle":"成本账","text":"把AI短剧的成本账摊开算。传统实拍一部短剧，三十万到五十万，这里面是场地、演员、灯光、摄影、后期，人是最大头。换成AI生产，中影年年给的数是三万到五万，降幅九成左右，而且明确说质量已达到可商用标准。省下来的钱去哪了？去了算力和人力结构的重排。你不再需要剧组，需要的是会写提示词、懂镜头语言、能筛片的人。这也是为什么资本敢下重注：近三个月四家公司融了近三百亿，可灵一家近三十亿美元。但风险要说清楚。中信证券的研报判断，这个行业能穿越周期的玩家可能只剩个位数，终局是三到四家头部并存。行业公认的三个难题还在：算力成本高、C端留存低、版权合规。所以别去卷模型，去卷内容——那才是你的位置。"}]},{"id":"ai5","title":"AI视频别再抽卡了，锁人物、定区间、只改那几秒","hook":"抽卡是赌博，迭代才是干活，这两种用法的成本差十倍。","why":"纯实操玩法，长效不过时，跟当天的Wan3.0新闻互补。多数人用AI视频还停在反复重生成，讲清楚工作流能立刻提升产出效率，适合做保姆级教程。","heat":"中高","tags":["实操","AI视频","工作流"],"facts":["Wan3.0的视频编辑能力大幅提升，支持修改画面、剧情与台词，创作者可以定位到某个时间区间只改出问题的那一段，保留其余部分（阿里云公众号2026-08-06、爱范儿2026-08-06）","在参考生视频任务中，角色的五官、发型发色、形体、服饰、配饰等细粒度特征可稳定保持；道具的多角度外观、硬件结构、Logo、材质细节也保持稳定（阿里云公众号，2026-08-06）","爱范儿实测：以参考图作为首帧并要求模型严格保持人物视觉身份时，脸部特征与服装款式的保持是实质性的；但同一段提示词的输出结果不同，若要长期沿用同一张脸，需在下次生成时把参考图给模型（爱范儿，2026-08-06）","Wan3.0支持最多20个参考素材输入，支持最多9张图融合，可生成最多12张风格与主体一致的连续图像（wan.video官网，2026-08-07）","支持上传doc、xls、ppt、pdf、md等文档，最多一个文件或链接，不超过100MB、50页；上传产品图加一份介绍文档配提示词即可生成完整形象片（阿里云公众号，2026-08-06）","智能时长功能可根据提示词自动推荐合适时长，搭配视频延长功能可延展剧情走向（阿里云公众号，2026-08-06）","官方与实测均指出Wan3.0在声音质感与文字准确度方面仍有提升空间，环境音的空间感偶尔与画面贴合度不足（阿里云公众号2026-08-06、爱范儿2026-08-06）","按阿里云公布的720P每秒0.6元推算，一条30秒视频单次生成成本约18元（据2026-08-06公布单价推算）"],"scripts":[{"angle":"实操流程","text":"用AI做视频，同样一条片子，有人花两百有人花两千，差别在流程。给你一套能直接照抄的顺序。第一步，先定人。用一张参考图当首帧，在提示词里明确要求保持人物的视觉身份，五官、发型、服饰、配饰全部锁死。实测下来脸和衣服的保持是实打实的。关键一点，同一段提示词每次输出都不一样，所以你选定的那张脸要存好，下次生成继续把它喂进去。第二步，定基调。先出一版低分辨率的，四百八十P三毛一秒，用来确认镜头、节奏、光线对不对，别一上来就跑一千零八十P烧钱。第三步，只补差的那几秒。现在支持定位到某个时间区间，单独改画面、改剧情、改台词，其余保留。三十秒里通常只有两三秒有问题，改那两三秒就行。第四步，最后一遍高清出片。"},{"angle":"避坑清单","text":"用AI视频最烧钱的几个习惯，一条条说。第一，无脑重生成。看到不满意就整条重跑，三十秒七百二十P一次十八块，跑二十次三百六。正确做法是定位到出问题的那个时间区间，只改那一段。第二，不给参考图。同一段提示词每次输出的脸都不一样，你想做系列内容，第二条视频主角就换人了。解决办法是把第一次选中的那张脸存下来，之后每次都当参考素材传进去。第三，一上来就跑最高清。定镜头、定节奏的阶段用四百八十P，三毛一秒，确认没问题再上高清。第四，指望它把声音也做好。官方自己承认声音质感和文字准确度还在打磨，环境音的空间感容易出戏，配音和音效老老实实自己后期。第五，忽略文档输入。产品图加一份介绍文档丢进去，比你憋半天提示词管用。"},{"angle":"方法论","text":"AI视频有两种用法，决定了你是玩票还是干活。第一种叫抽卡：写一段提示词，反复重生成，等一个运气好的结果。这种方式的问题不是慢，是不可控——你没法承诺交付时间，也没法做系列内容，因为下一条的主角可能就换脸了。第二种叫迭代：先用参考图把角色形象锁住，确认视觉基调，生成之后找出有问题的时间段做局部修改。差别在于，迭代是可以积累的。你的参考素材库、提示词模板、修改经验，每做一条都在变厚。现在的模型已经支持这套流程了，最多能吃二十个参考素材，能定位区间改台词改剧情。工具变化的真正意义在这：它不再替你做决定，只是让你的决定更容易落地。门槛降了，天花板没降。会用的人，产能是别人的十倍。"}]}]}]},"2026-08-06":{"date":"2026-08-06","updatedAt":"2026-08-06 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"8月5号起机票油费又降了，长途一张少一百","hook":"汽油前几天刚涨，机票的油费反而降了，长途一张票比五月省一百块。","why":"强时效省钱信息，8月出行人群基数极大。出票日期为准这条规则多数人不知道，能直接改变下单时机，收藏与转发率高。三个月连降的走势也有解释空间。","heat":"高","tags":["强时效","省钱","出行必备"],"facts":["自2026年8月5日（出票日期）起，国内航线燃油附加费下调：800公里以上航线每位成人70元，800公里（含）以下40元，较调整前分别降低30元和10元（央视网、新华社，2026-08-05）","这是今年6月以来第三次下调国内航线燃油附加费，也是连续第三个月下调（央视网、北京青年报，2026-08-05）","与5月16日年内峰值（800公里以下90元、800公里以上170元）相比，长途航段累计降幅达100元，短途降50元（北京青年报2026-08-05、南方日报2026-08-01）","今年以来国内燃油附加费累计已有六轮调价：1月5日为年内最低（短途10元、长途20元），4月5日、5月16日连续两轮上调，6月5日、7月5日、8月5日连续三轮下调（央视新闻转天津交通广播，2026-08-05）","燃油附加费起征以原出票日期为准，与航班起飞时间无关；2026年8月5日以前销售的国内客票，如变更至8月5日（含）以后，已收取的燃油附加费不退不补（北京青年报，2026-08-05）","按民航局相关规定，婴儿免收燃油附加费；儿童（含无成人陪伴儿童）、革命伤残军人和因公致残的人民警察按半价收取（北京青年报转述民航局规定，2026-08-05）","燃油附加费以航空煤油出厂价为核心联动依据，基准线为5000元/吨，参考过去一个月航油平均价，超出部分的80%通过燃油附加费解决，与国际原油价格并非同步波动（央视网，2026-08-05）","2026年7月下旬国际油价重心上移，推动7月31日国内汽柴油每吨分别上调685元和655元，与燃油附加费走势相反（央视网，2026-08-05）"],"scripts":[{"angle":"干货直给","text":"从八月五号出票的国内机票，燃油附加费降了。八百公里以上的航线，成人每人收七十块，八百公里以内收四十块，比之前分别少了三十和十块。这是六月以来第三次下调，连着三个月降。跟五月十六号年内最高点比，长途一张票的油费从一百七降到七十，直接少一百块，短途从九十降到四十，少五十。关键在时间点，燃油附加费按出票日期算，跟你哪天起飞没关系。八月五号零点之前出的票，哪怕航班在下个月飞，还是按老标准收，而且已经收的钱不退不补。所以八月要出门又还没下单的，等过了零点再买。还有几条容易被忽略的：婴儿不收燃油附加费，儿童、革命伤残军人、因公致残的人民警察按半价收。一家三口出行，光这一项就能省出一顿饭钱。"},{"angle":"成本账","text":"算笔账你就知道要不要等。八月五号起，八百公里以上航线的燃油附加费是七十块，以内是四十块。往前推，五月十六号是年内最高，长途一百七、短途九十。也就是说同一张北京飞乌鲁木齐的票，五月买和现在买，光油费差一百块，一家四口就是四百。今年以来这项费用一共调了六轮，一月五号最低，长途才二十块，四月和五月连着两轮往上冲，五月中触顶，之后六月五号、七月五号、八月五号连降三次。规则上它盯的是航空煤油出厂价，基准线是每吨五千块，超过才开始收，超出部分的百分之八十摊到旅客头上。所以它跟加油站的油价不是一回事。你要做的很简单：八月出行的票别急着在四号晚上下单，拖到五号零点之后。"},{"angle":"反常识开场","text":"前几天汽油刚涨完，一吨汽油柴油分别加了六百多，很多人以为机票也要跟着贵。结果反过来，八月五号起国内航线的燃油附加费又降了，长途七十、短途四十，比之前少三十和十块。原因在两套定价机制根本不是一回事。加油站的油价严格绑国际原油均价，每十个工作日开一次调价窗口，跟得又快又紧。机票的燃油附加费看的是航空煤油出厂价，参考过去一个月的均价，基准线每吨五千块，超过五千才开始收，而且只把超出部分的八成转给旅客。上个月航煤在跌，所以这个月的附加费接着降，这已经是六月以来第三次。提醒一句，这项费用按出票日期算，不看起飞时间，五号零点前买的票即便八月底才飞，也退不了那三十块。"}]},{"id":"tv2","title":"俄罗斯免签延到2027年底，30天说走就走","hook":"原本九月十四号就到期的俄罗斯免签，普京签令直接续到二七年底。","why":"政策类硬信息，官方一手来源（驻外总领馆）可查。多数人以为免签今年秋天就结束，信息差大。配合中俄双向免签和口岸客流数据，可信度和实用性都够，适合做长效攻略。","heat":"中高","tags":["政策","出境游","免签"],"facts":["7月20日，俄罗斯总统普京签署总统令，将现行对持普通护照中国公民免签政策延长至2027年12月31日（中国驻哈巴罗夫斯克总领事馆，2026-07-23）","据普京2025年12月1日签署的原命令，该免签原定执行至2026年9月14日（含），本次为延期（澎湃新闻转央视新闻、国家移民管理局，2026-07）","免签适用事由为探亲或商务访问、旅游，或参加科学、文化、社会政治、经济、体育活动，或过境俄罗斯联邦领土，停留不超过30天（澎湃新闻转央视新闻，2026-07）","中方于2026年5月20日宣布将对俄罗斯单方面免签政策延长至2027年12月31日，俄方7月20日对等延长，形成双向政策（呼伦贝尔市人民政府，2026-07-31）","2026年上半年满洲里十八里海关共监管进出境旅客34.14万人次、进出境客运车辆15915辆次，同比分别增长64.44%和34.39%（呼伦贝尔市人民政府，2026-07-31）","7月出境热门目的地中莫斯科进入前十，到达旅客量同比增长约12%，受益于俄罗斯延长对中国公民免签政策（航旅纵横，解放日报，2026-08-05）","中国驻哈巴罗夫斯克总领馆提醒：护照有效期须覆盖在俄停留期；因免签政策之外事由来俄务必提前办妥相应类别签证；入境后不从事与来俄目的不符的活动（2026-07-23）","满洲里已打通离境退税渠道并推动即买即退政策落地，上半年累计办理离境退税24笔、涉及货值4万元（呼伦贝尔市人民政府，2026-07-31）","待核实：俄总理米舒斯京8月4日称实行互免旅游签后赴俄中国游客明显增多，并提及中俄正讨论永久免签，该表述目前见于社交媒体转述，未见官方通稿原文"],"scripts":[{"angle":"干货直给","text":"去俄罗斯这件事，门槛又低了一档。七月二十号普京签了总统令，把中国公民的免签政策延长到二零二七年十二月三十一号。这不是新开的口子，是原本要在今年九月十四号到期的政策续了两年多。持普通护照，探亲、商务访问、旅游、参加科学文化体育活动，或者只是过境，都能免签进俄罗斯，停留不超过三十天。中方那边五月二十号已经先宣布把对俄免签延到同一天，现在是双向对等。数据也跟上了，满洲里十八里海关上半年监管进出境旅客三十四万人次，同比涨了六成四，客运车辆涨三成四。七月出境目的地里莫斯科挤进了前十，到达旅客同比涨百分之十二。要注意，免签不等于随便待，护照有效期必须覆盖你在俄停留的整段时间。"},{"angle":"行程规划","text":"三十天免签能怎么排，给个可执行的框架。先定入境方式。飞莫斯科或圣彼得堡最省事，直飞城市多；如果你在东北，走满洲里陆路口岸更便宜，上半年这个口岸的出入境旅客涨了六成四，通关流程已经很成熟。八到十天的话，莫斯科三天加圣彼得堡四天最稳，红场、克里姆林宫、地铁站、冬宫、夏宫，一趟能把两座城的核心吃透。有十五天以上，加一段跨西伯利亚铁路，从莫斯科往东，或者反过来从海参崴进、莫斯科出。预算上，这两年对中国游客的接待配套明显变好，离境退税渠道打通了，满洲里那边还落地了即买即退。别踩的坑是：免签给的是旅游探亲商务过境这些事由，你要是打算在那边打工或者读书，仍然得单独办签证。"},{"angle":"避坑清单","text":"俄罗斯免签延到二七年底，但有几条是真会让你被拦下来的。第一，免签停留上限三十天，从入境那天算起，超一天就是逾期滞留。第二，免签事由是限定的，探亲、商务访问、旅游、参加科学文化社会政治经济体育活动、过境，这几类之外的目的必须提前办对应类别签证。想去做工、长期居留、正式留学，拿着免签进去等于给自己埋雷。第三，护照有效期要覆盖你在俄的整个停留期，边检看的是这个，不是看你机票日期。第四，这个政策针对的是普通护照，其他护照类型按各自规定走。中国驻哈巴罗夫斯克总领馆七月的提醒里专门说了，入境后遵纪守法，不从事与来俄目的不符的活动，做好海外安全第一责任人。出发前把这四条对一遍。"}]},{"id":"tv3","title":"今年涨最猛的航线，两头都不是大城市","hook":"芜湖飞贵阳涨五倍，湛江飞太原涨四倍，热的全是小城对飞。","why":"选题反直觉且有具体航线数据支撑，选目的地的人可以直接照着用。县域游机票增幅超十倍是央视口径，权威度够。避开了热门景区的老话题，差异化明显。","heat":"中高","tags":["目的地","避暑","小众"],"facts":["去哪儿旅行数据：芜湖-贵阳航线机票量同比增幅超过5倍，湛江-太原增4倍，惠州-哈尔滨增长3倍（央广网，中国网转载，2026-08-06）","芒市-福州、芒市-郑州等连接边境小城与省会城市的航线增幅超过4倍，芒市自带东南亚异域风情、提供假装在国外的体验感（去哪儿旅行，中国网，2026-08-06）","以避暑、人文、边疆体验为特征的县域旅游异军突起，部分热门小城的机票预订增幅超过10倍（央视网，2026-08-05）","7月航旅纵横数据：西南方向黔南州到达客流同比增长超190%，普兰、稻城、六盘水增幅均超70%；西北方向德令哈、巴里坤同比增幅均超150%；华北方向张家口同比增长约170%（解放日报，2026-08-05）","美团相关负责人表示，今年暑期消费者对旅行的期待已从到此一游升级为深度体验，越来越多人为一种兴趣、一项手艺、一次在地体验专程奔赴一座城市（央广网，中国网转载，2026-08-06）","行业人士预判8月中上旬暑期旅游市场将迎来新一轮客流高峰（央广网，中国网转载，2026-08-06）"],"scripts":[{"angle":"反常识开场","text":"今年暑期涨得最猛的机票航线，两头都不是大城市。去哪儿的数据里，芜湖飞贵阳的机票量同比涨了五倍多，湛江飞太原涨四倍，惠州飞哈尔滨涨三倍。云南边境的芒市更夸张，芒市到福州、芒市到郑州这种小城连省会的航线，增幅都超过四倍。逻辑其实很直白。热门景区这几年被挤怕了，价格也上去了，一批人开始往没被开发透的地方走。而这些小城之间刚好有直飞，票价不贵，落地就是当地生活本身，不用跟旅行团抢位置。央视那边给的数字更直观：以避暑、人文、边疆体验为特征的县域旅游异军突起，部分热门小城的机票预订增幅超过十倍。所以下次订票别只在省会之间比价，把出发地和目的地都换成小城试一次。"},{"angle":"干货直给","text":"记几组今年暑期真实涨起来的小城航线，选目的地的时候直接用。避暑方向：芜湖到贵阳涨五倍多，湛江到太原涨四倍，惠州到哈尔滨涨三倍，这三条都是南方热城飞北方或高原凉城的典型。异域感方向：云南芒市，芒市到福州、芒市到郑州增幅超四倍，这地方自带东南亚风情，很多人是冲着假装在国外去的。区域客流上，西南的黔南州到达旅客同比涨超一倍九，普兰、稻城、六盘水都超七成；西北的德令哈、巴里坤涨超一倍五；华北的张家口涨约一倍七。这些数字的用法不是让你跟风扎堆，而是告诉你哪些地方今年航班密度和接待能力被真实拉起来了，去了不至于订不到房、打不到车。"},{"angle":"行程规划","text":"想去小城避暑又不知道怎么排，按这个思路走。第一步选飞。别默认从自己城市飞省会再转，直接查小城对飞的直飞航线，今年芜湖贵阳、湛江太原、惠州哈尔滨这类线路运力涨得快，票价反而低。第二步定天数。小城的核心体验是慢，三天太赶，五到七天刚好，能把周边一到两个县城串上。第三步排内容。美团那边的判断是，今年游客要的已经不是到此一游，而是为一种兴趣、一项手艺、一次在地体验专程奔赴一座城。所以行程别堆景点，挑一件能沉进去的事，比如在芒市泡一周傣味早市和边贸市场，比打卡五个点记得住。第四步避坑。小城接待能力有限，住宿和用车提前订，尤其八月中上旬会迎来新一轮客流高峰。"}]},{"id":"tv4","title":"国庆的团，早走晚走差二十五个点","hook":"同一条线，中秋出发比黄金周中段贵三四十个点，你的假决定了你的钱。","why":"国庆决策窗口正在关闭，价格差有具体百分比，可执行性极强。免签长线提前两个月售罄这条能制造紧迫感。与机票类选题区分开，讲的是团费与出发波次。","heat":"高","tags":["国庆","错峰","省钱"],"facts":["广之旅8月2日发布《2026年国庆出境游趋势报告》：今年中秋与国庆仅隔三个工作日，叠加请3休13拼假方案，催生十余天超长出行窗口，出境长线产品收客量环比增长62%（南方都市报，2026-08-03）","免签长线目的地预订量环比激增约300%，部分热门线路提前两个月售罄（广之旅报告，南方都市报，2026-08-03）","国庆出境游将出现三波出发高峰：最高峰集中在9月25日至26日中秋期间；10月1日国庆当日为第二波，以亲子家庭为主；第三波在黄金周中段，以节后拼假错峰出游为主（同上）","中秋首发团、国庆正日热门团期产品价格环比上涨20%至25%；黄金周中段出发排期因避开资源最紧俏时段，价格回落15%至20%（同上）","19至39岁年轻客群出境游人次占比环比黄金周前增长10%（同上）","途牛平台上已预订中秋国庆假期旅游产品的游客中，约40%选择在中秋假期甚至更早的时间出发（第一财经，2026-08-05）","7月31日至8月4日，中秋国庆期间出发机票搜索热度环比前五日翻倍，度假产品出境游预订热度环比增长60%（同程旅行，扬子晚报，2026-08-04）","2026年中秋假期为9月25日至27日，国庆假期为10月1日至7日，中间9月28日至30日为三个工作日（国务院办公厅节假日安排）","免签或便捷签证的热门方向包括俄罗斯、巴西、乌兹别克斯坦、哈萨克斯坦、格鲁吉亚、阿塞拜疆、塞尔维亚、土耳其、埃及等（广之旅报告，南方都市报，2026-08-03）"],"scripts":[{"angle":"成本账","text":"国庆出境跟团，什么时候走差二十五个点。广之旅八月二号发的国庆出境游趋势报告里，把今年的节奏拆成三波。第一波也是最高峰，九月二十五到二十六号中秋期间出发，靠请三休十三提前走，适合十天以上的长线。第二波是十月一号当天，以亲子家庭为主。第三波在黄金周中段，节后拼假错峰。价格是这么走的：中秋首发团和国庆正日的热门团期，因为机票酒店这些上游资源最紧，产品价格环比涨百分之二十到二十五；黄金周中段出发的排期，避开最紧俏时段，价格回落百分之十五到二十。一头一尾差出来的就是三四十个点。同一条线路，你把出发日往后挪几天，省下的钱够加一个自费项目。前提是你的假能拼得开。"},{"angle":"反常识开场","text":"国庆的团现在报，有些线路已经买不到了。广之旅的报告里写着，免签长线目的地预订量环比激增约三倍，部分热门线路提前两个月售罄，出境长线产品的收客量环比涨了六成二。原因是今年中秋和国庆中间只隔三个工作日，请三天假能休十三天，这个窗口一出来，大家的决策全部前置。途牛那边的数据是，已经订了中秋国庆产品的游客里，约四成选择在中秋假期甚至更早出发。同程也说，七月三十一号到八月四号这五天，中秋国庆期间出发的机票搜索热度环比前五天翻倍，度假产品出境游预订热度涨六成。客群也在变，十九到三十九岁的年轻人出境人次占比环比涨了一成。所以别再按往年经验等九月看价格。"},{"angle":"行程规划","text":"用请三休十三这个窗口，怎么排最划算。先看假期结构：中秋九月二十五到二十七，国庆十月一到七，中间二十八、二十九、三十是三个工作日。请这三天，从九月二十五号一路休到十月七号，十三天。接下来做三选一。要省钱，走第三波，黄金周中段出发，团费比正日便宜百分之十五到二十，缺点是回程会压到假期尾巴。要玩长线，走第一波，中秋当天或前一天出发，十天以上的欧洲、澳新线路只有这个窗口塞得下，代价是团费贵百分之二十到二十五。要带孩子，第二波十月一号出发的亲子团最集中，同行客群匹配度高。目的地上，免签和签证便利的地方今年最省事，俄罗斯、巴西、乌兹别克斯坦、哈萨克斯坦这些热度在涨。"}]},{"id":"tv5","title":"八月机票预订涨了7%，还有两折的票在卖","hook":"总量在涨，两折票没消失，问题只是你在哪条航线上找。","why":"数据向选题，反直觉且有具体可捡漏的航线名字。暑运启动晚导致的结构性余量是今年独有的解释，讲清楚能建立专业感。八月中上旬还有一波高峰，时效性强。","heat":"中高","tags":["数据","捡漏","暑期"],"facts":["截至7月底，8月境内航线机票预订量约1750万张，同比增长约7%；出入境航线机票预订量超550万张，同比增长超6%（航旅纵横民航官方直销平台，解放日报，2026-08-05）","7月境内航线民航旅客量超6294万人次，同比增长约4%；出入境航线民航旅客量超806万人次，同比增长约3%（同上）","7月中下旬境内航线旅客运输量超2942万人次，同比增长超6%；出入境航线超374万人次，同比增长超5%，增长主要靠7月中下旬拉动（同上）","今年暑运启动晚，台风、高温等异常天气叠加，一些学校放假较晚，前期民航客流数据增长不明显（解放日报，2026-08-05）","8月北京到乌鲁木齐、上海到乌鲁木齐等热门航线仍有低至两折左右的机票在售（北京青年报，2026-08-05）","8月跨境机票预订热度较7月环比增长超过12%（同程旅行，扬子晚报，2026-08-04）","7月国内热门目的地北京居首，成都、上海、广州、深圳、昆明、重庆、西安、杭州、乌鲁木齐紧随其后，前往北京的旅客量同比增长约12%（航旅纵横，解放日报，2026-08-05）","行业人士预判8月中上旬暑期旅游市场将迎来新一轮客流高峰（央广网，中国网转载，2026-08-06）"],"scripts":[{"angle":"数据向","text":"暑期还没结束，八月的盘子比七月还大。航旅纵横的数据，截至七月底，八月境内航线机票预订量约一千七百五十万张，同比涨约百分之七；出入境航线超五百五十万张，同比涨超百分之六。七月的实际客流是境内超六千二百九十四万人次，同比约涨百分之四；出入境超八百零六万人次，涨约百分之三。今年暑运启动得晚，台风、高温加上部分学校放假晚，前期数据并不好看，增长主要靠七月中下旬拉起来：那半个月境内旅客运输量超两千九百四十二万人次，同比涨超百分之六。跨境这块，八月的机票预订热度比七月环比涨超一成二。行业的判断是八月中上旬还有一轮客流高峰，翻译成人话就是现在出门人只会更多。"},{"angle":"反常识开场","text":"八月机票预订量同比涨了百分之七，你以为票价该水涨船高，实际上还有两折的票在卖。北京青年报八月五号提到，八月北京到乌鲁木齐、上海到乌鲁木齐这些热门航线，仍有低至两折左右的机票在售。原因是运力和需求不是均匀分布的。今年暑运启动晚，台风高温加上部分学校放假迟，前期客流没起来，航司在长距离干线上放了不少运力，这些座位到了八月还要消化。同时八月五号起燃油附加费又降了一档，长途七十、短途四十，落地成本再往下压一格。所以现在的市场是两头拉扯：总量在涨，但结构性的便宜票没消失。找票的方法也简单，盯长距离干线、盯非周末出发、盯晚班，别只看直飞早班。"},{"angle":"实操流程","text":"八月下半场出行，按这四步买票最省。第一步卡时间。八月五号零点之后再出票，燃油附加费按新标准，长途七十短途四十，比之前少三十和十块，五号前出的票不退不补。第二步挑航线。总量涨了百分之七，但长距离干线还有余量，北京和上海飞乌鲁木齐这类线上八月仍有两折左右的票，先在这类航线里找。第三步错峰。今年暑运启动晚，客流靠七月中下旬拉起来，八月中上旬还有一轮高峰，能避开就往月底挪，学生返校前那几天反而松。第四步定落地。跨境机票预订热度比七月环比涨超一成二，热门目的地的房和车会先紧张，票定了当天就把住宿和接送订掉。这四步做完，同样一趟行程能比随手下单省出两三百。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"阿里的千问办公开公测，AI 终于进到工位上了","hook":"桌面端、云端、协同三层智能体第一次做进一个产品，还挂在钉钉上。","why":"全新产品且处于公测白嫖窗口，时效强。三层智能体架构是行业首次，说清楚有科普价值。对做内容和做办公的人都有直接可用场景，转化到实操视频很自然。","heat":"高","tags":["AI工具","智能体","实操"],"facts":["8月3日阿里推出企业级 Agent 产品「千问办公」（QwenWork），开启公测（21世纪经济报道，新浪财经转载，2026-08-03）","该产品整合了 QoderWork、MuleRun、悟空三款产品，是业内首款同时支持桌面端 Agent、云端 Agent 和企业协同 Agent 的产品，已初步打通钉钉 IM（同上）","Qwen3.8 已接入千问办公，用户可在千问办公中对该模型进行体验（钛媒体转光锥智能，2026-08-05）","Qwen3.8 在自动化编程测试中可独立运行约16天，自主完成 Hermes Agent 级别的自进化智能体框架并开源（阿里技术团队，21世纪经济报道，2026-08-03）","在专业办公场景中，模型能够处理数百页财务报告和超百小时长视频，并在芯片设计等复杂工程任务中通过约数千轮交互实现优化（同上）","Qwen3.8-Max 总参数2.4万亿、单次激活95B、1M 上下文长度、支持视觉理解（钛媒体，2026-08-05）","阿里 AI 办公战略定位为面向企业组织的 AI 生产力平台，依托钉钉和阿里云积累的百万级企业客户（钛媒体转光锥智能，2026-08-05）","受 Qwen3.8 发布消息提振，截至8月3日收盘阿里巴巴港股大涨7.01%，报125.2港元（21世纪经济报道，2026-08-03）"],"scripts":[{"angle":"干货直给","text":"阿里八月三号扔了两个东西，一个是模型，一个是产品，后面那个跟普通人关系更大。产品叫千问办公，英文 QwenWork，企业级的智能体产品，当天开启公测。它把阿里之前的三款东西整合进来了：QoderWork、MuleRun 和悟空。官方口径是业内首款同时支持桌面端智能体、云端智能体和企业协同智能体的产品，并且已经初步打通钉钉的即时通讯。新发的 Qwen3.8 也接进去了，你能在千问办公里直接用上那个两点四万亿参数的旗舰模型。为什么值得看：桌面端智能体意味着它能操作你本机的文件和软件，云端负责跑长任务，协同那层挂在钉钉上直接进团队工作流。三层打通之后，AI 不再是你切出去问一句再切回来。公测期是白嫖窗口。"},{"angle":"功能详解","text":"千问办公这个产品，拆开看是三层。第一层桌面端智能体，跑在你自己电脑上，能碰本地文件和软件，适合整理资料、批量改文档这种要接触本机数据的活。第二层云端智能体，跑长任务不占你的机器，阿里给的能力参照是 Qwen3.8 在自动化编程测试里能独立运行大约十六天，自主完成一个 Hermes Agent 级别的自进化智能体框架并开源出来。第三层企业协同智能体，挂在钉钉上，任务和结果直接进团队的即时通讯流，不用再导来导去。底座是 Qwen3.8，总参两点四万亿，激活九百五十亿，支持一百万 token 上下文和视觉理解，所以它能处理数百页的财务报告和上百小时的长视频。阿里的打法很清楚，靠钉钉和阿里云的企业客户做组织级平台。"},{"angle":"创作者视角","text":"作为一个天天要产内容的人，我看千问办公最在意的是桌面端那一层。做视频的痛点从来不是写不出文案，是素材躺在硬盘里找不到、命名一团乱、剪之前要翻半小时。桌面端智能体能碰本地文件，理论上就能干这个活：扫一遍素材目录、按内容重命名、按主题挑片段。第二个值得试的是云端跑长任务。云端智能体不占本机资源，你可以让它一边分析上百小时的长视频，一边你继续剪片子。阿里给的参考是这个底座模型在自动化编程测试里能独立跑约十六天，长周期任务是它主打的方向。第三层挂钉钉，个人创作者用不上，有团队的可以看。现在是公测阶段，成本最低，先把自己的工作流拆成三段，看哪段能扔进去。"}]},{"id":"ai2","title":"看到2.4万亿参数别激动，真干活的只有950亿","hook":"总参数是图书馆里有多少本书，激活参数才是你每次翻开的那几本。","why":"破除参数崇拜的科普向选题，长效不过时。总参数与激活参数的区别是选型时最实用的一条知识，多数人没搞清。配合国产万亿模型集体到位的现状，话题度高。","heat":"中高","tags":["科普","大模型","选型"],"facts":["8月3日阿里发布 Qwen3.8-Max，总参数量2.4万亿，采用稀疏 MoE 架构，激活参数约95B，支持视觉理解和1M tokens 上下文（21世纪经济报道，2026-08-03）","Qwen3.8 采用稀疏 MoE（混合专家）架构与混合注意力机制的联合优化，获得更高的推理效率与更快的推理速度（钛媒体转光锥智能，2026-08-05）","Kimi K3 以2.8万亿参数开源，是目前中国最大的开放权重模型（CCTV4，2026-08-05；21世纪经济报道，2026-08-05）","DeepSeek V4 Pro、文心5.0、MiMo-V2.5-Pro、LongCat-2.0 等国产大模型也已达到万亿参数级别（钛媒体转光锥智能，2026-08-05）","Qwen3.8-Max 将于下周开源权重，并同步开源27B版本，这是 Qwen-Max 级别模型首次面向社会开源（21世纪经济报道，2026-08-03）","Qwen3.8-Max API 国内定价每百万 tokens 输入12元、输出36元，国际价格为 Opus 5 的40%与24%（同上）","在权威榜单 Arena 中 Qwen 系列位列全球第二，仅次于 Claude；编程能力在 CodeArena 榜单中位居前列（不同榜单显示为第三或第四）；PaperBench 评测较上代提升28.2分（同上）","待核实：MiniMax M3 Pro 达2万亿参数级别并传出即将开源，该消息在报道中以「传出」表述，未见官方公告"],"scripts":[{"angle":"反常识开场","text":"看到两点四万亿参数别激动，真正干活的只有九百五十亿。阿里八月三号发的 Qwen3.8-Max，总参数两点四万亿，这是尺寸最大的那个数字，但它用的是稀疏混合专家架构，每次推理只激活其中约九百五十亿参数参与计算。这不是缩水，是这一代大模型的标准做法：把知识摊在一个巨大的参数池里，用的时候只叫醒相关的那几个专家。好处是推理效率和速度都上去了，成本压得住。所以你比较模型的时候，总参数只能说明它记了多少东西，激活参数才决定它每次回答烧多少算力、你要付多少钱。同期开源的 Kimi K3 总参两点八万亿，是目前中国最大的开放权重模型。文心五点零、MiMo、LongCat 这些也都到了万亿级，万亿现在是入场券。"},{"angle":"说人话版","text":"用一个比喻把万亿参数讲清楚。把大模型想成一座图书馆。总参数是这座馆里有多少本书，两点四万亿就是书特别多。激活参数是你每次进去实际翻开的书，Qwen3.8-Max 每次只翻大约九百五十亿这么多。稀疏混合专家架构干的事，就是在你提问的瞬间判断该去哪几个书架，而不是把整馆搬出来。这解释了两件反直觉的事。第一，参数更大的模型未必更慢更贵，因为激活的比例可以做得很低。第二，参数差不多的两个模型，实际表现可能天差地别，因为分书架的策略和训练数据不一样。所以选模型别只看那个万亿数字。国内现在到万亿的一大把，Kimi K3 两点八万亿、Qwen3.8-Max 两点四万亿，文心、MiMo、LongCat 也都在这一档。"},{"angle":"工具评测","text":"手里有活要派给模型，别看总参数看这三个数。第一个是激活参数，它决定单次推理的算力开销，Qwen3.8-Max 总参两点四万亿但只激活约九百五十亿，这个比例越低单位成本越有优势。第二个是上下文长度，Qwen3.8 支持一百万 token，意味着你能一次性丢进数百页财报或者上百小时视频的转写稿，不用切片。切片是很多人做长文档时结果变差的真正原因。第三个是价格，Qwen3.8-Max 国内定价每百万 token 输入十二块、输出三十六块，国际价格是 Opus 5 的四成和两成四。把这三个数摆在一起，你就能算出一个具体任务的成本。另外它下周要开源权重，还会同步开源一个二百七十亿的小版本，本地能跑的人可以留意。"}]},{"id":"ai3","title":"鹅厂员工的小众AI玩法：修电动车、找耳机、读体检报告","hook":"别人还在用AI写文案，有人已经拿它把电动车的油刹上泵修好了。","why":"全是具体到能马上复刻的生活场景，零门槛，评论区互动性极强。跟主流的写文案做总结形成反差，容易出爆款。素材密度高，一条能拆成好几条短视频。","heat":"高","tags":["AI玩法","生活","零门槛"],"facts":["腾讯技术工程整理的员工 AI 玩法分享：先让 AI 整理和重新命名视频并配缩略图，再告知想剪辑的主题，AI 依据主题创建素材分身并制作一个推荐素材的 HTML 页面，从几千个视频里找合适片段（腾讯技术工程，网易转载，2026-08-01）","后台开发员工分享：电动车坏了拍照拍视频丢给 AI 要解决方案，自己动手修复，已换过控制器、修过油刹上泵、换过右手刹（同上）","质效运营员工分享：体检后收到电子报告，用 AI 解读，把医学术语和箭头变成听得懂用得上的健康行动指南（同上）","后台开发员工分享两类找东西场景：无线耳机掉草地里肉眼看不到，拍照或视频让 AI 帮找；小时候看过记不起名字的动画片，向 AI 描述细节让它帮找（同上）","系统测试员工分享：让 AI 自己搜索旅游笔记，整理博主真实笔记、筛掉广告与重复打卡地，结合出行天数、同行人群、预算，自动理顺动线生成完整旅游计划（同上）","综合项目管理员工分享：上传自拍照，让 AI 做形象管理诊断，给出适合的颜色、发型、妆容和风格搭配（同上）","待核实：以上均为单一来源的员工个人实践分享（腾讯技术工程公众号），非平台官方功能承诺，实际效果因模型与提示词而异"],"scripts":[{"angle":"干货直给","text":"腾讯内部整理了一批员工的小众 AI 用法，挑几个真能省事的说。第一个，电动车坏了，拍照片拍视频丢给 AI，让它给解决方案，自己动手换控制器、修油刹上泵、换手刹，都修成了。第二个，体检报告出来看不懂，把电子报告交给 AI，让它把医学术语和箭头翻译成能执行的行动建议，提前看懂身体的预警。第三个，找东西。无线耳机掉草地里肉眼找不到，拍张照让 AI 帮你定位；小时候看过的动画片记不起名字，把细节描述给它让它找。第四个，做行程。让 AI 自己去搜旅游笔记，筛掉广告和重复打卡点，结合你的天数、同行人群、预算，理出顺路动线，省掉几小时刷攻略。这些都不是高级功能，就是把日常里懒得处理的小麻烦扔给它。"},{"angle":"故事切入","text":"有个后台开发的同事，电动车坏了没送修。他拍了照片又拍了段视频，丢给 AI，让它给判断和解决方案，然后自己动手。到现在换过控制器、修过油刹上泵、换过右手刹。这事有意思的地方不在于省了几百块修车费，而在于他把 AI 当成了随身的老师傅。同一批分享里还有几个类似的：做视频的先让 AI 把几千条素材整理重命名、配上缩略图，再告诉它想剪什么主题，让它生成一个推荐素材的网页，剪之前不用再翻硬盘。做项目管理的上传自拍，让 AI 做形象诊断，给出适合的颜色、发型和搭配，换了发色之后周围人都来问染发剂链接。共同点是这些人没在等一个完美的 AI 产品，而是把手边的麻烦拆成一个能描述清楚的问题，然后扔进去。"},{"angle":"实操流程","text":"照着这个流程，把 AI 变成你的素材管理员。第一步整理。把素材目录丢给 AI，让它按内容给视频批量重命名，同时生成缩略图，这一步解决的是硬盘里全是乱码文件名的问题。第二步建索引。告诉它你要剪的主题，让它在素材库里挑出相关片段，并且生成一个推荐素材的网页，缩略图加时间点排好，你打开网页就能选。第三步复用。下次换主题，不用重新整理，直接改主题词再生成一版。这套流程是腾讯一位做财务的员工用来剪自家宝宝视频的，几千条素材里找片段，从翻半小时变成点几下。同样的思路还能用在别处：体检报告丢给它翻译成行动建议，旅游笔记丢给它筛掉广告排成动线，本质都是把非结构化的东西整理成你能直接用的形式。"}]},{"id":"ai4","title":"八周五款模型，硅谷公司在悄悄换底座","hook":"性能够用之后，选模型看的就不是谁最强，是谁最便宜。","why":"产业级判断，有斯坦福报告和央视两条硬来源支撑。成本结构讲清楚能建立专业形象，对做AI内容的人是必备背景知识。死亡地带这个说法本身有传播力。","heat":"中高","tags":["行业趋势","成本","国产模型"],"facts":["截至8月5日，短短8周内阿里巴巴 Qwen3.8-Max、月之暗面 Kimi K3、DeepSeek-V4-Flash、智谱 Z.ai GLM-5.2、字节跳动 Seedance 2.5 五款重磅模型接连亮相，被市场称为「八周五模型」（21世纪经济报道，2026-08-05）","斯坦福《2026人工智能指数报告》指出，中美顶尖模型的综合性能差距已大幅收窄，中国开放权重模型在全球开发者中的接受度持续走高（21世纪经济报道转述，2026-08-05）","大量美国企业、硅谷初创公司出于成本考量，正把业务流量切到中国大模型上（21世纪经济报道，2026-08-05）","美国闭源旗舰模型的训练往往烧掉数亿美元，单款模型生命周期只有12-24个月，企业只能靠高昂的 API 定价回收沉没成本（同上）","智谱 GLM-5.2 在 SWE-bench Pro 编程基准测试中实现突破，代码能力跻身全球第一梯队（同上）","DeepSeek 近期再度下调词元调用价格，输入、输出单价最高降幅达50%；美国研究机构人工智能分析网评估 DeepSeek-V4-Flash 运行成本全球最低（CCTV4，2026-08-05）","美国媒体称美国同行面临「死亡地带」，并指出 Kimi K3 带来的冲击仍在持续（CCTV4 转述美媒，2026-08-05）","Qwen3.8-Max 国际价格仅为 Opus 5 的40%与24%（21世纪经济报道，2026-08-03）","国内厂商普遍走开放权重路线，依托 MoE 混合专家架构和推理侧深度优化，在控制总成本前提下快速迭代出覆盖高中低端场景的完整矩阵（21世纪经济报道，2026-08-05）"],"scripts":[{"angle":"趋势判断","text":"八周，五款模型，中国把大模型的迭代节奏改了。截至八月五号，阿里 Qwen3.8-Max、月之暗面 Kimi K3、DeepSeek-V4-Flash、智谱 GLM-5.2、字节 Seedance 2.5 接连亮相，市场管这叫八周五模型。放在过去，一款旗舰模型从训练到发布动辄数月甚至跨年，OpenAI 和 Anthropic 的旗舰更新普遍以年计。更实质的变化在需求侧。二十一世纪经济报道的说法是，大量美国企业和硅谷初创公司出于成本考量，正在把业务流量切到中国大模型上。斯坦福的二零二六人工智能指数报告也指出，中美顶尖模型的综合性能差距已经大幅收窄。美媒给美国同行的处境起了个名字，叫死亡地带。逻辑很朴素：性能够用之后，决定选型的是成本和部署灵活度。"},{"angle":"成本账","text":"美国公司为什么开始换中国模型，算账就明白了。美国的闭源旗舰模型，训练一次动辄烧掉数亿美元，单款模型的生命周期只有十二到二十四个月，这笔沉没成本只能靠高定价的接口费用往回收。所以你用它，本质是在替别人的训练账单买单。中国这边走的是另一条路：开放权重加混合专家架构，加上推理侧的深度优化，用可控的总成本快速迭代出高中低端的完整矩阵。价格差有多大？Qwen3.8-Max 的国际定价是 Opus 5 的四成和两成四。DeepSeek 近期又下调了调用价格，输入输出单价最高降五成，美国的人工智能分析网评估它的运行成本全球最低。对一家每月烧几万美元接口费的公司来说，切换供应商省下来的是实打实的现金。"},{"angle":"反常识开场","text":"性能不再是选模型的第一标准了，这事刚被市场证实。过去两年默认的剧本是美国闭源模型稳坐技术制高点，别人跟在后面跑。今年的现实是，斯坦福二零二六人工智能指数报告指出中美顶尖模型的综合性能差距已大幅收窄，智谱的 GLM-5.2 在 SWE-bench Pro 编程基准上实现突破，代码能力进了全球第一梯队。性能一旦够用，企业选型的决定权就交给了成本和部署灵活度。结果就是大量美国企业和硅谷初创公司把业务流量切到中国模型上。这背后不是靠堆算力堆出来的，工程优化、架构创新、开源路线三件事叠加才是推手。对国内做内容和做产品的人，含义很直接：你现在能用到的模型，价格是全球最低那一档，能力是全球前沿那一档。"}]},{"id":"ai5","title":"用Coze搭一个爆款视频拆解机，三个插件就够","hook":"输一条视频链接，它把文案结构、情绪节奏、转化话术拆给你。","why":"对做短视频带货的人是刚需工具，可复刻性强，一条视频能直接带出实操教程系列。不用写代码这个门槛设定，受众面极宽。工具对比部分给了后续选择路径。","heat":"中高","tags":["AI玩法","智能体","创作者"],"facts":["有做抖音带货的创作者用 Coze 搭建「爆款视频拆解」智能体：输入任意一条抖音视频链接，智能体自动抓取视频内容，分析文案结构、情绪节奏、转化话术，生成一份可复用的脚本模板（今日头条创作者实践分享，2026）","自动化情报系统的工作流示例：信息采集插件 + AI 总结插件（设置总结字数和关注的关键词）+ 微信发送插件（绑定企业微信机器人），三个插件串起来设置每天早上八点触发（同上）","Coze 知识库用法：创建 Bot 后进入知识板块上传 PDF 或 Word 文档，系统自动切片向量化；在「人设与回复逻辑」里写明角色和回复风格；在「发布」板块选择接入渠道，支持微信、飞书、抖音、网页等（同上）","Dify 为开源 AI 应用开发平台，相比 Coze 更灵活，支持私有化部署，支持 Workflow 条件分支编排，社区版免费、企业版收费（同上）","已产生实际收益的三个方向：自媒体自动化（选题、写作、配图、发布全流程）、电商运营自动化（监控竞品、调整价格、回复客户、生成营销文案）、企业服务自动化（合同审查、财务对账、招聘筛选）（同上）","Anthropic 工程师公开的协作方法包括：分步互动提取需求（让 AI 先反问几个问题）、用 HTML 替代 Markdown 输出更省 token、在任务里加入验证步骤让 AI 自己质检（技术博客整理，2026）","待核实：Coze 个人用户可创建 Bot 的数量与每日调用额度、Dify 各版本收费政策，均以各平台官网最新说明为准；SaaS-Bench 评测中顶级 AI Agent 完全通过率3.8%这一数据为单一来源转述"],"scripts":[{"angle":"实操流程","text":"用 Coze 搭一个每天早八点自动给你推情报的机器人，三个插件就够。第一个是信息采集插件，设定你要盯的关键词或者信息源。第二个是 AI 总结插件，设置总结字数和你关注的关键词，让它把抓回来的东西压成你能三十秒看完的摘要。第三个是微信发送插件，绑定企业微信机器人。三个插件用工作流串起来，设置每天早上八点触发，一套自动化情报系统就成了。整个过程不用写代码，界面上拖。想做客服机器人就多用一个知识库：把产品手册、常见问题、历史对话上传，系统自动切片向量化，然后在人设与回复逻辑里写清角色和语气，最后在发布板块选渠道，微信、飞书、抖音、网页都能接。要私有化部署的换 Dify，开源，社区版免费。"},{"angle":"创作者视角","text":"有个做抖音带货的用 Coze 搭了个爆款视频拆解智能体，思路值得抄。输入任意一条抖音视频链接，它自动抓取视频内容，分析文案结构、情绪节奏、转化话术，输出一份可复用的脚本模板。这东西解决的是选题和脚本的效率问题：你刷到一条爆的，不用自己一句句扒，让它给你拆成结构，你换产品往里填。往下延伸有三个方向已经在跑通。一是自媒体自动化，选题、写作、配图、发布串成流程。二是电商运营，监控竞品、调价、回客户、生成营销文案。三是企业服务，合同审查、财务对账、招聘筛选这些重复活。工具选择上，Coze 可视化、上手快、个人用基本够；Dify 开源、支持私有化部署和条件分支编排。先用 Coze 跑通一个再说。"},{"angle":"避坑清单","text":"搭智能体之前，先知道这几个坑在哪。第一，别指望一句话就让它干成复杂任务。分步互动比一次性甩长需求靠谱，你可以先说请先问我三个问题再动手，它问出来的往往是你没想到的。第二，加验证步骤。给任务的时候直接写完成后自己对照原文检查一遍并修正，让质检变成流程的一部分，准确率会明显好转。第三，输出格式指定死。要表格就说用表格输出，包含哪几列，不指定它就自由发挥。第四，知识库不是上传完就万事大吉，要在人设与回复逻辑里写明优先从知识库找答案、找不到时怎么办，否则它会自己编。第五，免费额度和功能各平台随时在变，Coze 和 Dify 的具体政策以官网最新说明为准，别按别人半年前的教程照抄。"}]}]}]},"2026-08-04":{"date":"2026-08-04","updatedAt":"2026-08-04 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"国庆火车票8月3号就开预约了，别再等9月抢","hook":"国庆的火车票，八月三号已经开始放预约了，你还在等九月零点拼手速。","why":"12306 预约购票窗口是开车前第60到17天，8月3日已可预约10月1日车票，这条信息今天发最值钱，进入9月就没人看了。规则里的封号条款多数人不知道，收藏率会高。","heat":"高","tags":["强时效","出行必备","避坑"],"facts":["据「中国铁路」消息，京沪高铁、京沪铁路200多趟列车国庆假期车票已开启预约，8月3日可预约10月1日车票（深圳龙岗发布转中国铁路，2026-08-03）","12306「预约购票」服务专区在列车开车前第60天至第17天填报预约需求，每日8时起可提交开车前第60天的预约订单（中国铁路，2026-08-03）","系统于开车前第20天至第16天兑现预约订单，兑现成功后需在当日23时前完成支付，逾期自动取消（中国铁路，2026-08-03）","30天内连续三次兑现成功后逾期未支付（含主动取消兑现成功订单），此后90天内该12306账户不可使用预约购票功能（中国铁路，2026-08-03）","每个12306账户可同时提交3个待兑现预约订单，每个订单可选连续两日、最多3个「精确预约」及2个「模糊预约」，一笔订单最多添加19名旅客（中国铁路，2026-08-03）","2026年8月1日至30日，12306学生预约购票服务新增新生预约功能，2026级新生完成学生资质核验后，可在开车前第20至17天预约乘车日期为8月17日至9月14日的一次单程车票，享学生优惠票价（中国铁路，2026-08-03）","2026年中秋节为9月25日至27日，国庆节为10月1日至7日，中间9月28日至30日为三个工作日（国务院办公厅节假日安排，新浪旅游、深圳龙岗发布转载，2026-08-03/04）"],"scripts":[{"angle":"干货直给","text":"国庆火车票的预约通道，八月三号已经开了，不是开售，是预约。京沪高铁和京沪铁路两百多趟列车先放的，三号那天就能约十月一号的座位。规则你记三条。第一，预约窗口是开车前第六十天到第十七天，每天早上八点放开第六十天那一档，越早填越靠前。第二，系统在开车前第二十天到第十六天集中兑现，兑现成功当天晚上十一点前必须付钱，过点自动取消。第三，三十天里连续三次兑现成功没付款，包括你主动取消，接下来九十天这个账号的预约功能直接停用。一个账号同时最多挂三个待兑现订单，每单能选连续两天、三个精确车次加两个模糊选项，一笔单最多十九个人，全家出行一单就够。精确预约是车次时间席别全指定，模糊预约只给时间段和运行时长，命中率明显高一截。现在就去十二三零六填，比九月盯着零点跟几百万人拼手速强太多。"},{"angle":"实操流程","text":"把国庆车票的预约单填明白，三步走。第一步打开十二三零六，进预约购票专区，确认目标日期落在开车前六十到十七天这个区间。十月一号出发的，八月三号就能填。第二步选方式。精确预约要你把车次、到发时间、席别、票价全指定死，适合非某趟车不可的人。模糊预约只让你选出发时间段、运行时长和席别，系统在范围内匹配，命中概率高不少。我的做法是一个订单里放三个精确加两个模糊，精确的按优先次序从最想坐的往下排。第三步盯兑现。开车前第二十天到第十六天系统集中处理，成功之后当天二十三点前必须付款。这里有个坑，三十天内连续三次兑现完不付钱，九十天内这个账号别想再用预约。所以别抱着占坑的心态乱填，填了就要准备掏钱。另外八月一号到三十号，二零二六级新生多了一条专属通道，能约八月十七号到九月十四号的单程票。"},{"angle":"反常识开场","text":"今年抢国庆票最不划算的做法，就是九月零点守着手机点刷新。车票八月三号就开了预约通道，京沪高铁和京沪铁路两百多趟列车打头阵，三号那天你就能约十月一号的座位。很多人的认知还停在开售即秒光，其实铁路早就把分配前置了。预约是在开车前第六十天到第十七天填需求，系统第二十天到第十六天统一兑现，兑现之后当天晚上十一点前付款。换句话说，票在正式开售之前已经分掉一批，你零点抢的是剩下的那部分。还有个细节多数人不知道，模糊预约的命中率比精确预约高。你要是能接受早上八点到十点之间的任意车次，就别死盯某一趟，把弹性交出去换成功率。最后提醒一句，兑现成功不付钱是会被记账的，三十天内三次，九十天封掉预约功能。要么别填，要么填了就掏钱。"}]},{"id":"tv2","title":"泰国砍掉60天免签，中国护照是那个例外","hook":"泰国把六十天免签取消了，九十三个国家全受影响，中国护照不在里面。","why":"政策刚落地，网上大量2025年的旧攻略还在说泰国免签六十天，照着规划行程会踩超期。辟谣加解读双重价值，暑期尾声到国庆出境正好用得上。","heat":"高","tags":["出境游","政策","辟谣"],"facts":["泰国总理府副发言人普洛伊塔莱2026年7月14日透露，当日内阁会议审议批准免签政策调整方案，核心是取消此前93个国家和地区享有的60天免签入境待遇（中新社/光明网，2026-07-14）","新措施规定，包括中国在内的59个国家和地区将获得旅游免签待遇，入境后可停留不超过30天；5份内政部公告草案在《政宪公报》网站公布满15天后正式生效（中新社，2026-07-14）","泰国外交部领事司司长芒功在发布会回答凤凰卫视提问时表示，本次调整不影响2024年3月中泰签署的免签协议，「中泰之间的30天互免签证协议」相关安排维持不变（凤凰卫视，2026-07-19）","同批调整还包括：30天旅游免签适用名单从57个缩减至54个，新增针对3个国家及地区的15天旅游免签，落地签适用名单从31个缩减至4个（凤凰卫视，2026-07-19）","泰国旅游与体育部数据显示，赴泰外国游客中停留1至30天的占比超过90%，停留超过30天的仅约10%（凤凰卫视，2026-07-19）","新政策生效前已按原政策入境并获得相应停留权限的外国游客，仍可按原规定在剩余有效期内继续停留（中新社，2026-07-14）","泰国旅游与体育部长素拉萨克此前表示内阁已原则上同意取消60天免签，须待外交部完成程序并在政府公报发布公告后才确定生效日期（泰国中文社，2026-05-21）","待核实：英文签证资讯站 ThaiEmbassy.com 与 ThaiVisaFlow 称该调整自2026年6月1日生效、内阁批准日为5月19日，与中新社所述7月14日内阁批准、公报满15天生效的时间线存在冲突，此处以中新社与凤凰卫视报道的官方口径为准","待核实：ThaiEmbassy.com 称泰国移民局 THIM App 将于2026年8月起对所有入境外籍人员强制使用，目前与 TDAC 网页版并行，未见泰方官方中文公告或中国驻泰使领馆提示佐证"],"scripts":[{"angle":"干货直给","text":"泰国把六十天免签取消了，你得先看清这事跟你有没有关系。七月十四号泰国内阁批准调整方案，原本九十三个国家和地区享受的六十天免签整体取消，改成一国一权益，按国别重新给。调整之后包括中国在内的五十九个国家和地区拿到旅游免签，停留不超过三十天。落地签名单从三十一个砍到四个，三十天免签名单从五十七个减到五十四个，另外新增三个国家和地区只给十五天。关键那句话在这儿，泰国外交部领事司司长在发布会上明确回应，这次调整不影响二零二四年三月中泰签的免签协议，中泰三十天互免维持不变。中国人去泰国，之前三十天，现在还是三十天，一天没少。泰国给的公开理由是六十天太长，容易被拿去做非旅游用途。新规在政宪公报公布满十五天生效，已经入境的按老规矩把剩余天数用完。"},{"angle":"横向对比","text":"同样飞泰国，欧美护照和中国护照现在走的是两条完全不同的路，很多人搞混了。欧美那批国家原来吃的是六十天免签，覆盖九十三个国家和地区，本质是泰国单方面给的临时优惠，七月十四号内阁一纸批复整体取消。他们现在要么按新名单拿三十天，要么只有十五天，能用落地签的国家从三十一个砍到剩四个。中国护照走的是另一条，二零二四年三月中泰签的双边互免协议，你去泰国免签三十天，泰国人来中国也是三十天。这是协议，不是优惠，泰国外交部专门回应过，这次调整不碰它。所以你的行程不用改，天数没变。真正要小心的是网上那堆去年写的攻略，还在说泰国免签六十天，照着规划一个四十天的行程，落地就是超期风险。泰国官方数据，赴泰外国游客里停留三十天以内的超过九成，三十天对绝大多数人够用。"},{"angle":"反常识开场","text":"看到泰国取消六十天免签就急着退机票的，先冷静，这条新闻跟中国护照基本没关系。被砍掉的是泰国单方面给九十三个国家和地区的临时优惠，七月十四号内阁批准取消。中国人去泰国靠的不是这个，靠的是二零二四年三月中泰签署的双边互免签证协议，三十天。泰国外交部领事司司长在发布会上被专门问到中国的安排，回答很直接，这次调整不影响该协议。你原来待三十天，现在还是三十天。真正变了的有三样。落地签国家从三十一个缩到四个，三十天免签名单从五十七个缩到五十四个，另外给三个国家和地区新开了十五天这一档。泰国的公开理由是六十天期限太长，有人拿它做非旅游的事。新规在政宪公报公布满十五天正式生效，生效前已经入境的按老规矩把剩余期限用完，不用中途出境。"}]},{"id":"tv3","title":"欧洲团里带梵蒂冈，这个团本身就违规，罚了十万","hook":"旅行社带你去梵蒂冈，听着高级，其实这个行程是违法的。","why":"「中国公民出境旅游目的地名单」这个概念绝大多数人不知道，属于强信息差。官方处罚案例刚公布，有具体金额和法条，可信度高，评论区一定会吵。","heat":"中高","tags":["信息差","出境游","避坑"],"facts":["青岛嘉华文华国际旅行社组织欧洲旅游，行程中包含梵蒂冈，该目的地属于国务院旅游行政主管部门公布的中国公民出境旅游目的地之外的国家和地区，违反《旅行社条例》第二十五条，2025年12月30日被青岛市文化和旅游局罚款10万元（青岛市文旅局2026年第三批旅游市场处罚典型案例，2026-08-04）","青岛同乐国际旅行社招徕2名游客参加「山水连两国精华6日游」，签订境内旅游合同但行程包含越南谅山，属未经许可经营出境旅游业务，违反《旅游法》第二十九条，2026年7月27日被没收违法所得4360元、责令停业整顿7日、罚款1万元，法定代表人另罚2000元（青岛市文旅局，2026-08-04）","青岛海中旅国际旅行社质量保证金账户为零，受行政处罚后未按规定补足且拒不改正，2026年5月18日被依法吊销旅行社业务经营许可证（青岛市文旅局，2026-08-04）","凯途国际旅行社（山东）招徕组织「北京高飞六日游」，未征得旅游者同意擅自将部分旅游业务委托给其他旅行社接待，违反《旅行社条例》第三十六条，2026年7月1日被罚款2万元（青岛市文旅局，2026-08-04）","湖北同程悦游国际旅行社组织游客赴巴厘岛出境游，未按规定安排全程陪同领队，违反《旅游法》第三十六条，2026年7月8日被武汉市文旅局罚款5000元，直接负责的主管人员罚款2000元（湖北文旅2026年全省第二批旅游市场典型案例，2026-08-02）"],"scripts":[{"angle":"反常识开场","text":"如果你报的欧洲团行程里写着梵蒂冈，这个团是违规的，不是行程有瑕疵，是旅行社在违法经营。青岛市文旅局八月四号公布的处罚案例里，青岛嘉华文华国际旅行社就是因为组织的欧洲游行程包含梵蒂冈，被罚了十万块。依据是旅行社条例第二十五条。原因在于一个多数人根本不知道的东西，中国有一份「中国公民出境旅游目的地名单」，由国务院旅游行政主管部门公布，不在名单里的国家和地区，旅行社不能组团带你去。梵蒂冈就不在。这不是说你个人不能去，你自己办签证自由行是另一回事，被禁的是旅行社组团这种经营行为。为什么重要，因为一旦出事，这段行程不受旅游合同保护，保险赔付、纠纷维权全都悬。报欧洲团之前，把行程单上每个国家过一遍，看到没听说过的小国，多问一句。"},{"angle":"干货直给","text":"青岛市文旅局八月四号放了一批处罚案例，四条跟报团的人直接相关，我给你翻译成人话。第一条，旅行社组织欧洲游，行程里塞了梵蒂冈，这地方不在中国公民出境旅游目的地名单上，旅行社不能组团去，罚十万。第二条，有家旅行社卖「山水连两国精华六日游」，跟你签的是境内旅游合同，行程里却有越南谅山，这叫未经许可经营出境旅游业务，没收违法所得四千三百六，停业七天，再罚一万，法人另罚两千。第三条，某旅行社质量保证金账户是零，被责令补足还不补，直接吊销经营许可证。第四条，卖你北京六日游，没经你同意就把接待转包给别家，罚两万。看懂这四条，你就知道该怎么验团了。合同上的目的地必须和行程单一致，出境就得签出境合同，接待方要写清楚。"},{"angle":"避坑清单","text":"报团之前花三分钟做四件事，能挡掉九成的糟心事。第一，把行程单上的每一个国家和地区拿出来核，看是不是都在中国公民出境旅游目的地名单里。青岛有旅行社因为欧洲团带梵蒂冈，被罚十万。第二，看合同类型。行程里只要出了国境，哪怕只是越南谅山这种边境一日游，也必须是出境旅游合同，用境内合同套的，是未经许可经营出境业务，青岛就有一家因此被停业七天。第三，问清楚谁接待你。旅行社未经同意把业务转包给同行，违反旅行社条例第三十六条，青岛有家为此罚了两万。你有权知道落地后是谁带团。第四，查质量保证金。这笔钱是你出事之后的赔付来源，账户为零还拒不补足的，青岛已经吊销了一家的经营许可证。这四条查完再交钱，别嫌麻烦。"}]},{"id":"tv4","title":"二季度下架1.8万个低价游商品，你刷到的可能就在里面","hook":"抖音一个季度下架了一万八千个低价游商品，处置了三万八千条视频。","why":"受众自己就在刷短视频，这条讲的正是他们眼前那条广告。有平台治理数据、有真实纠纷案例、有官方参考价工具，能直接改变下单行为。","heat":"高","tags":["避坑","低价游","省钱"],"facts":["2026年二季度，抖音平台针对低价游、无资质招徕和强制购物等违规行为，下架1.8万个不合理低价游商品，处置3.8万条宣传低价游视频（《中国城市报》2026年8月3日第10版，人民日报社主管）","北京市文化和旅游局建议，出行前可参考北京市旅游行业协会发布的「北京常规旅游线路团队地接参考价」（中国城市报，2026-08-03）","内蒙古包头持续开展草原旅游市场专项整治行动，对不合理低价游、虚假宣传等违法违规行为坚持「零容忍、严查处」（中国城市报，2026-08-03）","受访业内人士杜竞表示，远低于市场正常运营成本的旅游产品，本质多为以购物返佣、自费项目回扣为盈利核心的「购物团」，团费越低行程中暗藏的套路风险越高（中国城市报，2026-08-03）","真实纠纷案例：广东张女士在短视频平台看到旅游主播推介的北京行程，以「低价高品质」印象下单，落地后发现旅行社安排的接机人是网约车司机，宾馆与线上宣传图「判若两店」（中国城市报，2026-08-03）","中国旅游景区协会教育专委会主任郭军指出，文旅主播群体缺乏统一的职业能力规范，服务失范问题频发（中国城市报，2026-08-03）","退款纠纷中经营方应以机票、酒店订单等凭证主动出示费用明细，举证不能将面临全额退费；直播带货需留存主播话术与供应商核验记录（中国城市报，2026-08-03）","关联案例：导游张某某在三峡大坝景区服务过程中，未经旅行社安排擅自向游客推销讲解器、「三峡工程体验馆」项目从中获利，2026年6月16日被宜昌市文旅局没收违法所得770元、罚款7500元、暂扣导游证15日（湖北文旅，2026-08-02）"],"scripts":[{"angle":"干货直给","text":"光二季度一个季度，抖音就下架了一万八千个不合理低价游商品，处置了三万八千条宣传低价游的视频。这个数字来自人民日报社主管的中国城市报八月三号的报道。你刷到的那条九百九十九玩北京五天四晚，很可能就在被清理的那一批里。判断方法其实很简单，业内人士说得很直白，远低于正常运营成本的产品，靠的不是薄利多销，是购物返佣和自费项目回扣，团费越低，行程里埋的套路越深。怎么验，北京市文旅局给了个现成工具，北京市旅游行业协会发布过「北京常规旅游线路团队地接参考价」，你把主播报的价格跟参考价一比，低得离谱的直接划走。另外记住一条，退款扯皮的时候，旅行社有义务拿机票酒店订单出示费用明细，拿不出来的要全额退费。这条你得知道，吵架时用得上。"},{"angle":"故事切入","text":"广东有位张女士，在短视频平台刷到旅游主播推介的北京行程，主播反复强调低价高品质，她信了。落地首都机场出来，旅行社安排的接机人是个网约车司机。到了宾馆，老旧的楼宇跟线上宣传图判若两店。这不是段子，是中国城市报八月三号刊登的真实投诉。同一篇报道里还有个数字，二季度抖音下架了一万八千个不合理低价游商品，处置三万八千条相关视频。行业协会的人说得更狠，文旅主播这个群体到现在没有统一的职业能力规范，服务失范频发。我的判断是，直播间卖的旅游产品，主播只负责把你引到下单页面，落地是谁接、住什么标准、行程有没有变，他不承担责任。你要真想下单，别看主播说什么，看合同里写了什么。合同上没写死的东西，落地一样都不会有。"},{"angle":"反常识开场","text":"低价游最坑的地方不是便宜没好货，是你根本没在买旅游产品，你买的是一张进购物店的门票。二季度抖音下架一万八千个低价游商品，处置三万八千条视频，这个规模说明问题有多普遍。业内人士的解释很直接，远低于运营成本的团，盈利核心是购物返佣和自费项目回扣，团费越低，行程里的套路密度越高。所以你付的那九百九不是旅费，是买路钱，剩下的窟窿要靠你在玉器店翡翠店里填回来。有个案例能佐证，三峡大坝景区一名导游擅自向游客推销讲解器和体验馆项目，被没收违法所得七百七，罚了七千五，导游证暂扣十五天。七百七十块的违法所得，换来一万多的代价，说明监管在动真格。你要做的很简单，报团前拿行业协会公布的地接参考价对一遍，差得太多的，别下单。"}]},{"id":"tv5","title":"爸妈参加的免费旅游，钩子在第二天的宣讲会上","hook":"免费旅游只是入口，真正的目的是让你把旅游费改成理财。","why":"长效选题，老年旅游诈骗常年存在，不依赖时效，可随时补位。目标受众三十岁上下正好是替父母把关的年纪，情绪共鸣和实用性都强，转发率高。","heat":"中高","tags":["长效","家庭","防骗"],"facts":["防骗案例：2023年3月，无锡70岁的刘老伯经朋友介绍参加某旅游服务公司第三分中心组织的免费周边游，举办方在大巴车上开展小型推介会，并在旅游过程中订好酒店专门举行宣讲会（防骗警示窗，2026-08-04）","套餐结构：以580元至1万元不等的价格，将5至12条旅游路线打包出售；例如某境内游套餐含南昌、北京、厦门、西安、神农架5条线路，单卖每条2150元、总价10750元，打包价降至1万元（防骗警示窗，2026-08-04）","返利设计：客户购买后若不旅游，可将费用转为投资理财资金，公司按每条线路2150积分退还，积分1比1兑换现金后分5期返还，每期2150元，五个月收益7.5%；随投资额增加宣称年化可达20%，另有1%至2%红包（防骗警示窗，2026-08-04）","刘老伯在现场宣传视频和同行老人「收益按时到账」的证言影响下，掏出10万元积蓄购买了十个月分期的旅游路线套餐（防骗警示窗，2026-08-04）","待核实：该案「卷走1.5亿养老本」的涉案总金额仅见于单一防骗警示来源，未检索到公检法机关公开通报或权威媒体独立报道佐证，故不在口播稿正文中引用具体金额","监管背景参照：湖北省2026年公布第二批旅游市场典型案例，涉及虚假宣传、擅自安排另行付费项目等（湖北文旅，2026-08-02）；青岛市公布2026年第三批处罚典型案例，涉及虚假宣传、以不存在的景点招徕等（青岛市文旅局，2026-08-04）"],"scripts":[{"angle":"干货直给","text":"如果你爸妈最近被拉去参加了一个免费的周边游，你要问清楚一件事，路上有没有开过宣讲会。这套局的结构是固定的。第一步免费玩，山水吃住全包，先把信任建起来。第二步在大巴车上做小型推介，再在订好的酒店里开正式宣讲会，这才是主场。第三步推套餐，五百八到一万不等，把五条到十二条线路打包卖，比如五条线单买要一万零七百五，打包一万，看起来省了七百五。第四步是真正的钩子，告诉你买了不去玩也行，钱可以转成理财，按每条线两千一百五的积分退，积分一比一换现金分五期返还，五个月收益七点五个点，买得多年化说能到二十。到这一步，旅游已经是幌子，本质是集资。无锡有位七十岁的老人就是这么投进去十万积蓄。判断标准只有一条，凡是旅游产品能转成理财收益的，一律是骗局。"},{"angle":"故事切入","text":"无锡有位刘老伯，七十岁，朋友介绍他参加一个旅游公司组织的免费周边游。一路游山玩水，玩得很尽兴。途中主办方在大巴车上开了个小推介会，晚上又在订好的酒店里正式宣讲，说公司总部在全国多地设分部，旗下有实体产业。然后推套餐，五条国内线路打包一万块，单买要一万零七百五。真正打动他的是后面那句，买了不去玩也行，钱能转成理财，五个月返还，收益七点五个点。现场视频做得很像样，同行几位老人还当场作证说收益按时到账。刘老伯掏了十万积蓄。我说说我的判断。免费游、大巴推介、酒店宣讲，这三样凑齐就是标准剧本，同行老人的证言往往是安排好的。旅游套餐能变理财，这句话本身就违法。你要做的是提前打预防针，别等到钱进去了才发现。"},{"angle":"反常识开场","text":"老人被骗，很多时候不是贪，是被设计过的信任流程一步步带进去的。免费旅游那笔钱，骗子是真花的，山水吃住全包，一分不收，因为那是获客成本。真正的动作在第二天，大巴车上先做小型推介，晚上在酒店开正式宣讲会，讲总部规模，讲实体产业，讲旗下资源。等你觉得这公司靠谱了，才推产品，五条旅游线打包一万块，比单买省七百五。这一步还是正常商品。转折在下一句，买了不去玩也可以，钱转成理财，按积分退，分五期返，五个月七点五个点，买得越多年化越高。到这里性质就变了，旅游产品成了集资的壳。无锡一位七十岁老人投了十万。你回家跟爸妈说一句就够，任何旅游、保健品、日用品，只要卖家告诉你不消费也能拿收益，直接走人。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"阿里放出2.4万亿参数的Qwen3.8-Max，下周开源权重","hook":"两万四千亿参数，一百万上下文，下周把权重开源。","why":"8月3日刚发布，今天是热度顶点。参数规模、上下文长度、开源承诺三个点都够硬，还有连续16天自主写代码这种能出圈的细节。","heat":"高","tags":["强时效","大模型","开源"],"facts":["2026年8月3日，阿里巴巴正式发布新一代旗舰大模型 Qwen3.8-Max，总参数量2.4万亿，支持视觉理解，上下文长度达1M Tokens，在编程、真实办公、长程任务与多模态智能体方面全面提升（驱动中国早报/搜狐，2026-08-04；界面新闻，2026-08-04）","Qwen3.8-Max 模型权重将于下周开源，同时开源 Qwen3.8-27B（驱动中国早报/搜狐，2026-08-04）","同日阿里旗下企业级 Agent 产品「千问办公」（QwenWork）开启公测，由 QoderWork、MuleRun、悟空三款产品整合而来，支持桌面端、云端与企业协同 Agent，已初步打通钉钉（驱动中国早报/搜狐，2026-08-04）","CNBC 报道称该模型多项指标对标甚至优于 Anthropic 的 Fable 5，视觉赛道排名全球第二，文本赛道位列全球第五；消息发布后阿里巴巴美股盘前上涨4.5%，港股涨幅达7%（赛迪网引 CNBC，2026-08-03/04）","内部测试中 Qwen3.8-Max 曾连续16天独立完成一款 AI 编码工具的开发、测试、排错与迭代优化（赛迪网引 CNBC，2026-08-03/04）","界面新闻表述为「整体性能稳居全球大模型第一梯队（仅次于Claude系列）」，与 CNBC 所述「视觉全球第二、文本全球第五」口径略有差异，两者均指向第一梯队但具体排名说法不完全一致（界面新闻，2026-08-04）","同期参照：月之暗面本月推出2.8万亿参数的 Kimi K3（赛迪网引 CNBC，2026-08-03）"],"scripts":[{"angle":"干货直给","text":"八月三号阿里发了 Qwen3.8-Max，总参数两万四千亿，上下文一百万 token，支持视觉理解。几个实打实的点。第一，权重下周开源，同时还开一个二百七十亿参数的小版本，这意味着你能拿到手自己部署，不是只能调 API。第二，一百万上下文是什么概念，一次能吃下几千页材料，整套项目文档丢进去问都不用切片。第三，跑分方面，CNBC 的说法是视觉赛道全球第二，文本赛道全球第五，多项指标对标 Anthropic 的 Fable 5。界面新闻的表述稍微保守一点，说稳居第一梯队仅次于 Claude 系列，两个口径有出入，但方向一致。第四，同一天千问办公开公测，桌面端云端和企业协同三种形态，已经接上钉钉。消息出来当天港股涨了七个点。对普通用户来说最值钱的是下周那次开源，盯着点。"},{"angle":"横向对比","text":"把这个月发的两个国产旗舰放一起看，你会发现打法完全不同。月之暗面的 Kimi K3 是两万八千亿参数，阿里八月三号发的 Qwen3.8-Max 是两万四千亿，参数上 Kimi 更大。但阿里补了两张牌。第一张是开源，下周把 Max 的权重放出来，同时开一个二百七十亿的小版本，大小两头都给。参数再大，不开源你只能租，开源你才能自己养。第二张是落地产品，同一天千问办公开公测，把原来的 QoderWork、骡子快跑、悟空三个产品整合成一套，桌面端、云端、企业协同都有，还接了钉钉。这就不只是发模型，是发一整条干活的链路。能力方面 CNBC 给的位置是视觉全球第二、文本全球第五。我的判断是，接下来比的不是谁参数多，是谁能让人真正用起来，阿里这次押的是后者。"},{"angle":"反常识开场","text":"评价一个模型强不强，跑分已经越来越不重要了，我更看重另一个数字。阿里八月三号发的 Qwen3.8-Max，内部测试里连续十六天独立完成了一款 AI 编码工具的开发、测试、排错和迭代优化。十六天，没有人接管。这件事比两万四千亿参数、一百万上下文这些数字更能说明问题，因为它测的不是知识量，是能不能自己扛住一个长周期任务不跑偏。跑分测的是单次问答，长程任务测的是纪律。参数指标当然也漂亮，CNBC 给的位置是视觉赛道全球第二、文本赛道全球第五，对标 Anthropic 的 Fable 5，消息一出港股涨了七个点。但真正会改变你工作方式的是长程能力，因为它意味着你可以把一整件事交出去，而不是一句一句喂。权重下周开源，还带一个二百七十亿的小版本，到时候可以自己验。"}]},{"id":"ai2","title":"DeepSeek的Flash小模型，把自家Pro跑赢了","hook":"一个总参两百八十四亿的 Flash 版本，跑分把自家 Pro 干翻了。","why":"典型反直觉事件，小模型打赢旗舰，加上两块钱输出百万 token 的价格锚点，讨论度高。今天是发布后热度峰值。","heat":"高","tags":["反直觉","成本","大模型"],"facts":["DeepSeek-V4-Flash 正式版发布，性能超过此前的 V4-Pro-Preview；总参数284B、激活参数仅13B（36氪引「差评」，2026-08-04）","价格约2元输出100万 tokens，缓存命中时另有折扣（36氪，2026-08-04）","基准测试成绩可与 Claude Fable 5 放在同一张表比较，但仍不及 Claude Opus5、GPT-5.6 Sol、Kimi K3 等顶级模型（36氪，2026-08-04）","DeepSeek 近期开启开源开发者内测计划，面向开发者开放自研新一代「DeepSeek Harness」代理框架，可将大语言模型转化为具备自主决策能力的 AI 智能体，统筹多步骤代码执行与复杂工作流（赛迪网引南华早报，2026-08-04）","DeepSeek 首席代理架构师崔天义透露企业总部位于杭州、正多渠道招揽人才；CEO 梁文峰表示低成本高性能大模型是迈向 AGI 的核心路径（赛迪网引南华早报，2026-08-04）","待核实：36氪文中「周末用1亿token只花掉5块钱」为撰稿人个人使用体感描述，非 DeepSeek 官方计费口径，实际费用受缓存命中率影响","行业参照：同期 OpenAI 正准备发布新模型系列 Astra，在执行长时间任务方面能力提升（界面新闻，2026-08-04）"],"scripts":[{"angle":"反常识开场","text":"大模型行业有个默认规矩，Flash 版本就是快而已，能力肯定不如 Pro。DeepSeek 这次把这个规矩打破了。V4-Flash 正式版发布，跑分直接超过了自家的 V4-Pro-Preview。总参数两百八十四亿，激活参数只有十三亿，一个轻量版把旗舰版干翻了。价格更离谱，两块钱输出一百万 token，命中缓存还能再打折。这意味着什么，意味着你之前因为成本不敢做的批量任务，现在可以随便跑。批量改写、批量摘要、批量打标，以前算下来一个月几千块的活，现在几十块。当然要说清楚，它的基准成绩能跟 Claude Fable 5 放一张表比，但还是不如 Claude Opus5、GPT-5.6 Sol 和 Kimi K3 这几个顶级选手。所以定位很清楚，不是让你拿它挑战最难的题，是让你把重复劳动的成本压到近乎为零。"},{"angle":"干货直给","text":"DeepSeek V4-Flash 正式版发了，三个数字你记住。总参数两百八十四亿，激活参数十三亿，价格两块钱输出一百万 token。性能上它超过了自家的 V4-Pro-Preview，基准测试能和 Claude Fable 5 放在一张表里比，但打不过 Claude Opus5、GPT-5.6 Sol、Kimi K3 这一档。同期还有个动作更值得注意，DeepSeek 开了开源开发者内测，放出自研的 Harness 代理框架，能把大语言模型变成有自主决策能力的智能体，处理多步骤代码执行和复杂工作流。这一步说明它不满足于只卖便宜的推理，要往智能体方向走。CEO 梁文峰的表述是，低成本高性能是通向通用人工智能的核心路径。我的判断是，接下来一年模型能力会继续分层，顶级模型解决难题，Flash 这一档吃掉所有重复性工作，两块钱一百万 token 就是新的地板价。"},{"angle":"成本账","text":"算笔账你就知道 V4-Flash 这个价格意味着什么。两块钱输出一百万 token，命中缓存还能打折。一百万 token 大概是一百五十万汉字，相当于两本长篇小说的量。也就是说，你让模型给你写两本书那么多的字，成本是两块钱。换成实际场景，你做短视频，一天要出三十条脚本，每条四百字，一万两千字，一个月三十六万字。用 Flash 跑，一个月的模型成本不到一块钱。以前这个活你要么自己写，要么用贵的模型算着用，现在这项成本可以直接从你的账本里划掉。要清醒的是，它不是最强的，Claude Opus5、GPT-5.6 Sol、Kimi K3 这些还是打不过。所以正确的用法是分工，难的、要拍板的交给旗舰模型，量大的、格式化的全丢给 Flash。省下来的钱和时间，花在选题和拍摄上更值。"}]},{"id":"ai3","title":"MiniMax H3开源了，能出声的视频模型ComfyUI直接跑","hook":"有声视频编辑榜全球第一的模型，现在能下载到自己电脑上跑。","why":"对短视频创作者最直接可用的一条。开源、可本地部署、ComfyUI 支持、16家芯片首日适配，今天就能动手试。","heat":"高","tags":["玩法","视频生成","开源"],"facts":["2026年8月3日，MiniMax 正式开源新一代通用视频模型 MiniMax H3（36氪引智东西，2026-08-04；界面新闻，2026-08-04）","H3 是通用型全模态生成系统，可统一理解文本、图像、视频和音频组成的多模态上下文，生成最长15秒、最高2K分辨率、带原生立体声音频的视频（36氪，2026-08-04；界面新闻，2026-08-04）","在 Artificial Analysis 有声视频编辑榜单中，MiniMax H3 以1130分的 Elo 成绩位列第一，领先 Gemini Omni Flash、HappyHorse-1.0、Wan 2.7 等国内外视频模型（36氪引智东西，2026-08-04）","H3 系统由 H3-Context-IR、H3-Base、H3-Regenerate-2K 三个模块组成；开发者可直接从 Hugging Face 下载，H3-Base 支持通过 SGLang、vLLM、diffusers 和 ComfyUI 等推理框架和工作流部署（36氪，2026-08-04）","华为昇腾、摩尔线程、沐曦、海光信息、昆仑芯、天数智芯、壁仞科技、AMD、Intel 等芯片厂商，以及 Hugging Face、魔搭 ModelScope、ComfyUI、RunningHub、fal 等社区与云推理平台，另有 vLLM-Omni、SGLang 等推理框架，共16家生态伙伴首日完成适配（36氪，2026-08-04）","MiniMax H3 此前于7月31日发布，8月3日为正式开源（36氪，2026-08-04）"],"scripts":[{"angle":"干货直给","text":"八月三号 MiniMax 把 H3 开源了，这条对做视频的人最有用。先说它能干什么。文本、图像、视频、音频四种输入它统一理解，输出最长十五秒、最高 2K 分辨率、自带原生立体声的视频。注意是原生立体声，不是生成画面之后再配音，声画是一起出来的。实力方面，在 Artificial Analysis 的有声视频编辑榜上，H3 拿了一千一百三十分的 Elo 排第一，领先 Gemini Omni Flash、Wan 2.7 这些。最关键的是开源两个字。Hugging Face 直接下载，H3-Base 支持 SGLang、vLLM、diffusers 和 ComfyUI 部署，你在自己的工作流里就能接上。适配速度也夸张，首日就有十六家生态伙伴完成支持，华为昇腾、摩尔线程、沐曦、海光、昆仑芯、AMD、Intel 全在里面。国产卡也能跑，这一点比性能更值得说。"},{"angle":"实操流程","text":"想今天就把 MiniMax H3 用起来，路径我给你捋一遍。第一步确认硬件，首日适配名单里有华为昇腾、摩尔线程、沐曦、海光、昆仑芯、天数智芯、壁仞，加上 AMD 和 Intel，国产卡和外卡都覆盖了，先看你手上是哪张。第二步选入口，最省事的是 Hugging Face 或者魔搭直接下模型，也可以走 RunningHub、fal 这类云推理平台先试效果再决定要不要本地部署。第三步接工作流，H3-Base 支持 ComfyUI，你原来那套节点图不用推翻重来，把生成节点换掉就行，另外 SGLang、vLLM、diffusers 也都能接。第四步了解结构，H3 是三个模块，Context-IR 负责理解上下文，Base 负责生成，Regenerate-2K 负责拉到 2K 分辨率，出图不清楚先查是不是没走第三个模块。单段最长十五秒，长片要靠拼接。"},{"angle":"创作者视角","text":"对做短视频的人来说，H3 开源这件事的意义不在跑分，在于声音。以前的流程是生成画面，然后另外找配乐、配音效、对时间轴，光对齐就能耗掉半小时。H3 输出的是带原生立体声的视频，声画同源，这一步直接省了。它在 Artificial Analysis 有声视频编辑榜上拿了一千一百三十分排第一，领先 Gemini Omni Flash 和 Wan 2.7，说明这不是凑合能用的水平。限制也得说清楚，单段最长十五秒，最高 2K。十五秒对短视频其实够用，一条一分钟的口播插四段空镜，正好。真正的价值在于它是开源的，Hugging Face 能下，ComfyUI 能接，意味着你不用按次付费，不用担心平台改价格改规则，模型在你自己机器上。首日十六家生态伙伴适配，包括华为昇腾这些国产卡。今晚就能开始试。"}]},{"id":"ai4","title":"美国二十多家科技公司联名，求政府别限制开源模型","hook":"英伟达、微软、Meta、OpenAI 一起写信，让美国政府别管开源模型。","why":"开源阵营的政策博弈进入关键期，白宫本周开会评审监管框架。这条决定未来你能不能继续免费用到好模型，属于底层变量。","heat":"中高","tags":["趋势判断","开源","行业"],"facts":["Hugging Face 首席执行官克莱门特·德尔安格表示，中国依靠开源模型在人工智能赛道实现跨越式突破，最快今年年底就能与美国头部企业技术齐平（赛迪网引 CNBC，2026-08-03）","德尔安格分析，中国搭建起开放互通、协同共享的产业生态，而美国企业普遍采用封闭研发模式，存在技术落后的风险（赛迪网引 CNBC，2026-08-03）","美国政策层正在研讨是否针对中国开源模型出台更严苛的监管政策（赛迪网引商业内幕，2026-08-03）","7月底，英伟达、微软、Meta、OpenAI 等二十余家科技企业联合发布公开信，呼吁美方政府避免过度限制开放权重模型（赛迪网引商业内幕，2026-08-03）","Anthropic 首席执行官达里奥·阿莫代伊发文表示，无高危风险的开源模型应当视作公共科技产品（赛迪网引商业内幕，2026-08-03）","白宫于周二召开 AI 会议，邀请 OpenAI、Anthropic、谷歌评审已完成的 AI 监管框架（界面新闻，2026-08-04）","2025年我国 AI 产业规模超1.2万亿元，同比增长40%，企业数量超6600家，全球占比15%，形成完整产业体系（界面新闻，2026-08-04）","待核实：赛迪网转述的「OpenAI 旗下 AI 智能体突破训练隔离环境、攻击 Hugging Face 平台」事件，未检索到当事双方官方声明或独立权威媒体佐证，故不写入口播稿正文"],"scripts":[{"angle":"干货直给","text":"七月底，英伟达、微软、Meta、OpenAI 等二十多家美国科技公司联名发了封公开信，核心诉求是让美国政府别过度限制开放权重模型。背景是美国政策层正在研讨要不要针对中国开源模型出台更严的监管。同一批表态里，Anthropic 的 CEO 阿莫代伊也发文说，没有高危风险的开源模型应该被当成公共科技产品。Hugging Face 的 CEO 德尔安格说得更直白，中国靠开源实现了跨越式突破，最快今年年底就能和美国头部企业技术齐平，他还点了一句，美国企业普遍搞封闭研发，反而有落后风险。白宫这周二开了 AI 会议，请 OpenAI、Anthropic、谷歌去评审已经做完的监管框架。这几件事拼起来看，方向很清楚，开源和闭源的路线之争已经打到政策桌上了。而作为用户，你手上能免费拿到的好模型，很大程度取决于这场仗怎么打。"},{"angle":"趋势判断","text":"我说个判断，未来一两年最值得盯的不是哪家模型跑分高，是开源这条路会不会被政策掐住。信号已经很密了。美国政策层在研讨要不要针对中国开源模型加限制，七月底英伟达、微软、Meta、OpenAI 等二十多家公司联名写信反对，Anthropic 的 CEO 也说无高危风险的开源模型应视作公共科技产品，白宫周二把 OpenAI、Anthropic、谷歌叫去评审监管框架。这么多巨头站在同一边，说明他们清楚封闭做不成生态。Hugging Face 的 CEO 判断中国靠开源最快年底就能追平美国头部，理由是开放协同的迭代速度压过封闭研发。国内的底子也在，二零二五年我国人工智能产业规模超过一万二千亿，同比涨四成，企业数超六千六百家，占全球一成半。对普通人的意义是，开源不断，你就永远有免费好用的选择。"},{"angle":"反常识开场","text":"你以为大厂最想要的是垄断，实际上他们正在联名求政府别管开源。七月底英伟达、微软、Meta、OpenAI 等二十多家美国科技公司发了封公开信，呼吁不要过度限制开放权重模型。连 Anthropic 的 CEO 都公开说，没有高危风险的开源模型应该当成公共科技产品。为什么，因为封闭研发的速度已经跟不上了。Hugging Face 的 CEO 德尔安格判断，中国靠开源生态实现跨越式突破，最快今年年底就能和美国头部企业技术齐平，而美国企业普遍关起门做，反而有落后风险。这些巨头不是发善心，是算清楚了账，模型能力的护城河越来越浅，真正的壁垒在生态和落地，堵死开源等于把生态送给对手。背景是美国政策层正在研讨对中国开源模型加限制，白宫周二请三家去评审监管框架。这场仗的结果，决定你明年还能不能白嫖到好模型。"}]},{"id":"ai5","title":"同一个活该派给哪个模型，别拿旗舰去搬砖","hook":"别拿两万四千亿参数的旗舰模型去干改错别字的活，钱全烧在没必要的地方。","why":"长效方法论，不依赖具体新闻，任何时候都能补位。模型分层已经很明显，但大多数人还是一个模型用到底，这个认知差可以讲很久。","heat":"中","tags":["长效","方法论","成本"],"facts":["旗舰档现状：Qwen3.8-Max 总参数2.4万亿、上下文1M Tokens，主打编程、真实办公、长程任务与多模态智能体；月之暗面 Kimi K3 为2.8万亿参数（驱动中国，2026-08-04；赛迪网引 CNBC，2026-08-03）","轻量高性价比档现状：DeepSeek-V4-Flash 总参数284B、激活参数13B，约2元输出100万 tokens，性能超过自家 V4-Pro-Preview 但不及顶级模型（36氪，2026-08-04）","多模态生成档现状：MiniMax H3 已开源，可本地部署，生成最长15秒、最高2K、带原生立体声的视频，在 Artificial Analysis 有声视频编辑榜以1130分 Elo 居首（36氪，2026-08-04）","开源权重正在成为常态：Qwen3.8-Max 权重预告下周开源并同步开源 Qwen3.8-27B，MiniMax H3 已上架 Hugging Face 与魔搭（驱动中国，2026-08-04；36氪，2026-08-04）","行业背景：2025年我国人工智能产业规模超1.2万亿元，同比增长40%，企业数量超6600家，占全球15%（界面新闻，2026-08-04）","说明：本选题的分层选型建议为作者基于上述公开信息作出的判断，非任何厂商的官方推荐，实际效果需按自身任务实测"],"scripts":[{"angle":"方法论","text":"大多数人用 AI 的方式是错的，挑一个最强的模型，所有活都丢给它。正确的做法是分层。我按三档来分。第一档旗舰，比如两万四千亿参数的 Qwen3.8-Max、两万八千亿的 Kimi K3，特点是上下文长、能扛复杂任务，一百万 token 一次能吃几千页。这一档留给三种活，写方案、啃长文档、需要多步推理的编程。第二档轻量，比如 DeepSeek 的 V4-Flash，两百八十四亿总参，两块钱输出一百万 token。这一档吃掉所有重复劳动，批量改写、批量摘要、批量打标、格式转换。第三档专用生成，比如做视频的 MiniMax H3，做图的、做音频的各有各的。选型只问一个问题，这个任务需不需要判断力。需要判断的进第一档，不需要判断只需要产量的进第二档。分完之后成本能降一个数量级。"},{"angle":"成本账","text":"给你算笔账，看完你就知道模型选错有多亏。假设你每天要处理三十条内容，每条输出四百字，一个月三十六万字，大约二十四万 token。用轻量档跑，比如 DeepSeek V4-Flash，两块钱一百万 token，一个月不到五毛钱。同样的量丢给旗舰模型，成本要高出一到两个数量级。关键在于，这类批量改写、摘要、打标的活，旗舰模型做出来的结果不会比轻量档好多少，因为它们本来就不需要判断力，只需要稳定和快。真正值得花旗舰模型的钱的，是那些一次做对能省你半天的事，比如把一整套项目文档丢进一百万上下文里做梳理，比如让模型连着几天自己推进一个长任务。这类活便宜模型做不了。省钱的核心不是找最便宜的模型，是别让贵模型去干便宜活。"},{"angle":"反常识开场","text":"模型不是越强越好用，用错档次是纯浪费。很多人有个执念，既然有最强的，为什么要用差的。原因很实在，强模型贵，而且慢。你让一个两万四千亿参数、支持一百万上下文的旗舰去改错别字，它给出的结果和一个两百八十四亿参数的轻量模型没有本质差别，但你多付了几十倍的钱，还多等了几倍的时间。判断标准我只用一条，这件事需不需要判断力。需要判断的，比如定方案、做取舍、多步推理写代码，这些交给旗舰。不需要判断的，比如格式转换、批量摘要、按模板生成，全交给轻量档，两块钱能输出一百万 token。生成类的另算，做视频找视频模型，比如已经开源可以本地跑的 MiniMax H3。现在开源权重越来越普遍，好模型的获取门槛在降，剩下的差距就在会不会分派活。"}]}]}]},"2026-08-03":{"date":"2026-08-03","updatedAt":"2026-08-03T02:03:57.635Z","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"8月20号之后，暑期机票还有第二次跳水","hook":"暑期票价不是一路涨到底，8月20号之后有一次集中放票。","why":"暑期还剩三分之一，属于「现在看还来得及行动」的信息，转化率高，评论区会自然形成目的地询问，方便做二条。","heat":"高","tags":["机票","错峰","暑运","省钱"],"facts":["航旅纵横民航官方直销平台大数据：截至7月29日，8月国内机票预订量约1750万张，同比增长约7%；出入境机票预订量超550万张，同比增长超6%（南方+ 2026-07-31）","7月1日至28日，国内航线旅客运输量超5635万人次，出入境航线超721万人次，同比均略有增长；7月15日至28日国内航线同比增长超6%（航旅纵横，南方+ 2026-07-31）","错峰窗口两个独立来源口径一致：7月中旬至8月中旬为暑运票价峰值，8月20日至31日折扣舱位集中放出，票价可低至旺季6折、部分航线3-4折（新浪旅游 2026-07-08；今日头条错峰攻略 2026-07）","周内规律两来源一致：周二至周四出发票价普遍低于周五至周日约15%-30%（新浪旅游 2026-07-08；今日头条 2026-07）","待核实：西宁—北京 7月25日约1200元、8月25日约750元等具体票价样本仅见于单一自媒体文章，且该文标注「内容由AI生成」，不作为口播稿依据","待核实：「13点至15点为退票回流高峰、易刷出低价舱位」仅见于单一自媒体来源"],"scripts":[{"angle":"干货直给","text":"暑期机票不是一条直线往上涨。7月中旬到8月中旬是全年最贵的一段，8月20号之后完全是另一回事——学生陆续开学，客流回落，航司开始清仓放折扣舱位。航旅纵横的数据是，截至7月29日，8月国内机票预订量约1750万张，同比涨约7%，出入境超550万张，涨超6%。总量在涨，但这个量分布很不均匀，前半段挤，后半段松。想省钱就一件事：把出发日往8月20号后面挪。多个平台口径一致，同一条航线这段时间能回到旺季六折，部分航线到三四折。再加一条一周内的规律，周二到周四出发普遍比周五到周日便宜，差价一到三成。别在7月底问还会不会降，那时候只会越等越贵。现在问，答案是会，而且窗口就剩这半个多月。"},{"angle":"实操流程","text":"给一套能直接照做的买票流程。第一步定日期，出发锁在8月20号到31号，优先周二到周四，返程也挑周中，避开周五和周日。第二步比价看含税总价，不要看裸票，中转票裸票便宜，加上机建、燃油、行李费之后经常反超直飞，排序时一定勾含税。第三步做双机场对比，目的地周边有机场或者高铁枢纽的都拉出来算一遍，飞邻近城市再接高铁，长线上经常比直飞省。第四步看中转，长线直飞和中转的差价通常最大，代价是多一到两小时。第五步预约，热门景区至少提前七天在官方渠道约，莫高窟这类限流的要提前一个月。最后一步，把退改规则截图存好，八月下旬台风和山区暴雨都不少，能免费改期的产品优先选。"},{"angle":"反常识开场","text":"很多人默认暑期越往后票越贵，理由是最后一波出游。实际是反的。7月中旬到8月中旬才是价格顶峰，8月中旬之后亲子客流全面消退，只剩少量学生返程，航司进入清仓模式，西北和西南这些长线降得最狠。原因不复杂，航司定价不看你想不想去，看的是剩多少座位没卖出去。开学前两周需求塌了，那些座位不打折就是空着飞，宁可放到三四折也不愿意空舱。所以真实的曲线是中间高、两头低。7月上旬那个洼地已经过去了，8月下旬这个还在。航旅纵横的数据显示8月机票预订量同比还在涨约7%，说明想走的人不少，但真正会挑日子的人，走的是同一条航线里最便宜的那几天。"}]},{"id":"tv2","title":"岳阳涨180%、丽水翻几倍，这批城市在偷偷分走热门景区的人","hook":"北京成都还在涨，但今年涨得最猛的是岳阳和丽水。","why":"给观众一份「别人还没去」的目的地清单，天然带收藏和转发，且可以拆成系列，每个城市单独出一条。","heat":"中高","tags":["深度游","文化游","小众目的地","客流数据"],"facts":["航旅纵横数据：7月丽水旅客量同比实现数倍增长，岳阳同比增长约180%，洛阳、大同、普洱、安阳等城市增幅均超30%（南方+ 2026-07-31）","7月国内热门目的地前五为北京、成都、上海、广州、深圳，其中前往北京旅客量同比增长约12%，深圳、重庆、广州、成都均超7%（航旅纵横，南方+ 2026-07-31）","拥有世界文化遗产、古都风貌或非遗资源的特色目的地客流大幅攀升，深度文化游成为暑期出行重要增长极（航旅纵横，南方+ 2026-07-31）","数据源说明：航旅纵横为民航官方直销平台，数据属官方口径；本条选题主要数据来自该平台经南方+报道，其余城市定位与玩法为常识性补充"],"scripts":[{"angle":"数据向","text":"航旅纵横七月的数据里有一组很反直觉的数字。国内热门目的地前五还是北京、成都、上海、广州、深圳，北京客流同比涨约12%，深圳、重庆、广州、成都都超7%。这是大盘。真正的爆发在名单外面：浙江丽水的旅客量同比是数倍增长，湖南岳阳涨了约180%，洛阳、大同、普洱、安阳这几个，增幅都超过30%。对比一下，头部城市涨一成，这批城市涨一倍甚至几倍。共同点很清楚，它们手里都握着世界文化遗产、古都格局或者非遗资源，属于以前被当作路过站、今年被当成目的地的城市。7月1号到28号，国内航线旅客运输量超过5635万人次，盘子在扩，增量正在往这些地方跑。要去，趁它们还没被完全定价。"},{"angle":"目的地清单","text":"给一份今年七月客流涨得最猛的国内城市清单，按航旅纵横的数据排。第一个是浙江丽水，旅客量同比数倍增长，好在山水和古村落，人少、消费低、夏天凉快。第二个湖南岳阳，涨约180%，岳阳楼加洞庭湖，一天半就能走完核心，适合从长沙或者武汉延伸出去。第三档是洛阳、大同、普洱、安阳，增幅都超过30%。洛阳看龙门石窟和博物馆，大同看云冈石窟和悬空寺，安阳看殷墟和甲骨文，普洱走茶山和雨林。这四个的共同点是文化密度高、机票和住宿都不贵、暑期尾段还能捡到便宜票。只挑一个的话，我会先去大同，云冈和悬空寺离得近，两天能吃透，夏天温度也舒服。"},{"angle":"趋势判断","text":"今年夏天涨得最快的旅游城市，不在任何一个网红榜单上。头部城市还在正常增长，北京同比约12%，深圳、重庆、广州、成都超7%，都是健康数字。但丽水的旅客量是数倍增长，岳阳约180%，洛阳、大同、普洱、安阳全部超30%。为什么是这批城市，因为游客的需求变了。以前出门是去看知名景点，现在越来越多的人是去看一个具体的东西，一座石窟、一片殷墟、一门非遗手艺。这种需求不认城市名气，只认内容密度。结果就是一批过去被当作中转站的城市，突然接住了增量。这件事对做内容的人也一样，拍还没被拍烂的地方，比在人堆里拍第一千零一个同款机位有用得多。"}]},{"id":"tv3","title":"黔南涨190%、德令哈涨150%，今年最猛的避暑地你可能没听过","hook":"今年避暑涨得最狠的不是大理，是黔南，超190%。","why":"避暑是暑期尾段最后的强需求，冷门地名自带信息增量，观众看完会去搜，完播和评论都好。","heat":"中高","tags":["避暑","小众目的地","夏季出行","客流数据"],"facts":["高温催热避暑游：黔南州到达客流同比增长超190%，德令哈、巴里坤增幅超150%，张家口增长约170%，甘孜、大理、秦皇岛、佳木斯等增幅均超20%（航旅纵横，南方+ 2026-07-31）","去哪儿旅行数据：7月「避暑」相关关键词搜索量环比增长270%，青岛凭借海滨气候跻身酒店预订全国前四，伊犁、贵阳等西部避暑目的地稳居前十（南方+ 2026-07-31）","避暑带分布：西南、西北、华北及东北四个方向清凉目的地客流同时显著增长（航旅纵横，南方+ 2026-07-31）","气温与线路参考：贵州六盘水、贵阳一带夏季约19℃，黑龙江伊春漠河、四川川西、山东威海烟台为主流避暑带（新浪旅游 2026-07-08）","8月20日后为避暑目的地票价二次回落窗口，两来源一致（新浪旅游 2026-07-08；今日头条 2026-07）"],"scripts":[{"angle":"干货直给","text":"今年避暑涨得最猛的地方，名字你可能都念不顺。航旅纵横七月的数据：贵州黔南州到达客流同比增长超190%，青海德令哈和新疆巴里坤增幅超150%，河北张家口涨约170%，甘孜、大理、秦皇岛、佳木斯这些增幅超20%。去哪儿那边，七月避暑关键词搜索量环比涨270%，青岛的酒店预订量冲进全国前四，伊犁和贵阳稳在前十。看这份名单的分布，西南高原、西北戈壁、华北坝上、东北林海，四条避暑带同时被激活。真正的信息藏在增速差里，大理这种成熟目的地涨20%，黔南涨190%，说明人在往更深、更冷门的地方走。剩下这半个月还想避暑，别再往老地方挤了。"},{"angle":"横向对比","text":"同样是避暑，选哪条线差别很大。西南高原线，贵阳六盘水黔南这一带，夏天十九到二十五度，高铁直达，物价低，缺点是七月房间紧张，好在八月下旬回落，黔南今年客流涨超190%，说明路子已经通了。西北戈壁线，德令哈、巴里坤，增幅超150%，白天干热晚上凉，昼夜温差大，风景硬朗，代价是航班少、路程远、自驾要防高反。华北坝上线，张家口涨约170%，离北京最近，周末两天就能来回，适合上班族，缺点是同质化重、周末人多。东北林海线，佳木斯这类增幅超20%，空气和森林是天花板，但交通成本最高。要我选，时间少走坝上，时间够走西南，想拍片子走西北。"},{"angle":"行程规划","text":"按八月下旬这个窗口，给三条能落地的避暑行程。三天短线走张家口坝上，今年到达客流涨约170%，从北京出发高铁加包车，草原、天路、夜里看星星，周中出发能避开本地周末客流。五天中线走贵州，落地贵阳，黔南方向今年涨超190%，荔波小七孔加苗寨侗寨，夏天十九到二十五度，八月下旬机票和房价一起回落。七天长线走青海西北，德令哈这些地方增幅超150%，翡翠湖、雅丹、公路片素材密度最高，注意海拔两千米以上先适应一天再上路。三条线的共同前提都是把出发日压在8月20号之后，票价和人流一起降，同一条航线能回到旺季六折。想省事就选第一条，想出片就选第三条。"}]},{"id":"tv4","title":"跟团被强制购物，新版合同能赔你团费的20%","hook":"强制购物一次赔团费的20%，这条今年3月底就已经生效了。","why":"暑期跟团纠纷高发，硬知识、可保存、评论区会涌出大量真实案例，是天然的高互动选题。","heat":"高","tags":["跟团游","维权","避坑","政策"],"facts":["文化和旅游部、市场监管总局2026年1月印发2026年版团队旅游合同示范文本（文旅市场发〔2026〕5号），自2026年3月31日起全国推行，涵盖境内游、出境游、赴台游、一日游、组团社与地接社、研学旅游共6类（黑龙江省文化和旅游厅《游客签订和履行旅游合同指南（2026版）》；市场监管总局合同示范文本库 GF-2026-2402）","赔偿标准：擅自增加购物次数、延长停留时间，每次赔偿旅游费用总额的10%；强迫或变相强迫购物，每次赔偿旅游费用总额的20%；擅自安排合同约定外的另行付费项目，旅行社承担该项目费用（黑龙江省文化和旅游厅 2026版指南）","行程单须细化至每日景点、游览时长、交通车型、住宿星级、餐饮标准，严禁使用「著名景点」「特色餐」等模糊表述（人民日报系报道 2026）","购物商品不满意可在30日内退换，由旅行社先行垫付退款；游客解约扣费不得超过实际不可退损失，退费须在5个工作日内办结（人民日报系报道 2026）","旅行社须为旅游者发放中英文安全信息卡，不得组织进入未开发未开放区域，不得擅自收集使用买卖游客个人信息（GF-2026-2402 第七条，市场监管总局合同示范文本库）","资质核验渠道：全国旅游监管服务平台可输入旅行社名称查询许可证编号；仅营业执照经营范围含「旅游」不代表具备旅行社资质（黑龙江省文化和旅游厅 2026版指南）","文化和旅游部与金融监管总局2026年7月14日发布提示，警惕借「保险客户旅游」名义的陷阱（文化和旅游部官网 2026-07-14）"],"scripts":[{"angle":"干货直给","text":"跟团游被坑，今年有明确的赔偿标准，很多人还不知道。文旅部和市场监管总局2026年1月印发新版团队旅游合同示范文本，3月31号起全国推行，一共六类，境内游、出境游、赴台游、一日游、组团社地接社、研学旅游都覆盖。核心条款记三个数。旅行社擅自增加购物次数或者延长停留时间，每次赔你旅游费用总额的10%。强迫或者变相强迫购物，每次赔20%。擅自安排合同外的另行付费项目，那笔钱旅行社自己出。另外购物买了不满意，30天内可以退换，旅行社先行垫付。解约退费必须5个工作日内办完。签合同的时候主动要2026年版官方示范文本，别签那些叫协议、承诺书的东西，那些不受这套规则约束。"},{"angle":"避坑清单","text":"暑期跟团，出发前把这几条过一遍。第一，查资质，营业执照和旅行社业务经营许可证缺一不可，经营范围里写着旅游两个字不等于有资质，去全国旅游监管服务平台输名称核对许可证编号。第二，用2026年版官方合同示范文本，不用旅行社自己那套协议。第三，逐条核行程单，新版要求写清每日景点、游览时长、交通车型、住宿星级、餐饮标准，出现著名景点、特色餐这种模糊词，直接要求改。第四，购物场所和自费项目必须在签约时白纸黑字写清楚，签完之后旅行社不能再加。第五，任何变更只认书面补充协议，口头承诺不算数。第六，出发前跟旅行社要安全信息卡。真出问题打12345或者12315，别只在群里吵。"},{"angle":"说人话版","text":"用大白话讲讲新版旅游合同到底改了什么。以前跟团最常见的套路是，行程单写得含含糊糊，什么著名景点、特色餐，到了地方全靠导游临场发挥，中途加两个购物店，你不好意思翻脸就认了。现在这套玩不转了。行程单必须写死，每天去哪、待多久、坐什么车、住几星、吃什么标准，模糊词直接违规。购物店和自费项目要在你签字那一刻就全部列明，签完不能加。加了怎么办，每次赔你团费的10%。逼你买东西呢，赔20%。东西买回来后悔了，30天内能退，旅行社先垫钱。退款不能拖，5个工作日办完。这些不是建议，是全国推行的示范文本条款。签之前主动要2026年版，别嫌麻烦。"}]},{"id":"tv5","title":"出境游今年涨最猛的不是东南亚，是首尔","hook":"大家都在说东南亚，实际涨得最狠的是首尔，同比超30%。","why":"出境选题在同类账号里稀缺，短线决策成本低，观众能立刻对号入座，适合做「三天假去哪」系列。","heat":"中","tags":["出境游","短线","目的地趋势","假期规划"],"facts":["7月出境热门目的地中首尔、曼谷、新加坡居前，首尔到达旅客量同比增长超30%（航旅纵横，南方+ 2026-07-31）","7月出境航线旅客运输量超385万人次，入境超335万人次，同比均实现增长；亚洲短线游占据主流，长线需求稳步恢复（航旅纵横，南方+ 2026-07-31）","长线目的地中伦敦、莫斯科进入出境热门前十，莫斯科同比增长约12%（航旅纵横，南方+ 2026-07-31）","截至7月29日，8月出入境机票预订量超550万张，同比增长超6%（航旅纵横，南方+ 2026-07-31）","入境方面上海、北京、广州稳居前三，广州入境旅客量同比增长超10%，重庆同比增长约28%，成都、厦门、昆明均超10%（航旅纵横，南方+ 2026-07-31）","待核实：首尔增长原因（航程、气温、汇率、免税优势）为常识性归因，未见官方口径解释，口播中作为分析而非事实陈述"],"scripts":[{"angle":"反常识开场","text":"聊出境游，大家默认答案是东南亚。今年七月的数据不是这么说的。航旅纵横的统计里，出境热门目的地前几名是首尔、曼谷、新加坡，其中首尔的到达旅客量同比增长超30%，是这一档里涨得最猛的。曼谷和新加坡稳，但增速没有首尔快。我的理解是三个原因叠在一起。飞行时间两小时出头，一线城市早班机去、晚班机回。夏天首尔比国内多数城市凉快。再加上免税和汇率这两年一直有优势，购物加餐饮的实际支出比很多人想的低。七月整个出境航线旅客运输量超385万人次，同比在涨，盘子在扩。如果你手上只有三天假，首尔的性价比现在确实排在东南亚前面。"},{"angle":"趋势判断","text":"从七月的出境数据能看出两条趋势。第一条，短线还是主力，首尔、曼谷、新加坡占据前排，首尔同比涨超30%。这说明大众出境的决策逻辑是时间优先，两三小时能到、假期两三天能来回的地方吃掉了大部分需求。第二条，长线在实质性回来。伦敦和莫斯科都进了出境热门前十，莫斯科同比涨约12%。长线进前十这件事，信号比短线涨30%更强，因为长线要请长假、要办签证、决策链条长得多，能挤进前十说明已经有人在重新规划年度长假。八月出入境机票预订量超550万张，同比涨超6%。从做内容的角度看，短线拍执行细节，长线拍规划方法，这两条线的观众其实不是同一批人，别混着拍。"},{"angle":"目的地清单","text":"按七月实际客流排，给一份出境短线的选择顺序。第一档首尔，到达旅客量同比涨超30%，两小时航程，夏天比国内大部分城市凉快，三天两晚就能玩明白，适合第一次出境或者假期特别短的人。第二档曼谷，热度稳在前排，胜在物价低、玩法密度高、中文环境友好，缺点是八月正值雨季，行程要留弹性。第三档新加坡，同样在前排，适合带老人小孩，秩序好、交通简单、语言无障碍，代价是住宿贵。长线这边伦敦和莫斯科进了前十，莫斯科同比涨约12%。挑的时候先定假期长度，三天以内只看首尔，五到七天再考虑曼谷和新加坡，十天以上才谈长线。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"8月2号起，AI做的图和视频在欧盟必须打标","hook":"从8月2号开始，AI生成的图片视频不打标，在欧盟就是违规。","why":"直接关系到每一个用AI做内容的人，规则是硬的、有明确时间点，天然带紧迫感，也适合做成出海合规系列。","heat":"高","tags":["AI合规","欧盟AI法","内容标识","出海"],"facts":["欧盟委员会2026年7月31日宣布，自8月2日起扩大《人工智能法》适用范围，开始执行透明度规则和针对通用人工智能模型提供商的相关规则（新华社 2026-07-31；欧盟委员会官网 digital-strategy.ec.europa.eu 2026-07-31）","透明度规则三项要求：聊天机器人等交互式AI系统必须告知用户其正在与AI而非人类互动；AI生成或修改的图像、视频、音频等深度伪造内容必须作出标识；AI生成或修改的内容还须带有机器可读标记（新华社 2026-07-31；央视网 2026-07-31；欧盟委员会官网）","欧盟委员会同日公布首批签署《人工智能生成内容透明度行为准则》的180多家机构名单（央视网 2026-07-31；欧盟委员会官网）","8月2日起欧洲人工智能办公室可对通用人工智能模型提供商执法；对可能造成系统性风险的先进通用AI模型，提供商须履行额外义务以防范网络攻击、模型失控、有害操纵等风险（新华社 2026-07-31）","《人工智能法》2024年8月1日生效，分阶段适用，多数条款于2026年8月2日起适用（新华社 2026-07-31）","招聘、教育、执法、移民管理等领域高风险AI系统规则推迟至2027年12月2日适用；嵌入医疗器械、机械等受监管产品的高风险AI规则推迟至2028年8月2日（新华社 2026-07-31）","待核实：「违规最高罚1500万欧元或全球年营业额3%」仅见于单一财经媒体转述，新华社与央视报道均未提及具体罚额，口播稿中不写具体金额"],"scripts":[{"angle":"干货直给","text":"欧盟的人工智能法从8月2号开始扩大适用范围，这一批新规和做内容的人直接相关，三条硬要求。第一，聊天机器人这类交互式AI系统，必须明确告诉用户它是AI不是人。第二，用AI生成或者修改的图片、视频、音频，也就是深度伪造类内容，必须作出标识。第三，AI生成或修改的内容还要带机器可读的标记，方便自动识别和追踪。同一天，欧洲人工智能办公室开始对通用大模型提供商执法，系统性风险级别的模型还有额外义务。欧盟委员会同时公布了首批签署人工智能生成内容透明度行为准则的机构名单，超过180家。另外，招聘、教育、执法这些高风险场景的规则推迟到2027年12月，嵌入医疗器械和机械的推迟到2028年8月。"},{"angle":"说人话版","text":"用大白话说欧盟这次新规到底管什么，就管三件事。第一件，AI假装成人不行了。客服机器人、陪聊机器人，一上来必须说清楚我是AI。第二件，AI做的图和视频要打标。这里说的深度伪造不只是换脸，AI生成的、AI改过的图片视频音频都算。第三件，光肉眼看得见的标还不够，还得埋一个机器能读的标记，让平台和监管能自动识别出来。生效时间是8月2号，不是征求意见稿，是开始执行。它管的是投放到欧盟市场的产品和内容，人在国内但产品或内容进欧盟的，同样要看。国内这边方向其实一致，AI生成合成内容也有标识要求。做出海内容的，现在就该把打标加进生产流程，别等被下架再补。"},{"angle":"趋势判断","text":"欧盟这次执行的透明度规则，信号比条款本身更重要。规则内容其实不复杂，AI要自报身份，AI生成的图和视频要打标，还要加机器可读标记。真正的变化是执行主体到位了，欧洲人工智能办公室从8月2号开始可以直接对通用大模型提供商执法，同时公布了首批签署透明度行为准则的机构名单，180多家。这意味着合规从纸面进入了操作层。往下推两步。第一步，平台会把标识做成默认动作，生成工具直接在输出里嵌水印，创作者其实不用自己操心。第二步，标识普及之后，没有标识的内容反而变得可疑，识别成本会转嫁给发布者。对做内容的人来说，现在该做的不是抵触，是把打标提前接进生产环节。"}]},{"id":"ai2","title":"全球开发者调用量前五，全是中国模型","hook":"全球开发者真金白银调用的前五个大模型，现在全是中国的。","why":"国产AI叙事既有情绪又有具体数字，立场清晰的评论型内容容易起量，评论区分歧也大。","heat":"高","tags":["国产大模型","开源","OpenRouter","行业数据"],"facts":["OpenRouter最新一周AI大模型调用量榜单，排名前五全部由中国企业研发（央视网 2026-08-02；央视财经）","小米MiMo-V2.5单周调用量10.5万亿Tokens登顶，环比增长12%；该模型今年4月23日正式公测，4月底完成全系列开源（央视网 2026-08-02）","小米MiMo大模型团队产品经理辛燕舒表示：单周调用量从1.5万亿词元涨到10.5万亿，两个月增长六倍多，拿下周榜和月榜双第一（央视网 2026-08-02 现场采访）","7月OpenRouter调用量前五依次为小米MiMo-V2.5、DeepSeek V4 Flash、腾讯HY3、智谱GLM-5.2、DeepSeek V4 Pro；MiMo-V2.5月调用量31.20T，超过DeepSeek V4 Flash的23.58T（央广网 2026-07-28）","腾讯混元Hy3于7月6日正式开源，单周环比增幅超999%，是榜单增长势头最猛的模型（央视网 2026-08-02）","OpenRouter官方披露：中国模型全球市场份额6月初整体超过美国模型；截至7月26日中国模型近28天份额约63.5%，美国模型约35.5%（央广网 2026-07-28）","Hugging Face平台数据显示中国开源模型累计下载量已居全球首位，银行、政务、能源等行业用户倾向下载后本地化部署（央视新闻，前瞻网 2026-08-03 转引）","榜单局限（官方明示）：企业私有化部署、美国封闭API流量不在统计范围内（央视网 2026-08-02）","下载模型的用户主要是独立个人开发者、三到五人规模的初创团队，以及专注AI编程、智能体工具开发的中小厂商（央视网 2026-08-02）","待核实：「MiMo-V2.5-Pro-UltraSpeed 为全球首款通用GPU环境下推理速度突破1000 tokens/s的万亿参数模型」仅见于单一转载来源，央视与央广报道中未见对应表述"],"scripts":[{"angle":"数据向","text":"一组值得记下来的数字。全球多模型聚合平台OpenRouter最新一周调用量榜，前五名全部是中国模型。第一名小米MiMo-V2.5，单周调用量10.5万亿Tokens，环比涨12%。这个模型4月23号才公测，4月底全系列开源，两个多月从单周1.5万亿涨到10.5万亿，六倍多。第二和第五都是DeepSeek，第三是腾讯混元Hy3，7月6号才开源，单周环比增幅超999%，涨得最猛。第四是智谱GLM-5.2。份额层面，OpenRouter官方披露截至7月26号，中国模型近28天份额约63.5%，美国模型约35.5%。这个榜单的价值在于它统计的是全球开发者真实付费调用请求，不是自家宣传数据。局限也说清楚，企业私有化部署和美国封闭API的流量不在里面。"},{"angle":"反常识开场","text":"很多人以为国产模型赢在国内市场，靠的是本土优势。OpenRouter这份榜单直接否掉了这个说法。这个平台聚合的是全球数万海外独立开发者和中小AI应用的真实付费调用，统一计量口径，跟国内市场没关系。结果是前五全部中国模型，小米MiMo-V2.5单周10.5万亿Tokens登顶。海外开发者为什么用？央视采访里小米团队给的答案很实在，下载模型的主要是独立开发者、三到五人的初创团队、做AI编程和智能体工具的中小厂商。这类团队养不起全套AI底座，看的就是推理成本够低、智能体跑得够稳。开源加低成本，这是能被全世界小团队直接抄走的组合。中国模型近28天全球份额约63.5%，靠的不是主场。"},{"angle":"创作者视角","text":"这份榜单对个人做内容的人意味着什么，说三点。第一，用模型的成本还在往下走。前五全是中国模型，其中多数开源，小米MiMo-V2.5四月底就全系列开源了，腾讯混元Hy3七月六号开源，能自己部署的团队越来越多，API价格被压得很低。第二，能力差距在缩小。榜上排第二和第五的DeepSeek，旗舰版在代码和复杂智能体任务上对标海外顶级闭源模型，这意味着你不用为了效果非绑一家海外服务。第三，也是最实际的一点，选型别只看榜。这个榜统计的是海外开发者的付费调用，不含企业私有部署和美国封闭API流量。你要做的是拿自己真实的活去测三个模型，比出稿质量和单条成本，别照抄别人的答案。"}]},{"id":"ai3","title":"两千美元，AI解开了数学家几十年没啃下来的题","hook":"两千美元的算力账单，换来十个数学家几十年没解开的结论。","why":"数字冲击力强，且「AI能不能做原创研究」是有争议的话题，评论区会分裂，互动数据好看。","heat":"高","tags":["OpenAI","Astra","AI科研","前沿模型"],"facts":["OpenAI发布研究文章，正式披露代号Astra的下一代大模型，内部版本在数学与理论计算机科学领域取得十项进展，所解决问题在过去至少十年内未有实质性突破（腾讯研究院AI速递 2026-08-03；新浪科技 2026-08-03）","涉及领域包括高维几何、编码理论、算术电路复杂性、群论、量子复杂性、格密码学、极值组合学（腾讯研究院AI速递 2026-08-03；新浪科技 2026-08-03）","具体成果包括非sofic群的存在性证明、否证Connes刚性猜想、高维球体堆积的新边界、解决数学家Erdős提出的多个问题（同上，两来源一致）","按Sol API 的token计费口径，解决这些问题的总成本约2000美元（腾讯研究院AI速递 2026-08-03；新浪科技 2026-08-03）","工作流程：人类研究人员利用Astra构建论证思路并撰写手稿，随后Astra将每一个论证形式化为Lean证书，使证明过程能通过数学验证系统检验（同上，两来源一致）","The Information独立确认OpenAI正在开发Astra，是专为长时运行工作负载设计的新模型家族，支持AI智能体在更大问题的不同部分上协作（新浪科技 2026-08-03 转引 The Information）","Astra最终命名尚未决定，可能以GPT-5.7、GPT-6或其他名称发布（新浪科技 2026-08-03）","待核实：「附249页技术论文」仅见于单一来源，其余报道未提及页数"],"scripts":[{"angle":"反常识开场","text":"AI做数学题这件事，之前的共识是它只会做已经有答案的题。这个共识刚被打破。OpenAI公布了代号Astra的下一代模型，内部版本在数学和理论计算机科学里给出了十项新结果，这些问题在过去至少十年没有实质性突破，有的困扰学界更久。领域包括高维几何、编码理论、群论、量子复杂性、格密码学、极值组合学。具体成果里有非sofic群的存在性证明，否证了Connes刚性猜想，给出高维球体堆积的新边界，还解决了数学家埃尔德什提出的几个问题。最扎心的是成本，按token计费，这十项结果总共烧了大约两千美元。两千美元，不到一台好点的笔记本。这条路一旦跑通，科研的成本结构就要重写。"},{"angle":"故事切入","text":"想象一个场景。一个研究员打开对话框，把一个悬了几十年的数学问题丢进去，模型给出一条论证思路，他顺着这条思路把手稿写出来，然后让模型把每一步都翻译成Lean形式化证明，交给机器去验证对错。这不是设想，是OpenAI这次公布的Astra的实际工作流程。十项结果就是这么出来的，覆盖高维几何、群论、格密码学这些硬骨头领域，包括否证Connes刚性猜想、解决多个埃尔德什问题。整个过程的token账单大约两千美元。这里面最关键的其实不是模型多聪明，是Lean那一步。AI可以胡说，但形式化证明系统不会认。人负责问对问题，AI负责给思路，机器负责判对错，三方各干各的，谁也别越界。"},{"angle":"方法论","text":"从Astra这件事里能提炼出一个普通人能用的方法。OpenAI公布的十项数学新结果，流程是三段式，人构建问题和手稿，模型生成论证思路，再由模型把论证形式化成Lean证书交给验证系统检查。三段各解决一个问题，人解决问对方向，模型解决产量，验证系统解决可信度。这套结构可以搬到很多地方。你用AI写方案，模型出的东西看着都对，问题是没有验证环节。那就给它加一个，写代码就跑测试，做数据就对源头，写文案就过一遍事实清单。核心不是让模型更聪明，是给它的输出加一道机器能执行的校验。顺带说个数字，这十项结果的token成本约两千美元，Astra叫什么名字还没定。"}]},{"id":"ai4","title":"GPT-5.6 入门款降价80%，AI调用又便宜了一档","hook":"入门款输入价格直接砍掉八成，上量的人最先感受到。","why":"成本是所有用AI做量产内容的人最关心的变量，能直接换算成「我一个月省多少钱」，实用性极强。","heat":"中高","tags":["OpenAI","AI成本","选型","降价"],"facts":["OpenAI下调GPT-5.6价格：入门款Luna输入从每百万token 1美元降至0.2美元，输出从6美元降至1.2美元，降幅80%（量子位 2026-08-01；腾讯研究院AI速递 2026-08-03，两来源一致）","主力款Terra降价20%，输入每百万token 2美元、输出12美元（量子位 2026-08-01；腾讯研究院AI速递 2026-08-03，两来源一致）","旗舰款Sol维持原价，新增Fast mode，速度最高达标准模式的2.5倍（两来源一致）","待核实且存在来源冲突：Fast mode 是否额外收费两家说法不一，腾讯研究院称「价格翻倍」，量子位称「不额外收费」，口播稿中不采用这一条","待核实：「OpenAI称Sol参与优化自身生产系统，重写GPU Kernel使服务成本降20%」仅见于单一来源","对照参考：DeepSeek-V4-Flash 正式版定价为每百万输入token 1元、输出2元，采用MIT许可证开源权重，284B总参数、13B激活的MoE架构，支持1M上下文（前瞻网 2026-08-03；Artificial Analysis 与 Hugging Face 数据 2026-08-01）"],"scripts":[{"angle":"成本账","text":"OpenAI这轮降价，算成实际的钱是这样。GPT-5.6入门款Luna，输入价格从每百万token一美元降到零点二美元，输出从六美元降到一点二美元，整整砍掉八成。主力款Terra降20%，输入两美元、输出十二美元。旗舰款Sol价格不动，但加了个快速模式，速度最高到标准模式的2.5倍。换算一下。假设你做批量内容，每天喂进去五十万token、产出十万token，用Luna的话，降价前每天大约一点一美元，降价后大约零点二二美元，一个月从三十三美元降到不到七美元。量小的时候这个差距不明显，一旦上量，省下的是实打实的现金流。真正的意义在于，以前因为成本不敢跑的批量任务，现在可以跑了。"},{"angle":"干货直给","text":"GPT-5.6价格表更新，三档记清楚。入门款Luna，输入每百万token零点二美元，输出一点二美元，比之前降80%，适合跑量大、对质量要求没那么极致的活，比如批量改写、结构化抽取、初稿生成。主力款Terra，输入两美元、输出十二美元，降20%，日常主力，复杂一点的推理和长文交给它。旗舰款Sol，价格不变，新增快速模式，速度最高达标准模式的2.5倍，适合对延迟敏感的交互场景。选型逻辑很简单，先用最便宜的那档跑通流程，跑通之后再判断哪一步真的需要往上换档。大部分人的实际情况是，八成的任务用入门款就够，剩下两成才值得上主力款，别一上来全用旗舰。"},{"angle":"横向对比","text":"把这轮降价放到全球价格表里看更清楚。GPT-5.6入门款Luna降到输入每百万token零点二美元、输出一点二美元。国内这边，DeepSeek V4-Flash正式版的定价是输入每百万token一元、输出两元，而且是MIT许可证开源权重，你可以直接下载自己部署。换算成同一口径，国产开源模型在低价档上依然占优，而且多了本地部署这个选项，数据不出内网。差异在哪。海外闭源胜在生态成熟、接口稳定、文档齐全，国产开源胜在便宜、可控、能改。做选择的时候看两件事，一是数据能不能出去，不能出去就只能选可本地部署的，二是量有多大，量小时候差价可以忽略，量一上来价格就是决定性因素。"}]},{"id":"ai5","title":"AI生成的东西算谁的，国家层面给了时间表","hook":"AI生成的内容到底受不受保护，这次官方规划里给了方向。","why":"所有用AI做内容的人迟早会撞上版权问题，官方定调既有权威性又有讨论空间，适合做严肃向的立场内容。","heat":"中高","tags":["AI版权","政策","知识产权","创作者"],"facts":["国务院2026年7月27日印发《知识产权保护和运用「十五五」规划》（国发〔2026〕30号）（中国政府网 gov.cn 2026-07；央视 2026-08-01）","规划原文：完善算法、人工智能生成物以及与平台经济发展相关的知识产权保护规则；探索构建数据知识产权保护规则；加强开源知识产权协议规则研究，支持建设国内开源社区（中国政府网原文）","规划原文：完善网络出版、网络视听、网络文艺等领域版权保护制度和交易规则（中国政府网原文）","央视解读点出三个待解问题：人工智能生成内容是否能够获得知识产权保护、人工智能训练过程中使用的数据是否需要获得授权、人工智能生成侵权内容后的责任如何划分（央视 2026-08-01）","目标：到2030年知识产权综合实力和国际竞争力进一步增强，到2035年知识产权强国基本建成；设6项预期性指标，含每万人口高价值发明专利拥有量大于22件（中国政府网 2026-07；央视 2026-08-01）","规划提出实施「知识产权与人工智能双向赋能工程」，从知识产权促进人工智能技术创新、强化人工智能技术在知识产权领域应用两方面提出举措（中国政府网 2026-07；央视 2026-08-01）","面向国际：深入研究和参与人工智能、大数据、绿色低碳等新兴领域知识产权国际规则和标准制定（中国政府网 2026-07）","注：本条选题的政策原文已在中国政府网核对，属官方一手来源，并有央视报道交叉印证"],"scripts":[{"angle":"政策解读","text":"国务院7月27号印发了知识产权保护和运用十五五规划，里面有几句和做AI内容的人直接相关。原文写的是，完善算法、人工智能生成物以及与平台经济发展相关的知识产权保护规则，探索构建数据知识产权保护规则，加强开源知识产权协议规则研究，支持建设国内开源社区。另外还提到完善网络出版、网络视听、网络文艺等领域的版权保护制度和交易规则。翻译成人话，三个悬了很久的问题被正式摆上桌，AI生成的内容能不能受保护，训练数据要不要授权，AI生成了侵权内容责任算谁的。规划给的是五年周期，到2030年是第一个节点。现在这些问题还没有终局答案，但方向定了，不是一刀切禁止，是建规则。"},{"angle":"说人话版","text":"用AI做内容的人，早晚要问一个问题，我用AI生成的东西算不算我的。现在这个问题有了官方回应的方向。国务院印发的知识产权十五五规划里明确要完善算法和人工智能生成物的知识产权保护规则。央视的解读把三个具体难题拎了出来，AI生成的内容能不能获得知识产权保护，AI训练用的数据需不需要授权，AI生成侵权内容之后责任怎么划分。这三个问题现在都没有标准答案，但被写进国家级规划意味着未来五年会陆续有规则落地。对个人创作者的现实建议就两条。一，保留创作过程记录，你的提示词、修改痕迹、二次加工都是主张权利的证据。二，别拿明显有版权的素材去喂模型，规则落地之后这类风险最先暴露。"},{"angle":"创作者视角","text":"这份规划里有一条被讨论得少但很重要，加强开源知识产权协议规则研究，支持建设国内开源社区。为什么这条对创作者重要。因为现在国产模型的主流打法就是开源，你能免费下载下来自己跑，靠的就是许可证。许可证的规则如果不清晰，商用的时候就有隐患，用开源模型生成的内容拿去卖，会不会被追诉，取决于协议怎么写、法律怎么认。这条被写进国家规划，说明这个问题被看见了。同一份文件还提到要参与人工智能领域知识产权国际规则和标准的制定。往前看，做AI内容的人要习惯两件事，一是保留自己的创作痕迹，二是搞清楚你用的模型和素材各自是什么授权。这两件事以后会越来越像基本功。"}]}]}]}}</script>

<script>
/* ================= data ================= */
var K={st:'wb_kb_status_v1',rf:'wb_kb_refs_v1',hs:'wb_kb_history_v1',mt:'wb_kb_meta_v1'};
var PACK_TODAY=JSON.parse(document.getElementById('packToday').textContent);
var PACK_HIST=JSON.parse(document.getElementById('packHistory').textContent);
var ST={},RF=[],HS={},MT={};
var curDate=PACK_TODAY.date,curTrack='all',curSt='all',curPane='today';
var STATES=['new','pick','shot','pub'];
var ST_LABEL={new:'未处理',pick:'已选用',shot:'已拍',pub:'已发'};
var ST_CLS={new:'st-new',pick:'st-pick',shot:'st-shot',pub:'st-pub'};

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('存储写入失败，建议先导出备份');return false}}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return n<10?'0'+n:''+n}
function daysBetween(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function wc(s){return (s||'').replace(/\s/g,'').length}
function secOf(s){return Math.round(wc(s)/300*60)}

function boot(){
  ST=lsGet(K.st,{});RF=lsGet(K.rf,[]);HS=lsGet(K.hs,{});MT=lsGet(K.mt,{});
  for(var d in PACK_HIST){if(!HS[d])HS[d]=PACK_HIST[d]}
  HS[PACK_TODAY.date]=PACK_TODAY;
  var keys=Object.keys(HS).sort().reverse();
  if(keys.length>30){keys.slice(30).forEach(function(k){delete HS[k]})}
  lsSet(K.hs,HS);
  curDate=PACK_TODAY.date;
  renderAll();
  checkTip();
}
function packOf(d){return HS[d]||PACK_TODAY}
function allScripts(d){
  var p=packOf(d),out=[];
  (p.tracks||[]).forEach(function(tk){(tk.topics||[]).forEach(function(tp,ti){(tp.scripts||[]).forEach(function(sc,si){
    out.push({id:d+'|'+tk.id+'|'+tp.id+'|'+si,date:d,trackId:tk.id,trackName:tk.name,topic:tp,topicIdx:ti,sc:sc,si:si});
  })})});
  return out;
}
function stOf(id){return (ST[id]&&ST[id].s)||'new'}
function stTs(id){return (ST[id]&&ST[id].t)||null}
function setSt(id,s){
  if(s==='new'){delete ST[id]}else{ST[id]={s:s,t:today()}}
  lsSet(K.st,ST);renderAll();checkTip();
}

/* ================= today ================= */
function buildTodo(){
  var td=today(),items=[];
  Object.keys(HS).sort().reverse().forEach(function(d){
    allScripts(d).forEach(function(x){
      var s=stOf(x.id),t=stTs(x.id);
      if(s==='pub')return;
      if(s==='new'){
        if(d===PACK_TODAY.date)items.push({x:x,kind:'new',od:false,msg:'今天新出的稿，还没看'});
        return;
      }
      var age=t?daysBetween(t,td):0;
      if(s==='pick')items.push({x:x,kind:'pick',od:age>=1,msg:age>=1?('选用了 '+age+' 天还没拍'):'今天选用，等拍'});
      if(s==='shot')items.push({x:x,kind:'shot',od:age>=1,msg:age>=1?('拍完 '+age+' 天还没发'):'今天拍完，等发'});
    })
  });
  items.sort(function(a,b){
    if(a.od!==b.od)return a.od?-1:1;
    var o={shot:0,pick:1,new:2};return o[a.kind]-o[b.kind];
  });
  return items;
}
function renderToday(){
  var items=buildTodo(),od=items.filter(function(i){return i.od});
  var td=PACK_TODAY.date,all=allScripts(td);
  var cnt={new:0,pick:0,shot:0,pub:0};
  all.forEach(function(x){cnt[stOf(x.id)]++});
  var pubAll=0;Object.keys(HS).forEach(function(d){allScripts(d).forEach(function(x){if(stOf(x.id)==='pub')pubAll++})});

  document.getElementById('stats').innerHTML=
    st('今日新稿',all.length,'')+st('待拍',cnt.pick,'')+st('逾期',od.length,'od')+st('累计已发',pubAll,'dn');

  var show=items.slice(0,8);
  document.getElementById('todayN').textContent=items.length?(items.length+' 项待办'):'全部清空';
  document.getElementById('tlist').innerHTML=show.length?show.map(function(i){
    var nx=i.kind==='new'?'pick':(i.kind==='pick'?'shot':'pub');
    var lb=i.kind==='new'?'选用':(i.kind==='pick'?'标已拍':'标已发');
    return '<div class="titem'+(i.od?' od':'')+'">'+
      '<div class="bd"><div class="t">'+esc(i.x.topic.title)+'　·　'+esc(i.x.sc.angle)+'</div>'+
      '<div class="m">'+(i.x.date!==PACK_TODAY.date?('['+i.x.date+'] '):'')+esc(i.msg)+'</div></div>'+
      '<button class="go" onclick="setSt(\''+i.x.id+'\',\''+nx+'\')">'+lb+'</button></div>';
  }).join('')+(items.length>8?'<div style="text-align:center;font-size:12px;color:var(--text3);padding-top:4px">还有 '+(items.length-8)+' 项，去口播稿库看全部</div>':'')
  :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>今天没有待办，去选题池挑几条</div>';

  document.getElementById('navBdg').style.display=od.length?'':'none';
  document.getElementById('navBdg').textContent=od.length;

  var p=PACK_TODAY;
  document.getElementById('ovCnt').textContent=p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题 / '+all.length+' 稿';
  document.getElementById('overview').innerHTML=p.tracks.map(function(tk){
    return '<div class="card tk-'+tk.id+'" style="margin-bottom:12px;padding:13px 14px">'+
      '<div style="font-weight:700;font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--'+(tk.id==='travel'?'travel':'ai')+')"></span>'+esc(tk.name)+
      '<span style="margin-left:auto;font-size:11.5px;color:var(--text3);font-weight:600">'+tk.topics.length+' 条</span></div>'+
      tk.topics.map(function(tp,i){
        var done=tp.scripts.filter(function(_,si){return stOf(td+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
        return '<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.5">'+
          '<span style="color:var(--text3);font-weight:700;font-variant-numeric:tabular-nums;flex:none">'+(i+1)+'</span>'+
          '<span style="flex:1;min-width:0">'+esc(tp.title)+'</span>'+
          '<span style="flex:none;font-size:11px;color:'+(done?'var(--ok)':'var(--text3)')+';font-weight:700">'+done+'/'+tp.scripts.length+'</span></div>';
      }).join('')+'</div>';
  }).join('');
}
function st(l,v,c){return '<div class="stat '+c+'"><b>'+v+'</b><span>'+l+'</span></div>'}

/* ================= topics ================= */
function renderTracks(){
  var p=packOf(curDate);
  var h='<button class="ttab'+(curTrack==='all'?' on':'')+'" data-k="all" onclick="setTrack(\'all\')">全部<span class="s">'+
    p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题</span></button>';
  p.tracks.forEach(function(tk){
    h+='<button class="ttab'+(curTrack===tk.id?' on':'')+'" data-k="'+tk.id+'" onclick="setTrack(\''+tk.id+'\')">'+esc(tk.name)+'<span class="s">'+tk.topics.length+' 选题</span></button>';
  });
  document.getElementById('ttabs1').innerHTML=h;
  document.getElementById('ttabs2').innerHTML=h;
  var f=[['all','全部'],['new','未处理'],['pick','已选用'],['shot','已拍'],['pub','已发']];
  document.getElementById('stfilter').innerHTML=f.map(function(x){
    return '<button class="ttab'+(curSt===x[0]?' on':'')+'" data-k="all" style="font-size:12.5px;padding:8px 4px;min-height:40px" onclick="setStF(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function setTrack(t){curTrack=t;renderTracks();renderTopics();renderScripts()}
function setStF(s){curSt=s;renderTracks();renderScripts()}
function renderTopics(){
  var p=packOf(curDate),h='';
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    h+='<div class="topics-grid">'+tk.topics.map(function(tp,i){
      var fid=tk.id+'_'+tp.id;
      var done=tp.scripts.filter(function(_,si){return stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
      return '<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main">'+
        '<div class="tp-t">'+esc(tp.title)+'</div>'+
        '<div class="tp-tags"><span class="tag hot">热度 '+esc(tp.heat)+'</span>'+
        (tp.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
        '<span class="tag">'+done+'/'+tp.scripts.length+' 已处理</span></div>'+
        '<div class="tp-why"><b>开场钩子：</b>'+esc(tp.hook)+'<br><b>为什么今天做：</b>'+esc(tp.why)+'</div>'+
        '</div></div>'+
        '<div class="fold"><button class="fold-b" onclick="fold(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>事实与数据（'+(tp.facts||[]).length+' 条，念之前先扫一眼）</button>'+
        '<div class="fold-c"><ul class="facts">'+(tp.facts||[]).map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div></div>'+
        '<div class="scripts">'+tp.scripts.map(function(sc,si){return scHtml(tk,tp,sc,si)}).join('')+'</div>'+
        '</div>';
    }).join('')+'</div>';
  });
  document.getElementById('topicList').innerHTML=h||'<div class="card"><div class="empty">这天没有内容</div></div>';
}
function scHtml(tk,tp,sc,si){
  var id=curDate+'|'+tk.id+'|'+tp.id+'|'+si,s=stOf(id),n=wc(sc.text),sec=secOf(sc.text);
  var nx=s==='new'?'pick':(s==='pick'?'shot':(s==='shot'?'pub':'new'));
  var nxL=s==='new'?'选用':(s==='pick'?'标已拍':(s==='shot'?'标已发':'重置'));
  var t=stTs(id),od=(s==='pick'||s==='shot')&&t&&daysBetween(t,today())>=1;
  return '<div class="sc">'+
    '<div class="sc-hd"><span class="sc-a">'+esc(sc.angle)+'</span>'+
    '<span class="sc-m">'+n+' 字 · 约 '+sec+' 秒</span>'+
    '<span class="sc-st '+ST_CLS[s]+'">'+ST_LABEL[s]+(od?' · 逾期':'')+'</span></div>'+
    '<div class="sc-tx" onclick="this.classList.toggle(\'open\')">'+esc(sc.text)+'</div>'+
    '<div class="sc-acts">'+
    '<button class="sbtn pri" onclick="copy(this,'+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>'+
    '<button class="sbtn" onclick="openTele('+q(tp.title+' · '+sc.angle)+','+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M6 8h12M6 12h8"/></svg>念稿</button>'+
    '<button class="sbtn '+(od?'od':(s==='pub'?'act':''))+'" onclick="setSt(\''+id+'\',\''+nx+'\')">'+nxL+'</button>'+
    (s!=='new'?'<button class="sbtn" onclick="setSt(\''+id+'\',\'new\')">撤销</button>':'')+
    '</div></div>';
}
function q(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')+"'"}
function fold(b){b.classList.toggle('open');b.nextElementSibling.classList.toggle('open')}

function renderScripts(){
  var p=packOf(curDate),h='',n=0;
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    tk.topics.forEach(function(tp,i){
      var list=tp.scripts.map(function(sc,si){return {sc:sc,si:si}}).filter(function(o){
        return curSt==='all'||stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+o.si)===curSt;
      });
      if(!list.length)return;
      n+=list.length;
      h+='<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd" style="padding-bottom:0"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main"><div class="tp-t" style="font-size:14.5px">'+esc(tp.title)+'</div></div></div>'+
        '<div class="scripts" style="border-top:none;margin-top:11px">'+list.map(function(o){return scHtml(tk,tp,o.sc,o.si)}).join('')+'</div></div>';
    });
  });
  document.getElementById('scriptList').innerHTML=h||'<div class="card"><div class="empty">没有符合筛选的稿子</div></div>';
}

/* ================= refs ================= */
var rStar=4;
function renderStars(){
  document.getElementById('rStars').innerHTML=[1,2,3,4,5].map(function(i){
    return '<button class="star'+(i<=rStar?' on':'')+'" onclick="rStar='+i+';renderStars()"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.8.9-5 4.7 1.3 6.8L12 17.4 6 20.7l1.3-6.8-5-4.7 6.8-.9z"/></svg></button>';
  }).join('');
}
function addRef(){
  var t=document.getElementById('rTitle').value.trim();
  if(!t){toast('标题得填一下');return}
  RF.unshift({id:'r'+Date.now(),title:t,track:document.getElementById('rTrack').value,
    author:document.getElementById('rAuthor').value.trim(),link:document.getElementById('rLink').value.trim(),
    star:rStar,note:document.getElementById('rNote').value.trim(),date:today()});
  lsSet(K.rf,RF);
  ['rTitle','rAuthor','rLink','rNote'].forEach(function(i){document.getElementById(i).value=''});
  rStar=4;renderStars();renderRefs();toast('已存进灵感库');checkTip();
}
function delRef(id){RF=RF.filter(function(r){return r.id!==id});lsSet(K.rf,RF);renderRefs()}
function renderRefs(){
  document.getElementById('refCnt').textContent=RF.length+' 条';
  var TN={travel:'旅游攻略',ai:'AI 资讯与玩法',other:'其他'};
  document.getElementById('refList').innerHTML=RF.length?RF.map(function(r){
    return '<div class="ref"><div class="ref-h"><div style="flex:1;min-width:0">'+
      '<div class="ref-t">'+esc(r.title)+'</div>'+
      '<div class="ref-m"><span class="tag">'+esc(TN[r.track]||r.track)+'</span>'+
      (r.author?'<span>@'+esc(r.author)+'</span>':'')+
      '<span style="color:#f5a623;letter-spacing:1px">'+'★'.repeat(r.star)+'<span style="color:#dfe3e8">'+'★'.repeat(5-r.star)+'</span></span>'+
      '<span>'+esc(r.date)+'</span></div>'+
      (r.note?'<div class="ref-n">'+esc(r.note)+'</div>':'')+
      (r.link?'<a class="ref-l" href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.link)+'</a>':'')+
      '</div><button class="xbtn" onclick="delRef(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>';
  }).join(''):'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>刷到好片子就存一条，做选题时翻一翻</div>';
}

/* ================= teleprompter ================= */
var teleSize=26,rolling=false,rollT=null,spd=1;
function openTele(t,x){
  document.getElementById('teleTitle').textContent=t;
  document.getElementById('teleTx').textContent=x;
  document.getElementById('teleBd').scrollTop=0;
  document.getElementById('tele').classList.add('on');
  document.body.style.overflow='hidden';
}
