月1号省下的，够你多玩一个景点。"}]},{"id":"tv3","title":"返程避坑：为什么10月6、7号最贵，怎么买能省一半","hook":"回程票比去程贵一倍，很多人是临时改签多花近千元。","why":"返程是绝大多数人还没处理的环节，且10/6-7是全年价格峰值。讲清『为什么贵+怎么错峰』，实用且能直接省钱。","heat":"高","tags":["避坑","省钱","返程"],"facts":["返程溢价突出：乌鲁木齐飞北京10/6达2550元，北京飞成都10/5-7为1005/1270/1590元（中华网 2026-09-23）","中秋国庆仅隔3个工作日，去程需求可分散到多个日期，返程对工作恢复人群日期选择空间小，故末尾冲高（东航山西分公司，太原文旅局 2026-09-24）","业内人士建议：返程尽量避开最后两天（10/6-7），优先选10/4-5错峰，或10/8返程票价腰斩（诚意国旅/新华网财经）","上海飞乌鲁木齐：10/5返程2200元，远低于10/7的3280元（重庆日报 2026-09-23）","10/3后下跌主要在去程方向，返程舱位紧张临期基本不甩卖（民航业，太原文旅局 2026-09-24）"],"scripts":[{"angle":"干货直给","text":"回程票比去程贵一倍，这话今年不是夸张。乌鲁木齐飞北京，中秋到国庆前600到700，10月6号直接2550；北京飞成都，10月5、6、7号分别1005、1270、1590，而国庆当天去程才1100。为什么返程这么狠？中秋国庆只隔三天，去程能摊到中秋前后和9月30、10月1多个日子，返程的人要赶着10月8号前回去上班，日期挤在最后两天，舱位一下被抢空。所以返程省钱就一条：别选10月6、7号。能请假的把返程放在10月4、5号，实在不行10月8号回，价格直接腰斩。上海飞乌鲁木齐，10月5号2200，10月7号3280，差出一千多。"},{"angle":"避坑清单","text":"返程买票五条避坑，照着核对。第一，绝对避开10月6、7号，这是全年价格峰值，乌鲁木齐飞北京2550、北京飞成都1590，临时改签多花近千元的人一大把。第二，返程优先选10月4、5号，比末尾便宜三到五成。第三，10月8号回程票价腰斩，能多请一天假就省一大笔。第四，别赌临期甩卖，民航业内明确说返程舱位紧张、临近假期基本不降价。第五，去程和返程分开看，10月3号后下跌主要在去程方向，返程该贵还是贵。把返程日期提前或推后两天，整趟行程能省出一顿好的。把这五条存进备忘录，订返程前过一遍，至少能省出两顿饭钱。"},{"angle":"横向对比","text":"同样一段返程，选不同日子差价能到一倍。拿北京飞成都举例：10月5号1005、6号1270、7号1590，而如果你推到10月8号，价格直接砍半。乌鲁木齐飞北京更夸张，10月6号2550，节前才600多。上海飞乌鲁木齐，10月5号返程2200，10月7号3280。规律很清楚，返程峰值就是最后两天，因为中秋国庆只隔三天，大家返岗日期高度重叠。对比之下，去程反而灵活，10月3、4号还能捡漏。所以策略是反着来：去程可以晚走捡便宜，返程必须早回或晚回，千万别卡在10月6、7号。一句话，返程票的价格由你的日期决定，挪开最后两天，省下的就是实打实的。"}]},{"id":"tv4","title":"免签再扩容，出入境新规9月15已生效，出境前先看这条","hook":"中国免签国又多了，但9月15起一条新规专门卡弄虚作假。","why":"免签扩至50国+57国过境是长效热点；9/15生效的国务院令841号是新增避坑点，出境游前必看，收藏率高。","heat":"中高","tags":["避坑","出境","收藏向"],"facts":["中国已对50国实施单方面免签、57国实施240小时过境免签（国家移民管理局，中工网 2026-09-09）","俄罗斯持普通护照免签施行至2027年12月31日；其余48国单方面免签至2026年12月31日；文莱无限期（中国签证申请服务中心，2026）","9/15起国务院令第841号生效：加强虚假材料与邀请函审查，提供虚假材料可禁入1至5年；中介须备案，个人提供虚假邀请函罚5000-10000元（thetourisminternational.com 引国务院令）","入境免签停留30天按『入境次日起连续30个自然日』计算，来华须持有效普通护照（国家移民管理局常见问答）","2026上半年入境外国人2291.4万人次同比+20.4%，免签入境1781.5万同比+30.6%（国家移民管理局，中工网 2026-09-09）"],"scripts":[{"angle":"干货直给","text":"出境前这条一定看。中国免签现在覆盖50个单方面免签国，加上57个240小时过境免签国，朋友圈里常提的新马泰、日韩、欧洲多国基本都在这张网里。俄罗斯免签施行到2027年底，其余48国到2026年底，文莱无限期。但9月15号起有个新规要小心：国务院令841号生效，重点查虚假材料和邀请函，谁提供虚假材料，可能被禁入1到5年；个人开假邀请函罚5000到1万，中介还要备案。停留天数按入境第二天起算连续30个自然日，不是按自然月。出发前一周去目的国官方渠道或中国领事服务网核一遍，两分钟，能省掉一趟白跑。"},{"angle":"避坑清单","text":"出境避坑五条，出发前逐条核对。第一，免签天数记住，新马泰等30天、俄罗斯到2027年底，按入境次日起连续30个自然日算。第二，免签不等于免审查，边检仍要看回程机票、住宿和资金，材料不齐照样拦。第三，9月15号起新规生效，别找野鸡中介办假邀请函，个人罚5000到1万、提供虚假材料可能禁入1到5年。第四，护照有效期要够，多数国家要求剩余六个月以上。第五，政策动态变，以目的国官方和中国领事服务网为准。价格参考：重庆直飞曼谷、吉隆坡、新加坡单程含税低至723元。把这几条核对完再订票，出境的坑多半出在材料和时间上，提前一天比临时补救强十倍。"},{"angle":"说人话版","text":"说人话解释免签和那条新规。免签就是你不用提前去大使馆交材料交钱，拿护照买票就能飞；落地那一关还在，边检要看你来干嘛、住哪、啥时候走、带多少钱，答不上来一样退回去。所以免签省的是出发前的时间，不是入境审查。现在免签国已经扩到50个单方面免签加57个过境免签，覆盖面很大。但9月15号生效的新规是给弄虚作假的人上的紧箍咒：假材料、假邀请函，查到轻则罚款重则禁入1到5年。正常出行完全不受影响，该带的材料带齐，别走捷径就行。入境停留30天从落地第二天算，不是买票那天。别被「免签」两个字放松警惕，材料齐全、日期算对，才是顺顺利利出境的底气。"}]},{"id":"tv5","title":"国庆去哪赏秋？气象局9月22发布全国赏秋指南","hook":"国庆不用人挤人，气象局直接给了19省25个赏秋坐标。","why":"国庆期间正好是秋色黄金期，气象局指南是权威来源、长效不过期，且覆盖南北多种玩法，适合做『去哪玩』合集。","heat":"中高","tags":["赏秋","目的地","长效"],"facts":["中国气象局9/22发布全国赏秋指南，覆盖19省(区/市)25个市县：阿尔山、克什克腾、长白山、伊春、布尔津、金塔、额济纳、神农架、婺源、龙胜等（中国气象局 2026-09-22）","2026阿尔山秋色较往年提前7-10天，9月中下旬进彩林高峰，10月上旬看晚秋森林+温泉（当地气象研判）","同程数据：9月以来『赏秋』搜索热度明显上涨，黑龙江秋游产品搜索同比+121%，伊春、大兴安岭进热门榜（同程旅行）","额济纳胡杨林9/28-10/15约20天窗口，国庆为最高峰；喀纳斯、禾木黄金期9/20-10/5（公开秋色实况）","气象局提示：秋色受气温影响每年不同，出发前需确认红叶/彩林指数、景区开放、天气与客流（中国气象局 2026-09-22）"],"scripts":[{"angle":"干货直给","text":"国庆去哪看秋天，气象局直接给了答案。9月22号中国气象局发布全国赏秋指南，覆盖19个省份25个市县，名单里有阿尔山、克什克腾、长白山、伊春、布尔津、金塔、额济纳、神农架、婺源、龙胜。北方秋色已经铺开了，今年阿尔山比往年提前7到10天，9月中下旬就进彩林高峰。想看胡杨的去额济纳，9月28到10月15号约20天窗口，国庆正好是最盛的时候；想看白桦和雪山的去喀纳斯、禾木，黄金期9月20到10月5号。同程数据，9月以来赏秋搜索明显涨，黑龙江秋游搜索同比涨121%。出发前一定看当地红叶指数和天气，别跑空。"},{"angle":"横向对比","text":"国庆赏秋按喜好分四拨，别只盯着一个网红地。想看金色森林，阿尔山、伊春、长白山，关键词白桦林、彩林、湖泊，阿尔山今年提前7到10天。想看雪山加秋色，布尔津、喀纳斯、禾木，白桦黄了、湖水蓝着、远处雪山，10月5号前是窗口。想看山岳红叶，神农架、松潘，山林分层变色，交通比新疆方便。想看中国式秋天，婺源晒秋、龙胜梯田，徽派古村配金黄稻谷，南方人不用往北跑。想看西北胡杨，金塔、额济纳，荒漠配蓝天。不同地方变色时间差一周都很正常，出门前查实时叶况比看攻略靠谱。选对了地方和时段，国庆也能避开人海，秋色这东西，错过这波就得等明年。"},{"angle":"趋势判断","text":"从气象局这份赏秋指南能看出一个趋势：秋天的流量正在从热门古城往自然目的地转移。指南列了19省25市县，几乎全是森林、胡杨、彩林、梯田这类季节性景观，没有一个是传统打卡古城。数据也印证，同程说9月以来赏秋搜索明显上涨，黑龙江秋游同比涨121%。原因有两点：一是国庆期间古城人挤人，自然景观空间大、体验好；二是秋色窗口极短，额济纳就20天、阿尔山提前了7到10天，稀缺感强。对做内容的人来说，每年9到11月是赏秋流量的稳定红利期，按气象局名单做分省合集，能反复吃。抓住这份指南里的分省清单，每年秋天都能稳定产出一波应景内容，流量不靠碰运气。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"小米MiMo-V2.6开源登顶国产第一，全模态还白菜价","hook":"国产大模型又拿了个第一，这次是小米的。","why":"9/22刚发布，权威榜单Artificial Analysis确认国产第一，全模态+极致性价比，泛人群爱听『国产逆袭』，信息密度高。","heat":"高","tags":["强时效","国产","泛人群"],"facts":["9/22小米发布并开源MiMo-V2.6系列（Pro/Flash），支持图片、视频、音频、文本全模态输入（小米/发展北京 2026-09-22）","MiMo-V2.6-Pro在Artificial Analysis智能评分超Qwen3.8 Max、GLM-5.3(max)、Kimi K3(max)，暂列开源模型第一、国产第一（截至9/22，Artificial Analysis榜单）","定价：Flash输入1元/输出2元每百万词元，Pro 3元/6元，提供99%缓存折扣；相近智能下价格仅海外模型1/20-1/60（小米，Artificial Analysis）","小米称探索递归自我改进(RSI)路径，规模化扩展强化学习算力（小米官方）","已用于小米内部新材料研发，协助筛选PFAS吸附用MOF材料设计方案（小米，发展北京 2026-09-22）"],"scripts":[{"angle":"干货直给","text":"国产大模型又拿了个第一，这次是小米。9月22号小米开源了MiMo-V2.6系列，分Pro和Flash两款，能同时吃图片、视频、音频和文本，是全模态。关键是榜单表现：在Artificial Analysis这个权威榜上，Pro版的智能评分超过了Qwen3.8 Max、GLM-5.3和Kimi K3，暂列开源模型第一、国产第一。价格更狠，Flash输入每百万词元1块、输出2块，Pro是3块和6块，还给了99%的缓存折扣，同样智能水平下价格只有海外模型的几十分之一。小米说这是在走递归自我改进的路线，靠强化学习算力把模型越练越强。已经拿去内部研发新材料用了。"},{"angle":"数据向","text":"把小米这次开源的数字摆一摆。9月22号发布MiMo-V2.6系列，支持图、视频、音频、文本全模态输入。榜单上，Pro版在Artificial Analysis的智能评分压过了Qwen3.8 Max、GLM-5.3和Kimi K3，截至9月22号排开源第一、国产第一。价格：Flash输入1元输出2元每百万词元，Pro 3元6元，99%缓存折扣，相近智能下比海外模型便宜20到60倍。技术上小米走的是递归自我改进，把强化学习算力规模化。落地也已经发生，小米内部用它筛选用MOF材料吸附PFAS污染物的设计方案。一个消费电子公司把开源大模型做到这个位置，说明国产模型的竞争已经卷到全模态和性价比两线了。"},{"angle":"趋势判断","text":"小米MiMo-V2.6登顶国产第一，背后是三个信号。第一，国产大模型的第一梯队在快速换人，上个月还是Qwen、GLM、Kimi轮流坐庄，这个月小米凭全模态和性价比冲上来，说明榜单不是谁大谁赢，是谁更会平衡性能和价格。第二，竞争维度从纯能力转向性价比，Flash输入1元、Pro 99%缓存折扣，把推理成本压到海外模型的几十分之一，这会直接拉动开发者迁移。第三，手机厂商做开源模型成了新路线，小米、华为都在走，目标是把模型塞进自己的硬件生态。对普通人来说，国产模型越卷越便宜，长期看AI服务的价格还会往下走。"}]},{"id":"ai2","title":"DeepSeek V4.1-Flash：缓存命中价打到0.02元，显存砍掉3/4","hook":"模型能力在涨，价格却被打到接近白送。","why":"9/10发布，硬核技术+白菜价双杀，对做内容和用API的人直接有用，且多源交叉验证。","heat":"高","tags":["成本","技术","国产"],"facts":["9/10 DeepSeek发布V4.1-Flash：552B参数MoE，输入激活8B/输出激活16B，Causal-Encoder-Decoder结构，原生多模态（DeepSeek官方；Local AI Zone；CSDN周报 2026-09）","KV Cache对HBM需求降至上一代1/4、对SSD降至1/8；100K-token Agent会话KV缓存从约40GB降到约10GB（DeepSeek官方；Local AI Zone）","缓存命中输入价降至0.02元/百万tokens（较此前降60%），约合0.003美元；输出4元/百万tokens（DeepSeek；CSDN周报）","Terminal-Bench 2.1得分90.6，MIT许可全开放权重无营收条款（社区测试；Local AI Zone）","自9/14起V4-Pro请求自动路由至V4.1-Flash并按新价计费（DeepSeek）"],"scripts":[{"angle":"干货直给","text":"DeepSeek又出招了，这次是把价格打穿。9月10号发布的V4.1-Flash，5520亿参数的MoE，输入只激活80亿、输出160亿，用了一种非对称的新结构，还原生支持看图。最狠的是两件事：一是显存占用砍掉四分之三，一个10万token的Agent对话，KV缓存从40G掉到10G，意味着以前跑不起长对话的显卡现在能跑了；二是缓存命中输入价压到0.02元每百万token，比之前降60%，约合0.003美元。性能没缩水，Terminal-Bench 2.1拿了90.6分，还全开源、MIT许可随便商用。自9月14号起，老版V4-Pro的请求自动切到这个新模型按新价算。"},{"angle":"说人话版","text":"用大白话讲DeepSeek这次更新到底牛在哪。第一，它更省显存了，以前跑一个长对话，模型要把前面所有内容临时存在显存里，10万字的对话要占40G，现在只要10G，普通显卡也能扛，成本直接下来。第二，它更便宜了，你问过的问题再问一遍，缓存命中价0.02元每百万字，差不多白送，输出也才4元。第三，它能看图了，原生多模态，不再需要额外接口。第四，全开源、MIT许可，商用随便用不收过路费。对普通人的意义很直接：用DeepSeek做事的成本又降了一截，同样的钱能干更多活，做内容、写代码都更划算。"},{"angle":"成本账","text":"算一笔账你就知道这次降价多狠。DeepSeek V4.1-Flash，缓存命中输入价0.02元每百万token，输出4元。对比海外模型，GPT-6 Astra输入10美元输出50美元每百万token，价差三个数量级。就算比国内同行，它这个价也几乎是地板。更关键的是显存：KV缓存从40G压到10G，意味着原来需要A100集群跑的长对话，现在消费级显卡能顶上，硬件成本再砍一刀。性能没妥协，Terminal-Bench 2.1拿90.6，长任务、多步骤推理都在线。所以这次不是单纯降价，是把『能跑的门槛』和『用得起的价格』一起打下来，做AI应用的团队第一时间去测。"}]},{"id":"ai3","title":"AI视频九月大洗牌：可灵登顶全球盲测，Sora退场","hook":"老外盲测把国产视频模型投成了世界第一，Sora却关门了。","why":"对做视频带货的人直接相关——工具选型决定效率和成本。可灵登顶+ Sora退场是九月最确定的行业拐点，信息密集。","heat":"高","tags":["视频","国产","玩法"],"facts":["截至9月，Kling v3在LLM Stats盲投榜arena score 1934居首，Happy Horse 1816、Seedance 2.0 Fast 1747；Kling v3输出0.89美元/百万token（LLM Stats；jannikhansen 2026-09）","OpenAI Sora 2 整个下线：web/app版4/26关停，API 9/24关停（aibusinessweekly；makeaivideo；juduanduan 2026-09-11）","9月主流平台密集迭代：Seedance 2.5与Wan3.0把单条生成提至30秒，可灵3.0攻4K与一致性，Vidu-1.5实现多主体一致（juduanduan 2026-09-11）","高盛预计全球AI视频生成市场2030年达约290亿美元（高盛，juduanduan）","可灵Q2营收8.5亿元、ARR近5亿美元、企业客户近5万（juduanduan引Curious Refuge测试8.1/10）"],"scripts":[{"angle":"反常识开场","text":"做视频的人今年有个错觉：最好用的AI视频工具一定是美国的。九月的盲测榜把这个说法打脸了。LLM Stats做了一个盲投实验，让人不知道是哪个模型生成的情况下二选一，结果快手的可灵v3以1934分排第一，Happy Horse 1816、字节的Seedance 2.0 Fast 1747跟在后面。可灵输出价0.89美元每百万token，质量前三还便宜。另一边，OpenAI的Sora 2整个下线了，网页版4月停、API 9月24号停。所以今年做短视频，与其盯着用不了的国际模型，不如把可灵、即梦、Vidu这几个国产工具摸透，它们已经能打。"},{"angle":"数据向","text":"九月AI视频圈几个数字很说明问题。盲投榜：可灵v3 arena score 1934第一，Happy Horse 1816第二，Seedance 2.0 Fast 1747第三，这是人盲选出来的，比厂商自卖自夸可信。商用数据：可灵Q2营收8.5亿、年化的收入近5亿美元、企业客户近5万，说明不是只便宜，是真有人在付费用。行业盘子：高盛预计全球AI视频市场2030年约290亿美元，五年翻十倍。对照看，Sora 2的API在9月24号正式关停，一个曾经的标杆退场。结论很清楚，国产视频模型在质量和商业化上已经接住了这波需求。"},{"angle":"创作者视角","text":"如果你靠做视频带货，九月这波变化直接影响你的效率和成本。第一，工具该换了，Sora 2的API 9月24号关停，还守着它的人得赶紧迁移，国内可灵、即梦、Vidu都能接。第二，别只比画质，比工作流，九月各家把单条生成提到30秒、可灵攻4K和一致性、Vidu做到多主体一致，一条成片基本能在单条输出里完成，省掉拼接。第三，成本要算总账，可灵盲测第一还只要0.89美元每百万token，高盛说市场五年翻十倍，说明价格还会继续降。把省下的钱投到选题和真人出镜上，比追新模型有用。工具选对了，你的产出效率能翻倍，剩下的精力留给内容和人设，那才是能长期收租的地方。"}]},{"id":"ai4","title":"飞书8.0团队智能体上线，数字员工进了编制","hook":"AI不再只是你的私人助理，开始以『组织成员』身份上班。","why":"9/15飞书团队智能体+阿里近10万数字员工，是AI落地最直观的信号，打工人和老板都关心，破圈潜力大。","heat":"中高","tags":["智能体","办公","落地"],"facts":["9/15飞书发布8.0并推出国内首个团队智能体『豆包工作伙伴』，Agent可写文档、操作多维表格、发起审批（飞书；ima知识库 2026-09-16）","阿里9/8发布QoderWake 1.0，三个月内近10万个数字员工进入真实场景，累计执行约200万次任务（ima知识库 2026-09-08）","千问办公9/7上线『多人工作台』，百人同时在线协作；上线满月用户破3000万、企业用户过半（ima知识库）","腾讯WorkBuddy开放平台9/2发布，开放Agent底层能力，首批超百家伙伴（ima知识库；CSDN 2026-09-04）","同期苹果Siri AI开放测试、宇树发布人形机器人G1+（ima知识库 2026-09-16）"],"scripts":[{"angle":"干货直给","text":"AI上班这件事，九月从概念变成数字了。飞书9月15号发8.0，推出国内首个团队智能体『豆包工作伙伴』，它不是一个聊天机器人，而是能写文档、操作多维表格、发起审批的『组织成员』，直接进团队协作流程。阿里更早，9月8号发布QoderWake 1.0，三个月内近10万个数字员工进真实场景，累计跑了约200万次任务。千问办公9月7号上线的多人工作台，满月用户破3000万、企业用户过半。腾讯WorkBuddy开放平台9月2号就开放了Agent底层能力，首批上百伙伴。所以现在不是『要不要用AI』，是『你的数字员工编制够不够』。"},{"angle":"方法论","text":"判断AI办公靠不靠谱，看三个指标。第一，它有没有进真实业务流，还是只在演示里跑。飞书的团队智能体能写文档、操作表格、发起审批，阿里近10万数字员工累计执行200万次任务，这些是真跑出来的数字。第二，它解决的是不是高频重复的活，比如整理材料、填表、审批流转，频次够高才值得配。第三，它能不能嵌进现有工具，飞书把Agent做进协作软件、千问做进多人工作台，比让你再装一个新App落地率高得多。普通人能用的是：把自己重复三步以上的活列出来，封装成固定流程，让AI长期替你跑。别等公司统一采购，个人先把这三步跑通，你就是团队里最先用上数字员工的人。"},{"angle":"趋势判断","text":"九月这波AI办公动态，标志一个拐点：智能体从个人助理变成组织成员。以前AI是给你一个人用的，现在飞书的团队智能体能操作表格、发起审批，阿里的数字员工进真实场景跑了200万次任务，千问的多人工作台让百人在线协作。区别在于，个人助理提效个体，团队智能体改变协作方式，采购方也从个人变成有预算的企业。再往外看，苹果Siri AI开放测试、宇树发人形机器人，AI正在同时占领软件岗位和物理岗位。对打工人来说，越早学会和数字员工配合，越不会被替代。越早和数字员工搭班子，越能在下一轮组织重构里站稳，而不是被它替代。"}]},{"id":"ai5","title":"端侧AI元年：讯飞星火X2.5手机本地跑百万上下文","hook":"以后断网也能让AI读完你那本几十页的手册。","why":"9/1发布的端侧百万上下文模型是长效趋势，和每个人手里的手机相关，泛人群易懂，且避开与前面AI选题重复。","heat":"中高","tags":["端侧","趋势","泛人群"],"facts":["9/1科大讯飞词元星火开源星火X2.5-4B与1.7B，端侧模型唯一原生支持最长100万Token上下文（讯飞开放平台；gdinfo 2026-09-01；CSDN 2026-09-04）","采用混合注意力架构，围绕智能体、代码、数学、指令遵循优化，实测领先同尺寸一流开源模型（讯飞官方）","大模型加速进入手机、PC、汽车座舱、智能家居、机器人等终端设备（讯飞开放平台）","从『设备上对话』到『本地完成任务』：一份几十页手册能否一次读完提炼、多步骤任务能否本地直接完成（讯飞开放平台）","端侧小模型9月密集开源：面壁MiniCPM5-2B(9/8)、智谱GLM-5.3、腾讯混元(8/28)形成开源潮（zpedu 2026-09）"],"scripts":[{"angle":"干货直给","text":"以后AI不联网也能帮你干活了。9月1号科大讯飞开源了星火X2.5的4B和1.7B两个版本，它们是端侧模型里唯一原生支持最长100万token上下文的。什么意思？一份几十页的产品手册，手机本地就能一次读完提炼重点，不用传云端。模型用混合注意力架构，专门优化了智能体、代码、数学和指令遵循，实测在同尺寸开源模型里领先。更大的背景是大模型正加速塞进手机、电脑、车机、智能家居和机器人。讯飞的判断是从『设备上能对话』走向『本地能完成任务』，你断网、隐私数据不出本机，AI照样把多步骤的活干完。"},{"angle":"说人话版","text":"用大白话讲端侧AI是什么。以前用AI，你的话要传到远程大服务器，算完再传回来，断网就用不了，敏感内容也得出本机。端侧AI就是把小模型直接装进你手机、电脑、车机里，本地就能跑。讯飞9月1号开源的星火X2.5，4B和1.7B两个尺寸，最猛的一点是原生支持100万token上下文——你那本几十页的说明书，手机本地一次读完、帮你总结，不联网也行。它还能本地执行多步骤任务，不是只陪你聊两句。对普通人，这意味着隐私更好、离线也能用；对厂商，意味着AI功能可以嵌进每一台设备，不用每次都连云。"},{"angle":"趋势判断","text":"端侧AI这条线九月信号很密集。讯飞9月1号开源支持百万上下文的星火X2.5，紧接着面壁MiniCPM5-2B在9月8号开源，智谱GLM-5.3、腾讯混元在8月底也开源了小模型，端侧开源潮已经成型。背后的逻辑有三个：一是隐私，数据不出本机对金融、医疗、车载场景是硬需求；二是成本，云端推理按次收费，端侧一次部署长期免单；三是离线可靠，车机、机器人不能依赖信号。判断是，明年你买的手机、车、家电，会不会本地跑AI会成为新的卖点，就像当年拼摄像头像素一样。看懂这条线的人，明年换设备时会多问一句：它本地能跑AI吗？"}]}]}]},"2026-09-10":{"date":"2026-09-10","updatedAt":"2026-09-10 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月机票洼地：1.5折舱还在，但会用工具的人更省","hook":"9月机票便宜到不像话，可大部分人还在等国庆。","why":"强时效省钱，工具向实用，截图感强。九月上中旬是下半年最舒服的空档期，错过要等明年。","heat":"高","tags":["强时效","省钱","可复用"],"facts":["同程旅行特价机票榜：2026年9月从上海、杭州、北京等地前往重庆、广州、乌鲁木齐、贵阳、西安、长沙、厦门、昆明等目的地机票普遍低至1.5折至2.3折，其中上海飞重庆低至两三百元、北京飞长沙三四百元（均不含税，同程旅行/中国经济新闻网2026-09-07）","9月错峰出行机票价格比中秋国庆假期便宜三到四成，相较9月30日最高点便宜一半以上；中秋假期前酒店均价较8月下降三四成，部分度假型酒店降幅超五成（同程旅行/澎湃新闻2026-09上中旬）","9月首周机票均价较暑期高峰回落约35%，目前仍有大量1折经济舱在售（去哪儿/中国商报2026-09-02）","同程App机票口令：搜【低价机票】进省钱百宝箱、搜【囤卡99】买航司次卡、搜【人群福利】学生认证省20%、搜【领券200】领捡漏券、搜【AI智补】上传截图由AI全网比价退差价（中国经济新闻网2026-09-07）"],"scripts":[{"angle":"干货直给","text":"九月上中旬是下半年机票最舒服的空档期。同程特价机票榜显示，九月从上海、杭州、北京飞重庆、广州、乌鲁木齐、贵阳、西安、长沙、厦门、昆明，普遍低到一点五折到二点三折，上海飞重庆两三百、北京飞长沙三四百，都不含税。错峰整体比中秋国庆便宜三到四成，跟九月三十号最高点比直接腰斩。酒店更狠，中秋前均价比八月降三四成，部分度假酒店降超五成。会用的还能再省：同程App搜低价机票进省钱百宝箱，搜囤卡99买次卡，学生认证机票省两成，搜AI智补传截图让系统全网比价退差价。这一波窗口九月中下旬就收，别等。"},{"angle":"实操流程","text":"想锁定九月低价航班，按这套走。第一步，先在同程App搜【低价机票】进省钱百宝箱，把低价预约和心愿机票挂上，系统会盯着你要的航线。第二步，搜【囤卡99】买航司次卡，热门航线次卡折算下来比单买便宜一截，适合确定要去的。第三步，搜【人群福利】做学生或家庭认证，学生机票省两成、家庭退改费减一百，认证一次长期有效。第四步，下单前搜【领券200】领捡漏券，再搜【AI智补】上传别人发的航班截图，系统自动全网比价，买贵了补差价。第五步，酒店只订免费取消房型，先占位后调。九月这波洼地，工具用满比裸买再省一档。"},{"angle":"反常识开场","text":"越早订越便宜这句话，在九月是错的。九月首周机票均价比暑期高峰回落三成五，现在还有大量一折经济舱在售，可大部分人还在等国庆。原因是供需：暑期亲子潮退了，国庆还没启动，航司得清仓。但窗口很窄，九月二十四号前后价格就弹回去了。更反直觉的是，光会挑日子不够，同程的AI智补能上传别人截图自动全网比价退差价，囤卡99的次卡比单买便宜，学生认证直接省两成。所以九月省钱是两个动作叠加：选对时间，再用对工具。只做前者，你只拿到一半的便宜。 另外提醒，低价舱多数绑定不能退改，行程还没定死的先占可取消的票，等临期再补特价，别为了省几十块把灵活性搭进去。"}]},{"id":"tv2","title":"请3休13：今年最长的假不是春节，是9月底这波","hook":"今年最长的假不是春节，是9月底这一波。","why":"全民相关，转发收藏高。中秋国庆仅隔三天工作日，拼假方案价值现在最高，过九月就减半。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["2026年中秋为9月25日（周五）至27日（周日），国庆为10月1日（周四）至7日（周三），中间9月28、29、30日为三个工作日；请下这三天年假可拼出9月25日至10月7日共13天连休（多家媒体2026-07-31起口径一致）","去哪儿数据：9月22日抢跑出发，机票均价较中秋首日低30%、较国庆首日低50%；9月27日至10月1日国内机票均价创近3年同期最低，部分热门航线比去年低一成以上（去哪儿/中国商报/芜湖新闻网2026-09-02、09-08）","抢订9月28日至30日酒店订单量同比增长52%，这三天占13天长假酒店预订总量的15%（去哪儿）","今年返程高峰分散在10月4日至7日，10月4日机票均价比去年返程期间低超两成（去哪儿）"],"scripts":[{"angle":"干货直给","text":"今年最长的假不是春节，是九月底这一波。中秋是九月二十五到二十七号，国庆是十月一到七号，中间二十八、二十九、三十是三个工作日。这三天年假请下来，从九月二十五一路休到十月七号，整整十三天，比春节还长。关键在价格：去哪儿的数据，九月二十二号抢跑出发，机票均价比中秋首日低三成、比国庆首日低五成；九月二十七到十月一号，国内机票均价创下近三年同期最低，部分热门航线比去年还低一成以上。返程也别挤，今年高峰散在十月四到七号，四号返程比去年返程便宜超两成。假条这周就递，用年假别用事假，全勤和工资都不受影响。"},{"angle":"实操流程","text":"拼这十三天长假，顺序别搞反。第一步查年假余额，这套方案只消耗三天年假，工龄满一年就有五天，够用。第二步这周就递假条，附一份工作交接清单写清谁替你，领导驳回的理由少一大半。第三步等批下来再订票，别先买票后请假，批不下来退票费能吃掉半张机票。第四步订票卡时间：能请动就九月二十二号抢跑，比国庆首日便宜一半；定不下来的，九月二十七到十月一号也是近三年低点。第五步酒店只订可免费取消的，热门城市节前一个月就可能满房，先占位后调。年假别一次用光，留一两天应付年底突发。 还有个细节，九月二十八到三十号这三天酒店订单已经同比涨了五成二，说明抢的人不少，别以为晚两天也一样。"},{"angle":"反常识开场","text":"长假机票不是越晚越贵，也不是越早越便宜，是中间有个深坑。今年中秋国庆连着，出行高峰被摊成九月二十五和十月一号两个峰，而不是往年的单峰。结果九月二十二号抢跑出发，机票反而比国庆首日便宜五成，比中秋首日还低三成。更反直觉的是返程：往年全挤在最后两天，今年散在十月四到七号，四号返程比去年返程便宜超两成。所以今年的最优解不是硬扛高峰，是错开两端。抢订九月二十八到三十号酒店的订单已经同比涨了五成二，说明懂行的人早动手了。你不抢，好价就被别人挑走。 记住，抢跑的核心是九月二十二号前后出发，这一天的便宜是全年独一份，错过要再等一年。"}]},{"id":"tv3","title":"对角线飞行赏秋：飞四五千公里，今年成了主流玩法","hook":"飞四五千公里去赏秋，今年成了主流玩法。","why":"强数据反差，信息差足。长线赏秋+小机场城市爆发，是今年双节最明显的结构性变化。","heat":"中高","tags":["信息差","国内游","反直觉"],"facts":["去哪儿数据：2026年中秋国庆期间2000公里以上航线预订量同比翻倍增长，拉萨-上海增长4.4倍、拉萨-北京3.4倍、拉萨-广州3.3倍；西宁-上海、乌鲁木齐-南京、乌鲁木齐-武汉均近2倍（去哪儿/澎湃新闻2026-09）","吉林延吉成为小机场城市机票预订增幅TOP1，增长达3.8倍；宁夏中卫、新疆阿勒泰紧随其后接近翻倍；三线及以下宝藏百城机票预订同比增超30%（去哪儿）","途家数据：新疆阿勒泰民宿预订跃居全国TOP8城市，蒙古包民宿预订量同比增长110%；内蒙古呼伦贝尔、四川阿坝跻身民宿预订TOP30（途家/去哪儿）","九寨沟、稻城亚丁、喀纳斯、恩施大峡谷等地率先进入赏秋窗口；国内租车订单同比增超50%，乌鲁木齐、拉萨、伊宁订单增长超1倍（同程/去哪儿/途家）"],"scripts":[{"angle":"数据向","text":"给几个数字，你看今年赏秋玩法的变化有多大。去哪儿数据，中秋国庆期间两千公里以上航线预订量同比翻倍，拉萨飞上海涨了四点四倍、飞北京三点四倍、飞广州三点三倍，西宁飞上海、乌鲁木齐飞南京和武汉都接近两倍。小机场城市更猛，吉林延吉机票预订增幅排第一，涨了三点八倍，宁夏中卫、新疆阿勒泰紧随其后接近翻倍。住的地方也跟着变，阿勒泰民宿预订冲进全国前八，蒙古包民宿同比涨了一成多。租车同样火，国内订单涨超五成，乌鲁木齐、拉萨、伊宁增长超一倍。这些数据合起来说明一件事：今年大家不挤短线了，专挑几千公里外的秋色。"},{"angle":"横向对比","text":"同样赏秋，今年两种人走出了完全不同的路。一种是传统的周边短线，去个近郊看银杏红叶，人均花得少但人挤人，照片里全是后脑勺。另一种是今年的新主流：对角线飞行，从东部沿海直飞拉萨、喀纳斯、阿尔山这些几千公里外的秋色带，拉萨飞上海机票预订涨了四点四倍就是这个信号。为什么愿意飞这么远？因为长线秋色有稀缺性，九寨沟、稻城亚丁、喀纳斯率先进入最佳观赏期，短线根本替代不了。代价是机票贵些，但小机场城市像延吉、阿勒泰机票也就涨到接近翻倍，比起景区的体验落差，这笔钱划算。 想抄这条线，九月下旬到十月初是窗口，再晚秋色谢了，机票也跟着回弹。"},{"angle":"反常识开场","text":"越远的秋天，今年反而越便宜。正常逻辑是距离越远票价越高，可今年反过来，两千公里以上的长线航线预订量同比翻倍，拉萨飞上海涨了四点四倍。原因不是降价，是需求结构的迁移：十三天超长假期把大家的出行半径直接拉满，短线玩腻了，都想去喀纳斯、阿尔山看真正的秋。供给端也接住了这波，国内租车订单涨超五成，乌鲁木齐拉萨伊宁增长超一倍，小机场城市延吉机票涨三点八倍还一票难求。所以别再用老眼光看赏秋，今年最值的玩法不是家门口，是飞过去住进风景里。 一句话，今年赏秋别只盯着家门口，飞过去住进风景里，性价比反而更高。"}]},{"id":"tv4","title":"中国护照免签破90地，但旧攻略该扔了","hook":"中国护照今年含金量涨了三轮，很多人还按旧攻略走。","why":"纠错+信息差，长效收藏。免签清单年内多次更新，天数和截止日极易记错，属高价值避坑。","heat":"中高","tags":["避坑","出境","收藏向"],"facts":["截至2026年8月，持中国普通护照可免签或落地签前往的国家和地区已突破90个；外交部数据互免签证国家达29个，中国单方面免签国家增至50个（多家签证整理清单/外交部中外互免签证协定一览表2026-08）","俄罗斯免签延长至2027年12月31日，普京于2026年7月20日签署总统令确认，单次停留不超过30天（多份清单2026-08口径一致）","巴西2026年5月11日至12月31日单方免签30天；土耳其2026年1月2日起单方免签，180天内累计不超过90天；柬埔寨2026年6月15日至10月15日试行免签14天（多源一致）","泰国免签停留期2026年5月由60天调回30天，需提前3天填TDAC电子入境卡；黑山自2026年11月1日起取消对华免签，此前仍可按现行规定入境（多源一致，出发前以中国领事服务网为准）"],"scripts":[{"angle":"干货直给","text":"中国护照今年含金量涨了三轮，可很多人还在用去年的攻略。先更新数字：截至八月，持普通护照能免签或落地签去的国家和地区已经突破九十个，其中互免二十九个、咱们单方面免签五十个。几个今年新变的必须记：俄罗斯免签延到二〇二七年十二月三十一号，普京七月二十号签的总统令；巴西五月十一到十二月三十一单方免签三十天；土耳其一月二号起单方免签，一百八十天里累计不超九十天；柬埔寨六月十五到十月十五试行免签十四天。最容易踩坑的是泰国，五月已经把六十天免签调回三十天，还得提前三天填TDAC电子入境卡。黑山十一月一号起取消对华免签，赶在这之前还能进。出发前一周再去中国领事服务网核一遍，两分钟省掉一趟白跑。"},{"angle":"避坑清单","text":"免签清单今年变太快，五条避坑照着核。第一，天数别混，新马泰单次三十天，菲律宾十四天，俄罗斯三十天但限二〇二七年底。第二，泰国已经不是六十天，五月起改回三十天，不填TDAC电子入境卡可能被拦在边检。第三，免签不等于免审查，边检照样看回程机票、酒店订单和资金，材料不齐一样退人。第四，黑山十一月一号取消对华免签，计划那之后去的得提前办签证。第五，政策是动态的，巴西、柬埔寨都是限时，过期就失效。最稳的做法：列好目的地，出发前三天到中国领事服务网和对方使馆官网各查一遍，别信半年前的攻略。"},{"angle":"反常识开场","text":"说走就走的前提，是你得知道哪些地方真的说走就走。很多人以为免签国就那几个老面孔，其实今年已经破九十了，互免二十九个、单方免签五十个。更反直觉的是，免签还在持续加码：俄罗斯直接延到二〇二七年底，巴西今年第一次敞开大门，土耳其年初就免了。但另一头在收：泰国把六十天砍回三十天，黑山十一月一号取消对华免签。所以这份清单是动态的平衡，不是只增不减。真正会玩的人不记死数字，只记一个动作——出发前三天上中国领事服务网核一遍。这一下，比你收藏一百篇攻略都管用。 最后提醒，免签清单每月都在变，收藏不如养成出发前核一遍的习惯，这才是真正省心。"}]},{"id":"tv5","title":"免签把出境长线门槛拉低了，租车订单涨了7倍","hook":"免签把出境长线的门槛整个拉低了。","why":"数据硬，趋势向。免签+长线+跨国拼装+租车爆发，是今年出境游最值得讲的结构性变化。","heat":"中","tags":["趋势","出境","泛人群"],"facts":["去哪儿数据：平台用户酒店预订覆盖全球超3800个城市，热门国家酒店预订量同比增长48%；8000公里以上长线航线机票预订量同比增长超30%（去哪儿/澎湃新闻2026-09）","南非开普敦机票预订量同比增长4.3倍；巴西圣保罗、葡萄牙里斯本、智利圣地亚哥等上万公里目的地机票预订量翻倍增长（去哪儿）","跨国拼装游趋势显著：预订新加坡+马来西亚、法国+意大利、肯尼亚+坦桑尼亚等双国酒店订单量同比增长1.2倍（去哪儿）","出境租车订单同比增长近7倍，美国、新西兰、澳大利亚、冰岛、意大利、挪威订单量最高，异地还车订单占34%；三线及以下城市出境机票量增速近三成，跑赢一线城市（去哪儿）"],"scripts":[{"angle":"干货直给","text":"今年出境游最猛的不是东南亚，是长线。去哪儿数据，平台酒店预订覆盖全球超三千八百个城市，热门国家酒店预订同比涨了四成八，八千公里以上的长线航线机票预订涨超三成。具体看，南非开普敦机票预订同比涨了四点三倍，巴西圣保罗、葡萄牙里斯本、智利圣地亚哥这些上万公里的目的地直接翻倍。玩法也变了，跨国拼装游兴起，新加坡加马来西亚、法国加意大利、肯尼亚加坦桑尼亚的双国酒店订单涨了一点二倍。租车更夸张，出境租车订单同比近七倍，美国、新西兰、澳洲、冰岛、意大利、挪威最火，异地还车占三成四。免签把门槛拉低之后，大家不再只盯着周边，直接奔远处的风景。"},{"angle":"趋势判断","text":"从今年出境数据能看清一个转向：大家不再只逛周边，开始往远处跑。判断有三条。第一，长线需求被免签激活，八千公里以上航线机票预订涨超三成，开普敦涨四点三倍，说明南美、非洲、南欧这些以前觉得远的，现在说走就走。第二，玩法从单点变成拼装，双国连游订单涨一点二倍，一趟把两个目的地打包，时间和机票都摊薄了。第三，出行方式在下沉，出境租车订单近七倍增长，三线及以下城市出境机票增速近三成跑赢一线，说明不是只在一线城市火。这三条合起来，是出境游从周边游升级为真正的全球游。 想跟这波，先把目的地按免签清单筛一遍，能省掉的签证时间直接换成玩的时间。"},{"angle":"故事切入","text":"我一个做签证的朋友说，今年问他巴西、南非的人明显多了，以前大家开口就是新马泰。他去哪儿的数据应证了这点：八千公里以上长线航线机票预订涨超三成，开普敦涨四点三倍，巴西圣保罗、里斯本、圣地亚哥全翻倍。更深的变化在玩法，以前出境是飞一个城市住几天，现在是双国拼装，新加坡加马来西亚、法国加意大利这种连游订单涨了一点二倍。还有人直接当地租车自驾，出境租车订单同比近七倍。他说最明显的信号是客户来源，三线及以下城市的出境机票增速近三成，比一线城市还快。免签这把钥匙，把远处的大门真的打开了。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"京东开源可交互视听世界模型，AI视频能进了","hook":"AI视频能进了，不只是能看了。","why":"一手强来源（央广财经），技术前沿。世界模型从看走向可探索，对短剧/电商/具身都有用。","heat":"高","tags":["强时效","视频生成","国产"],"facts":["9月9日京东全球科技探索者大会（JDD）上，京东探索研究院发布JoyAI-Echo 1.5（超长音视频生成，支持10分钟以上持续生成）并开源可交互视听世界模型EchoWM（央广财经2026-09-09）","JoyAI-Echo 1.5基于音视频Memory Bank架构，长视频后训练最高7.5倍推理加速，仅需2张H200即可在480P下平均每秒生成24帧，实现1:1等时生成；Director Agent可根据自然语言完成故事展开、分镜规划、生成审核与成片组装（央广财经）","EchoWM原生联合生成720P视频、环境音、音乐和语音，声音随场景、摄像机与主体运动同步变化；通过统一相机意图支持第一人称导航、第三人称摄像机与主体协同、多轮连续探索（央广财经）","WBench Navigation评测中EchoWM与四步因果流式版本EchoWM-Flash位列前两名，EchoWM综合排名第一；京东还展示新一代音视频模型JoyAI-Video，将于10月正式发布，面向电商广告、短剧与具身智能（央广财经）"],"scripts":[{"angle":"干货直给","text":"九月九号京东JDD大会上，京东探索研究院放了两个东西：JoyAI-Echo 1.5和可交互视听世界模型EchoWM，后者直接开源。Echo 1.5主打超长音视频，支持十分钟以上持续生成，基于音视频记忆库架构，长视频后训练最高七点五倍推理加速，两张H200在480P下平均每秒生成二十四帧，能做到一比一等时生成，还有Director Agent按自然语言做分镜和成片。真正的重点是EchoWM，它原生联合生成720P视频加环境音、音乐和语音，声音跟着场景和镜头动，还能用统一相机意图做第一人称导航、多轮连续探索。在WBench导航评测里它和Flash版包揽前两名。京东十月还要发JoyAI-Video，对准电商广告和短剧。"},{"angle":"说人话版","text":"用大白话讲京东这次开源为什么重要。以前AI视频是你看一段生成好的片子，不能进去转。EchoWM不一样，它把视频、环境音、音乐、语音一起生成，你镜头一动，声音跟着变，还能用第一人称在场景里走、多角度连续看，等于从看视频变成进场景。底层靠的是统一相机意图，把画面和声音绑在同一条控制线上。评测上它和自家Flash版拿下导航榜前两名。对普通人这意味着什么？做电商展示、短剧、甚至具身智能演练，以后不用先拍再剪，直接在生成的世界里调度。京东十月发的JoyAI-Video会把这套能力往商用场景推。"},{"angle":"横向对比","text":"看AI视频不能只盯画质了，今年拼的是时长和可交互。横向看三条线：一条是长视频，京东Echo 1.5做到十分钟以上持续生成、两张H200一比一等时出片，解决的是人物声音线索不连贯的老毛病；一条是世界模型，EchoWM把视频和环境音、语音原生联合生成，还能第一人称导航、多轮探索，从能看走到能进；一条是商用落地，京东顺手秀了JoyAI-Video，十月发，对准电商广告和短剧。三条合一起，京东这次不是单点放模型，是把内容生成到动态环境交互的技术体系一次铺开。做内容的人该盯这条线，因为它直接关系下一波生产工具。"}]},{"id":"ai2","title":"阿里开源7B模型：视频和配音一次生成","hook":"视频和配音以后一次生成，不用先画面后配音了。","why":"范式变化，可做玩法。音画同步统一建模，颠覆传统流程，对短视频创作者直接相关。","heat":"中高","tags":["开源","视频生成","玩法"],"facts":["阿里开源项目以7B联合生成器为核心，在统一时间坐标下同步建模画面与声音，颠覆先画面后配音的传统流程，并配套音视频数据系统与模态感知强化学习（智猩猩/互联网大厂日报2026-09-09）","字节跳动正基于Seedance架构构建交互式空间视频生成模型，支持语音与动作输入、每秒20帧、延迟0.05秒，最快10月推出，将与PICO头显联动布局下一代内容入口（ZFinTech/互联网大厂日报2026-09-08至09-10）","腾讯HY4大模型环比增长379%，登顶全球大模型调用榜（极客公园2026-09-09）"],"scripts":[{"angle":"干货直给","text":"阿里最近开源了一个七B的联合生成模型，核心是在统一时间坐标下同时建模画面和声音，也就是说视频和配音一次就生成了，不用再走先画面后配音的老路。配套还给了音视频数据系统和模态感知强化学习，让声音和画面真正对得上。这跟传统流水线完全相反，以前是生成视频、再单独配乐配音、最后对齐，现在直接从同一个时间轴里长出来。同一周字节也在推基于Seedance的交互式空间视频，支持语音和动作输入、每秒二十帧、延迟零点零五秒，最快十月跟PICO头显联动。腾讯这边HY4大模型环比涨了百分之三百七十九，登顶全球调用榜。视频生成正在从单模态往音画一体的方向跑。"},{"angle":"玩法","text":"音画同步这个变化，对做短视频的人是实打实的好用。以前一条片子，先出画面，再找配音、配乐、对齐口型，来回折腾，最费时间的就是这一步。阿里这个七B联合生成器把画面和声音放在同一个时间轴里一次长出来，配音和画面天然对位，省掉后期对齐的活。字节的Seedance空间视频更往前一步，支持语音和动作输入、延迟零点零五秒，十月接PICO做沉浸式内容。给创作者的建议：以后选工具别只看画质，看它能不能音画一体生成、能不能实时交互。这两个能力到位，一分钟口播片的制作链条能砍掉一大半。 对创作者，这意味着后期对齐的活能省掉一大半，出片节奏会明显加快。"},{"angle":"趋势判断","text":"从阿里和字节这周的动作，能看清视频生成的一个转向：从单模态走向音画一体加可交互。阿里用七B联合生成器在统一时间坐标下同步建模画面和声音，等于把配音环节内化进生成过程；字节用Seedance做交互式空间视频，语音动作直接驱动、延迟零点零五秒，十月接PICO。这两条线合起来说明，行业竞争焦点已经从谁画得清，变成谁能让视频带着声音、还能被实时操控。对内容行业的影响是结构性的：后期制作链条缩短，实时生成和交互内容会成为新的入口。腾讯HY4调用量暴涨也只是这个大趋势里的一朵浪花。 工具选型的逻辑变了，看它能不能音画一体、能不能实时交互，比单看画质更关键。"}]},{"id":"ai3","title":"MiniMax H3开源：视频生成第一次比播放还快","hook":"视频生成第一次比播放还快。","why":"开源提速，落地直播/影视。快于实时是成本拐点，对做视频的人直接相关。","heat":"中高","tags":["开源","视频生成","成本"],"facts":["MiniMax开源视频生成模型H3：单GPU生成15秒768p视频仅需约13秒，视频生成首次快于实时（AI瞭望塔/魔搭社区2026-09-07）","fal推出吞吐再提升约35倍的H3 Max；开源社区同周发布FastH3加速版，单卡Blackwell最高14倍加速（AI瞭望塔）","OpenVDN团队开源VDN-MiniMax-H3（VDN-H3），将局部Softmax注意力与按帧更新线性注意力结合，通过少步蒸馏降低开销；官方测试用8张B200以8步完成约14.4秒768p视频去噪，耗时11.23秒（魔搭社区2026-09-07）","意义：视频生成从等结果走向实时可交互，大幅降低影视与直播场景成本（AI瞭望塔）"],"scripts":[{"angle":"干货直给","text":"MiniMax把视频生成模型H3开源了，最炸的一点：单张GPU生成十五秒七百六十八p视频只要约十三秒，这是视频生成第一次快过实时。什么概念？你播十五秒的片，它十三秒就生成完了，不再干等。fal紧接着推出吞吐再高约三十五倍的H3 Max，开源社区同周长出FastH3加速版，单卡Blackwell最高十四倍提速。OpenVDN团队也开源了VDN-H3，把局部Softmax注意力和按帧更新的线性注意力结合，用八步蒸馏把十四点四秒七百六十八p视频去噪压到十一点二三秒。这一步的意义很直接：实时可交互的视频生成从PPT走进现实，影视和直播的算力成本要往下掉。"},{"angle":"成本账","text":"算一笔账你就知道H3快于实时意味着什么。以前生成一段视频，得等结果，生成时间往往比片长还长，做一条短片光渲染就耗掉大把算力钱。现在H3单卡十三秒出十五秒七百六十八p，生成速度超过播放速度，等于边播边出，不再有等待成本。社区还在加速：fal的H3 Max吞吐高约三十五倍，FastH3单卡最高十四倍，VDN-H3用八步蒸馏把十四秒片去噪压到十一秒出头。把这些叠起来，影视和直播场景里实时生成字幕、实时换背景、实时做特效都变得便宜。对中小团队，这是把大厂才用得起的实时视频能力直接拉到桌面。"},{"angle":"反常识开场","text":"视频生成行业有个怪现象：我们等生成的时间，比看片的时间还长。一条十五秒的片，过去可能要等一分钟才出得来，算力成本全耗在等待上。MiniMax的H3把这个逻辑反过来：单卡十三秒生成十五秒七百六十八p，第一次比播放还快。这不只是快一点，是质变的拐点，因为生成快过实时，视频就能边播边生成，直播、实时特效、互动内容全有了底座。更关键的是它开源了，fal和社区立刻把吞吐往上推，H3 Max高三十五倍、FastH3十四倍、VDN-H3八步蒸馏。开源加提速，实时视频的门槛这周被踩塌了。 对中小团队，这等于把大厂才用得起的实时视频能力直接搬到了桌面。"}]},{"id":"ai4","title":"Agent这周集体出屏：购物、打车、架构师、硬件全来了","hook":"Agent这周集体从屏幕里钻出来了。","why":"密集落地，破圈。从软件界面走向物理世界和硬件，是Agent最值得讲的拐点。","heat":"高","tags":["强时效","Agent","泛人群"],"facts":["9月9日京东主站APP完成全面AI化改版，左下角新增AI Agent入口，首推原生购物Agent，支持文字、语音对话及找外卖、找服务、AI省钱、售后助手等固定服务，融合视频与3D虚拟增强（观点新媒体2026-09-09）","9月9日曹操出行联合豆包上线AI打车服务，在北京、杭州、苏州三城落地，将出行服务与AI Agent深度融合（环球网2026-09-09）","9月9日阿里技术发布架构师Agent实践，通过业务知识库、架构图谱、服务知识与渐进式上下文加载，让AI独立完成跨复杂系统的技术方案设计，知识完备时方案覆盖度可达95%以上（阿里技术2026-09-09）","9月8日百度AI Day将百度搭子作为超能小度的Agent底座，落地家庭日程、作业管理、AI看护，四款小度硬件承接；同日网易有道发布首款AI原生语音Agent网易叭哥说，语音输入效率达键盘5倍、支持124种语言实时翻译、本地处理终身免费（电厂/财闻2026-09-08）"],"scripts":[{"angle":"干货直给","text":"这一周Agent不是更新功能，是集体出屏。九月九号京东主站APP全面AI化，左下角多了Agent入口，首推原生购物Agent，能文字语音对话，直接找外卖、找服务、AI省钱、管售后，还融了视频和3D。同一天曹操出行联合豆包上线AI打车，北京杭州苏州三城先跑，把出行服务和Agent揉在一起。还是九月九号，阿里技术发了架构师Agent，用业务知识库和架构图谱让AI独立写跨系统的技术方案，覆盖度能到九成五以上。往前一天，百度把搭子做成小度的Agent底座，落进家庭日程和看护，四款小度硬件接住；网易有道也发了语音Agent叭哥说，语音输入是键盘五倍、一百二十四种语言实时翻译、本地处理还免费。Agent从软件钻进硬件和物理世界了。"},{"angle":"趋势判断","text":"从这一周密集落地，能看出Agent的三个走向。第一，从聊天框走向真实履约，京东购物Agent直接帮你找外卖管售后，曹操打车Agent把叫车这种物理动作接进来了，不再只是问答。第二，从软件界面走向硬件入口，百度把搭子装进小度四款硬件做家庭看护，说明Agent在找身体。第三，从通用助手走向专业纵深，阿里架构师Agent能独立写跨系统技术方案，网易语音Agent专攻多语种实时翻译。这三条合起来，Agent竞争的重点已经从谁更会聊，变成谁能真的把事办了、办进你的生活里。下一阶段拼的是场景渗透深度。"},{"angle":"故事切入","text":"我一个做产品的朋友说，这周他手机里多了好几个能办事的Agent。京东APP左下角多了个入口，能直接对话找外卖、管售后；曹操出行里豆包接进了打车，北京杭州苏州已经能用；百度把搭子塞进小度硬件做家庭日程和看护；网易有道发了个语音Agent，一百二十四种语言实时翻译还免费。他说最明显的变化是，这些Agent不再飘在聊天框里，而是接进了具体动作和具体设备。阿里更狠，架构师Agent能独立写跨系统技术方案，覆盖度九成五以上。他感慨以前Agent是玩具，现在一个个开始能替人跑腿了。这周像是Agent从演示走进行动的拐点。"}]},{"id":"ai5","title":"AI办公修罗场：大厂把入口打成了战场","hook":"大厂这周把办公入口打成了修罗场。","why":"多源交叉，趋势。办公是商业化最清晰场景，四家同台，对普通用户选工具直接相关。","heat":"中高","tags":["行业","趋势","泛人群"],"facts":["9月2日腾讯WorkBuddy开放平台正式上线，首批超百家生态伙伴，系国内首个打通硬件、应用、开发者三层生态的Agent平台；现场9款联名智能硬件首发（Plaud、乐奇Rokid、影石、科大讯飞、安克、猛玛、京东京造），同步上线30余个行业应用（证券日报/36氪2026-09-03）","WorkBuddy月访问量从3月900万增至6月2097万，稳居国产办公Agent榜首；QuestMobile显示其近3个月活跃用户规模增长115.3%（中国商报2026-09-04）","8月25日字节豆包推出豆包工作并与飞书打通；8月14日百度库库AI上线独立端（GenFlow月活破1亿，AI办公MAU超2500万）；8月3日阿里千问办公公测（中国商报2026-09-04）","大厂为AI展开举债军备赛：腾讯24.5亿美元债加150亿元点心债、字节296亿美元银团贷款、阿里800亿港元配股，中国互联网巨头单季资本开支超1200亿元，三年增长最高12倍（鹤鸣南华/互联网大厂日报2026-09-10）"],"scripts":[{"angle":"干货直给","text":"AI办公这周是真打起来了。九月二号腾讯WorkBuddy开放平台上线，首批超百家伙伴，是国内第一个把硬件、应用、开发者三层生态全打通的Agent平台，现场发了九款联名硬件，Plaud、Rokid、影石、科大讯飞、安克都在列，还同步上了三十多个行业应用。对手也没闲着：字节八月二十五号推豆包工作跟飞书打通，百度库库AI独立端月活破一亿、AI办公月活超两千五百万，阿里千问办公八月初就公测了。数据上WorkBuddy月访问从三月九百万涨到六月两千多万，稳坐国产办公Agent头把交椅，近三个月活跃用户涨了一成多。更夸张的是投入，大厂单季资本开支超一千二百亿，腾讯字节阿里都在举债加码。办公入口这仗，刚开场。"},{"angle":"横向对比","text":"四家打AI办公，路子其实不一样。腾讯WorkBuddy走平台化，九月二号开放平台上线，把硬件应用开发者三层打通，九款联名硬件加三十多个行业应用，月访问两千多万居首。字节豆包工作是嵌进飞书，借办公场景的存量用户做Agent优先。百度库库AI独立端，GenFlow月活破一亿，靠的是文库网盘的老底子。阿里千问办公把Qoder、MuleRun、悟空三款整合公测，偏开发和企业侧。四家共同点很明确：都认定办公是大模型最清晰的变现场景，所以从问答转向执行。对用户来说，选哪家看你在哪个生态里，飞书选字节，腾讯系选WorkBuddy，开发向选阿里。"},{"angle":"趋势判断","text":"AI办公从拼功能进入拼生态和拼财力两个阶段。第一阶段拼入口，腾讯用开放平台把硬件应用开发者三层串起来，字节把豆包塞进飞书，百度阿里各自端上独立产品，四家都在抢你打开的第一个页面。第二阶段拼投入，大厂单季资本开支超一千二百亿，腾讯字节阿里靠发债配股加码，三年最高涨十二倍。这说明行业共识是办公是变现最稳的场景，所以敢烧钱占位。对普通人，短期是好事，工具免费又好用；长期要留意绑定，谁把你锁进生态，谁就握住了你的工作流。现在还能挑，等格局定了挑选余地就小了。 现在还能挑，等格局定了，挑选的余地就小了，趁工具都免费先把 workflow 定下来。"}]}]}]},"2026-09-09":{"date":"2026-09-09","updatedAt":"2026-09-09 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"国庆机票近三年最友好窗口，现在不动手就晚了","hook":"今年国庆机票不涨反降，这是三年没见过的低位。","why":"中秋国庆仅隔三天，请3休13把出行拉散，叠加运力充裕，机票创下三年低位。现在卡在最佳下单区间，过了9月中旬价值快速回落，全民相关转发收藏高。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["2026年中秋为9月25日(周五)至27日(周日)共3天，国庆为10月1日(周四)至7日(周三)共7天，二者仅隔3天，'请3休13'拼出全年最长出游窗口（同程旅行/人民网重庆频道 2026-09-02）","同程旅行数据：9月22日'抢跑'出发机票均价较中秋首日(9/25)低30%、较国庆首日(10/1)低50%；9月27日至10月1日机票均价创近三年同期最低（今日头条引同程 2026-09-08）","央视网/经济观察报：2026年国庆航班总量较去年增长约6.2%，运力充裕+拼假分散出行，机票不涨反降（新浪财经 2026-09-03）","北京直飞太原230元、直飞郑州160元，均为1折左右；9月仍有大量1折机票在售（人民网重庆频道 2026-09-02）","截至8月31日，出行日期9月25日至10月7日的国内航线机票预订量超383万张，同比增长约17%（同程旅行 2026-09-06）"],"scripts":[{"angle":"干货直给","text":"今年国庆机票出现近三年最友好的价格窗口，原因有三个。第一，中秋9月25号和国庆10月1号只隔三天，请9月28、29、30三天年假就能拼出13天长假，出行时间被拉散，不再集中扎堆。第二，今年国庆航班总量比去年多约6.2%，运力充裕，航司不用靠涨价填舱。第三，现在是下单低位区间：9月22号抢跑出发比国庆首日便宜一半，9月27到10月1号均价创三年最低，北京飞太原230、飞郑州160都是1折。提前一个月锁票的热度同比涨了两成，另外燃油费7月已经下调，长线还能再省。该动手了，别等9月下旬价格回弹。"},{"angle":"实操流程","text":"想吃到这波国庆低价，按这个顺序走。第一步，先递年假条，请9月28、29、30三天，拼出13天，工龄满一年就有至少五天年假，够用。第二步，别倒过来先买票后请假，批不下来退票手续费能吃掉半张机票。第三步，订票卡时间：9月22号抢跑出发最划算，比国庆首日便宜50%；9月27到10月1号是三年最低区间，北京飞太原230、飞郑州160都是1折。第四步，酒店只订能免费取消的房型，热门城市假期前一个月就可能满房，先占位后调整。第五步，学生和家庭认证别忘了做，机票最高省20%。假条这周就交，晚一周价格就开始回弹。"},{"angle":"反常识开场","text":"越晚订国庆机票越便宜，这句话今年居然对了。往年长假机票是越拖越贵，今年反了：9月27到10月1号均价创下近三年同期最低，北京飞太原230、飞郑州160都是1折，比国庆首日便宜一半。背后的原因是运力比需求跑得快——今年国庆航班总量同比多了约6.2%，中秋和国庆又只隔三天，请三天假就能拼出13天，大家出行时间被拉散，不再挤在同一天抢票。所以现在的低位不是错觉，是结构性宽松。但这个窗口不会一直开，9月下旬价格就会随预订升温往上走，想捡漏得趁这两周，错过就要等明年了。机票的事，早定早安心，越拖选择越少。"}]},{"id":"tv2","title":"9月错峰游黄金窗：1折机票加酒店降五成","hook":"暑运一停，机票酒店直接腰斩，现在出去最划算。","why":"暑期亲子退潮、国庆未启，9月是民航传统淡季，价格进入全年低谷。银发族与白领接棒成主力，赏秋同步开启，性价比和体验兼得，适合做错峰攻略合集。","heat":"高","tags":["省钱","淡季","可复用"],"facts":["同程旅行特价机票榜：9月错峰出行机票价格比中秋国庆假期便宜三到四成，较9月30日最高点便宜一半以上（央广网/今日头条 2026-09-08）","同程数据：中秋假期前酒店均价较8月下降三四成，部分度假型酒店降幅达五成以上（今日头条引同程 2026-09-08）","9月错峰出游主力为55岁以上银发族与用年假拆3-4天假的年轻白领；美团数据20-30岁'淡季游'人群占比近50%（央广网 2026-09-08）","赏秋窗口期：九寨沟、稻城亚丁、喀纳斯、恩施率先进入赏秋；途牛优选上饶、北京、阿勒泰、黄山、大兴安岭、呼伦贝尔等（今日头条 2026-09-08）","北京-太原200元(1.5折)、北京-大连200元、北京-杭州290元(1.2折)等1折机票集中上线，多数为早/晚班或经停航班余票有限（中国吉林网/南昌新闻网 2026-09-08）"],"scripts":[{"angle":"干货直给","text":"9月是全年出游的性价比洼地，两个数字就能说明问题。机票方面，错峰出行比中秋国庆假期便宜三到四成，比9月30号最高点便宜一半以上，北京飞太原200、飞大连200、飞杭州290都是1.2到1.5折。酒店更狠，中秋前的均价比8月降了三四成，部分度假型酒店降幅超过五成，某热门二线城市五星9月七百多，国庆直接涨到一千到一千四。为什么这么便宜？暑期亲子客流退了，国庆还没来，运力却还满着。再加上今年气候舒服，秋高气爽，是少有的便宜又舒服的窗口。想出门的，这半个月是全年最好的时机，再晚两周价格就上去了。"},{"angle":"故事切入","text":"我妈今年第一次主动问我，9月能不能带她出去转转。以前她嫌贵嫌挤，现在9月错峰她反而愿意了。数据也印证了这点：今年9月错峰出游的主力是55岁以上的银发族，和用年假拆出三四天假的年轻白领，两拨人接了暑期的班。机票比假期便宜三到四成，酒店比8月降三四成，部分度假酒店直接降五成。银发族偏爱慢节奏康养和初秋赏景，年轻人更爱周边微度假和错峰徒步。一边是价格红利，一边是九寨沟、喀纳斯、恩施这些地方刚进赏秋窗口，实惠和体验这次真的兼得了。想带父母出门的，这会儿最合适，人少价低还舒服。趁凉快赶紧安排，国庆就别想了。"},{"angle":"数据向","text":"给几个具体数字，你自己判断值不值。机票：北京飞太原200元1.5折、北京飞大连200元、北京飞杭州290元1.2折，9月这批1折票集中在早班、晚班和经停航班，余票有限先到先得。酒店：中秋前均价较8月降三四成，某二线城市五星从一千多掉到七百多，国庆又弹回一千四。人群：20到30岁的淡季游占比接近一半，55岁以上银发族成了主力。目的地：九寨沟、稻城亚丁、喀纳斯、恩施率先进赏秋期。一句话，9月的价格低谷加秋色上线，是全年难得的价格和体验双高区间，错过要等明年这时候才有。机会一年就这一回，别等旺季再后悔。"}]},{"id":"tv3","title":"240小时过境免签扩至57国，反向玩国内正当时","hook":"我们往外跑，老外正扎堆用免签来中国。","why":"8月20日过境免签再扩圈，适用国家达57国，权威来源清晰。可借'外国人来华热'反向推荐被低估的二三线国内目的地，角度新、有反差。","heat":"中高","tags":["免签","反向游","有争议"],"facts":["国家移民管理局2026年8月20日公告：自当日起吉尔吉斯斯坦、越南公民可适用240小时过境免签，适用国家增至57国；海南30天入境免签增至61国（中国政府网 2026-08-20）","57国公民持普通护照+确定日期行程的联程客票，可从24省65个开放口岸免签入境，停留不超240小时(10天)（国家移民局官网 nia.gov.cn）","2026年1月8日公安部通报：240小时过境免签实施一年来，全国各口岸入境外国人4060万人次，同比增27.2%（快懂百科引公安部 2026-01-08）","停留期间可从事旅游、商贸、访问、探亲等短期活动；工作、学习、新闻采访须事先办妥签证（国家移民局）","反向视角：2026上半年入境外国人2291.4万人次同比+20.4%，老外偏爱空调好、山海资源好、消费不贵的二三线城，国内反向打卡值得做（参考国家移民局/腾讯新闻数据）"],"scripts":[{"angle":"干货直给","text":"中国的过境免签朋友圈又扩大了。8月20号起，吉尔吉斯斯坦和越南公民也能用240小时过境免签来华，适用国家从55个涨到57个，海南30天入境免签也扩到61国。具体怎么用：57国公民拿普通护照，加上一张确定日期和行程的联程客票，就能从24个省65个开放口岸免签进来，最多待10天，旅游、商贸、探亲都行，但工作学习和新闻采访得另外办签证。这个数字不是摆着看的，公安部通报过境免签实施一年，各口岸入境外国人已经有4060万人次，同比涨了27.2%。来华的门越开越大，对做文旅和生意的人都是实打实的增量，值得认真研究。"},{"angle":"反常识开场","text":"最有意思的旅游信号，藏在老外的行程里。上半年入境外国人2291.4万人次，同比涨了20.4%，其中免签入境占了大头。他们来干啥？避暑、赏秋、吃本地饭。海外社交平台上被反复提的是三个词：全域空调、山海生态、消费科技感——这恰恰是我们习以为常、反而不去的。所以反向操作的思路是：老外觉得值的东西，国内往往被低估。那些空调覆盖好、山海资源好、消费又不贵的二三线城，比如东北、西南一些小城，现在机票酒店双双低位，正好反向打卡一趟，性价比比挤热门景区高得多，体验还更舒服。这种反向思路，今年特别值得试一试。"},{"angle":"横向对比","text":"把中外免签放一起看，结论很清楚：来华的门槛在降，出去的门槛也在降，但玩法不一样。中国这边，240小时过境免签已经覆盖57国、65个口岸，停留10天，一年带来4000多万人次入境，带动的是二三线城市的文旅消费。我们自己出去，新马泰菲等热门地也早就是免签或落地签，北京飞太原这种国内线9月才200块。所以别只盯着出国，国内这波错峰加上免签带火的二三线目的地，机票酒店都在低位，体验还不挤。同样预算，反向玩国内，性价比反而更高，而且不用办签证、不用担心语言，说走就走。国内游的性价比，现在正处在高位。"}]},{"id":"tv4","title":"平台省钱工具盘点：口令、百元特价、燃油费下调","hook":"订票前先搜这几个词，到手价能再降一截。","why":"纯实操向，时效性强且不过期。把各平台口令、百元特价专区、燃油费下调、会员日整合成一键操作清单，收藏率高，适合做成常青攻略。","heat":"中高","tags":["省钱","实操","收藏向"],"facts":["去哪儿APP搜'国庆福利'可领全国百城酒店补贴(95折)、燃油全免券(800km以上最高减70元)、机票优惠券(20元家庭券/15元往返券)，低价航线低至200元（腾讯新闻 2026-09-08）","同程搜'机票10'进入百元特价专区，可设出发地+目标价系统24小时盯价；每周三0元机票秒杀（中国经济新闻网 2026-09）","燃油附加费自2026年7月5日起下调，800公里以上航线每张直降50元（新浪财经 2026-09-03）","航司会员日特价：南航每月28号、东航18号、国航15号常放特价票（腾讯新闻/新浪 2026-09）","学生认证机票最高省20%、火车票5折；家庭认证退改签手续费最高减100元（同程/中国经济新闻网 2026-09）"],"scripts":[{"angle":"实操流程","text":"订国庆机票前，先把这几个工具过一遍，到手价能再压一截。第一，去哪儿APP搜'国庆福利'，能领百城酒店95折、燃油全免券和机票优惠券，低价航线直接到200元档。第二，同程搜'机票10'进百元特价专区，设好出发地和目标价，系统24小时帮你盯价，每周三还有0元秒杀。第三，别忽略燃油费，7月5号起800公里以上每张直降50元，长线能省不少。第四，卡航司会员日：南航28号、东航18号、国航15号常放特价。第五，做完学生或家庭认证，机票最高省20%，退改签手续费也能减。顺序是先认证、再囤券、最后比价下单，别乱了。"},{"angle":"干货直给","text":"机票的隐形降价渠道，很多人根本没用。去哪儿搜'国庆福利'，酒店补贴95折、燃油全免券、机票20元家庭券和15元往返券一次性领齐，低价航线能到200元。同程搜'机票10'进百元特价专区，设好目标价让系统帮你盯，每周三0元秒杀。燃油附加费7月5号起已经下调，800公里以上每张直降50元，这是实打实的普惠。再有就是航司会员日：南航28号、东航18号、国航15号，这几天的特价票最密集。学生和家庭的认证也别忘了，机票最高省20%，退改签手续费最高减100。这些叠加起来，比直接搜裸价便宜一大截，下单前花五分钟就回本了。"},{"angle":"避坑清单","text":"用平台优惠，有五条要先说清楚。第一，口令和补贴大多有城市和时段限制，领之前看清楚适用航线，别到付款才发现自己不在范围。第二，燃油全免券每天要抢，额度有限先到先得，不是领了就一定用得上。第三，百元特价专区的票多为早班晚班或经停，余票少，确定行程再锁。第四，学生和家庭认证要提前做，认证完才能叠加减免，临时补来不及。第五，付款前核对勾选项，把延误险、接机券这类默认勾上的增值服务取消，别为用不上的东西多花钱。优惠用对是省钱，用错反而添堵，这几条过完再下单。省下的都是真金白银，别嫌麻烦。"}]},{"id":"tv5","title":"返程避坑：10月3-4日出发比首日便宜两成","hook":"别都挤10月1号走、7号回，中间走最香。","why":"实操避坑向，时效强。很多人只会卡出发日，忽略节中出发和返程日的选择，信息差明显，收藏和转发价值高。","heat":"中","tags":["避坑","省钱","时效"],"facts":["返程高峰分散在10月4日至7日，10月4日机票均价比去年返程期间低超两成，比10月6-7日便宜（人民网重庆 2026-09-02）","9月30日(假期前一天)是价格高峰：成都飞北京/上海/广州不含税最低均超600元，比节中贵30%以上（新浪财经 2026-09-03）","经济观察报：10月3日-4日是假期价格洼地，比首日和返程高峰便宜20%以上（新浪财经 2026-09-03）","错峰建议：灵活请假族选10月3-4日出发、10月5日返程，请2天假拼出9天，性价比最高（新浪财经 2026-09-03）","避坑提示：频繁刷新同一航线易触发动态溢价；付款前取消延误险等增值服务；廉航行李额度需提前核对（中国经济新闻网 2026-09）"],"scripts":[{"angle":"干货直给","text":"国庆出行最容易踩的坑，是出发和返程都卡在最高峰。9月30号是假期前一天的价格顶点，成都飞北京、上海、广州不含税最低都超600，比节中贵三成以上。返程也别都挤10月6、7号，那是返程最高峰。真正的价格洼地在10月3到4号，比首日和返程高峰都便宜两成以上，而且10月4号返程比去年返程低超两成。所以灵活的人这么排：10月3、4号出发，10月5号回，请两天假拼出9天，钱花得最少、人还最少。前提是你能请动这两天假，卡死在法定假期的就只能在9月27到10月1号这个低价区间里选了，也别硬挤首日。"},{"angle":"反常识开场","text":"国庆最便宜的走法，是别人都不走的日子。大多数人习惯10月1号出发、7号回，结果这两天全是价格高峰，9月30号更离谱，成都飞北上广不含税都超600。反着来反而省：10月3到4号出发，比首日和返程高峰便宜两成以上，这就是假期里的价格洼地。返程选10月5号，比挤6、7号便宜，而且10月4号返程本身就比去年同期低两成多。原理很简单，假期中段大家都在玩，没人动身，运力空着，价格自然掉下来。能请两天假把行程挪到中段的人，是用时间换了真金白银，比硬扛高峰划算太多。两天假换一趟便宜又清净的旅程，值。"},{"angle":"避坑清单","text":"国庆订票五条避坑，照着核对一遍。第一，出发别选9月30号，这是价格顶点，成都飞北上广都不含税超600。第二，返程避开10月6、7号最高峰，选10月4、5号更便宜。第三，价格洼地在10月3、4号出发，能请两天假就拼出9天高性价比行程。第四，别反复刷新同一条航线，容易触发平台的动态溢价，越刷越贵。第五，付款前把延误险、接机券这些默认勾上的增值服务取消，廉航还要提前核对行李额度。把这五条过完，这趟的钱基本就花在刀刃上了，剩下的预算够你在目的地多吃几顿好的。细节抠到位，整趟行程才真省钱。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"2B小模型打赢12B谷歌Gemma，端侧Agent雏形出现","hook":"2B参数干翻6倍大的谷歌模型，端侧要变天了。","why":"面壁MiniCPM5-2B开源，AA榜单4B以下第一，智能密度超Gemma 4 12B。国产端侧突破，情绪和实用性都足，评论区易讨论。","heat":"高","tags":["强时效","国产","端侧"],"facts":["9月8日面壁智能联合OpenBMB开源端侧语言基座模型MiniCPM5-2B，参数规模仅2B（腾讯新闻/智东西 2026-09-09）","Artificial Analysis榜单：MiniCPM5-2B以23分位列全球4B以下开源模型第一，智能密度高于Qwen3.5 9B及约6倍参数的谷歌Gemma 4 12B（腾讯新闻 2026-09-09）","智能体指标Agentic Index得分20分，同级模型均低于10分；已完成英特尔、瑞芯微、Arm首日适配（智东西/腾讯新闻 2026-09-09）","同步开源强化学习框架Meshy、策略JustRL II、训练配方与配套数据集，可复现可验证；MiniCPM系列下载量破5000万（腾讯新闻 2026-09-09）","意义：端侧小模型开始具备通用Agent雏形，办公/生活场景本地化部署成本有望进一步下降（行业分析 2026-09-09）"],"scripts":[{"angle":"干货直给","text":"面壁智能昨天开源了个2B的小模型MiniCPM5-2B，参数只有20亿，却在Artificial Analysis榜单上拿下了全球4B以下开源模型第一。最炸的是智能密度：它比Qwen3.5的9B版本还聪明，甚至干翻了参数约为它6倍的谷歌Gemma 4 12B。在衡量Agent能力的Agentic Index上拿了20分，同级模型连10分都不到。更关键的是它已经和英特尔、瑞芯微、Arm完成了首日适配，意思是手机、PC、开发板这些端侧设备能直接跑。面壁还把强化学习框架Meshy、训练配方和数据集全开源了，下载量已经破5000万。小模型开始有通用Agent的样子了，端侧智能这次是真落地。"},{"angle":"说人话版","text":"用大白话讲讲这个2B小模型为什么值得关注。第一，它小，只有20亿参数，手机和开发板能直接跑，不用连云端，隐私和延迟都更好。第二，它不弱，AA榜单4B以下第一，智能密度比6倍大的谷歌Gemma 4 12B还高，Agent能力指标20分甩开同级。第三，它开源得彻底，模型权重、训练配方、强化学习框架一起放出来，别人能复现能改。第四，已经适配了英特尔、瑞芯微、Arm的芯片，落地门槛极低。对普通人的意义是，以后很多AI功能不用上传云端，在本地设备就跑完了，又快又省又私密，手机上的智能助手会更聪明也更安全。"},{"angle":"趋势判断","text":"从MiniCPM5-2B能看出端侧AI的三个走向。第一，参数规模不再是唯一标尺，智能密度才是，2B干翻12B说明小模型通过更好的训练方法补齐了能力，端侧部署的成本逻辑彻底改写。第二，Agent能力成了小模型的新战场，Agentic Index 20分对同级不到10分，意味着它能在本地完成工具调用、深度搜索、代码生成这类多步任务，不只是聊天。第三，开源范式在升级，从只放权重到放训练配方和可复现框架，开发者能在此基础上改出自己的专用模型。端侧Agent的门槛，正被快速削平，本地智能的时代比预想来得快。"}]},{"id":"ai2","title":"国产大模型开源潮：从比规模到比省钱","hook":"头部模型集体不拼参数了，改拼谁更便宜。","why":"证券日报9月9日深度：国产开源密集上新，词元经济成型，价格集体下探。长效选题，可延伸到创作成本与创业机会，破圈潜力大。","heat":"高","tags":["国产","趋势","成本"],"facts":["近期国产大模型密集开源：8月阿里Qwen3.8-Max开放权重、智谱GLM-5.3、腾讯混元Hy4 preview；9月面壁MiniCPM5-2B接续上新（新浪财经/证券日报 2026-09-09）","国家数据局：2026年6月我国日均词元调用量近175万亿，稳居全球第一；OpenRouter开源模型处理词元占比从1月34%升至6月65%（新浪财经 2026-09-09）","头部定价集体下探：腾讯混元Hy4输入6元/百万词元，星火X2.5多语言版1.6元/百万词元，Qwen3.8-Flash压到1元/百万词元（证券日报 2026-09-09）","行业共识转向'比省钱'：智谱GLM-5.3基座不变仅靠后训练编程能力提升五成；混元Hy4让模型参与自身训练优化，推理吞吐提升超三成（新浪财经 2026-09-09）","分析：能跑通付费闭环的厂商会迅速拉开身位，行业进入去泡沫化结构性调整（证券日报引分析师 2026-09-09）"],"scripts":[{"angle":"干货直给","text":"国产大模型这轮开源潮，逻辑彻底变了：以前比谁的参数量大，现在比谁更便宜。8月阿里Qwen3.8-Max开放权重、智谱GLM-5.3、腾讯混元Hy4 preview接连开源，9月面壁MiniCPM5-2B又跟上。价格跟着跳水：混元Hy4输入只要6元每百万词元，星火X2.5多语言版1.6元，Qwen3.8-Flash直接压到1元。国家数据局的数据更猛，今年6月我国日均词元调用量近175万亿，全球第一；OpenRouter上开源模型处理的词元占比从1月34%涨到6月65%。一句话，开源加低价正在点燃词元经济，模型正加速渗进千行百业，用AI的成本肉眼可见地往下掉。"},{"angle":"横向对比","text":"把今年和去年的国产大模型放一起看，标尺完全换了。去年拼的是参数规模，谁大谁上头条；今年拼的是推理成本和端侧部署，万亿MoE旗舰把激活参数压到千亿级，百万词元长上下文配上极低激活成本，换来旗舰能力。更明显的是价格：混元Hy4输入6元每百万词元，星火X2.5多语言版1.6元，Qwen3.8-Flash压到1元，跟一年前完全不是一个量级。能力增长也从堆算力转向拼工程，智谱GLM-5.3基座不变只靠后训练编程就涨五成，混元Hy4让模型自己优化训练方法，吞吐提升三成。省钱，成了新的护城河，比参数更有说服力。"},{"angle":"趋势判断","text":"国产开源这波，我判断是去泡沫化的开始，理由有三条。第一，头部不再拿参数当卖点，集体转向推理成本、端侧和工程效率，说明共识已经形成：真正决定胜负的不是模型多大，而是能不能以足够低的成本跑进真实业务。第二，开源和低价相互强化，词元经济成型，日均调用量近175万亿、开源占比半年翻近一倍就是证据。第三，竞争从模型本身转移到工具生态，谁能在办公、工业、终端跑通可复制的付费案例，谁就占位。接下来，能跑通商业正循环的拉开身位，剩下的会退化成纯基础设施，越早卡位越主动。对做应用的人，这是最好的时机。"}]},{"id":"ai3","title":"AI视频9月格局：从Sora 15秒到5分钟成片","hook":"视频生成从十几秒片段，一下跳到五分钟成片。","why":"vivago R1全球上线+9月模型排行，时效强、视觉冲击大。可直接服务带货/短视频创作者选型，实用价值高。","heat":"中高","tags":["视频生成","玩法","创作者"],"facts":["AI视频模型9月排行：Gemini Omni 1.1 Flash登顶arena(1515)，Seedance 2.0/2.5紧随，Veo 3主导使用量，Kling质量评分高（wikiprompt 2026-09）","9月8日智象未来(HiDream.ai)vivago R1全球上线：一次稳定输出5分钟高质量视频，支持无限多轮延长，可用率提升至85%（腾讯新闻 2026-09-09）","R1采用Chat-First对话路线：自然语言描述需求即自动生成视频，支持对话中持续调整迭代，从'生成片段'到'交付作品'（腾讯新闻 2026-09-09）","MiniMax H3开源视频模型：单GPU生成15秒768p视频约13秒，首次快于实时；社区FastH3单卡Blackwell最高14倍加速（AI瞭望塔/recapio 2026-09-01）","OpenRouter 9月排名：字节Seedance系列与谷歌Veo 3.1 Lite领先，阿里Wan 3.0支持2-30秒最长时长（streamingmeme 2026-09）"],"scripts":[{"angle":"干货直给","text":"AI视频这个月发生了质变，从十几秒片段跳到了五分钟成片。9月8号智象未来的vivago R1全球上线，一次能稳定输出5分钟高质量视频，还能无限多轮延长，成片可用率提到85%。它走的是对话路线，你用自然语言说想要什么，它自动拆脚本、分镜、角色、场景和音效，不用你连节点调参数。速度上的突破是MiniMax的H3，单张GPU生成15秒768p视频只要13秒，第一次快过实时。模型排位上，Gemini Omni 1.1 Flash登顶arena，字节Seedance和谷歌Veo 3.1 Lite在OpenRouter使用量领先，阿里Wan 3.0支持最长30秒。视频生成正式进入长镜头和成片交付阶段，创作门槛又降了一截。"},{"angle":"创作者视角","text":"做短视频的人，这个月最该关注两件事。一是vivago R1的5分钟成片，对话式生成，说清楚需求就出片，还能在对话里反复改，对不写代码、不连节点的创作者很友好，相当于把专业团队的部分活自动化了。二是选型要看用途：要电影感带原生音效用Veo 3，要平均单条质量看Seedance 2.0，要角色动作和舞蹈看Kling，要本地开源低成本用Wan 2.1。MiniMax H3则把生成速度拉到快过实时，直播和实时互动有戏。别追最新就完事，先看自己要什么镜头、多长、带不带声音，再选工具，不然很容易在排行榜里迷失，白烧时间和钱。"},{"angle":"反常识开场","text":"视频生成快过实时这件事，意味着什么？MiniMax的H3单张显卡13秒产出15秒768p视频，生成速度第一次超过了播放速度。换句话说，以前等AI出一段片子要泡杯茶，现在它边播边生成都跟得上。这直接打开了无限直播和实时互动的可能。另一边，vivago R1把时长从Sora的15秒一口气拉到5分钟成片，靠的是Agent拆解长任务、多子模块协同，让角色和场景在多段落里保持一致。速度突破和时长突破在同一周发生，说明视频生成正从玩具变成生产工具。对内容行业，产能的瓶颈正在从模型能力转向你的创意和剪辑，工具已经够快了。"}]},{"id":"ai4","title":"DeepSeek V4.1 Flash内测：输出速度破500 tokens/s","hook":"DeepSeek放出限时内测，速度直接干到每秒500字。","why":"9月9日当天腾讯研究院披露，时效性极强。速度指标硬，适合做'国产模型速度'选题，开发者群体关注度高。","heat":"中高","tags":["强时效","国产","开发者"],"facts":["9月9日腾讯研究院AI速递：DeepSeek V4.1 Flash中间版本开启内测，采用新模型结构、原生支持多模态，能力更强速度更快成本更低（腾讯研究院 2026-09-09）","开发者实测最高输出速度达507 tokens/s，多人平均超300 tokens/s；每账号限流20并发，9月10日自动下线（腾讯研究院 2026-09-09）","调用方式：保持base_url不变，模型名设为deepseek-v4.1-flash-expires-on-0910；计费与V4 Flash相同（腾讯研究院 2026-09-09）","背景：DeepSeek V4 Flash正式版8月31日上线，官方称模型结构尺寸与预览版一致仅重做后训练，智能体能力大幅跃升（techweb 2026-08-01）","待核实：V4.1 Flash正式版发布时间未定，本内测为限时中间版本，正文仅陈述已验证的内测事实"],"scripts":[{"angle":"干货直给","text":"DeepSeek今天放出一个限时内测，V4.1 Flash中间版本，开发者实测最高输出速度到了507 tokens每秒，多人平均也超过300。什么概念？以前大模型吐字能到每秒几十字算快了，现在直接破五百，写代码、出长文几乎感觉不到等待。它用了新模型结构，原生支持多模态，能力、速度、成本三样都往前挪。调用很简单，base_url不变，模型名改成deepseek-v4.1-flash-expires-on-0910就行，计费跟V4 Flash一样。但要注意，这是中间版本，每账号限流20并发，9月10号自动下线，等于只开一天多的窗口。想试的今天就得动手，过了就等正式版，手慢无。"},{"angle":"说人话版","text":"用大白话解释这个DeepSeek内测值不值得试。第一，它快，输出速度实测最高507 tokens每秒，平均超300，比一般模型快一个数量级，长文本和代码几乎秒出。第二，它新，换了模型结构还原生支持多模态，不只是文字。第三，它便宜，计费沿用V4 Flash的标准，没因为快就加价。第四，它短，这是限时中间版本，9月10号自动下线，每账号还限流20并发，想体验得抓紧。对开发者来说，这是提前摸下一代模型手感的机会；对普通人，记住一句话：国产模型的速度军备竞赛，已经卷到每秒五百字这个级别了，而且还在往上走。"},{"angle":"趋势判断","text":"DeepSeek这个限时内测，透露出模型迭代的两个信号。第一，速度正在成为新的竞争维度，从V4 Flash正式版到V4.1中间版，输出速度直接干到五百tokens每秒，长文本和Agent任务的等待成本被大幅压缩，这对编程和文档类场景是质变。第二，发布节奏在加快，正式版8月31号上线，9月9号就放中间版内测，说明模型更新周期从半年压缩到一两个月。对使用者来说，好处是能力肉眼可见地变强变快，坏处是要不停跟进。建议把核心活先跑在稳定正式版上，新特性等正式发布再迁，别把生产流程绑在限时内测上，掉线了很麻烦。"}]},{"id":"ai5","title":"蚂蚁开源原生多模态Ling-VL：看图写网页超GPT-5.4","hook":"蚂蚁开源一个能'看'会'改'的多模态大模型。","why":"9月9日蚂蚁发布百灵Ling-3.0-flash-VL，视觉反馈循环机制新颖，图片转网页评测超GPT-5.4。技术向但易懂，适合做'多模态落地'选题。","heat":"中高","tags":["国产","多模态","技术"],"facts":["9月9日蚂蚁集团开源百灵系列首个原生多模态大模型Ling-3.0-flash-VL：总参数124B、激活5.5B，原生支持图像/文本/视频输入，上下文256K（蚂蚁官方/IT之家 2026-09-09）","引入视觉反馈循环机制：任务推进为'观察→行动→验证→修正'，医疗报告解读、前端代码生成、GUI自动化中可基于视觉反馈持续修正（蚂蚁官方/IT之家 2026-09-09）","Image-to-WebDev Arena官方评测：模型(代号linthium)得分高于GPT-5.4；图片转网页可理解布局并生成代码、通过渲染对比自我修正（蚂蚁官方/IT之家 2026-09-09）","BF16/FP8版已在Hugging Face与ModelScope开源，FP4/INT4计划近期发布；Ling Studio提供免费体验（蚂蚁官方 2026-09-09）","待核实：纯文本版Ling-3.0-Flash与多模态版对比以Artificial Analysis Intelligence Index v4.1.1为准，正文引用已标注来源"],"scripts":[{"angle":"干货直给","text":"蚂蚁今天开源了百灵系列第一个原生多模态大模型Ling-3.0-flash-VL。它总参数124B但单次只激活5.5B，原生吃图像、文本和视频，上下文窗口256K，能处理长文档和长视频。最不一样的是它引入了视觉反馈机制：任务不是一次性看图出结果，而是观察、行动、验证、修正循环，比如图片转网页，它能理解布局生成代码，再拿渲染结果跟原图对比自我修正。官方在Image-to-WebDev Arena的评测里，这个模型得分超过了GPT-5.4。它还能当GUI智能体，识别界面结构跨工具操作。模型已经在Hugging Face和ModelScope开源，Ling Studio能免费试，开发和研究者都能直接上手。"},{"angle":"说人话版","text":"把这个多模态模型讲成人话。它最关键的不是参数大，而是一个会自我修正的循环：你给它一张图，它不是直接猜个结果交差，而是先看、再动手、然后拿结果验证、不对就改，反复几次。这解决了多模态最常见的问题——一次性出图经常错得离谱还不知道错在哪。最实用的场景是图片转网页，你丢一张设计稿，它生成代码，再自己对比渲染对不对，能自己改到接近。它还能做GUI智能体，认界面、跨工具操作。对普通人，这意味着以后'照图办事'的AI更靠谱了，画图、做网页、处理文档都会更准，少走很多弯路。会自己纠错的AI，才是真能帮上忙的AI。"},{"angle":"横向对比","text":"把蚂蚁Ling-VL和主流多模态放一起看，差异在机制不在参数。很多多模态模型是一次性'看图生成'，错了也不知道；Ling-VL的核心是视觉反馈循环，观察、行动、验证、修正反复跑，在医疗报告解读、前端代码生成、GUI自动化里能基于视觉反馈持续纠偏。效果上，它的图片转网页在Image-to-WebDev Arena评测超过了GPT-5.4。参数上它124B总参只激活5.5B，256K上下文，兼顾能力和成本。开源也很彻底，BF16和FP8已上Hugging Face和ModelScope。比起比谁的 benchmark 高，这种'会自己改'的机制，更像是多模态走向实用的关键一步。"}]}]}]}}</script>

<script>
/* ================= data ================= */
var K={st:'wb_kb_status_v1',rf:'wb_kb_refs_v1',hs:'wb_kb_history_v1',mt:'wb_kb_meta_v1'};
var PACK_TODAY=JSON.parse(document.getElementById('packToday').textContent);
var PACK_HIST=JSON.parse(document.getElementById('packHistory').textContent);
var ST={},RF=[],HS={},MT={};
var curDate=PACK_TODAY.date,curTrack='all',curSt='all',curPane='today';
var STATES=['new','pick','shot','pub'];
var ST_LABEL={new:'未处理',pick:'已选用',shot:'已拍',pub:'已发'};
var ST_CLS={new:'st-new',pick:'st-pick',shot:'st-shot',pub:'st-pub'};

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('存储写入失败，建议先导出备份');return false}}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return n<10?'0'+n:''+n}
function daysBetween(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function wc(s){return (s||'').replace(/\s/g,'').length}
function secOf(s){return Math.round(wc(s)/300*60)}

function boot(){
  ST=lsGet(K.st,{});RF=lsGet(K.rf,[]);HS=lsGet(K.hs,{});MT=lsGet(K.mt,{});
  for(var d in PACK_HIST){if(!HS[d])HS[d]=PACK_HIST[d]}
  HS[PACK_TODAY.date]=PACK_TODAY;
  var keys=Object.keys(HS).sort().reverse();
  if(keys.length>30){keys.slice(30).forEach(function(k){delete HS[k]})}
  lsSet(K.hs,HS);
  curDate=PACK_TODAY.date;
  renderAll();
  checkTip();
}
function packOf(d){return HS[d]||PACK_TODAY}
function allScripts(d){
  var p=packOf(d),out=[];
  (p.tracks||[]).forEach(function(tk){(tk.topics||[]).forEach(function(tp,ti){(tp.scripts||[]).forEach(function(sc,si){
    out.push({id:d+'|'+tk.id+'|'+tp.id+'|'+si,date:d,trackId:tk.id,trackName:tk.name,topic:tp,topicIdx:ti,sc:sc,si:si});
  })})});
  return out;
}
function stOf(id){return (ST[id]&&ST[id].s)||'new'}
function stTs(id){return (ST[id]&&ST[id].t)||null}
function setSt(id,s){
  if(s==='new'){delete ST[id]}else{ST[id]={s:s,t:today()}}
  lsSet(K.st,ST);renderAll();checkTip();
}

/* ================= today ================= */
function buildTodo(){
  var td=today(),items=[];
  Object.keys(HS).sort().reverse().forEach(function(d){
    allScripts(d).forEach(function(x){
      var s=stOf(x.id),t=stTs(x.id);
      if(s==='pub')return;
      if(s==='new'){
        if(d===PACK_TODAY.date)items.push({x:x,kind:'new',od:false,msg:'今天新出的稿，还没看'});
        return;
      }
      var age=t?daysBetween(t,td):0;
      if(s==='pick')items.push({x:x,kind:'pick',od:age>=1,msg:age>=1?('选用了 '+age+' 天还没拍'):'今天选用，等拍'});
      if(s==='shot')items.push({x:x,kind:'shot',od:age>=1,msg:age>=1?('拍完 '+age+' 天还没发'):'今天拍完，等发'});
    })
  });
  items.sort(function(a,b){
    if(a.od!==b.od)return a.od?-1:1;
    var o={shot:0,pick:1,new:2};return o[a.kind]-o[b.kind];
  });
  return items;
}
function renderToday(){
  var items=buildTodo(),od=items.filter(function(i){return i.od});

  var cnt={new:0,pick:0,shot:0,pub:0};

  document.getElementById('stats').innerHTML=
    st('今日新稿',all.length,'')+st('待拍',cnt.pick,'')+st('逾期',od.length,'od')+st('累计已发',pubAll,'dn');

  var show=items.slice(0,8);

  }).join('')+(items.length>8?'<div style="text-align:center;font-size:12px;color:var(--text3);padding-top:4px">还有 '+(items.length-8)+' 项，去口播稿库看全部</div>':'')
  :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>今天没有待办，去选题池挑几条</div>';

  document.getElementById('navBdg').style.display=od.length?'':'none';
  document.getElementById('navBdg').textContent=od.length;

  document.getElementById('overview').innerHTML=p.tracks.map(function(tk){
    return '<div class="card tk-'+tk.id+'" style="margin-bottom:12px;padding:13px 14px">'+

      '<span style="margin-left:auto;font-size:11.5px;color:var(--text3);font-weight:600">'+tk.topics.length+' 条</span></div>'+
      tk.topics.map(function(tp,i){
        var done=tp.scripts.filter(function(_,si){return stOf(td+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
        return '<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.5">'+

function st(l,v,c){return '<div class="stat '+c+'"><b>'+v+'</b><span>'+l+'</span></div>'}

/* ================= topics ================= */
function renderTracks(){
  var p=packOf(curDate);
  var h='<button class="ttab'+(curTrack==='all'?' on':'')+'" data-k="all" onclick="setTrack(\'all\')">全部<span class="s">'+
    p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题</span></button>';
  p.tracks.forEach(function(tk){
    h+='<button class="ttab'+(curTrack===tk.id?' on':'')+'" data-k="'+tk.id+'" onclick="setTrack(\''+tk.id+'\')">'+esc(tk.name)+'<span class="s">'+tk.topics.length+' 选题</span></button>';
  });
  document.getElementById('ttabs1').innerHTML=h;
  document.getElementById('ttabs2').innerHTML=h;
  var f=[['all','全部'],['new','未处理'],['pick','已选用'],['shot','已拍'],['pub','已发']];
  document.getElementById('stfilter').innerHTML=f.map(function(x){
    return '<button class="ttab'+(curSt===x[0]?' on':'')+'" data-k="all" style="font-size:12.5px;padding:8px 4px;min-height:40px" onclick="setStF(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function setTrack(t){curTrack=t;renderTracks();renderTopics();renderScripts()}
function setStF(s){curSt=s;renderTracks();renderScripts()}
function renderTopics(){
  var p=packOf(curDate),h='';
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    h+='<div class="topics-grid">'+tk.topics.map(function(tp,i){
      var fid=tk.id+'_'+tp.id;
      var done=tp.scripts.filter(function(_,si){return stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
      return '<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main">'+
        '<div class="tp-t">'+esc(tp.title)+'</div>'+
        '<div class="tp-tags"><span class="tag hot">热度 '+esc(tp.heat)+'</span>'+
        (tp.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
        '<span class="tag">'+done+'/'+tp.scripts.length+' 已处理</span></div>'+
        '<div class="tp-why"><b>开场钩子：</b>'+esc(tp.hook)+'<br><b>为什么今天做：</b>'+esc(tp.why)+'</div>'+
        '</div></div>'+
        '<div class="fold"><button class="fold-b" onclick="fold(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>事实与数据（'+(tp.facts||[]).length+' 条，念之前先扫一眼）</button>'+
        '<div class="fold-c"><ul class="facts">'+(tp.facts||[]).map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div></div>'+
        '<div class="scripts">'+tp.scripts.map(function(sc,si){return scHtml(tk,tp,sc,si)}).join('')+'</div>'+
        '</div>';
    }).join('')+'</div>';
  });
  document.getElementById('topicList').innerHTML=h||'<div class="card"><div class="empty">这天没有内容</div></div>';
}
function scHtml(tk,tp,sc,si){
  var id=curDate+'|'+tk.id+'|'+tp.id+'|'+si,s=stOf(id),n=wc(sc.text),sec=secOf(sc.text);
  var nx=s==='new'?'pick':(s==='pick'?'shot':(s==='shot'?'pub':'new'));
  var nxL=s==='new'?'选用':(s==='pick'?'标已拍':(s==='shot'?'标已发':'重置'));
  var t=stTs(id),od=(s==='pick'||s==='shot')&&t&&daysBetween(t,today())>=1;
  return '<div class="sc">'+
    '<div class="sc-hd"><span class="sc-a">'+esc(sc.angle)+'</span>'+
    '<span class="sc-m">'+n+' 字 · 约 '+sec+' 秒</span>'+
    '<span class="sc-st '+ST_CLS[s]+'">'+ST_LABEL[s]+(od?' · 逾期':'')+'</span></div>'+
    '<div class="sc-tx" onclick="this.classList.toggle(\'open\')">'+esc(sc.text)+'</div>'+
    '<div class="sc-acts">'+
    '<button class="sbtn pri" onclick="copy(this,'+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>'+
    '<button class="sbtn" onclick="openTele('+q(tp.title+' · '+sc.angle)+','+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M6 8h12M6 12h8"/></svg>念稿</button>'+
    '<button class="sbtn '+(od?'od':(s==='pub'?'act':''))+'" onclick="setSt(\''+id+'\',\''+nx+'\')">'+nxL+'</button>'+
    (s!=='new'?'<button class="sbtn" onclick="setSt(\''+id+'\',\'new\')">撤销</button>':'')+
    '</div></div>';
}
function q(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')+"'"}
function fold(b){b.classList.toggle('open');b.nextElementSibling.classList.toggle('open')}

function renderScripts(){
  var p=packOf(curDate),h='',n=0;
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    tk.topics.forEach(function(tp,i){
      var list=tp.scripts.map(function(sc,si){return {sc:sc,si:si}}).filter(function(o){
        return curSt==='all'||stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+o.si)===curSt;
      });
      if(!list.length)return;
      n+=list.length;
      h+='<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd" style="padding-bottom:0"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main"><div class="tp-t" style="font-size:14.5px">'+esc(tp.title)+'</div></div></div>'+
        '<div class="scripts" style="border-top:none;margin-top:11px">'+list.map(function(o){return scHtml(tk,tp,o.sc,o.si)}).join('')+'</div></div>';
    });
  });
  document.getElementById('scriptList').innerHTML=h||'<div class="card"><div class="empty">没有符合筛选的稿子</div></div>';
}

      '<span>'+esc(r.date)+'</span></div>'+
      (r.note?'<div class="ref-n">'+esc(r.note)+'</div>':'')+

      '</div><button class="xbtn" onclick="delRef(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>';
  }).join(''):'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>刷到好片子就存一条，做选题时翻一翻</div>';
}

/* ================= teleprompter ================= */
var teleSize=26,rolling=false,rollT=null,spd=1;
function openTele(t,x){
  document.getElementById('teleTitle').textContent=t;
  document.getElementById('teleTx').textContent=x;
  document.getElementById('teleBd').scrollTop=0;
  document.getElementById('tele').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeTele(){stopRoll();document.getElementById('tele').classList.remove('on');document.body.style.overflow=''}
function teleFont(d){teleSize=Math.max(16,Math.min(52,teleSize+d));document.getElementById('teleTx').style.fontSize=teleSize+'px'}
function toggleRoll(){rolling?stopRoll():startRoll()}
function startRoll(){
  rolling=true;
  document.getElementById('rollBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>暂停';
  var bd=document.getElementById('teleBd');
  rollT=setInterval(function(){
    bd.scrollTop+=spd*0.6;
    if(bd.scrollTop+bd.clientHeight>=bd.scrollHeight-2)stopRoll();
  },28);
}
function stopRoll(){
  rolling=false;if(rollT)clearInterval(rollT);rollT=null;
  var b=document.getElementById('rollBtn');
  if(b)b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9z"/></svg>自动滚动';
}
function rollSpeed(d){spd=Math.max(.4,Math.min(3,+(spd+d*.2).toFixed(1)));document.getElementById('spdTx').textContent='×'+spd.toFixed(1)}

/* ================= backup ================= */
function doExport(){
  var d={_app:'kouban-workbench',_v:1,_at:new Date().toISOString(),status:ST,refs:RF,history:HS};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='选题台备份_'+today()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  MT.lastBackup=today();lsSet(K.mt,MT);hideTip();toast('已导出备份文件');
}
function doImport(el){
  var f=el.files&&el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      if(d.status)ST=Object.assign({},d.status);
      if(d.refs&&d.refs.length!==undefined)RF=d.refs.slice();
      if(d.history)for(var k in d.history){if(!HS[k])HS[k]=d.history[k]}
      HS[PACK_TODAY.date]=PACK_TODAY;
      lsSet(K.st,ST);lsSet(K.rf,RF);lsSet(K.hs,HS);
      renderAll();toast('已恢复：'+Object.keys(ST).length+' 条标记 / '+RF.length+' 条灵感');
    }catch(e){toast('文件读不出来，确认是本站导出的 JSON')}
    el.value='';
  };
  r.readAsText(f);
}
var mkFn=null;
function askClear(){
  openMask('确认清空全部数据？','会删掉所有标记状态（已选用/已拍/已发）、对标灵感库和历史归档。今天的选题和稿子不受影响，会重新加载。这一步撤不回来，建议先点「导出备份」。',function(){
    localStorage.removeItem(K.st);localStorage.removeItem(K.rf);localStorage.removeItem(K.hs);localStorage.removeItem(K.mt);
    ST={};RF=[];HS={};MT={};HS[PACK_TODAY.date]=PACK_TODAY;lsSet(K.hs,HS);
    closeMask();curDate=PACK_TODAY.date;renderAll();toast('已清空');
  });
}
function openMask(t,p,fn){
  document.getElementById('mkT').textContent=t;document.getElementById('mkP').textContent=p;
  mkFn=fn;document.getElementById('mask').classList.add('on');
}
function closeMask(){document.getElementById('mask').classList.remove('on')}
document.getElementById('mkOk').onclick=function(){if(mkFn)mkFn()};
document.getElementById('mask').onclick=function(e){if(e.target===this)closeMask()};

function checkTip(){
  var n=Object.keys(ST).length+RF.length;
  if(n>=30&&MT.lastBackup!==today()&&!MT.tipHidden){
    document.getElementById('tipTx').textContent='数据已经攒到 '+n+' 条了，建议点右上角导出一份备份。换手机、清缓存都不怕。';
    document.getElementById('tipbar').classList.add('on');
  }else{document.getElementById('tipbar').classList.remove('on')}
}
function hideTip(){MT.tipHidden=today();lsSet(K.mt,MT);document.getElementById('tipbar').classList.remove('on')}

/* ================= misc ================= */
function copy(btn,tx){
  var ok=function(){var o=btn.innerHTML;btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>已复制';setTimeout(function(){btn.innerHTML=o},1400);toast('全文已复制，'+wc(tx)+' 字')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(tx).then(ok,function(){fb()})}else{fb()}
  function fb(){
    var ta=document.createElement('textarea');ta.value=tx;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('复制失败，长按稿子手动选')}
    document.body.removeChild(ta);
  }
}
var tT=null;
function toast(m){
  var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');
  if(tT)clearTimeout(tT);tT=setTimeout(function(){e.classList.remove('on')},2100);
}
function go(p){
  curPane=p;
  document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on')});
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
  window.scrollTo(0,0);
}
function switchDate(d){curDate=d;renderDateSel();renderTracks();renderTopics();renderScripts()}
function renderDateSel(){
  var ks=Object.keys(HS).sort().reverse();
  var h=ks.map(function(d){return '<option value="'+d+'"'+(d===curDate?' selected':'')+'>'+d+(d===PACK_TODAY.date?'（最新）':'')+'</option>'}).join('');
  document.getElementById('dateSel').innerHTML=h;
  document.getElementById('dateSel2').innerHTML=h;
  var bg=curDate===PACK_TODAY.date?'<span class="badge-live">今日最新</span>':'<span class="badge-old">历史归档</span>';
  document.getElementById('dateBadge').innerHTML=bg;
  document.getElementById('dateBadge2').innerHTML=bg;
}
function renderAll(){
  document.getElementById('hdSub').textContent=PACK_TODAY.date+' · 更新于 '+(PACK_TODAY.updatedAt||'10:00')+' · 共 '+allScripts(PACK_TODAY.date).length+' 篇稿';
  var ft='数据只存在这台设备的浏览器里，没有上传服务器。换设备 / 清缓存前记得导出备份。<br>每天 10:00 自动更新新一批选题与口播稿。';
  ['foot1','foot2','foot3','foot4'].forEach(function(i){document.getElementById(i).innerHTML=ft});
  renderDateSel();renderTracks();renderToday();renderTopics();renderScripts();renderRefs();renderStars();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeTele();closeMask()}
});
boot();
