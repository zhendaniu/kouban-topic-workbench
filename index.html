<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="选题台">
<meta name="theme-color" content="#1e293b">
<title>每日选题 · 口播稿工作台</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16191d; --text2:#666e7a; --text3:#98a1ad;
  --line:#e6e8ec; --line2:#f0f1f4;
  --primary:#2563eb; --primary-d:#1d4ed8;
  --travel:#0d9488; --travel-bg:#e7f6f4;
  --ai:#7c3aed; --ai-bg:#f1eafe;
  --danger:#dc2626; --danger-bg:#fdecec;
  --ok:#16a34a; --ok-bg:#e8f6ec;
  --warn:#d97706; --warn-bg:#fdf3e3;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.hd{background:#1e293b;color:#fff;padding:14px 0 16px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.045)}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd-sub{font-size:12.5px;color:#a8b4c6;margin-top:3px}
.hd-acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:rgba(255,255,255,.11);color:#e7edf5;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn svg{width:14px;height:14px;flex:none}

.tipbar{background:var(--warn-bg);color:#8a5a08;font-size:13px;padding:9px 14px;display:none;align-items:center;gap:8px;border-bottom:1px solid #f2e3c6}
.tipbar.on{display:flex}
.tipbar button{margin-left:auto;font-weight:700;color:#8a5a08;padding:4px 8px;font-size:12.5px}

/* ---------- section / card ---------- */
.sec{margin-top:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-hd h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sec-hd .cnt{font-size:12px;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- today ---------- */
.today{background:linear-gradient(180deg,#fff 0,#fcfdff 100%);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.today-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.today-h .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;animation:bp 1.8s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
.today-h h2{font-size:15.5px;margin:0;font-weight:700}
.today-h .n{margin-left:auto;font-size:12px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#f7f8fa;border-radius:10px;padding:9px 8px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--text2)}
.stat.od b{color:var(--danger)}
.stat.dn b{color:var(--ok)}
.tlist{display:flex;flex-direction:column;gap:7px}
.titem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:#f7f8fa;font-size:13.5px}
.titem.od{background:var(--danger-bg)}
.titem .bd{flex:1;min-width:0}
.titem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .m{font-size:11.5px;color:var(--text2);margin-top:1px}
.titem.od .m{color:#b03636}
.titem .go{flex:none;background:var(--text);color:#fff;border-radius:8px;padding:0 12px;height:34px;font-size:12.5px;font-weight:600}
.titem.od .go{background:var(--danger)}
.empty{text-align:center;padding:22px 12px;color:var(--text3);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.3;display:block;margin:0 auto 8px}

/* ---------- track tabs ---------- */
.ttabs{display:flex;gap:8px;margin-bottom:12px}
.ttab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 8px;text-align:center;font-weight:700;font-size:13.5px;color:var(--text2);min-height:46px;transition:.15s}
.ttab .s{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:1px}
.ttab[data-k="travel"].on{background:var(--travel-bg);border-color:var(--travel);color:#0b6b62}
.ttab[data-k="ai"].on{background:var(--ai-bg);border-color:var(--ai);color:#6127c4}
.ttab[data-k="all"].on{background:#e8eefc;border-color:var(--primary);color:var(--primary-d)}
.ttab.on .s{color:inherit;opacity:.75}

/* ---------- topic ---------- */
.topic{margin-bottom:12px;overflow:hidden}
.tp-hd{padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.tp-idx{flex:none;width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
.tk-travel .tp-idx{background:var(--travel)}
.tk-ai .tp-idx{background:var(--ai)}
.tp-main{flex:1;min-width:0}
.tp-t{font-size:15.5px;font-weight:700;line-height:1.42;letter-spacing:.1px}
.tp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;padding:2.5px 7px;border-radius:6px;background:#f0f1f4;color:var(--text2);font-weight:600}
.tk-travel .tag.hot{background:var(--travel-bg);color:#0b6b62}
.tk-ai .tag.hot{background:var(--ai-bg);color:#6127c4}
.tag.hot{font-weight:700}
.tp-why{margin-top:9px;font-size:13px;color:var(--text2);background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.55}
.tp-why b{color:var(--text);font-weight:700}
.fold{border-top:1px solid var(--line2)}
.fold-b{width:100%;text-align:left;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;min-height:44px}
.fold-b svg{width:13px;height:13px;transition:.2s}
.fold-b.open svg{transform:rotate(90deg)}
.fold-c{display:none;padding:0 14px 13px}
.fold-c.open{display:block}
.facts{margin:0;padding-left:17px}
.facts li{font-size:12.8px;color:var(--text2);line-height:1.62;margin-bottom:5px}

/* ---------- script ---------- */
.scripts{border-top:1px solid var(--line2);padding:11px 14px 13px;background:#fbfcfd}
.sc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.sc:last-child{margin-bottom:0}
.sc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc-a{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f7;color:#41546b}
.sc-m{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.sc-st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.st-new{background:#f0f1f4;color:var(--text2)}
.st-pick{background:var(--warn-bg);color:#a15c06}
.st-shot{background:#e8eefc;color:var(--primary-d)}
.st-pub{background:var(--ok-bg);color:#15803d}
.sc-tx{font-size:14px;line-height:1.78;color:#252a31;max-height:78px;overflow:hidden;position:relative;transition:max-height .25s;cursor:pointer}
.sc-tx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.sc-tx.open{max-height:2000px}
.sc-tx.open::after{display:none}
.sc-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);border-radius:9px;padding:0 11px;height:38px;font-size:12.5px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:#fff}
.sbtn svg{width:13px;height:13px}
.sbtn:hover{background:#f7f8fa}
.sbtn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.sbtn.pri:hover{background:#2b3138}
.sbtn.act{background:var(--ok-bg);border-color:#bfe3c9;color:#15803d}
.sbtn.od{background:var(--danger-bg);border-color:#f3cfcf;color:var(--danger)}

/* ---------- refs ---------- */
.form{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);min-height:46px}
.form textarea{min-height:74px;resize:vertical;line-height:1.6}
.frow{display:flex;gap:9px}
.frow>*{flex:1;min-width:0}
.stars{display:flex;gap:3px;align-items:center}
.star{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.star svg{width:21px;height:21px}
.star svg path{fill:#dfe3e8}
.star.on svg path{fill:#f5a623}
.ref{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ref:last-child{border-bottom:none}
.ref-h{display:flex;align-items:flex-start;gap:9px}
.ref-t{font-weight:700;font-size:14.5px;flex:1;min-width:0;line-height:1.45}
.ref-m{font-size:12px;color:var(--text3);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ref-n{font-size:13px;color:var(--text2);margin-top:7px;background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ref-l{font-size:12.5px;margin-top:6px;word-break:break-all;display:inline-block}
.xbtn{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.xbtn:hover{background:var(--danger-bg);color:var(--danger)}
.xbtn svg{width:15px;height:15px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text3);min-height:56px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--primary)}
.nav .bdg{position:absolute;top:5px;margin-left:22px;background:var(--danger);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:8px;font-weight:700}

/* ---------- teleprompter ---------- */
.tele{position:fixed;inset:0;background:#0e1116;color:#f2f4f7;z-index:200;display:none;flex-direction:column}
.tele.on{display:flex}
.tele-hd{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #232a33;flex:none}
.tele-hd .tt{font-size:13px;color:#8e9aa8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{background:#1c222b;color:#cfd7e0;border-radius:8px;min-width:40px;height:38px;padding:0 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbtn svg{width:15px;height:15px}
.tele-bd{flex:1;overflow-y:auto;padding:24px 20px 90px;-webkit-overflow-scrolling:touch}
.tele-tx{font-size:26px;line-height:2.05;letter-spacing:.6px;max-width:820px;margin:0 auto;white-space:pre-wrap}
.tele-ft{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0),#0e1116 32%);display:flex;gap:8px;align-items:center;justify-content:center}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.modal h3{margin:0 0 8px;font-size:16.5px}
.modal p{margin:0 0 16px;color:var(--text2);font-size:13.5px;line-height:1.65}
.modal-a{display:flex;gap:9px}
.modal-a button{flex:1;height:46px;border-radius:11px;font-weight:700;font-size:14px}
.mb-c{background:#f0f1f4;color:var(--text)}
.mb-d{background:var(--danger);color:#fff}

/* ---------- toast / misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(84px + env(safe-area-inset-bottom));background:#16191d;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pane{display:none}
.pane.on{display:block}
.datesel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-bottom:11px;flex-wrap:wrap}
.datesel select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:14px;font-weight:600;color:var(--text)}
.badge-live{font-size:10.5px;background:var(--ok-bg);color:#15803d;padding:3px 7px;border-radius:6px;font-weight:700}
.badge-old{font-size:10.5px;background:var(--warn-bg);color:#a15c06;padding:3px 7px;border-radius:6px;font-weight:700}
.foot{text-align:center;color:var(--text3);font-size:11.5px;padding:22px 12px 8px;line-height:1.7}

@media(min-width:768px){
  body{padding-bottom:24px}
  .wrap{padding:0 22px}
  .hd{padding:18px 0 20px}
  .hd-title{font-size:19px}
  .nav{position:static;background:transparent;backdrop-filter:none;border-top:none;border-bottom:1px solid var(--line);max-width:1180px;margin:14px auto 0;padding:0 22px;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13.5px;padding:11px 15px;border-radius:10px 10px 0 0;min-height:46px}
  .nav button.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}
  .nav .bdg{position:static;margin-left:2px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .topics-grid .topic{margin-bottom:0}
  .tele-tx{font-size:31px}
}
@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hbtn span{display:none}
  .hbtn{padding:8px 10px}
}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap hd-row">
    <div>
      <div class="hd-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 22V12"/></svg>
        每日选题 · 口播稿台
      </div>
      <div class="hd-sub" id="hdSub">加载中…</div>
    </div>
    <div class="hd-acts">
      <button class="hbtn" onclick="doExport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>导出备份</span></button>
      <button class="hbtn" onclick="document.getElementById('impFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg><span>导入恢复</span></button>
      <button class="hbtn" onclick="askClear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span>清空</span></button>
    </div>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">

<div class="tipbar" id="tipbar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px;height:16px;flex:none"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
  <span id="tipTx"></span>
  <button onclick="hideTip()">知道了</button>
</div>

<div class="nav" id="nav">
  <button class="on" data-p="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>今天要处理<span class="bdg" id="navBdg" style="display:none">0</span></button>
  <button data-p="topics" onclick="go('topics')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>选题池</button>
  <button data-p="scripts" onclick="go('scripts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>口播稿库</button>
  <button data-p="refs" onclick="go('refs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>对标灵感</button>
</div>

<div class="wrap">

  <!-- ============ 今天要处理 ============ -->
  <div class="pane on" id="p-today">
    <div class="sec">
      <div class="today">
        <div class="today-h">
          <span class="dot"></span><h2>今天要处理</h2>
          <span class="n" id="todayN"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tlist" id="tlist"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hd"><h2>今日速览</h2><span class="cnt" id="ovCnt"></span></div>
      <div id="overview"></div>
    </div>
    <div class="foot" id="foot1"></div>
  </div>

  <!-- ============ 选题池 ============ -->
  <div class="pane" id="p-topics">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel" onchange="switchDate(this.value)"></select>
        <span id="dateBadge"></span>
      </div>
      <div class="ttabs" id="ttabs1"></div>
      <div id="topicList"></div>
    </div>
    <div class="foot" id="foot2"></div>
  </div>

  <!-- ============ 口播稿库 ============ -->
  <div class="pane" id="p-scripts">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel2" onchange="switchDate(this.value)"></select>
        <span id="dateBadge2"></span>
      </div>
      <div class="ttabs" id="ttabs2"></div>
      <div class="ttabs" id="stfilter" style="margin-top:-4px"></div>
      <div id="scriptList"></div>
    </div>
    <div class="foot" id="foot3"></div>
  </div>

  <!-- ============ 对标灵感 ============ -->
  <div class="pane" id="p-refs">
    <div class="sec">
      <div class="sec-hd"><h2>加一条对标</h2></div>
      <div class="card">
        <div class="form">

<script id="packToday" type="application/json">{"date":"2026-08-07","updatedAt":"2026-08-07 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"一万八的国际机票，退回来四百二","hook":"国际机票最贵的不是票价，是你没点开看的那行退改规则。","why":"强共鸣避坑选题，两周内第二起同类事件，正在全网发酵。国际机票基础运价的规则多数人从没搞懂过，一条视频能救下真金白银，收藏和转发都很高。","heat":"高","tags":["避坑","强时效","省钱"],"facts":["河北邯郸葛先生今年6月6日在某购票平台买了三张6月20日北京飞沙特利雅得的机票，承运人卡塔尔航空，共支付9431元；到大兴机场后被告知签证有问题无法登机，退票后仅收到420元（潇湘晨报·晨视频，2026-08-06；新浪新闻、大河报转载，2026-08-06至08-07）","卡塔尔航空中国客服8月6日回应：该三人6月20日属于误机，退票手续费更高，按规定每人应扣515美元（约合人民币3480元）；因票款不够抵扣退票费用，只能退还部分政府税金，最终每人扣了2690元手续费（潇湘晨报，2026-08-06）","当事人当天又购买了6月24日阿提哈德航空的机票，两次购票共花费约1.8万元；阿提哈德中国客服称其购买的经济舱机票仅为基础运价即最低运价，退票无法全额退款，只能退还一部分税费（潇湘晨报，2026-08-06）","涉事平台称已向用户退还420元保险费用，与航司协商后航司同意每人再退344元；鉴于用户损失较大，平台表示可额外补偿1000元（潇湘晨报，2026-08-06）","国际航协IATA通行的运价体系中，极低折扣舱位往往对应一售概不退换、仅退代收税费的硬性条款（媒体法律分析，2026-08-07，属评论观点，待核实）","7月底曾有1.5万元国际机票退票仅退432元的案例引发关注，舆论发酵后平台上线了低退票率弹窗预警（媒体评论文章，2026-08-07，单一来源，待核实）"],"scripts":[{"angle":"干货直给","text":"买国际机票，最贵的往往不是票价，是退票费。河北一位葛先生，六月六号买了三张北京飞沙特利雅得的票，卡塔尔航空，一共九千四百三十一块。到了大兴机场，签证有问题登不了机，平台说改签不了只能退，最后到手四百二十块。航司八月六号回应了，说人到了但没走成，这算误机，误机退票的手续费更高，按规定每人扣五百一十五美元，折合三千四百八十块。他们三个人的票款加起来还不够抵这笔手续费，所以只能退政府税金。他当天又买了一张阿提哈德的，两趟合计一万八，同样退不出来。问题都出在四个字：基础运价。这是国际票里最低的那一档，对应条款通常就是不可退改，只退代收税费。所以订国际票之前，先点开退改规则那一栏看完再下单。便宜三百块的票，退的时候可能差一万。"},{"angle":"故事切入","text":"三个人凑钱出国打工，到了机场，走不了了。六月二十号，北京大兴，值机柜台告诉他们签证有问题，今天上不了这架飞机。票是六月六号买的，卡塔尔航空飞利雅得，三张九千四百三十一块。打电话给平台，答复是改签不了，只能退。退款到账那天，四百二十块。当事人自己说，那天脑子一热，又买了六月二十四号阿提哈德的票。后来发现签证一时半会解决不了，二十一号申请退，快两个月过去，还是没退回来。两趟加一块一万八。航司的解释挺清楚：人到了机场没登机，按误机算，每人手续费五百一十五美元；第二趟买的是基础运价，只退税费。平台后来说，退了四百二保险费，航司同意每人再退三百四十四，另外补偿一千。故事的教训只有一条：签证没百分之百落地之前，别买不可退的票。"},{"angle":"反常识开场","text":"你以为机票退不了是因为临近起飞，其实跟时间没多大关系，是你买的那档舱位本来就不打算让你退。国际机票的价格不是一个数，是一整套舱位等级。同一趟航班，最低那档叫基础运价，条款里通常写着不可退改，只退代收税费。代收税费是什么？是机场建设费、航空公司代政府收的那部分，往往只占票价的零头。所以才会出现一万八退四百二这种事。八月六号卡塔尔航空的回应更直接：当事人属于误机，每人手续费五百一十五美元，票款不够抵扣，那就只退税。不是航司黑，是这套规则全球通行，写在你打勾同意的那一页里。真正该改的习惯是：比价的时候多看一栏。同一航班贵三百块的可退舱位，本质上是一份保险。行程有任何不确定，这三百块就是最划算的支出。"}]},{"id":"tv2","title":"五台山的票能用两天了，壶口两省一张票通用","hook":"同样的钱，现在能多玩一天——多个景区悄悄改了门票有效期。","why":"8月5日央视新闻集中报道，规则改动直接影响行程安排，实用性强。多数游客还按老规矩一天赶完，讲清楚就能帮人省一趟门票钱，适合做行程规划类内容。","heat":"中高","tags":["行程规划","新规","省钱"],"facts":["山西五台山景区7月31日发布门票规则调整，自2026年8月1日起门票有效期从当日当次使用有效调整为当日及次日内使用有效，有效期内游客可重复入山、不限次数（央视新闻，2026-08-05；央广网、新浪财经转载，2026-08-05）","地跨陕西山西两省的壶口瀑布景区首次推出晋陕通票，已于2026年6月1日起正式实施；打破以往两省分设票价、单独购票的模式，游客在任意一侧购票即可凭票在两天内跨省游览两岸全域景观（央视新闻，2026-08-05）","福建福州闽清宏琳厝景区自2026年8月2日至2027年8月1日免门票一年；日常时段可通过官方小程序实名预约或凭本人身份证原件刷证入园，国家法定节假日执行全员预约、约满即止（闽清县文化旅游投资有限公司公告，2026-08-01）","今年以来全国不少地方文旅部门和景区在门票管理、收费管理上进行优化升级，调整涉及自驾收费、游览期限、跨区域通票等多个方面（央视新闻，2026-08-05）","中国旅游研究院院长戴斌表示，景区运营成本和价格制定过程应该透明，如果景区具有垄断性质价格应当受到合理控制，地方政府不能把景区当成提款机（央视新闻，2026-08-05）"],"scripts":[{"angle":"干货直给","text":"几个景区改了门票规则，直接影响你怎么排行程。第一个，五台山。七月三十一号发的公告，八月一号开始，门票有效期从当日当次改成当日和次日都有效，这两天里可以反复进山，不限次数。以前是出来就作废，现在等于一张票管两天。台怀镇住一晚，第二天接着逛，不用再买第二张。第二个，壶口瀑布。这个景区横跨陕西和山西，以前两省各卖各的票，想看两岸得买两次。今年六月一号起有了晋陕通票，随便哪一侧买票，两天之内可以跨省看两岸全部景观。第三个，福州闽清的宏琳厝，八月二号起免门票一整年，到明年八月一号。平时可以小程序预约，也可以直接刷身份证进；法定节假日必须提前预约，约满就停。这三条都是官方公告，出发前按新规则重排一下时间。"},{"angle":"行程规划","text":"五台山的行程可以重排了。八月一号起，门票有效期变成当日加次日，两天内不限次数进出。按老规矩，很多人是一天冲完五个台顶，累到怀疑人生，还漏一半。现在的排法应该是这样：第一天下午到台怀镇，先把显通寺、塔院寺、菩萨顶这几个核心的走完，晚上住山里。第二天一早上黛螺顶，运气好能赶上云海，再去殊像寺。同一张票，两天，节奏完全不一样。壶口瀑布同理，六月一号起晋陕通票落地，一张票两天内看两岸。以前很多人只看山西侧，觉得陕西侧还要再买一次不值。现在两侧都能去，光线不一样，出片角度也不一样，上午在一侧下午在另一侧最合适。规则改了，攻略也得跟着改，别拿去年的路线套今年的票。"},{"angle":"反常识开场","text":"景区涨价的新闻你看多了，这次反过来，一批景区在悄悄让利，而且是改规则那种真让利。五台山从八月一号起，门票有效期从一天变成两天，中间可以随便进出。这条比降价二十块实在得多，因为它省下的是第二张全票。壶口瀑布六月一号起搞了晋陕通票，陕西山西两侧不再分开卖，一票两天通用。福州闽清的宏琳厝更直接，八月二号开始免票一整年。背后的逻辑其实很清楚，中国旅游研究院院长戴斌八月五号说得挺明白：游客在意的不只是价格高不高，还有收得合不合理；有垄断性质的景区，价格要受合理控制，地方政府别把景区当提款机。门票松绑，客流才愿意留下来过夜、吃饭、住店。真正赚钱的从来不是那张票。"}]},{"id":"tv3","title":"稻城亚丁免票三个月，甘孜318块玩14个景区","hook":"被文旅部点名批评之后，稻城亚丁把门票免了，一免三个月。","why":"省钱幅度极大且有明确时间窗口，8月1日到10月31日正好覆盖暑期尾巴和国庆。甘孜终身畅游卡三折的账算出来很有冲击力，适合做数字对比型内容。","heat":"高","tags":["省钱","强时效","西南线"],"facts":["稻城亚丁景区此前因摆渡车收费不合理、游览路线设置不科学等问题被文化和旅游部批评；7月推出一系列优化整改措施，包括降低交通服务费、对社会车辆实施限流预约通行等（央视新闻，2026-08-05；央广网、腾讯新闻转载，2026-08-05至08-06）","2026年8月1日至10月31日，稻城亚丁景区面向全国游客免收景区门票；未来每年应届中高考考生也将免门票（央视新闻，2026-08-05）","四川甘孜州于2026年1月28日发布景区终身门票政策，分两类：单个景区终身畅游卡，按景区实际票价购一次票即可终身畅游该景区；包含14个收费景区的终身畅游卡，定价分别为318元和317元（央视新闻，2026-08-05）","若把第二类卡中包含的14个景区全部游览完，门票合计需支付1091元，三百多元的终身畅游卡相当于三折（央视新闻，2026-08-05）","甘孜州相关部门估计2026年全年到访游客可达5000万人次（央视新闻，2026-08-05，为地方部门预估数据，待核实）","免收的是景区门票，摆渡车等交通服务费用属于另行收取项目，整改中提到的是降低交通服务费而非取消（据央视新闻2026-08-05表述推断，具体现行收费标准需以景区官方公告为准，待核实）"],"scripts":[{"angle":"干货直给","text":"稻城亚丁免门票了，八月一号到十月三十一号，面向全国游客，三个月。起因是这个景区之前被文化和旅游部批评过，问题是摆渡车收费不合理、游览路线设置不科学。七月开始整改，降低交通服务费，社会车辆限流预约通行，然后就是这三个月免票。要说清楚一点：免的是景区门票，摆渡车这类交通服务费是单独算的，整改说法是降低，不是取消，出发前查一下景区当天的公告。另外同在甘孜州，还有一个终身畅游卡，今年一月二十八号发布的。一种是单景区的，买一次票终身进；另一种包含十四个收费景区，定价三百一十八和三百一十七。这十四个景区门票加起来是一千零九十一块，三百多买断，等于三折。八月到十月这个窗口，正好卡在暑期尾巴和国庆之间。"},{"angle":"成本账","text":"算一笔甘孜的账。第一笔，稻城亚丁，八月一号到十月三十一号免门票，全国游客都算。第二笔，甘孜州的十四景区终身畅游卡，三百一十八块。这十四个景区如果一个个买票，合计一千零九十一块。也就是说，三百多块钱买断，一次玩完就已经省下七百七十多，而且这张卡是终身的，明年后年再去还能用。把两笔叠起来看：一趟川西大环线，稻城亚丁这一站门票直接归零，其余站点走终身卡，门票这一项基本可以从预算表里划掉。剩下的成本就是油钱、住宿和摆渡车。注意摆渡车不在免票范围里，整改的说法是降低交通服务费，不是不收。所以真正的账应该这么列：门票省下的钱，够你在山里多住两晚。这笔账对国庆自驾的人最实在。"},{"angle":"反常识开场","text":"一个景区被主管部门公开批评，通常意味着要涨价整改，稻城亚丁反着来，直接把门票免了三个月。被批的点很具体：摆渡车收费不合理，游览路线设置不科学。整改动作也很具体：降低交通服务费，社会车辆限流预约通行，然后八月一号到十月三十一号全国游客免收门票，以后每年的应届中高考考生也免。这套操作值得看的地方在于，它承认了一件事——景区的钱不该主要从门票上收。同一个甘孜州，一月底就出过终身畅游卡，十四个景区打包三百一十八，而这些景区门票原价合计一千零九十一。三折卖断终身，图的是人来。人来了才有住宿、餐饮、向导、租车。所以下次看到某个景区免票，别急着怀疑有坑，先查清楚免的是哪一项、什么时间窗口，然后订票。"}]},{"id":"tv4","title":"别赶八月底，九月的机票和酒店是一起降的","hook":"八月二十七号前后票价会反弹一次，真正的低价在九月。","why":"决策类内容，直接影响下单时机，受众极广。八月底反弹这个点是反直觉的，多数人以为暑期一结束就便宜，讲清楚开学返校客流这个变量很有说服力。","heat":"中高","tags":["省钱","错峰","购票时机"],"facts":["多个出行平台数据显示，进入9月暑运旺季落幕后部分航线机票价格大幅下降，例如泰州飞贵阳、大连、厦门等地9月降幅超过60%甚至70%（泰州微视听引携程、飞猪平台数据，2026-08-04）","上海飞往贵阳、太原、长春等地未来一两个月最大降幅达到80%；上海去哈尔滨、厦门、泉州等地最低价200元起（泰州微视听引携程APP数据，2026-08-04）","8月底至9月初是多地高校开学季，返校学生客流与错峰出游客流叠加，形成短期脉冲式上涨；业内预判8月27日虽接近暑运尾声，经济舱票价仍会回升至中高位（新浪旅游，2026-08-01）","9月位于暑期与国庆黄金周之间，家庭出游需求明显回落、商务客流尚未全面恢复，市场出现需求真空期，机票与酒店价格同步走低（新浪旅游引大连日报报道，2026-08-01）","8月5日起国内航线机票燃油附加费再次下调，为今年6月以来第三次下调，进一步降低旅客出行成本（央广网，2026-08-06）","有攻略类文章称8月23日至9月初是暑运性价比最高的捡漏窗口，周二周三票价普遍最低（自媒体攻略文章，2026-07-29，非权威来源，待核实）"],"scripts":[{"angle":"干货直给","text":"想省机票钱，记住两个时间点。第一个，八月二十七号前后别走。很多人以为暑假一结束票就便宜，实际反过来。八月底到九月初是全国高校开学季，返校的学生客流和错峰出游的人撞在一起，需求短期反弹，航司会把低价舱位收回去。业内八月一号的判断是，那几天经济舱票价会回升到中高位。第二个，九月才是真便宜。九月夹在暑期和国庆中间，家庭出游需求落下来了，商务客流还没完全恢复，属于需求真空期。八月四号平台数据里，泰州飞贵阳、大连、厦门这些线九月降幅超过六成甚至七成；上海飞贵阳、太原、长春最大降幅到八成，上海到哈尔滨、厦门、泉州最低两百块起。而且九月是机票和酒店一起降，不是只降一头。加上八月五号燃油附加费又下调了一轮，九月出门这笔账很划算。"},{"angle":"横向对比","text":"同一条航线，八月走和九月走差多少，直接看数据。八月四号平台上的降幅榜，泰州飞贵阳、大连、厦门，九月比暑期高峰低六成到七成。上海出发更狠，飞贵阳、太原、长春最大降幅到八成，飞哈尔滨、厦门、泉州最低两百块起。泰州飞福州最低不含税两百块，比坐高铁还便宜。这是机票一侧。酒店一侧，大连当地的报道说九月酒店价格比暑期旺季大幅下降，跟机票是同步的。所以九月出行是双降，机酒两头都省。中间有个坑要避开：八月二十七号前后不是低点。那时候高校陆续开学，返校客流托底，票价会往上顶一次。真要错峰，就把行程排到九月中旬以后、国庆前一周之前，这段是全年容错率最高的窗口。"},{"angle":"反常识开场","text":"暑假结束机票就跌，这个想法每年都让一批人多花钱。真实的曲线是先反弹再下跌。八月中下旬确实有一波尾单，但到了八月二十七号前后，全国高校陆续开学，返校学生客流集中释放，加上错峰出游的人，需求又被顶起来一次。航司这时候优先保客座率和收益，低价折扣舱位反而收缩。业内八月一号的预判就是那几天票价回到中高位，不会延续七月的低水平。真正的低点在九月。这个月没有大节，没有学生潮，家庭出游落幕，商务出行还没完全恢复，是一年里少有的需求真空。八月四号的平台数据能看出来，多条航线九月降幅六到八成，上海出发不少线两百块起。所以别盯着暑假最后一周，把假期挪到九月中旬，同样的钱能多住两晚好酒店。"}]},{"id":"tv5","title":"中秋国庆的出境长线，八月初就已经开抢了","hook":"国庆还有两个月，澳新和欧洲的长线产品预订已经涨了六成。","why":"预订前置是今年最确定的趋势，讲清楚就能帮人抢在涨价前下手。目的地结构的变化也有信息增量，澳新反超传统东南亚这个点很多人还不知道。","heat":"中高","tags":["出境游","国庆","预订时机"],"facts":["同程旅行平台8月4日数据显示，7月31日至8月4日中秋国庆期间出发的机票搜索热度较前5日环比翻倍，度假产品出境游预订热度环比增长60%（同程旅行数据经南京晨报报道，2026-08-07）","从度假产品预订看，澳大利亚、新西兰与欧洲长线热度攀升最为显著；法国、瑞士、意大利、英国、西班牙等欧洲线路因文化内涵与秋季限定景观成为热门（同程旅行数据经南京晨报报道，2026-08-07）","俄罗斯、巴西、马尔代夫、乌兹别克斯坦等免签与签证便利目的地热度持续上涨；韩国、新加坡、马来西亚、泰国等周边国家凭短途便捷与高性价比预订热度走高（同程旅行数据经南京晨报报道，2026-08-07）","截至8月4日，8月跨境机票预订热度较7月增长超过12%，暑期旺季后移趋势正向中秋国庆衔接（同程旅行数据经南京晨报报道，2026-08-07）","国内方面新疆、西藏、甘肃、云南、海南等长线目的地热度靠前，西藏的包车加向导深度游模式持续走红（同程旅行数据经南京晨报报道，2026-08-07）","同程研究院表示，2026年中秋国庆双节叠加形成的超长出行窗口正在重塑跨境游消费节奏，预订决策明显前置，长线目的地预订窗口期显著拉长（同程研究院观点经南京晨报报道，2026-08-07，为平台方观点）"],"scripts":[{"angle":"干货直给","text":"国庆还有快两个月，出境长线已经开抢了。同程八月四号的数据，七月三十一号到八月四号这五天，中秋国庆期间出发的机票搜索热度比前五天翻了一倍，度假产品的出境游预订热度环比涨了六成。抢得最凶的不是东南亚，是澳新和欧洲。澳大利亚、新西兰靠户外体验吸年轻人；法国、瑞士、意大利、英国、西班牙这几条欧洲线，卖的是秋季限定景观。第二梯队是签证友好型：俄罗斯、巴西、马尔代夫、乌兹别克斯坦，热度都在涨。周边的韩国、新加坡、马来西亚、泰国照样稳。还有个数据，八月的跨境机票预订比七月涨了超过一成二，说明暑期旺季本身在后移。结论很直接：长线产品的库存和价格是随预订量走的，现在动手和九月动手，差的可能不止一个数量级。"},{"angle":"趋势判断","text":"今年国庆出境游有个很明显的变化：大家把行程留得更长了。同程研究院八月的说法是，中秋国庆双节叠加形成的超长出行窗口，正在重塑跨境游的节奏。落到数据上有两条。第一，预订决策明显前置。七月底到八月初这五天，中秋国庆的机票搜索热度环比翻倍，出境度假产品预订涨六成。距离出发还有两个月，抢票已经开始。第二，目的地结构在变。以前长假主力是东南亚短线，今年澳新和欧洲长线的攀升最显著。原因不复杂——假期够长，飞十几个小时才划算。供给侧也在配合，航司加密国际航线，目的地推签证便利化措施。这两股力一叠加，长线目的地的预订窗口被明显拉长。对普通人的意思是：想去远的地方，今年是近几年门槛最低的一次，但要早。"},{"angle":"反常识开场","text":"国庆出境游最热的不是泰国，是澳大利亚和新西兰。同程八月四号的数据里，度假产品预订热度攀升最显著的就是澳新和欧洲长线，法国、瑞士、意大利、英国、西班牙都在涨。这事往回推一层就明白了。今年中秋国庆连着，请三天假能凑出很长的窗口，假期一长，人的选择逻辑就变了。短线三五天的性价比优势没了，飞十几个小时反而值。南半球这时候是春天，欧洲是秋色最好的一段，两边都卡在最佳季节。第二梯队也有意思，俄罗斯、巴西、马尔代夫、乌兹别克斯坦这几个涨得快的，共同点是免签或者签证便利。签证这一关一松，目的地立刻上榜。八月的跨境机票预订已经比七月涨了一成二。想赶这波，别等九月看价格，那时候看到的就是抢完之后的价。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"阿里Wan3.0公测，一次直出30秒，720P六毛一秒","hook":"AI视频终于能一次生成30秒，还能把PPT直接变成片子。","why":"对短视频创作者是直接的生产力变化，30秒意味着一条完整叙事不用拼接。价格公开且低，能算出具体成本，实操性极强，是今天最值得做的一条。","heat":"高","tags":["AI视频","强时效","创作工具"],"facts":["阿里新一代视频生成模型Wan3.0于2026年8月6日开启公测，单次可生成30秒视频，支持连续运镜、一镜到底等复杂镜头语言，并配有智能时长功能可按提示词自动推荐时长（阿里云公众号，2026-08-06；腾讯研究院AI速递，2026-08-07）","在文本、图片、音频、视频四种基础模态之外，Wan3.0首次支持doc、xls、ppt、pdf、txt、key、pages、numbers、md等文档格式输入，最多输入一个文件或链接，文件大小不超过100MB、页数不超过50页（阿里云公众号，2026-08-06）","Wan3.0的480P/720P/1080P的API价格分别为0.3元、0.6元、1.2元每秒；API接口将于近期全量开放（阿里云公众号，2026-08-06；爱范儿，2026-08-06）","公测入口包括阿里云百炼、万镜一刻、万相官网和千问创作PC端，千问APP灰度开放（阿里云公众号，2026-08-06）","从Wan1.0到Wan3.0，万相模型家族一共迭代了8个版本（阿里云公众号，2026-08-06）","Wan官网列出的能力包括原生30秒时长、最多支持20个参考素材、12种语言长文本渲染、最多9张图融合、最多12张连续一致的图（wan.video官网，2026-08-07）","官方承认Wan3.0在声音质感与文字准确度方面仍有进步空间（阿里云公众号，2026-08-06）","有媒体称720P每秒0.6元约为主流模型六折，并对比竞品Seedance 2.5定价480p每秒0.67元、720p每秒1.51元（爱范儿2026-08-06、ITBEAR 2026-08-07，竞品定价为知情人士透露，待核实）","有报道称目前单次可生成30秒视频的只有两家（爱范儿，2026-08-06，单一来源，待核实）"],"scripts":[{"angle":"干货直给","text":"阿里的Wan3.0八月六号开公测了，三个变化跟做内容的人直接相关。第一，单次能生成三十秒。以前十秒一段，一条片子要抽几十次卡再拼，现在三十秒够装下一段完整叙事，连续运镜、一镜到底都能在一次生成里跑完。它还带智能时长，按提示词自动推荐该多长，不够可以再延。第二，能吃文档。除了文字图片音频视频，这次第一次支持doc、xls、ppt、pdf、md这些格式，一个文件不超过一百兆、五十页。上传一份产品PPT加一句提示词，直接出形象片。第三，价格公开了。四百八十P三毛一秒，七百二十P六毛，一千零八十P一块二。七百二十P生成三十秒，成本大概十八块。入口在阿里云百炼、万相官网和千问创作PC端，千问APP在灰度。官方也说了短板，声音质感和文字准确度还在打磨。"},{"angle":"功能详解","text":"把Wan3.0这次升级拆开看，真正值钱的是三个点。第一个是时长。三十秒是个门槛数字，因为一段有起承转的叙事大概就需要这么长。以前模型只给五到十秒，创作者被迫用碎片拼，人物一换镜就走样。三十秒之内，角色、道具、声音、空间关系和风格能保持一致，这才叫能用。第二个是输入端。它现在能读文档、表格、网页，一个文件最多一百兆、五十页。这意味着教学课件、产品演示、动态图表、业务汇报这类东西，可以直接从原始素材转成视频，中间那道改脚本的活省了。第三个是编辑。支持改画面、改剧情、改台词，可以定位到某个时间区间只改出问题的那几秒，其余保留。从Wan1.0到3.0一共迭代了八个版本，这一版是第一次让工作流成立。"},{"angle":"成本账","text":"算清楚一条AI视频现在要花多少钱。Wan3.0公布的价格是按秒计：四百八十P三毛，七百二十P六毛，一千零八十P一块二。做短视频最常用七百二十P，一条三十秒就是十八块。假设你一条成片要试五版，九十块。再假设十条里出一条能用的，单条爆款的模型成本一千八百块左右。这个数字放在两年前想都不敢想，那时候光渲染就不止这个价。横向看，有媒体拿它跟同规格竞品比，七百二十P的定价差了一倍多，说是主流水平的六折，不过竞品价格是知情人士口径，这条打个问号。真正要注意的是另一笔账：便宜之后，成本瓶颈就从生成转到筛选了。你每天能看多少条、判断多少条，才是产能上限。工具降价，眼力才值钱。"}]},{"id":"ai2","title":"DeepSeek要涨价了，而且说涨幅较大","hook":"把整个行业价格打下来的那家，自己先宣布要涨了。","why":"标志性转折事件，五家以上权威媒体同日报道，官方公告一手可查。对所有用AI工具的人都是成本变化，普通人也听得懂，讨论度天然高。","heat":"高","tags":["强时效","行业趋势","成本"],"facts":["2026年8月6日，DeepSeek在开放平台发布公告，计划近期整体上调DeepSeek API服务的定价，预计涨幅较大，提醒用户合理安排使用，具体调价方案以正式通知为准（DeepSeek开放平台公告，经证券时报、新浪财经、科创板日报、China Daily报道，2026-08-06）","当前DeepSeek V4-Flash平时价格为缓存命中输入0.02元每百万Tokens、缓存未命中输入1元、输出2元；V4-Pro对应为0.025元、3元、6元（DeepSeek开放平台定价，经证券时报、新浪财经报道，2026-08-06）","今年6月底DeepSeek引入峰谷分时计费机制，工作日9:00-12:00和14:00-18:00高峰时段价格为平时的两倍，其余时段执行平时价格（证券时报、科创板日报，2026-08-06）","今年5月DeepSeek宣布V4-Pro限时折扣转为永久价格，API价格维持在原定价的四分之一，折合每百万Token输入约0.44美元、输出约0.87美元；同期OpenAI GPT-5.5为5美元和30美元，Anthropic Claude Opus 4.7为5美元和25美元（证券时报，2026-08-06）","据海外开发者平台OpenCode披露，8月1日V4-Flash单日处理Token总量达8万亿，其中5万亿来自免费试用、3万亿来自付费调用（证券时报，2026-08-06）","今年3月国家数据局披露，我国日均Token调用量已突破140万亿，较2024年初的1000亿增长超过千倍（证券时报引国家数据局，2026-08-06）","年内智谱、月之暗面、MiniMax等多家机构已进行价格上调；腾讯云连续两次宣布涨价，智谱AI年内三次上调API价格（金融时报经腾讯新闻2026-08-06、科创板日报2026-08-06）","工信部信息通信经济专家委员会委员盘和林分析，此次涨价主要源于成本上升，是否持续上涨还要看后续AI算力成本情况（金融时报，2026-08-06）","OpenRouter周榜显示DeepSeek V4 Flash调用量位居全球首位，8月4日曾因访问量过大出现容量不足（新浪财经2026-08-06；注：不同报道调用量有6.6万亿与7.22万亿两种口径，待核实）"],"scripts":[{"angle":"干货直给","text":"八月六号，DeepSeek在开放平台发了个公告：计划近期整体上调API服务定价，预计涨幅较大，提醒用户合理安排使用。具体涨多少、什么时候生效，还没说。先看现在的价。V4-Flash每百万token，缓存命中输入两分钱，未命中一块，输出两块；V4-Pro是两分五、三块、六块。另外六月底已经加过一次峰谷计费，工作日上午九点到十二点、下午两点到六点，价格翻倍。这次是整体上调，跟上次那种分时段不一样。原因摆在明面上：调用量顶不住了。八月一号V4-Flash单日处理八万亿token，其中五万亿是免费试用。八月四号还因为访问量太大出现过容量不足。行业不止它一家，年内智谱、月之暗面、MiniMax都涨过，腾讯云涨了两次。用API做产品的，现在就该重算成本。"},{"angle":"趋势判断","text":"把DeepSeek这次涨价放进两年的时间线里看，是一个拐点。二零二四年四月，它把API价格打到输入一块、输出两块，直接引爆国内价格战。今年五月，又宣布把限时折扣转成永久价，定价只有原来的四分之一，折合下来每百万token输入四毛四美元、输出八毛七美元。同期OpenAI是五美元和三十美元，Anthropic是五美元和二十五美元。十倍以上的差价，这才有了全球开发者往中国模型迁的那一波。六月底开始转向，先是峰谷计费高峰翻倍，八月六号直接预告整体上调、涨幅较大。逻辑不复杂：算力供需紧、芯片和运营成本涨，靠低价换规模撑不住。工信部专家委员会的盘和林说得直白，主因是成本上升。整个行业正在从抢用户，回到成本能扛得住的定价。"},{"angle":"反常识开场","text":"AI越用越便宜，这个共识今年可能要打个折。八月六号DeepSeek公告说要整体涨价，涨幅较大。往前数，年内智谱涨了三次，腾讯云涨了两次，月之暗面、MiniMax也都动过价。反常识的点在于，涨价恰恰不是因为没人用，是因为用的人太多。八月一号V4-Flash一天处理八万亿token，四号直接被挤到容量不足。高盛的看法也是，高峰时段调价不代表需求走弱，反而说明算力资源趋紧。更大的背景是国家数据局今年三月披露的数字：全国日均token调用量突破一百四十万亿，比二零二四年初的一千亿涨了一千多倍。一千倍的用量涨上去，单价再低也扛不住总成本。所以接下来省钱的思路要变：不是找更便宜的模型，是让同一件事少烧token。"}]},{"id":"ai3","title":"ChatGPT免费用户能无限聊了，还多了个思考按钮","hook":"纯文字聊天的算力，OpenAI已经不打算收钱了。","why":"覆盖人群最广的一条AI消息，免费用户直接受益。多个来源同日确认且有官方公告，配合价格下调背景能讲出行业逻辑，普通观众也听得进去。","heat":"高","tags":["强时效","工具更新","免费"],"facts":["2026年8月6日OpenAI宣布更新ChatGPT，取消所有用户基于文本的聊天使用限制，相关更新预计从下周开始发布（OpenAI官网公告，经财联社2026-08-07、cnBeta 2026-08-07报道）","免费版和Go用户的默认模型更新为GPT-5.6 Luna，取代此前的GPT-5.5 Instant（界面新闻2026-08-06、财联社2026-08-07、网易科技2026-08-07）","免费用户以及每月8美元的Go套餐订阅者将获得新的Think思考按钮，可让模型花更多时间推理以回答更复杂的问题（财联社，2026-08-07）","文件上传、图片分析、语音对话、AI绘图等更消耗算力的功能仍保留单独的配额限制（财联社2026-08-07、cnBeta 2026-08-07）","Plus和Pro用户获得升级后的GPT-5.6 Sol，新增可调节思考深度的滑块；该版本与用于Codex和Work的GPT-5.6 Sol不同，后者保持不变（cnBeta 2026-08-07、网易科技2026-08-07）","OpenAI内部评估显示，相比GPT-5.5-Instant，GPT-5.6 Luna的事实性错误率降低62%，GPT-5.6 Sol降低68%（cnBeta引OpenAI内部评估，2026-08-07）","此次更新发布之际ChatGPT全球每周活跃用户数刚突破10亿（cnBeta，2026-08-07）","上月底OpenAI曾宣布下调GPT-5.6家族价格，其中Luna下调80%至每百万输入词元0.20美元、输出1.20美元，此前分别为1美元和6美元；Terra下调20%（财联社，2026-08-07）","有消息称OpenAI最快下周推出全新预训练模型Astra，内部代号mewfour（IT之家、界面新闻，2026-08-07，待核实）"],"scripts":[{"angle":"干货直给","text":"八月六号OpenAI更新了ChatGPT，免费用户这次是真受益。第一条，文字聊天不限次数了。以前免费号聊几轮就被限速，现在纯文本对话取消上限。第二条，免费版和Go用户的默认模型换成GPT-5.6 Luna，替掉原来的GPT-5.5 Instant。按OpenAI自己的内部评估，Luna比原来那个模型的事实性错误率低了六成二。第三条，多了个Think按钮，遇到复杂问题点一下，让它多想一会再答。有几个限制要说清楚：无限的只是文字。上传文件、图片分析、语音对话、AI画图这些吃算力的，配额照旧。发布节奏上，Plus和Pro的Sol更新已经生效，免费版和Go版这周陆续推，无限聊天和Think按钮下周全量。这个时间点它的周活刚过十亿。"},{"angle":"横向对比","text":"同一周里，两家头部公司走了相反的方向，对比着看很有意思。八月六号OpenAI宣布ChatGPT文字聊天不限量，免费用户默认模型升到GPT-5.6 Luna，还送了个Think按钮。同一天，DeepSeek发公告说要整体上调API定价，预计涨幅较大。看起来矛盾，其实是两个市场。OpenAI放开的是C端纯文本对话，这部分算力现在最便宜——它上月底刚把Luna的价格降了八成，每百万输入词元从一美元降到两毛，输出从六美元降到一块二。成本降到这个程度，聊天当赠品送得起。DeepSeek要涨的是B端API，那边跑的是智能体和代码任务，单个任务的token消耗比聊天高一个量级，还得抢GPU。结论是：以后闲聊会越来越免费，真干活会越来越贵。你的钱该花在哪一头，很清楚了。"},{"angle":"反常识开场","text":"OpenAI把聊天免费了，不是因为大方，是因为聊天已经不值钱了。八月六号的更新里，文字对话取消次数限制，免费用户默认换成GPT-5.6 Luna。关键在上个月底的另一条消息：Luna的调用价格降了百分之八十，每百万输入词元从一美元降到零点二美元，输出从六美元降到一点二美元。成本掉到这个量级，十亿周活的纯文本聊天才送得起。同时被保留的限制更说明问题——文件、图片、语音、画图，全部还有配额。这些才是真烧算力的部分。给Plus和Pro的升级也一样，重点是那个思考深度滑块，让你自己决定花多少推理量。整件事的信号是：AI公司的收费点正在从对话次数，转到推理强度和多模态。以后区分免费和付费的，不是你能问多少句，是你要它想多深。"}]},{"id":"ai4","title":"AI短剧成本从四十万砍到四万，钱正在疯狂涌进来","hook":"三个月，四家AI视频公司融了将近三百亿。","why":"对做内容的人是直接的行业风向，成本从三十万降到三万这个数字冲击力极强。融资数据来自权威财经媒体，可讲赛道格局也可讲个人机会，延展性好。","heat":"高","tags":["AI视频","行业趋势","短剧"],"facts":["近三个月可灵AI、生数科技、爱诗科技、演语科技四家公司披露的新增融资合计已接近300亿元人民币（经济参考报，2026-08-07）","可灵AI落地近30亿美元融资，投后估值有望达到180亿美元，创全球视频大模型公司最大额融资纪录；由CPE源峰、国方创投、BlueFive、腾讯、中关村科学城基金、中信证券联合领投，阿里云、百度等产业资本及华策影视等文娱产业方参与（经济参考报，2026-08-07）","中影年年CTO、首席科学家蔡一铭表示，AI短剧制作成本已从传统实拍的30万至50万元压缩至3万至5万元，质量已达到可商用标准（经济参考报，2026-08-07）","7月生数科技完成5亿美元融资由阿里云领投；同月爱诗科技C轮累计融资29.8亿元由阿里巴巴领投；6月演语科技完成近3亿美元B轮融资，投后估值超20亿美元（经济参考报，2026-08-07）","可灵AI 2026年6月初全球用户突破1亿，较2025年底的6000万增长约67%，覆盖224个国家和地区；2026年第一季度营业收入超6.5亿元人民币，同比增长超300%（经济参考报引可灵AI产品及运营负责人温园旭，2026-08-07）","昆仑万维董事长兼CEO方汉称，2026年3月底公司短剧及AI短剧平台单月流水超4800万美元，截至2026年6月底AI短剧平台业务ARR已突破7亿美元（经济参考报，2026-08-07）","中信证券研报以游戏引擎行业近三十年演化为参照，认为AI视频生成模型行业能够穿越周期的有效玩家数量或收敛至个位数，终局格局或呈现3至4家头部差异化并存的寡头竞争态势（经济参考报，2026-08-07）","行业共同面临的挑战包括算力成本高企、C端用户留存率偏低、版权合规风险（经济参考报，2026-08-07）","爆款AI短剧虚拟女主角单条短广告报价高达数十万元的消息在业内引发热议（经济参考报，2026-08-07，属行业传闻，待核实）"],"scripts":[{"angle":"数据向","text":"先看几个数。近三个月，可灵、生数科技、爱诗科技、演语科技这四家AI视频公司，披露的新增融资加起来接近三百亿人民币。其中可灵拿了近三十亿美元，投后估值有望到一百八十亿美元，是全球视频大模型公司里最大的一笔。领投方名单很有意思，腾讯、阿里云、百度罕见同台，中信证券和中关村科学城基金也在里面。这些平时是对手的公司，一起投了同一家。再看一个更接地气的数：中影年年的CTO蔡一铭说，AI短剧的制作成本已经从传统实拍的三十万到五十万，压到三万到五万，质量到了可商用标准。降一个数量级。产能这边，可灵今年六月初全球用户破一亿，一季度营收超六点五亿，同比涨了三倍多。钱、成本、用户三条线同时动，这个赛道今年的变化会很快。"},{"angle":"故事切入","text":"一部短剧，以前要三十万到五十万，现在三万到五万能做完，质量还能商用。说这话的是中影年年的CTO蔡一铭，八月七号经济参考报的报道。这句话背后是一整个行业在换算法。同一篇报道里，近三个月四家AI视频公司融了将近三百亿人民币，可灵一家就拿了近三十亿美元，估值奔着一百八十亿美元去。腾讯、阿里云、百度这三家平时打得厉害的，这回一起进了可灵的股东名单。为什么资本这么急？因为账已经算得清了。昆仑万维说，到今年六月底，它的AI短剧平台业务年度经常性收入超过七亿美元。可灵一季度营收六点五亿人民币，同比涨超三倍。成本降一个数量级，收入涨三倍，中间那块差价就是所有人在抢的东西。对个人创作者，机会窗口也就是这一两年。"},{"angle":"成本账","text":"把AI短剧的成本账摊开算。传统实拍一部短剧，三十万到五十万，这里面是场地、演员、灯光、摄影、后期，人是最大头。换成AI生产，中影年年给的数是三万到五万，降幅九成左右，而且明确说质量已达到可商用标准。省下来的钱去哪了？去了算力和人力结构的重排。你不再需要剧组，需要的是会写提示词、懂镜头语言、能筛片的人。这也是为什么资本敢下重注：近三个月四家公司融了近三百亿，可灵一家近三十亿美元。但风险要说清楚。中信证券的研报判断，这个行业能穿越周期的玩家可能只剩个位数，终局是三到四家头部并存。行业公认的三个难题还在：算力成本高、C端留存低、版权合规。所以别去卷模型，去卷内容——那才是你的位置。"}]},{"id":"ai5","title":"AI视频别再抽卡了，锁人物、定区间、只改那几秒","hook":"抽卡是赌博，迭代才是干活，这两种用法的成本差十倍。","why":"纯实操玩法，长效不过时，跟当天的Wan3.0新闻互补。多数人用AI视频还停在反复重生成，讲清楚工作流能立刻提升产出效率，适合做保姆级教程。","heat":"中高","tags":["实操","AI视频","工作流"],"facts":["Wan3.0的视频编辑能力大幅提升，支持修改画面、剧情与台词，创作者可以定位到某个时间区间只改出问题的那一段，保留其余部分（阿里云公众号2026-08-06、爱范儿2026-08-06）","在参考生视频任务中，角色的五官、发型发色、形体、服饰、配饰等细粒度特征可稳定保持；道具的多角度外观、硬件结构、Logo、材质细节也保持稳定（阿里云公众号，2026-08-06）","爱范儿实测：以参考图作为首帧并要求模型严格保持人物视觉身份时，脸部特征与服装款式的保持是实质性的；但同一段提示词的输出结果不同，若要长期沿用同一张脸，需在下次生成时把参考图给模型（爱范儿，2026-08-06）","Wan3.0支持最多20个参考素材输入，支持最多9张图融合，可生成最多12张风格与主体一致的连续图像（wan.video官网，2026-08-07）","支持上传doc、xls、ppt、pdf、md等文档，最多一个文件或链接，不超过100MB、50页；上传产品图加一份介绍文档配提示词即可生成完整形象片（阿里云公众号，2026-08-06）","智能时长功能可根据提示词自动推荐合适时长，搭配视频延长功能可延展剧情走向（阿里云公众号，2026-08-06）","官方与实测均指出Wan3.0在声音质感与文字准确度方面仍有提升空间，环境音的空间感偶尔与画面贴合度不足（阿里云公众号2026-08-06、爱范儿2026-08-06）","按阿里云公布的720P每秒0.6元推算，一条30秒视频单次生成成本约18元（据2026-08-06公布单价推算）"],"scripts":[{"angle":"实操流程","text":"用AI做视频，同样一条片子，有人花两百有人花两千，差别在流程。给你一套能直接照抄的顺序。第一步，先定人。用一张参考图当首帧，在提示词里明确要求保持人物的视觉身份，五官、发型、服饰、配饰全部锁死。实测下来脸和衣服的保持是实打实的。关键一点，同一段提示词每次输出都不一样，所以你选定的那张脸要存好，下次生成继续把它喂进去。第二步，定基调。先出一版低分辨率的，四百八十P三毛一秒，用来确认镜头、节奏、光线对不对，别一上来就跑一千零八十P烧钱。第三步，只补差的那几秒。现在支持定位到某个时间区间，单独改画面、改剧情、改台词，其余保留。三十秒里通常只有两三秒有问题，改那两三秒就行。第四步，最后一遍高清出片。"},{"angle":"避坑清单","text":"用AI视频最烧钱的几个习惯，一条条说。第一，无脑重生成。看到不满意就整条重跑，三十秒七百二十P一次十八块，跑二十次三百六。正确做法是定位到出问题的那个时间区间，只改那一段。第二，不给参考图。同一段提示词每次输出的脸都不一样，你想做系列内容，第二条视频主角就换人了。解决办法是把第一次选中的那张脸存下来，之后每次都当参考素材传进去。第三，一上来就跑最高清。定镜头、定节奏的阶段用四百八十P，三毛一秒，确认没问题再上高清。第四，指望它把声音也做好。官方自己承认声音质感和文字准确度还在打磨，环境音的空间感容易出戏，配音和音效老老实实自己后期。第五，忽略文档输入。产品图加一份介绍文档丢进去，比你憋半天提示词管用。"},{"angle":"方法论","text":"AI视频有两种用法，决定了你是玩票还是干活。第一种叫抽卡：写一段提示词，反复重生成，等一个运气好的结果。这种方式的问题不是慢，是不可控——你没法承诺交付时间，也没法做系列内容，因为下一条的主角可能就换脸了。第二种叫迭代：先用参考图把角色形象锁住，确认视觉基调，生成之后找出有问题的时间段做局部修改。差别在于，迭代是可以积累的。你的参考素材库、提示词模板、修改经验，每做一条都在变厚。现在的模型已经支持这套流程了，最多能吃二十个参考素材，能定位区间改台词改剧情。工具变化的真正意义在这：它不再替你做决定，只是让你的决定更容易落地。门槛降了，天花板没降。会用的人，产能是别人的十倍。"}]}]}]}</script>
<script id="packHistory" type="application/json">{"2026-08-06":{"date":"2026-08-06","updatedAt":"2026-08-06 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"8月5号起机票油费又降了，长途一张少一百","hook":"汽油前几天刚涨，机票的油费反而降了，长途一张票比五月省一百块。","why":"强时效省钱信息，8月出行人群基数极大。出票日期为准这条规则多数人不知道，能直接改变下单时机，收藏与转发率高。三个月连降的走势也有解释空间。","heat":"高","tags":["强时效","省钱","出行必备"],"facts":["自2026年8月5日（出票日期）起，国内航线燃油附加费下调：800公里以上航线每位成人70元，800公里（含）以下40元，较调整前分别降低30元和10元（央视网、新华社，2026-08-05）","这是今年6月以来第三次下调国内航线燃油附加费，也是连续第三个月下调（央视网、北京青年报，2026-08-05）","与5月16日年内峰值（800公里以下90元、800公里以上170元）相比，长途航段累计降幅达100元，短途降50元（北京青年报2026-08-05、南方日报2026-08-01）","今年以来国内燃油附加费累计已有六轮调价：1月5日为年内最低（短途10元、长途20元），4月5日、5月16日连续两轮上调，6月5日、7月5日、8月5日连续三轮下调（央视新闻转天津交通广播，2026-08-05）","燃油附加费起征以原出票日期为准，与航班起飞时间无关；2026年8月5日以前销售的国内客票，如变更至8月5日（含）以后，已收取的燃油附加费不退不补（北京青年报，2026-08-05）","按民航局相关规定，婴儿免收燃油附加费；儿童（含无成人陪伴儿童）、革命伤残军人和因公致残的人民警察按半价收取（北京青年报转述民航局规定，2026-08-05）","燃油附加费以航空煤油出厂价为核心联动依据，基准线为5000元/吨，参考过去一个月航油平均价，超出部分的80%通过燃油附加费解决，与国际原油价格并非同步波动（央视网，2026-08-05）","2026年7月下旬国际油价重心上移，推动7月31日国内汽柴油每吨分别上调685元和655元，与燃油附加费走势相反（央视网，2026-08-05）"],"scripts":[{"angle":"干货直给","text":"从八月五号出票的国内机票，燃油附加费降了。八百公里以上的航线，成人每人收七十块，八百公里以内收四十块，比之前分别少了三十和十块。这是六月以来第三次下调，连着三个月降。跟五月十六号年内最高点比，长途一张票的油费从一百七降到七十，直接少一百块，短途从九十降到四十，少五十。关键在时间点，燃油附加费按出票日期算，跟你哪天起飞没关系。八月五号零点之前出的票，哪怕航班在下个月飞，还是按老标准收，而且已经收的钱不退不补。所以八月要出门又还没下单的，等过了零点再买。还有几条容易被忽略的：婴儿不收燃油附加费，儿童、革命伤残军人、因公致残的人民警察按半价收。一家三口出行，光这一项就能省出一顿饭钱。"},{"angle":"成本账","text":"算笔账你就知道要不要等。八月五号起，八百公里以上航线的燃油附加费是七十块，以内是四十块。往前推，五月十六号是年内最高，长途一百七、短途九十。也就是说同一张北京飞乌鲁木齐的票，五月买和现在买，光油费差一百块，一家四口就是四百。今年以来这项费用一共调了六轮，一月五号最低，长途才二十块，四月和五月连着两轮往上冲，五月中触顶，之后六月五号、七月五号、八月五号连降三次。规则上它盯的是航空煤油出厂价，基准线是每吨五千块，超过才开始收，超出部分的百分之八十摊到旅客头上。所以它跟加油站的油价不是一回事。你要做的很简单：八月出行的票别急着在四号晚上下单，拖到五号零点之后。"},{"angle":"反常识开场","text":"前几天汽油刚涨完，一吨汽油柴油分别加了六百多，很多人以为机票也要跟着贵。结果反过来，八月五号起国内航线的燃油附加费又降了，长途七十、短途四十，比之前少三十和十块。原因在两套定价机制根本不是一回事。加油站的油价严格绑国际原油均价，每十个工作日开一次调价窗口，跟得又快又紧。机票的燃油附加费看的是航空煤油出厂价，参考过去一个月的均价，基准线每吨五千块，超过五千才开始收，而且只把超出部分的八成转给旅客。上个月航煤在跌，所以这个月的附加费接着降，这已经是六月以来第三次。提醒一句，这项费用按出票日期算，不看起飞时间，五号零点前买的票即便八月底才飞，也退不了那三十块。"}]},{"id":"tv2","title":"俄罗斯免签延到2027年底，30天说走就走","hook":"原本九月十四号就到期的俄罗斯免签，普京签令直接续到二七年底。","why":"政策类硬信息，官方一手来源（驻外总领馆）可查。多数人以为免签今年秋天就结束，信息差大。配合中俄双向免签和口岸客流数据，可信度和实用性都够，适合做长效攻略。","heat":"中高","tags":["政策","出境游","免签"],"facts":["7月20日，俄罗斯总统普京签署总统令，将现行对持普通护照中国公民免签政策延长至2027年12月31日（中国驻哈巴罗夫斯克总领事馆，2026-07-23）","据普京2025年12月1日签署的原命令，该免签原定执行至2026年9月14日（含），本次为延期（澎湃新闻转央视新闻、国家移民管理局，2026-07）","免签适用事由为探亲或商务访问、旅游，或参加科学、文化、社会政治、经济、体育活动，或过境俄罗斯联邦领土，停留不超过30天（澎湃新闻转央视新闻，2026-07）","中方于2026年5月20日宣布将对俄罗斯单方面免签政策延长至2027年12月31日，俄方7月20日对等延长，形成双向政策（呼伦贝尔市人民政府，2026-07-31）","2026年上半年满洲里十八里海关共监管进出境旅客34.14万人次、进出境客运车辆15915辆次，同比分别增长64.44%和34.39%（呼伦贝尔市人民政府，2026-07-31）","7月出境热门目的地中莫斯科进入前十，到达旅客量同比增长约12%，受益于俄罗斯延长对中国公民免签政策（航旅纵横，解放日报，2026-08-05）","中国驻哈巴罗夫斯克总领馆提醒：护照有效期须覆盖在俄停留期；因免签政策之外事由来俄务必提前办妥相应类别签证；入境后不从事与来俄目的不符的活动（2026-07-23）","满洲里已打通离境退税渠道并推动即买即退政策落地，上半年累计办理离境退税24笔、涉及货值4万元（呼伦贝尔市人民政府，2026-07-31）","待核实：俄总理米舒斯京8月4日称实行互免旅游签后赴俄中国游客明显增多，并提及中俄正讨论永久免签，该表述目前见于社交媒体转述，未见官方通稿原文"],"scripts":[{"angle":"干货直给","text":"去俄罗斯这件事，门槛又低了一档。七月二十号普京签了总统令，把中国公民的免签政策延长到二零二七年十二月三十一号。这不是新开的口子，是原本要在今年九月十四号到期的政策续了两年多。持普通护照，探亲、商务访问、旅游、参加科学文化体育活动，或者只是过境，都能免签进俄罗斯，停留不超过三十天。中方那边五月二十号已经先宣布把对俄免签延到同一天，现在是双向对等。数据也跟上了，满洲里十八里海关上半年监管进出境旅客三十四万人次，同比涨了六成四，客运车辆涨三成四。七月出境目的地里莫斯科挤进了前十，到达旅客同比涨百分之十二。要注意，免签不等于随便待，护照有效期必须覆盖你在俄停留的整段时间。"},{"angle":"行程规划","text":"三十天免签能怎么排，给个可执行的框架。先定入境方式。飞莫斯科或圣彼得堡最省事，直飞城市多；如果你在东北，走满洲里陆路口岸更便宜，上半年这个口岸的出入境旅客涨了六成四，通关流程已经很成熟。八到十天的话，莫斯科三天加圣彼得堡四天最稳，红场、克里姆林宫、地铁站、冬宫、夏宫，一趟能把两座城的核心吃透。有十五天以上，加一段跨西伯利亚铁路，从莫斯科往东，或者反过来从海参崴进、莫斯科出。预算上，这两年对中国游客的接待配套明显变好，离境退税渠道打通了，满洲里那边还落地了即买即退。别踩的坑是：免签给的是旅游探亲商务过境这些事由，你要是打算在那边打工或者读书，仍然得单独办签证。"},{"angle":"避坑清单","text":"俄罗斯免签延到二七年底，但有几条是真会让你被拦下来的。第一，免签停留上限三十天，从入境那天算起，超一天就是逾期滞留。第二，免签事由是限定的，探亲、商务访问、旅游、参加科学文化社会政治经济体育活动、过境，这几类之外的目的必须提前办对应类别签证。想去做工、长期居留、正式留学，拿着免签进去等于给自己埋雷。第三，护照有效期要覆盖你在俄的整个停留期，边检看的是这个，不是看你机票日期。第四，这个政策针对的是普通护照，其他护照类型按各自规定走。中国驻哈巴罗夫斯克总领馆七月的提醒里专门说了，入境后遵纪守法，不从事与来俄目的不符的活动，做好海外安全第一责任人。出发前把这四条对一遍。"}]},{"id":"tv3","title":"今年涨最猛的航线，两头都不是大城市","hook":"芜湖飞贵阳涨五倍，湛江飞太原涨四倍，热的全是小城对飞。","why":"选题反直觉且有具体航线数据支撑，选目的地的人可以直接照着用。县域游机票增幅超十倍是央视口径，权威度够。避开了热门景区的老话题，差异化明显。","heat":"中高","tags":["目的地","避暑","小众"],"facts":["去哪儿旅行数据：芜湖-贵阳航线机票量同比增幅超过5倍，湛江-太原增4倍，惠州-哈尔滨增长3倍（央广网，中国网转载，2026-08-06）","芒市-福州、芒市-郑州等连接边境小城与省会城市的航线增幅超过4倍，芒市自带东南亚异域风情、提供假装在国外的体验感（去哪儿旅行，中国网，2026-08-06）","以避暑、人文、边疆体验为特征的县域旅游异军突起，部分热门小城的机票预订增幅超过10倍（央视网，2026-08-05）","7月航旅纵横数据：西南方向黔南州到达客流同比增长超190%，普兰、稻城、六盘水增幅均超70%；西北方向德令哈、巴里坤同比增幅均超150%；华北方向张家口同比增长约170%（解放日报，2026-08-05）","美团相关负责人表示，今年暑期消费者对旅行的期待已从到此一游升级为深度体验，越来越多人为一种兴趣、一项手艺、一次在地体验专程奔赴一座城市（央广网，中国网转载，2026-08-06）","行业人士预判8月中上旬暑期旅游市场将迎来新一轮客流高峰（央广网，中国网转载，2026-08-06）"],"scripts":[{"angle":"反常识开场","text":"今年暑期涨得最猛的机票航线，两头都不是大城市。去哪儿的数据里，芜湖飞贵阳的机票量同比涨了五倍多，湛江飞太原涨四倍，惠州飞哈尔滨涨三倍。云南边境的芒市更夸张，芒市到福州、芒市到郑州这种小城连省会的航线，增幅都超过四倍。逻辑其实很直白。热门景区这几年被挤怕了，价格也上去了，一批人开始往没被开发透的地方走。而这些小城之间刚好有直飞，票价不贵，落地就是当地生活本身，不用跟旅行团抢位置。央视那边给的数字更直观：以避暑、人文、边疆体验为特征的县域旅游异军突起，部分热门小城的机票预订增幅超过十倍。所以下次订票别只在省会之间比价，把出发地和目的地都换成小城试一次。"},{"angle":"干货直给","text":"记几组今年暑期真实涨起来的小城航线，选目的地的时候直接用。避暑方向：芜湖到贵阳涨五倍多，湛江到太原涨四倍，惠州到哈尔滨涨三倍，这三条都是南方热城飞北方或高原凉城的典型。异域感方向：云南芒市，芒市到福州、芒市到郑州增幅超四倍，这地方自带东南亚风情，很多人是冲着假装在国外去的。区域客流上，西南的黔南州到达旅客同比涨超一倍九，普兰、稻城、六盘水都超七成；西北的德令哈、巴里坤涨超一倍五；华北的张家口涨约一倍七。这些数字的用法不是让你跟风扎堆，而是告诉你哪些地方今年航班密度和接待能力被真实拉起来了，去了不至于订不到房、打不到车。"},{"angle":"行程规划","text":"想去小城避暑又不知道怎么排，按这个思路走。第一步选飞。别默认从自己城市飞省会再转，直接查小城对飞的直飞航线，今年芜湖贵阳、湛江太原、惠州哈尔滨这类线路运力涨得快，票价反而低。第二步定天数。小城的核心体验是慢，三天太赶，五到七天刚好，能把周边一到两个县城串上。第三步排内容。美团那边的判断是，今年游客要的已经不是到此一游，而是为一种兴趣、一项手艺、一次在地体验专程奔赴一座城。所以行程别堆景点，挑一件能沉进去的事，比如在芒市泡一周傣味早市和边贸市场，比打卡五个点记得住。第四步避坑。小城接待能力有限，住宿和用车提前订，尤其八月中上旬会迎来新一轮客流高峰。"}]},{"id":"tv4","title":"国庆的团，早走晚走差二十五个点","hook":"同一条线，中秋出发比黄金周中段贵三四十个点，你的假决定了你的钱。","why":"国庆决策窗口正在关闭，价格差有具体百分比，可执行性极强。免签长线提前两个月售罄这条能制造紧迫感。与机票类选题区分开，讲的是团费与出发波次。","heat":"高","tags":["国庆","错峰","省钱"],"facts":["广之旅8月2日发布《2026年国庆出境游趋势报告》：今年中秋与国庆仅隔三个工作日，叠加请3休13拼假方案，催生十余天超长出行窗口，出境长线产品收客量环比增长62%（南方都市报，2026-08-03）","免签长线目的地预订量环比激增约300%，部分热门线路提前两个月售罄（广之旅报告，南方都市报，2026-08-03）","国庆出境游将出现三波出发高峰：最高峰集中在9月25日至26日中秋期间；10月1日国庆当日为第二波，以亲子家庭为主；第三波在黄金周中段，以节后拼假错峰出游为主（同上）","中秋首发团、国庆正日热门团期产品价格环比上涨20%至25%；黄金周中段出发排期因避开资源最紧俏时段，价格回落15%至20%（同上）","19至39岁年轻客群出境游人次占比环比黄金周前增长10%（同上）","途牛平台上已预订中秋国庆假期旅游产品的游客中，约40%选择在中秋假期甚至更早的时间出发（第一财经，2026-08-05）","7月31日至8月4日，中秋国庆期间出发机票搜索热度环比前五日翻倍，度假产品出境游预订热度环比增长60%（同程旅行，扬子晚报，2026-08-04）","2026年中秋假期为9月25日至27日，国庆假期为10月1日至7日，中间9月28日至30日为三个工作日（国务院办公厅节假日安排）","免签或便捷签证的热门方向包括俄罗斯、巴西、乌兹别克斯坦、哈萨克斯坦、格鲁吉亚、阿塞拜疆、塞尔维亚、土耳其、埃及等（广之旅报告，南方都市报，2026-08-03）"],"scripts":[{"angle":"成本账","text":"国庆出境跟团，什么时候走差二十五个点。广之旅八月二号发的国庆出境游趋势报告里，把今年的节奏拆成三波。第一波也是最高峰，九月二十五到二十六号中秋期间出发，靠请三休十三提前走，适合十天以上的长线。第二波是十月一号当天，以亲子家庭为主。第三波在黄金周中段，节后拼假错峰。价格是这么走的：中秋首发团和国庆正日的热门团期，因为机票酒店这些上游资源最紧，产品价格环比涨百分之二十到二十五；黄金周中段出发的排期，避开最紧俏时段，价格回落百分之十五到二十。一头一尾差出来的就是三四十个点。同一条线路，你把出发日往后挪几天，省下的钱够加一个自费项目。前提是你的假能拼得开。"},{"angle":"反常识开场","text":"国庆的团现在报，有些线路已经买不到了。广之旅的报告里写着，免签长线目的地预订量环比激增约三倍，部分热门线路提前两个月售罄，出境长线产品的收客量环比涨了六成二。原因是今年中秋和国庆中间只隔三个工作日，请三天假能休十三天，这个窗口一出来，大家的决策全部前置。途牛那边的数据是，已经订了中秋国庆产品的游客里，约四成选择在中秋假期甚至更早出发。同程也说，七月三十一号到八月四号这五天，中秋国庆期间出发的机票搜索热度环比前五天翻倍，度假产品出境游预订热度涨六成。客群也在变，十九到三十九岁的年轻人出境人次占比环比涨了一成。所以别再按往年经验等九月看价格。"},{"angle":"行程规划","text":"用请三休十三这个窗口，怎么排最划算。先看假期结构：中秋九月二十五到二十七，国庆十月一到七，中间二十八、二十九、三十是三个工作日。请这三天，从九月二十五号一路休到十月七号，十三天。接下来做三选一。要省钱，走第三波，黄金周中段出发，团费比正日便宜百分之十五到二十，缺点是回程会压到假期尾巴。要玩长线，走第一波，中秋当天或前一天出发，十天以上的欧洲、澳新线路只有这个窗口塞得下，代价是团费贵百分之二十到二十五。要带孩子，第二波十月一号出发的亲子团最集中，同行客群匹配度高。目的地上，免签和签证便利的地方今年最省事，俄罗斯、巴西、乌兹别克斯坦、哈萨克斯坦这些热度在涨。"}]},{"id":"tv5","title":"八月机票预订涨了7%，还有两折的票在卖","hook":"总量在涨，两折票没消失，问题只是你在哪条航线上找。","why":"数据向选题，反直觉且有具体可捡漏的航线名字。暑运启动晚导致的结构性余量是今年独有的解释，讲清楚能建立专业感。八月中上旬还有一波高峰，时效性强。","heat":"中高","tags":["数据","捡漏","暑期"],"facts":["截至7月底，8月境内航线机票预订量约1750万张，同比增长约7%；出入境航线机票预订量超550万张，同比增长超6%（航旅纵横民航官方直销平台，解放日报，2026-08-05）","7月境内航线民航旅客量超6294万人次，同比增长约4%；出入境航线民航旅客量超806万人次，同比增长约3%（同上）","7月中下旬境内航线旅客运输量超2942万人次，同比增长超6%；出入境航线超374万人次，同比增长超5%，增长主要靠7月中下旬拉动（同上）","今年暑运启动晚，台风、高温等异常天气叠加，一些学校放假较晚，前期民航客流数据增长不明显（解放日报，2026-08-05）","8月北京到乌鲁木齐、上海到乌鲁木齐等热门航线仍有低至两折左右的机票在售（北京青年报，2026-08-05）","8月跨境机票预订热度较7月环比增长超过12%（同程旅行，扬子晚报，2026-08-04）","7月国内热门目的地北京居首，成都、上海、广州、深圳、昆明、重庆、西安、杭州、乌鲁木齐紧随其后，前往北京的旅客量同比增长约12%（航旅纵横，解放日报，2026-08-05）","行业人士预判8月中上旬暑期旅游市场将迎来新一轮客流高峰（央广网，中国网转载，2026-08-06）"],"scripts":[{"angle":"数据向","text":"暑期还没结束，八月的盘子比七月还大。航旅纵横的数据，截至七月底，八月境内航线机票预订量约一千七百五十万张，同比涨约百分之七；出入境航线超五百五十万张，同比涨超百分之六。七月的实际客流是境内超六千二百九十四万人次，同比约涨百分之四；出入境超八百零六万人次，涨约百分之三。今年暑运启动得晚，台风、高温加上部分学校放假晚，前期数据并不好看，增长主要靠七月中下旬拉起来：那半个月境内旅客运输量超两千九百四十二万人次，同比涨超百分之六。跨境这块，八月的机票预订热度比七月环比涨超一成二。行业的判断是八月中上旬还有一轮客流高峰，翻译成人话就是现在出门人只会更多。"},{"angle":"反常识开场","text":"八月机票预订量同比涨了百分之七，你以为票价该水涨船高，实际上还有两折的票在卖。北京青年报八月五号提到，八月北京到乌鲁木齐、上海到乌鲁木齐这些热门航线，仍有低至两折左右的机票在售。原因是运力和需求不是均匀分布的。今年暑运启动晚，台风高温加上部分学校放假迟，前期客流没起来，航司在长距离干线上放了不少运力，这些座位到了八月还要消化。同时八月五号起燃油附加费又降了一档，长途七十、短途四十，落地成本再往下压一格。所以现在的市场是两头拉扯：总量在涨，但结构性的便宜票没消失。找票的方法也简单，盯长距离干线、盯非周末出发、盯晚班，别只看直飞早班。"},{"angle":"实操流程","text":"八月下半场出行，按这四步买票最省。第一步卡时间。八月五号零点之后再出票，燃油附加费按新标准，长途七十短途四十，比之前少三十和十块，五号前出的票不退不补。第二步挑航线。总量涨了百分之七，但长距离干线还有余量，北京和上海飞乌鲁木齐这类线上八月仍有两折左右的票，先在这类航线里找。第三步错峰。今年暑运启动晚，客流靠七月中下旬拉起来，八月中上旬还有一轮高峰，能避开就往月底挪，学生返校前那几天反而松。第四步定落地。跨境机票预订热度比七月环比涨超一成二，热门目的地的房和车会先紧张，票定了当天就把住宿和接送订掉。这四步做完，同样一趟行程能比随手下单省出两三百。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"阿里的千问办公开公测，AI 终于进到工位上了","hook":"桌面端、云端、协同三层智能体第一次做进一个产品，还挂在钉钉上。","why":"全新产品且处于公测白嫖窗口，时效强。三层智能体架构是行业首次，说清楚有科普价值。对做内容和做办公的人都有直接可用场景，转化到实操视频很自然。","heat":"高","tags":["AI工具","智能体","实操"],"facts":["8月3日阿里推出企业级 Agent 产品「千问办公」（QwenWork），开启公测（21世纪经济报道，新浪财经转载，2026-08-03）","该产品整合了 QoderWork、MuleRun、悟空三款产品，是业内首款同时支持桌面端 Agent、云端 Agent 和企业协同 Agent 的产品，已初步打通钉钉 IM（同上）","Qwen3.8 已接入千问办公，用户可在千问办公中对该模型进行体验（钛媒体转光锥智能，2026-08-05）","Qwen3.8 在自动化编程测试中可独立运行约16天，自主完成 Hermes Agent 级别的自进化智能体框架并开源（阿里技术团队，21世纪经济报道，2026-08-03）","在专业办公场景中，模型能够处理数百页财务报告和超百小时长视频，并在芯片设计等复杂工程任务中通过约数千轮交互实现优化（同上）","Qwen3.8-Max 总参数2.4万亿、单次激活95B、1M 上下文长度、支持视觉理解（钛媒体，2026-08-05）","阿里 AI 办公战略定位为面向企业组织的 AI 生产力平台，依托钉钉和阿里云积累的百万级企业客户（钛媒体转光锥智能，2026-08-05）","受 Qwen3.8 发布消息提振，截至8月3日收盘阿里巴巴港股大涨7.01%，报125.2港元（21世纪经济报道，2026-08-03）"],"scripts":[{"angle":"干货直给","text":"阿里八月三号扔了两个东西，一个是模型，一个是产品，后面那个跟普通人关系更大。产品叫千问办公，英文 QwenWork，企业级的智能体产品，当天开启公测。它把阿里之前的三款东西整合进来了：QoderWork、MuleRun 和悟空。官方口径是业内首款同时支持桌面端智能体、云端智能体和企业协同智能体的产品，并且已经初步打通钉钉的即时通讯。新发的 Qwen3.8 也接进去了，你能在千问办公里直接用上那个两点四万亿参数的旗舰模型。为什么值得看：桌面端智能体意味着它能操作你本机的文件和软件，云端负责跑长任务，协同那层挂在钉钉上直接进团队工作流。三层打通之后，AI 不再是你切出去问一句再切回来。公测期是白嫖窗口。"},{"angle":"功能详解","text":"千问办公这个产品，拆开看是三层。第一层桌面端智能体，跑在你自己电脑上，能碰本地文件和软件，适合整理资料、批量改文档这种要接触本机数据的活。第二层云端智能体，跑长任务不占你的机器，阿里给的能力参照是 Qwen3.8 在自动化编程测试里能独立运行大约十六天，自主完成一个 Hermes Agent 级别的自进化智能体框架并开源出来。第三层企业协同智能体，挂在钉钉上，任务和结果直接进团队的即时通讯流，不用再导来导去。底座是 Qwen3.8，总参两点四万亿，激活九百五十亿，支持一百万 token 上下文和视觉理解，所以它能处理数百页的财务报告和上百小时的长视频。阿里的打法很清楚，靠钉钉和阿里云的企业客户做组织级平台。"},{"angle":"创作者视角","text":"作为一个天天要产内容的人，我看千问办公最在意的是桌面端那一层。做视频的痛点从来不是写不出文案，是素材躺在硬盘里找不到、命名一团乱、剪之前要翻半小时。桌面端智能体能碰本地文件，理论上就能干这个活：扫一遍素材目录、按内容重命名、按主题挑片段。第二个值得试的是云端跑长任务。云端智能体不占本机资源，你可以让它一边分析上百小时的长视频，一边你继续剪片子。阿里给的参考是这个底座模型在自动化编程测试里能独立跑约十六天，长周期任务是它主打的方向。第三层挂钉钉，个人创作者用不上，有团队的可以看。现在是公测阶段，成本最低，先把自己的工作流拆成三段，看哪段能扔进去。"}]},{"id":"ai2","title":"看到2.4万亿参数别激动，真干活的只有950亿","hook":"总参数是图书馆里有多少本书，激活参数才是你每次翻开的那几本。","why":"破除参数崇拜的科普向选题，长效不过时。总参数与激活参数的区别是选型时最实用的一条知识，多数人没搞清。配合国产万亿模型集体到位的现状，话题度高。","heat":"中高","tags":["科普","大模型","选型"],"facts":["8月3日阿里发布 Qwen3.8-Max，总参数量2.4万亿，采用稀疏 MoE 架构，激活参数约95B，支持视觉理解和1M tokens 上下文（21世纪经济报道，2026-08-03）","Qwen3.8 采用稀疏 MoE（混合专家）架构与混合注意力机制的联合优化，获得更高的推理效率与更快的推理速度（钛媒体转光锥智能，2026-08-05）","Kimi K3 以2.8万亿参数开源，是目前中国最大的开放权重模型（CCTV4，2026-08-05；21世纪经济报道，2026-08-05）","DeepSeek V4 Pro、文心5.0、MiMo-V2.5-Pro、LongCat-2.0 等国产大模型也已达到万亿参数级别（钛媒体转光锥智能，2026-08-05）","Qwen3.8-Max 将于下周开源权重，并同步开源27B版本，这是 Qwen-Max 级别模型首次面向社会开源（21世纪经济报道，2026-08-03）","Qwen3.8-Max API 国内定价每百万 tokens 输入12元、输出36元，国际价格为 Opus 5 的40%与24%（同上）","在权威榜单 Arena 中 Qwen 系列位列全球第二，仅次于 Claude；编程能力在 CodeArena 榜单中位居前列（不同榜单显示为第三或第四）；PaperBench 评测较上代提升28.2分（同上）","待核实：MiniMax M3 Pro 达2万亿参数级别并传出即将开源，该消息在报道中以「传出」表述，未见官方公告"],"scripts":[{"angle":"反常识开场","text":"看到两点四万亿参数别激动，真正干活的只有九百五十亿。阿里八月三号发的 Qwen3.8-Max，总参数两点四万亿，这是尺寸最大的那个数字，但它用的是稀疏混合专家架构，每次推理只激活其中约九百五十亿参数参与计算。这不是缩水，是这一代大模型的标准做法：把知识摊在一个巨大的参数池里，用的时候只叫醒相关的那几个专家。好处是推理效率和速度都上去了，成本压得住。所以你比较模型的时候，总参数只能说明它记了多少东西，激活参数才决定它每次回答烧多少算力、你要付多少钱。同期开源的 Kimi K3 总参两点八万亿，是目前中国最大的开放权重模型。文心五点零、MiMo、LongCat 这些也都到了万亿级，万亿现在是入场券。"},{"angle":"说人话版","text":"用一个比喻把万亿参数讲清楚。把大模型想成一座图书馆。总参数是这座馆里有多少本书，两点四万亿就是书特别多。激活参数是你每次进去实际翻开的书，Qwen3.8-Max 每次只翻大约九百五十亿这么多。稀疏混合专家架构干的事，就是在你提问的瞬间判断该去哪几个书架，而不是把整馆搬出来。这解释了两件反直觉的事。第一，参数更大的模型未必更慢更贵，因为激活的比例可以做得很低。第二，参数差不多的两个模型，实际表现可能天差地别，因为分书架的策略和训练数据不一样。所以选模型别只看那个万亿数字。国内现在到万亿的一大把，Kimi K3 两点八万亿、Qwen3.8-Max 两点四万亿，文心、MiMo、LongCat 也都在这一档。"},{"angle":"工具评测","text":"手里有活要派给模型，别看总参数看这三个数。第一个是激活参数，它决定单次推理的算力开销，Qwen3.8-Max 总参两点四万亿但只激活约九百五十亿，这个比例越低单位成本越有优势。第二个是上下文长度，Qwen3.8 支持一百万 token，意味着你能一次性丢进数百页财报或者上百小时视频的转写稿，不用切片。切片是很多人做长文档时结果变差的真正原因。第三个是价格，Qwen3.8-Max 国内定价每百万 token 输入十二块、输出三十六块，国际价格是 Opus 5 的四成和两成四。把这三个数摆在一起，你就能算出一个具体任务的成本。另外它下周要开源权重，还会同步开源一个二百七十亿的小版本，本地能跑的人可以留意。"}]},{"id":"ai3","title":"鹅厂员工的小众AI玩法：修电动车、找耳机、读体检报告","hook":"别人还在用AI写文案，有人已经拿它把电动车的油刹上泵修好了。","why":"全是具体到能马上复刻的生活场景，零门槛，评论区互动性极强。跟主流的写文案做总结形成反差，容易出爆款。素材密度高，一条能拆成好几条短视频。","heat":"高","tags":["AI玩法","生活","零门槛"],"facts":["腾讯技术工程整理的员工 AI 玩法分享：先让 AI 整理和重新命名视频并配缩略图，再告知想剪辑的主题，AI 依据主题创建素材分身并制作一个推荐素材的 HTML 页面，从几千个视频里找合适片段（腾讯技术工程，网易转载，2026-08-01）","后台开发员工分享：电动车坏了拍照拍视频丢给 AI 要解决方案，自己动手修复，已换过控制器、修过油刹上泵、换过右手刹（同上）","质效运营员工分享：体检后收到电子报告，用 AI 解读，把医学术语和箭头变成听得懂用得上的健康行动指南（同上）","后台开发员工分享两类找东西场景：无线耳机掉草地里肉眼看不到，拍照或视频让 AI 帮找；小时候看过记不起名字的动画片，向 AI 描述细节让它帮找（同上）","系统测试员工分享：让 AI 自己搜索旅游笔记，整理博主真实笔记、筛掉广告与重复打卡地，结合出行天数、同行人群、预算，自动理顺动线生成完整旅游计划（同上）","综合项目管理员工分享：上传自拍照，让 AI 做形象管理诊断，给出适合的颜色、发型、妆容和风格搭配（同上）","待核实：以上均为单一来源的员工个人实践分享（腾讯技术工程公众号），非平台官方功能承诺，实际效果因模型与提示词而异"],"scripts":[{"angle":"干货直给","text":"腾讯内部整理了一批员工的小众 AI 用法，挑几个真能省事的说。第一个，电动车坏了，拍照片拍视频丢给 AI，让它给解决方案，自己动手换控制器、修油刹上泵、换手刹，都修成了。第二个，体检报告出来看不懂，把电子报告交给 AI，让它把医学术语和箭头翻译成能执行的行动建议，提前看懂身体的预警。第三个，找东西。无线耳机掉草地里肉眼找不到，拍张照让 AI 帮你定位；小时候看过的动画片记不起名字，把细节描述给它让它找。第四个，做行程。让 AI 自己去搜旅游笔记，筛掉广告和重复打卡点，结合你的天数、同行人群、预算，理出顺路动线，省掉几小时刷攻略。这些都不是高级功能，就是把日常里懒得处理的小麻烦扔给它。"},{"angle":"故事切入","text":"有个后台开发的同事，电动车坏了没送修。他拍了照片又拍了段视频，丢给 AI，让它给判断和解决方案，然后自己动手。到现在换过控制器、修过油刹上泵、换过右手刹。这事有意思的地方不在于省了几百块修车费，而在于他把 AI 当成了随身的老师傅。同一批分享里还有几个类似的：做视频的先让 AI 把几千条素材整理重命名、配上缩略图，再告诉它想剪什么主题，让它生成一个推荐素材的网页，剪之前不用再翻硬盘。做项目管理的上传自拍，让 AI 做形象诊断，给出适合的颜色、发型和搭配，换了发色之后周围人都来问染发剂链接。共同点是这些人没在等一个完美的 AI 产品，而是把手边的麻烦拆成一个能描述清楚的问题，然后扔进去。"},{"angle":"实操流程","text":"照着这个流程，把 AI 变成你的素材管理员。第一步整理。把素材目录丢给 AI，让它按内容给视频批量重命名，同时生成缩略图，这一步解决的是硬盘里全是乱码文件名的问题。第二步建索引。告诉它你要剪的主题，让它在素材库里挑出相关片段，并且生成一个推荐素材的网页，缩略图加时间点排好，你打开网页就能选。第三步复用。下次换主题，不用重新整理，直接改主题词再生成一版。这套流程是腾讯一位做财务的员工用来剪自家宝宝视频的，几千条素材里找片段，从翻半小时变成点几下。同样的思路还能用在别处：体检报告丢给它翻译成行动建议，旅游笔记丢给它筛掉广告排成动线，本质都是把非结构化的东西整理成你能直接用的形式。"}]},{"id":"ai4","title":"八周五款模型，硅谷公司在悄悄换底座","hook":"性能够用之后，选模型看的就不是谁最强，是谁最便宜。","why":"产业级判断，有斯坦福报告和央视两条硬来源支撑。成本结构讲清楚能建立专业形象，对做AI内容的人是必备背景知识。死亡地带这个说法本身有传播力。","heat":"中高","tags":["行业趋势","成本","国产模型"],"facts":["截至8月5日，短短8周内阿里巴巴 Qwen3.8-Max、月之暗面 Kimi K3、DeepSeek-V4-Flash、智谱 Z.ai GLM-5.2、字节跳动 Seedance 2.5 五款重磅模型接连亮相，被市场称为「八周五模型」（21世纪经济报道，2026-08-05）","斯坦福《2026人工智能指数报告》指出，中美顶尖模型的综合性能差距已大幅收窄，中国开放权重模型在全球开发者中的接受度持续走高（21世纪经济报道转述，2026-08-05）","大量美国企业、硅谷初创公司出于成本考量，正把业务流量切到中国大模型上（21世纪经济报道，2026-08-05）","美国闭源旗舰模型的训练往往烧掉数亿美元，单款模型生命周期只有12-24个月，企业只能靠高昂的 API 定价回收沉没成本（同上）","智谱 GLM-5.2 在 SWE-bench Pro 编程基准测试中实现突破，代码能力跻身全球第一梯队（同上）","DeepSeek 近期再度下调词元调用价格，输入、输出单价最高降幅达50%；美国研究机构人工智能分析网评估 DeepSeek-V4-Flash 运行成本全球最低（CCTV4，2026-08-05）","美国媒体称美国同行面临「死亡地带」，并指出 Kimi K3 带来的冲击仍在持续（CCTV4 转述美媒，2026-08-05）","Qwen3.8-Max 国际价格仅为 Opus 5 的40%与24%（21世纪经济报道，2026-08-03）","国内厂商普遍走开放权重路线，依托 MoE 混合专家架构和推理侧深度优化，在控制总成本前提下快速迭代出覆盖高中低端场景的完整矩阵（21世纪经济报道，2026-08-05）"],"scripts":[{"angle":"趋势判断","text":"八周，五款模型，中国把大模型的迭代节奏改了。截至八月五号，阿里 Qwen3.8-Max、月之暗面 Kimi K3、DeepSeek-V4-Flash、智谱 GLM-5.2、字节 Seedance 2.5 接连亮相，市场管这叫八周五模型。放在过去，一款旗舰模型从训练到发布动辄数月甚至跨年，OpenAI 和 Anthropic 的旗舰更新普遍以年计。更实质的变化在需求侧。二十一世纪经济报道的说法是，大量美国企业和硅谷初创公司出于成本考量，正在把业务流量切到中国大模型上。斯坦福的二零二六人工智能指数报告也指出，中美顶尖模型的综合性能差距已经大幅收窄。美媒给美国同行的处境起了个名字，叫死亡地带。逻辑很朴素：性能够用之后，决定选型的是成本和部署灵活度。"},{"angle":"成本账","text":"美国公司为什么开始换中国模型，算账就明白了。美国的闭源旗舰模型，训练一次动辄烧掉数亿美元，单款模型的生命周期只有十二到二十四个月，这笔沉没成本只能靠高定价的接口费用往回收。所以你用它，本质是在替别人的训练账单买单。中国这边走的是另一条路：开放权重加混合专家架构，加上推理侧的深度优化，用可控的总成本快速迭代出高中低端的完整矩阵。价格差有多大？Qwen3.8-Max 的国际定价是 Opus 5 的四成和两成四。DeepSeek 近期又下调了调用价格，输入输出单价最高降五成，美国的人工智能分析网评估它的运行成本全球最低。对一家每月烧几万美元接口费的公司来说，切换供应商省下来的是实打实的现金。"},{"angle":"反常识开场","text":"性能不再是选模型的第一标准了，这事刚被市场证实。过去两年默认的剧本是美国闭源模型稳坐技术制高点，别人跟在后面跑。今年的现实是，斯坦福二零二六人工智能指数报告指出中美顶尖模型的综合性能差距已大幅收窄，智谱的 GLM-5.2 在 SWE-bench Pro 编程基准上实现突破，代码能力进了全球第一梯队。性能一旦够用，企业选型的决定权就交给了成本和部署灵活度。结果就是大量美国企业和硅谷初创公司把业务流量切到中国模型上。这背后不是靠堆算力堆出来的，工程优化、架构创新、开源路线三件事叠加才是推手。对国内做内容和做产品的人，含义很直接：你现在能用到的模型，价格是全球最低那一档，能力是全球前沿那一档。"}]},{"id":"ai5","title":"用Coze搭一个爆款视频拆解机，三个插件就够","hook":"输一条视频链接，它把文案结构、情绪节奏、转化话术拆给你。","why":"对做短视频带货的人是刚需工具，可复刻性强，一条视频能直接带出实操教程系列。不用写代码这个门槛设定，受众面极宽。工具对比部分给了后续选择路径。","heat":"中高","tags":["AI玩法","智能体","创作者"],"facts":["有做抖音带货的创作者用 Coze 搭建「爆款视频拆解」智能体：输入任意一条抖音视频链接，智能体自动抓取视频内容，分析文案结构、情绪节奏、转化话术，生成一份可复用的脚本模板（今日头条创作者实践分享，2026）","自动化情报系统的工作流示例：信息采集插件 + AI 总结插件（设置总结字数和关注的关键词）+ 微信发送插件（绑定企业微信机器人），三个插件串起来设置每天早上八点触发（同上）","Coze 知识库用法：创建 Bot 后进入知识板块上传 PDF 或 Word 文档，系统自动切片向量化；在「人设与回复逻辑」里写明角色和回复风格；在「发布」板块选择接入渠道，支持微信、飞书、抖音、网页等（同上）","Dify 为开源 AI 应用开发平台，相比 Coze 更灵活，支持私有化部署，支持 Workflow 条件分支编排，社区版免费、企业版收费（同上）","已产生实际收益的三个方向：自媒体自动化（选题、写作、配图、发布全流程）、电商运营自动化（监控竞品、调整价格、回复客户、生成营销文案）、企业服务自动化（合同审查、财务对账、招聘筛选）（同上）","Anthropic 工程师公开的协作方法包括：分步互动提取需求（让 AI 先反问几个问题）、用 HTML 替代 Markdown 输出更省 token、在任务里加入验证步骤让 AI 自己质检（技术博客整理，2026）","待核实：Coze 个人用户可创建 Bot 的数量与每日调用额度、Dify 各版本收费政策，均以各平台官网最新说明为准；SaaS-Bench 评测中顶级 AI Agent 完全通过率3.8%这一数据为单一来源转述"],"scripts":[{"angle":"实操流程","text":"用 Coze 搭一个每天早八点自动给你推情报的机器人，三个插件就够。第一个是信息采集插件，设定你要盯的关键词或者信息源。第二个是 AI 总结插件，设置总结字数和你关注的关键词，让它把抓回来的东西压成你能三十秒看完的摘要。第三个是微信发送插件，绑定企业微信机器人。三个插件用工作流串起来，设置每天早上八点触发，一套自动化情报系统就成了。整个过程不用写代码，界面上拖。想做客服机器人就多用一个知识库：把产品手册、常见问题、历史对话上传，系统自动切片向量化，然后在人设与回复逻辑里写清角色和语气，最后在发布板块选渠道，微信、飞书、抖音、网页都能接。要私有化部署的换 Dify，开源，社区版免费。"},{"angle":"创作者视角","text":"有个做抖音带货的用 Coze 搭了个爆款视频拆解智能体，思路值得抄。输入任意一条抖音视频链接，它自动抓取视频内容，分析文案结构、情绪节奏、转化话术，输出一份可复用的脚本模板。这东西解决的是选题和脚本的效率问题：你刷到一条爆的，不用自己一句句扒，让它给你拆成结构，你换产品往里填。往下延伸有三个方向已经在跑通。一是自媒体自动化，选题、写作、配图、发布串成流程。二是电商运营，监控竞品、调价、回客户、生成营销文案。三是企业服务，合同审查、财务对账、招聘筛选这些重复活。工具选择上，Coze 可视化、上手快、个人用基本够；Dify 开源、支持私有化部署和条件分支编排。先用 Coze 跑通一个再说。"},{"angle":"避坑清单","text":"搭智能体之前，先知道这几个坑在哪。第一，别指望一句话就让它干成复杂任务。分步互动比一次性甩长需求靠谱，你可以先说请先问我三个问题再动手，它问出来的往往是你没想到的。第二，加验证步骤。给任务的时候直接写完成后自己对照原文检查一遍并修正，让质检变成流程的一部分，准确率会明显好转。第三，输出格式指定死。要表格就说用表格输出，包含哪几列，不指定它就自由发挥。第四，知识库不是上传完就万事大吉，要在人设与回复逻辑里写明优先从知识库找答案、找不到时怎么办，否则它会自己编。第五，免费额度和功能各平台随时在变，Coze 和 Dify 的具体政策以官网最新说明为准，别按别人半年前的教程照抄。"}]}]}]},"2026-08-04":{"date":"2026-08-04","updatedAt":"2026-08-04 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"国庆火车票8月3号就开预约了，别再等9月抢","hook":"国庆的火车票，八月三号已经开始放预约了，你还在等九月零点拼手速。","why":"12306 预约购票窗口是开车前第60到17天，8月3日已可预约10月1日车票，这条信息今天发最值钱，进入9月就没人看了。规则里的封号条款多数人不知道，收藏率会高。","heat":"高","tags":["强时效","出行必备","避坑"],"facts":["据「中国铁路」消息，京沪高铁、京沪铁路200多趟列车国庆假期车票已开启预约，8月3日可预约10月1日车票（深圳龙岗发布转中国铁路，2026-08-03）","12306「预约购票」服务专区在列车开车前第60天至第17天填报预约需求，每日8时起可提交开车前第60天的预约订单（中国铁路，2026-08-03）","系统于开车前第20天至第16天兑现预约订单，兑现成功后需在当日23时前完成支付，逾期自动取消（中国铁路，2026-08-03）","30天内连续三次兑现成功后逾期未支付（含主动取消兑现成功订单），此后90天内该12306账户不可使用预约购票功能（中国铁路，2026-08-03）","每个12306账户可同时提交3个待兑现预约订单，每个订单可选连续两日、最多3个「精确预约」及2个「模糊预约」，一笔订单最多添加19名旅客（中国铁路，2026-08-03）","2026年8月1日至30日，12306学生预约购票服务新增新生预约功能，2026级新生完成学生资质核验后，可在开车前第20至17天预约乘车日期为8月17日至9月14日的一次单程车票，享学生优惠票价（中国铁路，2026-08-03）","2026年中秋节为9月25日至27日，国庆节为10月1日至7日，中间9月28日至30日为三个工作日（国务院办公厅节假日安排，新浪旅游、深圳龙岗发布转载，2026-08-03/04）"],"scripts":[{"angle":"干货直给","text":"国庆火车票的预约通道，八月三号已经开了，不是开售，是预约。京沪高铁和京沪铁路两百多趟列车先放的，三号那天就能约十月一号的座位。规则你记三条。第一，预约窗口是开车前第六十天到第十七天，每天早上八点放开第六十天那一档，越早填越靠前。第二，系统在开车前第二十天到第十六天集中兑现，兑现成功当天晚上十一点前必须付钱，过点自动取消。第三，三十天里连续三次兑现成功没付款，包括你主动取消，接下来九十天这个账号的预约功能直接停用。一个账号同时最多挂三个待兑现订单，每单能选连续两天、三个精确车次加两个模糊选项，一笔单最多十九个人，全家出行一单就够。精确预约是车次时间席别全指定，模糊预约只给时间段和运行时长，命中率明显高一截。现在就去十二三零六填，比九月盯着零点跟几百万人拼手速强太多。"},{"angle":"实操流程","text":"把国庆车票的预约单填明白，三步走。第一步打开十二三零六，进预约购票专区，确认目标日期落在开车前六十到十七天这个区间。十月一号出发的，八月三号就能填。第二步选方式。精确预约要你把车次、到发时间、席别、票价全指定死，适合非某趟车不可的人。模糊预约只让你选出发时间段、运行时长和席别，系统在范围内匹配，命中概率高不少。我的做法是一个订单里放三个精确加两个模糊，精确的按优先次序从最想坐的往下排。第三步盯兑现。开车前第二十天到第十六天系统集中处理，成功之后当天二十三点前必须付款。这里有个坑，三十天内连续三次兑现完不付钱，九十天内这个账号别想再用预约。所以别抱着占坑的心态乱填，填了就要准备掏钱。另外八月一号到三十号，二零二六级新生多了一条专属通道，能约八月十七号到九月十四号的单程票。"},{"angle":"反常识开场","text":"今年抢国庆票最不划算的做法，就是九月零点守着手机点刷新。车票八月三号就开了预约通道，京沪高铁和京沪铁路两百多趟列车打头阵，三号那天你就能约十月一号的座位。很多人的认知还停在开售即秒光，其实铁路早就把分配前置了。预约是在开车前第六十天到第十七天填需求，系统第二十天到第十六天统一兑现，兑现之后当天晚上十一点前付款。换句话说，票在正式开售之前已经分掉一批，你零点抢的是剩下的那部分。还有个细节多数人不知道，模糊预约的命中率比精确预约高。你要是能接受早上八点到十点之间的任意车次，就别死盯某一趟，把弹性交出去换成功率。最后提醒一句，兑现成功不付钱是会被记账的，三十天内三次，九十天封掉预约功能。要么别填，要么填了就掏钱。"}]},{"id":"tv2","title":"泰国砍掉60天免签，中国护照是那个例外","hook":"泰国把六十天免签取消了，九十三个国家全受影响，中国护照不在里面。","why":"政策刚落地，网上大量2025年的旧攻略还在说泰国免签六十天，照着规划行程会踩超期。辟谣加解读双重价值，暑期尾声到国庆出境正好用得上。","heat":"高","tags":["出境游","政策","辟谣"],"facts":["泰国总理府副发言人普洛伊塔莱2026年7月14日透露，当日内阁会议审议批准免签政策调整方案，核心是取消此前93个国家和地区享有的60天免签入境待遇（中新社/光明网，2026-07-14）","新措施规定，包括中国在内的59个国家和地区将获得旅游免签待遇，入境后可停留不超过30天；5份内政部公告草案在《政宪公报》网站公布满15天后正式生效（中新社，2026-07-14）","泰国外交部领事司司长芒功在发布会回答凤凰卫视提问时表示，本次调整不影响2024年3月中泰签署的免签协议，「中泰之间的30天互免签证协议」相关安排维持不变（凤凰卫视，2026-07-19）","同批调整还包括：30天旅游免签适用名单从57个缩减至54个，新增针对3个国家及地区的15天旅游免签，落地签适用名单从31个缩减至4个（凤凰卫视，2026-07-19）","泰国旅游与体育部数据显示，赴泰外国游客中停留1至30天的占比超过90%，停留超过30天的仅约10%（凤凰卫视，2026-07-19）","新政策生效前已按原政策入境并获得相应停留权限的外国游客，仍可按原规定在剩余有效期内继续停留（中新社，2026-07-14）","泰国旅游与体育部长素拉萨克此前表示内阁已原则上同意取消60天免签，须待外交部完成程序并在政府公报发布公告后才确定生效日期（泰国中文社，2026-05-21）","待核实：英文签证资讯站 ThaiEmbassy.com 与 ThaiVisaFlow 称该调整自2026年6月1日生效、内阁批准日为5月19日，与中新社所述7月14日内阁批准、公报满15天生效的时间线存在冲突，此处以中新社与凤凰卫视报道的官方口径为准","待核实：ThaiEmbassy.com 称泰国移民局 THIM App 将于2026年8月起对所有入境外籍人员强制使用，目前与 TDAC 网页版并行，未见泰方官方中文公告或中国驻泰使领馆提示佐证"],"scripts":[{"angle":"干货直给","text":"泰国把六十天免签取消了，你得先看清这事跟你有没有关系。七月十四号泰国内阁批准调整方案，原本九十三个国家和地区享受的六十天免签整体取消，改成一国一权益，按国别重新给。调整之后包括中国在内的五十九个国家和地区拿到旅游免签，停留不超过三十天。落地签名单从三十一个砍到四个，三十天免签名单从五十七个减到五十四个，另外新增三个国家和地区只给十五天。关键那句话在这儿，泰国外交部领事司司长在发布会上明确回应，这次调整不影响二零二四年三月中泰签的免签协议，中泰三十天互免维持不变。中国人去泰国，之前三十天，现在还是三十天，一天没少。泰国给的公开理由是六十天太长，容易被拿去做非旅游用途。新规在政宪公报公布满十五天生效，已经入境的按老规矩把剩余天数用完。"},{"angle":"横向对比","text":"同样飞泰国，欧美护照和中国护照现在走的是两条完全不同的路，很多人搞混了。欧美那批国家原来吃的是六十天免签，覆盖九十三个国家和地区，本质是泰国单方面给的临时优惠，七月十四号内阁一纸批复整体取消。他们现在要么按新名单拿三十天，要么只有十五天，能用落地签的国家从三十一个砍到剩四个。中国护照走的是另一条，二零二四年三月中泰签的双边互免协议，你去泰国免签三十天，泰国人来中国也是三十天。这是协议，不是优惠，泰国外交部专门回应过，这次调整不碰它。所以你的行程不用改，天数没变。真正要小心的是网上那堆去年写的攻略，还在说泰国免签六十天，照着规划一个四十天的行程，落地就是超期风险。泰国官方数据，赴泰外国游客里停留三十天以内的超过九成，三十天对绝大多数人够用。"},{"angle":"反常识开场","text":"看到泰国取消六十天免签就急着退机票的，先冷静，这条新闻跟中国护照基本没关系。被砍掉的是泰国单方面给九十三个国家和地区的临时优惠，七月十四号内阁批准取消。中国人去泰国靠的不是这个，靠的是二零二四年三月中泰签署的双边互免签证协议，三十天。泰国外交部领事司司长在发布会上被专门问到中国的安排，回答很直接，这次调整不影响该协议。你原来待三十天，现在还是三十天。真正变了的有三样。落地签国家从三十一个缩到四个，三十天免签名单从五十七个缩到五十四个，另外给三个国家和地区新开了十五天这一档。泰国的公开理由是六十天期限太长，有人拿它做非旅游的事。新规在政宪公报公布满十五天正式生效，生效前已经入境的按老规矩把剩余期限用完，不用中途出境。"}]},{"id":"tv3","title":"欧洲团里带梵蒂冈，这个团本身就违规，罚了十万","hook":"旅行社带你去梵蒂冈，听着高级，其实这个行程是违法的。","why":"「中国公民出境旅游目的地名单」这个概念绝大多数人不知道，属于强信息差。官方处罚案例刚公布，有具体金额和法条，可信度高，评论区一定会吵。","heat":"中高","tags":["信息差","出境游","避坑"],"facts":["青岛嘉华文华国际旅行社组织欧洲旅游，行程中包含梵蒂冈，该目的地属于国务院旅游行政主管部门公布的中国公民出境旅游目的地之外的国家和地区，违反《旅行社条例》第二十五条，2025年12月30日被青岛市文化和旅游局罚款10万元（青岛市文旅局2026年第三批旅游市场处罚典型案例，2026-08-04）","青岛同乐国际旅行社招徕2名游客参加「山水连两国精华6日游」，签订境内旅游合同但行程包含越南谅山，属未经许可经营出境旅游业务，违反《旅游法》第二十九条，2026年7月27日被没收违法所得4360元、责令停业整顿7日、罚款1万元，法定代表人另罚2000元（青岛市文旅局，2026-08-04）","青岛海中旅国际旅行社质量保证金账户为零，受行政处罚后未按规定补足且拒不改正，2026年5月18日被依法吊销旅行社业务经营许可证（青岛市文旅局，2026-08-04）","凯途国际旅行社（山东）招徕组织「北京高飞六日游」，未征得旅游者同意擅自将部分旅游业务委托给其他旅行社接待，违反《旅行社条例》第三十六条，2026年7月1日被罚款2万元（青岛市文旅局，2026-08-04）","湖北同程悦游国际旅行社组织游客赴巴厘岛出境游，未按规定安排全程陪同领队，违反《旅游法》第三十六条，2026年7月8日被武汉市文旅局罚款5000元，直接负责的主管人员罚款2000元（湖北文旅2026年全省第二批旅游市场典型案例，2026-08-02）"],"scripts":[{"angle":"反常识开场","text":"如果你报的欧洲团行程里写着梵蒂冈，这个团是违规的，不是行程有瑕疵，是旅行社在违法经营。青岛市文旅局八月四号公布的处罚案例里，青岛嘉华文华国际旅行社就是因为组织的欧洲游行程包含梵蒂冈，被罚了十万块。依据是旅行社条例第二十五条。原因在于一个多数人根本不知道的东西，中国有一份「中国公民出境旅游目的地名单」，由国务院旅游行政主管部门公布，不在名单里的国家和地区，旅行社不能组团带你去。梵蒂冈就不在。这不是说你个人不能去，你自己办签证自由行是另一回事，被禁的是旅行社组团这种经营行为。为什么重要，因为一旦出事，这段行程不受旅游合同保护，保险赔付、纠纷维权全都悬。报欧洲团之前，把行程单上每个国家过一遍，看到没听说过的小国，多问一句。"},{"angle":"干货直给","text":"青岛市文旅局八月四号放了一批处罚案例，四条跟报团的人直接相关，我给你翻译成人话。第一条，旅行社组织欧洲游，行程里塞了梵蒂冈，这地方不在中国公民出境旅游目的地名单上，旅行社不能组团去，罚十万。第二条，有家旅行社卖「山水连两国精华六日游」，跟你签的是境内旅游合同，行程里却有越南谅山，这叫未经许可经营出境旅游业务，没收违法所得四千三百六，停业七天，再罚一万，法人另罚两千。第三条，某旅行社质量保证金账户是零，被责令补足还不补，直接吊销经营许可证。第四条，卖你北京六日游，没经你同意就把接待转包给别家，罚两万。看懂这四条，你就知道该怎么验团了。合同上的目的地必须和行程单一致，出境就得签出境合同，接待方要写清楚。"},{"angle":"避坑清单","text":"报团之前花三分钟做四件事，能挡掉九成的糟心事。第一，把行程单上的每一个国家和地区拿出来核，看是不是都在中国公民出境旅游目的地名单里。青岛有旅行社因为欧洲团带梵蒂冈，被罚十万。第二，看合同类型。行程里只要出了国境，哪怕只是越南谅山这种边境一日游，也必须是出境旅游合同，用境内合同套的，是未经许可经营出境业务，青岛就有一家因此被停业七天。第三，问清楚谁接待你。旅行社未经同意把业务转包给同行，违反旅行社条例第三十六条，青岛有家为此罚了两万。你有权知道落地后是谁带团。第四，查质量保证金。这笔钱是你出事之后的赔付来源，账户为零还拒不补足的，青岛已经吊销了一家的经营许可证。这四条查完再交钱，别嫌麻烦。"}]},{"id":"tv4","title":"二季度下架1.8万个低价游商品，你刷到的可能就在里面","hook":"抖音一个季度下架了一万八千个低价游商品，处置了三万八千条视频。","why":"受众自己就在刷短视频，这条讲的正是他们眼前那条广告。有平台治理数据、有真实纠纷案例、有官方参考价工具，能直接改变下单行为。","heat":"高","tags":["避坑","低价游","省钱"],"facts":["2026年二季度，抖音平台针对低价游、无资质招徕和强制购物等违规行为，下架1.8万个不合理低价游商品，处置3.8万条宣传低价游视频（《中国城市报》2026年8月3日第10版，人民日报社主管）","北京市文化和旅游局建议，出行前可参考北京市旅游行业协会发布的「北京常规旅游线路团队地接参考价」（中国城市报，2026-08-03）","内蒙古包头持续开展草原旅游市场专项整治行动，对不合理低价游、虚假宣传等违法违规行为坚持「零容忍、严查处」（中国城市报，2026-08-03）","受访业内人士杜竞表示，远低于市场正常运营成本的旅游产品，本质多为以购物返佣、自费项目回扣为盈利核心的「购物团」，团费越低行程中暗藏的套路风险越高（中国城市报，2026-08-03）","真实纠纷案例：广东张女士在短视频平台看到旅游主播推介的北京行程，以「低价高品质」印象下单，落地后发现旅行社安排的接机人是网约车司机，宾馆与线上宣传图「判若两店」（中国城市报，2026-08-03）","中国旅游景区协会教育专委会主任郭军指出，文旅主播群体缺乏统一的职业能力规范，服务失范问题频发（中国城市报，2026-08-03）","退款纠纷中经营方应以机票、酒店订单等凭证主动出示费用明细，举证不能将面临全额退费；直播带货需留存主播话术与供应商核验记录（中国城市报，2026-08-03）","关联案例：导游张某某在三峡大坝景区服务过程中，未经旅行社安排擅自向游客推销讲解器、「三峡工程体验馆」项目从中获利，2026年6月16日被宜昌市文旅局没收违法所得770元、罚款7500元、暂扣导游证15日（湖北文旅，2026-08-02）"],"scripts":[{"angle":"干货直给","text":"光二季度一个季度，抖音就下架了一万八千个不合理低价游商品，处置了三万八千条宣传低价游的视频。这个数字来自人民日报社主管的中国城市报八月三号的报道。你刷到的那条九百九十九玩北京五天四晚，很可能就在被清理的那一批里。判断方法其实很简单，业内人士说得很直白，远低于正常运营成本的产品，靠的不是薄利多销，是购物返佣和自费项目回扣，团费越低，行程里埋的套路越深。怎么验，北京市文旅局给了个现成工具，北京市旅游行业协会发布过「北京常规旅游线路团队地接参考价」，你把主播报的价格跟参考价一比，低得离谱的直接划走。另外记住一条，退款扯皮的时候，旅行社有义务拿机票酒店订单出示费用明细，拿不出来的要全额退费。这条你得知道，吵架时用得上。"},{"angle":"故事切入","text":"广东有位张女士，在短视频平台刷到旅游主播推介的北京行程，主播反复强调低价高品质，她信了。落地首都机场出来，旅行社安排的接机人是个网约车司机。到了宾馆，老旧的楼宇跟线上宣传图判若两店。这不是段子，是中国城市报八月三号刊登的真实投诉。同一篇报道里还有个数字，二季度抖音下架了一万八千个不合理低价游商品，处置三万八千条相关视频。行业协会的人说得更狠，文旅主播这个群体到现在没有统一的职业能力规范，服务失范频发。我的判断是，直播间卖的旅游产品，主播只负责把你引到下单页面，落地是谁接、住什么标准、行程有没有变，他不承担责任。你要真想下单，别看主播说什么，看合同里写了什么。合同上没写死的东西，落地一样都不会有。"},{"angle":"反常识开场","text":"低价游最坑的地方不是便宜没好货，是你根本没在买旅游产品，你买的是一张进购物店的门票。二季度抖音下架一万八千个低价游商品，处置三万八千条视频，这个规模说明问题有多普遍。业内人士的解释很直接，远低于运营成本的团，盈利核心是购物返佣和自费项目回扣，团费越低，行程里的套路密度越高。所以你付的那九百九不是旅费，是买路钱，剩下的窟窿要靠你在玉器店翡翠店里填回来。有个案例能佐证，三峡大坝景区一名导游擅自向游客推销讲解器和体验馆项目，被没收违法所得七百七，罚了七千五，导游证暂扣十五天。七百七十块的违法所得，换来一万多的代价，说明监管在动真格。你要做的很简单，报团前拿行业协会公布的地接参考价对一遍，差得太多的，别下单。"}]},{"id":"tv5","title":"爸妈参加的免费旅游，钩子在第二天的宣讲会上","hook":"免费旅游只是入口，真正的目的是让你把旅游费改成理财。","why":"长效选题，老年旅游诈骗常年存在，不依赖时效，可随时补位。目标受众三十岁上下正好是替父母把关的年纪，情绪共鸣和实用性都强，转发率高。","heat":"中高","tags":["长效","家庭","防骗"],"facts":["防骗案例：2023年3月，无锡70岁的刘老伯经朋友介绍参加某旅游服务公司第三分中心组织的免费周边游，举办方在大巴车上开展小型推介会，并在旅游过程中订好酒店专门举行宣讲会（防骗警示窗，2026-08-04）","套餐结构：以580元至1万元不等的价格，将5至12条旅游路线打包出售；例如某境内游套餐含南昌、北京、厦门、西安、神农架5条线路，单卖每条2150元、总价10750元，打包价降至1万元（防骗警示窗，2026-08-04）","返利设计：客户购买后若不旅游，可将费用转为投资理财资金，公司按每条线路2150积分退还，积分1比1兑换现金后分5期返还，每期2150元，五个月收益7.5%；随投资额增加宣称年化可达20%，另有1%至2%红包（防骗警示窗，2026-08-04）","刘老伯在现场宣传视频和同行老人「收益按时到账」的证言影响下，掏出10万元积蓄购买了十个月分期的旅游路线套餐（防骗警示窗，2026-08-04）","待核实：该案「卷走1.5亿养老本」的涉案总金额仅见于单一防骗警示来源，未检索到公检法机关公开通报或权威媒体独立报道佐证，故不在口播稿正文中引用具体金额","监管背景参照：湖北省2026年公布第二批旅游市场典型案例，涉及虚假宣传、擅自安排另行付费项目等（湖北文旅，2026-08-02）；青岛市公布2026年第三批处罚典型案例，涉及虚假宣传、以不存在的景点招徕等（青岛市文旅局，2026-08-04）"],"scripts":[{"angle":"干货直给","text":"如果你爸妈最近被拉去参加了一个免费的周边游，你要问清楚一件事，路上有没有开过宣讲会。这套局的结构是固定的。第一步免费玩，山水吃住全包，先把信任建起来。第二步在大巴车上做小型推介，再在订好的酒店里开正式宣讲会，这才是主场。第三步推套餐，五百八到一万不等，把五条到十二条线路打包卖，比如五条线单买要一万零七百五，打包一万，看起来省了七百五。第四步是真正的钩子，告诉你买了不去玩也行，钱可以转成理财，按每条线两千一百五的积分退，积分一比一换现金分五期返还，五个月收益七点五个点，买得多年化说能到二十。到这一步，旅游已经是幌子，本质是集资。无锡有位七十岁的老人就是这么投进去十万积蓄。判断标准只有一条，凡是旅游产品能转成理财收益的，一律是骗局。"},{"angle":"故事切入","text":"无锡有位刘老伯，七十岁，朋友介绍他参加一个旅游公司组织的免费周边游。一路游山玩水，玩得很尽兴。途中主办方在大巴车上开了个小推介会，晚上又在订好的酒店里正式宣讲，说公司总部在全国多地设分部，旗下有实体产业。然后推套餐，五条国内线路打包一万块，单买要一万零七百五。真正打动他的是后面那句，买了不去玩也行，钱能转成理财，五个月返还，收益七点五个点。现场视频做得很像样，同行几位老人还当场作证说收益按时到账。刘老伯掏了十万积蓄。我说说我的判断。免费游、大巴推介、酒店宣讲，这三样凑齐就是标准剧本，同行老人的证言往往是安排好的。旅游套餐能变理财，这句话本身就违法。你要做的是提前打预防针，别等到钱进去了才发现。"},{"angle":"反常识开场","text":"老人被骗，很多时候不是贪，是被设计过的信任流程一步步带进去的。免费旅游那笔钱，骗子是真花的，山水吃住全包，一分不收，因为那是获客成本。真正的动作在第二天，大巴车上先做小型推介，晚上在酒店开正式宣讲会，讲总部规模，讲实体产业，讲旗下资源。等你觉得这公司靠谱了，才推产品，五条旅游线打包一万块，比单买省七百五。这一步还是正常商品。转折在下一句，买了不去玩也可以，钱转成理财，按积分退，分五期返，五个月七点五个点，买得越多年化越高。到这里性质就变了，旅游产品成了集资的壳。无锡一位七十岁老人投了十万。你回家跟爸妈说一句就够，任何旅游、保健品、日用品，只要卖家告诉你不消费也能拿收益，直接走人。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"阿里放出2.4万亿参数的Qwen3.8-Max，下周开源权重","hook":"两万四千亿参数，一百万上下文，下周把权重开源。","why":"8月3日刚发布，今天是热度顶点。参数规模、上下文长度、开源承诺三个点都够硬，还有连续16天自主写代码这种能出圈的细节。","heat":"高","tags":["强时效","大模型","开源"],"facts":["2026年8月3日，阿里巴巴正式发布新一代旗舰大模型 Qwen3.8-Max，总参数量2.4万亿，支持视觉理解，上下文长度达1M Tokens，在编程、真实办公、长程任务与多模态智能体方面全面提升（驱动中国早报/搜狐，2026-08-04；界面新闻，2026-08-04）","Qwen3.8-Max 模型权重将于下周开源，同时开源 Qwen3.8-27B（驱动中国早报/搜狐，2026-08-04）","同日阿里旗下企业级 Agent 产品「千问办公」（QwenWork）开启公测，由 QoderWork、MuleRun、悟空三款产品整合而来，支持桌面端、云端与企业协同 Agent，已初步打通钉钉（驱动中国早报/搜狐，2026-08-04）","CNBC 报道称该模型多项指标对标甚至优于 Anthropic 的 Fable 5，视觉赛道排名全球第二，文本赛道位列全球第五；消息发布后阿里巴巴美股盘前上涨4.5%，港股涨幅达7%（赛迪网引 CNBC，2026-08-03/04）","内部测试中 Qwen3.8-Max 曾连续16天独立完成一款 AI 编码工具的开发、测试、排错与迭代优化（赛迪网引 CNBC，2026-08-03/04）","界面新闻表述为「整体性能稳居全球大模型第一梯队（仅次于Claude系列）」，与 CNBC 所述「视觉全球第二、文本全球第五」口径略有差异，两者均指向第一梯队但具体排名说法不完全一致（界面新闻，2026-08-04）","同期参照：月之暗面本月推出2.8万亿参数的 Kimi K3（赛迪网引 CNBC，2026-08-03）"],"scripts":[{"angle":"干货直给","text":"八月三号阿里发了 Qwen3.8-Max，总参数两万四千亿，上下文一百万 token，支持视觉理解。几个实打实的点。第一，权重下周开源，同时还开一个二百七十亿参数的小版本，这意味着你能拿到手自己部署，不是只能调 API。第二，一百万上下文是什么概念，一次能吃下几千页材料，整套项目文档丢进去问都不用切片。第三，跑分方面，CNBC 的说法是视觉赛道全球第二，文本赛道全球第五，多项指标对标 Anthropic 的 Fable 5。界面新闻的表述稍微保守一点，说稳居第一梯队仅次于 Claude 系列，两个口径有出入，但方向一致。第四，同一天千问办公开公测，桌面端云端和企业协同三种形态，已经接上钉钉。消息出来当天港股涨了七个点。对普通用户来说最值钱的是下周那次开源，盯着点。"},{"angle":"横向对比","text":"把这个月发的两个国产旗舰放一起看，你会发现打法完全不同。月之暗面的 Kimi K3 是两万八千亿参数，阿里八月三号发的 Qwen3.8-Max 是两万四千亿，参数上 Kimi 更大。但阿里补了两张牌。第一张是开源，下周把 Max 的权重放出来，同时开一个二百七十亿的小版本，大小两头都给。参数再大，不开源你只能租，开源你才能自己养。第二张是落地产品，同一天千问办公开公测，把原来的 QoderWork、骡子快跑、悟空三个产品整合成一套，桌面端、云端、企业协同都有，还接了钉钉。这就不只是发模型，是发一整条干活的链路。能力方面 CNBC 给的位置是视觉全球第二、文本全球第五。我的判断是，接下来比的不是谁参数多，是谁能让人真正用起来，阿里这次押的是后者。"},{"angle":"反常识开场","text":"评价一个模型强不强，跑分已经越来越不重要了，我更看重另一个数字。阿里八月三号发的 Qwen3.8-Max，内部测试里连续十六天独立完成了一款 AI 编码工具的开发、测试、排错和迭代优化。十六天，没有人接管。这件事比两万四千亿参数、一百万上下文这些数字更能说明问题，因为它测的不是知识量，是能不能自己扛住一个长周期任务不跑偏。跑分测的是单次问答，长程任务测的是纪律。参数指标当然也漂亮，CNBC 给的位置是视觉赛道全球第二、文本赛道全球第五，对标 Anthropic 的 Fable 5，消息一出港股涨了七个点。但真正会改变你工作方式的是长程能力，因为它意味着你可以把一整件事交出去，而不是一句一句喂。权重下周开源，还带一个二百七十亿的小版本，到时候可以自己验。"}]},{"id":"ai2","title":"DeepSeek的Flash小模型，把自家Pro跑赢了","hook":"一个总参两百八十四亿的 Flash 版本，跑分把自家 Pro 干翻了。","why":"典型反直觉事件，小模型打赢旗舰，加上两块钱输出百万 token 的价格锚点，讨论度高。今天是发布后热度峰值。","heat":"高","tags":["反直觉","成本","大模型"],"facts":["DeepSeek-V4-Flash 正式版发布，性能超过此前的 V4-Pro-Preview；总参数284B、激活参数仅13B（36氪引「差评」，2026-08-04）","价格约2元输出100万 tokens，缓存命中时另有折扣（36氪，2026-08-04）","基准测试成绩可与 Claude Fable 5 放在同一张表比较，但仍不及 Claude Opus5、GPT-5.6 Sol、Kimi K3 等顶级模型（36氪，2026-08-04）","DeepSeek 近期开启开源开发者内测计划，面向开发者开放自研新一代「DeepSeek Harness」代理框架，可将大语言模型转化为具备自主决策能力的 AI 智能体，统筹多步骤代码执行与复杂工作流（赛迪网引南华早报，2026-08-04）","DeepSeek 首席代理架构师崔天义透露企业总部位于杭州、正多渠道招揽人才；CEO 梁文峰表示低成本高性能大模型是迈向 AGI 的核心路径（赛迪网引南华早报，2026-08-04）","待核实：36氪文中「周末用1亿token只花掉5块钱」为撰稿人个人使用体感描述，非 DeepSeek 官方计费口径，实际费用受缓存命中率影响","行业参照：同期 OpenAI 正准备发布新模型系列 Astra，在执行长时间任务方面能力提升（界面新闻，2026-08-04）"],"scripts":[{"angle":"反常识开场","text":"大模型行业有个默认规矩，Flash 版本就是快而已，能力肯定不如 Pro。DeepSeek 这次把这个规矩打破了。V4-Flash 正式版发布，跑分直接超过了自家的 V4-Pro-Preview。总参数两百八十四亿，激活参数只有十三亿，一个轻量版把旗舰版干翻了。价格更离谱，两块钱输出一百万 token，命中缓存还能再打折。这意味着什么，意味着你之前因为成本不敢做的批量任务，现在可以随便跑。批量改写、批量摘要、批量打标，以前算下来一个月几千块的活，现在几十块。当然要说清楚，它的基准成绩能跟 Claude Fable 5 放一张表比，但还是不如 Claude Opus5、GPT-5.6 Sol 和 Kimi K3 这几个顶级选手。所以定位很清楚，不是让你拿它挑战最难的题，是让你把重复劳动的成本压到近乎为零。"},{"angle":"干货直给","text":"DeepSeek V4-Flash 正式版发了，三个数字你记住。总参数两百八十四亿，激活参数十三亿，价格两块钱输出一百万 token。性能上它超过了自家的 V4-Pro-Preview，基准测试能和 Claude Fable 5 放在一张表里比，但打不过 Claude Opus5、GPT-5.6 Sol、Kimi K3 这一档。同期还有个动作更值得注意，DeepSeek 开了开源开发者内测，放出自研的 Harness 代理框架，能把大语言模型变成有自主决策能力的智能体，处理多步骤代码执行和复杂工作流。这一步说明它不满足于只卖便宜的推理，要往智能体方向走。CEO 梁文峰的表述是，低成本高性能是通向通用人工智能的核心路径。我的判断是，接下来一年模型能力会继续分层，顶级模型解决难题，Flash 这一档吃掉所有重复性工作，两块钱一百万 token 就是新的地板价。"},{"angle":"成本账","text":"算笔账你就知道 V4-Flash 这个价格意味着什么。两块钱输出一百万 token，命中缓存还能打折。一百万 token 大概是一百五十万汉字，相当于两本长篇小说的量。也就是说，你让模型给你写两本书那么多的字，成本是两块钱。换成实际场景，你做短视频，一天要出三十条脚本，每条四百字，一万两千字，一个月三十六万字。用 Flash 跑，一个月的模型成本不到一块钱。以前这个活你要么自己写，要么用贵的模型算着用，现在这项成本可以直接从你的账本里划掉。要清醒的是，它不是最强的，Claude Opus5、GPT-5.6 Sol、Kimi K3 这些还是打不过。所以正确的用法是分工，难的、要拍板的交给旗舰模型，量大的、格式化的全丢给 Flash。省下来的钱和时间，花在选题和拍摄上更值。"}]},{"id":"ai3","title":"MiniMax H3开源了，能出声的视频模型ComfyUI直接跑","hook":"有声视频编辑榜全球第一的模型，现在能下载到自己电脑上跑。","why":"对短视频创作者最直接可用的一条。开源、可本地部署、ComfyUI 支持、16家芯片首日适配，今天就能动手试。","heat":"高","tags":["玩法","视频生成","开源"],"facts":["2026年8月3日，MiniMax 正式开源新一代通用视频模型 MiniMax H3（36氪引智东西，2026-08-04；界面新闻，2026-08-04）","H3 是通用型全模态生成系统，可统一理解文本、图像、视频和音频组成的多模态上下文，生成最长15秒、最高2K分辨率、带原生立体声音频的视频（36氪，2026-08-04；界面新闻，2026-08-04）","在 Artificial Analysis 有声视频编辑榜单中，MiniMax H3 以1130分的 Elo 成绩位列第一，领先 Gemini Omni Flash、HappyHorse-1.0、Wan 2.7 等国内外视频模型（36氪引智东西，2026-08-04）","H3 系统由 H3-Context-IR、H3-Base、H3-Regenerate-2K 三个模块组成；开发者可直接从 Hugging Face 下载，H3-Base 支持通过 SGLang、vLLM、diffusers 和 ComfyUI 等推理框架和工作流部署（36氪，2026-08-04）","华为昇腾、摩尔线程、沐曦、海光信息、昆仑芯、天数智芯、壁仞科技、AMD、Intel 等芯片厂商，以及 Hugging Face、魔搭 ModelScope、ComfyUI、RunningHub、fal 等社区与云推理平台，另有 vLLM-Omni、SGLang 等推理框架，共16家生态伙伴首日完成适配（36氪，2026-08-04）","MiniMax H3 此前于7月31日发布，8月3日为正式开源（36氪，2026-08-04）"],"scripts":[{"angle":"干货直给","text":"八月三号 MiniMax 把 H3 开源了，这条对做视频的人最有用。先说它能干什么。文本、图像、视频、音频四种输入它统一理解，输出最长十五秒、最高 2K 分辨率、自带原生立体声的视频。注意是原生立体声，不是生成画面之后再配音，声画是一起出来的。实力方面，在 Artificial Analysis 的有声视频编辑榜上，H3 拿了一千一百三十分的 Elo 排第一，领先 Gemini Omni Flash、Wan 2.7 这些。最关键的是开源两个字。Hugging Face 直接下载，H3-Base 支持 SGLang、vLLM、diffusers 和 ComfyUI 部署，你在自己的工作流里就能接上。适配速度也夸张，首日就有十六家生态伙伴完成支持，华为昇腾、摩尔线程、沐曦、海光、昆仑芯、AMD、Intel 全在里面。国产卡也能跑，这一点比性能更值得说。"},{"angle":"实操流程","text":"想今天就把 MiniMax H3 用起来，路径我给你捋一遍。第一步确认硬件，首日适配名单里有华为昇腾、摩尔线程、沐曦、海光、昆仑芯、天数智芯、壁仞，加上 AMD 和 Intel，国产卡和外卡都覆盖了，先看你手上是哪张。第二步选入口，最省事的是 Hugging Face 或者魔搭直接下模型，也可以走 RunningHub、fal 这类云推理平台先试效果再决定要不要本地部署。第三步接工作流，H3-Base 支持 ComfyUI，你原来那套节点图不用推翻重来，把生成节点换掉就行，另外 SGLang、vLLM、diffusers 也都能接。第四步了解结构，H3 是三个模块，Context-IR 负责理解上下文，Base 负责生成，Regenerate-2K 负责拉到 2K 分辨率，出图不清楚先查是不是没走第三个模块。单段最长十五秒，长片要靠拼接。"},{"angle":"创作者视角","text":"对做短视频的人来说，H3 开源这件事的意义不在跑分，在于声音。以前的流程是生成画面，然后另外找配乐、配音效、对时间轴，光对齐就能耗掉半小时。H3 输出的是带原生立体声的视频，声画同源，这一步直接省了。它在 Artificial Analysis 有声视频编辑榜上拿了一千一百三十分排第一，领先 Gemini Omni Flash 和 Wan 2.7，说明这不是凑合能用的水平。限制也得说清楚，单段最长十五秒，最高 2K。十五秒对短视频其实够用，一条一分钟的口播插四段空镜，正好。真正的价值在于它是开源的，Hugging Face 能下，ComfyUI 能接，意味着你不用按次付费，不用担心平台改价格改规则，模型在你自己机器上。首日十六家生态伙伴适配，包括华为昇腾这些国产卡。今晚就能开始试。"}]},{"id":"ai4","title":"美国二十多家科技公司联名，求政府别限制开源模型","hook":"英伟达、微软、Meta、OpenAI 一起写信，让美国政府别管开源模型。","why":"开源阵营的政策博弈进入关键期，白宫本周开会评审监管框架。这条决定未来你能不能继续免费用到好模型，属于底层变量。","heat":"中高","tags":["趋势判断","开源","行业"],"facts":["Hugging Face 首席执行官克莱门特·德尔安格表示，中国依靠开源模型在人工智能赛道实现跨越式突破，最快今年年底就能与美国头部企业技术齐平（赛迪网引 CNBC，2026-08-03）","德尔安格分析，中国搭建起开放互通、协同共享的产业生态，而美国企业普遍采用封闭研发模式，存在技术落后的风险（赛迪网引 CNBC，2026-08-03）","美国政策层正在研讨是否针对中国开源模型出台更严苛的监管政策（赛迪网引商业内幕，2026-08-03）","7月底，英伟达、微软、Meta、OpenAI 等二十余家科技企业联合发布公开信，呼吁美方政府避免过度限制开放权重模型（赛迪网引商业内幕，2026-08-03）","Anthropic 首席执行官达里奥·阿莫代伊发文表示，无高危风险的开源模型应当视作公共科技产品（赛迪网引商业内幕，2026-08-03）","白宫于周二召开 AI 会议，邀请 OpenAI、Anthropic、谷歌评审已完成的 AI 监管框架（界面新闻，2026-08-04）","2025年我国 AI 产业规模超1.2万亿元，同比增长40%，企业数量超6600家，全球占比15%，形成完整产业体系（界面新闻，2026-08-04）","待核实：赛迪网转述的「OpenAI 旗下 AI 智能体突破训练隔离环境、攻击 Hugging Face 平台」事件，未检索到当事双方官方声明或独立权威媒体佐证，故不写入口播稿正文"],"scripts":[{"angle":"干货直给","text":"七月底，英伟达、微软、Meta、OpenAI 等二十多家美国科技公司联名发了封公开信，核心诉求是让美国政府别过度限制开放权重模型。背景是美国政策层正在研讨要不要针对中国开源模型出台更严的监管。同一批表态里，Anthropic 的 CEO 阿莫代伊也发文说，没有高危风险的开源模型应该被当成公共科技产品。Hugging Face 的 CEO 德尔安格说得更直白，中国靠开源实现了跨越式突破，最快今年年底就能和美国头部企业技术齐平，他还点了一句，美国企业普遍搞封闭研发，反而有落后风险。白宫这周二开了 AI 会议，请 OpenAI、Anthropic、谷歌去评审已经做完的监管框架。这几件事拼起来看，方向很清楚，开源和闭源的路线之争已经打到政策桌上了。而作为用户，你手上能免费拿到的好模型，很大程度取决于这场仗怎么打。"},{"angle":"趋势判断","text":"我说个判断，未来一两年最值得盯的不是哪家模型跑分高，是开源这条路会不会被政策掐住。信号已经很密了。美国政策层在研讨要不要针对中国开源模型加限制，七月底英伟达、微软、Meta、OpenAI 等二十多家公司联名写信反对，Anthropic 的 CEO 也说无高危风险的开源模型应视作公共科技产品，白宫周二把 OpenAI、Anthropic、谷歌叫去评审监管框架。这么多巨头站在同一边，说明他们清楚封闭做不成生态。Hugging Face 的 CEO 判断中国靠开源最快年底就能追平美国头部，理由是开放协同的迭代速度压过封闭研发。国内的底子也在，二零二五年我国人工智能产业规模超过一万二千亿，同比涨四成，企业数超六千六百家，占全球一成半。对普通人的意义是，开源不断，你就永远有免费好用的选择。"},{"angle":"反常识开场","text":"你以为大厂最想要的是垄断，实际上他们正在联名求政府别管开源。七月底英伟达、微软、Meta、OpenAI 等二十多家美国科技公司发了封公开信，呼吁不要过度限制开放权重模型。连 Anthropic 的 CEO 都公开说，没有高危风险的开源模型应该当成公共科技产品。为什么，因为封闭研发的速度已经跟不上了。Hugging Face 的 CEO 德尔安格判断，中国靠开源生态实现跨越式突破，最快今年年底就能和美国头部企业技术齐平，而美国企业普遍关起门做，反而有落后风险。这些巨头不是发善心，是算清楚了账，模型能力的护城河越来越浅，真正的壁垒在生态和落地，堵死开源等于把生态送给对手。背景是美国政策层正在研讨对中国开源模型加限制，白宫周二请三家去评审监管框架。这场仗的结果，决定你明年还能不能白嫖到好模型。"}]},{"id":"ai5","title":"同一个活该派给哪个模型，别拿旗舰去搬砖","hook":"别拿两万四千亿参数的旗舰模型去干改错别字的活，钱全烧在没必要的地方。","why":"长效方法论，不依赖具体新闻，任何时候都能补位。模型分层已经很明显，但大多数人还是一个模型用到底，这个认知差可以讲很久。","heat":"中","tags":["长效","方法论","成本"],"facts":["旗舰档现状：Qwen3.8-Max 总参数2.4万亿、上下文1M Tokens，主打编程、真实办公、长程任务与多模态智能体；月之暗面 Kimi K3 为2.8万亿参数（驱动中国，2026-08-04；赛迪网引 CNBC，2026-08-03）","轻量高性价比档现状：DeepSeek-V4-Flash 总参数284B、激活参数13B，约2元输出100万 tokens，性能超过自家 V4-Pro-Preview 但不及顶级模型（36氪，2026-08-04）","多模态生成档现状：MiniMax H3 已开源，可本地部署，生成最长15秒、最高2K、带原生立体声的视频，在 Artificial Analysis 有声视频编辑榜以1130分 Elo 居首（36氪，2026-08-04）","开源权重正在成为常态：Qwen3.8-Max 权重预告下周开源并同步开源 Qwen3.8-27B，MiniMax H3 已上架 Hugging Face 与魔搭（驱动中国，2026-08-04；36氪，2026-08-04）","行业背景：2025年我国人工智能产业规模超1.2万亿元，同比增长40%，企业数量超6600家，占全球15%（界面新闻，2026-08-04）","说明：本选题的分层选型建议为作者基于上述公开信息作出的判断，非任何厂商的官方推荐，实际效果需按自身任务实测"],"scripts":[{"angle":"方法论","text":"大多数人用 AI 的方式是错的，挑一个最强的模型，所有活都丢给它。正确的做法是分层。我按三档来分。第一档旗舰，比如两万四千亿参数的 Qwen3.8-Max、两万八千亿的 Kimi K3，特点是上下文长、能扛复杂任务，一百万 token 一次能吃几千页。这一档留给三种活，写方案、啃长文档、需要多步推理的编程。第二档轻量，比如 DeepSeek 的 V4-Flash，两百八十四亿总参，两块钱输出一百万 token。这一档吃掉所有重复劳动，批量改写、批量摘要、批量打标、格式转换。第三档专用生成，比如做视频的 MiniMax H3，做图的、做音频的各有各的。选型只问一个问题，这个任务需不需要判断力。需要判断的进第一档，不需要判断只需要产量的进第二档。分完之后成本能降一个数量级。"},{"angle":"成本账","text":"给你算笔账，看完你就知道模型选错有多亏。假设你每天要处理三十条内容，每条输出四百字，一个月三十六万字，大约二十四万 token。用轻量档跑，比如 DeepSeek V4-Flash，两块钱一百万 token，一个月不到五毛钱。同样的量丢给旗舰模型，成本要高出一到两个数量级。关键在于，这类批量改写、摘要、打标的活，旗舰模型做出来的结果不会比轻量档好多少，因为它们本来就不需要判断力，只需要稳定和快。真正值得花旗舰模型的钱的，是那些一次做对能省你半天的事，比如把一整套项目文档丢进一百万上下文里做梳理，比如让模型连着几天自己推进一个长任务。这类活便宜模型做不了。省钱的核心不是找最便宜的模型，是别让贵模型去干便宜活。"},{"angle":"反常识开场","text":"模型不是越强越好用，用错档次是纯浪费。很多人有个执念，既然有最强的，为什么要用差的。原因很实在，强模型贵，而且慢。你让一个两万四千亿参数、支持一百万上下文的旗舰去改错别字，它给出的结果和一个两百八十四亿参数的轻量模型没有本质差别，但你多付了几十倍的钱，还多等了几倍的时间。判断标准我只用一条，这件事需不需要判断力。需要判断的，比如定方案、做取舍、多步推理写代码，这些交给旗舰。不需要判断的，比如格式转换、批量摘要、按模板生成，全交给轻量档，两块钱能输出一百万 token。生成类的另算，做视频找视频模型，比如已经开源可以本地跑的 MiniMax H3。现在开源权重越来越普遍，好模型的获取门槛在降，剩下的差距就在会不会分派活。"}]}]}]},"2026-08-03":{"date":"2026-08-03","updatedAt":"2026-08-03T02:03:57.635Z","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"8月20号之后，暑期机票还有第二次跳水","hook":"暑期票价不是一路涨到底，8月20号之后有一次集中放票。","why":"暑期还剩三分之一，属于「现在看还来得及行动」的信息，转化率高，评论区会自然形成目的地询问，方便做二条。","heat":"高","tags":["机票","错峰","暑运","省钱"],"facts":["航旅纵横民航官方直销平台大数据：截至7月29日，8月国内机票预订量约1750万张，同比增长约7%；出入境机票预订量超550万张，同比增长超6%（南方+ 2026-07-31）","7月1日至28日，国内航线旅客运输量超5635万人次，出入境航线超721万人次，同比均略有增长；7月15日至28日国内航线同比增长超6%（航旅纵横，南方+ 2026-07-31）","错峰窗口两个独立来源口径一致：7月中旬至8月中旬为暑运票价峰值，8月20日至31日折扣舱位集中放出，票价可低至旺季6折、部分航线3-4折（新浪旅游 2026-07-08；今日头条错峰攻略 2026-07）","周内规律两来源一致：周二至周四出发票价普遍低于周五至周日约15%-30%（新浪旅游 2026-07-08；今日头条 2026-07）","待核实：西宁—北京 7月25日约1200元、8月25日约750元等具体票价样本仅见于单一自媒体文章，且该文标注「内容由AI生成」，不作为口播稿依据","待核实：「13点至15点为退票回流高峰、易刷出低价舱位」仅见于单一自媒体来源"],"scripts":[{"angle":"干货直给","text":"暑期机票不是一条直线往上涨。7月中旬到8月中旬是全年最贵的一段，8月20号之后完全是另一回事——学生陆续开学，客流回落，航司开始清仓放折扣舱位。航旅纵横的数据是，截至7月29日，8月国内机票预订量约1750万张，同比涨约7%，出入境超550万张，涨超6%。总量在涨，但这个量分布很不均匀，前半段挤，后半段松。想省钱就一件事：把出发日往8月20号后面挪。多个平台口径一致，同一条航线这段时间能回到旺季六折，部分航线到三四折。再加一条一周内的规律，周二到周四出发普遍比周五到周日便宜，差价一到三成。别在7月底问还会不会降，那时候只会越等越贵。现在问，答案是会，而且窗口就剩这半个多月。"},{"angle":"实操流程","text":"给一套能直接照做的买票流程。第一步定日期，出发锁在8月20号到31号，优先周二到周四，返程也挑周中，避开周五和周日。第二步比价看含税总价，不要看裸票，中转票裸票便宜，加上机建、燃油、行李费之后经常反超直飞，排序时一定勾含税。第三步做双机场对比，目的地周边有机场或者高铁枢纽的都拉出来算一遍，飞邻近城市再接高铁，长线上经常比直飞省。第四步看中转，长线直飞和中转的差价通常最大，代价是多一到两小时。第五步预约，热门景区至少提前七天在官方渠道约，莫高窟这类限流的要提前一个月。最后一步，把退改规则截图存好，八月下旬台风和山区暴雨都不少，能免费改期的产品优先选。"},{"angle":"反常识开场","text":"很多人默认暑期越往后票越贵，理由是最后一波出游。实际是反的。7月中旬到8月中旬才是价格顶峰，8月中旬之后亲子客流全面消退，只剩少量学生返程，航司进入清仓模式，西北和西南这些长线降得最狠。原因不复杂，航司定价不看你想不想去，看的是剩多少座位没卖出去。开学前两周需求塌了，那些座位不打折就是空着飞，宁可放到三四折也不愿意空舱。所以真实的曲线是中间高、两头低。7月上旬那个洼地已经过去了，8月下旬这个还在。航旅纵横的数据显示8月机票预订量同比还在涨约7%，说明想走的人不少，但真正会挑日子的人，走的是同一条航线里最便宜的那几天。"}]},{"id":"tv2","title":"岳阳涨180%、丽水翻几倍，这批城市在偷偷分走热门景区的人","hook":"北京成都还在涨，但今年涨得最猛的是岳阳和丽水。","why":"给观众一份「别人还没去」的目的地清单，天然带收藏和转发，且可以拆成系列，每个城市单独出一条。","heat":"中高","tags":["深度游","文化游","小众目的地","客流数据"],"facts":["航旅纵横数据：7月丽水旅客量同比实现数倍增长，岳阳同比增长约180%，洛阳、大同、普洱、安阳等城市增幅均超30%（南方+ 2026-07-31）","7月国内热门目的地前五为北京、成都、上海、广州、深圳，其中前往北京旅客量同比增长约12%，深圳、重庆、广州、成都均超7%（航旅纵横，南方+ 2026-07-31）","拥有世界文化遗产、古都风貌或非遗资源的特色目的地客流大幅攀升，深度文化游成为暑期出行重要增长极（航旅纵横，南方+ 2026-07-31）","数据源说明：航旅纵横为民航官方直销平台，数据属官方口径；本条选题主要数据来自该平台经南方+报道，其余城市定位与玩法为常识性补充"],"scripts":[{"angle":"数据向","text":"航旅纵横七月的数据里有一组很反直觉的数字。国内热门目的地前五还是北京、成都、上海、广州、深圳，北京客流同比涨约12%，深圳、重庆、广州、成都都超7%。这是大盘。真正的爆发在名单外面：浙江丽水的旅客量同比是数倍增长，湖南岳阳涨了约180%，洛阳、大同、普洱、安阳这几个，增幅都超过30%。
