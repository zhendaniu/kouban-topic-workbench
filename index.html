在售（航旅纵横/腾讯新闻2026-08-14）","具体实测：9月25日杭州飞石家庄经济舱最低336元不含税约2.1折，9月26日杭州飞深圳最低320元约1.8折（潮新闻2026-08-15）","平台提示：8月下旬至9月上旬将迎来中秋、国庆机票预订高峰，热门线路票价可能波动，建议提前安排（航旅纵横/潮新闻2026-08-15）","国内热门城市抢订热度同比增30%、出境热门城市增超50%；县域目的地成新高地，新疆布尔津、九寨沟等县城预订最火（去哪儿/中国旅游报2026-08-14）"],"scripts":[{"angle":"数据向","text":"长假机票没你想的那么贵，给几个实测数字。航旅纵横数据，截至8月14日，9月25日到10月7日国内机票预订量已经超191万张，同比涨7%，出入境超135万张涨11%，需求确实在释放。但价格没崩，中秋首日北京去上海、杭州、西安，广州去杭州、武汉还有2折左右的票。更具体的：9月25日杭州飞石家庄最低336元不含税约2.1折，9月26日杭州飞深圳最低320元约1.8折。结论很清楚，长假初期有低价窗口，别被「假期一定贵」吓住。要动手趁早，等8月下旬到9月上旬预订高峰一到，热门线路就会波动上行，到时候再抢就被动了。"},{"angle":"干货直给","text":"中秋国庆机票还有捡漏空间，关键记两点。第一，长假前几天和部分航线仍有2折票，中秋首日北京去上海杭州西安、广州去杭州武汉都有2折左右，杭州飞石家庄336、飞深圳320这种实测低价就在架子上。第二，真正的抢票高峰在8月下旬到9月上旬，平台已经提示热门线路会波动，越拖越被动。所以现在就该打开App比价，把能锁的低价先锁了。出行日期选9月25日到10月7日之间的，尽量避开首尾绝对高峰日，中段日期往往更便宜。已经买了高价票的也别急，临近如果降价，看退改政策合算就重买，有旅客靠这招一张省下不少。"},{"angle":"实操流程","text":"双节机票这样买最稳，按步骤走。第一步，现在就查9月25日到10月7日你那几条线的价格，别等9月，越拖越贵。第二步，锁定长假初期和中期有2折左右的航线，比如中秋首日北京、广州出发的多条线，杭州飞石家庄、深圳的实测低价。第三步，把出发日往中段挪，避开10月1日前后绝对高峰，价差能有一截。第四步，8月下旬到9月上旬是预订高峰，热门线路会波动，看到低于心理价的就下手，别赌继续降。第五步，下单前看退改规则，选能免费或低价退的，万一到时降价还能重买捡漏。整套走完，长假机票能比盲订省两三成，省下的钱够目的地多玩一天。"}]},{"id":"tv4","title":"县域目的地成双节抢订新高地：新疆布尔津、九寨沟等县城预订最火","hook":"今年长假最火的不是大城市，是一堆县城。","why":"反向趋势选题，数据来自去哪儿2026-08-14最新榜单，县城游是增量叙事，评论区容易有共鸣和补充。与历史小众游选题角度不同（本次是预订热度榜）。","heat":"中高","tags":["趋势","反向","国内游"],"facts":["去哪儿数据：中秋国庆县域目的地成抢订新高地，预订最火县城TOP10为新疆布尔津、四川九寨沟、广西阳朔、新疆哈巴河、新疆新源、吉林安图、福建平潭、云南德钦、江西婺源、吉林抚松（去哪儿/中国旅游报2026-08-14）","航旅纵横：截至8月11日，9月25日至10月7日国内航线机票预订量超171万张、同比增约7%，出入境超128万张、同比增约11%（航旅纵横/腾讯新闻2026-08-14）","热门城市TOP10：北京、上海、广州、成都、深圳、昆明、乌鲁木齐、重庆、西安、杭州；西南、西北文旅城市关注度持续走高（航旅纵横/多平台2026-08-14）","超长假期释放远途出境需求：飞往巴西机票量增3.6倍、葡萄牙增2倍、比利时1.8倍、南非1.7倍、智利1.4倍（去哪儿/中国旅游报2026-08-14）","待核实：县域酒店与接待承载力在长假高峰能否匹配预订热度，以各地文旅部门实时提示为准"],"scripts":[{"angle":"趋势判断","text":"今年双节有个明显转向：最火的不是一线城市，是一堆县城。去哪儿的预订榜，县域目的地成了抢订新高地，最火的前十是新疆布尔津、四川九寨沟、广西阳朔、新疆哈巴河、新源、吉林安图、福建平潭、云南德钦、江西婺源、吉林抚松。背后逻辑是13天超长假期把深度游需求释放了，大家不想在热门城市人挤人，宁愿去县城慢住。西南西北的文旅城市本身关注度就高，叠加县域低消费和好风景，成了性价比高地。对内容创作者，县城游是比大城市攻略更蓝海的赛道，竞争少、素材新、本地人更愿意互动，现在切入正合适，越早发越容易吃到第一波流量红利。"},{"angle":"数据向","text":"用数据看双节去哪。去哪儿的县域预订TOP10：新疆布尔津、九寨沟、阳朔、哈巴河、新源、安图、平潭、德钦、婺源、抚松，清一色风景型小城。热门城市TOP10还是北京上海广州成都深圳昆明乌鲁木齐重庆西安杭州，但增量在县域。航旅纵横数据，截至8月11日国内机票预订超171万张涨7%，出入境超128万张涨11%。出境那边更远，飞巴西涨3.6倍、葡萄牙2倍、比利时1.8倍。一句话，长假需求两头走：一头扎进县城深度游，一头飞去南美长线。中间档的常规打卡游，反而最拥挤最不划算，性价比最低，避开人流才舒服。"},{"angle":"说人话版","text":"说人话解释为什么今年县城这么火。13天长假以前很少见，大家憋久了不想去大城市排队，想找个安静地方多住几天。县城刚好满足：风景不差、物价低、人相对少。去哪儿的预订榜把布尔津、九寨沟、阳朔这些小城顶到前面，说明真金白银在往县域流。对普通人来说，这意味着两个机会：一是自己出游避开人潮，选县城性价比高；二是如果你做本地内容，县城商家现在极度缺会拍会写的达人，合作门槛比大城市低得多。别只盯着网红城市，今年的增量在县里，谁先占谁先吃红利。大城市的内容已经卷成红海，县城反而是一片蓝海，现在去拍去写，竞争小、本地配合度高，账号起量更快。"}]},{"id":"tv5","title":"8月下旬错峰实测：长沙飞海口1500跌到500，周二周三上午下单最便宜","hook":"晚走十天，一张票能省出一顿海鲜大餐。","why":"用实测价格落差制造钩子，叠加「周中下单」「提前15-25天」可操作技巧，实用性强。数据来自新浪08-14与三湘都市报08-06，交叉印证。","heat":"高","tags":["强时效","省钱","国内游"],"facts":["新浪暑期机票报道：8月20日后是价格分水岭，热门航线比7月高峰便宜20%至30%，长沙飞海口从近1500元跌到约500元，丽江返程从1200至1800元跌至400至500元（新浪2026-08-14）","同一航线周中更便宜：航司周二、周三集中释放余位和折扣舱，整体均价较周四、周五低8%至12%，比周末低15%至30%（新浪2026-08-14）","提前量：国内航线提前15至25天预订性价比最高，均价比出发前3天内临期购票低25%至35%；国际航线提前2至3个月最划算（新浪2026-08-14）","三湘都市报：近两月国内燃油附加费三连降，800公里以上从170元降至70元，但热门航线裸价因暑运需求普涨两三成，总票价不降反升（三湘都市报2026-08-06）","待核实：已购票旅客通过退票重购最多省2800元的个案，以航司实际退改政策为准"],"scripts":[{"angle":"数据向","text":"8月下旬错峰的降价幅度，给你看实测。新浪报道，8月20日之后是价格分水岭，热门航线比7月高峰便宜20%到30%。长沙飞海口从近1500元跌到约500元，丽江返程从1200到1800元跌到400到500元，一张票省出的钱够吃顿海鲜。再加上周中规律：航司周二周三集中放折扣舱，均价比周四周五低8%到12%，比周末低15%到30%。也就是说，同样一趟行程，选8月23日之后、周二或周三出发，能叠两层便宜。别被燃油费三连降误导，三湘都市报说热门裸价因暑运需求反而涨了二三成，真正便宜的窗口就是8月下旬这波，错过要等明年。"},{"angle":"反常识开场","text":"很多人以为暑假机票越晚越贵，其实8月下旬是全年最划算的捡漏期。原因在需求结构：8月下旬亲子客流断崖下跌，学生还没到返校高峰，年假族错峰出发，航司为填满座位清仓甩卖。实测长沙飞海口从近1500元掉到500，丽江返程从1200到1800掉到400到500。更反直觉的是下单日子：不是越早越便宜，而是周二周三上午最便宜，因为航司周一周二统计完周末数据，周三集中放余位，比周末低15%到30%。所以别盲目提前三个月抢，卡在8月20日后、选周中出发，才是真省钱姿势，早买反而可能买贵，记住这个节奏就行。"},{"angle":"实操流程","text":"8月下旬错峰购票，按这个顺序最稳。第一步，把出发日定在8月23日之后，避开8月15日前后的暑期峰值，价差能有20%到30%。第二步，选周二或周三出发，航司这两天放折扣舱最多，比周末便宜15%到30%。第三步，提前15到25天订国内线，均价比临期3天内低25%到35%，国际线提前2到3个月。第四步，下单时间放周三上午，别在周末凑热闹。第五步，已经买了7月高价票的，盯紧降价，算过退改手续费还划算就重买，有旅客靠这招一张省下不少。整套走完，暑期最后一波红利就吃到了，省下的钱够多加一晚好酒店。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"DeepSeek Harness开源：模型从对话跃迁到系统","hook":"DeepSeek不只是发模型了，它发了个能管智能体的系统。","why":"首款Agent产品Harness开源是国产AI从「模型」到「系统」的标志性一步，45小时10万星有话题性。来源双源（北京商报+CSDN），避开此前峰谷计价角度。","heat":"高","tags":["强时效","国产","智能体"],"facts":["8月16日前后，DeepSeek首款Agent产品DeepSeek Harness（dsh）开源，采用「一切皆插件」架构：模型、工具、技能、会话、沙箱、循环、UI全部插件化，可自由替换（北京商报2026-08-16 / CSDN极客日报2026-08-16）","DeepSeek Harness开源45小时GitHub星标达10.5万、Fork超1万；同日DeepSeek-V4-Pro正式版上线（CSDN极客日报2026-08-16）","DeepSeek预告自8月17日起执行峰谷计价，高峰时段输出价涨约1倍；Harness被视为对冲涨价带来用户流失的产物（北京商报2026-08-16）","「小冰之父」李笛解读：过去人和AI是线性对话，Agent时代要自主拆解任务、调用工具、自我修正，Harness是「从对话到系统」的跃迁，类似Claude Code需要数十万行Harness才能端到端发挥（北京商报2026-08-16）","待核实：Harness具体支持的工具生态与本地部署门槛，以DeepSeek官方文档为准"],"scripts":[{"angle":"功能详解","text":"DeepSeek这次开源的Harness，不是又一个模型，是一套管智能体的系统。核心架构叫「一切皆插件」：模型、工具、技能、会话、沙箱、循环、UI全部做成插件，能自由替换。意思是你不再被锁死在某个模型或某个运行环境里，想换模型换模型，想接新工具接新工具。它开源45小时GitHub就冲到10.5万星、Fork超1万，热度说明开发者认这个方向。同日DeepSeek-V4-Pro正式版也上线了。对普通用户的意义是，以后用DeepSeek不只是在对话框里问答，而是能跑一套可编排、可复用的智能体工作流，把重复活交给它自己跑。"},{"angle":"说人话版","text":"用大白话讲Harness是什么。以前你用AI是聊天：你问一句它答一句，问完结束。现在AI要能干活的，叫智能体，得自己拆任务、调工具、改错误。但光模型聪明不够，还得有个「运行环境」管着它怎么干活，这层就是Harness。DeepSeek这次把这套环境开源了，而且做成乐高式插件，模型、工具、界面都能换。小冰之父李笛打了个比方：Claude Code模型再强，也得靠数十万行Harness才能端到端发挥作用，DeepSeek这步是「从对话到系统」的跃迁。翻译成人话：模型是发动机，Harness是整车和方向盘，光有发动机跑不起来。"},{"angle":"趋势判断","text":"从DeepSeek Harness能看出一个行业转向：竞争焦点从「谁模型强」变成「谁能把模型跑成可靠系统」。三点判断。第一，开源Harness是要建生态，开发者基于它做插件、做工作流，黏性比单纯调API强得多，45小时10万星就是信号。第二，它和峰谷计价同一天发布不是巧合，系统层能锁住高频用户，抵消涨价带来的流失。第三，模型公司的护城河正在从参数规模移到运行环境与工具链，谁先把Harness做成熟，谁就掌握了Agent时代的入口。对个人来说，早学一套Harness的编排思路，比追单个模型更保值，因为模型会换，方法不会过期。"}]},{"id":"ai2","title":"智谱GLM-5.3：不换基座，纯后训练把编程能力拉高50%","hook":"同一副骨架，只靠后天训练，编程就强了一半。","why":"后训练Scaling路线的标志性一役，有具体基准和「发现2400个漏洞」的硬料，比泛泛谈开源更有信息密度。来源双源，避开与历史后训练选题撞标题。","heat":"中高","tags":["国产","技术","方法论"],"facts":["8月16日凌晨，智谱Z.ai发布GLM-5.3，沿用743B MoE基座，仅靠深度后训练，未换基座即在Terminal-Bench 3.0拿下开源模型最高分，编程智能体评测较5.2提升50%（CSDN极客日报2026-08-16）","GLM-5.3在CyberGym网络安全基准超越Claude Mythos 5，已在实际项目中发现超2400个漏洞；智谱承诺两周内开放权重（CSDN极客日报2026-08-16）","北京商报同日报道：8月第二周国产大模型密集变阵，DeepSeek涨价、阿里开源、智谱「不换药」靠后训练撬杠杆，路线从「谁更便宜」转向「谁更不可替代」（北京商报2026-08-16）","待核实：GLM-5.3具体基准分数与开放权重时间表，以智谱官方发布为准"],"scripts":[{"angle":"说人话版","text":"大白话讲智谱GLM-5.3这次更新。它没换底层模型，还是原来那个743B的MoE骨架，只在后面加了一轮深度训练，编程能力就比上一代强了50%。这就像同一个学生，不换脑子，换了一套更狠的训练方法，考试成绩直接上去。硬指标上，它在Terminal-Bench 3.0拿了开源模型最高分，在网络安全基准CyberGym超过了Claude Mythos 5，还在真实项目里找出2400多个漏洞。智谱承诺两周内开放权重。对普通人意味着，你用的国产编程助手会突然更会写代码、更会找bug，而且不用换产品，升级是无感的。"},{"angle":"数据向","text":"把GLM-5.3的数字摆出来。基座还是743B MoE，没换。纯靠后训练，编程智能体评测较5.2提升50%，在Terminal-Bench 3.0拿到开源模型最高分。网络安全这边，CyberGym基准超过Claude Mythos 5，实际项目已发现超2400个漏洞。两周内开放权重。同周国产大模型集体变阵：DeepSeek涨价、阿里开源、智谱走后训练杠杆。一句话，国产模型的竞争已经从「谁更便宜」转到「谁更不可替代」，后训练是把现有骨架榨出性能的最快路径，成本低、见效快，是小公司弯道超车的现实打法。"},{"angle":"方法论","text":"智谱这仗给普通人的启发是：进步不一定靠堆资源，靠方法也能撬动。GLM-5.3沿用旧基座、只做深度后训练，编程就强了50%，说明后训练Scaling是被严重低估的杠杆。映射到做事上：你手里的工具、你已有的能力，往往没被充分「训练」过。换工具是下策，把现有工具用出花是上策。对做内容的也一样，同一个选题换种讲法、换个人设，完播率可能差一倍。别总觉得差的是装备，先问自己有没有把现有装备练到极致。后训练思维，比追新模型更值得长期投入，因为它不依赖外部供给。把同样的逻辑用在自己的业务上，先练内功比换装备更稳。"}]},{"id":"ai3","title":"Google Gemini月活破10亿：AI竞争从智能转向分发生态","hook":"模型再强，没人用也白搭，谷歌先把10亿人圈进来了。","why":"用Gemini破10亿月活这个标志性数据，讲AI竞争维度转移，立人设且有破圈潜力。来源含Ars Technica与发布追踪，交叉印证。","heat":"中高","tags":["趋势","海外","泛人群"],"facts":["Ars Technica报道：Google Gemini App月活跃用户已突破10亿，成为谷歌史上用户增速最快的产品之一（Ars Technica，AI Pulse 2026-08-13）","Google于8月14日发布Gemini 3.7 Flash，称其为「迄今最聪明的编码与智能体工作马模型」，延续Flash快速迭代节奏（Google / originbrief weekly 2026-08-14）","模型迭代近周更节奏：Meta Muse Glimmer（8-10）、DeepSeek V4-Pro（8-13）、Grok 4.6（8-12）、Qwen3.8-27B（8-14）同期密集发布（aireleasetracker 2026-08）","待核实：Gemini 10亿月活口径含哪些产品形态，以Google官方披露为准"],"scripts":[{"angle":"趋势判断","text":"Gemini月活破10亿，说明AI竞争换维度了。以前比的是谁模型聪明、谁跑分高，现在谷歌用10亿月活证明，分发和生态才是更大的护城河。Gemini App嵌在搜索、安卓、Workspace里，用户不用专门下载就能天天用，这是国产模型短期追不上的渠道优势。同一周，Gemini 3.7 Flash发布，主打编码和智能体，迭代已经快到周更。判断很清楚：模型能力的差距在快速抹平，真正的分水岭变成谁先把AI塞进用户的日常动线。对做产品的人，与其卷参数，不如卷触达，触达权比单点性能更值钱，这点值得反复强调。"},{"angle":"反常识开场","text":"模型越来越强，但赢家可能不是模型最强的那家。Gemini月活破10亿就是证据。很多人以为AI战争是军备竞赛，比谁参数大、谁跑分高，现实是谷歌把Gemini塞进搜索、安卓、邮箱，用户根本不用主动选择就天天在用。模型能力差距在被快速抹平，周更节奏下没有谁能长期领先半代。真正稀缺的是触达——把AI变成用户默认动作的能力。所以别再只盯着排行榜，谁能占据日常入口，谁才笑到最后。这对小团队也是提醒：别硬刚大模型，去做别人不愿碰的落地场景，反而有机会。大厂卷模型，小团队卷场景，错位竞争才有活路。"},{"angle":"数据向","text":"几个数字看Gemini的体量。Ars Technica说Gemini App月活突破10亿，是谷歌史上增速最快的产品之一。8月14日Google又发了Gemini 3.7 Flash，定位「最聪明的编码与智能体工作马」，迭代已经接近周更。看同期发布节奏：Meta Muse Glimmer 8-10、DeepSeek V4-Pro 8-13、Grok 4.6 8-12、Qwen3.8-27B 8-14，几乎每天一个大模型。结论：模型侧军备竞赛白热化，但谷歌用10亿用户告诉行业，分发权比单点性能更值钱。对使用者，意味着好模型到处都是，选顺手的就行，不用追每一个新发布，追也追不过来。"}]},{"id":"ai4","title":"AI评测可信度危机：同一模型，评测分数能差20%","hook":"排行榜第一的模型，换个评测可能掉到中游。","why":"评测可信度是少有人讲、但对选型决策极关键的盲区，立人设且长效。来源IBM Research官方项目，权威。","heat":"中","tags":["方法论","避坑","技术"],"facts":["IBM Research于8月12日发布EveryEvalEver社区项目，汇总2200个基准、超2.2万个模型结果，揭示同一模型在名义相同评测中分数方差可达20个百分点（IBM Research / originbrief weekly 2026-08-17）","Hugging Face同期发布ICML复现研究，社区「开放模型现状」观察也指向评测体系可信度问题，引发采购与政策决策依据之争（originbrief weekly 2026-08-17）","背景：2026年7月AI模型聚合平台OpenRouter调用量前五被中国模型包揽，但榜单口径与基准口径常不一致（OpenRouter / 多家媒体2026-08）","待核实：20%方差的具体基准分布与行业应对方案，以IBM及后续研究为准"],"scripts":[{"angle":"反常识开场","text":"你信的AI排行榜，可能含水量不低。IBM Research刚发布的EveryEvalEver项目，汇总了2200个基准、超2.2万个模型结果，发现同一个模型在名义相同的评测里，分数能差出20个百分点。也就是说，排行榜第一的模型换个评测可能掉到中游。问题出在评测本身：题目、采样、打分标准稍有不同，结果就漂。Hugging Face的ICML复现研究也指向同一结论。所以别拿单一榜单当选型依据，尤其是企业采购和自媒体「某模型世界第一」的标题，水分比你想的大，看多了容易误判，多跑真实任务再下结论。"},{"angle":"说人话版","text":"说人话解释为什么AI评测不靠谱。你考语文，换套卷子分数就变，AI评测也一样。IBM这个项目把2200个基准、2.2万个结果拉到一起，发现同一个模型分数能浮动20个百分点，相当于百分制里差20分，足够从第一掉到中游。原因很简单：评测题是谁出的、怎么抽样的、按什么标准打分，这些细节一变，结果就漂。Hugging Face也做了复现研究，结论一致。对普通人，别被「某项第一」带节奏；对企业，采购前多跑几个自己的真实任务让模型试，比看厂商宣传的SOTA靠谱得多，真实产出不会骗人，选型别偷懒，省下的试错成本很可观。"},{"angle":"方法论","text":"面对评测可信度危机，选型该换套方法。第一，别信单一榜单，至少交叉看三个以上基准，且看是否和你真实场景相关。第二，OpenRouter这类调用量榜单看的是真实使用，比跑分更接近「好不好用」，但口径也常不一致，只能参考。第三，企业采购最稳的办法是自己出几道业务题让模型跑，看实际产出，而不是看厂商宣传的SOTA分数。第四，做内容的人讲模型，少喊「世界第一」，多讲「我拿它干了什么、效果如何」，可信度高一截。记住：评测会漂，真实任务不会骗人，拿任务说话最稳。把榜单当参考而不是标准，你的真实业务题才是最终考官，这能省下大量试错成本。"}]},{"id":"ai5","title":"开源不等于免费：国产大模型开源潮，改的是价格锚不是成本结构","hook":"权重免费，但跑起来要花的钱一分不少。","why":"破除「开源=不要钱」的普遍误解，讲清价格锚逻辑，立人设且长效。来源央广网专家解读，权威。","heat":"中高","tags":["方法论","成本","立人设"],"facts":["央广网8月15日报道：国产大模型掀起开源潮，阿里Qwen3.8-27B（270亿参数，手机与消费级显卡可跑）、DeepSeek V4 Pro、Kimi、智谱轮番开源（央广网2026-08-15）","上海交大田丰解读：大模型「开源」指开放权重（公开训练完成的参数文件），与传统「公开源代码可复现构建」只有部分重叠（央广网2026-08-15）","田丰观点：开源真正改变的是价格锚，不是成本结构——开源是权重免费，但算力、部署工程、持续迭代与合规责任全部不免费，加速的是固定能力成本曲线下滑，不是前沿价格下滑（央广网2026-08-15）","全球最大AI开源社区数据：中国开源模型累计下载量居全球首位；多模型聚合平台7月调用量前五中国包揽（央广网引述2026-08-15 / OpenRouter 2026-08）","待核实：「中国开源下载全球第一」「调用量前五全中国」等口径，以各平台官方月度报告为准"],"scripts":[{"angle":"说人话版","text":"说人话拆穿「开源等于免费」。大模型开源，公开的是权重，也就是训练好的参数文件，不是源代码那种能自己从头复现的东西，这点和传统开源只有部分重叠。更关键的是，权重免费不代表你用起来免费。算力要钱，部署工程要人，持续迭代要维护，合规责任甩不掉。所以开源降本的是「固定能力的获取成本」，不是你跑模型的实际花费。对企业，开源让你少交一笔授权费，但服务器和工程师的开销一点没少。别听「免费大模型」就冲，算总账才知道贵不贵，很多隐性成本在后面才冒出来。所以评估一个开源模型，要看总拥有成本，而不是只看下载要不要钱。"},{"angle":"成本账","text":"开源大模型这笔账得拆开算。权重本身免费，这是真金白银的节省，尤其对比闭源按调用量收费。但后面三笔钱省不掉：算力，你自己的显卡或云服务器跑模型要持续付费；部署，把模型接进业务、做工程化要人和时间；合规，数据出境、内容审核的责任还在你身上。田丰的观点很准：开源改的是价格锚，不是成本结构。它把「买断能力」的门槛打下来，但「使用能力」的成本曲线没动。所以小团队用开源最划算的是低频、轻量场景，高频重负载还是得算总拥有成本，别被免费二字晃了眼。先算清楚自己的调用量和部署方式，再决定用开源还是闭源，别盲目跟风。"},{"angle":"趋势判断","text":"国产开源潮背后的信号，不是便宜那么简单。阿里、DeepSeek、Kimi、智谱轮番开源，中国开源模型下载量已经全球第一，调用量前五也被国产包揽。但真正的变化在价格锚：当头部模型纷纷开放权重，闭源厂商的定价就被钉住了，不敢随便涨。田丰说开源加速的是固定能力成本曲线下滑，不是前沿价格下滑，这句话值得品。对行业，开源是分发手段，谁先开源谁先占生态；对用户，好模型越来越易得，竞争红利最终落到使用侧。长期看，模型会像水电一样按量计费，贵的是上层应用不是底座，早想清这层的人少走弯路，这层认知很关键。"}]}]}]},"2026-08-13":{"date":"2026-08-13","updatedAt":"2026-08-13 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"文旅部8·5出手：暑期旅游四类乱象全国严查","hook":"景区强卖观光车、导游半路塞购物店，这次有明文整治了。","why":"8月5号文旅部联合网信办动手，政策一手、强时效、人人相关，适合做成「出门前必看」收藏款。","heat":"高","tags":["强时效","避坑","政策"],"facts":["8月5日，文化和旅游部部署开展全国暑期旅游市场专项整治，聚焦四类问题：隐形消费与捆绑消费、景区及周边物价不规范、导游及旅行社诱导消费强制购物私自加价、虚假宣传（含网红打卡点不实营销）（文化和旅游部，2026-08-05；今日头条综合，2026-08-05）","同日文旅部联合中央网信办开展非法网络招徕专项整治，全面清理短视频、社交、自媒体平台上的违法违规招徕产品，并公布2026年第五批13起强制消费典型案例（文旅部官网，2026-08-05；法治日报，2026-08-07）","13起典型案例集中在平台招徕：虚构纯玩团诱导消费、无证提供导游服务、低价揽客收购物回扣、违规组织出境游等，多家旅行社被没收违法所得并罚款（文旅部官网典型案例，2026-08-05；澎湃新闻，2026-08-05）","整治明确：严禁景区强制售卖观光车及接驳车票、严禁捆绑销售套餐、入园后变相二次收费项目须由游客自愿选择，所有增值项目不得强制（文旅部部署口径，2026-08-05）","背景数据：上半年全国文旅市场立案数同比增49.3%，其中强迫购物案件同比增86.9%；同期旅游投诉接收量同比降24.2%（文旅部二季度发布会及北京执法通报，2026-07-10、2026-08）"],"scripts":[{"angle":"干货直给","text":"8月5号，文旅部部署了一次全国暑期旅游市场专项整治，盯准四类坑：景区隐形消费和捆绑销售、物价不规范、导游诱导强制购物私自加价、还有虚假宣传包括网红打卡点的不实营销。同一天还联合网信办清理短视频和社交平台上的非法招徕，公布了13起强制消费典型案例，全是靠平台虚构纯玩团、无证导游、低价揽客收回扣这类套路。规则写得很死：观光车接驳车不能强卖，套餐不能捆绑，二次收费必须你自愿。背景是上半年强迫购物案件同比涨了86.9%，坑不但没少反而更隐蔽。出游前把这个记心里，被强制消费当场就有底气拒，留好录音票据，回头打12315或12345。"},{"angle":"避坑清单","text":"暑假出门，先记四条红线。第一，看到景区里强制卖观光车票、接驳车票的，可以直接拒，整治明确这类捆绑销售违规。第二，入园后任何二次收费项目都该是你自愿选，不买不让玩就是违规。第三，导游中途把你拉去购物店、或者私自加价，属于这次重点整治的诱导消费，留好录音和票据。第四，刷短视频看到「纯玩零购」却要你现场签付费合同的，基本是套路，重庆有家旅行社就因这被罚。还有个细节：很多平台招徕看准你贪便宜，749元四天三晚重庆游看着香，落地就让你补景区交通费。真被坑了别忍，12315和12345都能投诉，投诉量在降说明较真有用。"},{"angle":"说人话版","text":"说白了，文旅部这次专项整治就是替游客撑腰。过去景区最爱玩两招：一个是进门便宜、园里处处要另交钱，观光车、接驳车、套票绑着你买；另一个是导游把你当提款机，半路塞进购物店。这次把这几类全列进整治清单，而且连短视频平台上那种「749元重庆四天三晚纯玩」的虚假招徕一起清理，13起典型案例已经挂出来示众。对普通人最实用的信号是：强制消费不再是「投诉了也不一定有用」，现在有明确处罚在先，你被坑当场就能拿出规则怼回去。上半年强迫购物案件同比涨86.9%，正好说明为什么这时候要出手。记住，自愿消费可以，强制消费违法。"}]},{"id":"tv2","title":"暑期研学避坑：先查这两证，四类团直接绕开","hook":"孩子研学机构说有资质，你可能只看了一证。","why":"8月5号成都公布65处禁入耍水地清单+资质核验规则，正值暑期研学高峰，家长刚需、收藏率高。","heat":"中高","tags":["亲子","避坑","强时效"],"facts":["8月5日，成都文旅发布暑期研学温馨提示，并公布全市65处禁入耍水地清单，严禁组织学生到未开发开放区域戏水（四川观察，2026-08-05）","承办研学须同时持「营业执照」与「旅行社业务经营许可证」；仅登记教育咨询、文化传播、户外拓展经营范围的机构无组团资质，不得承接收费研学（成都文旅提示，2026-08-05）","四类违规研学须规避：暗藏强制消费的购物伪研学、收费高无系统课程的观光打卡团、组织进入未开发山野峡谷涉水的高危探险团、以研学为名的有偿校外培训变相收费团（同上）","务必签书面合同，剔除「最终解释权归机构」等不合理格式条款；通过12315、12345热线维权（同上）","文旅部暑期专项整治亦将研学列为重点：严查无资质主体招揽、挂靠转包、虚假宣传、随意变更行程、带队人员无资质等六类问题（北京暑期旅游专项整治，2026-08）"],"scripts":[{"angle":"干货直给","text":"成都8月5号发了暑期研学温馨提示，还公布了全市65处禁入耍水地清单。核心就一句：带孩子研学，先查承办机构有没有两证——营业执照加旅行社业务经营许可证。只挂着教育咨询、文化传播、户外拓展的，没有组团资质，不能收钱办收费研学。四类团直接绕开：暗藏强制购物的伪研学、收费高没课程的打卡团、带进未开发山野涉水的高危团、借研学名义搞有偿培训的。一定签书面合同，把「最终解释权归机构」这种条款划掉。北京同期也在严查研学六类问题，无资质招揽、挂靠转包、虚假宣传、变更行程、带队无资质都在列。家长下单前把这两条对照一遍，机构哪条对不上就直接换一家，别拿孩子的安全赌机构的良心。"},{"angle":"避坑清单","text":"给孩子报研学，照这五条核。第一，查两证，营业执照和旅行社业务经营许可证缺一不可，国家企业信用信息公示系统能验。第二，别信「官方指定」「升学加分」「名校独家」这类话术，市场化研学不跟升学挂钩。第三，避开四种坑团：购物伪研学、无课程打卡团、高危探险团、变相培训团。第四，必须签书面合同，删掉「最终解释权归机构」之类格式条款，留好票据。第五，汛期严禁去未开发区域戏水，成都列了65处禁入点，出发前对照一下。真遇无证经营或虚假宣传，打12315或12345，别因为「钱不多」就忍了，忍一次坑就多一单。"},{"angle":"实操流程","text":"真要给孩子报个靠谱研学，按这个走。第一步，让机构出示营业执照和旅行社业务经营许可证，两证截图存好。第二步，看课程，有没有系统内容和师资安排，纯打卡拍照的别报。第三步，签正式合同，逐条核对行程、食宿、退费、安全保障，所有「最终解释权」条款划掉。第四步，确认机构给师生买了旅行社责任险和意外险，问清应急联系方式。第五步，记住维权通道，遇无证经营、虚假宣传打12315或12345。整个过程留痕，比事后吵架有用。成都还专门公布了65处禁入耍水地，凡是清单里的野塘水库，一律不组织学生去，家长也可以拿这份清单反向核验机构靠不靠谱。"}]},{"id":"tv3","title":"网红打卡点翻车：你刷到的大片可能根本不存在","hook":"精修图里的草原花海，到了发现是几盆盆栽加滤镜。","why":"暑期投诉数据+具体案例（天空之镜），有数据有剧情，泛人群共鸣强，区别于纯低价游选题。","heat":"中高","tags":["反直觉","避坑","泛人群"],"facts":["2026年暑期四川文旅接待游客同比涨32.6%，但旅游投诉量同比涨35.2%，其中家庭出游投诉占比超72%；低价引流占投诉43.2%、虚假宣传占28.7%、资质造假16.5%（四川文旅厅联合OTA暑期旅游白皮书，2026-07/08）","佛山消委会调查：29.8%的游客遇到过「景点虚假宣传与实际不符」（佛山消委会文旅消费调查报告，2026）","典型案例：湖南临武滴水源景区「天空之镜」宣传称斥巨资打造，实际镜面约8平方米、建设费1.5万元、盗用网图，开放4天营收40万元，最终罚款12万元（多家媒体，2026暑期）","正面标杆：张家界暑期对核心景区严格分时段限流、控制在承载上限以下；贵州溯溪等靠真诚提质赢得口碑（新浪旅游，2026-08）","待核实：「近3成游客遭遇虚假宣传」为媒体综合表述，各源口径略有差异，未写入口播稿正文。"],"scripts":[{"angle":"数据向","text":"给几个数字，你就知道景区「照骗」多普遍。四川文旅白皮书：今年暑期四川接待游客同比涨32.6%，但投诉量同比涨35.2%，家庭出游投诉占72%以上。佛山消委会调查更直白，29.8%的游客遇到过景点宣传和实际不符。坑点分布：低价引流占43.2%、虚假宣传28.7%、资质造假16.5%。最典型的湖南临武「天空之镜」，宣传斥巨资打造，实际镜面8平方米、造价1.5万、盗网图，4天营收40万只罚12万。所以刷到绝美大片，先打个问号。下次定行程，别只看商家精修图，去搜真实游客的吐槽帖，差评比广告诚实得多，花十分钟能省一趟白跑。"},{"angle":"反常识开场","text":"你刷到的网红打卡点，可能根本不存在。湖南临武滴水源景区宣传「天空之镜」斥巨资打造，实际镜面只有8平方米、建设费1.5万元、图全是网上盗的，开放4天营收40万，最后罚款12万。这不是孤例。今年暑期四川游客量涨32.6%，投诉量却涨了35.2%，家庭出游投诉占七成多，低价引流和虚假宣传是头号坑。平台滤镜把几盆盆栽拍成草原花海，把小水坑拍成镜面湖，你人到了才发现货不对板。所以定行程前，别只看商家精修图，去搜搜真实游客的吐槽帖。记住一条笨办法：凡是宣传图比实景「高级」太多的，大概率是滤镜，实地照片才是真相。"},{"angle":"横向对比","text":"同样暑期景区，口碑两极分化。一边是「一锤子买卖」：低价引流占投诉43.2%，虚假宣传28.7%，资质造假16.5%，把游客当一次性流量，宰完就走。另一边主动做减法：张家界核心景区严格分时段限流，把日接待量压在承载上限以下；贵州溯溪靠真诚提质赢口碑。差别在哪？前者赌你只来一次，后者想让你再来。对游客来说，选景区有个笨办法：先看它有没有限流、免票、沉浸式互动这些「做减法」的动作，有的一般不会太坑。下单前多翻几页真实评价，别被首页精修图带节奏，差评区才是避坑指南。花十分钟翻评价，比到现场再后悔划算得多，这十分钟能帮你过滤掉八成照骗景区。"}]},{"id":"tv4","title":"机票「先占座再等降」：24小时免费退让临期捡漏成立","hook":"今年敢先买贵票，因为起飞前24小时还能免费退了重买。","why":"把「临期降价」和「24小时免费退」组合成一个新策略，区别于此前所有「等8月下旬跳水」选题，实操性强。","heat":"中","tags":["省钱","机票","可复用"],"facts":["2026暑运票价呈「前高后低」：8月1日至20日为全年客流最集中阶段，8月20日后学生返校、需求回落，票价较8月中旬降20%至30%，8月25日前后为全月最低点（新浪旅游，2026-08-02/05；多家平台订票指南综合）","周度规律：周二、周三票价通常最低，较周五、周日便宜15%至30%；日内13至15点为退票回流高峰、凌晨系统清理超时未支付订单也易放出低价余票（今日头条、新浪，2026-08）","多家航司推出「24小时内免费退改」新规，配合临期降价，已购票若起飞前24小时内降价可免费退了重买（中国航空新闻网等，2026暑运；新浪旅游，2026-08-05）","长线避暑航线建议提前30至45天、中短途提前15至25天；8月下旬裸票低于300元的航线增多（新浪、今日头条，2026-08）","待核实：具体航线「长沙飞海口8月下旬降至500元、飞丽江500、飞乌鲁木齐1300」等为媒体样本数据，实际随供需浮动，未写入口播稿正文。"],"scripts":[{"angle":"方法论","text":"买机票有个反直觉的窍门：今年敢「先占座、再等降」。暑运票价是前高后低，8月1到20号全年最贵，20号之后学生返校、需求掉下来，票价比中旬低20%到30%，25号前后是全月最低。多家航司还推了「24小时内免费退改」，意思是你提前买贵了，起飞前24小时内若降价，可以免费退了重买，不亏。所以别死等8月下旬再出手，刚需的先锁座，盯着临期降价捡漏，两头都不误。这条特别适合开学前必须带孩子走的家长，先占座保底，等临期降价再薅一波，操作得当能省出两晚酒店钱。这个规则航司本来就是让利给灵活出行的人，不用白不用，锁座不亏、降价回血，两头都占。"},{"angle":"实操流程","text":"暑假买机票，按这个节奏走。第一步，刚需出行现在就锁票，别赌临期一定降，热门航线晚了只剩全价。第二步，出发前盯紧航司App，很多推了「24小时内免费退改」，发现降价就退了重买。第三步，选周二周三出发，比周五周日便宜15%到30%；日内13到15点是退票回流高峰、凌晨清超时订单，这两个时段容易刷到低价余票。第四步，长线提前30到45天、中短途15到25天。第五步，8月下旬裸票低于300的航线会多起来，时间自由的闭眼捡。记住核心逻辑：刚需先占座、临期再捡漏，两个动作不冲突，别二选一把自己逼到全价。"},{"angle":"数据向","text":"把暑运票价规律摆清楚。整体是前高后低：8月1到20号全年客流最集中，票价高位；20号后学生返校，需求回落，较中旬降20%到30%；25号前后是全月最低点。周度上，周二周三最便宜，比周五周日低15%到30%。日内也有规律，13到15点退票回流、凌晨清超时订单，常放出低价余票。重点是各家「24小时免费退改」新规，让你提前买贵了也能在起飞前24小时内免费退重买。所以策略很简单：刚需先占座，临期再捡漏，不用二选一。举例，一条热门航线你月中买贵了三百，起飞前发现降到原价，退了重买直接回血，规则就是给你用的。"}]},{"id":"tv5","title":"真被坑了别只会骂：旅游维权正确姿势","hook":"留好票据打12345，比发朋友圈泄愤有用，也更安全。","why":"从「怎么避坑」转向「坑了之后怎么办」，互补不撞车，且提醒网上编假信息担刑责，有社会价值。","heat":"中","tags":["维权","避坑","收藏向"],"facts":["2026上半年全国文旅市场立案数同比增49.3%，强迫购物案件同比增86.9%；同期旅游投诉接收量同比降24.2%（文旅部二季度发布会及北京执法通报，2026-07-10、2026-08）","维权渠道：保留合同、缴费票据、宣传资料，拨打12315或12345政务服务热线投诉；文旅部常态化曝光涉旅违法典型案例（北京专项整治，2026-08；成都研学提示）","官方提示法律红线：网上编造、故意传播「踩踏死人」等虚假信息，涉嫌编造故意传播虚假信息罪（检察、文旅提示，2026-08）","短途游途中守住涉水安全：看到野塘、水库、未开发河道水再清也别下；正规泳池、海滨浴场须有救生员（文旅、检察提示，2026-08）","待核实：民宿投诉同比涨127%、细分占比（虚假宣传42%等）为单一媒体口径的市场监管统计转述，未写入口播稿正文。"],"scripts":[{"angle":"说人话版","text":"真被旅游坑了，别只会发朋友圈骂。正确姿势就三步。第一，留证据，合同、缴费票据、机构当初的宣传资料全存好，照片视频也留着，比当场吵架有用。第二，走官方通道，12315和12345政务服务热线都能投诉，文旅部现在常态化曝光违法典型案例，投诉有地方接。第三，守住法律红线，网上编「踩踏死人」这种假消息泄愤，涉嫌编造传播虚假信息罪，真把自己搭进去。另外途中安全：野塘水库未开发河道水再清也别下，正规泳池海滨才有人盯场。上半年强迫购物案件同比涨86.9%，说明坑还在，但投诉接收量在降，该较真就较真，别因为怕麻烦忍了。"},{"angle":"避坑清单","text":"出游维权五条记牢。第一，合同书面签，口头约定无效，缴费票据和宣传资料都留底。第二，遇强制消费、虚假宣传，打12315或12345，别忍。第三，别在网上涨编造虚假信息，官方明确这是法律红线，会担刑责。第四，涉水安全，野塘水库未开发河道禁止下水，正规泳池海滨浴场须有救生员。第五，看天气和地质灾害预警再出发，避开暴雨台风区。上半年强迫购物案件同比涨86.9%，说明坑还在，但投诉接收量在降，该维权就维权。还有个常被忽略的：行程中拍下强制收费公示牌和导游话术，回来投诉时比嘴说有分量得多，截图录音都是证据。"},{"angle":"实操流程","text":"万一踩坑，按这个流程走最稳。第一步，现场就收集证据：拍下强制收费公示、录音导游话术、保存合同和付款记录。第二步，先和商家交涉，亮出文旅部专项整治的红线条款，很多当场就怂。第三步，谈不拢立刻打12315或12345，把证据一并提交。第四步，涉及无证经营、虚假宣传的，可向文旅部门举报，典型案例会被公开曝光。第五步，途中涉水安全别大意，未开发水域禁止戏水，正规场所确认有救生员再下水。全程留痕，比事后扯皮管用。记住，投诉不是找麻烦，是让劣质商家付出成本，你较真一次，后来人就少踩一次坑。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"今天阿里开源Qwen3.8 Max权重，千问首次放开旗舰","hook":"8月13号，千问把最顶级模型的权重直接开放下载了。","why":"今日（08-13）一手新闻，36氪/智东西报道，阿里首次开放Max级权重，强时效、情绪价值足。","heat":"高","tags":["强时效","国产","开源"],"facts":["8月13日，阿里千问团队开放 Qwen3.8-2.4T-A95B 模型权重，这是千问第一次将 Max 级别旗舰模型对外开放权重，魔搭社区与 Hugging Face 均可下载（36氪、智东西，2026-08-13）","该模型总参数2.4万亿，每Token激活950亿，原生支持262144 Token上下文、可扩展至101万Token，具备视觉输入能力，默认思考模式运行、不支持关闭思考（36氪，2026-08-13；阿里官方）","更小杯 Qwen3.8-27B 已在路上（魔搭社区预告）（同上）","央视等媒体报道，中国科技企业新模型密集涌现，阿里、DeepSeek、字节近期接连发布，形成「中国模型集体出击」态势（央视新闻，2026-08-05）","待核实：Qwen3.8-Max「可能是除Fable 5外最强大的模型」为千问预告口径，第三方独立评测尚待验证，未写入口播稿正文。"],"scripts":[{"angle":"干货直给","text":"今天，8月13号，阿里千问把 Qwen3.8-2.4T-A95B 的模型权重开放下载了，在魔搭社区和Hugging Face都能拿。这是千问第一次把 Max 级别的旗舰模型对外开放权重。参数很夸张：总参2.4万亿，每个Token激活950亿，原生支持26万Token上下文、能扩到101万，还带视觉输入。代价是默认思考模式、关不掉。小杯Qwen3.8-27B也快来了。对开发者来说，一个顶级国产模型现在能自己部署、自己微调，不用再看云厂商脸色。央视之前就点过，中国模型正集体出击，阿里、DeepSeek、字节接连发布，今天这步是把最顶尖的能力也交到开发者手里。"},{"angle":"说人话版","text":"用大白话讲今天这件大事。阿里千问之前发布的Qwen3.8-Max，今天把完整权重放出来了，任何人能免费下载自己部署。这模型有多大？总参2.4万亿，但每次只用其中950亿干活，所以又大又省。上下文能吞26万Token，扩展后上百万，一本厚书一次读完。它还认图，能看能理解。唯一别扭的是它默认开启思考模式且关不掉。更小巧的27B版本也在路上。意义很直白：以前顶级模型攥在厂商手里按调用收费，现在权重开放，等于把引擎图纸公开，谁都能自己攒一辆跑。对小公司，这意味着不用被云厂商绑死，私有部署数据更稳。"},{"angle":"趋势判断","text":"从阿里今天开源Qwen3.8 Max权重，能看出开源大模型的三条走向。第一，国产旗舰不再捂着，千问首次开放Max级权重，意味着最顶尖的能力也开始走开放路线。第二，竞争从「谁参数大」转向「谁让你用得起、改得动」，2.4万亿配950亿激活，性能和成本一起算账。第三，开放权重的生态价值超过单次调用费，企业能私有部署、反复微调，数据安全也更好。对普通人来说，好模型会越来越便宜、越来越可定制，闭源壁垒在一点点塌。接下来值得盯的是：27B小杯出来后，消费级显卡能不能也跑起来，那才是真普及。"}]},{"id":"ai2","title":"Sand.ai开源千亿视频模型，10秒高清只花5毛","hook":"全球第一个千亿级开源视频模型，10秒1080P成本5毛钱。","why":"8月5号清华系Sand.ai开源MAGI-2，多源验证，把视频生成成本打到主流十分之一，创作者直接受益。","heat":"高","tags":["开源","视频生成","成本"],"facts":["8月5日，清华系Sand.ai发布并开源 MAGI-2 Preview，全球首个千亿级开源MoE视频生成模型，总参数约114B、单次前向仅激活约6B（DeepTech深科技，2026-08-06；新浪财经、光明网，2026-08-05/07）","统一音视频架构：文本、视频、音频进同一Transformer，画面与声音由同一主干生成，人物口型、动作与环境声同步（同上）","成本：按8卡H100月租折算，蒸馏后模型生成10秒1080P视频推理成本约0.5元，每秒约0.05元，约为行业主流模型的十分之一；Artificial Analysis图生视频榜排名第六（光明网，2026-08-07；腾讯新闻，2026-08-05）","开源地址 github.com/SandAI-org/MAGI-2-preview、huggingface.co/sand-ai/MAGI-2-preview（官方）","待核实：MAGI-2自称「全球首个千亿级开源MoE视频模型」，该表述以Sand.ai官方口径为准，未写入口播稿正文。"],"scripts":[{"angle":"干货直给","text":"8月5号，清华系Sand.ai开源了 MAGI-2 Preview，全球第一个千亿级的开源MoE视频模型。总参1140亿，但每次生成只激活60亿，靠MoE把成本和容量解开。最狠的是价格：10秒1080P视频推理成本约0.5元，每秒5分钱，是主流模型的十分之一。它还是音画统一架构，画面和声音同一个模型一起生成，口型动作跟环境声自动同步。代码权重全开放，企业和个人免费拿去用、去改。Artificial Analysis图生视频榜它排第六，说明开源模型第一次在千亿规模上能和闭源正面对打，而且价格直接打穿地板。"},{"angle":"反常识开场","text":"视频模型一直有个死结：模型越大画质越好，但算力和通信成本爆炸，稠密模型根本没法商用。Sand.ai这次把这事破了。8月5号开源的MAGI-2，总参1140亿听着吓人，可单次只激活60亿，等于养了个超大专家库，每次只叫醒相关的几个。结果10秒1080P视频成本压到0.5元，是主流十分之一。它还把画面和声音塞进同一个模型生成，口型动作自动对齐。开源视频生成，第一次摸到千亿门槛。以前大家觉得视频模型卡在几十亿参数就上不去了，MAGI-2证明MoE这条路在视频上也能走通，后面会有更多千亿视频模型跟进。"},{"angle":"说人话版","text":"说人话解释Sand.ai这次开源。之前开源视频模型大多十几亿、几十亿参数，卡在小模型上画质上不去。Sand.ai用MoE架构把总参推到1140亿，但聪明在每次只算其中60亿，容量大还不烧钱。它生成的不是「无声画面再加后期配音」，而是画面、声音、表演同一个模型一次出，人物说话口型对得上、环境有反应。成本折算下来10秒高清才5毛。对做短视频、短剧、广告的人来说，等于多了一个能本地研究、能改架构的免费底模。以前这种级别模型只有大厂闭源能用，现在权重公开，小团队也能拿来做二次开发，视频创作的门槛又降了一截。"}]},{"id":"ai3","title":"Kimi K3开源：全球最大开源权重模型长这样","hook":"2.8万亿参数全开放，中小企业第一次零成本拿到顶级AI。","why":"月之暗面K3是迄今最大开源权重模型，多源交叉验证，适合做「国产开源领跑」叙事。","heat":"中高","tags":["国产","开源","大模型"],"facts":["7月27日，月之暗面开放 Kimi K3 完整模型权重，总参数2.8万亿、每次激活约1040亿，是迄今全球参数规模最大的开源权重模型（新黄河、大鱼财经，2026-07-28；今日头条，2026-08-03）","原生支持100万Token上下文、原生视觉能力；采用MoE架构，896个路由专家每次选16个加2个共享专家（官方模型卡，2026-07-27）","上线30分钟登顶Hugging Face趋势榜；API定价缓存命中输入2元、未命中20元、输出100元每百万Token（新黄河，2026-07-28）","第三方评测：BrowseComp得分91.2%，高于GPT-5.6 Sol的90.4%与Claude Fable 5的88.0%；技术报告自承综合仍落后Claude Fable 5与GPT-5.6 Sol（新黄河，2026-07-28；aitooltier）","待核实：《自然》称其为「自DeepSeek以来的又一个Sputnik时刻」为媒体评价，非官方结论，未写入口播稿正文。"],"scripts":[{"angle":"数据向","text":"Kimi K3几个数字摆出来。总参2.8万亿，每次激活约1040亿，是迄今全球参数最大的开源权重模型。原生100万Token上下文，能一次性吞下一本书。MoE架构，896个路由专家每次选16个加2个共享专家。上线30分钟登顶Hugging Face趋势榜。API定价：缓存命中输入2元、未命中20元、输出100元每百万Token。第三方BrowseComp评测91.2%，高于GPT-5.6 Sol的90.4%和Claude Fable 5的88.0%。换句话说，开源模型第一次在综合评测上压过顶级闭源，这对「闭源一定更强」的固有印象是实打实的冲击。"},{"angle":"说人话版","text":"用大白话讲Kimi K3为什么被疯抢。月之暗面7月27号把它的完整权重开放了，总参2.8万亿，每次干活激活1040亿，是全球最大的开源模型。它能原生看懂图、记一百万Token相当于整本书的内容。最关键是「开源」——你免费下载自己部署，不用给月之暗面交一分钱。评测上BrowseComp拿了91.2%，比几个顶级闭源还高。代价是响应慢约四倍、自部署要数据中心级硬件。对中小企业，这是第一次接近零成本拿到顶级AI能力，以前这种水平只能租大厂API，现在自己搭一套，长期算账能省一大笔，而且数据完全捏在自己手里。"},{"angle":"趋势判断","text":"Kimi K3开源释放一个信号：开源和闭源的能力差，第一次实质性消失。看三点。第一，规模上K3把开源推到2.8万亿参数、100万上下文，直接对标闭源旗舰。第二，生态上权重全开放，全球开发者免费下载部署，把竞争从「榜单分数」拉到「成本、落地、生态」。第三，商业逻辑变了，闭源公司的溢价只能来自真领先，否则就被开源替代品吃掉。对行业，2026年7月是个分水岭：比拼不再是参数，而是谁落地更快更便宜。接下来值得看，当开源模型能力追平闭源，云厂商的收费模式会不会被彻底改写。当能力追平，价格战的主导权就交到了开源方手里，闭源那套高溢价会越来越难撑。"}]},{"id":"ai4","title":"AI从「帮写」变「帮干」：生产级智能体落地","hook":"AI不再只给答案，而是自己组织步骤把活干完。","why":"8月初多家Agent产品集中发布，趋势清晰，区别于此前模型/视频/价格类选题，立「工作方式」人设。","heat":"中高","tags":["Agent","趋势","实用"],"facts":["8月3日，阿里「千问办公」(QwenWork) 开启公测，由QoderWork、MuleRun、悟空三款产品整合，主打桌面、云端、企业协同Agent，未来连接企业IM、数据库与真实工作流（网易、南方都市报，2026-08-03；杭州网，2026-08-03）","绘升科技8月4日发布桌面Agent平台MainBody，支持用Skill把一类任务的方法固化复用，如内容审核Skill规定核查范围与敏感词（腾讯新闻，2026-08-04）","极光移动旗下GPTBots.ai于8月3日发布生产级Agent执行引擎LoopAgent，强调隔离沙箱、成本护栏、步骤级审计轨迹，覆盖保险理赔、内部运营自动化等（asiaexcite，2026-08-03）","趋势：AI办公从「帮我写一份东西」转向「帮我把一项工作做完」，关键在把个人经验沉淀为可复用Skill与工作方法（杭州网、腾讯报道综合，2026-08）","待核实：WorkBuddy 7月月活增速397%、全球第一等为媒体报道口径，未写入口播稿正文。"],"scripts":[{"angle":"趋势判断","text":"AI办公正在变天，从「帮我写一份东西」变成「帮我把一项工作做完」。8月3号阿里「千问办公」公测，把桌面、云端、企业协同三类Agent合一，未来接企业IM和数据库；绘升科技的MainBody用Skill把一类任务的方法固化复用；GPTBots的LoopAgent主打生产级执行，带沙箱和审计轨迹。共同方向是：AI不再只给答案，而是自己组织步骤、调工具、推进到交付。谁先把经验沉淀成可复用Skill，谁就跑得最快。以后招人可能先看你会不会把工作流喂给Agent，而不只是自己苦干。会喂工作流的人，效率能甩同事一条街，这是新一轮职场分水岭。"},{"angle":"实操流程","text":"想让AI真正帮你干活，参考这套路径。第一步，别要万能助手，先列你重复度最高的三件事。第二步，把其中一件固化成Skill或模板，比如「内容审核」规定核查范围和敏感词，一次配好长期复用。第三步，让Agent连上你的真实工具——文件、浏览器、命令行，而不是只在聊天框里给建议。第四步，长任务丢云端跑，睡前发起早上收结果。第五步，关键决策和最终审核留给人，AI负责重复机械的部分。这样经验能累积，不是每次重写提示词。举个例，每月做竞品月报，第一次手把手教它，之后直接调用那个Skill，半小时出初稿你只改结论。"},{"angle":"方法论","text":"判断一个AI Agent是不是真能落地，看三条。第一，它接没接你的真实工作流，还是只在对话框里给建议；能读本地文件、调浏览器、跑命令的才算干活。第二，它能不能把经验变成可复用Skill，新人遇到同类任务直接调用，而不是每次重新交代。第三，有没有成本护栏和审计轨迹，出了问题能溯源。市面上的Demo很多，能进生产的少，差的就是执行层和可控性。普通用户选工具，先问这三条，比看演示视频靠谱。别被「能聊天」迷惑，真正值钱的是「能真正把事办成、端到端交付」，前者是玩具，后者才是生产力。别被花哨演示带偏，落地能力才是硬指标，买之前先问那三条。"}]},{"id":"ai5","title":"把2.4万亿大模型搬回家：量化让普通人也能本地跑","hook":"模型从4.9TB压到397GB，家用多卡工作站就能跑。","why":"Unsloth 1-bit量化是今日（08-13）配套热点，讲清「本地大模型」平民化路径，实用、可操作、长效。","heat":"中","tags":["玩法","本地部署","成本"],"facts":["开源AI团队 Unsloth 用动态1-bit分层选择性量化，将Qwen3.8-2.4T-A95B原始4.9TB体积压缩至397GB，存储空间缩减91%（36氪、智东西，2026-08-13）","借助 Unsloth-Desktop 工具，设备内存加显存总量达到410GB以上即可本地运行该2.4万亿模型（同上）","背景：大模型本地部署长期受显存与带宽限制，量化（如MXFP4权重、MXFP8激活）是把万亿参数模型压进消费级硬件的主流路径（Kimi K3技术报告提及量化感知训练，2026-07；通用科普）","意义：本地运行意味着数据不出本机、可离线、可反复微调，对隐私敏感与小团队场景价值高（通用分析）","待核实：410GB内存加显存门槛对应具体硬件组合因配置而异，未写入口播稿正文。"],"scripts":[{"angle":"说人话版","text":"大模型一直有个门槛：参数越大越聪明，但越大越跑不动，得堆数据中心级显卡。量化就是解决这个的。简单说，把模型里那些精度过高的数字「压缩」成更小的表示，体积骤减、显存占用大降，普通硬件也能跑。Unsloth团队用1-bit分层量化，把2.4万亿的Qwen3.8压到397GB，比原来4.9TB小了91%。本地运行意味着数据不出本机、能离线、能反复改，对隐私和小团队很实用。以后你电脑里跑一个顶级模型不再是梦，前提是你肯为多卡工作站花这笔钱，换来的是数据主权。等显卡再便宜一代，这一步迟早会走进普通人的书房。"},{"angle":"实操流程","text":"想在自己机器上跑大模型，按这个来。第一步，确认硬件，量化后的2.4万亿模型仍需内存加显存410GB以上，一般是多卡工作站，普通笔记本跑不了，先认清现实。第二步，装Unsloth-Desktop这类工具，它把量化部署封装好了。第三步，下载开源权重，像Qwen3.8-2.4T-A95B或Kimi K3，选量化版本而不是原始版。第四步，按框架给的Recipe配置并行策略。第五步，先跑小模型练手，再上大杯。记住：量化会小幅掉点，但换来了能本地反复微调的自由。对普通人，更现实的是先从7B、14B小模型玩起，等硬件降价，再考虑把旗舰搬回家自己养。"},{"angle":"成本账","text":"算一笔账你就懂量化值不值。一个2.4万亿原始模型体积4.9TB，放云端按调用收费，数据还得出境。用1-bit量化压到397GB，存储省91%，本地多卡工作站就能跑，一次部署长期免调用费。代价是硬件门槛——内存加显存要410GB以上，大约一台高配工作站的价格，但比起常年租云算力，重负载场景很快就回本。更关键的是数据不出本机、可离线、可微调，对隐私敏感的业务，这笔账怎么算都划算。举个例，一家小公司每月API支出过万，自部署一次性的硬件投入半年就能打平，之后就是净省，还顺带把数据攥回自己手里。"}]}]}]},"2026-08-12":{"date":"2026-08-12","updatedAt":"2026-08-12 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"民航公交化跨航司签转：误机也能当场改签，首次免手续费","hook":"买东航的票，现在能直接换南航的航班了。","why":"暑运航班乱、延误多，这个新服务能省大钱，且是央视权威报道的一手服务，实用性强、收藏率高。","heat":"中高","tags":["出行服务","省钱","实用"],"facts":["央视网 2026-07-05：暑运期间南京禄口机场联合深圳机场，东航、南航、深航、吉祥四家航司在南京往返深圳「空中快线」率先试点「宁深畅行」跨航司旅客自愿签转服务。","同上：首次签转免收变更手续费，票价遵循「高价补差、低价保价」原则；旅客在原航班起飞当日提前90分钟提出申请，可在前后4小时内同航段航班自由调整。","同上：该服务覆盖全舱位，正常购票旅客（除免票等特殊票）均可享受，被称「零门槛」普惠，打破以往签转仅限高票价旅客的惯例。","民航局 2026夏秋航季（3月29日起执行至10月24日）：新航季重点加码热门旅游目的地航线，新疆、云南、贵州等文旅热门地区航班显著加密。","待核实：「宁深畅行」后续是否扩展至其他航线、其他机场，目前仅见南京至深圳试点报道，未写入口播稿正文。"],"scripts":[{"angle":"干货直给","text":"今年暑运有个新服务值得记住：跨航司签转。简单说，你买南京飞深圳的机票，遇上延误或者想换一班，不用退票重买，可以直接在前后四个小时内的同航段航班里自由换。央视七月初报道，南京禄口联合深圳机场，东航、南航、深航、吉祥四家航司先在南京到深圳这条线上试点，名字叫「宁深畅行」。最关键的是首次签转免收变更手续费，票价按「高价补差、低价保价」来算，你原票只要不是免票这类特殊票，正常买的都能用，叫「零门槛」普惠。以前签转基本是高票价旅客的增值服务，这次覆盖全舱位。操作上，原航班起飞当天提前九十分钟申请就行。暑假航班容易乱，这个比退票重买省太多。"},{"angle":"避坑清单","text":"跨航司签转听着香，但有三条先说清。第一，目前只在南京往返深圳这一条「空中快线」试点，别以为全国航线都能用，出发前先确认你那班在不在线。第二，时间窗口卡得紧，必须是原航班起飞当天、提前九十分钟申请，而且只能换前后四个小时内的同航段航班，想跨城市跨航段不行。第三，票价「高价补差、低价保价」，你换的航班比原票贵才补差价，便宜了不退差价也不收手续费，这点对旅客有利。另外它免的是变更手续费，不是票价本身，别理解成免费飞。目前试点范围小，但思路对了，这种「民航公交化」以后大概率会铺开，赶上了就赚到。"},{"angle":"说人话版","text":"用大白话解释什么叫跨航司签转。以前你买东航的票，只能换东航的航班，想换南航的深航，得先退票再买，手续费加上差价能亏一截。现在南京到深圳这条线，四家航司打通了，你手里的票能在前后四小时里随便换同段的航班，第一次还不收变更费。这就跟坐公交车差不多，下一班来了就能上，不用退了重买。为什么是现在？暑运航班密度大、延误多，旅客最怕卡在机场。航司把签转门槛降到全舱位，本质上是把服务当竞争力。对你来说，记住两点：原航班当天提前九十分钟去办，只换同段不跨城。剩下的交给柜台，别为一次延误白亏几百块。"}]},{"id":"tv2","title":"避暑旅游列车清凉龙江9天环线，22℃的黑龙江成今夏黑马","hook":"东北七月平均才22度，有人直接坐火车玩了9天。","why":"暑期避暑强需求，且是央视报道的真实旅游产品，错峰、低客流、适合带老人小孩，实用且新鲜。","heat":"中","tags":["避暑","铁路游","亲子"],"facts":["央视网 2026-08-01：今年暑运7月1日启动、8月31日结束；截至7月31日全国铁路累计发送旅客4.32亿人次。","央视网 2026-08-01：黑龙江省7月平均气温维持在22℃左右，270名来自北京、天津的游客乘旅游列车从哈尔滨出发，前往漠河、伊春、抚远等地，开启9天「清凉龙江」畅游。","国铁哈尔滨局：该线路串联华夏东极、神州北极，涵盖火山冷泉、森林氧吧、边境风光、鹤乡湿地，形成经典黑龙江环线。","央视网 2026-07-01：暑运期间铁路安排开行亲子游、研学游、红色游、康养游等特色旅游列车，常态化开行「熊猫专列」「伊春号」「中国雪都·我的阿勒泰」等专线。","待核实：「清凉龙江」专列具体发车频次与票价区间，目前仅见单趟270人案例，未写入口播稿正文。"],"scripts":[{"angle":"干货直给","text":"今年夏天东北成了避暑黑马，黑龙江七月份平均气温才二十二度，直接被做成了一条旅游产品。央视八月一号报道，二百七十名从北京、天津来的游客坐旅游列车，从哈尔滨一路到漠河、伊春、抚远，玩了九天，叫「清凉龙江」。这条线串起了华夏东极、神州北极，火山冷泉、森林氧吧、边境风光、鹤乡湿地全在里面。铁路这边也在加料，暑运期间开了一堆特色旅游列车，像「熊猫专列」「伊春号」「中国雪都·我的阿勒泰」都是常态化专线。对于怕热又不想挤传统热门的人来说，东北这条环线刚好错峰，气温舒服，客流也没那么卷。想去的趁八月这波，九月开学后车次会少。"},{"angle":"故事切入","text":"我有个朋友七月底带娃去了趟黑龙江，回来跟我说一句话：原来不用去三亚也能避暑。他们坐的那趟旅游列车，从哈尔滨出发，一路到漠河、伊春、抚远，九天走完，名字叫「清凉龙江」。黑龙江七月平均气温二十二度，白天不用开空调，晚上睡觉要盖被子。更关键是人少，不像热门海滨城市那样下饺子。央视报道这趟线串起了华夏东极和神州北极，火山冷泉、森林、湿地、边境风光都在一条环线上，不用反复换交通。现在铁路把旅游列车当产品做，「熊猫专列」「伊春号」「中国雪都·我的阿勒泰」都常态化开了。带老人小孩的，这种慢节奏环线比赶景点舒服太多。"},{"angle":"趋势判断","text":"从「清凉龙江」这趟线能看出一个趋势：避暑游正在从「去哪儿凉」变成「怎么舒服地凉」。两个信号。第一，需求端，今年全国大范围高温，东北二十二度的平均气温成了稀缺资源，黑龙江七月的客流明显起来，二百七十人的专列只是缩影。第二，供给端，铁路不再只卖车票，开始卖线路、卖服务，「熊猫专列」「伊春号」「中国雪都·我的阿勒泰」这种特色旅游列车常态化开行，把康养、研学、亲子都装进去了。这意味着避暑目的地竞争进入了产品阶段，光有凉快不够，得有能串起来的体验。对普通人来说，东北、西北这些以前被忽略的清凉地，今年性价比最高。"}]},{"id":"tv3","title":"西十高铁迎首个暑运，武汉到西安十堰月送233万人次","hook":"一条七月才通的高铁，首月就运了233万人。","why":"新线开通头几个月是出行捡漏窗口，票价实、票好买，信息差强，适合做交通类实用内容。","heat":"中","tags":["高铁新线","陕南鄂西","错峰"],"facts":["央视网 2026-08-01：暑运前夕武汉至西安高铁西安东至十堰东段、金华至建德高铁兰溪至建德段、北京市郊铁路城市副中心线北京西至良乡段投入运营；西十高铁开通后首个暑运，7月经由该线动车组累计运送旅客233万人次。","国铁西安局：十堰东站启用负一楼备用候车区，新增1000个候车席位，可满足日均3万人次出行需求。","央视网 2026-03-29：2026夏秋航季国航新增北京至榆林等6条、南航新开北京大兴至伊宁等、东航新开国内航线41条，新疆、云南、贵州航线班次显著加密。","航旅纵横：4月1日至6月30日国内往返阿勒泰、哈密、北海、大理等城市计划航班同比增约20%。","待核实：「西十高铁对西安、武汉两省会通勤的具体时间压缩幅度」以官方时刻表为准，未写入口播稿正文。"],"scripts":[{"angle":"数据向","text":"给几个数字看西十高铁的第一个暑运。央视八月一号报，西十高铁西安东到十堰东段七月份刚开通，首个暑运整月经由这条线的动车组就送了二百三十三万人次。十堰东站为此启用了负一楼备用候车区，新增一千个候车席位，能扛住日均三万人次的量。放到更大的盘子里看，今年夏秋航季国航、南航、东航都在猛加旅游线，东航新开国内航线四十一条，新疆、云南、贵州班次显著加密，航旅纵横的数据是四到六月阿勒泰、大理这些城市计划航班同比涨了约两成。西十高铁的意义不只是西安到武汉快了，它把陕南、鄂西这些原来高铁薄弱的地方一下拉进全国路网，沿线出游成本直接降一截。"},{"angle":"横向对比","text":"同样是从西安出发，今年和前几年完全不是一回事。以前西安人想深度游陕南、去湖北十堰武当山一带，得绕或者坐慢车，折腾半天。西十高铁一通，西安东直达十堰东，开通头一个月就运了二百三十三万人次，说明需求一直被压抑，只是路没通。对比东航今年夏秋新开四十一条国内航线、航旅纵横显示阿勒泰大理航班同比涨两成，能看出一个共同点：今年旅游出行的增量，很大一块来自新线和新机场带出来的「隐藏目的地」。对旅客来说，新线开通头几个月往往票好买、价不高，是捡漏窗口。想走陕南鄂西环线的，现在比半年后划算，趁早不趁晚。"},{"angle":"说人话版","text":"说人话版：西十高铁就是西安到十堰那段高铁，今年七月刚通，赶上了暑运。结果第一个月就运了二百三十三万人次，把十堰东站都逼得开了备用候车区、加了一千个座位。这说明什么？说明西安和湖北十堰、武当山这条线，大家一直想去，就是以前太不方便。高铁一通，路网把陕南、鄂西这些原本高铁稀松的地方直接接进全国网，你从西安出发玩陕南、去武当山，时间成本和票价都降了一截。对普通游客的提示就一句：新线开通头几个月是黄金期，票不紧张、价格也实在，想走这条环线的别等，等大家都发现了，票价和住宿就都跟着涨。"}]},{"id":"tv4","title":"北京世界公园33年首次免票延时到晚9点，城市夜游成新风","hook":"开园33年，它第一次把100块门票免了，还开到晚上9点。","why":"城市微度假、夜经济是当下热点，且是央视新闻联播级别报道，本地人实用、外地人也能抄思路。","heat":"中高","tags":["夜游","微度假","本地"],"facts":["央视网 2026-08-10（新闻联播）：北京世界公园开园33年来今年首次宣布免收100元门票，营业时间从17时延长至21时。","同上：丰台区将公园附近商场闲置停车场改为限时免费停车场，把闲置干道变市集，引入200多家商户；北京各大公园暑期为居民打造近200项夜间活动。","同上：免票效应蔓延至周边，陶然亭公园等推出经典曲艺、文创、小吃等夜间消费场景。","央视网 2026-07-06：暑期机票价格「亲民」，7月中上旬仍有不少裸票低于300元，部分航线低于同期高铁。","待核实：「世界公园免票政策的持续时长与是否仅限夜间时段」以园方最新公告为准，未写入口播稿正文。"],"scripts":[{"angle":"反常识开场","text":"公园到了晚上应该关门了吧？北京世界公园今年偏不。开园三十三年，它第一次把一百块的门票免了，还把关门时间从下午五点延到晚上九点。央视八月十号报，这一改，公园傍晚反而成了全天最热闹的时候。丰台区把旁边商场闲置的停车场改成限时免费停车，把空着的干道变成市集，一下子引来两百多家商户摆摊。这背后是一个被忽略的逻辑：城市里的公园，白天是景观，晚上才是消费场。当门票归零，留下来的人会在周边吃饭、逛摊、看演出，赚的是园子外面的钱。北京各大公园这个暑假搞了将近两百项夜间活动，夜游正在变成城市微度假的新入口。"},{"angle":"干货直给","text":"北京世界公园今年干了件出圈的事：开园三十三年第一次免掉一百块门票，营业时间从十七点延到二十一点。央视八月十号报道，配套动作很实在，丰台区把公园附近商场闲置停车场改成限时免费停车，把闲置干道变市集，引了二百多家商户。效果立竿见影，傍晚反倒成了全天最热闹的时段，陶然亭等公园也跟上，推出曲艺、文创、小吃等夜间场景。北京这个暑假在全市公园搞了将近两百项夜间活动。对本地人来说，这是个信号：不用出远门，下班后带家人逛个夜公园、吃个市集、看场演出，就是一次低成本微度假。门票免了，体验反而更丰富。"},{"angle":"趋势判断","text":"从世界公园免票延时能看出城市文旅的一个转向：从「卖门票」转向「卖时间和场景」。三点判断。第一，驱动力是消费时段延长，公园把十七点到二十一点的空白时段激活，等于凭空多出四小时营业时间。第二，盈利逻辑变了，门票归零后，赚的是停车、市集、餐饮、演出的周边消费，丰台把闲置停车场和干道盘活就是例子。第三，这是可复制的，北京近两百项夜间活动说明不是孤例，其他城市的历史文化公园、滨水公园都能抄。对游客意义很直接：城市夜游成本低、频次高，是比远途游更轻松的周末出口。家里附近有老牌公园的，这个暑假值得再去一次，可能认不出来了。"}]},{"id":"tv5","title":"全国暑期文旅消费季发4.5亿补贴，8月底前这些优惠抓紧用","hook":"4.5亿消费补贴，八月底就清零，很多人还没领。","why":"政策红利+截止日临近，强时效、强实用，契合省钱人设，收藏和转发都高。","heat":"中","tags":["消费补贴","优惠","截止提醒"],"facts":["央视网 2026-07-08：文旅部在青海启动2026年全国暑期文化和旅游消费季（7月初至8月底），组织各地举办超3万场次文旅消费活动，发放超4.5亿元消费券等消费补贴。","同上：中国银联推出景区门票立减、酒店民宿消费券等支付优惠；青海发放涵盖门票、住宿、线路、交通的文旅消费券2000万元。","央视网 2026-07-06：黑龙江多地推出中高考学子专属福利、文旅消费券、有奖发票等惠民举措；鹤岗面向全国游客的长效文旅消费补贴持续至8月30日。","同上：哈尔滨极地公园、融创乐园、松峰山、帽儿山等13家重点景区相继推出免票、折扣等优惠；冰雪大世界梦幻冰雪馆应届中高考生特惠98.5元（原价268元）。","待核实：「各地消费券具体领取入口与核销规则」以当地文旅部门官方发布为准，未写入口播稿正文。"],"scripts":[{"angle":"干货直给","text":"有一笔钱很多人还没领：全国暑期文旅消费季发了超过四点五亿消费补贴，到八月底就截止。央视七月八号报，文旅部在青海启动这个消费季，从七月初到八月底，全国办超三万场活动，发超四点五亿消费券。具体怎么用：中国银联推了景区门票立减、酒店民宿消费券；青海自己发了两千万，覆盖门票、住宿、线路、交通。地方上也在加码，黑龙江多地给中高考学子专属福利和文旅消费券，鹤岗面向全国游客的补贴一直持续到八月三十号，哈尔滨十三家重点景区推免票折扣，冰雪大世界梦幻冰雪馆应届中高考生特惠九十八块五，原价二百六十八。八月剩下的日子，是最后窗口。"},{"angle":"避坑清单","text":"领文旅消费补贴，五条先核对。第一，时间卡到八月底，消费季七月初到八月底，鹤岗那笔补到八月三十号，再晚就过期，现在不动手九月就没了。第二，渠道分散，银联的在云闪付相关活动页，地方的在各省文旅厅公众号或指定平台，别只盯一个入口。第三，券分门票立减、酒店民宿、线路交通几类，先看自己要去哪儿再领对应的，别一股脑领一堆用不上。第四，中高考特惠基本都要原件，准考证加身份证，截图不行，出发前查好带齐。第五，消费券多是满减或立减，注意核销规则和有效期，有的周末不能用。把这些确认完，一趟省下的比抢机票尾单还稳。"},{"angle":"说人话版","text":"说人话：国家这个暑假在发旅游红包，总额四点五亿多，但八月底就清零。钱怎么到你手里？一部分是银联的门票立减和酒店民宿消费券，在云闪付活动里领；一部分是各省自己发的，像青海两千万覆盖吃住行，黑龙江给中高考生特惠、鹤岗补贴到八月三十。这跟抢机票尾单不一样，机票靠运气，这个补贴是明摆着的政策红利，只要你在八月底前出门就能用。最划算的玩法：挑个周末周边游，用消费券把门票酒店一抵，成本能压到很低。提醒一句，券要主动领、看清规则，别等到九月才发现过期。家里有刚考完试的小孩，记得把准考证利用上。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"Claude隐形水印全量嵌入，AI写的字以后能被一眼认出","hook":"你用Claude写的每一句话，可能都带着看不见的记号。","why":"强争议、强相关，直接冲击所有用AI产内容的人，评论区天然能吵起来，时效贴合欧盟AI法案。","heat":"高","tags":["争议","创作者","合规"],"facts":["量子位 2026-08（文 470228）：Anthropic表示新款Claude将在生成文本中嵌入隐形水印，水印随文本复制粘贴带走，编辑后也可能保留。","同上：直接推手是Anthropic已签署欧盟《AI生成内容透明度行为准则》，该准则由独立专家起草、经欧盟委员会评估，目前约190家机构签署，含Google、Meta、Microsoft、OpenAI。","关联背景（与08-03已确认交叉）：欧盟AI法案相关透明度要求自2026年8月2日起及之后发布的模型适用；Anthropic称该机制全球施行，不限于欧盟。","同上：覆盖范围含API、Claude、Claude Code、Claude Cowork、Claude Tag全产品线；生成.svg/.png/.jpg等文件时附加C2PA数字签名元数据。","待核实：「水印对普通用户日常使用的具体影响范围、检测工具上线时间」Anthropic称后续放出技术文档，未写入口播稿正文。"],"scripts":[{"angle":"反常识开场","text":"你用Claude写的每一句话，以后可能都带着看不见的记号。Anthropic最近宣布，新款Claude生成文字时会直接织进一个隐形水印，不是元数据，是文本本身的一部分，你复制粘贴带走它，改了也可能留着。更狠的是全球施行，不只欧盟。直接推手是Anthropic签了欧盟《AI生成内容透明度行为准则》，目前约一百九十家机构签了字，Google、Meta、微软、OpenAI都在内。这意味着AI生成内容强制标识，从图片视频蔓延到了纯文字。对做内容的人来说，以后「这是不是AI写的」不再靠猜，一查就知道。这到底是保护读者，还是给创作套了枷锁，评论区已经吵翻了。"},{"angle":"创作者视角","text":"这条对靠文字吃饭的人影响最大，我说三点。第一，标识范围比你想的大，Claude的API、网页、Code、Cowork、Tag全产品线都覆盖，生成的图片视频还附C2PA数字签名元数据，能查是否篡改。第二，它改变的是信任结构，以后甲方、平台、读者都能一键验「这段文字过没过Claude」，你用AI做校对、翻译、摘要也会被标记，哪怕想法是你自己的。第三，对搬运号和洗稿号是致命打击，但对正经创作者是把双刃剑：透明是好事，可如果你的写作风格本来就像AI，反而更容易被误判。建议别把AI当枪手，把它当助理，核心观点和表达留给自己。"},{"angle":"说人话版","text":"说人话解释Claude的水印。以前AI生成内容标识，大多藏在文件信息里，你转发一下就没了。这次不同，Anthropic把水印直接写进文字本身，像隐形墨水，肉眼看不见，但复制、粘贴、稍微改改都还在。原因是欧盟的AI法案要求AI公司给生成内容加标识，Anthropic签了那份准则，约一百九十家公司跟着签，而且不只欧洲，全球都执行。落到你身上：以后用Claude写的东西，原则上能被检测工具认出来。对普通用户，日常聊天下影响不大；对拿AI批量产内容的人，等于被贴了标。想绕开的人已经在研究，但官方说检测工具随后就上。"}]},{"id":"ai2","title":"中国首个十万卡集群落成，国产算力迈进十万卡时代","hook":"从五万卡到十万卡，国产算力又翻了一倍。","why":"国家级基础设施里程碑，长期影响模型价格与自主可控，信息密度高、情绪价值足。","heat":"中高","tags":["国产算力","基础设施","长效"],"facts":["量子位 2026-08-12（中科曙光 曙光8000）：中国首个十万卡集群落成，全国产算力支撑「十万卡时代」，已跑通300余项应用。","同上：集群从FP64到INT8全精度覆盖，面向AI训练与推理。","关联背景（美团官方 2026-07-28，见08-02）：美团LongCat-2.0为业界首个在五万卡国产算力集群完成全流程训练推理的万亿参数模型；本次十万卡为更高量级里程碑。","待核实：「曙光8000具体芯片型号与单卡算力、能耗数据」官方未完全披露，未写入口播稿正文。","交叉：国家持续推进全国产算力建设，多家大厂模型已在国产卡上跑通（美团、阿里等），方向一致。"],"scripts":[{"angle":"干货直给","text":"国产算力又迈了一大步：中国首个十万卡集群落成，中科曙光这个叫曙光八千的集群，从FP64到INT8全精度覆盖，已经跑通三百多项应用。什么概念？一个多月前美团开源LongCat-2.0时，宣传的是「五万卡国产集群跑通万亿参数」，已经是当时的大新闻。这次直接翻倍到十万卡，是全国产算力从「能跑」到「能扛大规模生产」的里程碑。为什么重要？大模型最卡脖子的就是算力，国产卡能不能撑起顶级训练和推理，直接决定模型成本和自主可控。十万卡时代来了，意味着更多国产模型可以在自己人手里训练和部署，长期看，模型价格还会往下走，对用AI的人全是利好。"},{"angle":"数据向","text":"摆几个数感受十万卡集群的分量。中科曙光落成的曙光八千，是中国首个十万卡规模集群，算力从FP64到INT8全精度覆盖，目前已经跑通三百多项应用。对比一个多月前，美团LongCat-2.0宣传的是在五万卡国产算力集群上完成万亿参数模型全流程训练推理，当时已被称作业界首个。从五万到十万，不是一个简单翻倍，是工程组织、散热、互联、调度的数量级跨越。更关键的是「全国产」三个字，芯片、集群、调度全在自己手里，意味着训练不被外部供应卡脖子。对产业的影响是慢热的：算力供给上来了，模型训练和推理成本会被摊薄，最终反映到你我调用AI的价格上。"},{"angle":"趋势判断","text":"十万卡集群落成，我看是三个信号。第一，国产算力从示范走向规模生产，之前美团五万卡跑通万亿参数还是新闻，现在十万卡落成且跑通三百多项应用，说明国产卡集群的工程能力已经成型。第二，算力自主的逻辑变了，不再是「有没有」，而是「够不够大、稳不稳」，全国产全精度覆盖意味着高端训练和推理都能在国内自主完成。第三，这会反过来压低模型成本，算力供给宽松，训练和推理单价长期走低，最终利好所有调用AI的下游。对普通人，不用懂技术也能感受到：以后同样能力的AI，价格会更便宜，响应会更稳。这是基础设施的红利，比单个模型发布更值得关注。"}]},{"id":"ai3","title":"AI华语歌终于能听了，从零预训练十亿参数，字节也入局","hook":"以前AI唱中文歌一听就出戏，现在不一样了。","why":"消费向、有趣、破圈潜力大，直接关系短视频配乐和带货BGM，实用又不枯燥。","heat":"中高","tags":["音乐生成","短视频","可玩"],"facts":["量子位 2026-08-11（文：AI华语歌，终于能听了）：从零预训练十亿参数音乐模型，告别「人机味」，字节也入局。","同上：过去AI生成歌曲常被人诟病「电音感」「咬字假」，新一代模型通过从零预训练提升自然度。","关联：字节在音频与音乐方向早有布局（豆包语音模型、Seedance等），此次入局华语歌生成延续其多模态路线。","待核实：「该十亿参数音乐模型的具体名称、是否公开可用、授权与版权规则」报道未明确，未写入口播稿正文。","交叉：AI音乐赛道2026年持续升温，同类工具已引发版权争议，中文赛道空白待补。"],"scripts":[{"angle":"反常识开场","text":"AI唱的中文歌，以前一听就出戏，电音感、咬字假、气息飘，像机器在念歌词。但最近变了，有团队从零预训练了一个十亿参数的音乐模型，专门啃华语歌的自然度，字节也下场了。这不是在原有模型上修修补补，而是从底子重新训，让旋律、咬字、气口都更接近真人。过去AI音乐被诟病最多的就是「人机味」，一听就知道是生成的，平台一推就限流。新一代模型要解决的正是这个，把「像人」当成硬指标。对做短视频配乐、带货背景音的人来说，这意味着以后能更低成本拿到不像AI的原创音乐，不用再花大价钱买版权曲，预算能砍掉一大块。"},{"angle":"说人话版","text":"说人话：AI唱华语歌终于能听了。以前那些AI歌，旋律还行但一开嗓就露馅，电音味重、咬字发飘，听着别扭。问题出在模型大多是拿现成模型改的，没真懂中文歌的咬字和气口。现在有新做法，从零预训练一个十亿参数的音乐模型，专攻自然度，字节也进了这个赛道。效果上，生成的歌更像真人唱，少了那股「人机味」。对普通人有什么用？第一，做视频配乐不用再担心一听就是AI被限流；第二，原创背景音乐成本能压很低；第三，未来可能人人能定制自己的歌。当然，版权和授权规则还没清晰，正式商用一定要谨慎，千万别踩雷。"},{"angle":"创作者视角","text":"如果你是做短视频的，AI华语歌这波值得盯，三点。第一，平台对「明显AI味」的内容有流量顾虑，一首一听就是合成的歌做BGM，观众直觉就划走。新一代模型把自然度当核心指标，从零预训练十亿参数专攻华语咬字气口，出来的歌更接近真人，限流风险低。第二，成本结构变了，以前定制一首像样的原创配乐要么买版权要么请人写，现在模型生成接近零边际成本，批量出不同情绪的BGM成为可能。第三，字节入局很关键，它手里有抖音这个最大分发场景，技术容易和创作工具打通。提醒一句，商用授权还没清晰，正式带货片先在小范围测试。"}]},{"id":"ai4","title":"GPT-5.6一小时解开50年数学猜想，64个子智能体协作","hook":"五十年没人解开的数学题，被一个700词的提示词撬动了。","why":"强能力展示、有冲击力，可延伸到多Agent协作方法论，破圈且不过时。","heat":"中高","tags":["多智能体","推理","前沿"],"facts":["量子位 2026-08-12（文：GPT-5.6一小时解开50年数学猜想）：约700词Prompt驾驭64个子智能体，解开一桩约50年未决的数学猜想。","同上：展示大模型通过多智能体协作完成长周期复杂推理任务的潜力。","关联（Anthropic 2026-08，量子位 470485）：Claude曾将黎曼猜想相关ζ函数零点比例下界从41.6%推至67.2%，AI开始能自己做开放性问题研究。","待核实：「该数学猜想的具体名称、证明是否经同行评审确认」报道未给出，未写入口播稿正文。","交叉：多Agent协作正成为攻克复杂任务的主流范式（见08-11 Hermes Agent等）。"],"scripts":[{"angle":"数据向","text":"给个数字感受GPT-5.6的推理上限：用一个约七百词的提示词，调度六十四个子智能体协作，解开了一桩约五十年没解决的数学猜想。注意关键词，不是单模型硬算，是六十四个Agent分工合作，有的查资料、有的试路子、有的交叉验证，像一支研究团队。这和前阵子Claude把黎曼猜想相关的ζ函数零点比例下界从百分之四十一点六推到百分之六十七点二是一路的数：AI开始能啃开放性的真问题，而不只是做有标准答案的题。意义不在「又解了一题」，在于证明多Agent长周期协作能跑通复杂科研。对普通人，意味着以后难活可以拆给一群AI分头干。"},{"angle":"反常识开场","text":"五十年没人解开的数学猜想，被一个七百字的提示词撬动了。不是某个天才数学家，是GPT-5.6带着六十四个子智能体一起干的。过去我们认为，这种级别的开放性难题只能靠人类顶尖头脑熬几十年。现在AI用多Agent协作，把任务拆给六十四个「小工」分头查资料、试方向、互相挑错，一小时跑出人类卡了半世纪的结果。更值得玩味的是，这和Claude此前把黎曼猜想相关指标从四成推到六成七是一回事：AI的边界正在从「有标准答案的题」扩到「没人知道答案的开放问题」。当然这不等于证明成立，但科研的玩法已经被改写了。"},{"angle":"说人话版","text":"说人话解释GPT-5.6这次干了啥。它用一个七百词的任务描述，叫来六十四个AI小助手分工合作，解了一道卡了约五十年的数学猜想。关键不是它多聪明，是它的工作方式像研究团队：你给个大目标，它自己拆成小任务，分给六十四个Agent，有的找文献、有的试方法、有的互相找漏洞，最后汇总。这跟之前Claude把黎曼猜想相关指标往前推是一类的进展。对普通人意味着什么？以前AI适合做「问答」「总结」这种短任务，现在它能接「花一小时带团队攻克一个复杂问题」的长活。以后你手里的难事，可以试着交给一群AI而不是一个。"}]},{"id":"ai5","title":"DeepSeek便宜到海外平台倒贴，V4 Flash缓存命中账单砍2折","hook":"DeepSeek便宜到什么程度？海外平台开始倒贴了。","why":"强省钱玩法，契合带货/实用人设，有具体数字可落地，收藏和实操价值高。","heat":"高","tags":["省钱","成本","玩法"],"facts":["量子位 2026-08-04（文：DeepSeek低价风暴打服硅谷）：海外平台争相倒贴V4 Flash，Nous Portal给V4 Flash打一折限时7天，比Fable 5便宜一千多倍；Cline开源Coding Agent免费额度翻三倍。","同上：DeepSeek V4-Flash缓存未命中时每百万输入token约0.14美元、输出0.28美元，被研究公司称为已知最便宜前沿模型。","量子位（文：DeepSeek V4还能更省）：开源终端coding harness Reasonix专为DeepSeek打造，缓存命中率高达99.82%，原4亿+token、61美元账单直降至12美元（约2折）。","关联（08-02/08-04已确认）：V4-Flash-0731仅重做后训练，DeepSWE从7.3升至54.4，能力逼近Opus 4.8。","待核实：「海外平台补贴的具体持续时间与地区限制」以各平台公告为准，未写入口播稿正文。"],"scripts":[{"angle":"成本账","text":"DeepSeek便宜到什么程度？海外平台开始倒贴了。量子位报，V4 Flash出来后，Nous Portal直接给它打一折限时七天，算下来比Fable 5便宜一千多倍；Cline那个开源编程Agent，免费额度直接翻三倍。更狠的是缓存玩法，有个叫Reasonix的工具专为DeepSeek打造，把缓存命中率干到百分之九十九点八二，原本四亿多token、六十一美元的账单，直接砍到十二美元，差不多两折。底层原因简单：DeepSeek V4-Flash缓存未命中时每百万输入token才零点一四美元，输出零点二八美元，被研究机构称为已知最便宜的前沿模型。会用缓存的人，成本能压到地板。"},{"angle":"干货直给","text":"DeepSeek这轮便宜得离谱，核心就两个字：缓存。模型本身定价已经低到每百万输入token约零点一四美元、输出零点二八美元，被研究机构称为已知最便宜的前沿模型。但真正把成本打穿的是缓存命中。有个开源工具Reasonix专为DeepSeek设计，用稳定前缀加只追加不重写的运行循环，把长会话缓存命中率做到百分之九十九点八二，原本四亿多token、六十一美元的账单直降到十二美元，两折到手。海外平台也被价格卷疯，Nous Portal给V4 Flash打一折，Cline免费额度翻三倍。对开发者来说，会用缓存、会选flash模型，同样的活成本能差好几倍。这是实打实能省的钱。"},{"angle":"避坑清单","text":"用DeepSeek省钱，五条避坑。第一，别默认用Pro，日常任务用V4 Flash就够，便宜还能打，困难任务再切Pro，很多工具支持自动升降级。第二，缓存命中是关键，长会话尽量别每轮改上下文，用稳定前缀、只追加新消息，命中率越高越便宜，Reasonix能做到近百分之百。第三，海外平台补贴有时限，Nous Portal的一折是限时七天，别以为长期有效，看到就薅。第四，账单看清楚是缓存命中价还是未命中价，差几倍，报价要问清。第五，免费额度有用量上限，Cline翻三倍也封顶，大项目提前估量。把这五条落实，AI调用成本能压到同行几分之一。"}]}]}]}}</script>

<script>
/* ================= data ================= */
var K={st:'wb_kb_status_v1',rf:'wb_kb_refs_v1',hs:'wb_kb_history_v1',mt:'wb_kb_meta_v1'};
var PACK_TODAY=JSON.parse(document.getElementById('packToday').textContent);
var PACK_HIST=JSON.parse(document.getElementById('packHistory').textContent);
var ST={},RF=[],HS={},MT={};
var curDate=PACK_TODAY.date,curTrack='all',curSt='all',curPane='today';
var STATES=['new','pick','shot','pub'];
var ST_LABEL={new:'未处理',pick:'已选用',shot:'已拍',pub:'已发'};
var ST_CLS={new:'st-new',pick:'st-pick',shot:'st-shot',pub:'st-pub'};

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('存储写入失败，建议先导出备份');return false}}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return n<10?'0'+n:''+n}
function daysBetween(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function wc(s){return (s||'').replace(/\s/g,'').length}
function secOf(s){return Math.round(wc(s)/300*60)}

function boot(){
  ST=lsGet(K.st,{});RF=lsGet(K.rf,[]);HS=lsGet(K.hs,{});MT=lsGet(K.mt,{});
  for(var d in PACK_HIST){if(!HS[d])HS[d]=PACK_HIST[d]}
  HS[PACK_TODAY.date]=PACK_TODAY;
  var keys=Object.keys(HS).sort().reverse();
  if(keys.length>30){keys.slice(30).forEach(function(k){delete HS[k]})}
  lsSet(K.hs,HS);
  curDate=PACK_TODAY.date;
  renderAll();
  checkTip();
}
function packOf(d){return HS[d]||PACK_TODAY}
function allScripts(d){
  var p=packOf(d),out=[];
  (p.tracks||[]).forEach(function(tk){(tk.topics||[]).forEach(function(tp,ti){(tp.scripts||[]).forEach(function(sc,si){
    out.push({id:d+'|'+tk.id+'|'+tp.id+'|'+si,date:d,trackId:tk.id,trackName:tk.name,topic:tp,topicIdx:ti,sc:sc,si:si});
  })})});
  return out;
}
function stOf(id){return (ST[id]&&ST[id].s)||'new'}
function stTs(id){return (ST[id]&&ST[id].t)||null}
function setSt(id,s){
  if(s==='new'){delete ST[id]}else{ST[id]={s:s,t:today()}}
  lsSet(K.st,ST);renderAll();checkTip();
}

/* ================= today ================= */
function buildTodo(){
  var td=today(),items=[];
  Object.keys(HS).sort().reverse().forEach(function(d){
    allScripts(d).forEach(function(x){
      var s=stOf(x.id),t=stTs(x.id);
      if(s==='pub')return;
      if(s==='new'){
        if(d===PACK_TODAY.date)items.push({x:x,kind:'new',od:false,msg:'今天新出的稿，还没看'});
        return;
      }
      var age=t?daysBetween(t,td):0;
      if(s==='pick')items.push({x:x,kind:'pick',od:age>=1,msg:age>=1?('选用了 '+age+' 天还没拍'):'今天选用，等拍'});
      if(s==='shot')items.push({x:x,kind:'shot',od:age>=1,msg:age>=1?('拍完 '+age+' 天还没发'):'今天拍完，等发'});
    })
  });
  items.sort(function(a,b){
    if(a.od!==b.od)return a.od?-1:1;
    var o={shot:0,pick:1,new:2};return o[a.kind]-o[b.kind];
  });
  return items;
}
function renderToday(){
  var items=buildTodo(),od=items.filter(function(i){return i.od});
  var td=PACK_TODAY.date,all=allScripts(td);
  var cnt={new:0,pick:0,shot:0,pub:0};
  all.forEach(function(x){cnt[stOf(x.id)]++});
  var pubAll=0;Object.keys(HS).forEach(function(d){allScripts(d).forEach(function(x){if(stOf(x.id)==='pub')pubAll++})});

  document.getElementById('stats').innerHTML=
    st('今日新稿',all.length,'')+st('待拍',cnt.pick,'')+st('逾期',od.length,'od')+st('累计已发',pubAll,'dn');

  var show=items.slice(0,8);
  document.getElementById('todayN').textContent=items.length?(items.length+' 项待办'):'全部清空';
  document.getElementById('tlist').innerHTML=show.length?show.map(function(i){
    var nx=i.kind==='new'?'pick':(i.kind==='pick'?'shot':'pub');
    var lb=i.kind==='new'?'选用':(i.kind==='pick'?'标已拍':'标已发');
    return '<div class="titem'+(i.od?' od':'')+'">'+
      '<div class="bd"><div class="t">'+esc(i.x.topic.title)+'　·　'+esc(i.x.sc.angle)+'</div>'+
      '<div class="m">'+(i.x.date!==PACK_TODAY.date?('['+i.x.date+'] '):'')+esc(i.msg)+'</div></div>'+
      '<button class="go" onclick="setSt(\''+i.x.id+'\',\''+nx+'\')">'+lb+'</button></div>';
  }).join('')+(items.length>8?'<div style="text-align:center;font-size:12px;color:var(--text3);padding-top:4px">还有 '+(items.length-8)+' 项，去口播稿库看全部</div>':'')
  :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>今天没有待办，去选题池挑几条</div>';

  document.getElementById('navBdg').style.display=od.length?'':'none';
  document.getElementById('navBdg').textContent=od.length;

  var p=PACK_TODAY;
  document.getElementById('ovCnt').textContent=p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题 / '+all.length+' 稿';
  document.getElementById('overview').innerHTML=p.tracks.map(function(tk){
    return '<div class="card tk-'+tk.id+'" style="margin-bottom:12px;padding:13px 14px">'+
      '<div style="font-weight:700;font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--'+(tk.id==='travel'?'travel':'ai')+')"></span>'+esc(tk.name)+
      '<span style="margin-left:auto;font-size:11.5px;color:var(--text3);font-weight:600">'+tk.topics.length+' 条</span></div>'+
      tk.topics.map(function(tp,i){
        var done=tp.scripts.filter(function(_,si){return stOf(td+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
        return '<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.5">'+
          '<span style="color:var(--text3);font-weight:700;font-variant-numeric:tabular-nums;flex:none">'+(i+1)+'</span>'+
          '<span style="flex:1;min-width:0">'+esc(tp.title)+'</span>'+
          '<span style="flex:none;font-size:11px;color:'+(done?'var(--ok)':'var(--text3)')+';font-weight:700">'+done+'/'+tp.scripts.length+'</span></div>';
      }).join('')+'</div>';
  }).join('');
}
function st(l,v,c){return '<div class="stat '+c+'"><b>'+v+'</b><span>'+l+'</span></div>'}

/* ================= topics ================= */
function renderTracks(){
  var p=packOf(curDate);
  var h='<button class="ttab'+(curTrack==='all'?' on':'')+'" data-k="all" onclick="setTrack(\'all\')">全部<span class="s">'+
    p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题</span></button>';
  p.tracks.forEach(function(tk){
    h+='<button class="ttab'+(curTrack===tk.id?' on':'')+'" data-k="'+tk.id+'" onclick="setTrack(\''+tk.id+'\')">'+esc(tk.name)+'<span class="s">'+tk.topics.length+' 选题</span></button>';
  });
  document.getElementById('ttabs1').innerHTML=h;
  document.getElementById('ttabs2').innerHTML=h;
  var f=[['all','全部'],['new','未处理'],['pick','已选用'],['shot','已拍'],['pub','已发']];
  document.getElementById('stfilter').innerHTML=f.map(function(x){
    return '<button class="ttab'+(curSt===x[0]?' on':'')+'" data-k="all" style="font-size:12.5px;padding:8px 4px;min-height:40px" onclick="setStF(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function setTrack(t){curTrack=t;renderTracks();renderTopics();renderScripts()}
function setStF(s){curSt=s;renderTracks();renderScripts()}
function renderTopics(){
  var p=packOf(curDate),h='';
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    h+='<div class="topics-grid">'+tk.topics.map(function(tp,i){
      var fid=tk.id+'_'+tp.id;
      var done=tp.scripts.filter(function(_,si){return stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
      return '<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main">'+
        '<div class="tp-t">'+esc(tp.title)+'</div>'+
        '<div class="tp-tags"><span class="tag hot">热度 '+esc(tp.heat)+'</span>'+
        (tp.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
        '<span class="tag">'+done+'/'+tp.scripts.length+' 已处理</span></div>'+
        '<div class="tp-why"><b>开场钩子：</b>'+esc(tp.hook)+'<br><b>为什么今天做：</b>'+esc(tp.why)+'</div>'+
        '</div></div>'+
        '<div class="fold"><button class="fold-b" onclick="fold(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>事实与数据（'+(tp.facts||[]).length+' 条，念之前先扫一眼）</button>'+
        '<div class="fold-c"><ul class="facts">'+(tp.facts||[]).map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div></div>'+
        '<div class="scripts">'+tp.scripts.map(function(sc,si){return scHtml(tk,tp,sc,si)}).join('')+'</div>'+
        '</div>';
    }).join('')+'</div>';
  });
  document.getElementById('topicList').innerHTML=h||'<div class="card"><div class="empty">这天没有内容</div></div>';
}
function scHtml(tk,tp,sc,si){
  var id=curDate+'|'+tk.id+'|'+tp.id+'|'+si,s=stOf(id),n=wc(sc.text),sec=secOf(sc.text);
  var nx=s==='new'?'pick':(s==='pick'?'shot':(s==='shot'?'pub':'new'));
  var nxL=s==='new'?'选用':(s==='pick'?'标已拍':(s==='shot'?'标已发':'重置'));
  var t=stTs(id),od=(s==='pick'||s==='shot')&&t&&daysBetween(t,today())>=1;
  return '<div class="sc">'+
    '<div class="sc-hd"><span class="sc-a">'+esc(sc.angle)+'</span>'+
    '<span class="sc-m">'+n+' 字 · 约 '+sec+' 秒</span>'+
    '<span class="sc-st '+ST_CLS[s]+'">'+ST_LABEL[s]+(od?' · 逾期':'')+'</span></div>'+
    '<div class="sc-tx" onclick="this.classList.toggle(\'open\')">'+esc(sc.text)+'</div>'+
    '<div class="sc-acts">'+
    '<button class="sbtn pri" onclick="copy(this,'+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>'+
    '<button class="sbtn" onclick="openTele('+q(tp.title+' · '+sc.angle)+','+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M6 8h12M6 12h8"/></svg>念稿</button>'+
    '<button class="sbtn '+(od?'od':(s==='pub'?'act':''))+'" onclick="setSt(\''+id+'\',\''+nx+'\')">'+nxL+'</button>'+
    (s!=='new'?'<button class="sbtn" onclick="setSt(\''+id+'\',\'new\')">撤销</button>':'')+
    '</div></div>';
}
function q(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')+"'"}
function fold(b){b.classList.toggle('open');b.nextElementSibling.classList.toggle('open')}

function renderScripts(){
  var p=packOf(curDate),h='',n=0;
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    tk.topics.forEach(function(tp,i){
      var list=tp.scripts.map(function(sc,si){return {sc:sc,si:si}}).filter(function(o){
        return curSt==='all'||stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+o.si)===curSt;
      });
      if(!list.length)return;
      n+=list.length;
      h+='<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd" style="padding-bottom:0"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main"><div class="tp-t" style="font-size:14.5px">'+esc(tp.title)+'</div></div></div>'+
        '<div class="scripts" style="border-top:none;margin-top:11px">'+list.map(function(o){return scHtml(tk,tp,o.sc,o.si)}).join('')+'</div></div>';
    });
  });
  document.getElementById('scriptList').innerHTML=h||'<div class="card"><div class="empty">没有符合筛选的稿子</div></div>';
}

/* ================= refs ================= */
var rStar=4;
function renderStars(){
  document.getElementById('rStars').innerHTML=[1,2,3,4,5].map(function(i){
    return '<button class="star'+(i<=rStar?' on':'')+'" onclick="rStar='+i+';renderStars()"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.8.9-5 4.7 1.3 6.8L12 17.4 6 20.7l1.3-6.8-5-4.7 6.8-.9z"/></svg></button>';
  }).join('');
}
function addRef(){
  var t=document.getElementById('rTitle').value.trim();
  if(!t){toast('标题得填一下');return}
  RF.unshift({id:'r'+Date.now(),title:t,track:document.getElementById('rTrack').value,
    author:document.getElementById('rAuthor').value.trim(),link:document.getElementById('rLink').value.trim(),
    star:rStar,note:document.getElementById('rNote').value.trim(),date:today()});
  lsSet(K.rf,RF);
  ['rTitle','rAuthor','rLink','rNote'].forEach(function(i){document.getElementById(i).value=''});
  rStar=4;renderStars();renderRefs();toast('已存进灵感库');checkTip();
}
function delRef(id){RF=RF.filter(function(r){return r.id!==id});lsSet(K.rf,RF);renderRefs()}
function renderRefs(){
  document.getElementById('refCnt').textContent=RF.length+' 条';
  var TN={travel:'旅游攻略',ai:'AI 资讯与玩法',other:'其他'};
  document.getElementById('refList').innerHTML=RF.length?RF.map(function(r){
    return '<div class="ref"><div class="ref-h"><div style="flex:1;min-width:0">'+
      '<div class="ref-t">'+esc(r.title)+'</div>'+
      '<div class="ref-m"><span class="tag">'+esc(TN[r.track]||r.track)+'</span>'+
      (r.author?'<span>@'+esc(r.author)+'</span>':'')+
      '<span style="color:#f5a623;letter-spacing:1px">'+'★'.repeat(r.star)+'<span style="color:#dfe3e8">'+'★'.repeat(5-r.star)+'</span></span>'+
      '<span>'+esc(r.date)+'</span></div>'+
      (r.note?'<div class="ref-n">'+esc(r.note)+'</div>':'')+
      (r.link?'<a class="ref-l" href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.link)+'</a>':'')+
      '</div><button class="xbtn" onclick="delRef(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>';
  }).join(''):'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>刷到好片子就存一条，做选题时翻一翻</div>';
}

/* ================= teleprompter ================= */
var teleSize=26,rolling=false,rollT=null,spd=1;
function openTele(t,x){
  document.getElementById('teleTitle').textContent=t;
  document.getElementById('teleTx').textContent=x;
  document.getElementById('teleBd').scrollTop=0;
  document.getElementById('tele').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeTele(){stopRoll();document.getElementById('tele').classList.remove('on');document.body.style.overflow=''}
function teleFont(d){teleSize=Math.max(16,Math.min(52,teleSize+d));document.getElementById('teleTx').style.fontSize=teleSize+'px'}
function toggleRoll(){rolling?stopRoll():startRoll()}
function startRoll(){
  rolling=true;
  document.getElementById('rollBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>暂停';
  var bd=document.getElementById('teleBd');
  rollT=setInterval(function(){
    bd.scrollTop+=spd*0.6;
    if(bd.scrollTop+bd.clientHeight>=bd.scrollHeight-2)stopRoll();
  },28);
}
function stopRoll(){
  rolling=false;if(rollT)clearInterval(rollT);rollT=null;
  var b=document.getElementById('rollBtn');
  if(b)b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9z"/></svg>自动滚动';
}
function rollSpeed(d){spd=Math.max(.4,Math.min(3,+(spd+d*.2).toFixed(1)));document.getElementById('spdTx').textContent='×'+spd.toFixed(1)}

/* ================= backup ================= */
function doExport(){
  var d={_app:'kouban-workbench',_v:1,_at:new Date().toISOString(),status:ST,refs:RF,history:HS};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='选题台备份_'+today()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  MT.lastBackup=today();lsSet(K.mt,MT);hideTip();toast('已导出备份文件');
}
function doImport(el){
  var f=el.files&&el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      if(d.status)ST=Object.assign({},d.status);
      if(d.refs&&d.refs.length!==undefined)RF=d.refs.slice();
      if(d.history)for(var k in d.history){if(!HS[k])HS[k]=d.history[k]}
      HS[PACK_TODAY.date]=PACK_TODAY;
      lsSet(K.st,ST);lsSet(K.rf,RF);lsSet(K.hs,HS);
      renderAll();toast('已恢复：'+Object.keys(ST).length+' 条标记 / '+RF.length+' 条灵感');
    }catch(e){toast('文件读不出来，确认是本站导出的 JSON')}
    el.value='';
  };
  r.readAsText(f);
}
var mkFn=null;
function askClear(){
  openMask('确认清空全部数据？','会删掉所有标记状态（已选用/已拍/已发）、对标灵感库和历史归档。今天的选题和稿子不受影响，会重新加载。这一步撤不回来，建议先点「导出备份」。',function(){
    localStorage.removeItem(K.st);localStorage.removeItem(K.rf);localStorage.removeItem(K.hs);localStorage.removeItem(K.mt);
    ST={};RF=[];HS={};MT={};HS[PACK_TODAY.date]=PACK_TODAY;lsSet(K.hs,HS);
    closeMask();curDate=PACK_TODAY.date;renderAll();toast('已清空');
  });
}
function openMask(t,p,fn){
  document.getElementById('mkT').textContent=t;document.getElementById('mkP').textContent=p;
  mkFn=fn;document.getElementById('mask').classList.add('on');
}
function closeMask(){document.getElementById('mask').classList.remove('on')}
document.getElementById('mkOk').onclick=function(){if(mkFn)mkFn()};
document.getElementById('mask').onclick=function(e){if(e.target===this)closeMask()};

function checkTip(){
  var n=Object.keys(ST).length+RF.length;
  if(n>=30&&MT.lastBackup!==today()&&!MT.tipHidden){
    document.getElementById('tipTx').textContent='数据已经攒到 '+n+' 条了，建议点右上角导出一份备份。换手机、清缓存都不怕。';
    document.getElementById('tipbar').classList.add('on');
  }else{document.getElementById('tipbar').classList.remove('on')}
}
function hideTip(){MT.tipHidden=today();lsSet(K.mt,MT);document.getElementById('tipbar').classList.remove('on')}

/* ================= misc ================= */
function copy(btn,tx){
  var ok=function(){var o=btn.innerHTML;btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>已复制';setTimeout(function(){btn.innerHTML=o},1400);toast('全文已复制，'+wc(tx)+' 字')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(tx).then(ok,function(){fb()})}else{fb()}
  function fb(){
    var ta=document.createElement('textarea');ta.value=tx;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('复制失败，长按稿子手动选')}
    document.body.removeChild(ta);
  }
}
var tT=null;
function toast(m){
  var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');
  if(tT)clearTimeout(tT);tT=setTimeout(function(){e.classList.remove('on')},2100);
}
function go(p){
  curPane=p;
  document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on')});
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
  window.scrollTo(0,0);
}
function switchDate(d){curDate=d;renderDateSel();renderTracks();renderTopics();renderScripts()}
function renderDateSel(){
  var ks=Object.keys(HS).sort().reverse();
  var h=ks.map(function(d){return '<option value="'+d+'"'+(d===curDate?' selected':'')+'>'+d+(d===PACK_TODAY.date?'（最新）':'')+'</option>'}).join('');
  document.getElementById('dateSel').innerHTML=h;
  document.getElementById('dateSel2').innerHTML=h;
  var bg=curDate===PACK_TODAY.date?'<span class="badge-live">今日最新</span>':'<span class="badge-old">历史归档</span>';
  document.getElementById('dateBadge').innerHTML=bg;
  document.getElementById('dateBadge2').innerHTML=bg;
}
function renderAll(){
  document.getElementById('hdSub').textContent=PACK_TODAY.date+' · 更新于 '+(PACK_TODAY.updatedAt||'10:00')+' · 共 '+allScripts(PACK_TODAY.date).length+' 篇稿';
  var ft='数据只存在这台设备的浏览器里，没有上传服务器。换设备 / 清缓存前记得导出备份。<br>每天 10:00 自动更新新一批选题与口播稿。';
  ['foot1','foot2','foot3','foot4'].forEach(function(i){document.getElementById(i).innerHTML=ft});
  renderDateSel();renderTracks();renderToday();renderTopics();renderScripts();renderRefs();renderStars();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeTele();closeMask()}
});
boot();
</script>
