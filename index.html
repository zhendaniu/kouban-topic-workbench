对比一下，头部城市涨一成，这批城市涨一倍甚至几倍。共同点很清楚，它们手里都握着世界文化遗产、古都格局或者非遗资源，属于以前被当作路过站、今年被当成目的地的城市。7月1号到28号，国内航线旅客运输量超过5635万人次，盘子在扩，增量正在往这些地方跑。要去，趁它们还没被完全定价。"},{"angle":"目的地清单","text":"给一份今年七月客流涨得最猛的国内城市清单，按航旅纵横的数据排。第一个是浙江丽水，旅客量同比数倍增长，好在山水和古村落，人少、消费低、夏天凉快。第二个湖南岳阳，涨约180%，岳阳楼加洞庭湖，一天半就能走完核心，适合从长沙或者武汉延伸出去。第三档是洛阳、大同、普洱、安阳，增幅都超过30%。洛阳看龙门石窟和博物馆，大同看云冈石窟和悬空寺，安阳看殷墟和甲骨文，普洱走茶山和雨林。这四个的共同点是文化密度高、机票和住宿都不贵、暑期尾段还能捡到便宜票。只挑一个的话，我会先去大同，云冈和悬空寺离得近，两天能吃透，夏天温度也舒服。"},{"angle":"趋势判断","text":"今年夏天涨得最快的旅游城市，不在任何一个网红榜单上。头部城市还在正常增长，北京同比约12%，深圳、重庆、广州、成都超7%，都是健康数字。但丽水的旅客量是数倍增长，岳阳约180%，洛阳、大同、普洱、安阳全部超30%。为什么是这批城市，因为游客的需求变了。以前出门是去看知名景点，现在越来越多的人是去看一个具体的东西，一座石窟、一片殷墟、一门非遗手艺。这种需求不认城市名气，只认内容密度。结果就是一批过去被当作中转站的城市，突然接住了增量。这件事对做内容的人也一样，拍还没被拍烂的地方，比在人堆里拍第一千零一个同款机位有用得多。"}]},{"id":"tv3","title":"黔南涨190%、德令哈涨150%，今年最猛的避暑地你可能没听过","hook":"今年避暑涨得最狠的不是大理，是黔南，超190%。","why":"避暑是暑期尾段最后的强需求，冷门地名自带信息增量，观众看完会去搜，完播和评论都好。","heat":"中高","tags":["避暑","小众目的地","夏季出行","客流数据"],"facts":["高温催热避暑游：黔南州到达客流同比增长超190%，德令哈、巴里坤增幅超150%，张家口增长约170%，甘孜、大理、秦皇岛、佳木斯等增幅均超20%（航旅纵横，南方+ 2026-07-31）","去哪儿旅行数据：7月「避暑」相关关键词搜索量环比增长270%，青岛凭借海滨气候跻身酒店预订全国前四，伊犁、贵阳等西部避暑目的地稳居前十（南方+ 2026-07-31）","避暑带分布：西南、西北、华北及东北四个方向清凉目的地客流同时显著增长（航旅纵横，南方+ 2026-07-31）","气温与线路参考：贵州六盘水、贵阳一带夏季约19℃，黑龙江伊春漠河、四川川西、山东威海烟台为主流避暑带（新浪旅游 2026-07-08）","8月20日后为避暑目的地票价二次回落窗口，两来源一致（新浪旅游 2026-07-08；今日头条 2026-07）"],"scripts":[{"angle":"干货直给","text":"今年避暑涨得最猛的地方，名字你可能都念不顺。航旅纵横七月的数据：贵州黔南州到达客流同比增长超190%，青海德令哈和新疆巴里坤增幅超150%，河北张家口涨约170%，甘孜、大理、秦皇岛、佳木斯这些增幅超20%。去哪儿那边，七月避暑关键词搜索量环比涨270%，青岛的酒店预订量冲进全国前四，伊犁和贵阳稳在前十。看这份名单的分布，西南高原、西北戈壁、华北坝上、东北林海，四条避暑带同时被激活。真正的信息藏在增速差里，大理这种成熟目的地涨20%，黔南涨190%，说明人在往更深、更冷门的地方走。剩下这半个月还想避暑，别再往老地方挤了。"},{"angle":"横向对比","text":"同样是避暑，选哪条线差别很大。西南高原线，贵阳六盘水黔南这一带，夏天十九到二十五度，高铁直达，物价低，缺点是七月房间紧张，好在八月下旬回落，黔南今年客流涨超190%，说明路子已经通了。西北戈壁线，德令哈、巴里坤，增幅超150%，白天干热晚上凉，昼夜温差大，风景硬朗，代价是航班少、路程远、自驾要防高反。华北坝上线，张家口涨约170%，离北京最近，周末两天就能来回，适合上班族，缺点是同质化重、周末人多。东北林海线，佳木斯这类增幅超20%，空气和森林是天花板，但交通成本最高。要我选，时间少走坝上，时间够走西南，想拍片子走西北。"},{"angle":"行程规划","text":"按八月下旬这个窗口，给三条能落地的避暑行程。三天短线走张家口坝上，今年到达客流涨约170%，从北京出发高铁加包车，草原、天路、夜里看星星，周中出发能避开本地周末客流。五天中线走贵州，落地贵阳，黔南方向今年涨超190%，荔波小七孔加苗寨侗寨，夏天十九到二十五度，八月下旬机票和房价一起回落。七天长线走青海西北，德令哈这些地方增幅超150%，翡翠湖、雅丹、公路片素材密度最高，注意海拔两千米以上先适应一天再上路。三条线的共同前提都是把出发日压在8月20号之后，票价和人流一起降，同一条航线能回到旺季六折。想省事就选第一条，想出片就选第三条。"}]},{"id":"tv4","title":"跟团被强制购物，新版合同能赔你团费的20%","hook":"强制购物一次赔团费的20%，这条今年3月底就已经生效了。","why":"暑期跟团纠纷高发，硬知识、可保存、评论区会涌出大量真实案例，是天然的高互动选题。","heat":"高","tags":["跟团游","维权","避坑","政策"],"facts":["文化和旅游部、市场监管总局2026年1月印发2026年版团队旅游合同示范文本（文旅市场发〔2026〕5号），自2026年3月31日起全国推行，涵盖境内游、出境游、赴台游、一日游、组团社与地接社、研学旅游共6类（黑龙江省文化和旅游厅《游客签订和履行旅游合同指南（2026版）》；市场监管总局合同示范文本库 GF-2026-2402）","赔偿标准：擅自增加购物次数、延长停留时间，每次赔偿旅游费用总额的10%；强迫或变相强迫购物，每次赔偿旅游费用总额的20%；擅自安排合同约定外的另行付费项目，旅行社承担该项目费用（黑龙江省文化和旅游厅 2026版指南）","行程单须细化至每日景点、游览时长、交通车型、住宿星级、餐饮标准，严禁使用「著名景点」「特色餐」等模糊表述（人民日报系报道 2026）","购物商品不满意可在30日内退换，由旅行社先行垫付退款；游客解约扣费不得超过实际不可退损失，退费须在5个工作日内办结（人民日报系报道 2026）","旅行社须为旅游者发放中英文安全信息卡，不得组织进入未开发未开放区域，不得擅自收集使用买卖游客个人信息（GF-2026-2402 第七条，市场监管总局合同示范文本库）","资质核验渠道：全国旅游监管服务平台可输入旅行社名称查询许可证编号；仅营业执照经营范围含「旅游」不代表具备旅行社资质（黑龙江省文化和旅游厅 2026版指南）","文化和旅游部与金融监管总局2026年7月14日发布提示，警惕借「保险客户旅游」名义的陷阱（文化和旅游部官网 2026-07-14）"],"scripts":[{"angle":"干货直给","text":"跟团游被坑，今年有明确的赔偿标准，很多人还不知道。文旅部和市场监管总局2026年1月印发新版团队旅游合同示范文本，3月31号起全国推行，一共六类，境内游、出境游、赴台游、一日游、组团社地接社、研学旅游都覆盖。核心条款记三个数。旅行社擅自增加购物次数或者延长停留时间，每次赔你旅游费用总额的10%。强迫或者变相强迫购物，每次赔20%。擅自安排合同外的另行付费项目，那笔钱旅行社自己出。另外购物买了不满意，30天内可以退换，旅行社先行垫付。解约退费必须5个工作日内办完。签合同的时候主动要2026年版官方示范文本，别签那些叫协议、承诺书的东西，那些不受这套规则约束。"},{"angle":"避坑清单","text":"暑期跟团，出发前把这几条过一遍。第一，查资质，营业执照和旅行社业务经营许可证缺一不可，经营范围里写着旅游两个字不等于有资质，去全国旅游监管服务平台输名称核对许可证编号。第二，用2026年版官方合同示范文本，不用旅行社自己那套协议。第三，逐条核行程单，新版要求写清每日景点、游览时长、交通车型、住宿星级、餐饮标准，出现著名景点、特色餐这种模糊词，直接要求改。第四，购物场所和自费项目必须在签约时白纸黑字写清楚，签完之后旅行社不能再加。第五，任何变更只认书面补充协议，口头承诺不算数。第六，出发前跟旅行社要安全信息卡。真出问题打12345或者12315，别只在群里吵。"},{"angle":"说人话版","text":"用大白话讲讲新版旅游合同到底改了什么。以前跟团最常见的套路是，行程单写得含含糊糊，什么著名景点、特色餐，到了地方全靠导游临场发挥，中途加两个购物店，你不好意思翻脸就认了。现在这套玩不转了。行程单必须写死，每天去哪、待多久、坐什么车、住几星、吃什么标准，模糊词直接违规。购物店和自费项目要在你签字那一刻就全部列明，签完不能加。加了怎么办，每次赔你团费的10%。逼你买东西呢，赔20%。东西买回来后悔了，30天内能退，旅行社先垫钱。退款不能拖，5个工作日办完。这些不是建议，是全国推行的示范文本条款。签之前主动要2026年版，别嫌麻烦。"}]},{"id":"tv5","title":"出境游今年涨最猛的不是东南亚，是首尔","hook":"大家都在说东南亚，实际涨得最狠的是首尔，同比超30%。","why":"出境选题在同类账号里稀缺，短线决策成本低，观众能立刻对号入座，适合做「三天假去哪」系列。","heat":"中","tags":["出境游","短线","目的地趋势","假期规划"],"facts":["7月出境热门目的地中首尔、曼谷、新加坡居前，首尔到达旅客量同比增长超30%（航旅纵横，南方+ 2026-07-31）","7月出境航线旅客运输量超385万人次，入境超335万人次，同比均实现增长；亚洲短线游占据主流，长线需求稳步恢复（航旅纵横，南方+ 2026-07-31）","长线目的地中伦敦、莫斯科进入出境热门前十，莫斯科同比增长约12%（航旅纵横，南方+ 2026-07-31）","截至7月29日，8月出入境机票预订量超550万张，同比增长超6%（航旅纵横，南方+ 2026-07-31）","入境方面上海、北京、广州稳居前三，广州入境旅客量同比增长超10%，重庆同比增长约28%，成都、厦门、昆明均超10%（航旅纵横，南方+ 2026-07-31）","待核实：首尔增长原因（航程、气温、汇率、免税优势）为常识性归因，未见官方口径解释，口播中作为分析而非事实陈述"],"scripts":[{"angle":"反常识开场","text":"聊出境游，大家默认答案是东南亚。今年七月的数据不是这么说的。航旅纵横的统计里，出境热门目的地前几名是首尔、曼谷、新加坡，其中首尔的到达旅客量同比增长超30%，是这一档里涨得最猛的。曼谷和新加坡稳，但增速没有首尔快。我的理解是三个原因叠在一起。飞行时间两小时出头，一线城市早班机去、晚班机回。夏天首尔比国内多数城市凉快。再加上免税和汇率这两年一直有优势，购物加餐饮的实际支出比很多人想的低。七月整个出境航线旅客运输量超385万人次，同比在涨，盘子在扩。如果你手上只有三天假，首尔的性价比现在确实排在东南亚前面。"},{"angle":"趋势判断","text":"从七月的出境数据能看出两条趋势。第一条，短线还是主力，首尔、曼谷、新加坡占据前排，首尔同比涨超30%。这说明大众出境的决策逻辑是时间优先，两三小时能到、假期两三天能来回的地方吃掉了大部分需求。第二条，长线在实质性回来。伦敦和莫斯科都进了出境热门前十，莫斯科同比涨约12%。长线进前十这件事，信号比短线涨30%更强，因为长线要请长假、要办签证、决策链条长得多，能挤进前十说明已经有人在重新规划年度长假。八月出入境机票预订量超550万张，同比涨超6%。从做内容的角度看，短线拍执行细节，长线拍规划方法，这两条线的观众其实不是同一批人，别混着拍。"},{"angle":"目的地清单","text":"按七月实际客流排，给一份出境短线的选择顺序。第一档首尔，到达旅客量同比涨超30%，两小时航程，夏天比国内大部分城市凉快，三天两晚就能玩明白，适合第一次出境或者假期特别短的人。第二档曼谷，热度稳在前排，胜在物价低、玩法密度高、中文环境友好，缺点是八月正值雨季，行程要留弹性。第三档新加坡，同样在前排，适合带老人小孩，秩序好、交通简单、语言无障碍，代价是住宿贵。长线这边伦敦和莫斯科进了前十，莫斯科同比涨约12%。挑的时候先定假期长度，三天以内只看首尔，五到七天再考虑曼谷和新加坡，十天以上才谈长线。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"8月2号起，AI做的图和视频在欧盟必须打标","hook":"从8月2号开始，AI生成的图片视频不打标，在欧盟就是违规。","why":"直接关系到每一个用AI做内容的人，规则是硬的、有明确时间点，天然带紧迫感，也适合做成出海合规系列。","heat":"高","tags":["AI合规","欧盟AI法","内容标识","出海"],"facts":["欧盟委员会2026年7月31日宣布，自8月2日起扩大《人工智能法》适用范围，开始执行透明度规则和针对通用人工智能模型提供商的相关规则（新华社 2026-07-31；欧盟委员会官网 digital-strategy.ec.europa.eu 2026-07-31）","透明度规则三项要求：聊天机器人等交互式AI系统必须告知用户其正在与AI而非人类互动；AI生成或修改的图像、视频、音频等深度伪造内容必须作出标识；AI生成或修改的内容还须带有机器可读标记（新华社 2026-07-31；央视网 2026-07-31；欧盟委员会官网）","欧盟委员会同日公布首批签署《人工智能生成内容透明度行为准则》的180多家机构名单（央视网 2026-07-31；欧盟委员会官网）","8月2日起欧洲人工智能办公室可对通用人工智能模型提供商执法；对可能造成系统性风险的先进通用AI模型，提供商须履行额外义务以防范网络攻击、模型失控、有害操纵等风险（新华社 2026-07-31）","《人工智能法》2024年8月1日生效，分阶段适用，多数条款于2026年8月2日起适用（新华社 2026-07-31）","招聘、教育、执法、移民管理等领域高风险AI系统规则推迟至2027年12月2日适用；嵌入医疗器械、机械等受监管产品的高风险AI规则推迟至2028年8月2日（新华社 2026-07-31）","待核实：「违规最高罚1500万欧元或全球年营业额3%」仅见于单一财经媒体转述，新华社与央视报道均未提及具体罚额，口播稿中不写具体金额"],"scripts":[{"angle":"干货直给","text":"欧盟的人工智能法从8月2号开始扩大适用范围，这一批新规和做内容的人直接相关，三条硬要求。第一，聊天机器人这类交互式AI系统，必须明确告诉用户它是AI不是人。第二，用AI生成或者修改的图片、视频、音频，也就是深度伪造类内容，必须作出标识。第三，AI生成或修改的内容还要带机器可读的标记，方便自动识别和追踪。同一天，欧洲人工智能办公室开始对通用大模型提供商执法，系统性风险级别的模型还有额外义务。欧盟委员会同时公布了首批签署人工智能生成内容透明度行为准则的机构名单，超过180家。另外，招聘、教育、执法这些高风险场景的规则推迟到2027年12月，嵌入医疗器械和机械的推迟到2028年8月。"},{"angle":"说人话版","text":"用大白话说欧盟这次新规到底管什么，就管三件事。第一件，AI假装成人不行了。客服机器人、陪聊机器人，一上来必须说清楚我是AI。第二件，AI做的图和视频要打标。这里说的深度伪造不只是换脸，AI生成的、AI改过的图片视频音频都算。第三件，光肉眼看得见的标还不够，还得埋一个机器能读的标记，让平台和监管能自动识别出来。生效时间是8月2号，不是征求意见稿，是开始执行。它管的是投放到欧盟市场的产品和内容，人在国内但产品或内容进欧盟的，同样要看。国内这边方向其实一致，AI生成合成内容也有标识要求。做出海内容的，现在就该把打标加进生产流程，别等被下架再补。"},{"angle":"趋势判断","text":"欧盟这次执行的透明度规则，信号比条款本身更重要。规则内容其实不复杂，AI要自报身份，AI生成的图和视频要打标，还要加机器可读标记。真正的变化是执行主体到位了，欧洲人工智能办公室从8月2号开始可以直接对通用大模型提供商执法，同时公布了首批签署透明度行为准则的机构名单，180多家。这意味着合规从纸面进入了操作层。往下推两步。第一步，平台会把标识做成默认动作，生成工具直接在输出里嵌水印，创作者其实不用自己操心。第二步，标识普及之后，没有标识的内容反而变得可疑，识别成本会转嫁给发布者。对做内容的人来说，现在该做的不是抵触，是把打标提前接进生产环节。"}]},{"id":"ai2","title":"全球开发者调用量前五，全是中国模型","hook":"全球开发者真金白银调用的前五个大模型，现在全是中国的。","why":"国产AI叙事既有情绪又有具体数字，立场清晰的评论型内容容易起量，评论区分歧也大。","heat":"高","tags":["国产大模型","开源","OpenRouter","行业数据"],"facts":["OpenRouter最新一周AI大模型调用量榜单，排名前五全部由中国企业研发（央视网 2026-08-02；央视财经）","小米MiMo-V2.5单周调用量10.5万亿Tokens登顶，环比增长12%；该模型今年4月23日正式公测，4月底完成全系列开源（央视网 2026-08-02）","小米MiMo大模型团队产品经理辛燕舒表示：单周调用量从1.5万亿词元涨到10.5万亿，两个月增长六倍多，拿下周榜和月榜双第一（央视网 2026-08-02 现场采访）","7月OpenRouter调用量前五依次为小米MiMo-V2.5、DeepSeek V4 Flash、腾讯HY3、智谱GLM-5.2、DeepSeek V4 Pro；MiMo-V2.5月调用量31.20T，超过DeepSeek V4 Flash的23.58T（央广网 2026-07-28）","腾讯混元Hy3于7月6日正式开源，单周环比增幅超999%，是榜单增长势头最猛的模型（央视网 2026-08-02）","OpenRouter官方披露：中国模型全球市场份额6月初整体超过美国模型；截至7月26日中国模型近28天份额约63.5%，美国模型约35.5%（央广网 2026-07-28）","Hugging Face平台数据显示中国开源模型累计下载量已居全球首位，银行、政务、能源等行业用户倾向下载后本地化部署（央视新闻，前瞻网 2026-08-03 转引）","榜单局限（官方明示）：企业私有化部署、美国封闭API流量不在统计范围内（央视网 2026-08-02）","下载模型的用户主要是独立个人开发者、三到五人规模的初创团队，以及专注AI编程、智能体工具开发的中小厂商（央视网 2026-08-02）","待核实：「MiMo-V2.5-Pro-UltraSpeed 为全球首款通用GPU环境下推理速度突破1000 tokens/s的万亿参数模型」仅见于单一转载来源，央视与央广报道中未见对应表述"],"scripts":[{"angle":"数据向","text":"一组值得记下来的数字。全球多模型聚合平台OpenRouter最新一周调用量榜，前五名全部是中国模型。第一名小米MiMo-V2.5，单周调用量10.5万亿Tokens，环比涨12%。这个模型4月23号才公测，4月底全系列开源，两个多月从单周1.5万亿涨到10.5万亿，六倍多。第二和第五都是DeepSeek，第三是腾讯混元Hy3，7月6号才开源，单周环比增幅超999%，涨得最猛。第四是智谱GLM-5.2。份额层面，OpenRouter官方披露截至7月26号，中国模型近28天份额约63.5%，美国模型约35.5%。这个榜单的价值在于它统计的是全球开发者真实付费调用请求，不是自家宣传数据。局限也说清楚，企业私有化部署和美国封闭API的流量不在里面。"},{"angle":"反常识开场","text":"很多人以为国产模型赢在国内市场，靠的是本土优势。OpenRouter这份榜单直接否掉了这个说法。这个平台聚合的是全球数万海外独立开发者和中小AI应用的真实付费调用，统一计量口径，跟国内市场没关系。结果是前五全部中国模型，小米MiMo-V2.5单周10.5万亿Tokens登顶。海外开发者为什么用？央视采访里小米团队给的答案很实在，下载模型的主要是独立开发者、三到五人的初创团队、做AI编程和智能体工具的中小厂商。这类团队养不起全套AI底座，看的就是推理成本够低、智能体跑得够稳。开源加低成本，这是能被全世界小团队直接抄走的组合。中国模型近28天全球份额约63.5%，靠的不是主场。"},{"angle":"创作者视角","text":"这份榜单对个人做内容的人意味着什么，说三点。第一，用模型的成本还在往下走。前五全是中国模型，其中多数开源，小米MiMo-V2.5四月底就全系列开源了，腾讯混元Hy3七月六号开源，能自己部署的团队越来越多，API价格被压得很低。第二，能力差距在缩小。榜上排第二和第五的DeepSeek，旗舰版在代码和复杂智能体任务上对标海外顶级闭源模型，这意味着你不用为了效果非绑一家海外服务。第三，也是最实际的一点，选型别只看榜。这个榜统计的是海外开发者的付费调用，不含企业私有部署和美国封闭API流量。你要做的是拿自己真实的活去测三个模型，比出稿质量和单条成本，别照抄别人的答案。"}]},{"id":"ai3","title":"两千美元，AI解开了数学家几十年没啃下来的题","hook":"两千美元的算力账单，换来十个数学家几十年没解开的结论。","why":"数字冲击力强，且「AI能不能做原创研究」是有争议的话题，评论区会分裂，互动数据好看。","heat":"高","tags":["OpenAI","Astra","AI科研","前沿模型"],"facts":["OpenAI发布研究文章，正式披露代号Astra的下一代大模型，内部版本在数学与理论计算机科学领域取得十项进展，所解决问题在过去至少十年内未有实质性突破（腾讯研究院AI速递 2026-08-03；新浪科技 2026-08-03）","涉及领域包括高维几何、编码理论、算术电路复杂性、群论、量子复杂性、格密码学、极值组合学（腾讯研究院AI速递 2026-08-03；新浪科技 2026-08-03）","具体成果包括非sofic群的存在性证明、否证Connes刚性猜想、高维球体堆积的新边界、解决数学家Erdős提出的多个问题（同上，两来源一致）","按Sol API 的token计费口径，解决这些问题的总成本约2000美元（腾讯研究院AI速递 2026-08-03；新浪科技 2026-08-03）","工作流程：人类研究人员利用Astra构建论证思路并撰写手稿，随后Astra将每一个论证形式化为Lean证书，使证明过程能通过数学验证系统检验（同上，两来源一致）","The Information独立确认OpenAI正在开发Astra，是专为长时运行工作负载设计的新模型家族，支持AI智能体在更大问题的不同部分上协作（新浪科技 2026-08-03 转引 The Information）","Astra最终命名尚未决定，可能以GPT-5.7、GPT-6或其他名称发布（新浪科技 2026-08-03）","待核实：「附249页技术论文」仅见于单一来源，其余报道未提及页数"],"scripts":[{"angle":"反常识开场","text":"AI做数学题这件事，之前的共识是它只会做已经有答案的题。这个共识刚被打破。OpenAI公布了代号Astra的下一代模型，内部版本在数学和理论计算机科学里给出了十项新结果，这些问题在过去至少十年没有实质性突破，有的困扰学界更久。领域包括高维几何、编码理论、群论、量子复杂性、格密码学、极值组合学。具体成果里有非sofic群的存在性证明，否证了Connes刚性猜想，给出高维球体堆积的新边界，还解决了数学家埃尔德什提出的几个问题。最扎心的是成本，按token计费，这十项结果总共烧了大约两千美元。两千美元，不到一台好点的笔记本。这条路一旦跑通，科研的成本结构就要重写。"},{"angle":"故事切入","text":"想象一个场景。一个研究员打开对话框，把一个悬了几十年的数学问题丢进去，模型给出一条论证思路，他顺着这条思路把手稿写出来，然后让模型把每一步都翻译成Lean形式化证明，交给机器去验证对错。这不是设想，是OpenAI这次公布的Astra的实际工作流程。十项结果就是这么出来的，覆盖高维几何、群论、格密码学这些硬骨头领域，包括否证Connes刚性猜想、解决多个埃尔德什问题。整个过程的token账单大约两千美元。这里面最关键的其实不是模型多聪明，是Lean那一步。AI可以胡说，但形式化证明系统不会认。人负责问对问题，AI负责给思路，机器负责判对错，三方各干各的，谁也别越界。"},{"angle":"方法论","text":"从Astra这件事里能提炼出一个普通人能用的方法。OpenAI公布的十项数学新结果，流程是三段式，人构建问题和手稿，模型生成论证思路，再由模型把论证形式化成Lean证书交给验证系统检查。三段各解决一个问题，人解决问对方向，模型解决产量，验证系统解决可信度。这套结构可以搬到很多地方。你用AI写方案，模型出的东西看着都对，问题是没有验证环节。那就给它加一个，写代码就跑测试，做数据就对源头，写文案就过一遍事实清单。核心不是让模型更聪明，是给它的输出加一道机器能执行的校验。顺带说个数字，这十项结果的token成本约两千美元，Astra叫什么名字还没定。"}]},{"id":"ai4","title":"GPT-5.6 入门款降价80%，AI调用又便宜了一档","hook":"入门款输入价格直接砍掉八成，上量的人最先感受到。","why":"成本是所有用AI做量产内容的人最关心的变量，能直接换算成「我一个月省多少钱」，实用性极强。","heat":"中高","tags":["OpenAI","AI成本","选型","降价"],"facts":["OpenAI下调GPT-5.6价格：入门款Luna输入从每百万token 1美元降至0.2美元，输出从6美元降至1.2美元，降幅80%（量子位 2026-08-01；腾讯研究院AI速递 2026-08-03，两来源一致）","主力款Terra降价20%，输入每百万token 2美元、输出12美元（量子位 2026-08-01；腾讯研究院AI速递 2026-08-03，两来源一致）","旗舰款Sol维持原价，新增Fast mode，速度最高达标准模式的2.5倍（两来源一致）","待核实且存在来源冲突：Fast mode 是否额外收费两家说法不一，腾讯研究院称「价格翻倍」，量子位称「不额外收费」，口播稿中不采用这一条","待核实：「OpenAI称Sol参与优化自身生产系统，重写GPU Kernel使服务成本降20%」仅见于单一来源","对照参考：DeepSeek-V4-Flash 正式版定价为每百万输入token 1元、输出2元，采用MIT许可证开源权重，284B总参数、13B激活的MoE架构，支持1M上下文（前瞻网 2026-08-03；Artificial Analysis 与 Hugging Face 数据 2026-08-01）"],"scripts":[{"angle":"成本账","text":"OpenAI这轮降价，算成实际的钱是这样。GPT-5.6入门款Luna，输入价格从每百万token一美元降到零点二美元，输出从六美元降到一点二美元，整整砍掉八成。主力款Terra降20%，输入两美元、输出十二美元。旗舰款Sol价格不动，但加了个快速模式，速度最高到标准模式的2.5倍。换算一下。假设你做批量内容，每天喂进去五十万token、产出十万token，用Luna的话，降价前每天大约一点一美元，降价后大约零点二二美元，一个月从三十三美元降到不到七美元。量小的时候这个差距不明显，一旦上量，省下的是实打实的现金流。真正的意义在于，以前因为成本不敢跑的批量任务，现在可以跑了。"},{"angle":"干货直给","text":"GPT-5.6价格表更新，三档记清楚。入门款Luna，输入每百万token零点二美元，输出一点二美元，比之前降80%，适合跑量大、对质量要求没那么极致的活，比如批量改写、结构化抽取、初稿生成。主力款Terra，输入两美元、输出十二美元，降20%，日常主力，复杂一点的推理和长文交给它。旗舰款Sol，价格不变，新增快速模式，速度最高达标准模式的2.5倍，适合对延迟敏感的交互场景。选型逻辑很简单，先用最便宜的那档跑通流程，跑通之后再判断哪一步真的需要往上换档。大部分人的实际情况是，八成的任务用入门款就够，剩下两成才值得上主力款，别一上来全用旗舰。"},{"angle":"横向对比","text":"把这轮降价放到全球价格表里看更清楚。GPT-5.6入门款Luna降到输入每百万token零点二美元、输出一点二美元。国内这边，DeepSeek V4-Flash正式版的定价是输入每百万token一元、输出两元，而且是MIT许可证开源权重，你可以直接下载自己部署。换算成同一口径，国产开源模型在低价档上依然占优，而且多了本地部署这个选项，数据不出内网。差异在哪。海外闭源胜在生态成熟、接口稳定、文档齐全，国产开源胜在便宜、可控、能改。做选择的时候看两件事，一是数据能不能出去，不能出去就只能选可本地部署的，二是量有多大，量小时候差价可以忽略，量一上来价格就是决定性因素。"}]},{"id":"ai5","title":"AI生成的东西算谁的，国家层面给了时间表","hook":"AI生成的内容到底受不受保护，这次官方规划里给了方向。","why":"所有用AI做内容的人迟早会撞上版权问题，官方定调既有权威性又有讨论空间，适合做严肃向的立场内容。","heat":"中高","tags":["AI版权","政策","知识产权","创作者"],"facts":["国务院2026年7月27日印发《知识产权保护和运用「十五五」规划》（国发〔2026〕30号）（中国政府网 gov.cn 2026-07；央视 2026-08-01）","规划原文：完善算法、人工智能生成物以及与平台经济发展相关的知识产权保护规则；探索构建数据知识产权保护规则；加强开源知识产权协议规则研究，支持建设国内开源社区（中国政府网原文）","规划原文：完善网络出版、网络视听、网络文艺等领域版权保护制度和交易规则（中国政府网原文）","央视解读点出三个待解问题：人工智能生成内容是否能够获得知识产权保护、人工智能训练过程中使用的数据是否需要获得授权、人工智能生成侵权内容后的责任如何划分（央视 2026-08-01）","目标：到2030年知识产权综合实力和国际竞争力进一步增强，到2035年知识产权强国基本建成；设6项预期性指标，含每万人口高价值发明专利拥有量大于22件（中国政府网 2026-07；央视 2026-08-01）","规划提出实施「知识产权与人工智能双向赋能工程」，从知识产权促进人工智能技术创新、强化人工智能技术在知识产权领域应用两方面提出举措（中国政府网 2026-07；央视 2026-08-01）","面向国际：深入研究和参与人工智能、大数据、绿色低碳等新兴领域知识产权国际规则和标准制定（中国政府网 2026-07）","注：本条选题的政策原文已在中国政府网核对，属官方一手来源，并有央视报道交叉印证"],"scripts":[{"angle":"政策解读","text":"国务院7月27号印发了知识产权保护和运用十五五规划，里面有几句和做AI内容的人直接相关。原文写的是，完善算法、人工智能生成物以及与平台经济发展相关的知识产权保护规则，探索构建数据知识产权保护规则，加强开源知识产权协议规则研究，支持建设国内开源社区。另外还提到完善网络出版、网络视听、网络文艺等领域的版权保护制度和交易规则。翻译成人话，三个悬了很久的问题被正式摆上桌，AI生成的内容能不能受保护，训练数据要不要授权，AI生成了侵权内容责任算谁的。规划给的是五年周期，到2030年是第一个节点。现在这些问题还没有终局答案，但方向定了，不是一刀切禁止，是建规则。"},{"angle":"说人话版","text":"用AI做内容的人，早晚要问一个问题，我用AI生成的东西算不算我的。现在这个问题有了官方回应的方向。国务院印发的知识产权十五五规划里明确要完善算法和人工智能生成物的知识产权保护规则。央视的解读把三个具体难题拎了出来，AI生成的内容能不能获得知识产权保护，AI训练用的数据需不需要授权，AI生成侵权内容之后责任怎么划分。这三个问题现在都没有标准答案，但被写进国家级规划意味着未来五年会陆续有规则落地。对个人创作者的现实建议就两条。一，保留创作过程记录，你的提示词、修改痕迹、二次加工都是主张权利的证据。二，别拿明显有版权的素材去喂模型，规则落地之后这类风险最先暴露。"},{"angle":"创作者视角","text":"这份规划里有一条被讨论得少但很重要，加强开源知识产权协议规则研究，支持建设国内开源社区。为什么这条对创作者重要。因为现在国产模型的主流打法就是开源，你能免费下载下来自己跑，靠的就是许可证。许可证的规则如果不清晰，商用的时候就有隐患，用开源模型生成的内容拿去卖，会不会被追诉，取决于协议怎么写、法律怎么认。这条被写进国家规划，说明这个问题被看见了。同一份文件还提到要参与人工智能领域知识产权国际规则和标准的制定。往前看，做AI内容的人要习惯两件事，一是保留自己的创作痕迹，二是搞清楚你用的模型和素材各自是什么授权。这两件事以后会越来越像基本功。"}]}]}]},"2026-08-02":{"date":"2026-08-02","updatedAt":"2026-08-02 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"请3天休13天：国庆机票的黄金窗口就是这两周","hook":"今年九月底有个比春节还长的假，现在不动手就晚了。","why":"8月2号正好卡在国庆机票提前45-60天窗口的起点，这条现在发最值钱，过了8月中旬价值减半。全民相关，转发和收藏都高。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["2026年中秋为9月25日（周五）至27日（周日）共3天，国庆为10月1日（周四）至7日（周三）共7天，中间9月28、29、30日恰为三个工作日（国务院办公厅《关于2026年部分节假日安排的通知》，中国政府网；广州日报、钱江晚报2026年7月转载）","请下9月28-30日三天年假，可拼出9月25日至10月7日共13天连休，比2026年春节假期（9天）多4天（多家媒体口径一致，2026-07-31）","长假机票业内公认最佳预订窗口为提前45至60天，此时航司完成运力投放并集中释放首批折扣舱，8月中上旬即国庆票低位区间（网易《2026中秋国庆13天超长假期订票全攻略》2026-07-31）","中秋属3天小长假，建议提前20至30天预订，避开假期前最后10天的集中涨价（同上）","12306最多提前60天发售火车票，热门方向需卡放票时间抢（同上）","《职工带薪年休假条例》：工龄满1年即可享受至少5天年假，此方案仅消耗3天（新浪转载拼假攻略，2026-07）"],"scripts":[{"angle":"干货直给","text":"今年九月底有个比春节还长的假，很多人还没反应过来。中秋是9月25号周五到27号周日，国庆是10月1号周四到7号周三，中间28、29、30三天正好是工作日。这三天请下来，从9月25号一路休到10月7号，整整13天，比今年春节还多四天。重点在后面：长假机票的最佳预订窗口是提前45到60天，现在8月初，正好卡在国庆票放折扣舱的起点，8月中上旬是全年最划算的下单时段。太早买航司还没放折扣，挂的是基础价；太晚买低价舱早就空了，价格能翻倍。中秋这种三天小长假不一样，提前20到30天订就行，别提前太多。还有火车票，12306最多提前60天卖，热门方向基本卡点秒空，得掐着放票时间。假条我建议这周就去递，用年假别用事假，工资和全勤都不受影响。"},{"angle":"实操流程","text":"想拼这13天长假，按这个顺序走，别搞反了。第一步查年假余额，这套方案只消耗三天年假，工龄满一年就至少有五天，够用。第二步递假条，至少提前15个工作日交，附一份工作交接清单，写清楚谁替你对接，领导驳回的理由就少一大半。第三步等批下来再订票，别倒过来先买票后请假，批不下来退票手续费能吃掉你半张机票。第四步订票卡时间，国庆段提前45到60天，也就是现在到8月中；中秋段提前20到30天，别提前太多。第五步酒店只订能免费取消的房型，热门城市假期前一个月就可能满房，先占位后调整。最后留一手，年假别一次性用光，留一两天应付年底突发。整套流程走下来，钱和假都不浪费。"},{"angle":"反常识开场","text":"越早订票越便宜，这句话在长假上是错的。国庆机票不是一条从低到高的直线，是先高、再低、最后暴涨。太早的时候航司还没完成运力投放，挂的是基础价，折扣舱一张没放；到了提前45到60天，航司定价完成，第一批折扣舱集中释放，这才是全年低点；进入假期前最后十天，低价舱清空，价格直接翻倍。所以现在这个时间点很关键，8月初到8月中，正好是9月底那个13天长假的最佳下单窗口。同理，中秋那三天属于小长假，提前20到30天买就够，你现在冲进去买反而贵。别凭感觉抢，先看日历再看价格。这一趟往返省下来的钱，够你在目的地多住两晚好酒店。"}]},{"id":"tv2","title":"旅行社说欧洲卖不动，机票却跌到近年最低","hook":"跟团价降不下来，机票反而在跌，今年得拆开买。","why":"供需错位形成的窗口期，正好衔接13天长假的目的地决策。信息差强、有反差感，评论区容易吵起来。","heat":"高","tags":["信息差","出境","反直觉"],"facts":["飞友科技数据：2026年7月至8月中意航线计划航班量达1433班，较2019年同期增加565班，增幅约65.1%，国航、东航、海航、川航、吉祥五家航司竞争（腾讯新闻2026-07-25）","同程旅行《2026年暑运出行趋势预测报告》：暑运国际机票均价约1372元（含税费），同比上涨约11%，但中意等运力大增航线涨幅远低于平均水平","深圳、北京多家旅行社反馈今年暑期收客量约为往年七成，深圳业内称整体出团比去年同期差15%、出境差30%（腾讯新闻2026-07-25）","欧洲、美洲地接费用普遍上调，当地水电住宿成本增加，带动地接资源整体上涨约10%（中青旅遨游科技董事长韩杰等受访口径，2026-07-25）","欧洲6月底德国连创高温纪录、法国高温期间死亡人数明显上升，多地住宅和公共场所缺少空调，部分银发客群将西欧行程推迟至9至10月（同上）"],"scripts":[{"angle":"干货直给","text":"今年暑期出境游有个很反常的现象：旅行社说卖不动，机票反而便宜了。北京、深圳多家旅行社反馈，收客量只有往年的七成，出境跟团同比差了三成左右。但同一时间，国际运力在猛涨。中意航线七到八月计划航班量1433班，比2019年同期多了565班，增幅65%，五家航司在同一条线上抢客，票价被压到近年低位。同程的报告显示，暑运国际机票均价1372元，同比涨了11%，但中意这种运力暴增的航线，涨幅远低于平均。结论很清楚：跟团贵，自己飞便宜。欧洲地接成本今年涨了约一成，所以团费降不下来；但机票是市场化定价，供给多了就得让利。会自己订机票订酒店的人，今年占大便宜。"},{"angle":"横向对比","text":"同样去欧洲，今年跟团和自由行的差价拉得特别开。跟团这边，当地水电、住宿、地接费用普遍涨了约一成，旅行社收客又只有往年七成，团凑不满，成本摊不薄，报价降不下来。自由行这边完全相反，国际运力大幅增加，光中意航线七到八月就有1433班，比2019年同期多565班，国航、东航、海航、川航、吉祥五家在抢客，机票被打到近年低位。所以今年的最优解是拆开买：机票自己订，酒店自己订，只在当地买一两个需要中文向导的深度体验。另外提醒一句，欧洲今年高温厉害，六月底德国连创纪录，很多住宅和公共场所没空调，怕热的把行程挪到九、十月，价格更低，人还更少。"},{"angle":"反向劝退","text":"如果你今年打算跟团去欧洲，我劝你再算一笔账。旅行社报价里，地接成本今年涨了大概一成，而机票这块反而在跌，中意航线运力比2019年同期多了65%，五家航司抢客把票价压到近年低位。也就是说，你付的团费里，便宜下来的那部分被拿去补贴涨价的那部分，最后你没享受到机票降价的好处。还有一个现实问题，欧洲多地住宅和公共场所没有空调，今年六月底德国连破高温纪录，法国高温期间死亡人数明显上升，八月的西欧对老人和小孩都不友好。已经有家庭把八月中旬的法意瑞长线直接延到明年寒假。真想去，两个选择：要么机票酒店自己订，要么把时间挪到九月底十月初。"}]},{"id":"tv3","title":"成都飞大理259，八月下旬西南航线跌到1.6折","hook":"成都两百多飞大理，比高铁二等座还便宜。","why":"价格具体到数字，截图感强，适合做低成本口播。八月下旬是唯一窗口，九月一到价格立刻回去。","heat":"中高","tags":["省钱","国内游","可复用"],"facts":["去哪儿旅行数据：8月成都出发多条航线折扣低至1.6折——飞丽江最低270元（1.6折）、大理259元（1.6折）、西双版纳259元（1.8折）、贵阳280元（1.7折）、武汉281元（1.7折）、张家界200元（2.1折）、兰州230元（2.3折）、鄂尔多斯294元（2.3折）（腾讯新闻《早安双流》2026-07-30，票价不含机建燃油，数据截至7月29日）","航旅纵横民航官方直销平台数据：7月21日至8月31日国内航线机票预订量已超2263万张，同比增长超4%（2026-07）","重庆江北暑运国内航线：至西安、黄山、桂林、铜仁低至200元起；至长沙、武汉、南京、广州、上海低至230元起；至大连、珠海、泉州、北海、三亚低至300元起；至兰州、银川、吐鲁番、哈密低至330元起（中国交通报2026-07-01）","成都双流国际机场1号航站楼国际厅于7月30日重新启用，国航、川航、香港航空等7家航司的22个港澳台客运航班由天府机场转回双流（腾讯新闻2026-07-30）","7月1日至21日首乘旅客较6月同期增长超50%，多家航司推出首乘旅客优惠活动（同上）"],"scripts":[{"angle":"干货直给","text":"八月下旬想飞，西南这几条线的价格已经跌到不讲道理了。去哪儿的数据，成都出发部分航线折扣低到1.6折：成都飞大理259，西双版纳259，丽江270，贵阳280，武汉281，张家界200，兰州230，这些还不含机建燃油。重庆那边同样便宜，重庆到西安、黄山、桂林、铜仁两百元起，到长沙、武汉、南京、广州、上海两百三起。为什么这么便宜？暑运后半段学生返校，客座率掉下来，航司必须清仓。航旅纵横的数据，七月21号到八月31号国内航线预订量超过2263万张，同比只涨了4%，运力投放却还在加，价格自然扛不住。想省钱就盯这个区间，周二周三出发再便宜一档。另外成都双流T1国际厅七月30号重新启用了，飞港澳台的别跑错机场。"},{"angle":"避坑清单","text":"成都两百多飞大理，看着爽，但有几个坑得先说。第一，这些折扣价基本不含机建燃油，实际付款要再加一两百，看到259别以为是到手价。第二，1.6折的舱位数量极少，通常绑定不能退改，行程有变数的别贪这个价。第三，特价票多数是早班机或者红眼，落地凌晨机场大巴还没发车，打车进城的钱能把省下的机票钱吃掉一半。第四，行李额，超低价舱经常只给手提，托运要另买，往返多花一两百很常见。第五，成都双流T1国际厅七月30号重新启用，国航、川航、香港航空等七家航司的22个港澳台航班从天府转回双流，出发前一定看清票面机场。避开这五条，这波捡漏才是真便宜。"},{"angle":"数据向","text":"给几个具体数字，你自己判断值不值。航旅纵横的数据，七月21号到八月31号，国内航线机票预订量超过2263万张，同比增长只有4%。需求涨4%，运力还在往上加，结果就是票价撑不住。去哪儿的数据更直观，八月成都出发多条航线跌到1.6到2.3折：丽江270、大理259、西双版纳259、贵阳280、武汉281、张家界200、兰州230。重庆同样，山水线两百元起，都市线两百三起，滨海线三百起，西北线三百三起。这个价格什么概念？成都到大理的高铁二等座都不止这个数。所以八月下旬这段，飞比坐火车划算。要动手趁现在，开学前后这批尾单放完，中秋国庆一到，价格立刻回去。"}]},{"id":"tv4","title":"老外扎堆来中国避暑，被低估的是这批二三线城市","hook":"我们往外跑的时候，外国人正扎堆往中国跑。","why":"强反差，数据来自国家移民管理局，可信度高。角度新，同赛道很少有人从入境游反推国内玩法。","heat":"中高","tags":["反直觉","国内游","有争议"],"facts":["国家移民管理局：2026年上半年入境外国人达2291.4万人次，同比增长20.4%；其中免签入境1781.5万人次，同比上升30.6%（腾讯新闻2026-07-25引述）","网络平台数据：今年暑期入境游预订订单量同比增长超两成；截至6月30日，外籍游客入境航班已覆盖中国160个城市","深圳边检总站：6月以来经深圳机场口岸入境的欧洲国家旅客同比增长31.6%，累计查验入境外国人同比增长超20.6%，以观光休闲为主要目的的游客占比超45.2%（2026-07）","同程旅行旗下国际平台HopeGoo：7月以来爱丁堡、巴塞罗那、伦敦、马德里、罗马飞往中国的机票预订热度环比增幅均超两成，英国至中国主要城市部分航线预订热度同比增幅超80%","海外社交平台热议「到中国避暑」，被反复提及的关键词为全域空调、天然山海生态、消费科技感（腾讯新闻2026-07-25）"],"scripts":[{"angle":"反常识开场","text":"今年夏天最魔幻的一件事：中国人不太出去了，外国人反而扎堆往中国跑。国家移民管理局的数据，2026年上半年入境外国人2291.4万人次，同比增长20.4%，其中免签入境1781.5万人次，涨了30.6%。深圳边检的数字更夸张，六月以来经深圳机场口岸入境的欧洲旅客同比增长31.6%，其中四成五以上是纯观光休闲。同程旗下的国际平台数据，七月以来爱丁堡、巴塞罗那、伦敦、马德里、罗马飞中国的机票预订热度环比都涨了两成以上，英国到中国部分航线同比涨超80%。他们来干什么？避暑。欧洲很多住宅没空调，而中国是全域空调自由，加上山海生态和消费的科技感，这三个词在海外社交平台被反复提。"},{"angle":"故事切入","text":"我一个做民宿的朋友，今年夏天客源结构彻底变了，外国人占了快四成，去年这个数字还不到一成。他一开始以为是偶然，后来发现是趋势。国家移民管理局的数据，上半年入境外国人2291.4万人次，同比增长20.4%，其中免签入境1781.5万人次，涨了30.6%。截至六月30号，外籍游客的入境航班已经覆盖中国160个城市，早就不只是北上广。他们最在意的三件事很实在：空调、自然景观，还有支付和交通方不方便。这给我们的启发是反过来的——老外觉得值的东西，我们习以为常反而不去。真正被低估的，是那些空调覆盖好、山海资源好、消费又不贵的二三线城市。八月下旬机票正在跳水，刚好去试一趟。"},{"angle":"趋势判断","text":"入境游这波不是短期热度，是结构性变化，判断依据有三条。第一，免签政策的效果已经落到数据上，上半年免签入境1781.5万人次，同比涨30.6%，明显快于入境总人次20.4%的增速，说明增量来自政策放开，不是自然恢复。第二，覆盖面在扩大，截至六月30号外籍游客入境航班已经覆盖160个城市，不再集中在几个门户机场。第三，需求端有硬理由，欧洲夏天极端高温，很多住宅和公共场所没空调，而中国是全域空调，这个差距不会因为过一年就消失。对做内容和做生意的人来说，机会在配套上：外语标识、外卡支付、离境退税、机场到景区的接驳。谁先补齐，谁先吃到这批客流。"}]},{"id":"tv5","title":"东南亚免签天数记混，第15天就算逾期滞留","hook":"新马泰30天，菲律宾只有14天，记错了要被罚。","why":"纯避坑向，长效不过期，收藏率高。日常没人专门讲天数差异，属于被忽略的高价值细节。","heat":"中","tags":["避坑","出境","收藏向"],"facts":["新加坡、马来西亚、泰国、菲律宾等热门出境目的地已对持中国普通护照人员实行免签入境：入境新、马、泰单次停留不超过30天，入境菲律宾单次停留不超过14天（中国交通报2026-07-01；各国免签政策适用要求以各国官方发布渠道信息为准）","免签停留天数按单次入境计算，不按自然年或自然月累计","重庆出发直飞曼谷、吉隆坡、马尼拉、新加坡、清迈、沙巴等东南亚免签目的地，单程含税票价低至723元；重庆直飞香港、澳门单程含税低至756元（中国交通报2026-07-01）","泰国普吉岛7、8月北京、上海、广州、深圳等主流城市可搜到2000-3000元往返平价机票（腾讯新闻2026-05-28）","出行前应以目的国官方发布渠道及中国领事服务网的最新政策为准（通用合规提示）"],"scripts":[{"angle":"干货直给","text":"东南亚免签这事，天数记混了是要出问题的。持中国普通护照，新加坡、马来西亚、泰国这三个国家，单次停留不超过30天；菲律宾不一样，单次停留不超过14天。这个天数按单次入境算，不是按一年累计，也不是按自然月。很多人默认都是30天，飞了菲律宾按30天安排行程，第15天就属于逾期滞留，罚款加限制入境，回程还可能被拒登机。第二个提醒，免签是免签证，不是免审查，落地还是要看回程机票、住宿证明和资金能力，材料不齐照样被拒。第三，政策随时会调整，出发前一定去目的国官方渠道或者中国领事服务网再确认一遍。价格方面给个参考，重庆直飞曼谷、吉隆坡、马尼拉、新加坡、清迈、沙巴，单程含税低到723元。"},{"angle":"避坑清单","text":"东南亚免签五条避坑，照着核对一遍再出发。第一，天数别记混，新马泰单次停留不超过30天，菲律宾只有14天，按单次入境算。第二，免签不等于免审查，边检要看回程机票、住宿预订和资金证明，缺一样就可能被要求补充说明。第三，护照有效期，多数国家要求入境时剩余六个月以上，很多人卡在这一条。第四，落地签和免签是两回事，免签不用交钱不用填申请，如果有人让你在机场交现金办手续，先确认是不是走错窗口。第五，政策是动态的，以目的国官方发布和中国领事服务网为准，别信过期攻略。价格上给个参考，重庆直飞曼谷、吉隆坡、马尼拉、新加坡、清迈、沙巴单程含税低至723元，飞香港澳门756元起。"},{"angle":"说人话版","text":"说人话解释一下免签到底是什么。免签就是你不用提前去大使馆递材料、交钱、等审批，拿着护照直接买票就能飞。但落地那一关还在，边检有权问你来干什么、住哪儿、什么时候走、身上有多少钱，答不上来或者材料对不上，一样可以把你退回来。所以免签省的是出发前的时间和钱，不是省掉入境审查。具体天数，新加坡、马来西亚、泰国单次停留不超过30天，菲律宾单次不超过14天，这个差别一定记住。还有一点，天数从入境当天开始算，不是从你买票那天算。出发前一周，去目的国官方渠道或者中国领事服务网核一遍最新政策，两分钟的事，能省掉一趟白跑。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"美团开源1.6T大模型，五万张国产卡跑通万亿参数","hook":"国产卡能不能扛万亿参数？这次有答案了。","why":"国产算力突破，情绪价值和信息量都足，评论区容易自发讨论。官方一手来源，安全。","heat":"高","tags":["强时效","国产","泛人群"],"facts":["美团正式开源万亿参数大模型 LongCat-2.0，总参数1.6T，平均激活约48B，动态范围33B至56B，原生支持1M超长上下文（美团官方新闻稿 meituan.com；美团技术博客 tech.meituan.com，2026-07-28）","官方表述：业界首个在五万卡国产算力集群上完成全流程训练与推理的万亿参数模型，同步开放国产卡推理代码（美团官方，2026-07）","架构上引入 LongCat 稀疏注意力和 N-gram Embedding，为真实 Agentic Coding 任务设计，强化代码理解、生成与执行（美团官方）","针对国产芯片显存与带宽受限，从模型层、芯片适配层、部署策略层三个方向做协同优化，目标是盘活存量国产算力（美团官方）","1M上下文量级参考：《三体》全集约一百多万字，可一次读完（网易转载科普口径，2026-08-01）"],"scripts":[{"angle":"干货直给","text":"美团把自家的万亿参数大模型 LongCat-2.0 开源了，这事比听起来重要。先说参数：总参数1.6T，平均激活约480亿，动态范围330亿到560亿，原生支持一百万token上下文。一百万token什么概念，一本《三体》全集也就一百多万字，它能一口气读完再跟你讨论细节。但真正的关键不是参数，是训练用的卡。官方说法，这是业界首个在五万卡国产算力集群上完成全流程训练与推理的万亿参数模型，而且同步开放了国产卡的推理代码。大模型被卡脖子，卡的就是算力。国产卡能不能扛万亿参数，之前一直是个问号，现在有了一个跑通的样本。美团还专门针对国产芯片显存和带宽受限，从模型架构、芯片适配到部署策略做了三层优化。"},{"angle":"说人话版","text":"用大白话讲讲美团开源这个模型为什么值得关注。第一，规模是真的大，总参数1.6T，也就是一万六千亿，但它每次只激活其中约四百八十亿，相当于养了一个几百人的专家团，来什么活只叫醒相关的几个人，所以又大又省。第二，上下文一百万token，一次能吞下一百多万字，长文档、整个代码库都塞得进去。第三，也是最关键的，它是在五万张国产算力卡上完成全流程训练和推理的，官方称业界首个。以前的普遍疑问是国产卡只能跑小模型，这次等于给了个答案。第四，开源，代码和国产卡推理优化一起放出来，别人可以直接拿去用。对普通人的意义是，国产算力这条路走通了，长期看模型价格还会往下走。"},{"angle":"趋势判断","text":"从美团这次开源，能看出三个走向。第一，国产算力从能用走到了能扛大活。LongCat-2.0总参数1.6T，官方称是业界首个在五万卡国产算力集群上完成全流程训练与推理的万亿参数模型，还同步开放了国产卡推理代码，这个信号比模型本身更重要。第二，大厂的竞争重点在往编程智能体上转。这个模型的架构就是围绕代码理解、生成和执行做的，引入了稀疏注意力和N-gram Embedding，说明大家赌的是模型能不能替人干完整的活，而不是陪你聊天。第三，开源正在变成基础设施策略。把模型和推理优化一起放出去，盘活的是市面上大量闲置的国产卡，这对整个生态的成本结构，影响会很长期。"}]},{"id":"ai2","title":"模型一个字没改，只换了教法，能力涨了六倍","hook":"同一副身体，换套训练方法，成绩差出六倍。","why":"强反直觉，且有硬跑分支撑。可以延伸到教育和个人成长，破圈潜力大。","heat":"高","tags":["反直觉","技术","成本"],"facts":["7月31日，DeepSeek通过API文档发布日志宣布 DeepSeek-V4-Flash 正式版 API 上线公测，V4-Pro 正式版将尽快发布（DeepSeek官方API文档；极客公园2026-08-01）","官方确认 DeepSeek-V4-Flash-0731 的模型结构、尺寸与预览版完全一致，底层基座未做改动，仅重新进行了后训练（DeepSeek官方；TechWeb 2026-08-01；极客网2026-08-01）","九项Agent基准中：DeepSWE 从预览版7.3分升至54.4分；Terminal Bench 2.1 得82.7，高于V4-Pro-Preview的72.1、GLM-5.2的81.0，逼近Opus-4.8的85.0（TechWeb引官方数据，2026-08-01）","规格：MoE架构，总参数2840亿，激活参数130亿，支持100万token上下文，可切换思考/非思考模式（TechWeb 2026-08-01）","网易有道8月1日宣布旗下AI Agent产品矩阵完成V4-Flash正式版全面接入，覆盖LobsterAI、有道词典、翻译、AI同传等，称同等任务复杂度下Token消耗更少（极客网2026-08-01）","待核实：「价格低至0.2元/百万tokens（缓存命中）」「价格仅为Claude的1/90」「Artificial Analysis智能指数50分、同类中位数17分」目前仅见单一媒体口径，未写入口播稿正文"],"scripts":[{"angle":"反常识开场","text":"堆参数不一定是唯一出路，这次DeepSeek给了个很硬的证据。七月31号，DeepSeek-V4-Flash正式版API上线公测。官方明确说明，这个0731版本的模型结构、尺寸和三个月前的预览版完全一致，底层骨架一点没动，只是重新做了一遍后训练。结果呢，智能体能力直接起飞。DeepSWE这个专门测真实长周期编程任务的基准，从预览版的7.3分涨到54.4分，涨了六倍多。Terminal Bench 2.1拿到82.7，超过自家V4-Pro预览版的72.1，也超过GLM-5.2的81.0。同一副身体，换了套训练方法，能力差出这么多。这说明后训练的空间被严重低估了，以后模型进步不一定靠更大，可能靠更会教。"},{"angle":"数据向","text":"把DeepSeek这次更新的数字摆一摆，你自己感受。七月31号，V4-Flash正式版API上线公测。规格是MoE架构，总参数2840亿，激活参数130亿，支持一百万token上下文，可以切换思考和非思考模式。关键在于，官方确认模型结构和尺寸与预览版完全一致，只重新做了后训练。再看跑分：DeepSWE从7.3涨到54.4，Terminal Bench 2.1拿到82.7，对比V4-Pro预览版的72.1、GLM-5.2的81.0、Opus-4.8的85.0，已经贴到第一梯队。落地速度也很快，网易有道八月一号宣布全线产品完成接入，覆盖办公助手、词典、翻译、AI同传，官方口径是同等任务复杂度下Token消耗更少，也就是同样的活花更少的钱。"},{"angle":"创作者视角","text":"这条新闻对普通用户到底意味着什么，我说三点。第一，你手里的AI助手会突然变聪明，不用换设备也不用多花钱。DeepSeek这次只重做了后训练，模型大小没变，但智能体能力涨了好几倍，DeepSWE从7.3到54.4。接入它的产品会跟着升级，网易有道七月31号当天就宣布全线接入了。第二，能干的活变了。以前的AI是你问一句它答一句，现在的重点是多步骤任务和工具调用，你说个目标，它自己拆步骤、自己调工具、自己纠错，Terminal Bench测的就是这个。第三，成本会降，同样的任务用更少的Token跑完，长期看就是同样的钱能干更多活。建议你重新试一遍那些半年前觉得AI干不了的事。"}]},{"id":"ai3","title":"九万人天天在用的AI同事，长什么样","hook":"判断AI产品好不好用，只看一个数：内部多少人天天用。","why":"有官方披露的落地数字，比任何跑分都有说服力。可直接迁移成个人工作流方法，实用性强。","heat":"中高","tags":["玩法","实用","可复用"],"facts":["搭载 LongCat 2.0 的美团全场景 AI Agent 平台 CatPaw 正式上线，提供开箱即用的AI智能工作台与企业级Agent开发托管能力（美团技术博客 tech.meituan.com，2026-07-28）","官方披露：CatPaw 已在美团内部大规模落地，累计覆盖9万员工、搭建Agent 3万个（同上）","支持移动端App与PC客户端双端任务实时同步；云端模式支持7×24小时不间断运行，本地设备关机或断网不受影响，长程任务与定时任务在云端持续运转（同上）","内置专家与技能库，覆盖门店评价诊断与优化、商品文案生成、营销物料设计评估、活动策划、经营数据分析等场景，可从专家广场一键安装，也可通过对话把自己的工作方式封装为专属专家（同上）","企业侧提供数字员工能力：扫码即可在飞书、企业微信中部署，@即可调用；Agent运行环境严格隔离、凭证集中托管（网易转载官方口径，2026-08-01）"],"scripts":[{"angle":"功能详解","text":"美团上线了一个叫CatPaw的AI智能体平台，搭载自家的LongCat 2.0，几个设计值得看。第一，三端打通。手机、电脑、云端任务实时同步，手机上发起任务，电脑上接着干，云端支持七乘二十四小时跑，本地关机断网都不影响，长任务和定时任务在云上继续，第二天打开就有结果。第二，专家和技能库。它把能力封装成一个个AI专家，从专家广场一键安装，也可以把自己的工作方式通过对话打包成专属专家，团队共享复用。内置技能覆盖门店评价诊断、商品文案生成、营销物料评估、活动策划、经营数据分析，都是美团在本地生活攒了十几年的东西。第三，企业能扫码在飞书或者企业微信里部署一个数字员工，@一下就干活，运行环境隔离，凭证集中托管。"},{"angle":"实操流程","text":"想把AI真正用进日常工作，可以参考CatPaw这套路径，跟你用什么工具无关。第一步，别追求一个万能助手，先把你重复度最高的三件事列出来。美团内部覆盖九万员工、搭了三万个Agent，平均下来就是每人几个小工具，不是一个大而全的东西。第二步，把这些活封装成固定的专家或者模板，一次配好长期复用，而不是每次重新写提示词。第三步，把长任务丢到云端跑。CatPaw的云端模式支持七乘二十四小时，本地关机也在跑，这个思路值得抄——耗时的活睡前发起，早上收结果。第四步，接进你已经在用的沟通工具，飞书或者企业微信里@一下就能用，比让团队再装一个新App的落地率高得多。第五步，权限和凭证要隔离，这条别省。"},{"angle":"方法论","text":"判断一个AI产品是不是真能用，我只看一个指标：内部有多少人天天用。美团公布CatPaw已经覆盖九万员工、搭建了三万个Agent，这个数字比任何跑分都有说服力，因为九万人不会天天配合你演示。围绕这个标准，看AI工具可以问三个问题。第一，它有没有在真实业务里跑，还是只在发布会里跑。第二，它解决的是不是高频重复的活，像门店评价诊断、商品文案、经营数据分析这类，频次够高才值得投入配置成本。第三，它能不能嵌进现有的工作流。CatPaw选择在飞书和企业微信里部署数字员工，而不是让你再开一个新App，这个选择很关键。工具再强，如果要改变团队习惯才能用，落地率就会很低。"}]},{"id":"ai4","title":"游戏公司86%都在用AI，Steam上AI辅助的游戏破了一万款","hook":"游戏行业里，不用AI的已经是少数派。","why":"行业渗透率数据够硬，86%这个数字本身就是钩子。可延伸到任何行业的从业者焦虑，覆盖面广。","heat":"中高","tags":["行业","趋势","泛人群"],"facts":["8月1日ChinaJoy期间披露，中国音像与数字出版协会数据显示当前游戏企业AI技术普及率已达86%（蓝鲸新闻2026-08-01）","Steam平台标注为AI辅助创作的游戏已突破一万款（同上）","Unity中国发布团结引擎2.0，并推出AI开发智能体 Tuanjie Codely（同上）","7月31日ChinaJoy上腾讯游戏展示覆盖研发全流程的AI工具体系，《猫仙札》将AI Agent与女性向叙事结合，《代号Craft》支持自然语言生成可运行游戏雏形（九派娱乐2026-08-01）","行业讨论重点从「能不能用」转向「怎么用好Agent」（蓝鲸新闻2026-08-01）"],"scripts":[{"angle":"数据向","text":"游戏行业的AI渗透率，比大部分人想的高得多。ChinaJoy期间，中国音像与数字出版协会披露的数据：当前游戏企业AI技术普及率已经达到86%。同时，Steam平台上标注为AI辅助创作的游戏已经突破一万款。工具侧也在跟进，Unity中国发布了团结引擎2.0，推出AI开发智能体Tuanjie Codely。腾讯游戏在七月31号的展台上，拿出了覆盖研发全流程的AI工具体系，其中《代号Craft》支持用自然语言生成可运行的游戏雏形。把这几条放一起看，行业讨论的重点已经从能不能用AI，变成了怎么用好智能体。86%这个数字的意思是，不用AI的才是少数派。对从业者来说，问题不再是要不要学，而是学哪一段。"},{"angle":"趋势判断","text":"游戏行业86%的AI普及率，说明了一件事：AI已经过了尝鲜期，进入标配期。判断依据有三条。第一，供给端产能被放大，Steam上标注AI辅助创作的游戏突破一万款，这个量级意味着独立开发者的门槛被拉平，以前需要一整个美术团队才能做的东西，现在一个人可能就能出雏形。第二，工具链在往引擎层沉。Unity中国的团结引擎2.0直接带了AI开发智能体Tuanjie Codely，说明AI不再是外挂插件，而是进了生产管线。第三，大厂在做体系而不是单点，腾讯游戏展示的是覆盖研发全流程的工具体系，《代号Craft》能用自然语言生成可运行的游戏雏形。产能上来之后，稀缺的就不再是做得出来，而是有没有人愿意玩。"},{"angle":"反常识开场","text":"AI让做游戏变容易了，但这对开发者可能不是好消息。数据摆着：游戏企业AI技术普及率已经到86%，Steam上标注AI辅助创作的游戏突破一万款。工具也在往下沉，Unity中国的团结引擎2.0带了AI开发智能体，腾讯的《代号Craft》能用自然语言生成可运行的游戏雏形。听上去是门槛降低、人人可做。问题在于，门槛降低是对所有人降低的。以前你的护城河可能是会用引擎、能写着色器、能建模，这些技能的稀缺性正在被抹平。当供给端一年多出上万款游戏，玩家的注意力并没有跟着变多。所以真正值钱的东西在往两头跑：一头是审美和创意，一头是发行和分发。中间那段纯执行的活，最先被吃掉。"}]},{"id":"ai5","title":"AI做内容的成本塌了，接下来拼的不是产能","hook":"素材成本降九成之后，堆量这条路就废了。","why":"直接对着做内容的人群说话，立人设。有上市公司公开数据支撑，长效不过期。","heat":"中","tags":["方法论","成本","立人设"],"facts":["7月30日蓝色光标官宣与字节火山引擎达成AI营销深度合作，自研BlueAI平台接入豆包多模态模型，已落地上百套营销专属智能体，称素材制作成本下降90%以上（腾讯新闻转述，2026-07-30）","蓝色光标2025年AI业务营收37.25亿元，同比增长超210%（同上）","MiniMax于8月1日发布开放权重多模态模型H3：2K分辨率下每秒价格不到主流模型的三分之一，768p不到主流720p的一半（MiniMax官方博客；Momenta Media 2026-08-01）","Steam上标注AI辅助创作的游戏已突破一万款，供给端产能整体放大（中国音像与数字出版协会，2026-08-01）","待核实：「武汉某企业级智能体系统单条视频制作成本降至50元以下、某教育机构月产视频从120条增至超1000条、粉丝三个月从2万增至27万」仅见单一自媒体来源，未写入口播稿正文"],"scripts":[{"angle":"成本账","text":"AI做内容的成本已经塌了，这是今年最确定的一件事。举两个能查到的数字。蓝色光标七月30号官宣和火山引擎的AI营销合作，自研平台接入豆包多模态模型，落地了上百套营销智能体，官方口径是素材制作成本下降90%以上；这家公司2025年的AI业务营收37.25亿元，同比增长超过210%。视频这边，MiniMax八月一号发布的H3，2K分辨率下每秒价格不到主流模型的三分之一，768p不到主流720p的一半。成本降到这个程度，意味着多做一条片子的边际成本接近于零。那接下来拼什么？拼选题、拼真实感、拼你有没有别人拿不到的信息。工具人人都有，成本人人都低，剩下的差距只能在这三样上拉开。"},{"angle":"方法论","text":"成本降了九成之后，内容这行的竞争点变了，我的判断是三条。第一，量不再是壁垒。当素材制作成本能降90%以上，谁都能一天出几十条，堆量这条路会迅速失效，平台的推荐逻辑也会跟着调整。第二，稀缺的是输入不是输出。AI能帮你把想法变成片子，但想法本身、你踩过的坑、你手里的一手数据，它给不了。所以时间该花在采集和验证上，而不是花在剪辑上。第三，人格权重在上升。同样的信息，观众更愿意从一个具体的人嘴里听到，这也是为什么真人出镜、固定人设、稳定更新这三件事的价值在涨。给个具体做法：把省下来的制作时间，一半用来做选题调研，一半用来打磨开头三秒，比多发十条有用。"},{"angle":"创作者视角","text":"如果你现在开始用AI做内容，有三个坑建议提前避开。第一，别用AI写完整的口播稿。它写出来的东西句式高度统一，观众听两句就能察觉，完播率会掉。正确用法是让它帮你查资料、列事实、找反例，稿子自己组织。第二，别追工具。MiniMax的H3把2K每秒价格压到主流模型的三分之一以下，这类降价还会继续发生，工具追不完，而且工具的领先最多也就几周。第三，别只看成本不看分发。蓝色光标那边素材成本降了九成以上，产能上去了，但观众的注意力总量没变，这意味着竞争会更激烈而不是更轻松。真正该投入的是选题判断和一手信息，这两样AI替不了，也是你能长期收租的地方。"}]}]}]}}</script>

<script>
/* ================= data ================= */
var K={st:'wb_kb_status_v1',rf:'wb_kb_refs_v1',hs:'wb_kb_history_v1',mt:'wb_kb_meta_v1'};
var PACK_TODAY=JSON.parse(document.getElementById('packToday').textContent);
var PACK_HIST=JSON.parse(document.getElementById('packHistory').textContent);
var ST={},RF=[],HS={},MT={};
var curDate=PACK_TODAY.date,curTrack='all',curSt='all',curPane='today';
var STATES=['new','pick','shot','pub'];
var ST_LABEL={new:'未处理',pick:'已选用',shot:'已拍',pub:'已发'};
var ST_CLS={new:'st-new',pick:'st-pick',shot:'st-shot',pub:'st-pub'};

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('存储写入失败，建议先导出备份');return false}}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return n<10?'0'+n:''+n}
function daysBetween(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function wc(s){return (s||'').replace(/\s/g,'').length}
function secOf(s){return Math.round(wc(s)/300*60)}

function boot(){
  ST=lsGet(K.st,{});RF=lsGet(K.rf,[]);HS=lsGet(K.hs,{});MT=lsGet(K.mt,{});
  for(var d in PACK_HIST){if(!HS[d])HS[d]=PACK_HIST[d]}
  HS[PACK_TODAY.date]=PACK_TODAY;
  var keys=Object.keys(HS).sort().reverse();
  if(keys.length>30){keys.slice(30).forEach(function(k){delete HS[k]})}
  lsSet(K.hs,HS);
  curDate=PACK_TODAY.date;
  renderAll();
  checkTip();
}
function packOf(d){return HS[d]||PACK_TODAY}
function allScripts(d){
  var p=packOf(d),out=[];
  (p.tracks||[]).forEach(function(tk){(tk.topics||[]).forEach(function(tp,ti){(tp.scripts||[]).forEach(function(sc,si){
    out.push({id:d+'|'+tk.id+'|'+tp.id+'|'+si,date:d,trackId:tk.id,trackName:tk.name,topic:tp,topicIdx:ti,sc:sc,si:si});
  })})});
  return out;
}
function stOf(id){return (ST[id]&&ST[id].s)||'new'}
function stTs(id){return (ST[id]&&ST[id].t)||null}
function setSt(id,s){
  if(s==='new'){delete ST[id]}else{ST[id]={s:s,t:today()}}
  lsSet(K.st,ST);renderAll();checkTip();
}

/* ================= today ================= */
function buildTodo(){
  var td=today(),items=[];
  Object.keys(HS).sort().reverse().forEach(function(d){
    allScripts(d).forEach(function(x){
      var s=stOf(x.id),t=stTs(x.id);
      if(s==='pub')return;
      if(s==='new'){
        if(d===PACK_TODAY.date)items.push({x:x,kind:'new',od:false,msg:'今天新出的稿，还没看'});
        return;
      }
      var age=t?daysBetween(t,td):0;
      if(s==='pick')items.push({x:x,kind:'pick',od:age>=1,msg:age>=1?('选用了 '+age+' 天还没拍'):'今天选用，等拍'});
      if(s==='shot')items.push({x:x,kind:'shot',od:age>=1,msg:age>=1?('拍完 '+age+' 天还没发'):'今天拍完，等发'});
    })
  });
  items.sort(function(a,b){
    if(a.od!==b.od)return a.od?-1:1;
    var o={shot:0,pick:1,new:2};return o[a.kind]-o[b.kind];
  });
  return items;
}
function renderToday(){
  var items=buildTodo(),od=items.filter(function(i){return i.od});
  var td=PACK_TODAY.date,all=allScripts(td);
  var cnt={new:0,pick:0,shot:0,pub:0};
  all.forEach(function(x){cnt[stOf(x.id)]++});
  var pubAll=0;Object.keys(HS).forEach(function(d){allScripts(d).forEach(function(x){if(stOf(x.id)==='pub')pubAll++})});

  document.getElementById('stats').innerHTML=
    st('今日新稿',all.length,'')+st('待拍',cnt.pick,'')+st('逾期',od.length,'od')+st('累计已发',pubAll,'dn');

  var show=items.slice(0,8);
  document.getElementById('todayN').textContent=items.length?(items.length+' 项待办'):'全部清空';
  document.getElementById('tlist').innerHTML=show.length?show.map(function(i){
    var nx=i.kind==='new'?'pick':(i.kind==='pick'?'shot':'pub');
    var lb=i.kind==='new'?'选用':(i.kind==='pick'?'标已拍':'标已发');
    return '<div class="titem'+(i.od?' od':'')+'">'+
      '<div class="bd"><div class="t">'+esc(i.x.topic.title)+'　·　'+esc(i.x.sc.angle)+'</div>'+
      '<div class="m">'+(i.x.date!==PACK_TODAY.date?('['+i.x.date+'] '):'')+esc(i.msg)+'</div></div>'+
      '<button class="go" onclick="setSt(\''+i.x.id+'\',\''+nx+'\')">'+lb+'</button></div>';
  }).join('')+(items.length>8?'<div style="text-align:center;font-size:12px;color:var(--text3);padding-top:4px">还有 '+(items.length-8)+' 项，去口播稿库看全部</div>':'')
  :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>今天没有待办，去选题池挑几条</div>';

  document.getElementById('navBdg').style.display=od.length?'':'none';
  document.getElementById('navBdg').textContent=od.length;

  var p=PACK_TODAY;
  document.getElementById('ovCnt').textContent=p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题 / '+all.length+' 稿';
  document.getElementById('overview').innerHTML=p.tracks.map(function(tk){
    return '<div class="card tk-'+tk.id+'" style="margin-bottom:12px;padding:13px 14px">'+
      '<div style="font-weight:700;font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--'+(tk.id==='travel'?'travel':'ai')+')"></span>'+esc(tk.name)+
      '<span style="margin-left:auto;font-size:11.5px;color:var(--text3);font-weight:600">'+tk.topics.length+' 条</span></div>'+
      tk.topics.map(function(tp,i){
        var done=tp.scripts.filter(function(_,si){return stOf(td+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
        return '<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.5">'+
          '<span style="color:var(--text3);font-weight:700;font-variant-numeric:tabular-nums;flex:none">'+(i+1)+'</span>'+
          '<span style="flex:1;min-width:0">'+esc(tp.title)+'</span>'+
          '<span style="flex:none;font-size:11px;color:'+(done?'var(--ok)':'var(--text3)')+';font-weight:700">'+done+'/'+tp.scripts.length+'</span></div>';
      }).join('')+'</div>';
  }).join('');
}
function st(l,v,c){return '<div class="stat '+c+'"><b>'+v+'</b><span>'+l+'</span></div>'}

/* ================= topics ================= */
function renderTracks(){
  var p=packOf(curDate);
  var h='<button class="ttab'+(curTrack==='all'?' on':'')+'" data-k="all" onclick="setTrack(\'all\')">全部<span class="s">'+
    p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题</span></button>';
  p.tracks.forEach(function(tk){
    h+='<button class="ttab'+(curTrack===tk.id?' on':'')+'" data-k="'+tk.id+'" onclick="setTrack(\''+tk.id+'\')">'+esc(tk.name)+'<span class="s">'+tk.topics.length+' 选题</span></button>';
  });
  document.getElementById('ttabs1').innerHTML=h;
  document.getElementById('ttabs2').innerHTML=h;
  var f=[['all','全部'],['new','未处理'],['pick','已选用'],['shot','已拍'],['pub','已发']];
  document.getElementById('stfilter').innerHTML=f.map(function(x){
    return '<button class="ttab'+(curSt===x[0]?' on':'')+'" data-k="all" style="font-size:12.5px;padding:8px 4px;min-height:40px" onclick="setStF(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function setTrack(t){curTrack=t;renderTracks();renderTopics();renderScripts()}
function setStF(s){curSt=s;renderTracks();renderScripts()}
function renderTopics(){
  var p=packOf(curDate),h='';
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    h+='<div class="topics-grid">'+tk.topics.map(function(tp,i){
      var fid=tk.id+'_'+tp.id;
      var done=tp.scripts.filter(function(_,si){return stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
      return '<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main">'+
        '<div class="tp-t">'+esc(tp.title)+'</div>'+
        '<div class="tp-tags"><span class="tag hot">热度 '+esc(tp.heat)+'</span>'+
        (tp.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
        '<span class="tag">'+done+'/'+tp.scripts.length+' 已处理</span></div>'+
        '<div class="tp-why"><b>开场钩子：</b>'+esc(tp.hook)+'<br><b>为什么今天做：</b>'+esc(tp.why)+'</div>'+
        '</div></div>'+
        '<div class="fold"><button class="fold-b" onclick="fold(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>事实与数据（'+(tp.facts||[]).length+' 条，念之前先扫一眼）</button>'+
        '<div class="fold-c"><ul class="facts">'+(tp.facts||[]).map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div></div>'+
        '<div class="scripts">'+tp.scripts.map(function(sc,si){return scHtml(tk,tp,sc,si)}).join('')+'</div>'+
        '</div>';
    }).join('')+'</div>';
  });
  document.getElementById('topicList').innerHTML=h||'<div class="card"><div class="empty">这天没有内容</div></div>';
}
function scHtml(tk,tp,sc,si){
  var id=curDate+'|'+tk.id+'|'+tp.id+'|'+si,s=stOf(id),n=wc(sc.text),sec=secOf(sc.text);
  var nx=s==='new'?'pick':(s==='pick'?'shot':(s==='shot'?'pub':'new'));
  var nxL=s==='new'?'选用':(s==='pick'?'标已拍':(s==='shot'?'标已发':'重置'));
  var t=stTs(id),od=(s==='pick'||s==='shot')&&t&&daysBetween(t,today())>=1;
  return '<div class="sc">'+
    '<div class="sc-hd"><span class="sc-a">'+esc(sc.angle)+'</span>'+
    '<span class="sc-m">'+n+' 字 · 约 '+sec+' 秒</span>'+
    '<span class="sc-st '+ST_CLS[s]+'">'+ST_LABEL[s]+(od?' · 逾期':'')+'</span></div>'+
    '<div class="sc-tx" onclick="this.classList.toggle(\'open\')">'+esc(sc.text)+'</div>'+
    '<div class="sc-acts">'+
    '<button class="sbtn pri" onclick="copy(this,'+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>'+
    '<button class="sbtn" onclick="openTele('+q(tp.title+' · '+sc.angle)+','+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M6 8h12M6 12h8"/></svg>念稿</button>'+
    '<button class="sbtn '+(od?'od':(s==='pub'?'act':''))+'" onclick="setSt(\''+id+'\',\''+nx+'\')">'+nxL+'</button>'+
    (s!=='new'?'<button class="sbtn" onclick="setSt(\''+id+'\',\'new\')">撤销</button>':'')+
    '</div></div>';
}
function q(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')+"'"}
function fold(b){b.classList.toggle('open');b.nextElementSibling.classList.toggle('open')}

function renderScripts(){
  var p=packOf(curDate),h='',n=0;
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    tk.topics.forEach(function(tp,i){
      var list=tp.scripts.map(function(sc,si){return {sc:sc,si:si}}).filter(function(o){
        return curSt==='all'||stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+o.si)===curSt;
      });
      if(!list.length)return;
      n+=list.length;
      h+='<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd" style="padding-bottom:0"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main"><div class="tp-t" style="font-size:14.5px">'+esc(tp.title)+'</div></div></div>'+
        '<div class="scripts" style="border-top:none;margin-top:11px">'+list.map(function(o){return scHtml(tk,tp,o.sc,o.si)}).join('')+'</div></div>';
    });
  });
  document.getElementById('scriptList').innerHTML=h||'<div class="card"><div class="empty">没有符合筛选的稿子</div></div>';
}

/* ================= refs ================= */
var rStar=4;
function renderStars(){
  document.getElementById('rStars').innerHTML=[1,2,3,4,5].map(function(i){
    return '<button class="star'+(i<=rStar?' on':'')+'" onclick="rStar='+i+';renderStars()"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.8.9-5 4.7 1.3 6.8L12 17.4 6 20.7l1.3-6.8-5-4.7 6.8-.9z"/></svg></button>';
  }).join('');
}
function addRef(){
  var t=document.getElementById('rTitle').value.trim();
  if(!t){toast('标题得填一下');return}
  RF.unshift({id:'r'+Date.now(),title:t,track:document.getElementById('rTrack').value,
    author:document.getElementById('rAuthor').value.trim(),link:document.getElementById('rLink').value.trim(),
    star:rStar,note:document.getElementById('rNote').value.trim(),date:today()});
  lsSet(K.rf,RF);
  ['rTitle','rAuthor','rLink','rNote'].forEach(function(i){document.getElementById(i).value=''});
  rStar=4;renderStars();renderRefs();toast('已存进灵感库');checkTip();
}
function delRef(id){RF=RF.filter(function(r){return r.id!==id});lsSet(K.rf,RF);renderRefs()}
function renderRefs(){
  document.getElementById('refCnt').textContent=RF.length+' 条';
  var TN={travel:'旅游攻略',ai:'AI 资讯与玩法',other:'其他'};
  document.getElementById('refList').innerHTML=RF.length?RF.map(function(r){
    return '<div class="ref"><div class="ref-h"><div style="flex:1;min-width:0">'+
      '<div class="ref-t">'+esc(r.title)+'</div>'+
      '<div class="ref-m"><span class="tag">'+esc(TN[r.track]||r.track)+'</span>'+
      (r.author?'<span>@'+esc(r.author)+'</span>':'')+
      '<span style="color:#f5a623;letter-spacing:1px">'+'★'.repeat(r.star)+'<span style="color:#dfe3e8">'+'★'.repeat(5-r.star)+'</span></span>'+
      '<span>'+esc(r.date)+'</span></div>'+
      (r.note?'<div class="ref-n">'+esc(r.note)+'</div>':'')+
      (r.link?'<a class="ref-l" href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.link)+'</a>':'')+
      '</div><button class="xbtn" onclick="delRef(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>';
  }).join(''):'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>刷到好片子就存一条，做选题时翻一翻</div>';
}

/* ================= teleprompter ================= */
var teleSize=26,rolling=false,rollT=null,spd=1;
function openTele(t,x){
  document.getElementById('teleTitle').textContent=t;
  document.getElementById('teleTx').textContent=x;
  document.getElementById('teleBd').scrollTop=0;
  document.getElementById('tele').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeTele(){stopRoll();document.getElementById('tele').classList.remove('on');document.body.style.overflow=''}
function teleFont(d){teleSize=Math.max(16,Math.min(52,teleSize+d));document.getElementById('teleTx').style.fontSize=teleSize+'px'}
function toggleRoll(){rolling?stopRoll():startRoll()}
function startRoll(){
  rolling=true;
  document.getElementById('rollBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>暂停';
  var bd=document.getElementById('teleBd');
  rollT=setInterval(function(){
    bd.scrollTop+=spd*0.6;
    if(bd.scrollTop+bd.clientHeight>=bd.scrollHeight-2)stopRoll();
  },28);
}
function stopRoll(){
  rolling=false;if(rollT)clearInterval(rollT);rollT=null;
  var b=document.getElementById('rollBtn');
  if(b)b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9z"/></svg>自动滚动';
}
function rollSpeed(d){spd=Math.max(.4,Math.min(3,+(spd+d*.2).toFixed(1)));document.getElementById('spdTx').textContent='×'+spd.toFixed(1)}

/* ================= backup ================= */
function doExport(){
  var d={_app:'kouban-workbench',_v:1,_at:new Date().toISOString(),status:ST,refs:RF,history:HS};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='选题台备份_'+today()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  MT.lastBackup=today();lsSet(K.mt,MT);hideTip();toast('已导出备份文件');
}
function doImport(el){
  var f=el.files&&el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      if(d.status)ST=Object.assign({},d.status);
      if(d.refs&&d.refs.length!==undefined)RF=d.refs.slice();
      if(d.history)for(var k in d.history){if(!HS[k])HS[k]=d.history[k]}
      HS[PACK_TODAY.date]=PACK_TODAY;
      lsSet(K.st,ST);lsSet(K.rf,RF);lsSet(K.hs,HS);
      renderAll();toast('已恢复：'+Object.keys(ST).length+' 条标记 / '+RF.length+' 条灵感');
    }catch(e){toast('文件读不出来，确认是本站导出的 JSON')}
    el.value='';
  };
  r.readAsText(f);
}
var mkFn=null;
function askClear(){
  openMask('确认清空全部数据？','会删掉所有标记状态（已选用/已拍/已发）、对标灵感库和历史归档。今天的选题和稿子不受影响，会重新加载。这一步撤不回来，建议先点「导出备份」。',function(){
    localStorage.removeItem(K.st);localStorage.removeItem(K.rf);localStorage.removeItem(K.hs);localStorage.removeItem(K.mt);
    ST={};RF=[];HS={};MT={};HS[PACK_TODAY.date]=PACK_TODAY;lsSet(K.hs,HS);
    closeMask();curDate=PACK_TODAY.date;renderAll();toast('已清空');
  });
}
function openMask(t,p,fn){
  document.getElementById('mkT').textContent=t;document.getElementById('mkP').textContent=p;
  mkFn=fn;document.getElementById('mask').classList.add('on');
}
function closeMask(){document.getElementById('mask').classList.remove('on')}
document.getElementById('mkOk').onclick=function(){if(mkFn)mkFn()};
document.getElementById('mask').onclick=function(e){if(e.target===this)closeMask()};

function checkTip(){
  var n=Object.keys(ST).length+RF.length;
  if(n>=30&&MT.lastBackup!==today()&&!MT.tipHidden){
    document.getElementById('tipTx').textContent='数据已经攒到 '+n+' 条了，建议点右上角导出一份备份。换手机、清缓存都不怕。';
    document.getElementById('tipbar').classList.add('on');
  }else{document.getElementById('tipbar').classList.remove('on')}
}
function hideTip(){MT.tipHidden=today();lsSet(K.mt,MT);document.getElementById('tipbar').classList.remove('on')}

/* ================= misc ================= */
function copy(btn,tx){
  var ok=function(){var o=btn.innerHTML;btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>已复制';setTimeout(function(){btn.innerHTML=o},1400);toast('全文已复制，'+wc(tx)+' 字')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(tx).then(ok,function(){fb()})}else{fb()}
  function fb(){
    var ta=document.createElement('textarea');ta.value=tx;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('复制失败，长按稿子手动选')}
    document.body.removeChild(ta);
  }
}
var tT=null;
function toast(m){
  var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');
  if(tT)clearTimeout(tT);tT=setTimeout(function(){e.classList.remove('on')},2100);
}
function go(p){
  curPane=p;
  document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on')});
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
  window.scrollTo(0,0);
}
function switchDate(d){curDate=d;renderDateSel();renderTracks();renderTopics();renderScripts()}
function renderDateSel(){
  var ks=Object.keys(HS).sort().reverse();
  var h=ks.map(function(d){return '<option value="'+d+'"'+(d===curDate?' selected':'')+'>'+d+(d===PACK_TODAY.date?'（最新）':'')+'</option>'}).join('');
  document.getElementById('dateSel').innerHTML=h;
  document.getElementById('dateSel2').innerHTML=h;
  var bg=curDate===PACK_TODAY.date?'<span class="badge-live">今日最新</span>':'<span class="badge-old">历史归档</span>';
  document.getElementById('dateBadge').innerHTML=bg;
  document.getElementById('dateBadge2').innerHTML=bg;
}
function renderAll(){
  document.getElementById('hdSub').textContent=PACK_TODAY.date+' · 更新于 '+(PACK_TODAY.updatedAt||'10:00')+' · 共 '+allScripts(PACK_TODAY.date).length+' 篇稿';
  var ft='数据只存在这台设备的浏览器里，没有上传服务器。换设备 / 清缓存前记得导出备份。<br>每天 10:00 自动更新新一批选题与口播稿。';
  ['foot1','foot2','foot3','foot4'].forEach(function(i){document.getElementById(i).innerHTML=ft});
  renderDateSel();renderTracks();renderToday();renderTopics();renderScripts();renderRefs();renderStars();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeTele();closeMask()}
});
boot();
</script>
