2）","越临近中秋价格逐步回升，9月24日北京-太原飙至810元、上海-三亚868元（北京日报2026-09-01）","9月27日至10月1日机票均价创近三年同期最低，部分热门航线比去年低一成以上（去哪儿，新浪/中国商报2026-09-02）"],"scripts":[{"angle":"干货直给","text":"9月头三周是中秋国庆前最后一个机票低价窗口，现在不动手就晚了。去哪儿和航旅纵横的数据，9月首周机票均价比暑期高峰回落了35%，比国庆首日便宜一半，平台上还有大量1折经济舱在售。具体价格：北京直飞太原9月2号裸票230，北京到郑州9月8号160，北京到银川9月6号220；上海直飞三亚在9月23号之前都不超过505。这些低价票多藏在早班、晚班和经停航班里，余票有限先到先得。越临近中秋越贵，北京到太原9月24号就飙到810，上海到三亚868。想捡漏就盯9月头三周。 这波低价不是常驻，是暑期结束到国庆前的空窗，过了九月就回原价。"},{"angle":"实操流程","text":"想抢这波1折机票，按这个顺序走。第一步定出发区间，9月2号到23号是价格洼地，越往后越贵别拖。第二步搜票选周中，周二周三通常比周末便宜15%左右，早班晚班和经停航班藏着特价，北京飞深圳300块的特价就是经停。第三步低价舱基本不能退改，行程有变数的别贪这个价，宁可多花几十买灵活票。第四步看准就锁，热门航线1折舱数量极少，犹豫一小时可能就没了。第五步算总账，这些裸票价不含机建燃油，付款还要加一两百，看到230别当到手价。照这五步能捡到真便宜。 低价票讲究快准狠，别等亲友确认，自己先占再改签最稳。"},{"angle":"反常识开场","text":"越早订越便宜这句话，在9月机票上要反过来看。9月首周均价比暑期回落35%、比国庆首日便宜一半，大量1折舱在售，这恰恰是因为暑期结束、学生返校、客座率掉下来，航司在清仓。所以现在低位靠的是节前空窗，不是靠提前量。等到9月24号中秋前一日，北京到太原从230跳到810，上海到三亚从505跳到868，价格直接翻倍多。结论很明确：这段便宜是窗口性的，你9月初买和8月初买差不多，但9月下旬再买就晚了。捡漏要趁现在，别等。 别迷信提前订就一定便宜，真正决定价格的是需求空窗。九月头三周就是空窗，该出手就出手，拖到节前再买就是翻倍价。"}]},{"id":"tv2","title":"请3休13+双节错峰时间表：9月22日抢跑比国庆首日便宜50%","hook":"今年双节有两个低价时间点，踩对了比国庆首日便宜一半。","why":"拼假是全民话题，且给出具体日期的操作时间表，收藏转发价值高。承接tv1的机票窗口，形成决策闭环。","heat":"高","tags":["强时效","省钱","拼假"],"facts":["中秋9月25-27日、国庆10月1-7日相隔3天，请9月28-30日三天年假可拼13天连休（国务院办公厅放假安排，多家媒体2026-07/09）","9月22日抢跑出发均价较中秋首日(9/25)低30%、较国庆首日(10/1)低50%（去哪儿，新浪/人民网重庆/中国商报2026-09-02）","9月27日至10月1日机票均价创近三年同期最低，部分航线比去年低一成以上（去哪儿，新浪/中国商报2026-09-02）","今年返程高峰分散在10月4-7日，10月4日机票均价比去年返程低超两成（去哪儿，中国商报2026-09-02）","提前一个月锁双节机票热度同比+21%，热门城市酒店提前预订量同比+近四成，9月28-30日请假出游人数同比+52%（去哪儿，新浪2026-09-02）"],"scripts":[{"angle":"干货直给","text":"今年中秋国庆两个假期只隔三天，9月28到30号请三天年假，就能从9月25号一路休到10月7号，整整13天。重点是怎么买票最划算。去哪儿的数据，9月22号抢跑出发，机票均价比中秋首日低30%、比国庆首日低50%；9月27号到10月1号这五天，机票均价创近三年同期最低，部分热门航线比去年还低一成以上。返程也别挤最后两天，今年返程高峰分散在10月4到7号，10月4号机票比去年返程低超两成。所以最优解是：要么9月22号抢跑，要么卡9月27到10月1号这波低点，别去凑10月1号的人潮。"},{"angle":"实操流程","text":"把双节出行拆成一张时间表照着做。第一，假条这周递，请9月28、29、30三天年假拼13天，用年假别用事假，工资全勤不受影响。第二，出发选两个低点：9月22号抢跑，或9月27到10月1号之间走，这两个区间比国庆首日便宜三到五成。第三，返程放10月4到7号，避开10月6、7号的传统高峰，票价更低。第四，酒店只订可免费取消的，热门城市节前一个多月就满房，先占位后调。第五，机票卡提前45到60天窗口现在正合适，热门城市酒店提前订量已同比涨近四成，晚订没房。照表走钱和时间都不浪费。 这样走完，十三天假的钱和时间都不浪费，比盲订省心。"},{"angle":"数据向","text":"给几个数字判断双节出行节奏。去哪儿统计，提前一个月锁定双节机票的热度比去年同期高21%，热门城市酒店提前预订量同比涨近四成，9月28到30号请假出游的人数同比涨52%——说明抢跑的人已经很多。价格上，9月22号出发比国庆首日便宜50%，9月27到10月1号均价创三年最低。返程端，10月4号机票比去年返程低超两成，高峰被拉长到4到7号。结论：今年双节不是单峰而是双峰，中秋前和中间工作日都是低点，国庆首日最贵。会卡时间的人，同样的13天假能省出小一千机票钱。 会卡时间的人，同样十三天假能省出近千元机票钱，这笔账值得算。"}]},{"id":"tv3","title":"西南西北长线赏秋爆发：拉萨航线预订量同比翻4倍","hook":"超长假期带火长线游，拉萨航线预订量同比涨了4倍多。","why":"数据硬、视觉强（秋色+航线爆发），适合做趋势类口播。指向具体目的地，决策参考价值高。","heat":"中高","tags":["长线游","赏秋","数据"],"facts":["截至8月31日，9月25日-10月7日国内航线机票预订量超383万张同比+17%，出入境超177万张同比+11%（航旅纵横，btime 2026-09）","拉萨-上海航线预订量同比增4.4倍、拉萨-北京3.4倍、拉萨-广州3.3倍；西宁-上海、乌鲁木齐-南京、乌鲁木齐-武汉均近2倍（航旅纵横，btime 2026-09）","国内租车订单量同比+超50%，乌鲁木齐、拉萨、伊宁等地订单增超1倍（去哪儿，btime 2026-09）","西藏、新疆、内蒙古、甘肃、青海等赏秋地热度显著增长，超长假期利好长线游（去哪儿/航旅纵横，2026-09）","中秋国庆双节机票搜索热度同比+61%，提前一个月锁定机票热度同比+20%以上（航旅纵横，btime 2026-09）"],"scripts":[{"angle":"干货直给","text":"今年超长假期把长线游彻底带火了，最猛的是进藏航线。航旅纵横截至8月31号的数据，拉萨飞上海预订量同比涨了4.4倍，拉萨飞北京3.4倍，拉萨飞广州3.3倍；西宁飞上海、乌鲁木齐飞南京和武汉也都接近两倍。不止飞机，租车也爆，国内租车订单同比涨超50%，乌鲁木齐、拉萨、伊宁这些地方租车订单翻了一倍多。原因很直接：13天长假以前根本不够跑远，现在够了，大家把目标从周边游挪到了西藏、新疆、内蒙古、甘肃、青海这些赏秋线。想去的现在就得看票，长线舱位比短线紧张得多。 想去的别等，长线舱位比短线紧张，越早看票越有挑选余地。"},{"angle":"数据向","text":"摆一组数据看长线游有多热。航旅纵横截至8月31号：9月25到10月7号国内航线机票预订量超383万张，同比涨17%；出入境超177万张，同比涨11%。结构上，西南西北是绝对主角，拉萨飞上海4.4倍、拉萨飞北京3.4倍、拉萨飞广州3.3倍，西宁飞上海和乌鲁木齐飞南京武汉接近两倍。地面交通同步起飞，租车订单同比涨超50%，乌鲁木齐拉萨伊宁翻倍。双节搜索热度同比涨61%。这些数字说明一个事：今年大家不是不想走远，是以前假期不够长，现在13天窗口一开，长线需求集中释放了。 长线游现在不缺风景，缺的是提前锁舱位，越早订越主动。"},{"angle":"横向对比","text":"同样的花13天假，今年两种玩法差别很大。短线派盯9月头三周的1折票，北京飞太原230、飞银川220，成本低但风景固定。长线派直接冲西南西北，拉萨航线预订量同比翻4倍多，租车订单乌鲁木齐拉萨伊宁翻倍，奔的是西藏新疆的内蒙青海秋色。前者省钱省心，后者体验拉满但票难抢、价格高。我的建议是分两段：去程用低价票进一个中转城市，再租车自驾进景区，把省下的机票钱贴到租车和住宿上。长线游现在不缺风景，缺的是提前锁舱位，越往后越贵越难买。 我的建议是分两段走：低价票进中转城，再租车自驾进景区，把省下的机票钱贴到租车住宿，体验和性价比都拉满。"}]},{"id":"tv4","title":"2026中国护照免签56国清单更新：菲律宾14天、巴西30天、俄罗斯到2027末","hook":"持普通护照能免签去56个国家和地区了，但天数差很多。","why":"长效收藏向，政策类信息沉淀价值高。清单更新是9月1日刚汇总，时效新，纠错旧攻略。","heat":"中高","tags":["收藏向","出境","政策"],"facts":["截至2026年9月1日，持中国普通护照可免签入境56个国家（中国领事服务网，2026-09-01汇总）","菲律宾免签14天，仅限马尼拉/宿务机场入境，政策有效期2026-01-16至2027-01-16（中国领事服务网2026-09-01）","巴西免签：12个月内累计不超30天，双向临时试行免签至2026-12-31（中国领事服务网2026-09-01）","俄罗斯免签：单次≤30天，双向临时对等试行免签政策有效期至2027-12-31（中国领事服务网2026-09-01）","新马泰互免30天（180天累计不超90天）；互免国家含新加坡、马来西亚、泰国、阿联酋、塞尔维亚等29国（中国领事服务网2026-09-01）","待核实：网传俄罗斯免签延至2026-09-14与领事服务网至2027-12-31版本冲突，出发前以官方最新为准"],"scripts":[{"angle":"干货直给","text":"中国领事服务网9月1号刚更新的清单，持普通护照能免签去56个国家和地区了。但天数差很多，别一概而论。新马泰互免30天，180天里累计不超90天；菲律宾只给14天，而且只认马尼拉和宿务两个机场入境；巴西是12个月内累计不超30天，试行到今年12月31号；俄罗斯单次30天，临时免签有效期到2027年底。互免国家一共29个，包括新加坡、马来西亚、泰国、阿联酋、塞尔维亚这些。提醒一句，免签天数按单次入境算，不是按自然年累计，行程安排超了就是逾期滞留。出发前一周再上领事服务网核一遍，政策一直动。"},{"angle":"避坑清单","text":"免签清单更新后，五个坑先核对再出发。第一，天数分档：新马泰30天、菲律宾14天、巴西累计30天、俄罗斯单次30天，按单次入境算别记混。第二，指定口岸：菲律宾只在马尼拉和宿务免签，飞别的城市不行；俄罗斯是临时对等试行，有效期到2027年底。第三，互免和单免不一样，互免免费且对等，单免是对方单方面给，材料要求可能更细。第四，免签不等于免审查，边检照样看返程机票、酒店订单和资金。第五，政策动态，巴西试行到12月31号，到期可能变，出发前上中国领事服务网确认最新版。 出发前一周再上领事服务网核一遍，政策一直动，别信旧攻略。"},{"angle":"说人话版","text":"说人话解释免签清单怎么用。免签就是不用提前去大使馆递材料交钱，拿护照买票就能飞，但落地那一关还在。现在普通护照能免签56个地方，分三档：最稳的是互免29国，新马泰30天、阿联酋30天、塞尔维亚30天，免费且对等；其次是单方面给的，菲律宾14天、巴西累计30天、俄罗斯单次30天，注意有效期和指定口岸；还有落地签和电子签另算。关键提醒：天数从入境当天算，不是从买票算，超一天就算逾期。旧攻略里写的90天、60天很多已经变，2026年一律以领事服务网9月1号版为准。 旧攻略里写的九十天六十天很多已变，二〇二六年一律以领事服务网九月一日版为准，省得白跑。"}]},{"id":"tv5","title":"免签≠落地就进：泰国TDAC+1万泰铢现金，菲律宾14天别记错","hook":"免签最容易栽在入境环节，泰国要填表还要带现金。","why":"纯避坑、强实用，纠错类内容完播和收藏都高。和tv4互补，一个给清单一个给落地细节。","heat":"中","tags":["避坑","出境","实用"],"facts":["泰国入境需提前填电子入境卡TDAC（免费），并备查返程机票、酒店订单（泰国国家旅游局北京办/中国领事服务网，2026-07-09更新）","泰国免签入境需备足额现金：个人≥1万泰铢、家庭≥2万泰铢，海关不定期抽查（泰国《移民法》，泰国国家旅游局北京办2026-07-09）","菲律宾免签仅14天（马尼拉/宿务入境），按单次入境算，误按30天安排会逾期滞留（中国领事服务网2026-09-01）","多国要求出发前1-3天线上填电子入境卡：泰国TDAC、马来西亚MDAC、新加坡SGAC、菲律宾eTravel（各官方渠道）","护照有效期须>6个月、留空白页；免签仍接受入境审查，材料不齐可拒入境（通用合规提示，中国领事服务网）"],"scripts":[{"angle":"干货直给","text":"免签最容易被坑在落地那一关，尤其泰国。去泰国前必须线上填电子入境卡TDAC，免费的，出发前1到3天填完截图存好。到了边检还要查返程机票和酒店订单，最关键是一条硬规定：每人要带不少于1万泰铢现金，家庭不少于2万，海关不定期抽查，带不够可能被拒入境。这条从1980年沿用至今，不是新规矩。菲律宾更简单粗暴，免签只给14天，而且只认马尼拉和宿务入境，很多人按30天排行程，第15天就成逾期。所以免签省的是办签证的时间和钱，不省入境审查，材料照样要齐。 落地这几样少一件都可能被拦，提前备齐比现场解释管用。"},{"angle":"避坑清单","text":"东南亚免签落地五条避坑，出发前逐条核对。第一，电子入境卡提前填：泰国TDAC、马来西亚MDAC、新加坡SGAC、菲律宾eTravel，都是出发前1到3天线上填，不填可能被拦。第二，现金门槛，泰国个人1万泰铢、家庭2万，海关随机查，别只带卡。第三，天数别记混，新马泰30天、菲律宾14天，按单次入境算。第四，护照有效期要超6个月且有空白页，很多人卡这条。第五，免签不等于免审，返程机票和酒店订单备查，材料不齐照样退回去。把这五条过一遍，比看十篇攻略都管用。 把这五条过一遍再出发，比看十篇攻略都管用，落地不被卡才是真省心。"},{"angle":"反常识开场","text":"免签了为啥还有人被拦在机场？因为免签免的是提前办签证，不免落地审查。泰国就是典型，你拿着免签护照飞过去，第一关先查TDAC电子入境卡填没填，没填直接卡住；接着查返程机票、酒店订单；再抽查现金，个人1万泰铢家庭2万，带一张卡不行，得是真现金。菲律宾更刁，免签只给14天还限马尼拉宿务入境，你要是飞别的城市或者按30天玩，落地就出问题。所以别被免签两个字麻痹，落地要的材料一件不能少。花两分钟把入境卡填了、现金装兜里，比省下的签证费值钱多了。 别被免签两个字麻痹，落地要的材料一件不能少，提前备齐才稳妥。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"科大讯飞开源端侧百万上下文模型，手机本地能读完一本手册","hook":"端侧模型第一次支持百万字上下文，手机断网也能干复杂活。","why":"国产算力突破+开源，情绪和实用价值双高。端侧是趋势，和普通人手机/电脑强相关。","heat":"高","tags":["强时效","国产","端侧"],"facts":["9月1日科大讯飞子公司词元星火开源星火X2.5-4B和1.7B两款端侧通用大模型，业界首个原生支持最长100万Token上下文的端侧模型（中新网安徽/新京报贝壳财经/上游新闻 2026-09-01）","两款模型采用混合注意力架构，基于全国产算力平台全流程训练，用约20万亿Token预训练（中新网安徽/新京报 2026-09-01）","智能家居测试集上X2.5-1.7B控制指令端到端执行正确率90.3%，平均响应0.85秒（上游新闻 2026-09-02）","模型已在Hugging Face、GitHub开放权重与部署文档，API上线讯飞星辰MaaS平台限时免费（新京报/上游新闻 2026-09-01）","科大讯飞透露9月7日将正式发布全新一代旗舰通用大模型星火X2.5（中新网安徽 2026-09-01）","X2.5-4B在代码补全/生成上可对标大2到3倍的云端模型（新京报贝壳财经 2026-09-01）"],"scripts":[{"angle":"干货直给","text":"科大讯飞9月1号开源了两款端侧模型星火X2.5-4B和1.7B，关键点是一个：它们是业界第一个原生支持100万Token上下文的端侧模型。100万Token什么概念，一本几百页的产品手册能一次塞进去读完再回答跨章节的问题。以前端侧模型处理长文档得切成几段分别问，容易忘前情，现在不用了。这两款基于全国产算力全流程训练，用了20万亿Token预训练，权重和部署文档都放到了Hugging Face和GitHub，API在讯飞星辰MaaS平台限时免费。智能家居测试里1.7B控制指令正确率90.3%，响应0.85秒。手机、汽车、机器人本地跑大模型这事，这次往前迈了一大步。"},{"angle":"说人话版","text":"用大白话讲端侧模型为啥值得关注。端侧就是模型跑在你自己手机电脑里，不用联网、不上传数据。以前端侧模型只能陪你聊几句，长点的文档它就跟不住。星火X2.5这次把上下文拉到100万Token，等于本地设备能一次吞下整本手册、整套会议记录、甚至整个代码库，然后基于完整信息连续干活。4B那个版本写代码能对标大它两三倍参数的云端模型。更关键的是全国产算力训练，自主可控。对普通人意义是：以后断网也能让本地助手读长文档、写报告、控家电，隐私还不出厂。9月7号讯飞还要发旗舰版星火X2.5，可以接着看。"},{"angle":"趋势判断","text":"从讯飞这次开源能看出端侧AI的三个走向。第一，上下文长度在追平云端，100万Token放到本地，意味着端侧从能对话跨到能干活，长文档、长代码、多步骤任务不再必须上云。第二，全国产算力训练成了现实选项，20万亿Token预训练走通，自主底座这条路更实了。第三，开放在加速，权重、代码、部署文档、API一站式放出且限时免费，开发者拿去就能用。结合9月7号旗舰星火X2.5要发，讯飞明显在押注端侧+智能体。对做应用的人来说，本地化、隐私友好、断网可用，这三点会是接下来端侧产品的标配卖点。"}]},{"id":"ai2","title":"阿里Qwen3.8-Max登顶全球编程榜：国产模型第一次站上塔尖","hook":"国产大模型第一次在客观编程榜压过海外闭源旗舰。","why":"硬跑分+国产情绪，评论区易自发讨论。直接关联写代码/做工程人群，转化高。","heat":"高","tags":["强时效","国产","编程"],"facts":["9月2日阿里升级旗舰模型Qwen3.8-Max-0902，总参数2.4万亿、支持100万上下文Tokens（科技日报/腾讯新闻每日经济新闻 2026-09-02）","CodeArena前端编程(WebDev)总榜得分1691、提升22分，领先Claude Opus5、Kimi K3居第一（科技日报/腾讯新闻 2026-09-02）","CodeArena性价比榜每百万Tokens综合平均约5美元；API定价输入2美元/输出6美元每百万tokens（腾讯新闻 2026-09-02）","专项后训练围绕编程+专业办公：TerminalBench3.0从11.3升至29.0、DeepSWE1.1从56.6升至69.3（腾讯新闻 2026-09-02）","新模型已上线千问AI平台，千问办公、Qoder、千问App同步接入（科技日报 2026-09-02）"],"scripts":[{"angle":"干货直给","text":"阿里9月2号升级旗舰模型Qwen3.8-Max-0902，这次不是逼近是登顶。科技日报和腾讯新闻都报了，在第三方编程榜CodeArena的前端编程总榜拿到1691分，比上一版涨22分，超过了Claude Opus5和Kimi K3，排到总榜第一。模型总参数2.4万亿，支持100万上下文Token。成本也漂亮，CodeArena性价比榜每百万Token综合平均约5美元，API定价输入2美元、输出6美元每百万Token。后训练重点压在编程和办公两块：TerminalBench3.0从11.3升到29.0，DeepSWE1.1从56.6升到69.3。已经上线千问平台，千问办公、Qoder、千问App同步接入。国产模型第一次在客观工程榜站上塔尖。"},{"angle":"数据向","text":"把Qwen3.8-Max-0902的数字摆出来。9月2号发布，总参数2.4万亿，100万Token上下文。跑分上，CodeArena前端编程总榜1691分居第一，领先Claude Opus5和Kimi K3；性价比榜每百万Token综合约5美元。后训练围绕编程和办公：TerminalBench3.0从11.3到29.0、DeepSWE1.1从56.6到69.3、JobBench从53.4到64.0，编程类8项任务全面提升。价格维持输入2美元、输出6美元每百万Token。已上线千问AI平台，千问办公、Qoder、千问App第一时间接入。一句话总结：参数大、上下文长、编程榜第一、单价还压得住，对写代码的人来说多了一个能打的国产选项。"},{"angle":"创作者视角","text":"这条对做产品和写代码的人意味着什么，说三点。第一，中文语境里的写代码搭子第一次在客观榜单压过海外闭源旗舰，不是情怀分是跑分，Qwen3.8-Max-0902在CodeArena前端编程1691分登顶。第二，单价可控，每百万Token综合约5美元，API输入2输出6，比很多闭源便宜，长期用成本更低。第三，它后训练专门强化了编程和办公，正好卡在帮人干活的刚需上，千问办公、Qoder已经接入。建议你把手里那些半年前觉得AI写不好的代码任务重新试一遍，尤其是前端页面和长周期脚本，差距可能比你印象里大。"}]},{"id":"ai3","title":"AI视频工具大洗牌：Sora 9月24日关停，现在该用谁","hook":"OpenAI把Sora关了，做视频的人得重新选工具。","why":"直接对着做短视频的人群说话，立人设。Sora关停是行业节点事件，时效和实用兼具。","heat":"中高","tags":["玩法","视频","工具"],"facts":["OpenAI Sora 2 API 定于2026年9月24日停用，消费端App已于4月26日关闭，生产管线需迁移（aicomparison/makeaivideo/smartupworld 2026-09）","Runway Gen-4.5主打专业影视，4K输出+Aleph上下文编辑，约0.15美元/秒；Pika主打快节奏短视频特效，约8美元/月起（aicomparison/smartupworld 2026-09）","OpenRouter 9月视频榜：字节Seedance 2.0 Mini/2.5领先，Google Veo 3.1 Lite（720p/1080p原生同步音频，成本低于Veo3.1一半），阿里Wan3.0最长30秒（streamingmeme 2026-09）","Gemini Omni Flash登顶视频双榜（Arena 1527 Elo），10秒片段约0.10美元/秒，支持对话式编辑（felloai 2026-09）","可灵Kling 3.0支持原生4K、60fps、15秒，约0.10美元/秒，被视为高性价比国产选项（felloai/smartupworld 2026-09）","待核实：各平台原生音频/口型同步质量与商用授权条款以官网实时文档为准，定价随时调整"],"scripts":[{"angle":"干货直给","text":"做AI视频的注意，OpenAI把Sora关了。消费端App今年4月26号已经下架，API定在9月24号停用，靠Sora跑生产管线的人得赶紧迁。现在能干活的选手这几个：Runway Gen-4.5走专业影视，4K输出加Aleph上下文编辑，约0.15美元一秒；Pika主打快节奏短视频特效，8美元月费起步；字节Seedance 2.0在OpenRouter视频榜排第一；Google的Veo 3.1 Lite有原生同步音频，成本不到Veo3.1一半；阿里Wan3.0能出最长30秒。Gemini Omni Flash登顶视频双榜，10秒片段约0.10美元一秒还能对话式改。Sora退场，其他选项反而更清楚了。"},{"angle":"横向对比","text":"Sora关停后，主流视频模型怎么选，直接对比。要最长单条：阿里Wan3.0能到30秒，字节Seedance约8到15秒。要原生同步音频和省钱：Google Veo 3.1 Lite和Gemini Omni Flash，前者720p/1080p带音频、成本不到Veo3.1一半，后者10秒片段约0.10美元一秒还支持对话改。要专业剪辑一体：Runway Gen-4.5有4K和Aleph改已有素材，约0.15美元一秒。要快节奏特效短视频：Pika月费8美元起，特效库适合钩子片段。国产高性价比看可灵Kling 3.0，原生4K、60fps、15秒约0.10美元一秒。新手别全订阅，先用免费额度测你那类片子再决定。"},{"angle":"实操流程","text":"把Sora迁移到新工具，按四步走。第一步盘点，你之前用Sora干啥：文生视频、图生视频还是改已有素材，对应找替代，文生看Seedance和Veo，改素材看Runway的Aleph。第二步测免费额度，Runway、Pika、可灵、PixVerse都有免费层，先跑你真实的镜头提示词，别看榜单盲选。第三步算成本，按每秒单价乘你月产秒数，Gemini Omni Flash和Kling约0.10美元一秒，Runway约0.15，高产量选包月更划算。第四步定交付分辨率，4K用Runway或Kling，社交竖屏1080p够用就选便宜的。迁移别拖，9月24号Sora API一关，老管线直接断。"}]},{"id":"ai4","title":"世界模型两连发：图生3D视频 + 不用写代码建界面","hook":"一张图能生成带3D世界的视频，拖拽就能建网站。","why":"前沿酷炫、视觉想象空间大，适合做涨知识类口播。两个同日发布，信息密度高。","heat":"中高","tags":["前沿","世界模型","酷"],"facts":["9月2日李飞飞World Labs发布多模态世界模型Atlas，凭1-6张图生成最长1分钟1440p视频并重建3D世界，支持像素级相机控制与子弹时间（财联社，全球AI日报2026-09-03）","同日Runway发布界面世界模型Solaris，将推理与渲染结合，点击/拖拽/文字指令即可实时生成可交互网站与数字界面，无需编程（至顶科技，全球AI日报2026-09-03）","Atlas可用于机器人仿真预训练；Solaris被视为世界模型前沿成果，降低建站/原型门槛（财联社/至顶科技 2026-09-03）","中科闻歌9月3日发布通用决策大模型Decitron，统一世界模型、多智能体模拟与博弈推理（机器之心，全球AI日报2026-09-03）","待核实：Atlas/Solaris具体开放方式与调用价格，以官方后续公告为准"],"scripts":[{"angle":"干货直给","text":"9月2号世界模型连发两个大动作。李飞飞旗下的World Labs发了Atlas，你给1到6张图，它能生成最长1分钟、1440p的视频，而且不是平面的，是重建出的3D世界，可以像素级控制相机、做子弹时间那种环绕特效，还能拿去给机器人做仿真预训练。同一天Runway发了界面世界模型Solaris，把推理和渲染绑在一起，你点一点、拖一拖、或者写句指令，就能实时生成可交互的网站和数字界面，不用写一行代码。一个把图变成可漫游的3D视频，一个把想法变成能点的界面，世界模型从概念正式往生产力落了。"},{"angle":"说人话版","text":"说人话解释这两个世界模型能干嘛。Atlas解决的是图变视频不够真的问题，以前文生视频是平面上动，Atlas给你1到6张图就能重建出有空间感的3D世界，相机可以绕着转、做子弹时间，最长1分钟1440p，还能用于机器人训练。Solaris解决的是做界面要写代码的问题，你拖动或者打字描述想要的网站，它实时渲染出能交互的页面，不用懂HTML。一句话：一个让静态图变可探索的3D视频，一个让不会编程的人也能拖出能用的网站。对创作者和小团队，原型和视觉化的门槛又被砍掉一大截。 对创作者和小团队，原型和视觉化的门槛又被砍掉一大截，值得试。"},{"angle":"趋势判断","text":"从Atlas和Solaris能看清世界模型的落点。第一，输入在变轻，从写提示词到给几张图、动动鼠标，门槛持续下移，普通人也能产出以前要团队做的东西。第二，输出在变可交互，不再只是看一段视频，而是能漫游的3D世界、能点的界面，世界模型开始接管空间和理解。第三，应用对口明确，Atlas奔机器人仿真和内容生产，Solaris奔建站和原型，不再是炫技demo。同一天中科闻歌还发了决策大模型Decitron，把世界模型和博弈推理合到一起。方向很一致：模型从生成内容，走向生成可操作的真实结构。"}]},{"id":"ai5","title":"AI办公转向生态比拼：腾讯WorkBuddy开放平台上线，阿里同日放大招","hook":"AI办公不比谁功能多，比谁能连更多硬件和场景。","why":"行业节点+硬数据（月访问量3月三倍），适合做趋势判断。与本用户强相关（WorkBuddy）。","heat":"中高","tags":["趋势","AI办公","生态"],"facts":["9月2日腾讯WorkBuddy开放平台正式上线，首批超百家软硬件/行业/开发者伙伴接入，国内首个打通硬件、应用、开发者三层生态的Agent基座（每日经济新闻/21世纪经济报道/证券日报 2026-09-02/03）","发布会9款联名硬件首发（Plaud、Rokid、影石、科大讯飞、安克等），已接入智能眼镜/麦克风/耳机等10余品类超30品牌（21世纪经济报道/腾讯新闻 2026-09-03）","易观数据：今年6月国内17款主流桌面AI原生办公智能体月访问量合计6000万次，是3月三倍，WorkBuddy约2097万次居首（腾讯新闻 2026-09-03）","同日阿里升级Qwen3.8-Max-0902登顶编程榜，腾讯、阿里、字节同日收拢AI办公产品线（腾讯新闻 2026-09-02）","开放平台面向开发者开放Skill、Expert、Connector三大能力，支持MCP与CLI双接入（证券日报 2026-09-03）"],"scripts":[{"angle":"干货直给","text":"AI办公赛道的打法变了，从比单点功能变成比生态。9月2号腾讯WorkBuddy开放平台上线，首批就拉了超百家伙伴，是国内第一个同时打通硬件、行业应用、开发者三层生态的Agent底座。现场发了9款联名硬件，Plaud、Rokid、影石、科大讯飞、安克都在，已经接入智能眼镜、麦克风、耳机等10多个品类超30个品牌。意味着你戴的眼镜、用的录音笔都能变成WorkBuddy的入口，账号任务和记忆跨设备流转。同一天阿里把Qwen3.8-Max推上编程榜第一，腾讯阿里字节同一周都在收拢AI办公线。竞争焦点从软件入口挪到了硬件和场景入口。"},{"angle":"横向对比","text":"三家大厂在AI办公上的路线现在分得很清。字节靠飞书，把Agent嵌进协作软件；阿里靠钉钉，千问办公接钉钉做企业协同，同时用Qwen3.8-Max在编程榜抢开发者；腾讯选了更硬核的一条，WorkBuddy开放平台把Agent能力开放给智能眼镜、录音卡片、麦克风、耳机等30多个品牌的硬件，不当硬件厂，只做云端的脑。易观的数据能说明热度：今年6月国内17款桌面AI办公智能体月访问量合计6000万次，是3月的三倍，WorkBuddy约2097万次排第一。入口之争从软件打到硬件，这是接下来一年的主战场。"},{"angle":"趋势判断","text":"AI办公从工具比拼转向生态比拼，三个信号很明确。第一，开放成主旋律，WorkBuddy把Harness、运行时、上下文管理这些Agent底座对外开放，首批超百家伙伴接入，自己退到底层做稳定。第二，硬件成新入口，眼镜麦克风耳机这些随身设备负责采集，云端Agent负责理解和执行，谁先打通多端谁占下一阶段优势。第三，数据印证风口，易观显示桌面AI办公月访问量3月三倍到6000万次。对普通用户，选AI办公别只看功能清单，看它能不能连你的设备、进你的工作流，生态宽的才活得久。 谁能把更多硬件和场景接进来，谁就握住了下一阶段的入口，用户会用脚投票。"}]}]}]},"2026-09-03":{"date":"2026-09-03","updatedAt":"2026-09-03 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月机票跳水到1折，比高铁还便宜，这个窗口就两周","hook":"9月机票打到1折，比高铁二等座还便宜，但窗口只到中秋前。","why":"暑运8月31日刚结束，9月是民航传统淡季，北京上海出发多条航线1折、200元起，但中秋一起价格立刻回弹。现在发正好卡在捡漏窗口，收藏转发都高。","heat":"高","tags":["强时效","省钱","国内游"],"facts":["金融时报/第三方平台：9月中上旬，北京、上海出发国内多条热门航线出现特惠低价单程机票，价格低至1折左右，最低200元（2026-09-02）","9月为民航传统淡季、运力充沛；进入9月中旬后票价明显上涨，热门航线稳定在300-500元、特价票减少（金融时报 2026-09-02）","交通运输分析师：未来一到两周机票价格还会进一步下跌，国庆之前整体维持在较低水平（金融时报 2026-09-02）","低价票多集中在早班、晚班或经停航班，余票有限，价格随日期实时变动，越临近中秋越高（金融时报 2026-09-02）","去哪儿数据：8月成都出发多条航线折扣低至1.6折（飞丽江270、大理259、西双版纳259等），暑运后半段运力清仓（腾讯新闻 2026-07-30）"],"scripts":[{"angle":"干货直给","text":"暑运8月31日刚收官，9月是民航全年最舒服的淡季，机票正在大跳水。第三方平台数据，北京、上海出发的多条热门航线已经出现1折左右的特价，单程最低200元，这价格比同方向的高铁二等座还便宜。为什么这么低？暑运后半段学生返校，客座率掉下来，航司必须清仓，而9月运力投放还在加。但要注意，这个低价窗口很短，9月中上旬是低点，一旦进入中旬票价就开始往上走，热门航线会回到300到500元。所以想捡漏就盯现在这两周，出发选周二周三还能再低一档。低价舱基本是早班或者红眼，落地时间不友好，算账时把进城交通费也算进去。"},{"angle":"实操流程","text":"想在9月捡到1折机票，按这四步走。第一步，把出发地锁定北京、上海这种大枢纽，这轮降价就是从这些城市往外溢的，200元起的票大多从这里出。第二步，出发日选周二到周四，同一条线 weekend 贵一截，错开能再省几十。第三步，只看早班和晚班，1折舱基本都绑在这两个时段的经停航班上，红眼票最便宜但要算好落地怎么进城。第四步，提前设好价格提醒，机票一天一个价，看到200元出头的立刻下手，别等。最后一个提醒，这些特价大多不含机建燃油，付款还要加一两百；而且多数不能退改，行程有变数的别贪这个价，买可退改的稍贵舱更稳。"},{"angle":"反常识开场","text":"机票越便宜越要趁早买，这句话在9月是反着的。正常逻辑是降价了你等等更便宜，但9月这波淡季跳水有个时间底线：它不是一路向下的直线，而是先低、中秋前触底、假期一到立刻回弹的U型。现在北京上海出发已经出现1折、200元起的票，这是全年低点附近，再等两周反而涨回300到500。原因很简单，运力清仓就这一阵，航司把低价舱放完，价格就回到正常区间。所以9月捡漏的正确姿势是看到就买，而不是等更低。真正能等的只有出发日选周二周三这个小技巧，大趋势上现在是谷底，错过要等明年暑运后。淡季特价舱是限量的，等更低往往会等没了，低点出手最稳。"}]},{"id":"tv2","title":"请3休13的人同比涨了52%，机票反而创三年新低","hook":"拼13天长假的人多了五成，机票价格却是近三年最便宜。","why":"9月28至30日请3天连休13天已成定局，携程去哪儿数据一致；9月22日抢跑出发比国庆首日便宜50%，9月27至10月1日均价近三年最低。现在教人怎么买最便宜，价值最高点。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["携程数据（截至8月25日）：中秋国庆机票订单同比约+50%，酒店订单同比近+200%；9月上旬至中旬进入预订高峰（大众日报 2026-09）","去哪儿：9月28-30日请假出游人数同比+52%；热门城市酒店提前预订量同比+近四成，提前一个月抢票热度同比+21%（光明网/今日头条 2026-08-31）","9月22日抢跑出发，机票均价较中秋首日（9月25日）低30%、较国庆首日（10月1日）低50%（去哪儿/大众日报 2026-09）","9月27日至10月1日机票均价创近三年同期最低，部分热门航线比去年同期低一成以上（去哪儿/新浪 2026-09）","国务院办公厅：中秋9月25-27放假3天不调休；国庆10月1-7放假7天，9月20日（周日）、10月10日（周六）补班（国办发明电〔2025〕7号）"],"scripts":[{"angle":"干货直给","text":"今年中秋国庆的拼假公式全网都知道了：中秋9月25到27号，中间28、29、30号请3天年假，接上国庆10月1到7号，一口气休13天。数据很有意思，去哪儿说9月28到30号请假出游的人同比涨了52%，但机票价格反而更友好。关键在出发时间：9月22号抢跑出发，机票均价比中秋首日低30%，比国庆首日低50%；9月27到10月1号这段时间，均价创下近三年同期最低，部分热门航线比去年同期还低一成以上。所以别都挤在10月1号走，节前那几天出发最划算。返程也别扎堆最后两天，今年返程分散在10月4到7号，4号返程比去年同期低两成多。"},{"angle":"横向对比","text":"把长假机票拆成三段比，结论很清楚。第一段，节前抢跑（9月22号左右）：均价最低，比国庆首日便宜一半，适合能提前请假的。第二段，假期中段（10月3到6号）：比首尾高峰低15%到25%，人少体验好，时间灵活的首选。第三段，首尾高峰（9月25、10月1到2号）：全年最贵，能避就避。返程同理，别都卡10月6、7号，4号走最省。携程的数据也印证了这趋势，截至8月25号机票订单同比涨了五成、酒店近两倍，但价格却是三年新低，说明大家提前规划、错峰出发已经成了主流。记住一句话：同样的13天，出发日选对了，往返能省出一两晚好酒店。"},{"angle":"反常识开场","text":"长假机票不是越早越便宜，也不是越晚越便宜，而是看你怎么卡时间点。今年最反直觉的一幕：拼13天假的人同比多了52%，机票却创了近三年最低。原因是航司今年运力给得足，加上大家学会了错峰，把需求摊平了。具体怎么买最值？别在10月1号凑热闹，那天是价格峰值；往9月22号前后的节前工作日挪，均价直接腰斩。假期中段10月3到6号也是洼地。还有个容易被忽略的点，返程别都挤最后两天，今年返程热分散在4到7号，4号返程比去年便宜两成多。这趟算下来，会买的人比硬刚高峰期的人，省下的钱够目的地多玩两天。"}]},{"id":"tv3","title":"对角线飞行赏秋火了，小机场城市机票预订涨了3.8倍","hook":"今年长假流行从地图右下角飞左上角，赏秋航线翻了几倍。","why":"去哪儿数据：拉萨-上海预订+4.4倍、拉萨-北京+3.4倍，延吉成小机场城市增幅TOP1（+3.8倍）。反向信息差强，适合做小众赏秋目的地内容，离中秋窗口还有时间囤票。","heat":"中高","tags":["信息差","国内游","赏秋"],"facts":["去哪儿：热门2000公里以上对角线飞行航线预订量同比翻番；拉萨-上海+4.4倍、拉萨-北京+3.4倍、拉萨-广州+3.3倍（今日头条/去哪儿 2026-08-31）","西宁-上海、乌鲁木齐-南京、乌鲁木齐-武汉等航线均近2倍增长；西藏、新疆、内蒙古、甘肃、青海等赏秋地热度显著（去哪儿 2026-08-31）","吉林延吉成小机场城市机票预订增幅TOP1，增长达3.8倍；宁夏中卫、新疆阿勒泰紧随，机票预订量同比均接近翻倍（去哪儿 2026-08-31）","中秋国庆期间飞赴三线及以下宝藏百城机票量同比增超30%（去哪儿 2026-08-31）","携程：拼假长线深度游成热门，产品从大而全走向小而精，游客从走马观花转向深度体验（大众日报 2026-09）"],"scripts":[{"angle":"干货直给","text":"今年超长假期冒出一个新玩法：对角线飞行赏秋。说人话就是从地图右下角飞到左上角，或者西北飞华东，跨度越大越时髦。去哪儿的数据很直观，2000公里以上的长航线预订量同比翻番，其中拉萨飞上海涨了4.4倍、拉萨飞北京3.4倍、拉萨飞广州3.3倍；西宁飞上海、乌鲁木齐飞南京和武汉也都接近两倍。赏秋目的地集中在西藏、新疆、内蒙古、甘肃、青海这一圈。更意外的是小机场城市火了，吉林延吉机票预订增幅排第一，达到3.8倍，宁夏中卫、新疆阿勒泰紧随。三线及以下宝藏百城整体也涨了三成多。一句话，今年大家不挤热门大城市，往西北和边境小城跑。"},{"angle":"实操流程","text":"想蹭这波赏秋热度又不想当冤大头，按这个顺序订。第一步，先定大方向，新疆、西藏、内蒙古、甘肃、青海这一圈是今年最热，想看秋色就往这几个省靠。第二步，别只盯着省会机场，今年火的是小机场，延吉、中卫、阿勒泰这些地方机票涨得猛但绝对值还不离谱，早买有空间。第三步，利用长假说走就走，13天假期足够跑一个跨省长线，不用赶。第四步，关注对角线航线，比如从华东飞西北，这类2000公里以上长线今年运力加得多、相对好买。最后提醒，赏秋目的地旺季短，9月底到10月中是最佳窗口，再晚叶子就掉了，票也跟着紧。"},{"angle":"反常识开场","text":"今年机票涨得最猛的，不是北京上海这些大城市，而是一堆你未必叫得上名的小机场。去哪儿的数据，吉林延吉机票预订涨了3.8倍排第一，宁夏中卫、新疆阿勒泰紧随，三线以下宝藏百城整体也涨了三成多。背后是长线赏秋的爆发，拉萨飞上海翻了4倍多，飞北京3倍多。这说明两件事：一是大家不挤传统热门了，往西北边境小城跑；二是13天超长假让长线深度游第一次变得可行，游客从打卡式旅游转向慢体验。对想做内容的人来说，这是个信号：别再写千篇一律的网红城市攻略了，小众赏秋目的地、小机场城市，才是今年信息差最大的富矿。"}]},{"id":"tv4","title":"持普通护照免签国已达56个，240小时过境免签增至57国","hook":"拿普通护照能说走就走的国家，已经到56个了。","why":"国家移民管理局8月20日新增吉、越为240小时过境免签国，适用国增至57；截至9月1日中国普通护照免签入境56国。强时效加权威来源，适合做免签地图收藏向内容。","heat":"中高","tags":["出境","政策","收藏向"],"facts":["国家移民管理局8月20日公告：新增吉尔吉斯斯坦、越南为240小时过境免签和海南30天入境免签适用国，240小时过境免签适用国增至57国，海南30天免签增至61国（国家移民管理局/淄博外事办 2026-08-20）","截至2026年9月1日，中国公民持普通护照可免签入境56个国家/地区（中国领事服务网 2026-09-01）","中国单方面免签30天已扩至50国；8月20日同日新增吉、越（Trip.com 2026-09）","上半年入境外国人2291.4万人次，同比+20.4%；其中免签入境1781.5万，+30.6%（国家移民管理局 2026-07）","中俄互免签证延长至2027年12月31日；2025年中俄人员往来突破300万人次，今年一季度中国赴俄旅游+44%（外交部 2026-08-28）"],"scripts":[{"angle":"干货直给","text":"普通护照的含金量又涨了。截至9月1日，中国公民持普通护照能免签入境的国家和地区已经达到56个。8月20日国家移民管理局刚发公告，新增吉尔吉斯斯坦和越南适用240小时过境免签，这一项适用国直接增到57个，海南30天免签也增到61个。另外中国单方面免签30天的国家已经扩到50个。上半年数据也很猛，入境外国人2291万人次、同比涨两成，其中免签入境1781万、涨了三成。中俄互免也延长到2027年底。对普通人的意思很简单：以前要办签证才敢去的地方，现在拿本护照买张票就能走，出境游的门槛又降了一截。"},{"angle":"横向对比","text":"免签这事其实分三种，别混为一谈。第一种互免签证，双方互相免，比如中俄、塞尔维亚、泰国、新加坡这些，拿着护照直接进。第二种单方面免签，对方给咱们免但咱们不一定给他免，比如咱单方面免50个国家的30天，还有文莱14天这类。第三种过境免签，不是去对方国家旅游，是经对方转机去第三国，比如240小时过境免签现在57国适用，从北京上海等65个口岸进，停留不超过10天。三种里最容易被忽略的是过境免签，很多人不知道转机也能顺道玩几天。出发前一定去中国领事服务网或目的国官方核一遍，政策每个月都在加，过期攻略会坑人。"},{"angle":"反常识开场","text":"免签国家越多，反而越容易在机场被拦，这话不矛盾。现在普通护照免签国已经56个、240小时过境57个，但每次边检都会查材料，不是有本护照就万事大吉。常见的翻车点：护照有效期不足6个月、没带返程机票、订酒店记录和资金证明不齐。免签免的是提前去使馆交材料办签证这一步，落地那一关的审查一点没少。所以免签国变多，真正的提醒是出发前准备要做足，别因为觉得免签就空手去。政策也在持续加，吉、越刚进过境免签名单，想捡漏新目的地的，可以盯官方每月更新，抢在人群前面去。把材料备齐再出发，免签才是真说走就走。把材料备齐再出发，免签才是真说走就走，别拿运气赌通关。"}]},{"id":"tv5","title":"出境游搜索涨了72%，但有人因少带1万泰铢被原机退回","hook":"出境游搜索涨了72%，可有人因为少带一万泰铢被原机退回。","why":"新浪：8月出境游搜索+72%，免签目的地凭便捷成首选。结合领事服务网入境材料要求做避坑，长效不过期，收藏率高。","heat":"中","tags":["出境","避坑","收藏向"],"facts":["新浪：8月以来出境游搜索热度同比+72%，欧洲和南美等远线目的地机票量增长显著，免签目的地凭出行便捷优势成为不少消费者首选（新浪 2026-09）","泰国入境须备不少于1万泰铢/人（家庭2万泰铢）现金抽查；须填电子入境卡TDAC（免费）；护照有效期须满6个月以上（泰国国家旅游局北京办/领事服务网 2026-07-09更新）","菲律宾免签政策有效期2026年1月16日至2027年1月16日，仅适用于经马尼拉和宿务机场入境的游客，单次停留不超过14天（中国领事服务网 2026-09-01）","文莱免签14天；越南富国岛免签30天（仅限富国岛）；柬埔寨免签14天（有效期2026年6月15日至10月15日）（中国领事服务网 2026-09-01）","待核实：部分自媒体称泰国60天免签9月15日作废回落30天，仅见单一来源，未写入口播稿正文"],"scripts":[{"angle":"干货直给","text":"出境游这波热度起来了，新浪数据8月以来搜索涨了72%，欧洲南美这些远线机票量也明显增长，免签目的地因为省事成了首选。但热度背后有个容易翻车的坑：免签不等于落地就放行。以泰国为例，移民局会抽查现金，每人不少于1万泰铢、家庭2万，还得提前填免费的TDAC电子入境卡，护照有效期必须满6个月以上。菲律宾免签也别想当然，有效期是2026年1月到明年1月，而且只认马尼拉和宿务两个机场入境，单次停留14天。文莱14天、越南富国岛30天、柬埔寨14天，各有各的窗口期。出发前把这些材料备齐，比抢到便宜机票还重要。"},{"angle":"实操流程","text":"出境前照这张清单核对一遍，能省掉一趟白跑。第一，护照有效期算到回国那天必须满6个月，很多人卡这条。第二，返程或去第三国的机票订单打印带好，边检必查。第三，酒店订单和足够资金证明备着，泰国还要每人1万泰铢现金抽查。第四，目的国要求填的入境卡提前办，泰国是TDAC电子卡，免费但得落地前填完。第五，确认免签适用范围，菲律宾只认马尼拉宿务入境、柬埔寨免签到10月15日，过期或走错口岸都不行。最后一步，出发前一周再去中国领事服务网核一遍政策，两分钟，能避开九成的入境麻烦。清单存手机里，每次出发前过一遍，最省心。"},{"angle":"反常识开场","text":"免签国家再多，也救不了不带现金的人。今年出境游搜索涨了72%，很多人兴冲冲买了免签目的地的票，结果在机场被原机退回，原因就是少带了一万泰铢现金或者没填入境卡。免签政策的字面意思是你不用提前去使馆办签证，但落地审查一样不少：护照有效期、返程机票、住宿、资金，缺一样都可能被拒。泰国就明文要求每人带不少于1万泰铢、填TDAC电子卡。所以别被免签两个字麻痹，它省的是出发前的时间，不是落地的审查。把材料备齐再走，这趟才真正说走就走。免签是便利不是豁免，准备到位才算说走就走，下次照这篇查完再关门。免签是便利不是豁免，准备到位才算真说走就走，下次照这篇查完再关门。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"MiniMax H3 Max 让AI视频比播放还快，已有人开24小时直播","hook":"AI生成视频比你看视频还快，已经有人拿它开24小时直播了。","why":"9月1日MiniMax发H3 Max，5秒768p不到3秒生成、吞吐H3的35倍，跨过实时门槛。海外已搭出Twitch直播、AI电视台，观众聊天实时改剧情。对做短视频的人是范式信号。","heat":"高","tags":["强时效","视频生成","玩法"],"facts":["9月1日MiniMax发布H3 Max：生成5秒768p音视频不到3秒，吞吐量约H3的35倍，已跨过实时直播速度门槛（观点网/量子位 2026-09-01）","H3开源三周下载超2400万次，衍生300+公开模型，成2026全球下载量最高模型；H3 Max在Artificial Analysis、Design Arena图生视频榜居首（观点网 2026-09-01）","海外开发者用H3 Max搭出Twitch直播、24小时AI电视台，观众通过聊天指令实时影响视频内容（量子位/H-FARM 2026-09-01）","FastH3用8张B200可在13秒生成15秒768p视频；单张Blackwell GPU较基础H3最高14倍加速（观点网 2026-09-01）","待核实：有开发者测算480p不间断推理约4320美元/天，仅见单一博客口径，未写入口播稿正文"],"scripts":[{"angle":"干货直给","text":"AI视频生成跨过一道关键门槛了。9月1日MiniMax发布H3 Max，生成一段5秒768p的音视频不到3秒，吞吐量是之前H3的35倍，第一次快过了视频本身的播放速度。这意味着什么？生成比你看还快，那就不是做预制片了，是可以现场边播边生成。海外已经有人把这个模型接进Twitch做了24小时不停的AI电视台，观众在聊天里发指令，下一帧画面就跟着变。底座H3本身也猛，开源三周下载超2400万次、衍生300多个模型，是今年全球下载量最高的模型，在图生视频榜排第一。对做内容的人来说，实时生成打开的是直播、互动视频这类新玩法。"},{"angle":"实操流程","text":"作为普通创作者，H3 Max这波跟你有什么关系，怎么用上？第一步，别自己部署，那需要8张B200显卡，离咱们很远；直接用MiniMax开放平台和MiniMax Design里的H3 Max 768p和480p接口，按量付费。第二步，想清楚场景，实时生成最适合做互动内容，比如直播里让观众点什么就出什么、或者做无限滚动的短视频流。第三步，控制成本，实时推理是按秒烧钱的，先小范围试，别一上来就7×24小时跑。第四步，把生成速度和你的内容节奏对齐，因为比播放快，你可以做到观众还没看完上一段下一段就好，体验会很顺。新手建议先从单条快生成练手。"},{"angle":"反常识开场","text":"做视频最怕等渲染，但AI视频现在快过了播放本身，这事反直觉。MiniMax的H3 Max生成5秒视频不到3秒，比你盯着屏幕看那段视频还快。结果就是一种以前不存在的玩法冒出来了：不需要提前做好片子再播，可以边播边生成，观众发弹幕点什么，下一帧就变什么。海外已经有人拿它开了24小时不停的AI电视台，还有人做了个划到底自动接下一段的AI版短视频App。这打破了内容生产的成本结构，库存无限、响应实时。对创作者来说，机会在互动和直播，而不是又一条精修短片。当然代价是算力钱，但这扇门一旦打开就关不上了。"}]},{"id":"ai2","title":"科大讯飞开源端侧百万上下文模型，手机本地能吞百万字","hook":"手机本地跑的模型，第一次能一口气吞下一百万字的说明书。","why":"9月1日讯飞开源星火X2.5-4B和1.7B，业界首个原生100万Token上下文端侧模型，全国产算力训练。对做内容的人是断网也能用AI的拐点，实用性强。","heat":"中高","tags":["国产","端侧","实用"],"facts":["9月1日科大讯飞子公司词元星火开源星火X2.5-4B和1.7B两款端侧通用大模型，业界首个原生支持最长100万Token上下文窗口的端侧模型（新京报/大皖新闻 2026-09-01）","两款模型基于全国产算力平台全流程训练，用约20万亿Token数据预训练，围绕智能体、代码、数学、指令遵循优化（新京报 2026-09-01）","支持英伟达、华为、海光、后摩等硬件，兼容vLLM/SGLang/llama.cpp，可Ollama、LM Studio部署，支持LLaMA-Factory增量训练（新京报 2026-09-01）","即日起已在Hugging Face、GitHub开放权重、代码和部署文档，对应API上线讯飞星辰MaaS平台（新京报/腾讯AI日报 2026-09-01）","实测示例：导入完整售后手册后，模型能跨章节关联退换货、故障、例外条件给出综合判断（大皖新闻 2026-09-02）"],"scripts":[{"angle":"干货直给","text":"端侧模型又往前迈了一大步。9月1日科大讯飞开源了星火X2.5-4B和1.7B两款端侧通用模型，关键是业界首个原生支持100万Token上下文的端侧模型。什么概念？一本一百万字的文档能一次塞进去读完再回答，不用切段。它是在全国产算力上训的，用了约20万亿Token数据，专门强化了智能体、代码、数学和指令遵循。部署也友好，英伟达、华为、海光、后摩的硬件都支持，vLLM、SGLang、llama.cpp这些主流框架都能跑，Ollama、LM Studio一键拉起，还能用LLaMA-Factory继续微调。权重和文档已经在Hugging Face和GitHub开放。端侧的意义是断网也能用、数据不出本机，适合对隐私和离线有要求的场景。"},{"angle":"实操流程","text":"想在自己电脑或手机上跑这个百万上下文模型，照这个路径走。第一步，确认硬件，4B版本对显存要求不高，消费级显卡甚至苹果芯片都能试，1.7B更轻。第二步，装个Ollama或者LM Studio，这是最省事的入口，搜星火X2.5直接拉模型。第三步，如果你用的是华为昇腾或海光这类国产卡，走官方给的适配方案，兼容性已经做好了。第四步，喂长文档测试，比如把一整本产品手册或一份合同丢进去，问跨章节的问题，看它能不能关联前后文。第五步，要定制就上LLaMA-Factory做增量训练。注意端侧模型主打本地和隐私，别指望它比云端大模型还能聊，它的强项是把长资料读全再干活。"},{"angle":"反常识开场","text":"大家一直觉得本地小模型就是陪你聊两句，干不了正事，这次被讯飞打破了。星火X2.5-4B和1.7B是端侧模型，但原生支持100万Token上下文，等于一部百万字的小说或一整套产品手册能一次喂进去，它基于完整信息给答案，而不是切成几段分别问、然后已读乱回。实测里，把完整售后手册导入，它能跨章节关联退换货、故障、例外条件给出综合判断。这背后的转向是：端侧模型从能对话走向能干活。对普通人意义很大，断网、隐私数据不出本机，还能处理长资料，以后很多轻量任务不用再上传云端，手机和电脑本地就解决了。"}]},{"id":"ai3","title":"国家队14亿入股可灵AI，视频生成赛道有了国家级背书","hook":"国家队掏14亿入股一个视频生成模型，这信号比钱本身还大。","why":"8月31日快手公告国家人工智能基金14亿入股可灵，投后估值约180亿美元，全球视频大模型最大一笔融资。对做视频的人是赛道被认证强心针，也预示合规与工业化。","heat":"高","tags":["国产","视频生成","趋势"],"facts":["8月31日快手公告：国家人工智能产业投资基金向北京可灵注资14亿元（持股约1.14%），正大机器人注资约1.31亿元；可灵投后估值约180亿美元（上证报/网易 2026-09-01）","本轮为可灵7月启动的独立融资收官，30亿美元认购上限已悉数动用，股东集齐腾讯、阿里、百度及华策、芒果等文娱资本（钱江晚报 2026-09-01）","可灵Q2营收超8.5亿元同比+200%；全球用户破1亿覆盖224国，企业客户近5万家（快手中期财报/网易 2026-08-19）","可灵已推出业内首个原生4K视频直出，AI短片《纸手机》播放破亿并入围北影节AIGC单元（钱江晚报 2026-09-01）","国家人工智能基金2025年1月设立，总规模600.6亿元，实控人上海市国资委，财政部为大基金三期第一大股东（上证报 2026-09-01）"],"scripts":[{"angle":"干货直给","text":"视频生成赛道迎来国家级背书。8月31日快手公告，国家人工智能产业投资基金向可灵AI注资14亿元，正大机器人跟投1.31亿元，可灵投后估值约180亿美元。这笔钱不是孤立事件，它是可灵7月启动的独立融资的收官，30亿美元的认购上限全部用尽，股东名单里集齐了腾讯、阿里、百度这些科技巨头，还有华策、芒果这类文娱资本。可灵自己的基本面也硬：Q2营收超8.5亿、同比涨两倍，全球用户破1亿、覆盖224个国家，还做出了业内首个原生4K直出，短片《纸手机》播放破亿。国家队下场，意味着视频大模型被正式认定为战略级基础设施，不只是风口上的玩具。"},{"angle":"横向对比","text":"把可灵放进全球视频生成版图里看，位置很清楚。国际上，OpenAI的Sora、Runway的Gen-4.5是头部，但都在海外、合规和数据出境上有门槛；国内这一档，可灵、字节即梦Seedance、智谱清影是主角。可灵这轮的特殊之处是拿到了国家级基金入股，估值站上180亿美元，融资规模是全球视频大模型赛道最大的一笔。对比MiniMax刚发的H3 Max走开源和实时路线，可灵更偏工业化打法：4K直出、影视合作、商业化营收都已经跑出来。对国内创作者来说，可灵被国家队认证，意味着后续在合规、版权、平台接入上会更稳，长期可用性强。"},{"angle":"反常识开场","text":"一个做视频的AI模型，估值能到180亿美元、还引来国家队14亿入股，这放在一年前没人信。反常识的点在于，大家以为视频生成是玩具，结果它先跑通了商业化：可灵Q2营收超8.5亿、同比涨两倍，用户破1亿，还做出了原生4K直出和破亿播放的AI短片。国家队下场不是来凑热闹，是认定这是战略基础设施，大基金600亿规模、财政部是大股东，投可灵等于给整个视频大模型赛道盖章。对普通创作者，这信号很实在：视频AI不是会不会凉的问题，而是会越来越稳、越来越合规，早用早占坑，别等风口过去了才进场。趁现在工具还新，先上手最划算。趁现在工具还新，先上手最划算。"}]},{"id":"ai4","title":"千问Agent Teams上线，你说一句宅斗短剧AI自己拍完","hook":"你只说一句拍个宅斗短剧，AI自己拆剧本、分镜、生成、剪辑。","why":"8月31日千问创作全量上线Agent Teams，接Wan3.0，把编剧导演美术摄影剪辑多个Agent组队自动接力。对短视频创作者是直接可用的产能工具，720P低至0.26元/秒。","heat":"高","tags":["玩法","视频生成","实用"],"facts":["8月31日阿里千问创作全量上线Agent Teams，接入Wan3.0及Prime满血版、Qwen-Image-3.0，用户一句话创意即自动拆解并调度多角色Agent（千问官方/搜狐/华军 2026-08-31）","覆盖AI短剧、漫剧、营销广告、MV等；编剧/导演/美术/摄影/剪辑Agent接力完成剧本、分镜、角色、画面生成、配音配乐到成片（千问官方 2026-08-31）","Wan3.0单段最长30秒一镜到底、原生音画同步；720P单秒成本低至0.26元、1080P 0.52元（千问创作/华军软件园 2026-08-31）","已在千问创作PC端与App上线，支持画布工作流与多设备协同，创作中可随时修改（千问官方 2026-08-31）","第三方测评：Wan3.0在动画高动态、人物情绪、光影一致性已能与字节即梦Seedance系列正面竞争（行业分析 2026-09-01）"],"scripts":[{"angle":"干货直给","text":"阿里把视频生产做成了一句话的事。8月31日千问创作全量上线Agent Teams，底层接的是Wan3.0视频模型和Qwen-Image-3.0图像模型。你不用再写一长串提示词，只要说一句创意，比如拍个宅斗短剧，系统就自动拆任务，召编剧、导演、美术、摄影、剪辑这几个Agent接力干活，从剧本、分镜、角色设定、画面生成到配音配乐成片，一条龙跑完。覆盖短剧、漫剧、广告、MV。Wan3.0单段最长30秒一镜到底，音画原生同步。价格也压得低，720P单秒0.26元、1080P 0.52元。PC端和App都能用，创作中还能随时改。对一个人做内容的人来说，这等于白送一个剧组。"},{"angle":"实操流程","text":"想用Agent Teams出片，按这个流程走。第一步，打开千问创作PC端或者App，新建项目，选类型，短剧、漫剧、广告还是MV。第二步，在输入框用一句话描述创意，不用写分镜，比如想做古装宅斗就说故事设想。第三步，系统自动组队，编剧先出剧本、导演拆分镜、美术出角色和场景图、摄影生成视频、剪辑拼成片，你全程旁观。第四步，关键在中间干预，每段分镜和画面生成后你可以打回重做，不满意就点重新生成，边看边调。第五步，全部满意后导出成片。新手建议先从30秒短剧试，把创意说具体一点，AI执行得越准。记住你是导演，不是写手。"},{"angle":"反常识开场","text":"以前玩AI视频，核心竞争力是会不会写提示词，现在这条门槛被掀了。千问Agent Teams上线后，你只说一句拍什么，AI自己拆剧本、分镜、生成、剪辑，编剧导演美术摄影剪辑五个Agent自动接力，你连提示词都不用写。这意味着会写一长串咒语不再值钱，值钱的是你能不能把一个模糊想法说清楚、能不能做审美判断。对创作者其实是解放：把重复执行交给Agent，你腾出手管创意和方向。价格也把门槛砸穿了，720P一秒两毛六。所以别再囤提示词模板了，练怎么下任务、怎么挑片子，这才是新护城河。工具越省事，人的判断越值钱，越早适应越能把精力花在内容上。工具越省事，人的判断越值钱，越早适应越能把精力花在内容上。"}]},{"id":"ai5","title":"阿里Qwen3.8-Max登顶全球前端编程榜，2.4万亿参数5美元百万token","hook":"前端编程全球第一的AI是杭州的，而且每百万token只要5美元。","why":"9月2日阿里更新Qwen3.8-Max，CodeArena前端编程1691分总榜第一，2.4万亿参数、100万上下文，性价比榜每百万token仅5美元斩杀所有贵模型。对做网站落地页小工具的创作者，是低成本把想法变产品的钥匙。","heat":"中高","tags":["国产","大模型","成本"],"facts":["9月2日阿里更新旗舰模型Qwen3.8-Max，CodeArena前端编程（WebDev）评分提升22分至1691分，领先Claude Opus5、Kimi K3，居总榜第一（每日经济新闻/东方财富/腾讯新闻 2026-09-02）","Qwen3.8-Max总参数2.4万亿、支持100万上下文Tokens，经编程与办公专项后训练，涌现更强智能体编程能力（上海证券报/腾讯新闻 2026-09-02）","CodeArena性价比榜（帕累托前沿）：Qwen3.8-Max每百万Tokens综合平均仅5美元，斩杀所有价格大于5美元模型；第二、三名分别为20、12美元（etnet/腾讯新闻 2026-09-02）","已上线千问AI平台提供API，千问办公、Qoder、千问App均第一时间接入（上海证券报 2026-09-02）","全球开源LLM月度Tokens消耗TOP3均为中国模型：DeepSeek V4 Flash 21.5T、小米MiMo V2.5 20.5T、MiniMax M3 17.1T（截至7月14日，研究机构 2026-09-02）"],"scripts":[{"angle":"干货直给","text":"阿里的旗舰模型又升级了，而且是在最实用的编程维度登顶。9月2日更新的Qwen3.8-Max，在聚焦前端编程的权威榜单CodeArena拿到1691分，比上一代涨了22分，超过Claude Opus5和Kimi K3排总榜第一。参数规模也吓人，总参数2.4万亿、支持100万上下文，专门做了编程和办公的后训练，智能体写代码的能力明显增强。但最狠的是性价比：CodeArena的性价比榜上，它每百万token综合平均只要5美元，直接把所有单价超过5美元的模型都比下去了，排第二第三的分别是20和12美元。已经上线千问AI平台开放API，千问办公、Qoder、千问App都接进去了。对想做小工具、落地页的人来说，这是把想法变产品最便宜的钥匙。"},{"angle":"横向对比","text":"把Qwen3.8-Max和几个对手放一起比，结论很直白。能力上，CodeArena前端编程它1691分总榜第一，领先Claude Opus5和Kimi K3；规模上2.4万亿参数、100万上下文，长任务不吃力。价格上差距更夸张，每百万token综合5美元，而同档第二第三是20和12美元，差出好几倍。也就是说它既不是最贵也不是最弱，而是又强又便宜，卡在性价比前沿。对创作者这意味着什么？你做个带货落地页、活动H5、数据小工具，用它的API成本极低，试错不心疼。配合千问办公和Qoder，从想法到能跑的网页，中间的人工步骤被压到最少。国产模型这次在编程这条线上，是真的能打。"},{"angle":"反常识开场","text":"大家习惯觉得强模型一定贵，Qwen3.8-Max把这逻辑打穿了。它2.4万亿参数、100万上下文，前端编程登顶全球第一，按说该是天价，结果每百万token只要5美元，把一堆单价20、12美元的对手全比下去。反常识的地方在于，能力和成本不再绑死了，国产模型靠训练和后训练把性价比拉到了前沿。对普通人最实在的影响是，你用AI搭个网站、做个小工具的成本降到可以忽略，以前犹豫要不要雇人写的前端，现在自己一句话让模型出。全球开源模型token消耗TOP3也全是中国的，说明这股性价比浪潮不是单个产品，而是整个生态的。早用，早把想法变产品。"}]}]}]},"2026-09-02":{"date":"2026-09-02","updatedAt":"2026-09-02T10:20:00+08:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月上旬1折机票窗口：9月中旬就是分水岭","hook":"现在下单飞一趟，机票钱比高铁二等座还便宜，但这扇门只开到9月中旬。","why":"价格窗口有明确的起点和终点，观众看完能立刻行动，收藏和转发都高；淡季捡漏是每年固定选题，模板可复用。","heat":"高","tags":["机票","淡季","捡漏","错峰"],"facts":["9月1日记者查询携程：9月8日北京直飞郑州裸票160元，9月6日北京至银川220元，9月2日北京至太原230元（来源：北京日报，2026-09-01）","9月首周国内机票均价较暑期高峰下降35%（来源：央视财经，2026-09-01）","9月2日北京直飞昆明含机建燃油总价最低降至800多元，较暑期高峰价差超千元（来源：央视财经，2026-09-01）","9月上旬杭州出发至石家庄、揭阳、郑州、昆明、天津、广州、青岛等航线折扣1至3折，单程200至300元不含机建燃油（来源：每日商报、杭州政协网，2026-09-02）","中国航空运输协会特聘专家林智杰：暑运落幕进入9月传统淡季，国内航班投放规模增幅显著，供给增加带动票价下行，短途还面临高铁竞争（来源：央视财经，2026-09-01）","9月1日至3日国航限时特惠：北京到太原200元起（含基建燃油共290元）、北京至哈尔滨300元起、北京至宁波300元起（来源：航旅纵横数据，北京日报，2026-09-01）","进入9月中旬票价明显上涨，热门航线稳定在300至500元，特价票数量减少，国庆前后升至高点（来源：中国吉林网综合金融时报，2026-09-01）","低价票多集中在早班、晚班或经停航班，余票有限，价格随日期实时变动（来源：北京日报、每日商报，2026-09-01/02）"],"scripts":[{"angle":"干货直给","text":"9月2号查了一圈票价，先说结论：现在是全年最狠的一个捡漏窗口，只开到9月中旬。北京飞郑州，裸票160；北京到银川220；北京飞太原230。杭州出发飞昆明、郑州、石家庄这些线，折扣压在1到3折，单程200到300，不含机建燃油。9月第一周国内机票均价比暑期高峰跌了35%，同一条北京飞昆明，含税总价掉到800多，跟暑假差了一千块。原因不复杂：暑运7月1号到8月31号刚收尾，各家航司投出去的运力还没撤回来，高校开学时间又拉得散，供大于求，价格只能往下走，短途线还要跟高铁抢客。三条提醒。低价票基本卡在早班、晚班或者经停航班，最晚的落地过零点，赶时间的别碰。余票少、价格按天浮动，看到合适就下手，别隔夜再想。9月中旬开始票价回抬，热门线回到三百到五百，国庆前直接见顶。想省钱，把出发日往前挪，别往后拖。"},{"angle":"实操流程","text":"想吃到9月这波低价票，按这个顺序操作。第一步定日期，锁在9月上旬到中旬之前，越靠后越贵，9月中旬热门航线就回到三百到五百了。第二步挑班次，把筛选条件放宽，早上六点前起飞、晚上十点后落地的航班留着，经停一次的也留着，一折票基本都藏在这些位置。第三步进航司自己的入口，限时特惠、特惠闪购这些栏目单独放票，比综合平台还低。国航9月1到3号那批就是北京到太原200起、北京到哈尔滨300起、北京到宁波300起，都是裸票价。第四步反着查一遍，把出发地换成上海、成都、广州再搜同一个目的地，飞全国多地的200元票同样一大把，有时候先坐两小时高铁去邻省机场，总账更省。第五步下单别拖，余票少、价格按天浮动，隔一夜就可能贵一百。最后一句，机建燃油另算，报价看着200，到手大概290，心里有数。"},{"angle":"反常识开场","text":"很多人以为国庆前机票只会一路涨，实际正好反着。现在这个时间点，是暑运结束到国庆之间的价格谷底，9月第一周国内机票均价比暑期高峰跌了35%。北京飞郑州裸票160，飞银川220，飞太原230，这不是促销活动，是运力过剩的正常结果——航司七八月投出去的飞机还没撤，学生开学时间又拉得散，座位卖不完只能降价。第二个反常识：便宜的不只有机票。云南、贵州、新疆、四川多家酒店9月初报价比暑期高峰下调明显，部分打到五折，还送下午茶和景区接驳。热门景点排队时长从暑期的一到两小时，缩到十几分钟。同样的钱，体验反着涨。所以别等假期。9月中旬票价开始回抬，国庆前见顶，越临近中秋越贵。真想省钱又想玩得舒服，答案是现在请两天年假，而不是硬挤十月一号。"}]},{"id":"tv2","title":"泰国60天免签9月15日作废，中国护照其实没被取消免签","hook":"泰国60天免签9月15日到期，但中国护照不是被取消免签，是回到协定里的30天。","why":"网上大量标题写成「泰国对中国取消免签」，口径完全不同，纠错型内容传播强；有精确到小时的时间节点和可执行动作，评论区必追问细节。","heat":"高","tags":["泰国","免签","签证","政策"],"facts":["2026年8月31日泰国《皇家公报》刊登内政部四份公告，废止2024年7月15日起施行的针对93个国家和地区的「60天特别免签」，自公布满15日即9月15日起生效（来源：泰国《皇家公报》143卷特刊207G，2026-08-31）","新规下30天旅游免签名单60个国家和地区，15天名单2个（塞舌尔、毛里求斯），需在移民检查站申请落地签3个（阿塞拜疆、白俄罗斯、塞尔维亚）（来源：泰国《皇家公报》，2026-08-31）","中国公民赴泰免签依据是《中泰两国互免持普通护照人员签证协定》，2024年3月1日起实施，单次停留不超过30天，每180日累计不超过90天，泰方单方面调整不影响该协定效力（来源：泰国外交部领事司政策图表，2026-08-31）","9月14日23:59前入境的旅客仍按旧规获批60天停留，已获批停留期不被缩短，以入境章日期为准（来源：泰国外交部说明，2026-08-31）","新规下经陆路边境口岸免签入境，每人每个日历年最多2次（文莱、印尼、马来西亚、新加坡公民除外），经国际机场乘航班入境不受次数限制（来源：泰国《皇家公报》，2026-08-31）","免签入境30天到期前可向泰国移民局申请一次延期，最长再30天，规费1900泰铢，由现场移民官审核决定（来源：泰国移民局规定，2026-08-31）","中国香港、中国澳门按双边免签安排同为30天；中国台湾列入泰方新公布的30天旅游免签名单（来源：泰国外交部名单，2026-08-31）","新公告把30天和15天免签明确限定为「旅游」目的，原60天措施除旅游外还涵盖必要或紧急工作以及短期商务联系（来源：泰国《皇家公报》，2026-08-31）","泰方称调整原因是2024年7月试行的60天大豁免引发部分外籍人员长期非法打工、灰产与「签证跑」隐患（来源：泰方公告说明，2026-08-31）","入境仍需提交泰国数字入境卡TDAC，填报时限各来源说法不一（3天内／72小时内），以官方入口为准（待核实）"],"scripts":[{"angle":"干货直给","text":"泰国签证有变化，先把结论摆清楚：中国护照没有被取消免签，只是停留天数从60天回到30天，9月15号起生效。8月31号泰国皇家公报刊登了内政部四份公告，废掉的是2024年7月15号开始那版针对93个国家和地区的60天特别免签。那是泰国单方面给的临时福利，到期收回。中国公民赴泰靠的是另一份东西——中泰两国互免持普通护照人员签证协定，2024年3月1号实施，单次停留不超过30天，每180天累计不超过90天，这份协定不受这次调整影响。三个关键点。第一，看的是入境盖章日期，9月14号23点59分前完成入境的，60天照数，已经在泰国的不会被砍。第二，30天不够可以在到期前去移民局申请一次延期，最多再30天，规费1900泰铢，批不批由现场移民官定。第三，走陆路口岸免签入境，新规限一个日历年两次，坐飞机入境不限。十天半个月的普通旅游，基本没影响。"},{"angle":"横向对比","text":"同一条泰国新规，不同人受到的影响差得很远，对着看一遍。普通游客，行程十天到半个月，影响接近零。9月15号之后入境按中泰互免协定走，单次停留30天，照样不用提前办签证，护照、往返机票、酒店订单、电子入境卡备齐就行。计划待31到60天的人，影响最大：旧的60天免签没了，要么落地后去移民局申请一次30天延期、交1900泰铢、由移民官审批，要么出发前直接办旅游签。半年内频繁往返的人，注意另一条线，每180天累计不能超过90天，不是每次少于30天就没事。习惯从老挝、柬埔寨走陆路口岸出境再入境刷天数的，这条路收紧了，新规限一个日历年最多两次，飞机入境不受限制。还有一个容易漏的，新公告把30天免签明确限定为旅游目的，原来那版60天还包含短期商务联系和紧急工作，性质变了。港澳按双边安排也是30天，台湾地区列进了新的30天名单。"},{"angle":"反常识开场","text":"这两天到处在传泰国对中国游客取消免签，说反了。真实情况是，泰国收回的是给93个国家和地区的单边60天福利，而中国走的是双边协定，本来就是30天。2024年3月1号中泰两国互免持普通护照人员签证协定实施，写得很清楚：单次停留不超过30天，每180天累计不超过90天。过去两年能待60天，是因为泰国2024年7月另外加了一层临时优惠，覆盖93个国家和地区。8月31号皇家公报把那层废了，9月15号生效，中国护照自然落回协定里的30天。第二个反常识：赶60天末班车看的不是机票日期，是入境章日期。9月14号晚上起飞、15号凌晨落地，拿到的是30天。第三个：免签不等于随便入境。护照有效期六个月以上、往返机票、酒店确认单、电子入境卡，泰国口岸有权抽查，现金也可能被问，最终停留到哪天以入境记录为准。"}]},{"id":"tv3","title":"9月28到30请三天假连出13天，机票还是近三年同期最低","hook":"9月28到30请三天假，能连出13天，而且这三天出发的机票是近三年同期最低。","why":"拼假方案人人能用，日期精确到天，配上票价数据可以直接照做；长假决策窗口就在这一周，时效性极强。","heat":"高","tags":["中秋","国庆","拼假","机票"],"facts":["2026年中秋假期9月25日至27日，国庆假期10月1日至7日，两个假期相隔3天（来源：北京日报、大象新闻，2026-09-01）","9月28日至30日请3天假，可连成13天假期，被称为「请3休13」（来源：北京日报、大象新闻，2026-09-01）","去哪儿数据：9月22日出发均价较中秋首日9月25日低30%，较国庆首日10月1日低50%（来源：去哪儿旅行，北京日报报道，2026-09-01）","9月27日至10月1日机票均价创近三年同期最低，部分热门航线均价比去年低一成以上（来源：去哪儿旅行，大象新闻，2026-09-01）","中秋国庆期间热门城市酒店提前预订量同比增长近四成，提前一个月锁定机票的热度比去年同期高21%（来源：去哪儿旅行，2026-09-01）","9月1日查询北京出发，9月27日直飞大连、沈阳、大庆、银川等地仅需300余元（来源：北京日报记者查询，2026-09-01）","郑州经固原至乌鲁木齐9月27日最低600元，郑州至广州9月28日最低398元，郑州至杭州9月29日最低410元，郑州至三亚9月29日最低650元（来源：航旅纵横，大象新闻，2026-09-01）","业内提醒：郑州至乌鲁木齐转伊犁、至三亚、至广州、至川渝是传统热门线路，长假期间需求特别旺盛，需提前订票（来源：大象新闻，2026-09-01）"],"scripts":[{"angle":"干货直给","text":"今年最长的那个假，日子已经排出来了，直接抄。中秋9月25到27号，国庆10月1到7号，中间只隔9月28、29、30三天。这三天请年假，从9月25号一直连到10月7号，13天。为什么建议请这三天而不是往国庆后面接：这三天出发的机票，正好是全年最划算的一段。去哪儿的数据，9月27号到10月1号机票均价创下近三年同期最低，部分热门航线均价比去年还低一成以上。9月1号查北京出发，9月27号直飞大连、沈阳、大庆、银川这些地方，只要三百多。郑州出发，9月28号飞广州最低398，9月29号飞杭州410，飞三亚650，9月27号经固原到乌鲁木齐600。反过来看，9月22号出发均价比中秋首日低30%，比国庆首日低整整一半。结论一句话：假期战线拉长了，越早出发越便宜，别扎在10月1号那天。"},{"angle":"实操流程","text":"13天假怎么用，给三套排法。第一套，长线远飞。9月27号出发，趁票价谷底把机票锁掉，去新疆、西藏、东北这种一趟不容易的地方，路上花两天也不心疼。郑州经固原到乌鲁木齐9月27号最低600，飞过去再转伊犁，十来天时间刚好。第二套，前紧后松。中秋三天先在家过节，9月28号早班机走，10月5号回，避开10月1号和10月7号两个最贵最堵的节点，回程票通常还有折扣。第三套，两段拆开。中秋9月25到27号做周边短途，休息两天，10月1号再出发一趟长线，代价是两头都撞高峰，只推荐给不打算请假的人。三套都要提前做的动作：住宿先订可免费取消的，中秋国庆热门城市酒店提前预订量同比涨了近四成，去晚了只剩贵的；热门线路机票先占位，郑州到乌鲁木齐、到三亚、到广州、到川渝这几条长假需求最旺，越拖越贵。"},{"angle":"反常识开场","text":"很多人算假期只盯10月1号，今年这么算最亏。今年中秋是9月25到27号，国庆10月1到7号，中间卡着9月28、29、30三个工作日。请这三天，13天连着休，年假只花三天，杠杆四倍多。更反常识的是价格。按常识请假出发肯定比法定假第一天贵，今年反过来：9月27号到10月1号这段机票均价创近三年同期最低，部分航线比去年还便宜一成多；9月22号出发的均价，比中秋首日低30%，比国庆首日低50%。原因是假期战线被拉长，出行需求摊到十几天里，不再挤在一两天，价格自然被打散。所以真正贵的日子只剩两个：10月1号出发、10月7号返程。把这两天躲开，机票、酒店、排队时间三样一起省。今年提前一个月订票的人比去年多了21%，酒店提前预订量涨了近四成，动作慢的只能捡剩下的。"}]},{"id":"tv4","title":"中俄免签满一周年，普京当面提议改成长期固定机制","hook":"中俄免签这个月满一周年，普京9月1号当面提议把它做成长期制度。","why":"免签目的地是旅游内容的长期流量点，政策层面刚出新表态，属于「可能变成常态」的信号；出境游清单类内容收藏率高。","heat":"中高","tags":["俄罗斯","免签","政策","出境游"],"facts":["2025年9月2日中俄元首北京会晤期间，中方宣布自9月15日起对俄罗斯公民试行免签；同年12月普京签署总统令对等对中国公民实施免签（来源：驻俄罗斯大使张汉晖接受《消息报》采访，中国外交部网站，2026-09-01）","2026年5月和7月中方与俄方相继宣布将免签政策延长至2027年12月31日（来源：中国外交部网站，2026-09-01）","自2026年7月20日起中俄免签在互惠基础上生效，两国持普通因私护照公民互免签证入境、停留不超过30天，适用旅游、商务、探亲访友、各类交流及过境（来源：俄罗斯卫星通讯社，2026-09-01）","2026年9月1日普京在上海合作组织比什凯克峰会期间与中方会谈时表示，如中方认为可行且有益，俄方愿共同推动将免签制度转为长期固定机制（来源：俄罗斯卫星通讯社，2026-09-01）","普京称今年上半年旅游流量增长43%（来源：俄罗斯卫星通讯社，2026-09-01）","2025年中俄人员往来总量突破300万人次；2026年第一季度中国赴俄旅游15.42万人次同比增长44%；上半年俄罗斯位列中国入境游客来源国第二位（来源：中方统计，中国外交部网站，2026-09-01）","2026年1至7月中俄贸易额1592.4亿美元，同比增长26.3%（来源：中国外交部网站，2026-09-01）","2026年1至5月中俄边境贸易额28.4亿美元，同比增长20%，占中国边贸总额12.8%（来源：中方统计，中国外交部网站，2026-09-01）"],"scripts":[{"angle":"干货直给","text":"中俄免签这件事有新进展。9月1号上合组织峰会在比什凯克开，普京跟中方会谈时明确说，如果中方认为可行且有益，俄方愿意一起把免签转成长期固定机制。翻译一下：现在这套是有期限的安排，对方想把它做成常态。先把现状说清楚。2026年7月20号起，中俄在互惠基础上互免签证，两国持普通因私护照的公民互相免签入境，单次停留不超过30天，用途覆盖旅游、商务、探亲访友、各类交流和过境。这套安排目前的期限是2027年12月31日，今年5月和7月两边分别宣布过延长。效果摆在数据上：2025年两国人员往来总量突破300万人次；2026年第一季度中国赴俄旅游15.42万人次，同比增长44%；普京说上半年旅游流量涨了43%。上半年俄罗斯还排到中国入境游客来源国第二位。想去的，30天停留够跑莫斯科、圣彼得堡加贝加尔湖，拿护照直接走。"},{"angle":"故事切入","text":"去年这个时候，去俄罗斯还得办签证。2025年9月2号两国元首北京会晤期间，中方宣布从9月15号起对俄罗斯公民试行免签，同年12月普京签总统令对等回应，对中国公民免签。到2026年7月20号，互免正式在互惠基础上落地：普通因私护照，互相免签入境，停留不超过30天。一年时间，这条线从交材料排队，变成拿着护照就走。数据也跟着变了。2026年第一季度中国赴俄旅游15.42万人次，同比增长44%；上半年俄罗斯成了中国入境游客来源国第二名；1到7月两国贸易额1592.4亿美元，同比增26.3%。9月1号在比什凯克，普京又往前推了一步，说愿意把免签转成长期固定机制。要去的话记三件事：现行安排的期限到2027年12月31日；单次停留30天，旅游、商务、探亲、交流、过境都算；免签只免掉提前办签证这一步，往返行程和住宿材料入境时该带还得带。"},{"angle":"反常识开场","text":"免签这两个字，很多人以为就是省一笔签证费。看中俄这条线的数据，省掉的其实是决策成本。2025年9月中方对俄试行免签，12月俄方对等回应，2026年7月20号互免正式生效，普通因私护照互相免签、停留30天。结果是2026年第一季度中国赴俄旅游15.42万人次，同比涨44%；上半年俄罗斯直接排到中国入境游客来源国第二位；1到7月两国贸易额1592.4亿美元，同比增26.3%，边境贸易前五个月28.4亿美元、涨20%。人流带着货流一起动。第二个反常识：免签不一定长久。现在这套的有效期到2027年12月31日，是延长过一次的安排，不是永久制度。9月1号普京在比什凯克提出愿意转成长期固定机制，恰恰说明双方都清楚临时安排随时可以收。参考今年泰国把单边60天免签收回的操作，免签窗口开着的时候就去，别默认它一直在。"}]},{"id":"tv5","title":"同一个景点排队从两小时缩到十几分钟，酒店还打五折","hook":"同一个景点，暑假排两小时，现在排十几分钟，酒店还打五折。","why":"从「省钱」切到「省时间和体验」，正中不爱人挤人的男性观众；数据出自权威采访，说服力强，而且每年同一时段可复用。","heat":"中高","tags":["错峰","酒店","景区","淡季"],"facts":["云南、贵州、新疆、四川多家酒店9月初客房报价较暑期高峰下调明显，部分酒店折扣低至五折，部分周末入住房型可享免费下午茶、景区接驳等增值服务（来源：记者采访，央视财经，2026-09-01）","多家景区反馈近期客流量较暑期高峰明显回落，部分热门景点排队等候时长由暑期的一至两小时缩减至十多分钟（来源：景区工作人员，央视财经，2026-09-01）","同程研究院首席研究员程超功：对看重性价比和游玩感受的游客，9月第一、二周是较为理想的出行时段，可规避旺季高额花销与长时间等候（来源：同程研究院，2026-09-01）","9月首周国内机票均价较暑期高峰下降35%；9月2日北京直飞昆明含机建燃油总价最低降至800多元（来源：央视财经，2026-09-01）","2026年暑运7月1日至8月31日，铁路杭州站累计发送旅客2158.07万人次、日均34.81万人次，与2025年同期基本持平；杭州萧山国际机场62天保障航班5.9万架次、运送旅客938.7万人次，同比增1.1%，创暑运历史新高（来源：每日商报、杭州政协网，2026-09-02）","林智杰提示长期规律：4月、11月、12月为民航传统淡季，机票价格整体更为优惠（来源：中国航空运输协会特聘专家，2026-09-01）"],"scripts":[{"angle":"干货直给","text":"9月上半月出门，最值的不是机票便宜，是人少。多家景区给出的说法：近期客流量比暑期高峰明显回落，部分热门景点排队等候时长从暑期的一到两小时，压到十几分钟。同一个大门、同一个项目，时间成本差了五倍以上。住宿同步降。云南、贵州、新疆、四川多家酒店9月初客房报价比暑期高峰下调明显，部分打到五折，一些周末入住的房型还带免费下午茶和景区接驳车。机票也在谷底，9月第一周国内均价比暑期高峰跌35%，9月2号北京直飞昆明含机建燃油最低800多，跟暑假差了一千多。同程研究院首席研究员程超功的判断是，9月第一、二周是比较理想的出行时段，能避开旺季的高花销和长等待。提示一句：这个窗口从9月中旬开始收窄，越靠近中秋越贵。真想玩得舒服，现在动手比等假期强。"},{"angle":"横向对比","text":"把暑假出游和9月初出游摆一起算笔账。排队时间，暑期热门景点一到两小时，9月初部分景点十几分钟。住宿，云南、贵州、新疆、四川多家酒店9月初报价比暑期高峰明显下调，部分五折，还有房型送下午茶和景区接驳。机票，9月第一周国内均价比暑期高峰跌35%，北京直飞昆明含税最低800多，暑期高峰同一条线差价超过一千。天气，9月全国大部分地区秋高气爽，比七八月三十几度暴走舒服得多。人流，暑运7月1号到8月31号刚结束，杭州机场62天运送旅客938.7万人次、同比涨1.1%，创暑运历史新高，那些人现在都回去上课上班了。唯一的代价是要请年假。一天年假换来的是五折房、跌35%的机票、十几分钟的队。喜欢清静的，这个账很好算。再记一条长期规律：民航传统淡季在4月、11月和12月，这三个月机票整体更便宜。"},{"angle":"反常识开场","text":"旅游最贵的成本不是机票，是排队。暑期热门景点排一到两小时，一天下来光在队里就耗掉三四个钟头，门票钱一分没省，假期先没了。9月初反过来，多家景区说客流量比高峰明显回落，部分热门景点等候时间压到十几分钟。第二个反常识：淡季不代表体验差。云南、贵州、新疆、四川多家酒店9月初报价比暑期高峰下调明显，部分五折，一些周末房型还送下午茶和景区接驳；机票9月第一周均价跌35%，北京到昆明含税800多。价格降了，服务反倒更从容，因为酒店空房多、景区不用限流。第三个：9月不是旅游的边角料，是被低估的正季。全国大部分地区这时候秋高气爽，同程研究院程超功直接把9月第一、二周点成理想出行时段。所以问题不是要不要错峰，是敢不敢请那两天年假。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"Anthropic 新旗舰不涨价，缓存读取直接砍掉75%","hook":"新旗舰不涨价，缓存读取砍到四分之一，用得越重省得越多。","why":"用 AI 的人最关心月底账单，降价幅度具体、能当场算出自己省多少，属于高转发的实用信息。","heat":"高","tags":["Anthropic","降价","Agent","模型"],"facts":["当地时间9月1日Anthropic推出「全球最先进的编程和知识工作模型」Fable 5.1，同时为拥有Mythos访问权限的用户发布Mythos 5.1（来源：公司官网，财联社报道，2026-09-02）","Fable与Mythos本质是同一模型，安全防护级别不同，后者对生物学、网络安全等高风险领域的某些任务采用更宽松防护（来源：财联社，2026-09-02）","按Token计费的典型工作负载，Fable 5.1预期使用成本比Fable 5低25%，主因缓存读取价格下降75%（每百万Token由1美元降至0.25美元）；高度智能体化任务节省幅度最高约45%（来源：财联社、AI Daily Brief，2026-09-02）","Terminal-Bench-Science 0.1得分52.6%，前代24.7%；Terminal-Bench 4.0由42%升至55.8%；CursorBench 3.2以73.4%领跑（来源：AI Daily Brief，2026-09-02）","基础价格不变，已上线Claude Code、Claude Platform和Cursor（来源：AI Daily Brief，2026-09-02）","官方称强化了长时程智能体能力，可连续数小时完成编程、研究和知识工作，过程中自主验证结果、调整优先级，减少中途跑偏（来源：财联社，2026-09-02）","官方称Fable 5.1在中等或低努力程度下即可交付Fable 5高努力程度相当甚至更好的结果（来源：财联社，2026-09-02）","OpenAI预告网络安全模型Astra达到其Preparedness Framework最高级Critical，仅向一小部分测试人员开放高级网络安全功能，发布日期未披露（来源：凤凰网、AI Daily Brief，2026-09-02）","有报道称Anthropic计划在美国劳动节后公开招股书，最快9月底登陆美股（来源：财联社引述报道，2026-09-02，待核实）"],"scripts":[{"angle":"干货直给","text":"Anthropic 换旗舰了，重点不在跑分在账单。9月1号 Fable 5.1 和 Mythos 5.1 发布，号称全球最先进编程和知识工作模型。基础价没动，降的是缓存读取：每百万 Token 从1美元砍到0.25，降75%。典型 Token 负载预期成本比上代低25%；高度智能体、反复读同批上下文，最高省45%。缓存读取是模型重复读已处理输入的费用，长对话、长文档、反复迭代受益最大。能力也有账：Terminal-Bench 4.0 从42%到55.8%，Science 24.7%跳52.6%，CursorBench 3.2 拿73.4%领跑。官方强调长时程：连续几小时干编程研究，中间自验、调优先级，少跑偏。已上线 Claude Code、Platform、Cursor。"},{"angle":"横向对比","text":"同一天两个消息放一起看。Anthropic 发 Fable 5.1 主打性价比：基础价不变，缓存读取每百万 Token 从1美元降到0.25、砍75%，典型负载总成本比上代低25%，重度智能体最高省45%。OpenAI 的 Astra 被自家 Preparedness Framework 判为网络安全能力达最高级 Critical，误用或致重大危害，只向少数测试者开高级功能，发布日未定。一边降价抢量，一边锁能力控风险。Fable 和 Mythos 同一模型，区别在防护级别，Mythos 对生物、网络安全等高风险任务限制更松。跑分 Terminal-Bench 4.0 从42%到55.8%，CursorBench 3.2 是73.4%。现已能在 Claude Code、Platform、Cursor 用。"},{"angle":"反常识开场","text":"模型越强越贵，这条规律今年不成立了。9月1号 Anthropic 发 Fable 5.1，官方口径是全球最先进的编程和知识工作模型，基础价格一分没涨，缓存读取反而从每百万 Token 1美元降到0.25美元，砍了75%。典型工作负载算下来，成本比上一代低25%，重度智能体任务最高省45%。更狠的一句在后面：现在 Fable 5.1 在中等甚至低努力程度下，就能交出上一代高努力程度的结果，同样的活用更便宜的档位就够了。为什么敢这么打，因为竞争已经不在跑分榜上。Terminal-Bench 4.0 从42%提到55.8%，Terminal-Bench-Science 从24.7%到52.6%，这些数字对普通用户没什么感知，但账单有。谁能让人一天跑几百次任务还不心疼，谁就拿走使用量。所以别再问哪个模型最强，先问哪个模型让你敢连续用八小时。"}]},{"id":"ai2","title":"千问创作上线 Agent Teams：提一个创意，五个 Agent 当剧组","hook":"提一个创意，编剧、导演、美术、剪辑几个 Agent 自己开工，成片直接出来。","why":"直接对口做短视频的人，交互方式从「写提示词」变成「提想法」，工具已全量开放、当天能上手，是能出实测内容的选题。","heat":"高","tags":["千问","Agent","AI视频","工具"],"facts":["8月31日千问创作推出Agent Teams功能并接入Wan3.0，已面向全部用户开放，在PC端c.qianwen.com和千问App同步上线（来源：广州日报大洋网，2026-08-31；AIBase，2026-08-31）","编剧、导演、美术、摄影、剪辑等角色Agent各司其职，依次完成剧本创作、分镜设计、角色设定、视频生成和成片剪辑（来源：广州日报大洋网，2026-08-31）","千问创作首发接入Wan 3.0视频生成模型及其Prime版，同时汇集Qwen-Image-3.0等图像模型，由Agent Teams按创作环节规划并调用（来源：AIBase、广州日报，2026-08-31）","场景覆盖AI短剧与漫剧、营销广告、音乐MV、图像设计及游戏内容；上传品牌资料和商品素材后，系统围绕目标人群与产品卖点策划广告片（来源：AIBase，2026-08-31）","创作过程中用户可随时补充想法、提出修改意见，Agent自主调整创作（来源：广州日报大洋网，2026-08-31）","Wan3.0于8月24日接入阿里云百炼、千问AI平台、万相官网和千问App（来源：第三方汇编，2026-09-01，待核实）","Wan3.0单段最长30秒一镜到底、原生音画同步、支持doc/xls/ppt/pdf/md等文档输入；480P 0.3元/秒、720P 0.6元/秒、1080P 1.2元/秒，8月24日至9月23日限时7折；Agent Teams输出720P、单秒价格低至0.26元（来源：单一第三方汇编，待核实）","DataEye统计：2026年上半年抖音上新AI剧漫剧22.19万部、日均超1200部，以5000万播放为盈亏平衡线仅2886部过线、占比1.3%（来源：单一第三方汇编引DataEye，待核实）"],"scripts":[{"angle":"干货直给","text":"做视频的注意，阿里千问8月31号上线了 Agent Teams，已经面向全部用户开放，电脑上进 c.qianwen.com，手机上千问 App 也有。它干的事是把多个 Agent 拆成一个剧组。你提一个创意，系统自己规划任务：编剧 Agent 写剧本，导演 Agent 做分镜，美术 Agent 定角色设定，摄影和剪辑 Agent 接生成和成片，一路串下来。以前是你自己拆流程、自己写每一段提示词、自己接素材，现在是描述想法，它拆解执行。模型层面，平台首发接的是 Wan3.0 视频生成模型和效果更强的 Prime 版，图像那边挂着 Qwen-Image-3.0，由 Agent Teams 按环节调用。场景覆盖 AI 短剧、漫剧、营销广告、音乐 MV、图像设计和游戏内容。带货的用法很直接：上传品牌资料和商品素材，它围绕目标人群和产品卖点策划广告片。过程中不满意可以随时插话改，Agent 自己调整。今天就能测。"},{"angle":"实操流程","text":"用千问 Agent Teams 出一条带货片，流程这么走。第一步，电脑打开 c.qianwen.com，或者手机开千问 App，功能已经全量开放，不用等资格。第二步，别急着写提示词，写创意。一句话讲清楚卖什么、给谁看、什么调性，比如三十岁男性通勤用的保温杯，主打一手拎不烫，冷感真实风。第三步，把料喂进去，品牌资料、商品图、卖点文档都上传，系统会围绕目标人群和产品卖点策划广告片。第四步，看它拆任务：编剧出脚本、导演出分镜、美术定角色和风格，后面接画面生成和成片剪辑，每一环都能看到中间结果。第五步，在关键节点插话，分镜不对就说分镜，节奏不对就说节奏，Agent 会自主调整，不用从头再来。第六步，成片下载后自己再过一遍，配文和封面还得人来定。模型是 Wan3.0 和 Prime 版，图像走 Qwen-Image-3.0，由它按环节自己调用，你不用挑。"},{"angle":"反常识开场","text":"很多人担心 AI 把编剧和导演干掉了。看千问 Agent Teams 这套设计，被替掉的不是做决策的人，是中间跑腿的活。8月31号上线，全量开放，你提一个创意，编剧 Agent 写剧本、导演 Agent 做分镜、美术 Agent 定角色，后面接生成和剪辑成片。省掉的是背提示词、切工具、拼素材这些重复劳动；审美怎么定、剧情往哪拐，还在你手里，过程中随时能插话让它改，说明产品自己也认这一点。第二个反常识：门槛降低不等于机会变多。AI 短剧、漫剧、营销广告、音乐 MV 全都能一句话开工，意味着明天跟你抢流量的人用的是同一套工具。工具被拉平之后，值钱的东西反而回到创意本身和对人群的理解。所以别急着问它能不能替我干活，先想清楚替出来的时间你打算干什么。"}]},{"id":"ai3","title":"讯飞开源端侧模型：手机上跑，能一次吃进一百万 Token","hook":"手机上跑的模型，能一次吃进一百万 Token，还是国产算力从头训的。","why":"端侧意味着离线可用、数据不出设备、没有 API 账单，是能落到普通人手上的实变化；权重开源，属于可动手的玩法。","heat":"中高","tags":["讯飞","端侧","开源","国产算力"],"facts":["9月1日科大讯飞子公司词元星火开源星火X2.5-4B与1.7B两款端侧通用大模型（来源：腾讯研究院AI速递，2026-09-02；今日头条汇编，2026-09-01）","官方称是端侧唯一原生支持最长100万Token上下文的模型（来源：腾讯研究院AI速递，2026-09-02；今日头条汇编，2026-09-01）","采用混合注意力架构，围绕智能体、代码、数学与指令遵循优化（来源：腾讯研究院AI速递，2026-09-02）","基于全国产算力用约20万亿Token预训练，适配英伟达、华为、海光等平台与vLLM、llama.cpp等框架（来源：腾讯研究院AI速递，2026-09-02）","权重已在Hugging Face、GitHub开放，可部署于手机、PC、汽车座舱与机器人（来源：今日头条汇编，2026-09-01）","智能家居控制端到端正确率90.3%，平均响应0.85秒（来源：单一来源腾讯研究院AI速递，2026-09-02，待核实）"],"scripts":[{"angle":"干货直给","text":"9月1号，科大讯飞子公司词元星火开源了两个端侧模型，星火 X2.5-4B 和 1.7B。参数很小，40亿和17亿，能塞进手机、电脑、汽车座舱和机器人。关键点是上下文：官方说法是端侧唯一原生支持最长100万 Token 上下文的模型。100万 Token 在端侧是什么概念，整份合同、整套代码库、几十万字的资料，可以一次性丢给它，还不用联网。架构上用的是混合注意力，围绕智能体、代码、数学和指令遵循做过优化。训练侧更值得提一句：基于全国产算力，用了大约20万亿 Token 预训练，同时适配英伟达、华为、海光等平台，以及 vLLM、llama.cpp 这些推理框架。权重已经在 Hugging Face 和 GitHub 上开放。为什么这事对普通人有意义：模型跑在自己设备上，数据不出去，没有 API 账单，断网也能用。想动手的，llama.cpp 那条路对着 1.7B 先试，一台普通笔记本就够。"},{"angle":"横向对比","text":"端侧模型和云端模型现在是两条路，对着看一遍。云端，参数上千亿，能力最强，但要联网、按 Token 付费、数据得交出去。端侧，讯飞9月1号开源的星火 X2.5 是 4B 和 1.7B 两档，跑在手机、电脑、汽车座舱和机器人上，不联网、不计费、数据不出设备。过去端侧最大的短板是记不住东西，上下文窗口小，长文档喂不进去；这次官方口径是端侧唯一原生支持最长100万 Token 上下文，短板被正面补了一刀。第二个差别在生态。星火 X2.5 用全国产算力、约20万亿 Token 预训练，同时适配英伟达、华为、海光等平台，以及 vLLM 和 llama.cpp，权重挂在 Hugging Face 和 GitHub 上，不绑硬件也不绑云。选哪条看活儿：要最强推理、复杂长任务，还是云端；要隐私、要离线、要零边际成本，端侧已经够用了。"},{"angle":"反常识开场","text":"参数越大越强，这个直觉在端侧不成立。9月1号讯飞开源的星火 X2.5 只有 4B 和 1.7B 两档，40亿和17亿参数，却做到端侧原生支持最长100万 Token 上下文，官方说这是端侧唯一。对使用者来说，模型能记住多少，往往比它有多聪明更影响体验：整本说明书、整个项目的代码、一年的聊天记录，能一次性喂进去，回答才不跑偏。第二个反常识：小模型的意义不是省钱，是把数据留在本机。跑在手机、电脑、汽车座舱、机器人上，不联网也能用，没有 API 账单，隐私问题直接消失一半。第三个：训它的算力是全国产的，约20万亿 Token 预训练，同时还适配英伟达、华为、海光，以及 vLLM、llama.cpp。权重在 Hugging Face 和 GitHub 上开放，谁都能下。真正的门槛已经不在能不能拿到模型，在你想用它解决什么问题。"}]},{"id":"ai4","title":"Runway 的界面世界模型：软件界面不写代码，一帧一帧生成","hook":"界面不再是写代码渲染出来的，而是像视频一样一帧一帧生成的。","why":"概念反直觉、画面感强，适合做「这东西会怎么改变软件」的解读；离普通用户还远，但话题度高、评论区有争议。","heat":"中高","tags":["Runway","世界模型","界面","Gen-4.5"],"facts":["Runway公布首个界面世界模型Solaris，App与网页界面可像视频一样实时生成，用户点击、拖拽后模型直接生成下一帧，无需开发者预先写好代码（来源：腾讯研究院AI速递，2026-09-02；AI早间简报，2026-09-02）","基于Gen-4.5视频模型改造，采用逐帧自回归、少步蒸馏与自生成结果训练，在720p下实现实时交互（来源：腾讯研究院AI速递，2026-09-02）","分工是语言模型负责推理、世界模型负责渲染（来源：腾讯研究院AI速递，2026-09-02）","人类对比测试中，指令遵循与行为自然度偏好分别达61%和71%，明显高于代码方案（来源：腾讯研究院AI速递，2026-09-02；AI早间简报提到偏好度61%，2026-09-02）","另一大用途是为Computer Use Agent提供泛化训练环境（来源：腾讯研究院AI速递，2026-09-02）","目前仅面向核心合作伙伴开放（来源：AI早间简报，2026-09-02）"],"scripts":[{"angle":"干货直给","text":"Runway 放出了 Solaris，官方叫界面世界模型。它做的事得先说清楚：App 和网页的界面，不是提前写好代码渲染出来的，而是像视频一样实时生成。你点一下、拖一下，模型直接生成下一帧画面，中间没有开发者写的按钮逻辑。技术底子是 Gen-4.5 视频模型改的，用了逐帧自回归、少步蒸馏，还有拿自己生成的结果继续训练，在 720p 分辨率下做到实时交互。分工是这样：语言模型负责推理接下来该发生什么，世界模型负责把画面渲出来。效果有对比数据，人类评测里指令遵循的偏好度61%，行为自然度71%，都明显高于传统写代码的方案。除了当界面用，Runway 提的另一个用途更有意思：给 Computer Use Agent 提供泛化训练环境，让操作电脑的 Agent 在生成出来的界面里练手，不用真机。目前只向核心合作伙伴开放，普通人还用不上。"},{"angle":"故事切入","text":"想象一个软件，里面所有按钮都不存在。你以为点的是按钮，其实点的是画面里一块像素；点下去之后，模型现场画出下一帧，看起来就像按钮响应了。这就是 Runway 刚公布的 Solaris，官方称首个界面世界模型。它基于 Gen-4.5 视频模型改造，用逐帧自回归加少步蒸馏，在 720p 下实现实时交互，语言模型负责想清楚接下来该发生什么，世界模型负责把这一帧渲出来。听着像玩具，人类评测的数字不小：指令遵循偏好61%，行为自然度71%，都比写代码的方案更受偏好。更实际的一个用途在幕后。现在很多 Agent 要学会操作电脑，缺的是练习场，真实软件跑一次慢、还可能出事；Solaris 可以生成无限多的界面，让 Computer Use Agent 在里面练泛化能力。目前只对核心合作伙伴开放，能不能出圈另说，方向已经摆出来了。"},{"angle":"反常识开场","text":"软件必须先写代码才有界面，这个前提正在被拆掉。Runway 公布的 Solaris 叫界面世界模型：App 和网页界面像视频一样实时生成，你点击、拖拽之后，模型直接生成下一帧，不需要开发者事先写好那段逻辑。第二个反常识：这不是画一张好看的 UI 图，是可交互的。基于 Gen-4.5 视频模型改造，逐帧自回归加少步蒸馏，720p 下实时响应，语言模型管推理、世界模型管渲染。人类对比测试里，指令遵循偏好61%、行为自然度71%，反而比代码方案更自然。第三个反常识也是我觉得最关键的：它最先落地的价值可能不在做软件，而在训 Agent。让操作电脑的 Agent 在生成的界面里反复练，比在真机上跑安全、快，还能无限造新场景。目前只面向核心合作伙伴，别急着找入口，先记住这条路已经通了。"}]},{"id":"ai5","title":"200天，AI 聊天框里的广告做到10亿美元年化收入","hook":"200天，AI 聊天框里的广告做到10亿美元年化收入。","why":"流量入口在迁移，对做内容和带货的人是分蛋糕规则的变化；数字有冲击力，容易引发讨论。","heat":"中高","tags":["OpenAI","广告","商业化","流量"],"facts":["8月31日OpenAI宣布广告业务年化收入达10亿美元，距2月在美国ChatGPT测试广告仅约200天（来源：每日经济新闻，经腾讯新闻转载，2026-08-31）","自周一起向印度、欧洲、中东及北非开放自助广告（来源：今日头条汇编，2026-09-01）","广告目前主要出现在免费版和低价Go套餐（来源：腾讯网硬科技日报，2026-09-01）","该收入线在IPO前构成利好，被指效仿Meta打法，直接切入Google与Meta的广告利润池（来源：每日经济新闻、今日头条汇编，2026-08-31/09-01）","分析口径：聊天入口拿到的不是关键词，而是用户表达的完整需求和意图；10亿美元对Google和Meta目前仍很小，但增长速度值得警惕（来源：腾讯网硬科技日报，2026-09-01）","同期OpenAI预告网络安全模型Astra达Critical级并限制访问，Anthropic披露7月30日、8月4日红队评估中三次未授权访问真实系统事件（来源：凤凰网、IT之家，2026-09-01/02）"],"scripts":[{"angle":"干货直给","text":"8月31号 OpenAI 公布一个数字：广告业务年化收入达到10亿美元。起点是今年2月在美国的 ChatGPT 里开始测试广告，到现在大约200天。从零到10亿美元年化，200天。位置也说清楚了，广告主要出现在免费版和低价的 Go 套餐上，付费高档暂时不放。同时从周一开始，自助投放向印度、欧洲、中东和北非开放，意思是中小广告主可以自己上后台买量了。这条线为什么重要。搜索广告拿到的是关键词，你搜保温杯，平台猜你想买；聊天框拿到的是完整需求，预算多少、给谁用、在意什么、上次买的哪款不满意。意图比关键词值钱得多。对 Google 和 Meta，10亿美元现在还是小钱，但增速摆在那儿。如果 ChatGPT 逐渐变成查商品、订行程、挑服务的入口，它抢的就是这两家最核心的地盘。"},{"angle":"横向对比","text":"同一件事，三个角度看。对 OpenAI，广告是上市前的第二条腿：今年2月在美国 ChatGPT 里测广告，到8月31号年化收入10亿美元，大约200天，广告位主要放在免费版和低价 Go 套餐，从周一起向印度、欧洲、中东和北非开放自助投放。对 Google 和 Meta，10亿美元目前占不到它们广告盘子的零头，但性质不一样：搜索广告买的是关键词，聊天入口拿到的是用户完整的需求和意图，转化路径更短。如果商品研究、旅行规划、服务选择这些环节都搬进对话框，被切走的是它们利润最厚的那块。对做内容和带货的人，变化更直接。过去流量入口是搜索框和推荐流，现在多了一个对话框，而且这个入口已经开始卖广告位。免费用户看到广告，说明它要的是规模，不是溢价。谁先摸清在 AI 对话里怎么被推荐出来，谁就先吃到这一轮。"},{"angle":"反常识开场","text":"AI 公司靠订阅赚钱，这个印象要改了。8月31号 OpenAI 说广告业务年化收入到了10亿美元，从今年2月在美国 ChatGPT 里开始测算起，大约200天。更反常识的是位置：广告主要投在免费版和低价 Go 套餐里，也就是投在不付钱的人身上，跟 Meta 当年的打法一模一样，用免费规模换广告收入。第二个反常识，聊天广告比搜索广告更值钱的原因不是流量大。搜索框里你输入的是关键词，平台只能猜；对话框里你说的是完整需求，预算、场景、给谁用、上一款为什么不满意，全都摆出来了。意图越完整，广告越准，单价越高。第三个，从周一起自助投放已经向印度、欧洲、中东和北非开放，中小广告主自己就能买。10亿美元对 Google 和 Meta 还不算威胁，但增长速度值得盯，入口一旦迁移，规则就得重写。"}]}]}]}}</script>

<script>
/* ================= data ================= */
var K={st:'wb_kb_status_v1',rf:'wb_kb_refs_v1',hs:'wb_kb_history_v1',mt:'wb_kb_meta_v1'};
var PACK_TODAY=JSON.parse(document.getElementById('packToday').textContent);
var PACK_HIST=JSON.parse(document.getElementById('packHistory').textContent);
var ST={},RF=[],HS={},MT={};
var curDate=PACK_TODAY.date,curTrack='all',curSt='all',curPane='today';
var STATES=['new','pick','shot','pub'];
var ST_LABEL={new:'未处理',pick:'已选用',shot:'已拍',pub:'已发'};
var ST_CLS={new:'st-new',pick:'st-pick',shot:'st-shot',pub:'st-pub'};

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('存储写入失败，建议先导出备份');return false}}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return n<10?'0'+n:''+n}
function daysBetween(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function wc(s){return (s||'').replace(/\s/g,'').length}
function secOf(s){return Math.round(wc(s)/300*60)}

function boot(){
  ST=lsGet(K.st,{});RF=lsGet(K.rf,[]);HS=lsGet(K.hs,{});MT=lsGet(K.mt,{});
  for(var d in PACK_HIST){if(!HS[d])HS[d]=PACK_HIST[d]}
  HS[PACK_TODAY.date]=PACK_TODAY;
  var keys=Object.keys(HS).sort().reverse();
  if(keys.length>30){keys.slice(30).forEach(function(k){delete HS[k]})}
  lsSet(K.hs,HS);
  curDate=PACK_TODAY.date;
  renderAll();
  checkTip();
}
function packOf(d){return HS[d]||PACK_TODAY}
function allScripts(d){
  var p=packOf(d),out=[];
  (p.tracks||[]).forEach(function(tk){(tk.topics||[]).forEach(function(tp,ti){(tp.scripts||[]).forEach(function(sc,si){
    out.push({id:d+'|'+tk.id+'|'+tp.id+'|'+si,date:d,trackId:tk.id,trackName:tk.name,topic:tp,topicIdx:ti,sc:sc,si:si});
  })})});
  return out;
}
function stOf(id){return (ST[id]&&ST[id].s)||'new'}
function stTs(id){return (ST[id]&&ST[id].t)||null}
function setSt(id,s){
  if(s==='new'){delete ST[id]}else{ST[id]={s:s,t:today()}}
  lsSet(K.st,ST);renderAll();checkTip();
}

/* ================= today ================= */
function buildTodo(){
  var td=today(),items=[];
  Object.keys(HS).sort().reverse().forEach(function(d){
    allScripts(d).forEach(function(x){
      var s=stOf(x.id),t=stTs(x.id);
      if(s==='pub')return;
      if(s==='new'){
        if(d===PACK_TODAY.date)items.push({x:x,kind:'new',od:false,msg:'今天新出的稿，还没看'});
        return;
      }
      var age=t?daysBetween(t,td):0;
      if(s==='pick')items.push({x:x,kind:'pick',od:age>=1,msg:age>=1?('选用了 '+age+' 天还没拍'):'今天选用，等拍'});
      if(s==='shot')items.push({x:x,kind:'shot',od:age>=1,msg:age>=1?('拍完 '+age+' 天还没发'):'今天拍完，等发'});
    })
  });
  items.sort(function(a,b){
    if(a.od!==b.od)return a.od?-1:1;
    var o={shot:0,pick:1,new:2};return o[a.kind]-o[b.kind];
  });
  return items;
}
function renderToday(){
  var items=buildTodo(),od=items.filter(function(i){return i.od});
  var td=PACK_TODAY.date,all=allScripts(td);
  var cnt={new:0,pick:0,shot:0,pub:0};
  all.forEach(function(x){cnt[stOf(x.id)]++});
  var pubAll=0;Object.keys(HS).forEach(function(d){allScripts(d).forEach(function(x){if(stOf(x.id)==='pub')pubAll++})});

  document.getElementById('stats').innerHTML=
    st('今日新稿',all.length,'')+st('待拍',cnt.pick,'')+st('逾期',od.length,'od')+st('累计已发',pubAll,'dn');

  var show=items.slice(0,8);
  document.getElementById('todayN').textContent=items.length?(items.length+' 项待办'):'全部清空';
  document.getElementById('tlist').innerHTML=show.length?show.map(function(i){
    var nx=i.kind==='new'?'pick':(i.kind==='pick'?'shot':'pub');
    var lb=i.kind==='new'?'选用':(i.kind==='pick'?'标已拍':'标已发');
    return '<div class="titem'+(i.od?' od':'')+'">'+
      '<div class="bd"><div class="t">'+esc(i.x.topic.title)+'　·　'+esc(i.x.sc.angle)+'</div>'+
      '<div class="m">'+(i.x.date!==PACK_TODAY.date?('['+i.x.date+'] '):'')+esc(i.msg)+'</div></div>'+
      '<button class="go" onclick="setSt(\''+i.x.id+'\',\''+nx+'\')">'+lb+'</button></div>';
  }).join('')+(items.length>8?'<div style="text-align:center;font-size:12px;color:var(--text3);padding-top:4px">还有 '+(items.length-8)+' 项，去口播稿库看全部</div>':'')
  :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>今天没有待办，去选题池挑几条</div>';

  document.getElementById('navBdg').style.display=od.length?'':'none';
  document.getElementById('navBdg').textContent=od.length;

  var p=PACK_TODAY;
  document.getElementById('ovCnt').textContent=p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题 / '+all.length+' 稿';
  document.getElementById('overview').innerHTML=p.tracks.map(function(tk){
    return '<div class="card tk-'+tk.id+'" style="margin-bottom:12px;padding:13px 14px">'+
      '<div style="font-weight:700;font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--'+(tk.id==='travel'?'travel':'ai')+')"></span>'+esc(tk.name)+
      '<span style="margin-left:auto;font-size:11.5px;color:var(--text3);font-weight:600">'+tk.topics.length+' 条</span></div>'+
      tk.topics.map(function(tp,i){
        var done=tp.scripts.filter(function(_,si){return stOf(td+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
        return '<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.5">'+
          '<span style="color:var(--text3);font-weight:700;font-variant-numeric:tabular-nums;flex:none">'+(i+1)+'</span>'+
          '<span style="flex:1;min-width:0">'+esc(tp.title)+'</span>'+
          '<span style="flex:none;font-size:11px;color:'+(done?'var(--ok)':'var(--text3)')+';font-weight:700">'+done+'/'+tp.scripts.length+'</span></div>';
      }).join('')+'</div>';
  }).join('');
}
function st(l,v,c){return '<div class="stat '+c+'"><b>'+v+'</b><span>'+l+'</span></div>'}

/* ================= topics ================= */
function renderTracks(){
  var p=packOf(curDate);
  var h='<button class="ttab'+(curTrack==='all'?' on':'')+'" data-k="all" onclick="setTrack(\'all\')">全部<span class="s">'+
    p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题</span></button>';
  p.tracks.forEach(function(tk){
    h+='<button class="ttab'+(curTrack===tk.id?' on':'')+'" data-k="'+tk.id+'" onclick="setTrack(\''+tk.id+'\')">'+esc(tk.name)+'<span class="s">'+tk.topics.length+' 选题</span></button>';
  });
  document.getElementById('ttabs1').innerHTML=h;
  document.getElementById('ttabs2').innerHTML=h;
  var f=[['all','全部'],['new','未处理'],['pick','已选用'],['shot','已拍'],['pub','已发']];
  document.getElementById('stfilter').innerHTML=f.map(function(x){
    return '<button class="ttab'+(curSt===x[0]?' on':'')+'" data-k="all" style="font-size:12.5px;padding:8px 4px;min-height:40px" onclick="setStF(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function setTrack(t){curTrack=t;renderTracks();renderTopics();renderScripts()}
function setStF(s){curSt=s;renderTracks();renderScripts()}
function renderTopics(){
  var p=packOf(curDate),h='';
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    h+='<div class="topics-grid">'+tk.topics.map(function(tp,i){
      var fid=tk.id+'_'+tp.id;
      var done=tp.scripts.filter(function(_,si){return stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
      return '<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main">'+
        '<div class="tp-t">'+esc(tp.title)+'</div>'+
        '<div class="tp-tags"><span class="tag hot">热度 '+esc(tp.heat)+'</span>'+
        (tp.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
        '<span class="tag">'+done+'/'+tp.scripts.length+' 已处理</span></div>'+
        '<div class="tp-why"><b>开场钩子：</b>'+esc(tp.hook)+'<br><b>为什么今天做：</b>'+esc(tp.why)+'</div>'+
        '</div></div>'+
        '<div class="fold"><button class="fold-b" onclick="fold(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>事实与数据（'+(tp.facts||[]).length+' 条，念之前先扫一眼）</button>'+
        '<div class="fold-c"><ul class="facts">'+(tp.facts||[]).map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div></div>'+
        '<div class="scripts">'+tp.scripts.map(function(sc,si){return scHtml(tk,tp,sc,si)}).join('')+'</div>'+
        '</div>';
    }).join('')+'</div>';
  });
  document.getElementById('topicList').innerHTML=h||'<div class="card"><div class="empty">这天没有内容</div></div>';
}
function scHtml(tk,tp,sc,si){
  var id=curDate+'|'+tk.id+'|'+tp.id+'|'+si,s=stOf(id),n=wc(sc.text),sec=secOf(sc.text);
  var nx=s==='new'?'pick':(s==='pick'?'shot':(s==='shot'?'pub':'new'));
  var nxL=s==='new'?'选用':(s==='pick'?'标已拍':(s==='shot'?'标已发':'重置'));
  var t=stTs(id),od=(s==='pick'||s==='shot')&&t&&daysBetween(t,today())>=1;
  return '<div class="sc">'+
    '<div class="sc-hd"><span class="sc-a">'+esc(sc.angle)+'</span>'+
    '<span class="sc-m">'+n+' 字 · 约 '+sec+' 秒</span>'+
    '<span class="sc-st '+ST_CLS[s]+'">'+ST_LABEL[s]+(od?' · 逾期':'')+'</span></div>'+
    '<div class="sc-tx" onclick="this.classList.toggle(\'open\')">'+esc(sc.text)+'</div>'+
    '<div class="sc-acts">'+
    '<button class="sbtn pri" onclick="copy(this,'+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>'+
    '<button class="sbtn" onclick="openTele('+q(tp.title+' · '+sc.angle)+','+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M6 8h12M6 12h8"/></svg>念稿</button>'+
    '<button class="sbtn '+(od?'od':(s==='pub'?'act':''))+'" onclick="setSt(\''+id+'\',\''+nx+'\')">'+nxL+'</button>'+
    (s!=='new'?'<button class="sbtn" onclick="setSt(\''+id+'\',\'new\')">撤销</button>':'')+
    '</div></div>';
}
function q(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')+"'"}
function fold(b){b.classList.toggle('open');b.nextElementSibling.classList.toggle('open')}

function renderScripts(){
  var p=packOf(curDate),h='',n=0;
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    tk.topics.forEach(function(tp,i){
      var list=tp.scripts.map(function(sc,si){return {sc:sc,si:si}}).filter(function(o){
        return curSt==='all'||stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+o.si)===curSt;
      });
      if(!list.length)return;
      n+=list.length;
      h+='<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd" style="padding-bottom:0"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main"><div class="tp-t" style="font-size:14.5px">'+esc(tp.title)+'</div></div></div>'+
        '<div class="scripts" style="border-top:none;margin-top:11px">'+list.map(function(o){return scHtml(tk,tp,o.sc,o.si)}).join('')+'</div></div>';
    });
  });
  document.getElementById('scriptList').innerHTML=h||'<div class="card"><div class="empty">没有符合筛选的稿子</div></div>';
}

/* ================= refs ================= */
var rStar=4;
function renderStars(){
  document.getElementById('rStars').innerHTML=[1,2,3,4,5].map(function(i){
    return '<button class="star'+(i<=rStar?' on':'')+'" onclick="rStar='+i+';renderStars()"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.8.9-5 4.7 1.3 6.8L12 17.4 6 20.7l1.3-6.8-5-4.7 6.8-.9z"/></svg></button>';
  }).join('');
}
function addRef(){
  var t=document.getElementById('rTitle').value.trim();
  if(!t){toast('标题得填一下');return}
  RF.unshift({id:'r'+Date.now(),title:t,track:document.getElementById('rTrack').value,
    author:document.getElementById('rAuthor').value.trim(),link:document.getElementById('rLink').value.trim(),
    star:rStar,note:document.getElementById('rNote').value.trim(),date:today()});
  lsSet(K.rf,RF);
  ['rTitle','rAuthor','rLink','rNote'].forEach(function(i){document.getElementById(i).value=''});
  rStar=4;renderStars();renderRefs();toast('已存进灵感库');checkTip();
}
function delRef(id){RF=RF.filter(function(r){return r.id!==id});lsSet(K.rf,RF);renderRefs()}
function renderRefs(){
  document.getElementById('refCnt').textContent=RF.length+' 条';
  var TN={travel:'旅游攻略',ai:'AI 资讯与玩法',other:'其他'};
  document.getElementById('refList').innerHTML=RF.length?RF.map(function(r){
    return '<div class="ref"><div class="ref-h"><div style="flex:1;min-width:0">'+
      '<div class="ref-t">'+esc(r.title)+'</div>'+
      '<div class="ref-m"><span class="tag">'+esc(TN[r.track]||r.track)+'</span>'+
      (r.author?'<span>@'+esc(r.author)+'</span>':'')+
      '<span style="color:#f5a623;letter-spacing:1px">'+'★'.repeat(r.star)+'<span style="color:#dfe3e8">'+'★'.repeat(5-r.star)+'</span></span>'+
      '<span>'+esc(r.date)+'</span></div>'+
      (r.note?'<div class="ref-n">'+esc(r.note)+'</div>':'')+
      (r.link?'<a class="ref-l" href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.link)+'</a>':'')+
      '</div><button class="xbtn" onclick="delRef(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>';
  }).join(''):'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>刷到好片子就存一条，做选题时翻一翻</div>';
}

/* ================= teleprompter ================= */
var teleSize=26,rolling=false,rollT=null,spd=1;
function openTele(t,x){
  document.getElementById('teleTitle').textContent=t;
  document.getElementById('teleTx').textContent=x;
  document.getElementById('teleBd').scrollTop=0;
  document.getElementById('tele').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeTele(){stopRoll();document.getElementById('tele').classList.remove('on');document.body.style.overflow=''}
function teleFont(d){teleSize=Math.max(16,Math.min(52,teleSize+d));document.getElementById('teleTx').style.fontSize=teleSize+'px'}
function toggleRoll(){rolling?stopRoll():startRoll()}
function startRoll(){
  rolling=true;
  document.getElementById('rollBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>暂停';
  var bd=document.getElementById('teleBd');
  rollT=setInterval(function(){
    bd.scrollTop+=spd*0.6;
    if(bd.scrollTop+bd.clientHeight>=bd.scrollHeight-2)stopRoll();
  },28);
}
function stopRoll(){
  rolling=false;if(rollT)clearInterval(rollT);rollT=null;
  var b=document.getElementById('rollBtn');
  if(b)b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9z"/></svg>自动滚动';
}
function rollSpeed(d){spd=Math.max(.4,Math.min(3,+(spd+d*.2).toFixed(1)));document.getElementById('spdTx').textContent='×'+spd.toFixed(1)}

/* ================= backup ================= */
function doExport(){
  var d={_app:'kouban-workbench',_v:1,_at:new Date().toISOString(),status:ST,refs:RF,history:HS};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='选题台备份_'+today()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  MT.lastBackup=today();lsSet(K.mt,MT);hideTip();toast('已导出备份文件');
}
function doImport(el){
  var f=el.files&&el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      if(d.status)ST=Object.assign({},d.status);
      if(d.refs&&d.refs.length!==undefined)RF=d.refs.slice();
      if(d.history)for(var k in d.history){if(!HS[k])HS[k]=d.history[k]}
      HS[PACK_TODAY.date]=PACK_TODAY;
      lsSet(K.st,ST);lsSet(K.rf,RF);lsSet(K.hs,HS);
      renderAll();toast('已恢复：'+Object.keys(ST).length+' 条标记 / '+RF.length+' 条灵感');
    }catch(e){toast('文件读不出来，确认是本站导出的 JSON')}
    el.value='';
  };
  r.readAsText(f);
}
var mkFn=null;
function askClear(){
  openMask('确认清空全部数据？','会删掉所有标记状态（已选用/已拍/已发）、对标灵感库和历史归档。今天的选题和稿子不受影响，会重新加载。这一步撤不回来，建议先点「导出备份」。',function(){
    localStorage.removeItem(K.st);localStorage.removeItem(K.rf);localStorage.removeItem(K.hs);localStorage.removeItem(K.mt);
    ST={};RF=[];HS={};MT={};HS[PACK_TODAY.date]=PACK_TODAY;lsSet(K.hs,HS);
    closeMask();curDate=PACK_TODAY.date;renderAll();toast('已清空');
  });
}
function openMask(t,p,fn){
  document.getElementById('mkT').textContent=t;document.getElementById('mkP').textContent=p;
  mkFn=fn;document.getElementById('mask').classList.add('on');
}
function closeMask(){document.getElementById('mask').classList.remove('on')}
document.getElementById('mkOk').onclick=function(){if(mkFn)mkFn()};
document.getElementById('mask').onclick=function(e){if(e.target===this)closeMask()};

function checkTip(){
  var n=Object.keys(ST).length+RF.length;
  if(n>=30&&MT.lastBackup!==today()&&!MT.tipHidden){
    document.getElementById('tipTx').textContent='数据已经攒到 '+n+' 条了，建议点右上角导出一份备份。换手机、清缓存都不怕。';
    document.getElementById('tipbar').classList.add('on');
  }else{document.getElementById('tipbar').classList.remove('on')}
}
function hideTip(){MT.tipHidden=today();lsSet(K.mt,MT);document.getElementById('tipbar').classList.remove('on')}

/* ================= misc ================= */
function copy(btn,tx){
  var ok=function(){var o=btn.innerHTML;btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>已复制';setTimeout(function(){btn.innerHTML=o},1400);toast('全文已复制，'+wc(tx)+' 字')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(tx).then(ok,function(){fb()})}else{fb()}
  function fb(){
    var ta=document.createElement('textarea');ta.value=tx;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('复制失败，长按稿子手动选')}
    document.body.removeChild(ta);
  }
}
var tT=null;
function toast(m){
  var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');
  if(tT)clearTimeout(tT);tT=setTimeout(function(){e.classList.remove('on')},2100);
}
function go(p){
  curPane=p;
  document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on')});
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
  window.scrollTo(0,0);
}
function switchDate(d){curDate=d;renderDateSel();renderTracks();renderTopics();renderScripts()}
function renderDateSel(){
  var ks=Object.keys(HS).sort().reverse();
  var h=ks.map(function(d){return '<option value="'+d+'"'+(d===curDate?' selected':'')+'>'+d+(d===PACK_TODAY.date?'（最新）':'')+'</option>'}).join('');
  document.getElementById('dateSel').innerHTML=h;
  document.getElementById('dateSel2').innerHTML=h;
  var bg=curDate===PACK_TODAY.date?'<span class="badge-live">今日最新</span>':'<span class="badge-old">历史归档</span>';
  document.getElementById('dateBadge').innerHTML=bg;
  document.getElementById('dateBadge2').innerHTML=bg;
}
function renderAll(){
  document.getElementById('hdSub').textContent=PACK_TODAY.date+' · 更新于 '+(PACK_TODAY.updatedAt||'10:00')+' · 共 '+allScripts(PACK_TODAY.date).length+' 篇稿';
  var ft='数据只存在这台设备的浏览器里，没有上传服务器。换设备 / 清缓存前记得导出备份。<br>每天 10:00 自动更新新一批选题与口播稿。';
  ['foot1','foot2','foot3','foot4'].forEach(function(i){document.getElementById(i).innerHTML=ft});
  renderDateSel();renderTracks();renderToday();renderTopics();renderScripts();renderRefs();renderStars();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeTele();closeMask()}
});
boot();
</script>
