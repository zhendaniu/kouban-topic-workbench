<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="选题台">
<meta name="theme-color" content="#1e293b">
<title>每日选题 · 口播稿工作台</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16191d; --text2:#666e7a; --text3:#98a1ad;
  --line:#e6e8ec; --line2:#f0f1f4;
  --primary:#2563eb; --primary-d:#1d4ed8;
  --travel:#0d9488; --travel-bg:#e7f6f4;
  --ai:#7c3aed; --ai-bg:#f1eafe;
  --danger:#dc2626; --danger-bg:#fdecec;
  --ok:#16a34a; --ok-bg:#e8f6ec;
  --warn:#d97706; --warn-bg:#fdf3e3;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.hd{background:#1e293b;color:#fff;padding:14px 0 16px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.045)}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd-sub{font-size:12.5px;color:#a8b4c6;margin-top:3px}
.hd-acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:rgba(255,255,255,.11);color:#e7edf5;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn svg{width:14px;height:14px;flex:none}

.tipbar{background:var(--warn-bg);color:#8a5a08;font-size:13px;padding:9px 14px;display:none;align-items:center;gap:8px;border-bottom:1px solid #f2e3c6}
.tipbar.on{display:flex}
.tipbar button{margin-left:auto;font-weight:700;color:#8a5a08;padding:4px 8px;font-size:12.5px}

/* ---------- section / card ---------- */
.sec{margin-top:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-hd h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sec-hd .cnt{font-size:12px;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- today ---------- */
.today{background:linear-gradient(180deg,#fff 0,#fcfdff 100%);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.today-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.today-h .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;animation:bp 1.8s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
.today-h h2{font-size:15.5px;margin:0;font-weight:700}
.today-h .n{margin-left:auto;font-size:12px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#f7f8fa;border-radius:10px;padding:9px 8px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--text2)}
.stat.od b{color:var(--danger)}
.stat.dn b{color:var(--ok)}
.tlist{display:flex;flex-direction:column;gap:7px}
.titem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:#f7f8fa;font-size:13.5px}
.titem.od{background:var(--danger-bg)}
.titem .bd{flex:1;min-width:0}
.titem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .m{font-size:11.5px;color:var(--text2);margin-top:1px}
.titem.od .m{color:#b03636}
.titem .go{flex:none;background:var(--text);color:#fff;border-radius:8px;padding:0 12px;height:34px;font-size:12.5px;font-weight:600}
.titem.od .go{background:var(--danger)}
.empty{text-align:center;padding:22px 12px;color:var(--text3);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.3;display:block;margin:0 auto 8px}

/* ---------- track tabs ---------- */
.ttabs{display:flex;gap:8px;margin-bottom:12px}
.ttab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 8px;text-align:center;font-weight:700;font-size:13.5px;color:var(--text2);min-height:46px;transition:.15s}
.ttab .s{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:1px}
.ttab[data-k="travel"].on{background:var(--travel-bg);border-color:var(--travel);color:#0b6b62}
.ttab[data-k="ai"].on{background:var(--ai-bg);border-color:var(--ai);color:#6127c4}
.ttab[data-k="all"].on{background:#e8eefc;border-color:var(--primary);color:var(--primary-d)}
.ttab.on .s{color:inherit;opacity:.75}

/* ---------- topic ---------- */
.topic{margin-bottom:12px;overflow:hidden}
.tp-hd{padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.tp-idx{flex:none;width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
.tk-travel .tp-idx{background:var(--travel)}
.tk-ai .tp-idx{background:var(--ai)}
.tp-main{flex:1;min-width:0}
.tp-t{font-size:15.5px;font-weight:700;line-height:1.42;letter-spacing:.1px}
.tp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;padding:2.5px 7px;border-radius:6px;background:#f0f1f4;color:var(--text2);font-weight:600}
.tk-travel .tag.hot{background:var(--travel-bg);color:#0b6b62}
.tk-ai .tag.hot{background:var(--ai-bg);color:#6127c4}
.tag.hot{font-weight:700}
.tp-why{margin-top:9px;font-size:13px;color:var(--text2);background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.55}
.tp-why b{color:var(--text);font-weight:700}
.fold{border-top:1px solid var(--line2)}
.fold-b{width:100%;text-align:left;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;min-height:44px}
.fold-b svg{width:13px;height:13px;transition:.2s}
.fold-b.open svg{transform:rotate(90deg)}
.fold-c{display:none;padding:0 14px 13px}
.fold-c.open{display:block}
.facts{margin:0;padding-left:17px}
.facts li{font-size:12.8px;color:var(--text2);line-height:1.62;margin-bottom:5px}

/* ---------- script ---------- */
.scripts{border-top:1px solid var(--line2);padding:11px 14px 13px;background:#fbfcfd}
.sc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.sc:last-child{margin-bottom:0}
.sc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc-a{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f7;color:#41546b}
.sc-m{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.sc-st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.st-new{background:#f0f1f4;color:var(--text2)}
.st-pick{background:var(--warn-bg);color:#a15c06}
.st-shot{background:#e8eefc;color:var(--primary-d)}
.st-pub{background:var(--ok-bg);color:#15803d}
.sc-tx{font-size:14px;line-height:1.78;color:#252a31;max-height:78px;overflow:hidden;position:relative;transition:max-height .25s;cursor:pointer}
.sc-tx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.sc-tx.open{max-height:2000px}
.sc-tx.open::after{display:none}
.sc-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);border-radius:9px;padding:0 11px;height:38px;font-size:12.5px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:#fff}
.sbtn svg{width:13px;height:13px}
.sbtn:hover{background:#f7f8fa}
.sbtn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.sbtn.pri:hover{background:#2b3138}
.sbtn.act{background:var(--ok-bg);border-color:#bfe3c9;color:#15803d}
.sbtn.od{background:var(--danger-bg);border-color:#f3cfcf;color:var(--danger)}

/* ---------- refs ---------- */
.form{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);min-height:46px}
.form textarea{min-height:74px;resize:vertical;line-height:1.6}
.frow{display:flex;gap:9px}
.frow>*{flex:1;min-width:0}
.stars{display:flex;gap:3px;align-items:center}
.star{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.star svg{width:21px;height:21px}
.star svg path{fill:#dfe3e8}
.star.on svg path{fill:#f5a623}
.ref{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ref:last-child{border-bottom:none}
.ref-h{display:flex;align-items:flex-start;gap:9px}
.ref-t{font-weight:700;font-size:14.5px;flex:1;min-width:0;line-height:1.45}
.ref-m{font-size:12px;color:var(--text3);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ref-n{font-size:13px;color:var(--text2);margin-top:7px;background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ref-l{font-size:12.5px;margin-top:6px;word-break:break-all;display:inline-block}
.xbtn{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.xbtn:hover{background:var(--danger-bg);color:var(--danger)}
.xbtn svg{width:15px;height:15px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text3);min-height:56px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--primary)}
.nav .bdg{position:absolute;top:5px;margin-left:22px;background:var(--danger);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:8px;font-weight:700}

/* ---------- teleprompter ---------- */
.tele{position:fixed;inset:0;background:#0e1116;color:#f2f4f7;z-index:200;display:none;flex-direction:column}
.tele.on{display:flex}
.tele-hd{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #232a33;flex:none}
.tele-hd .tt{font-size:13px;color:#8e9aa8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{background:#1c222b;color:#cfd7e0;border-radius:8px;min-width:40px;height:38px;padding:0 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbtn svg{width:15px;height:15px}
.tele-bd{flex:1;overflow-y:auto;padding:24px 20px 90px;-webkit-overflow-scrolling:touch}
.tele-tx{font-size:26px;line-height:2.05;letter-spacing:.6px;max-width:820px;margin:0 auto;white-space:pre-wrap}
.tele-ft{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0),#0e1116 32%);display:flex;gap:8px;align-items:center;justify-content:center}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.modal h3{margin:0 0 8px;font-size:16.5px}
.modal p{margin:0 0 16px;color:var(--text2);font-size:13.5px;line-height:1.65}
.modal-a{display:flex;gap:9px}
.modal-a button{flex:1;height:46px;border-radius:11px;font-weight:700;font-size:14px}
.mb-c{background:#f0f1f4;color:var(--text)}
.mb-d{background:var(--danger);color:#fff}

/* ---------- toast / misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(84px + env(safe-area-inset-bottom));background:#16191d;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pane{display:none}
.pane.on{display:block}
.datesel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-bottom:11px;flex-wrap:wrap}
.datesel select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:14px;font-weight:600;color:var(--text)}
.badge-live{font-size:10.5px;background:var(--ok-bg);color:#15803d;padding:3px 7px;border-radius:6px;font-weight:700}
.badge-old{font-size:10.5px;background:var(--warn-bg);color:#a15c06;padding:3px 7px;border-radius:6px;font-weight:700}
.foot{text-align:center;color:var(--text3);font-size:11.5px;padding:22px 12px 8px;line-height:1.7}

@media(min-width:768px){
  body{padding-bottom:24px}
  .wrap{padding:0 22px}
  .hd{padding:18px 0 20px}
  .hd-title{font-size:19px}
  .nav{position:static;background:transparent;backdrop-filter:none;border-top:none;border-bottom:1px solid var(--line);max-width:1180px;margin:14px auto 0;padding:0 22px;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13.5px;padding:11px 15px;border-radius:10px 10px 0 0;min-height:46px}
  .nav button.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}
  .nav .bdg{position:static;margin-left:2px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .topics-grid .topic{margin-bottom:0}
  .tele-tx{font-size:31px}
}
@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hbtn span{display:none}
  .hbtn{padding:8px 10px}
}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap hd-row">
    <div>
      <div class="hd-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 22V12"/></svg>
        每日选题 · 口播稿台
      </div>
      <div class="hd-sub" id="hdSub">加载中…</div>
    </div>
    <div class="hd-acts">
      <button class="hbtn" onclick="doExport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>导出备份</span></button>
      <button class="hbtn" onclick="document.getElementById('impFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg><span>导入恢复</span></button>
      <button class="hbtn" onclick="askClear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span>清空</span></button>
    </div>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">

<div class="tipbar" id="tipbar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px;height:16px;flex:none"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
  <span id="tipTx"></span>
  <button onclick="hideTip()">知道了</button>
</div>

<div class="nav" id="nav">
  <button class="on" data-p="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>今天要处理<span class="bdg" id="navBdg" style="display:none">0</span></button>
  <button data-p="topics" onclick="go('topics')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>选题池</button>
  <button data-p="scripts" onclick="go('scripts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>口播稿库</button>
  <button data-p="refs" onclick="go('refs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>对标灵感</button>
</div>

<div class="wrap">

  <!-- ============ 今天要处理 ============ -->
  <div class="pane on" id="p-today">
    <div class="sec">
      <div class="today">
        <div class="today-h">
          <span class="dot"></span><h2>今天要处理</h2>
          <span class="n" id="todayN"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tlist" id="tlist"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hd"><h2>今日速览</h2><span class="cnt" id="ovCnt"></span></div>
      <div id="overview"></div>
    </div>
    <div class="foot" id="foot1"></div>
  </div>

  <!-- ============ 选题池 ============ -->
  <div class="pane" id="p-topics">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel" onchange="switchDate(this.value)"></select>
        <span id="dateBadge"></span>
      </div>
      <div class="ttabs" id="ttabs1"></div>
      <div id="topicList"></div>
    </div>
    <div class="foot" id="foot2"></div>
  </div>

  <!-- ============ 口播稿库 ============ -->
  <div class="pane" id="p-scripts">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel2" onchange="switchDate(this.value)"></select>
        <span id="dateBadge2"></span>
      </div>
      <div class="ttabs" id="ttabs2"></div>
      <div class="ttabs" id="stfilter" style="margin-top:-4px"></div>
      <div id="scriptList"></div>
    </div>
    <div class="foot" id="foot3"></div>
  </div>

  <!-- ============ 对标灵感 ============ -->
  <div class="pane" id="p-refs">
    <div class="sec">
      <div class="sec-hd"><h2>加一条对标</h2></div>
      <div class="card">
        <div class="form">

<script id="packToday" type="application/json">{"date":"2026-09-02","updatedAt":"2026-09-02T10:20:00+08:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月上旬1折机票窗口：9月中旬就是分水岭","hook":"现在下单飞一趟，机票钱比高铁二等座还便宜，但这扇门只开到9月中旬。","why":"价格窗口有明确的起点和终点，观众看完能立刻行动，收藏和转发都高；淡季捡漏是每年固定选题，模板可复用。","heat":"高","tags":["机票","淡季","捡漏","错峰"],"facts":["9月1日记者查询携程：9月8日北京直飞郑州裸票160元，9月6日北京至银川220元，9月2日北京至太原230元（来源：北京日报，2026-09-01）","9月首周国内机票均价较暑期高峰下降35%（来源：央视财经，2026-09-01）","9月2日北京直飞昆明含机建燃油总价最低降至800多元，较暑期高峰价差超千元（来源：央视财经，2026-09-01）","9月上旬杭州出发至石家庄、揭阳、郑州、昆明、天津、广州、青岛等航线折扣1至3折，单程200至300元不含机建燃油（来源：每日商报、杭州政协网，2026-09-02）","中国航空运输协会特聘专家林智杰：暑运落幕进入9月传统淡季，国内航班投放规模增幅显著，供给增加带动票价下行，短途还面临高铁竞争（来源：央视财经，2026-09-01）","9月1日至3日国航限时特惠：北京到太原200元起（含基建燃油共290元）、北京至哈尔滨300元起、北京至宁波300元起（来源：航旅纵横数据，北京日报，2026-09-01）","进入9月中旬票价明显上涨，热门航线稳定在300至500元，特价票数量减少，国庆前后升至高点（来源：中国吉林网综合金融时报，2026-09-01）","低价票多集中在早班、晚班或经停航班，余票有限，价格随日期实时变动（来源：北京日报、每日商报，2026-09-01/02）"],"scripts":[{"angle":"干货直给","text":"9月2号查了一圈票价，先说结论：现在是全年最狠的一个捡漏窗口，只开到9月中旬。北京飞郑州，裸票160；北京到银川220；北京飞太原230。杭州出发飞昆明、郑州、石家庄这些线，折扣压在1到3折，单程200到300，不含机建燃油。9月第一周国内机票均价比暑期高峰跌了35%，同一条北京飞昆明，含税总价掉到800多，跟暑假差了一千块。原因不复杂：暑运7月1号到8月31号刚收尾，各家航司投出去的运力还没撤回来，高校开学时间又拉得散，供大于求，价格只能往下走，短途线还要跟高铁抢客。三条提醒。低价票基本卡在早班、晚班或者经停航班，最晚的落地过零点，赶时间的别碰。余票少、价格按天浮动，看到合适就下手，别隔夜再想。9月中旬开始票价回抬，热门线回到三百到五百，国庆前直接见顶。想省钱，把出发日往前挪，别往后拖。"},{"angle":"实操流程","text":"想吃到9月这波低价票，按这个顺序操作。第一步定日期，锁在9月上旬到中旬之前，越靠后越贵，9月中旬热门航线就回到三百到五百了。第二步挑班次，把筛选条件放宽，早上六点前起飞、晚上十点后落地的航班留着，经停一次的也留着，一折票基本都藏在这些位置。第三步进航司自己的入口，限时特惠、特惠闪购这些栏目单独放票，比综合平台还低。国航9月1到3号那批就是北京到太原200起、北京到哈尔滨300起、北京到宁波300起，都是裸票价。第四步反着查一遍，把出发地换成上海、成都、广州再搜同一个目的地，飞全国多地的200元票同样一大把，有时候先坐两小时高铁去邻省机场，总账更省。第五步下单别拖，余票少、价格按天浮动，隔一夜就可能贵一百。最后一句，机建燃油另算，报价看着200，到手大概290，心里有数。"},{"angle":"反常识开场","text":"很多人以为国庆前机票只会一路涨，实际正好反着。现在这个时间点，是暑运结束到国庆之间的价格谷底，9月第一周国内机票均价比暑期高峰跌了35%。北京飞郑州裸票160，飞银川220，飞太原230，这不是促销活动，是运力过剩的正常结果——航司七八月投出去的飞机还没撤，学生开学时间又拉得散，座位卖不完只能降价。第二个反常识：便宜的不只有机票。云南、贵州、新疆、四川多家酒店9月初报价比暑期高峰下调明显，部分打到五折，还送下午茶和景区接驳。热门景点排队时长从暑期的一到两小时，缩到十几分钟。同样的钱，体验反着涨。所以别等假期。9月中旬票价开始回抬，国庆前见顶，越临近中秋越贵。真想省钱又想玩得舒服，答案是现在请两天年假，而不是硬挤十月一号。"}]},{"id":"tv2","title":"泰国60天免签9月15日作废，中国护照其实没被取消免签","hook":"泰国60天免签9月15日到期，但中国护照不是被取消免签，是回到协定里的30天。","why":"网上大量标题写成「泰国对中国取消免签」，口径完全不同，纠错型内容传播强；有精确到小时的时间节点和可执行动作，评论区必追问细节。","heat":"高","tags":["泰国","免签","签证","政策"],"facts":["2026年8月31日泰国《皇家公报》刊登内政部四份公告，废止2024年7月15日起施行的针对93个国家和地区的「60天特别免签」，自公布满15日即9月15日起生效（来源：泰国《皇家公报》143卷特刊207G，2026-08-31）","新规下30天旅游免签名单60个国家和地区，15天名单2个（塞舌尔、毛里求斯），需在移民检查站申请落地签3个（阿塞拜疆、白俄罗斯、塞尔维亚）（来源：泰国《皇家公报》，2026-08-31）","中国公民赴泰免签依据是《中泰两国互免持普通护照人员签证协定》，2024年3月1日起实施，单次停留不超过30天，每180日累计不超过90天，泰方单方面调整不影响该协定效力（来源：泰国外交部领事司政策图表，2026-08-31）","9月14日23:59前入境的旅客仍按旧规获批60天停留，已获批停留期不被缩短，以入境章日期为准（来源：泰国外交部说明，2026-08-31）","新规下经陆路边境口岸免签入境，每人每个日历年最多2次（文莱、印尼、马来西亚、新加坡公民除外），经国际机场乘航班入境不受次数限制（来源：泰国《皇家公报》，2026-08-31）","免签入境30天到期前可向泰国移民局申请一次延期，最长再30天，规费1900泰铢，由现场移民官审核决定（来源：泰国移民局规定，2026-08-31）","中国香港、中国澳门按双边免签安排同为30天；中国台湾列入泰方新公布的30天旅游免签名单（来源：泰国外交部名单，2026-08-31）","新公告把30天和15天免签明确限定为「旅游」目的，原60天措施除旅游外还涵盖必要或紧急工作以及短期商务联系（来源：泰国《皇家公报》，2026-08-31）","泰方称调整原因是2024年7月试行的60天大豁免引发部分外籍人员长期非法打工、灰产与「签证跑」隐患（来源：泰方公告说明，2026-08-31）","入境仍需提交泰国数字入境卡TDAC，填报时限各来源说法不一（3天内／72小时内），以官方入口为准（待核实）"],"scripts":[{"angle":"干货直给","text":"泰国签证有变化，先把结论摆清楚：中国护照没有被取消免签，只是停留天数从60天回到30天，9月15号起生效。8月31号泰国皇家公报刊登了内政部四份公告，废掉的是2024年7月15号开始那版针对93个国家和地区的60天特别免签。那是泰国单方面给的临时福利，到期收回。中国公民赴泰靠的是另一份东西——中泰两国互免持普通护照人员签证协定，2024年3月1号实施，单次停留不超过30天，每180天累计不超过90天，这份协定不受这次调整影响。三个关键点。第一，看的是入境盖章日期，9月14号23点59分前完成入境的，60天照数，已经在泰国的不会被砍。第二，30天不够可以在到期前去移民局申请一次延期，最多再30天，规费1900泰铢，批不批由现场移民官定。第三，走陆路口岸免签入境，新规限一个日历年两次，坐飞机入境不限。十天半个月的普通旅游，基本没影响。"},{"angle":"横向对比","text":"同一条泰国新规，不同人受到的影响差得很远，对着看一遍。普通游客，行程十天到半个月，影响接近零。9月15号之后入境按中泰互免协定走，单次停留30天，照样不用提前办签证，护照、往返机票、酒店订单、电子入境卡备齐就行。计划待31到60天的人，影响最大：旧的60天免签没了，要么落地后去移民局申请一次30天延期、交1900泰铢、由移民官审批，要么出发前直接办旅游签。半年内频繁往返的人，注意另一条线，每180天累计不能超过90天，不是每次少于30天就没事。习惯从老挝、柬埔寨走陆路口岸出境再入境刷天数的，这条路收紧了，新规限一个日历年最多两次，飞机入境不受限制。还有一个容易漏的，新公告把30天免签明确限定为旅游目的，原来那版60天还包含短期商务联系和紧急工作，性质变了。港澳按双边安排也是30天，台湾地区列进了新的30天名单。"},{"angle":"反常识开场","text":"这两天到处在传泰国对中国游客取消免签，说反了。真实情况是，泰国收回的是给93个国家和地区的单边60天福利，而中国走的是双边协定，本来就是30天。2024年3月1号中泰两国互免持普通护照人员签证协定实施，写得很清楚：单次停留不超过30天，每180天累计不超过90天。过去两年能待60天，是因为泰国2024年7月另外加了一层临时优惠，覆盖93个国家和地区。8月31号皇家公报把那层废了，9月15号生效，中国护照自然落回协定里的30天。第二个反常识：赶60天末班车看的不是机票日期，是入境章日期。9月14号晚上起飞、15号凌晨落地，拿到的是30天。第三个：免签不等于随便入境。护照有效期六个月以上、往返机票、酒店确认单、电子入境卡，泰国口岸有权抽查，现金也可能被问，最终停留到哪天以入境记录为准。"}]},{"id":"tv3","title":"9月28到30请三天假连出13天，机票还是近三年同期最低","hook":"9月28到30请三天假，能连出13天，而且这三天出发的机票是近三年同期最低。","why":"拼假方案人人能用，日期精确到天，配上票价数据可以直接照做；长假决策窗口就在这一周，时效性极强。","heat":"高","tags":["中秋","国庆","拼假","机票"],"facts":["2026年中秋假期9月25日至27日，国庆假期10月1日至7日，两个假期相隔3天（来源：北京日报、大象新闻，2026-09-01）","9月28日至30日请3天假，可连成13天假期，被称为「请3休13」（来源：北京日报、大象新闻，2026-09-01）","去哪儿数据：9月22日出发均价较中秋首日9月25日低30%，较国庆首日10月1日低50%（来源：去哪儿旅行，北京日报报道，2026-09-01）","9月27日至10月1日机票均价创近三年同期最低，部分热门航线均价比去年低一成以上（来源：去哪儿旅行，大象新闻，2026-09-01）","中秋国庆期间热门城市酒店提前预订量同比增长近四成，提前一个月锁定机票的热度比去年同期高21%（来源：去哪儿旅行，2026-09-01）","9月1日查询北京出发，9月27日直飞大连、沈阳、大庆、银川等地仅需300余元（来源：北京日报记者查询，2026-09-01）","郑州经固原至乌鲁木齐9月27日最低600元，郑州至广州9月28日最低398元，郑州至杭州9月29日最低410元，郑州至三亚9月29日最低650元（来源：航旅纵横，大象新闻，2026-09-01）","业内提醒：郑州至乌鲁木齐转伊犁、至三亚、至广州、至川渝是传统热门线路，长假期间需求特别旺盛，需提前订票（来源：大象新闻，2026-09-01）"],"scripts":[{"angle":"干货直给","text":"今年最长的那个假，日子已经排出来了，直接抄。中秋9月25到27号，国庆10月1到7号，中间只隔9月28、29、30三天。这三天请年假，从9月25号一直连到10月7号，13天。为什么建议请这三天而不是往国庆后面接：这三天出发的机票，正好是全年最划算的一段。去哪儿的数据，9月27号到10月1号机票均价创下近三年同期最低，部分热门航线均价比去年还低一成以上。9月1号查北京出发，9月27号直飞大连、沈阳、大庆、银川这些地方，只要三百多。郑州出发，9月28号飞广州最低398，9月29号飞杭州410，飞三亚650，9月27号经固原到乌鲁木齐600。反过来看，9月22号出发均价比中秋首日低30%，比国庆首日低整整一半。结论一句话：假期战线拉长了，越早出发越便宜，别扎在10月1号那天。"},{"angle":"实操流程","text":"13天假怎么用，给三套排法。第一套，长线远飞。9月27号出发，趁票价谷底把机票锁掉，去新疆、西藏、东北这种一趟不容易的地方，路上花两天也不心疼。郑州经固原到乌鲁木齐9月27号最低600，飞过去再转伊犁，十来天时间刚好。第二套，前紧后松。中秋三天先在家过节，9月28号早班机走，10月5号回，避开10月1号和10月7号两个最贵最堵的节点，回程票通常还有折扣。第三套，两段拆开。中秋9月25到27号做周边短途，休息两天，10月1号再出发一趟长线，代价是两头都撞高峰，只推荐给不打算请假的人。三套都要提前做的动作：住宿先订可免费取消的，中秋国庆热门城市酒店提前预订量同比涨了近四成，去晚了只剩贵的；热门线路机票先占位，郑州到乌鲁木齐、到三亚、到广州、到川渝这几条长假需求最旺，越拖越贵。"},{"angle":"反常识开场","text":"很多人算假期只盯10月1号，今年这么算最亏。今年中秋是9月25到27号，国庆10月1到7号，中间卡着9月28、29、30三个工作日。请这三天，13天连着休，年假只花三天，杠杆四倍多。更反常识的是价格。按常识请假出发肯定比法定假第一天贵，今年反过来：9月27号到10月1号这段机票均价创近三年同期最低，部分航线比去年还便宜一成多；9月22号出发的均价，比中秋首日低30%，比国庆首日低50%。原因是假期战线被拉长，出行需求摊到十几天里，不再挤在一两天，价格自然被打散。所以真正贵的日子只剩两个：10月1号出发、10月7号返程。把这两天躲开，机票、酒店、排队时间三样一起省。今年提前一个月订票的人比去年多了21%，酒店提前预订量涨了近四成，动作慢的只能捡剩下的。"}]},{"id":"tv4","title":"中俄免签满一周年，普京当面提议改成长期固定机制","hook":"中俄免签这个月满一周年，普京9月1号当面提议把它做成长期制度。","why":"免签目的地是旅游内容的长期流量点，政策层面刚出新表态，属于「可能变成常态」的信号；出境游清单类内容收藏率高。","heat":"中高","tags":["俄罗斯","免签","政策","出境游"],"facts":["2025年9月2日中俄元首北京会晤期间，中方宣布自9月15日起对俄罗斯公民试行免签；同年12月普京签署总统令对等对中国公民实施免签（来源：驻俄罗斯大使张汉晖接受《消息报》采访，中国外交部网站，2026-09-01）","2026年5月和7月中方与俄方相继宣布将免签政策延长至2027年12月31日（来源：中国外交部网站，2026-09-01）","自2026年7月20日起中俄免签在互惠基础上生效，两国持普通因私护照公民互免签证入境、停留不超过30天，适用旅游、商务、探亲访友、各类交流及过境（来源：俄罗斯卫星通讯社，2026-09-01）","2026年9月1日普京在上海合作组织比什凯克峰会期间与中方会谈时表示，如中方认为可行且有益，俄方愿共同推动将免签制度转为长期固定机制（来源：俄罗斯卫星通讯社，2026-09-01）","普京称今年上半年旅游流量增长43%（来源：俄罗斯卫星通讯社，2026-09-01）","2025年中俄人员往来总量突破300万人次；2026年第一季度中国赴俄旅游15.42万人次同比增长44%；上半年俄罗斯位列中国入境游客来源国第二位（来源：中方统计，中国外交部网站，2026-09-01）","2026年1至7月中俄贸易额1592.4亿美元，同比增长26.3%（来源：中国外交部网站，2026-09-01）","2026年1至5月中俄边境贸易额28.4亿美元，同比增长20%，占中国边贸总额12.8%（来源：中方统计，中国外交部网站，2026-09-01）"],"scripts":[{"angle":"干货直给","text":"中俄免签这件事有新进展。9月1号上合组织峰会在比什凯克开，普京跟中方会谈时明确说，如果中方认为可行且有益，俄方愿意一起把免签转成长期固定机制。翻译一下：现在这套是有期限的安排，对方想把它做成常态。先把现状说清楚。2026年7月20号起，中俄在互惠基础上互免签证，两国持普通因私护照的公民互相免签入境，单次停留不超过30天，用途覆盖旅游、商务、探亲访友、各类交流和过境。这套安排目前的期限是2027年12月31日，今年5月和7月两边分别宣布过延长。效果摆在数据上：2025年两国人员往来总量突破300万人次；2026年第一季度中国赴俄旅游15.42万人次，同比增长44%；普京说上半年旅游流量涨了43%。上半年俄罗斯还排到中国入境游客来源国第二位。想去的，30天停留够跑莫斯科、圣彼得堡加贝加尔湖，拿护照直接走。"},{"angle":"故事切入","text":"去年这个时候，去俄罗斯还得办签证。2025年9月2号两国元首北京会晤期间，中方宣布从9月15号起对俄罗斯公民试行免签，同年12月普京签总统令对等回应，对中国公民免签。到2026年7月20号，互免正式在互惠基础上落地：普通因私护照，互相免签入境，停留不超过30天。一年时间，这条线从交材料排队，变成拿着护照就走。数据也跟着变了。2026年第一季度中国赴俄旅游15.42万人次，同比增长44%；上半年俄罗斯成了中国入境游客来源国第二名；1到7月两国贸易额1592.4亿美元，同比增26.3%。9月1号在比什凯克，普京又往前推了一步，说愿意把免签转成长期固定机制。要去的话记三件事：现行安排的期限到2027年12月31日；单次停留30天，旅游、商务、探亲、交流、过境都算；免签只免掉提前办签证这一步，往返行程和住宿材料入境时该带还得带。"},{"angle":"反常识开场","text":"免签这两个字，很多人以为就是省一笔签证费。看中俄这条线的数据，省掉的其实是决策成本。2025年9月中方对俄试行免签，12月俄方对等回应，2026年7月20号互免正式生效，普通因私护照互相免签、停留30天。结果是2026年第一季度中国赴俄旅游15.42万人次，同比涨44%；上半年俄罗斯直接排到中国入境游客来源国第二位；1到7月两国贸易额1592.4亿美元，同比增26.3%，边境贸易前五个月28.4亿美元、涨20%。人流带着货流一起动。第二个反常识：免签不一定长久。现在这套的有效期到2027年12月31日，是延长过一次的安排，不是永久制度。9月1号普京在比什凯克提出愿意转成长期固定机制，恰恰说明双方都清楚临时安排随时可以收。参考今年泰国把单边60天免签收回的操作，免签窗口开着的时候就去，别默认它一直在。"}]},{"id":"tv5","title":"同一个景点排队从两小时缩到十几分钟，酒店还打五折","hook":"同一个景点，暑假排两小时，现在排十几分钟，酒店还打五折。","why":"从「省钱」切到「省时间和体验」，正中不爱人挤人的男性观众；数据出自权威采访，说服力强，而且每年同一时段可复用。","heat":"中高","tags":["错峰","酒店","景区","淡季"],"facts":["云南、贵州、新疆、四川多家酒店9月初客房报价较暑期高峰下调明显，部分酒店折扣低至五折，部分周末入住房型可享免费下午茶、景区接驳等增值服务（来源：记者采访，央视财经，2026-09-01）","多家景区反馈近期客流量较暑期高峰明显回落，部分热门景点排队等候时长由暑期的一至两小时缩减至十多分钟（来源：景区工作人员，央视财经，2026-09-01）","同程研究院首席研究员程超功：对看重性价比和游玩感受的游客，9月第一、二周是较为理想的出行时段，可规避旺季高额花销与长时间等候（来源：同程研究院，2026-09-01）","9月首周国内机票均价较暑期高峰下降35%；9月2日北京直飞昆明含机建燃油总价最低降至800多元（来源：央视财经，2026-09-01）","2026年暑运7月1日至8月31日，铁路杭州站累计发送旅客2158.07万人次、日均34.81万人次，与2025年同期基本持平；杭州萧山国际机场62天保障航班5.9万架次、运送旅客938.7万人次，同比增1.1%，创暑运历史新高（来源：每日商报、杭州政协网，2026-09-02）","林智杰提示长期规律：4月、11月、12月为民航传统淡季，机票价格整体更为优惠（来源：中国航空运输协会特聘专家，2026-09-01）"],"scripts":[{"angle":"干货直给","text":"9月上半月出门，最值的不是机票便宜，是人少。多家景区给出的说法：近期客流量比暑期高峰明显回落，部分热门景点排队等候时长从暑期的一到两小时，压到十几分钟。同一个大门、同一个项目，时间成本差了五倍以上。住宿同步降。云南、贵州、新疆、四川多家酒店9月初客房报价比暑期高峰下调明显，部分打到五折，一些周末入住的房型还带免费下午茶和景区接驳车。机票也在谷底，9月第一周国内均价比暑期高峰跌35%，9月2号北京直飞昆明含机建燃油最低800多，跟暑假差了一千多。同程研究院首席研究员程超功的判断是，9月第一、二周是比较理想的出行时段，能避开旺季的高花销和长等待。提示一句：这个窗口从9月中旬开始收窄，越靠近中秋越贵。真想玩得舒服，现在动手比等假期强。"},{"angle":"横向对比","text":"把暑假出游和9月初出游摆一起算笔账。排队时间，暑期热门景点一到两小时，9月初部分景点十几分钟。住宿，云南、贵州、新疆、四川多家酒店9月初报价比暑期高峰明显下调，部分五折，还有房型送下午茶和景区接驳。机票，9月第一周国内均价比暑期高峰跌35%，北京直飞昆明含税最低800多，暑期高峰同一条线差价超过一千。天气，9月全国大部分地区秋高气爽，比七八月三十几度暴走舒服得多。人流，暑运7月1号到8月31号刚结束，杭州机场62天运送旅客938.7万人次、同比涨1.1%，创暑运历史新高，那些人现在都回去上课上班了。唯一的代价是要请年假。一天年假换来的是五折房、跌35%的机票、十几分钟的队。喜欢清静的，这个账很好算。再记一条长期规律：民航传统淡季在4月、11月和12月，这三个月机票整体更便宜。"},{"angle":"反常识开场","text":"旅游最贵的成本不是机票，是排队。暑期热门景点排一到两小时，一天下来光在队里就耗掉三四个钟头，门票钱一分没省，假期先没了。9月初反过来，多家景区说客流量比高峰明显回落，部分热门景点等候时间压到十几分钟。第二个反常识：淡季不代表体验差。云南、贵州、新疆、四川多家酒店9月初报价比暑期高峰下调明显，部分五折，一些周末房型还送下午茶和景区接驳；机票9月第一周均价跌35%，北京到昆明含税800多。价格降了，服务反倒更从容，因为酒店空房多、景区不用限流。第三个：9月不是旅游的边角料，是被低估的正季。全国大部分地区这时候秋高气爽，同程研究院程超功直接把9月第一、二周点成理想出行时段。所以问题不是要不要错峰，是敢不敢请那两天年假。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"Anthropic 新旗舰不涨价，缓存读取直接砍掉75%","hook":"新旗舰不涨价，缓存读取砍到四分之一，用得越重省得越多。","why":"用 AI 的人最关心月底账单，降价幅度具体、能当场算出自己省多少，属于高转发的实用信息。","heat":"高","tags":["Anthropic","降价","Agent","模型"],"facts":["当地时间9月1日Anthropic推出「全球最先进的编程和知识工作模型」Fable 5.1，同时为拥有Mythos访问权限的用户发布Mythos 5.1（来源：公司官网，财联社报道，2026-09-02）","Fable与Mythos本质是同一模型，安全防护级别不同，后者对生物学、网络安全等高风险领域的某些任务采用更宽松防护（来源：财联社，2026-09-02）","按Token计费的典型工作负载，Fable 5.1预期使用成本比Fable 5低25%，主因缓存读取价格下降75%（每百万Token由1美元降至0.25美元）；高度智能体化任务节省幅度最高约45%（来源：财联社、AI Daily Brief，2026-09-02）","Terminal-Bench-Science 0.1得分52.6%，前代24.7%；Terminal-Bench 4.0由42%升至55.8%；CursorBench 3.2以73.4%领跑（来源：AI Daily Brief，2026-09-02）","基础价格不变，已上线Claude Code、Claude Platform和Cursor（来源：AI Daily Brief，2026-09-02）","官方称强化了长时程智能体能力，可连续数小时完成编程、研究和知识工作，过程中自主验证结果、调整优先级，减少中途跑偏（来源：财联社，2026-09-02）","官方称Fable 5.1在中等或低努力程度下即可交付Fable 5高努力程度相当甚至更好的结果（来源：财联社，2026-09-02）","OpenAI预告网络安全模型Astra达到其Preparedness Framework最高级Critical，仅向一小部分测试人员开放高级网络安全功能，发布日期未披露（来源：凤凰网、AI Daily Brief，2026-09-02）","有报道称Anthropic计划在美国劳动节后公开招股书，最快9月底登陆美股（来源：财联社引述报道，2026-09-02，待核实）"],"scripts":[{"angle":"干货直给","text":"Anthropic 换旗舰了，重点不在跑分在账单。9月1号 Fable 5.1 和 Mythos 5.1 发布，号称全球最先进编程和知识工作模型。基础价没动，降的是缓存读取：每百万 Token 从1美元砍到0.25，降75%。典型 Token 负载预期成本比上代低25%；高度智能体、反复读同批上下文，最高省45%。缓存读取是模型重复读已处理输入的费用，长对话、长文档、反复迭代受益最大。能力也有账：Terminal-Bench 4.0 从42%到55.8%，Science 24.7%跳52.6%，CursorBench 3.2 拿73.4%领跑。官方强调长时程：连续几小时干编程研究，中间自验、调优先级，少跑偏。已上线 Claude Code、Platform、Cursor。"},{"angle":"横向对比","text":"同一天两个消息放一起看。Anthropic 发 Fable 5.1 主打性价比：基础价不变，缓存读取每百万 Token 从1美元降到0.25、砍75%，典型负载总成本比上代低25%，重度智能体最高省45%。OpenAI 的 Astra 被自家 Preparedness Framework 判为网络安全能力达最高级 Critical，误用或致重大危害，只向少数测试者开高级功能，发布日未定。一边降价抢量，一边锁能力控风险。Fable 和 Mythos 同一模型，区别在防护级别，Mythos 对生物、网络安全等高风险任务限制更松。跑分 Terminal-Bench 4.0 从42%到55.8%，CursorBench 3.2 是73.4%。现已能在 Claude Code、Platform、Cursor 用。"},{"angle":"反常识开场","text":"模型越强越贵，这条规律今年不成立了。9月1号 Anthropic 发 Fable 5.1，官方口径是全球最先进的编程和知识工作模型，基础价格一分没涨，缓存读取反而从每百万 Token 1美元降到0.25美元，砍了75%。典型工作负载算下来，成本比上一代低25%，重度智能体任务最高省45%。更狠的一句在后面：现在 Fable 5.1 在中等甚至低努力程度下，就能交出上一代高努力程度的结果，同样的活用更便宜的档位就够了。为什么敢这么打，因为竞争已经不在跑分榜上。Terminal-Bench 4.0 从42%提到55.8%，Terminal-Bench-Science 从24.7%到52.6%，这些数字对普通用户没什么感知，但账单有。谁能让人一天跑几百次任务还不心疼，谁就拿走使用量。所以别再问哪个模型最强，先问哪个模型让你敢连续用八小时。"}]},{"id":"ai2","title":"千问创作上线 Agent Teams：提一个创意，五个 Agent 当剧组","hook":"提一个创意，编剧、导演、美术、剪辑几个 Agent 自己开工，成片直接出来。","why":"直接对口做短视频的人，交互方式从「写提示词」变成「提想法」，工具已全量开放、当天能上手，是能出实测内容的选题。","heat":"高","tags":["千问","Agent","AI视频","工具"],"facts":["8月31日千问创作推出Agent Teams功能并接入Wan3.0，已面向全部用户开放，在PC端c.qianwen.com和千问App同步上线（来源：广州日报大洋网，2026-08-31；AIBase，2026-08-31）","编剧、导演、美术、摄影、剪辑等角色Agent各司其职，依次完成剧本创作、分镜设计、角色设定、视频生成和成片剪辑（来源：广州日报大洋网，2026-08-31）","千问创作首发接入Wan 3.0视频生成模型及其Prime版，同时汇集Qwen-Image-3.0等图像模型，由Agent Teams按创作环节规划并调用（来源：AIBase、广州日报，2026-08-31）","场景覆盖AI短剧与漫剧、营销广告、音乐MV、图像设计及游戏内容；上传品牌资料和商品素材后，系统围绕目标人群与产品卖点策划广告片（来源：AIBase，2026-08-31）","创作过程中用户可随时补充想法、提出修改意见，Agent自主调整创作（来源：广州日报大洋网，2026-08-31）","Wan3.0于8月24日接入阿里云百炼、千问AI平台、万相官网和千问App（来源：第三方汇编，2026-09-01，待核实）","Wan3.0单段最长30秒一镜到底、原生音画同步、支持doc/xls/ppt/pdf/md等文档输入；480P 0.3元/秒、720P 0.6元/秒、1080P 1.2元/秒，8月24日至9月23日限时7折；Agent Teams输出720P、单秒价格低至0.26元（来源：单一第三方汇编，待核实）","DataEye统计：2026年上半年抖音上新AI剧漫剧22.19万部、日均超1200部，以5000万播放为盈亏平衡线仅2886部过线、占比1.3%（来源：单一第三方汇编引DataEye，待核实）"],"scripts":[{"angle":"干货直给","text":"做视频的注意，阿里千问8月31号上线了 Agent Teams，已经面向全部用户开放，电脑上进 c.qianwen.com，手机上千问 App 也有。它干的事是把多个 Agent 拆成一个剧组。你提一个创意，系统自己规划任务：编剧 Agent 写剧本，导演 Agent 做分镜，美术 Agent 定角色设定，摄影和剪辑 Agent 接生成和成片，一路串下来。以前是你自己拆流程、自己写每一段提示词、自己接素材，现在是描述想法，它拆解执行。模型层面，平台首发接的是 Wan3.0 视频生成模型和效果更强的 Prime 版，图像那边挂着 Qwen-Image-3.0，由 Agent Teams 按环节调用。场景覆盖 AI 短剧、漫剧、营销广告、音乐 MV、图像设计和游戏内容。带货的用法很直接：上传品牌资料和商品素材，它围绕目标人群和产品卖点策划广告片。过程中不满意可以随时插话改，Agent 自己调整。今天就能测。"},{"angle":"实操流程","text":"用千问 Agent Teams 出一条带货片，流程这么走。第一步，电脑打开 c.qianwen.com，或者手机开千问 App，功能已经全量开放，不用等资格。第二步，别急着写提示词，写创意。一句话讲清楚卖什么、给谁看、什么调性，比如三十岁男性通勤用的保温杯，主打一手拎不烫，冷感真实风。第三步，把料喂进去，品牌资料、商品图、卖点文档都上传，系统会围绕目标人群和产品卖点策划广告片。第四步，看它拆任务：编剧出脚本、导演出分镜、美术定角色和风格，后面接画面生成和成片剪辑，每一环都能看到中间结果。第五步，在关键节点插话，分镜不对就说分镜，节奏不对就说节奏，Agent 会自主调整，不用从头再来。第六步，成片下载后自己再过一遍，配文和封面还得人来定。模型是 Wan3.0 和 Prime 版，图像走 Qwen-Image-3.0，由它按环节自己调用，你不用挑。"},{"angle":"反常识开场","text":"很多人担心 AI 把编剧和导演干掉了。看千问 Agent Teams 这套设计，被替掉的不是做决策的人，是中间跑腿的活。8月31号上线，全量开放，你提一个创意，编剧 Agent 写剧本、导演 Agent 做分镜、美术 Agent 定角色，后面接生成和剪辑成片。省掉的是背提示词、切工具、拼素材这些重复劳动；审美怎么定、剧情往哪拐，还在你手里，过程中随时能插话让它改，说明产品自己也认这一点。第二个反常识：门槛降低不等于机会变多。AI 短剧、漫剧、营销广告、音乐 MV 全都能一句话开工，意味着明天跟你抢流量的人用的是同一套工具。工具被拉平之后，值钱的东西反而回到创意本身和对人群的理解。所以别急着问它能不能替我干活，先想清楚替出来的时间你打算干什么。"}]},{"id":"ai3","title":"讯飞开源端侧模型：手机上跑，能一次吃进一百万 Token","hook":"手机上跑的模型，能一次吃进一百万 Token，还是国产算力从头训的。","why":"端侧意味着离线可用、数据不出设备、没有 API 账单，是能落到普通人手上的实变化；权重开源，属于可动手的玩法。","heat":"中高","tags":["讯飞","端侧","开源","国产算力"],"facts":["9月1日科大讯飞子公司词元星火开源星火X2.5-4B与1.7B两款端侧通用大模型（来源：腾讯研究院AI速递，2026-09-02；今日头条汇编，2026-09-01）","官方称是端侧唯一原生支持最长100万Token上下文的模型（来源：腾讯研究院AI速递，2026-09-02；今日头条汇编，2026-09-01）","采用混合注意力架构，围绕智能体、代码、数学与指令遵循优化（来源：腾讯研究院AI速递，2026-09-02）","基于全国产算力用约20万亿Token预训练，适配英伟达、华为、海光等平台与vLLM、llama.cpp等框架（来源：腾讯研究院AI速递，2026-09-02）","权重已在Hugging Face、GitHub开放，可部署于手机、PC、汽车座舱与机器人（来源：今日头条汇编，2026-09-01）","智能家居控制端到端正确率90.3%，平均响应0.85秒（来源：单一来源腾讯研究院AI速递，2026-09-02，待核实）"],"scripts":[{"angle":"干货直给","text":"9月1号，科大讯飞子公司词元星火开源了两个端侧模型，星火 X2.5-4B 和 1.7B。参数很小，40亿和17亿，能塞进手机、电脑、汽车座舱和机器人。关键点是上下文：官方说法是端侧唯一原生支持最长100万 Token 上下文的模型。100万 Token 在端侧是什么概念，整份合同、整套代码库、几十万字的资料，可以一次性丢给它，还不用联网。架构上用的是混合注意力，围绕智能体、代码、数学和指令遵循做过优化。训练侧更值得提一句：基于全国产算力，用了大约20万亿 Token 预训练，同时适配英伟达、华为、海光等平台，以及 vLLM、llama.cpp 这些推理框架。权重已经在 Hugging Face 和 GitHub 上开放。为什么这事对普通人有意义：模型跑在自己设备上，数据不出去，没有 API 账单，断网也能用。想动手的，llama.cpp 那条路对着 1.7B 先试，一台普通笔记本就够。"},{"angle":"横向对比","text":"端侧模型和云端模型现在是两条路，对着看一遍。云端，参数上千亿，能力最强，但要联网、按 Token 付费、数据得交出去。端侧，讯飞9月1号开源的星火 X2.5 是 4B 和 1.7B 两档，跑在手机、电脑、汽车座舱和机器人上，不联网、不计费、数据不出设备。过去端侧最大的短板是记不住东西，上下文窗口小，长文档喂不进去；这次官方口径是端侧唯一原生支持最长100万 Token 上下文，短板被正面补了一刀。第二个差别在生态。星火 X2.5 用全国产算力、约20万亿 Token 预训练，同时适配英伟达、华为、海光等平台，以及 vLLM 和 llama.cpp，权重挂在 Hugging Face 和 GitHub 上，不绑硬件也不绑云。选哪条看活儿：要最强推理、复杂长任务，还是云端；要隐私、要离线、要零边际成本，端侧已经够用了。"},{"angle":"反常识开场","text":"参数越大越强，这个直觉在端侧不成立。9月1号讯飞开源的星火 X2.5 只有 4B 和 1.7B 两档，40亿和17亿参数，却做到端侧原生支持最长100万 Token 上下文，官方说这是端侧唯一。对使用者来说，模型能记住多少，往往比它有多聪明更影响体验：整本说明书、整个项目的代码、一年的聊天记录，能一次性喂进去，回答才不跑偏。第二个反常识：小模型的意义不是省钱，是把数据留在本机。跑在手机、电脑、汽车座舱、机器人上，不联网也能用，没有 API 账单，隐私问题直接消失一半。第三个：训它的算力是全国产的，约20万亿 Token 预训练，同时还适配英伟达、华为、海光，以及 vLLM、llama.cpp。权重在 Hugging Face 和 GitHub 上开放，谁都能下。真正的门槛已经不在能不能拿到模型，在你想用它解决什么问题。"}]},{"id":"ai4","title":"Runway 的界面世界模型：软件界面不写代码，一帧一帧生成","hook":"界面不再是写代码渲染出来的，而是像视频一样一帧一帧生成的。","why":"概念反直觉、画面感强，适合做「这东西会怎么改变软件」的解读；离普通用户还远，但话题度高、评论区有争议。","heat":"中高","tags":["Runway","世界模型","界面","Gen-4.5"],"facts":["Runway公布首个界面世界模型Solaris，App与网页界面可像视频一样实时生成，用户点击、拖拽后模型直接生成下一帧，无需开发者预先写好代码（来源：腾讯研究院AI速递，2026-09-02；AI早间简报，2026-09-02）","基于Gen-4.5视频模型改造，采用逐帧自回归、少步蒸馏与自生成结果训练，在720p下实现实时交互（来源：腾讯研究院AI速递，2026-09-02）","分工是语言模型负责推理、世界模型负责渲染（来源：腾讯研究院AI速递，2026-09-02）","人类对比测试中，指令遵循与行为自然度偏好分别达61%和71%，明显高于代码方案（来源：腾讯研究院AI速递，2026-09-02；AI早间简报提到偏好度61%，2026-09-02）","另一大用途是为Computer Use Agent提供泛化训练环境（来源：腾讯研究院AI速递，2026-09-02）","目前仅面向核心合作伙伴开放（来源：AI早间简报，2026-09-02）"],"scripts":[{"angle":"干货直给","text":"Runway 放出了 Solaris，官方叫界面世界模型。它做的事得先说清楚：App 和网页的界面，不是提前写好代码渲染出来的，而是像视频一样实时生成。你点一下、拖一下，模型直接生成下一帧画面，中间没有开发者写的按钮逻辑。技术底子是 Gen-4.5 视频模型改的，用了逐帧自回归、少步蒸馏，还有拿自己生成的结果继续训练，在 720p 分辨率下做到实时交互。分工是这样：语言模型负责推理接下来该发生什么，世界模型负责把画面渲出来。效果有对比数据，人类评测里指令遵循的偏好度61%，行为自然度71%，都明显高于传统写代码的方案。除了当界面用，Runway 提的另一个用途更有意思：给 Computer Use Agent 提供泛化训练环境，让操作电脑的 Agent 在生成出来的界面里练手，不用真机。目前只向核心合作伙伴开放，普通人还用不上。"},{"angle":"故事切入","text":"想象一个软件，里面所有按钮都不存在。你以为点的是按钮，其实点的是画面里一块像素；点下去之后，模型现场画出下一帧，看起来就像按钮响应了。这就是 Runway 刚公布的 Solaris，官方称首个界面世界模型。它基于 Gen-4.5 视频模型改造，用逐帧自回归加少步蒸馏，在 720p 下实现实时交互，语言模型负责想清楚接下来该发生什么，世界模型负责把这一帧渲出来。听着像玩具，人类评测的数字不小：指令遵循偏好61%，行为自然度71%，都比写代码的方案更受偏好。更实际的一个用途在幕后。现在很多 Agent 要学会操作电脑，缺的是练习场，真实软件跑一次慢、还可能出事；Solaris 可以生成无限多的界面，让 Computer Use Agent 在里面练泛化能力。目前只对核心合作伙伴开放，能不能出圈另说，方向已经摆出来了。"},{"angle":"反常识开场","text":"软件必须先写代码才有界面，这个前提正在被拆掉。Runway 公布的 Solaris 叫界面世界模型：App 和网页界面像视频一样实时生成，你点击、拖拽之后，模型直接生成下一帧，不需要开发者事先写好那段逻辑。第二个反常识：这不是画一张好看的 UI 图，是可交互的。基于 Gen-4.5 视频模型改造，逐帧自回归加少步蒸馏，720p 下实时响应，语言模型管推理、世界模型管渲染。人类对比测试里，指令遵循偏好61%、行为自然度71%，反而比代码方案更自然。第三个反常识也是我觉得最关键的：它最先落地的价值可能不在做软件，而在训 Agent。让操作电脑的 Agent 在生成的界面里反复练，比在真机上跑安全、快，还能无限造新场景。目前只面向核心合作伙伴，别急着找入口，先记住这条路已经通了。"}]},{"id":"ai5","title":"200天，AI 聊天框里的广告做到10亿美元年化收入","hook":"200天，AI 聊天框里的广告做到10亿美元年化收入。","why":"流量入口在迁移，对做内容和带货的人是分蛋糕规则的变化；数字有冲击力，容易引发讨论。","heat":"中高","tags":["OpenAI","广告","商业化","流量"],"facts":["8月31日OpenAI宣布广告业务年化收入达10亿美元，距2月在美国ChatGPT测试广告仅约200天（来源：每日经济新闻，经腾讯新闻转载，2026-08-31）","自周一起向印度、欧洲、中东及北非开放自助广告（来源：今日头条汇编，2026-09-01）","广告目前主要出现在免费版和低价Go套餐（来源：腾讯网硬科技日报，2026-09-01）","该收入线在IPO前构成利好，被指效仿Meta打法，直接切入Google与Meta的广告利润池（来源：每日经济新闻、今日头条汇编，2026-08-31/09-01）","分析口径：聊天入口拿到的不是关键词，而是用户表达的完整需求和意图；10亿美元对Google和Meta目前仍很小，但增长速度值得警惕（来源：腾讯网硬科技日报，2026-09-01）","同期OpenAI预告网络安全模型Astra达Critical级并限制访问，Anthropic披露7月30日、8月4日红队评估中三次未授权访问真实系统事件（来源：凤凰网、IT之家，2026-09-01/02）"],"scripts":[{"angle":"干货直给","text":"8月31号 OpenAI 公布一个数字：广告业务年化收入达到10亿美元。起点是今年2月在美国的 ChatGPT 里开始测试广告，到现在大约200天。从零到10亿美元年化，200天。位置也说清楚了，广告主要出现在免费版和低价的 Go 套餐上，付费高档暂时不放。同时从周一开始，自助投放向印度、欧洲、中东和北非开放，意思是中小广告主可以自己上后台买量了。这条线为什么重要。搜索广告拿到的是关键词，你搜保温杯，平台猜你想买；聊天框拿到的是完整需求，预算多少、给谁用、在意什么、上次买的哪款不满意。意图比关键词值钱得多。对 Google 和 Meta，10亿美元现在还是小钱，但增速摆在那儿。如果 ChatGPT 逐渐变成查商品、订行程、挑服务的入口，它抢的就是这两家最核心的地盘。"},{"angle":"横向对比","text":"同一件事，三个角度看。对 OpenAI，广告是上市前的第二条腿：今年2月在美国 ChatGPT 里测广告，到8月31号年化收入10亿美元，大约200天，广告位主要放在免费版和低价 Go 套餐，从周一起向印度、欧洲、中东和北非开放自助投放。对 Google 和 Meta，10亿美元目前占不到它们广告盘子的零头，但性质不一样：搜索广告买的是关键词，聊天入口拿到的是用户完整的需求和意图，转化路径更短。如果商品研究、旅行规划、服务选择这些环节都搬进对话框，被切走的是它们利润最厚的那块。对做内容和带货的人，变化更直接。过去流量入口是搜索框和推荐流，现在多了一个对话框，而且这个入口已经开始卖广告位。免费用户看到广告，说明它要的是规模，不是溢价。谁先摸清在 AI 对话里怎么被推荐出来，谁就先吃到这一轮。"},{"angle":"反常识开场","text":"AI 公司靠订阅赚钱，这个印象要改了。8月31号 OpenAI 说广告业务年化收入到了10亿美元，从今年2月在美国 ChatGPT 里开始测算起，大约200天。更反常识的是位置：广告主要投在免费版和低价 Go 套餐里，也就是投在不付钱的人身上，跟 Meta 当年的打法一模一样，用免费规模换广告收入。第二个反常识，聊天广告比搜索广告更值钱的原因不是流量大。搜索框里你输入的是关键词，平台只能猜；对话框里你说的是完整需求，预算、场景、给谁用、上一款为什么不满意，全都摆出来了。意图越完整，广告越准，单价越高。第三个，从周一起自助投放已经向印度、欧洲、中东和北非开放，中小广告主自己就能买。10亿美元对 Google 和 Meta 还不算威胁，但增长速度值得盯，入口一旦迁移，规则就得重写。"}]}]}]}</script>
<script id="packHistory" type="application/json">{"2026-08-31":{"date":"2026-08-31","updatedAt":"2026-08-31 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"国庆热门景区预约限流：没提前约，到了也进不去","hook":"故宫九寨莫高窟，今年全是先约后入，现场基本没散票。","why":"双节仅剩一天，这是出发前最该补的一课，限流规则各景区不一样，临时抱佛脚必吃闭门羹。收藏率高、转发给同行人实用。","heat":"高","tags":["强时效","避坑","人人有用"],"facts":["故宫博物院官网实名预约，提前7天放票，每日限流8万人次，国庆首日基本秒空（故宫博物院官方预约规则；Tournews 2026国庆攻略整理）","九寨沟通过阿坝旅游网提前14天预约，单日限流4.1万人次，国庆开售即秒光（同上；川迹时光旅行社 2026-08 川西客流预测）","敦煌莫高窟通过莫高窟参观预约网提前30天放票，每日限流6000人次（同上 Tournews 攻略）","兵马俑通过「丽山园」公众号提前7天预约，每日限流6.5万人次（同上）","苏州博物馆、成都大熊猫基地、鼓浪屿船票等均实行线上实名分时段预约，国庆期间现场散票极少（同程/去哪儿 2026双节预订攻略）"],"scripts":[{"angle":"干货直给","text":"国庆去热门景区，记住一句话：没提前预约，到了也进不去。今年多个顶流都是限流实名预约制。故宫提前7天在官网放票，每天上限8万人次，国庆首日基本秒空。九寨沟提前14天在阿坝旅游网预约，单日限流4.1万人，开售即秒光。兵马俑提前7天在公众号预约。最夸张的是敦煌莫高窟，提前30天在预约网放票，每天只放6000张，不提前根本抢不到。还有苏州博物馆、大熊猫基地、鼓浪屿船票，全是线上实名、分时段入园。所以出发前先把每个景区的官方公众号关注了，记好放票时间，定闹钟抢，别指望现场买散票。要是行程里串两三个热门景区，放票时间还可能撞车，提前用手机日历把每个闹钟设好，比当天手忙脚乱刷页面强得多。"},{"angle":"避坑清单","text":"国庆抢景区票，五个坑最容易踩。第一，以为景区现场能买票。故宫、九寨、莫高窟、苏博这些热门全是线上实名预约，现场基本没有散票，去了也是吃闭门羹。第二，记错放票时间。故宫提前7天、九寨提前14天、莫高窟提前30天，不是都能临期买，莫高窟不提前一个月根本抢不到。第三，不分时段。很多景区分上午下午场，选错时段到了还要排队等。第四，只约不截图。入园码提前截好图，山区信号差，现场刷新刷不出来。第五，临时改期。国庆酒店多不可取消，门票也绑定日期，行程一变就废。正确做法：出发前一周列好每个景区的放票时间和平台，定闹钟，抢完截图存档。"},{"angle":"说人话版","text":"说人话：限流就是景区每天只放固定数量的票，卖完就关。以前国庆你到了门口还能买票进去，现在不行了，热门景区全改成提前网上约、限人数。为什么？人太多，景区怕出安全事故，也怕体验崩。所以今年国庆想逛故宫、看九寨、朝莫高窟，必须提前在官方平台约。约的时间各不一样，短的提前一周，长的提前一个月，别等到了再想。约上了也把入园码截个图，山里信号差，现场刷不出码就白约了。这条最大的价值是提醒你，提前规划比临时抱佛脚靠谱一百倍，别等到了景区门口才后悔。尤其带老人孩子的，别指望到了现场有人通融，限流就是限流，规则面前人人一样。花十分钟把预约这件事办妥，后面玩得才踏实。"}]},{"id":"tv2","title":"国新办预警：双节23.6亿人次，今年国庆会有多堵","hook":"8天23.6亿人次，10月1日单日可能破3.4亿，刷新历史。","why":"国新办发布会级别的权威预测，是今年双节出行最硬的背景数据。做拥堵预警类内容，可信度高、转发价值强。","heat":"高","tags":["强时效","数据","出行预警"],"facts":["国新办发布会（交通运输部）预测：中秋国庆8天假期全社会跨区域人员流动量将达23.6亿人次，日均2.95亿，同比增约3.2%（国新办新闻发布会 2026年8月底；央视报道）","自驾预计18.7亿人次，占出行总量近八成；高速公路高峰时段车流量或达7000万辆/日，其中新能源车1400万辆（同上）","去程峰值10月1日单日或超3.4亿人次，破历史峰值；返程集中在10月7、8日（同上）","建议通过「e路畅通」小程序提前查询沿途补能点位（交通运输部李扬提示，国新办发布会）","待核实：部分城市具体拥堵时长预测为机构推算，非官方统一口径（标待核实，未写入口播稿正文）"],"scripts":[{"angle":"数据向","text":"今年双节出行会有多猛，看这几个数。国新办发布会预测，8天假期全社会跨区域人员流动量将达到23.6亿人次，日均2.95亿，比去年涨约3.2%。自驾是绝对主力，预计18.7亿人次，占总量近八成。单日峰值出现在10月1日，可能突破3.4亿人次，刷新历史纪录。新能源车也不容小觑，预计假期车流里新能源车达1400万辆，服务区充电会排长队。返程高峰在10月7日、8日。简单说，首尾两天最堵，核心城市群进出城高速、热门景区周边国省道最易堵。建议用「e路畅通」小程序提前查沿途补能点，尽量错峰。"},{"angle":"趋势判断","text":"今年国庆拥堵，不是单纯车多，是三股力量叠一起。第一，首尾双高峰。10月1日出城、10月7至8日返程，两个尖峰比往年更陡，因为中秋和国庆连着，探亲加旅游全挤一块。第二，中长线集中释放。成渝、长三角、京津冀、大湾区这几个城市群进出城高速压力最大，热门景区国省道车流能到平日好几倍。第三，新能源补能短板。1400万辆新能源车上了高速，服务区充电桩本来就紧，排队会非常明显。判断结论：能错峰就错峰，10月5到6日返程最从容；走长途提前规划充电点，别等电量告急再找桩。另外今年天气如果遇雨，山区高速还会临时封闭，出发前看一眼沿途预警，别赌运气。"},{"angle":"实操流程","text":"国庆自驾想不堵，按这个顺序准备。第一步，查免费时段。高速免费只算10月1日0点到10月7日24点，中秋那段不免费，别记错。第二步，规划错峰。能9月28到30日出发最好，实在不行10月3日后再走；返程优先选10月5、6日，避开10月7日全员返程。第三步，充电前置。新能源用「e路畅通」小程序把沿途服务区充电桩位置查好，电量留足余量，别等红到20%才找桩。第四步，备备选路线。导航一条路堵了就切备选，别死磕。第五步，出发前车况检查，胎压刹车玻璃水过一遍。做到这五步，体验能好一大半。真遇上服务区排队，心态放平，带点水和零食，别为了抢桩跟人起冲突，假期图的是顺。"}]},{"id":"tv3","title":"中秋自驾不免费，免费只算国庆7天","hook":"9月25到27日中秋高速照常收费，很多人误以为放假就免单。","why":"常年误区，每年都有人中招。澄清成本低、传播广，适合做一条短平快的提醒稿。","heat":"中高","tags":["避坑","省钱","收藏向"],"facts":["2026年中秋为9月25日至27日，国庆为10月1日至7日；中秋不在高速免费节假日名单（交通运输部统一规定：免费仅春节、清明、劳动节、国庆节；今日头条 2026放假详解）","国庆高速免费时段：10月1日00:00至10月7日24:00，7座及以下小型客车免费（同上）","免费以车辆驶离高速时间为准，非驶入时间；最后一天来不及可就近下高速再上，仅缴后段（同上；交管部门常规解释）","中秋自驾远行需预留过路费，部分中老年误以为「放假即免费」（今日头条 2026放假详解提示）"],"scripts":[{"angle":"反常识开场","text":"很多人以为，只要国家放假的日子里高速就免费，这是错的。今年中秋是9月25到27日，这三天高速并不免费，私家车该交过路费照样交。真正免费的只有国庆7天，从10月1日零点到10月7日24点。所以如果你打算中秋自驾远行，做预算一定把高速费算进去，别以为放假就免单。这个误区坑过不少人，尤其家里老人习惯性地认为「放假等于免费」。分清哪段免费哪段不免费，能省掉一笔冤枉钱，也避免到了收费站才发现余额不够的尴尬。还有人专门挑中秋自驾想省高速费，结果发现该交一分不少，反而在收费站排了长队。所以中秋出行前，导航里把过路费预算加进去，别被「放假免费」的错觉坑了。多花两分钟搞清楚规则，比到了ETC杆前手忙脚乱强。"},{"angle":"干货直给","text":"高速免费的规则，记住三句。第一，免费时段是10月1日0点起，到10月7日24点止，小型客车9座及以下免费，货车和大型客车不享受。第二，免费以车辆驶离高速的时间为准，不是上高速的时间。所以如果你在9月30日晚就上高速，只要10月1日0点后才下，这段也免费；反过来，10月7日24点前没下高速，全程就得缴费。第三，最后一天来不及下，可以就近先下高速再重新上，只付后面一小段，别硬撑超时。中秋那段完全不免费，自驾远行记得预留过路费。顺带提醒，皮卡、9座以上客车、货车都不在免费范围，别开错车还以为能免。规则就这三句，截图存手机，上高速前扫一眼，省得半路纠结。"},{"angle":"避坑清单","text":"关于国庆高速免费，三个坑别踩。第一，误以为中秋也免费。9月25到27日是中秋，高速照常收费，自驾预算里必须留过路费，很多家庭就栽在这一条。第二，搞错免费判定标准。免费看的是下高速的时间，不是上高速的时间，别卡着9月30日半夜上高速就以为稳了，得看10月1日0点后下才免。第三，最后一天死扛不下了。10月7日24点前下不了，先就近下高速再上，只补缴后面一段，硬撑到超时全程都算钱，反而亏。记牢这三条，过路费能省就省。还有人为了蹭免费，硬把行程卡在10月1日前后，结果人挤人票价还贵。真想省钱舒服，不如中秋在家团圆，国庆中段再走，高速免费照享，人还少。规则吃透，才能把假期的钱和体验都握在自己手里。"}]},{"id":"tv4","title":"出发前48小时准备清单：证件现金充电宝一个别漏","hook":"山区没信号、充电宝超标被拦，出门前花十分钟能避开九成抓瞎。","why":"临近出发的实用清单，谁都能用上，尤其带老人小孩的家庭。泛人群、收藏率高。","heat":"中高","tags":["实用","泛人群","可复用"],"facts":["国庆热门景区常信号差，订单/入园码建议提前截图保存（2026国庆出行10件事攻略；多家旅游号整理）","充电宝携带标准：额定能量不超过2万毫安（100Wh）符合高铁、飞机携带规定（铁路/民航携带规定）","山区、古镇、农家乐常出现手机无信号无法移动支付，建议备200-500元现金（同上出行攻略）","自驾新能源车建议用「e路畅通」查沿途充电桩，预留续航余量（交通运输部国新办发布会提示）","常备药含晕车药、肠胃药、感冒药、抗过敏药、创可贴，慢性病患者带足全程药量（同上）"],"scripts":[{"angle":"实操流程","text":"出发前48小时，照这个清单过一遍，能避开九成临时抓瞎。证件：身份证、驾驶证、学生证、老年证拍照，手机和云端各存一份，优惠证件随身带能省门票。现金：备200到500元，山区古镇农家乐常没信号刷不了码。充电宝：控制在2万毫安以内，符合高铁飞机携带标准，数据线充电器清点。离线地图：高速隧道、深山景区常失联，提前下载好。常用药：晕车药肠胃药感冒药创可贴，带慢性病的带足全程药量。最后把车票机票酒店订单全截图，山区信号差截图比App靠谱。这清单看着啰嗦，真到了外地手机没信号、充电宝被拦、药忘带，每一样都能毁掉半天行程。出门前花十分钟对着打钩，比路上花两小时补救省心太多，尤其是带娃带老人的家庭，更得上心。"},{"angle":"避坑清单","text":"国庆出门，最容易忘的几样东西。第一，证件只带原件不备份，丢了或忘带直接误事，拍照存云端双保险最稳。第二，不带现金，以为手机全能付，结果山区古镇没信号干瞪眼。第三，充电宝超标，上了高铁飞机被拦下，行程断联。第四，不下载离线地图，进了隧道深山导航变砖。第五，药不带，水土不服或晕车只能硬扛，打乱整段行程。第六，订单不截图，到了景区刷不出码干着急。这六样花十分钟提前备好，比路上花两小时补救强得多，出门前对着清单打钩就行。我见过太多人到了景区门口才发现身份证落家里，或者充电宝超标被安检扣下，全程断联。这些事提前十分钟就能杜绝，真不值得到了外地才抓瞎。清单打钩是低成本高回报的动作，别嫌麻烦。"},{"angle":"说人话版","text":"说人话：出门前准备好东西，不是为了仪式感，是为了不让你在半路掉链子。国庆到处人挤人，景区信号差、山区没网、酒店临时涨价，任何一环出岔子都影响心情。所以出发前把证件拍个照存云端，带点现金防没信号，充电宝别超标，离线地图下好，常用药装包，订单全截图。这些东西平时用不上，关键时刻能救场。尤其带老人小孩的，联系卡、药量、充电宝更得上心。花十分钟列清单打钩，比到了外地抓瞎找药店找充电强一百倍，旅行的松弛感都是提前准备好的。别信什么说走就走的浪漫，那是有钱有闲人的剧本。普通人出门，准备越足，意外越少，玩得才越松。这一张清单，就是给旅行上了份保险，花十分钟，换全程安心，划算得很。"}]},{"id":"tv5","title":"机票比高铁便宜的「倒挂」航线，今年真不少","hook":"福州飞上海2.1折300块，高铁要391；飞石家庄200，高铁快900。","why":"反直觉+具体数字，截图感强，适合低成本口播。打破「飞机贵火车省」的刻板印象，有传播点。","heat":"中高","tags":["省钱","反直觉","信息差"],"facts":["以福州为例，9月28日飞上海最低2.1折、300元，同段高铁最低391元；飞石家庄200元起，高铁近900元且需6小时余（搜狐 2026-08-28 国庆订票省钱分析）","福州飞郑州约270元，高铁590元需6小时余；飞大连420元、飞银川630元（同上）","去哪儿数据：9月27日北京直飞大连、沈阳、大庆、银川等仅需300余元（新京报/去哪儿 2026-08-27/28）","业内分析：航司今年折扣舱放得又早又狠，长假摊平需求，机票价格被打低，高铁票价刚性（搜狐分析；去哪儿研究员杨涵）","待核实：具体航线折扣为样本数据，实时价格以购票平台为准（标待核实，未写入口播稿正文）"],"scripts":[{"angle":"数据向","text":"今年国庆有个反直觉现象：有些航线机票比高铁还便宜。以福州为例，9月28日飞上海最低2.1折、300块，同段高铁最低391；飞石家庄200块起，高铁要将近900还要坐6个多小时；飞郑州270左右，高铁590还得跑6小时；飞大连420，飞银川630。这种机票比高铁便宜的「倒挂」航线，今年真不少。原因就一个：航司把折扣舱放得又早又狠，供需被长假摊平了，机票价格被打下来，而高铁票价刚性不动。所以出发前别只盯高铁，多开几个目的地比一比，说不定飞比坐还省时间又省钱。不过这种倒挂不是天天有，越是临近假期越容易收回去，所以看到便宜票别犹豫太久。另外注意特价舱多半不能退改，行程定了再下手，别贪便宜反而被绑死。"},{"angle":"干货直给","text":"想捡「机票比高铁便宜」的漏，记住三招。第一，多比目的地。别只搜你要去的城市，顺手看看周边能飞的地方，比如去石家庄不如看飞哪便宜，差价能到几百。第二，看出发城市机场的低价线。每个机场都有几条常年便宜的航线，出发前在购票平台按价格排序翻一翻。第三，挑时间。周二下午、周三傍晚、周五晚、周日早，航司放特价舱概率更高，别在同一航班反复刷，刷太勤价格反而可能涨。今年双节机票整体友好，倒挂航线尤其值得盯，飞一趟省下的钱够吃顿好的。还有个窍门：出发城市不同，倒挂线完全不同，比如你从二线城市飞，可能比从一线飞还便宜，多换几个出发地搜一搜。机票这东西没有标准价，勤比价的人永远比懒人省。长线出行，先比飞机高铁再下单，别想当然。"},{"angle":"反常识开场","text":"从小到大我们都觉得，长途肯定火车比飞机便宜。今年国庆这条常识被打破了。福州飞上海2.1折300块，高铁要391；飞石家庄200块，高铁快900还得坐6小时。机票比高铁还便宜，听着离谱，但真发生了。背后是航司今年把折扣舱放得又早又狠，长假把出行需求摊平了，机票价格被打下来，高铁票却雷打不动。所以别再默认「飞机贵火车省」，出发前两个都搜一下，尤其800公里以上的中长线，很多人发现飞比坐省时间还省钱，这波信息差不捡就亏了。当然也得看时段，越临近假期折扣越可能收回，看到合适的早点锁。还有特价舱通常不能退改，确认行程再买。打破「飞机贵」的执念，多比一步，同样的路程能省出一顿饭钱，何乐不为。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"腾讯单季砸528亿买算力，押注AI基建","hook":"一天花5.8亿，自由现金流转负，但转手卖算力能赚超30%。","why":"国内大厂最猛一笔AI基建投入，信号意义强。可延伸到「Token变便宜」的普通人红利，立人设。","heat":"高","tags":["强时效","趋势","成本"],"facts":["腾讯2026年Q2资本开支527.84亿元，同比增176%、环比增65%，远超市场预期321亿元；二季度每天约花5.8亿（腾讯财报 2026-08-12；证券时报、中国经济网）","二季度自由现金流-138亿元，若剔除算力采购预付款项为376亿元；上半年资本开支累计847.2亿（同上）","腾讯总裁刘炽平：部分算力订单转售可比采购价赚超30%；自研业务慢则转租给云客户（腾讯财报电话会 2026-08-12；证券时报）","研发支出272.8亿元同比增35%；WorkBuddy付费用户毛利率已可比肩云业务（同上）","待核实：摩根大通将腾讯全年资本开支预算上调至2000亿元为机构预测（标待核实，未写入正文）"],"scripts":[{"angle":"数据向","text":"腾讯二季度财报有个数字很炸：资本开支527.8亿元，同比暴涨176%，环比也涨65%，远超市场预期的321亿。算下来二季度每天花5.8亿在AI算力上。自由现金流因此转负138亿，如果剔除算力预付款还有376亿。更关键的是刘炽平透露，几个月前预付定金订的一批算力设备，现在转手卖能比采购价赚超30%。等于说腾讯在赌AI，但赌注本身有保值垫。上半年腾讯资本开支累计847亿，其中二季度528亿几乎全砸进GPU、服务器和自建数据中心，这是国内大厂最猛的一笔AI基建投入。这数字背后，是腾讯认定AI不是风口是基建，砸下去就要用很多年，不是玩票。"},{"angle":"趋势判断","text":"腾讯单季砸528亿买算力，信号比数字本身更重要。看三层逻辑。第一，从「用AI」到「建AI」，腾讯把混元大模型、元宝、WorkBuddy、CodeBuddy、微信小微全接上算力，调用量指数级涨，不建不够用。第二，进可攻退可守。刘炽平说算力订单转售能赚超30%，自研业务节奏慢了就转租给云客户按小时收租，硬件不会变废铁。第三，资本市场在惩罚不重投AI的公司，腾讯用这笔钱换叙事。判断：大厂AI竞争从模型跑分转向基建和落地，谁家算力池深、应用起量，谁笑到最后。普通人受益的是Token更便宜、产品更稳。"},{"angle":"成本账","text":"腾讯528亿买算力，跟你有什么关系？直接关系：你用的AI产品会变便宜变稳。逻辑很简单，算力是AI的成本底座，腾讯自建大规模集群，单位推理成本就摊薄了。财报里管理层明确说，国内Token价格很低，但生产成本比外界想的低得多，所以低价也有正毛利。WorkBuddy付费用户毛利率已可比肩云业务。翻译成人话：大厂疯狂建算力，表面烧钱，实际是在把AI使用的单价往下压，你充值的每一分钱能买到更多次调用。短期看财报难看，长期看是你用AI的成本在降，这是实打实的红利。当然财报短期难看是事实，但对你我用户来说，竞争越狠，价格越卷，羊毛越厚。趁现在各家抢量，把顺手的AI工具用起来，成本几乎可以忽略。"}]},{"id":"ai2","title":"荣耀YOYO Claw接入GLM-5.3，手机端AI会编程了","hook":"手机平板上的助手能跨设备帮你写代码改文件，不用开电脑。","why":"端侧AI Agent落地的具体案例，比纯模型发布更贴近用户。可讲「AI从陪聊到替干」的趋势。","heat":"中高","tags":["玩法","端侧","趋势"],"facts":["荣耀8月14日宣布YOYO Claw接入智谱GLM-5.3，编程能力较上代提升50%（荣耀席迎军官宣；CNMO/凤凰网/IT之家 2026-08-14/15）","GLM-5.3在Terminal-Bench 3.0得分从4.6升至28.3，DeepSWE v1.1从46.2升至66.9，多项开源第一（智谱发布；IT之家/新浪）","YOYO Claw支持荣耀PC、Pad跨端执行任务，可连第三方OpenClaw设备（荣耀官方；ITBear）","智谱将在发布两周后开放GLM-5.3模型权重（智谱官方；凤凰网）","待核实：具体端侧响应时延与离线能力厂商未完全披露（标待核实，未写入正文）"],"scripts":[{"angle":"功能详解","text":"荣耀的手机AI助手YOYO Claw，8月14日官宣接入智谱最新GLM-5.3大模型，等于给手机装了个会编程的脑子。这次升级靠后训练把编程能力拉高50%，在Terminal-Bench等公开基准拿了开源第一，还能做代码审查和漏洞发现。对手机用户意味着什么？你在荣耀PC、平板上可以直接用YOYO Claw跨端执行任务，让它写代码、改文档、跑3D打印协作，不用再切到电脑开IDE。而且模型权重两周后开源，门槛进一步降低。简单说，AI Agent从云端聊天框，开始真正住进你的设备，随叫随到。"},{"angle":"说人话版","text":"说人话：以前你说「帮我写段代码」，AI在网页里给你一段文字，你还得自己复制去跑。现在荣耀把智谱GLM-5.3塞进YOYO Claw，手机平板上的助手能直接跨设备帮你把活干了——拆解任务、写代码、改文件、连第三方设备，不用你中间倒腾。编程能力提升50%不是噱头，是真实长程任务环境里测出来的。对普通人最有感的是：办公和创作不用守着电脑，躺在沙发上用平板就能让AI搭把手。端侧AI Agent这步，是AI从「陪你聊」到「替你干」的关键一跳，手机厂商抢着接大模型，图的就是这个。以后对着平板截个图、说句话，活就给你办了，这才是普通人真正摸得着的AI。"},{"angle":"趋势判断","text":"荣耀接GLM-5.3，背后是一条清晰趋势：AI Agent正在从云端下沉到手机和电脑本地。看三点。第一，端侧能干活了。YOYO Claw支持跨端执行、连第三方设备，说明Agent不再只是网页里的对话框，而是能操作你真实设备的助手。第二，模型变便宜变小。GLM-5.3靠后训练把能力拉满，权重还要开源，手机厂商接入成本骤降。第三，入口争夺白热化。微信小微、荣耀YOYO、各家PC助手都在抢「系统级AI」位置。判断：下一步拼的不是谁模型强，而是谁的AI能无缝嵌进你每天用的设备，随叫随到还不泄露隐私。端侧Agent会是明年手机电脑的标配。这一步拼的就是谁的AI能无缝嵌进日常设备，随时调用还不泄露隐私，端侧Agent会是接下来的主战场。"}]},{"id":"ai3","title":"Claude Sonnet 5取消涨价，永久2美元档还免费默认","hook":"说好9月1日涨到3/15，结果8月改口：永远2/10，还白送免费档。","why":"顶尖模型「白送」的节点性事件，直接打到创作者和开发者。立人设、有情绪价值。","heat":"高","tags":["成本","选型","泛人群"],"facts":["Anthropic宣布Claude Sonnet 5的限时优惠价（2美元输入/10美元输出每百万token）永久化，原计划9月1日涨至3/15取消（Anthropic官方定价页；aipricing.guru 2026-08）","Sonnet 5成为Claude免费版和Pro版默认模型，1M上下文、自适应思考（Anthropic公告；usingclaude/Progressiverobot 2026-08）","Opus 5定价5/25每百万token，为Sonnet 5约2.5倍（Anthropic官方定价页）","待核实：国行渠道与国内可用区以Anthropic官方为准（标待核实，未写入正文）"],"scripts":[{"angle":"成本账","text":"Anthropic有个好消息：Claude Sonnet 5原本限时优惠价2美元输入、10美元输出每百万token，原计划9月1日涨到3和15，结果8月直接宣布永久不涨了，就维持2/10。同时Sonnet 5成了Claude免费版和Pro版的默认模型。翻译一下：你不用花一分钱，就能用上接近旗舰水平的顶尖模型；开发者调用成本也比想象低。对比同门的Opus 5要5/25，Sonnet 5便宜一倍多，日常写代码、改文案、做分析完全够用。对普通人和小团队，这是实打实的降本——顶尖AI能力正在变成水电气一样的基础资源，门槛越来越低。"},{"angle":"创作者视角","text":"如果你做内容、写代码、搞研究，Claude Sonnet 5这次值得关注三点。第一，免费就能用。它成了Claude免费版默认模型，日常问答、改稿、梳理资料不用开会员。第二，便宜到能随便调。2/10每百万token的永久价，跑长文档、批量处理也不心疼，小团队能把它当生产工具。第三，能力强。1M上下文、自适应思考，长程编程和复杂分析稳，比上代快还便宜。用法建议：重活交给Sonnet 5打底，只有极难推理才切Opus 5。别再觉得顶尖模型高不可攀，现在免费档就够大部分人用了，先把工具用熟比追新更重要。"},{"angle":"反常识开场","text":"一个大厂宣布涨价，结果又取消了，还永久锁死低价——这事发生在Anthropic身上。Claude Sonnet 5定价2美元输入、10美元输出每百万token，本来说9月1日涨到3和15，8月突然改口：不涨了，永远这个价。更狠的是它直接当免费版默认模型。也就是说，顶尖AI能力开始「白送」了。原因不难猜：模型之战打到现在，靠高价赚快钱不如靠低价抢规模、抢生态。对咱们用户是纯利好——以前要咬牙订阅才用得上的水平，现在免费档就给。别等了，趁便宜先把活干起来，工具成本从来不是你做不成事的借口。"}]},{"id":"ai4","title":"Google双盲评测：用加密沙箱防AI考试偷看卷子","hook":"模型和考题锁进同一个加密箱，谁也看不见对方的底牌。","why":"评测可信度是选模型的关键，这次用密码学代替「口头信任」，方法论价值高、破圈潜力大。","heat":"中","tags":["方法论","评测","技术"],"facts":["Google DeepMind 8月27日宣布全球首个前沿AI模型双盲评测，用加密沙箱隔离模型权重与考题（Google DeepMind官方博客；TechTimes 2026-08-28）","参与方：新加坡AI安全研究所（AISI）、OpenMined、MLCommons、AVERI；测试对象Gemini 2.5 Flash Lite（同上；aibars）","技术：Google云Confidential Space + H100机密GPU + Intel TDX，远程鉴证，PySyft阻断外传，开销低于5%（Google技术报告；The New Stack）","背景：研究在31个模型中发现约一半有基准泄题痕迹，大模型更易被污染（Google技术报告引用；DeepMind博客）","待核实：Gemini具体分数未公开，方法论仍为概念验证非统一标准（标待核实，未写入正文）"],"scripts":[{"angle":"说人话版","text":"说人话解释AI评测的尴尬：就像学生考试，如果他提前偷看了卷子，考满分也说明不了真本事。AI也一样，很多公开考题早被喂进训练数据，模型「背过答案」再考，分数虚高，这叫基准污染。以前没法防，因为要么把考题给厂家（厂家可能泄题），要么把模型权重给考官（厂家知识产权泄露）。8月27日Google DeepMind搞了个双盲评测：把模型和考题同时锁进一个加密沙箱，谁也看不见对方的底牌，考完只出分数。这是全球头一回用密码学代替「口头信任」来防作弊，评测分数终于能信一点了。别小看这事，以前各家排行榜分数水分多大谁也说不清，现在有了密码学兜底，以后挑模型至少多了个靠谱参照，对用户是好事。"},{"angle":"趋势判断","text":"Google这次双盲评测，指向一个行业转向：AI分数以后不能光看排行榜了。背景是基准污染越来越严重，有研究在31个模型里发现约一半有泄题痕迹，模型越大越容易中招，分数虚高。双盲评测用加密沙箱（Confidential Space加H100机密GPU）把模型和考题锁一起，双方都看不到对方数据，开销不到5%，参与方有新加坡AI安全研究所、OpenMined、MLCommons。意义在于：政府、安全机构以后能真正独立测大厂模型，不靠合同信任。判断：评测会从「谁分高」走向「谁的分经得起第三方密码学验证」，这对选模型的人是好事。"},{"angle":"干货直给","text":"Google双盲评测怎么运作的，三步看懂。第一，双方各自加密进箱。Google把Gemini模型权重和推理代码、考官把考题和评分代码，分别通过加密通道送进同一个硬件加密沙箱，权重锁在GPU加密内存，考题锁在主机加密内存。第二，远程鉴证。进箱前双方做密码学验证，确认跑的就是约定好的软件，没被篡改。第三，只出分数。考完考官只拿到评分结果，权重和考题都不泄露，临时环境销毁。技术细节：用Google云Confidential Space、H100机密GPU、Intel TDX，PySyft挡住沙箱往外传数据。开销不到5%，Gemini Flash Lite先试水，后续会扩到更大模型。"}]},{"id":"ai5","title":"谷歌Gemini Omni 1.1 Flash视频模型，40秒4K还能续","hook":"场景延伸接着生成、首尾帧控画面，每秒0.03到0.3美元。","why":"视频生成赛道又进一个巨头玩家，且接进谷歌生态。对做视频的人是直接可用的新工具信息。","heat":"中高","tags":["玩法","视频","工具"],"facts":["谷歌8月27-28日发布Gemini Omni 1.1 Flash视频生成模型，支持场景延伸（每段10秒、最长40秒）、首尾帧控制、360p-4K（ZAKER/太平洋/IT之家 2026-08-28；谷歌API更新日志）","定价每生成一秒0.03至0.3美元；360p预览比720p快60%、成本三分之一（authorityaitools 引Google API changelog 2026-08-26/27）","同期发Gemini 3.5音频系列（3.5 Live/Transcribe），支持85种语言、实时错误率5.5%，已用于Pixel 11输入法（至顶科技/智通财经 2026-08-27）","旧版gemini-omni-flash-preview将于2026-09-30弃用（Google API changelog）","待核实：4K为超分输出非原生，画质以实测为准（标待核实，未写入正文）"],"scripts":[{"angle":"干货直给","text":"谷歌8月27、28日连发两款视频/语音模型，最值得关注的是Gemini Omni 1.1 Flash视频生成模型。它能做场景延伸——接着已有视频往后续10秒一段、最长凑到40秒；支持首尾帧控制，让你定开头和结尾画面；分辨率可选360p到4K，其中360p快速预览速度比720p快60%、只要三分之一成本。定价每生成一秒0.03到0.3美元，面向开发者生产部署。同期还发了Gemini 3.5音频系列，支持85种语言、实时错误率降到5.5%，已用在Pixel输入法。简单说，谷歌把视频和语音的生成能力打包进API，开发者能直接接。"},{"angle":"横向对比","text":"谷歌Gemini Omni 1.1 Flash进视频生成，和现有玩家比怎么定位。对比可灵、Seedance、Sora这些：Omni 1.1 Flash主打「快」和「可控」，场景延伸加首尾帧控制，适合做产品demo、社媒短片和广告迭代，而不是追求电影级画质。价格上每秒0.03到0.3美元，按40秒一条算几美元，对批量生产友好。它的差异化是真接进谷歌生态，Gmail、YouTube Studio、Ads都能用，分发优势明显。判断：视频生成不再是一家独大，而是按「画质派」和「效率派」分野，做内容的按需选——要精致用可灵，要快和好接入用Omni。多一个选择，对创作者永远是好事。"},{"angle":"趋势判断","text":"谷歌连发视频和语音模型，说明一件事：多模态生成正在从「单次出片」走向「实时对话式」。Omni 1.1 Flash支持场景延伸、首尾帧、4K，本质是让视频能像聊天一样一段段改、接着生成；3.5音频系列实时错误率5.5%、85种语言，让语音助手真正能听懂会说。配合之前Gemini Live的全双工，谷歌在铺一张「文本加图像加音频加视频」一体的网。判断：明年AI产品的竞争焦点，不再是单个模型多强，而是谁能把多种模态揉进同一个工作流，让创作者一句话就能从脚本走到成片。视频生成的下半场，拼的是「接得住、改得动、发得出」。"}]}]}]},"2026-08-29":{"date":"2026-08-29","updatedAt":"2026-08-29 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"双节机票三年最低，中秋首日还有两折票","hook":"大家都说双节机票贵到离谱，其实中秋首日还有两折票在售。","why":"8月27日去哪儿给新京报的最新数据：9月27日至10月1日机票均价创三年最低，部分比去年低一成。反认知，能止住焦虑，收藏转发高。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["8月27日新京报贝壳财经引去哪儿：热门城市酒店提前预订量同比近四成，提前一个月抢票热度同比高21%；9月27日至10月1日机票均价创近三年同期最低，部分热门航线均价比去年低一成以上（新京报/去哪儿 2026-08-27）","截至8月中，长假期间仍有捡漏票：以北京出发为例，9月27日直飞大连、沈阳、大庆、银川等地仅需300余元（去哪儿 2026-08-27）","8月26日新浪旅游：中秋首日（9月25日）北京至上海、杭州、西安等多条航线仍有两折左右机票在售；9月22日出发均价较中秋首日低30%、较国庆首日低50%（新浪旅游 2026-08-26）","返程更分散：今年返程热度分散在10月4日至7日，10月4日机票均价比去年返程低超两成（新京报/去哪儿 2026-08-27）","待核实：「三年最低」为去哪儿平台口径，不同平台统计口径略有差异；具体航线个案票价随库存实时变动，以出票页为准"],"scripts":[{"angle":"干货直给","text":"双节机票是不是贵到天价？看最新数据再说。8月27日去哪儿给新京报的数据：9月27日到10月1日这个区间，机票均价创了近三年同期最低，部分热门航线比去年同期还低一成以上。更关键的是，中秋首日也就是9月25号，北京飞上海、杭州、西安这些线，现在还有两折左右的票在卖。北京出发的话，9月27号直飞大连、沈阳、大庆、银川，三百块出头就能走。返程也别挤最后两天，今年返程高峰打散在10月4到7号，10月4号均价比去年返程低两成多。所以今年不是买不起，是别在9月30号和10月1号这两天硬冲。把出发挪到9月22号之后，能省一半。"},{"angle":"反常识开场","text":"越临近假期机票越便宜，这话平时是错的，但今年双节偏偏有点成立。去哪儿8月27号给新京报的数据，9月27号到10月1号这五天，机票均价创了三年最低，部分航线比去年还低一成。原因是今年长假战线拉得长，出行被拆成了好几波，没有哪一天被挤爆。所以中秋首日北京飞上海杭州西安，现在还能搜到两折票。反过来说，9月30号和10月1号那两天才是真贵，别去凑。想最省，9月22号之后出发，均价比国庆首日低一半。返程也别扎10月6号7号，4号走就能便宜两成。今年这趟，拼的是错峰不是手速，把出发安排在9月22号之后、返程放在10月4号之后，省下的差价够你在目的地多住两晚好酒店。"},{"angle":"数据向","text":"摆几个刚出的数，你自己判断贵不贵。第一，去哪儿8月27号数据，9月27到10月1机票均价近三年最低，部分热门线比去年低一成以上。第二，北京出发9月27号直飞大连、沈阳、大庆、银川，三百余就能走。第三，新浪8月26号数据，中秋首日北京飞上海杭州西安还有两折票，9月22号出发比国庆首日便宜一半。第四，返程分散在10月4到7号，10月4号均价比去年返程低超两成。四组数说明一件事：今年的贵集中在首尾两天，中间一大段是买方市场。你只要避开9月30和10月1出发、10月6和7返程，剩下的窗口都好买。"}]},{"id":"tv2","title":"中转联程捡漏，长线比直飞便宜三到五成","hook":"直飞贵得离谱的那条线，中转一下可能直接省一半。","why":"实操性强、截图感强，适合做低成本口播；30%到50%价差是硬数据，评论区易收藏。","heat":"中高","tags":["省钱","实用","可复用"],"facts":["中国经济新闻网2026机票攻略：合理中转方案较直飞机票便宜30%至50%；以福州出发为例，9月28日福州飞上海最低2.1折即300元，同期高铁最低391元，机票比高铁还便宜（中国经济新闻网 cet.com.cn 2026）","同程/央视数据：中转与空铁联运价差普遍30%至50%；丽江可选昆明中转、三亚可选海口中转换高铁，长线中转超8小时部分航司赠免费住宿（同程旅行/央视 2026）","聚合实测：青岛飞丽江直飞旺季1150元，青岛中转长沙再飞丽江实付约830元，比直飞省两百多；中转超8小时可申请航司免费住宿（2026购票指南）","待核实：具体航线个案价差随库存实时变动；中转免费住宿以各航司会员日/活动规则为准，非全线默认"],"scripts":[{"angle":"干货直给","text":"一条线直飞贵得离谱，先别急着买，看看中转。多家平台实测，合理中转比直飞普遍便宜三到五成。最直观的例子：福州出发，9月28号飞上海，中转最低两折三百块，同期高铁还要三百九，机票比高铁便宜。再比如青岛飞丽江，直飞旺季一千一，从长沙中转两段加起来实付八百三，省两百多。长线更明显，昆明中转去丽江、海口中转换高铁去三亚，都是经典平替。还有个隐藏福利：中转停留超过八小时，部分航司直接送免费住宿，相当于省一晚酒店钱。所以长线出行，先把直飞和中转都搜一遍再决定，别被首页直飞价吓退，尤其是国庆这类长线，先搜一遍中转往往比直飞便宜一大截，这一步真不该省。"},{"angle":"避坑清单","text":"中转捡漏有四条规矩，照着核对。第一，只选行李直挂的联程票，别选两段分开买的自理中转，不然中间取行李重新托运能折腾死你，误机风险也高。第二，国内中转留两小时以上、国际留三小时以上缓冲，航班延误改签只保同联盟，别卡太死。第三，中转超八小时记得问航司要免费住宿，南航东航这类常有，不主动问不会给你。第四，廉价航空的中转不含免费托运，行李多就别贪这趟便宜，线上提前买行李额反而更贵。记住，中转省的是票价，亏的是时间和折腾，行程宽松才值，要是行程本身就紧张、还带老人孩子，中转反而添乱，这种情况直接买直飞更省心。"},{"angle":"实操流程","text":"用中转省钱，按这个顺序走。第一步，打开地图看枢纽，去丽江想昆明、去三亚想海口、去西北想西安兰州，先锁定中转城市。第二步，两段分开搜再合并比价，别只信平台默认联程，有时分开买更便宜但要确认行李是否直挂。第三步，看中转时长，四到八小时最舒服，既能省又能逛个机场；超过八小时顺手领免费住宿。第四步，优先选同城双机场或周边小机场做备选，空铁联运经常比直飞低三成。第五步，锁票前通读退改，中转票退改比直飞复杂，行程不定别买不可退的舱。五步走完，长线票价常常直接砍半，我自己的经验，长途出游先把中转方案算一遍，常常比直飞省出一张酒店钱。"}]},{"id":"tv3","title":"航司会员日，每月固定放一至三折特价票","hook":"一年有几十个固定日子，航司自己放一至三折票，不抢就亏了。","why":"长效不过期、纯实用，收藏率高；多数人不看会员日直接去OTA，信息差强。","heat":"中","tags":["避坑","省钱","收藏向"],"facts":["中国经济新闻网2026攻略：南航每月28日、东航每月18日、国航每月15日、厦航每月9日、海航每月8日、春秋每月27日为各航司会员日，当天放出1至3折特价舱（中国经济新闻网 cet.com.cn 2026）","同程旅行同步更新上述航司次卡及立减券，可结合会员日窗口叠加使用（同程旅行 2026）","早期攻略有称国航为「每月同月数日」放票，与「每月15日」口径不一，以国航官网当期公告为准（待核实）","会员日特价票多为限时限量，建议提前设提醒、准点进官方渠道抢，部分热门航线秒空（行业经验）"],"scripts":[{"angle":"干货直给","text":"买机票别只盯着携程去哪儿，航司自己每月有固定放价日，价格常常低一两折。记这组日子：南航每月28号、东航18号、国航15号、厦航9号、海航8号、春秋27号。当天航司官方App会甩一至三折的特价舱，很多比OTA还便宜。而且同程这类平台会同步上架这些航司的次卡和立减券，会员日叠加平台券能再降一截。提醒一句，会员日票是限量的，热门线秒空，得提前设闹钟准点进官方渠道抢。国航有攻略说每月同月数日放票、也有说15号，以官网当期公告为准。把这六天存进日历，一年能省不少冤枉钱，短途常飞的，把这六天当固定抢票日，攒下来比随便买强太多。"},{"angle":"说人话版","text":"说人话解释会员日是什么。航司为了让大家去它自己App下单，每个月挑固定一天搞促销，叫会员日。这天放出来的票是航司直供，没有中间商加价，所以能低到一至三折。你平时在OTA搜到的低价，好多其实就是航司会员日放出来的库存，但OTA可能还挂了捆绑项。正确姿势是：先记日子，到点去航司官方App抢，抢完再去平台比有没有叠加券。相当于工厂店每月开门一天，你去晚了好货就没了。六家主流航司日子不同，按月排布，等于几乎每周都有一场，常飞的把日历标好就行，比起天天刷OTA蹲降价，蹲会员日反而更稳，好价集中放出来，不用跟算法斗智斗勇。"},{"angle":"实操流程","text":"把会员日用起来，四步走。第一步，注册六大航司会员，国航南航东航厦航海航春秋，会员免费，不注册抢不到专属价。第二步，日历标好日子，南航28、东航18、国航15、厦航9、海航8、春秋27，设提前五分钟提醒。第三步，准点进官方App，先抢你想走的线，会员日票限量，热门线放出来几分钟就没。第四步，抢到后去同程这类平台看能不能叠次卡或立减券，有时候平台券能再降几十到一百。注意会员日票多数不可退改，行程没定别硬抢。这套跑熟了，短途经常能拿到百元出头的票，学生党和轻装出门的，配合会员日加平台券，几百块能飞好几个城市。"}]},{"id":"tv4","title":"9月是航空平季，新疆秋景航线机票腰斩","hook":"暑运一结束，9月机票集体跳水，新疆刚好进入一年最好看的季节。","why":"换季机制加目的地推荐结合，长效可复用；新疆9月秋景加人少是强卖点，适合做种草口播。","heat":"中高","tags":["国内游","省钱","季节玩法"],"facts":["行业购票规律：9月为全年航空平季，无春节五一国庆超级客流，中秋短假集中压力小，属于航司折扣力度最大、溢价最低的时段（2026购票指南）","暑运峰值结束、全国中小学高校9月开学，暑期超大客流清零，市场由卖方转买方，航司主动下放折扣票，票价持续走低（2026换季分析）","换季窗口：8月底至9月初航司清空暑期高价库存、释放平季特价舱，9月1日至10日被视为全年TOP级低价期，全国航线普遍降价30%至60%（行业规律，具体降幅随线变动）","新疆9月进入秋色最佳观赏期（喀纳斯、禾木、白哈巴等），暑期高价退去后游客量明显回落，性价比与体验同步走高（旅游季节常识）","待核实：具体航线降幅为行业普遍规律，非官方统一定价；个别热门秋景线（如喀纳斯）机加酒仍会随赏秋人流小幅回升"],"scripts":[{"angle":"干货直给","text":"想看新疆秋景又嫌暑运贵，9月是全年最好的窗口。原因很机械：7、8月学生放假亲子游长线集中，票价翻倍；9月一开学，这波客流瞬间清零，航司为了填舱只能放折扣。行业里把9月叫航空平季，全年折扣力度最大、溢价最低。换季节点在8月底9月初，航司清暑期库存放平季特价，9月头十天普遍比暑运低三到六成。新疆正好这时候进入秋色巅峰，喀纳斯、禾木、白哈巴层林尽染，暑期的人潮也退了。所以9月去新疆，机票腰斩、酒店回落、景区不挤，三层好处叠一起。别等国庆，那时又回到全价，9月头十天是全年低价峰值，想看秋景又想省，这波窗口别错过。"},{"angle":"趋势判断","text":"9月机票跳水不是偶然，是航司固定的调价节律，每年都一样，判断有三条。第一，需求断崖，9月全国开学，暑期亲子和长线游刚需消失，客座率掉下来，供大于求，价格自然扛不住。第二，换季清库存，8月底9月初是航季交替，航司要把暑期高价舱清空，集中放平季特价，9月头十天是全年低价峰值。第三，错开假期，9月夹在暑运和国庆中间，没有超级客流，中秋只有三天且集中压力小。这三点叠加，让9月成为下半年最舒服的出行月。对游客的意义：想看秋景、想错峰、想省钱的，把行程往9月挪，比国庆省一半还不止，会安排的人已经把长途赏秋排进9月了，你再犹豫机票就回全价。"},{"angle":"故事切入","text":"我一朋友去年9月初去了喀纳斯，回来跟我说这趟是他花得最值的一次。他原本打算8月去，一看机票四千多还一票难求，拖到9月第一周，同样的线一千出头拿下，酒店也掉回平季价。到了地方才发现人还少，观鱼台不用排队，禾木的木屋推开窗就是晨雾和白桦。他后来才搞懂，这不是运气，是规律：暑运一结束全国开学，客流断崖，航司放折扣填舱，而新疆9月正好秋色最浓。所以别跟着暑假大军挤，把长途赏秋安排到9月，机票腰斩、人退潮、风景到顶，三件事同时发生，他现在每年都卡9月去，说别的月份又贵又挤，这个时机是真的是捡漏。"}]},{"id":"tv5","title":"机票杀熟防坑，别反复刷同航线，无痕比价","hook":"你越频繁搜某条航线，它越可能悄悄涨价，这不是玄学。","why":"消费者保护向，长效；直击痛点，评论区易共鸣；实操建议清晰。","heat":"中","tags":["避坑","实用","收藏向"],"facts":["中国经济新闻网2026攻略：频繁查询可能触发平台动态溢价，建议间隔3小时以上或使用无痕模式重新搜索，可看到真实底价（中国经济新闻网 cet.com.cn 2026）","多平台实测建议：同一航线至少比2至3个平台，核对含税总价，避免被裸票价误导；先领券再查票（去哪儿/航旅纵横/航班管家实测 2026）","黄冈新闻网2026攻略：避开早晨9至12点商旅查票高峰，频繁搜索易触发大数据溢价机制（黄冈新闻网 2026）","待核实：「大数据杀熟」是否构成、幅度多大业界仍有争议，部分平台称是供需动态调价；以下防溢价操作为稳妥做法，非认定平台违规"],"scripts":[{"angle":"干货直给","text":"同一个航线你搜多了，价格可能越刷越高，这不是错觉。多家平台实测都提到，频繁查询会触发动态溢价机制，系统识别你是刚需就往上抬。中国经济新闻网的建议很直接：别连着刷，间隔三小时以上，或者用无痕模式重新搜，往往能看到更低底价。黄冈那边的攻略还补了一句，早上九点到十二点商旅查票高峰别去凑，这时候溢价最猛。再一个，永远别只看首页裸票价，机建燃油还得加一百到两百，认含税总价。同一线至少比两三个平台，去哪儿航旅纵横航班管家各看一眼。这几条不复杂，但能让你少花冤枉钱，别小看这几步，长线往返一趟差出几百块是常事。"},{"angle":"避坑清单","text":"防机票溢价，五条记牢。第一，别半小时里反复刷同一条线，越刷越贵，想看底价就开无痕模式或者隔三小时再搜。第二，避开早上九点到十二点商旅查票高峰，那个时段溢价最明显。第三，只看含税总价，首页裸票不含机建燃油，差一两百是常事。第四，同一航线至少比三个平台，去哪儿航旅纵横航班管家口径不一，谁低用谁。第五，先领券再查票，很多平台口令券领了才显示真实低价。最后补一句，是不是杀熟业界还在吵，但无痕比价、错峰查、多平台核对，这套做法稳赚不亏，花两分钟清个缓存、开个无痕，比事后骂平台涨价实在得多。"},{"angle":"方法论","text":"机票这东西，价格不是固定的，是跟着你的行为浮动的，理解这一点很重要。平台用的是动态定价，你的搜索频率、登录状态、历史订单都是信号。所以方法论就三条：第一，把查和买分开，查价用无痕、买之前清缓存，别让系统记住你是谁。第二，比价要跨平台跨设备，手机电脑各看一遍，同一线不同端价格能差出一两百。第三，用价格提醒代替手动刷，设好心理价让系统盯，降价推你，比自己反复戳更稳也更便宜。说到底，你越表现得非这条线不可，价格越不友好；表现得可买可不买，底价才给你看，把查价当成逛街而不是抢购，价格反而对你更客气。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"可灵完成近30亿美元融资，估值180亿，AI视频单笔最高","hook":"可灵一把融了快30亿美元，BAT十五年来第一次同台当股东。","why":"资本动向加行业拐点，情绪价值足；快手财报刚披露营收翻倍，数据硬。","heat":"高","tags":["强时效","AI视频","行业"],"facts":["快手2026年7月公告：旗下可灵AI完成近30亿美元独立融资，投后估值约180亿美元（约合人民币1225亿元），创全球视频大模型公司单轮最大融资纪录（快手公告 2026-07-02；新华网 2026-08-07）","投资方阵容：腾讯、阿里云、百度三家互联网巨头罕见同台入股，另有国资基金、中东BlueFive及中信金石、启明创投等；快手仍持股68.33%（每经 2026-08-26）","快手2026年Q2财报（8月19日）：可灵AI单季营收超8.5亿元，同比增长超200%；全球用户突破1亿，覆盖224个国家和地区，企业客户近5万家（快手财报 2026-08-19）","资本逻辑：近三个月可灵、生数科技、爱诗科技、演语科技四家AI视频公司新增融资合计近300亿元，行业从概念驱动转向商业化实质定价（新华网 2026-08-07）","待核实：估值180亿为交易各方测算结果，市场对其能否匹配预期有分歧；可灵预计2028年Q4才单季盈亏平衡（每经 2026-08-26）"],"scripts":[{"angle":"干货直给","text":"AI视频圈出了个大事：可灵一把融了近30亿美元，估值180亿美元，创了全球视频大模型单轮融资最高纪录。更夸张的是投资方，腾讯阿里百度三家十五年里第一次同时当同一家公司的股东，外加国资基金和中东资本。快手7月发的公告，8月19号刚披露的二季度财报补了关键数据：可灵单季营收超8.5亿，同比涨超200%，全球用户破1亿，覆盖224个国家和地区。这意味着什么？AI视频不再是实验室玩具，已经有真金白银的营收和海量用户。近三个月四家AI视频公司融资合计近300亿，资本在用脚投票，这个赛道正在从讲故事进入拼收入阶段。"},{"angle":"趋势判断","text":"可灵这轮融资，信号比金额本身更重，我看三条。第一，BAT三家同台入股一家AI视频公司，十五年来头一回，说明大厂对视频生成赛道达成了罕见共识，这不是赌一个产品，是赌下一代内容基建。第二，估值逻辑变了，新华网点得很清楚，行业从概念驱动转向商业化实质定价，也就是说投资人不再为PPT买单，看的是营收增速，可灵单季8.5亿、翻倍增长正好对上。第三，资本向头部集中，近三个月四家融资近300亿，小玩家生存空间被算力成本和获客压窄。结论：AI视频的下半场，拼的是规模和分发，不是谁模型更花哨。"},{"angle":"创作者视角","text":"这条新闻跟做内容的你有直接关系。可灵单季营收8.5亿、用户破1亿，背后是大量人在用AI视频干活赚钱，短剧、广告、电商素材是三大主力。资本这么砸，说明两件事：一是AI视频的生产成本还会继续往下走，API降价是常态；二是平台会拼命抢创作者和分发，对你来说是红利期，工具和流量都便宜。但反过来想，门槛越低谁都能做，同质化会更严重。你现在该做的不是追新模型，是把选题和审美做厚，趁着平台补贴期把账号和作品库垒起来。等资本退潮、拼盈利的时候，有粉丝和作品的人才活得下来，红利期就这阵子，平台补贴一停，拼的就是谁的留存和内容的厚度。"}]},{"id":"ai2","title":"国产开源模型进制造业，京东方蓝鲸显示大模型","hook":"国产开源模型没只躺在排行榜上，京东方拿它去管显示屏质检和机床了。","why":"最硬核的落地案例，央视焦点访谈专题；从概念到生产线，说服力强。","heat":"中高","tags":["国产","落地","趋势"],"facts":["央视《焦点访谈》2026-08-20专题《开源共享 智「惠」世界》：京东方蓝鲸显示大模型以国产开源大模型为基础底座，在产线上识别显示屏缺陷、生成修复方案并联动机床完成修复（央视 2026-08-20）","新浪财经2026-08-25：该模型把原本跨环节流转、耗时数小时的处理流程压缩到秒级；京东方选择开源底座看重成本免费、可定制、支持私有化部署保障数据安全（新浪财经 2026-08-25）","京东方高管表述：开源模型三大优势是成本更低、可深度定制、可私有化部署，已在全国各地工厂覆盖生产制造、创新应用、企业运营多环节（央视/新浪 2026-08-20/25）","待核实：具体降本提效数值未公开披露；「蓝鲸」为京东方自研行业模型，基础层采纳国产开源模型，非单一模型直接上岗"],"scripts":[{"angle":"功能详解","text":"央视8月20号焦点访谈讲了个很实在的案例：京东方用国产开源大模型当底座，做了个蓝鲸显示大模型，专门管显示屏生产。产线上一块屏过来，模型几秒钟识别缺陷，直接出修复方案，还联动机床把活干了。原来这道工序跨好几个环节、要几小时，现在压到秒级。京东方为什么选开源底座？三个理由：免费、能按显示工艺深度定制、能私有化部署把数据锁在自己机房。这三点对制造企业是命门，尤其是数据安全。现在这模型已经铺到京东方各地工厂，管生产、管创新、管运营。这才是开源模型该有的样子：不是跑分第一，是真进产线。"},{"angle":"方法论","text":"京东方这个案例，给所有想用AI的企业指了条路，方法论就三层。第一，别自己从零训大模型，直接拿开源权重当底座，成本几乎为零，省下的是几亿训练费。第二，把自家几十年的行业知识和工艺规则灌进去做二次训练，让通用模型变成懂行的专才，京东方叫它懂行、守规、好用。第三，私有化部署，核心数据不出厂，安全合规过关才能进生产系统。这三步下来，通用大模型就转成了企业自己的行业大脑。小公司没京东方的数据量，但逻辑一样：借开源、加私域知识、本地跑，比买闭源API省且稳，中小团队预算有限，这套借力打法比硬上闭源套餐现实得多。"},{"angle":"说人话版","text":"说人话解释京东方这事。开源大模型就像个免费的公共大脑，谁都能下载。京东方干的事，是把它请回自己的工厂，喂了三十年的显示屏制造经验，调教成一个只懂做屏的专才。以前一块屏有毛病，要人来回流转几个小时才发现、才修；现在这个专才盯着产线，几秒看出问题、出方案、顺手指挥机器修好。关键是这大脑免费、能改、还能关在自己机房里不外传，数据安全感拉满。所以开源不是极客玩具，是实打实的生产力，制造业用它把老师傅的经验固化成系统，三班倒不喊累，制造业最缺的不是模型，是把经验固化成不休息的系统，开源给了它低成本的入口。"}]},{"id":"ai3","title":"AI视频进入代理原生，从提示词到导演","hook":"AI视频的下一站不是「生成更漂亮」，是「你当导演，代理干全活」。","why":"工具演进趋势，对做视频的人直接有用；从prompt到production的范式转移，破圈。","heat":"中高","tags":["玩法","AI视频","趋势"],"facts":["Tech in Asia 2026-08-18报道：对话式AI代理已实现全流程视频制作，用户用自然语言沟通，代理覆盖从构思到成片（AIToolly 引述 2026-08-19）","Flova.ai 2026-08-24宣布全面接入字节Seedance 2.5，做Agent-native视频工作流：上传长剧本与角色设定，代理管分镜、资产、版本与粗剪，称为「从提示词到导演」（PRNewswire 2026-08-24）","Flova定位：模型生成、Skill封装工艺、Agent编排生产、创作者做决策；Skill Hub含100多个可复用专业生产技能（Flova/PRNewswire 2026-08-24）","待核实：此类代理实际成片通过率、返工率、单条成本尚未有第三方公开基准；「全流程」仍依赖人工在关键节点审稿纠错"],"scripts":[{"angle":"趋势判断","text":"AI视频正在过一道坎：从「你写提示词、它出一段片子」变成「你当导演、代理干全活」。早期工具要你学模型的语，现在Flova这类把Seedance 2.5接进工作流，你给个brief或者长剧本，代理自己管分镜、管素材、管版本、管粗剪，你只做关键决策。Tech in Asia八月中旬也报道了对话式代理做全流程视频。这背后的转变是：竞争焦点从生成质量挪到生产流程。单段片子再漂亮，凑不成片也是白搭。谁能把角色一致性、镜头连贯、版本管理这些脏活orchestrate好，谁才值钱。对创作者，这是把剪辑师和统筹外包给AI，你腾出手管创意。"},{"angle":"功能详解","text":"具体看Flova这套怎么跑。底层接的是字节Seedance 2.5，负责生成画面。上面盖一层Agent：你上传一个长剧本，加上角色设定和世界观，代理记住项目上下文，跨几十集几百镜不脱节。它内置一百多个可复用Skill，每个Skill是一条生产playbook，比如某种转场、某种运镜风格，不用每次从空白提示词写起。你下指令，代理拆成故事板、调模型、出粗剪、管版本。人和AI的分工是：模型生成、Skill封装工艺、Agent编排、你做导演拍板。等于把专业制作团队的职能拆开，重复性生产交给代理，审美和叙事留给你。"},{"angle":"创作者视角","text":"如果你靠做视频吃饭，这个趋势得盯紧。以前用AI视频，最累的不是生成，是生成完的活：角色每集长得不一样、镜头接不上、版本乱成一团、改一句要重导出。代理原生工作流正是冲这些痛点来的，它记住你的项目，改一集不影响其他集，素材统一管理。这能让你一个人撑起以前一个小团队的产量。但别高兴太早，自动生成的成片通过率和返工率还没公开基准，关键节点还是得你审稿。我的判断：短期它是强力辅助，长期它会吃掉纯执行岗，留下来的是会写brief、会把关、有审美的人，工具迭代快，但审美和把关是护城河，越早建越稳。"}]},{"id":"ai4","title":"Qwen3.8-27B小钢炮，270亿跑消费级显卡超旗舰","hook":"270亿参数的小模型，一张游戏显卡就能跑，编程还干翻了闭源旗舰。","why":"端侧AI拐点，信息密度高；打破「大模型才强」认知，对普通用户最有用。","heat":"高","tags":["强时效","国产","端侧"],"facts":["阿里千问2026-08-14开源Qwen3.8-27B：270亿参数稠密模型，原生多模态，262K上下文可扩至1M，Apache 2.0可商用免费（阿里千问 2026-08-14；智东西/QbitAI 2026-08-16）","官方跑分：SWE-bench Pro 61.7分超过Claude Opus 4.6 Max的53.4；OSWorld-Verified 84.3超过Opus的72.7；量化后约17GB显存，单张RTX 4090可跑（QbitAI/社区实测 2026-08）","架构：64层含48层Gated DeltaNet线性注意力，KV缓存仅传统27B约1/4，故能塞进消费级显存；16GB显卡可流畅运行（智东西 2026-08-16）","待核实：上述Opus对比为千问官方自报，第三方独立复现仍在进行；科学推理（GPQA 89.2）等仍低于旗舰，最难关卡有差距；响应偏慢、默认高强度思考需调参"],"scripts":[{"angle":"干货直给","text":"阿里8月14号开源的Qwen3.8-27B，是个反常识的小钢炮。270亿参数，听着不大，但它原生多模态、上下文26万还能扩到100万，Apache 2.0协议商用免费。最关键的是部署门槛：量化后模型文件约17GB，一张RTX 4090就能跑，16GB显卡也能流畅用。能力上，官方说SWE-bench Pro编程拿了61.7分，超过Claude Opus 4.6 Max的53.4；电脑操作OSWorld 84.3也压过Opus。架构上它把48层换成线性注意力，显存占用砍到传统模型四分之一，所以才塞得进家用显卡。对普通人意味着：以前本地跑模型是大厂专利，现在你游戏本就能跑一个接近旗舰的Agent。"},{"angle":"反常识开场","text":"参数越大越强的铁律，被这个27B模型撬了个缝。Qwen3.8-27B只有270亿参数，不到很多旗舰的零头，但官方跑分里编程和电脑操作两项干翻了Claude Opus 4.6 Max。它怎么做到的？不堆参数，堆效率。48层换成线性注意力，显存只要传统模型四分之一，于是量化后17GB，一张游戏显卡就能本地跑。这等于把旗舰级Agent能力从机房拉到你桌面。当然要泼冷水：Opus对比是官方自报，第三方还没完全复现；科学推理这类最难关卡它仍落后；而且它默认爱深度思考，响应偏慢。准确说，它是90分的平价替代，不是100分的白嫖，但90分对绝大多数人够用了。"},{"angle":"数据向","text":"把Qwen3.8-27B的数摆清楚。参数：270亿，稠密架构，不是MoE。多模态：原生支持图视频理解。上下文：26万token，YaRN扩到100万。协议：Apache 2.0，下载部署商用全免费。部署：量化后约17GB，RTX 4090舒服跑，16GB能跑，8GB激进量化也能体验。跑分：SWE-bench Pro 61.7对Opus 4.6 Max 53.4；OSWorld-Verified 84.3对72.7；Terminal Bench 2.1 73.0略低于Opus 78.2。架构：64层里48层线性注意力，KV缓存降到约1/4。结论很清晰：日常编程、工具调用、中等任务它摸到旗舰门槛，最难的代码工程还有差距。本地优先、数据不出本机、零token费，这三点云端给不了。"}]},{"id":"ai5","title":"AI视频争夺发布权，代理接进成片链加合规","hook":"AI视频的下一仗，不在生成，在谁能把片子安全送进发布环节。","why":"商业化最后一公里加合规，视角新；对做营销、电商视频的人直接有用。","heat":"中","tags":["趋势","AI视频","合规"],"facts":["2026年8月5至6日，Cloudinary与Pollo AI相继发布：让AI agent直接调用视频生产链，从素材检索、权限、变换、审批到自动发布（neodrop.ai 2026-08）","Pollo Agent 2.0定位面向结果的创作代理：分析参考视频的hook、节奏、视觉风格，通过对话连续改片，输出publish-ready视频与广告（Pollo AI 2026-08-06）","Cloudinary Agent Experience layer更偏媒体资产控制面：读取资产上下文判断是否符合品牌与合规，执行处理后自动发布并生成平台所需比例格式（Cloudinary 2026-08-05）","待核实：自动发布的失败恢复、AI标识保留、独立客户结果尚未有公开基准；「发布权」竞争尚处早期，厂商自述为主"],"scripts":[{"angle":"趋势判断","text":"AI视频的竞争，正在从「谁生成更漂亮」转向「谁把片子安全送进发布」。8月5、6号两天，Cloudinary和Pollo AI先后发新东西，重点都不是新模型，而是让AI代理直接插进视频生产链：检索素材、管权限、做变换、过审批、自动发布。这说明行业盯上了最后一公里——成片质量、版权权限、AI标识、审计记录，要一起交付才算完。以前工具只管生一段视频，发布还得人搬。现在代理把发布也吃了。对做营销和电商视频的团队，这意味着一条片从brief到上线可能全自动，但合规和品牌把关必须写进代理逻辑，不然自动发的翻车也快。"},{"angle":"功能详解","text":"具体看这两家怎么分。Pollo Agent 2.0是面向结果的创作代理：你丢给它产品链接、参考视频、脚本，它分析参考片的hook和节奏，对话式连续改片，最后给你publish-ready的广告。Cloudinary的Agent Experience layer更像媒体资产控制面：它读你已有素材的元数据、权限、使用关系，判断是否符合品牌和合规，再执行处理，自动发布成各平台要的比例和格式。一个从想法往成片走，一个从已有资产往发布走。共同点是都把代理接进了生产到发布的整条链路，而不只是生成那一秒。差别在起点，但终点都是少人干预地把片子发出去。"},{"angle":"创作者视角","text":"如果你做商业视频，这个方向跟你饭碗相关。代理接管发布之后，批量产广告、批量发多平台会变成常态，效率高但风险也高：自动发的片子如果AI标识没保留、版权没查清、品牌调性跑偏，翻车是秒级的。所以创作者在这套里的新角色不是剪辑，是给代理写规则——哪些素材能用、哪些平台要带标识、什么调性不能碰。工具越强，把关的权重越重。我的建议：现在就去摸清你常用的发布平台的AI标识和版权要求，把这些写成代理能执行的checklist，比到时候手动一个个改省一百倍。未来值钱的不是会剪，是会把关，别等翻车才补流程，现在把规则写进代理，比事后删片省一百倍。"}]}]}]},"2026-08-28":{"date":"2026-08-28","updatedAt":"2026-08-28 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"暑运最后一周，这份成绩单告诉你今年出游有多疯","hook":"铁路10亿人次、民航1.4亿，今年的暑运比任何一年都猛。","why":"暑运即将收官，年度数据出炉，适合做大盘点类内容，收藏转发高。","heat":"高","tags":["数据","大盘","长效"],"facts":["中国西藏网2026-08-19：2026年暑运7月1日启动，全国铁路预计发送旅客10.1亿人次；民航暑运旅客运输量约1.42亿人次（境内航司承运），日均超228万人次。","航旅纵横2026-08-23/24：8月1日至8月18日国内航线民航旅客量超3918万人次，同比去年增长约13%；出入境航线超500万人次，同比增约2%。","航旅纵横2026-08-23：国内热门航线前十为北京-成都、上海-深圳、上海-广州、北京-广州、成都-深圳等，一线枢纽与文旅城市为核心目的地。","中国西藏网2026-08-19：截至7月底8月境内航线机票预订量约1750万张同比增约7%；7月境内民航旅客量超6294万同比增约4%。","待核实：乌兰浩特机场暑运旅客吞吐量同比+7.3%创历史新高（中国民航网2026-08-21，单一口径，未写入正文）。"],"scripts":[{"angle":"数据向","text":"把今年暑运的数字摆出来，你就知道出游有多猛。全国铁路这个暑运预计发送旅客10.1亿人次，民航旅客运输量约1.42亿，日均超过228万人次。更吓人的是民航的增速，航旅纵横的数据，8月1号到18号国内航线旅客量超过3918万人次，比去年同期涨了13%，出入境也破了500万人次。热门航线前十名里，北京到成都、上海到深圳、上海到广州这些老面孔稳居前列，说明一线枢纽加文旅城市还是绝对核心。这组数字说明出行需求已超预期恢复，接下来中秋国庆运力会非常紧张，热门方向越早订越便宜。记住，暑运尾巴的临期票是下半年最划算的一波，等双节运力一紧就没这好事了。"},{"angle":"趋势判断","text":"暑运收官，从数据能看出三个走向。第一，需求是真的回来了，不是报复性一下就完。铁路预计10.1亿人次、民航1.42亿，国内民航8月上中旬还同比涨了13%，这个增速是实打实的恢复。第二，出行的结构在变，一线枢纽加热门文旅城市吸走了大部分客流，北京成都、上海深圳这些线常年霸榜，说明大家更敢飞远、飞贵的地方了。第三，也是给普通人的提醒，暑运一收，中秋国庆紧接着来，运力本来就紧，现在不提前订，假期票价只会更高。把今年的数据当参考，该动手就动手。把这份成绩单存进收藏夹，它就是你判断双节和中秋出行成本的底图。"},{"angle":"说人话版","text":"说人话解释暑运是什么概念。暑运不是暑假，是每年7月到8月底全国铁路和民航的一场大考，学生放假、全家出游、探亲返乡全叠在一起。今年的规模：铁路预计10.1亿人次，民航1.42亿，光8月前18天国内民航就运了3918万人次，比去年同期多13%。什么意思？就是你现在去任何热门机场，人都比往年更多。对普通人最直接的影响：机票和酒店在旺季根本降不下来，想舒服又想省钱，只能错峰或者提前很久锁定。暑运尾声的尾单反而可能是下半年最便宜的一波。想舒服又省钱，就盯这最后几天，过了暑运门槛立马不一样。"}]},{"id":"tv2","title":"双节机票最后几天低价窗口，9月15号是个分水岭","hook":"现在不订，9月中旬一过，票价就要跳着涨了。","why":"8月下旬到9月上旬是公认黄金窗口，结合「搜索涨价陷阱」和退改保护，实操性强，强时效。","heat":"高","tags":["强时效","省钱","避坑"],"facts":["新浪旅游2026-08-26/27：8月下旬至9月上旬为双节机票预订黄金窗口；业内称8月中下旬是订国庆机票黄金窗口，过节点票价大概率上涨、舱位选择变少。","新浪旅游2026-08-26：近期京津冀三地消协已约谈10家航司和5家平台，要求8月31日前完成超售等问题整改，规范退改收费。","新浪旅游2026-08-26：频繁搜索同一航线可能导致票价上涨，遇不合理涨价可保留证据向平台或消协投诉。","网易2026-08-27：机票价格跳涨点一般在9月15日前后，此时低价舱大量售出、票价逐步走高；9月下旬至临近出发热门航线迅速上浮。","新浪旅游2026-08-27：截至8月双节出发机票搜索热度同比涨61%，国内热门城市抢订同比增30%，仍有2折左右低价可淘。"],"scripts":[{"angle":"干货直给","text":"双节机票现在这个窗口，再不下手就亏了。业内共识，8月中下旬到9月上旬是订国庆机票的黄金窗口，过了这个节点票价大概率跳涨、舱位也少了。具体分水岭在9月15号前后，那时候低价舱基本卖光，价格开始往上走，临近出发热门线甚至全价。现在还有2折左右的票，比如中秋首日北京飞上海、杭州、西安都有两折。三个动作：第一，行程定了尽快锁票，别拖到9月中；第二，优先选退改灵活的产品，万一变卦少损失；第三，别反复刷同一条线，同一航线搜太多次平台可能涨价，看准了直接下单。早买早安心，剩下的不确定行程等临期捡漏，比硬扛全价划算。"},{"angle":"避坑清单","text":"订双节机票，这四条坑现在就得避开。第一，别等9月中旬，价格跳涨点就在9月15号前后，那是低价舱清空、票价起飞的拐点。第二，别反复刷同一航线，多个来源提示频繁搜索同一条线可能触发动态涨价，看准就买，别天天看。第三，退改条款看清再付钱，近期京津冀三地消协约谈了10家航司和5家平台，要求8月31日前整改超售、规范退改收费，说明这块乱象正在被管，但下单前自己也要核对。第四，遇不合理涨价保留截图，可向平台或消协投诉。把这几条记牢，比临时抓瞎强。把这四条存进备忘录，订票前翻一眼，省下的都是实打实的钱。"},{"angle":"趋势判断","text":"从今年的预订节奏看，双节机票的逻辑变了。以前是临近假期才抢，今年是8月就提前锁，新浪的数据双节出发搜索热度同比涨了61%，热门城市抢订涨30%，说明大家都在抢早鸟。但早鸟不代表闭眼买，两个信号要盯：一个是9月15号这个跳涨点，低价舱在此之前放完，之后只会更贵；另一个是动态定价，你越犹豫越刷，系统越可能给你加价。今年最优解是8月底前把确定行程的票锁了，选能免费退改的留好回旋余地，剩下的不确定行程等9月看临期尾单。今年这节奏，晚订就是多花钱，早点动手最稳。提前锁票，心里才不慌。机票越早看越便宜。"}]},{"id":"tv3","title":"回程票比去程便宜：今年双节返程高峰被打散了","hook":"去的时候挤破头，回来反而能捡便宜。","why":"反常识+数据（返程分散10.4-7，10.4低2成+），之前都讲去程低价，返程视角新鲜。","heat":"中高","tags":["反直觉","省钱","数据"],"facts":["封面新闻2026-08-27：今年双节返程飞行热度分散在10月4日至7日，高峰更平缓；10月4日机票均价比去年返程期间低超2成。","封面新闻2026-08-27：9月27日至10月1日机票价格创近三年最低，部分热门航线机票均价比去年低一成以上；以北京出发为例9月27日直飞大连、沈阳、大庆、银川仅需300余元。","封面新闻2026-08-27：受错峰捡漏带动，9月22日起出行人潮渐增，9月25日假期首日达今年峰值同比增1.7倍；国庆首日10月1日为第二高峰。","新浪旅游2026-08-27：双节初期部分航线仍有2折左右，中秋首日北京至上海、杭州、西安，广州至杭州、武汉等多条线有2折票。"],"scripts":[{"angle":"反常识开场","text":"大家都在抢去程票，但真正便宜的其实是回程。今年双节有个明显变化，返程高峰被打散了，不再像往年全挤在最后两天，而是分散在10月4号到7号，曲线更平缓。结果就是回程票更便宜，封面新闻的数据，10月4号机票均价比去年返程期间低了超过两成。去程这边反而紧张，9月25号假期首日出行人次同比涨了1.7倍，是今年峰值。所以策略反过来：去程能早则早、错峰最划算，回程恰恰可以晚一点订、挑分散的那几天，反而能省。别被回程肯定贵的旧经验骗了。旧经验该更新了，回程不一定贵，关键看你挑哪几天。灵活点，能省则省。"},{"angle":"数据向","text":"把双节机票的数字摆一摆。去程：9月25号中秋首日是今年出行峰值，同比增1.7倍；国庆10月1号是第二个高峰。但价格上，9月27号到10月1号这五天反而创了近三年最低，北京出发飞大连、沈阳、大庆、银川只要300出头。回程：热度分散在10月4到7号，10月4号机票均价同比去年返程低超两成。结论是，去程别死磕9月25和10月1两个尖峰，选假期中段或9月27前出发；回程别赶最后两天，10月4号前后反而便宜。这套错峰组合拳，往返能省一大截。这套错峰组合拳打下来，一家三口往返能省出一顿好饭钱。"},{"angle":"实操流程","text":"双节往返怎么订最省，按这个顺序走。第一步，出发日别选9月25和10月1，这是两个价格尖峰，改选9月22到24或者10月3之后，均价能低三到五成。第二步，去程票8月底前锁，现在还有两折左右的线，比如北京飞上海杭州西安。第三步，回程别自动选假期最后一天，今年返程高峰散在10月4到7号，10月4号票价比去年返程低两成以上，挑这几天里人少的订。第四步，往返都选可免费退改的舱位，行程有变不亏。四步下来，一家三口往返能省出一顿好饭钱。照这顺序订，不用熬夜抢，钱包和体力都省了。何乐不为。省心又省钱。"}]},{"id":"tv4","title":"一趟夜行动卧，把大湾区的人送到湘西鄂西","hook":"晚上深圳上车，早上醒来看见张家界。","why":"具体新线（8.11开通），大湾区→湘西鄂西夕发朝至，之前没覆盖，玩法新鲜。","heat":"中","tags":["新线","玩法","亲子"],"facts":["红网张家界站2026-08-13：8月11日深圳北站新开通直达湖北咸丰的高铁动卧D9792/D9791，双向运行、夕发朝至，途经张家界西、凤凰古城等文旅站点。","红网2026-08-13：该动卧串联粤港澳大湾区与湘西、鄂西山水地带，傍晚发车清晨抵达，把赶路时间放夜间，降低跨省出游时间成本。","红网2026-08-13：线路带动周末游、深度康养游，拉长游客停留周期，利好沿线文旅从打卡转向深度体验。","待核实：具体票价与运行时长各媒体未统一披露，出发前以12306为准。"],"scripts":[{"angle":"干货直给","text":"大湾区想去湘西鄂西玩，现在多了个舒服选项。8月11号深圳北站开了直达湖北咸丰的高铁动卧，车次D9792和D9791，夕发朝至。什么叫夕发朝至？傍晚在深圳上车，睡一觉，早上醒过来已经到咸丰，中途还经过张家界西、凤凰古城这些站点。核心价值是把赶路的时间塞进夜里，你不用白天耗在车上，到了直接玩。对带娃和怕折腾的老人特别友好，省一晚酒店钱还少受罪。沿线的张家界、凤凰本来就是老牌IP，现在多了高铁动卧这种低体力消耗的玩法，周末就能走一趟。周末想跑远又怕累，这条线值得先收藏。周末说走就走。"},{"angle":"故事切入","text":"我有个深圳的朋友，以前想去张家界凤凰，最大的障碍不是钱是累。白天高铁要转车，到了天黑，精力耗光。8月11号开了这趟夜行动卧之后，他直接周五下班去深圳北站上车，睡一觉周六早上到咸丰，再转去张家界凤凰，两天玩透周日晚上回。他说这趟车改变的是出游的体力账，把最废人的赶路挪到睡觉时间，等于白赚一天。对大湾区这种加班多、周末短的人群，这种夕发朝至的线就是为咱们设计的。沿线文旅也在推深度游，住两晚比打卡一天值。对大湾区这种周末短、加班多的人，夕发朝至就是为咱们设计的。省下的都是精力。周末不浪费。"},{"angle":"玩法详解","text":"这条夜行动卧怎么玩最顺。线是从深圳北到湖北咸丰，D9792和D9791双向，夕发朝至，中途停张家界西、凤凰古城。推荐玩法：周五晚深圳上车，周六晨到咸丰，先去坪坝营或唐崖土司城，下午转张家界；周日玩天门山或凤凰，周日晚返程。为什么值得？第一，省时间，白天全留给景点；第二，省一晚住宿，车上睡了；第三，错开白天高铁的人流。注意两点：动卧票量少，周末和节假日尽早买；到了咸丰再往景区建议提前约车，山区接驳不如大城市密。整体是个性价比很高的短线深度游。适合带娃和带老人，体力消耗低，玩得还透。"}]},{"id":"tv5","title":"机票超售终于有人管了，8月31号前必须整改","hook":"你被超售赶下飞机的事，消协这次真出手了。","why":"监管动作（京津冀消协约谈10航司5平台），维权向长效，之前讲被坑怎么维权，这次讲监管新规。","heat":"中高","tags":["维权","监管","收藏向"],"facts":["新浪旅游2026-08-26：近期京津冀三地消协已约谈10家航司和5家平台，要求8月31日前完成超售等问题整改，规范退改收费。","通用合规提示：国内航班超售为业内常见做法，航司对自愿/非自愿放弃座位的旅客有补偿规则，但执行标准不一、退改收费长期被诟病。","待核实：具体整改清单与各家航司补偿标准细则，以各家航司8月31日后公告为准。"],"scripts":[{"angle":"干货直给","text":"机票超售这件事，这次真有人管了。新浪旅游报道，京津冀三地消协最近约谈了10家航司和5家平台，要求8月31号前完成超售等问题整改，把退改收费规范起来。超售什么意思？航司卖票会多卖几个座位，赌有人不来，结果真来的人多了，就有人被赶下来。以前各家补偿标准不一，被强行拒载经常扯皮。现在监管进场，等于给了明确红线。对你来说，两件事：买票优先选写明超售补偿规则的航司和产品；真被超售，现场要书面确认补偿方案再签字，别被口头打发。8月31号之后可以盯着各家公告看细则。规则变透明是好事，但留好证据永远是你自己的护身符。"},{"angle":"避坑清单","text":"遇到机票超售，照这四条办。第一，值机别拖到最后，越晚办越容易被挑中让座，尤其热门航线。第二，购票时看清楚是否标注超售及补偿，优先选规则透明的产品。第三，真被拒载，别急着签字拿钱走，先要书面补偿方案，自愿和非自愿放弃座位的赔偿差很多，非自愿通常更高。第四，保留登机牌、短信和沟通记录，后续投诉有凭。这次京津冀消协约谈10家航司5平台要求8月31前整改，说明乱象被盯上了，但维权还是得自己留证据。把这几条存好，用得上。真遇上超售，按这四步走，你比大多数人淡定。留好底，不踩坑。安稳出行。"},{"angle":"趋势判断","text":"消协这次约谈，信号比赔偿本身重要。京津冀三地消协一口气约谈10家航司和5家平台，要求8月31号前整改超售、规范退改收费，这是把长期模糊的灰色地带往明面推。过去超售补偿各家自己定，旅客弱势，投诉成本高。现在监管给了截止时间，意味着标准要统一、要公示。对行业，短期是合规成本，长期是信任修复，愿意把规则写清楚的航司会留住客人。对旅客，最直接的改变是：以后买票能看见补偿条款，被超售有据可依。建议大家8月31号后留意各家公告，把透明那几家记下来。建议关注先写清规则的那几家航司，长期更省心。"}]}]},{"id":"ai","name":"AI 最新资讯及玩法","topics":[{"id":"ai1","title":"英伟达129亿美元买下Hugging Face，开源还中立吗","hook":"你每天下载的模型，以后可能都要过英伟达的门。","why":"今日最大AI新闻，开源中立性争议，情绪价值足，评论区易讨论。","heat":"高","tags":["强时效","产业","争议"],"facts":["GitHub AI日报2026-08-28 / 腾讯新闻2026-08-27：美东时间8月26日英伟达同意以129亿美元收购开源AI社区Hugging Face（2023年估值45亿），创其史上最大并购。","资讯早餐2026-08-28：英伟达2027财年Q2营收962.2亿美元同比翻倍，数据中心收入890亿占92.5%；拟129亿收购HF引发开源生态卡位连锁反应。","资讯早餐2026-08-28：英伟达此前60亿美元收编AI编程公司Poolside、超百名工程师转投Nemotron研发，收购HF被解读为买开源生态收费站。","待核实：交易尚需监管批准，最终是否放行及时间未定；社区分流风险为分析机构预判。"],"scripts":[{"angle":"干货直给","text":"今天AI圈最大的事，英伟达要花129亿美元买下Hugging Face。Hugging Face是什么？全球最大的开源模型社区，你平时下载开源模型基本都从它那走。英伟达之前估值才45亿，现在开价129亿，翻了近三倍。同一天英伟达还交了份恐怖财报，单季营收962亿美元，同比翻倍。为什么买社区？因为它已经在卖芯片、卖模型，现在想把开源模型的入口也攥手里。业内一句话点破：英伟达不是在买公司，是在买开源生态的收费站。以后每个下载模型的人，可能都要经过它的门。这对普通开发者意味着，免费和开放可能要打问号了。开源这面旗还能打多久，接下来半年见分晓。"},{"angle":"趋势判断","text":"英伟达买Hugging Face，看清一个趋势：算力巨头在向上游收口。它不是第一次这么干，之前60亿美元收了AI编程公司Poolside，把上百工程师塞进自己的模型研发，现在再买下最大开源社区。逻辑很清楚，芯片、模型、社区入口，一条线全控。这对行业有两面：好的一面，资源和分发会更顺，小团队更容易拿到好模型；坏的一面，开源最宝贵的中立性没了，一个商业公司掌握入口，收费规则、推荐权重都可能变。对国内开发者，反而是提醒，别把所有依赖押在一个社区，镜像和自主托管要提前布局。对国内开发者，备份现在就得做，别等变天才慌。"},{"angle":"创作者视角","text":"做AI内容的朋友，这条新闻你得讲给观众听。英伟达129亿买Hugging Face，表面是商业新闻，实质是每个用开源模型的人都要关心的入口问题。你的视频里用的那些模型，下载、部署、调参，很多都依赖这个社区。一旦入口被一家商业公司掌握，未来可能出现：热门模型优先推付费版、下载限速、甚至某些模型下架。给观众的建议很实在：常用的模型现在就下一份存本地，别只存在云端；关注国内镜像站和自主托管的替代方案。这类基础设施被收编的故事，比跑分更有长期价值，收藏起来准没错。这类基础设施被收编的故事，比跑分更有长期价值。"}]},{"id":"ai2","title":"DeepSeek终于能看图了，视觉模型悄悄上线","hook":"一直只会写字的DeepSeek，现在也能读图了。","why":"DeepSeek补齐视觉短板，实用向，之前没覆盖视觉模型，信息差强。","heat":"高","tags":["强时效","玩法","国产"],"facts":["AI技术日报2026-08-25（经8-27模型榜单日报转述）：DeepSeek上线实验性视觉模型V4-Flash-Vision-Exp，首次为V4系列补齐图片输入能力。","AI技术日报2026-08-25：该视觉模型Agent基准接近Claude Opus 4.8，单图按最多384 Token计费，约1分钱可处理9张图。","待核实：该模型为实验性Exp版本，正式版上线时间与是否全量开放以DeepSeek官方公告为准；接近Opus 4.8为第三方评测口径。"],"scripts":[{"angle":"干货直给","text":"DeepSeek偷偷干了件大事，它终于能看图了。之前DeepSeek一直偏文本，写代码写文案强，但读图这块一直空着。现在上线了实验性的视觉模型V4-Flash-Vision-Exp，第一次给V4系列补上了图片输入。什么概念？你扔一张图给它，它能理解内容、做视觉相关的智能体任务，第三方评测说能力接近Claude Opus 4.8那档。价格也很狠，单图最多按384个token计费，算下来一分钱能处理9张图。对普通人来说，这意味着以后截图、拍文档、传图表直接丢给它就能分析，不用再切到别的模型。现在是实验版，建议先玩起来。方向已经很清楚，早玩早占坑，等正式版就晚了。"},{"angle":"玩法详解","text":"DeepSeek这个视觉模型怎么用最爽。第一，文档和表格识别，拍一张合同或报表丢进去，让它提炼关键条款和数字，比手敲快十倍。第二，截图答疑，代码报错截个图、网页布局截个图，它直接给修改建议。第三，视觉智能体，让它盯着图一步步干活，比如根据设计稿写前端代码。价格上一张图一分钱处理9张，日常用几乎没成本。要注意的是，这是V4-Flash-Vision-Exp实验版，能力在快速迭代，重要任务先小样本验证再批量用。等正式版稳定，它会是免费用户手里的看图利器。等正式版稳定，这就是普通人零成本看图分析的利器。"},{"angle":"趋势判断","text":"DeepSeek补视觉，说明国产大模型在补齐最后一块短板。过去一段时间，文本和代码国内已经追到第一梯队，但多模态看图、视频一直是短板，很多人不得不切去国外模型。现在DeepSeek把图片输入接上，第三方说接近Opus 4.8水平，而且价格压到一分钱9张图。趋势很清楚：国产模型不再只卷文本，多模态会成下一个战场，而且继续用低价把国外商业模型逼到墙角。对用户的直接好处是，一个国产模型就能通吃写、读、看，不用在好几个App之间跳。接下来半年，看图、看视频、听声音会逐步合到一个模型里。一个国产模型通吃写读看，离我们越来越近了。"}]},{"id":"ai3","title":"小鹏二代VLA大模型，让车从L2直接够到L4","hook":"车企自己训的大模型，开始接管方向盘了。","why":"物理AI/自动驾驶落地，具象有冲击力，之前没覆盖具体车企自动驾驶。","heat":"中高","tags":["自动驾驶","物理AI","国产"],"facts":["每日经济新闻2026-08-27：小鹏8月27日在广州发布第二代VLA大模型首次重大升级，端侧模型参数扩大3.5倍，引入Infini-VLA长时序架构与X-Foresight预测世界模型，综合安全能力提升20倍。","每日经济新闻2026-08-27：搭载该模型的Robotaxi获广州主驾无安全员远程测试资质，9月起向Ultra等车型推送。","待核实：L2至L4能力贯通为厂商表述，实际量产落地等级与法规以监管和官方交付为准。"],"scripts":[{"angle":"干货直给","text":"小鹏这两天发了第二代VLA大模型，把自动驾驶的野心写得很直白。VLA是视觉、语言、动作一体的大模型，等于让车像人一样看路、理解、做决策。这代端侧参数扩大了3.5倍，加了长时序架构和预测世界模型，官方说综合安全能力提升20倍。最关键的一句：搭载它的Robotaxi拿到了广州主驾无安全员的远程测试资质，9月开始推给Ultra这些车型。翻译一下，车在没有人坐主驾的情况下，能被远程监管着跑，这在国内是实打实的进展。对普通人，这意味着辅助驾驶的下限在快速抬高，但记住，现在还是辅助，手不能彻底离开方向盘。辅助驾驶下限在抬高，但命还是得自己攥着。"},{"angle":"趋势判断","text":"小鹏这代VLA，代表自动驾驶路线的一个转向：从堆规则到训大模型。过去辅助驾驶靠工程师写海量规则，遇到没见过的场景就傻。VLA大模型路线，是让车用海量真实驾驶数据自己学怎么开，看路、预测、决策一体。小鹏说安全能力提20倍、Robotaxi拿无安全员远程测试资质，说明这条路开始跑通。对整个行业，信号是：接下来的竞争不在传感器数量，而在谁能喂出最好的驾驶大脑。对买家，别被L2、L4这些标签绕晕，看实际交付能力和你当地能不能用，比看参数实在。看实际交付能力和你当地能不能用，别被标签绕晕。"},{"angle":"说人话版","text":"说人话讲小鹏这个VLA是什么。以前车的辅助驾驶，是程序员提前写好看到红灯就停、看到车就躲几千条规则，遇到没写过的就抓瞎。VLA是给车装了个会学习的大脑，让它像人一样看路面、理解前面那辆突然开门这种意外、自己决定怎么躲。小鹏这代把大脑参数扩了3.5倍，还加了能预判几秒后路况的世界模型，安全能力说提了20倍。最硬的证据是，用这个大脑的无人出租车，在广州拿到了主驾没安全员的远程测试资格，9月推给部分车主。说白了，车越来越能自己开，但你坐进去，该看路还得看。车越来越能自己开，但坐进去，安全这根弦不能松。"}]},{"id":"ai4","title":"399美元的开源机器鸭，把物理AI带进客厅","hook":"一台几千块的鸭子，能教你家孩子学机器人。","why":"消费级开源硬件+物理AI，具象好玩，区别于机器人大会展会综述。","heat":"中","tags":["硬件","开源","好玩"],"facts":["GitHub AI日报2026-08-28（引全天候科技）：美东时间8月27日Hugging Face与Pollen Robotics发布开源双足机器人Microduck，售价399美元、中国制造，支持强化学习教机器人新技能，目标售2万台、圣诞前发货。","待核实：399美元为海外定价，国内上市时间与含税价未公布；售2万台为目标量非已售。"],"scripts":[{"angle":"干货直给","text":"Hugging Face不只想买模型，还开始卖机器人了。8月27号它和Pollen Robotics发了个开源双足机器人叫Microduck，定价399美元，中国制造，目标圣诞前出货。它小，是只鸭子造型，但能玩真的，支持用强化学习教它新动作，你给它示范或写规则，它自己学。为什么重要？过去能学新技能的开源机器人要么贵要么难搞，这台把门槛压到几千块人民币，学生、极客、甚至小学生都能上手。物理AI一直卡在离普通人太远，这台是想把实验室的机器人搬进客厅和教室。对想带孩子玩AI的家庭，是个很合适的入门玩具。想带孩子玩AI，这台值得放进候选清单。"},{"angle":"玩法详解","text":"Microduck怎么玩。它是开源的，鸭子造型双足机器人，399美元，核心卖点是教，你可以用强化学习让它学走路、跳舞、避障，不用从零写代码，给它目标和反馈它自己迭代。适合三类人：一是学生，物理AI最好的教具，比看视频直观；二是开发者，开源意味着能改固件、接自己的模型；三是内容创作者，会动会学的机器人天然有镜头感，拍开箱和教学都很出片。注意，399美元是海外价，国内上市和含税价还没公布，想入手的等官方渠道。整体看，它是把机器人能学这件事消费化的一次尝试。想入手的等官方渠道，先看懂玩法不吃亏。"},{"angle":"趋势判断","text":"Micr
