<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="选题台">
<meta name="theme-color" content="#1e293b">
<title>每日选题 · 口播稿工作台</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16191d; --text2:#666e7a; --text3:#98a1ad;
  --line:#e6e8ec; --line2:#f0f1f4;
  --primary:#2563eb; --primary-d:#1d4ed8;
  --travel:#0d9488; --travel-bg:#e7f6f4;
  --ai:#7c3aed; --ai-bg:#f1eafe;
  --danger:#dc2626; --danger-bg:#fdecec;
  --ok:#16a34a; --ok-bg:#e8f6ec;
  --warn:#d97706; --warn-bg:#fdf3e3;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.hd{background:#1e293b;color:#fff;padding:14px 0 16px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.045)}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd-sub{font-size:12.5px;color:#a8b4c6;margin-top:3px}
.hd-acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:rgba(255,255,255,.11);color:#e7edf5;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn svg{width:14px;height:14px;flex:none}

.tipbar{background:var(--warn-bg);color:#8a5a08;font-size:13px;padding:9px 14px;display:none;align-items:center;gap:8px;border-bottom:1px solid #f2e3c6}
.tipbar.on{display:flex}
.tipbar button{margin-left:auto;font-weight:700;color:#8a5a08;padding:4px 8px;font-size:12.5px}

/* ---------- section / card ---------- */
.sec{margin-top:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-hd h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sec-hd .cnt{font-size:12px;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- today ---------- */
.today{background:linear-gradient(180deg,#fff 0,#fcfdff 100%);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.today-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.today-h .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;animation:bp 1.8s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
.today-h h2{font-size:15.5px;margin:0;font-weight:700}
.today-h .n{margin-left:auto;font-size:12px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#f7f8fa;border-radius:10px;padding:9px 8px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--text2)}
.stat.od b{color:var(--danger)}
.stat.dn b{color:var(--ok)}
.tlist{display:flex;flex-direction:column;gap:7px}
.titem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:#f7f8fa;font-size:13.5px}
.titem.od{background:var(--danger-bg)}
.titem .bd{flex:1;min-width:0}
.titem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .m{font-size:11.5px;color:var(--text2);margin-top:1px}
.titem.od .m{color:#b03636}
.titem .go{flex:none;background:var(--text);color:#fff;border-radius:8px;padding:0 12px;height:34px;font-size:12.5px;font-weight:600}
.titem.od .go{background:var(--danger)}
.empty{text-align:center;padding:22px 12px;color:var(--text3);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.3;display:block;margin:0 auto 8px}

/* ---------- track tabs ---------- */
.ttabs{display:flex;gap:8px;margin-bottom:12px}
.ttab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 8px;text-align:center;font-weight:700;font-size:13.5px;color:var(--text2);min-height:46px;transition:.15s}
.ttab .s{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:1px}
.ttab[data-k="travel"].on{background:var(--travel-bg);border-color:var(--travel);color:#0b6b62}
.ttab[data-k="ai"].on{background:var(--ai-bg);border-color:var(--ai);color:#6127c4}
.ttab[data-k="all"].on{background:#e8eefc;border-color:var(--primary);color:var(--primary-d)}
.ttab.on .s{color:inherit;opacity:.75}

/* ---------- topic ---------- */
.topic{margin-bottom:12px;overflow:hidden}
.tp-hd{padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.tp-idx{flex:none;width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
.tk-travel .tp-idx{background:var(--travel)}
.tk-ai .tp-idx{background:var(--ai)}
.tp-main{flex:1;min-width:0}
.tp-t{font-size:15.5px;font-weight:700;line-height:1.42;letter-spacing:.1px}
.tp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;padding:2.5px 7px;border-radius:6px;background:#f0f1f4;color:var(--text2);font-weight:600}
.tk-travel .tag.hot{background:var(--travel-bg);color:#0b6b62}
.tk-ai .tag.hot{background:var(--ai-bg);color:#6127c4}
.tag.hot{font-weight:700}
.tp-why{margin-top:9px;font-size:13px;color:var(--text2);background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.55}
.tp-why b{color:var(--text);font-weight:700}
.fold{border-top:1px solid var(--line2)}
.fold-b{width:100%;text-align:left;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;min-height:44px}
.fold-b svg{width:13px;height:13px;transition:.2s}
.fold-b.open svg{transform:rotate(90deg)}
.fold-c{display:none;padding:0 14px 13px}
.fold-c.open{display:block}
.facts{margin:0;padding-left:17px}
.facts li{font-size:12.8px;color:var(--text2);line-height:1.62;margin-bottom:5px}

/* ---------- script ---------- */
.scripts{border-top:1px solid var(--line2);padding:11px 14px 13px;background:#fbfcfd}
.sc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.sc:last-child{margin-bottom:0}
.sc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc-a{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f7;color:#41546b}
.sc-m{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.sc-st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.st-new{background:#f0f1f4;color:var(--text2)}
.st-pick{background:var(--warn-bg);color:#a15c06}
.st-shot{background:#e8eefc;color:var(--primary-d)}
.st-pub{background:var(--ok-bg);color:#15803d}
.sc-tx{font-size:14px;line-height:1.78;color:#252a31;max-height:78px;overflow:hidden;position:relative;transition:max-height .25s;cursor:pointer}
.sc-tx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.sc-tx.open{max-height:2000px}
.sc-tx.open::after{display:none}
.sc-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);border-radius:9px;padding:0 11px;height:38px;font-size:12.5px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:#fff}
.sbtn svg{width:13px;height:13px}
.sbtn:hover{background:#f7f8fa}
.sbtn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.sbtn.pri:hover{background:#2b3138}
.sbtn.act{background:var(--ok-bg);border-color:#bfe3c9;color:#15803d}
.sbtn.od{background:var(--danger-bg);border-color:#f3cfcf;color:var(--danger)}

/* ---------- refs ---------- */
.form{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);min-height:46px}
.form textarea{min-height:74px;resize:vertical;line-height:1.6}
.frow{display:flex;gap:9px}
.frow>*{flex:1;min-width:0}
.stars{display:flex;gap:3px;align-items:center}
.star{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.star svg{width:21px;height:21px}
.star svg path{fill:#dfe3e8}
.star.on svg path{fill:#f5a623}
.ref{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ref:last-child{border-bottom:none}
.ref-h{display:flex;align-items:flex-start;gap:9px}
.ref-t{font-weight:700;font-size:14.5px;flex:1;min-width:0;line-height:1.45}
.ref-m{font-size:12px;color:var(--text3);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ref-n{font-size:13px;color:var(--text2);margin-top:7px;background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ref-l{font-size:12.5px;margin-top:6px;word-break:break-all;display:inline-block}
.xbtn{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.xbtn:hover{background:var(--danger-bg);color:var(--danger)}
.xbtn svg{width:15px;height:15px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text3);min-height:56px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--primary)}
.nav .bdg{position:absolute;top:5px;margin-left:22px;background:var(--danger);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:8px;font-weight:700}

/* ---------- teleprompter ---------- */
.tele{position:fixed;inset:0;background:#0e1116;color:#f2f4f7;z-index:200;display:none;flex-direction:column}
.tele.on{display:flex}
.tele-hd{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #232a33;flex:none}
.tele-hd .tt{font-size:13px;color:#8e9aa8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{background:#1c222b;color:#cfd7e0;border-radius:8px;min-width:40px;height:38px;padding:0 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbtn svg{width:15px;height:15px}
.tele-bd{flex:1;overflow-y:auto;padding:24px 20px 90px;-webkit-overflow-scrolling:touch}
.tele-tx{font-size:26px;line-height:2.05;letter-spacing:.6px;max-width:820px;margin:0 auto;white-space:pre-wrap}
.tele-ft{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0),#0e1116 32%);display:flex;gap:8px;align-items:center;justify-content:center}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.modal h3{margin:0 0 8px;font-size:16.5px}
.modal p{margin:0 0 16px;color:var(--text2);font-size:13.5px;line-height:1.65}
.modal-a{display:flex;gap:9px}
.modal-a button{flex:1;height:46px;border-radius:11px;font-weight:700;font-size:14px}
.mb-c{background:#f0f1f4;color:var(--text)}
.mb-d{background:var(--danger);color:#fff}

/* ---------- toast / misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(84px + env(safe-area-inset-bottom));background:#16191d;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pane{display:none}
.pane.on{display:block}
.datesel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-bottom:11px;flex-wrap:wrap}
.datesel select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:14px;font-weight:600;color:var(--text)}
.badge-live{font-size:10.5px;background:var(--ok-bg);color:#15803d;padding:3px 7px;border-radius:6px;font-weight:700}
.badge-old{font-size:10.5px;background:var(--warn-bg);color:#a15c06;padding:3px 7px;border-radius:6px;font-weight:700}
.foot{text-align:center;color:var(--text3);font-size:11.5px;padding:22px 12px 8px;line-height:1.7}

@media(min-width:768px){
  body{padding-bottom:24px}
  .wrap{padding:0 22px}
  .hd{padding:18px 0 20px}
  .hd-title{font-size:19px}
  .nav{position:static;background:transparent;backdrop-filter:none;border-top:none;border-bottom:1px solid var(--line);max-width:1180px;margin:14px auto 0;padding:0 22px;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13.5px;padding:11px 15px;border-radius:10px 10px 0 0;min-height:46px}
  .nav button.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}
  .nav .bdg{position:static;margin-left:2px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .topics-grid .topic{margin-bottom:0}
  .tele-tx{font-size:31px}
}
@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hbtn span{display:none}
  .hbtn{padding:8px 10px}
}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap hd-row">
    <div>
      <div class="hd-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 22V12"/></svg>
        每日选题 · 口播稿台
      </div>
      <div class="hd-sub" id="hdSub">加载中…</div>
    </div>
    <div class="hd-acts">
      <button class="hbtn" onclick="doExport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>导出备份</span></button>
      <button class="hbtn" onclick="document.getElementById('impFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg><span>导入恢复</span></button>
      <button class="hbtn" onclick="askClear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span>清空</span></button>
    </div>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">

<div class="tipbar" id="tipbar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px;height:16px;flex:none"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
  <span id="tipTx"></span>
  <button onclick="hideTip()">知道了</button>
</div>

<div class="nav" id="nav">
  <button class="on" data-p="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>今天要处理<span class="bdg" id="navBdg" style="display:none">0</span></button>
  <button data-p="topics" onclick="go('topics')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>选题池</button>
  <button data-p="scripts" onclick="go('scripts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>口播稿库</button>
  <button data-p="refs" onclick="go('refs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>对标灵感</button>
</div>

<div class="wrap">

  <!-- ============ 今天要处理 ============ -->
  <div class="pane on" id="p-today">
    <div class="sec">
      <div class="today">
        <div class="today-h">
          <span class="dot"></span><h2>今天要处理</h2>
          <span class="n" id="todayN"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tlist" id="tlist"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hd"><h2>今日速览</h2><span class="cnt" id="ovCnt"></span></div>
      <div id="overview"></div>
    </div>
    <div class="foot" id="foot1"></div>
  </div>

  <!-- ============ 选题池 ============ -->
  <div class="pane" id="p-topics">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel" onchange="switchDate(this.value)"></select>
        <span id="dateBadge"></span>
      </div>
      <div class="ttabs" id="ttabs1"></div>
      <div id="topicList"></div>
    </div>
    <div class="foot" id="foot2"></div>
  </div>

  <!-- ============ 口播稿库 ============ -->
  <div class="pane" id="p-scripts">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel2" onchange="switchDate(this.value)"></select>
        <span id="dateBadge2"></span>
      </div>
      <div class="ttabs" id="ttabs2"></div>
      <div class="ttabs" id="stfilter" style="margin-top:-4px"></div>
      <div id="scriptList"></div>
    </div>
    <div class="foot" id="foot3"></div>
  </div>

  <!-- ============ 对标灵感 ============ -->
  <div class="pane" id="p-refs">
    <div class="sec">
      <div class="sec-hd"><h2>加一条对标</h2></div>
      <div class="card">
        <div class="form">
          <input id="rTitle" placeholder="标题 / 这条讲了什么（必填）" maxlength="120">

<script id="packToday" type="application/json">{"date":"2026-08-27","updatedAt":"2026-08-27 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月22号出发比国庆首日便宜一半：双节前这个时间差最香","hook":"想省钱别赶国庆首日，提前一周走能省一半。","why":"双节前机票有明确价格洼地，9月22号是低价点，一周之差价格差一倍，数据来自去哪儿，适合做省钱向口播。","heat":"高","tags":["省钱","强时效","双节"],"facts":["去哪儿大数据：9月22日出发机票均价较中秋首日（9月25日）低约30%、较国庆首日（10月1日）低约50%（证券时报 2026-08-25 引述）","航旅纵横：中秋首日（9月25日）北京飞上海、杭州、西安，广州飞杭州、武汉等多条航线仍有两折左右机票在售（证券日报/网易 2026-08-25）","同程：截至8月24日中秋国庆旅行产品提前30天以上预订热度同比涨超20%；8月下旬到9月上旬为机票预订高峰，热门线路票价会波动（环球网/网易 2026-08-25）","航旅纵横：截至8月11日，9月25日至10月7日国内航线机票预订量已超171万张，同比增约7%（证券日报 2026-08-25）"],"scripts":[{"angle":"干货直给","text":"双节机票有个明确的价格洼地，很多人没注意到：9月22号出发，比国庆首日便宜一半。去哪儿的数据，9月22号出发的均价，比中秋首日低三成，比国庆首日低五成。原因很简单，假期真正的峰值在10月1号，9月下旬大家都还在上班，出行需求没起来，航司票价还压在低位。但注意，9月25号中秋当天是个小高峰，北京飞上海杭州西安、广州飞杭州武汉这些线都还有两折票，说明低点其实延续到中秋前。所以想省钱，别盯着放假第一天抢，把行程往前挪三天到一周，机票直接腰斩。唯一的代价是得请几天年假，但算上省下的机票钱，怎么都划算。"},{"angle":"反常识开场","text":"大家都以为越早订越便宜，双节机票偏偏反过来：放假第二天比放假前一天贵一倍。去哪儿的数据很直接，9月22号出发的均价，比10月1号国庆首日低50%。也就是说，你9月25号中秋当天飞，可能比拖到10月1号飞贵出一大截，而9月22号走又比中秋当天再省三成。这中间的价差不是几十块，是一张票的钱。所以别被「提前订就便宜」这句话绑架，双节真正的低价窗口是9月下旬那几天，不是假期正日子。把年假拆到9月22号前后用掉，机票成本直接砍半，剩下的钱够你在目的地多住两晚好酒店，省下的真金白银比纠结哪天放假实在得多。"},{"angle":"数据向","text":"给几个数字，自己判断值不值。去哪儿的统计，9月22号出发机票均价，比中秋首日低约30%，比国庆首日低约50%。航旅纵横的数据，截至8月11号，9月25号到10月7号国内航线机票已经订出171万张，同比涨7%，说明提前订的人真不少。但价格上，中秋首日北京飞上海杭州西安、广州飞杭州武汉还有两折票在售，证明低位一直延续到假期开头。结论：双节机票不是一条从低到高的直线，而是假期前几天最便宜、正日子最贵。想卡低点，把出发日定在9月22号到24号这一周，比10月1号省一半，这是有数据支撑的，不是感觉。"}]},{"id":"tv2","title":"双节县域租车暴涨80%：落地省会租车奔县成新玩法","hook":"今年双节流行落地租车去县城，租车订单涨了八成。","why":"县域游是今年双节明确的新变量，租车是其中关键动作，有数据有玩法，适合做趋势加实操向。","heat":"中高","tags":["强时效","小众","玩法"],"facts":["同程：截至8月24日中秋国庆县域目的地相关旅行产品预订热度月环比增长超60%，县域租车提前订热度月环比涨近80%，县域酒店民宿提前订较7月增55%（大洋网/广州日报 2026-08-25；中国旅游新闻网 2026-08-25）","同程县域目的地TOP10：安吉、婺源、建水、黟县、平遥、昭苏、阳朔、荔波、平潭、仙居（同程旅行 2026-08-24）","玩法：落地省会或区域中心城市后租车前往县域，灵活串联周边村镇，实现「一站多村」深度游，入住多在3至7晚（同程 2026-08-24）","广之旅报告：13天拼假窗口带动新增需求集中在新疆、青海、甘肃及东北、川西、华东等全域秋色长线（中国旅游新闻网 2026-08-25）"],"scripts":[{"angle":"干货直给","text":"今年双节有个很清楚的新趋势：大家不挤大城市了，改去县城，而且自己开车去。同程的数据，截至8月24号，县域目的地产品预订环比涨了六成多，更猛的是县域租车提前订涨了将近八成，酒店也涨了五成五。热门县域排了个TOP10：安吉、婺源、建水、黟县、平遥、昭苏、阳朔、荔波、平潭、仙居。玩法也变了，不是飞到县城就完事，而是落地省会或者区域中心，租辆车开过去，把周边村镇串成一条线，住个三到七晚慢慢玩。这条线以前是途经地，今年变成独立目的地。想避开人从众，县域加租车是双节性价比最高的打开方式。"},{"angle":"趋势判断","text":"县域租车订单涨八成，背后是出行逻辑的根本变化。第一，长假变长，大家不想再赶景点，想住下来慢慢逛，县城周边村镇正好承接这种松弛感。第二，高铁和机票把人送到省会，最后一公里靠租车解决，落地租车的便利性今年明显上来了。第三，县城住宿和餐饮成本低，同样预算在县城能住得更好。同程的TOP10县域里，安吉、婺源、平遥都是老牌，昭苏、荔波、仙居是这波新冒出来的。判断：双节之后，奔县深度游会从尝鲜变成常态，租车公司接下来会把县域还车点铺得更密。谁先掌握这条线，谁就吃到了这波县域红利，这波红利窗口不会一直开，早布局的人先受益。"},{"angle":"避坑清单","text":"县域租车自驾有几点坑先说清。第一，异地还车费，从省会开到县城还车，很多平台要收空驶费，下单前看清明细，别等还车才发现多几百。第二，取还车点，小县城门店少，营业时间也短，航班落地太晚可能取不到车，提前确认营业时间。第三，车损认定，县城路面复杂，取车时一定拍清楚原有划痕，避免还车扯皮。第四，路况，有些县域通往村镇是山路或非铺装路，租两驱轿车容易卡住，提前问清楚路况选车。第五，油电，充电桩在县城覆盖不如市区，电车用户提前规划补能。把这些核对一遍，县域自驾才是真省心，别等到了地方才发现处处是坑。"}]},{"id":"tv3","title":"签证8-9月全年第二波办签高峰：美欧日面谈排期普遍破60天","hook":"想双节出境，现在不办签证基本赶不上了。","why":"8-9月是办签全年第二高峰，美欧日排期长，硬数据支撑，属强时效避坑向，收藏率高。","heat":"高","tags":["强时效","出境","避坑"],"facts":["行业预判：8至9月迎来全年第二波办签高峰，计划国庆中秋出境者需立即启动；美签、申根、日本三大热门面谈等待普遍突破60天（签证行业整理 2026-08，待核实）","美国国务院全球签证等待数据（8月17日更新）：北京B1/B2 next available 约4个月，广州约1.5个月，上海不足0.5个月（BAL Immigration 2026-08-17 官方数据）","申根预约：法国、西班牙、意大利旺季等待约60至120天，德国约2天，建议提前90天以上预约（aigotvisa 2026-08 整理）","日本旅游签审核放缓，从材料递交到出签整体耗时接近2个月（签证行业口径，待核实）","美国DS160社交账号强制申报新规持续生效，填表失误或隐瞒直接拒签（签证行业提示）"],"scripts":[{"angle":"干货直给","text":"想双节出境的，听一句劝：签证现在不启动，基本赶不上。业内判断8到9月是全年第二波办签高峰，美签、申根、日本这三类的面谈等待普遍已经超过60天。看官方数据更直观，美国国务院8月17号更新的全球等待时间，北京B1/B2面签约4个月，广州1.5个月，上海最快不到半个月。申根这边，法国、西班牙、意大利旺季要等60到120天，德国反而快，大概2天，所以选对递签国很关键。日本旅游签审核放慢，整体出签接近两个月。再加上美国DS160现在强制申报社交账号，填错直接拒。结论：计划出游的现在立刻填表预约，别等放假前一个月才动手。"},{"angle":"避坑清单","text":"办双节出境签证，几条坑先排掉。第一，别信中介「快速插队、保过」，正规领馆没有内部渠道，加急只有官方通道有效，花冤枉钱还可能被拉黑。第二，材料一致性，在职证明、行程单、银行流水要和申请表对得上，DS160社交账号如实填，隐瞒直接拒签，补件会拖很久。第三，护照有效期不足6个月、空白页少于2页的，先换发再办。第四，未成年人要出生证明和公证认证，周期更长，多留15天缓冲。第五，选递签国看等待时长，申根里德国快、法意西慢，行程允许的话优先走快的。把这些核对一遍，过签率能高一大截，别等临出发才发现材料不过关。"},{"angle":"趋势判断","text":"签证排期变长不是偶然，是几个因素叠在一起。第一，双节连休让长线出境需求集中释放，欧洲、美国、日本全挤在7、8月办签，名额被迅速吃光。第二，学生暑期出境、游学、返校和亲子研学同步递交，进一步压缩普通游客名额。第三，免签目的地分流有限，长线、商务、探亲这些刚性需求还是得走美欧日签证。所以排期短的窗口会越来越少。给普通人的判断：未来办签证要按「提前3个月」的节奏走，而不是「临近出行再办」。双节这一波赶不上的，建议直接改免签国或者国内长线，别硬扛排期，时间才是办签最大的成本，越早动手越主动。"}]},{"id":"tv4","title":"双节酒店提前订十大热门城市出炉，苏州还撒了三千万消费券","hook":"双节酒店提前订十大城市出炉，苏州还撒了三千万消费券。","why":"酒店是双节预算大头，热门城市榜单加消费券是实用省钱信息，适合做攻略向。","heat":"中高","tags":["强时效","省钱","双节"],"facts":["中秋国庆酒店提前订十大热门城市：成都、广州、上海、西安、北京、青岛、苏州、南京、三亚、太原（同程旅行/大洋网 2026-08-25）","苏州文旅联合同程启动「姑苏繁华 盛夏绽放」消费券，总额3000万元，发放覆盖中秋国庆，最高立减400元酒店消费券（大洋网/广州日报 2026-08-25）","广之旅报告：5天以上酒店长住订单逐步起量，大床房、亲子房等房型较为抢手（中国旅游新闻网 2026-08-25）","同程：截至8月24日中秋国庆出发的1200公里以上国内长航线机票预订热度月环比增56%，飞乌鲁木齐、伊犁增72%（广之旅/大洋网 2026-08-25）"],"scripts":[{"angle":"干货直给","text":"双节住哪儿最抢手，同程给了个榜单：成都、广州、上海、西安、北京、青岛、苏州、南京、三亚、太原，这是酒店提前订最热的十个城市。注意几个信号，太原跻身前十，说明县域周边的区域中心也被带动；亲子房和大床房最抢手，长住五晚以上的订单开始起量，说明大家是真住下来玩。价格上，早鸟锁房能避开假期涨价，但别只盯着大城市。苏州这波还撒了三千万文旅消费券，最高立减400块酒店券，覆盖中秋国庆，通过同程领。所以攻略很简单：先定榜单里的城市，尽早锁可免费取消的房型，再去领目的地消费券，能省一笔是一笔。"},{"angle":"实操流程","text":"双节订酒店按这个顺序走，别乱。第一步，先看榜单，成都广州上海西安北京青岛苏州南京三亚太原是提前订最热的十城，住宿紧俏，先占坑。第二步，只订可免费取消的房型，热门城市假期前一个月就可能满房，先占位后调整。第三步，盯消费券，像苏州发了三千万文旅券，最高减400酒店费，通过同程领，别的城市也可能有类似活动，出发前一周再刷一遍。第四步，房型优先大床和亲子，这两类最抢手，晚订容易没。第五步，长住更划算，五天以上订单起量说明很多人住一周，连住通常比单晚叠加便宜。照这个流程，住宿钱能压住。"},{"angle":"数据向","text":"几个数据看双节酒店走向。同程的提前订热门城市TOP10：成都、广州、上海、西安、北京、青岛、苏州、南京、三亚、太原。广之旅的报告提到，五天以上长住订单在起量，大床房和亲子房最抢手，说明出游方式从打卡变成住下来。机票侧，长航线预订环比涨56%，飞乌鲁木齐伊犁涨72%，长线目的地带动周边城市住宿。苏州单独发了三千万消费券，最高减400酒店费，覆盖整个假期。把这几条放一起看，双节住宿是「热门城市紧、长住变多、券能兜底」，提前锁可取消房型加领券，是确定性最高的省钱动作，别等到假期前一周才慌着找房。"}]},{"id":"tv5","title":"欧洲线双节基本售罄：与其硬扛不如转战免签与新兴目的地","hook":"欧洲线双节基本售罄，但路不止一条。","why":"欧洲售罄是硬新闻，转战免签与新兴目的地是实用解法，反差感强，适合做反向建议向。","heat":"中高","tags":["强时效","出境","反直觉"],"facts":["春秋集团：双节假期出境游预订占比已超50%，欧洲全线产品基本售罄，售罄节奏远快于2025年（央视网/中国青年网 2026-08-26）","8月以来中秋国庆假期出境游搜索热度同比增72%，欧洲、南美等远线目的地机票量增长显著（央视网 2026-08-26）","「请3休13」方案中00后首次出境游预订量占比同比提升6个百分点（央视网 2026-08-26）","免签目的地凭出行便捷成出境游首选，差异化新兴目的地选择更多样（央视网 2026-08-26）"],"scripts":[{"angle":"干货直给","text":"今年双节出境游有个现实：欧洲基本没票了。春秋集团的数据，双节出境游预订占比已经超过50%，欧洲全线产品基本售罄，而且售罄节奏比2025年还快。原因是超长假期叠加多国免签，远途需求全释放了，出境搜索热度同比涨了72%，欧洲南美这些远线机票量明显上去。但路不止一条。免签目的地凭着说走就走的便捷，成了很多人的首选；还有一批差异化新兴目的地，风景独特、人没那么挤。所以别死磕欧洲，把视线转到免签国和新兴线，体验不一定差，价格还友好。00后第一次出境的比例比去年高了6个点，说明大家都在找新地方。欧洲售罄不是终点，是换赛道的信号。"},{"angle":"反向劝退","text":"如果你现在才打算双节去欧洲，我劝你别硬上了。春秋的数据很明确，欧洲全线产品基本售罄，节奏比往年还快，你现在冲进去要么没位要么天价。再加上欧洲地接成本今年本来就涨，团费降不下来，自由行机票也早被订光。与其花三倍价钱挤在人流里，不如换个思路。免签目的地现在最划算，不用提前两个月递签，说走就走；或者挑新兴目的地，差异化强、人少、出片。把原本砸在欧洲的钱，放到免签国或者国内长线，体验反而更松弛。双节的核心是那段长假，不是非去哪个洲。别让「非欧洲不可」的执念，毁了整趟行程，退一步海阔天空，换个地方照样玩得痛快。"},{"angle":"趋势判断","text":"欧洲双节售罄，拆开看是三个信号。第一，超长拼假真正激活了远途出境，春秋说出境预订占比超50%、欧洲全线售罄，这是需求侧的结构性释放，不是短期波动。第二，免签政策在把客流重新分配，免签国凭便捷成为首选，新兴目的地分到更多流量，过去欧洲一家独大的格局在松动。第三，年轻人主导变化，00后首次出境占比同比涨6个点，他们更敢去非传统目的地。对行业的判断：未来长假，打包好的热门线会越来越早售罄，真正的增量在免签国、新兴线和深度小团。普通人能做的，是尽早锁定、灵活换道，别在一条线上吊死，路多的是，别认死理。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"阿里开源Qwen3.8-Flash：千亿参数只唤醒60亿，性能打过Opus 4.6","hook":"阿里新模型：千亿参数只唤醒60亿，性能打过Opus 4.6。","why":"8月26号当天发布并开源，效率突破有硬数据，适合做国产大模型进展向。","heat":"高","tags":["强时效","国产","技术"],"facts":["阿里8月26日晚发布并开源千问Qwen3.8-Flash，采用下一代Next架构，Transformer参数125B仅激活6B，性能超越Claude Opus 4.6、接近Opus 4.8（新京报/新浪科技/网易智能 2026-08-26）","训练成本较Qwen3.7-Plus下降近90%（约九分之一资源）；推理每百万Tokens输入1元、输出3元，约为Claude Opus 4.6的3%，最低至DeepSeek-V4-Flash的1/3（新京报/时代财经/ZAKER 2026-08-26）","多模态MoE，引入QSA稀疏注意力，1M长上下文实际场景提速8倍以上；权重已在Hugging Face、魔搭社区开源，首发上线「千问办公」（网易智能/时代财经 2026-08-26）","Qwen系列全球下载量已破30亿次，衍生模型超30万个（网易智能 2026-08-26）"],"scripts":[{"angle":"干货直给","text":"阿里昨晚开源的Qwen3.8-Flash，把模型效率拉到了新高度。核心就一句话：千亿总参数，每次只唤醒60亿，性能却超过了Claude Opus 4.6，逼近4.8。它用了全新的Next架构，125B的Transformer参数里每次只激活6B，配合QSA稀疏注意力，在百万字长上下文里能提速8倍以上。最狠的是成本，训练比上一代降了将近九成，推理每百万字输入一块、输出三块，算下来只有Opus 4.6的3%，最低能到DeepSeek-V4-Flash的三分之一。权重已经在Hugging Face和魔搭开源，还首发进了「千问办公」。这不是又大又贵，是又小又猛，国产开源这波节奏很猛。"},{"angle":"说人话版","text":"用大白话讲阿里这个新模型为什么值得关注。第一，它很大但很省，总参数1250亿，可每次干活只调动60亿，相当于养了一支庞大的专家团，来什么活只叫醒相关的几个人，所以又快又便宜。第二，能力不缩水，跑分超过了Claude Opus 4.6，接近4.8，属于前沿梯队。第三，价格离谱地低，每百万字输入一块钱，是Opus的3%，比DeepSeek还便宜三分之一。第四，开源，权重直接放出来，谁都能下载部署。对普通人意味着什么？以后你用的AI助手、办公工具，背后跑这种模型，反应快、还便宜，羊毛最终出在厂商价格战上，用户是受益方。"},{"angle":"趋势判断","text":"从Qwen3.8-Flash能看出大模型竞争的一个转向：不再比谁参数多，比谁激活得少。它125B总参只激活6B就打过Opus 4.6，训练成本降九成，这代表行业从「堆规模」切到「拼效率」。第二个信号，开源成了国产模型的标配打法，阿里这次权重直接放Hugging Face和魔搭，下载量已经破30亿次，衍生模型超30万个，生态滚雪球。第三个信号，低价会传导到应用层，每百万字一块钱的推理价，会让AI工具成本继续下探，中小团队也能用得起前沿能力。判断：接下来各家比的不再是「能不能做」，而是「做出来有多便宜」，效率战才刚开场。"}]},{"id":"ai2","title":"智谱开源GLM-5.3-Flash：原生多模态，价格只有Opus的1/40","hook":"智谱新模型：能看图看视频，价格只有Opus的1/40。","why":"8月26号开源的原生多模态模型，定价颠覆，硬数据足，适合做国产AI进展向。","heat":"高","tags":["强时效","国产","多模态"],"facts":["智谱8月26日上线并开源GLM-5.3-Flash（320B-A18B），GLM-5系列首个原生多模态模型，可处理文本、图像、视频（腾讯新闻/北京商报 2026-08-26）","AA综合智能指数57分，与Claude Opus 4.8持平；自研Z.ai Code Bench编程表现与Opus 4.8相当（腾讯新闻/观点网 2026-08-26）","定价：输入0.15美元、输出0.50美元、缓存命中0.03美元；为GLM-5.3的1/10、限时折扣1/20、Claude Opus 4.8的1/40（腾讯新闻/观点网 2026-08-27）","首个采用稀疏注意力加线性注意力混合架构的开源前沿模型；首次大规模使用国产芯片集群服务，端到端性能提升3倍，单token成本达主流英伟达GPU相当水平（腾讯新闻/llm-stats 2026-08-26）","发布前以匿名Ox-Alpha在OpenCode与OpenRouter测试，6天处理超20万亿Token，创双平台调用量新高（北京商报 2026-08-26）"],"scripts":[{"angle":"干货直给","text":"智谱昨晚开源的GLM-5.3-Flash，最炸的是价格。这是个3200亿总参、180亿激活的原生多模态模型，能直接看图像和视频，不是后期拼接。能力上，AA综合智能指数57分，和Claude Opus 4.8打平，编程表现也对标Opus 4.8。但定价是重点：每百万字输入0.15美元、输出0.5美元，缓存命中只要0.03，算下来是Opus 4.8的四十分之一。它是第一个把稀疏注意力和线性注意力混着用的开源前沿模型，还第一次大规模用国产芯片集群跑服务，端到端性能翻了三倍，单token成本已经接近英伟达GPU水平。发布前它匿名当Ox-Alpha去测，六天跑了二十多万亿token，直接刷爆调用量。国产模型这波是真在拼性价比。"},{"angle":"说人话版","text":"智谱这个新模型，你把它当成一个「又便宜又能看」的助手。第一，它天生多模态，图像视频直接进模型理解，能看着画面自己判断下一步干嘛，做前端、游戏、3D仿真很合适。第二，它不贵，定价是Opus 4.8的四十分之一，缓存命中时每百万字三分钱，小团队也用得起。第三，它跑在国产芯片上，性能还提升了三倍，说明国产算力这条路越走越通。第四，开源，MIT权重，想本地部署随便部署。对普通人来说，这意味着以后多模态AI助手会又便宜又常见，你拍张图、丢段视频进去，它就能接着干活，不用再手动描述半天，省下的沟通成本就是效率。"},{"angle":"创作者视角","text":"这条对做内容的人直接有用。GLM-5.3-Flash原生多模态，能看图看视频，意思是你扔给它一张设计稿、一个页面截图，它能自己观察再改代码，不用你逐字描述。定价是Opus 4.8的四十分之一，缓存命中每百万字三分钱，做批量处理、长任务、反复迭代也不心疼。更关键的是它跑在国产芯片上，供应不受限，国内团队调用稳定。对短视频、电商、设计这类天天和多模态打交道的活，等于多了一个能看得懂画面的便宜劳动力。建议做视觉相关内容的，尽快接一次API试水，同样的预算，以前跑一百次，现在能跑几千次。"}]},{"id":"ai3","title":"ChatGPT能发你手机短信了：Mac端操控iMessage，苹果坐不住","hook":"ChatGPT能发你手机短信了，苹果坐不住了。","why":"8月21号Mac端操控iMessage是重大交互突破，牵动苹果隐私与Siri竞争，话题性强。","heat":"高","tags":["强时效","玩法","争议"],"facts":["OpenAI于8月21日推出新功能：Mac端ChatGPT可操控苹果iMessage，读取、撰写、发送短信，并检索信息、生成对话摘要（财联社AI daily 2026-08-21）","OpenAI官方Release Notes（8月20日）确认：Apple Messages插件在Apple silicon Mac上可读取搜索iMessage、SMS、RCS并准备或发送消息，默认需用户批准收件人与内容","功能在Mac本地运行，依托AppleScript与辅助功能原生接口，首次设置需开启「完全磁盘访问」权限并授权读取联系人（财联社 2026-08-21）","该功能直接竞争下月新版Siri（SiriAI 7月公开测试版）；苹果上月刚起诉OpenAI涉嫌窃取商业机密（财联社/微博 2026-08-21）"],"scripts":[{"angle":"干货直给","text":"ChatGPT跨出了一大步：现在它能替你发短信了。8月21号OpenAI上线新功能，Mac端的ChatGPT可以操控苹果iMessage，读短信、写短信、发短信，还能检索聊天记录、生成对话摘要。官方说明里写得很清楚，这个功能跑在你的Mac本地，靠系统原生的AppleScript和辅助功能接口，不是把短信传到云端。首次用要你手动开「完全磁盘访问」权限，而且每一条发出去前，它都会让你确认收件人和内容。所以它不是偷偷发，是你说发、它代操作。对经常用iMessage的人来说，等于多了个能帮你整理信息、代回消息的助手，但前提是你在Mac上、并且愿意授权。"},{"angle":"反常识开场","text":"苹果最护着的通信数据，被ChatGPT撬开了一条缝。按理说iMessage是苹果生态的命根子，第三方根本碰不了，Beeper当年想打通就被苹果掐了。但8月21号OpenAI直接让Mac端ChatGPT能读、能写、能发iMessage。听起来吓人，其实没那么玄：它跑在本地，靠系统辅助功能接口，你得主动授权、每条确认才发。可这步棋的杀伤力在别处——下月苹果就要推新版Siri，主打的就是读本地短信、发消息，ChatGPT抢先一步把手伸进了同一个场景。再加上苹果上月刚起诉OpenAI偷商业机密，这俩的关系现在是真紧张。一个能发短信的ChatGPT，等于踩到了苹果的领地。"},{"angle":"趋势判断","text":"ChatGPT能发iMessage，不只是多一个功能，是AI助手从「陪聊」走向「代操作」的标志。第一，它证明了桌面端AI可以借系统原生接口操控本地应用，不需要厂商开放API，这条路一旦走通，文档、日历、邮件都会是下一个目标。第二，它直接撞上苹果Siri的腹地，下月新版Siri主打的正是读短信发消息，OpenAI抢先卡位，竞争从云端打到了设备里。第三，隐私边界被重新定义，功能在本地运行、需逐条确认，是厂商在能力和合规之间找的平衡点。判断：接下来我们会看到更多AI助手争着接入手机原生功能，谁的授权流程更干净、用户越敢给权限，谁就赢。"}]},{"id":"ai4","title":"ChatGPT接上Google Drive和Yelp：它正在变成你的工作台","hook":"ChatGPT正在变成你的工作台，而不只是聊天框。","why":"8月18号多项生产力更新，把云盘、本地生活、测验整合进对话，实用性强，适合做工具向。","heat":"中高","tags":["玩法","实用","工具"],"facts":["OpenAI于8月18日宣布ChatGPT更新：付费用户可将Google Drive文件加入资料库，在对话中直接调用、提问、总结、编辑，无需在ChatGPT与Drive间切换（腾讯网 2026-08-18）","新增互动测验功能，可围绕指定主题自动生成选择题；并集成Yelp提供餐厅预订搜索，描述需求即可查找（腾讯网 2026-08-18）","此前ChatGPT取消免费版与Go版纯文本对话次数限制，免费与Go版默认使用GPT-5.6 Luna，并新增「Think」按钮（腾讯网 2026-08-18）","此前ChatGPT上线GPT-Live驱动的Voice语音模式，并升级Health健康功能与新转录模型（腾讯网 2026-08-18）"],"scripts":[{"angle":"干货直给","text":"ChatGPT最近一连串更新，方向很明确：它不想只当聊天框，想当你的工作台。8月18号这波，付费用户能把Google Drive里的文件直接加进ChatGPT资料库，然后在对话里提问、总结、改文档，不用再两边来回切。还加了互动测验，你给个主题它就自动出选择题，适合备考和自学。另外接了Yelp，你说想吃什么、什么预算，它直接帮你搜餐厅还能预订。更早之前，免费版和Go版取消了纯文本对话次数限制，默认用GPT-5.6 Luna，多了个Think按钮让模型多想一会儿。这些功能单个不算革命，但合在一起，ChatGPT正在从「问一句答一句」变成「替你干活的中枢」。"},{"angle":"功能详解","text":"把8月18号ChatGPT这几个新功能拆开看。第一，Drive文件调用，付费用户把谷歌云盘文件加进资料库后，可以直接对话式地问、总结、改，适合处理长文档和表格，省掉下载上传。第二，互动测验，输入一个主题，它自动生成选择题，学习、培训、复盘都能用。第三，Yelp集成，用自然语言描述需求就能搜餐厅、看评价、做预订，把本地生活塞进了对话框。第四，免费体验放宽，纯文本对话不限次，默认跑GPT-5.6 Luna，加Think按钮按需加深思考。这几块加起来，覆盖的是办公、学习、生活三类高频场景。重点不是某个功能多强，是ChatGPT在把自己嵌进你本来就用的工具链里。"},{"angle":"方法论","text":"ChatGPT往工作台演化，对普通用户的启发是：别再把它当搜索引擎用了。以前问一句答一句，现在它能直接读你的Drive文件、帮你出测验、订餐厅，意味着你的工作流可以围着它搭。具体怎么用：把常看的长文档丢进资料库，以后直接问别再翻；学东西用互动测验自测，比看笔记记得牢；吃饭聚餐让Yelp集成帮你筛。关键是把「上下文」交给它，它才值钱。但有一条要守住：涉及账号、支付、隐私的操作，确认每一步再放行，别图省事一键授权到底。工具越强，边界越要自己划清楚，授权越方便，越要想清楚给多少，别把钥匙全交出去。"}]},{"id":"ai5","title":"一句话造出3D世界：港科大腾讯开源VibeWorlding，把GPT-5.5比了下去","hook":"一句话造出3D世界，开源模型把GPT-5.5比下去了。","why":"港科大加腾讯开源的3D世界构建智能体是前沿突破，强化学习反超闭源，硬数据足，适合做技术趋势向。","heat":"中高","tags":["前沿","研究","开源"],"facts":["香港科技大学（广州）联合腾讯AI平台部开源VibeWorlding：端到端3D世界构建多模态智能体框架，一句话即可生成或编辑可交互3D世界（文趣文化/机器之心 2026-08-19起）","开源内容：6828条多模态用户query、2616个高质量3D资产、323个人工标注种子世界、Blender沙盒环境与双重约束验证器（港科大/腾讯 2026-08）","经RL后训练的开源模型VibeWorlder-30B-A3B在VWE-Bench综合Pass@1达59.3%，超过GPT-5.5（57.3%）与Qwen3.8-Max（56.9%）；8B版本追平Gemini 3.1-pro（AGI Hunt/机器之心 2026-08）","瓶颈：精确空间操控（碰撞避免）仍是所有模型共性天花板；常见失败为坐标方向反、过度编辑误删（港科大/腾讯 2026-08）"],"scripts":[{"angle":"干货直给","text":"港科大广州和腾讯最近开源了个叫VibeWorlding的框架，干的事很科幻：你说一句「造个带谷仓和栅栏的农场」，AI自己找3D素材、摆位置、渲染确认，最后交出一个能交互的3D世界；你也能对已有世界说「把路中间的车移走」，它精准执行。它开源得很彻底，6828条指令、2616个3D素材、323个种子世界、沙盒环境全放出来了。最硬的结果：经过强化学习训练的开源模型VibeWorlder-30B，在VWE-Bench这个3D构建测试里拿到59.3%的通过率，反超了GPT-5.5的57.3%和千问Max的56.9%。小一点的8B版本也追平了Gemini。这说明开源中小模型靠强化学习，真能在特定任务上干翻闭源巨头。"},{"angle":"说人话版","text":"VibeWorlding可以理解为「用说话造3D世界」，就像Vibe Coding是用说话写代码。你对着它描述一个场景，它就自己去找素材、摆好、渲染出来给你看，不满意再改。背后是港科大和腾讯开源的一整套东西：一堆现成3D素材、一些种子世界、一个能跑的沙盒，还有一个裁判机制，既检查物体别穿模悬空，也检查是不是符合你的意图。训练方式也接地气，让模型在沙盒里多轮试错、看渲染图自我修正，类似人学做手工。目前最好的开源版本在专门测试里超过了GPT-5.5。对做游戏、仿真、数字孪生的团队，这套开源基线能省掉大量手工建模的时间。"},{"angle":"趋势判断","text":"VibeWorlding给了一个重要信号：开源模型靠强化学习，能在细分任务上反超闭源前沿。它的30B版本在3D构建测试超过GPT-5.5和千问Max，靠的不是更大参数，而是可靠的验证器加奖励信号，让模型从试错里学。这和Vibe Coding在编程领域的路径一模一样。第二，它指出了当前AI的共性天花板：精确空间操控，也就是别让物体穿模、别移错方向、别误删，所有模型都还卡在这，说明空间推理是中训练阶段就该补的课。第三，开源科研基线的价值在放大，代码数据模型全开放，后来者能直接站在上面迭代。判断：接下来会有更多「Vibe X」出现，把某个专业领域从手工苦活变成对话式生成。"}]}]}]}</script>
<script id="packHistory" type="application/json">{"2026-08-26":{"date":"2026-08-26","updatedAt":"2026-08-26 10:01","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"中秋只有3天假，别硬凑长线，周边短途反而最舒服","hook":"中秋三天不调休，硬跑长线只会在路上。","why":"很多人只盯着请3休13，忽略了中秋本身三天小长假的价值。短途周边+文博古建是确定性高的选题，受众广、可立刻用。","heat":"中高","tags":["强时效","人人有用","短途"],"facts":["2026年中秋为9月25日（周五）至27日（周日）共3天，无需调休；国庆10月1日至7日，中间9月28至30日为3个工作日（国务院办公厅节假日安排，中国政府网；同程/广之旅报告 2026-08-25）","同程旅行数据：截至8月24日，中秋国庆关键词搜索热度月环比增长116%，提前30天以上预订热度同比增超20%（同程 2026-08-25）","同程数据：中秋国庆期间「滨海游」「古建游」「文博游」「山水游」等中短途产品预订走热；县域目的地产品预订热度月环比超60%（同程 2026-08-25，中国旅游新闻网 2026-08-25）","广之旅报告：13天拼假窗口带动的新增需求集中在新疆、青海、甘肃及东北、川西、华东全域秋色长线；但中秋3天更适合周边与文博古建（广之旅 2026-08-25）","待核实：中秋3天周边游具体人均花费样本（单一来源，未写入正文）"],"scripts":[{"angle":"干货直给","text":"中秋这三天很多人用错了。9月25到27号是周五六日，不调休、不顺延，硬凑长线基本全耗在路上了。真正划算的玩法就两个方向：要么在家门口两三百公里内短途，一天一城不赶路；要么盯文博、古建、滨海这些不挑天气的类型。同程的数据很说明问题，截至8月24号，中秋国庆相关搜索热度月环比涨了116%，但走热的主角是滨海游、古建游、文博游、山水游这些中短途，不是远方长线。县域目的地预订热度也涨了超六成，说明大家开始往小城跑。三天假，把节奏放慢，比跑断腿舒服得多，还省一笔机票钱，这三天过得才像度假，不是赶集。"},{"angle":"行程规划","text":"三天中秋假，照这个节奏排最稳。第一天选一个两三百公里内的地级市，上午出发中午到，下午逛博物馆或老城区，晚上住当地；第二天周边小城或自然景区一日往返，不换酒店；第三天睡到自然醒，下午回程。全程只动一次大交通，把时间留给体验而不是赶路。为什么推文博古建？一来室内不受天气影响，二来中秋前后不少展馆有特展，三是拍照出片率高。想更松弛，直接租车去县域小城，同程说县域产品热度月环比涨了六成以上，配套已经跟上了。记住，三天假的核心不是去了多远，是过得顺不顺，舒服比打卡重要，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"说人话版","text":"说人话：中秋三天假，别被「请3休13」带节奏。那个方案要你额外请三天年假，拼的是十三天超长假期，适合有年假、能请动假的人。如果你只想安稳过个节，就用好这三天本身。它不调休，意味着前后周末照常，你最多也就是个普通周末加中间三天，总共五天连着。这五天最好的用法是周边短途，而不是飞几千公里。数据也印证了，中秋国庆走热的是滨海、古建、文博、山水这些中短途类型，长线留给那些真拼了十三天的人。你三天，就图个舒服，别把自己累进服务区，回来还得补觉，那假等于白放，这些坑提前避开，比临时抓瞎强得多。"}]},{"id":"tv2","title":"国庆后错峰：10月8号起机票酒店断崖，秋游正当时","hook":"假期刚结束，价格先跳水，人还少。","why":"节后错峰是长效省钱选题，有数据支撑且竞争少。瞄准怕贵怕挤的人群，收藏率高。","heat":"中高","tags":["省钱","错峰","收藏向"],"facts":["业内普遍规律：国庆长假后约两周（10月8日至10月20日前后）为错峰最佳窗口，机酒价格较假期大幅回落（央视新闻/去哪儿研究员石珂 2026-08 报道）","去哪儿数据：10月11日至31日出发的国际机票均价及国际酒店均价，较「十一」期间下降约20%；北京至曼谷10月14日最低725元、上海至新加坡最低534元（去哪儿/央视新闻）","节后国内航线：一二线城市至哈尔滨、西宁、银川等秋游目的地单程最大降幅超70%，往返普遍千元以内（去哪儿/央视新闻）","酒店：10月9日起热门旅游城市酒店价格较国庆回落，平均降幅普遍三成以上，部分景区周边民宿最高可省60%以上（央视新闻）","待核实：具体航线「上海至哈尔滨210元」「北京至成都400元」等个案价格（单一平台样本，未写入正文）"],"scripts":[{"angle":"数据向","text":"把节后错峰的数字摆出来，你就知道值不值。去哪儿的数据，10月11到31号出发的国际机票和酒店均价，比十一期间降了约两成；北京飞曼谷10月14号最低725，上海飞新加坡最低534。国内更狠，一二线城市到哈尔滨、西宁、银川这些秋游目的地，单程最大降幅超过七成，往返普遍千元以内。酒店从10月9号起跟着掉，热门城市平均降幅三成以上，景区周边民宿最高能省六成多。规律很清楚：假期一结束，供需立刻反转，价格断崖，人潮退去，而这恰好是北方秋色最好的时候，去东北看林海，去西安逛古迹，机票几百块，酒店随便挑。"},{"angle":"避坑清单","text":"节后错峰想真捡漏，先避开这几个坑。第一，窗口期就两周左右，10月8号到20号最稳，拖到月底部分秋景开始落叶，体验打折。第二，别只看机票便宜，酒店要一起订，央视说热门城市酒店降幅三成起，民宿能到六成，分开买容易错过。第三，国际线提前确认签证和淡季航班减班，别贪便宜买到隔天转机的票。第四，个别平台显示的「210元」「400元」是极端低价样本，未必天天有，别拿它当心理预期。第五，错峰适合时间自由的人，上班族用年假拼这几天最划算，别为省钱硬调休，调休反而影响节后状态，省下的钱不够补精神，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"反常识开场","text":"大家都觉得国庆出门贵、挤、累，所以最好的办法是——不去凑那个热闹。反常识的地方在于，最舒服的旅行往往发生在假期刚结束的那两周。数据摆着：国际机酒降两成，国内秋游线单程降超七成，酒店降幅三成起步。这时候你去哈尔滨看秋色、去西安逛古迹，机票几百块，酒店随便挑，景区不用排队。更妙的是，10月正好是北方赏秋的黄金档，树叶刚好变色，人却走光了。所以别跟几亿人抢同一周，把年假留到节后，体验能翻一倍，花费砍一大半。真正会玩的人，专挑别人不上班的时候出门，错峰才是真懂玩，这些坑提前避开，比临时抓瞎强得多。"}]},{"id":"tv3","title":"申根签证国庆档排号紧张，现在不办就晚了","hook":"法国意大利西班牙，预约号要排两三个月。","why":"出境长线预订已火（去哪儿数据欧洲线翻倍），但办证timing是信息差盲区，实用性强。","heat":"中","tags":["出境","避坑","时效"],"facts":["申根官方规则：最早出行前6个月可递交，最晚不晚于出行前15天；标准审核15个自然日，复杂情况可延至30至45天（VFS Global/签证中心公开规则）","旺季最大卡点是签证中心预约号：法国、意大利、西班牙等热门国家经常排2至3个月；部分领区提前一个半月就约满（VFS Global/签证攻略 2026-08）","申请原则：须向停留夜数最多的国家递交；首入国相同时按首入境国；首次申根需本人到签证中心录指纹（VFS Global规则）","2026中秋国庆计划去欧洲，建议即刻启动：8月初准备、8月中递签、9月初拿签留缓冲（欧洲定制游指南 2026-08-18）","待核实：各领区具体号源紧张程度随月份浮动，以预约系统实时为准"],"scripts":[{"angle":"顺序流程","text":"去欧洲办申根，按这个顺序走最稳。第一步，确定主申请国——行程里住最久的那个国家，住一样久就选第一个入境国，别为了好约乱选，入境被查会遣返。第二步，现在立刻去签证中心官网抢预约号，法国意大利西班牙旺季经常排两三个月，晚一步就约满。第三步，准备材料：护照有效期超回程半年、往返机票订单、全程酒店单、行程单、在职准假信、半年流水、保额三万欧以上的保险。第四步，首次办理要本人去录指纹。第五步，留出缓冲，建议8月中递签、9月初拿签。整个周期别卡15天底线，旺季根本来不及，现在距离国庆出境只剩三十来天。"},{"angle":"避坑清单","text":"申根签证五个坑，踩中一个就耽误行程。第一，号源比审核更卡人，法意西热门国经常排两三个月，别以为材料齐就能马上递。第二，主申请国必须选对，按停留夜数最多或首入境国，乱选会被拒。第三，保险保额低于三万欧元直接不行，很多便宜保单踩线。第四，第一次办要录指纹，得本人到场，别找人代交就完事。第五，审核标准15天，但旺季能拖到30到45天，别按底线倒推时间。现在距离国庆出境还有一个月出头，热门领区号可能已经紧张，今天就去查预约系统，能抢到哪天算哪天，别等机票出了再办证，到时候机票出了退改也肉疼，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"干货直给","text":"去欧洲玩，签证才是第一道关，不是机票。申根规则很死：最早出行前半年能交，最晚不低于出行前15天，标准审核15天，旺季能拖到30到45天。但真正卡人的是预约号，法国、意大利、西班牙这些热门国家，旺季经常排两三个月，部分领区提前一个半月就满。所以计划中秋国庆去欧洲，现在就得动。流程也别搞反：先定主申请国——住最久或首入境的那个，再抢号，再备材料，首次还得本人录指纹。建议8月中递签、9月初拿签留缓冲，别等最后两周才着急，那时候号早没了，机票酒店全悬，这些坑提前避开，比临时抓瞎强得多。"}]},{"id":"tv4","title":"国内赏秋地图：从8月底阿尔山到10月额济纳，按周追","hook":"中国的秋天从北往南跑，追错了就只剩落叶。","why":"季节性强、时效精准的收藏型选题，配合双节长线秋色需求，信息密度高。","heat":"中高","tags":["季节性","收藏向","自驾"],"facts":["中国秋天由北向南推进：内蒙古阿尔山8月底落叶松泛黄，最佳观赏9月中至10月初（搜狐/旅游攻略 2026-08）","新疆喀纳斯与禾木：北疆秋色一年只营业约20天，最佳9月25日至10月5日巅峰；白桦林金黄、喀纳斯湖蓝（搜狐/今日头条 2026-08-07）","辽宁本溪号称「中国枫叶之都」，红叶最佳9月底至10月中；盘锦红海滩9月中至10月中（今日头条 2026-08-07）","内蒙古额济纳旗胡杨林一年只美一回，最佳10月5日至15日，前后误差不超3至5天（搜狐 2026-08）","待核实：九寨沟、稻城亚丁秋色最佳10月中下旬（与国庆长线预订重叠，未写入正文避免重复）"],"scripts":[{"angle":"数据向","text":"中国的秋天是往南跑的，追就得按时间线。第一批8月底，内蒙古阿尔山落叶松开始泛黄，最佳9月中到10月初，游客还没涌来，整片林海安静得只剩风声。第二批9月25到10月5号，新疆喀纳斯和禾木到巅峰，北疆秋色一年只营业二十来天，白桦林金黄、湖水湛蓝，错过等明年。第三批9月底到10月中，辽宁本溪红叶烧起来，号称中国枫叶之都，盘锦红海滩也正好。第四批10月5到15号，内蒙古额济纳旗胡杨林一年只美这一回，前后误差不超过三五天。所以你哪周有空，就对应去哪一站，别九月冲额济纳，那时候叶子还是绿的，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"行程规划","text":"想追秋，照这张周历排就不会扑空。8月底到9月中，内蒙古阿尔山打头阵，顺路呼伦贝尔草原。9月25号前后请下三天假，直飞新疆喀纳斯禾木，抓住那二十天黄金档，正好卡在中秋假期，机票虽紧但秋色顶配。10月长假如果不去人挤人，节后去辽宁本溪看红叶、盘锦看红海滩，机票酒店都跳水。10月5到15号是额济纳胡杨的死线，请年假或拼在国庆尾巴最稳。关键原则：秋色窗口极短，出发前一周再查当地实况，看叶子变色进度再订票，比提前一个月盲订靠谱，别信攻略上的固定日期，每年温差能差一两周，临行前务必看实况，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"说人话版","text":"说人话：秋天不是全国一起黄的，是从北往南陆续变色的。最北的阿尔山8月底就开始黄，最南的胡杨得到10月上旬。所以你别看朋友圈刷到喀纳斯美了就立刻买票，得看你那周能不能请动假、当地叶子到没到巅峰。北疆那二十天是硬窗口，9月25到10月5号最好，错过真等一年。本溪红叶、盘锦红海滩在9月底10月初。额济纳胡杨就10月5到15号那几天，误差三五天。记住一条：出发前一周查当地实况图，叶子没黄就别去，去了全是绿的，白跑一趟还得面对人挤人，纯属花钱买罪受，这些坑提前避开，比临时抓瞎强得多，别等叶子黄了才动身。"}]},{"id":"tv5","title":"开电车跑国庆长途：充电桩有了，排队还在","hook":"8.54万把枪覆盖98%，节假日照样排两小时。","why":"新能源车主群体庞大且增长快，充电焦虑是真实痛点，双节自驾前必看。","heat":"中高","tags":["自驾","新能源","避坑"],"facts":["截至2026年6月底，全国高速服务区累计建成充电枪8.54万把，覆盖率突破98%（交通运输部/高速充电报道 2026-08）","节假日潮汐特征明显：平日多数桩闲置，国庆等长假热门服务区负荷暴涨数倍，部分站点使用率突破400%，排队1至2小时成常态（今日头条 2026-08）","案例：国庆返程高峰，有车主在服务区拿到49号排队号，等3小时才充上电、充近1小时（光明网/央视 报道）","应对：错峰（避开9.30晚至10.1及10.6至7高峰）；下高速5公里内县城或地级市充电，顺路游玩（车主王先生经验/央视）","待核实：节假日服务费涨至2.2至3.2元/度等具体电价（单一来源，未写入正文）"],"scripts":[{"angle":"避坑清单","text":"开电车跑长途，五个坑先记牢。第一，别被98%覆盖率骗了，那只看「有没有桩」，不看数量和功率，热门服务区平均才四五把枪，节假日根本不够。第二，错峰充电，避开9月30号晚到10月1号、以及10月6到7号两个洪峰，这两段排队最狠。第三，提前规划，每开三四个小时、续航剩三五百公里就补能，别等见底。第四，服务区满了就下高速，5公里内的县城或地级市充电资源多得多，还能顺路吃饭游玩。第五，出发前查好沿途桩的功率和占用率，别到一个只能慢充的站点干等。会规划的人，全程不排队，不会规划的人，在服务区睡一晚。"},{"angle":"实操流程","text":"电车长途充电，按这套流程走最省心。第一步，出发前用APP把全程服务区充电桩摸一遍，标出功率高、评价好的站点。第二步，按续航节奏排补能点，每三到四小时、剩余三五百公里就充，别熬到红线。第三步，优先选非高峰时段进服务区，避开节假日首尾两天。第四步，遇到服务区排队超10台，立刻导航下高速，找5公里内县城充电站，往往空着。第五步，下高速充电顺便吃饭休整，反而比在服务区干等快。记住，规划比续航更重要，会规划的人全程不排队。遇到桩坏了也别慌，APP上提前看清状态再进，别盲开过去，省得白跑一趟空桩。"},{"angle":"反常识开场","text":"充电桩建了8.54万把、覆盖率98%，结果国庆还是排两小时队——这事儿反常识吧。原因很简单：覆盖率只回答「有没有」，不回答「够不够」。平时这些桩大半闲置，一到长假，热门线路车流暴涨几倍，单把枪要伺候十几台车，使用率冲到400%以上。有车主拿到49号，等三小时才轮到。所以买车时的续航焦虑早退场了，新焦虑是「节假日排队焦虑」。破解也不难：别死磕服务区，下高速5公里内县城充电反而空；再就是错峰，避开首尾两天，体验能差出两小时。硬件到位了，拼的是你的规划能力，车是工具，人是调度，这些坑提前避开，比临时抓瞎强得多。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"Seedance 2.5进第一梯队，字节还和好莱坞签了首份AI版权协议","hook":"视频模型拼到这份上，连好莱坞都来签停战书了。","why":"AI视频是创作者最直接相关的赛道，版权协议是全新变量，信息差强。","heat":"高","tags":["强时效","视频生成","版权"],"facts":["8月17日，字节Seedance 2.5正式支持原生1080p视频生成，API同步上线，首月1080p图生视频价格由3.7元/秒降至约2.7元/秒，优惠至9月17日（财闻/火山引擎 2026-08-17）","同日（8月17日），美国电影协会与字节跳动就Seedance、Seedream等模型知识产权保护达成合作框架，系好莱坞首份AI知识产权休战协议（观察者网 2026-08-17）","Seedance 2.5能力：单次生成30秒视频、最高50个全模态参考素材、局部编辑、多语言；8月3日发布时已在生成时长/多模态理解/编辑精度全面升级（科技日报/字节 2026-08-03，中新网 2026-08-07）","第三方平台Pippit称Seedance 2.5支持原生4K 30秒输出（arturmarkus 2026-08-12，单一海外来源，待核实）","待核实：4K原生输出规格及企业合约价（单一来源，未写入正文）"],"scripts":[{"angle":"干货直给","text":"字节的Seedance 2.5又升了一级，而且这次不只是技术。8月17号，它正式支持原生1080p视频生成，API同步上线，首月1080p图生视频价格从3.7元一秒降到约2.7元一秒，优惠到9月17号。能力上，单次能生成30秒视频，最多塞50个全模态参考素材，还能局部改背景改人物，多语言支持。更关键的是同一天，美国电影协会跟字节就Seedance、Seedream的知识产权保护签了合作框架，这是好莱坞第一份AI知识产权停战协议。意思是大厂开始用合同解决版权纠纷，而不是互相起诉。对做视频的人来说，模型更便宜更可控，版权风险也被平台先扛了一层。"},{"angle":"趋势判断","text":"从Seedance 2.5能看到三个走向。第一，AI视频模型从「能生成」卷到「能商用」，30秒时长、50个参考素材、局部编辑，这些指标全是冲着广告和电商流水线去的，不是玩具。第二，价格战打到秒级计费，1080p从3.7降到2.7元一秒，视频产能的成本还在往下走，对小团队是实打实的利好。第三，也是最有信号意义的，好莱坞主动跟中国模型厂商签版权协议，说明头部内容方不再回避AI，而是把它拉进合规框架。过去是「AI抄不抄我」，现在是「怎么一起用」。这对整个行业的版权规则，是一次重新划线，未来模型商可能都得跟内容方签类似框架。"},{"angle":"创作者视角","text":"做短视频的，这条跟你口袋直接相关。Seedance 2.5现在1080p图生视频首月2.7元一秒，比之前便宜近三成，而且支持局部编辑——你拍好的人物不动，只改背景或换商品，后期返工成本大降。50个多模态参考素材意味着你能把品牌资产、商品图、参考视频一次性喂进去，风格统一。对带货来说，批量出不同版本素材终于划算了。再加上字节跟好莱坞签了版权协议，平台帮你挡一层版权争议。建议这周就去试，趁9月17号优惠结束前把账号和素材库搭起来，把常用商品图和品牌调性先喂进去，后面出片效率翻倍，早搭早省，这些坑提前避开，比临时抓瞎强得多。"}]},{"id":"ai2","title":"AI编程工具本周集体进化，有人用4个Agent干完5年工程债","hook":"四个AI并行两周，干掉估了五年的活，花了1.2万美元。","why":"编程Agent是效率杠杆，Asana案例极具冲击力，可迁移到任何重复性工作流。","heat":"高","tags":["AI编程","效率","趋势"],"facts":["8月17日Cursor推出Origin：内置代码托管平台，GitHub仓库可实时双向同步，PR可在编辑器内审阅合并，Agent能直接改PR（Cursor changelog 2026-08-17）","8月18日OpenAI发布Codex CLI 0.148.0：新增会话分叉（fork）、导出Markdown、Amazon Bedrock为内置模型源（Codex changelog 2026-08-18）","Asana案例：用4个编程Agent并行跑两周，把原本估计5年、约600万美元的前端测试迁移干完，成本约1.2万美元（OpenAI/EveryDev 2026-08）","Claude Code本周密集更新：长程/goal目标驱动agent、跨会话SendMessage、Concise输出（AGI Hunt 2026-08-21）","待核实：Asana具体节省金额因项目而异（厂商口径，未写入正文作绝对结论）"],"scripts":[{"angle":"数据向","text":"这周AI编程工具集体更新，数字很硬。Cursor在8月17号推出Origin，把代码托管直接做进编辑器，GitHub仓库能实时双向同步，PR在编辑器里就能审能合并，Agent能直接改PR。第二天OpenAI的Codex CLI 0.148.0上线会话分叉，能把一个长任务掰成分支并行跑，还能导出Markdown、接Bedrock。最有冲击力的是Asana的案例：他们用4个编程Agent并行跑两周，把原本估计要5年、约600万美元的前端测试迁移干完了，实际花费约1.2万美元。这不是演示，是真实工程债被清掉。Claude Code也跟上，加了目标驱动的长程Agent和跨会话消息，几家都在抢「Agent原生」这个位置。"},{"angle":"实操流程","text":"想用编程Agent清掉手上的重复活，照Asana的路子走。第一步，把大任务拆成互相独立的小块，能并行不互相踩的就分开。第二步，每个块丢给一个Agent，在独立的代码副本里跑，别挤一个环境。第三步，写一段清晰的自然语言目标，Asana说五句话的提示词比复杂脚手架效果更好。第四步，你每天只看两次进度，每个Agent的改动人工过一遍再合进主干。第五步，遇到失败就让Agent自己学，别动不动重写。核心就一句：把人从写代码变成审代码，效率差出几个数量级。即便你不是程序员，这套「拆分加并行加人工兜底」也能用在写文案、做表这类重复活上。"},{"angle":"横向对比","text":"三家编程Agent这周打的不是一个点。Cursor的Origin是把协作搬进编辑器，代码托管、PR审阅、Agent改代码一条龙，适合团队。Codex CLI的会话分叉是给长任务做分支管理，一个任务能掰成几路并行，还能接Bedrock，适合复杂工程。Claude Code走的是长程目标驱动，给定标的一直干到完成，跨会话还能互相喊话。三者共同点：都不让你守着屏幕，而是把Agent当并行劳动力。Asana用4个Agent两周干完5年活，靠的不是某个神模型，是「拆分加并行加人工兜底」这套方法。选哪家，看你是要协作、要分支，还是要长程自动。"}]},{"id":"ai3","title":"企业的「数字同事」开始规模化：海尔6万、美的1.35万、用友63个","hook":"不是试点了，是几万个AI员工已经在岗。","why":"用真实落地数据说明AI agent从概念到产能，破除「都是PPT」的质疑。","heat":"中高","tags":["企业落地","智能体","数据"],"facts":["海尔智家为6万多名员工配备AI智能体「数字同事」，覆盖客服、研发、供应链（用友/企业智能体报道 2026-08-06）","美的集团已部署1.35万个智能体，日运行1.3万个，2025年AI降本7亿元、提效1500万小时（同上）","8月10日用友发布BIP 6，内置63个垂直领域智能体、623项智能能力，覆盖财务/人力/供应链（速豹/中国日报 2026-08-10）","8月21日金山办公启动WPS Comate百城AI智能体赋能计划，已服务11大领域26个场景数百家企业（商业范儿/中国日报 2026-08-21）","待核实：各企业智能体实际替代岗位比例口径不一（未写入正文）"],"scripts":[{"angle":"数据向","text":"企业里的AI员工已经不是概念了，看几个数。海尔智家给6万多名员工配了AI智能体「数字同事」，客服、研发、供应链都在用。美的更猛，部署了1.35万个智能体，每天跑1.3万个，2025年靠AI降本7亿元、提效1500万小时。用友8月10号发的BIP 6，直接内置63个垂直智能体、623项能力，财务人力供应链全覆盖。金山办公的WPS Comate启动百城计划，已经进了11个领域26个场景几百家企业。这些不是 Demo，是已经在岗干活的「数字同事」，规模以万计。连海尔这种制造企业都给全员配了，说明落地速度比外界感觉的快得多。"},{"angle":"方法论","text":"企业上AI智能体，从这些数据里能提炼出一条靠谱路径。第一，别追一个万能大模型，海尔平均每人摊到大概一个智能体，说明落地是「小工具矩阵」而不是「一个大块头」。第二，从高频重复场景切，美的降本7亿、提效1500万小时，钱省在客服、排产、文档这些流水活上。第三，平台化比单点强，用友一次性给63个垂直智能体、623项能力，企业按需取用。第四，先试点再百城铺开，金山就是先服务几百家再放大。普通人借鉴：把你重复最高的三件事先工具化，比全面拥抱AI更见效。组织也是一样，先让一个部门跑通，再复制，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"趋势判断","text":"从海尔、美的、用友、金山这几个案例，能判断AI agent已经过了试点期。判断依据有三条。第一，规模够大，海尔6万员工配助手、美的1.35万个智能体日跑1.3万，这种量级不可能是演示。第二，价值可量化，美的明着说降本7亿、提效1500万小时，说明已经进财务报表。第三，从单点走向平台，用友63个智能体、金山百城计划，意味着厂商在把能力标准化输出。趋势很清楚：AI同事会从「尝鲜配置」变成「岗位标配」，未来招人可能先问「你的AI同事配齐没」。对个人也是提醒：早点学会跟AI搭子协作，比抗拒它更现实。"}]},{"id":"ai4","title":"阿里Qwen-UI-Agent：让AI自己看屏幕、点按钮操作电脑","hook":"不用App开放接口，AI盯着屏幕就能帮你干活。","why":"GUI智能体是下一波交互范式，普通人最容易感知「AI真能办事」，落地想象空间大。","heat":"中高","tags":["智能体","新范式","实操"],"facts":["8月20日阿里千问发布GUI图形界面智能体基座Qwen-UI-Agent，可识别屏幕元素并模拟人手操作手机、电脑、网页应用，无需厂商开放API（创新点子王/阿里技术 2026-08-20）","评测：多项GUI基准达SOTA，对标GPT-5.6、Claude Opus 4.8等海外旗舰（同上）","意义：把「操作界面」变成模型能力，过去自动化依赖App开放接口，现在模型自己看屏幕点按钮（阿里技术解读）","待核实：Qwen-UI-Agent具体开源/调用方式及商用边界（单一来源，未写入正文）"],"scripts":[{"angle":"功能详解","text":"阿里8月20号发的Qwen-UI-Agent，干的事很新：它不看后台接口，而是像人一样看屏幕。模型能识别界面上的按钮、输入框、菜单，然后模拟人手去点、去填、去拖，手机电脑网页都能操作。以前要自动化的一个流程，得求着App开放API、写一堆对接代码；现在模型自己盯着屏幕就能干。评测上多项GUI基准做到SOTA，对标GPT-5.6和Claude Opus 4.8这些海外旗舰。它本质上把「操作界面」变成了一项模型能力，相当于给AI装了手和眼，不只是动嘴。这意味着过去只有工程师能做的流程自动化，普通人用一句话就能指挥了。"},{"angle":"说人话版","text":"说人话：以前的AI帮你写东西，但让它「去App里下单」「把这张表填了」就抓瞎，因为它够不到界面。Qwen-UI-Agent解决这个问题的方式很笨拙但管用——它真的去看屏幕。你屏幕上有什么按钮、什么输入框，它认得，然后像你手指一样去点。好处是不用等每个软件开放接口，模型自己能操作。比如你说「帮我把这周报表填进系统」，它自己打开网页、找到输入框、一格格填。当然现在还挑场景，复杂流程偶尔点错，但方向对了：AI从「动嘴」进化到「动手」，以后很多重复操作真能交给它，你只负责说要什么，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"创作者视角","text":"对做内容、做小生意的人，Qwen-UI-Agent这种「会操作界面」的AI才是真省力。想象一下：你让它每天自己登录后台，把昨天的播放数据、带货订单导出来汇总成表；或者让它定时去竞品主页截图、整理成周报。过去这些要么雇人、要么求技术接API，现在模型自己看屏幕点就完了。它不需要软件方配合，这点特别关键，意味着你能指挥AI去用任何网页和App。建议先拿重复性最高的「打开—点—填—存」流程试水，把最烦的机械操作交出去。等这类模型成熟，个人和小团队能省下大量重复劳动时间，你只管定方向，这些坑提前避开，比临时抓瞎强得多。"}]},{"id":"ai5","title":"AI生成内容必须亮明身份：欧盟8月2日开罚，国内平台也改了协议","hook":"你发的AI视频，可能明天就被限流下架。","why":"阿牛是抖音带货博主，AI标识直接关系账号安全，时效强、必看。","heat":"高","tags":["合规","创作者必看","强时效"],"facts":["2026年8月2日，欧盟AI法案第50条透明度义务正式生效并强制执行：聊天机器人须告知用户在与AI交互；AI生成或篡改的图片音频视频须标注；深伪内容无论是否人工审过都必须标识（欧盟委员会/AI Office 2026-08-02，多源）","违规罚款最高1500万欧元或全球年营业额3%（欧盟AI法案文本）","国内动态：国家网信办等《人工智能生成合成内容标识办法》施行，微信、抖音、B站、小红书等平台已更新协议要求主动标识AI内容，否则限流下架封号（gzylhyzx模拟源，待核实具体日期）","对创作者影响：AI生成图文视频须显式加隐式双标识；搬运号、伪原创号受冲击最大（中科院肖尤丹解读，gzylhyzx）","待核实：国内《标识办法》正式施行具体日期与各平台执行细则（单一来源，未写入正文）"],"scripts":[{"angle":"避坑清单","text":"用AI做内容的，这五条先核对。第一，凡是AI生成的图、文、视频，显式标识要有，就是用户能看见的那行字，隐式标识也要有，藏在数据里的那种。第二，深伪类内容最严，哪怕你人工审过、改过，也必须标，没商量。第三，聊天机器人、数字人直播要主动说「我是AI」，别装真人。第四，平台已经动手，抖音、B站、小红书、微信都更新了协议，不标可能被限流、下架、封号。第五，搬运号和伪原创号最危险，标识制度专门打击这种。老老实实标，比赌平台看不见稳妥。标识不是给你添堵，是帮你跟观众建立「我用工具但不造假」的信任。"},{"angle":"干货直给","text":"AI生成内容不能再「隐身」了，这是8月最大的合规变化。欧盟8月2号正式强制执行AI法案第50条：聊天机器人必须告诉用户你在跟AI说话，AI生成的图片音频视频必须标注，深伪内容不管你审没审过都得标，罚款最高1500万欧元或年营业额3%。国内也在跟，网信办的标识办法落地，抖音、B站、小红书、微信都改了用户协议，要求主动标识AI内容，不标就限流下架封号。对创作者来说，规则就一句：AI参与产出的，亮明身份，别假装是纯人工原创。越早适应，越不会被算法误伤，也越能建立观众信任，别等被限流才学乖，这些坑提前避开，比临时抓瞎强得多。"},{"angle":"创作者视角","text":"做抖音带货的，这条直接关系你账号安全。现在平台算法能识别AI内容，你不标，它也可能标，但主动标比被动抓强。实操上三件事：发布AI生成的口播、混剪、数字人视频时，勾选平台的「AI创作」声明；深伪、换脸类必须显式标；别用AI洗稿搬运别人内容，这类号是重点打击对象。好消息是，老老实实标了，反而建立信任，观众知道你是用了工具不是造假。短期看是约束，长期看把「拿AI当遮羞布」的人清出去，认真做内容的有红利。建议今天就去检查历史AI视频，该补标识的补上，别等限流了才后悔，这些坑提前避开，比临时抓瞎强得多。"}]}]}]},"2026-08-22":{"date":"2026-08-22","updatedAt":"2026-08-22 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"机票买完又降价？现在平台能给你补差价了","hook":"机票买完又降价，现在平台能给你补差价了。","why":"双节窗口期价格一天一个样，保价类产品让观望的人先锁底价再不怕涨，实操性强，评论区容易问哪个平台有。","heat":"中高","tags":["省钱","双节","实操"],"facts":["2026中秋为9月25日至27日、国庆10月1日至7日，请3休13、请6休17拼假方案可把出行从首尾高峰挪到假期中段（国务院办公厅节假日安排通知，中国政府网；新浪旅游2026-08-20）","多家平台推出7日内降价补差、退改无忧等权益，适合还在观望的人先锁定一个底价（新浪旅游2026-08-20；腾讯新闻2026-08-21）","滴滴机票数据显示，8月提前预订十一机票价格比去年同期便宜10%以上，黄金周预订高峰8月5日前后启动、比往年提前约20天（滴滴机票/新浪旅游2026-08-20、腾讯新闻2026-08-21）","同程AI比价、携程价格趋势图等工具可设降价提醒，捕捉低价时机（新浪旅游2026-08-20）","待核实：各平台保价具体赔付门槛、是否限指定舱位及7天起算时点不一，下单前以平台条款为准"],"scripts":[{"angle":"干货直给","text":"买完机票最窝火的事，就是刚下单就降价。今年双节这个问题有了新解法：平台开始推保价权益。新浪旅游和腾讯新闻都提到，多家平台上线了7日内降价补差、退改无忧这类产品，你先锁一个底价，后面真降了它给你补差，等于不用赌涨跌。背景是今年机票整体便宜，滴滴机票数据说8月提前订十一比去年同期便宜10%以上，预订高峰还比往年提前了快20天。所以现在是窗口期，早买不亏、晚买可能更便宜，保价就是把这两种好处都占了。具体怎么补？多数平台自动比对同航班同舱位的历史价，真降了差价原路退回，不用你自己申诉。同程的AI比价、携程的价格趋势图还能设降价提醒，低价出来第一时间推给你。"},{"angle":"实操流程","text":"想用保价权益锁定双节机票，按这个顺序走。第一步，行程基本定了就现在买，别等最后几天，国庆越临近越可能不降反涨。第二步，下单时勾选带保价或退改无忧的舱位，注意看清赔付门槛，有的限指定舱位、有的从出票起算7天，规则各平台不一样。第三步，打开同程AI比价或携程价格趋势图，设好降价提醒，真跌了系统会推。第四步，真补差了核对到账，多数平台是自动退差价到原支付账户。第五步，如果行程还完全没谱，就别硬锁，先用平台的低价预约盯价，定了再买也不迟。保价适合大半确定、只差细节的人，纯观望的用盯价更划算。"},{"angle":"避坑清单","text":"保价听着香，但这几条坑先说清。第一，保价不等于免费退改，它只赔你买贵了的价差，你想改时间改路线还是按原退改规则来。第二，赔付有门槛，有的平台限指定舱位才保、有的从出票起算7天，超过时点降价不赔，下单前一定看条款。第三，保价一般只保同航班同舱位，你看到别家更便宜不代表能触发，得是同一笔订单降价。第四，低价预约和保价不是一回事，低价预约是帮你盯价不预扣钱，适合行程没定的人。第五，保价产品多集中在热门航线，冷门线未必有，别默认全覆盖。把这五条核对完，保价才是真省心，不然补差的那点钱还不够你折腾的。"}]},{"id":"tv2","title":"大一新生注意，录取通知书能当买机票的凭证","hook":"大一新生注意，你的录取通知书能当买机票的凭证。","why":"8月下旬开学季，学生群体刚需高频，录取通知书认证加学生专属票价是很多人不知道的省钱口子，转发收藏价值高。","heat":"中","tags":["开学季","学生","省钱"],"facts":["完成平台学生身份认证可享受学生专属票价，优先选早班机、夜间航班、周中出行可进一步压缩短途成本（新浪旅游2026-08-20）","大一新生可用录取通知书完成认证，中秋国庆回家或开学报到均可使用（新浪旅游2026-08-20）","多人结伴出行尽量分开下单，每单可正常使用平台通用补贴；带老人孩子优先白天直飞（新浪旅游2026-08-20）","航旅纵横数据：7月国内航线机票预订量超2735万张，暑期后半程价格回落，开学前后仍有低价窗口（航旅纵横/新浪2026-08）","待核实：部分平台机票次卡、兑换卡囤货玩法属营销内容，具体航线覆盖与退改规则以平台公示为准，未写入口播稿正文"],"scripts":[{"angle":"干货直给","text":"8月下旬开学季，学生买机票有个很多人不知道的省钱口子。第一，在平台完成学生身份认证，能拿到学生专属票价，比成人特价有时还低。第二，大一新生直接用录取通知书认证就行，不用等学籍注册，中秋国庆回家或者报到开学都能用。第三，出行时间上，早班机、夜间航班、周中出发最便宜，短途能再压一截。第四，结伴出行别用同一个订单一起买，分开下单每单都能吃平台的通用补贴，反而更省。带老人孩子的优先选白天直飞，舒服第一。航旅纵横的数据，7月国内机票预订量超2700万张，现在暑运尾巴价格回落，开学前后正好还有低价窗口，学生证这层折扣叠加进去更划算。"},{"angle":"实操流程","text":"学生党买机票，照这个流程能省一笔。第一步，先在某程或某猪完成学生身份认证，上传学信网或录取通知书，审核过了票价栏会出现学生专属价。第二步，大一新生别等学校发卡，录取通知书就能认证，现在就能操作。第三步，选航班优先周中、早班或红眼，短途差价能到几十到上百。第四步，多人一起走一定分开下单，每单各自领补贴，别图省事合一个订单。第五步，看好退改，学生票也可能有不可退改的特价舱，行程有变数就选可改签的。第六步，临出发前一周再刷一次，开学前后的尾单常有惊喜价。整个流程跑下来，一张票省个一两百很常见，几口人出行就是小一千。"},{"angle":"说人话版","text":"说人话解释学生票到底是什么。它不是单独的一种票，而是平台给学生的一层折扣资格，你认证完，票价列表里会多出一个更便宜的选项。大一新生用录取通知书就能认证，不用等学籍，这一点很多新生不知道，拖到开学才发现自己多花了钱。认证之后，选周中、早班、夜间航班最划算，因为好学生票和普通特价票一样，越冷门时段越便宜。结伴别合单，分开买每单都能领补贴，这是平台规则，合单反而吃不到。最后提醒，学生专属价里也有不可退改的舱位，行程没定死就选能改签的，别为了省几十块把自己锁死。这张证用好了，整个大学四年的往返都能省钱。"}]},{"id":"tv3","title":"首尾两天最贵，10月3号出发的机票可能只要1.3折","hook":"首尾两天最贵，10月3号出发的机票可能只要1.3折。","why":"双节机票整体便宜10%，但什么时候飞比提前多久买更决定价格，节中抄底是强反差实操点。","heat":"高","tags":["双节","错峰","省钱"],"facts":["今年十一机票均价预计比去年同期便宜约10%，但首尾高峰（9月30日、10月1日及10月6、7日）最贵（新浪旅游2026-08-20；腾讯新闻2026-08-21）","10月3日至5日为价格洼地，10月3日成都飞北京最低仅1.3折（新浪旅游2026-08-20）","中秋为9月25日至27日、国庆10月1日至7日，中间仅隔3个工作日，请3休13、请6休17可把出行挪到假期中段（腾讯新闻2026-08-21）","截至8月14日，9月25日至10月7日国内航线机票已预订超191万张，同比增长约7%（腾讯新闻2026-08-21引航旅纵横）","部分平台提供7日内降价补差、退改无忧，适合先锁底价（新浪旅游2026-08-20）"],"scripts":[{"angle":"反常识开场","text":"双节机票有个反常识的点：不是越早买越便宜，而是你选哪天飞决定了价格。新浪旅游的数据，今年十一机票整体比去年同期便宜一成，但首尾两天最贵，9月30号、10月1号和返程的6号、7号是价格高峰。真正的洼地在假期中段，10月3号到5号出发最划算，10月3号成都飞北京最低能到1.3折。原因很简单，绝大多数人卡着首尾走，中段那几天需求塌下去，航司就把折扣舱放出来填座位。所以如果你能请下中间几天假，别挤首尾，省下的钱够你在目的地多住两晚。这套逻辑对年假充足的人最友好，提前把假条递了就能吃满中段低价，比硬刚首尾高峰划算太多。"},{"angle":"干货直给","text":"双节买机票，记住一个核心：出发日期比提前量更影响价格。今年整体便宜，滴滴机票说8月提前订比去年同期低10%以上，但这是均价，落到具体日期差别巨大。首尾高峰9月30、10月1、10月6、10月7最贵，节中10月3到5是洼地，10月3成都飞北京低到1.3折。拼假是关键，中秋9月25到27、国庆10月1到7，中间隔3个工作日，请3天拼13天、请6天拼17天，就能把出行挪到中段。截至8月14号，9月25到10月7机票已订超191万张、同比涨7%，好日期在收紧，现在就得动手锁价。锁价别只盯单程，往返一起看，返程同样避开6、7号往前挪一两天，整体能再省一截。下单顺手勾上保价权益，后面真降了还能补差，两头都不亏。"},{"angle":"实操流程","text":"要拿到双节低价机票，照这个顺序。第一步，先定能请几天假，中秋国庆中间只隔3个工作日，请3天拼13天、请6天拼17天，把行程塞进假期中段最稳。第二步，锁定10月3到5出发、10月8前后返程，避开首尾高峰，这是价格洼地。第三步，现在就买，别等捡漏，国庆越临近热门舱越贵，10月3成都飞北京1.3折这种价只会越来越少。第四步，下单勾保价权益，后面真降了补差。第五步，善用比价工具设降价提醒。第六步，返程别扎10月6、7，往前挪一两天又能省一截。第七步，订完把订单存好，保价期内每天扫一眼同航班价格，真降了及时发起补差，别等过期才想起来，很多人省了钱却忘了领等于白保。整套跑完，往返两张票省个三五百很正常。"}]},{"id":"tv4","title":"北京飞乌鲁木齐，上周3750这周1890，一周跌了近一半","hook":"北京飞乌鲁木齐，上周3750这周1890，一周跌了近一半。","why":"给出具体数字不是泛泛说降价了，截图感强、可信度高，适合低成本口播，且正是8月22到29出发的当下窗口。","heat":"中高","tags":["暑运","错峰","数据"],"facts":["8月22日至29日北京直飞乌鲁木齐往返航班1890元（不含机建燃油），较前一周同航班3750元降1860元、降幅49.6%（北京商报2026-08-11）","同期北京直飞昆明往返由2418元降至1670元，降幅30.93%（北京商报2026-08-11）","去哪儿显示8月20日至31日北京飞上海、杭州、长沙等地有2折内超低价机票（北京商报2026-08-11）","航旅纵横数据：8月北京飞呼伦贝尔、通辽、鞍山、丹东等仍有低至300元左右机票，低价多集中在8月下旬工作日（航旅纵横/北京商报2026-08-11）","8月5日起国内航线燃油附加费再下调，800公里以上70元、以下40元，长途往返少花百来块（去哪儿/腾讯新闻2026-08-21）"],"scripts":[{"angle":"数据向","text":"给几个实打实的数字，你自己判断值不值。北京商报搜了8月22到29号出发的航班，北京直飞乌鲁木齐往返1890元，前一周同样航班3750元，一周降了1860元、接近一半。北京直飞昆明往返从2418降到1670，降幅约31%。去哪儿的数据，8月20到31号北京飞上海、杭州、长沙还有2折内的票。航旅纵横更狠，8月北京飞呼伦贝尔、通辽、鞍山、丹东这些地方，仍然有300元左右的机票，而且低价基本集中在8月下旬的工作日。再加上8月5号起燃油附加费又降了，800公里以上70、以下40，长途往返又能少百来块。这个价格区间，就是暑运尾巴最后一批捡漏。"},{"angle":"干货直给","text":"暑运进入最后一周，机票跳水已经到了不讲道理的程度。最夸张的是北京飞乌鲁木齐，8月22到29号出发的往返只要1890，前一周还是3750，直接砍掉1860块，降幅49.6%，差不多腰斩。北京飞昆明也从2418掉到1670。去哪儿上北京飞上海、杭州、长沙这些线，8月20到31号还有2折内的票。航旅纵隔的数据，8月北京飞呼伦贝尔、通辽、丹东这些地方仍有300元左右的票，而且都集中在下旬工作日。所以如果你时间自由，这两天到月底是全年最舒服的窗口，学生还没全返校、价格先崩了，景区人也比旺季少。想动的别等九月，九月一开学这批尾单就没了。"},{"angle":"避坑清单","text":"看到1890飞乌鲁木齐这种价别上头，先核对这几点。第一，报道里的价格是往返不含机建燃油，实际付款要再加140左右的税费，看到1890别当到手价。第二，这种跳水价基本是特定日期特定航班，8月22到29号这周才有，你换个周末可能贵一倍，下单前先锁日期。第三，2折内的舱位大多不能退改或退改费高，行程有变数别贪这个价。第四，低价多集中在工作日，周末和临近开学日会回涨，时间自由的尽量选周二到周四。第五，燃油附加费降了但票价本身波动大，买完记得开保价，真降了还能补差。避开这五条，这波捡漏才是真便宜。"}]},{"id":"tv5","title":"有些机票今年没疯涨，背后是高铁在替你砍价","hook":"有些机票今年没疯涨，背后是高铁在替你砍价。","why":"解释为什么今年机票便宜的底层原因之一，信息差强、有观点，适合做有态度的解读类内容。","heat":"中","tags":["趋势","机票","分析"],"facts":["业内普遍把高铁对800公里左右航线的客流承接，视为压低这部分机票价格的因素之一（腾讯新闻2026-08-21）","2026年夏秋航季3月29日至10月24日覆盖整个国庆，61家航司每周国内客运航班97428班，34家新开434条国内航线，运力盘子变大（民航局/腾讯新闻2026-08-21）","国航80余条航线环比加密、国内班次较2025年夏秋增约9%，东航新开41条、加密65条国内航线（腾讯新闻2026-08-21）","航司更愿提前放折扣舱换客座率，避免临期空座难变现，是今年未现越临近越疯涨的基础原因（腾讯新闻2026-08-21）","待核实：高铁对具体航线票价压制的量化比例无统一公开数据，上述为媒体引述业内观点"],"scripts":[{"angle":"趋势判断","text":"今年机票整体比往年温和，背后有一条线很少被讲：高铁在替民航压价。腾讯新闻引述业内观点，高铁对800公里左右航线的客流承接，是压低这部分机票价格的因素之一。逻辑是这样，中短途出行，高铁准点、方便、市中心到市中心，很多人直接选高铁，民航那部分客流就被吃掉了，机票自然不敢涨。再加上今年运力盘子变大，夏秋航季61家航司每周国内航班97428班、34家新开434条国内航线，国航东航都在加密，座位变多、需求没爆发，溢价空间先被压一层。这趋势对乘客是长期的利好，800公里内的航线以后更难出现天价。"},{"angle":"说人话版","text":"说人话解释为什么今年机票没那么凶。两个原因。第一，飞机变多了，民航局数据今年夏秋航季61家航司每周国内航班近十万班，34家新开了434条国内航线，国航东航都在加班次，座位多了，票价就撑不住。第二，高铁在抢民航的活，尤其是800公里左右的中短途，高铁比飞机省去安检和市区到机场的时间，很多人直接选高铁，民航那部分客源被分走，机票就不敢随便涨。航司也学乖了，宁可提前把4折5折的舱位放出来换客座率，也不赌临期高价，因为飞机起飞后的空座没法再卖钱。所以今年没出现往年那种越临近越疯涨，是供需两头一起作用的结果。"},{"angle":"横向对比","text":"把今年和往年机票摆一起看，差别在定价逻辑。往年暑期国庆，航司习惯捂着折扣舱等临期收割，越临近越贵。今年反过来，运力先堆上去了，夏秋航季61家航司每周近十万班国内航班、新开434条线，国航东航加密，座位供给明显宽松。另一边高铁持续分流800公里内客源，民航不敢在短中途硬挺高价。两股力量合力，航司改成提前放折扣舱换客座率，因为空座起飞后一文不值。结果就是今年没出现越临近越疯涨，整体比去年同期便宜一成左右。对乘客的含义是，中短途机票会长期更温和，长途线则看运力和假期错峰，该早买还得早买。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"蚂蚁鹰序TST 2.0登顶时序预测，四大行拿来管外汇","hook":"蚂蚁一个预测模型，巴克莱花旗德意志渣打四家银行都在用。","why":"AI落地金融的硬案例，有SOTA跑分加真实银行客户，比任何概念都有说服力，可延展到AI不止会聊天。","heat":"高","tags":["金融","落地","国产"],"facts":["蚂蚁国际8月20日发布自研时序预测大模型鹰序TST（FalconTST）2.0，专注跨境支付与外汇风险管理（科创板日报2026-08-20；网易智能2026-08-20）","在全球权威时序预测基准MASE指标取得SOTA，得分0.666，超越多家全球科技公司同类模型（科创板日报/新浪/网易智能2026-08-20）","巴克莱、花旗、德意志、渣打四家银行已将2.0用于现金流预测与外汇管理，预测准确率稳定超93%（Business Wire 2026-08-19；新浪2026-08-20）","技术亮点：区分数据缺失与真实零值、ORBIT跨域泛化、支持秒级到月级多时间频率（网易智能2026-08-20）","除金融外正向电商供应链、航空运营管理等场景扩展（Business Wire 2026-08-19）"],"scripts":[{"angle":"干货直给","text":"蚂蚁国际8月20号发了个模型叫鹰序TST 2.0，干的事很具体：预测钱随时间怎么变。它专注跨境支付和外汇风险管理，在全球权威的时序预测基准MASE上拿了第一，得分0.666，超过好几家全球科技公司的同类模型。最硬的证据是落地，巴克莱、花旗、德意志、渣打四家银行已经把它接进自己的现金流预测和外汇管理系统，预测准确率稳定超过93%。它跟大模型不一样，大模型学的是文字关系，这个模型学的是数字随时间变化的规律，比如周末交易少不代表资金需求归零，它能区分数据缺失和真实零值。目前已经从金融往电商供应链、航空运营这些场景扩。"},{"angle":"数据向","text":"把鹰序TST 2.0的数字摆出来。第一，发布时间8月20号，蚂蚁国际自研，专注跨境支付和外汇风险。第二，跑分，全球时序预测基准MASE指标0.666，拿下SOTA，超过多家全球科技公司同类模型。第三，真实客户，巴克莱、花旗、德意志、渣打四家银行已用于现金流预测与外汇管理，准确率稳定超93%，不是演示是生产环境在用。第四，技术点，能区分数据缺失和真实零值、ORBIT跨域泛化、支持从秒级支付数据到月级经济指标的多频率预测。第五，场景外延，正向电商供应链需求预测、航空运营管理扩展。这几个数字合起来说明，AI在金融里已经从聊天进了核心的资产负债和风控系统。"},{"angle":"说人话版","text":"说人话解释鹰序TST是干什么的。大模型擅长读懂和写文字，但这个模型擅长猜数字，而且是猜会随时间变的那些数字，比如一笔跨境支付的钱什么时候到、外汇敞口有多大。对一家全球支付公司来说，这些预测直接决定要准备多少现金、换多少外币，差一点就是真金白银的损失。鹰序的厉害处在于，它从金融、零售、能源、旅游这些数据里学通用的时间规律，所以能跨行业用。银行拿它管外汇风险，航空公司拿它管多币种收支。蚂蚁自己先内部用，再开放给巴克莱花旗这些大行，准确率超93%。对普通人意味着，你跨境转账、换汇背后的那套风控，正在被这类模型悄悄接管，速度更快也更准。"}]},{"id":"ai2","title":"昇腾把DeepSeek-V4后训练效率拉到2.93倍","hook":"国产卡训练万亿模型，效率一下翻了近三倍。","why":"国产算力工程突破，有论文加官方技术报告双一手来源，情绪与信息量兼备，可对接国产算力替代叙事。","heat":"高","tags":["国产算力","工程","DeepSeek"],"facts":["深圳河套学院SLAI团队在昇腾SuperPOD集群完成DeepSeek-V4家族全参数后训练工程验证，发布SLAI T-Rex技术报告（深圳河套学院官网slai.edu.cn；arXiv 2607.20145）","优化后系统MFU（模型浮点计算利用率）由开源基线11.67%提升至34.22%，达到基线2.93倍（深圳河套学院/arXiv 2026-07至08）","原始流程中通信开销占设备内核时间52.2%，团队从并行策略、通信重叠、AuraKernel算子三层优化（深圳河套学院官网）","以DeepSeek-V4-Flash做运筹优化专项后训练，B4O-ORGEval得分由34.26%升至59.39%，OR四项平均零样本Pass@1达71.81%，超GPT-5.4 mini（arXiv 2607.20145）","下一步计划推进至智能体强化学习阶段，并逐步开放训练配置与优化后的AscendC内核代码（深圳河套学院官网）"],"scripts":[{"angle":"干货直给","text":"深圳河套学院发了份技术报告，叫SLAI T-Rex，干了一件挺关键的事：在国产昇腾SuperPOD集群上，把DeepSeek-V4这种万亿参数模型的后训练跑通了，而且效率拉得很猛。核心指标是MFU，也就是硬件真正用于算模型的比例，优化前开源基线只有11.67%，优化后到了34.22%，翻了2.93倍。原来的大问题是通信，超过一半的设备时间不是在算，是在等数据交换和同步，报告从并行策略、通信重叠、AuraKernel算子三层一起改。更实用的是，他们用DeepSeek-V4-Flash做了运筹优化专项后训练，在OR任务上平均零样本Pass@1达到71.81%，超过了GPT-5.4 mini。这说明国产卡不光能跑，还能跑得越来越省。"},{"angle":"说人话版","text":"说人话解释这个突破值在哪。训练大模型像在几千张卡上同时解一道巨题，最怕的不是卡不够，而是卡都在等别的卡算完，自己干瞪眼。报告里说，原来超过一半的设备时间花在通信等待上，真正算模型的只有一成多。深圳河套学院团队做了三件事：不同模块用不同并行方式、让计算和通信同时跑、再用AI帮着调底层算子，把真正用于计算的比例从11.67%拉到34.22%，翻了近三倍。比例越高，同样的卡干出越多的活，训练和迭代成本就降下来。他们还顺手用DeepSeek做了个运筹优化模型，解题比几个前沿模型都强。对产业的含义是，国产算力这条路的性价比正在快速追上。"},{"angle":"趋势判断","text":"从这份报告能看出国产算力竞争的一个转向：拼的不只是谁卡多，更是谁能把卡用得更满。过去大家卷参数、卷集群规模，但万亿模型真正卡脖子的是训练效率，MFU从11.67%到34.22%这种提升，等于同样硬件凭空多出一两倍产能。报告给出的是一条可复制的路径，模型结构、系统调度、底层算子三层协同优化，而不是单点调参。更关键的是，它证明昇腾NPU SuperPOD能稳定承载万亿MoE模型的全参数后训练，给国产算力替代提供了工程样本。下一步他们要推到智能体强化学习，还会开放训练配置和内核代码，这意味着经验能外溢给整个生态，长期看会压低国产大模型的迭代成本。"}]},{"id":"ai3","title":"Mojo编译器开源：AI时代的系统语言终于能用了","hook":"做AI最底层那门语言，终于把编译器开源了。","why":"AI基础设施系统层少有人讲，Mojo开源是开发者圈大事件，可破圈到为什么AI需要专属编程语言。","heat":"中高","tags":["开源","开发者","底层"],"facts":["Modular于8月20日前后发布Mojo编译器与工具链，采用Apache 2.0许可完全开源（Daily AI Tech Intel Brief 2026-08-20）","距Mojo 1.0发布约一周，兑现2023年要将Mojo开源的承诺（Daily AI Tech Intel Brief 2026-08-20）","Mojo定位高性能AI语言栈，开源让开发者直接检视并贡献代码，有望拓宽Modular生态之外的采用（Daily AI Tech Intel Brief 2026-08-20）","背景：大模型竞争进入高频迭代，底层编译器与算子效率成为训练与推理成本的关键变量（综合行业报道2026-08）","待核实：Mojo开源后的社区采用速度与生态成熟度尚无第三方量化数据"],"scripts":[{"angle":"干货直给","text":"Modular把Mojo的编译器和工具链开源了，用的Apache 2.0许可，这意味着任何人都能看源码、自己改、自己编。Mojo是专门为AI设计的高性能语言，目标是在Python那种好写的基础上，把底层算力的性能吃满。它2023年就说过要开源，这次兑现了，而且离Mojo 1.0发布才一周左右。为什么这事重要？因为大模型现在拼的是高频迭代，训练推理的成本很大一块卡在底层编译器和算子效率上，谁的语言栈能让硬件跑得更满，谁就把成本压得更低。Mojo开源之后，开发者不用被锁在闭源工具里，可以直接检视、贡献、针对自己的硬件调优，生态会跑得更快。"},{"angle":"说人话版","text":"说人话解释Mojo是干嘛的。你可以把它理解成AI世界的发动机改装手册。写AI应用大家习惯用Python，好写好懂，但跑起来慢，因为Python离硬件太远。Mojo想做的是既要像Python好写，又能直接榨干芯片性能。它把编译器和工具链开源，等于把这套改装手册公开了，谁都能拿去改、拿去适配自己的机器。对普通开发者来说，好处是以后调AI性能不用被某家闭源工具卡脖子，想怎么优化自己来。对小公司来说，意味着能用更少的算力跑出同样的模型，成本曲线往下走。当然现在说生态成熟还早，但方向是对的，底层开放早晚会反哺上层应用。"},{"angle":"趋势判断","text":"Mojo开源放在今年的时间点看，是个信号：AI竞争的战场正在往系统层沉。前两年大家卷模型参数、卷榜单，现在模型差距在缩小，真正拉开成本的是底层，编译器怎么把算子排得更密、通信怎么和计算的重叠、不同芯片怎么适配，这些工程细节决定了一样多的钱能跑出多少智能。Mojo选择开源，是赌生态越大自己越受益，和当年Python、Linux的路子一致。短期看它给开发者多一个选择，长期看它可能成为AI基础设施的底层选项之一。对行业的影响，是降低高性能AI编程的门槛，让更多团队能自己优化而非全依赖大厂闭源栈，算力利用效率整体会被推高。"}]},{"id":"ai4","title":"Meta给Mac做了原生AI应用：能看你的窗口、读你的主页数据","hook":"Meta的AI现在能盯着你电脑屏幕，还能读你Instagram数据了。","why":"AI助手抢占桌面入口的鲜活案例，功能具体，适合做AI助理战争解读。","heat":"中高","tags":["AI助手","桌面","Meta"],"facts":["Meta于8月19日发布原生macOS版Meta AI应用（beta 1.0），基于SwiftUI与AppKit、约16MB、需Apple Silicon与macOS 15（Mashable 2026-08-20；iGeeksBlog 2026-08-19；9to5Mac）","桌面独占能力：共享窗口让AI读取屏幕内容给建议；系统级听写可在任意Mac App内语音输入；Option加Space唤起浮层（Mashable/AI Chat Daily 2026-08-19）","打通Instagram、Facebook、Meta广告与Google Workspace，可分析帖子触达并建议下次发什么（AI Chat Daily/Mashable 2026-08-19）","竞争定位：ChatGPT、Claude、Gemini均已登陆Mac；Meta优势在社媒数据，弱势在尚不能像对手那样真正操控电脑（AI Chat Daily 2026-08-19）","隐私争议：Meta生成式AI隐私政策允许用交互训练模型，应用可读取屏幕与Workspace文件（iGeeksBlog 2026-08-19）"],"scripts":[{"angle":"功能详解","text":"Meta给Mac做了个原生AI应用，8月19号发的beta版，不是网页套壳，是用苹果原生框架写的，安装包才16兆，要Apple芯片加macOS 15。它有几个桌面独占的能力。第一，窗口共享，你把一个窗口拖进对话，它能读屏幕上的文字和截图，基于你正在看的内容给建议。第二，系统级听写，按住快捷键在任何App里都能语音转文字，邮件、文档、聊天框都行。第三，Option加Space唤起一个浮层，盖在当前软件上面随时问。第四，也是它最特别的，直接连你的Instagram、Facebook、Meta广告和Google Workspace，能读帖子的触达数据，告诉你下次发什么。这几样加起来，它不像聊天机器人，更像贴着你工作流的助理。"},{"angle":"横向对比","text":"把Mac上的AI助手摆一起比，格局很清楚。ChatGPT、Claude、Gemini早就上了Mac，而且它们的桌面应用能真正操控电脑，点按钮、打字、跑任务。Meta这波是补课，8月19号才发原生Mac版，窗口共享和系统听写追平了Gemini，但还做不到对手那种代你操作。Meta真正的差异在社媒数据，它能直接读你Instagram和Facebook的触达、收藏、分享，这是别人没有的，做内容的人用它分析下次发什么特别顺。所以定位不一样，ChatGPT和Claude是通用工作助理，Meta是冲着商家和创作者的营销工作流来的。谁最后占住你的桌面，取决于你天天用哪套数据。"},{"angle":"说人话版","text":"说人话解释Meta这个Mac应用是什么。它就是一个住在你电脑上的AI帮手，跟ChatGPT那个桌面版是一类东西，但多了两样本事。一是能看屏幕，你把正在用的窗口丢给它，它就顺着你眼前的文档或表格给建议，不用复制粘贴。二是能在任何软件里语音输入，按住快捷键说话就变成字。更特别的是它连着你的Instagram和Facebook，能看你的帖子数据，提醒你下次发什么内容、什么时间发。对做自媒体和开网店的人，这等于把数据分析和写文案合到一个窗口里。代价是隐私，它默认可能用你的交互去训练模型，介意的话记得开隐身模式，也别随便给屏幕录制权限。"}]},{"id":"ai5","title":"Groq 3.5亿美元A轮：芯片公司不卖卡改卖算力","hook":"一家做AI芯片的公司，转身成了卖算力的云，还拿了英伟达的钱。","why":"推理云赛道升温的标志性融资，英伟达参投形成既当供应商又当股东的有趣关系，适合讲AI基建投资逻辑。","heat":"中高","tags":["融资","推理云","算力"],"facts":["美国AI推理云独角兽Groq于8月17日宣布完成3.5亿美元A轮融资，投后估值35亿美元，由Disruptive领投、英伟达计划参投（Groq官网2026-08-17；科创板日报2026-08-18；网易2026-08-18）","本轮与2026年6月6.5亿美元融资合计，近期募资达10亿美元（Groq官网2026-08-17）","资金用于将算力从54兆瓦扩至2027年200兆瓦以上，全球13个数据中心支撑（Groq官网/科创板日报2026-08-18）","Groq已从自研LPU芯片转向云服务商，主要运营英伟达GPU系统；去年12月英伟达与Groq签200亿美元协议获芯片技术授权（科创板日报/网易2026-08-18）","英伟达基于Groq技术开发Groq3 LPU推理芯片并于今年3月发布，双方为深度合作（网易2026-08-18）"],"scripts":[{"angle":"干货直给","text":"Groq这家公司8月17号宣布完成3.5亿美元A轮，投后估值35亿美元，由Disruptive领投，英伟达计划参投。加上今年6月那笔6.5亿，它近期一共募了10亿美元。钱花在哪？把算力规模从54兆瓦扩到2027年的200兆瓦以上，背后是13个全球数据中心。有意思的是Groq的身份变了，它最早做自研LPU芯片，现在转成了推理云服务商，主要运营英伟达的GPU系统。更微妙的是，去年12月英伟达和它签了200亿美元协议拿到芯片技术授权，还基于Groq技术做了自己的Groq3 LPU推理芯片。所以这次英伟达参投，等于供应商又成了股东，关系绑得很深。"},{"angle":"趋势判断","text":"Groq这轮融资其实在讲一个更大的故事：推理云正在变成AI基建里最关键的一层。它自己说，推理无疑会成为AI基础设施里最大也最关键的层。逻辑是，训练是大厂少数玩家的游戏，但推理是每个上线AI产品的公司每天都要用的，需求更分散、更持续。Groq从卖芯片转卖算力，是看清了自己拼不过英伟达的硬件规模，不如做云服务平台，用运营效率赚钱。英伟达参投更是信号，连卖铲子的都认可推理云的价值，还顺手把Groq的技术收编进自己的芯片。对创业者的启发是，AI基建的机会不只在模型，在把模型高效、便宜地跑出来的那一层。"},{"angle":"说人话版","text":"说人话解释Groq在干啥、为什么值钱。大模型有两个阶段，一个是训练，烧钱造出模型；一个是推理，模型上线后每次回答问题都在消耗算力。训练是少数巨头玩，推理是千千万万公司天天要用的，市场更大更稳。Groq最早想自己造芯片，后来发现拼不过英伟达，就转型成卖算力的云，你不用买卡，按调用付费就能跑模型。这轮融3.5亿美元，加上之前6.5亿，共10亿，用来把机房从54兆瓦扩到200多兆瓦。最妙的是英伟达也来投资，因为去年它和Groq有200亿美元的技术授权合作，等于供应商顺便当了股东。对普通人没直接影响，但说明一件事：以后用AI的成本，很大程度由这批推理云决定。"}]}]}]},"2026-08-21":{"date":"2026-08-21","updatedAt":"2026-08-21 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"去三亚不用提前办签证了：海南入境免签扩到61国","hook":"海南把免签国家从59个加到61个，落地刷护照就能进。","why":"国家移民管理局8月20日刚发公告，时效极强，且是具体可操作的利好，适合做短口播。此前讲过240小时过境免签，这次是海南单独的入境免签机制，角度不撞。","heat":"高","tags":["强时效","政策","出境"],"facts":["国家移民管理局8月20日公告：海南入境免签政策优化，适用国家由59国增至61国，免签事由扩展至旅游、商贸、访问、探亲、医疗、会展、体育等，停留期延长至30天（国家移民管理局官网+新华社+中国旅游报，多源一致）","同日，吉尔吉斯斯坦、越南加入240小时过境免签，适用国家增至57国，开放口岸达65个（国家移民管理局8-20+新华社）","海南免签适用于从海南入境、在海南停留不超过30天的外国人，无需事先申请签证（国家移民管理局口径）","待核实：61国具体新增国家名单未在本次检索中逐条列出，以官方公布清单为准"],"scripts":[{"angle":"干货直给","text":"去三亚不用再提前办签证了。国家移民管理局8月20日公告，海南入境免签政策升级，适用国家从59个扩到61个，免签事由也放宽到旅游、商务、探亲、医疗、会展、体育，停留期延长到30天。同一天，吉尔吉斯斯坦和越南加入240小时过境免签，全国过境免签适用国达到57个、口岸65个。简单说，现在从海南入境玩一圈，提前在平台填好资料就行，不用跑使领馆等审批。以前办海南旅游签证要走送签、等三五个工作日，现在免签直接飞，落地刷护照过关。提醒一句，免签不等于免查，边检仍看返程机票和住宿，材料带齐更稳。国庆前后海南机票本就紧，免签省下的送签时间刚好用来抢早鸟票，海南免税购物也不受影响。"},{"angle":"说人话版","text":"用大白话讲清楚海南这次免签到底利好谁。第一，它针对的是从海南入境、在海南待不超过30天的外国人，旅游、开会、探亲、看病都算，不用提前去大使馆递材料交钱。第二，适用国家从59个加到61个，覆盖面又宽了一截，周围没签证便利的小国现在也能说走就走。第三，别和240小时过境免签搞混，那是另一套机制，针对的是经中国去第三国的旅客；海南这套是专门冲着海南本地玩的。对普通人来说，国庆前想安排海南亲子度假或者商务会奖的，少操一份送签的心，机票酒店订好就能走。这几类人最该关注：带娃家庭、老年团、做会奖的旅行社，以前卡签证周期不敢接的团现在能接了。"},{"angle":"趋势判断","text":"海南把入境免签国家扩到61个，不是单点动作，是入境游便利化的大趋势在落地。判断有三点。第一，政策在持续做加法，从59国到61国，再到同日过境免签扩到57国、口岸65个，松绑是成体系的，不是偶发。第二，免签事由从纯旅游放开到商务、医疗、会展、体育，说明目的地在抢会奖和医疗旅游这类高客单人群，不只图门票钱。第三，对游客的体感是确定性变强，以前要算签证周期、怕拒签，现在刷护照过关。海南这步会倒逼其他热门海岛目的地也跟进便利，国庆前的窗口已经打开。下一步看两件事：更多省份会不会跟海南学搞自己的入境便利，免签停留能不能从30天再往长放。"}]},{"id":"tv2","title":"西十高铁开通首月，沿线景区游客涨了三成","hook":"一条高铁通了，沿线小城景区一个月多三成客人。","why":"西十高铁是今年新线，首月数据新鲜，且能接上全国暑运10.1亿人次的大盘，有对比有信息差。温玉段此前讲过，西十是不同线不同角度。","heat":"中高","tags":["高铁","县域","数据"],"facts":["西十高铁（西安至十堰）开通首月，沿线景区游客同比增长约30%（中国西藏网/人民铁道 08-15~19）","全国铁路暑运预计发送旅客10.1亿人次（中国经济网/人民铁道 08-15）","西十高铁串联西安、商洛、十堰，接入武汉枢纽，拉近西北与华中（人民铁道）","待核实：沿线具体景区游客增量数字为报道口径，未逐景区核实"],"scripts":[{"angle":"数据向","text":"给两个数字，看高铁怎么改写旅游版图。第一，西十高铁开通首月，沿线景区游客同比增长约30%，一条线带火了一串城。第二，全国铁路暑运预计发送旅客10.1亿人次，这是今年的大盘子。西十高铁串起西安、商洛、十堰，再接武汉枢纽，把西北和华中拉到三小时生活圈。以前从西安去十堰看武当山，得绕一大圈，现在高铁直达，周末就能打来回。游客涨三成说明什么？不是大家突然爱出门，是路通了、时间省了，原本不去的地方顺路就去了。这条线对陕南、鄂西那些过去交通不便的县城，是实打实的客流红利。九月底前商务和亲子客流还没起，现在是沿线小城最舒服的空窗。"},{"angle":"实操流程","text":"想顺西十高铁玩一趟，按这个顺序排最省力。第一步定起点，西安出发最方便，车次多、票好抢；十堰作为终点，连武当山和武当山机场。第二步排动线，西安玩一天，第二天一早高铁到商洛，看秦岭山水住一晚，第三天到十堰上武当山，下山直接武汉转车回家。第三步抢票，暑运尾声加开学前，商务和亲子客流下滑，现在票比七月中旬好买，提前三五天足够。第四步订房，沿线县城酒店供给有限，武当山脚下周末仍紧张，先订可免费取消的。第五步留半天机动，山区天气变脸快，别把行程排太满。这条线适合三天到四天，别贪多，商洛山水小众不挤，十堰武当山文化厚，武汉收尾吃顿好的。"},{"angle":"反常识开场","text":"很多人以为高铁只是快一点，其实高铁能凭空造出一个新假期。西十高铁开通才一个月，沿线景区游客就涨了三成，这不是原有客流搬家，是新冒出来的需求。以前西安人想去武当山，得算两天请假加绕路成本，脑子一算就放弃了；现在高铁三小时直达，周末说走就走。全国暑运预计10.1亿人次，盘子巨大，但真正有增量的是新通车的线，老线路只是平移。所以看旅游别只看传统热门，新高铁一通，沿线的冷门小城立刻变香。国庆前这条线还没被炒热，自由行反而自在。真正划算的不是去哪，是什么时候去，新线开通头几个月最香，等人人都知道，票价和住宿都上去了。"}]},{"id":"tv3","title":"暑期后高端酒店捡漏：套房从三万降到两千五","hook":"机票腰斩之后，高端酒店也撑不住了，但低点还没到。","why":"什么值得买8月20日披露高端酒店史低价样本，带具体数字和避坑清单，实操性强，适合做省钱向口播。此前未讲过酒店捡漏节奏。","heat":"中高","tags":["省钱","错峰","避坑"],"facts":["暑期后机票已腰斩，8月下旬至9月初为机票最优买点，9月或更低（什么值得买/环球旅享家 08-20）","高端酒店出现史低价：珠海东澳岛安麓海景套房套餐999元，部分总价3万元套房降至2500元（什么值得买 08-20）","酒店价格滞后于机票，真正低点多在9月至国庆前（同花顺/社科院宋瑞分析 08-20）","携程919大促已开跑，可囤不约可退套餐锁定低价（什么值得买）","避坑：套餐多带有效期、周末节假日加价、实名入住限制（什么值得买）","待核实：具体酒店降价样本为渠道个案，非普遍价格"],"scripts":[{"angle":"避坑清单","text":"暑期后捡漏高端酒店，三件事先搞清楚再下手。第一，机票和酒店节奏不同步，8月下旬到9月初是机票最低点，酒店低点滞后到9月至国庆前，所以现在先锁机票，酒店别急，等它再降。第二，看到的史低价大多是套餐价不是日历房价，什么值得买披露珠海东澳岛安麓海景套房999元、部分三万套房降到2500，但带有效期，普遍到11月或年底，周末节假日能不能约上看条款。第三，防便宜出帖，小红书上大量代订尾单，实名限制和退改风险明确，优先官方和平台大促。携程919大促已开跑，囤不约可退的套餐，用不上直接退，零成本锁低价。一句话，捡漏的核心是耐心和看清条款，别被史低价冲昏头。"},{"angle":"成本账","text":"算一笔错峰账，你就知道现在出手多划算。机票这边已经腰斩，8月下旬到9月初是最优买点，9月还能更低。酒店这边，暑期溢价最狠的度假地开始松动，珠海东澳岛安麓海景套房打出999元套餐，个别总价三万的套房降到2500，这价差平时想都不敢想。关键判断就一句：机票先行，酒店滞后。如果你9月就能走，机票现在锁、酒店临近订；如果只能国庆走，假期一定回涨，正确姿势是现在囤不约可退的大促套餐。时间自由的人这波红利吃得最满，时间被绑死的别赌临期降价，老老实实囤可退套餐。时间自由换价格优待，这是暑期后窗口的本质。"},{"angle":"干货直给","text":"暑期后想住好又想省钱，记住这个节奏。机票已经腰斩，8月下旬到9月初是最便宜的窗口，9月还能更低，这部分现在就可以买。酒店不一样，价格滞后，真正的低点要到9月甚至国庆前才出现，所以酒店别急着订，等它降到位。瞄准三亚、海南这类暑期溢价最狠的度假地，回落空间最大。捡漏渠道看两个：一是平台大促，携程919已经开跑，囤不约可退套餐等于零成本锁价；二是高端酒店套餐价，东澳岛安麓海景套房999元这种史低价会出现。下单前翻一眼条款，有效期、加价、实名三件事确认好。最后提醒，价格越低越要翻最近真实差评，今年高端酒店供给承压，个别服务缩水，套餐看着便宜约起来全是加价项的也有。"}]},{"id":"tv4","title":"港澳签注松绑：用完随时续，不用再等60天","hook":"赴港签注取消60天冷却期，刷完立刻能再办。","why":"2026年7月起全国取消签注间隔，全国通办、一签多行，是实用高频政策，长效不过期，收藏率高。此前未专门讲过签注松绑。","heat":"中","tags":["政策","周边游","收藏向"],"facts":["2026年7月起全面取消港澳旅游签注间隔限制，用完随时可自助续签，不再等60天冷却期（国家移民管理局/深圳公安，多源）","内地居民申办往来港澳通行证及签注全面全国通办，凭身份证可在全国任一出入境窗口办理（国家移民管理局）","深圳户籍及持居住证人员可办赴港一签多行，1年多次不限次数，单次逗留不超7天（深圳公安 06-26）","收费标准：通行证60元/本，旅游签注一次15元，智能签注设备立等可取（国家移民管理局收费标准）","提醒：持护照假借过境赴港澳却不前往第三国，会留不良出入境记录（网易号 08）","待核实：全国通办具体城市范围以官方公布为准"],"scripts":[{"angle":"实操流程","text":"办港澳签注现在简单到三步。第一步，带身份证去全国任一出入境大厅或智能签注机，不用户口本、不用回老家，全国通办已经落地。第二步，选签注类型，个人游G签或团队游L签都能办，旅游签注一次15元，机器上立等可取。第三步，深圳户籍或持居住证的直接办赴港一签多行，一年内不限次数往返，单次最多待7天，等于把香港变成周末后花园。最关键的变化是7月起取消60天冷却期，以前刷完得干等两个月才能再办，现在用完立刻续。通行证工本费60元一本，长期有效，先办一本放着总没错。办证拍照录指纹当场完事，七个工作日拿证，急的用20城网办邮寄。"},{"angle":"说人话版","text":"说人话解释这次港澳签注松绑。以前你去香港玩一趟，回来想再去得等60天冷却期，很多人卡在这。今年7月起这个限制没了，签注用完随时在机器上续，立等可取。办理也松了，不用回户籍地，拿着身份证在全国任何出入境窗口都能办，叫全国通办。深圳人和在深圳交社保的，还能办一签多行，一年里不限次数往返香港，单次最多待七天。费用很低，通行证60块一本，旅游签注一次15块。一个提醒，别拿护照假借过境名义进港澳却不飞第三国，这会留不良记录，影响以后办签注。老年人走人工通道，小孩要监护人陪同，L签现在不用送关直接自助过关，和G签一样，政策松了但规矩还在。"},{"angle":"避坑清单","text":"港澳签注五个坑，出发前核对一遍。第一，签注和通行证两码事，通行证60元一本长期有效，签注是另买的次数，两地签注不通用，去香港和去澳门要分别办。第二，7月起取消60天间隔，但每次逗留天数仍有限制，香港单次最多7天，超期算逾期。第三，全国通办但个别地区细节以官方为准，智能机不能用的找窗口。第四，深圳一签多行限户籍和居住证人群，外地游客还是常规G签或L签。第五，绝对别用护照假过境，被查到留不良记录，得不偿失。材料带齐身份证和有效期内的通行证就行。总结一句，赴港澳现在比以前顺太多，冷却期没了、全国能办、机器立等可取，剩下的就是自己规划好行程别超期。"}]},{"id":"tv5","title":"独库公路热度涨三倍，今年流行沿线县城慢游","hook":"独库公路今年火到断层第一，但老司机都不赶路了。","why":"独库自驾热度同比涨300%、昭苏19℃避暑、配套升级，是今年新疆暑期最热且未讲过的具体线路角度（此前只提过县域目的地笼统概念）。","heat":"中高","tags":["自驾","避暑","新疆"],"facts":["独库公路今年自驾热度同比涨超300%，全年仅开放约4个月（6月至10月）（今日头条/旅游平台 08-01）","昭苏县夏季均温约19℃，跻身全国奔县游热门榜第八（今日头条 08-01）","2026年配套升级：那拉提新开空中草原索道、赛里木湖环湖公路改造完成、松树头高空栈道新开放（搜狐 08）","独库通行需提前在官方公众号预约，7座及以下车辆可通行，管制时段7:00至20:00（携程/同程）","待核实：独库预约具体需提前天数（报道称5至7天）"],"scripts":[{"angle":"行程规划","text":"独库公路今年自驾热度同比涨超三倍，但懂行的都不赶路了，改成沿线县城慢游。推荐七天小环线：第一天伊宁落地租车，第二天走伊昭公路看白石峰，住昭苏，这里夏天均温19℃，油菜花紫苏正盛；第三天昭苏去夏塔看冰川，住特克斯八卦城；第四天进那拉提空中草原，新开的索道能直接登顶；第五天走独库公路北段到巴音布鲁克看九曲日落；第六天经乔尔玛到独山子；第七天赛里木湖环湖住一晚。独库全程561公里，7座及以下可通行，管制7点到20点，必须清晨出发避堵。住宿热门小院提前三周订。这条线七八月份最旺，想人少就八月底走，草原还绿、游客已退，车和油在独山子加满，山里补给少。"},{"angle":"数据向","text":"几个数据说明今年新疆自驾为什么火。独库公路自驾热度同比涨超300%，全年只开放约4个月，六月到十月，错过等明年。昭苏县夏天均温19℃，挤进全国奔县游热门榜第八，是北疆避暑首选。配套也在升级，那拉提新开空中草原索道，赛里木湖环湖公路改造完，松树头高空栈道新开放，体验比往年好。但热度上来意味着堵，独库乔尔玛段午后常限流，老司机都选清晨六点前出发。结论：线路没变，玩法人变了，从一天赶三站变成县城住两三天慢游，风景还是那片风景，节奏对了才舒服。热度涨三倍不代表体验差，前提是别赶，老司机都清晨出发、县城慢住。"},{"angle":"趋势判断","text":"独库热度涨三倍背后，是新疆出游逻辑的整体转向。第一，特种兵打卡退潮，慢游县城上位，游客不再一天跑三个景区，而是在昭苏、特克斯、库车小住两三天，露营野餐徒步，这股奔县游把原本只当中转站的小城变成了目的地。第二，避暑需求外溢，全国高温下昭苏19℃天然吸客，新疆承接了原本去东南亚避暑的客流。第三，配套成熟降低门槛，索道、环湖路、栈道新开，自驾体验提升，正向刺激更多人来。对新疆文旅是好事，县域从过道变目的地，老百姓吃上旅游饭。对游客是提醒，火得越快越要错峰和预约，别等堵在独库上再看风景，提前五天约通行时段最稳，带够水、薄羽绒和雨衣。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"ChatGPT推出青少年模式，13岁就能用但有家长盯着","hook":"OpenAI给13到17岁开了专用模式，家长能看记录能限时间。","why":"OpenAI 8月18日发布青少年模式，强时效且涉及未成年人保护，争议和讨论度高，此前未讲过。","heat":"高","tags":["强时效","产品","合规"],"facts":["OpenAI 8月18日发布ChatGPT青少年模式，面向13至17岁用户，需家长同意或关联家长账户（至顶科技/cnBeta 08-18）","内置家长管控：可查看使用活动、设使用时间、禁用聊天记录用于模型改进（OpenAI官方）","禁止对青少年使用浪漫或情感称呼，设学习模式辅助功课（至顶科技）","待核实：青少年模式首发地区范围"],"scripts":[{"angle":"功能详解","text":"OpenAI 8月18日给ChatGPT加了青少年模式，面向13到17岁。几个设计值得看。第一，开通要家长同意或者关联家长账户，不是孩子自己偷偷就能用。第二，家长管控面板能看使用活动、设每天使用时间、还能关掉把聊天记录拿去训模型的开关，隐私主动权在家长手里。第三，模型层面设了红线，禁止对青少年用浪漫或情感称呼，避免AI扮演暧昧角色，同时开了学习模式帮做功课。这套设计说明大厂未成年人保护的重心从一刀切封禁，转向在可控范围内放行。对家长来说，它把AI从黑箱变成了可监督的工具。对行业来说，这是未成年人AI保护的样板，后面做青少年产品都得照这个来。"},{"angle":"说人话版","text":"用大白话讲ChatGPT青少年模式到底管什么。孩子13到17岁能用，但要家长点头，要么家长账户关联，要么当场同意。家长能看孩子用ChatGPT干了啥、能限每天用多久、还能选择不把对话拿去训练模型。AI这边也被套了规矩，不能跟青少年说肉麻的话、不能装恋人，主打一个学习辅助。说白了，以前家长怕孩子乱用AI、又怕账号被封，现在官方给了个带护栏的版本，既能用又能盯。它也顺手解决了学校的顾虑，以前怕学生用AI抄作业还沉迷，现在家长能限时间能看记录，老师和家长的压力小了。但工具归工具，陪伴不能外包，该聊的还是得聊。"},{"angle":"创作者视角","text":"这条对做教育内容的朋友有三层启发。第一，未成年人AI是合规高压区，OpenAI主动加家长管控和禁用情感称呼，等于给行业划了线，以后做青少年向AI产品，这俩是标配不是加分项。第二，学习模式是入口，把ChatGPT从一个聊天玩具定位成功课助手，抢的是作业帮、背单词那类场景的注意力。第三，家长端透明化是卖点，能看记录能限时间，降低了家庭的决策门槛。还有一点，禁用情感称呼不是多管闲事，是防AI对未成年人建立错误依恋，这坑国外已经出过事，国内这次提前堵上，算是把护栏修在前面。做产品的记一笔，合规前置比事后补救便宜得多。"}]},{"id":"ai2","title":"上半年微短剧四分之三是AI拍的，网友却看腻了","hook":"AI微短剧占75%，但角色雷同到一眼假。","why":"新浪8月19日披露上半年AI微短剧27.5万部、占比约75%，强反差且有争议，此前未讲过AI短剧占比。","heat":"中高","tags":["反直觉","行业","争议"],"facts":["上半年微短剧36.7万部，其中AI微短剧27.5万部，占比约75%（新浪 08-19）","网友吐槽AI短剧角色雷同、表情僵硬、剧情套路化（新浪 08-19）","待核实：占比为平台统计口径，非全行业审计数字"],"scripts":[{"angle":"数据向","text":"给个数据，你看AI短剧有多猛。上半年微短剧总共36.7万部，其中AI微短剧27.5万部，占比约75%。也就是说，你现在刷到的四部短剧里有三部是AI参与甚至主导生成的。产能上去了，问题也来了，网友吐槽角色雷同、表情僵硬、剧情一个模子刻出来。这数字说明AI把制作门槛几乎削平了，一个人加一套工具就能日更几十条。但供给爆炸的另一面是审美疲劳，观众已经能一眼认出AI脸。占比75%是平台统计口径，不是全行业审计，但趋势不会错：量管够，质是下一个战场。平台愿意推AI短剧因为成本低起量快，但观众用脚投票，雷同内容完播率必然掉，75%是产能胜利不是质量胜利。"},{"angle":"反常识开场","text":"AI让拍短剧变容易了，但这对做内容的人可能不是好事。上半年AI微短剧27.5万部，占整个微短剧的75%，一个人配一套工具就能量产。听上去门槛崩了、人人可入局。问题是门槛是对所有人崩的。以前你拼的是会不会写脚本、能不能凑齐演员，这些稀缺技能被抹平后，观众面对的是一天几十条长得差不多的片。角色雷同、表情僵、剧情套模板，吐槽已经刷屏。所以当供给一年多出二十多万部，观众的耐心没跟着涨。真正值钱的在往两头跑：一头是真人质感和好故事，一头是能精准投流的分发。现在入局短剧，别比谁出得多，比谁做得不一样。"},{"angle":"方法论","text":"AI短剧占比冲到75%，给内容创作者的判断有三条。第一，拼量已经没意义，工具人人有、成本趋近于零，堆量这条路迅速失效，平台算法也会调。第二，稀缺的是真实感和一手信息，AI能给画面给套路，给不了你踩过的坑和独有的素材，时间该花在选题和采集上。第三，人格权重在上升，同样的信息观众更愿意从具体的人嘴里听。还有个隐藏机会：AI做本地化配音和出海翻译极快，同一剧本卖全球，这块还没卷起来，与其在国内红海里撞，不如用AI把内容铺到东南亚和欧美短剧市场，那是增量不是存量。给个做法：用AI做粗剪和素材，脚本和开头三秒自己把控，别让AI写完整稿。"}]},{"id":"ai3","title":"世界机器人大会开幕：机器人从秀肌肉到真干活","hook":"今年机器人大会不比谁胳膊粗，比谁真能把活干完。","why":"WRC 2026于8月19日在北京开幕，主题从展示转向实际作业，强时效且贴合AI+机器人热点，此前未讲过。","heat":"中高","tags":["强时效","机器人","趋势"],"facts":["WRC 2026世界机器人大会8月19日在北京开幕，机器人从展示走向实际作业（中国青年报/新京报 08-19）","待核实：具体参展企业数与新品数量未逐条核实"],"scripts":[{"angle":"趋势判断","text":"今年世界机器人大会的信号很清楚：机器人从秀肌肉转向真干活。8月19日北京开幕，展商也不再比谁胳膊粗、谁动作花哨，而是比谁能把完整任务干完。这个拐点的底层逻辑有两条。第一，大模型给机器人补上了脑子，过去是预设动作循环，现在是看得懂场景、能临场决策。第二，落地场景跑通了，工厂分拣、酒店配送、家庭收纳这些高频重复活，机器人性价比开始压倒人力。对普通人来说意义是，机器人离上岗比离展厅更近了，接下来三年会是它从演示视频走进真实车间的窗口期。对打工人最实在的是，重复体力活会被机器人接走，你该把精力挪到沟通和判断上。"},{"angle":"功能详解","text":"这届机器人大会看什么，我帮你划重点。第一看脑子，不少机器人和大模型打通，能听指令、看环境、自己拆步骤，不再是固定程序。第二看手，灵巧手和电子皮肤进步明显，能抓不规则物体、能感知力度，以前夹碎的现在能轻拿。第三看场景，工厂里做分拣装配、楼宇里送文件送咖啡、家里收拾收纳，都是能立刻上岗的活。第四看价格，一些本体成本往下走，租赁模式出现，小厂也用得起。一句话，今年的展品关键词是能交付，不是能表演。普通人怎么蹭这波？两类机会：做机器人周边的培训和运维，新工种会冒出来；小工厂租台分拣机器人比招人稳，别只当热闹看，它已经在改就业结构。"},{"angle":"反常识开场","text":"以前机器人大会最热闹的是跳舞和后空翻，今年画风变了。8月19日北京开幕的世界机器人大会，主角不再是比较谁动作帅，而是比谁能把活干完、干稳、干便宜。这反直觉吗？其实很合理。跳舞再炫，落地为零；能替工厂把分拣干了、替酒店把外卖送上楼，这才是真需求。资本和甲方都清醒了，愿意为能交付的机器人付钱，不为能表演的付钱。所以今年展台上的机器人大多在默默搬东西、叠衣服、拧螺丝，不声不响。秀肌肉的时代过去了，能上岗才是硬通货。对普通人的影响更直接：以后酒店送物、医院导诊、工厂巡检，可能是机器人在干，它不抢所有岗位，但抢重复岗位，该焦虑的是不会用工具的人被会用工具的人替代。"}]},{"id":"ai4","title":"百度AI收入过半，老搜索广告第一次被反超","hook":"百度二季度AI收入占了一半，干了二十年的搜索广告输了。","why":"百度8月18日财报AI收入连续两季过半、GPU云涨283%，多源交叉验证（港交所/人民网/央广网/广州日报），标志性转型事件，此前未讲过。","heat":"高","tags":["强时效","财报","趋势"],"facts":["百度8月18日发布2026年二季度财报：AI业务收入约125亿元，占一般性业务收入50%，连续两季过半（港交所公告/人民网/央广网 08-18~19）","二季度GPU云收入73亿元，同比增长283%，连续四季度三位数增长（百度财报/人民网）","传统在线营销收入131亿元，同比降19%，占一般性业务降至52%（百度财报）","总营收313亿元同比微降4%，净利润23亿元同比降68%（百度财报）","待核实：净利润降幅含投资公允价值等一次性因素影响"],"scripts":[{"angle":"数据向","text":"百度二季报有个里程碑数字：AI业务收入约125亿元，占一般性业务50%，连续两个季度过半。这是它干了二十年的搜索广告第一次被自己的AI业务反超。拆开看，GPU云收入73亿元，同比暴涨283%，连续四个季度三位数增长，是最大引擎；传统在线营销131亿元，同比降19%，占比滑到52%。总营收313亿元微降4%，净利润23亿元降68%，新旧动能切换的阵痛很明显。一句话总结：百度从搜索公司改名叫AI公司，这次财报算是盖章了，只是利润还没跟上收入。对比阿里腾讯，百度最早全押AI，如今最先过半，也算熬出头，但市场还在看利润什么时候跟上。"},{"angle":"趋势判断","text":"百度AI收入过半，不是一家公司的成绩，是行业分水岭。三点判断。第一，搜索广告的黄金时代确认落幕，百度这个靠广告活了二十年的巨头，核心收入第一次由AI撑起，说明流量变现的逻辑在重构。第二，算力成了新石油，百度GPU云涨283%且连续四季度三位数增长，卖铲子的人先赚到钱，这和国产大模型集体爆发是同一件事。第三，利润滞后于收入是行业通病，高盛预计几家大厂今年资本开支合计千亿级美元，短期都承压。对求职者，AI基建岗比应用岗更稳，卖铲子的先收钱；对从业者，信号是AI基建比AI应用更先兑现现金。这份财报提醒，转型疼在利润，爽在收入。"},{"angle":"说人话版","text":"用大白话讲百度这份财报意味着啥。以前百度赚钱靠你在搜索里点广告，现在这块在掉，二季度降了19%。但另一边，它卖算力、卖AI云服务涨疯了，GPU云同比涨283%，把整体AI收入顶到了总营收的一半。等于说，百度这家公司现在一半以上的钱是AI赚的，不再是广告。代价是总利润掉了不少，因为建算力中心烧钱猛。对普通人没直接影响，但长期看，搜索结果里AI生成内容会更多，你问问题它直接给答案，广告位越来越少。对内容创作者，信号是搜索入口在变，SEO那套慢慢失效，做AI能直接引用的优质内容更值钱，你发的东西能被它当信源，流量才稳。这是百度赌了多年的转型，终于在账本上兑现。"}]},{"id":"ai5","title":"百度AI办公三件套爆发，搭子月活环比涨十倍","hook":"百度把AI办公捏成矩阵，其中一个产品月活环比翻了十倍。","why":"人民网/央广网8月19日披露百度搭子、库库AI、秒哒矩阵数据（搭子MAU环比+1063%、秒哒份额33.4%第一），落地含量高，此前未讲过。","heat":"中高","tags":["产品","办公","数据"],"facts":["百度8月完成AI办公产品线整合，形成百度搭子、库库AI、秒哒等矩阵（人民网/央广网 08-19）","百度搭子7月MAU环比增速1063.79%，列AI办公增速榜第一（人民网引榜单）","库库AI办公MAU超2500万，居AI办公赛道第一（人民网）","秒哒3.5版本发布，以33.4%市场份额居AI原生无代码平台第一（沙利文/人民网）","待核实：MAU与份额为第三方榜单口径"],"scripts":[{"angle":"数据向","text":"百度把AI办公捏成了一个矩阵，数据很猛。8月整合出百度搭子、库库AI、秒哒三件套。百度搭子7月月活环比增速1063.79%，直接冲上AI办公增速榜第一；库库AI办公月活超2500万，坐上赛道头把交椅；秒哒发3.5版本，以33.4%市场份额居AI原生无代码平台第一。三个产品分工清楚：搭子管日常问答和办事，库库AI管文档和办公，秒哒管无代码搭应用。这组数字说明AI办公不是概念，已经有人真用起来了，而且增速是指数级的。对竞品是压力，百度把入口和文档生态绑一起，后来者获客更难；对用户是好事，免费工具变强，打工人的重复活有更多可替代。"},{"angle":"功能详解","text":"百度这三件套分别能干啥，说清楚你就知道怎么用。百度搭子，定位日常生产力智能体，问行程、写周报、整理会议纪要，对话就能办。库库AI办公，月活2500万，主打文档处理和办公场景，和百度文库网盘打通，文件直接喂给它。秒哒，无代码应用生成平台，份额33.4%第一，你说想要个什么小工具，它生成能跑的网页应用，不用写代码。三者加起来覆盖从聊天办事到做应用的全链路。亮点是都免费或低门槛起步，普通上班族不用申请预算就能试。和海外比，百度这套更偏办公场景落地，不像有些产品只顾聊天，它把文库网盘当数据底座，这是别的对话产品没有的护城河，普通用户文件不用导来导去。"},{"angle":"创作者视角","text":"百度办公三件套爆发，对做内容的人有三点可抄。第一，AI办公的入口在对话，不是菜单，搭子月活环比翻十倍说明用户要的是说一句就办，不是自己找功能，你做工具也该走自然语言入口。第二，矩阵打法比单品稳，百度用搭子引流、库库留人、秒哒做深，三层漏斗，个人做账号也能用这思路：短视频引流、社群留存、付费产品做深。第三，无代码是普通人杠杆，秒哒份额第一证明不会写代码也能交付应用。建议今天就把重复三件事列出来，挨个试这三件套，能替代的立刻替代。最后一句，工具再强也替代不了你的判断，搭子帮你写周报可以，替你拿主意不行，把重复活交出去，脑子留给自己。"}]}]}]},"2026-08-20":{"date":"2026-08-20","updatedAt":"2026-08-20 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"240小时过境免签扩至57国，这一批人直接受益","hook":"过境免签又扩了，这次不是多几个国家那么简单。","why":"8月20号当天生效的政策更新，强时效，官方一手来源。覆盖出境中转、商贸、探亲三类人群，转发和收藏都高。","heat":"高","tags":["强时效","出境","政策"],"facts":["国家移民管理局 2026-08-20 公告（央视新闻、腾讯新闻 8-20 报道）：即日起吉尔吉斯斯坦、越南公民可适用240小时过境免签及海南入境免签，240小时过境免签适用国由55国增至57国","海南30天免签政策同步适用国由59国增至61国，入境免签便利进一步放宽","240小时过境免签现开放65个对外开放口岸，持联程客票可免签停留不超过240小时（10天），期间可赴24个省区市停留旅游、商贸、访问、探亲","适用方式：从对外开放口岸入境，持有效国际旅行证件和确定日期及座位的联程客票，前往第三国或地区，可在口岸边检办理","政策目标：便利外国人来华旅游、商贸、探亲，促进入境游与中转经济（官方口径）"],"scripts":[{"angle":"干货直给","text":"240小时过境免签又扩了，这次不是多几个国家那么简单。国家移民管理局8月20号公告，吉尔吉斯斯坦和越南公民从今天起也能适用240小时过境免签，还能叠加海南的30天免签，适用国家从55个涨到57个，海南免签从59个涨到61个。落地层面是实打实的便利：现在开放了65个对外开放口岸，你只要拿着联程客票，就能免签停留不超过240小时，也就是10天，期间能在24个省区市旅游、商贸、访问、探亲。办起来也不复杂，从指定口岸入境，出示有效证件和确定日期座位的联程票，去第三国或地区，直接在边检办。这条对做中转生意、赴华探亲、以及想顺道玩几座城市的人，都是直接利好。"},{"angle":"实操流程","text":"想用240小时过境免签，按这个流程走，别卡在边检。第一步，确认你的国籍在57个适用国之列，这轮新增的是吉尔吉斯斯坦和越南。第二步，买一张联程客票，起点是中国口岸，终点必须是第三国或地区，中途停留算过境，不能是买了来回票就想长住。第三步，从65个开放口岸入境，别走错了口岸，进了没开放的口子办不了。第四步，边检现场出示有效国际旅行证件，加上确定日期和座位的联程票，当场办免签，最长停留240小时。第五步，10天内可在24个省区市活动，旅游、商务、探亲都行，但别超期也别改道去没开放的地区。这套政策最适合顺路来华、顺便深度玩几天的人。"},{"angle":"反常识开场","text":"很多人以为免签是给旅游的，其实240小时过境免签最大的受益者是做生意和中转的人。8月20号起，适用国从55个扩到57个，新增吉尔吉斯斯坦和越南，海南30天免签也从59个扩到61个。表面看是多了几个国家的游客，实际上政策设计的核心是便利来华旅游、商贸和探亲。它要求的不是专程来，而是你本来就买联程票去别国、顺道在中国停几天，最长10天，覆盖24个省区市。对商务客尤其友好，几个城市连着谈、顺路探亲，签证成本直接归零。所以别只盯着旅游这一种用法，商贸和探亲这两类人，才是政策真正想接住的。"}]},{"id":"tv2","title":"暑运返程高峰来了，8月下旬机票反而更便宜","hook":"别等开学，机票最便宜的窗口就在这两周。","why":"强反直觉，返程高峰叠加降价，适合做低成本口播。人人有用，时效到8月底。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["2026年暑运为7月1日至8月31日共62天，8月中下旬迎来返程最高峰，学生流、探亲流、旅游流三流叠加（芜湖新闻网 8-18）","芜宣机场暑期票价示例（不含机建燃油）：飞北京485元、成都350元、重庆260元、三亚545元（芜湖新闻网 8-18）","高铁在500至800公里区间分流大量客流，迫使航司在该区间降价应对（同来源）","新浪财经：8月20日之后机票价格整体回落20%至30%，8月25日前后为低点，周二、周三出发最便宜","中秋国庆临近，暑运后期机票大幅反弹概率低，建议错峰在8月下旬下单（综合口径）"],"scripts":[{"angle":"干货直给","text":"暑运返程高峰来了，但机票反而更便宜，这事反直觉。今年暑运7月1号到8月31号共62天，8月中下旬是返程最高峰，学生、探亲、旅游三股人流撞在一起。按理说该涨价，可实际是跌的。新浪的数据，8月20号之后机票整体回落两到三成，8月25号前后是低点，周二周三出发最便宜。为什么？高铁在500到800公里这段抢走了大量客人，航司被迫降价。芜宣机场现在的票价，飞北京485、成都350、重庆260、三亚545，都不含机建燃油。所以别被返程高峰吓住，真要买，就盯着8月下旬这两天，越接近开学越便宜，等中秋国庆一来，价格立刻回去了。"},{"angle":"数据向","text":"给几个具体数，你看看到底便宜多少。今年暑运62天，8月中下旬返程最猛，三流叠加。芜宣机场的票价样本：飞北京485元、成都350元、重庆260元、三亚545元，不含机建燃油。放到全国看，新浪财经说8月20号之后机票整体回落20%到30%，8月25号前后最低。背后的推手是高铁，500到800公里这个区间，高铁又快又稳，把大量客流吸走了，航司不降价就空座。所以这条线的规律是：短中途航线越被高铁覆盖，机票越容易跳水。想捡漏，周二周三出发，避开学前一天，价格能差出好几百。等到中秋国庆叠加，这波低价基本就结束了。"},{"angle":"避坑清单","text":"暑运返程买票，别踩这几个坑。第一，看到返程高峰就以为一定贵，其实8月下旬是全年低价窗口，8月25号前后最低，别提前一个月恐慌下单。第二，别只盯飞机，500到800公里这段高铁很有竞争力，算上往返机场时间和折腾，高铁未必慢多少，适合带老人小孩。第三，周二周三出发最便宜，周五和周日最贵，差一两天价格能差三成。第四，票价写的不含机建燃油，下单时看总价。第五，芜宣机场这种样本，飞北京485、重庆260，看着低但加上机建燃油和机场往返，未必比高铁划算，先比总账再决定。第六，别等中秋国庆，那会儿价格直接回去。"}]},{"id":"tv3","title":"双节最火目的地TOP10出炉，西南西北长线走热","hook":"国庆去哪人最多？数据已经提前泄露了。","why":"航旅纵横官方预订数据，强时效，适合做决策参考。长线趋势明显，有反差。","heat":"高","tags":["强时效","国内游","可复用"],"facts":["航旅纵横截至8月11日数据：9月25日至10月7日国内机票预订超171万张，同比增长7%；出入境机票预订超128万张，同比增长11%（航旅纵横 8月）","国内机票预订量前十目的地：北京、上海、广州、成都、深圳、昆明、乌鲁木齐、重庆、西安、杭州","西南、西北长线目的地预订走高，乌鲁木齐、昆明、西安进入前十，长线游趋势明显","中秋（9月25-27）+国庆（10月1-7）中间仅隔三个工作日，形成13天超长假期窗口，推高长途出行意愿","综合口径：长线目的地机票越早订越稳，热门城市假期前两周价格显著上扬"],"scripts":[{"angle":"干货直给","text":"国庆去哪人最多，数据提前泄露了。航旅纵横截至8月11号的数据，9月25号到10月7号国内机票预订已经超过171万张，同比涨了7%，出入境订票超128万张，同比涨11%。国内前十目的地排出来：北京、上海、广州、成都、深圳、昆明、乌鲁木齐、重庆、西安、杭州。注意后半段，乌鲁木齐、昆明、西安这些西南西北长线全挤进前十，说明今年大家不是就近玩，是愿意跑远路。原因很简单，今年中秋加国庆中间只隔三个工作日，拼一下就是13天超长假期，长途才有意义。所以如果你要去这些城市，现在订还来得及，再晚两周价格明显上扬，热门航班也会紧。"},{"angle":"数据向","text":"把双节预订的数字摆一摆。航旅纵横的口径，9月25号到10月7号，国内机票预订171万张以上，同比增7%；出入境128万张以上，同比增11%，出境恢复快于国内。国内前十：北京、上海、广州、成都、深圳、昆明、乌鲁木齐、重庆、西安、杭州。这条榜有两点反常。第一，西南西北长线集体靠前，乌鲁木齐、昆明、西安都在，长线游今年明显升温。第二，成都和重庆同时进前十，成渝作为中转和目的地双热门。结论：今年双节是长途年，不是周边年。对应的策略，长线机票越早锁越稳，热门城市的酒店假期前两周就涨，能现在订就别拖。"},{"angle":"趋势判断","text":"从双节预订榜能读出三个走向。第一，长途游回来了。国内前十里乌鲁木齐、昆明、西安这些西南西北长线全在，往年周边游占大头，今年明显往远处走，背后是中秋国庆拼出13天超长假的窗口效应。第二，出境比国内恢复快，航旅纵横的数据出入境预订同比增11%，高于国内的7%，说明憋了几年的游客更愿意跑远。第三，热门城市的预订节奏在提前，8月中旬就已经171万张，越往后只会越紧。对普通人来说，两条建议最实在：长线机票现在就锁，酒店只订可免费取消的房型；别等临近放假再抢，那会儿价格和人流都在高位，选择也最少。"}]},{"id":"tv4","title":"旅行社说收客已过75%，欧洲线同比翻了一倍多","hook":"说旅游冷的人，看看旅行社的收客数据。","why":"有官方披露的落地数字，反差强，信息差大。可引出跟团与自由行对比的实用方法论。","heat":"中高","tags":["信息差","出境","数据"],"facts":["众信旅游截至8月12日数据：十一收客占比已达75%，同比节奏更快；整体报名人数同比增长约70%（众信旅游；证券时报、ttgchina 8月13-14日）","欧洲线预订占比接近一半，赴欧报名同比增长140%","北美线同比增长480%，澳新线同比增长326%","背景：今年长假叠加免签扩容，出境长线需求集中释放","综合口径：长线出境复苏明显，但当地地接成本仍处高位，跟团价降幅有限"],"scripts":[{"angle":"干货直给","text":"说旅游冷的人，看看旅行社的收客数据。众信旅游截至8月12号，十一假期的收客占比已经到75%，比去年同期
