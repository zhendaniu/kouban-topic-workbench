<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="选题台">
<meta name="theme-color" content="#1e293b">
<title>每日选题 · 口播稿工作台</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16191d; --text2:#666e7a; --text3:#98a1ad;
  --line:#e6e8ec; --line2:#f0f1f4;
  --primary:#2563eb; --primary-d:#1d4ed8;
  --travel:#0d9488; --travel-bg:#e7f6f4;
  --ai:#7c3aed; --ai-bg:#f1eafe;
  --danger:#dc2626; --danger-bg:#fdecec;
  --ok:#16a34a; --ok-bg:#e8f6ec;
  --warn:#d97706; --warn-bg:#fdf3e3;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.hd{background:#1e293b;color:#fff;padding:14px 0 16px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.045)}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd-sub{font-size:12.5px;color:#a8b4c6;margin-top:3px}
.hd-acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:rgba(255,255,255,.11);color:#e7edf5;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn svg{width:14px;height:14px;flex:none}

.tipbar{background:var(--warn-bg);color:#8a5a08;font-size:13px;padding:9px 14px;display:none;align-items:center;gap:8px;border-bottom:1px solid #f2e3c6}
.tipbar.on{display:flex}
.tipbar button{margin-left:auto;font-weight:700;color:#8a5a08;padding:4px 8px;font-size:12.5px}

/* ---------- section / card ---------- */
.sec{margin-top:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-hd h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sec-hd .cnt{font-size:12px;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- today ---------- */
.today{background:linear-gradient(180deg,#fff 0,#fcfdff 100%);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.today-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.today-h .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;animation:bp 1.8s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
.today-h h2{font-size:15.5px;margin:0;font-weight:700}
.today-h .n{margin-left:auto;font-size:12px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#f7f8fa;border-radius:10px;padding:9px 8px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--text2)}
.stat.od b{color:var(--danger)}
.stat.dn b{color:var(--ok)}
.tlist{display:flex;flex-direction:column;gap:7px}
.titem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:#f7f8fa;font-size:13.5px}
.titem.od{background:var(--danger-bg)}
.titem .bd{flex:1;min-width:0}
.titem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .m{font-size:11.5px;color:var(--text2);margin-top:1px}
.titem.od .m{color:#b03636}
.titem .go{flex:none;background:var(--text);color:#fff;border-radius:8px;padding:0 12px;height:34px;font-size:12.5px;font-weight:600}
.titem.od .go{background:var(--danger)}
.empty{text-align:center;padding:22px 12px;color:var(--text3);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.3;display:block;margin:0 auto 8px}

/* ---------- track tabs ---------- */
.ttabs{display:flex;gap:8px;margin-bottom:12px}
.ttab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 8px;text-align:center;font-weight:700;font-size:13.5px;color:var(--text2);min-height:46px;transition:.15s}
.ttab .s{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:1px}
.ttab[data-k="travel"].on{background:var(--travel-bg);border-color:var(--travel);color:#0b6b62}
.ttab[data-k="ai"].on{background:var(--ai-bg);border-color:var(--ai);color:#6127c4}
.ttab[data-k="all"].on{background:#e8eefc;border-color:var(--primary);color:var(--primary-d)}
.ttab.on .s{color:inherit;opacity:.75}

/* ---------- topic ---------- */
.topic{margin-bottom:12px;overflow:hidden}
.tp-hd{padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.tp-idx{flex:none;width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
.tk-travel .tp-idx{background:var(--travel)}
.tk-ai .tp-idx{background:var(--ai)}
.tp-main{flex:1;min-width:0}
.tp-t{font-size:15.5px;font-weight:700;line-height:1.42;letter-spacing:.1px}
.tp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;padding:2.5px 7px;border-radius:6px;background:#f0f1f4;color:var(--text2);font-weight:600}
.tk-travel .tag.hot{background:var(--travel-bg);color:#0b6b62}
.tk-ai .tag.hot{background:var(--ai-bg);color:#6127c4}
.tag.hot{font-weight:700}
.tp-why{margin-top:9px;font-size:13px;color:var(--text2);background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.55}
.tp-why b{color:var(--text);font-weight:700}
.fold{border-top:1px solid var(--line2)}
.fold-b{width:100%;text-align:left;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;min-height:44px}
.fold-b svg{width:13px;height:13px;transition:.2s}
.fold-b.open svg{transform:rotate(90deg)}
.fold-c{display:none;padding:0 14px 13px}
.fold-c.open{display:block}
.facts{margin:0;padding-left:17px}
.facts li{font-size:12.8px;color:var(--text2);line-height:1.62;margin-bottom:5px}

/* ---------- script ---------- */
.scripts{border-top:1px solid var(--line2);padding:11px 14px 13px;background:#fbfcfd}
.sc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.sc:last-child{margin-bottom:0}
.sc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc-a{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f7;color:#41546b}
.sc-m{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.sc-st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.st-new{background:#f0f1f4;color:var(--text2)}
.st-pick{background:var(--warn-bg);color:#a15c06}
.st-shot{background:#e8eefc;color:var(--primary-d)}
.st-pub{background:var(--ok-bg);color:#15803d}
.sc-tx{font-size:14px;line-height:1.78;color:#252a31;max-height:78px;overflow:hidden;position:relative;transition:max-height .25s;cursor:pointer}
.sc-tx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.sc-tx.open{max-height:2000px}
.sc-tx.open::after{display:none}
.sc-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);border-radius:9px;padding:0 11px;height:38px;font-size:12.5px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:#fff}
.sbtn svg{width:13px;height:13px}
.sbtn:hover{background:#f7f8fa}
.sbtn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.sbtn.pri:hover{background:#2b3138}
.sbtn.act{background:var(--ok-bg);border-color:#bfe3c9;color:#15803d}
.sbtn.od{background:var(--danger-bg);border-color:#f3cfcf;color:var(--danger)}

/* ---------- refs ---------- */
.form{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);min-height:46px}
.form textarea{min-height:74px;resize:vertical;line-height:1.6}
.frow{display:flex;gap:9px}
.frow>*{flex:1;min-width:0}
.stars{display:flex;gap:3px;align-items:center}
.star{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.star svg{width:21px;height:21px}
.star svg path{fill:#dfe3e8}
.star.on svg path{fill:#f5a623}
.ref{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ref:last-child{border-bottom:none}
.ref-h{display:flex;align-items:flex-start;gap:9px}
.ref-t{font-weight:700;font-size:14.5px;flex:1;min-width:0;line-height:1.45}
.ref-m{font-size:12px;color:var(--text3);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ref-n{font-size:13px;color:var(--text2);margin-top:7px;background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ref-l{font-size:12.5px;margin-top:6px;word-break:break-all;display:inline-block}
.xbtn{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.xbtn:hover{background:var(--danger-bg);color:var(--danger)}
.xbtn svg{width:15px;height:15px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text3);min-height:56px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--primary)}
.nav .bdg{position:absolute;top:5px;margin-left:22px;background:var(--danger);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:8px;font-weight:700}

/* ---------- teleprompter ---------- */
.tele{position:fixed;inset:0;background:#0e1116;color:#f2f4f7;z-index:200;display:none;flex-direction:column}
.tele.on{display:flex}
.tele-hd{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #232a33;flex:none}
.tele-hd .tt{font-size:13px;color:#8e9aa8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{background:#1c222b;color:#cfd7e0;border-radius:8px;min-width:40px;height:38px;padding:0 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbtn svg{width:15px;height:15px}
.tele-bd{flex:1;overflow-y:auto;padding:24px 20px 90px;-webkit-overflow-scrolling:touch}
.tele-tx{font-size:26px;line-height:2.05;letter-spacing:.6px;max-width:820px;margin:0 auto;white-space:pre-wrap}
.tele-ft{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0),#0e1116 32%);display:flex;gap:8px;align-items:center;justify-content:center}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.modal h3{margin:0 0 8px;font-size:16.5px}
.modal p{margin:0 0 16px;color:var(--text2);font-size:13.5px;line-height:1.65}
.modal-a{display:flex;gap:9px}
.modal-a button{flex:1;height:46px;border-radius:11px;font-weight:700;font-size:14px}
.mb-c{background:#f0f1f4;color:var(--text)}
.mb-d{background:var(--danger);color:#fff}

/* ---------- toast / misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(84px + env(safe-area-inset-bottom));background:#16191d;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pane{display:none}
.pane.on{display:block}
.datesel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-bottom:11px;flex-wrap:wrap}
.datesel select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:14px;font-weight:600;color:var(--text)}
.badge-live{font-size:10.5px;background:var(--ok-bg);color:#15803d;padding:3px 7px;border-radius:6px;font-weight:700}
.badge-old{font-size:10.5px;background:var(--warn-bg);color:#a15c06;padding:3px 7px;border-radius:6px;font-weight:700}
.foot{text-align:center;color:var(--text3);font-size:11.5px;padding:22px 12px 8px;line-height:1.7}

@media(min-width:768px){
  body{padding-bottom:24px}
  .wrap{padding:0 22px}
  .hd{padding:18px 0 20px}
  .hd-title{font-size:19px}
  .nav{position:static;background:transparent;backdrop-filter:none;border-top:none;border-bottom:1px solid var(--line);max-width:1180px;margin:14px auto 0;padding:0 22px;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13.5px;padding:11px 15px;border-radius:10px 10px 0 0;min-height:46px}
  .nav button.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}
  .nav .bdg{position:static;margin-left:2px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .topics-grid .topic{margin-bottom:0}
  .tele-tx{font-size:31px}
}
@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hbtn span{display:none}
  .hbtn{padding:8px 10px}
}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap hd-row">
    <div>
      <div class="hd-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 22V12"/></svg>
        每日选题 · 口播稿台
      </div>
      <div class="hd-sub" id="hdSub">加载中…</div>
    </div>
    <div class="hd-acts">
      <button class="hbtn" onclick="doExport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>导出备份</span></button>
      <button class="hbtn" onclick="document.getElementById('impFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg><span>导入恢复</span></button>
      <button class="hbtn" onclick="askClear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span>清空</span></button>
    </div>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">

<div class="tipbar" id="tipbar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px;height:16px;flex:none"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
  <span id="tipTx"></span>
  <button onclick="hideTip()">知道了</button>
</div>

<div class="nav" id="nav">
  <button class="on" data-p="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>今天要处理<span class="bdg" id="navBdg" style="display:none">0</span></button>
  <button data-p="topics" onclick="go('topics')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>选题池</button>
  <button data-p="scripts" onclick="go('scripts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>口播稿库</button>
  <button data-p="refs" onclick="go('refs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>对标灵感</button>
</div>

<div class="wrap">

  <!-- ============ 今天要处理 ============ -->
  <div class="pane on" id="p-today">
    <div class="sec">
      <div class="today">
        <div class="today-h">
          <span class="dot"></span><h2>今天要处理</h2>
          <span class="n" id="todayN"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tlist" id="tlist"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hd"><h2>今日速览</h2><span class="cnt" id="ovCnt"></span></div>
      <div id="overview"></div>
    </div>
    <div class="foot" id="foot1"></div>
  </div>

  <!-- ============ 选题池 ============ -->
  <div class="pane" id="p-topics">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel" onchange="switchDate(this.value)"></select>
        <span id="dateBadge"></span>
      </div>
      <div class="ttabs" id="ttabs1"></div>
      <div id="topicList"></div>
    </div>
    <div class="foot" id="foot2"></div>
  </div>

  <!-- ============ 口播稿库 ============ -->
  <div class="pane" id="p-scripts">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel2" onchange="switchDate(this.value)"></select>
        <span id="dateBadge2"></span>
      </div>
      <div class="ttabs" id="ttabs2"></div>
      <div class="ttabs" id="stfilter" style="margin-top:-4px"></div>
      <div id="scriptList"></div>
    </div>
    <div class="foot" id="foot3"></div>
  </div>

  <!-- ============ 对标灵感 ============ -->
  <div class="pane" id="p-refs">
    <div class="sec">
      <div class="sec-hd"><h2>加一条对标</h2></div>
      <div class="card">
        <div class="form">

<script id="packToday" type="application/json">{"date":"2026-09-09","updatedAt":"2026-09-09 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"国庆机票近三年最友好窗口，现在不动手就晚了","hook":"今年国庆机票不涨反降，这是三年没见过的低位。","why":"中秋国庆仅隔三天，请3休13把出行拉散，叠加运力充裕，机票创下三年低位。现在卡在最佳下单区间，过了9月中旬价值快速回落，全民相关转发收藏高。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["2026年中秋为9月25日(周五)至27日(周日)共3天，国庆为10月1日(周四)至7日(周三)共7天，二者仅隔3天，'请3休13'拼出全年最长出游窗口（同程旅行/人民网重庆频道 2026-09-02）","同程旅行数据：9月22日'抢跑'出发机票均价较中秋首日(9/25)低30%、较国庆首日(10/1)低50%；9月27日至10月1日机票均价创近三年同期最低（今日头条引同程 2026-09-08）","央视网/经济观察报：2026年国庆航班总量较去年增长约6.2%，运力充裕+拼假分散出行，机票不涨反降（新浪财经 2026-09-03）","北京直飞太原230元、直飞郑州160元，均为1折左右；9月仍有大量1折机票在售（人民网重庆频道 2026-09-02）","截至8月31日，出行日期9月25日至10月7日的国内航线机票预订量超383万张，同比增长约17%（同程旅行 2026-09-06）"],"scripts":[{"angle":"干货直给","text":"今年国庆机票出现近三年最友好的价格窗口，原因有三个。第一，中秋9月25号和国庆10月1号只隔三天，请9月28、29、30三天年假就能拼出13天长假，出行时间被拉散，不再集中扎堆。第二，今年国庆航班总量比去年多约6.2%，运力充裕，航司不用靠涨价填舱。第三，现在是下单低位区间：9月22号抢跑出发比国庆首日便宜一半，9月27到10月1号均价创三年最低，北京飞太原230、飞郑州160都是1折。提前一个月锁票的热度同比涨了两成，另外燃油费7月已经下调，长线还能再省。该动手了，别等9月下旬价格回弹。"},{"angle":"实操流程","text":"想吃到这波国庆低价，按这个顺序走。第一步，先递年假条，请9月28、29、30三天，拼出13天，工龄满一年就有至少五天年假，够用。第二步，别倒过来先买票后请假，批不下来退票手续费能吃掉半张机票。第三步，订票卡时间：9月22号抢跑出发最划算，比国庆首日便宜50%；9月27到10月1号是三年最低区间，北京飞太原230、飞郑州160都是1折。第四步，酒店只订能免费取消的房型，热门城市假期前一个月就可能满房，先占位后调整。第五步，学生和家庭认证别忘了做，机票最高省20%。假条这周就交，晚一周价格就开始回弹。"},{"angle":"反常识开场","text":"越晚订国庆机票越便宜，这句话今年居然对了。往年长假机票是越拖越贵，今年反了：9月27到10月1号均价创下近三年同期最低，北京飞太原230、飞郑州160都是1折，比国庆首日便宜一半。背后的原因是运力比需求跑得快——今年国庆航班总量同比多了约6.2%，中秋和国庆又只隔三天，请三天假就能拼出13天，大家出行时间被拉散，不再挤在同一天抢票。所以现在的低位不是错觉，是结构性宽松。但这个窗口不会一直开，9月下旬价格就会随预订升温往上走，想捡漏得趁这两周，错过就要等明年了。机票的事，早定早安心，越拖选择越少。"}]},{"id":"tv2","title":"9月错峰游黄金窗：1折机票加酒店降五成","hook":"暑运一停，机票酒店直接腰斩，现在出去最划算。","why":"暑期亲子退潮、国庆未启，9月是民航传统淡季，价格进入全年低谷。银发族与白领接棒成主力，赏秋同步开启，性价比和体验兼得，适合做错峰攻略合集。","heat":"高","tags":["省钱","淡季","可复用"],"facts":["同程旅行特价机票榜：9月错峰出行机票价格比中秋国庆假期便宜三到四成，较9月30日最高点便宜一半以上（央广网/今日头条 2026-09-08）","同程数据：中秋假期前酒店均价较8月下降三四成，部分度假型酒店降幅达五成以上（今日头条引同程 2026-09-08）","9月错峰出游主力为55岁以上银发族与用年假拆3-4天假的年轻白领；美团数据20-30岁'淡季游'人群占比近50%（央广网 2026-09-08）","赏秋窗口期：九寨沟、稻城亚丁、喀纳斯、恩施率先进入赏秋；途牛优选上饶、北京、阿勒泰、黄山、大兴安岭、呼伦贝尔等（今日头条 2026-09-08）","北京-太原200元(1.5折)、北京-大连200元、北京-杭州290元(1.2折)等1折机票集中上线，多数为早/晚班或经停航班余票有限（中国吉林网/南昌新闻网 2026-09-08）"],"scripts":[{"angle":"干货直给","text":"9月是全年出游的性价比洼地，两个数字就能说明问题。机票方面，错峰出行比中秋国庆假期便宜三到四成，比9月30号最高点便宜一半以上，北京飞太原200、飞大连200、飞杭州290都是1.2到1.5折。酒店更狠，中秋前的均价比8月降了三四成，部分度假型酒店降幅超过五成，某热门二线城市五星9月七百多，国庆直接涨到一千到一千四。为什么这么便宜？暑期亲子客流退了，国庆还没来，运力却还满着。再加上今年气候舒服，秋高气爽，是少有的便宜又舒服的窗口。想出门的，这半个月是全年最好的时机，再晚两周价格就上去了。"},{"angle":"故事切入","text":"我妈今年第一次主动问我，9月能不能带她出去转转。以前她嫌贵嫌挤，现在9月错峰她反而愿意了。数据也印证了这点：今年9月错峰出游的主力是55岁以上的银发族，和用年假拆出三四天假的年轻白领，两拨人接了暑期的班。机票比假期便宜三到四成，酒店比8月降三四成，部分度假酒店直接降五成。银发族偏爱慢节奏康养和初秋赏景，年轻人更爱周边微度假和错峰徒步。一边是价格红利，一边是九寨沟、喀纳斯、恩施这些地方刚进赏秋窗口，实惠和体验这次真的兼得了。想带父母出门的，这会儿最合适，人少价低还舒服。趁凉快赶紧安排，国庆就别想了。"},{"angle":"数据向","text":"给几个具体数字，你自己判断值不值。机票：北京飞太原200元1.5折、北京飞大连200元、北京飞杭州290元1.2折，9月这批1折票集中在早班、晚班和经停航班，余票有限先到先得。酒店：中秋前均价较8月降三四成，某二线城市五星从一千多掉到七百多，国庆又弹回一千四。人群：20到30岁的淡季游占比接近一半，55岁以上银发族成了主力。目的地：九寨沟、稻城亚丁、喀纳斯、恩施率先进赏秋期。一句话，9月的价格低谷加秋色上线，是全年难得的价格和体验双高区间，错过要等明年这时候才有。机会一年就这一回，别等旺季再后悔。"}]},{"id":"tv3","title":"240小时过境免签扩至57国，反向玩国内正当时","hook":"我们往外跑，老外正扎堆用免签来中国。","why":"8月20日过境免签再扩圈，适用国家达57国，权威来源清晰。可借'外国人来华热'反向推荐被低估的二三线国内目的地，角度新、有反差。","heat":"中高","tags":["免签","反向游","有争议"],"facts":["国家移民管理局2026年8月20日公告：自当日起吉尔吉斯斯坦、越南公民可适用240小时过境免签，适用国家增至57国；海南30天入境免签增至61国（中国政府网 2026-08-20）","57国公民持普通护照+确定日期行程的联程客票，可从24省65个开放口岸免签入境，停留不超240小时(10天)（国家移民局官网 nia.gov.cn）","2026年1月8日公安部通报：240小时过境免签实施一年来，全国各口岸入境外国人4060万人次，同比增27.2%（快懂百科引公安部 2026-01-08）","停留期间可从事旅游、商贸、访问、探亲等短期活动；工作、学习、新闻采访须事先办妥签证（国家移民局）","反向视角：2026上半年入境外国人2291.4万人次同比+20.4%，老外偏爱空调好、山海资源好、消费不贵的二三线城，国内反向打卡值得做（参考国家移民局/腾讯新闻数据）"],"scripts":[{"angle":"干货直给","text":"中国的过境免签朋友圈又扩大了。8月20号起，吉尔吉斯斯坦和越南公民也能用240小时过境免签来华，适用国家从55个涨到57个，海南30天入境免签也扩到61国。具体怎么用：57国公民拿普通护照，加上一张确定日期和行程的联程客票，就能从24个省65个开放口岸免签进来，最多待10天，旅游、商贸、探亲都行，但工作学习和新闻采访得另外办签证。这个数字不是摆着看的，公安部通报过境免签实施一年，各口岸入境外国人已经有4060万人次，同比涨了27.2%。来华的门越开越大，对做文旅和生意的人都是实打实的增量，值得认真研究。"},{"angle":"反常识开场","text":"最有意思的旅游信号，藏在老外的行程里。上半年入境外国人2291.4万人次，同比涨了20.4%，其中免签入境占了大头。他们来干啥？避暑、赏秋、吃本地饭。海外社交平台上被反复提的是三个词：全域空调、山海生态、消费科技感——这恰恰是我们习以为常、反而不去的。所以反向操作的思路是：老外觉得值的东西，国内往往被低估。那些空调覆盖好、山海资源好、消费又不贵的二三线城，比如东北、西南一些小城，现在机票酒店双双低位，正好反向打卡一趟，性价比比挤热门景区高得多，体验还更舒服。这种反向思路，今年特别值得试一试。"},{"angle":"横向对比","text":"把中外免签放一起看，结论很清楚：来华的门槛在降，出去的门槛也在降，但玩法不一样。中国这边，240小时过境免签已经覆盖57国、65个口岸，停留10天，一年带来4000多万人次入境，带动的是二三线城市的文旅消费。我们自己出去，新马泰菲等热门地也早就是免签或落地签，北京飞太原这种国内线9月才200块。所以别只盯着出国，国内这波错峰加上免签带火的二三线目的地，机票酒店都在低位，体验还不挤。同样预算，反向玩国内，性价比反而更高，而且不用办签证、不用担心语言，说走就走。国内游的性价比，现在正处在高位。"}]},{"id":"tv4","title":"平台省钱工具盘点：口令、百元特价、燃油费下调","hook":"订票前先搜这几个词，到手价能再降一截。","why":"纯实操向，时效性强且不过期。把各平台口令、百元特价专区、燃油费下调、会员日整合成一键操作清单，收藏率高，适合做成常青攻略。","heat":"中高","tags":["省钱","实操","收藏向"],"facts":["去哪儿APP搜'国庆福利'可领全国百城酒店补贴(95折)、燃油全免券(800km以上最高减70元)、机票优惠券(20元家庭券/15元往返券)，低价航线低至200元（腾讯新闻 2026-09-08）","同程搜'机票10'进入百元特价专区，可设出发地+目标价系统24小时盯价；每周三0元机票秒杀（中国经济新闻网 2026-09）","燃油附加费自2026年7月5日起下调，800公里以上航线每张直降50元（新浪财经 2026-09-03）","航司会员日特价：南航每月28号、东航18号、国航15号常放特价票（腾讯新闻/新浪 2026-09）","学生认证机票最高省20%、火车票5折；家庭认证退改签手续费最高减100元（同程/中国经济新闻网 2026-09）"],"scripts":[{"angle":"实操流程","text":"订国庆机票前，先把这几个工具过一遍，到手价能再压一截。第一，去哪儿APP搜'国庆福利'，能领百城酒店95折、燃油全免券和机票优惠券，低价航线直接到200元档。第二，同程搜'机票10'进百元特价专区，设好出发地和目标价，系统24小时帮你盯价，每周三还有0元秒杀。第三，别忽略燃油费，7月5号起800公里以上每张直降50元，长线能省不少。第四，卡航司会员日：南航28号、东航18号、国航15号常放特价。第五，做完学生或家庭认证，机票最高省20%，退改签手续费也能减。顺序是先认证、再囤券、最后比价下单，别乱了。"},{"angle":"干货直给","text":"机票的隐形降价渠道，很多人根本没用。去哪儿搜'国庆福利'，酒店补贴95折、燃油全免券、机票20元家庭券和15元往返券一次性领齐，低价航线能到200元。同程搜'机票10'进百元特价专区，设好目标价让系统帮你盯，每周三0元秒杀。燃油附加费7月5号起已经下调，800公里以上每张直降50元，这是实打实的普惠。再有就是航司会员日：南航28号、东航18号、国航15号，这几天的特价票最密集。学生和家庭的认证也别忘了，机票最高省20%，退改签手续费最高减100。这些叠加起来，比直接搜裸价便宜一大截，下单前花五分钟就回本了。"},{"angle":"避坑清单","text":"用平台优惠，有五条要先说清楚。第一，口令和补贴大多有城市和时段限制，领之前看清楚适用航线，别到付款才发现自己不在范围。第二，燃油全免券每天要抢，额度有限先到先得，不是领了就一定用得上。第三，百元特价专区的票多为早班晚班或经停，余票少，确定行程再锁。第四，学生和家庭认证要提前做，认证完才能叠加减免，临时补来不及。第五，付款前核对勾选项，把延误险、接机券这类默认勾上的增值服务取消，别为用不上的东西多花钱。优惠用对是省钱，用错反而添堵，这几条过完再下单。省下的都是真金白银，别嫌麻烦。"}]},{"id":"tv5","title":"返程避坑：10月3-4日出发比首日便宜两成","hook":"别都挤10月1号走、7号回，中间走最香。","why":"实操避坑向，时效强。很多人只会卡出发日，忽略节中出发和返程日的选择，信息差明显，收藏和转发价值高。","heat":"中","tags":["避坑","省钱","时效"],"facts":["返程高峰分散在10月4日至7日，10月4日机票均价比去年返程期间低超两成，比10月6-7日便宜（人民网重庆 2026-09-02）","9月30日(假期前一天)是价格高峰：成都飞北京/上海/广州不含税最低均超600元，比节中贵30%以上（新浪财经 2026-09-03）","经济观察报：10月3日-4日是假期价格洼地，比首日和返程高峰便宜20%以上（新浪财经 2026-09-03）","错峰建议：灵活请假族选10月3-4日出发、10月5日返程，请2天假拼出9天，性价比最高（新浪财经 2026-09-03）","避坑提示：频繁刷新同一航线易触发动态溢价；付款前取消延误险等增值服务；廉航行李额度需提前核对（中国经济新闻网 2026-09）"],"scripts":[{"angle":"干货直给","text":"国庆出行最容易踩的坑，是出发和返程都卡在最高峰。9月30号是假期前一天的价格顶点，成都飞北京、上海、广州不含税最低都超600，比节中贵三成以上。返程也别都挤10月6、7号，那是返程最高峰。真正的价格洼地在10月3到4号，比首日和返程高峰都便宜两成以上，而且10月4号返程比去年返程低超两成。所以灵活的人这么排：10月3、4号出发，10月5号回，请两天假拼出9天，钱花得最少、人还最少。前提是你能请动这两天假，卡死在法定假期的就只能在9月27到10月1号这个低价区间里选了，也别硬挤首日。"},{"angle":"反常识开场","text":"国庆最便宜的走法，是别人都不走的日子。大多数人习惯10月1号出发、7号回，结果这两天全是价格高峰，9月30号更离谱，成都飞北上广不含税都超600。反着来反而省：10月3到4号出发，比首日和返程高峰便宜两成以上，这就是假期里的价格洼地。返程选10月5号，比挤6、7号便宜，而且10月4号返程本身就比去年同期低两成多。原理很简单，假期中段大家都在玩，没人动身，运力空着，价格自然掉下来。能请两天假把行程挪到中段的人，是用时间换了真金白银，比硬扛高峰划算太多。两天假换一趟便宜又清净的旅程，值。"},{"angle":"避坑清单","text":"国庆订票五条避坑，照着核对一遍。第一，出发别选9月30号，这是价格顶点，成都飞北上广都不含税超600。第二，返程避开10月6、7号最高峰，选10月4、5号更便宜。第三，价格洼地在10月3、4号出发，能请两天假就拼出9天高性价比行程。第四，别反复刷新同一条航线，容易触发平台的动态溢价，越刷越贵。第五，付款前把延误险、接机券这些默认勾上的增值服务取消，廉航还要提前核对行李额度。把这五条过完，这趟的钱基本就花在刀刃上了，剩下的预算够你在目的地多吃几顿好的。细节抠到位，整趟行程才真省钱。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"2B小模型打赢12B谷歌Gemma，端侧Agent雏形出现","hook":"2B参数干翻6倍大的谷歌模型，端侧要变天了。","why":"面壁MiniCPM5-2B开源，AA榜单4B以下第一，智能密度超Gemma 4 12B。国产端侧突破，情绪和实用性都足，评论区易讨论。","heat":"高","tags":["强时效","国产","端侧"],"facts":["9月8日面壁智能联合OpenBMB开源端侧语言基座模型MiniCPM5-2B，参数规模仅2B（腾讯新闻/智东西 2026-09-09）","Artificial Analysis榜单：MiniCPM5-2B以23分位列全球4B以下开源模型第一，智能密度高于Qwen3.5 9B及约6倍参数的谷歌Gemma 4 12B（腾讯新闻 2026-09-09）","智能体指标Agentic Index得分20分，同级模型均低于10分；已完成英特尔、瑞芯微、Arm首日适配（智东西/腾讯新闻 2026-09-09）","同步开源强化学习框架Meshy、策略JustRL II、训练配方与配套数据集，可复现可验证；MiniCPM系列下载量破5000万（腾讯新闻 2026-09-09）","意义：端侧小模型开始具备通用Agent雏形，办公/生活场景本地化部署成本有望进一步下降（行业分析 2026-09-09）"],"scripts":[{"angle":"干货直给","text":"面壁智能昨天开源了个2B的小模型MiniCPM5-2B，参数只有20亿，却在Artificial Analysis榜单上拿下了全球4B以下开源模型第一。最炸的是智能密度：它比Qwen3.5的9B版本还聪明，甚至干翻了参数约为它6倍的谷歌Gemma 4 12B。在衡量Agent能力的Agentic Index上拿了20分，同级模型连10分都不到。更关键的是它已经和英特尔、瑞芯微、Arm完成了首日适配，意思是手机、PC、开发板这些端侧设备能直接跑。面壁还把强化学习框架Meshy、训练配方和数据集全开源了，下载量已经破5000万。小模型开始有通用Agent的样子了，端侧智能这次是真落地。"},{"angle":"说人话版","text":"用大白话讲讲这个2B小模型为什么值得关注。第一，它小，只有20亿参数，手机和开发板能直接跑，不用连云端，隐私和延迟都更好。第二，它不弱，AA榜单4B以下第一，智能密度比6倍大的谷歌Gemma 4 12B还高，Agent能力指标20分甩开同级。第三，它开源得彻底，模型权重、训练配方、强化学习框架一起放出来，别人能复现能改。第四，已经适配了英特尔、瑞芯微、Arm的芯片，落地门槛极低。对普通人的意义是，以后很多AI功能不用上传云端，在本地设备就跑完了，又快又省又私密，手机上的智能助手会更聪明也更安全。"},{"angle":"趋势判断","text":"从MiniCPM5-2B能看出端侧AI的三个走向。第一，参数规模不再是唯一标尺，智能密度才是，2B干翻12B说明小模型通过更好的训练方法补齐了能力，端侧部署的成本逻辑彻底改写。第二，Agent能力成了小模型的新战场，Agentic Index 20分对同级不到10分，意味着它能在本地完成工具调用、深度搜索、代码生成这类多步任务，不只是聊天。第三，开源范式在升级，从只放权重到放训练配方和可复现框架，开发者能在此基础上改出自己的专用模型。端侧Agent的门槛，正被快速削平，本地智能的时代比预想来得快。"}]},{"id":"ai2","title":"国产大模型开源潮：从比规模到比省钱","hook":"头部模型集体不拼参数了，改拼谁更便宜。","why":"证券日报9月9日深度：国产开源密集上新，词元经济成型，价格集体下探。长效选题，可延伸到创作成本与创业机会，破圈潜力大。","heat":"高","tags":["国产","趋势","成本"],"facts":["近期国产大模型密集开源：8月阿里Qwen3.8-Max开放权重、智谱GLM-5.3、腾讯混元Hy4 preview；9月面壁MiniCPM5-2B接续上新（新浪财经/证券日报 2026-09-09）","国家数据局：2026年6月我国日均词元调用量近175万亿，稳居全球第一；OpenRouter开源模型处理词元占比从1月34%升至6月65%（新浪财经 2026-09-09）","头部定价集体下探：腾讯混元Hy4输入6元/百万词元，星火X2.5多语言版1.6元/百万词元，Qwen3.8-Flash压到1元/百万词元（证券日报 2026-09-09）","行业共识转向'比省钱'：智谱GLM-5.3基座不变仅靠后训练编程能力提升五成；混元Hy4让模型参与自身训练优化，推理吞吐提升超三成（新浪财经 2026-09-09）","分析：能跑通付费闭环的厂商会迅速拉开身位，行业进入去泡沫化结构性调整（证券日报引分析师 2026-09-09）"],"scripts":[{"angle":"干货直给","text":"国产大模型这轮开源潮，逻辑彻底变了：以前比谁的参数量大，现在比谁更便宜。8月阿里Qwen3.8-Max开放权重、智谱GLM-5.3、腾讯混元Hy4 preview接连开源，9月面壁MiniCPM5-2B又跟上。价格跟着跳水：混元Hy4输入只要6元每百万词元，星火X2.5多语言版1.6元，Qwen3.8-Flash直接压到1元。国家数据局的数据更猛，今年6月我国日均词元调用量近175万亿，全球第一；OpenRouter上开源模型处理的词元占比从1月34%涨到6月65%。一句话，开源加低价正在点燃词元经济，模型正加速渗进千行百业，用AI的成本肉眼可见地往下掉。"},{"angle":"横向对比","text":"把今年和去年的国产大模型放一起看，标尺完全换了。去年拼的是参数规模，谁大谁上头条；今年拼的是推理成本和端侧部署，万亿MoE旗舰把激活参数压到千亿级，百万词元长上下文配上极低激活成本，换来旗舰能力。更明显的是价格：混元Hy4输入6元每百万词元，星火X2.5多语言版1.6元，Qwen3.8-Flash压到1元，跟一年前完全不是一个量级。能力增长也从堆算力转向拼工程，智谱GLM-5.3基座不变只靠后训练编程就涨五成，混元Hy4让模型自己优化训练方法，吞吐提升三成。省钱，成了新的护城河，比参数更有说服力。"},{"angle":"趋势判断","text":"国产开源这波，我判断是去泡沫化的开始，理由有三条。第一，头部不再拿参数当卖点，集体转向推理成本、端侧和工程效率，说明共识已经形成：真正决定胜负的不是模型多大，而是能不能以足够低的成本跑进真实业务。第二，开源和低价相互强化，词元经济成型，日均调用量近175万亿、开源占比半年翻近一倍就是证据。第三，竞争从模型本身转移到工具生态，谁能在办公、工业、终端跑通可复制的付费案例，谁就占位。接下来，能跑通商业正循环的拉开身位，剩下的会退化成纯基础设施，越早卡位越主动。对做应用的人，这是最好的时机。"}]},{"id":"ai3","title":"AI视频9月格局：从Sora 15秒到5分钟成片","hook":"视频生成从十几秒片段，一下跳到五分钟成片。","why":"vivago R1全球上线+9月模型排行，时效强、视觉冲击大。可直接服务带货/短视频创作者选型，实用价值高。","heat":"中高","tags":["视频生成","玩法","创作者"],"facts":["AI视频模型9月排行：Gemini Omni 1.1 Flash登顶arena(1515)，Seedance 2.0/2.5紧随，Veo 3主导使用量，Kling质量评分高（wikiprompt 2026-09）","9月8日智象未来(HiDream.ai)vivago R1全球上线：一次稳定输出5分钟高质量视频，支持无限多轮延长，可用率提升至85%（腾讯新闻 2026-09-09）","R1采用Chat-First对话路线：自然语言描述需求即自动生成视频，支持对话中持续调整迭代，从'生成片段'到'交付作品'（腾讯新闻 2026-09-09）","MiniMax H3开源视频模型：单GPU生成15秒768p视频约13秒，首次快于实时；社区FastH3单卡Blackwell最高14倍加速（AI瞭望塔/recapio 2026-09-01）","OpenRouter 9月排名：字节Seedance系列与谷歌Veo 3.1 Lite领先，阿里Wan 3.0支持2-30秒最长时长（streamingmeme 2026-09）"],"scripts":[{"angle":"干货直给","text":"AI视频这个月发生了质变，从十几秒片段跳到了五分钟成片。9月8号智象未来的vivago R1全球上线，一次能稳定输出5分钟高质量视频，还能无限多轮延长，成片可用率提到85%。它走的是对话路线，你用自然语言说想要什么，它自动拆脚本、分镜、角色、场景和音效，不用你连节点调参数。速度上的突破是MiniMax的H3，单张GPU生成15秒768p视频只要13秒，第一次快过实时。模型排位上，Gemini Omni 1.1 Flash登顶arena，字节Seedance和谷歌Veo 3.1 Lite在OpenRouter使用量领先，阿里Wan 3.0支持最长30秒。视频生成正式进入长镜头和成片交付阶段，创作门槛又降了一截。"},{"angle":"创作者视角","text":"做短视频的人，这个月最该关注两件事。一是vivago R1的5分钟成片，对话式生成，说清楚需求就出片，还能在对话里反复改，对不写代码、不连节点的创作者很友好，相当于把专业团队的部分活自动化了。二是选型要看用途：要电影感带原生音效用Veo 3，要平均单条质量看Seedance 2.0，要角色动作和舞蹈看Kling，要本地开源低成本用Wan 2.1。MiniMax H3则把生成速度拉到快过实时，直播和实时互动有戏。别追最新就完事，先看自己要什么镜头、多长、带不带声音，再选工具，不然很容易在排行榜里迷失，白烧时间和钱。"},{"angle":"反常识开场","text":"视频生成快过实时这件事，意味着什么？MiniMax的H3单张显卡13秒产出15秒768p视频，生成速度第一次超过了播放速度。换句话说，以前等AI出一段片子要泡杯茶，现在它边播边生成都跟得上。这直接打开了无限直播和实时互动的可能。另一边，vivago R1把时长从Sora的15秒一口气拉到5分钟成片，靠的是Agent拆解长任务、多子模块协同，让角色和场景在多段落里保持一致。速度突破和时长突破在同一周发生，说明视频生成正从玩具变成生产工具。对内容行业，产能的瓶颈正在从模型能力转向你的创意和剪辑，工具已经够快了。"}]},{"id":"ai4","title":"DeepSeek V4.1 Flash内测：输出速度破500 tokens/s","hook":"DeepSeek放出限时内测，速度直接干到每秒500字。","why":"9月9日当天腾讯研究院披露，时效性极强。速度指标硬，适合做'国产模型速度'选题，开发者群体关注度高。","heat":"中高","tags":["强时效","国产","开发者"],"facts":["9月9日腾讯研究院AI速递：DeepSeek V4.1 Flash中间版本开启内测，采用新模型结构、原生支持多模态，能力更强速度更快成本更低（腾讯研究院 2026-09-09）","开发者实测最高输出速度达507 tokens/s，多人平均超300 tokens/s；每账号限流20并发，9月10日自动下线（腾讯研究院 2026-09-09）","调用方式：保持base_url不变，模型名设为deepseek-v4.1-flash-expires-on-0910；计费与V4 Flash相同（腾讯研究院 2026-09-09）","背景：DeepSeek V4 Flash正式版8月31日上线，官方称模型结构尺寸与预览版一致仅重做后训练，智能体能力大幅跃升（techweb 2026-08-01）","待核实：V4.1 Flash正式版发布时间未定，本内测为限时中间版本，正文仅陈述已验证的内测事实"],"scripts":[{"angle":"干货直给","text":"DeepSeek今天放出一个限时内测，V4.1 Flash中间版本，开发者实测最高输出速度到了507 tokens每秒，多人平均也超过300。什么概念？以前大模型吐字能到每秒几十字算快了，现在直接破五百，写代码、出长文几乎感觉不到等待。它用了新模型结构，原生支持多模态，能力、速度、成本三样都往前挪。调用很简单，base_url不变，模型名改成deepseek-v4.1-flash-expires-on-0910就行，计费跟V4 Flash一样。但要注意，这是中间版本，每账号限流20并发，9月10号自动下线，等于只开一天多的窗口。想试的今天就得动手，过了就等正式版，手慢无。"},{"angle":"说人话版","text":"用大白话解释这个DeepSeek内测值不值得试。第一，它快，输出速度实测最高507 tokens每秒，平均超300，比一般模型快一个数量级，长文本和代码几乎秒出。第二，它新，换了模型结构还原生支持多模态，不只是文字。第三，它便宜，计费沿用V4 Flash的标准，没因为快就加价。第四，它短，这是限时中间版本，9月10号自动下线，每账号还限流20并发，想体验得抓紧。对开发者来说，这是提前摸下一代模型手感的机会；对普通人，记住一句话：国产模型的速度军备竞赛，已经卷到每秒五百字这个级别了，而且还在往上走。"},{"angle":"趋势判断","text":"DeepSeek这个限时内测，透露出模型迭代的两个信号。第一，速度正在成为新的竞争维度，从V4 Flash正式版到V4.1中间版，输出速度直接干到五百tokens每秒，长文本和Agent任务的等待成本被大幅压缩，这对编程和文档类场景是质变。第二，发布节奏在加快，正式版8月31号上线，9月9号就放中间版内测，说明模型更新周期从半年压缩到一两个月。对使用者来说，好处是能力肉眼可见地变强变快，坏处是要不停跟进。建议把核心活先跑在稳定正式版上，新特性等正式发布再迁，别把生产流程绑在限时内测上，掉线了很麻烦。"}]},{"id":"ai5","title":"蚂蚁开源原生多模态Ling-VL：看图写网页超GPT-5.4","hook":"蚂蚁开源一个能'看'会'改'的多模态大模型。","why":"9月9日蚂蚁发布百灵Ling-3.0-flash-VL，视觉反馈循环机制新颖，图片转网页评测超GPT-5.4。技术向但易懂，适合做'多模态落地'选题。","heat":"中高","tags":["国产","多模态","技术"],"facts":["9月9日蚂蚁集团开源百灵系列首个原生多模态大模型Ling-3.0-flash-VL：总参数124B、激活5.5B，原生支持图像/文本/视频输入，上下文256K（蚂蚁官方/IT之家 2026-09-09）","引入视觉反馈循环机制：任务推进为'观察→行动→验证→修正'，医疗报告解读、前端代码生成、GUI自动化中可基于视觉反馈持续修正（蚂蚁官方/IT之家 2026-09-09）","Image-to-WebDev Arena官方评测：模型(代号linthium)得分高于GPT-5.4；图片转网页可理解布局并生成代码、通过渲染对比自我修正（蚂蚁官方/IT之家 2026-09-09）","BF16/FP8版已在Hugging Face与ModelScope开源，FP4/INT4计划近期发布；Ling Studio提供免费体验（蚂蚁官方 2026-09-09）","待核实：纯文本版Ling-3.0-Flash与多模态版对比以Artificial Analysis Intelligence Index v4.1.1为准，正文引用已标注来源"],"scripts":[{"angle":"干货直给","text":"蚂蚁今天开源了百灵系列第一个原生多模态大模型Ling-3.0-flash-VL。它总参数124B但单次只激活5.5B，原生吃图像、文本和视频，上下文窗口256K，能处理长文档和长视频。最不一样的是它引入了视觉反馈机制：任务不是一次性看图出结果，而是观察、行动、验证、修正循环，比如图片转网页，它能理解布局生成代码，再拿渲染结果跟原图对比自我修正。官方在Image-to-WebDev Arena的评测里，这个模型得分超过了GPT-5.4。它还能当GUI智能体，识别界面结构跨工具操作。模型已经在Hugging Face和ModelScope开源，Ling Studio能免费试，开发和研究者都能直接上手。"},{"angle":"说人话版","text":"把这个多模态模型讲成人话。它最关键的不是参数大，而是一个会自我修正的循环：你给它一张图，它不是直接猜个结果交差，而是先看、再动手、然后拿结果验证、不对就改，反复几次。这解决了多模态最常见的问题——一次性出图经常错得离谱还不知道错在哪。最实用的场景是图片转网页，你丢一张设计稿，它生成代码，再自己对比渲染对不对，能自己改到接近。它还能做GUI智能体，认界面、跨工具操作。对普通人，这意味着以后'照图办事'的AI更靠谱了，画图、做网页、处理文档都会更准，少走很多弯路。会自己纠错的AI，才是真能帮上忙的AI。"},{"angle":"横向对比","text":"把蚂蚁Ling-VL和主流多模态放一起看，差异在机制不在参数。很多多模态模型是一次性'看图生成'，错了也不知道；Ling-VL的核心是视觉反馈循环，观察、行动、验证、修正反复跑，在医疗报告解读、前端代码生成、GUI自动化里能基于视觉反馈持续纠偏。效果上，它的图片转网页在Image-to-WebDev Arena评测超过了GPT-5.4。参数上它124B总参只激活5.5B，256K上下文，兼顾能力和成本。开源也很彻底，BF16和FP8已上Hugging Face和ModelScope。比起比谁的 benchmark 高，这种'会自己改'的机制，更像是多模态走向实用的关键一步。"}]}]}]}</script>
<script id="packHistory" type="application/json">{"2026-09-08":{"date":"2026-09-08","updatedAt":"2026-09-08 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"中秋机票现在是最佳下单窗口，过十天就贵了","hook":"中秋机票现在不订，过十天就贵了。","why":"9月8日正好卡在中秋（9/25）机票预订窗口的后半段，早一周锁票能省近五成，强时效、全民相关，转发收藏都高。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["9月是航空平季低谷，全国航线普遍比暑期降价30%-60%，9月1-10日为全年TOP级低价时段，中秋涨价尚未启动（郑州宜速达商旅机票分析，2026-09）","中秋（9月25日）机票最佳预订窗口为提前15-20天（短途）至25-30天（长途）；9月首周国内机票较暑期回落约35%、比国庆首日便宜近五成（诚意国旅，2026-09-02，数据综合携程/飞猪）","9月11-15日为中秋预热小幅涨价窗口，9月16-18日中秋正日票价临时上浮，能提前买绝不延后（同上）","周二/三/周四出发票价最低，周五六日溢价最高；早班/晚班机特价最多，差价几十到上百元（同上）","避坑：9月底临近国庆的长线航班会提前预热涨价，国庆想省钱务必9月中旬前锁票（同上）"],"scripts":[{"angle":"干货直给","text":"中秋机票的便宜窗口，现在正在关闭。9月是全年航空平季，全国航线普遍比暑运低三到六成，但低价最集中的就9月1到10号这十天，过了中秋预订潮一起，价格就往上走。具体说，中秋9月25号那趟，提前15到30天订最划算，现在9月8号正好卡在窗口后半段，再拖一周就进预热涨价期。数据上，9月首周国内机票比暑期低35%左右，比国庆首日便宜快一半。操作上三条：第一，周中出发最便宜，周二三四比周五六日能差出几十上百；第二，早班晚班特价最多，别死磕中午黄金时段；第三，别等国庆，9月底国庆长线航班已经在预热涨价，想省钱得在9月中旬前锁票。今天就把中秋往返下了，省下的钱够在当地多吃两顿好的。"},{"angle":"实操流程","text":"把中秋机票订到最便宜，按这个顺序走。第一步，先定日期再比价，中秋9月25号提前20到30天是低位，现在就能买。第二步，选周中出发，周二三四票价最低，返程也尽量错开周末，差价能到一两百。第三步，开无痕模式比价，别反复搜同一条线，高频查询会触发大数据溢价，越搜越贵。第四步，早班和晚班机特价舱最多，牺牲点睡眠换几百块很划算。第五步，9月底国庆长线别等，那批票已经开始预热涨，9月中旬前锁死。最后提醒，机票附加服务默认勾选意外险、接送券，付款前手动取消，核对含税总价。整套下来，往返省三成很常见，比临期抢全价票舒服太多。"},{"angle":"反常识开场","text":"越临近出发机票越便宜，这条经验在中秋上完全反着来。中秋不是国庆，它的低价窗口在节前20到30天，也就是现在这十来天，而不是临近那几天。原因很简单，中秋只有三天小长假，航司放折扣舱的节奏短，节前最后一周需求集中释放，价格反而往上翘。9月首周的数据很说明问题，国内机票比暑期低35%、比国庆首日便宜近一半，这是全年平季红利。所以正确动作是现在就买，不是等尾单。还有个坑，很多人盯着国庆那条13天长假，忘了中秋本身也要票，两拨需求叠一起，越往后越贵。今天就把票下了，是用最小代价锁定这张票。"}]},{"id":"tv2","title":"俄罗斯免签9/14到期还是延长？两个说法打架，出发前必查","hook":"俄罗斯免签到底哪天到期？两个官方说法打架，订票前先查。","why":"强时效加强信息差。9月赴俄游正热（贝加尔湖、海参崴），但免签口径矛盾，一条视频能救一群人白跑。","heat":"高","tags":["避坑","出境","待核实"],"facts":["中国签证申请服务中心官网『常见问题解答』明确：对俄罗斯持普通护照人员免签政策施行至2026年9月14日，单次停留不超过30天（visaforchina.cn，BRU4/BOM4，2026年更新）","中国新闻网海南（2026-09-04）引海口美兰机场消息称『俄罗斯已将现行中国公民入境免签政策延长至2027年12月31日』","460信息（援引人民网）亦称俄方延长至2027年12月31日，但同一文仍写『至2026年9月14日』，前后口径矛盾","多家旅行社（cncn.net/敬慕百科）仍按『免签至2026年9月14日、单次不超30天、全年累计不超90天』执行；陆路口岸（绥芬河/珲春）多实行团队免签","待核实：俄方是否已将9月14日到期的单方面免签正式延长至2027年底，目前中俄双方公开渠道口径不一，出发前以中国领事服务网及俄方最新公告为准"],"scripts":[{"angle":"干货直给","text":"最近想飞俄罗斯的朋友，先别急着买票，有个坑得说清楚。中国签证申请服务中心官网写得很明白：俄罗斯对中国普通护照的免签，施行到2026年9月14日，单次最多待30天。但同一时间，中国新闻网海南引海口机场说法，说俄方已经把免签延长到2027年12月31日；460信息转人民网也是这个延长说法，可它同一篇里又写着到9月14日，自己前后打架。现在多家旅行社还在按9月14号执行。这意味着什么？你今天订9月20号的行程，到底要不要签证，两边说法不一致。最稳的做法：出发前上中国领事服务网和俄罗斯官方渠道各查一遍最新通知，别只看一篇自媒体就冲。陆路走绥芬河、珲春的，基本还要跟团免签，自由行别想当然。"},{"angle":"避坑清单","text":"赴俄免签五条避坑，照着核一遍。第一，日期先查领事服务网，目前官方签证服务中心口径是免签到9月14日，但部分中文媒体称已延长到2027年底，口径冲突，以出发前最新公告为准。第二，停留天数，单次不超过30天，全年累计不超90天，别按自然年算。第三，陆路口岸和航空不一样，飞过去一般持护照免签，从绥芬河、珲春走陆路大多要跟团才能免签，自由行得另办电子签。第四，入境材料，护照有效期至少剩31天（旅行社口径）或6个月以上（部分要求），往返机票、酒店订单建议随身带。第五，落地7个工作日内要在住宿地办居留登记，回执留到离境，丢了可能留逾期记录。把这五条过一遍再下单。"},{"angle":"反常识开场","text":"免签这种好事，居然也有『听谁的』的问题。俄罗斯对中国普通护照免签，中国签证申请服务中心官网白纸黑字写的是到2026年9月14日。可你一搜新闻，中新网、人民网都在说俄方已经延长到2027年底。同一件事，官方渠道和媒体口径对不上，这在出境游里不多见。后果很实在：你9月中旬之后飞莫斯科，按官网说法要签证了，按媒体说法还能免签，到了边检以哪边为准你说了不算。所以这条视频的价值就一句，别赌。出发前分别查中国领事服务网和俄方公告，两边一致再订票。贝加尔湖、海参崴再美，也别因为一句过时的『免签』白跑一趟被拒登机。"}]},{"id":"tv3","title":"请3休13后的错峰红利：9/22抢跑比国庆首日便宜一半","hook":"拼出13天长假后，真正省钱的是出发那天。","why":"拼假方案全网刷屏，但『错峰出发省一半』是增量信息差，评论区容易吵起来（抢跑 vs 硬刚首日）。","heat":"高","tags":["省钱","强时效","人人有用"],"facts":["请9月28-30日三天年假，可拼出9月25日至10月7日共13天连休，为2026年最后一个超长假期（国务院办公厅节假日安排；东莞众信/诚意国旅）","9月22日抢跑出发，机票均价较中秋首日低约30%、较国庆首日低约50%；9月27日-10月1日均价达近三年同期最低（东莞众信旅行，2026-09-07）","提前3-5天出发比10月1日当天出发平均便宜28%-42%，9月26-27日出发折扣最大；返程选10月8日比10月7日腰斩（诚意国旅，2026-09-02，携程/飞猪数据）","酒店10月5日后入住较峰值低35%-55%，10月8日降幅普遍超55%（诚意国旅 Tip4）","中秋高速不免费（9/25-27收费），国庆10/1-10/8免费共8天；热门景区10/1-4见顶、5日后回落（诚意国旅 Tip5/Tip6）"],"scripts":[{"angle":"干货直给","text":"请3休13的拼假方案这两天刷屏了，但大多数人只盯着『怎么拼』，没盯着『哪天走』。同样13天假，出发时间差几天，机票能差一半。数据很直接：9月22号抢跑出发，票价比中秋首日低三成、比国庆首日低五成；9月27到10月1号是近三年同期最低点。反过来说，硬刚10月1号首日出发的，基本是把钱包送给航司。返程同理，10月7号最贵，8号直接腰斩。酒店也是后程便宜，10月5号之后比峰值低三到五成。所以这套方案真正的省钱密码不是『请几天假』，是『错峰那一下』。能9月22号前后走就别等国庆，能10月8号回就别挤7号。把这几天卡准，同样的预算体验能好一倍。"},{"angle":"横向对比","text":"同样13天假，两种走法差价有多大，摆出来你看。A方案硬刚高峰：9月30或10月1号出发、10月7号回，机票是全年峰值，酒店10月1到4号最贵，景区10月1到4号人挤人，综合成本最高。B方案错峰：9月22号前后抢跑出发、10月8号回，机票比国庆首日低五成，酒店后程比峰值低三五成，景区5号后客流回落一半。光机票酒店两项，B比A省的钱够你升级一档住宿或者多玩一个城市。还有隐形收益，A方案高速国庆免费但堵到怀疑人生，B方案早走几天高速还收费但一路畅通。结论很清楚，长假想舒服又省钱，核心就四个字：避开首尾。"},{"angle":"实操流程","text":"把13天长假花得最值，按这个节奏排。第一步，假条这周递，请9月28、29、30三天，连休9月25到10月7。第二步，出发选9月22到24号抢跑，别等10月1号，机票能差一半。第三步，返程定10月8号，比7号便宜一大截，还能蹭上高速免费尾巴（10月8号24点前下高速免费）。第四步，酒店把核心目的地放假期后半段，10月5号之后房价比峰值低三到五成。第五步，热门景区提前7到14天预约，故宫提前7天晚8点放票3分钟没，九寨提前14天早8点放票。第六步，行程留1到2天缓冲，山区秋雨多雾别排满。这样走，钱省了、人少了、景还更好。"}]},{"id":"tv4","title":"9月赏秋黄金期：喀纳斯、阿尔山、额济纳，人少一半景更好","hook":"9月的秋景比国庆好看，还便宜一半。","why":"目的地加季节玩法，长效收藏加强时效结合；错峰赏秋是高频需求，截图感强。","heat":"中高","tags":["国内游","季节","收藏向"],"facts":["喀纳斯最佳观赏期9月15日-10月5日，9月中下旬白桦全黄、湖水碧蓝，神仙湾晨雾概率比月初高60%（腾讯新闻，2026-08-31 转载攻略）","内蒙古阿尔山是国内最早入秋区域，9月10-30日落叶松全黄、火山天池配鎏金林海，人少景静（同上）","额济纳胡杨林10月最佳，春辉旅游线路团期覆盖9月下旬至10月；阿尔山加呼伦贝尔9月人少景静（春辉旅游）","9月机票较暑期回落约35%，秋季9月中-10月底为全年最佳赏秋窗口，错峰10天体验翻倍（诚意国旅，2026-09-02）","长白山9月天池能见度全年最高（超70%）、红枫黄桦层叠；婺源篁岭9月进入晒秋季（腾讯新闻/各地攻略）"],"scripts":[{"angle":"干货直给","text":"想看秋景，9月比国庆聪明太多。国庆的喀纳斯、阿尔山、额济纳，人是真多、价是真贵，而9月中下旬恰恰是颜值巅峰。喀纳斯白桦全黄、湖水碧蓝的窗口是9月15到10月5号，晨雾概率比月初高六成；阿尔山9月10到30号落叶松全黄，火山天池配鎏金林海，而且它是国内最早入秋的地方，人少得能听见叶子落地的声音。机票还便宜，9月整体比暑期低三成五。再往后推，额济纳胡杨10月才到顶，9月下旬就能去占坑。简单说，秋色不等人，但人潮可以避开，把行程提前半个月，同样的预算，景更金、路更空、住更便宜。收藏这条，今年秋天照着走。"},{"angle":"说人话版","text":"说人话解释为什么9月看秋比国庆好。第一，颜色正。喀纳斯9月中下旬白桦刚全黄，配上蓝绿湖水和晨雾，是它一年里最好看的样子；阿尔山9月落叶松金黄，比国庆那会儿更干净。第二，人少。国庆景区是春运级别，9月的工作日你能在林子里独处。第三，便宜。9月机票比暑期低35%，酒店还没到双节溢价。第四，可选择多。长白山9月看天池概率超七成，婺源篁岭9月就开始晒秋。所以逻辑很直白：秋色的最佳观赏期和人流高峰根本不重叠，你只要把出发提前半个月，就能用最少的钱买到最好的秋天。别等放假，放假那几天是给别人的。"},{"angle":"趋势判断","text":"从今年秋天的预订数据看，赏秋正在从『国庆扎堆』变成『九月错峰』，判断依据有三条。第一，价格信号，9月机票比暑期低35%、比国庆首日便宜近一半，这个价差足以改变出发时间。第二，景观信号，喀纳斯、阿尔山、长白山的最佳观赏期都落在9月中到10月初，和国庆高峰部分重叠但峰值更早，早走反而赶上最金的那几天。第三，供给信号，旅行社秋线路期大量集中在9月（阿尔山9月1到20天天发），说明行业也在引导前置。对普通人的建议：把年假拆一点放在9月，秋景、钱包、体验三样都占。等国庆再去，你得到的只剩人头和溢价。"}]},{"id":"tv5","title":"240小时过境免签扩至57国（8/20新增吉、越），中转游捡漏","hook":"转机去第三国，顺道在中国玩10天不用签证。","why":"政策红利加中转玩法，小众但高价值；8/20新规刚落地，知道的人少，信息差强。","heat":"中","tags":["政策","出境","信息差"],"facts":["自2026年8月20日起，对吉尔吉斯斯坦、越南公民实施240小时过境免签和海南30天免签，240小时过境免签适用国家增至57国、海南30天免签增至61国（中国签证申请服务中心，MEL4通知，2026-08-20）","单方面免签50国：文莱无期限，俄罗斯至2026年9月14日，其余48国至2026年12月31日（visaforchina.cn，2026年更新）","240小时过境免签适用54国（后增至57国），可从北京、上海等65个口岸免签入境，在规定区域停留不超240小时，需持去第三国联程客票（国家移民管理局/签证服务中心）","海南59国人员入境30天免签政策；印尼自2025年6月12日起适用240小时过境免签（visaforchina.cn）","适用事由含旅游、商贸、访问、探亲等短期活动，工作、学习、新闻采访需事先办签证（同上）"],"scripts":[{"angle":"干货直给","text":"一条被忽略的签证红利：240小时过境免签，8月20号又扩容了。现在对中国公民反向看，是外国朋友来华更方便；但对我们出境党重要的是另一层，我们转机去第三国时，也能反过来利用各国的过境免签。先说国内这侧，8月20号起，吉尔吉斯斯坦、越南加入，240小时过境免签适用国涨到57个，海南30天免签涨到61个，从北京上海等65个口岸能进，停留不超240小时，也就是10天。条件就一个：你得有去第三国的联程机票。这意味着你飞欧洲从国内中转，或者老外来华中转，都能顺道玩十天不用签证。另外单方面免签现在已经50国，文莱无期限、其余48国到年底。出境前把这两条线都摸清楚，能省掉一堆签证费和等待。"},{"angle":"玩法向","text":"过境免签怎么玩出性价比，给你两个思路。思路一，反向利用：你本人是中国护照，主要用不上来华过境免签，但你能用它安排外国朋友来华顺道游，57国公民持去第三国联程票，从65个口岸进，能在中国玩10天，你做地接攻略就行。思路二，出境中转捡漏：你飞第三国在别国转机时，查清楚对方过境免签政策，很多枢纽国给72到240小时，等于白送你一个中转城市半日游到十日游。注意边界，过境免签只认旅游、商贸、探亲、访问这些短期事由，工作、学习、采访不行，得事先办正经签证。另外联程客票日期座位要定好，临时改签可能让免签失效。把这两点记住，中转不再是纯等待。"},{"angle":"横向对比","text":"三种来华免签方式，别搞混，对比一下。第一，单方面免签，50国公民持普通护照来华旅游经商等不超30天，文莱长期有效、其余48国到2026年底、俄罗斯到9月14号，适合直接来华。第二，240小时过境免签，57国公民需持去第三国联程票，从65个口岸进、停留不超10天，适合来华中转顺道玩。第三，区域性免签，比如海南61国30天、59国入境海南免签，地域限定。对出境党的启示：你规划国际行程时，把『过境国给不给免签』当成变量，能凭空多出一个免费中转目的地。三种方式都不能干工作和学习，这点别碰线。理清这层，签证焦虑能少一大半。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"讯飞星火X2.5发布：全国产算力旗舰，多语言200+语种","hook":"国产算力跑出2930亿参数旗舰，还能说200种语言。","why":"国产AI硬新闻，多源一致（每日经济新闻/凤凰/搜狐/IT时代网），全民情绪价值加信息量足。","heat":"高","tags":["强时效","国产","泛人群"],"facts":["9月7日科大讯飞正式发布星火X2.5，采用293B-A30B的MoE架构，基于全国产算力平台完成全流程训练与推理，使用约20万亿Token数据，强化代码、智能体与数学能力（每日经济新闻/IT时代网/搜狐，2026-09-07）","同步发布Spark-X2.5多语言文本生成模型，参数293B-A30，支持256K上下文与200余种语言，已在讯飞星辰MaaS上线，输入1.6元/输出6元每百万Token（凤凰网，2026-09-07）","端侧模型星火X2.5-4B与1.7B已于9月1日开源，为端侧首个原生支持最长100万Token上下文的模型，可本地部署（观点新媒体）","同日科大讯飞携小米、海信、TCL等900余家中国品牌亮相柏林IFA，集体推进国产AI硬科技出海（罗超Pro，2026-09-07）","星火X2.5重点提升代码与智能体能力，持续优化国产超长序列训练推理难题（大皖新闻/IT时代网）"],"scripts":[{"angle":"干货直给","text":"9月7号，科大讯飞发了星火X2.5，这条值得普通人也看一眼。先说规格，2930亿总参数、激活300亿的MoE架构，关键是它基于全国产算力完成从训练到推理的全流程，用了约20万亿Token数据，重点强化了代码和智能体能力。更实用的是多语言版，支持256K上下文和200多种语言，输入1.6块、输出6块每百万Token，已经在讯飞星辰上线。端侧那边9月1号就开源了4B和1.7B两款小模型，是端侧第一个原生支持100万Token上下文的，能直接装本地。当天讯飞还带着900多家中国品牌去柏林IFA站台，国产AI硬科技集体出海。对普通人意味着什么？国产大模型这条线越来越能打，长期看调用价格还会往下走，你手里的AI工具会更快变强变便宜。"},{"angle":"说人话版","text":"用大白话讲讯飞这个发布为什么重要。第一，它是纯国产算力跑出来的旗舰，2930亿参数从头训到推都没靠国外卡，这对被卡脖子的顾虑是个实打实的回应。第二，它真能干活了，重点练的是写代码和当智能体，不是陪你聊天，你给它目标它能拆步骤执行。第三，语言覆盖吓人，200多种语言、256K上下文，做跨境、做外贸、做出海内容的人直接能用。第四，端侧小模型开源了，100万Token上下文能塞进本地设备，长文档、代码辅助不用上云。普通人不用懂参数，记住一句：国产大模型在变强、在变便宜、在往你手机和电脑里钻，这就是趋势。"},{"angle":"趋势判断","text":"从讯飞这次发布能看出国产大模型的三个走向。第一，算力自主从口号变现实，星火X2.5全流程国产算力训练推理，20万亿Token规模，说明国产卡扛大活的能力已经成型。第二，竞争焦点转向代码和智能体，模型架构围绕Agent设计，大家赌的是AI能不能替人干完整活，而不只是问答。第三，出海成为新战场，讯飞带900余家中国品牌登上IFA，国产AI硬科技从拼参数转向拼生态和落地。对内容创作者，多语言版200多种语言直接降低出海门槛；对企业，端侧开源意味着数据不用出本地。长期看，国产模型的性价比优势会持续挤压国外闭源产品的空间。"}]},{"id":"ai2","title":"字节Seedance 2.5跑通『AI剧组』：GPT-6写本子它拍片，实时空间视频在路","hook":"一个人加两个AI，把一部动画短片做出来了。","why":"工作流革命叙事，破圈强；『AI导演+AI演员』具象可感知，评论区讨论度高。","heat":"高","tags":["视频生成","工作流","趋势"],"facts":["网友用GPT-6 Astra写故事、搭场景、定分镜，交由Seedance 2.5生成镜头剪辑成片，成功复刻30秒《火影》木叶村动画，标志『AI导演+AI演员』工作流落地（第一新声，2026-09-07）","火山引擎向多家版权方内测『AI版权管理平台』，品牌方可借Seedance等模型对签约IP商业化使用，版权方监修、审核与实时交易，拟下半年公开上线（娱乐资本论，2026-09-07）","彭博社报道，字节跳动正筹备面向实时空间视频生成的AI模型，由张一鸣亲自监督，最快下月发布，面向Pico头显用户语音或动作生成响应虚拟世界（凤凰网/彭博，2026-09-07）","硅星人Pro解析：GPT-6 Astra负责写Brief、做预演、交付参考帧，Seedance 2.5承接角色与场景生成最终视频，二者被称为『GPT-6最佳拍档』（硅星人Pro）"],"scripts":[{"angle":"故事切入","text":"前两天有个演示挺震撼：一个博主用GPT-6写故事、搭场景、定分镜，再把活交给字节的Seedance 2.5去生成镜头，最后剪出一段30秒的《火影》木叶村动画。全程没有真人画一帧，一个人加两个AI，把过去一个动画工作室几周的活干完了。这标志一件事，『AI导演加AI演员』的工作流真的落地了。更值得关注的是背后的版权动作，火山引擎在向内测一个AI版权平台，品牌方可以用Seedance对自己的IP做商业化生成，版权方还能监修和实时交易。再加上彭博社说字节在筹备实时空间视频模型，张一鸣亲自盯，最快下月发，冲着Pico头显去做虚拟世界响应。视频生产的流水线，正在被重画。"},{"angle":"干货直给","text":"字节的Seedance 2.5最近连着三个动作，串起来看是一条新生产线。动作一，网友实测用GPT-6 Astra写本子定分镜、Seedance 2.5出镜头，30秒动画短片跑通，分工是AI导演加AI演员。动作二，火山引擎内测版权平台，让品牌方拿签约IP去生成、让版权方监修交易，等于给AI视频发了『合规准生证』，拟下半年公开。动作三，彭博社说字节在搞实时空间视频模型，张一鸣督战，最快下月发，对着Pico做语音动作生成虚拟世界。三件事指向一个方向：AI视频从玩具走向生产线，而且开始解决最头疼的版权和实时性。做内容的，这套组合拳值得盯紧。"},{"angle":"趋势判断","text":"Seedance这一波说明AI视频的竞争进入了『工作流』阶段，而不只是比画质。判断有三点。第一，单模型不够用了，胜者是能和其他模型组队的那一个，GPT-6写、Seedance拍这种搭配会被大量复制。第二，版权从阻力变基础设施，火山引擎内测的监修交易平台，本质是给商用清障，谁先把合规跑通谁先吃品牌预算。第三，实时化是下一个高地，字节筹备的空间视频模型冲着Pico和交互去，说明行业盯着『生成即播放』。对创作者，红利在早进场熟悉这套流水线；对企业，品牌IP的AI化生产今年就能试点。画质军备竞赛会过去，工作流和版权才是护城河。"}]},{"id":"ai3","title":"MiniMax H3 Max：生成比播放还快，无限AI直播成了","hook":"AI视频生成第一次比你看片的速度还快。","why":"实时生成范式转变，冲击内容生产；『无限AI直播』具象、有传播点。","heat":"高","tags":["视频生成","实时","玩法"],"facts":["9月1日MiniMax联合fal.ai发布H3 Max，5秒768p完整音视频生成仅需3秒，博主实测压到2.5秒内（MiniMax官方/今日头条钛媒体，2026-09-07）","生成速度首超人类播放速度，评论区点播当场制作、前一段未播完下一段已生成，画面输出全程不中断，诞生『无限AI直播』（@HoodyLiu/@LerSentAI 演示，钛媒体）","H3（Hailuo 3.0）于2026年7月下旬发布，5-15秒片段、原生2K/24fps、原生立体声，提供开放权重与透明定价（brief.news）","Arena Elo榜单：MiniMax H3约1460，被评『西方报道中常低估』；Gemini Omni 1.1 Flash以1515居首（wikiprompt.org，2026-09）"],"scripts":[{"angle":"反常识开场","text":"AI视频生成第一次比你看片的速度还快，这件事的意味比画质提升大得多。9月1号MiniMax联合fal.ai发了H3 Max，5秒768p带声音的视频，生成只要3秒，有博主实测压到2.5秒以内。关键不在快，在于它快过了播放速度，你正看着上一段，下一段就已经生成好了，画面从开播到结束都不带断的。结果就是有人拿它做了『无限AI直播』：没有主播、没有台本，观众在评论区打字点播，AI当场做出来接上。这意味着视频不再是拍完再看，而是随叫随到的内容流。对做内容的，门槛和成本又被砍了一刀；对观众，以后刷到的『直播』可能压根没真人。"},{"angle":"玩法向","text":"H3 Max这个速度能玩出什么，给你两个已经跑通的场景。场景一，无限AI直播，观众在评论区点什么现场生成什么，画面无感衔接不断流，等于一个永不下班的AI主播，适合做互动营销和陪伴型内容。场景二，零延迟互动剧情，有博主用它做了真人和二次元Galgame风格的实时剧情游戏，你说一句它接一段。背后的硬指标：5秒768p音视频3秒生成，H3本身是7月下旬发的Hailuo 3.0，原生2K加立体声、开放权重、定价透明。想上手，走Hailuo App或fal.ai的API都行。提醒一句，速度快带来新问题，内容真实性和标识得跟上，否则观众分不清真假。"},{"angle":"横向对比","text":"把H3 Max放进9月视频模型格局里看，它的位置很特别。画质榜上Gemini Omni 1.1 Flash以1515的Elo居首，Seedance 2.0单条片子的『惊艳度』评分最高，Veo 3靠原生声音和对话霸占使用量。H3的Elo约1460，绝对不是第一，但它赢在一个别人没有的维度：速度。5秒视频3秒生成，快过了播放速度，这一项让它能干实时交互的活，而榜单靠静默短片评分根本测不出来。所以选模型看你要什么，要电影感找Seedance和Veo，要实时互动找H3，要综合最强找Gemini Omni。H3被西方媒体低估，恰恰因为它赢的地方不在传统赛道。"}]},{"id":"ai4","title":"阿里Wan 3.0 Beta：单条视频30秒，丢份PPT直接出片","hook":"丢一份PPT进去，直接出30秒视频。","why":"企业/带货场景直接可用，转化路径短；『文档转视频』是差异化卖点，实用性强。","heat":"中高","tags":["视频生成","企业","实用"],"facts":["阿里通义Wan 3.0进入公测，单pass视频时长从15秒提升至30秒，强调长镜头连贯与高精度渲染（brief.news，2026-09-07）","新增document-to-video能力，可直接摄入PDF、PPT、Word文档和URL，配合Omni Reference系统保证镜头间一致性（同上）","与Seedance 2.5（单pass 30秒/50参考）、MiniMax H3构成2026年夏『中国视频三强』，三者分别主攻生产、企业文档、开放权重（同上）","待核实：Wan 3.0的开源授权条款尚未明确，商业化使用需等官方进一步说明（brief.news标注）"],"scripts":[{"angle":"干货直给","text":"阿里通义把Wan 3.0放公测了，这条对做企业内容、做带货的人最有用。先看硬指标，单条视频时长从15秒拉到30秒，长镜头的连贯性和渲染精度都提了。但真正杀手锏是document-to-video，你丢一份PDF、PPT、Word或者一个网址进去，它能直接生成视频，再用Omni Reference系统保住镜头之间的人物和场景一致。这意味着什么？你做完一版方案、一页产品介绍，不用再找剪辑，直接转成30秒讲解视频。它和Seedance 2.5、MiniMax H3组成了今年夏天的中国视频三强，分工很清楚：Seedance主攻生产、Wan主攻企业文档、H3主攻开放权重。一个提醒，Wan的开源授权还没说清，商用量产前等官方补条款。"},{"angle":"实操流程","text":"用Wan 3.0把文档变视频，流程比你想的简单。第一步，准备好素材，一份PPT、产品手册PDF或者官网URL都行，内容越结构化生成越稳。第二步，上传到通义万相或阿里云Model Studio的Wan 3.0入口，选document-to-video。第三步，用Omni Reference指定要贯穿全片的主角或产品，保证前后镜头长得一样，别让人物中途变脸。第四步，设定时长，现在单pass能到30秒，长内容可以分段生成再拼。第五步，出片后人工过一遍口播和字幕，AI对专业术语偶尔会念错。这套特别适合电商上架视频、培训讲解、周报月报可视化，原本三天的事现在半小时。注意商用前确认授权条款。"},{"angle":"横向对比","text":"中国企业用AI做视频，现在三强怎么选，摆清楚。Seedance 2.5，单pass 30秒、最多50个参考图，生产力和镜头控制最强，适合做高质量短片和内容工厂。Wan 3.0，最大差异是document-to-video，吃PPT/PDF/URL直接出片，企业文档流水的首选，但开源授权还没明朗。MiniMax H3，开放权重、定价透明、速度碾压，适合要实时互动和私有化部署的团队。三者都是国产、都在今年夏天成熟。给个判断：做品牌大片冲Seedance，做内部培训和带货讲解冲Wan，做技术自研和实时应用冲H3。别追一个全能，按场景各取所需最省成本。"}]},{"id":"ai5","title":"2026年9月AI视频模型怎么选：Gemini Omni、Seedance、Veo、Kling各擅长啥","hook":"视频模型这么多，到底哪个能打？","why":"选型指南长效内容，收藏率高；对刚入局的内容创作者直接有用，立人设。","heat":"中高","tags":["选型","方法论","收藏向"],"facts":["Wikiprompt 2026年9月榜单：Arena Elo Gemini Omni 1.1 Flash 1515居首，Flux 3 Video 1495、Seedance 2.0/2.5 1479/1476、MiniMax H3 1460紧随（wikiprompt.org，2026-09）","按人工逐条评分（clip wow）：Seedance 2.0以3.47居首，Kling 3.38、Wan 2.1 3.26、Sora 3.14、Hailuo 3.09、Veo 3仅2.84（wikiprompt.org，6900+条评分语料）","按实际使用量：Seedance 2.0（1876条prompt）与Veo 3（1409）主导，Kling以614条量获3.38高分、角色动作强；Wan 2.1占本地/开源（同上）","OpenAI Sora已于2026年3月关停，势头转向北京-上海-杭州的中国实验室（brief.news，2026-09-07）"],"scripts":[{"angle":"干货直给","text":"AI视频模型挑花眼，给你一张9月实测地图。先看综合榜Arena Elo，Gemini Omni 1.1 Flash 1515排第一，Flux 3 Video、Seedance 2.0/2.5、MiniMax H3紧跟。但Elo是社区打分，会骗人，得看另一条线：真人逐条评『惊艳度』，Seedance 2.0以3.47拿第一，Kling 3.38、Wan 2.1 3.26，而Veo 3只有2.84，因为它强在原生声音和对话，静默短片评分里看不出来。再用使用量交叉验证，Seedance和Veo 3用得最多，Kling虽然量少但质量高、角色动作最稳，Wan 2.1是本地开源党的首选。还有个背景，Sora今年3月关停了，重心转到了北京上海杭州。所以选模型别只看一个榜，按你的活挑维度。"},{"angle":"横向对比","text":"把主流视频模型按『你到底要什么』来分，比看排名有用。要综合最强、啥都能试，Gemini Omni 1.1 Flash，Elo 1515断层第一。要单条片子最惊艳、电影感，Seedance 2.0，人工评分3.47无人能及。要角色动作和 choreography 稳，Kling，3.38分但量少质高。要原生声音和对白，Veo 3，评分不高但说话这项独一份。要本地部署、开源可控，Wan 2.1，2.2在补运动。要实时生成速度，MiniMax H3，快过播放速度。注意，这些榜会每天变，Sora退场后中国三强（Seedance/Wan/H3）势头最猛。收藏这张对照表，下次生成前先想清楚要哪个维度，别盲选。"},{"angle":"方法论","text":"选视频模型我只有一个原则：先定义你要的那一项指标，再去找冠军，而不是追总榜。原因很简单，9月的数据显示没有全能王，Gemini Omni综合Elo第一，但单条惊艳度输给Seedance；Veo 3使用量最大，静默评分却垫底；Kling量小却质量高。所以问自己三个问题：第一，要电影感还是实时互动？前者Seedance/H3，后者H3。第二，要不要声音和角色一致性？要声音找Veo 3，要角色动作找Kling。第三，数据能不能出云？能就Wan本地部署。把这三个问题答了，模型自己跳出来。别被一个『第一』带节奏，你的活儿才是尺子。这条建议比任何榜单都保值。"}]}]}]},"2026-09-07":{"date":"2026-09-07","updatedAt":"2026-09-07 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"国庆机票创三年最低，请3休13的黄金窗口就在这两周","hook":"今年九月底有个比春节还长的假，现在不动手票就贵了。","why":"9月7日正好卡在国庆机票低位区间尾巴，这条现在发最值钱，过了9月中价值减半。全民相关，转发收藏高。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["2026年中秋9月25日(周五)至27日(周日)放3天不调休，国庆10月1日(周四)至7日(周三)放7天，中间9月28、29、30日三个工作日；请掉这3天年假可拼出9月25日至10月7日共13天连休（国务院办公厅《2026年部分节假日安排的通知》；红星新闻、搜狐2026-09）","去哪儿旅行数据：2026年9月27日至10月1日出发机票均价创近三年同期最低，部分热门航线比去年低一成以上；燃油附加费2026年8月5日起已连降，800公里以上仅70元、800公里含以下40元（腾讯新闻、红星新闻2026-09-02；去哪儿）","去哪儿数据：9月22日抢跑出发均价较中秋首日(9/25)低30%、较国庆首日(10/1)低50%；中秋前工作日为假期前后机票最低时段（腾讯新闻2026-09-02）","同程旅行：中秋、国庆关键词搜索热度月环比增长116%，1200公里以上长航线预订热度环比增长56%；提前一个月锁假机票热度同比高21%（同程2026-09）","两个补班日：9月20日(周日)、10月10日(周六)需上班，别把周末排进行程（国务院办公厅放假安排）"],"scripts":[{"angle":"干货直给","text":"今年九月底有个比春节还长的假，很多人还没反应过来。中秋9月25到27号放三天不调休，国庆10月1到7号放七天，中间28、29、30三个工作日。把这三天天假请掉，从9月25一直休到10月7，整整13天。现在最值钱的是票：去哪儿数据，9月27到10月1出发的机票均价创近三年同期最低，部分热门航线比去年低一成以上。燃油附加费8月5号起连降，八百公里以上才七十。最省的是抢跑出发：9月22走比中秋首日低三成、比国庆首日便宜一半。两个补班日记牢，9月20和10月10要上班，高速免费只在10月1到7号。"},{"angle":"实操流程","text":"想把这13天长假用满又省钱，按这个顺序走。第一步查年假余额，只消耗三天，工龄满一年就有五天够用。第二步这周递假条，附工作交接清单，领导驳回理由少一半，别等同事撞车。第三步等批下来再订票，先买票后请假批不下来退票手续费能吃掉半张机票。第四步卡订票时间：现在9月初还在低位，9月22抢跑出发比国庆首日便宜一半。第五步酒店只订可免费取消的，热门城市提前一个月就可能满房。最后留一两天年假应付年底突发，别一次用光。补班日9月20和10月10要上班，行程别撞上。补一句，年假审批越晚越易撞车，本周一就递最稳当。"},{"angle":"反常识开场","text":"越早订票越便宜，这句话在长假上是错的。国庆机票不是从低到高一条直线，是先高、再低、最后暴涨。太早航司没放折扣舱挂的是基础价；到提前45到60天，第一批折扣舱释放，这才是全年低点；进假期前最后十天低价舱清空价格翻倍。现在9月初还在低位区间，9月中下旬热门线普遍贵三成以上，得抓紧。还有抢跑：9月22出发比国庆首日便宜一半，错峰就是省钱。别凭感觉抢，先看日历再看价格，这一趟省下的钱够多住两晚好酒店。高速免费只在10月1到7号，自驾别算错。这条规律记牢，省下的机票钱够你多住两晚好酒店。"}]},{"id":"tv2","title":"九月机票大跳水，珠海航线降幅最高75%","hook":"九月机票正在大跳水，这是暑运后最便宜的一段。","why":"价格具体到数字，截图感强，适合低成本口播。九月传统淡季，错峰捡漏窗口明确。","heat":"中高","tags":["省钱","国内游","可复用"],"facts":["腾讯新闻引携程数据：2026年9月珠海出发多条航线机票较暑期峰值暴跌约70%，最高达75%，叠加燃油附加费下降，不少航线票价低于同期高铁；珠海飞锦州、天津、太原、合肥、黑河单程降幅约70%、最高75%（腾讯新闻2026-09-02）","9月从珠海出发低价榜：飞往宁波、扬州、西安、昆明等地单程基本200-300元；中秋国庆期间珠海飞武汉、三亚、海口、扬州单程约300-530元（腾讯新闻2026-09-02，查询截至9月2日11:30）","央视财经/分析师：9月为传统淡季、运力充沛，未来一到两周机票价格还会进一步下跌，整体或维持低位至十一前（腾讯新闻2026-09-02）","北京出发9月27日前后直飞大连、沈阳、大庆、银川等地仅需300余元，多条航线出现0.9折特价票（去哪儿/腾讯新闻2026-09-02）","倒挂航线增多：福州飞上海最低300元，而高铁二等座391元；周边机场价比一遍常有惊喜（搜狐/去哪儿2026-09）"],"scripts":[{"angle":"干货直给","text":"九月的机票正在大跳水，这是暑运结束后最便宜的一段。携程数据，珠海九月出发多条航线比暑期峰值暴跌约七成，最高七成五，叠加燃油附加费下降，不少航线比高铁还便宜。珠海飞锦州、天津、太原、合肥、黑河降幅约七成，单程低到两三百。北京九月27号前后直飞大连、沈阳、大庆、银川也只要三百出头，多条线出现零点九折。福州飞上海最低三百，高铁二等座却要三百九，这种倒挂今年特别多。九月是传统淡季运力足，分析师说未来一到两周还会再跌，想捡漏就盯这个月，过了中秋就回涨。珠海这波七成降幅，往后三年都难再遇一次。"},{"angle":"横向对比","text":"同样的钱，九月飞和坐高铁哪个划算，今年倒挂得明显。福州飞上海最低三百，高铁二等座三百九，飞机反而便宜。珠海飞昆明、西安、宁波、扬州单程两百到三百，而同等距离的高铁普遍四百往上。反过来看，九月机票为什么这么便宜：暑运后半段学生返校客座率掉，航司必须清仓，运力却还在加，价格自然扛不住。北京九月27号前后飞大连沈阳只要三百余，零点九折到处是。所以九月这段，中短途飞行比火车更值。要动手趁现在，开学尾单放完，中秋国庆一到价格立刻回去，倒挂也会消失。九月不飞，等长假如愿以偿只能买贵一截的票。"},{"angle":"反常识开场","text":"都说长假机票贵，但九月偏偏是全年洼地，反差很多人没看懂。携程数据，珠海九月出发航线较暑期峰值暴跌约七成、最高七成五，单程两三百就能飞昆明西安。北京九月27号前后直飞大连沈阳三百余元，零点九折到处是。原因很简单：暑运结束学生返校，客座率掉下来航司必须清仓，可运力没减，供需一松价格就崩。福州飞上海最低三百，高铁却三百九，飞机比火车便宜的反常今年特别多。所以别等长假，九月这段飞比坐车划算，窗口关在中秋国庆涨价前，错过等明年。这波价格倒挂，错过就要再等明年九月才回来。九月机票窗口就是现在，别等长假才后悔。"}]},{"id":"tv3","title":"泰国免签9月15日作废？这是误读，60天变30天","hook":"网上传泰国九月十五免签作废，这是误读，得说清楚。","why":"强纠错向，信息差大，评论区易吵。官方一手来源，安全。","heat":"中高","tags":["避坑","出境","纠错"],"facts":["中国驻泰国使馆2026年9月2日公告：泰方取消的是此前面向93国单方面停留60日免签政策，2024年3月1日生效的中泰双边免签协定继续有效；2026年9月15日起中国公民持普通护照赴泰仍免签，单次停留不超30日(每180日累计不超90日)（新华网、驻孔敬总领馆2026-09-02）","泰国入境硬性要求：护照有效期满6个月以上；返程/第三国机票行程单；酒店/住宿证明；个人不少于10000泰铢(家庭20000泰铢)现金或等值外币，海关不定期抽查；免费填电子入境卡TDAC（泰国国家旅游局北京办事处2026-07-09更新）","免签不等于无条件入境：从事工作、学习、定居等须事先批准的活动及停留超30日，须入境前办妥签证（驻泰使馆2026-09-02）","中国公民持普通护照可免签入境国家截至2026-09-01为56个；菲律宾单次14天(2026-1-16至2027-1-16)、柬埔寨14天(2026-6-15至10-15)注意区分（中国领事服务网2026-09-01）","待核实：俄罗斯双向临时免签有效期存在「至2026-12-31」与「至2027-12-31」两种口径，出发前以领事服务网最新为准"],"scripts":[{"angle":"干货直给","text":"网上传泰国九月十五免签作废，这是误读，得说清楚。中国驻泰使馆九月二号公告：泰方取消的是此前面向九十三国单方面的六十天免签，而二〇二四年三月生效的中泰双边免签协定继续有效。九月十五起中国公民持普通护照赴泰仍免签，单次停留不超三十天，每一百八十天累计不超九十天。也就是说，去泰国旅游照旧免签，只是从六十天回到三十天。真正要记的避坑是：护照有效期满六个月、返程机票、酒店订单、个人一万泰铢家庭两万泰铢现金抽查、免费填电子入境卡TDAC。免签不等于免审查，材料不齐照样被拒。中国免签国目前共五十六个，别混淆天数。"},{"angle":"实操流程","text":"去泰国前核对这五条，照着过一遍。第一，天数别记错，九月十五起从六十天回到三十天，按单次入境算，不是自然年累计，超期算逾期滞留。第二，护照有效期要满六个月，破损缺页直接不通关。第三，落地要看返程机票、酒店订单和资金证明，个人一万泰铢家庭两万泰铢现金海关不定期抽查，带卡不算数得有现金。第四，免费填电子入境卡TDAC，别信机场收费代办。第五，免签只覆盖旅游探亲，工作学习定居超三十天必须提前办签证。政策以领事服务网和泰方最新为准，别信过期攻略。菲律宾只有十四天、柬埔寨十四天也要注意。"},{"angle":"反常识开场","text":"泰国免签没取消，但天数从六十天砍回三十天，这条反差很多人没看懂。九月二号中国驻泰使馆明确：取消的是泰方单方面给九十三国的六十天政策，中泰双边三十天免签协定照旧。所以旅游照去，只是别按六十天排行程，第31天就逾期。更关键的是，免签从来不是免审查，边检照样查护照有效期、返程票、酒店和现金，个人一万泰铢家庭两万泰铢说查就查。很多人以为免签等于拎包就走，结果卡在现金或TDAC上被退。看清协定和材料清单，这趟才不会在机场翻车。菲律宾柬埔寨也只十四天，别一并记混。天数记准三十天，别在曼谷机场被请去喝茶。"}]},{"id":"tv4","title":"秋色最佳时间线：北边九月下旬，南边十月接力","hook":"九月下旬到十月是看秋色最好的窗口，时间线得卡准。","why":"强时效目的地玩法，长线赏秋已成主流，信息密集实用。","heat":"中高","tags":["目的地","季节性","收藏向"],"facts":["人民网内蒙古：阿尔山2026年金秋彩林盛景较常年提前7-10天，9月中下旬即巅峰，红橙金绿层叠（人民网内蒙古2026-09）","9月中下旬最早秋色在最北：新疆喀纳斯、禾木，内蒙古阿尔山，东北本溪陆续进入最佳观赏期；10月秋色南压，川西九寨沟、稻城亚丁、甘南、河北坝上接力（搜狐/人民网2026-09）","婺源晒秋9月中下旬开始，白墙黛瓦铺满红辣椒黄玉米；拉萨—上海航线预订量同比增4.4倍、拉萨—北京增3.4倍、拉萨—广州增3.3倍（搜狐；西藏游攻略2026-09）","西藏9月下旬至10月中旬为金秋巅峰：拉萨蓝天、林芝彩林、南迦巴瓦峰露出概率约80%；布达拉宫门票需提前10天官方小程序抢（西藏游攻略2026-09）","林芝方向专项补贴：2026年9月1日至12月31日，合作航司APP用云闪付购赴林芝机票可享300元普惠立减（西藏游攻略2026-09）"],"scripts":[{"angle":"干货直给","text":"九月下旬到十月是一年里看秋色最好的窗口，但时间线得卡准。最北的最早：九月上中旬新疆喀纳斯禾木、内蒙古阿尔山、东北本溪陆续进最佳期，今年阿尔山彩林比常年提前七到十天，九月下旬就是巅峰。十月往南压，川西九寨沟、稻城亚丁、甘南、河北坝上接力。想看烟火气，婺源晒秋九月下旬开晒，白墙黛瓦铺满红辣椒黄玉米。西藏则是九月下旬到十月中金秋巅峰，林芝彩林、南迦巴瓦露出概率约八成，布达拉宫门票要提前十天抢。拉萨航线预订同比涨四点四倍，越早订越稳。新疆秋色今年尤其热，别等国庆才动身。北边先红南边后黄，排早了只能看半绿不黄的树。"},{"angle":"故事切入","text":"我一个朋友去年国庆才去喀纳斯，结果叶子掉了一半，回来直拍大腿。秋色这东西，窗口比想象短。今年阿尔山彩林比常年提前七到十天，九月下旬就巅峰，错过等明年。规律是北边先红：九月上中旬喀纳斯禾木阿尔山本溪依次进最佳，十月川西九寨稻城甘南坝上接力，婺源晒秋九月下旬开晒最出片。西藏另算，九月下旬到十月中林芝彩林全年最浓，南迦巴瓦露出概率八成。所以长线赏秋别等十一，九月下旬出发人少价低，国庆机票酒店都贵一截。布达拉宫门票提前十天官方小程序抢，别临行才想。秋色窗口短，九月下旬就得动身别往后拖。"},{"angle":"实操流程","text":"想拍好秋色，按这条路线排最稳。九月中下旬先打最北：喀纳斯禾木、阿尔山、本溪，这个时候颜色最浓，阿尔山今年还提前了七到十天。十月初转川西：九寨沟、稻城亚丁、甘南、坝上，雪山配金秋是另一种开阔。顺路把婺源晒秋排上，九月下旬开晒，烟火气比纯风景更出片。西藏单独留七到八天，九月下旬到十月中金秋巅峰，林芝彩林最全年，布达拉宫门票提前十天官方小程序抢。预算上，林芝机票九月一号起云闪付立减三百，拉萨航线越早订越便宜，别拖到国庆。高原反应头天别剧烈运动。高原头天慢走别跑，反应上来了再放开玩。"}]},{"id":"tv5","title":"不想挤热门？县域小城加精品小团才是今年解法","hook":"假期越长越该往外跑，这个直觉今年可能坑你。","why":"反向错峰实用向，数据硬，避开人挤人体验更好。","heat":"中","tags":["反向旅游","小团","实用"],"facts":["搜狐：2026年中秋国庆县域旅行产品预订月环比涨60%，县域租车涨80%；福建平潭、广西阳朔等小城人少价平味道地道，适合不想赶景点的长假期（搜狐易行旅行2026-09）","精品小团规模同比涨47%，2-6人家庭小团更是翻倍以上(+132%)；国内旅游整体价格比去年降约5%，诉求集中在保证睡眠、行程不赶、一站式（搜狐2026-09）","反向旅游热：本地人把安吉竹海、南浔古镇当目的地错峰住一晚，不比出远门差；抢订量最高的五个商圈清一色在大型演唱会场馆周边，赶上演出城市酒店最先满房（搜狐/去哪儿2026-09）","热门城市酒店提前预订量同比涨近四成，抢订最凶十城：南京、北京、青岛、上海、成都、深圳、阿勒泰、呼伦贝尔、重庆、济南（搜狐/去哪儿2026-09）","待核实：国庆后本地活动(如莫干山跑山赛10-23、张韶涵演唱会11-7湖州站)具体可订性以官方为准"],"scripts":[{"angle":"干货直给","text":"不想挤热门城市，今年有个更舒服的选法：县域小城加精品小团。数据摆着，中秋国庆县域旅行产品预订月环比涨六成，县域租车涨八成，福建平潭、广西阳朔这类小城人少价平味道地道。小团也在涨，二到十人精品团同比涨四成七，二到六人家庭小团直接翻倍以上。国内旅游整体价还比去年降了约五个点，同样预算能住更好走更松。反向旅游也热，本地人把安吉竹海、南浔古镇当目的地错峰住一晚，不比出远门差。不想赶景点的，这十几天选个小城慢游最划算。热门十城酒店预订涨近四成，反向才是解法。反向走省路费还舒服，这才是长假该有的样子。"},{"angle":"横向对比","text":"同样十三天，挤热门和泡小城差出两重体验。热门这边，南京北京青岛上海成都等十城酒店提前预订量同比涨近四成，赶上演唱会的商圈最先满房最先涨价，人挤人体验打折。小城这边完全相反，平潭阳朔县域产品月环比涨六成、租车涨八成，价格平、人少、本地味道足。小团也是，二到六人家庭团翻倍以上，诉求就三个：保证睡眠、不赶、一站式。国内整体价还降了五个点。所以今年最优解不是冲大城市，是找个县域小城加个精品小团，钱花得少体验反而好。反向旅游把安吉南浔当目的地，不比远方差。小城慢游不赶场，才是真把假休明白了。"},{"angle":"反常识开场","text":"假期越长越该往外跑，这个直觉今年可能坑你。十三天长假听起来该去远方，但热门城市酒店提前预订量同比涨近四成，演唱会商圈最先满房，人挤人体验并不好。反倒是县域小城在悄悄涨：平潭阳朔产品月环比涨六成、租车涨八成，二到六人家庭小团直接翻倍以上。国内旅游整体价还降了五个点。也就是说，不出远门、找个近处小城慢游，又省又舒服。真正被低估的是那些人少价平味道地道的小城，加上一个不赶的精品小团，这趟才像放假而不是赶场。安吉竹海南浔古镇本地人都当目的地，错峰住一晚刚好。近处小城慢游，比挤远方人堆舒服太多。"}]}]},{"id":"ai","name":"AI 最新资讯及玩法","topics":[{"id":"ai1","title":"智谱开源GLM-5.3-Flash：3200亿参数，全程国产芯片，0.25美元/百万Token","hook":"国产芯片能不能扛大模型？智谱这次又给了个答案。","why":"国产算力突破+地板价，情绪价值和信息量都足。官方一手来源，安全。","heat":"高","tags":["强时效","国产","泛人群"],"facts":["智谱AI开源GLM-5.3-Flash：3200亿参数、激活180亿，以MIT许可证开源；Z.ai称其推理服务全程基于国产AI芯片，端到端性能较初始基准提升3倍，达每日100万亿免费Token规模（至顶科技2026-09-01，转引Z.ai）","GLM-5.3-Flash每百万输出Token仅0.25美元；智谱匿名模型Ox-Alpha此前登陆OpenRouter首日登顶调用榜、6天累计调用62万亿Token（至顶科技2026-09-01；CSDN AI日报2026-09-04）","智谱AI主打智能体编程与网络防御方向，综合智能指数达60分，与Claude Fable 5处于同一梯队（CSDN AI日报2026-09-04）","待核实：GLM-5.3-Flash的MIT许可证条款与商用边界以Z.ai官方仓库为准"],"scripts":[{"angle":"干货直给","text":"智谱把GLM-5.3-Flash开源了，几个数字值得看。总参数三千二百亿，每次激活一百八十亿，用MIT许可证开源，这意味着商用基本没门槛。最狠的是成本，每百万输出Token只要零点二五美元。智谱说这套推理全程跑在国产AI芯片上，端到端性能比初始基准提升三倍，每天能放出一百亿亿免费Token。匿名模型Ox-Alpha之前上OpenRouter首日就登顶调用榜，六天累计调用六十二万亿Token，说明大家真在用不是围观。对普通人来说，国产芯片加开源加地板价，意味着以后调大模型的成本还会继续往下走。"},{"angle":"故事切入","text":"用大白话讲GLM-5.3-Flash为什么值得关注。第一，它大但省，三千二百亿总参数每次只唤醒一百八十亿，像养了几百个专家只叫醒相关的几个。第二，开源用MIT协议，基本等于你能拿去随便商用，不用交授权费。第三，便宜到离谱，一百万Token输出才零点二五美元，对比主流模型这是地板价。第四，关键在国产芯片，智谱说全程跑在国产算力上，性能还提了三倍，说明国产卡扛大模型这件事又往前走了一步。每天一百亿亿免费Token，足够个人和小团队随便造。长期看，模型价格还会被这类开源继续往下压。"},{"angle":"横向对比","text":"把GLM-5.3-Flash和主流模型摆一起看，差距在成本结构。参数三千二百亿、激活一百八十亿，和同档MoE一个量级，但每百万输出Token只零点二五美元，这是地板价。更关键的是全程国产芯片、端到端性能提三倍，加上MIT协议随便商用，还每天放一百亿亿免费Token获客。匿名模型Ox-Alpha六天六十二万亿调用说明这条路通了。对比海外闭源模型按调用高价收费，智谱这招是用开源加低价换生态。对做应用的来说，模型层越来越不是壁垒，怎么用好才是。国产芯片这条线走通，长期价格还会往下压。"}]},{"id":"ai2","title":"阿里Wan3.0加千问Agent Teams：一句话拍片的工作流铺齐了","hook":"模型越卷越强，但赢家可能不是模型厂商。","why":"视频生成工作流强时效，直接对应做内容人群，实用。","heat":"高","tags":["强时效","视频","玩法"],"facts":["阿里通义万相Wan 3.0于2026-8-24发布：单次可生成30秒视频、原生4K分辨率、首次支持多格式文档直接输入，人物一致性与画面稳定性显著提升（澎湃新闻2026-09-04）","千问创作Agent Teams于2026-8-31正式向所有用户开放：编剧、导演、美术、摄影、剪辑五个Agent串成从创意到成片的完整流水线（澎湃新闻2026-09-04）","MiniMax上线官方创作工作台MiniMax Design整合生成/编辑/剪辑全链路；字节同期内测漫剧创作工具与Seedance Studio，行业重心从模型能力转向工业化生产工具（澎湃新闻2026-09-04）","阿里千问此前发布27B参数Qwen3.8模型，在智能体执行、代码、工具使用基准中超Anthropic Claude Opus 4.6 Max（CSDN AI日报2026-09-04）","待核实：Wan 3.0公测期商用授权与价格以阿里官方为准"],"scripts":[{"angle":"干货直给","text":"阿里在视频生成上把工作流铺齐了。万相Wan 3.0八月二十四号发布，单次能生成三十秒视频、原生4K，第一次支持多格式文档直接输入，人物一致性和画面稳定性明显提升。紧接着八月三十一号千问创作把Agent Teams全量开放，编剧、导演、美术、摄影、剪辑五个智能体串成从创意到成片的流水线，你给个想法它自己拆步骤跑。同一周MiniMax上线官方工作台Design整合生成编辑剪辑，字节内测漫剧工具和Seedance Studio。行业共识很清楚：模型军备竞赛到平衡点，下一战是谁把模型变成能工业化生产的工具。"},{"angle":"实操流程","text":"想用AI做一条短视频，现在最顺的流程是这样的。第一步在千问创作开Agent Teams，把你的脚本或想法丢进去，编剧Agent先出分镜，导演Agent排节奏。第二步美术和摄影Agent生成画面，Wan 3.0负责把文档和参考图变成三十秒4K视频，人物一致性比上代稳。第三步剪辑Agent串成片，需要精修的丢MiniMax Design或字节Seedance Studio这种工作台。关键点：别指望一个模型一步到位，工作流才是生产力。对短剧漫剧从业者，这条流水线已经从剧本压到成片，过去要一个团队干的活现在一个人配几个Agent就能跑。"},{"angle":"反常识开场","text":"模型越卷越强，但赢家可能不是模型厂商。阿里Wan 3.0刚发一周，千问就推出配套Agent Teams，把模型包成从剧本到成片的完整生产层。问题是Wan早就接了第三方平台，可生产流程和数据都沉淀在别人那，阿里作为模型方既攒不下创作者生态也做不出辨识度。所以阿里和MiniMax同时转向官方工作台加第三方渠道的双线打法，自己把工具做了。字节作为主导者则用工具体系守生态。结论：模型能力追平后，真正的护城河是工作流和创作者关系，不是那几个生成参数。谁占住创作者谁赢。创作者关系才是真资产，模型只是其中一环。"}]},{"id":"ai3","title":"AI视频洗牌：Sora 9月24日退场，国产接棒，音画同步成标配","hook":"做AI视频最该避的坑，是还在追已经要关的Sora。","why":"强反常识+选型地图，直接对应做视频人群，收藏率高。","heat":"中高","tags":["反直觉","视频","选型"],"facts":["OpenAI Sora于2026-3-24宣布战略转型终止视频业务，4-26 App停服，9-24 API关闭，曾被视为行业灯塔的产品退场（aicomparison.ai、AI四类模型详解2026-09）","Sora退场后国际稳定选择剩Google Veo 3.1、Runway、Luma；原生音频成分水岭——Veo 3.1、可灵2.6、Seedance 2.5、万相2.6已支持音画同步，AI视频等于无声旧认知过时（AI四类模型详解2026-09）","llm-stats盲投人类投票(2026-09)：Kling v3 Omni以arena 1934领先，Happy Horse 1.0(1816)、Seedance 2.0 Fast(1747)次之；可灵强在物理运动与物体恒存（llm-stats 2026-09）","截至2026-09国产工具密集迭代：可灵3.0(2026-2全球)、即梦Seedance 2.5(2026-7,原生30秒+4K)、万相2.6(音画同步+角色扮演)、海螺H3(2K)（AI四类模型详解2026-09）","Google Gemini Omni 1.1 Flash于2026-8-27发布，经Google Flow可用，与Wan 3.0并列Artificial Analysis文生视频带音频榜Elo 1238（devopsschool 2026-09-04）"],"scripts":[{"angle":"干货直给","text":"AI视频行业今年最大的事是Sora退场。OpenAI三月二十四号宣布终止视频业务，四月二十六App停服，九月二十四API关闭，曾经的行业灯塔就这样退了。退场后国际稳定选择剩Google Veo 3.1、Runway、Luma。国产这边接棒：可灵3.0、即梦Seedance 2.5、万相2.6、海螺H3，而且原生音频成了分水岭，Veo 3.1、可灵2.6、Seedance 2.5、万相2.6都支持音画同步，AI视频等于无声的旧认知已经过时。盲投人类投票里可灵v3以一九三四分领先。一句话，做视频别再盯着Sora，看国产这几家加Veo。"},{"angle":"横向对比","text":"把2026年九月视频模型的牌面摆一摆。Sora确认九月二十四API关闭，彻底退出。Google Gemini Omni 1.1 Flash八月二十七发布，经Google Flow可用，与万相3.0并列文生视频带音频榜Elo一二三八。盲投投票llm-stats九月数据：可灵v3 Omni一九三四分第一，Happy Horse 1.0一八一六、Seedance 2.0 Fast一七四七次之，可灵强在物理运动和物体恒存。国产迭代密度高：可灵3.0二月全球、即梦Seedance 2.5七月原生三十秒加4K、万相2.6音画同步加角色扮演、海螺H3的2K。选型就三条：要音画同步看这几家，要运动物理看可灵，要后期看Runway。"},{"angle":"反常识开场","text":"做AI视频，最该避的坑是追Sora。很多人还停留在Sora等于最强的印象，但它九月二十四就关API了，现在入坑等于上一条要沉的船。真相是国产已经接棒：可灵3.0、即梦Seedance 2.5、万相2.6、海螺H3，而且音画同步成了标配，Veo 3.1和可灵2.6都能直接出带对白和音效的片。盲投投票可灵v3一九三四分领跑，物理运动最稳。所以别再等Sora复活，也别被单个炫酷demo骗。选型看三点：音画同步、运动物理、后期能力，分别对应这几家。省下的时间用来磨脚本，比换工具值钱。钩子就一句：别追要沉的船。"}]},{"id":"ai4","title":"讯飞星火X2.5端侧百万Token：手机本地就能吞百万字","hook":"端侧模型卷到百万Token，手机断网也能跑大模型了。","why":"国产端侧突破，隐私+离线场景质变，实用玩法强。","heat":"中高","tags":["国产","端侧","玩法"],"facts":["科大讯飞子公司词元星火2026-9-1开源星火X2.5-4B与1.7B两款端侧模型，为端侧首个原生支持100万Token上下文的模型，已上架Hugging Face与GitHub，9月7日将发旗舰星火X2.5（新京报、至顶科技2026-09-01）","两款模型基于全国产算力训练，用约20万亿Token预训练，采用混合注意力架构，围绕智能体、代码、数学、指令遵循优化；支持英伟达、华为、海光、后摩等硬件及vLLM/SGLang/llama.cpp，可Ollama/LM Studio部署（新京报2026-09-01）","端侧模型可断网运行，常用于手机、PC、汽车座舱、智能家居、机器人；示例：导入完整售后手册后可跨章节关联退换货、故障处理、例外条件给出综合判断（新京报2026-09-01）","词元星火已入驻国家超算互联网AI社区，企业/开发者可下载权重二次开发、本地部署（超算互联网2026-09-01）"],"scripts":[{"angle":"干货直给","text":"科大讯飞把端侧模型卷到百万Token了。九月一号词元星火开源星火X2.5的4B和1.7B两款，是端侧首个原生支持一百万Token上下文的模型，已经上架Hugging Face和GitHub，九月七号还要发旗舰版。两款都用全国产算力训练，约二十万亿Token预训练，支持英伟达华为海光后摩等硬件，能Ollama、LM Studio直接跑，断网也能用。什么概念？你手机或电脑本地就能吞下一百万字再跟你聊细节，不用把数据传上云。对隐私敏感和离线场景，这是质变。车机座舱智能家居机器人也能本地跑，端侧从听懂向办事演进。"},{"angle":"故事切入","text":"说人话解释端侧百万Token有什么用。第一，它跑在你自己设备上，手机电脑甚至车机，断网也能用，数据不出本地，隐私这关直接过了。第二，一百万Token上下文等于一次能塞进一百万字，比如把整本产品售后手册导进去，问买十天设备故障加用过第三方耗材符不符合换货，它能跨章节关联退换货、故障处理、例外条件给综合判断。第三，便宜好部署，开源权重已上HF和GitHub，Ollama一键拉起。第四，九月七号旗舰版要发，端侧从听懂向办事演进。普通人意义：本地私人助手不用月费不用联网，数据安全还免费。"},{"angle":"横向对比","text":"讯飞这步端侧百万Token，和云端模型是两条路。云端模型强在算力无限、能跑最大参数，但每次调用要联网、要按Token收费、数据得出本地，隐私和成本都是门槛。端侧X2.5反过来，断网运行、数据不出设备、一次部署长期零调用费，代价是模型小些，4B和1.7B适合手机车机。对医疗政务金融这些不敢上云的数据，端侧是唯一解，这也是全国产算力训练的意义。行业判断：端云混合会是接下来一年的主流架构，重活上云、敏感活留端。九月七号旗舰版发，端侧能力还会再上一档。端云混合架构，明年会是行业主流。"}]},{"id":"ai5","title":"中国模型出海：MiniMax M3成为沙特阿拉伯语大模型底座","hook":"中国大模型出海，这次不是卖API是卖底座。","why":"模型出海新含义，趋势判断强，延伸国产AI叙事。","heat":"中","tags":["趋势","出海","国产"],"facts":["2026-9-3，基于MiniMax开源旗舰M3打造的沙特HUMAIN M3正式发布，为首个阿拉伯语大模型；采用4280亿参数MoE架构、每Token激活230亿（中国经营报2026-09-04）","HUMAIN M3由沙特PIF旗下AI公司HUMAIN推出，在MiniMax M3基础上用超1万亿Token阿拉伯语数据后训练，强化阿语理解生成、本地文化适配及Agent/工具调用/计算机操作（中国经营报2026-09-04）","中国大模型过去主要经API或应用出海，此次M3直接成为海外本土模型研发的基础模型，开放模型本身正成为全球开发者构建本土AI能力的技术底座（中国经营报2026-09-04）","工信部2026-09-01印发专项行动通知：聚焦AI落地最后一公里，目标2026年底AI应用服务商资源池突破2000家、2027年底不少于3000家，探索首购首用、风险补偿加大大模型采购（工信部/至顶科技2026-09-01）"],"scripts":[{"angle":"干货直给","text":"中国大模型出海，这次不是卖API是卖底座。九月三号，沙特PIF旗下AI公司HUMAIN基于MiniMax开源旗舰M3，发布了首个阿拉伯语大模型HUMAIN M3。M3用四千二百八十亿参数MoE架构、每Token激活二百三十亿，在MiniMax M3上用超一万亿Token阿语数据后训练，强化阿语理解、本地文化适配和工具调用。重点在模式变了：过去中国大模型主要经API或应用出海，这次M3直接成为海外本土模型研发的基础模型，开放模型本身成了别人建本土AI的技术底座。工信部也发通知年内培育超两千家服务商，政策在跟上。"},{"angle":"横向对比","text":"MiniMax M3变成沙特阿拉伯语大模型的底座，这事信号很强。第一，中国基础模型被国际认可到能当研发地基，不再是只输出成品应用。第二，出海含义在升级，从卖API、卖产品，到卖模型权重让对方在自己土地上训练本土模型，后者粘性高得多。第三，沙特用PIF砸钱建本土AI能力，选中国开源模型做底座，说明国产开源的性价比和可用性到了能扛国家级项目的程度。对比过去靠应用出海，卖底座卡的是更上游的生态位，长期价值完全不同。模型本身出海，比产品出海扎得更深。底座出海比产品出海，扎得更深更久。长期看，这条路比卖产品更值钱。"},{"angle":"故事切入","text":"这条新闻对做内容的人有什么用？我说三点。第一，模型出海意味着中文模型的生态越来越大，你用的工具背后可能就是这些国产底座，长期价格和可用性会更稳。第二，多语言模型起来，做跨境内容、外语素材生成的门槛在降，HUMAIN M3这种本土化模型会让阿拉伯语等小语种内容生产变便宜。第三，配套政策在跟上，工信部九月一号发通知要年内培育超两千家AI应用服务商，首购首用和风险补偿会拉动大模型采购。对创作者，趁模型便宜把工作流搭好，比等工具成熟再入场划算。国产底座稳了，上层应用才便宜。国产底座稳了，上层应用才会越来越便宜。"}]}]}]},"2026-09-05":{"date":"2026-09-05","updatedAt":"2026-09-05T10:09:00+08:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月机票1折窗口：现在不买，国庆贵一半","hook":"9月首周机票比国庆第一天便宜一半，过两周就回去了。","why":"今天9月5日正好卡在1折窗口尾巴，发文提醒最值钱；全民省钱，收藏转发高。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["去哪儿等多家平台数据：9月首周国内机票均价较暑期出行高峰回落约35%，较国庆假期首日（10月1日）票价降幅达五成，部分航班含机建燃油总价不足300元（中国商报、腾讯网、经济参考网2026-09-02，均引去哪儿）","9月上旬北京出发多条航线现1折经济舱：9月2日北京-太原裸票230元、9月6日北京-银川220元、9月8日北京-郑州160元；航旅纵横限时特惠北京-太原200元起（北京日报、携程、航旅纵横2026-09-01/02）","业内共识：9月为传统淡季，运力充沛，十一前机票维持低位；9月中旬后价格明显上涨，国庆前后达峰（中国吉林网、腾讯网2026-09-02 引长江证券分析师）","错峰时间表（去哪儿）：9月22日抢跑出发均价较中秋首日低30%、较国庆首日低50%；9月27日至10月1日机票均价创近三年同期最低（中国商报、潮新闻、经济参考网2026-09-02/03）"],"scripts":[{"angle":"干货直给","text":"9月首周是国内机票全年最低的一段。去哪儿的数据，9月首周机票均价比暑期高峰回落了35%，比国庆第一天便宜一半，不少航班含机建燃油总价还不到300块。具体看，9月2号北京飞太原裸票230，9月6号飞银川220，9月8号飞郑州160，航旅纵横限时特惠北京飞太原200起。原因不复杂，9月是传统淡季，学生返校、运力又没减，供需一下松了。但这个窗口不长，业内判断9月中旬价格就明显抬头，国庆前后到顶。想飞趁这两周，别等中秋前一周再买，那时低价舱早空了。记住一条，低价票余票有限，看准了别犹豫，周五和假期前最贵。"},{"angle":"实操流程","text":"想把9月这波低价机票捡稳，按这个顺序走。第一步，先定目的地和大致日期，别等到放假前才看，那时候均价已回一半。第二步，盯早班和晚班，1折舱基本都绑在红眼或清晨航班，便宜但折腾，能接受就值。第三步，周二周三出发再便宜一档，避开周五和假期前。第四步，看到230、160这种裸票价先加机建燃油，实际多一两百，别被数字骗。第五步，特价票多不能退改，行程有变数的别贪，买可退的更稳。最后提醒，9月下旬价格起跳，9月22号前出发最划算，越拖越贵。周四出发也比周五便宜，能调就别卡周末，省下的钱够吃顿好的。"},{"angle":"反常识开场","text":"越早订机票越便宜，这句话在9月是错的。现在9月初，机票不是从低到高一条直线，而是刚从暑期高位砸下来，正处在全年最低点。去哪儿的数据，9月首周比国庆第一天便宜一半，北京飞郑州一度160，飞银川220。太早买反而贵，因为暑运运力刚投放完，折扣舱正集中释放。过了9月中，学生流走完、假期预期上来，价格立刻回弹，国庆前后到全年顶。所以现在这个时点最特殊：既便宜、又还有票。别信越早越省，也别拖到节前，这两头都亏，中间这两周才是捡漏区。这两周每天刷一次价格，看到合适的立刻锁，别等那句再看看。"}]},{"id":"tv2","title":"请3休13拼假全攻略：中秋不免费、国庆免费8天","hook":"中秋高速不免费，国庆才免费，别搞混白跑一趟。","why":"9月28-30日请3天拼13天全年最长假，本周定行程最划算；含高速/酒店/门票避坑，实用收藏。","heat":"高","tags":["强时效","全民","避坑"],"facts":["2026年中秋9月25-27日放假3天不调休，国庆10月1-7日放假7天；中间9月28-30日请3天年假可连休13天，多数人工龄满1年即有5天年假足够（国务院办公厅安排、诚意国旅2026-09-02）","去哪儿数据：抢订9月28-30日酒店量同比增长52%，长假每7单至少1单来自请假党；中秋前工作日为假期前后机票最低时段（去哪儿、潮新闻2026-09-03）","高速免费规则：中秋假期（9月25-27日）7座及以下小客车正常收费不免费；国庆10月1日0时至10月8日24时免费通行共8天（诚意国旅引交通运输部、2026-09-02）","酒店价格前高后低：10月5日后入住较峰值降35%-55%，10月8日降幅超55%；热门门票需提前约，九寨沟提前14天、故宫提前7天3分钟售罄（诚意国旅、极目新闻2026-09-02）"],"scripts":[{"angle":"干货直给","text":"中秋国庆拼13天长假，规则先讲清。中秋9月25到27号放3天不调休，国庆10月1到7号放7天，中间28、29、30号请3天年假，连起来就是9月25到10月7号共13天。多数人工龄满一年就有5天年假，请3天绰绰有余。关键是别搞错高速免费：中秋那3天7座以下小车正常收费，不免费；国庆才是10月1号0点到8号24点免费，一共8天。所以自驾的别卡中秋出行，要么赶国庆免费段，要么错峰平日走。酒店也讲究，10月5号之后再住比峰值便宜35%到55%，把核心目的地排到假期后半段更划算。把这套排好，同样的钱能比临时订多玩一个城市。"},{"angle":"避坑清单","text":"请3休13这套，五个坑先排掉。第一，年假要提前请，至少提前两周交假条附交接清单，别等9月底才说，领导批不下来退票亏一半。第二，高速免费只认国庆段，中秋不免费，自驾别在9月25到27号上高速指望免单。第三，机票9月22号前抢跑出发最便宜，比国庆首日低一半，别挤10月1号。第四，热门门票提前约，九寨沟提前14天早8点放票两小时售罄，故宫提前7天晚8点3分钟没，带老人孩子60岁免票也要抢名额。第五，酒店10月5号后入住立降35%到55%，行程弹性大的把好玩的排后头。别等放假前两天才动手，那时候票和房都贵了一截。"},{"angle":"说人话版","text":"用大白话解释请3休13怎么最爽。你只有3天年假，却能换13天连休，核心是中间那3个工作日卡进去。代价最小、收益最大的玩法：9月25号就出发，比大部队早走6天，机票酒店都便宜；中秋先陪家人，国庆段再去远处玩，分段走人不累。高速记住一条，中秋不免费国庆免费，自驾要么国庆0点后上要么平日走。酒店别死磕10月1到4号峰值，5号以后同档次便宜一半。九寨沟彩林、杭州桂花、北京红叶一年就这20多天，排好了别贪多，体验比跑十个城市强。会排的人，3天年假撬动的是全年最长的一段假期。把假排满不如排好，留一天机动最稳。"}]},{"id":"tv3","title":"对角线飞行赏秋：拉萨航线预订暴涨4.4倍","hook":"今年长假最魔幻的飞法：从地图右下角飞到左上角。","why":"数据反差强（拉萨-上海4.4倍），秋色+长线错峰，适合做数据向口播；9月中-10月底最佳赏秋窗口。","heat":"中高","tags":["数据向","反直觉","长线"],"facts":["去哪儿数据：超长假期带动'对角线飞行赏秋'，拉萨-上海航线预订量同比增长4.4倍、拉萨-北京3.4倍、拉萨-广州3.3倍；2000公里以上航线预订量同比翻番（极目新闻、内蒙古日报2026-09-02，引去哪儿）","小机场城市热度：吉林延吉预订增幅TOP1达3.8倍，宁夏中卫、新疆阿勒泰紧随其后接近翻倍；三线及以下'宝藏百城'机票量同比增超30%（去哪儿2026-09-02）","时间窗口：9月中至10月底为全年最佳赏秋期，错峰10天体验翻倍；国庆客流10月5日后快速回落（诚意国旅、极目新闻2026-09-02）","长线深度游崛起：预订2个及以上目的地旅客同比提升近20%，包车游、私家团、小团定制热度提升（潮新闻、携程2026-09-03）"],"scripts":[{"angle":"数据向","text":"今年长假最反常识的飞法，叫对角线飞行赏秋。去哪儿的数据，拉萨飞上海航线预订量同比增长4.4倍，拉萨飞北京3.4倍，拉萨飞广州3.3倍；2000公里以上的长航线整体翻了一倍。背后逻辑是超长假期让人敢跑远，9月中到10月底又是全年最佳赏秋窗口，川西、新疆、内蒙古、甘肃的彩林正盛。小机场城市也火，吉林延吉预订增幅排第一达3.8倍，宁夏中卫、新疆阿勒泰接近翻倍，三线以下宝藏百城机票量涨超30%。所以今年不是挤热门，是从地图右下角飞到左上角，人少景好还便宜。这波秋色不等人，国庆后人一少体验直接翻倍。"},{"angle":"反常识开场","text":"今年国庆最贵的不是机票，是信息差。大家都往三亚、西安挤的时候，另一批人悄悄买了飞拉萨、飞延吉的票。去哪儿的数据，拉萨飞上海预订涨了4.4倍，延吉这种小机场城市涨了3.8倍，长线赏秋成了抢订主流。为什么？13天长假把时间门槛冲破了，以前请不出假跑不了几千公里，现在能。而且秋色就这20多天，国庆5号后景区人流快速回落、房价腰斩，错峰10天体验翻倍。所以别跟着大流向热点撞，往西北、东北、西南的彩林线走，同样的钱体验好一倍。信息差就是省钱差，会找线的人花期避峰两不误。早定早安心，别等天气完美再出发。"},{"angle":"实操流程","text":"想抄这波对角线赏秋，照这个节奏订。第一，出发日选9月22号前后抢跑，机票比国庆首日便宜一半，人也少。第二，目的地挑秋色正盛的，川西、喀纳斯、阿尔山、延吉、呼伦贝尔都在窗口期，别等10月再动，北方10月中下旬就下雪了。第三，住宿排假期后半段，10月5号后房价比峰值低35%到55%。第四，热门景区提前约，九寨沟提前14天、故宫提前7天，别赌现场。第五，13天别排满，留一两天机动应对山区秋雨和延误。长线加深度，这假才不白请，秋色不等人。北方赏秋窗口短，定了就下手，别等天气完美再出发。"}]},{"id":"tv4","title":"中国护照免签56国：清单与避坑（俄罗斯/巴西时效待核实）","hook":"持普通护照能免签去56个国家，但天数记错要被罚。","why":"长效收藏向，政策清单+避坑；俄罗斯/巴西时效敏感标待核实，正文只写确认项。","heat":"中","tags":["收藏向","出境","避坑"],"facts":["截至2026年9月1日，中国公民持普通护照可免签入境56个国家（中国领事服务网；多家公众号汇总口径一致，2026-09-01）","互免主流：新马泰各单次停留30天（泰国180天累计≤90天）、阿联酋90天、塞尔维亚/白俄罗斯30天、毛里求斯60天；单方免签菲律宾14天（限马尼拉/宿务口岸，试行2026-01-16至2027-01-16）（中国领事服务网汇总）","巴西单方面免签2026-05-11起至2026-12-31，累计≤30天不可延期（多来源一致）；俄罗斯临时对等免签：待核实——中国领事服务网汇总称有效期至2027-12-31，另有来源称2026-09-14到期，出发前务必复核官方","免签≠无条件入境：需返程机票、酒店订单、足额资金；泰国须填TDAC电子入境卡并备1万泰铢/家庭2万泰铢现金（泰国国家旅游局北京办2026-07-09更新）；护照有效期须满6个月"],"scripts":[{"angle":"干货直给","text":"截至9月1号，中国普通护照能免签去56个国家，这个数今年又涨了。互免的主流里，新马泰各能停留30天，阿联酋90天，塞尔维亚、白俄罗斯30天，毛里求斯60天。单方免签里菲律宾14天，但只限马尼拉和宿务机场入境，试行到2027年1月。巴西5月11日起免签到12月31号，累计30天。要提醒的是，免签不等于无条件入境，边检照样查返程机票、酒店订单和资金，泰国还要填TDAC电子入境卡、备1万泰铢现金。护照有效期必须满6个月，这些材料不齐一样被拒。出行前一周上中国领事服务网核一遍最新清单最稳。"},{"angle":"避坑清单","text":"免签出行五条避坑，出发前核对一遍。第一，天数别记混，新马泰30天、菲律宾只有14天，按单次入境算，飞菲律宾按30天排行程第15天就逾期。第二，免签不是免审查，落地要看回程机票、住宿和资金证明，缺一样可能被退。第三，护照有效期满6个月且有空白页，这条卡掉过不少人。第四，电子入境卡别漏填，泰国TDAC、马来西亚MDAC、新加坡SGAC，漏填可能被拦。第五，政策随时变，俄罗斯等国时效性敏感，出发前上中国领事服务网复核最新官方，别信过期攻略。材料齐了过关才顺，别把免签当成免查随便飞。"},{"angle":"说人话版","text":"说人话解释免签到底免什么。免的是提前去大使馆递材料、交钱、等审批这套流程，拿护照买票就能飞。但落地那一关还在，边检有权问你来干啥、住哪、啥时候走、带多少钱，答不上来或材料对不上照样退你。所以免签省的是出发前的时间和钱，不省入境审查。具体天数，新马泰30天、菲律宾14天、巴西到年底30天，差别记住。还有，泰国入境要填TDAC电子卡再加1万泰铢现金备查，这是硬规定不是建议。出发前一周上中国领事服务网核一遍，两分钟省一趟白跑。两分钟核一遍，能省掉一趟白跑的机票钱和酒店钱。白跑一趟最亏，核一遍只要两分钟。"}]},{"id":"tv5","title":"跟着演唱会去旅行：济南酒店暴涨12.8倍","hook":"今年订酒店最诡异的变量，不是景点，是演唱会。","why":"反直觉强（凤凰传奇带动济南+12.8倍），年轻人/内容创作者共鸣高；顺带带出县域宝藏百城趋势。","heat":"中高","tags":["反直觉","年轻人的事","趋势"],"facts":["去哪儿数据：凤凰传奇演唱会带动济南奥体中心/万象城商圈酒店预订量同比猛增12.8倍，拉动济南全市酒店预订+65%；邓紫棋带动深圳龙岗+2.9倍、周杰伦带动青岛+20%（极目新闻2026-09-02）","华晨宇多日演唱会拉动南京酒店抢订量超北京成全国第一；中秋国庆酒店抢订TOP10含南京、北京、青岛、成都、阿勒泰、呼伦贝尔等（去哪儿2026-09-02）","同程数据：中秋国庆期间飞赴三线及以下'宝藏百城'机票量同比增超30%；长线深度游与县域松弛游表现突出（经济参考网、同程2026-09-02）","跟演唱会提前锁去向成显著趋势，演唱会场馆周边商圈包揽假期酒店预订前5名（极目新闻引去哪儿2026-09-02）"],"scripts":[{"angle":"数据向","text":"今年订酒店最诡异的变量不是景点，是演唱会。去哪儿的数据，凤凰传奇演唱会带动济南奥体中心周边酒店预订同比猛涨12.8倍，直接把济南全市酒店预订拉高65%；邓紫棋带深圳龙岗涨2.9倍，周杰伦带青岛涨20%。华晨宇多日演唱会更狠，把南京酒店抢订量顶到全国第一，超过北京。原因很清楚，大家先锁演唱会再安排假期，场馆周边商圈包揽了假期酒店预订前5名。所以订行程前先查目的地有没有演唱会，有就提前半个月锁房，不然价格能翻几倍。有演出就提前半个月锁房，这是最硬的省钱一招。这是实打实的省钱招，照着做就生效。"},{"angle":"反常识开场","text":"想去人少又便宜的地方，别看热门景区榜单，看演唱会和百城榜。今年中秋国庆，跟着演唱会走的人把济南酒店拉高12.8倍、南京顶到全国第一，这是真金白银的客流信号。另一头，同程数据飞赴三线以下宝藏百城机票量涨超30%，县域松弛游、长线深度游成了主流。结论反着来：别去西湖、天安门人挤人，去有演唱会的城市顺道玩，或者去延吉、中卫、阿勒泰这种小城慢游。前者有夜经济热闹，后者有秋色清静，都比挤传统顶流体验好，花钱还少。反着走的人，花钱少还玩得松，这才是真的聪明。这条规律在今年特别灵，照着走就省。"},{"angle":"趋势判断","text":"从演唱会带动酒店这个现象，能看出旅游消费的两个转向。第一，决策起点从景点变成事件，大家先定演唱会、音乐节、赛事，再倒推行程，所以场馆周边商圈包揽假期酒店前5名，济南、南京被一场演出改写排名。第二，目的地下沉，飞三线以下宝藏百城机票涨超30%，县域松弛游接住了不想挤的人。对做内容的来说，这两个都是选题富矿：城市演唱会日历、小城慢游攻略，比反复写十大景点新鲜得多，也更容易被本地和年轻用户转。趋势比景点清单活得更久。盯事件和盯小城，比盯十大景点更新鲜也更好做。做内容就盯这两类选题，新鲜又好转化。"}]}]},{"id":"ai","name":"AI 最新资讯及玩法","topics":[{"id":"ai1","title":"腾讯混元Hy4 preview开源：770B参数、1M上下文","hook":"腾讯把7700亿参数的模型开源了，还能自己优化自己。","why":"国产开源突破，一手官方来源；自主优化推理系统是标志性信号，泛人群+技术双受众。","heat":"高","tags":["强时效","国产","开源"],"facts":["腾讯9月1日发布并开源混元Hy4 preview：总参数770B、激活49B、原生1M上下文、MoE架构，定位'为生产力而生'（腾讯官方发布页2026-09-01）","标志性进展：模型自主发现并优化自身推理系统瓶颈，端到端吞吐提升31.8%，即'AI优化AI基础设施'（腾讯官方、ima AI周报2026-09-01/02）","9月2日推出轻量版，用自研Sherry稀疏三值量化将权重从近1.5TB压缩至约214GB，异构设备可联合推理，上线首日挤爆服务器后扩容（互联网大厂日报2026-09-02）","待核实：开源协议是否Apache 2.0仅见单一CSDN来源（2026-09-04），正文以'开源'为准不写具体协议"],"scripts":[{"angle":"干货直给","text":"腾讯把混元Hy4 preview开源了，这事值得看。先说参数，总参数7700亿，每次激活490亿，原生支持100万token上下文，MoE架构，定位就是给真实生产力用的。但真正有意思的不是大，是它会自己优化自己。官方说模型自主发现并修掉了自身推理系统的瓶颈，端到端吞吐提升31.8%，也就是AI在改AI的基础设施。这信号比模型本身重要，说明国产开源阵营开始卷工程效率而不是只刷榜。9月2号还出了轻量版，用自研量化把权重从1.5TB压到214GB，普通机器也能跑，上线当天服务器被挤爆。"},{"angle":"说人话版","text":"用大白话讲腾讯这个开源模型。第一，规模大但省，7700亿总参数每次只唤醒490亿，像养了几百人的专家团，来什么活叫醒相关的几个，又大又省。第二，上下文100万token，一本《三体》全集能一口气读完再跟你聊细节。第三，最关键的，它会自己优化自己的推理系统，官方说吞吐提升31.8%，这是AI改AI基建，以前得人盯着调。第四，开源，轻量版把权重压到214GB，普通显卡能跑，上线当天挤爆服务器。对普通人意义是，国产开源这条路越走越实，长期看模型价格还会往下走。普通机器能跑，意味着本地部署的门槛是真的塌了。"},{"angle":"趋势判断","text":"从混元Hy4能看出国产开源的三个走向。第一，评估锚点变了，腾讯把真实生产力任务盲测当标准，不再只刷学术榜，说明竞争维度从分数切到企业能不能真用。第二，模型开始管自己的基建，自主优化推理系统提升31.8%吞吐，AI for AI Infra成了新赛道，效率和成本会一起往下走。第三，开源权重正从获客入口变成生态标准，轻量版214GB能跑说明部署门槛在塌。接下来半年，比的不是谁参数大，是谁的模型在真实业务里跑得稳、跑得便宜。谁先在真实业务里跑稳，谁就先拿走这一轮生态。生态才是真正的护城河，先跑稳的先赢。"}]},{"id":"ai2","title":"阿里Qwen3.8-Max登顶前端编程榜 + 千问办公生态","hook":"阿里这个新模型，前端编程把国外一众全压下去了。","why":"登顶CodeArena有硬跑分；千问办公公测与创作者/办公人群强相关；5美元/百万token成本可讲。","heat":"高","tags":["强时效","编程","国产"],"facts":["阿里9月2日更新旗舰Qwen3.8-Max至0902版，CodeArena前端编程总榜以1691分登顶，总参数2.4万亿、支持100万上下文Tokens（三言科技、四川观察2026-09-02）","每百万Tokens均价约5美元，已接入千问AI平台提供API，并接入千问办公、Qoder与千问App（四川观察2026-09-02）","阿里'千问办公'(QwenWork)8月3日开启公测，由QoderWork、MuleRun、悟空整合；8月26日国际版公测；阿里云多角色Agent平台'万有无界'9月2日公测（中国商报、互联网大厂日报2026-09-03/04）","万有无界支持项目空间、群聊协作与资产沉淀，组织记忆与流程资产归属企业账户，可调用Qwen3.8-Max（互联网大厂日报2026-09-03）"],"scripts":[{"angle":"干货直给","text":"阿里9月2号更新了旗舰模型Qwen3.8-Max，一个硬指标很炸：在CodeArena前端编程总榜以1691分登顶，超过了国外一众对手。参数上总规模2.4万亿，支持100万token上下文，每百万token均价约5美元，已经接进千问AI、Qoder和千问App。对写代码、做前端的人来说，这意味着国产模型在编程这条最卷的线上站到了头排。而且它不只是API，阿里把千问办公、万有无界这些Agent产品全接上了，一句话从写代码到排任务能串起来。登顶加低价，是冲着真用的人来的。冲着真用的人来的，不是只发个榜就完事。"},{"angle":"说人话版","text":"说人话，阿里这个Qwen3.8-Max跟你有什么关系。它是目前前端编程榜第一的国产模型，1691分登顶CodeArena，你让它写页面、改组件、调样式，质量已经够日常干活。价格每百万token约5美元，比国外同档便宜一大截。更重要的是它不搞单点，阿里把千问办公、万有无界这些Agent平台全接通了，万有无界能建项目空间、群聊协作、把流程资产存企业账户，调的就是这个模型。所以你不是多了一个聊天模型，是多了一套能替你跑任务的办公系统，成本还低。你拿到的是一套系统，不是多一个聊天框而已。"},{"angle":"横向对比","text":"同样做企业级Agent，阿里这周的动作能跟同行对照看。阿里这边，千问办公8月3号公测、万有无界9月2号公测，底层是登顶编程榜的Qwen3.8-Max，强调多角色协作和企业资产沉淀。腾讯那边，WorkBuddy开放平台9月2号发，月访问量已破两千万，主打生态硬件和行业应用。字节是豆包工作8月25号打通飞书。三家都从聊天转向执行任务，但路线不同：阿里重模型加协作平台，腾讯重开放生态加硬件，字节重飞书内部打通。选哪个，看你团队已经在哪个体系里。三家路线不同，看你团队已经在哪就选哪。"}]},{"id":"ai3","title":"AI办公大厂混战：WorkBuddy开放平台领衔","hook":"大厂抢的不只是模型，是你在电脑前的那个入口。","why":"创作者本人就用WorkBuddy，人设贴合；入口争夺战趋势强，可延伸到'选哪个Agent'。","heat":"中高","tags":["趋势","办公","泛人群"],"facts":["腾讯9月2日发布WorkBuddy生态开放平台，首批超百家生态伙伴、9款联名智能硬件亮相，定位'Agent时代操作系统'（中国商报、北京商报2026-09-04）","WorkBuddy月访问量3月900万增至6月2097万，稳居国产办公Agent榜首；QuestMobile显示近3个月活跃用户规模增长115.3%（中国商报2026-09-04）","字节8月25日推'豆包工作'并与飞书打通；百度'库库AI'独立端8月14日上线、4月GenFlow MAU破1亿、AI办公MAU超2500万；阿里千问办公8月3日公测（中国商报2026-09-04）","业内判断：办公是大模型商业化最清晰场景之一，AI从'回答问题'走向'执行任务'，新一轮入口争夺战加速（中国商报2026-09-04）"],"scripts":[{"angle":"干货直给","text":"大厂这周在抢同一件事：你电脑前的那个AI入口。腾讯9月2号发WorkBuddy开放平台，首批超百家伙伴、9款联名硬件，定位Agent时代操作系统。数据上WorkBuddy月访问量从3月900万涨到6月2097万，国产办公Agent第一，近3个月活跃涨115%。字节8月25号推豆包工作打通飞书，百度库库AI独立端8月14号上线、AI办公月活超2500万，阿里千问办公8月3号公测。业内判断，办公是大模型最清晰变现场景，AI从答题走向执行任务，入口争夺战刚开场。入口抢下来，后面的订阅和流量都跟着走。"},{"angle":"反常识开场","text":"模型越来越强，但大厂争的已经不是谁的模型聪明，是谁能占住你干活的那块屏幕。腾讯WorkBuddy开放平台9月2号发，月访问量破两千万；字节豆包工作打通飞书；百度库库AI月活超2500万；阿里千问办公公测。四家同一周密集出牌，说明共识到了：办公是AI最稳的变现口，天天用、愿意付费。接下来比的不是参数，是谁能嵌进你的工作流、少让你切来切去。对普通用户，选一个顺手的长期用，比追新模型划算得多。占住了屏幕，就占住了用户每天的工作时间。屏幕背后的每天八小时，才是大厂抢破头要占的地。竞争到最后拼的就是这一个入口。"},{"angle":"创作者视角","text":"如果你也在用AI办公工具，这周的大厂混战对你只有好处。第一，竞争把能力价格打下来，WorkBuddy、豆包工作、库库AI都在抢入口，订阅和免费额度会更慷慨。第二，工具在往执行靠拢，不再只答问题，而是能帮你发邮件、整文档、排任务，省的是真时间。第三，生态在打通，WorkBuddy接硬件、豆包接飞书，你常用的软件会越来越能直接调Agent。我的建议：别每个都试，挑一个和你现有工作流重合最高的深耕，把重复活全交出去，模型追新留给厂商去卷。深耕一个，比每个都浅尝省心也省时间。别贪多，深耕一个最值当。"}]},{"id":"ai4","title":"AI视频洗牌：Sora退场，即梦可灵崛起","hook":"Sora退了，国产视频模型反而吃成了大头。","why":"创作者强相关（选工具）；有Sensor Tower硬数据；工具选型可讲，直接服务于做短视频的人。","heat":"中高","tags":["玩法","视频","创作者"],"facts":["Sensor Tower：Sora退场后一周，可灵全球周活环比涨4%达260万；即梦一季度月活1352.5万、下载558.9万稳居视频生成赛道首位（三亩地引Sensor Tower 2026-09）","即梦Seedance 2.5为全球首款支持专业3D工作流的工具（白模+Maya/Blender插件，空间不崩），单段30秒可延至3分钟；可灵Kling 3.0中文理解最强、原生音画同步、最长2分钟（hqwc、tahou产品评测2026-09）","AI短剧风口：2025国内AI漫剧市场168亿元，2026预计破240亿元，是AI视频模型最主要落地场景（三亩地2026-09）","待核实：Sora具体关停日期存在9月已退场（三亩地）与9月24日关停（前期记忆）两种说法，正文以'退场、迁移指南涌现'为准"],"scripts":[{"angle":"数据向","text":"AI视频这条线最近变天了。Sensor Tower的数据，Sora退场后一周，可灵全球周活环比涨4%到260万；即梦一季度月活1352.5万、下载558.9万，稳居视频生成赛道第一。工具能力也在分叉：即梦Seedance 2.5是全球首个支持专业3D工作流的，白模加Maya、Blender插件，空间不崩，单段30秒能延到3分钟；可灵Kling 3.0中文理解最强、原生音画同步、最长2分钟。背后是AI短剧风口，2025国内AI漫剧168亿，2026预计破240亿。做视频的，工具该重新选了。"},{"angle":"横向对比","text":"做中文短视频，三个工具这么选。要长叙事、中文好，选可灵Kling 3.0，它中文理解最强、原生音画同步、最长2分钟，API约0.075美元一秒，性价比高。要超长片段加精细控制，选即梦Seedance 2.5，单段30秒可延3分钟，还能接3D白模做游戏CG和建筑漫游，空间不漂。要顶级画质和物理真实感，选Sora，但它退场后迁移指南把即梦、可灵、Veo、Runway列为主要替代。商用上即梦明确生成内容可商用含版权确权，带货和广告更稳。国产两个已能吃下大部分中文需求。选对工具，你做一条片的时间能砍掉一大半。"},{"angle":"趋势判断","text":"AI视频从拼画质进入拼落地，三个信号。第一，Sora退场证明光技术领先不够，算力和商业跑不通就得退，即梦、可灵靠生态和中文能力吃下用户。第二，AI短剧成最大落地场景，2025国内168亿、2026预计破240亿，模型公司终于有清晰变现口。第三，工具分化成中文叙事、3D工作流、物理真实三条线，没人能通吃。即梦接抖音、可灵靠创作者付费，渠道决定谁能活。对创作者，产能工具成熟了，竞争回到选题和真人感，别再问哪个最强，问哪个最贴你这条线。渠道决定生死，创作者只管把内容做真做稳。别分心，把内容做真做稳就够。"}]},{"id":"ai5","title":"国产开源三连发，AI coding进入多强相持","hook":"一周三家国产模型连发，编程智能体的领先窗口只剩几周。","why":"技术趋势向，国产开源权重变生态标准；GLM以1/10成本近Opus，AI coding成本被腰斩，创作者/开发者都该知道。","heat":"中","tags":["趋势","开源","技术"],"facts":["9月3日国产模型开源三连发：腾讯混元Hy4 preview、智谱GLM-5.3-Flash(320B/18B、MIT协议、国产芯片全链路)、阿里Qwen3.8-Flash-Next多模态预览（CSDN AI日报2026-09-04）","GLM-5.3-Flash以约1/10成本接近Claude Opus 4.8的编码与Agent表现，可在国产芯片全链路运行（CSDN AI日报2026-09-04，单一来源待核实细节）","9月2日Meta发布Muse Spark 1.3，称编程优于GPT-5.6 Sol、与Claude Fable 5.1竞争，完成任务token减25%（CSDN AI日报2026-09-04，单一来源）","业内：OpenAI/Anthropic/Google/Meta密集更新，前沿编程智能体进入多强相持，单点领先窗口压缩到以周计（CSDN AI日报2026-09-04）"],"scripts":[{"angle":"干货直给","text":"9月3号国产模型来了一次开源三连发：腾讯混元Hy4 preview、智谱GLM-5.3-Flash、阿里Qwen3.8-Flash-Next多模态预览。其中GLM-5.3-Flash参数320B激活18B、MIT协议、能在国产芯片全链路跑，据CSDN AI日报称以约十分之一成本接近Claude Opus 4.8的编码和Agent表现。这串发的意义不在单个模型多强，而在国产开源权重正从获客入口变成生态标准。同一周Meta发Muse Spark 1.3，称编程优于GPT-5.6、完成任务token减25%。前沿编程智能体进入多强相持。"},{"angle":"趋势判断","text":"从这一周的开源节奏，能判断AI coding进入了多强相持期。OpenAI、Anthropic、Google、Meta密集更新，国产的混元、GLM、千问也连发，单点领先窗口被压缩到以周计。更关键的是成本曲线在塌，GLM以十分之一成本近Opus表现，千问Qwen3.8-Max登顶编程榜却只卖5美元百万token。对写代码和做工具的人，这意味着两件事：一来大模型当基础设施会越来越便宜，二来别押某一家，谁的API便宜、稳、能跑国产卡就用谁。领先是暂时的，性价比和可用性是长期的。性价比和可用性，才是你真该长期盯的指标。"},{"angle":"创作者视角","text":"这条技术新闻跟做内容的你关系在哪。第一，AI coding便宜了，意味着你用自然语言改自己网站、小程序、自动化脚本的门槛更低，以前要找人写的现在对话就能改。第二，国产模型能在国产芯片全链路跑，供给稳、不会被卡，长期价格有下探空间。第三，多强相持对你有利，厂商抢你就把能力和额度做慷慨。建议把重复技术活交给Agent，自己盯选题和表达，模型打架你坐收性价比。别追每个新版本，等它稳两周再上车更省心，工具追不完，追的是你内容生产的瓶颈。瓶颈在哪，工具就往哪堆，别为追新分散精力。别分神，盯住你自己的瓶颈就赢了。"}]}]}]},"2026-09-04":{"date":"2026-09-04","updatedAt":"2026-09-04 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月首周机票1折窗口：中秋国庆前最后的低价","hook":"9月头三周机票比国庆首日便宜一半，大量1折舱在售。","why":"纯省钱、强时效，现在就是窗口期。具体数字可做截图钩子，适合低成本口播，过了9月下旬价值归零。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["9月首周机票均价较暑期高峰回落35%，较国庆假期首日便宜50%，目前大量1折经济舱在售（去哪儿/航旅纵横数据，北京日报2026-09-01、中国商报2026-09-02）","北京直飞太原9月2日裸票230元、北京至郑州9月8日160元、北京至银川9月6日220元；上海直飞三亚9月23日前不超505元（北京日报2026-09-01、中国商报2026-09-02）","暑期结束到国庆前夕是历年机票捡漏黄金窗口，低价票多集中在早班/晚班/经停航班，余票有限（业内共识，多家媒体2026-09-0
