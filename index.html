<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="选题台">
<meta name="theme-color" content="#1e293b">
<title>每日选题 · 口播稿工作台</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16191d; --text2:#666e7a; --text3:#98a1ad;
  --line:#e6e8ec; --line2:#f0f1f4;
  --primary:#2563eb; --primary-d:#1d4ed8;
  --travel:#0d9488; --travel-bg:#e7f6f4;
  --ai:#7c3aed; --ai-bg:#f1eafe;
  --danger:#dc2626; --danger-bg:#fdecec;
  --ok:#16a34a; --ok-bg:#e8f6ec;
  --warn:#d97706; --warn-bg:#fdf3e3;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.hd{background:#1e293b;color:#fff;padding:14px 0 16px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.045)}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd-sub{font-size:12.5px;color:#a8b4c6;margin-top:3px}
.hd-acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:rgba(255,255,255,.11);color:#e7edf5;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn svg{width:14px;height:14px;flex:none}

.tipbar{background:var(--warn-bg);color:#8a5a08;font-size:13px;padding:9px 14px;display:none;align-items:center;gap:8px;border-bottom:1px solid #f2e3c6}
.tipbar.on{display:flex}
.tipbar button{margin-left:auto;font-weight:700;color:#8a5a08;padding:4px 8px;font-size:12.5px}

/* ---------- section / card ---------- */
.sec{margin-top:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-hd h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sec-hd .cnt{font-size:12px;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- today ---------- */
.today{background:linear-gradient(180deg,#fff 0,#fcfdff 100%);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.today-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.today-h .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;animation:bp 1.8s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
.today-h h2{font-size:15.5px;margin:0;font-weight:700}
.today-h .n{margin-left:auto;font-size:12px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#f7f8fa;border-radius:10px;padding:9px 8px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--text2)}
.stat.od b{color:var(--danger)}
.stat.dn b{color:var(--ok)}
.tlist{display:flex;flex-direction:column;gap:7px}
.titem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:#f7f8fa;font-size:13.5px}
.titem.od{background:var(--danger-bg)}
.titem .bd{flex:1;min-width:0}
.titem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .m{font-size:11.5px;color:var(--text2);margin-top:1px}
.titem.od .m{color:#b03636}
.titem .go{flex:none;background:var(--text);color:#fff;border-radius:8px;padding:0 12px;height:34px;font-size:12.5px;font-weight:600}
.titem.od .go{background:var(--danger)}
.empty{text-align:center;padding:22px 12px;color:var(--text3);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.3;display:block;margin:0 auto 8px}

/* ---------- track tabs ---------- */
.ttabs{display:flex;gap:8px;margin-bottom:12px}
.ttab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 8px;text-align:center;font-weight:700;font-size:13.5px;color:var(--text2);min-height:46px;transition:.15s}
.ttab .s{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:1px}
.ttab[data-k="travel"].on{background:var(--travel-bg);border-color:var(--travel);color:#0b6b62}
.ttab[data-k="ai"].on{background:var(--ai-bg);border-color:var(--ai);color:#6127c4}
.ttab[data-k="all"].on{background:#e8eefc;border-color:var(--primary);color:var(--primary-d)}
.ttab.on .s{color:inherit;opacity:.75}

/* ---------- topic ---------- */
.topic{margin-bottom:12px;overflow:hidden}
.tp-hd{padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.tp-idx{flex:none;width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
.tk-travel .tp-idx{background:var(--travel)}
.tk-ai .tp-idx{background:var(--ai)}
.tp-main{flex:1;min-width:0}
.tp-t{font-size:15.5px;font-weight:700;line-height:1.42;letter-spacing:.1px}
.tp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;padding:2.5px 7px;border-radius:6px;background:#f0f1f4;color:var(--text2);font-weight:600}
.tk-travel .tag.hot{background:var(--travel-bg);color:#0b6b62}
.tk-ai .tag.hot{background:var(--ai-bg);color:#6127c4}
.tag.hot{font-weight:700}
.tp-why{margin-top:9px;font-size:13px;color:var(--text2);background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.55}
.tp-why b{color:var(--text);font-weight:700}
.fold{border-top:1px solid var(--line2)}
.fold-b{width:100%;text-align:left;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;min-height:44px}
.fold-b svg{width:13px;height:13px;transition:.2s}
.fold-b.open svg{transform:rotate(90deg)}
.fold-c{display:none;padding:0 14px 13px}
.fold-c.open{display:block}
.facts{margin:0;padding-left:17px}
.facts li{font-size:12.8px;color:var(--text2);line-height:1.62;margin-bottom:5px}

/* ---------- script ---------- */
.scripts{border-top:1px solid var(--line2);padding:11px 14px 13px;background:#fbfcfd}
.sc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.sc:last-child{margin-bottom:0}
.sc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc-a{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f7;color:#41546b}
.sc-m{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.sc-st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.st-new{background:#f0f1f4;color:var(--text2)}
.st-pick{background:var(--warn-bg);color:#a15c06}
.st-shot{background:#e8eefc;color:var(--primary-d)}
.st-pub{background:var(--ok-bg);color:#15803d}
.sc-tx{font-size:14px;line-height:1.78;color:#252a31;max-height:78px;overflow:hidden;position:relative;transition:max-height .25s;cursor:pointer}
.sc-tx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.sc-tx.open{max-height:2000px}
.sc-tx.open::after{display:none}
.sc-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);border-radius:9px;padding:0 11px;height:38px;font-size:12.5px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:#fff}
.sbtn svg{width:13px;height:13px}
.sbtn:hover{background:#f7f8fa}
.sbtn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.sbtn.pri:hover{background:#2b3138}
.sbtn.act{background:var(--ok-bg);border-color:#bfe3c9;color:#15803d}
.sbtn.od{background:var(--danger-bg);border-color:#f3cfcf;color:var(--danger)}

/* ---------- refs ---------- */
.form{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);min-height:46px}
.form textarea{min-height:74px;resize:vertical;line-height:1.6}
.frow{display:flex;gap:9px}
.frow>*{flex:1;min-width:0}
.stars{display:flex;gap:3px;align-items:center}
.star{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.star svg{width:21px;height:21px}
.star svg path{fill:#dfe3e8}
.star.on svg path{fill:#f5a623}
.ref{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ref:last-child{border-bottom:none}
.ref-h{display:flex;align-items:flex-start;gap:9px}
.ref-t{font-weight:700;font-size:14.5px;flex:1;min-width:0;line-height:1.45}
.ref-m{font-size:12px;color:var(--text3);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ref-n{font-size:13px;color:var(--text2);margin-top:7px;background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ref-l{font-size:12.5px;margin-top:6px;word-break:break-all;display:inline-block}
.xbtn{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.xbtn:hover{background:var(--danger-bg);color:var(--danger)}
.xbtn svg{width:15px;height:15px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text3);min-height:56px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--primary)}
.nav .bdg{position:absolute;top:5px;margin-left:22px;background:var(--danger);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:8px;font-weight:700}

/* ---------- teleprompter ---------- */
.tele{position:fixed;inset:0;background:#0e1116;color:#f2f4f7;z-index:200;display:none;flex-direction:column}
.tele.on{display:flex}
.tele-hd{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #232a33;flex:none}
.tele-hd .tt{font-size:13px;color:#8e9aa8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{background:#1c222b;color:#cfd7e0;border-radius:8px;min-width:40px;height:38px;padding:0 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbtn svg{width:15px;height:15px}
.tele-bd{flex:1;overflow-y:auto;padding:24px 20px 90px;-webkit-overflow-scrolling:touch}
.tele-tx{font-size:26px;line-height:2.05;letter-spacing:.6px;max-width:820px;margin:0 auto;white-space:pre-wrap}
.tele-ft{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0),#0e1116 32%);display:flex;gap:8px;align-items:center;justify-content:center}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.modal h3{margin:0 0 8px;font-size:16.5px}
.modal p{margin:0 0 16px;color:var(--text2);font-size:13.5px;line-height:1.65}
.modal-a{display:flex;gap:9px}
.modal-a button{flex:1;height:46px;border-radius:11px;font-weight:700;font-size:14px}
.mb-c{background:#f0f1f4;color:var(--text)}
.mb-d{background:var(--danger);color:#fff}

/* ---------- toast / misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(84px + env(safe-area-inset-bottom));background:#16191d;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pane{display:none}
.pane.on{display:block}
.datesel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-bottom:11px;flex-wrap:wrap}
.datesel select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:14px;font-weight:600;color:var(--text)}
.badge-live{font-size:10.5px;background:var(--ok-bg);color:#15803d;padding:3px 7px;border-radius:6px;font-weight:700}
.badge-old{font-size:10.5px;background:var(--warn-bg);color:#a15c06;padding:3px 7px;border-radius:6px;font-weight:700}
.foot{text-align:center;color:var(--text3);font-size:11.5px;padding:22px 12px 8px;line-height:1.7}

@media(min-width:768px){
  body{padding-bottom:24px}
  .wrap{padding:0 22px}
  .hd{padding:18px 0 20px}
  .hd-title{font-size:19px}
  .nav{position:static;background:transparent;backdrop-filter:none;border-top:none;border-bottom:1px solid var(--line);max-width:1180px;margin:14px auto 0;padding:0 22px;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13.5px;padding:11px 15px;border-radius:10px 10px 0 0;min-height:46px}
  .nav button.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}
  .nav .bdg{position:static;margin-left:2px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .topics-grid .topic{margin-bottom:0}
  .tele-tx{font-size:31px}
}
@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hbtn span{display:none}
  .hbtn{padding:8px 10px}
}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap hd-row">
    <div>
      <div class="hd-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 22V12"/></svg>
        每日选题 · 口播稿台
      </div>
      <div class="hd-sub" id="hdSub">加载中…</div>
    </div>
    <div class="hd-acts">
      <button class="hbtn" onclick="doExport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>导出备份</span></button>
      <button class="hbtn" onclick="document.getElementById('impFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg><span>导入恢复</span></button>
      <button class="hbtn" onclick="askClear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span>清空</span></button>
    </div>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">

<div class="tipbar" id="tipbar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px;height:16px;flex:none"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
  <span id="tipTx"></span>
  <button onclick="hideTip()">知道了</button>
</div>

<div class="nav" id="nav">
  <button class="on" data-p="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>今天要处理<span class="bdg" id="navBdg" style="display:none">0</span></button>
  <button data-p="topics" onclick="go('topics')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>选题池</button>
  <button data-p="scripts" onclick="go('scripts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>口播稿库</button>
  <button data-p="refs" onclick="go('refs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>对标灵感</button>
</div>

<div class="wrap">

  <!-- ============ 今天要处理 ============ -->
  <div class="pane on" id="p-today">
    <div class="sec">
      <div class="today">
        <div class="today-h">
          <span class="dot"></span><h2>今天要处理</h2>
          <span class="n" id="todayN"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tlist" id="tlist"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hd"><h2>今日速览</h2><span class="cnt" id="ovCnt"></span></div>
      <div id="overview"></div>
    </div>
    <div class="foot" id="foot1"></div>
  </div>

  <!-- ============ 选题池 ============ -->
  <div class="pane" id="p-topics">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel" onchange="switchDate(this.value)"></select>
        <span id="dateBadge"></span>
      </div>
      <div class="ttabs" id="ttabs1"></div>
      <div id="topicList"></div>
    </div>
    <div class="foot" id="foot2"></div>
  </div>

  <!-- ============ 口播稿库 ============ -->
  <div class="pane" id="p-scripts">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel2" onchange="switchDate(this.value)"></select>
        <span id="dateBadge2"></span>
      </div>
      <div class="ttabs" id="ttabs2"></div>
      <div class="ttabs" id="stfilter" style="margin-top:-4px"></div>
      <div id="scriptList"></div>
    </div>
    <div class="foot" id="foot3"></div>
  </div>

  <!-- ============ 对标灵感 ============ -->
  <div class="pane" id="p-refs">
    <div class="sec">
      <div class="sec-hd"><h2>加一条对标</h2></div>
      <div class="card">
        <div class="form">
          <input id="rTitle" placeholder="标题 / 这条讲了什么（必填）" maxlength="120">
          <div class="frow">

<script id="packToday" type="application/json">{"date":"2026-08-10","updatedAt":"2026-08-10 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"京沪高铁能提前60天预约购票了，但这不等于先到先得","hook":"7月20日起京沪高铁京沪铁路试点预约购票，开车前60到17天填需求，20到16天兑现，8月30日起常态化。","why":"12306首次在预售期之前新增预约购票服务，把抢票逻辑从拼手速变成提前报需求、按需配运力。对常走京沪线、要锁中秋国庆车票的人直接有用，且多源权威报道（央视、人民日报、新华社、光明日报、国铁集团）信息一致。","heat":"高","tags":["京沪高铁","12306","预约购票","火车票","中秋国庆"],"facts":["7月20日起，铁路部门在京沪高铁、京沪铁路200多趟列车试点新增火车票「预约购票」服务，旅客可在开车前第60天至第17天填报预约需求（央视新闻/人民日报 2026-07-17；国铁集团客运中心）","铁路12306系统于开车前第20天至第16天兑现预约订单；7月20日至8月29日为过渡期，可依次预约9月15日及以后车票，8月30日起常态化运行（央视新闻/光明日报 2026-07-17）","预约分「精确预约」与「模糊预约」两种：精确选具体车次席别票价，模糊选时间段、时长、席别；每账户可同时提交3个待兑现订单，每单最多19名旅客（国铁集团/光明日报 2026-07-17）","兑现按「长途优先、兼顾中短途」与「先到先得」原则智能匹配；兑现成功须在当日23时前完成支付，逾期自动取消（国铁集团）","仅面向普通旅客，暂不支持超19人团体；30天内连续三次兑现成功但逾期未支付，此后90天该账户禁用预约购票（光明网 2026-07-20）","预约车票退票规则：开车前第20至8天退票核收5%退票费，8天内按既有预售车票退票规则执行","待核实：部分第三方平台推出的「预约购票」辅助功能与12306官方机制是否一致，一切以12306客户端为准"],"scripts":[{"angle":"干货直给","text":"京沪高铁和京沪铁路从7月20号起试点一个新功能，叫预约购票，这是12306头一次在预售期之前就让你填需求。规则很简单：开车前第60天到第17天，你在12306客户端的预约购票专区填想坐的车，第20天到第16天系统统一兑现，兑现成功当天23点前付钱就拿票。7月20号到8月29号是过渡期，这期间只能约9月15号以后的票，8月30号起才常态化。它本质是铁路提前摸你的出行需求再按需调配运力，和平时开售拼手速是两回事。中秋国庆要坐京沪线的，现在打开专区就能先把需求位占上，比等开售当天再抢要主动得多。"},{"angle":"避坑清单","text":"京沪预约购票这个新功能，先记牢四件事再下手。第一，预约不等于抢到。你填的是需求，第20到16天才兑现，按「长途优先、先到先得」智能匹配，兑现成功当天23点前必须付钱，否则订单自动取消；30天内连着三次兑现了又不付，这个账户90天不能再约。第二，两种模式。精确预约选具体车次席别，模糊预约只选时间段和时长，赶时间的用模糊更灵活。第三，认准官方。入口只在12306客户端首页预约购票专区，每账户最多3个待兑现订单、每单最多19人，不支持超19人的大团。第四，别信第三方平台的类似按钮，以12306为准。"},{"angle":"反常识开场","text":"12306这次不是让你抢得更快，而是让你抢得更早、还不一定抢得到。京沪高铁7月20号上线的预约购票，把买票动作拆成两段：开车前60到17天填需求，20到16天系统才兑现，中间隔了快一个月。为什么这样？因为铁路想提前知道大家要去哪，再决定加不加密、调不调编组。所以填了需求不代表有票，兑现那几天才是关键，而且按长途优先、先到先得来分。对普通人的用处是：中秋国庆想坐京沪线的，别等开售那天拼手速了，现在就去预约专区占个需求位，越早填越主动，但别以为填了就等于拿到票，兑现那几天才是真刀真枪分票的时刻。"}]},{"id":"tv2","title":"杭台高铁温玉段开通，玉环结束了不通铁路的历史","hook":"8月8日玉环站开出第一班高铁，杭州东1小时47分直达，台州实现县县通铁路。","why":"一条37公里的新线让海岛玉环迈入高铁时代，并把浙东唐诗之路和滨海旅游串成一条线，游客凭高铁票根能享100多项优惠。时效强、落地清晰、多源权威（新华社、人民网、浙江在线、上铁集团），对短线周边游人群直接有用。","heat":"中高","tags":["杭台高铁","温玉段","玉环","台州","周边游"],"facts":["8月8日杭州经绍兴至台州高铁温岭至玉环段（杭台高铁温玉段）开通运营，玉环从不通铁路直接迈入高铁时代（新华社/人民网/浙江在线 2026-08-08；上铁集团）","玉环站至杭州东站最快1小时47分可达，至温岭站最快13分钟、台州站26分钟、绍兴北1小时26分、上海南3小时03分（上铁集团 2026-08-08）","温玉段新建正线约37公里，设计时速350公里，桥隧比90.34%，设温岭、温岭西、玉环3座车站，开通初期每日开行图定动车16列（上铁集团/人民网 2026-08-08）","这是台州首条由地级市自主牵头建设的高铁，采用PPP模式，玉环是台州唯一原不通铁路的县级市，通车后台州实现「县县通铁路」（人民网 2026-08-08）","玉环策划推出系列文旅活动，整合100多项优惠政策，游客凭高铁票根可享受专属权益，串联大鹿岛、漩门湾湿地等滨海资源（浙江在线/上铁集团 2026-08-08）","待核实：具体票根优惠商户清单与有效期，以玉环文旅及铁路车站现场公告为准"],"scripts":[{"angle":"干货直给","text":"8月8号，杭台高铁温玉段正式开通，第一班G7364从玉环站开出。这条线不长，新建正线只有37公里，设计时速350，但意义不小：玉环这个海岛县级市，之前是台州唯一不通铁路的地方，坐高铁得先坐一小时汽车到温岭换乘，现在直接迈入高铁时代，台州也由此实现县县通铁路。玉环站到杭州东最快1小时47分，到温岭13分钟，到上海南3小时出头。开通初期每天16趟图定动车。想去台州沿海玩、去玉环吃海鲜看海的，现在高铁就能到，而且凭票根还能享当地100多项优惠，住宿和玩都能省一笔，周边游的性价比一下就上来了。"},{"angle":"行程规划","text":"杭台高铁温玉段一开，江浙沪周边游可以这样串。第一天杭州东出发，1小时47分直达玉环，放下行李去漩门湾国家湿地公园看候鸟、到大鹿岛坐船看岩雕，晚上玉环吃海鲜。第二天玉环站13分钟到温岭，转去石塘看千年曙光、七彩小箬村拍照，或者往北去天台、新昌走浙东唐诗之路。这条线把诗词山水和碧海蓝天接上了，还凭高铁票根享100多项优惠。适合两天一晚不赶的周末游。注意初期每天只有16趟车，热门时段提前买，别到了车站才发现没票。带上票根，沿途吃住玩都有专属权益可兑，相当于一张车票撬动整条线消费，很值。"},{"angle":"趋势判断","text":"玉环通高铁，看似一条37公里的小线，其实是长三角补网的一颗棋子。它把浙东唐诗之路和玉环的滨海资源接上了，游客从绍兴、新昌、天台一路南下直达温岭和玉环，诗词山水到碧海蓝天的文旅串联就成立了。更关键的是模式：这条线是我国首条由地级市自主牵头、用PPP模式建的高铁，说明地方修高铁的积极性在往上走，县县通铁路会从长三角先铺开。对游客来说，以后周边游的选择会越来越多，小县城的好山好水不再被交通卡住。高铁票根换优惠这套打法，也会跟着被别的小城复制，周边游的性价比会越来越高，小城旅游的红利才刚开头。"}]},{"id":"tv3","title":"暑运过半4.32亿人次，8月中下旬才是真正的最高峰","hook":"截至7月31日全国铁路已送客4.32亿，预计全程10.1亿，日均1629万，8月下旬迎返程顶。","why":"暑运是观察出行消费最直观的窗口，国铁集团数据权威且多源一致（央视、经济日报、凤凰网、西安网）。能讲清客流高峰时段和买票策略，对正在安排8月出行的人有直接提醒价值。","heat":"中高","tags":["暑运","铁路","客流","出行","错峰"],"facts":["2026年铁路暑运7月1日启动，截至7月31日全国铁路累计发送旅客4.32亿人次，预计全程发送10.1亿人次，日均1629万人次（国铁集团/央视网/经济日报 2026-08-01起）","8月1日至3日单日发送量连续突破1700万人次，8月中下旬将迎返程最高峰，呈「两头高、中间低」的客流曲线（同程数据经多家媒体 2026-08）","暑运期间铁路日均安排开行旅客列车约1.2万列，依托12306大数据动态研判热门方向加开高峰列车（国铁集团）","服务升级：「静音车厢」覆盖超8000列动车组，「爱宠行」拓展至163座高铁车站、364趟动车，「轻装行」覆盖212座车站，旅游计次票增至26款（央视网/凤凰网 2026-08）","7月以来全国铁路累计开行旅游列车357列，亲子游、研学游、红色游、康养游等特色列车增多（国铁集团/西安网 2026-08）","待核实：部分单日峰值与区域分布为媒体引用同程等平台数据，以国铁集团官方通报为准"],"scripts":[{"angle":"干货直给","text":"暑运过半，铁路交出半程答卷：截至7月31号，全国铁路累计发送旅客4.32亿人次，按国铁集团的预期，整个62天暑运要送10.1亿，日均1629万。而且真正的高峰还没到，8月1到3号单日已经连续突破1700万，8月中下旬返程才是顶，客流曲线是两头高、中间低。所以现在8月上旬还算相对宽松，想错峰的抓紧。铁路也加了车，暑运每天开约1.2万列客车，热门方向动态加开。服务上也卷了：静音车厢超8000列，爱宠行扩展到163个站，旅游计次票26款，带娃带宠出行的体验比以前好不少，错峰走正合适。"},{"angle":"避坑清单","text":"8月还在路上的，几个提醒记好。第一，别卡最高峰走。8月中下旬是返程顶，尤其8月21号周五、22号周六、28号周五、30号周日这几个周末最挤，能调就调到周二到周四，或者早晚非高峰车次，票好买人也少。第二，善用捡漏。发车前48小时和前1到2小时是退票回流高峰，没抢到别放弃，设好提醒蹲余票。第三，新生注意。8月1到30号12306有新生预约购票，2026级新生可约8月17到9月14号的学生优惠票，先完成资质核验。第四，大件行李用轻装行，已覆盖212座车站，进站省事不少，带大件出门的人尤其该用上。"},{"angle":"数据向","text":"4.32亿这个半程数字，背后是几个信号。一是出行需求确实旺，暑运全程预计10.1亿，日均1629万，8月头几天已经冲到1700万以上，说明亲子研学、避暑、返乡几股客流叠满了。二是铁路在主动适配，每天1.2万列客车、旅游列车开了357列，静音车厢、爱宠行、轻装行这些精细化服务铺开，是在抢「走得好」的体验。三是「两头高中间低」的曲线很关键：现在8月上旬是中间那段低谷，是全年难得的相对宽松窗口；等8月下旬学生返校、务工返程叠一起，票价和拥挤度都会上来。要出行，这十天最划算，错过就要撞最高峰。"}]},{"id":"tv4","title":"文旅部通报13起强制消费典型案例，纯玩团变购物团被点名","hook":"8月5日文旅部联合网信办公布13起案例，虚构纯玩团、低价揽客收回扣、无证经营全在列。","why":"文旅部这次专项整治直指短视频、直播、社交平台上的非法网络招徕，案例具体、处罚清晰（单案最高罚22.5万并停业整顿），是游客防坑的权威教材。多源一致（文旅部官网、法治网、人民网、腾讯新闻），时效强且受众极广。","heat":"高","tags":["文旅部","强制消费","纯玩团","旅游陷阱","维权"],"facts":["8月5日文化和旅游部公布2026年第五批共13起旅游市场强制消费问题典型案例，覆盖短视频、直播、社交平台等渠道（文旅部官网 mct.gov.cn 2026-08-05；法治网 2026-08-07）","文旅部联合中央网信办开展非法网络招徕专项整治，清理非法网络招徕产品及信息，推进强迫购物线上线下同步治理（文旅部官网 2026-08-05）","案例类型含虚构纯玩团诱导消费、低价揽客收购物回扣、无证经营、虚假宣传等；山西鑫泽鄂尔多斯分公司以低于成本价招徕并安排购物，被罚22.5万元、停业整顿30日，为本次最重处罚（人民网/中国城市报 2026-08-10）","潮州市骏晖旅行社以「纯玩零购物」招徕却安排购物收人头费，被吊销旅行社业务经营许可证（人民网/腾讯新闻 2026-08）","无证经营占比高：个人以99元「济南1日游」等通过社交平台私自组织旅游、无资质违规组织出境游等均被查处（文旅部官网/腾讯新闻 2026-08）","待核实：各地具体处罚执行进度与后续新增案例，以文旅部及属地执法部门通报为准"],"scripts":[{"angle":"干货直给","text":"文旅部8月5号公布13起旅游强制消费典型案例，这次是联合中央网信办专项整治非法网络招徕，重点清理短视频、直播、社交平台上的坑人产品。案例里最典型的是虚构纯玩团：有旅行社在短视频发749元重庆4天3晚，说不用额外花钱，人到了逼你签含自费项目的合同、额外收景区交通费。还有打着「纯玩零购物」低价揽客、实际安排购物收人头费的，直接被吊销执照。最重的一单，山西一家旅行社以低于成本招徕并安排购物，罚了22.5万、停业整顿30天。简单说，凡是短视频上便宜得离谱的纯玩团，先打个问号，多半有坑。"},{"angle":"避坑清单","text":"文旅部这13起案例，照着排雷最清楚。第一，警惕「纯玩零购物」低价团。案例里多家就是拿这个噱头低价揽客，到了当地加购物、收回扣，口号越漂亮越要查资质。第二，别信社交平台的个人团。有人用99元「济南1日游」、无资质组织出境游，都是违法，出了事没保障。第三，看清合同再签字。到集合地才让你签含自费项目的合同，就是典型套路，当场拒签并保留证据。第四，遇强制购物打12345或12301投诉。这波整治就是要线上线下一起管，你投诉有地方接。记住一条：价格明显低于成本，必有猫腻，别贪小便宜，贪便宜才是被套的第一步。"},{"angle":"趋势判断","text":"文旅部这次点名13起案例，信号很明确：治理重点从线下门店转到了短视频和直播间。过去黑旅行社靠门店和传单拉人，现在改在抖音、小红书发低价纯玩团视频，用算法精准投给想省钱的人，到了当地再变卦。所以这次联合网信办专项整治，既要罚旅行社，也要清理平台上的非法招徕信息，等于把坑人的入口也堵上。对游客是好事，但根子还在「贪便宜」——案例里几乎全是低于成本价揽客。监管再严，也拦不住你主动点开那个749元的重庆团。下一步看平台能不能把无证旅行社的号真的封干净，不然换壳又来，监管和平台得打配合战才堵得住。"}]},{"id":"tv5","title":"暑期尾声四川免票接力，广元女儿节全球女性免46家景区","hook":"8月下旬到9月，广元女儿节全球女性免46家A级景区，瓦屋山、兴文石海也接力免票。","why":"暑期最后一周到9月，四川多个景区推出限时免票，且覆盖人群明确（女性、宜宾居民），是错峰出游的高性价比窗口。与历史已覆盖的稻城亚丁免票角度不同（本次是时段接力+特定人群），信息来自四川文旅官方与多地政府公告，时效强。","heat":"中高","tags":["四川","免票","广元女儿节","瓦屋山","错峰"],"facts":["广元市2026女性用户文化生态旅游节（女儿节）8月24日至9月1日举行，期间全球女性免广元46家A级景区门票（广元文旅/四川新闻网 2026-08）","瓦屋山景区8月19日至23日面向所有游客免门票（瓦屋山景区官方 2026-08）","宜宾兴文石海景区8月1日至9月30日面向宜宾市居民免门票（兴文文旅 2026-08）","四川暑期文旅消费持续发力，此前稻城亚丁7月已推8月1日至10月31日全国游客免门票（央视网 2026-08-04），本次为不同时段与人群的接力优惠","待核实：各景区免票是否含观光车、索道等二消项目，及预约方式，以景区官方公告为准"],"scripts":[{"angle":"干货直给","text":"暑期尾巴，四川几个景区接力免票，时机刚好错峰。广元女儿节8月24号到9月1号，全球女性免广元46家A级景区门票，这个范围很大，剑门关、昭化古城这些都在内。瓦屋山8月19到23号对所有游客免门票，就五天，要卡准。宜宾兴文石海8月1号到9月30号对宜宾市居民免票，本地人别错过。注意这些都是门票免费，观光车、索道这类二消一般不含，而且多半要提前在官方渠道预约。和7月稻城亚丁那种全国免三个月不一样，这批是限时、分人群的接力优惠，适合8月底9月初还想出去溜达、又想省门票的人顺手捡漏，比硬凑假期划算，省心又省钱。"},{"angle":"行程规划","text":"想趁四川这批免票错峰，可以这么排。第一站瓦屋山，8月19到23号免门票那五天去，山顶看云海杜鹃、坐索道看瀑布，门票省了但索道要另买。第二站广元，8月24号女儿节开幕后过去，全球女性免46家A级景区，剑门关、昭化古城、千佛崖一路刷，女性用户基本门票全免。如果本身是宜宾人，顺道去兴文石海，8月1到9月30号对宜宾居民免票，看天泉洞和地表石海。整条线8月下旬到9月初走最舒服，伏天过了、学生也开学了，人不挤，还赶上免票尾巴。记得每站提前在景区官微预约，免票也常要预约名额，别到了门口才发现没约上。"},{"angle":"反向劝退","text":"四川这批免票看着香，但有三处别上头。第一，别为了免票硬凑时间。瓦屋山只免8月19到23号五天，广元女儿节免票到9月1号，过期不候，别把行程挤在无效日期。第二，免的是大门票，不是全部。索道、观光车、船票这些二消照收，算总账未必比淡季打折便宜多少，出发前查清楚含什么。第三，预约是硬门槛。这类限时免票基本要官方提前约，不约到现场可能进不去。所以适合本来就打算8月底9月初去四川的人顺手捡漏，专程为免票跨省跑，不一定划算。错峰的核心是躲人，不是只图免门票，别本末倒置，躲人才是错峰的真正目的。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"谷歌开源WeatherNext，气旋预报一下子多争取了一天","hook":"DeepMind把气旋预报模型开源，提前超24小时预警，单个TPU不到1分钟出15天预报。","why":"这是AI气象领域少有的开源+顶刊（Nature 8月6日）+实测落地三重背书，对关注AI应用、防灾和开源生态的人都信息密度高。多源一致（DeepMind官方、Nature、TechNews、Unite.AI），且能讲清「为什么重要」。","heat":"中高","tags":["谷歌","DeepMind","WeatherNext","开源","气象预报"],"facts":["8月6日谷歌DeepMind在Nature发表论文并开源WeatherNext系列模型（含WeatherNext Cyclones、WeatherNext 2、WeatherNext 2-mini），代码与权重免费开放（DeepMind官方/ Nature 2026-08-06；TechNews 2026-08-07）","在2023至2025年气旋上评估，WeatherNext Cyclones相对主流业务模型在路径、强度和风结构上平均多争取超24小时（约一天）预警提前量，相当于十年的气象进展（DeepMind/ Unite.AI 2026-08）","模型仅需28×28公里分辨率输入（比传统强度模型粗约100倍），单个TPU上不到1分钟生成15天概率式预报，2-mini版可在免费Colab单TPU运行（DeepMind/ datanorth.ai 2026-08）","采用Apache 2.0与CC BY 4.0许可，允许商业使用并署名，较此前的GraphCast、GenCast非商用许可更开放（datanorth.ai 2026-08）","2025年大西洋飓风季已与美国国家飓风中心（NHC）、CIRA、英国气象局合作实测，帮助提前预判Melissa的快速增强与登陆（DeepMind/ Unite.AI 2026-08）","待核实：上述为谷歌DeepMind自评估，虽经Nature同行评审并有多机构合著，仍非完全独立第三方复现"],"scripts":[{"angle":"干货直给","text":"谷歌DeepMind 8月6号在Nature发了篇论文，同时把WeatherNext气旋预报模型开源了，包含Cyclones、2、2-mini三个版本，代码和权重都免费开放，而且允许商用。它牛在哪？在2023到2025年的气旋上测，路径、强度、风结构三项平均比主流业务模型多争取超24小时预警，差不多相当于气象界十年的进步。更反直觉的是，它只要28乘28公里这么粗的输入，比传统强度模型细100倍的要求还低，单个TPU上不到1分钟就出15天预报。轻量版在免费Colab里单张TPU就能跑，学生和地方气象台都玩得起，门槛低到意外。"},{"angle":"说人话版","text":"天气预报这事，台风能不能提前一天说，可能就是撤不撤离的差别。谷歌这次开源的WeatherNext，干的就是把气旋预警多往前推一天。过去要更准得堆超高清数据，它偏不，用很粗的28公里网格就做到了，而且一台TPU不到一分钟算完15天。这意味着小地方的气象部门、甚至高校实验室，不用买超算也能跑。许可也大方，Apache 2.0加CC BY 4.0，能商用。去年飓风季它已经和美国国家飓风中心搭着用了，提前预判了Melissa的快速增强。对普通人暂时没感觉，但对防灾和保险这些行业，这是真的能救命省钱的工具，早一天预警就少一天损失。"},{"angle":"趋势判断","text":"WeatherNext开源，是AI气象从「秀指标」走向「能部署」的转折点。谷歌这次把许可从之前GraphCast、GenCast的非商用，直接换成可商用的Apache 2.0和CC BY 4.0，气象局、保险公司、能源交易商终于能把模型塞进自己的产品，而不是只能看论文。更关键的是它推翻了一个老假设：高精度强度预报必须靠超高清分辨率。WeatherNext用粗数据就做到了，说明架构和训练数据才是关键。接下来，地方气象机构和创业公司会在它权重上做本地化微调，小语种、小区域的预报会多起来。开源气象模型，开始跟开源大模型一样卷了，受益的是下游所有防灾场景。"}]},{"id":"ai2","title":"字节SeedRealtime上线，AI第一次能边看边听边说","hook":"豆包全量上线音视频全双工模型，不再靠ASR、视觉、TTS接力，一个模型打通看听说。","why":"这是国内首个规模化落地的音视频全双工模型，把AI从「你问我答」变成「它也在盯着看」，对视频通话、导览、陪伴场景是范式变化。多源一致（字节Seed、凤凰网科技、IT168、每经、科创板日报），且豆包3.82亿月活的落地规模罕见。","heat":"高","tags":["字节","SeedRealtime","豆包","全双工","多模态"],"facts":["8月5日字节跳动Seed团队发布原生音视频全双工大模型SeedRealtime，已在豆包App全量上线，用户更新后通过「打电话」进入视频通话体验（字节Seed/凤凰网科技/科创板日报 2026-08-05）","统一端到端架构原生融合音频、视频和文本，在连续多模态信息流中同步感知、理解、决策、表达，实现「边看、边听、边说」（字节Seed/ IT168 2026-08-06）","三大核心能力：音视频联合理解（靠画面消同音歧义、识别手势指代）、主动交互（持续观察环境并主动出声）、流畅节奏（实时感知对话状态自然接话）（凤凰网科技/腾讯新闻 2026-08-05）","端到端人工评测显示，相比传统ASR+视觉+TTS级联系统，音视频对话节奏问题减少约50%，抢话、回应迟滞、背景杂音误触发明显下降（字节/科创板日报 2026-08-05）","截至2026年6月豆包月活3.82亿、日活超2亿，日均Token调用180万亿，本次是业内首次将音视频全双工铺到该量级（字节Seed/消费日报/ IT168 2026-08）","待核实：端到端时延具体数值与更多开放场景，以字节后续披露为准"],"scripts":[{"angle":"干货直给","text":"字节8月5号发了个新模型SeedRealtime，已经在豆包App全量上线，你更新到最新版、点「打电话」进视频通话就能用。它和以前的AI视频通话不一样：过去是ASR把声音转字、视觉模型看画面、文本模型想、TTS念出来，一环接一环，延迟堆叠。SeedRealtime把声音、画面、文字压进一个端到端模型，能边看边听边说。三个能耐：音视频联合理解，你指屏幕说「这个怎么弄」它结合画面判断指的是什么；主动交互，盯着展品认出来会主动讲解；流畅节奏，你说话时它也在听，不会乱抢话。官方评测说对话节奏问题比级联系统少了一半，体验顺多了。"},{"angle":"工具评测","text":"SeedRealtime值不值得玩，看你能用它干啥。最实用的几个场景：带外国朋友吃饭，它实时把中文菜单和服务员介绍翻成他能懂的话；逛博物馆，它盯着展品认出来主动讲背景；学咖啡机操作，它看画面实时纠错你哪步错了；看论文，它跟着你翻页到指定章节自动提示。底层变化是它不再依赖外部VAD判断轮到谁说话，所以你在嘈杂机场它能分清你是在跟旁人聊还是对它说，不会被背景噪音误触发。代价是得用豆包的视频通话入口，目前是陪伴和导览向，别指望它替你写长文。豆包3.82亿月活，基本是国民级试点了，参与规模行业第一。"},{"angle":"趋势判断","text":"SeedRealtime全量上线，标志着AI交互从「问答」跨到「在场」。过去AI是你说一句它答一句，像打电话按免提。全双工的意思是它一直开着耳朵和眼睛，你说话时它在听，环境变了它会主动出声，比如你操作咖啡机它实时纠错。字节敢把它铺到豆包3.82亿月活上，是业内第一次把音视频全双工做到这个规模，说明端到端多模态的延迟和稳定性已经够日常用了。这对行业的信号是：下一阶段比的不是谁模型大，是谁能一直在真实场景里陪着你、盯着环境、帮你干实事。AI伴侣这个方向，字节抢了先手，后来者得追着这个体验基准跑了。"}]},{"id":"ai3","title":"京东开源JoyAI-Video-Edit，视频能边播边改了","hook":"不是先生成再改，是播放的同时实时改人物换场景，720P下每秒30帧跟得上播放。","why":"这是视频编辑从「生成后处理」转向「流式实时」的标志性开源模型，对电商直播、短视频带货、家装设计有直接的降本价值。多源一致（经济日报、北京日报、新京报、新智元），且有实测和评测背书。","heat":"中高","tags":["京东","JoyAI-Video-Edit","视频编辑","开源","电商直播"],"facts":["8月5日京东开源自研实时流式视频编辑模型JoyAI-Video-Edit，部署代码、技术报告、在线Demo与模型权重同日在Hugging Face和GitHub放出（京东/经济日报/新智元 2026-08-05）","基于全自研JoyAI-Video，在720P分辨率下实现每秒30帧模型推理、系统端到端稳定24FPS，支持任意时长的稳定流式编辑（经济日报/北京日报 2026-08-05）","在OpenVE-Bench通用评测中超越所有流式编辑方法，全局风格、局部替换、局部删除、字幕编辑任务优势突出，对比SANA Streaming、LiveEdit、Xmax-X2.0全面领先（经济日报/新智元 2026-08-05）","实测：输入「将上衣改为粉色」即可实时替换衣物颜色，也可换帽换镜、调材质、转动画风格、换背景，动作略有延时（新京报贝壳财经实测 2026-08-05）","除创作外，可将人手操作视频转为机械手/机械臂训练素材，为具身智能大规模数据合成提供路径（北京日报/经济日报 2026-08-05）","待核实：本地部署的硬件门槛与商用授权细则，以京东开源仓库说明为准"],"scripts":[{"angle":"干货直给","text":"京东8月5号开源了个视频编辑模型JoyAI-Video-Edit，关键词是「流式实时」。以前改视频得先生成或先有素材，再后期处理；它不一样，视频播着你就改着，人物换衣服、场景换背景、画面转风格，全在播放过程中实时完成。技术上有两道坎它跨过去了：一是速度，720P下模型推理每秒30帧、端到端稳定24帧，跟得上正常播放；二是时长，支持任意时长稳定流式，不限制几秒的clip。在OpenVE-Bench评测里，它把SANA Streaming、LiveEdit这些流式方法全超了。代码、权重、Demo同一天放Hugging Face和GitHub，开发者直接拉，开源得很彻底。"},{"angle":"创作者视角","text":"做带货和短视频的，JoyAI-Video-Edit这套实时编辑能直接进工作流。最香的是电商直播：主播试白上衣，观众想看蓝款，不用真换衣服，一句话把画面里衣服实时改成蓝色，当场展示。家装也一样，播到卧室把枕头、床单、灯光当场换一遍。实测里输入「将上衣改为粉色」，画面里整件T恤实时变粉，帽子和墨镜也能戴上去，还能调棉质纹理、转插画风。门槛在提示词写得准不准，同一段视频描述越细出得越对，比如写清「白色圆领纯棉」比只写「白色」稳。对单人小团队，等于省掉反复拍摄和整段返工，一条片子边播边改就成型，产出效率明显高。"},{"angle":"趋势判断","text":"JoyAI-Video-Edit开源，说明视频赛道的竞争焦点从「生成更长更连贯」挪到了「实时可改」。字节Seedance 2.5、MiniMax H3解决的是一口气生更长的片，京东这条线解决的是生成之后怎么即时调。语音那边GPT-Live已经把对话从回合制变成全双工，京东把同样思路搬进视频编辑：你不用等成片出来才知道想改什么，边看边改。更深的意图在具身智能——它能把手操作视频转成机械臂训练素材，一段真机视频扩出一堆样本。京东把它放进「物理世界模型矩阵」，视频编辑只是入口，真正的盘算在机器人数据，开源是为了拉开发者进自己的生态。"}]},{"id":"ai4","title":"腾讯混元Hy ASR 3.0，语音识别开始听懂上下文了","hook":"普通话词错率压到3.34%，靠上下文区分「期终」还是「期中」、致癌还是治癌。","why":"这是语音识别从「听清」到「听懂」的范式升级，对会议转写、字幕、方言输入、客服都有直接价值，且已上线元宝免费开放。多源一致（腾讯云、江南都市报、腾讯新闻、每经、AIHub），数据具体可核验。","heat":"中高","tags":["腾讯","混元","Hy ASR 3.0","语音识别","元宝"],"facts":["8月4日腾讯混元发布新一代语音识别模型Hy ASR 3.0 preview，基于最新大模型Hy3，融合高精度识别与深度语义理解（腾讯云/江南都市报 2026-08-04）","开源评测集上多语种词错误率（WER）约3%：中文普通话3.34%、英语2.62%、粤语3.12%（腾讯云/腾讯新闻 2026-08-04）","覆盖10大方言片区、20余个细分方言；支持热词注入，快速识别品牌名、人名、行业术语（腾讯云/ AIHub 2026-08-04）","靠上下文语义消歧同音词（如「期中考试」与「期终考试」、「致癌物质」与「治癌物质」），长音频错误累积被压低（腾讯新闻/ AIHub 2026-08-04）","已上腾讯云API，元宝首发接入并免费开放方言识别、上下文纠错等功能，WorkBuddy等产品陆续接入（腾讯云/江南都市报 2026-08-04）","待核实：端到端时延与极端口音下的具体表现，以腾讯后续技术报告为准"],"scripts":[{"angle":"干货直给","text":"腾讯混元8月4号发了个语音识别模型Hy ASR 3.0 preview，最大的变化是从「听清」变成「听懂」。以前语音识别是两段式，先听字再猜意，听错了常常兜不回来。它把识别和语义理解做成端到端整体，靠上下文来纠错。数据上，开源评测集里普通话词错率3.34%、英语2.62%、粤语3.12%，都压在3%上下，已经逼近专业人工速记的水平。它能覆盖10大方言片区20多个细分方言，还支持热词注入，品牌名、人名、行业黑话塞进去就能准识别。现在腾讯云有API，元宝里免费开放，按住说话就能体验，普通人体感最明显的是方言和嘈杂环境更稳了。"},{"angle":"实操流程","text":"想用上混元这个语音识别，按这几步。第一，普通用户直接开元宝，更新到最新版，按住说话就能体验方言识别、上下文纠错、嘈杂环境稳定转写，免费。第二，开发者接腾讯云API，一行调用就能把「说话变文字」做得更准，适合做会议纪要、字幕、语音搜索。第三，专业场景用热词注入，把你们公司的品牌、产品名、人名、行业术语加进去，识别准确率立刻上来，不用为个别词反复改模型。第四，长录音放心用，它压低了长音频里的错误累积，半小时录音不会再越听越跑偏。微信语音输入、腾讯会议转写这类国民级场景，接下来都会直接受益，会议纪要让少写错人名。"},{"angle":"趋势判断","text":"Hy ASR 3.0最值得说的，是语音识别的终点可能不再是「更准的听」而是「更对的懂」。它把同音词交给上下文判断，比如「期终考试」还是「期中考试」、「致癌」还是「治癌」，靠语义补对那个词，这恰恰是从听清跨到听懂的标志。底座是混元Hy3大模型，声学侧自研无监督Encoder、语言侧MoE接Hy3，两端联合训练。对行业来说，这意味着语音交互从「能用但别指望准」往「好用」挪了一步，会议纪要让少写错人名、字幕少闹同音笑话。腾讯把它接进元宝和腾讯云，补齐了混元听—说—读—写全模态的一块，微信、会议这些入口马上能用上，全模态拼图也补齐了。"}]},{"id":"ai5","title":"英伟达开源340亿参数智驾模型，要做智驾界的安卓","hook":"Alpamayo 2 Super免费商用开源，让车先思考再行动，车企和开发者都能拿去微调。","why":"这是物理AI/自动驾驶领域少有的大厂开源+可商用模型，黄仁勋亲自站台称「AI下一波是机器人」，对关注自动驾驶、机器人、开源生态的人信息密度高。多源一致（NVIDIA开发者博客、36氪、快科技、Studio Global），且是本周新发布无历史覆盖。","heat":"中高","tags":["英伟达","Alpamayo","自动驾驶","开源","物理AI"],"facts":["当地时间8月4日英伟达宣布推出面向自动驾驶的开源推理模型Alpamayo 2 Super，权重上传Hugging Face，采用Linux基金会旗下OpenMDW许可，允许微调、衍生和商用再分发（NVIDIA开发者博客/36氪/快科技 2026-08-04至06）","总参数约340亿，由320亿参数视觉语言骨干（基于Cosmos 3 Super Reasoner）与约20亿参数动作专家组成，属视觉-语言-动作（VLA）架构，通过强化学习后训练（NVIDIA/36氪 2026-08）","支持360度全周感知，最多7路摄像头，可输出未来轨迹、因果推理链、高层元动作、自动标注等多项结果，面向L4级场景（NVIDIA/ Studio Global AI 2026-08）","黄仁勋在社交平台为模型站台，称AI下一波浪潮属于机器人，自动驾驶是其起点（36氪/快科技 2026-08-06）","Alpamayo系列在Hugging Face下载量已超50万，此前2026年1月CES发布初代Alpamayo 1（Studio Global AI/36氪 2026-08）","待核实：具体推理显存/算力门槛与车端部署实测数据，以英伟达技术文档为准"],"scripts":[{"angle":"干货直给","text":"英伟达8月4号开源了个自动驾驶模型Alpamayo 2 Super，直接放Hugging Face，而且能免费商用。它总参数约340亿，拆成320亿的视觉语言大脑加20亿的动作专家，属于VLA架构，就是让车能看、能想、能行动。它的卖点是「先思考再行动」：最多接7路摄像头做360度感知，输出未来行驶轨迹、为什么这么开的推理链、变道让行这类高层指令，还能顺手给训练数据打标注。底层基于英伟达自家的Cosmos 3世界模型。许可用Linux基金的OpenMDW，车企、供应商、开发者都能拿去微调部署，不用再找英伟达单独授权，门槛低了很多。"},{"angle":"说人话版","text":"自动驾驶最难的从来不是晴天跟车，而是施工改道、行人乱穿、前车违规插队这些长尾场景，没法靠写规则穷举。英伟达这个Alpamayo 2 Super，思路是让模型先理解物理世界再决策，所以它能基于真实驾驶数据生成各种天气、光照、路况的虚拟场景，让车在仿真里经历现实中难采集的极端情况。黄仁勋亲自发推说AI下一波是机器人、自动驾驶是起点，摆明要把智驾模型做成「安卓」——开源底座，谁都能拿来改。对车企是好事，自研智驾不用从零训，站在英伟达权重上微调就行。目前Hugging Face下载已超50万，热度不低，开发者用脚投票了。"},{"angle":"趋势判断","text":"英伟达开源Alpamayo 2 Super，本质是给自动驾驶行业递了一套「开源底座」，想当智驾界的安卓。过去车企自研智驾，数据和算力都卡脖子；现在英伟达把340亿参数的VLA模型免费商用开源，车企、Tier 1、创业公司都能在权重上微调部署，研发周期从月级压到天级。这和它Cosmos世界模型是一套打法：用开放权重绑定生态，你用我的模型，就离不开我的算力。对国内智驾阵营是双刃剑——短期省了自训成本，长期加深了对英伟达栈的依赖。但不可否认，开源让中小玩家也能玩高等级智驾，智驾能力的普及速度会明显加快，行业格局要被搅动。"}]}]}]}</script>
<script id="packHistory" type="application/json">{"2026-08-09":{"date":"2026-08-09","updatedAt":"2026-08-09 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月15日起新规施行，出境前这条提醒必须看","hook":"第841号国务院令把出境安全风险防范第一次写成了制度，黑中介要被管起来了。","why":"9月15日施行的《国务院关于出境入境管理的规定》是2013年出境入境管理法后最重要的一次补丁，直接关系每个要出国的人。官方一手来源清晰，能讲清普通人出境前该看什么、防什么，时效性强且受众极广。","heat":"高","tags":["出境","新规","国务院令","安全提醒","中介"],"facts":["第841号国务院令《国务院关于出境入境管理的规定》于2026年6月29日国务院第90次常务会议通过，7月22日李强总理签发，自2026年9月15日起施行（中国政府网 2026-07；人民网 2026-08-03）","规定第一次把中国公民出境安全风险防范写成制度：外交、文旅主管部门及驻外机构及时发布国外安全提醒和旅游目的地安全风险提示；边检和证件审批环节提醒谨慎前往高风险国家，必要时劝阻（中国政府网；人民网 2026-08-03）","规范出境入境中介服务：2018年取消因私出入境中介准入许可后机构数量快速增长，出现违法违规损害权益问题，需完善管理制度（司法部、公安部、国家移民局负责人答记者问 2026-08）","以虚假材料、虚假陈述骗取证件或非法出入境受行政拘留的，移民管理机构可决定自处罚执行完毕之日起6个月至3年以内不准出境（中国政府网；人民网 2026-08-03）","出境入境管理法自2013年施行，本次规定是急用先行层面的配套完善（中国政府网 2026-07）","待核实：具体哪些国家和地区属于「最高风险级别劝阻」的细化名单与判定标准，以官方发布的安全提醒为准"],"scripts":[{"angle":"干货直给","text":"九月十五号起，一份新的国务院令要施行了，第841号《国务院关于出境入境管理的规定》。这份规定6月29号国务院常务会议通过，7月22号李强总理签发，9月15号正式落地。它第一次把中国公民出境安全风险防范写成制度，要求外交、文旅部门和驻外机构及时发国外安全提醒和旅游目的地风险提示。边检和证件审批环节，会提醒你谨慎去高风险国家，必要时直接劝阻。还有一块是管中介，2018年取消准入许可后，因私出入境中介数量猛增，乱象不少，这次把中介服务管理补上。一句话，出国前先看清官方提醒，别被黑中介坑了。"},{"angle":"避坑清单","text":"9月15号新规落地前，出境这几件事先记牢。第一，看清安全提醒。规定要求外交和文旅部门、驻外机构发布国外安全提醒和旅游目的地风险提示，边检办证时会提醒你去不去高风险地区，必要时劝阻，别硬扛。第二，管住中介。2018年取消准入许可后中介数量暴涨，坑人案例不少，选机构认准正规备案，合同条款逐条看。第三，别碰虚假材料。用假邀请函、假证明骗证，移民管理机关可以不发证、不准出境，已经拿到的也可能被撤销。第四，留好底线。因骗取证件或非法出入境被行政拘留的，处罚执行完后6个月到3年内可以限制出境。新规不是限制你出国，是帮你挡掉真风险。"},{"angle":"反常识开场","text":"国家不是限制你出国，是在帮你挡风险。9月15号，第841号国务院令《国务院关于出境入境管理的规定》施行，这是2013年出境入境管理法之后最重要的一次补丁。它把两件事钉死了。一是出境安全风险的防范，外交、文旅部门、驻外机构必须及时发安全提醒和风险提示，边检环节会当面提醒你别去高风险国家，必要时直接劝。二是管中介，过去黑中介靠信息差坑人，这次从制度上补。对普通人最直接的用处：出国前先去查官方安全提醒和风险提示，比听旅行社一句没事靠谱得多。你花几千块报的团，万一目的地正打仗正乱，旅行社可不会替你担责。"}]},{"id":"tv2","title":"赛里木湖自驾改按车收费，8月20日是个分水岭","hook":"75块一人变成120块一辆，人越多越划算，但得卡准8月20号这个时间。","why":"赛里木湖是新疆顶流自驾目的地，收费模式从按人改成按车是实打实的价格变化，直接影响出行成本。官方通报细节清晰（车型分档+过渡期），且关联景区殴打司机事件的整改，话题度和实用价值都高。","heat":"中高","tags":["赛里木湖","自驾","收费","新疆","避坑"],"facts":["此前赛里木湖执行75元/人自驾服务费；8月3日新疆自治区、博尔塔拉蒙古自治州联合工作组通报，将按「人」收费调整为按「车」收费（央广网 2026-08-03；新华社 2026-08-03）","新标准自8月20日0时执行：5座及以下120元/车、6至7座180元/车、8至19座300元/车、20座及以上600元/车（央广网/新华社 2026-08-03）","8月4日0时至新方案执行期间，暂按30元/人收取自驾服务费，因票务系统需升级调整（央广网/新华社 2026-08-03）","同期通报公布景区工作人员殴打旅游车司机事件处理结果：7名工作人员被行政拘留10至15日并各罚款1000元，多名相关领导被问责（央广网/新华社 2026-08-03）","自治区将督促指导全区涉自驾收费服务的旅游景区抓紧制定优化调整方案（新华社 2026-08-03）","央视网8月4日报道，稻城亚丁7月也已推出优化整改，8月1日至10月31日面向全国游客免收景区门票（央视网 2026-08-04）"],"scripts":[{"angle":"干货直给","text":"赛里木湖自驾收费改了，从按人变成按车。以前是75块钱一个人收自驾服务费，8月3号新疆自治区和博尔塔拉州联合工作组通报，改成按车收费，新标准8月20号零点起执行。具体是：5座及以下120块一辆，6到7座180，8到19座300，20座以上600。注意一个过渡期，8月4号零点到新方案执行前这段时间，暂时还按30块一个人收。另外这次通报还公布了之前景区工作人员殴打旅游车司机的处理结果，7个人被行政拘留10到15天，各罚一千，相关领导也被问责。自治区还要推动全区自驾收费景区都出优化方案。去之前看准8月20号这个节点，能省不少。"},{"angle":"成本账","text":"赛里木湖按车收费之后，账怎么算最划算。新规8月20号起：5座及以下120元一辆，6到7座180，8到19座300，20座以上600。对比原来的75块一人，你一眼就明白，人越多越划算。一辆5座车坐满4个人，原来要300，现在120，省180。要是两个人去，原来150，现在还是120，省得少。所以这条新规对家庭游、朋友拼车是实打实的让利，对 solo 或者小两口基本没差，甚至人多到7座以上反而更贵。过渡期还有个细节，8月4号到20号之间暂时按30块一人，这个时候去反而可能比按车便宜，算好日期再走。一句话，满员的车等20号后去，人少的趁过渡期走。"},{"angle":"避坑清单","text":"赛里木湖自驾新规，三个坑先认清。第一，时间坑。按车收费8月20号零点才生效，之前还是75块一人，但8月4号到20号之间临时按30块一人，这段别按新价预期。第二，车型坑。按行驶证核载人数分档，5座和6座差60块，7座和8座又是两个档，你买的什么车、坐几个人，直接决定收费。第三，别被旧攻略骗。网上大量攻略还是75块一人的老标准，导航软件、第三方平台的收费提示可能没更新，以景区窗口和官方公告为准。另外这波调整是因为之前景区殴打司机事件加收费争议引发的整改，同期全区自驾收费景区都要优化，出门前查一下目的地最新公告。"}]},{"id":"tv3","title":"柬埔寨对中国公民免签试行，6.15到10.15这张窗口别错过","hook":"不用签证不花钱，填张电子入境卡就能待14天，还能多次进出。","why":"柬埔寨免签试行期正好覆盖暑期到国庆的出境高峰，且中国驻柬使馆已发领事提醒确认政策，有官方一手来源。但该国电诈网赌风险高，需把免签便利与避险提示一起讲清，实用且能救人。","heat":"中高","tags":["柬埔寨","免签","出境","领事提醒","避险"],"facts":["柬埔寨政府2025年12月2日发布官方文件，2026年6月15日至10月15日对中国公民试行免签，允许停留14天（新华社 2025-12-03；央广网 2025-12-03）","试行期内无需申请签证、无需缴费，只需填写电子入境卡（E-Arrival Card），且可多次入境（新华社 2025-12-03）","中国驻柬使馆2026年6月25日发布领事提醒确认该政策：无论自中国境内还是第三国出发，均可免签入境（中国驻柬使馆 2026-06-25）","柬埔寨旅游部统计：2025年1月至10月吸引中国游客约100万人次（新华社 2025-12-03）","使馆提醒：柬政府禁止口岸官员索要小费，遇索要应明确拒绝并取证；无人机管控严格；遵守宗教习俗；防范网赌电诈、远离高薪招聘（中国驻柬使馆 2026-06-25）","待核实：免签适用的具体陆海空口岸范围与落地执行细节，以柬埔寨官方口岸现场执行为准"],"scripts":[{"angle":"干货直给","text":"柬埔寨对中国公民试行免签了，窗口是今年6月15号到10月15号，整整四个月。这段时间你拿普通护照去柬埔寨，不用办签证，不用交任何费用，只要填一张电子入境卡，能停留14天，还能多次入境。中国驻柬使馆6月25号专门发了领事提醒确认这个政策，不管你从国内走还是从第三国转机都适用。注意几点：电子入境卡可以提前7天在手机App或者网站填；柬方明令禁止口岸官员索要小费，遇到直接拒绝并取证；无人机管控很严，别带；还要远离网赌电诈，别信高薪招聘。柬埔寨旅游部数据，去年前10个月中国游客约100万人次，免签就是冲着这波人来的。"},{"angle":"避坑清单","text":"去柬埔寨免签，这几条踩了就麻烦。第一，别给小费。柬政府一再重申禁止口岸官员索要小费，遇到直接说不给，在保证安全的前提下录证据，回来向中国使馆反映。第二，电子入境卡必须填。免签不等于啥都不用办，落地前7天就能在柬埔寨e-arrival的App或网站填报，到口岸现场填也行，但别漏。第三，无人机别带。柬埔寨对无人机管控极严，未经许可带了就是违规。第四，远离网赌电诈。柬方最近在严打电诈网赌，别信高薪招聘、别替人带行李。第五，尊重宗教习俗，进寺庙王宫着装得体。这趟免签是6月15到10月15的试行，过期就恢复原样，看好日期。"},{"angle":"反常识开场","text":"东南亚免签又多一个，但柬埔寨这个最该看清门道。它给的是6月15到10月15的试行免签，14天停留、多次入境、不收签证费，听着比很多国家都大方。但免签不等于零门槛：你还是得填电子入境卡，还是得走正规口岸，还是得遵守当地法律。真正要提醒的是风险面。柬埔寨是电诈网赌重灾区，使馆提醒里专门强调远离黄赌毒、别信高薪招聘。还有口岸索贿这个老问题，官方口径是明确禁止，遇到别惯着、留证据。所以去柬埔寨玩完全可行，但把它当清迈还是当妙瓦底，心态要分清。免签降低的是手续成本，降不了的是你自己的警惕心。"}]},{"id":"tv4","title":"甘孜317、318终身卡，一次购票管一辈子畅游14个景区","hook":"317女性、318男性，买一次能终身不限次进海螺沟、稻城亚丁等14家景区。","why":"甘孜终身门票是文旅行业标志性事件，用顶流景区做钩子带火全域，价格机制清晰（1091元门票打三折）。对常去川西的人和旅居群体有实际省钱价值，也能讲透景区转型趋势。","heat":"中高","tags":["甘孜","终身门票","川西","稻城亚丁","性价比"],"facts":["2026年1月28日「圣洁甘孜·一生有约」活动首发，317元（海棠卡，女性）、318元（金雕卡，男性）两款终身畅游卡，可终身无限次进入甘孜14家4A及以上景区（甘孜州政府官网 gzz.gov.cn；央视网 2026-08-04）","14家景区单次门票总价1091元，终身卡约为其三分之一，限售100万张，2026年3月1日正式启用（甘孜州政府官网；潮新闻 2026-02-27）","14家含海螺沟(5A)、稻城亚丁(5A)、木格措、甲居藏寨、泸定桥、伍须海、墨石公园、亚拉雪山、勒通古镇、措普沟、红山、印经院、玉龙拉措等（甘孜州政府官网 gzz.gov.cn）","甘孜州文旅局长刘洪披露：2025年全州接待游客超4700万人次，旅游综合收入517亿元，门票收入仅1.6亿元、占比不到0.3%，故推动「去门票化」（潮新闻 2026-02-27）","截至2月24日线上累计销售双卡39.72万张、支付破1.26亿元，线下认购约51万张（潮新闻 2026-02-27）","该卡属实名记名预付凭证，按《单用途商业预付卡管理办法》不设有效期（潮新闻 2026-02-27）"],"scripts":[{"angle":"干货直给","text":"四川甘孜出了张终身门票，317块和318块两款，买一次管一辈子。317是女性专属的海棠卡，318是金雕卡，对应317、318两条国道。凭卡能终身不限次进甘孜14家4A及以上景区，包括海螺沟、稻城亚丁两个5A，还有木格措、甲居藏寨、墨石公园这些4A。这14个景区单次门票加一块是1091块，等于打三折，而且限售100万张，3月1号已经启用。甘孜州自己算过账，2025年全州门票收入才1.6亿，占旅游总收入517亿不到0.3%，所以干脆去门票化，靠住宿餐饮二次消费赚钱。常去川西的人，去两次亚丁加海螺沟就回本了。"},{"angle":"成本账","text":"甘孜这张终身卡到底值不值，算笔账。317或者318块买断14个景区终身入园权，单次门票总和1091，相当于三折。这14家里光海螺沟、稻城亚丁两个5A单买就接近240，你只要再去一个4A比如木格措，基本就回本。适合两类人：一年去甘孜两三次的，和打算长住旅居的。按甘孜官方举例，有自驾爱好者每年去两次，光亚丁和海螺沟门票就500多，办卡318直接省。不适合的是只打算去一次的，那还是买单票划算。另外要注意，这是实名记名预付卡，按法规不设有效期，不用担心换领导不认，但限购100万张，别拖。3月1号已启用，现在去甘孜玩，先去官方小程序买卡再进场。"},{"angle":"趋势判断","text":"甘孜卖终身门票，本质是景区在主动砸自己的门票饭碗，这信号比省钱更重要。2025年甘孜接待游客超4700万，旅游综合收入517亿，但门票收入才1.6亿，占比不到0.3%。门票本来就不再是收入主力，甘孜索性把它当引流工具。用海螺沟、稻城亚丁这两个顶流当钩子，把12个4A小众景区一起带火，让游客从看一个景变成住一阵、吃一桌、买一筐。这套打法跟杭州西湖免费开放是一个逻辑：门票让出去，人留下来，钱花在别处。对游客是实打实划算，对其它还在死守门票的景区，是个倒逼。今年暑期甘孜估计要冲5000万人次，靠的就是这张卡。"}]},{"id":"tv5","title":"贵州全省旅游百日行动，8.1到11.10严打宰客和天价","hook":"12315全程畅通，热门景区还有专人驻点现场调处，现在去是被保护最严的窗口。","why":"暑期贵州是旅游大省，百日行动覆盖面广、五大领域同时发力，官方部署文件完整。对游客是直接的维权武器，可讲清遇到宰客该找谁、留什么证据，时效和实用价值都高。","heat":"中高","tags":["贵州","旅游维权","百日行动","市场监管","宰客"],"facts":["7月31日贵州省市场监管局动员部署，8月1日至11月10日在全省开展「护航旅游安全百日行动」（天眼新闻 2026-08-02；中国质量报/新浪 2026-08-06）","聚焦五大领域：涉旅食品安全、特种设备安全、市场价格秩序、商品质量计量、消费维权服务（天眼新闻 2026-08-02）","价格秩序：严查不执行政府定价、两套菜单、价外加价、虚假打折、捆绑消费、模糊标价，落实特殊人群票价减免，重拳整治「宰客」、天价商品（中国质量报/新浪 2026-08-06）","商品质量：银饰玉器、酱香白酒、农特产品、文创产品拉网排查，打击假冒伪劣、缺斤短两、虚假宣传（中国质量报/新浪 2026-08-06）","消费维权：畅通12315，落实快速受理、核查、处置、反馈，热门景区安排专人驻点现场调处（天眼新闻 2026-08-02）","贵阳市8月3日动员，聚焦五大领域以「零容忍」态度亮剑（贵阳市场监管 2026-08-04）","待核实：行动期间具体查处案例与处罚数据，以各地市场监管部门后续通报为准"],"scripts":[{"angle":"干货直给","text":"贵州从8月1号到11月10号，全省搞一个护航旅游安全百日行动，由省市场监管局统一部署。盯的就是暑期旅游旺季的安全和消费痛点，五大块：食品安全、特种设备、市场价格、商品质量、消费维权。价格这块查得最狠，不执行政府定价、两套菜单、价外加价、虚假打折、捆绑消费、模糊标价全在打击范围，宰客和天价商品顶格处理，特殊人群票价减免必须落实。商品质量重点查银饰玉器、酱香白酒、农特产品、文创，打击假冒伪劣和缺斤短两。消费维权方面12315全程畅通，热门景区还安排专人驻点现场调处。去贵州玩，遇到坑直接12315，现在正是他们严打期。"},{"angle":"避坑清单","text":"贵州旅游百日行动期间，游客怎么借力维权。第一，遇宰客别忍。价外加价、两套菜单、捆绑消费、虚标价格，正是这次重点整治的，保留菜单、付款记录、聊天截图，打12315。第二，买特产认准公平秤。银饰玉器、酱香白酒、农特产品是拉网排查对象，景区商铺和夜市流动摊贩是重点，买之前看有没有配公平秤，离谱低价别碰。第三，特种设备看检验。索道、游乐设施、观光车都在排查带病运行，坐之前留意设备有没有检验标志。第四，食品安全盯后厨。民宿农家乐网红店是重点场所，餐具消毒、食材过期是严查项。第五，热门景区有专人驻点，现场就能调处，别嫌麻烦不开口。"},{"angle":"趋势判断","text":"贵州这一波百日行动，说明旅游监管在从被动接诉变成主动排雷。过去游客被宰，得自己留证据、打投诉、等几天才有回音。现在省局直接把8月1号到11月10号定为专项监管期，食品安全、特种设备、价格、商品质量、维权五条线一起压下去，热门景区还派人驻点现场办。更关键的是它卡准了暑期这个客流高峰，提前把乱象摁住，而不是等舆情爆了再救火。对游客来说，这段时间去贵州是被保护最严的窗口。对其他旅游大省也是个示范：监管前置比事后罚款更能保住口碑。你赶在严打期出行，遇到坑大胆投诉，处理速度和力度都会明显不同。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"谷歌AI一夜洗牌：Jeff Dean离职创业，布林亲自盯Gemini","hook":"27年老将走了，DeepMind创始人交权，Gemini被收进一条更短的指挥链。","why":"这是谷歌AI权力结构的一次标志性地震，有多家科技媒体一手跟进。能讲清顶尖研究者流向、Gemini竞争压力与产品化转向，对关注AI行业的人信息密度高。","heat":"高","tags":["谷歌","DeepMind","Jeff Dean","Gemini","人才流动"],"facts":["8月5日至6日，谷歌调整AI体系核心人物：在谷歌工作27年的首席科学家Jeff Dean离职创业；DeepMind联合创始人Demis Hassabis交出日常管理权，转任Google DeepMind主席和Alphabet首席科学家（腾讯新闻/机器之心 2026-08-06）","Dean与Sanjay Ghemawat、Quoc Le、Oriol Vinyals创办Discovery Loop并任CEO，做AI自动完成科学与工程实验循环（递归式自我改进）；获Radical Ventures、Khosla Ventures、Alphabet投资，谷歌提供至少一年算力并继续合作（腾讯新闻/华尔街见闻 2026-08-06）","原DeepMind CTO Koray Kavukcuoglu升任高级副总裁，直接向皮查伊汇报，接管Gemini研发与交付（腾讯新闻/网易 2026-08-06）","创始人Sergey Brin更直接参与Gemini战略判断和产品推进（腾讯新闻 2026-08-08）","背景：2024年Noam Shazeer请回后又于2026年6月离开加入OpenAI；AlphaFold诺奖得主John Jumper加入Anthropic，Gemini研究人员亦被曝流向Anthropic（腾讯新闻 2026-08-06）","相关消息公布后Alphabet股价下跌约5%（腾讯新闻 2026-08-08）"],"scripts":[{"angle":"干货直给","text":"谷歌AI核心层一夜洗牌。8月5号到6号，谷歌连着动了几个最关键的人。在谷歌干了27年的首席科学家Jeff Dean离职，跟Ghemawat、Quoc Le、Vinyals三个老伙计创办Discovery Loop，做AI自动跑科学实验的循环，谷歌自己投了钱还供算力。DeepMind创始人Hassabis交出日常管理，转去当主席和首席科学家。原CTO Kavukcuoglu升任高级副总裁，直接向皮查伊汇报，接管Gemini研发交付。布林也更深介入Gemini战略。一句话，谷歌把两个最有声望的科学家移出执行层，把Gemini收进更短的指挥链，急着跟OpenAI、Anthropic抢速度。"},{"angle":"趋势判断","text":"谷歌这轮人事地震，本质是前沿模型竞争逼出来的组织收缩。过去DeepMind是谷歌AI的引擎室，研究主导一切。现在不行了，去年秋天Gemini一度领先，之后被OpenAI和Anthropic反超，最新旗舰Gemini 3.5 Pro迟迟不发，股价还跌了5%。谷歌的应对是两条线：把Gemini拉进短指挥链，Hassabis管科研、Kavukcuoglu管交付、布林管战略，皮查伊催速度；同时不硬留人，投资离职者的公司、供算力维持关系。这揭示一个行业现实：顶级研究者用大厂资源换创业控制权，模型公司的护城河正在从论文转向产品和收入。接下来谷歌比拼的不是榜单，是代码工具和企业付费。"},{"angle":"故事切入","text":"一个在谷歌待了27年的技术元老，参与了搜索地基、TPU、Google Brain的人，上周发推说要走了。这个人叫Jeff Dean，8月5号左右谷歌确认他离职，跟三个老搭档去搞Discovery Loop，让AI自己提假设、跑实验、改模型。同一时间，DeepMind的Hassabis把日常交出去当主席，Gemini交给Kavukcuoglu，布林亲自下场盯。这不是普通跳槽，是谷歌AI权力的一次大挪移。背景是Gemini被OpenAI和Anthropic反超、旗舰迟迟不发。对咱们普通人的影响是间接的：你用的谷歌系产品，接下来迭代节奏会变快，但也可能更激进。大厂抢人抢模型，最后都落在你每天用的那个搜索框里。"}]},{"id":"ai2","title":"苹果国行Apple智能接千问，文档上线一天就被撤","hook":"官网第一次写明接阿里千问，不到24小时撤回，客服说还在等审批。","why":"这是Apple智能国行版落地节奏的最新发展，多方媒体跟进且事实链条完整（上线-撤回-客服回应-备案背景）。能讲清「确定要接、但暂不能用」的真实状态，纠正市场误读。","heat":"高","tags":["苹果","Apple智能","千问","阿里","国行"],"facts":["8月8日苹果中国官网Mac使用手册上线《在Mac上配合Apple智能使用千问》，首次以官方文档确认国行Apple智能集成阿里千问（观察者网/深圳商报 2026-08-09）","文档上线不到一天被撤下，页面恢复为「配合Apple智能使用ChatGPT」旧版（观察者网/DoNews 2026-08-09）","苹果客服8月9日回应：目前中国大陆暂时没有AI智能功能，相关功能正在申请中，需国家审批通过才能使用（新浪/搜狐/DoNews 2026-08-09）","7月15日「网信中国」公示生成式AI服务备案名单，苹果技术开发(上海)申报的「Apple智能」完成备案，办结日期7月8日，适用场景为国行iPhone（搜狐/DoNews 2026-08-09）","阿里曾确认千问将作为AI能力集成至Apple智能，覆盖iOS、iPadOS、macOS、visionOS中国用户（深圳商报/搜狐 2026-08-09）","被撤文档显示千问扩展要求macOS 26.6以上，面向大陆版本设备、大陆Apple账户、身处大陆境内，深度整合写作工具与Siri（DoNews/观察者网 2026-08-09）","待核实：有报道称iOS27 Beta2已集成百度视觉搜索，仅为单一知情人士口径，未见官方确认"],"scripts":[{"angle":"干货直给","text":"苹果国行Apple智能跟阿里千问的瓜，一天就反转了。8月8号苹果中国官网Mac使用手册里上线一篇《在Mac上配合Apple智能使用千问》，第一次用官方文档确认国行Apple智能接的是千问。但这篇文档上线不到一天就被撤了，页面退回成配合ChatGPT的旧版。苹果客服8月9号回应：目前中国大陆暂时没有AI智能功能，相关功能在申请中，要等国家审批通过。其实7月15号网信中国已经公示，苹果申报的Apple智能完成备案，办结日期7月8号，适用国行iPhone。备案完了不代表功能开，产品适配和监管审批还得走。所以现在的状态是：确定要接千问，但啥时候能用，没准信。"},{"angle":"避坑清单","text":"苹果千问手册一天就被撤，普通用户别被带节奏。第一，现状是国行Apple智能还没开。客服明确说暂时没有这个功能，在等审批，别信提前说能用的小道消息。第二，备案是真的。7月8号Apple智能完成生成式AI服务备案，7月15号网信中国公示，适用国行iPhone，这是落地的前提条件，已经具备。第三，接千问也基本坐实。撤掉的文档里写得很清楚，千问扩展走macOS 26.6以上，限大陆设备、大陆账户、人在大陆，整合Siri和写作工具。第四，别急着升系统等这个功能，文档撤了说明节奏有变数，以苹果官方公告为准。一句话：要接千问是真，马上能用是假，耐心等审批。"},{"angle":"反常识开场","text":"苹果自己把国行AI的窗户纸捅破又糊上了，这反而比一直藏着更说明问题。8月8号官网文档首次写明Apple智能接阿里千问，不到24小时撤回。为什么撤？客服的说法是功能还在申请、等监管审批。注意，备案其实7月8号就办下来了，也就是说合规的第一道关过了，卡的是产品落地那道关。这种上线又秒撤，苹果不是头一回，3月底国行iPhone设置页也短暂冒出过Apple智能选项然后收回。它反映的是Apple智能国行版的真实处境：框架定了、合作伙伴定了、备案有了，但上线节奏被审批节奏卡着。对国内用户来说，等一个真正好用的国行AI助手，还得再忍一阵。"}]},{"id":"ai3","title":"Grok Imagine Image 2.0发布，xAI图像模型冲到全球第二","hook":"不是只会画图了，魔棒能只改你指的那一块，一次还能参考5张图。","why":"xAI图形模型升级聚焦「编辑而非生成」，是图像模型竞争方向转变的信号。有xAI官方发布与多家科技媒体跟进，功能点具体可演示，对设计、电商、自媒体从业者有直接用法价值。","heat":"中高","tags":["xAI","Grok","图像生成","图像编辑","SpaceXAI"],"facts":["美国时间8月7日，马斯克旗下xAI以SpaceXAI品牌推出Grok Imagine Image 2.0图像模型（虎嗅/IT时代网 2026-08-07/08）","第三方Arena榜单文生图与图像编辑两项均列全球第二，仅次于OpenAI的GPT Image 2（虎嗅/Unite.AI 2026-08-07/08）","已作为Quality Mode部署到grok.com/imagine及Grok的iOS、安卓应用，普通用户可直接用；API标注「即将上线」（虎嗅/Unite.AI）","核心升级：区域级精细编辑（魔棒局部修改、分割选区、背景移除）、多图参考（单次最多5张）、智能排版、9种画幅智能适配（虎嗅/Unite.AI/IT时代网）","内置15+模板覆盖商品拍摄、形象照、电商图、游戏原画、营销海报等商用场景（Unite.AI/DevelopersDigest）","待核实：Arena排名由xAI自行引用公开榜单快照（文生图约1320、图像编辑约1439，GPT Image 2分列1463/1380），非独立第三方评测，名次会浮动"],"scripts":[{"angle":"干货直给","text":"马斯克的xAI把图像模型升级了，8月7号推出Grok Imagine Image 2.0，挂的是SpaceXAI品牌。它现在在第三方Arena榜单的文生图和图像编辑两个项目上都排全球第二，仅次于OpenAI的GPT Image 2。已经作为Quality Mode上到grok.com/imagine和Grok的iOS、安卓App，普通用户直接用，开发者API写的是即将上线。这次重点不是生成而是编辑：魔棒能只改你指的那一块，分割选区、背景移除都能单独操作，一次最多参考5张图，还能智能适配9种画幅。说白了，它想从能画图变成能改图，往专业设计工作流里塞。内置15多个模板，商品图、形象照、电商图、游戏原画、海报都能套。"},{"angle":"工具评测","text":"Grok Imagine Image 2.0值不值得用，看你是玩票还是干活。如果你要的是出张好看的图，它排全球第二，质量够用，而且免费通道已经开在Grok里，不用等API。如果你是做设计、电商、营销，它这次的编辑能力才是重点：魔棒局部改、背景一键抠透明、5张参考图融合、9种画幅智能重绘，外加商品图海报这些预制模板，等于把一部分PS活儿接过去了。短板也有：API还没开，要批量接系统得等；榜单第二是xAI自己引用的Arena快照，不是独立评测，具体分数会浮动。对创作者最实用的玩法是，拿它做电商图和社媒配图，比从头生图省时间，比手修图门槛低。"},{"angle":"趋势判断","text":"图像模型这波竞争，重心从生成挪到了编辑。Grok Imagine Image 2.0排全球第二，但xAI讲的故事不是它画得多好，而是它能改得多准：局部编辑、背景移除、多图参考、智能排版，全是为真实工作场景设计的。这跟OpenAI的GPT Image 2是同一个方向，两家都在抢设计师和营销人的桌面。底层逻辑是，单纯生图已经卷出天花板，能无缝进生产流程的模型才值钱。对普通用户，这意味着AI出图会越来越多地出现在你买的东西的详情页、你刷的 poster 里；对从业者，意味着基础修图岗位的门槛在被拉低。接下来图像模型的卖点，不会是画得多炫，而是能不能直接进你的工作流。"}]},{"id":"ai4","title":"特斯拉车机首次接入第三方大模型，装的是豆包","hook":"马斯克在美国用自家Grok，到了中国却给车装了豆包加DeepSeek。","why":"特斯拉中国首次在车机引入国产大模型，是智能座舱本土化的标志性案例，也有合规与产业分工的深层逻辑。多家汽车媒体跟进，事实链条完整，对车主和汽车行业都有讲解价值。","heat":"中高","tags":["特斯拉","豆包","DeepSeek","OTA","智能座舱"],"facts":["7月31日特斯拉中国向Model 3/Y/S/X分批次推送2026.14.13版车机OTA，首次在国内引入第三方大模型——字节豆包（网通社/太平洋汽车 2026-07-31）","双模型协同：豆包负责导航设定、空调调节、媒体控制、车主手册查询等执行型指令；DeepSeek Chat负责开放域对话；均通过火山引擎接入，2026年4月在上海完成生成式AI备案（今日头条/网通社 2026-07-31）","唤醒词「豆包豆包」，提供薇薇、小何、云舟等音色，预设万事通、音乐爱好者、故事会等角色；需开通高级车载娱乐服务（网通社 2026-07-31）","合规驱动：美国市场马斯克绑定自家Grok（2025年7月启用，需订阅9.9美元/月高级车载娱乐服务包）；中国因合规与本土化短板选择第三方（今日头条 2026-08）","实测：初期灰度版本中豆包以独立App形态集成，暂未获控车权限，控车仍靠原语音助手；完整语音控车需后续版本（今日头条/太平洋汽车 2026-07-31/08）","备案号Shanghai-TeslaCheJiYuYinDaMoXingFuWu-202603020128（太平洋汽车 2026-07-31）"],"scripts":[{"angle":"干货直给","text":"特斯拉中国7月31号开始推送2026.14.13版车机OTA，最大的变化是第一次在国内接了第三方大模型——字节的豆包。这是双模型方案：豆包负责导航、空调、媒体控制、查车主手册这些执行类指令，DeepSeek负责闲聊和开放问答，都通过火山引擎接入，今年4月在上海完成生成式AI备案。唤醒词是豆包豆包，有薇薇、云舟等音色，预设万事通、故事会等角色，但要开通高级车载娱乐服务才能用。为什么不用马斯克自家的Grok？美国市场Grok去年7月就上了，同样要订阅。中国这边是合规和本土化短板，逼着它选了国产模型。"},{"angle":"实操流程","text":"特斯拉车主想用上豆包，按这几步走。第一步，确认你的车在推送范围。7月31号起Model 3、Y、S、X分批次推2026.14.13，新交付车优先，老车陆续收，主要在AMD Ryzen芯片车型上开放。第二步，开通高级车载娱乐服务，这是使用前提，没开用不了。第三步，长按方向盘语音键或者直接喊豆包豆包唤醒，选个音色和角色就能聊。但有个现实提醒：目前灰度版本里豆包更像是个独立聊天App，控车权限还没完全放开，调空调、放音乐这些可能还走原来的语音助手。完整语音控车得等后续版本。所以现在它能陪聊、查信息、讲故事，控车别太指望它。"},{"angle":"反常识开场","text":"坚持AI自研的马斯克，在中国却给车装了豆包，这事得反过来想。特斯拉在美国绑的是自家Grok，要订阅每月9.9美元。到了中国，7月31号推的2026.14.13 OTA却接了字节的豆包加DeepSeek，全走火山引擎合规部署。表面看是国产AI赢了，其实是合规和本土化的硬约束：中文座舱体验、数据合规、监管备案，这些马斯克的自研体系短期补不上。所以这是一次理性妥协，不是谁碾压谁。对车主是好事，终于有能聊的中文助手；对行业更关键，它立了个分工范式——车企守住车辆安全和控车，AI厂商提供座舱交互。以后更多车会照这个模子来。"}]},{"id":"ai5","title":"千问App一口气上五项新功能，还接了Qwen3.8-MAX","hook":"定时任务每天8点自动给你出行业简报，办公助理能自己开浏览器下附件出文档。","why":"千问App这次更新把AI从聊天工具推向个人工作台，五项功能均有官方与多家媒体跟进，且能落到具体用法。对效率党、自媒体和办公人群有直接上手价值。","heat":"中高","tags":["千问","Qwen3.8-MAX","办公助理","定时任务","智能体广场"],"facts":["8月7日千问App和PC端功能上新，推出思考研究、定时任务、办公助理、智能体广场、语音通话五项新功能，支持最新旗舰Qwen3.8-MAX，所有用户免费使用（IT之家/每日经济新闻 2026-08-07）","思考研究：原「深度思考」升级，强化复杂推理、工具调用、信息整合与结构化输出，可把资料生成周报/研究报告（IT之家 2026-08-07）","定时任务：预设执行时间自动完成简报梳理、邮件汇总；如每天8点搜AI/芯片/互联网新闻形成趋势小结（IT之家 2026-08-07）","办公助理：连接备忘录/日历/邮件，操作电脑和浏览器，调用Skill自主完成多步骤任务，直接输出Office文档；手机发起、PC执行跨端协同；专业用户可付费增额度（IT之家/网经社 2026-08-07）","智能体广场：智能寄件、网盘整理、超清扫描、文件查询，首批覆盖物流、房产、本地生活、理财、汽车等十余领域（IT之家 2026-08-07）","Qwen3.8-MAX于8月3日发布，总参数2.4万亿，稀疏MoE架构，上下文长度1M Tokens；同日千问办公(QwenWork)开启公测（今日头条/网经社 2026-08-07）"],"scripts":[{"angle":"干货直给","text":"千问App 8月7号大更新，一口气上了五项功能，还接了最新的Qwen3.8-MAX，全部免费。五项分别是：思考研究、定时任务、办公助理、智能体广场、语音通话。思考研究是原来深度思考的升级，资料丢进去能直接出周报和研究报告。定时任务最好用，设好时间它就自动帮你搜新闻、汇总邮件，比如每天8点把AI和芯片动态推给你。办公助理能连你的备忘录、日历、邮件，自己开浏览器下附件，最后吐出一份Office文档，手机发起、电脑执行。智能体广场有寄件、网盘整理、扫描这些生活服务。Qwen3.8-MAX是8月3号发的，2.4万亿参数，上下文1M。"},{"angle":"实操流程","text":"千问这波新功能，最该先玩的是办公助理和定时任务，跟着做。第一步，打开千问App或PC端，确认已切到Qwen3.8-MAX。第二步，试定时任务：在对话框设每天早上8点，自动搜AI、芯片、互联网新闻并生成趋势小结，之后你每天开App就有简报。第三步，试办公助理：把散在几个文件里的报表丢给它，说要汇总各大区数据，它会自己清洗、对齐、出可用结果，手机发起电脑执行。第四步，用智能体广场，@寄件或网盘整理这类服务处理杂活。第五步，语音通话适合带娃讲题、睡前故事。关键提醒：办公助理专业额度要付费，日常免费够用，重活再考虑加购。"},{"angle":"创作者视角","text":"做自媒体的，千问这五项更新里有俩能直接进工作流。第一个是思考研究，你把采集的素材、竞品链接、数据表一扔，它能按背景、目标、成果、总结的结构出一份完整文档，做选题复盘和周报省一半时间。第二个是定时任务，设成每天8点自动扫AI和短视频行业新闻出小结，你起床就有一手情报，不用自己刷。配合办公助理跨端协同，手机上扔任务、电脑上跑、自动出Office，搬运整理素材的体力活基本能交给它。智能体广场里的文件查询、超清扫描也能接进素材管理。把这些串起来，一个人顶半个运营小组，尤其适合预算有限、要批量产内容的团队。"}]}]}]},"2026-08-08":{"date":"2026-08-08","updatedAt":"2026-08-08 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"东航国内机票提前14天免费退改，全舱位，第一家","hook":"以前提前30天才免费，现在14天就行，等于白送你16天后悔时间。","why":"退改费是民航投诉的头号痛点，上半年2.7万件投诉里近一半卡在这上面。第一家破局的政策变化，覆盖人群极广，几乎每个坐飞机的人都用得上，且有明确的生效日期和适用边界可讲。","heat":"高","tags":["机票","退改签","东航","政策","省钱"],"facts":["东航发布新版《国内客票自愿退票和自愿变更实施细则》：2026年8月6日（含）以后销售、且8月6日（含）以后开始旅行的国内客票，所有舱位提前14天（即336小时）自愿变更或退票全部免费（人民网上海频道 2026-08-08；南方+ 2026-08-08）","旧版规则为航班规定离站时间30天之前全免费，此次把门槛从30天压缩到14天，多出16天缓冲期（腾讯网转大众新闻 2026-08-08）","东航成为国内首家提前14天国内机票可免费退改的航司；截至8月7日晚，国航、南航等其他主要航司均未跟进（人民网上海频道 2026-08-08；新浪 2026-08-08）","新规把离站时间分五档：14天之前、前7天—14天、前48小时—7天、4小时—48小时、前4小时至起飞后，越临近起飞费用越高；14天至7天之前大部分舱位也可免费变更，仅少部分低价舱位收5%（南方+ 2026-08-08）","不适用范围：团队票、里程兑换票、标注不得退改的特价票等特殊票种，且不含港澳台航线及国际航线（消费日报 2026-08-07；新浪 2026-08-08）","黑猫投诉《2026上半年机场航空公司投诉数据报告》：约2.7万件消费者投诉中，退改费用高问题占比近一半（21世纪经济报道，经消费日报、新京报引用 2026-08-08）","背景：2026年6月2日民航局实施新版《公共航空运输旅客服务管理规定》统一国内航线阶梯退改规则；7月1日新版《中华人民共和国民用航空法》施行（消费日报 2026-08-07）","待核实：有稿件称1.5折（含）以下超低价客票不享受此福利，该具体折扣口径仅见于单一AI生成稿件，未获官方细则印证"],"scripts":[{"angle":"干货直给","text":"东航改规则了，八月六号开始卖的国内机票，起飞前十四天以上退票改签，全免费。所有舱位，不分你买的是全价还是三折。以前的门槛是提前三十天，现在往后挪了十六天，这十六天就是实打实多出来的后悔时间。它是国内第一家这么干的，截至八月七号晚上，国航南航都还没跟。有几个条件你得看清楚。第一，只认八月六号含当天以后卖出的票，你之前买的还按老规矩走。第二，只管国内航线，港澳台和国际线不算。第三，团队票、里程兑换的票、还有标着不得退改的特价票，不在里面。过了十四天这道线，就开始按五档阶梯收钱，越靠近起飞越贵。十四天到七天这一段，大部分舱位改签还是免费，少数低价舱收百分之五。为什么突然给这个福利，看一个数就懂了：上半年机场航司投诉两万七千件，将近一半是嫌退改费太贵。"},{"angle":"避坑清单","text":"东航十四天免费退改的新规，别高兴太早，四个坑先记下来。第一个坑是时间点。它认的是出票日期，八月六号含当天以后买的票才算。你七月订的十月的票，还按老规则，提前三十天才免费。想吃这个政策，只能重新买。第二个坑是范围。只有国内航线，你飞首尔飞曼谷的票，一分钱都不会少扣。第三个坑是票种。团队票、里程兑换票、以及那些标着不得退改的超低价特价票，全部排除在外。你在第三方平台上抢到的那种便宜得离谱的票，大概率就在这一类里。第四个坑是十四天这条线本身。过了线就是五档阶梯，七天以内退票，低价舱位的扣费能到很高的比例。所以真正的用法是，把行程不确定的票，卡在起飞前十五天做决定，不要拖到第十三天。多等两天，钱就不是你的了。"},{"angle":"反常识开场","text":"航司给你的免费退改，不是发善心，是在抢回定价权。东航这次把国内票的全舱免费退改，从提前三十天改成提前十四天。听着是让利，本质是它算过账的。上半年机场和航司的投诉大概两万七千件，接近一半卡在退改费上。七月还出过一单，一万五千多的国际票，起飞前三天退，只退回四百多。这种事出一次，品牌就掉一层。另一头是高铁。高铁随买随退，中短途客源一直在被分走。东航把决策风险降下来，等于把那些因为怕退票费而没下单的人捞回来。多给你十六天缓冲，它损失的是一点二次销售窗口，换回来的是订单和口碑。所以你要做的不是感谢，是用足。行程没定的票先买上，卡在十五天这个点重新评估，这才是这条规则给你的真实价值。"}]},{"id":"tv2","title":"台风白海豚要登陆了，机票火车票这样退一分不亏","hook":"航司都出了特殊处置方案，符合条件免费退改，别自己傻等。","why":"台风9日晚至10日早登陆，覆盖长三角与福建，影响人数巨大且时效性极强。多数人不知道台风期间有专门的免费退改通道，实操价值高，发出去就能用。","heat":"高","tags":["台风","退票","机票","12306","应急"],"facts":["今年第13号台风白海豚8月8日6时位于温岭东南方向约545公里的海面上，中心附近最大风力14级（强台风级），预计9日晚上至10日早晨在苍南到象山一带沿海登陆（总台记者，经腾讯新闻 2026-08-08）","浙江省防指8月8日10时将防台风应急响应提升至Ⅱ级；宁波机场计划8月8日23时30分起停止航班运行，8月9日全天航班停止运行（总台记者 李佳、于晨 2026-08-08）","中国国航、南方航空、东方航空、海南航空、浙江长龙航空、山东航空等已发布受影响航线客票特殊处置方案（都市快报，经新浪微博 2026-08-08）","南航口径：8月7日16时（含）前购买、旅行日期为8月9日至10日的浙江省所有机场进出港航线南航客票，可按特殊处置方案办理免费变更或退票，具体规则以官网公告为准（都市快报 2026-08-08）","国铁南昌局8月8日10时启动防洪防台风四级应急响应，计划停运福州至松溪K8748次、洛阳至福州K32次等列车；已购停运列车车票的旅客，可于票面乘车日期起30日内（含当日）通过12306网站、App或车站窗口免费办理退票（总台央视记者 郑连凯 2026-08-08）","上铁宁波车务段：8月9日至10日途经萧甬铁路D32次、甬金铁路C629次、杭深铁路D3215次等列车临时停运（总台记者 2026-08-08）","9日至10日江苏、浙江、福建、江西境内沈海、京沪、长深、京台等高速部分路段有暴雨或大暴雨（界面新闻转交通运输部门提示 2026-08-07）","待核实：各航司特殊处置方案的出票时间限制、旅行日期区间与覆盖机场各不相同，且随台风路径动态调整，须以航司官网当日公告为准"],"scripts":[{"angle":"干货直给","text":"今年第十三号台风白海豚，八月八号早上六点还在温岭东南方向五百四十五公里的海上，中心风力十四级，预计九号晚上到十号早上在苍南到象山一带登陆。宁波机场已经定了，八号晚上十一点半开始停航，九号全天不飞。铁路那边，国铁南昌局八号上午十点启动四级响应，福州到松溪的K8748、洛阳到福州的K32等车次停运。你手上有票的，现在就该动。机票这边，国航、南航、东航、海航、浙江长龙、山东航空都已经出了特殊处置方案。以南航为例，八月七号下午四点前买的、九号到十号浙江所有机场进出港的票，可以免费改签或者退票。火车票更简单，停运车次的票，从票面乘车日期起三十天内，在12306或者车站窗口免费退。别等航司主动通知，自己去官网查当天公告，各家适用的日期和航线都不一样。"},{"angle":"实操流程","text":"台风天保住票钱，按这四步走，别慌。第一步，确认你的航班或者车次在不在受影响范围。台风白海豚预计九号晚到十号早在苍南到象山一带登陆，宁波机场八号二十三点半起停航、九号全天停飞，江苏浙江福建江西的多条高速九号到十号有暴雨。第二步，去你买票那家航司的官网找特殊处置方案公告，重点看三个信息：出票时间限制、旅行日期区间、覆盖哪些机场。南航的口径是八月七号十六点前购买、九号到十号浙江所有机场进出港。第三步，符合条件就直接线上办，别打电话排队，航司都提醒优先走线上渠道。第四步，火车票单独处理，停运车次的票在票面乘车日期起三十天内免费退，过期就麻烦了。还有一条，第三方平台买的票，先看平台有没有同步航司政策，没同步就联系平台客服要求按航司公告执行。"},{"angle":"故事切入","text":"我一个朋友去年这个时候在厦门，台风来了航班取消，他在机场坐了一夜，回来跟我说损失了两千多。其实一分钱都不用损失，他只是不知道流程。台风季的规则是这样的：只要航司发了特殊处置方案，符合条件的票免费退改，跟你买的是什么折扣没关系。这次白海豚，九号晚到十号早在苍南到象山一带登陆，宁波机场八号夜里就停航了。国航南航东航海航长龙山航全都出了方案。南航的条件是八月七号十六点之前买的、旅行日期九号到十号、浙江所有机场进出港。铁路那边，停运车次的票三十天内免费退。关键在于时效，这些方案都有截止时间，过了就按正常阶梯扣费。所以台风消息一出，第一件事不是刷天气，是去航司官网翻公告。"}]},{"id":"tv3","title":"暑期民宿三大套路：临时加价、图文不符、退订扣光","hook":"十二地消协联合点名，有民宿用AI修图做海景宣传，实景差得离谱。","why":"暑期住宿是纠纷高发区，消协刚发过官方提示，套路可归纳成清晰的三条，配可落地的破解动作。避坑类内容完播和收藏都高，且不受地域限制。","heat":"中高","tags":["民宿","避坑","消协提示","退订","暑期"],"facts":["广州、深圳、珠海、汕头、佛山、汕尾、东莞、中山、江门、湛江、茂名、肇庆十二地消费者组织联合发布滨海度假消费提示，点名低价揽客、隐形消费、缺斤短两、民宿临时加价等陷阱（四川消委转发 2026-08-04）","消协提示：部分民宿利用AI修图、虚假航拍制作海景宣传图，实景与线上展示差距悬殊；预订前多平台对比游客实拍评价，主动向商家索要实时实景视频（四川消委 2026-08-04）","消协提示：住宿务必通过官方平台支付，拒绝房东、中介私下微信转账；下单前核对总价、退改规则、清洁费、节假日加价等全部收费项目，重点留意不可取消、到店补差等格式条款，防范房源超售、到店临时加价、强制升级房型（四川消委 2026-08-04）","旺季常见套路一：订单确认后商家以系统故障、旺季调价等理由要求加价，否则退单，随后同一房源以更高价重新上线（新浪财经 2026-08）","旺季常见套路二：用样板间照片吸引客流实际安排普通房、夸大景观距离、把隔断房包装成复式、在小字条款里藏人数与年龄限制（新浪财经 2026-08）","市场分化：乡村宅基地民宿定价约180-260元/晚，景区湖景民宿旺季680-2000元/晚，城郊亲子类298-498元/晚（新浪财经 2026-08）","到店被要求补差价可先联系平台客服，协商不成拨打12301旅游服务热线（今日头条·掌上平阴 2026-08-05）","待核实：提前7-15天预订价格最优的说法来自单一自媒体实测，不同城市与房型差异大，未获多源验证"],"scripts":[{"angle":"避坑清单","text":"暑期订民宿，三个套路，认准了别踩。第一个，订单确认之后临时加价。商家先用正常价把你钩住，等你离入住只剩几天，再用系统故障、旺季调价这种理由要你补钱，不补就退单。转头你会在同一个平台看到同一套房，价格翻了倍。第二个，图片是天堂实景是废墟。广东十二地的消协八月四号联合发过提示，专门点名有民宿用AI修图和虚假航拍做海景宣传图，实景和线上差得离谱。破解办法就一条，让商家现拍一段实时视频发你。第三个，退订扣得比抢劫还狠。提前七天取消扣一半、三天以内不退，这种条款旺季几乎是标配。下单前必须把总价、退改规则、清洁费、节假日加价全部核对一遍，重点看不可取消和到店补差这两个词。还有，所有钱走官方平台，房东让你微信转账的，直接换一家。"},{"angle":"反常识开场","text":"暑期民宿涨价这个说法，其实是错的。真实情况是分化，不是普涨。乡村的宅基地民宿走量，一晚两百上下，靠周租月租赚钱。景区里的湖景房靠稀缺景观溢价，旺季能到一两千。城郊亲子那一类三四百，周末满房平日空着引流。你觉得处处涨价，是因为你只看热门景区那一圈。真正该关注的不是涨没涨，是哪些溢价值得给。景观房贵在窗外那片湖，你要是每天早出晚归，那笔钱就是白花。反过来，带小孩的家庭多花一百块选个有院子的，孩子有地方跑，这钱就花对了。定价逻辑上还有一条：民宿按入住率动态调价，临期确实会放尾房特价，但选择少、风险高，还基本都是不可取消的房型。图便宜捡这种，行程一变就是全款打水漂。"},{"angle":"实操流程","text":"订民宿按这个顺序走，能省掉八成的糟心事。第一步定预算区间，别一上来就翻图。第二步至少比三个平台的同房型含税总价，注意是总价，不是标价，清洁费和节假日加价都要算进去。第三步筛房型，只看限时免费取消的，不可取消的特价房再便宜也别碰，行程一变就是全款打水漂。第四步查评价，不看好评看差评，重点搜隔断、噪音、加价、货不对板这几个关键词。第五步要视频，让商家现场拍一段发你，不接受的直接排除，广东十二地消协八月的提示里专门说了，有民宿用AI修图做海景图。第六步付款只走官方平台，任何让你私下转账的都别理。第七步截图留证，订单页、聊天记录、宣传页全部存下来。到店被要求补差价，先联系平台客服，谈不拢打12301。"}]},{"id":"tv4","title":"中韩航班时隔七年首次扩容，每周多七十个班次","hook":"仁川到上海从每周56班加到63班，供给一松，票价才有下探空间。","why":"航权是决定票价上限的底层变量，但极少有人讲。有韩国国土交通部官方一手数据，且直接关系到出境短线的价格预期，属于既硬又实用的信息差内容。","heat":"中高","tags":["航权","韩国","出境游","机票","供给"],"facts":["韩国国土交通部宣布，韩中双边航空会谈（5月27日至28日在首尔举行）达成一致，新增客运和货运航权共计每周70班，是自2019年以来两国首次新增航权（韩国国土交通部英文官网 molit.go.kr；人民日报、央视网 2026-08-04）","客运航班配额由每周608班增至664班，货运航班由54班增至68班（星岛头条 2026-06-04；华侨网转路透社 2026-06）","仁川飞往北京、上海、广州、大连、成都、哈尔滨的航班每周各新增7班，合计42班；其中仁川至上海由每周56班增至63班，仁川至广州由21班增至28班（星岛头条 2026-06-04）","釜山、清州等韩国地方城市可直飞广州、成都、深圳、重庆、昆明、西安、乌鲁木齐、哈尔滨、沈阳、延吉等中国10个城市，每周新增14班；过去这些地方旅客需经仁川转机（韩国国土交通部官网；商务部驻釜山经商处 2026）","货运方面，在原有天津、郑州基础上新增鄂州、合肥航线，中韩四大货运枢纽间货运航班每周增至68班（华侨网转路透社 2026-06）","今年一季度中韩往返客运量约439万人次，已超越疫情前2019年同期414万人次的水平（韩国国土交通部数据，经星岛头条、华侨网转述）","韩国政府统计：今年1月至6月韩国访华人数约171.4万人次，较去年同期增长16%（人民日报、央视网 2026-08-04）","待核实：去年仁川至上海航线平均客座率89%的说法仅见路透社转述韩方口径，未见中方数据印证"],"scripts":[{"angle":"干货直给","text":"中韩之间的航班要加了，这是二零一九年以来头一回。韩国国土交通部宣布，五月底两国在首尔谈完，新增客运和货运航权一共每周七十班。客运配额从每周六百零八班加到六百六十四班，货运从五十四班加到六十八班。具体怎么分：仁川飞北京、上海、广州、大连、成都、哈尔滨，每条线各加七班，一共四十二班。其中仁川到上海从每周五十六班加到六十三班，仁川到广州从二十一班加到二十八班。另外釜山、清州这些韩国地方城市，直飞广州、成都、深圳、重庆、昆明、西安、乌鲁木齐、哈尔滨、沈阳、延吉这十个中国城市，每周再加十四班。为什么现在加，因为不够用了。今年一季度中韩往返客运量约四百三十九万人次，已经超过疫情前二零一九年同期的四百一十四万。"},{"angle":"趋势判断","text":"航权这个东西，决定了你机票的价格上限。中韩之间时隔七年头一次扩容，每周多七十个班次，这件事的影响会在未来几个月慢慢显出来。逻辑很简单：座位供给多了，航司之间就得抢客，票价就压不住。之前仁川到上海、仁川到广州这两条线，原有配额已经被两国航司用满了，想加班次都没额度。现在加完，仁川到上海从每周五十六班变六十三班。另一个变化在地方机场。以前釜山、清州的人要去广州重庆，得先飞仁川转机，现在能直飞了。这对国内来说意味着什么？韩国客源会更均匀地铺到广州、成都、深圳、西安这些城市，而不是只堆在北上。今年一到六月韩国访华已经一百七十一万人次，同比涨了百分之十六。你要是做入境相关的生意，这条线值得盯。"},{"angle":"横向对比","text":"同样是去韩国，为什么有人买八百有人买三千，差别常常不在你会不会抢票，在那条航线有没有额度。航权是国家之间谈的，谈定每周多少班，航司才能在这个框里排。中韩上一次谈扩容还是二零一九年，中间这几年配额基本卡死。这次新增七十班，客运从六百零八加到六百六十四。热门线像仁川到上海，之前额度用满了，供给锁死，价格自然硬。现在加了七班，供给松一点，价格才有下探空间。对比一下地方线：釜山清州直飞中国十城每周新增十四班，这是从零到有，变化比热门线更明显。所以看机票别只盯促销，先看那条线一周飞几班。班次多、承运人多的线，价格战才打得起来。一周只有两三班的独飞线，你怎么蹲都便宜不了。"}]},{"id":"tv5","title":"今年暑期出游的人变了：大学生领跑，全家住进县城","hook":"七月游客住进了全国一千多个县城，避暑纳凉夜游搜索量涨了百分之二百七十。","why":"人群结构变化是做内容选题的底层依据，比单个目的地推荐更长效。三组平台数据支撑，能直接指导观众换玩法，也能指导同行换赛道。","heat":"中高","tags":["暑期","县域旅游","旅居","避暑","人群结构"],"facts":["去哪儿数据：19至22岁青年群体机票预订增幅达20%，领跑所有人群，成为暑期出游主力（去哪儿，经人民网四川频道转川观新闻 2026-08-01；四川观察 2026-08-04）","去哪儿数据：7月平台游客入住覆盖全国千余个县城，主打避暑、人文体验的县域旅游快速崛起；可长期租住、沉浸式体验的旅居玩法受追捧（人民网四川频道转川观新闻 2026-08-01）","7月避暑、纳凉、夜游相关关键词搜索量环比上月增长270%，成都跻身国内酒店预订量前十，仅次于北京、上海（去哪儿，经四川观察 2026-08-04）","7月成渝地区持续高温，大量市民奔赴四川清凉县城长期避暑，四川雷波县、宝兴县酒店预订量同比翻倍增长（去哪儿，经人民网四川频道 2026-08-01）","途牛数据：今年7月川西旅游热度大幅上涨，平台前往甘孜州的出游人次同比增幅超一倍（人民网四川频道转川观新闻 2026-08-01）","入境侧：7月瑞典、希腊等欧洲国家来华入境机票订单量增幅超3倍；上海、北京、广州、成都、深圳跻身入境游十大热门目的地（去哪儿，经人民网四川频道 2026-08-01）","景区搜索热度前列：河南开封万岁山武侠城、四川九寨沟、北京环球度假区、四川峨眉山、贵州黄果树瀑布（去哪儿 2026-08-01）","待核实：60岁以上银发游客增幅显著、携孙隔代度假增多的说法未给出具体百分比，仅一处平台口径转述"],"scripts":[{"angle":"数据向","text":"今年暑期出去玩的人，结构变了，三组数说清楚。第一组，十九到二十二岁这个年龄段，机票预订涨了百分之二十，领跑所有人群。大学生成了暑期出行的主力，不是家庭亲子。第二组，七月避暑、纳凉、夜游这几个关键词的搜索量，环比上个月涨了百分之二百七十。这不是在选目的地，这是在选温度。第三组，七月平台上游客住进了全国一千多个县城。县域旅游起来了，主打的就是避暑加人文，而且很多人不是住一两晚，是长租旅居。配套的数据是，成渝七月持续高温，四川雷波县、宝兴县的酒店预订量同比翻倍。途牛那边，七月去甘孜州的人次同比涨了一倍多。归到一句话：今年大家不是在追景点，是在追凉快，而且愿意为凉快住得久一点、偏一点。"},{"angle":"创作者视角","text":"做旅游内容的，今年该换赛道了。热门景区那套打卡攻略已经拍烂了，但有三块地方还空着。第一块是县城。七月游客住进了全国一千多个县城，四川雷波、宝兴这种名字大部分人没听过，酒店预订量同比翻倍。你去拍一个没人拍过的县城，怎么去、住哪、吃什么、花多少，这种内容现在稀缺。第二块是长住。旅居这个玩法在起来，很多人不是待两天，是租一个月。月租多少、菜市场在哪、有没有洗衣机，这些细节没人讲。第三块是学生。十九到二十二岁的机票预订涨了百分之二十，这拨人预算有限但时间充裕，需要的是穷游路线和避坑，不是消费升级。避暑纳凉夜游的搜索量环比涨了百分之二百七十，选题往这三个词上靠，流量不会差。"},{"angle":"反常识开场","text":"今年最火的避暑地，可能是你在地图上要找半天的地方。四川雷波县、宝兴县，七月酒店预订量同比翻倍。不是网红打卡地，就是凉快、便宜、能长住。这背后是一个转向：过去大家出门是为了看景点，现在很多人出门是为了换个温度住一阵。数据也对得上，七月平台游客入住覆盖全国一千多个县城，避暑纳凉夜游这几个词的搜索量环比涨了百分之二百七十。人群也在变，十九到二十二岁的机票预订涨了百分之二十，成了主力，同时去甘孜州的人次同比涨了一倍多。这两拨人的共同点是时间充裕、不赶行程。所以如果你还在按黄金周那套三天两夜的思路做规划，可能已经不适用了。今年更划算的玩法，是找个县城租一个月。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"OpenAI把一个做好的模型摁住了，不敢发","hook":"它能自己找出零日漏洞、独立跑完一整套攻击流程，中间不用人插手。","why":"第一个被自家公司判定为网络安全关键风险而延迟发布的前沿模型，是能力边界的标志性事件。路透社原发、多家中文媒体跟进，事实扎实，且能延伸到普通人的账号安全。","heat":"高","tags":["OpenAI","Astra","网络安全","模型发布","AI安全"],"facts":["据路透社报道，OpenAI 基于全面安全评估结论，决定延缓旗下 Astra 大模型对外发布，并配套出台严格安全管控举措（路透社，经环球网 2026-08-08；新浪财经 2026-08-08）","依照 OpenAI《准备框架》评估标准，Astra 成为该公司首款网络安全风险评级达到关键级别的人工智能模型（环球网 2026-08-08）","高风险能力一：该模型可脱离人工干预，在多重安全加固的核心真实系统内，自主识别、生成不同危害等级的零日漏洞利用程序（环球网 2026-08-08）","高风险能力二：仅依靠高层级攻击目标指令，就能独立设计、完整执行全新的端到端网络攻击流程（环球网 2026-08-08）","OpenAI 澄清：这款尚未正式面世的模型并未参与此前针对 Hugging Face 平台的网络攻击活动（环球网 2026-08-08）","管控措施：搭建独立隔离测试环境、限定模型网络与工具访问权限、对模型权重加密防护、增设全天候风险监测、沙箱隔离运行；叫停内部所有未达新安全标准的 Astra 相关研发（环球网 2026-08-08）","OpenAI 表示将主动对接政府监管机构与专业 AI 安全机构联合开展模型安全测试，并向第三方评测主体输出标准化安全管控规范；奥特曼称将在完善安全防护后稳步推进公开落地（环球网 2026-08-08）","待核实：有汇总稿称过去两周 OpenAI 与 Anthropic 在测试中意外入侵包括 Hugging Face 在内的多家机构系统、Meta 新模型也曾渗透第三方系统，该说法仅见社媒转述"],"scripts":[{"angle":"干货直给","text":"OpenAI 把一个已经做好的模型摁住了，不发。这个模型叫 Astra，按照 OpenAI 自己的准备框架评估，它是公司历史上第一个网络安全风险评级达到关键级别的模型。为什么关键，两个能力。第一，它能脱离人工干预，在做过多重安全加固的真实系统里，自主找出漏洞并生成可用的攻击程序，也就是零日漏洞利用。第二，你只需要给它一个高层级的攻击目标，它能自己设计并完整跑完一整套端到端的网络攻击流程，不需要人在中间接手。OpenAI 同步上了一堆管控：独立隔离的测试环境、限制模型的网络和工具访问权限、模型权重加密、全天候监控、沙箱运行，还叫停了内部所有没达到新安全标准的 Astra 研发。奥特曼说这个模型性能很突出，等安全体系补完再推进上线。"},{"angle":"反常识开场","text":"一个 AI 强到公司自己不敢发，这事真实发生了。不是营销话术，是路透社八月八号的报道。OpenAI 决定延缓 Astra 的对外发布，原因写得很直白：这个模型在智能体编程和网络安全上的能力突破太大，按内部评估标准，它成了第一个网络安全风险达到关键级别的模型。具体强在哪：它能在没有人参与的情况下，从加固过的真实系统里挖出零日漏洞并写出利用程序；只给一句高层目标，它能独立设计并执行完整的攻击链。这意味着攻防的成本结构变了。以前搞一次高质量攻击需要一个团队几个月，现在可能是一个模型几个小时。OpenAI 的应对是把它关进沙箱、加密权重、限制网络访问，叫停所有不达标的相关研发，同时澄清这个模型没参与之前针对 Hugging Face 的攻击。"},{"angle":"趋势判断","text":"模型能力和安全之间那条线，今年被正式画出来了。OpenAI 把 Astra 摁住不发，理由是它在网络安全上达到了关键风险级别，这是这家公司第一次给自家模型打上这个标签。往后看，会带来三个变化。第一，能力越强的模型，发布节奏会越慢，评估流程会越长，你以后拿到的旗舰模型，可能是被裁剪过的版本。第二，攻防两端都会用上 AI。防守方现在必须假设对手手里有一个能自主挖漏洞的模型，靠人工打补丁的节奏根本跟不上。第三，监管会跟进。OpenAI 主动对接政府监管机构和第三方安全评测机构联合测试，这个动作本身就是在给行业定规矩。对普通用户也有影响：你用的服务背后那套系统，被自动化攻击试探的频率会更高，双重验证这种基础防护别再嫌麻烦。"}]},{"id":"ai2","title":"DeepSeek花一亿四千万买机器人股票，锁三年","hook":"做大脑的开始给身体掏钱，这个信号比金额本身重要。","why":"人形机器人第一股定价与申购，加上 DeepSeek、腾讯同时以36个月锁定期入局，是大模型与硬件合流的标志事件。财务数据完整可查，能讲清产业逻辑而非炒概念。","heat":"高","tags":["宇树科技","DeepSeek","人形机器人","具身智能","IPO"],"facts":["宇树科技（688836.SH）8月6日晚公告：科创板发行价150.80元/股，发行4044.6434万股，占发行后总股本10%；网上、网下申购日均为8月10日，缴款截止日8月12日（证券时报 2026-08-06；21世纪经济报道 2026-08-08）","预计募集资金总额约60.99亿元，净额约59.17亿元，发行市值约609.9亿元；中一签500股需缴款7.54万元（证券时报 2026-08-06；金融界 2026-08-08）","战略配售：梁文锋旗下杭州深度求索（DeepSeek）获配93.34万股，占发行数量2.31%，获配金额约1.41亿元，锁定期36个月；腾讯控股旗下上海启善投资获配90.32万股，占2.23%，锁定期36个月（证券时报 2026-08-06；金融界 2026-08-08）","其余战配方包括三只全国社保基金组合、中国石油集团昆仑资本、南方电网产融控股、天翼资本、中信证券投资及两只员工资管计划，共9家获配808.9286万股占发行量20%（证券时报 2026-08-06）","财务：2023年至2025年营业收入从1.59亿元增长至16.99亿元；2025年扣非净利润5.91亿元，归母净利润2.78亿元；主营毛利率从44.22%提升至60.13%（证券时报；网易转瑞景观察 2026-08-08）","2025年人形机器人出货量超5500台（纯人形，不含轮式双臂机器人），出货量全球第一；人形机器人营收占比从2023年1.88%升至2025年51.78%，四足机器人占比从75.78%降至41.62%（21世纪经济报道 2026-08-08）","截至2025年前三季度，超过70%的人形机器人收入来自科研和教育领域，工业应用仅占9%（网易转瑞景观察 2026-08-08）","发行价对应2025年扣非前后孰低摊薄市盈率约219倍，明显高于所属通用设备制造业近一个月约38.56倍的静态市盈率（网易转瑞景观察 2026-08-08）","待核实：按年内科创板新股首日平均涨幅测算中一签浮盈超30万元的说法为媒体估算，不构成对上市表现的预期；本条目仅陈述公开信息，不作任何投资建议"],"scripts":[{"angle":"趋势判断","text":"DeepSeek 花一亿四千多万，买了一家机器人公司的股票，锁三十六个月。这家公司是宇树，八月十号科创板申购，发行价一百五十点八元，发行市值约六百一十亿。战略配售名单里，DeepSeek 拿了九十三万三千多股，占发行量的百分之二点三一；腾讯旗下的上海启善投资拿了九十万三千多股，占百分之二点二三。两家都锁三年。这个组合值得琢磨。DeepSeek 是做大模型的，宇树是做机器人本体的，一个出大脑，一个出身体。三十六个月的锁定期说明这不是财务投资，是卡位。宇树自己在招股书里也把具身智能大模型研发列为重点投入方向，募的钱有将近一半投到这上面。产业信号很清楚：模型公司开始往硬件走，光靠软件已经不够了。"},{"angle":"数据向","text":"宇树这家公司的数字，比故事更值得看。二零二三年营收一点五九亿，二零二五年十六点九九亿，三年翻了十倍多。同期归母净利从亏一千一百多万变成赚二点七八亿，扣非净利五点九一亿。毛利率从百分之四十四点二二提到六十点一三。二零二五年人形机器人出货超过五千五百台，纯人形，不含轮式双臂，这个量全球第一。营收结构也翻转了，人形机器人占比从二零二三年的百分之一点八八，涨到二零二五年的百分之五十一点七八，成了第一大收入来源。但有一个数得看清楚：截至二零二五年前三季度，超过七成的人形机器人收入来自科研和教育，工业应用只占百分之九。也就是说现在主要买家是实验室和学校，不是工厂。发行价对应的摊薄市盈率约二百一十九倍，行业静态市盈率大概三十八倍，风险在哪很清楚。"},{"angle":"说人话版","text":"人形机器人第一股要来了，用大白话说清楚这件事。宇树科技，做四足机器人和人形机器人的，八月十号申购，一股一百五十块八，中一签五百股要交七万五千四。公司值多少？发行市值大概六百一十亿。它靠什么赚钱？以前主要卖机器狗，现在人形机器人成了第一大收入来源，去年出货五千五百多台，全球卖得最多。谁在买？主要是高校和研究所，超过七成收入来自科研教育，真正进工厂的只占百分之九。谁在投它？DeepSeek 和腾讯都进了战略配售，各拿一亿四千万左右，都锁三年。这两家进来的意义大于钱本身：做模型的和做互联网的，同时押注机器人的身体。最后提醒一句，发行市盈率两百多倍，行业平均三十八倍，这个估值里装的是预期，不是眼下的业绩。"}]},{"id":"ai3","title":"AI开始像电费一样分时段收钱了","hook":"工作日上午九点到十二点、下午两点到六点，价格翻倍。","why":"定价机制从按量计费转向分时动态，是行业供需关系反转的直接证据，且直接影响所有用 API 的人的成本。有央视财经的调用量数据和官方定价页可对照，实操建议明确。","heat":"高","tags":["DeepSeek","峰谷定价","API成本","Kimi","算力"],"facts":["央视财经：7月27日至8月2日，中国 AI 大模型周调用量达28.13万亿词元，已连续十四周位居全球首位；目前词元需求高速增长，高峰期供不应求（央视财经 2026-08-07）","央视财经：Kimi 推出每月39元到559元的四档订阅套餐；DeepSeek 将上调开放接口价格，预计推出峰谷定价，每日上午9点到12点、下午2点到6点为高峰时段，价格是平时的两倍（央视财经 2026-08-07）","界面新闻：DeepSeek API 已引入峰谷分时计费机制，工作日高峰时段计费翻倍，夜间、周末、节假日维持平峰低价，以缓解算力资源压力（界面新闻 2026-08-07）","DeepSeek 现行定价：deepseek-v4-flash 缓存命中输入0.02元/百万tokens、缓存未命中1元、输出2元；deepseek-v4-pro 分别为0.025元、3元、6元（界面新闻查询 DeepSeek 开放平台 2026-08-07）","DeepSeek 8月6日公告：计划近期整体上调 DeepSeek API 服务定价，预计涨幅较大，请合理安排使用，具体方案以正式通知为准（DeepSeek 官方公告，经界面新闻 2026-08-07）","智谱 CEO 张鹏在2025年业绩说明会表示，2026年一季度智谱 API 调用定价提升83%，市场依然供不应求，调用量增长400%（界面新闻 2026-08-07）","Kimi 7月19日公告：K3 发布后48小时内用户请求量大幅超出预估并逼近现有集群承载极限，即日起暂停 C 端新用户订阅，待新算力到位后逐步开放（界面新闻 2026-08-07）","个人端现状：DeepSeek 与千问个人用户仍不设收费门槛，主要靠 API 向开发者收费；豆包专业版分68元、200元、500元三档（搜狐转媒体梳理 2026-08）","待核实：Kimi 订阅档位口径不一，央视财经称39元至559元四档，另有媒体梳理称为49、99、199、699元四档，以官方页面为准"],"scripts":[{"angle":"干货直给","text":"AI 开始像电费一样分时段收钱了。DeepSeek 的接口已经上了峰谷分时计费：工作日上午九点到十二点、下午两点到六点算高峰，价格是平时的两倍；夜间、周末、节假日按平峰价走。它八月六号还发了公告，说近期要整体上调接口定价，预计涨幅较大。Kimi 那边推了每月三十九元到五百五十九元的四档订阅。为什么突然都在涨，央视财经给了一个数：七月二十七号到八月二号，中国 AI 大模型周调用量二十八点一三万亿词元，连续十四周全球第一。需求涨得太快，算力跟不上。Kimi 七月十九号就公告过，K3 发布后四十八小时请求量逼近集群上限，直接暂停了新用户订阅。智谱那边一季度把调用定价提了百分之八十三，调用量还是涨了四倍。"},{"angle":"成本账","text":"如果你在用接口跑活，现在这笔账要重算了。DeepSeek 现行价格：flash 版缓存命中的输入是每百万词元两分钱，没命中一块，输出两块；pro 版分别是两分五、三块、六块。看着便宜，但两个变量会把它顶上去。第一个是峰谷。工作日上午九到十二点、下午两点到六点，价格翻倍。你要是习惯上班时间批量跑任务，成本直接乘二，挪到晚上或者周末跑，同样的活省一半。第二个是涨价，DeepSeek 八月六号公告说要整体上调，涨幅较大。所以现在该做三件事：把不着急的批量任务全部挪到平峰时段；把重复度高的请求做缓存命中，命中和不命中之间差五十倍；再就是别把整套流程绑死在一家上，留好切换的口子。"},{"angle":"反常识开场","text":"大模型越用越便宜这个说法，今年到头了。过去两年各家疯狂压价抢开发者，现在集体调头。DeepSeek 八月六号公告要整体涨价，说涨幅较大，同时上了峰谷分时，工作日高峰翻倍。Kimi 七月因为请求量逼近集群上限，直接暂停了个人端新用户订阅，后来推了三十九到五百五十九元的四档会员。智谱一季度把定价提了百分之八十三，调用量反而涨了四倍。为什么？供不应求。七月底那一周，中国大模型调用量二十八点一三万亿词元，连续十四周全球第一。算力、芯片采购、运营成本一起往上走，靠低价换规模撑不住了。对个人用户还好，DeepSeek 和千问的网页端目前仍然不收钱。真正被挤压的是靠低价接口跑量的小团队，这拨人接下来得重新算成本。"}]},{"id":"ai4","title":"SpaceX把数据中心搬上天，一颗卫星翼展七十五米","hook":"卡不是瓶颈，电和散热才是，所以他们决定去太空拿。","why":"算力基建从地面走向轨道是量级跨越，参数具体到功率、散热面积、发射时间表，视觉冲击强。同时点破了AI行业真正的瓶颈已从芯片转到电力，认知增量大。","heat":"中高","tags":["SpaceX","英伟达","太空算力","Starmind","基础设施"],"facts":["8月4日 SpaceX 宣布与英伟达合作，共同设计 Starmind AI1 卫星计算载荷，每颗 Starmind 卫星将搭载 NVIDIA Rubin GPU 和 Vera CPU，把接近数据中心级别的算力部署到太空（SpaceX 官方公告 2026-08-04，经华尔街见闻 2026-08-05、机器之心 2026-08-05）","马斯克在 SpaceX 上市后首份季度业绩投资者电话会上宣布，AI 算力建设独家采用英伟达技术，称 Vera Rubin NVL72 架构是目前最好的 AI 计算机（华尔街见闻 2026-08-05）","设计参数：卫星完全展开后高约30米、翼展约75米，计算载荷峰值功率可达250千瓦、平均功率约175千瓦，整星计算功率密度约每吨75千瓦；配备约160平方米可展开式液冷散热器（机器之心 2026-08-05）","卫星利用太空中易获取的能源与冷却条件完成在轨计算，通过高带宽激光链路把数据传回星链卫星网络（机器之心 2026-08-05）","SpaceX 表示：在地球上越来越难获得充足电力的背景下，将本地 AI 算力部署到卫星、从低延迟的太阳同步轨道把结果传回地面，是目前最快的算力扩展方式（机器之心 2026-08-05）","马斯克披露算力目标：年底在线算力超过2吉瓦，明年底接近10吉瓦而非此前预期的5吉瓦，并希望明年底累计达到20吉瓦，2027年底约15吉瓦在线；当前资源投入重点是电力和冷却设备而非 GPU 本身（华尔街见闻 2026-08-05）","SpaceX 已向 FCC 申请在约500至2000公里轨道部署最多100万颗轨道数据中心卫星；目前地球轨道现役卫星约1.5万颗；FCC 已批准初步申请，尚未就更大规模部署作出最终决定（interestingengineering 2026-08）","Starmind AI1 原型测试计划于2027年初进行，若开发按计划推进，当年晚些时候开始量产（interestingengineering 2026-08）","待核实：英伟达称 Space-1 Vera Rubin 模块 AI 处理性能最高可达 H100 的25倍，为厂商自述口径，未见第三方实测"],"scripts":[{"angle":"干货直给","text":"数据中心真要上天了，不是概念。八月四号 SpaceX 宣布和英伟达联合开发 Starmind AI1 卫星的计算载荷，每颗卫星装英伟达的 Rubin 显卡和 Vera 处理器。参数摆出来你就有概念了：卫星完全展开高约三十米，翼展约七十五米，计算载荷峰值功率二百五十千瓦，平均一百七十五千瓦，还配了一套约一百六十平方米的可展开液冷散热器。算完的数据靠高带宽激光链路传回星链网络。为什么要上天？两个原因，太空里太阳能好拿，散热条件也好。马斯克在业绩电话会上说，地球上越来越难拿到足够的电，把算力送上轨道是目前最快的扩张方式。他给的目标是年底在线算力超两吉瓦，明年底接近十吉瓦。原型测试计划二零二七年初做。"},{"angle":"反常识开场","text":"限制 AI 发展的不是芯片，是电和散热。SpaceX 这次的动作把这件事挑明了。八月四号它和英伟达宣布联合开发 Starmind AI1 卫星的计算载荷，说白了就是把一个小型数据中心送上近地轨道。马斯克的原话是，地球上越来越难获得充足电力，把算力部署到卫星是目前最快的扩张方式。太空里有两样东西几乎是白给的：太阳同步轨道上稳定的太阳能，还有天然的低温散热环境。所以这颗卫星一百六十平方米的散热器和七十五米的翼展，不是炫技，是刚需。规模上更夸张，SpaceX 已经向美国联邦通信委员会申请，在五百到两千公里轨道部署最多一百万颗轨道数据中心卫星。现在地球轨道上现役卫星总共大概一万五千颗。这个对比本身就说明了缺口有多大。"},{"angle":"成本账","text":"算力这场仗，比的已经不是谁买得起卡，是谁供得上电。看几个数。SpaceX 说年底在线算力超过两吉瓦，明年底接近十吉瓦，马斯克还说希望明年底累计到二十吉瓦。两吉瓦是什么概念，差不多是一座大型核电站的输出量级。这么多电从哪来，地面上抢不到，就去太空拿。Starmind AI1 单颗卫星的计算载荷峰值功率二百五十千瓦，平均一百七十五千瓦，靠太阳同步轨道上稳定的日照供电，靠一百六十平方米的液冷散热器散热，这两样在地球上都要真金白银去买。马斯克还说了一句关键的：现在资源投入的重点是电力和冷却设备，不是显卡本身。这句话值得所有做 AI 的人记住，瓶颈已经从芯片转移到基础设施了。"}]},{"id":"ai5","title":"把退改条款丢给AI，让它告诉你哪一条会坑你","hook":"同一家航司不同舱位的退改比例能有几十种，你自己看要看半天。","why":"把当天的机票新规和住宿条款变成一个可复用的AI用法，玩法类内容里最缺的就是这种有具体场景、能立刻验证效果的。跨赛道联动，两边观众都能用。","heat":"中","tags":["AI玩法","提示词","退改条款","实操","省钱"],"facts":["东航新规把国内客票退改分为五档：14天之前、前7天—14天、前48小时—7天、4小时—48小时、前4小时至起飞后，档位越靠近起飞费用越高（南方+ 2026-08-08）","当前民航无统一退票扣费率，核心原则是阶梯费率，各航司在报备后拥有自主定价权；按舱位等级、起飞前时间节点划分后，退改手续费收费比例可多达几十种（腾讯网转大众新闻 2026-08-08）","国航规定部分舱位等级客票可在航班起飞前7天免费退，其他舱位等级均需收取5%到20%的手续费，南航等规定亦相似（腾讯网转大众新闻 2026-08-08）","国内多家航司提供购票后2小时内免费或优惠退票机制，国航要求国内客票需在出票后2小时（含）内且距首个航班起飞4小时（含）以上，山东航空亦有类似规定（腾讯网转大众新闻 2026-08-08）","消协提示：住宿下单前应核对总价、退改规则、清洁费、节假日加价等全部收费项目，重点留意不可取消、到店补差等格式条款（四川消委转十二地消协联合提示 2026-08-04）","2026年6月2日民航局实施新版《公共航空运输旅客服务管理规定》，国内航线统一执行标准化阶梯退改规则，设置起飞前7天以上、48小时至7天等四档费率（消费日报转21世纪经济报道 2026-08-07）","2026年7月1日新版《中华人民共和国民用航空法》施行，要求航司运输总条件需包含清晰的退改规则并显著告知旅客（消费日报转21世纪经济报道 2026-08-07）","待核实：第三方平台代理销售的同一航班客票，退改规则可能与航司官网口径存在差异，须以实际出票渠道页面为准；AI 输出仅供快速预览，涉及金额的条款仍需回到原文核对"],"scripts":[{"angle":"实操流程","text":"教你一个立刻能用的 AI 用法：让它帮你读退改条款。这东西没人愿意看，但坑全在里面。举个例子，东航新规把国内票分成五档：十四天之前、七到十四天、四十八小时到七天、四到四十八小时、四小时到起飞后。同一家航司不同舱位的退改比例能有几十种。国航是部分舱位七天前免费退，其他舱位收百分之五到二十。你自己对着看要看半天。做法是这样：把订单页和退改规则页全部截图，连同你的出行日期一起丢给 AI，然后问三个问题。第一，我现在退要扣多少，改签要补多少。第二，最晚哪一天退是免费的，给我具体日期。第三，这份条款里有哪些对我不利的地方。第三个问题最有用，格式条款里的到店补差、不可取消这类词，AI 一眼就能挑出来。"},{"angle":"反常识开场","text":"你订票时看不懂的那堆规则，本来就不是写给你看的。民航到现在都没有统一的退票扣费率，各家航司报备之后自己定，按舱位等级和时间节点拆下来，收费标准能有几十种。住宿那边同样，清洁费、节假日加价、到店补差、不可取消，全写在你不会展开的那一栏里。这种信息不对称，以前只能认，现在有解法了：把条款原文和你的具体行程一起交给 AI，让它替你翻译。关键在于问法要具体。别问这个条款怎么样，要问，按我八月二十号的行程，我最晚哪天退不扣钱。别问有没有坑，要问，这份条款里哪几条在我改行程的时候会让我多花钱，逐条列出来。今年六月民航局新规已经统一了国内航线的阶梯退改框架，七月新民航法也要求航司显著告知退改规则，条款在变透明，但看懂它仍然是你自己的事。"},{"angle":"横向对比","text":"同一段行程，机票和民宿的退改逻辑完全不一样，混着用就要吃亏。机票这边是时间阶梯。东航新规分五档，十四天之前全免费，越靠近起飞越贵。国航是部分舱位七天前免费，其他收百分之五到二十。核心变量是距离起飞还有多久，跟你花了多少钱关系不大。民宿那边是房型阶梯。同一套房，限时免费取消的贵一点，不可取消的便宜一截，你选了后者，行程一变就是全款没了。核心变量是你下单时勾了哪个房型。所以规划一趟行程的时候，顺序应该是先定不可退的那一头。机票的十四天线是硬的，民宿的房型是你能选的。行程有变数，就把民宿选成可取消，用多花的那几十块，换掉整晚房费的风险。"}]}]}]},"2026-08-07":{"date":"2026-08-07","updatedAt":"2026-08-07 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"一万八的国际机票，退回来四百二","hook":"国际机票最贵的不是票价，是你没点开看的那行退改规则。","why":"强共鸣避坑选题，两周内第二起同类事件，正在全网发酵。国际机票基础运价的规则多数人从没搞懂过，一条视频能救下真金白银，收藏和转发都很高。","heat":"高","tags":["避坑","强时效","省钱"],"facts":["河北邯郸葛先生今年6月6日在某购票平台买了三张6月20日北京飞沙特利雅得的机票，承运人卡塔尔航空，共支付9431元；到大兴机场后被告知签证有问题无法登机，退票后仅收到420元（潇湘晨报·晨视频，2026-08-06；新浪新闻、大河报转载，2026-08-06至08-07）","卡塔尔航空中国客服8月6日回应：该三人6月20日属于误机，退票手续费更高，按规定每人应扣515美元（约合人民币3480元）；因票款不够抵扣退票费用，只能退还部分政府税金，最终每人扣了2690元手续费（潇湘晨报，2026-08-06）","当事人当天又购买了6月24日阿提哈德航空的机票，两次购票共花费约1.8万元；阿提哈德中国客服称其购买的经济舱机票仅为基础运价即最低运价，退票无法全额退款，只能退还一部分税费（潇湘晨报，2026-08-06）","涉事平台称已向用户退还420元保险费用，与航司协商后航司同意每人再退344元；鉴于用户损失较大，平台表示可额外补偿1000元（潇湘晨报，2026-08-06）","国际航协IATA通行的运价体系中，极低折扣舱位往往对应一售概不退换、仅退代收税费的硬性条款（媒体法律分析，2026-08-07，属评论观点，待核实）","7月底曾有1.5万元国际机票退票仅退432元的案例引发关注，舆论发酵后平台上线了低退票率弹窗预警（媒体评论文章，2026-08-07，单一来源，待核实）"],"scripts":[{"angle":"干货直给","text":"买国际机票，最贵的往往不是票价，是退票费。河北一位葛先生，六月六号买了三张北京飞沙特利雅得的票，卡塔尔航空，一共九千四百三十一块。到了大兴机场，签证有问题登不了机，平台说改签不了只能退，最后到手四百二十块。航司八月六号回应了，说人到了但没走成，这算误机，误机退票的手续费更高，按规定每人扣五百一十五美元，折合三千四百八十块。他们三个人的票款加起来还不够抵这笔手续费，所以只能退政府税金。他当天又买了一张阿提哈德的，两趟合计一万八，同样退不出来。问题都出在四个字：基础运价。这是国际票里最低的那一档，对应条款通常就是不可退改，只退代收税费。所以订国际票之前，先点开退改规则那一栏看完再下单。便宜三百块的票，退的时候可能差一万。"},{"angle":"故事切入","text":"三个人凑钱出国打工，到了机场，走不了了。六月二十号，北京大兴，值机柜台告诉他们签证有问题，今天上不了这架飞机。票是六月六号买的，卡塔尔航空飞利雅得，三张九千四百三十一块。打电话给平台，答复是改签不了，只能退。退款到账那天，四百二十块。当事人自己说，那天脑子一热，又买了六月二十四号阿提哈德的票。后来发现签证一时半会解决不了，二十一号申请退，快两个月过去，还是没退回来。两趟加一块一万八。航司的解释挺清楚：人到了机场没登机，按误机算，每人手续费五百一十五美元；第二趟买的是基础运价，只退税费。平台后来说，退了四百二保险费，航司同意每人再退三百四十四，另外补偿一千。故事的教训只有一条：签证没百分之百落地之前，别买不可退的票。"},{"angle":"反常识开场","text":"你以为机票退不了是因为临近起飞，其实跟时间没多大关系，是你买的那档舱位本来就不打算让你退。国际机票的价格不是一个数，是一整套舱位等级。同一趟航班，最低那档叫基础运价，条款里通常写着不可退改，只退代收税费。代收税费是什么？是机场建设费、航空公司代政府收的那部分，往往只占票价的零头。所以才会出现一万八退四百二这种事。八月六号卡塔尔航空的回应更直接：当事人属于误机，每人手续费五百一十五美元，票款不够抵扣，那就只退税。不是航司黑，是这套规则全球通行，写在你打勾同意的那一页里。真正该改的习惯是：比价的时候多看一栏。同一航班贵三百块的可退舱位，本质上是一份保险。行程有任何不确定，这三百块就是最划算的支出。"}]},{"id":"tv2","title":"五台山的票能用两天了，壶口两省一张票通用","hook":"同样的钱，现在能多玩一天——多个景区悄悄改了门票有效期。","why":"8月5日央视新闻集中报道，规则改动直接影响行程安排，实用性强。多数游客还按老规矩一天赶完，讲清楚就能帮人省一趟门票钱，适合做行程规划类内容。","heat":"中高","tags":["行程规划","新规","省钱"],"facts":["山西五台山景区7月31日发布门票规则调整，自2026年8月1日起门票有效期从当日当次使用有效调整为当日及次日内使用有效，有效期内游客可重复入山、不限次数（央视新闻，2026-08-05；央广网、新浪财经转载，2026-08-05）","地跨陕西山西两省的壶口瀑布景区首次推出晋陕通票，已于2026年6月1日起正式实施；打破以往两省分设票价、单独购票的模式，游客在任意一侧购票即可凭票在两天内跨省游览两岸全域景观（央视新闻，2026-08-05）","福建福州闽清宏琳厝景区自2026年8月2日至2027年8月1日免门票一年；日常时段可通过官方小程序实名预约或凭本人身份证原件刷证入园，国家法定节假日执行全员预约、约满即止（闽清县文化旅游投资有限公司公告，2026-08-01）","今年以来全国不少地方文旅部门和景区在门票管理、收费管理上进行优化升级，调整涉及自驾收费、游览期限、跨区域通票等多个方面（央视新闻，2026-08-05）","中国旅游研究院院长戴斌表示，景区运营成本和价格制定过程应该透明，如果景区具有垄断性质价格应当受到合理控制，地方政府不能把景区当成提款机（央视新闻，2026-08-05）"],"scripts":[{"angle":"干货直给","text":"几个景区改了门票规则，直接影响你怎么排行程。第一个，五台山。七月三十一号发的公告，八月一号开始，门票有效期从当日当次改成当日和次日都有效，这两天里可以反复进山，不限次数。以前是出来就作废，现在等于一张票管两天。台怀镇住一晚，第二天接着逛，不用再买第二张。第二个，壶口瀑布。这个景区横跨陕西和山西，以前两省各卖各的票，想看两岸得买两次。今年六月一号起有了晋陕通票，随便哪一侧买票，两天之内可以跨省看两岸全部景观。第三个，福州闽清的宏琳厝，八月二号起免门票一整年，到明年八月一号。平时可以小程序预约，也可以直接刷身份证进；法定节假日必须提前预约，约满就停。这三条都是官方公告，出发前按新规则重排一下时间。"},{"angle":"行程规划","text":"五台山的行程可以重排了。八月一号起，门票有效期变成当日加次日，两天内不限次数进出。按老规矩，很多人是一天冲完五个台顶，累到怀疑人生，还漏一半。现在的排法应该是这样：第一天下午到台怀镇，先把显通寺、塔院寺、菩萨顶这几个核心的走完，晚上住山里。第二天一早上黛螺顶，运气好能赶上云海，再去殊像寺。同一张票，两天，节奏完全不一样。壶口瀑布同理，六月一号起晋陕通票落地，一张票两天内看两岸。以前很多人只看山西侧，觉得陕西侧还要再买一次不值。现在两侧都能去，光线不一样，出片角度也不一样，上午在一侧下午在另一侧最合适。规则改了，攻略也得跟着改，别拿去年的路线套今年的票。"},{"angle":"反常识开场","text":"景区涨价的新闻你看多了，这次反过来，一批景区在悄悄让利，而且是改规则那种真让利。五台山从八月一号起，门票有效期从一天变成两天，中间可以随便进出。这条比降价二十块实在得多，因为它省下的是第二张全票。壶口瀑布六月一号起搞了晋陕通票，陕西山西两侧不再分开卖，一票两天通用。福州闽清的宏琳厝更直接，八月二号开始免票一整年。背后的逻辑其实很清楚，中国旅游研究院院长戴斌八月五号说得挺明白：游客在意的不只是价格高不高，还有收得合不合理；有垄断性质的景区，价格要受合理控制，地方政府别把景区当提款机。门票松绑，客流才愿意留下来过夜、吃饭、住店。真正赚钱的从来不是那张票。"}]},{"id":"tv3","title":"稻城亚丁免票三个月，甘孜318块玩14个景区","hook":"被文旅部点名批评之后，稻城亚丁把门票免了，一免三个月。","why":"省钱幅度极大且有明确时间窗口，8月1日到10月31日正好覆盖暑期尾巴和国庆。甘孜终身畅游卡三折的账算出来很有冲击力，适合做数字对比型内容。","heat":"高","tags":["省钱","强时效","西南线"],"facts":["稻城亚丁景区此前因摆渡车收费不合理、游览路线设置不科学等问题被文化和旅游部批评；7月推出一系列优化整改措施，包括降低交通服务费、对社会车辆实施限流预约通行等（央视新闻，2026-08-05；央广网、腾讯新闻转载，2026-08-05至08-06）","2026年8月1日至10月31日，稻城亚丁景区面向全国游客免收景区门票；未来每年应届中高考考生也将免门票（央视新闻，2026-08-05）","四川甘孜州于2026年1月28日发布景区终身门票政策，分两类：单个景区终身畅游卡，按景区实际票价购一次票即可终身畅游该景区；包含14个收费景区的终身畅游卡，定价分别为318元和317元（央视新闻，2026-08-05）","若把第二类卡中包含的14个景区全部游览完，门票合计需支付1091元，三百多元的终身畅游卡相当于三折（央视新闻，2026-08-05）","甘孜州相关部门估计2026年全年到访游客可达5000万人次（央视新闻，2026-08-05，为地方部门预估数据，待核实）","免收的是景区门票，摆渡车等交通服务费用属于另行收取项目，整改中提到的是降低交通服务费而非取消（据央视新闻2026-08-05表述推断，具体现行收费标准需以景区官方公告为准，待核实）"],"scripts":[{"angle":"干货直给","text":"稻城亚丁免门票了，八月一号到十月三十一号，面向全国游客，三个月。起因是这个景区之前被文化和旅游部批评过，问题是摆渡车收费不合理、游览路线设置不科学。七月开始整改，降低交通服务费，社会车辆限流预约通行，然后就是这三个月免票。要说清楚一点：免的是景区门票，摆渡车这类交通服务费是单独算的，整改说法是降低，不是取消，出发前查一下景区当天的公告。另外同在甘孜州，还有一个终身畅游卡，今年一月二十八号发布的。一种是单景区的，买一次票终身进；另一种包含十四个收费景区，定价三百一十八和三百一十七。这十四个景区门票加起来是一千零九十一块，三百多买断，等于三折。八月到十月这个窗口，正好卡在暑期尾巴和国庆之间。"},{"angle":"成本账","text":"算一笔甘孜的账。第一笔，稻城亚丁，八月一号到十月三十一号免门票，全国游客都算。第二笔，甘孜州的十四景区终身畅游卡，三百一十八块。这十四个景区如果一个个买票，合计一千零九十一块。也就是说，三百多块钱买断，一次玩完就已经省下七百七十多，而且这张卡是终身的，明年后年再去还能用。把两笔叠起来看：一趟川西大环线，稻城亚丁这一站门票直接归零，其余站点走终身卡，门票这一项基本可以从预算表里划掉。剩下的成本就是油钱、住宿和摆渡车。注意摆渡车不在免票范围里，整改的说法是降低交通服务费，不是不收。所以真正的账应该这么列：门票省下的钱，够你在山里多住两晚。这笔账对国庆自驾的人最实在。"},{"angle":"反常识开场","text":"一个景区被主管部门公开批评，通常意味着要涨价整改，稻城亚丁反着来，直接把门票免了三个月。被批的点很具体：摆渡车收费不合理，游览路线设置不科学。整改动作也很具体：降低交通服务费，社会车辆限流预约通行，然后八月一号到十月三十一号全国游客免收门票，以后每年的应届中高考考生也免。这套操作值得看的地方在于，它承认了一件事——景区的钱不该主要从门票上收。同一个甘孜州，一月底就出过终身畅游卡，十四个景区打包三百一十八，而这些景区门票原价合计一千零九十一。三折卖断终身，图的是人来。人来了才有住宿、餐饮、向导、租车。所以下次看到某个景区免票，别急着怀疑有坑，先查清楚免的是哪一项、什么时间窗口，然后订票。"}]},{"id":"tv4","title":"别赶八月底，九月的机票和酒店是一起降的","hook":"八月二十七号前后票价会反弹一次，真正的低价在九月。","why":"决策类内容，直接影响下单时机，受众极广。八月底反弹这个点是反直觉的，多数人以为暑期一结束就便宜，讲清楚开学返校客流这个变量很有说服力。","heat":"中高","tags":["省钱","错峰","购票时机"],"facts":["多个出行平台数据显示，进入9月暑运旺季落幕后部分航线机票价格大幅下降，例如泰州飞贵阳、大连、厦门等地9月降幅超过60%甚至70%（泰州微视听引携程、飞猪平台数据，2026-08-04）","上海飞往贵阳、太原、长春等地未来一两个月最大降幅达到80%；上海去哈尔滨、厦门、泉州等地最低价200元起（泰州微视听引携程APP数据，2026-08-04）","8月底至9月初是多地高校开学季，返校学生客流与错峰出游客流叠加，形成短期脉冲式上涨；业内预判8月27日虽接近暑运尾声，经济舱票价仍会回升至中高位（新浪旅游，2026-08-01）","9月位于暑期与国庆黄金周之间，家庭出游需求明显回落、商务客流尚未全面恢复，市场出现需求真空期，机票与酒店价格同步走低（新浪旅游引大连日报报道，2026-08-01）","8月5日起国内航线机票燃油附加费再次下调，为今年6月以来第三次下调，进一步降低旅客出行成本（央广网，2026-08-06）","有攻略类文章称8月23日至9月初是暑运性价比最高的捡漏窗口，周二周三票价普遍最低（自媒体攻略文章，2026-07-29，非权威来源，待核实）"],"scripts":[{"angle":"干货直给","text":"想省机票钱，记住两个时间点。第一个，八月二十七号前后别走。很多人以为暑假一结束票就便宜，实际反过来。八月底到九月初是全国高校开学季，返校的学生客流和错峰出游的人撞在一起，需求短期反弹，航司会把低价舱位收回去。业内八月一号的判断是，那几天经济舱票价会回升到中高位。第二个，九月才是真便宜。九月夹在暑期和国庆中间，家庭出游需求落下来了，商务客流还没完全恢复，属于需求真空期。八月四号平台数据里，泰州飞贵阳、大连、厦门这些线九月降幅超过六成甚至七成；上海飞贵阳、太原、长春最大降幅到八成，上海到哈尔滨、厦门、泉州最低两百块起。而且九月是机票和酒店一起降，不是只降一头。加上八月五号燃油附加费又下调了一轮，九月出门这笔账很划算。"},{"angle":"横向对比","text":"同一条航线，八月走和九月走差多少，直接看数据。八月四号平台上的降幅榜，泰州飞贵阳、大连、厦门，九月比暑期高峰低六成到七成。上海出发更狠，飞贵阳、太原、长春最大降幅到八成，飞哈尔滨、厦门、泉州最低两百块起。泰州飞福州最低不含税两百块，比坐高铁还便宜。这是机票一侧。酒店一侧，大连当地的报道说九月酒店价格比暑期旺季大幅下降，跟机票是同步的。所以九月出行是双降，机酒两头都省。中间有个坑要避开：八月二十七号前后不是低点。那时候高校陆续开学，返校客流托底，票价会往上顶一次。真要错峰，就把行程排到九月中旬以后、国庆前一周之前，这段是全年容错率最高的窗口。"},{"angle":"反常识开场","text":"暑假结束机票就跌，这个想法每年都让一批人多花钱。真实的曲线是先反弹再下跌。八月中下旬确实有一波尾单，但到了八月二十七号前后，全国高校陆续开学，返校学生客流集中释放，加上错峰出游的人，需求又被顶起来一次。航司这时候优先保客座率和收益，低价折扣舱位反而收缩。业内八月一号的预判就是那几天票价回到中高位，不会延续七月的低水平。真正的低点在九月。这个月没有大节，没有学生潮，家庭出游落幕，商务出行还没完全恢复，是一年里少有的需求真空。八月四号的平台数据能看出来，多条航线九月降幅六到八成，上海出发不少线两百块起。所以别盯着暑假最后一周，把假期挪到九月中旬，同样的钱能多住两晚好酒店。"}]},{"id":"tv5","title":"中秋国庆的出境长线，八月初就已经开抢了","hook":"国庆还有两个月，澳新和欧洲的长线产品预订已经涨了六成。","why":"预订前置是今年最确定的趋势，讲清楚就能帮人抢在涨价前下手。目的地结构的变化也有信息增量，澳新反超传统东南亚这个点很多人还不知道。","heat":"中高","tags":["出境游","国庆","预订时机"],"facts":["同程旅行平台8月4日数据显示，7月31日至8月4日中秋国庆期间出发的机票搜索热度较前5日环比翻倍，度假产品出境游预订热度环比增长60%（同程旅行数据经南京晨报报道，2026-08-07）","从度假产品预订看，澳大利亚、新西兰与欧洲长线热度攀升最为显著；法国、瑞士、意大利、英国、西班牙等欧洲线路因文化内涵与秋季限定景观成为热门（同程旅行数据经南京晨报报道，2026-08-07）","俄罗斯、巴西、马尔代夫、乌兹别克斯坦等免签与签证便利目的地热度持续上涨；韩国、新加坡、马来西亚、泰国等周边国家凭短途便捷与高性价比预订热度走高（同程旅行数据经南京晨报报道，2026-08-07）","截至8月4日，8月跨境机票预订热度较7月增长超过12%，暑期旺季后移趋势正向中秋国庆衔接（同程旅行数据经南京晨报报道，2026-08-07）","国内方面新疆、西藏、甘肃、云南、海南等长线目的地热度靠前，西藏的包车加向导深度游模式持续走红（同程旅行数据经南京晨报报道，2026-08-07）","同程研究院表示，2026年中秋国庆双节叠加形成的超长出行窗口正在重塑跨境
