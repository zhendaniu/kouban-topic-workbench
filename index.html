<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="选题台">
<meta name="theme-color" content="#1e293b">
<title>每日选题 · 口播稿工作台</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#16191d; --text2:#666e7a; --text3:#98a1ad;
  --line:#e6e8ec; --line2:#f0f1f4;
  --primary:#2563eb; --primary-d:#1d4ed8;
  --travel:#0d9488; --travel-bg:#e7f6f4;
  --ai:#7c3aed; --ai-bg:#f1eafe;
  --danger:#dc2626; --danger-bg:#fdecec;
  --ok:#16a34a; --ok-bg:#e8f6ec;
  --warn:#d97706; --warn-bg:#fdf3e3;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
a{color:var(--primary);text-decoration:none}

/* ---------- layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.hd{background:#1e293b;color:#fff;padding:14px 0 16px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.045)}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hd-title{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd-sub{font-size:12.5px;color:#a8b4c6;margin-top:3px}
.hd-acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:rgba(255,255,255,.11);color:#e7edf5;border-radius:9px;padding:8px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:38px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn svg{width:14px;height:14px;flex:none}

.tipbar{background:var(--warn-bg);color:#8a5a08;font-size:13px;padding:9px 14px;display:none;align-items:center;gap:8px;border-bottom:1px solid #f2e3c6}
.tipbar.on{display:flex}
.tipbar button{margin-left:auto;font-weight:700;color:#8a5a08;padding:4px 8px;font-size:12.5px}

/* ---------- section / card ---------- */
.sec{margin-top:16px}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-hd h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.2px}
.sec-hd .cnt{font-size:12px;color:var(--text3);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ---------- today ---------- */
.today{background:linear-gradient(180deg,#fff 0,#fcfdff 100%);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.today-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.today-h .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:none;animation:bp 1.8s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
.today-h h2{font-size:15.5px;margin:0;font-weight:700}
.today-h .n{margin-left:auto;font-size:12px;color:var(--text2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#f7f8fa;border-radius:10px;padding:9px 8px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--text2)}
.stat.od b{color:var(--danger)}
.stat.dn b{color:var(--ok)}
.tlist{display:flex;flex-direction:column;gap:7px}
.titem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:#f7f8fa;font-size:13.5px}
.titem.od{background:var(--danger-bg)}
.titem .bd{flex:1;min-width:0}
.titem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem .m{font-size:11.5px;color:var(--text2);margin-top:1px}
.titem.od .m{color:#b03636}
.titem .go{flex:none;background:var(--text);color:#fff;border-radius:8px;padding:0 12px;height:34px;font-size:12.5px;font-weight:600}
.titem.od .go{background:var(--danger)}
.empty{text-align:center;padding:22px 12px;color:var(--text3);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.3;display:block;margin:0 auto 8px}

/* ---------- track tabs ---------- */
.ttabs{display:flex;gap:8px;margin-bottom:12px}
.ttab{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 8px;text-align:center;font-weight:700;font-size:13.5px;color:var(--text2);min-height:46px;transition:.15s}
.ttab .s{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:1px}
.ttab[data-k="travel"].on{background:var(--travel-bg);border-color:var(--travel);color:#0b6b62}
.ttab[data-k="ai"].on{background:var(--ai-bg);border-color:var(--ai);color:#6127c4}
.ttab[data-k="all"].on{background:#e8eefc;border-color:var(--primary);color:var(--primary-d)}
.ttab.on .s{color:inherit;opacity:.75}

/* ---------- topic ---------- */
.topic{margin-bottom:12px;overflow:hidden}
.tp-hd{padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.tp-idx{flex:none;width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
.tk-travel .tp-idx{background:var(--travel)}
.tk-ai .tp-idx{background:var(--ai)}
.tp-main{flex:1;min-width:0}
.tp-t{font-size:15.5px;font-weight:700;line-height:1.42;letter-spacing:.1px}
.tp-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;padding:2.5px 7px;border-radius:6px;background:#f0f1f4;color:var(--text2);font-weight:600}
.tk-travel .tag.hot{background:var(--travel-bg);color:#0b6b62}
.tk-ai .tag.hot{background:var(--ai-bg);color:#6127c4}
.tag.hot{font-weight:700}
.tp-why{margin-top:9px;font-size:13px;color:var(--text2);background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.55}
.tp-why b{color:var(--text);font-weight:700}
.fold{border-top:1px solid var(--line2)}
.fold-b{width:100%;text-align:left;padding:11px 14px;font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;min-height:44px}
.fold-b svg{width:13px;height:13px;transition:.2s}
.fold-b.open svg{transform:rotate(90deg)}
.fold-c{display:none;padding:0 14px 13px}
.fold-c.open{display:block}
.facts{margin:0;padding-left:17px}
.facts li{font-size:12.8px;color:var(--text2);line-height:1.62;margin-bottom:5px}

/* ---------- script ---------- */
.scripts{border-top:1px solid var(--line2);padding:11px 14px 13px;background:#fbfcfd}
.sc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.sc:last-child{margin-bottom:0}
.sc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc-a{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:#eef2f7;color:#41546b}
.sc-m{font-size:11.5px;color:var(--text3);font-variant-numeric:tabular-nums}
.sc-st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.st-new{background:#f0f1f4;color:var(--text2)}
.st-pick{background:var(--warn-bg);color:#a15c06}
.st-shot{background:#e8eefc;color:var(--primary-d)}
.st-pub{background:var(--ok-bg);color:#15803d}
.sc-tx{font-size:14px;line-height:1.78;color:#252a31;max-height:78px;overflow:hidden;position:relative;transition:max-height .25s;cursor:pointer}
.sc-tx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.sc-tx.open{max-height:2000px}
.sc-tx.open::after{display:none}
.sc-acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.sbtn{border:1px solid var(--line);border-radius:9px;padding:0 11px;height:38px;font-size:12.5px;font-weight:600;color:var(--text2);display:inline-flex;align-items:center;gap:5px;background:#fff}
.sbtn svg{width:13px;height:13px}
.sbtn:hover{background:#f7f8fa}
.sbtn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.sbtn.pri:hover{background:#2b3138}
.sbtn.act{background:var(--ok-bg);border-color:#bfe3c9;color:#15803d}
.sbtn.od{background:var(--danger-bg);border-color:#f3cfcf;color:var(--danger)}

/* ---------- refs ---------- */
.form{padding:13px 14px;display:flex;flex-direction:column;gap:9px}
.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);min-height:46px}
.form textarea{min-height:74px;resize:vertical;line-height:1.6}
.frow{display:flex;gap:9px}
.frow>*{flex:1;min-width:0}
.stars{display:flex;gap:3px;align-items:center}
.star{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.star svg{width:21px;height:21px}
.star svg path{fill:#dfe3e8}
.star.on svg path{fill:#f5a623}
.ref{padding:12px 14px;border-bottom:1px solid var(--line2)}
.ref:last-child{border-bottom:none}
.ref-h{display:flex;align-items:flex-start;gap:9px}
.ref-t{font-weight:700;font-size:14.5px;flex:1;min-width:0;line-height:1.45}
.ref-m{font-size:12px;color:var(--text3);margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ref-n{font-size:13px;color:var(--text2);margin-top:7px;background:#f7f8fa;border-radius:9px;padding:8px 10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ref-l{font-size:12.5px;margin-top:6px;word-break:break-all;display:inline-block}
.xbtn{flex:none;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.xbtn:hover{background:var(--danger-bg);color:var(--danger)}
.xbtn svg{width:15px;height:15px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:60}
.nav button{flex:1;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--text3);min-height:56px}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--primary)}
.nav .bdg{position:absolute;top:5px;margin-left:22px;background:var(--danger);color:#fff;font-size:9.5px;line-height:1;padding:3px 5px;border-radius:8px;font-weight:700}

/* ---------- teleprompter ---------- */
.tele{position:fixed;inset:0;background:#0e1116;color:#f2f4f7;z-index:200;display:none;flex-direction:column}
.tele.on{display:flex}
.tele-hd{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid #232a33;flex:none}
.tele-hd .tt{font-size:13px;color:#8e9aa8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{background:#1c222b;color:#cfd7e0;border-radius:8px;min-width:40px;height:38px;padding:0 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbtn svg{width:15px;height:15px}
.tele-bd{flex:1;overflow-y:auto;padding:24px 20px 90px;-webkit-overflow-scrolling:touch}
.tele-tx{font-size:26px;line-height:2.05;letter-spacing:.6px;max-width:820px;margin:0 auto;white-space:pre-wrap}
.tele-ft{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,17,22,0),#0e1116 32%);display:flex;gap:8px;align-items:center;justify-content:center}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(12,16,22,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px;box-shadow:0 18px 44px rgba(0,0,0,.22)}
.modal h3{margin:0 0 8px;font-size:16.5px}
.modal p{margin:0 0 16px;color:var(--text2);font-size:13.5px;line-height:1.65}
.modal-a{display:flex;gap:9px}
.modal-a button{flex:1;height:46px;border-radius:11px;font-weight:700;font-size:14px}
.mb-c{background:#f0f1f4;color:var(--text)}
.mb-d{background:var(--danger);color:#fff}

/* ---------- toast / misc ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px);bottom:calc(84px + env(safe-area-inset-bottom));background:#16191d;color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pane{display:none}
.pane.on{display:block}
.datesel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin-bottom:11px;flex-wrap:wrap}
.datesel select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;min-height:40px;font-size:14px;font-weight:600;color:var(--text)}
.badge-live{font-size:10.5px;background:var(--ok-bg);color:#15803d;padding:3px 7px;border-radius:6px;font-weight:700}
.badge-old{font-size:10.5px;background:var(--warn-bg);color:#a15c06;padding:3px 7px;border-radius:6px;font-weight:700}
.foot{text-align:center;color:var(--text3);font-size:11.5px;padding:22px 12px 8px;line-height:1.7}

@media(min-width:768px){
  body{padding-bottom:24px}
  .wrap{padding:0 22px}
  .hd{padding:18px 0 20px}
  .hd-title{font-size:19px}
  .nav{position:static;background:transparent;backdrop-filter:none;border-top:none;border-bottom:1px solid var(--line);max-width:1180px;margin:14px auto 0;padding:0 22px;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:7px;font-size:13.5px;padding:11px 15px;border-radius:10px 10px 0 0;min-height:46px}
  .nav button.on{background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}
  .nav .bdg{position:static;margin-left:2px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .topics-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .topics-grid .topic{margin-bottom:0}
  .tele-tx{font-size:31px}
}
@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hbtn span{display:none}
  .hbtn{padding:8px 10px}
}
</style>
</head>
<body>

<div class="hd">
  <div class="wrap hd-row">
    <div>
      <div class="hd-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5"/><path d="M12 22V12"/></svg>
        每日选题 · 口播稿台
      </div>
      <div class="hd-sub" id="hdSub">加载中…</div>
    </div>
    <div class="hd-acts">
      <button class="hbtn" onclick="doExport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg><span>导出备份</span></button>
      <button class="hbtn" onclick="document.getElementById('impFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg><span>导入恢复</span></button>
      <button class="hbtn" onclick="askClear()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><span>清空</span></button>
    </div>
  </div>
</div>
<input type="file" id="impFile" accept="application/json,.json" style="display:none" onchange="doImport(this)">

<div class="tipbar" id="tipbar">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:16px;height:16px;flex:none"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
  <span id="tipTx"></span>
  <button onclick="hideTip()">知道了</button>
</div>

<div class="nav" id="nav">
  <button class="on" data-p="today" onclick="go('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>今天要处理<span class="bdg" id="navBdg" style="display:none">0</span></button>
  <button data-p="topics" onclick="go('topics')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>选题池</button>
  <button data-p="scripts" onclick="go('scripts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>口播稿库</button>
  <button data-p="refs" onclick="go('refs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>对标灵感</button>
</div>

<div class="wrap">

  <!-- ============ 今天要处理 ============ -->
  <div class="pane on" id="p-today">
    <div class="sec">
      <div class="today">
        <div class="today-h">
          <span class="dot"></span><h2>今天要处理</h2>
          <span class="n" id="todayN"></span>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tlist" id="tlist"></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-hd"><h2>今日速览</h2><span class="cnt" id="ovCnt"></span></div>
      <div id="overview"></div>
    </div>
    <div class="foot" id="foot1"></div>
  </div>

  <!-- ============ 选题池 ============ -->
  <div class="pane" id="p-topics">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel" onchange="switchDate(this.value)"></select>
        <span id="dateBadge"></span>
      </div>
      <div class="ttabs" id="ttabs1"></div>
      <div id="topicList"></div>
    </div>
    <div class="foot" id="foot2"></div>
  </div>

  <!-- ============ 口播稿库 ============ -->
  <div class="pane" id="p-scripts">
    <div class="sec">
      <div class="datesel">
        <span>内容日期</span>
        <select id="dateSel2" onchange="switchDate(this.value)"></select>
        <span id="dateBadge2"></span>
      </div>
      <div class="ttabs" id="ttabs2"></div>
      <div class="ttabs" id="stfilter" style="margin-top:-4px"></div>
      <div id="scriptList"></div>
    </div>
    <div class="foot" id="foot3"></div>
  </div>

  <!-- ============ 对标灵感 ============ -->
  <div class="pane" id="p-refs">
    <div class="sec">
      <div class="sec-hd"><h2>加一条对标</h2></div>
      <div class="card">
        <div class="form">

<script id="packToday" type="application/json">{"date":"2026-11-09","updatedAt":"2026-11-09 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"新雪季提前开板，南方人\"追雪\"航线预订暴涨11倍","hook":"新雪季刚开板，深圳人飞阿勒泰的票预订量同比涨了11倍。","why":"数据硬、强时效，11月正是追雪决策窗口，收藏转发都高。","heat":"高","tags":["强时效","滑雪","南方人"],"facts":["2026—2027冰雪季较往年提前：新疆可可托海10月20日率先开板，河北崇礼万龙紧随试滑，11月1日亚布力试滑，云顶、庙香山、长白山多家雪场11月6日前后开板（中国新闻网2026-11-06引美团）","去哪儿11月4日数据：11月以来\"滑雪\"\"冰雪\"搜索量环比增1.2倍，多地雪场周边酒店预订环比增超5成（中国新闻网2026-11-04）","深圳直飞新疆阿勒泰机票预订量同比增11.1倍，增速居全国冰雪航线首位；珠海飞喀什增3.5倍、三亚飞喀什增2.9倍、武汉/福州飞阿勒泰近2倍（中国新闻网2026-11-04引去哪儿）","深圳飞张家口机票预订同比增40%，深圳跃升为崇礼第二大客源地（仅次于上海）（中国新闻网2026-11-04）","吉林12月推5天\"雪假\"、新疆阿勒泰12月中旬5天学生\"雪假\"，阿勒泰新雪季酒店预订同比增84%（中国新闻网2026-11-04）","美团10月以来\"滑雪\"搜索同比增125%，雪场周边5公里住宿预订同比增217%，南方城市占雪场订单约55%（去年同期44%）（中国新闻网2026-11-02引美团）"],"scripts":[{"angle":"干货直给","text":"新雪季比往年都来得早。新疆可可托海十月底就开板了，河北崇礼万龙跟着试滑，到十一月六号前后云顶、庙香山、长白山好几家雪场集中开板。去哪儿的数据，十一月以来滑雪和冰雪的搜索量环比涨了一点二倍，雪场周边酒店预订涨超五成。最夸张的是航线，深圳直飞阿勒泰的机票预订量同比涨了十一点一倍，全国冰雪航线第一；珠海飞喀什涨三点五倍，三亚飞喀什涨二点九倍。南方人这次是真把雪当刚需，深圳已经成了崇礼第二大客源地，仅次于上海。想追首滑的，现在看机票正合适，早订早锁价。所以看到合适的机票别犹豫，雪场开板后热门日期价格会肉眼可见地往上走，早订才能锁住这一波低价。"},{"angle":"数据向","text":"给几个数字感受一下这波追雪热。美团数据，十月以来滑雪搜索同比涨百分之一百二十五，雪场周边五公里住宿预订涨百分之二百一十七。去哪儿数据，深圳直飞阿勒泰机票预订同比涨十一点一倍，是全国冰雪航线里增速最高的；珠海飞喀什涨三点五倍，武汉和福州飞阿勒泰也接近两倍。客源结构也变了，雪场订单里南方城市占百分之五十五，去年同期才百分之四十四。吉林十二月放五天雪假，阿勒泰十二月也有五天学生雪假，新雪季酒店预订已经同比涨了百分之八十四。这已经不是小众运动，是全民级消费。这股追雪热度会贯穿整个雪季，现在正是信息差最值钱的时候，谁先整理清楚航线谁先吃流量。"},{"angle":"反常识开场","text":"都说南方没雪，可今年拖着雪具上飞机的，大半是南方人。去哪儿数据，深圳直飞阿勒泰的机票预订量同比涨了十一点一倍，增速全国第一；崇礼的客源地里深圳排第二，只输上海。美团更直接的数字，雪场周边订单里南方城市占了百分之五十五，去年这时候才百分之四十四。为什么？室内雪场把滑雪变成全年可练的日常，广州花都融创雪世界是全球数一数二的室内场，很多人先在商场练手，再直飞北疆。再加上直飞航线把阿勒泰拉进周末可达范围，追雪就从新鲜事变成了固定行程。所以别再觉得南方人不爱雪，他们只是把北疆雪场塞进了自己的周末行程，追雪早就成了固定节目。"}]},{"id":"tv2","title":"11月机票价格洼地：冬春航季切换后的白菜价航线","hook":"成都飞昆明丽江两百块，比高铁二等座还便宜。","why":"价格具体到数字，截图感强，适合低成本口播。11月是全年最安静的购票窗口。","heat":"中高","tags":["省钱","国内游","可复用"],"facts":["2026年冬春航季自10月25日切换，216家国内外航司每周11.6万班，新增288条国内航线（央视网/航班管家/红星新闻）","成都飞昆明、丽江约200元，飞拉萨、杭州、青岛约300元，京沪穗飞成都约400元（同上）","11月为传统机票淡季，商务出行减少、运力过剩，价格较国庆后进一步走低（行业共识）","错峰建议：周中出发、早班机、中转联程、多机场比价可再降15%-30%（航旅纵横/今日头条口径）","待核实：「部分航线含税低于高铁」需以实时票价为准，未写入口播稿正文"],"scripts":[{"angle":"干货直给","text":"十一月是全年机票最安静的月份。冬春航季十月二十五号切换，两百一十六家航司每周十一万多班，还新增了二百八十八条国内航线，运力一下子上来了。具体价格，成都飞昆明、丽江大概两百块，飞拉萨、杭州、青岛三百左右，北京上海广州飞成都四百上下。商务出行这会儿最少，飞机空着也得飞，价格自然往下走。想捡漏记住四招：周中出发比周末便宜，早班机最便宜，中转联程能再砍一截，多机场比价别只盯一个。这几条叠加，能比国庆后还低一两成。这个低价窗口很窄，进入十二月春运前就会迅速回弹，想捡漏的得在这个月把票定了。"},{"angle":"横向对比","text":"同样飞成都，十月和十一月完全两个价。国庆刚过那阵，旅游流还没散，价格虚高；进了十一月，商务客大幅减少，冬春航季又刚加了大量新航线，供需一下倒过来。成都飞昆明、丽江现在两百块出头，飞拉萨、杭州、青岛三百左右，而京沪穗飞成都也才四百上下。对比高铁，成都到昆明高铁二等座五百多，飞机反而更便宜。所以十一月的逻辑很简单：别等，看到合适的价就下，这个月是全年少有的买方市场，越往后临近春运越回弹。记住一个原则，淡季买票别等，看到合适价位就下手，越往后越接近春运价格只会往上走不会回头，这个月是全年少有的买方市场。"},{"angle":"实操流程","text":"十一月订机票，按这个顺序能省最多。第一步，先定周中出行，周二周三出发普遍比周五便宜一档。第二步，早班机和红眼航班最便宜，差价能有几百。第三步，打开中转联程，很多城市经停一次能省两三成，时间不紧就选它。第四步，别只搜一个机场，飞成都可以同时看天府和双流，飞上海看浦东虹桥，比价后差很多。第五步，设好降价提醒，航司会员日和大促叠加更狠。最后提醒，特价舱多不能退改，行程定死了再买，别贪便宜退不了。省下来的机票钱，够你在目的地多吃几顿地道小吃，同样的预算淡季出行体验反而更松弛更舒服。整体算下来，淡季出行省得最多，这笔账怎么算都划算。"}]},{"id":"tv3","title":"240小时过境免签扩至65口岸，海南单免61国","hook":"老外经中国转机，能从65个口岸免签进来待10天。","why":"权威来源（国家移民管理局/中国政府网），长效不过期，可做入境游系列。","heat":"中高","tags":["免签","入境游","收藏向"],"facts":["国家移民管理局8月20日公告：240小时过境免签适用国家增至57国，海南30天入境免签增至61国（中国政府网2026-08-20）","2025年11月20日起，新增广州琶洲客运港、横琴、港珠澳大桥、中山港、广深港高铁西九龙站5个毗邻港澳口岸为240h入境口岸，总数由60增至65（中国政府网2025-11-20）","适用240h过境免签可从北京、上海等65个口岸免签入境，在规定区域停留不超过240小时（10天）（中国政府网）","国务院11月政策：外国人入境卡可网上填报，内地居民换发出入境证件\"全程网办\"试点扩至50城（中国政府网2026-11汇总）","入境游升温：前三季度入境外国人同比增15.6%，离境退税办理增六成（经济日报2026-11-01）"],"scripts":[{"angle":"干货直给","text":"免签这事儿最近又扩了，得更新一下认知。国家移民管理局八月二十号公告，二百四十小时过境免签适用国家已经到五十七个，海南三十天入境免签到六十一个。更实用的是口岸，去年十一月二十号起新增了广州琶洲客运港、横琴、港珠澳大桥、中山港、广深港高铁西九龙站五个毗邻港澳的口岸，适用入境口岸从六十个涨到六十五个。也就是说，持联程机票从六十五个口岸进来，能在规定区域免签待十天。老外来华更方便了，我们做内容也得跟上这波入境游热度。做入境游和本地生活内容的，这一波政策红利至少能吃一整年，现在就该把接驳和配套想清楚。"},{"angle":"趋势判断","text":"从入境政策能看出一个明确信号：中国在持续扩大开放。二百四十小时过境免签国家从早年的寥寥几个扩到五十七个，海南单免到六十一个，入境口岸从六十增到六十五个，还加了外国人入境卡网上填报、证件全程网办试点扩到五十城。配套数据是，前三季度入境外国人同比涨了百分之十五点六，离境退税办理涨了六成。对做文旅和本地生活的人来说，机会在接驳和配套：外语标识、外卡支付、机场到景区交通。这批客流增量是结构性的，不是一阵风。谁先把外语标识、外卡支付、机场到景区交通补齐，谁就先吃到这批持续增长的增量客流。"},{"angle":"说人话版","text":"说人话解释一下二百四十小时过境免签。就是你拿着去第三国的联程机票，经中国转机，可以从六十五个口岸免签进来，在规定区域里待最多十天，不用提前办签证。国家已经扩到五十七个国家适用，海南更宽松，三十天入境免签到六十一个国家。去年十一月还新加了五个靠港澳的口岸，像港珠澳大桥、西九龙站这种，从香港澳门过来转内地更顺。注意两点：第一，得是真联程、有明确第三国行程；第二，停留区域有限制，不是全国随便跑。出差旅游探亲都行，工作和新闻采访另说。出发前提醒客人核对联程票和停留区域，这两个细节确认好，能省掉落地后一大堆麻烦。"}]},{"id":"tv4","title":"反季出境抄底：希腊11—3月机票酒店降五到六成","hook":"不想人挤人又想出国，反季去希腊机票酒店直接腰斩。","why":"强反差、可复用，淡季数据来自携程社区攻略，适合做\"错峰出境\"系列。","heat":"中","tags":["出境","避坑","反直觉"],"facts":["携程攻略：希腊11月至次年3月为极致淡季，机票、酒店降价50%-60%，是全年出行成本最低时段（携程社区2026-11-09检索）","考古遗址、博物馆门票11月-3月统一半价，雅典卫城旺季20欧→淡季5欧（携程社区）","9-11月为国际机票订票黄金期，比旺季便宜近20%，避开圣诞新年更低（携程社区）","地中海周边多国进入冬季淡季，海岛部分小店歇业、渡轮班次缩减，适合主打古迹慢游（携程社区）","注意：淡季天气偏凉、部分小众民宿关闭，行程不宜多岛连跳（携程社区）"],"scripts":[{"angle":"干货直给","text":"不想人挤人又想出国，反季是个思路。以希腊为例，十一月到次年三月是极致淡季，机票和酒店普遍降五到六成，是全年成本最低的时候。景点也便宜，考古遗址和博物馆门票统一半价，雅典卫城旺季二十欧，淡季只要五欧。九月到十一月还是国际机票订票黄金期，比旺季便宜近两成，避开圣诞新年更低。当然有代价，海岛部分小店歇业、渡轮班次少，不适合看海玩水，适合主打古迹慢游。想清净看帕特农神庙包场的，这几个月最合适。想拍空镜大片的，这几个月雅典卫城随便包场，不用排队不用抢机位，出片率比旺季高得多，机票酒店还直接腰斩。"},{"angle":"横向对比","text":"同样去欧洲，夏天和冬天是两个价格。夏天旺季，希腊机票酒店全价，圣托里尼的伊亚小镇一房难求；到了十一月到三月淡季，机票酒店直接降五到六成，雅典市区步行可达卫城的民宿价格减半。门票更明显，卫城套票覆盖六大古迹，淡季全半价，旺季二十欧的卫城淡季五欧。差别在体验：夏天能跳岛玩水，冬天海风凉、部分小岛歇业，但只要你的目标是有氧古迹、博物馆、小镇漫步，冬天反而更好，不用排队、不用抢机位、花费砍掉一大半。同样的预算，冬天能住进夏天根本住不起的海景房，花费砍掉一大半，体验反而更安静更从容。错峰的人早就行动了，好房源和好票价都是先到先得。"},{"angle":"避坑清单","text":"反季去希腊，五条先核对。第一，时间选十一到三月，机票酒店降五到六成，但海景和跳岛体验打折，别冲着下水去。第二，门票半价是十一月到三月，卫城二十欧变五欧，去前确认景点开闭时间。第三，渡轮班次少、天气多变，主打一城一岛，别多岛连跳，容易误船。第四，装备带薄冲锋衣和长袖，昼夜温差大。第五，避开景区主动搭讪的花环、讲解、拍照服务，全是隐形消费。照着核对，一半预算能玩出十倍体验。照着这五条逐条核对，一半的预算能玩出十倍的体验，反季出行的性价比就是这么实在，聪明人都开始错峰了。提前规划才能稳稳省下，别等临出门再后悔价格翻倍。"}]},{"id":"tv5","title":"双11囤游给爸妈：飞猪银发订单涨25%","hook":"双十一别只给自己囤，给爸妈囤旅游正当时。","why":"强时效+人群痛点，数据来自飞猪，可做\"适老出行\"长效内容。","heat":"中","tags":["双11","银发","省钱"],"facts":["飞猪10月15日现货开售4小时近100万件，含机票次卡、酒店套餐（华夏旅游网2026-11-02、钱江晚报）","飞猪\"带爸妈出游\"搜索同比增50%，银发订单同比增25%（中新经纬/华龙网2026-11-06）","三峡游轮等适老产品热销，单品售出超3.5万件（中新经纬2026-11-06）","秋假撞双11：飞猪儿童机票搜索增40%、已预约增70%、机票次卡增5倍（中国旅游网2026-11-04）","错峰提示：双11囤的券多限定使用期，需核对国庆后/淡季可用日期（通用提醒）"],"scripts":[{"angle":"干货直给","text":"双十一别只给自己囤，给爸妈囤旅游正当时。飞猪十月十五号现货开售，四小时就近一百万件，机票次卡、酒店套餐都在列。数据更说明问题，飞猪带爸妈出游的搜索同比涨了五成，银发订单涨了百分之二十五，三峡游轮这种适老产品单品卖出超三万五千件。逻辑很简单，老人时间自由，错峰出行最舒服，价格还低。双十一的券和次卡把明年淡季的机酒提前锁在低价，比临出发现买划算得多。有父母的，这两天就该把行程看了。有父母的，这两天就该把明年的错峰行程好好看一遍，趁着双十一把机酒提前锁在低位，比临出发现买划算太多。"},{"angle":"趋势判断","text":"银发出行这波不是偶然，是人口结构和消费习惯叠加的结果。飞猪数据，带爸妈出游搜索同比涨五成、银发订单涨两成五，三峡游轮等适老产品单品卖超三万五千件。背后是退休群体时间自由、消费力稳，又避开寒暑假和国庆的人潮。平台也顺势推适老套餐、慢节奏线路、含保险的打包产品。对内容创作者来说，这是个长期赛道：教父母用App订票、帮他们挑不踩坑的线路、对比跟团和自由行的差别，都是高收藏的实用内容，而且受众付费意愿强。而且这波银发受众付费意愿强，内容只要做细做实用，很容易在评论区和私信里接到真实转化。"},{"angle":"实操流程","text":"想趁双十一给爸妈安排一趟，按这个走。第一步，先问清父母的时间窗口和体力，别替他们定太满的行程，慢节奏优先。第二步，在飞猪搜机票次卡和酒店套餐，双十一现货里这类最划算，三峡游轮、温泉、海岛都可选。第三步，核对券的使用期，很多限定国庆后或明年淡季，确认父母能去的时间段再买。第四步，优先选含接送、含保险、可免费取消的套餐，老人出行变数多。第五步，订完把行程单和客服电话发给父母，教他们怎么看。省下的钱够带他们多住两晚好酒店。省下来的钱，够带他们多住两晚条件更好的酒店，老人舒服你也轻松，这趟才算真正安排到位。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"腾讯 Hy4 调用激增十倍扩容，Agent 能力开源第一","hook":"混元 Hy4 被用户挤爆，腾讯紧急做了十倍扩容。","why":"国产大模型落地信号强，有真实调用数据支撑，情绪价值和信息量都足。","heat":"高","tags":["强时效","国产","腾讯"],"facts":["11月5日腾讯宣布因混元 Hy4 调用激增，WorkBuddy 已进行十倍扩容（量子位2026-11-07）","多家测评称 Hy4 的 Agent 能力在开源模型中排名靠前（量子位2026-11-07）","混元 Hy4 于11月4日发布即开源：770B、视觉理解+Computer Use、金融579任务3.04分、幻觉率7.2%（人民网/澎湃/InfoQ）","待核实：「Agent 能力开源模型第一」为媒体表述，具体榜单口径未统一，未写入口播稿正文作绝对化结论"],"scripts":[{"angle":"干货直给","text":"腾讯的混元 Hy4 最近被用户挤爆了。十一月五号腾讯宣布，因为 Hy4 调用量激增，WorkBuddy 已经做了十倍扩容。这不是常规优化，是真实需求把产能顶上去了。背景是 Hy4 十一月四号发布就开源，七百七十B 参数，主打视觉理解和电脑操作，在金融五百七十九项任务里拿了三点零四分，幻觉率压到百分之七点二。调用量大涨，说明用户真在用，不是发布会热闹一下就散。对普通人来说，这意味着国产大模型的服务越来越稳，高峰时段也不容易转圈圈。这种服务稳定性，才是普通用户最实在的获得感，模型再强用起来总转圈也是白搭。"},{"angle":"说人话版","text":"用大白话讲腾讯这次十倍扩容。混元 Hy4 是腾讯十一月四号刚开源的大模型，七百七十B 参数，特点是能看懂图、还能操作电脑。结果发布没两天，调用量直接爆了，腾讯在五号紧急把 WorkBuddy 的算力扩了十倍。为什么值得普通用户关心？第一，模型服务变稳了，你用的时候不容易卡。第二，开源意味着开发者能拿去自己搭应用，生态会冒出更多好用的小工具。第三，国产大模型走到这一步，说明本土算力加本土模型这条路越来越顺，长期看调用价格还会往下走。对普通用户来说，长期看调用价格还会随着规模摊薄，国产大模型的性价比只会越来越高。"},{"angle":"趋势判断","text":"从腾讯 Hy4 十倍扩容能看出大模型竞争进入了新阶段。第一，用户用脚投票，调用量激增逼出十倍扩容，说明模型不是参数好看，是真能干活，尤其 Agent 能力被多家测评排在开源模型前列。第二，发布即开源加即扩容，节奏越来越快，大厂把模型当基础设施在铺，目标是抢开发者生态而不是卖单次调用。第三，竞争焦点从聊天转到电脑操作和任务执行，谁能让模型替人点鼠标、填表单、跑流程，谁就拿到下一程的入口。对内容创作者，这是个持续能挖的选题富矿。谁先把模型跑进自己的工作流，谁就拿到下一程的入口，做内容的正好可以持续盯这个方向。"}]},{"id":"ai2","title":"百度开源文心 5.5 Flash Base，刷新同尺寸 SOTA","hook":"百度也开源了新模型，激活参数只有14B却跑出好分数。","why":"大厂开源潮延续，性价比路线清晰，对用AI工具的人直接利好。","heat":"中高","tags":["国产","开源","百度"],"facts":["11月5日百度正式开源最新基座模型文心5.5 Flash Base（量子位2026-11-07）","规格：280B总参数、激活14B、33.5T tokens训练、128K训练/1M推理上下文（百度官方/新华网/量子位）","多家媒体称其在同尺寸模型多项基准刷新 SOTA（量子位/百度官方）","开源策略延续大厂\"把模型当基础设施\"路线，降低下游调用成本（量子位分析）"],"scripts":[{"angle":"干货直给","text":"百度也开源了新模型。十一月五号，百度正式开源文心 5.5 Flash Base，参数规模二百八十B，激活只要十四B，训练用了三十一点五万亿 tokens，上下文训练十二万八、推理能拉到一百万。多家媒体说它在同尺寸模型的多项基准上刷新了 SOTA。重点在激活参数小，意味着同样的效果，跑起来便宜。大厂这几个月密集开源，百度、腾讯、阿里轮着来，本质是把模型当基础设施铺开，下游开发者调用成本被持续压低。对用 AI 工具的人来说，能直接感知到的就是又快又便宜。对天天用AI工具的人来说，能直接感觉到模型又快又便宜，干活效率肉眼可见地往上走。"},{"angle":"数据向","text":"把百度这次开源的数字摆出来。文心 5.5 Flash Base，总参数二百八十B，激活参数十四B，训练数据三十一点五万亿 tokens，训练上下文十二万八千，推理上下文一百万 token。几个含义：第一，激活参数只有十四B，跑同样的任务比满血大模型省电省卡，调用成本低。第二，百万 token 推理上下文，长文档和代码库能整段塞进去。第三，多家测评称同尺寸多项基准刷新 SOTA，说明小激活也能打出好分数。大厂开源潮里，这种高性价比的 Base 模型最适合做应用底座，创业团队和个人开发者直接受益。创业团队和个人开发者，是这波开源最直接的受益者，低成本就能拿到能打的应用底座。"},{"angle":"趋势判断","text":"百度开源文心 5.5 Flash Base，是这波大厂开源潮的又一脚油门。看三个走向。第一，开源策略在固化，百度、腾讯、阿里近两个月连续放出开源模型，共识是把模型当基础设施，靠生态和上层服务赚钱，而不是靠单次调用收费。第二，技术路线偏向小激活、大上下文，用更少算力跑出更好效果，直接拉低应用成本。第三，竞争从参数规模转向性价比和落地，谁让开发者用得便宜、用得顺，谁就积累生态。对普通用户，长期利好是 AI 工具越来越便宜、越来越跟手。对普通用户来说，长期利好是AI工具越来越便宜、越来越跟手，门槛被一点点磨平了。"}]},{"id":"ai3","title":"视频生成变成 Agent 可调用的能力（PixVerse×OpenAI）","hook":"视频生成不再是你打开的网站，而是智能体随手调的接口。","why":"代表AI工作流演进方向，有OpenAI工程师实演示，破圈潜力大。","heat":"中高","tags":["AI视频","智能体","工作流"],"facts":["爱诗科技 PixVerse 与 OpenAI 共同推出产品集成和创作者教育计划，视频生成被封装为 Agent 可直接调用的接口（量子位2026-11-07）","演示：在 Codex 中调用 PixVerse 插件，根据角色图生成走路参考视频，再用 Codex 把动作套用到游戏角色，全程自然语言、无需动捕/动画软件（量子位引 OpenAI 工程师 Tyler Ryu）","一致性经验：把角色正面/背面/侧面+脸部特写参考图放进项目文件夹，要求 Codex 生成前先看（PixVerse 社区创作者）","视频生成正从\"用户访问的网站\"变成\"Agent 的创作基础设施\"（PixVerse 美方市场负责人表述，量子位）"],"scripts":[{"angle":"干货直给","text":"视频生成正在变成 AI 智能体随手调用的能力，不是你专门打开的网站了。爱诗科技的 PixVerse 跟 OpenAI 搞了产品集成，把视频生成封装成接口，Agent 不用开网页就能自己生成视频。OpenAI 工程师演示过：在 Codex 里调 PixVerse 插件，给一张角色图生成走路的参考视频，再用 Codex 把动作套到游戏角色上，全程自然语言，不用动捕设备也不用动画软件。一句话，以前要做角色动画得整套专业工具，现在在对话框里走完。视频模型正在从前端产品退到后端能力。视频模型正在从台前产品，退到后台能力，以后你甚至感觉不到它的存在。"},{"angle":"实操流程","text":"想试 Agent 调视频生成，可以按这个思路玩。第一步，把角色的正面、背面、侧面各一张图加一张脸部特写放进项目文件夹，这是 PixVerse 社区验证的一致性秘诀。第二步，在 Codex 里调用 PixVerse 插件，明确要求生成前先看这些参考图，角色和场景才不漂移。第三步，用自然语言描述动作，比如让角色走一段路，插件产出参考视频。第四步，把视频丢回 Codex，套用到你的游戏角色或成片里反复微调。全程不用离开代码环境，也不用学动画软件，非专业也能出可用素材。非专业背景的人，也能产出能用的动画素材，这条生产线被压扁到了对话框里。"},{"angle":"趋势判断","text":"PixVerse 跟 OpenAI 的集成释放了一个信号：视频生成会从独立产品变成基础设施。第一，能力被封装成接口，Agent 能自主完成理解任务、生成简报、拆分镜、调视频这一整条链路，人只管最后审美把关。第二，工作流被压缩，原本依赖动捕和动画软件的角色动画，现在在 Codex 里用自然语言走完，门槛大幅降低。第三，对创作者的含义是，核心竞争力从会操作工具，转向会写需求、会判断好坏、有审美。工具越隐形，人的品味越值钱。这跟图文生成走过的路一模一样。工具越隐形，人的品味和审美反而越值钱，这跟图文生成走过的路一模一样。"}]},{"id":"ai4","title":"小米具身基座模型乌镇双奖，机器人进工厂8小时整班","hook":"小米机器人第一次在汽车工厂干满8小时整班，不是剪辑。","why":"机器人落地硬证据，双奖+真实工站/家庭验证，信息密度高。","heat":"中高","tags":["机器人","小米","具身智能"],"facts":["11月3日小米披露：获2026世界互联网大会\"杰出贡献奖\"，机器人业务具身基座模型关键技术获\"领先科技奖\"（量子位2026-11-03）","工厂场景：人形机器人在汽车工厂中控台侧盖板排序工站首次挑战8小时整班作业，异常自主纠偏、产线级协同（量子位2026-11-03）","家庭场景：具身基座模型在小米青年公寓\"试运营\"，基于 Xiaomi-Robotics-1 搭建 Agent，连续超30分钟、覆盖3房间、50+任务长程验证（量子位2026-11-03）","乌镇峰会11月2-5日召开，全球230余家企业申报、仅15家获杰出贡献奖（量子位）"],"scripts":[{"angle":"干货直给","text":"小米在乌镇拿了双奖。十一月三号披露，小米集团拿到世界互联网大会杰出贡献奖，机器人业务的具身基座模型关键技术拿了领先科技奖，今年全球两百三十多家企业申报，只有十五家获奖。更硬的是落地进展：人形机器人在汽车工厂的中控台侧盖板排序工站，第一次挑战八小时整班作业，过程异常能自己纠偏，还能和产线协同；在家庭场景，具身模型在小米青年公寓试运营，连续跑超三十分钟、覆盖三个房间、完成五十多个任务。一套技术底座同时撑起工厂和家庭，小米跑通了场景反哺技术的循环。一套底座两头喂，小米跑通了场景反哺技术的正向循环，这是别人很难抄的作业。"},{"angle":"数据向","text":"看几个数字理解小米的机器人进展。乌镇峰会十一月二到五号召开，小米首次申报就拿了杰出贡献奖，全球两百三十余家企业角逐、最终十五家入选。工厂侧，人形机器人完成八小时整班作业，不是演示几分钟，是真实工站全天生产需求，还能异常自主纠偏。家庭侧，基于 Xiaomi-Robotics-1 搭的 Agent，在青年公寓连续超三十分钟、跨三个房间、五十多个任务的长程验证。这两个数字说明，小米的机器人不是实验室玩具，是同时在真实制造和真实生活里跑的，数据来源稀缺且高质量。数据来源既稀缺又高质量，这是小米最硬的护城河，也是机器人真正落地的关键。"},{"angle":"反常识开场","text":"都说机器人进工厂是噱头，小米这次给了个反例。它的具身基座模型在乌镇拿了领先科技奖，但奖是次要的，关键是落地。人形机器人在汽车工厂中控台侧盖板排序工站，第一次干满八小时整班，中间异常自己纠偏，还和产线系统协同；在青年公寓，Agent 连续三十多分钟、跨三个房间完成五十多个家务任务。以前这类演示都是几分钟剪辑，这次是整班和长程。小米的可怕之处在于，机器人长在真实制造体系上，工厂给稀缺训练数据，公寓测更高难度的泛化，一套底座两头喂。一套技术底座，同时扛起了工业和家庭两个场景，这种复用能力才是规模化的前提。"}]},{"id":"ai5","title":"具身推理模型「驭物」开源，让机器人看懂真实物理世界","hook":"有个新开源模型，专门教机器人分清\"靠近了\"和\"到位了\"。","why":"具身智能细分赛道，方法论比分数更有复用价值，技术向但不晦涩。","heat":"中","tags":["具身智能","开源","机器人"],"facts":["招商局狮子山人工智能实验室发布「驭物 Lion-ER-35B-A3B」具身推理模型，已在 Hugging Face 开源权重（BF16 Safetensors，量子位2026-11-09）","仅激活3B参数，十项具身基准全线提升（量子位2026-11-09）","能力聚焦：空间关系理解、场景状态分析、任务进度判断、空间约束理解，解决\"靠近了\"与\"到位了\"的视觉差（量子位）","方法论：让能力成为数据设计单元、让评测成为数据生产起点，面向具身 Agent 拓展工具调用与多轮交互（量子位引实验室）"],"scripts":[{"angle":"干货直给","text":"招商局狮子山实验室开源了个挺实在的模型，叫驭物 Lion-ER-35B-A3B，已经在 Hugging Face 放出权重。它专门解决一个痛点：让机器人看懂真实物理世界，而不只是识别画面里有什么。总参数三百五十B，但只激活三点B，十项具身基准全线提升。它聚焦四件事：空间关系理解、场景状态分析、任务进度判断、空间约束理解。说白了，就是区分画面上的靠近和真正到位之间那点位移差，避免机器人误判进度提前动手。对做机器人应用的人来说，这是个能直接拿去适配的开源底座。对做机器人应用的人来说，这是个能直接拉去适配的开源底座，省掉了从零起步的麻烦。"},{"angle":"说人话版","text":"大白话讲讲驭物这个模型是干嘛的。普通多模态模型能看图说话，但机器人真去干活，光认出东西不够，得理解三维空间和动作带来的状态变化。驭物总参数三百五十B，实际只激活三点B，省算力，十项基准全涨了。它主要练四种能力：看懂物体之间怎么摆、判断当前场景状态、识别任务进行到哪一步、理解空间上的限制条件。比如画面里机器臂靠近了目标，不等于已经到位，这点位移差它能分辨，就不会提前执行下一步把活干砸。已经在 Hugging Face 开源，开发者能直接拉去用。已经在Hugging Face开源，开发者能直接拉下来用，想试水的现在就能跑通第一条链路。"},{"angle":"方法论","text":"驭物这个模型最值钱的不是分数，是它那套数据方法论。实验室的思路是，让能力成为数据设计的单元，让评测成为数据生产的起点。意思就是，先定义清楚要练哪几种能力，再围绕能力去造数据和设计评测，每一次评测失败都反向产出一批新训练数据，全程可追溯。这比堆数据量科学得多。后续他们还要面向具身 Agent 拓展工具调用、多轮交互和失败恢复。对行业来说，这种以能力牵引的数据引擎，比单纯放大模型更有复用价值，也更适合真实环境里的长程任务。比单纯堆大模型参数，这种以能力牵引的数据引擎更有复用价值，也更适配真实环境。"}]}]}]}</script>
<script id="packHistory" type="application/json">{"2026-11-07":{"date":"2026-11-07","updatedAt":"2026-11-07 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"11月机票全年价格洼地：换季+淡季+双11三重叠加","hook":"11月是全年机票最便宜的窗口，三股力量叠在一起。","why":"冬春航季10月25日刚切换，新航线密集开、国庆后春节前无长假，再加双11促销，价格洼地特征明显，现在发最实用，人人可抄。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["2026年10月25日起执行2026/2027冬春航季，至2027年3月27日共154天；央视网报道216家航司每周计划11.6万班，34家航司新开288条国内航线，多集中在西北、东北、西南与华东、中南之间（央视网，2026-10-25）","换季+淡季+双11三重叠加：新航线初期靠折扣填满座位、国庆后春节前无长假支撑需求走低、平台大促叠加（红星新闻2026-11-02引去哪儿/同程/航旅纵横/航班管家）","据航班管家及红星新闻，成都飞昆明、丽江不含税费最低200元，飞拉萨、杭州、青岛最低300元，北京、上海、广州飞成都最低400元；提前半个月以上早抢订的游客同比增长三成","航司会员日最稳：南航每月28日、东航18日、国航15日左右、厦航9日、海航系8日、春秋27日，提前注册免费会员到点抢，较平时便宜20%-50%且可叠平台券（今日头条/定州新闻网，2026-11）","周度规律：周二周三是全年价格洼地，票价较周五到周日低15%-30%；日内捡漏窗口为13-15点退改签回流、22:30-凌晨2点清仓余票（新浪财经/今日头条，2026-11-06）"],"scripts":[{"angle":"干货直给","text":"11月是全年机票的价格洼地，三股力量叠在一起：换季、淡季、双11促销。10月25日起民航执行2026/2027冬春航季，到明年3月27日共154天，央视网说216家航司每周计划11.6万班，34家航司新开288条国内航线，多集中在西北东北西南。新航线初期要靠折扣填满座位，这就是购票窗口。叠加国庆后春节前没有长假、商务旅游客流同步走低，加上平台双11促销，好价格得早订。成都飞昆明丽江不含税最低200，飞拉萨杭州青岛最低300，北京上海广州飞成都最低400。提前半个月以上的早抢订同比增长三成，便宜是留给动手快的人的。"},{"angle":"实操流程","text":"想11月捡便宜票，照这个顺序走。第一，先定出行日期，国内至少提前一到两周，远途更早，别拖到周四。第二，只比含税总价，点到结算页看票面加机建燃油，裸票低价经常不含这两项。第三，盯新通道红利，新航线新高铁初期最划算，比如雅安到天府机场最快80分钟的天蒲铁路。第四，错峰一天，周六早走周日下午回，票价酒店都更便宜。第五，酒店优先可免费取消，看清含早和附加费。还有航司会员日最稳：南航28号、东航18号、国航15号左右，提前注册免费会员到点抢，能比平时便宜两到五成，抢到还能叠平台券。退改规则一定下单前看清，廉价航空还要把行李费算进去，机场现场买托运接近翻倍。"},{"angle":"反常识开场","text":"机票越晚买越便宜这句话在11月是错的。多数人以为淡季随时都能捡漏，其实11月的好价格是换季窗口给的。10月25日冬春航季一切换，216家航司每周11.6万班、288条新航线密集开出来，运力猛增，航司必须靠折扣把新舱位填满，这才把票价压到全年低位。等这波换季促销过去，临近年底商务和元旦客流一回来，价格立刻抬头。所以11月订票不是越等越便宜，是越早越占便宜。周二周三出发比周五便宜15%到30%，下午一点到三点、夜里十点半到凌晨两点是退改签余票回流高峰，这两个时段刷票最容易碰到折扣。"}]},{"id":"tv2","title":"雪季还没到，南方人已经掀起了追雪热","hook":"雪还没下，南方人的订单已经飞到了阿勒泰。","why":"数据反差强：雪场周边住宿订单南方占比首次过半，广州飞阿勒泰涨183%。适合做有冲突感的短视频，评论区容易热闹。","heat":"中高","tags":["反直觉","冰雪","有争议"],"facts":["10月20日至31日新疆阿勒泰可可托海国际滑雪度假区开板，2026-2027冰雪季启幕（中国新闻网/中国经济网/新浪财经，2026-11-02）","美团数据：10月以来滑雪搜索量同比增长125%，11月至次年3月入住的雪场周边5公里住宿预订量同比增长217%（中国新闻网/中国经济网，2026-11-02）","11月、12月入住的雪场周边住宿订单中约55%来自南方城市，去年同期为44%，一年提升11个百分点；出发城市榜前十南方占七席，上海、广州、成都前三，深圳第六（中国新闻网/羊城晚报，2026-11-02）","跨南北航线涨幅最猛：成都、广州飞阿勒泰航班预订量同比分别增长67%和183%；阿勒泰四大雪场面向乘机抵达的疆外旅客凭登机牌5日内可免费滑雪一次（中国经济网/微信数据整理，2026-11-02）","10月以来室内滑雪搜索量同比增长168%，室内冰雪体验近七成搜索来自南方城市，深圳热度领跑全国（中国新闻网，2026-11-02）","崇礼雪场周边住宿10月16-25日较前10天增长110%，万龙开板三天崇礼火锅与温泉搜索分别增长46%和59%；阿勒泰住宿床位从2018年3900张增至2025年底13416张（微信数据整理引航旅纵横/中国民航局，2026-11-02）"],"scripts":[{"angle":"数据向","text":"一组数字看今年追雪热。10月20日到31日，新疆可可托海国际滑雪度假区开板，2026到2027冰雪季正式启幕。美团数据，10月以来滑雪搜索量同比增长125%，11月到明年3月入住的雪场周边五公里住宿预订量同比增长217%。更夸张的是客源结构：11月和12月雪场周边住宿订单里，约55%来自南方城市，去年同期只有44%，一年提升11个百分点。出发城市榜前十名南方占七席，上海广州成都前三，深圳第六。跨南北航线涨最猛：广州飞阿勒泰预订量同比涨183%，成都飞阿勒泰涨67%。阿勒泰四大雪场还推出凭登机牌五日内免费滑雪一次。"},{"angle":"故事切入","text":"我一个广州朋友，上个月先在商场里的室内雪场带孩子复健，这个月就订好了11月中旬阿勒泰的往返机票和住滑套餐。这正成为南方雪友的标准动线：先在家门口练手，再远滑。数据印证了这一点，10月以来室内滑雪搜索量同比增长168%，室内冰雪体验近七成搜索来自南方城市，深圳热度领跑全国。广东人还没等北方雪季真正到来，就先在广州花都融创雪世界滑上了。背后的变化是，直飞航线把北疆雪场拉进了周末可达范围，雪场在北客源在南，今年第一趟雪，很多人从广州深圳上海起飞。这股追雪潮的本质是门槛被拉平：室内雪场先练技术，直飞航线缩短距离，普通人也能轻松上雪山。"},{"angle":"横向对比","text":"今年追雪和往年有两个不同。第一，人没在北方，订单在南方。雪场周边住宿订单南方占比首次过半，广州飞阿勒泰涨183%、成都飞阿勒泰涨67%，而去年同期南方只占44%。第二，消费从一天变成三天。崇礼雪场周边住宿10月16到25号较前10天涨110%，万龙开板三天崇礼火锅和温泉搜索分别涨46%和59%，滑完雪泡温泉吃火锅成了固定组合。供给端也在追，阿勒泰住宿床位从2018年3900张补到2025年底13416张，餐饮店从680家增到2561家。整个冰雪产业2025年已破万亿，增长逻辑从多建雪场转向让人多住几天。"}]},{"id":"tv3","title":"240小时过境免签扩至65口岸，China Haul来华扫货成热潮","hook":"老外来中国不光看景，还带空箱子买国货走。","why":"免签口岸扩容+China Haul热词，政策与消费双重热点，权威来源扎实，适合做信息差强、转发高的内容。","heat":"高","tags":["强时效","免签","入境游"],"facts":["国家移民管理局推出支持扩大开放10项创新举措，新增广东5个口岸为240小时过境免签入境口岸：广州琶洲客运港、横琴、港珠澳大桥、中山港、广深港高铁西九龙站，适用口岸总数由60个增至65个（国家移民管理局/烟台市政府，2026-11）","我国240小时过境免签政策适用国家已增至57国（经济日报，2026-11-01）","国家移民管理局数据：今年三季度外国人入境达1160.1万人次，同比上升15.6%；其中免签入境外国人899.2万人次，占77.5%，同比上升24.1%（经济日报，2026-11-01）","商务部数据：今年前7个月境外人员在华消费2636亿元，同比增长27.8%（经济日报，2026-11-01）","前8个月全国离境退税销售额同比增长约六成，办理退税人数增长3倍，退税商店超1.8万家，比2024年底增长4倍；China Haul成海外社交平台热词（经济日报，2026-11-01）"],"scripts":[{"angle":"干货直给","text":"国家移民管理局刚推了10项创新举措，其中过境免签口岸又扩容了。新增广东5个口岸为240小时过境免签入境口岸：广州琶洲客运港、横琴、港珠澳大桥、中山港、广深港高铁西九龙站，适用口岸总数从60个增加到65个。240小时过境免签适用国家已经增至57国。与此同时入境游还在升温，三季度外国人入境1160.1万人次，同比上升15.6%，其中免签入境899.2万人次，占77.5%，同比上升24.1%。商务部数据，前7个月境外人员在华消费2636亿元，同比增长27.8%。来华扫货的China Haul成了海外社交平台热词，老外来中国不光看景，还带空箱子买国货。"},{"angle":"趋势判断","text":"China Haul能火，不是一个偶然热词，是免签加退税两条政策叠出来的。先看政策：240小时过境免签口岸扩到65个、适用国家57国，入境越来越方便。再看消费环境：离境退税政策优化，放宽商店备案、降低起退点、推广即买即退，前8个月全国离境退税销售额同比增长约六成，办理退税人数增长3倍，退税商店超1.8万家，比2024年底增4倍。外国游客买什么？无人机、折叠屏、国潮美妆、黑科技小家电、中药按摩仪。购物从孤立环节变成串联科技康养文化的超级接口。对做文旅和带货的人来说，口岸城市、退税店、国货品牌都是可以盯的增量。"},{"angle":"说人话版","text":"说人话解释240小时过境免签。就是你从A国飞往B国，中途在中国转机或停留，不用提前办签证，凭联程机票和材料能在中国待10天，这10天里能出机场、能逛街、能消费。之前适用口岸60个，现在加5个广东毗邻港澳的口岸变成65个，适用国家57个。关键是这10天足够你顺手买一波东西再走。退税也更方便了，商店备案放宽、起退点降低、即买即退推广，前8个月退税销售额涨六成、退税人数涨3倍。所以老外现在流行来华扫货，带空箱子来、塞满国货走，China Haul就是这么来的。政策友好加上国货能打，这波入境消费还会持续。"}]},{"id":"tv4","title":"双11囤游新趋势：年轻人在下单，爸妈在出发","hook":"今年双11，购物车里多了一项给爸妈囤的旅行。","why":"孝心经济+先囤后约错峰，强情绪价值又实用，飞猪等多源数据一致，适合做亲子/银发向内容。","heat":"中高","tags":["双11","银发","囤游"],"facts":["飞猪双11开卖以来，带爸妈出游相关内容搜索热度同比增长近50%，银发人群出行订单同比增长约25%，AI助手飞猪帮帮上咨询父母老人出行规划的交互量同比暴涨超5倍（中新经纬/华龙网/三秦网，2026-11-06）","三峡游轮通兑船票销量突破35000件；纯玩精品小团覆盖新疆禾木-阿勒泰冬游、青甘大环线、哈尔滨-亚布力-雪乡、长白山-延吉温泉滑雪游（中新经纬，2026-11-06）","酒店方面，杭州西湖国宾馆、南京东郊国宾馆、宁波钱湖国宾馆等国宾馆，以及武义涵田等温泉酒店通兑上新（华龙网/三秦网，2026-11-06）","秋假撞双11：飞猪儿童机票预订张数同比近40%，赏秋等关键词搜索超5倍；已预约出行日期的活动商品订单同比超70%，当天买当天约酒店订单占比60%，机票次卡订单同比激增超5倍（广州日报/中国旅游网，2026-11-04）","目的地黑马：宜昌、上饶、乐山、南通、阿勒泰普遍录得2倍以上增速；途家秋假连住5天民宿订单同比增长36%（广州日报/中国旅游网，2026-11-04）"],"scripts":[{"angle":"干货直给","text":"今年双11出现一个新趋势：年轻人给爸妈囤旅行。飞猪数据，双11开卖以来带爸妈出游相关内容搜索热度同比增长近50%，银发人群出行订单同比增长约25%，在飞猪AI助手飞猪帮帮上，咨询父母老人出行规划的交互量同比暴涨超5倍。卖得好的都是省心款：吃住玩一价全包的三峡游轮，一款通兑船票销量突破35000件；全程跟导游的纯玩精品小团，覆盖新疆禾木阿勒泰冬游、青甘大环线、哈尔滨亚布力雪乡、长白山延吉温泉滑雪。酒店方面，杭州西湖国宾馆、南京东郊国宾馆等国宾馆，还有武义涵田等温泉酒店通兑都上了。先囤后约，正好错峰，对时间灵活的老人特别友好。"},{"angle":"实操流程","text":"想给爸妈囤一趟省心游，照这个思路选。第一步，认准先买后约的套餐，别买死日期的，老人时间灵活，囤着等淡季约最划算。第二步，优先一价全包和纯玩小团，吃住玩导游全包、不赶路不累人，新疆禾木阿勒泰冬游、青甘大环线、雪乡温泉这类都有覆盖。第三步，酒店挑可免费取消的通兑，国宾馆和温泉酒店性价比高，天冷给爸妈囤一套温泉正合适。第四步，用平台AI助手做规划，飞猪帮帮这类工具咨询父母出行很方便。第五步，下单前看清预约规则和有效期，先囤的套餐普遍有约定期限。子女舍得替父母花，孝心从物质供养转向了情绪价值。"},{"angle":"横向对比","text":"传统旅游套餐和双11囤游差别在哪？传统是定好日期买，贵且死板；双11囤游是先买权益后约时间，价格更划算还能错峰。飞猪上带爸妈出游搜索涨近50%、银发订单涨25%，说明需求真实存在。从目的地看，上海北京杭州三亚湖州是秋假大热，宜昌上饶乐山南通阿勒泰是黑马，普遍录得两倍以上增速。和给自己囤不同，给爸妈囤更看重省心和稳妥：三峡游轮卖35000件、精品小团持续上新，都是不操心的类型。再加上秋假撞双11，儿童机票同比涨近40%、赏秋搜索涨超5倍，亲子和银发两类囤游在今年11月同时爆发，市场淡季不淡。"}]},{"id":"tv5","title":"11月赏秋红叶时间线：追色趁早，怕冷就去避寒小城","hook":"红叶不是一夜变红，是跟着气温一步步走的。","why":"应季长效内容，红叶时间线+避寒新晋小城形成对比，适合做攻略收藏向，南北观众通吃。","heat":"中","tags":["赏秋","红叶","避寒"],"facts":["中国天气网联合国家气象中心赏红叶地图：11月上旬河北南部、山东西北部、河南北部西部、陕西南部、四川中部、云南西北部进入最佳期；11月中旬山东、河南中部、湖北西北部接上；南方大部11月中下旬（国家林草局/央视新闻，2026-10-24）","北京凤凰岭红叶预计持续至11月15日前后，南京栖霞山为11月中旬到12月初；一场大风或秋雨可能让红叶提前凋落，赏红要趁早（央视新闻/北京青年报，2026-10-24）","去哪儿建议避寒新晋小城：除三亚海口北海外，可考虑西双版纳、芒市、柳州，吃住成本更友好；候鸟游机票预订量同比增长三成（去哪儿/微信攻略，2026-11）","秋假亲子：飞猪儿童机票预订张数同比近40%，赏秋等关键词搜索超5倍；途家秋假连住5天民宿订单同比增长36%，广东江苏四川民宿预订同比约五成（广州日报/中国旅游网，2026-11-04）"],"scripts":[{"angle":"干货直给","text":"11月追红叶要卡时间线，中国天气网联合国家气象中心的赏红叶地图写得很清楚。11月上旬，河北南部、山东西北部、河南北部西部、陕西南部、四川中部、云南西北部进入最佳观赏期；11月中旬，山东、河南中部、湖北西北部接上；南方大部要到11月中下旬。具体点，北京凤凰岭红叶预计持续到11月15日前后，南京栖霞山是11月中旬到12月初。记住一点，一场大风或一场秋雨都可能让红叶提前凋落，赏红要趁早。不想去人挤人的，可以看避寒线：去哪儿建议西双版纳、芒市、柳州等新晋旅居小城，吃住成本更友好，候鸟游机票已经同比增长三成。"},{"angle":"避坑清单","text":"11月出门看红叶和避寒，五个坑先核对。第一，别信网上的老照片，红叶期受气温和降水影响很大，一场大风秋雨就能提前谢幕，出发前查当地气象部门的变色时间线。第二，北方红叶早、南方晚，北京凤凰岭约11月15日、南京栖霞11中到12初，别反过来安排。第三，热门红叶景区周末爆满，尽量周中去看。第四，避寒别只盯着三亚海口，候鸟游机票涨三成价格硬，西双版纳芒市柳州性价比更高。第五，秋假亲子需求旺，飞猪儿童机票同比涨近40%、赏秋搜索涨超5倍、途家连住5天民宿订单涨36%，带娃出行尽早订房。把这几条过一遍，行程少踩坑。"},{"angle":"反常识开场","text":"秋天看红叶，去得早不如去得巧。很多人一降温就往香山冲，结果叶子还没红透或者已经落了。红叶不是一夜变红，是跟着气温一步步走的，中国天气网的赏红地图把时间线拆得很细：11月上旬北方多地进最佳期，中旬往南推移，南方要到11月中下旬。北京凤凰岭能撑到11月15日前后，南京栖霞更晚到12月初。所以别扎堆国庆后那波，卡准你目标城市的最佳期再去，人少叶红还出片。反过来看，怕冷的不用硬追红叶，11月正是避寒好时候，西双版纳芒市柳州这些新晋小城候鸟游机票已经涨三成，说明聪明人已经在往南走了。所以别只盯着人多的名山，把时间线和目的地一起算，才是看红叶的正确打开方式。"}]}]},{"id":"ai","name":"AI 最新资讯及玩法","topics":[{"id":"ai1","title":"腾讯混元Hy4发布即开源，770B冲进最强开源梯队","hook":"腾讯把旗舰模型直接开源，还让它能看能操作电脑。","why":"国产开源大模型强热点，官方一手来源扎实，有真实金融评测撑腰，情绪与信息量都足。","heat":"高","tags":["强时效","国产","开源"],"facts":["11月4日腾讯发布混元Hy4，参数规模从Hy3系列不足300B提升到770B，首次引入视觉理解（细粒度图像处理、复杂图表分析、数学视觉推理），首次支持Computer Use电脑操作（命令行+图形界面）（人民网/澎湃新闻，2026-11-04）","Hy4接入WorkBuddy后调用量激增，推理集群紧急扩容十倍（网易/InfoQ，2026-11-04）","金融评测：基于579个真实任务、213位金融专业人士，Hy4得分3.04，超DeepSeek-V4.1-Flash-1017的2.97、Kimi K3.1 Pro与GLM-5.3的2.68；幻觉率7.2%，不受支持假设错误率从23.1%降至5.6%（steinslab引腾讯技术报告，2026-11-06）","Hy4针对Blender、CAD等专业软件及跨应用长程任务专项训练，在WorkBuddy桌面自动化基准平均83.18，领先12个场景中9个；权重将于近期开源，进入最强开源梯队（网易/InfoQ，2026-11-04）"],"scripts":[{"angle":"干货直给","text":"腾讯11月4日发布混元Hy4，这次直接冲开源第一梯队。参数规模从上代不足300B拉到770B，首次引入视觉理解，能做细粒度图像处理、复杂图表分析和数学视觉推理；还首次支持电脑操作Computer Use，结合命令行和图形界面处理任务。最实在的是它已经接进WorkBuddy，调用量激增，推理集群紧急扩容十倍。金融场景有硬数据：基于579个真实任务、213位金融专业人士评测，Hy4得分3.04，超过DeepSeek-V4.1-Flash-1017的2.97，也拉开和Kimi K3.1 Pro、GLM-5.3的2.68差距。幻觉率压到7.2%，不受支持假设错误率从23.1%降到5.6%。模型权重将于近期开源。"},{"angle":"说人话版","text":"用大白话讲混元Hy4为什么值得关注。第一，它看得见也能操作。以前大模型主要处理文字，Hy4能读图表、看文档，还能直接操作电脑界面和命令行，等于多了眼睛和手。第二，它变大了也变强了，参数从不到300B涨到770B，视觉和长程智能体能力一起补上。第三，它已经能干活，接进WorkBuddy后调用量暴涨，集群扩容十倍，说明不是发布会玩具。第四，有真实评测撑腰，579个金融任务拿了3.04分，比DeepSeek和Kimi的同类都高，幻觉率只有7.2%。对普通用户的意义是，这类能看能操作的开源模型，会很快变成你办公软件里的标配能力。"},{"angle":"趋势判断","text":"从混元Hy4能看到三个信号。第一，国产开源模型从纯文本走向多模态加操作，视觉理解和Computer Use一起给，说明开源阵营在补智能体需要的完整能力，不只是陪聊。第二，参数竞赛没停，Hy3不到300B、Hy4到770B，下一代Hy5还要更大，但重点已经不是堆参数，而是后训练和场景适配。第三，模型开始接管真实生产力，Hy4在Blender、CAD这类专业软件上专项训练，WorkBuddy里用户体验明显提升，金融分析幻觉率压到7.2%。腾讯百度同一周都开源旗舰模型，国产大模型正从跟跑变成全球开源智能的引领者，这条路对下游开发者是长期利好。"}]},{"id":"ai2","title":"Kimi K3.1 Pro开放2.8万亿权重，同步推出托管智能体","hook":"月之暗面把2.8万亿参数的旗舰权重直接放出来了。","why":"开放权重+托管服务双动作，Agent落地强信号，多源跑分支撑，对做AI产品的人很实用。","heat":"高","tags":["强时效","开源","智能体"],"facts":["11月5日凌晨月之暗面放出Kimi K3.1 Pro完整模型权重（Hugging Face），3T级开放权重模型，MoE总参2.8万亿、单次激活1040亿、100万token上下文、原生多模态视觉（澎湃新闻/网易，2026-11-05）","Agent Arena：K3.1 Pro（Max）开放权重第一、全球所有模型第13，工作/编程/聊天三类均排开放模型第一；基于全球用户超1.75万次真实长周期任务会话，净改进率+5.1%（腾讯新闻，2026-11-05）","Terminal-Bench 4.0达65.7%，超过GPT-6 Astra的58.2%、紧追Claude Opus 5.5的66.4%；Bash可靠性+7.9%排开放第一（Kimi官方/腾讯新闻，2026-11-05）","同日推出Kimi Hosted Agents托管服务：7×24小时托管环境、长程任务与多智能体协作、可调用140余项技能与30余款插件、独立沙箱与权限控制；昇腾实现0Day推理适配（澎湃/网易/搜狐，2026-11-05）"],"scripts":[{"angle":"干货直给","text":"月之暗面11月5日凌晨放出Kimi K3.1 Pro完整模型权重，开发者和企业可以直接下载部署、自己微调，不只能走API。这是3T级开放权重模型，MoE架构总参2.8万亿，单次推理只激活1040亿，上下文窗口100万token，原生支持多模态视觉。跑分上，Agent Arena开放权重第一、全球所有模型第13，工作编程聊天三类都排开放模型第一；Terminal-Bench 4.0拿到65.7%，超过GPT-6 Astra的58.2%。同一天还推出Kimi Hosted Agents托管服务，把智能体运行框架做成云端服务，7乘24小时托管、支持长程任务和多智能体协作，配140多项技能、30多款插件、独立沙箱。"},{"angle":"数据向","text":"把Kimi K3.1 Pro的数字摆出来。总参2.8万亿、激活1040亿、100万token上下文、多模态视觉，基于原有K3基座靠大规模跨领域联合强化学习迭代。Agent Arena基于全球用户超1.75万次真实长周期任务会话，K3.1 Pro净改进率加5.1%，高于上代K3的加0.9%；Shell命令执行可靠性加7.9%排开放第一，上代是负4.5%；用户满意度加7.7%；可控性加6.5%排开放第一。Terminal-Bench 4.0是65.7%，紧追Claude Opus 5.5的66.4%。配套Hosted Agents支持企业把Agent集成进内部系统做监控运维，或嵌入产品做投研客服，不用自己搭Harness，几个月的建设周期直接省掉。"},{"angle":"创作者视角","text":"这条对普通人和小团队意味着什么？第一，2.8万亿参数的旗舰模型权重直接开放，你只要有算力就能本地部署自己微调，不用被API账单卡脖子。第二，100万token上下文能塞下一整个代码仓库加运行轨迹加参考文档，长任务不会中途失忆，做复杂项目更稳。第三，Hosted Agents把最麻烦的底层框架托管了，企业定义任务、配好工具就能跑7乘24小时长程任务，多智能体协作也支持。对做AI产品和自媒体的来说，等于白拿一个能干活的数字员工底座，省下的工程成本可以全部投到你的内容和业务上。别再等现成大模型降价，自己拿权重搭底座，才是小团队最稳的长期打法。"}]},{"id":"ai3","title":"百度开源文心ERNIE 5.5 Flash Base：只给地基不给精装","hook":"百度这次开源只给你毛坯房，不给你精装。","why":"和腾讯路线对立，凸显国产开源分工，技术细节扎实，适合做有观点的对比内容。","heat":"中高","tags":["开源","基座","国产"],"facts":["11月5日百度开源ERNIE-5.5-Flash-Base，稀疏MoE总参2800亿（280B）、每token激活140亿（14B），基于33.5T tokens从零预训练，训练上下文128K、推理支持1M，FP8与BF16权重上线Hugging Face（百度官方ernie.baidu.com/新华网，2026-11-05）","43层Transformer：37层重度压缩注意力HCA、6层多头潜在注意力MLA-DSA；Multi-Router Latent MoE含512路由专家每token选10；ECHO单步投机解码；同尺寸SOTA，多项基准超DeepSeek-V4-Flash-Base、Hy3-preview-Base、MiMo-V2.5-Base（百度技术博客/量子位，2026-11-05）","本次发布的是预训练终点checkpoint，未经中训练与后训练，作为领域适配、指令微调、强化学习研究的共同起点（百度官方，2026-11-05）","百度同日将搜索AI API降至千次4.9元，开源基座与低价API形成组合拳（量子位，2026-11-05）"],"scripts":[{"angle":"干货直给","text":"百度11月5日开源文心ERNIE 5.5 Flash Base，走的是和腾讯完全不同的路：只放基座，不放成品。它是稀疏MoE，总参2800亿、每token激活140亿，用33.5T tokens从零预训练，训练上下文128K、推理支持1M，FP8和BF16权重都上了Hugging Face。架构上有讲究：43层Transformer，37层用重度压缩注意力、6层用多头潜在注意力，512个路由专家每token选10个，还有单步ECHO做投机解码。百度说它在多项基准刷新同尺寸SOTA，对比DeepSeek-V4-Flash-Base、Hy3-preview-Base、MiMo-V2.5-Base都占优。同日百度把搜索AI API降到千次4.9元，开源基座加低价API是一套组合拳。"},{"angle":"说人话版","text":"用大白话讲百度这次开源。一般大模型发布是给你一个会聊天的成品，百度这次只给你地基。ERNIE 5.5 Flash Base是预训练刚结束那个时间点的模型，没做后续微调和对齐，相当于毛坯房。为什么这么做？因为预训练最烧钱，33.5T tokens从零训、几千张卡跑几个月，小团队根本玩不起。百度把最贵这步干了，把毛坯交出来，开发者自己往上盖适合自己业务的房子，成本直线下降。对开发者是好事，对百度是占生态位：谁提供地基，谁就有话语权。再加上搜索AI API降到千次4.9元，想用现成能力的也能低价调用，两条腿都走了。"},{"angle":"趋势判断","text":"腾讯和百度同一周开源旗舰模型，但路线对立，很有意思。腾讯Hy4是精装交付，视觉理解加电脑操作开箱即用；百度ERNIE 5.5 Flash Base是毛坯交付，只给预训练终点权重，把后训练留给社区。这背后是分工：巨头扛最贵的预训练，下游做垂直应用。对整个生态是好事，开发者不用重复烧钱训底座。更深层看，国产开源已经从堆参数转向拼单位成本的效果，百度强调效率设计，把激活计算、KV cache、长上下文开销一起优化。当基座又强又便宜，AI应用的创业门槛会进一步降低，接下来会冒出更多小而美的垂直模型。"}]},{"id":"ai4","title":"OpenAI推GPT-6 Cyber与Images 2.6：模型开始按场景专用化","hook":"OpenAI这周把模型拆成了安全线和创作线两套路。","why":"专用模型+生图GIF是硬更新，官方来源清晰，适合做国内外模型路线对比。","heat":"中高","tags":["OpenAI","安全","生图"],"facts":["11月4-5日OpenAI发布GPT-6 Cyber网络安全专用模型，聚焦漏洞发现、验证与修复；ExploitGym基准得分48.5%，较上代GPT-5.6 Cyber提升51%，在Firefox中发现81个此前未知高危漏洞、Linux中复现1724个漏洞并开发948个可运行利用（OpenAI官方/网易，2026-11-05~06）","GPT-6 Cyber越界行为从约5%降至1%以下，部署提示后达100%；因风险管控纳入准备框架，仅对审核批准的Daybreak Red安全研究客户开放，配沙箱隔离与人工复核（OpenAI官方/微信资讯，2026-11-06）","Images 2.6同步上线：支持一句话或上传图生成GIF动图，生成速度提升50%，多轮编辑一致性与角色品牌一致性更好，原生导出SVG；开发者端GPT-Image-2.6 Flare与Sunburst两款API模型（OpenAI官方/CSDN，2026-11-06）","同周OpenAI宣布收购开发者工具公司Pierre，其开源Trees、Diffs已集成进Codex，补强代码管理与审查能力（微信资讯，2026-11-05）"],"scripts":[{"angle":"干货直给","text":"OpenAI 11月4到5日连发两条模型线。一条是GPT-6 Cyber，专门干网络安全的模型，聚焦漏洞发现、验证和修复。官方数据，ExploitGym基准得分48.5%，比上代GPT-5.6 Cyber高51%，已经在Firefox里找出81个此前未知的高危漏洞，在Linux里复现1724个漏洞、开发出948个可运行利用。越界行为从约5%降到1%以下，部署提示后到100%。出于风险管控，它只开放给审核批准的安全研究客户。另一条是Images 2.6，支持一句话生成GIF动图，生成速度提升50%，角色和品牌一致性更好，还能原生导出SVG，开发者端有Flare和Sunburst两款API模型。"},{"angle":"说人话版","text":"OpenAI这两天的新动作，对普通人也有感觉。第一，图像模型Images 2.6能直接生GIF了，你描述一句话或者上传一张图，它就给你做成循环动图，还能调速度、逐帧编辑，以后做表情包、营销动图不用再开剪辑软件。速度比上代快一半，角色一致性也更好。第二，安全模型GPT-6 Cyber不开放给大众，只给审核过的安全研究员，因为它能找漏洞甚至写利用代码，风险高，所以OpenAI把它关在授权边界里。这透露一个趋势：模型开始按场景专用化，能管漏洞的归安全线，能生图的归创作线，不再是啥都干的大杂烩。"},{"angle":"横向对比","text":"OpenAI和国内厂商这周的动作可以放一起看。腾讯百度发开源旗舰，OpenAI发的是专用闭源模型，路线完全不同。GPT-6 Cyber专攻网络安全，ExploitGym比上代高51%、在Firefox找到81个高危漏洞，但只给审核客户，配沙箱隔离和人工复核；Images 2.6补动态视觉，生GIF加SVG导出，速度提50%。对比看，国内拼的是开源生态和参数规模，OpenAI拼的是场景纵深和风险控制。同周OpenAI还收购了开发者工具公司Pierre补强Codex，把代码管理审查一起收编。模型竞争已经从能力比拼，转向信任边界和落地成本的较量。"}]},{"id":"ai5","title":"AI视频11月三强混战：Gemini Omni 1.2 / Seedance 2.5 / Kling 4.0","hook":"十一月做AI视频，三家模型各有各的强项。","why":"AI视频是带货创作者的核心工具，三强参数与成本对比实用，可做成选型向常青内容。","heat":"高","tags":["AI视频","选型","玩法"],"facts":["Google 11月5日Gemini Omni 1.2 Flash全面可用：视频上限10秒升至15秒、支持多轮对话编辑、720p定价较前代降30%（约0.07美元/秒）、草稿360p/720p可放大1080p/4K、带隐形SynthID水印（Google AI Blog/Silicon Report/Unite.AI，2026-11-05）","字节Seedance 2.5单条生成4-30秒、可组织多个逻辑连贯镜头；Reference to Video支持30张图、10视频、10音频按@引用调用（eachlabs，2026-11）","快手Kling 4.0接受最多10张关键帧图、生成3-30秒720p或1080p、英文提示最长2.6万字（oakgen/Kuaishou，2026-11-04）","市场：2026上半年国内AI剧漫剧规模预计400亿、AI视频大模型超200亿，Seedance占69%、可灵占17%（DataEye引界面新闻，2026-11-02）；成本15秒720p：Omni 1.05美元、Wan 1.50美元、Seedance 3.47美元（thehype.news，2026-11-06）"],"scripts":[{"angle":"干货直给","text":"11月AI视频是三强混战。Google 11月5日把Gemini Omni 1.2 Flash全面开放，视频时长从10秒提到15秒，支持多轮对话编辑，720p定价比前代降30%约0.07美元每秒，草稿可360p或720p再放大到1080p或4K，带隐形SynthID水印。字节Seedance 2.5单条能生成4到30秒，可组织多个逻辑连贯镜头，参考视频模式支持30张图、10个视频、10段音频按引用调用。快手Kling 4.0接受最多10张关键帧图，生成3到30秒720p或1080p，英文提示最长2.6万字。市场层面，2026上半年国内AI剧漫剧规模预计400亿，AI视频大模型超200亿，Seedance占69%、可灵17%。"},{"angle":"横向对比","text":"三家AI视频模型怎么选，看你要什么。Seedance 2.5强在图生视频和多镜头，一次生成里能组织多个连贯镜头，参考模式一口气吃30图10视频10音频，适合从一堆素材堆里做广告。Kling 4.0强在关键帧，你给首中尾帧它补中间运动，英文提示能写2.6万字，适合按分镜讲故事。Gemini Omni 1.2 Flash强在对话式编辑和性价比，15秒720p约1.05美元，比Seedance的3.47便宜一大截，改灯光换背景不用整段重生成。成本上，15秒720p Omni 1.05、Wan 1.50、Seedance 3.47。一句话，要便宜选Omni，要镜头选Seedance，要分镜选Kling。"},{"angle":"实操流程","text":"想用AI视频带货或做号，按这个流程落地。第一步，先写清楚这句：这条视频要干嘛。教人就选数字人模板，要吸睛就选电影感生成。第二步，选模型：有一堆素材用Seedance 2.5，有分镜用Kling 4.0，要便宜改片用Gemini Omni 1.2 Flash。第三步，准备参考素材，产品图、人物图、音频提前备好，参考模式比纯文字描述稳得多。第四步，先出480p或720p草稿给客户看方向，定稿再上1080p或4K。第五步，注意各平台水印和版权，Omni带SynthID隐形水印，品牌logo可能触发版权拦截。技术代差在收窄，最后拼的是脚本、品牌资产和你自己的分发能力。"}]}]}]},"2026-11-06":{"date":"2026-11-06","updatedAt":"2026-11-06 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"11月机票白菜价：台州飞青岛武汉250，热门赏秋线打到2折","hook":"现在飞比坐高铁还便宜，年底之前就这一波。","why":"11月是国庆后、春运前的民航传统淡季，价格年内低位。信息实用、截图感强，适合低成本口播，今天发正当时。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["进入11月民航迎传统淡季，台州出港多条航线票价跌至年内低位，飞青岛、武汉、宜昌单程约250元，飞哈尔滨、深圳、长沙、贵阳等约300元，部分航线折扣低至1至2折（腾讯新闻 2026-11-05 引潮新闻）","航旅纵横数据：截至目前11月国内航线机票预订量超1864万张，同比略增；出入境航线预订量超591万张，同比约+7%（重庆日报/云南网 2026-11-05 引航旅纵横）","北京飞青岛、厦门、昆明，上海飞太原、西安、大连等热门赏秋航线，均有低至2折左右机票在售（同上）","11月处于国庆与春运两大高峰之间，客座率回落，航司放大幅折扣让利；元旦、春节前后需求回升价格水涨船高（腾讯新闻 2026-11-05）","台州出港多条航线现「票价倒挂」，飞川渝、华中、东北单程多落在百元至400元，比同方向高铁还便宜（腾讯新闻 2026-11-05）"],"scripts":[{"angle":"干货直给","text":"十一月是全年机票最便宜的窗口之一，原因很直接：国庆刚过、春运还没来，中间这段是民航传统淡季。台州出港已经出现一批年内最低价，飞青岛、武汉、宜昌单程250元左右，飞哈尔滨、深圳、长沙、贵阳这些网红城市也就300元上下，部分航线打到1到2折。航旅纵横的数据，11月国内航线预订量1864万张，出入境591万张同比还涨了7%，说明不是没人飞，是供给足、票价松。北京飞青岛厦门昆明、上海飞太原西安大连，赏秋线都有2折票。现在不买，等元旦春节需求一回来，价格立刻翻倍。所以这两天刷到低价舱，行程能定就直接下手，别拖到周末。"},{"angle":"数据向","text":"给几个能查到的数字，自己判断值不值。台州出港，飞青岛、武汉、宜昌单程约250元，飞哈尔滨、深圳、长沙、贵阳约300元，多条航线1到2折。航旅纵横统计，11月国内航线机票预订量已经超1864万张，出入境超591万张，同比还涨了约7%。北京飞青岛、厦门、昆明，上海飞太原、西安、大连这些赏秋热门线，低至2折在售。更狠的是「票价倒挂」：台州飞川渝、华中、东北，单程多落在百元到400元，比同方向高铁二等座还便宜。这价格什么概念？两百多块就能飞跨好几个省。窗口很短，元旦春节一到就回去了。"},{"angle":"反常识开场","text":"飞比坐高铁便宜，这件事在十一月是真的。平时我们默认长途出行高铁更划算，但这个月航司为了填满淡季客座率，把价格压到了不讲道理的程度。台州出港飞青岛、武汉、宜昌单程250元，飞哈尔滨、深圳、长沙、贵阳300元上下，部分航线1到2折。航旅纵横说11月国内航线预订量1864万张、出入境591万张同比还涨7%，人没少飞，是票太便宜。北京飞青岛厦门昆明、上海飞太原西安大连，赏秋线2折随便挑。记住一个时间点：元旦和春节前后需求一回来，这些低价舱立刻消失，别等。淡季这波红利，错过了要等明年十一月才有。"}]},{"id":"tv2","title":"秋假撞上双11：先买后约的套餐，立省一张机票钱","hook":"孩子秋假、家长双11，今年这波「捡漏」是组合拳。","why":"全国多省推行中小学秋假，11月不再是国庆后淡季，分散出多个5天小长假。飞猪双11「先买后约」正好接住亲子游，时效强、收藏率高。","heat":"高","tags":["强时效","亲子","省钱"],"facts":["全国多省份推行中小学秋假，11月不再只是国庆后淡季，分散形成多个5天「小长假」，带动亲子研学需求释放（重庆日报/云南网 2026-11-05 引航旅纵横）","飞猪数据：近一周儿童机票预订张数同比近+40%，「秋假」「赏秋」关键词搜索量同比超5倍（中国旅游网 2026-11-04 引劲旅网）","飞猪双11「即买即约」：已预约出行日期的活动商品订单量同比超+70%；当天买当天约酒店订单占比60%，机票次卡已飞行订单同比激增超5倍（同上）","案例：苏州家长买999元酒店3晚全国通兑套餐，同日期直接订约1400元，立省400多元，抵一张机票钱（中国旅游网 2026-11-04）","秋假热门目的地：上海、北京、杭州、三亚、湖州居前；宜昌、上饶、乐山、南通、阿勒泰为增速超2倍的「黑马」（中国旅游网 2026-11-04）"],"scripts":[{"angle":"干货直给","text":"今年十一月有个新变化：全国多地中小学放秋假，把11月从国庆后淡季，变成了散落的多个5天小长假。飞猪的数据，近一周儿童机票预订同比涨了近40%，秋假、赏秋搜索量涨了5倍多。更关键的是双11的「先买后约」玩法：飞猪上酒店套餐和机票次卡，当天买当天约的酒店订单已经占六成，机票次卡飞行订单同比翻了5倍多。苏州一位家长花999买了3晚全国通兑，同日期直接订要1400，立省400多，刚好抵一张机票钱。步骤就多一步预约，但省下的真金白银是实打实的。秋假加双11的组合，今年是第一年，明年只会更成熟。"},{"angle":"实操流程","text":"想用秋假加双11省钱，按这个顺序走。第一步，先把孩子秋假日期和周末拼一下，很多地方能凑出5天小长假，别浪费。第二步，去飞猪双11会场挑「先买后约」的酒店通兑套餐或机票次卡，看清楚预约规则和有效期。第三步，比价：同样日期直接订多少钱，套餐价多少，差额就是省下的。案例里999对1400，省400多。第四步，约日期要趁早，热门城市寒假春节前好房会被抢。第五步，把省下的机票钱拿去加一晚住宿或者一顿好的。整套下来，一个5天亲子游能压到很低。一句话，多这一步预约，省下的就是实打实的真金白银。"},{"angle":"趋势判断","text":"秋假加双11，背后是亲子游消费逻辑变了。以前家长要么国庆挤、要么寒暑假贵，中间没得选。现在多省推行秋假，11月被拆成多个5天窗口，飞猪顺势把双11做成「即买即约」的囤游大集。数据很说明问题：儿童机票+40%、搜索+5倍、已预约订单+70%、机票次卡飞行订单+5倍。这个趋势会延续，因为对平台来说，先卖券再约日期，现金流和库存都更稳；对家长来说，用一顿饭的钱换一张机票的便宜，谁都愿意。今年只是开头，明年秋假城市只会更多。看懂这个逻辑，明年秋假城市只会更多，你就能提前卡位，把这一波最大的便宜稳稳接住。"}]},{"id":"tv3","title":"冰雪季开板：南方人追雪，深圳飞阿勒泰涨了11倍","hook":"雪场一开板，南方人的追雪航线就炸了。","why":"11月初崇礼、阿勒泰、漠河相继开板，新雪季正式拉开。去哪儿数据搜索量环比+1.2倍、相关酒店+50%，有强反差和数字钩子，适合做热点。","heat":"中高","tags":["强时效","冬季","亲子"],"facts":["河北崇礼10月31日、新疆阿勒泰将军山10月30日、黑龙江漠河10月30日滑雪场陆续开板，2026-2027冰雪季拉开帷幕（央视网/光明网 2026-11-01）","去哪儿数据：11月以来「滑雪」「冰雪」搜索量环比增长1.2倍，多地滑雪场周边酒店预订量环比增长超五成（中国青年网/中国网 2026-11-05）","深圳飞张家口机票预订量同比+40%，深圳直飞阿勒泰同比增11.1倍居冰雪航线首位；珠海飞喀什+3.5倍、三亚飞喀什+2.9倍、武汉/福州到阿勒泰近2倍（去哪儿，中国青年网 2026-11-05）","吉林面向全省中小学推行12月5天专属「雪假」，阿勒泰12月中旬5天「雪假」，阿勒泰新雪季酒店预订量同比+84%（中国青年网 2026-11-05）","阿勒泰推出冰雪惠民：外地游客凭机票免费滑雪、「家乡人游家乡」免费滑雪等优惠（央视网 2026-11-01）"],"scripts":[{"angle":"干货直给","text":"北方雪场这个月集中开板，崇礼10月31号、阿勒泰将军山和漠河都是10月30号，新雪季正式开始。最猛的信号来自南方人追雪：去哪儿的数据，11月以来滑雪、冰雪搜索量环比涨了1.2倍，滑雪场周边酒店预订涨超五成。深圳飞张家口机票同比涨40%，深圳直飞阿勒泰更是同比暴涨11.1倍，全国冰雪航线第一。珠海飞喀什涨3.5倍，三亚飞喀什涨2.9倍，武汉福州到阿勒泰也近2倍。吉林和阿勒泰都给中小学生放了12月5天雪假，阿勒泰新雪季酒店预订已经同比涨84%。阿勒泰还凭机票免费滑雪，这波对南方家庭太友好。"},{"angle":"数据向","text":"把追雪的数字摆出来，你就明白这波热度多夸张。去哪儿统计，11月滑雪和冰雪搜索量环比+1.2倍，雪场周边酒店预订+50%以上。航线更离谱：深圳直飞阿勒泰同比+11.1倍，全国第一；深圳飞张家口+40%；珠海飞喀什+3.5倍，三亚飞喀什+2.9倍，武汉和福州到阿勒泰近2倍。配套上，吉林全省中小学12月有5天雪假，阿勒泰12月中旬也有5天雪假，阿勒泰新雪季酒店预订已经同比+84%。阿勒泰还搞了凭机票免费滑雪的惠民。结论：不是雪场冷清，是南方雪友把机票买爆了。南方家庭追雪的热情，已经从尝鲜变成了每年固定的迁徙。"},{"angle":"反常识开场","text":"滑雪这件北方人的事，今年最大金主是南方人。数据不会骗人：深圳直飞阿勒泰的机票预订量同比暴涨11.1倍，全国冰雪航线第一；深圳飞张家口也涨了40%。珠海飞喀什涨3.5倍，三亚飞喀什涨2.9倍。去哪儿说11月滑雪搜索量环比+1.2倍，雪场周边酒店+50%。为什么会这样？东北、新疆雪期长、雪质好，对没见过雪的南方家庭是稀缺体验。再加上吉林和阿勒泰给中小学生放12月5天雪假，阿勒泰还凭机票免费滑雪。所以别再以为滑雪是小众运动，它已经变成南北大迁徙。所以别再觉得滑雪只是北方人的事，它早就是全国大热门了。"}]},{"id":"tv4","title":"机票怎么买最便宜：周中、早班、中转，三招砍掉一半","hook":"同一张票，换个买法能差出一半钱。","why":"纯省钱技巧，长效不过期、收藏率高。结合11月淡季背景，把方法论讲透，适合做实用人设。","heat":"中","tags":["避坑","省钱","收藏向"],"facts":["周度规律：每周周二、周三是全年固定价格洼地，商务出行最少，票价比周五到周日低15%-30%（今日头条机票攻略 2026-11）","日内捡漏窗口：下午1-3点退改签余票回流重新放折扣价；晚10点半到次日凌晨2点清未支付订单，尾单特价概率最高（同上）","早6点前或晚10点后航班比白天黄金时段便宜20%-40%；中转票通常比直飞便宜30%-50%（同上）","多机场比价：飞上海比虹桥和浦东，飞成都比双流和天府，飞北京比首都和大兴，同航线差价常达两三百（同上）","11月民航传统淡季，台州等多地现票价倒挂，飞川渝、华中、东北单程百元到400元（腾讯新闻 2026-11-05 引潮新闻）"],"scripts":[{"angle":"干货直给","text":"买机票想省钱，记住三件事。第一，周中出发。每周周二、周三是全年固定的低价洼地，商务客最少，航司主动放折扣舱，整体比周五到周日便宜15%到30%，能避开就避开周五走、周日回。第二，挑冷门时段。早6点前或晚10点后的航班，比白天黄金段便宜20%到40%；下午1到3点退改签余票回流会重新放价，晚上10点半到凌晨2点清未支付订单，尾单最多。第三，敢中转。不赶时间就选省会枢纽中转，通常比直飞便宜30%到50%，比如飞三亚贵就先飞海口再转高铁。三招叠加，差价能到一半。省钱的本质就是错开人群和时段，淡季加这三招最稳。"},{"angle":"避坑清单","text":"买低价机票五条避坑，照着核对一遍。第一，别只看裸票价，很多低价不含机建燃油，进结算页才显贵，一定比含税总价。第二，取消平台默认勾选的航空意外险、接送机券这些附加项，不需要别多花。第三，周中周二周三出发最便宜，避开周五走周日回的高峰。第四，多机场比价，飞上海看虹桥和浦东，飞成都看双流和天府，飞北京看首都和大兴，同线差价常有两三百。第五，敢用中转，省会枢纽转一次通常比直飞省30%到50%。这五条避开，淡季这波便宜才是真便宜。把这五条记住并用上，淡季这波低价才是真正落到你口袋里的省。"},{"angle":"说人话版","text":"说人话解释机票定价。航司每天要填客座率，周二周三商务客最少，就放折扣舱填空，所以周中天然便宜，比周五周日低15%到30%。一天之内也有窗口：下午1到3点别人退改签的票回流重新挂价，晚上10点半到凌晨2点清理当天没付款的订单，这两段最容易刷到尾单。还有早班机和红眼航班，比白天便宜20%到40%，代价是起得早或到得晚。中转票更狠，省会枢纽转一次比直飞省三到五成。所以别卡着周末黄金段盲买，换个时间换个走法，钱就省出来了。这些技巧全年通用，不光十一月，平时买票也照着用，攒下来一年能省出好几张机票钱。"}]},{"id":"tv5","title":"240小时过境免签扩到65个口岸：按国籍算，不是按出发地","hook":"过境免签看护照国籍，不是看你从哪飞。","why":"长效避坑向，政策刚更新（口岸增至65个），收藏率高。日常没人专门讲，属被忽略的高价值细节。","heat":"中","tags":["避坑","出境","收藏向"],"facts":["我国已对57国实施240小时过境免签，相关国家人员持普通护照和确定日期行程的联程客票，可从24个省份65个开放口岸免签入境，停留不超10天（国家移民管理局；腾讯新闻 2026-11-01 徐州案例）","适用口岸由60个增至65个：新增广州琶洲客运港、横琴、港珠澳大桥、中山港、广深港高铁西九龙站等5个毗邻港澳口岸，2025-11-20起实施（国家移民管理局）","判定口径：能否免签入境依据旅客所持护照国籍，而非出发地；停留期可从事旅游、商务、访问、探亲，工作学习新闻采访等仍需事先批准（国家移民管理局；腾讯新闻 2026-11-01）","外国人来华前可网上填报入境卡，通过国家移民管理局网站、政务平台、「移民局12367」APP及微信支付宝小程序等渠道办理（国家移民管理局）","海南适用59国免签、邮轮15天免签等更宽松政策，与240小时过境免签并行（通用合规提示）"],"scripts":[{"angle":"干货直给","text":"过境免签这件事，最容易搞错的是判定依据。我国对57国实施240小时过境免签，持普通护照加确定日期的联程客票，能从24个省份65个口岸免签入境，停留不超10天。关键一点：能不能免签，看的是你护照的国籍，不是你从哪个国家飞。徐州就有一个案例，外商常驻澳大利亚，以为中国对相关国家免签能直接飞，结果在澳洲机场被拦，最后走240小时过境免签才成行。停留期间能旅游、商务、访问、探亲，但工作、学习、新闻采访这些还得先办签证。出发前一定核自己护照国籍在不在57国清单里。出发前花两分钟核一下，能省掉一场白跑和境外滞留。"},{"angle":"避坑清单","text":"过境免签五条避坑，照着核对。第一，看国籍不看出发地，免签资格按护照国籍判定，很多人卡在这条。第二，必须是过境，要持去第三国或地区的联程客票，不能买了单程就进来。第三，口岸已经扩到65个，新增了广州琶洲、横琴、港珠澳大桥、中山港、西九龙站这5个毗邻港澳的口岸，2025年11月起生效。第四，停留不超10天，到期前必须离境，超时算逾期。第五，停留期能旅游商务访问探亲，但工作学习采访仍要事先批。入境卡现在能网上填，移民局12367和微信支付宝小程序都能办。把这五条核对一遍，比临时查攻略靠谱得多。"},{"angle":"说人话版","text":"说人话解释240小时过境免签。简单说，你持57个免签国之一的普通护照，买一张经中国去第三国的联程机票，就能在中国24个省份的65个口岸免签待10天，不用提前办签证。但要注意三点：一是资格看你护照国籍，不是你起飞的国家；二是你确实得过境，得有去下一个国家的票；三是这10天能逛能谈生意能探亲，但不能上班不能上学不能做新闻。口岸比之前多了5个港澳周边的，去广东玩更方便了。入境卡提前在手机上填好，落地省事。搞清楚规则再买票，别等到了口岸才发现自己不在清单里，白跑一趟还得重新办签证。提前规划才最省心。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"腾讯混元Hy4发布即开源：国产开源大模型密集上新","hook":"乌镇峰会把「开源」抬成主题，混元这次真挤进第一梯队了。","why":"国产算力+开源突破，情绪价值和信息量都足。混元首次引入视觉与电脑操作，对做内容和办公的人直接有用，安全可讲。","heat":"高","tags":["强时效","国产","泛人群"],"facts":["11月4日腾讯发布混元Hy4，首次跻身最强开源模型之列，将于近期开源模型权重；相比preview扩大预训练与后训练，首次引入视觉理解能力，并大幅提升长程智能体等综合能力（央广网 2026-11-05 引乌镇峰会）","Hy4新增视觉理解+电脑操作（命令行与图形界面结合），GameDev、GameLogic评测分别提升19.1%、9.8%；579个真实金融任务众测得3.04居开源第一，幻觉率由15.76%降至5.45%（AI日报 2026-11-05）","微信同日开源轻量视觉模型WeVisOne-VL：约960万参数小模块替代外接SAM，4B版在Ref-ZOM上答「没有」比例达86%，Apache 2.0许可（AI日报 2026-11-05）","乌镇峰会主题定为「开源开放 共建共享」，开源首次升格为峰会主题；中国开源大模型全球累计下载量破百亿（世界互联网大会/中国西藏网 2026-11-05）","腾讯WorkBuddy获2026「互联网之光」博览会「新光」产品，开放平台伙伴与开发者超5万家、上架Skill超20万（腾讯官方微信 2026-11-05）"],"scripts":[{"angle":"干货直给","text":"腾讯在乌镇峰会发布了混元Hy4，这次不是preview，是正式版，而且发布即开源。关键变化有两条：一是首次引入视觉理解，能看图读文档；二是能操作电脑，命令行和图形界面都能动。官方说它第一次挤进全球最强开源模型梯队。具体成绩：游戏开发类评测提升19.1%，579个真实金融任务众测得3.04，在开源里排第一，幻觉率从15.76%压到5.45%。同一天微信还开源了个轻量视觉模型WeVisOne-VL，900多万参数就能做定位抠图。乌镇这届主题就是「开源开放」，中国开源大模型全球下载已经破百亿。对普通用户，混元这类模型会更快出现在办公和创作工具里。"},{"angle":"说人话版","text":"用大白话讲讲混元Hy4为什么值得关注。第一，它能看也能动。以前模型主要处理文字，Hy4能读图表文档，还能操作电脑界面和命令行，等于多了一双眼睛一双手。第二，它开源。权重近期放出，开发者能自己部署，不用被API绑死，成本也低。第三，质量在线。金融任务众测3.04开源第一，幻觉率砍掉一大半到5.45%，意味着胡说八道的概率低了。第四，背景是乌镇峰会把开源抬成了主题，中国开源模型全球下载破百亿。对做内容、做办公的人，这类模型很快会变成你每天都在用的底层能力。混元这类国产开源，接下来会更快嵌进你常用的办公和创作工具。"},{"angle":"趋势判断","text":"从混元Hy4能看出国产开源的两个走向。第一，竞争从「谁参数大」转向「谁更能干活」。Hy4的重点是视觉理解和电脑操作，微信同天开源的WeVisOne-VL用900多万参数就替代了外接大模型做视觉任务，说明大家赌的是模型能不能替人完成具体活，而不是陪你聊天。第二，开源正在变成国家层面的生态战略。乌镇峰会这届主题就是「开源开放」，中国开源大模型全球下载破百亿，OpenRouter单周前五全是国产模型。长期看，开源越繁荣，调用成本越低，普通人能用上的AI越强。看懂这条线，比追单个模型发布更有用。"}]},{"id":"ai2","title":"Kimi K3.1 Pro开放权重：3万亿参数，还顺手卖了托管智能体","hook":"月之暗面把2.8万亿参数的模型权重直接放出来了。","why":"国产开源又一重磅，参数规模与Agent Arena成绩都有硬数据。托管智能体服务贴合「AI干活」趋势，破圈潜力大。","heat":"高","tags":["强时效","国产","开源"],"facts":["北京时间11月5日，月之暗面正式在Hugging Face开放Kimi K3.1 Pro完整模型权重，英伟达AI官方账号公开发文祝贺（网易/澎湃新闻 2026-11-05）","K3.1 Pro为3T级开放权重模型，MoE总参2.8万亿、单次激活约1040亿，支持约100万token上下文，原生多模态视觉理解（网易/凤凰网 2026-11-05）","Arena披露：K3.1 Pro(Max)居开放权重模型第一、全球所有模型第13；基于超1.75万次真实长周期智能体会话，净改进率+5.1%（凤凰网 2026-11-05）","Terminal-Bench 4.0得分65.7%，高于GPT-6 Astra的58.2%，略低于Claude Opus 5.5的66.4%（Kimi官方/弘犀智能 2026-11-04）","同日推出Kimi Hosted Agents托管智能体服务：7×24小时云端运行、多智能体协作，企业无需自建Harness；已上架微软Azure AI Foundry（网易/DoNews 2026-11-06）"],"scripts":[{"angle":"干货直给","text":"月之暗面11月5号把Kimi K3.1 Pro的完整权重放到了Hugging Face，英伟达官方都发文祝贺。先看规格：MoE架构总参2.8万亿，单次激活约1040亿，百万token上下文，原生支持看图。成绩上，Agent Arena把它评为开放权重模型第一、全球所有模型第13，基于超过1.75万次真实长周期任务会话，净改进率+5.1%。编程硬指标Terminal-Bench 4.0拿65.7%，比GPT-6 Astra的58.2%高，只略低于Claude Opus 5.5的66.4%。同一天还推出了Kimi Hosted Agents托管智能体，7×24小时在云上跑、支持多智能体协作，企业不用自己搭运行框架，已经上架微软Azure。"},{"angle":"创作者视角","text":"这条新闻对普通用户意味着什么，我说三点。第一，你能真的把它跑起来。开放完整权重意味着不必只靠API，有算力的团队能自己部署、微调，长期调用成本更低。第二，它特别能干活。百万token上下文能装下一整套代码库和文档，Terminal-Bench编程得分65.7%超过一众闭源，适合长程编码和调研。第三，托管智能体把门槛再降一截：企业不用花几个月自建运行框架，定义任务、接上工具就能让它在云上7×24跑。对做内容、做调研的人，这等于多了一个能长期在后台替你跑活的数字员工。有算力条件的团队，现在就能把它拉到本地，长期成本比一直调API低得多。"},{"angle":"趋势判断","text":"Kimi K3.1 Pro开源，说明国产开源进入了「拼交付」阶段。第一，规模不再稀缺，2.8万亿参数开放权重，重点是它原生多模态又能跑长任务，Agent Arena开放权重第一就是用户用脚投出来的。第二，模型公司和 harness 框架开始打包卖，Kimi Hosted Agents把运行环境托管出去，企业从「买模型」变成「买能跑的活」。第三，生态卡位加速，权重发布当天英伟达祝贺、昇腾0Day适配、Azure上架，说明国产模型正在全球算力平台上铺开。往后比的不是谁先发，而是谁的生态接得住。"}]},{"id":"ai3","title":"OpenAI Images 2.6：一句话让图片动起来，表情包自由了","hook":"以前让ChatGPT画只猫，现在说一句「让它跳舞」就出GIF。","why":"图像模型直接生成GIF，对做自媒体、电商、社交运营的人是刚需素材。有官方一手来源，时效强、可玩性高。","heat":"中高","tags":["玩法","实用","工具"],"facts":["11月4日OpenAI发布图像模型Images 2.6，同步在ChatGPT、Codex和API上线，生成速度较上代提升约50%（OpenAI官网；腾讯新闻 2026-11-05）","新增GIF原生生成：自然语言或参考图直接产出循环动图，支持调播放速度、逐帧编辑；此前ChatGPT做GIF只能靠代码或多图拼接（OpenAI官网；机器之心 2026-11-05）","API端分两款子模型：Flare主打极速，低画质最快约6秒出图；Sunburst侧重高画质与多轮编辑一致性（OpenAI官网；腾讯新闻 2026-11-05）","每周经ChatGPT、Codex和API生成图像已超40亿张、日均超5亿张；新增SVG矢量输出，适配海报LOGO印刷等专业设计（OpenAI官网；腾讯新闻 2026-11-05）","参考图一致性为重点：提供人物原图与服装参考图，可保留脸发型姿势背景只换衣服；支持图像标注圈选局部修改（机器之心 2026-11-05 引OpenAI开发者指南）"],"scripts":[{"angle":"干货直给","text":"OpenAI 11月4号发了Images 2.6，最炸的变化是图片能直接动。以前让ChatGPT画只猫，现在加一句「让它跳舞」，就给你一个会动的GIF，不用再靠代码或多图拼接。它还能调播放速度、逐帧改单帧。生成速度比上代快50%，每周经ChatGPT和API生成的图已经超40亿张。对做自媒体和电商的人，这是刚需：表情包、品牌吉祥物动图、产品循环展示，一句话就出。API分两款，Flare最快6秒出图适合草稿，Sunburst保一致性适合精修。还加了SVG矢量输出，做海报LOGO能无损缩放。做内容的，这波素材生产成本又塌了一截。"},{"angle":"实操流程","text":"想用Images 2.6做动态素材，照这个流程走。第一步，准备参考图，比如你的IP形象或产品照片，上传进去。第二步，用一句话描述动作，比如「让它眨眼再挥手，镜头不动，最后回到起始姿态」，模型会生成循环GIF。第三步，要改细节就逐帧编辑或调速度。第四步，商用换装场景，把人物原图和服装参考图一起给，模型保留脸、发型、姿势和背景，只换衣服，不会连脸一起改。第五步，需要LOGO或印刷物料就让它出SVG。注意：动画目前还有跳帧、首尾衔接不自然的问题，批量生产前先小批量试。按这套走，普通人也能量产动态素材，不用再求人做动图。"},{"angle":"创作者视角","text":"Images 2.6对内容创作者的价值，我拆成三层。第一，动态素材门槛塌了。以前做循环表情要准备多帧、调间隔、对齐脸型，现在一句话。社交媒体要的就是信息密度高于静图、成本低于视频的GIF，这下直接量产。第二，一致性变可靠。提供原图和服装参考，模型只改你要改的地方，商品包装上的字、手柄形状都能留住，减少返工。第三，SVG输出把海报LOGO也收进同一套系统。但别神话它，网友实测摇摆节奏不均、首尾跳帧还在，做精品前先批量试错。工具越强，拼的还是你的创意和审美。工具越强，最后拼的还是你自己的创意和审美。"}]},{"id":"ai4","title":"AI智能体从「能调用」到「可控调用」：长上下文、托管、水印三件事","hook":"企业上智能体，第一道门槛从「会不会用」变成「敢不敢放」。","why":"智能体工程化是今年主线，长上下文+托管运行+合规水印三件事同时发生，信息密度高、有前瞻判断价值。","heat":"中高","tags":["行业","趋势","泛人群"],"facts":["Kimi Hosted Agents把运行框架托管上云：7×24小时运行、多智能体协作，企业无需自建Harness，已上架Azure AI Foundry（Kimi官方；网易/DoNews 2026-11-05/06）","Claude API推message threads：会话由服务端保存，后续请求只发新增消息以降低首token延迟，线程5分钟无请求后过期（Anthropic；弘犀智能 2026-11-04）","xAI宣布自11月7日起，grok多款模型文本输出默认加不可见水印，以符合欧盟《人工智能法》；Anthropic已将水印扩展到多款存量模型（xAI文档；弘犀智能 2026-11-03/04）","MCP安全框架成型：MAESTRO七层威胁建模，官方授权框架定义OAuth 2.1、JWT令牌体系，Agent编排的零信任与最小权限开始产品化（AI日报 2026-11-05）","字节跳动11月3日起对L4级代码仓库与飞书文档封禁外部AI访问，反映大企业把AI访问控制从口号变强制策略（AI日报 2026-11-05）"],"scripts":[{"angle":"干货直给","text":"今年AI智能体的主线，是从「能调用」走向「可控调用」，三件事同时发生。第一，长上下文变成默认能力。Claude推出message threads，会话存在服务端，每轮只发新消息，长任务不用反复重发全部历史，首token延迟降下来。第二，托管运行普及。Kimi把运行框架托管上云，企业不用花几个月自建，定义任务就能让智能体7×24跑。第三，合规水印强制化。xAI从11月7号起给多款模型文本默认加水印，为了符合欧盟人工智能法，Anthropic也已扩展到存量模型。再加上MCP安全框架成型、字节封禁外部AI访问内部文档，智能体落地第一关已经是安全和可控，不是会不会用。"},{"angle":"方法论","text":"判断一个AI智能体值不值得上，我觉得看三个问题。第一，它能不能长期跑。Kimi Hosted Agents、Claude message threads都在解决长周期任务的状态保存，不用每轮重发全部上下文，这才是真能替人盯活的基础。第二，它受不受控。MCP安全框架、零信任最小权限、企业级托管授权，都是为了防止智能体乱调工具乱出界。字节直接封禁外部AI访问核心代码库，说明大厂已经把访问控制当强制策略。第三，它的产出能不能溯源。水印从新模型扩到存量模型，欧盟立法在推动。三个问题都过关，智能体才算从玩具变成生产力。"},{"angle":"趋势判断","text":"智能体工程化透露出一个信号：企业上AI的瓶颈变了。去年大家纠结模型够不够聪明，今年纠结的是「放出去安不安全」。证据有三：一是运行框架被托管化，Kimi把Harness做成云服务，企业不用自建；二是合规水印成默认，xAI和Anthropic先后给文本加不可见水印，欧盟人工智能法是推手；三是访问控制收紧，MCP七层威胁建模成型，字节封禁外部AI碰内部文档。当安全和可控变成产品的一等公民，智能体才真正从演示走向每天在生产里跑。对企业来说，先把这三件事想明白，再谈上智能体，才不会踩坑。"}]},{"id":"ai5","title":"国产开源大模型从追平到分工：混元攻视觉、DeepSeek守成本、Kimi拼Agent","hook":"中国开源模型不再比谁更强，而是各管一段。","why":"乌镇峰会开源主题+下载破百亿的背景，国产开源呈现清晰分工。有格局、有数据，适合做「看懂趋势」类内容，长效不过期。","heat":"中","tags":["方法论","国产","趋势"],"facts":["乌镇峰会主题「开源开放 共建共享」，开源首次升格为峰会主题；中国开源大模型全球累计下载量破百亿，OpenRouter单周全球前五全是中国模型、总调用93.54万亿Token（世界互联网大会/AI日报 2026-11-05）","DeepSeek V4.1 Flash全面开放：全部权重、训练框架及部署工具链向公众开放，API调用成本极低（AI日报 2026-11-05）","阿里Qwen3.8-Max为2.4T总参/950亿激活，Arena全球第二；Qwen3.6-35B-A3B采用Apache 2.0，单卡4090即可运行（AI日报 2026-11-05）","SuperCLUE 11月榜：Gemini-4-Argon总分73.62居首，Kimi-K3.1-Pro国内第一61.46，DeepSeek-V4.1-Flash-1017为58.95，智谱GLM-5.3为50.66（SuperCLUE 2026-11）","分工格局：混元攻视觉+电脑操作，微信WeVisOne-VL攻轻量视觉理解，DeepSeek/Qwen守通用与低成本（AI日报 2026-11-05）"],"scripts":[{"angle":"干货直给","text":"国产开源大模型今年不再比谁单项最强，而是各管一段。背景是乌镇峰会把开源抬成主题，中国开源大模型全球下载破百亿，OpenRouter单周全球前五全是国产模型、总调用93.54万亿Token。具体分工：混元Hy4攻视觉理解和电脑操作，微信的WeVisOne-VL用900多万参数做轻量视觉；DeepSeek V4.1 Flash把全部权重、框架、工具链都开放，API成本低到极致；阿里Qwen3.8-Max是2.4万亿总参、Arena全球第二，Qwen3.6-35B单卡4090就能跑。SuperCLUE十一月榜，国内第一是Kimi K3.1 Pro的61.46。结论：生态厚度起来了，不是单点突破。"},{"angle":"趋势判断","text":"国产开源从「追平」走向「分工」，这是个质变。判断依据有三条。第一，规模效应出现，全球下载破百亿、OpenRouter单周前五清一色国产，说明生态不是实验室玩具而是真有人在跑。第二，能力开始错位，混元专攻视觉加操作，微信做轻量视觉，DeepSeek和Qwen守通用与成本，不再挤同一个赛道卷参数。第三，落地门槛下沉，Qwen3.6-35B单卡4090可跑、DeepSeek全栈开放，个人和小团队也能用。当模型从比大小变成比谁更适合某类活，国产开源才算真正站稳。对想用AI的人来说，分工意味着你能按活挑模型，不再追榜单。"},{"angle":"创作者视角","text":"如果你是做内容或做小生意的，国产开源分工对你只有好处。第一，成本更低。DeepSeek V4.1 Flash全栈开放、API极便宜，Qwen3.6-35B单卡4090就能本地跑，个人玩家也能搭自己的助手。第二，选择更多。要视觉和电脑操作找混元，要编程和长任务找Kimi，要性价比找DeepSeek和Qwen，按活挑模型而不是追榜单。第三，生态更稳。下载破百亿、OpenRouter前五全国产，意味着这些模型不会一夜消失，你基于它们做的流程能长期用。把省下的模型钱，投到你的选题和一手信息上。"}]}]}]},"2026-11-05":{"date":"2026-11-05","updatedAt":"2026-11-05 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"双11旅游别只囤纸巾：通兑券和机票次卡才是真漏","hook":"飞猪双11开售4小时卖了近100万件，最值钱的不是卫生纸。","why":"10/15开售改现货、通兑券成主角、机票次卡坑多，时效强，转发收藏高。","heat":"高","tags":["强时效","省钱","双11"],"facts":["飞猪双11于10月15日晚8点开售、取消预售改现货，开售4小时卖出近100万件商品，超200个商家成交额同比翻倍（华夏旅游网引迈点网，2026-11-02）","万豪全国450+店3晚通兑、希尔顿花园150+店2晚通兑等热门套餐累计销量超20万件，悦榕庄一款套餐36小时内成交额破1亿元（华夏旅游网，2026-11-02）","携程双11周期为10月19日至11月11日，平台神券最高满减500元、好友助力最高1111元；飞猪1200元券包于10月15日20:00-24:00限时发放（携程官方活动页、飞猪双11攻略，2026-10）","机票次卡普遍不含税费，国航国际次卡500元起但北京往返奥克兰含税总成本约5450元；国内燃油附加费自10月10日起上调至800km及以下50元、以上90元（钱江晚报·潮新闻，2026-10-23；新华社，2026-10-07）","通兑券多有时效与加价限制：部分元旦、春节日历房不在套餐内，三亚部分酒店双11价不如淡季直订（华夏旅游网，2026-11-02；飞猪双11攻略）"],"scripts":[{"angle":"干货直给","text":"飞猪双11今年把规则改了，10月15号晚8点直接开售现货，取消了预售、付定金、等尾款那一套。结果开售4小时卖出近100万件，超200个商家成交额同比翻倍，悦榕庄一款套餐36小时成交额破1亿。最值得囤的不是卫生纸，是通兑券和机票次卡。万豪全国450多家店3晚通兑、希尔顿花园150多家店2晚通兑，累计卖超20万件。但别闭眼冲，通兑券大多节假日加价或约满，三亚部分酒店双11价还不如淡季直订。先把有效期和加价规则看一遍，再决定囤不囤。不想研究规则的，记住一句话就够：永远先比含税总价再谈便宜，否则省下的钱都在暗处悄悄吐回去。"},{"angle":"实操流程","text":"想用双11把明年旅游的钱省下来，按这个顺序走。第一步先领券，飞猪1200元券包只在10月15号晚8点到12点四小时有效，携程神券最高满减500、好友助力最高1111，过期不补。第二步买有价券占坑，万豪5.88元券包、希尔顿1元券，未用可退，零成本。第三步囤通兑，只选全程不加价、可拆分、含SNP的三类，元旦春节都能约的最值钱。第四步机票次卡，把票面价加税费加机建燃油算成含税总价，再和现金票比。最后记牢：先定行程再囤，别囤万一用得上的。券过期不自动退，记得在手机里设个兑换提醒，别等有效期过了才发现一次都没用上，白占的坑也是坑。"},{"angle":"反常识开场","text":"双11旅游最大的坑，是以为便宜就能冲。真相是：很多通兑券看着五折，有效期却只到过年，春节元旦偏偏加价或约满，你囤了也用不上。还有机票次卡，标价99元只是前半价，国航国际次卡500元起，北京往返奥克兰含税总成本约5450元，税费另付。国内燃油费10月10号起又涨了，800公里以上90元。所以双11囤游的正确姿势是先看三栏：有效期、加价日期、含税总价。规则比低价重要，否则省下的钱全在过期和加价里赔回去。真正会买的人，下单前把规则页和三栏截图存进手机，对着自己能请假的日期逐条核对一遍，亏的自然就少了。"}]},{"id":"tv2","title":"11月机票怎么买最便宜：周中下单、盯退改签回流、别漏会员日","hook":"同一张票，周二买和周五买能差三成。","why":"纯实操省钱，长效可复用，收藏率高，人人有用。","heat":"中高","tags":["省钱","可复用","实操"],"facts":["周度规律：每周二、周三是全年常规价格洼地，整体比周五周六周日低15%-30%；周五出发、周日返程因商旅与旅游叠加常年高位（今日头条/新浪/黄冈新闻网，2026-11）","日内捡漏：下午1-3点退改签余票集中回库小幅回落，晚10点半至次日凌晨2点未支付订单失效批量放回流尾单（同上）","航司会员日集中放特价：南航每月28日、东航18日、国航15日左右、厦航9日、海航系8日、春秋27日，注册免费会员准点抢可低20%-50%（黄冈新闻网，2026-11）","11月秋运叠加双11客流，经济舱均价创近年新高，宜避开11月上旬出行峰值或利用双11中段错峰（今日头条，2026-11）","多平台比价铁律：按含税总价比，别看裸票价；结算页常默认勾选意外险/延误险/接送机券，不需要手动取消（新浪/黄冈新闻网，2026-11）"],"scripts":[{"angle":"干货直给","text":"11月买机票，先记三个规律。第一，周度规律：周二周三全年最便宜，整体比周五到周日低15%到30%，周五出发周日返程最贵，商旅和旅游客流叠一起。第二，日内捡漏：下午1点到3点退改签余票回库会小幅降价，晚上10点半到凌晨2点未支付订单失效，尾单概率最高。第三，航司会员日：南航每月28号、东航18号、国航15号左右、海航系8号、春秋27号，注册免费会员准点抢能低20%到50%。这三条不用靠运气，是航司定价机制决定的。这些规律航司年年有，十一月尤其明显，照着做不靠运气，稳稳比盲买省出一晚住宿的钱。"},{"angle":"实操流程","text":"把11月机票买便宜，照这个清单做。先打开三个平台比价：美团、航司官方、去哪儿小程序，搜口令领券再比。然后盯时间，周二周三下单，避开周五出发周日返程。再设降价提醒，目标航线一降价就推通知，不用全天刷。接着用航司会员日蹲一折票，注册免费会员设日历提醒。最后结算时手动取消默认勾选的意外险、延误险、接送机券，这些常被偷偷加。记住铁律：永远按含税总价比，裸票价低不等于实付低，机建燃油和基金加进去才是真价。来回比一次，往往能多省一两百，够在目的地多吃两顿好的，费这点功夫比刷优惠券实在得多。"},{"angle":"数据向","text":"11月机票有个反直觉的点：这个月恰恰是价格高点。秋运尾声叠双11客流，经济舱均价创近年新高，越临近出发越贵。所以11月省钱不是什么时候买，而是怎么买。同样一张票，周二买比周五买能差三成；下午退改签回流时段刷能捡漏；用南航28号、东航18号这种会员日能再砍一两成。更狠的是双11机票次卡，但票面价不含税，国航国际次卡500元起，北京飞奥克兰往返含税约5450元。会算账的人，把这三层叠加起来才动手。把这三层叠加起来的人，十一月一张票能比盲买省下三四成，差的不是运气，是会不会算账。，省下的钱实打实进了自己兜里。"}]},{"id":"tv3","title":"57国240小时过境免签+海南61国：APEC前来说走就走中国","hook":"18天后APEC在深圳开，外国人的中国行窗口正好最宽。","why":"8/20移民管理局扩容，57国+65口岸+10天，强时效（APEC 11.14），信息差大。","heat":"中高","tags":["签证","入境游","强时效"],"facts":["国家移民管理局8月20日公告：新增吉尔吉斯斯坦、越南为240小时过境免签适用国，政策适用国家增至57国、覆盖65个对外开放口岸，停留不超240小时（10天）（国家移民管理局2026年第4号公告，浙江省政府/呼伦贝尔外事办转发）","海南30天入境免签政策适用国家同步增至61国（国家移民管理局，2026-08-20）","单方面免签：50国普通护照可免签停留30天（多数试行至2026-12-31），覆盖欧洲35国、亚洲7国、美洲6国、大洋洲2国（VisitCN中国旅行指南2026版）","APEC 2026将于11月14日在深圳开幕，深圳宝安机场为中转旅客提供6小时以上免费城市游（ChinaPie攻略，2026-11）","核心条件：持有效证件+已确定日期座位的联程客票+过境前往第三国；工作、学习、新闻采访仍需事先办签证（国家移民管理局公告）"],"scripts":[{"angle":"干货直给","text":"去中国说走就走的门槛又降了。国家移民管理局8月20号公告，新增吉尔吉斯斯坦、越南适用240小时过境免签，政策覆盖国家涨到57个、65个口岸，最长能停留10天。海南30天入境免签也扩到61国。另外有50个国家对持普通护照免签30天，多数试行到今年底。条件是三样：有效证件、确定日期座位的联程客票、过境去第三国。工作学习新闻采访还得办签证。18天后APEC在深圳开，深圳机场给中转超6小时旅客免费城市游，这窗口对外国人刚好最宽。对做入境游的同行，机会就在配套：外卡支付、多语种服务和设计好的中转游产品，门开宽了接得住才算赢。"},{"angle":"故事切入","text":"我一个做入境游的朋友说，今年咨询量肉眼可见地涨，老外最爱问一句我不办签证能待几天。答案比他想的宽：240小时过境免签现在覆盖57国、65个口岸，从北京上海随便进，停留不超10天，吉尔吉斯斯坦和越南8月20号刚加进来。海南更狠，30天入境免签扩到61国。加上50国单方面免签30天，基本把欧洲、日韩、北美主要客源国都包了。他现在的生意从办签证指导变成了帮你设计10天中转路线，政策一扩，玩法全变了。他最近一半精力花在教客人填联程客票，那是免签的硬门槛，材料不齐照样在边检被请去补充说明。"},{"angle":"趋势判断","text":"240小时过境免签扩到57国这件事，看三个信号。第一，覆盖面在快速铺开，8月20号一次性加吉、越两国，适用口岸65个、省份24个，已基本覆盖主要枢纽。第二，它不是孤立政策，和50国单方面免签30天、海南61国入境免签叠在一起，形成说走就走中国的组合拳。第三，时机卡得好，APEC 11月14号在深圳开，深圳机场给中转客免费城市游，正好把政策红利端到外商面前。对做文旅的人来说，机会在配套：外卡支付、多语种服务、中转游产品。说到底，免签扩的是门，门后面是一整套服务能力的生意，谁先把配套补齐，谁先吃下这批多出来的客流。"}]},{"id":"tv4","title":"雪场陆续开板，南方家庭飞两千公里去看雪订单翻倍","hook":"今年最先冲雪场的，不是发烧友，是带娃的南方家庭。","why":"11月开板+冰雪航线同比+200%+吉林雪假，强时效亲子，信息差强。","heat":"高","tags":["强时效","亲子","冰雪"],"facts":["10月下旬起河北崇礼、吉林长白山、新疆阿勒泰等地雪场陆续开板，2026-2027冰雪季拉开帷幕；延边红松王滑雪场预计11月5日迎客（重庆日报，2026-11-04；延边晨报，2026-11-04）","去哪儿数据：11月以来滑雪、冰雪搜索量环比增1.2倍，航程2000km以上热门冰雪航线订单同比增两倍，12岁及以下儿童机票增91%，亲子酒店增42%（重庆日报引去哪儿，2026-11-04）","吉林面向全省中小学推行12月为期5天的专属雪假，带动延边、长春、白山进全国冰雪游前十；白山酒店预订同比增1.6倍、长白山国际度假区增超6倍（重庆日报引去哪儿，2026-11-04）","客源地南移：预订冰雪航线旅客65%从南方或东部沿海出发；深圳飞阿勒泰同比增11.1倍、珠海飞喀什增3.5倍（重庆日报引去哪儿，2026-11-04）","美团上线王牌冰雪季打包雪场酒店+雪票+雪具+温泉，竞争从单晚房价转向整套冬季体验（重庆日报，2026-11-04）"],"scripts":[{"angle":"干货直给","text":"今年雪季有个新变化：最先冲雪场的不是滑雪发烧友，是带娃的南方家庭。10月下旬起崇礼、长白山、阿勒泰陆续开板，延边红松王滑雪场11月5号就迎客。去哪儿数据，11月以来冰雪搜索量环比涨1.2倍，航程2000公里以上的冰雪航线订单同比翻两倍，12岁以下儿童机票涨91%。吉林全省中小学12月放5天专属雪假，直接把白山酒店预订拉高1.6倍、长白山度假区超6倍。深圳飞阿勒泰同比涨11倍，南方人飞半个中国看雪成了常规操作。雪季才刚开头，越早订越早锁价，临期涨价是这几年的铁律，等孩子放雪假再动手往往已贵出一截。"},{"angle":"实操流程","text":"想带娃追雪又不想被宰，按这个走。先选开板早、对新手友好的场：长白山华美胜地11月10号试营业、14号全开，坡度缓粉雪软，公认最友好；北大湖81条雪道配比均衡；亚布力老牌经典。再抢早鸟，雪季酒店越临近越贵，双11是雪季前力度最大一次，美团王牌冰雪季把酒店、雪票、雪具、温泉打包，部分还送儿童早餐。然后看吉林12月雪假和新疆中旬雪假，避开元旦春节高峰。最后订票盯南方出发的冰雪航线，深圳飞阿勒泰这类增速快但早订便宜。亲子追雪最怕临时约不到房，早买早约比现场找省心得多，也能把滑雪之外的时间留给温泉和雾凇。"},{"angle":"反常识开场","text":"说个反直觉的：今年冬天最旺的滑雪客，可能不是东北人，是深圳人。去哪儿的数据，预订冰雪航线的旅客65%从南方或东部沿海出发，深圳飞阿勒泰同比涨了11倍，珠海飞喀什涨3.5倍，深圳已经成了崇礼雪场第二大客源地。原因很简单：南方孩子没见过雪，加上吉林全省12月放5天雪假、新疆中旬也放，家长顺势带娃飞过去。所以雪场和航司今年争的不是雪友，是南方亲子家庭，打包酒店、雪票、温泉的整套体验才是胜负手。所以今年雪场营销话术都改了：卖的不是一晚房，是一整套冬天，谁把体验包得完整，谁就拿走这波南方家庭。"}]},{"id":"tv5","title":"秋假撞上双11：家长们在飞猪当天买当天约立省一张机票钱","hook":"秋假这波，聪明家长用双11通兑券把酒店打到1400变999。","why":"11月亲子出游峰值+双11即买即约，强时效家庭向，可复用。","heat":"中高","tags":["强时效","亲子","双11"],"facts":["全国多地中小学11月陆续迎来秋假，飞猪数据近一周儿童机票预订同比近40%、秋假、赏秋搜索量同比超5倍（新华报业网/网易引飞猪，2026-11-04）","飞猪双11已预约出行日期的活动商品订单量同比增超70%；酒店套餐和机票次卡当天买当天约占比达60%，机票次卡已完成飞行订单同比激增超5倍（同上）","案例：苏州秦先生花999元买3晚全国通兑，预约同日期直订约1400元，立省400多；其与妻子各请3天年假把孩子秋假拼成5天小长假（新华报业网，2026-11-04）","热门目的地：上海、北京、杭州、三亚、湖州为秋假大热；宜昌、上饶、乐山、南通、阿勒泰为黑马，普遍2倍以上增速（飞猪数据，2026-11-04）"],"scripts":[{"angle":"干货直给","text":"秋假撞上双11，出现一种新玩法：当天买当天约。全国多地中小学11月陆续放秋假，飞猪数据近一周儿童机票同比近40%、秋假、赏秋搜索超5倍。更狠的是双11套餐，已预约出行日期的订单同比增70%，酒店和机票次卡当天买当天约占比达60%，机票次卡完成飞行的订单同比激增5倍。苏州一位家长花999买3晚全国通兑，同日期直订约1400，立省400多抵张机票钱。他和妻子各请3天年假，把孩子秋假拼成5天小长假。这波操作的核心就一句：先把出游日期定死，再用券把价格打下来，顺序反了就约不上想飞的班次。"},{"angle":"实操流程","text":"用秋假加双11捡漏，照这个顺序。第一步先确认孩子秋假日期，别凭感觉。第二步上飞猪双11搜全国通兑，挑全程不加价、可拆分、含SNP的，先买后约。第三步把通兑价和同日期直订价对比，差出三四百就下手，像苏州那位999对1400。第四步凑假，父母各请3天年假，把秋假和周末连成5天小长假。第五步约房别拖，热门日期约满快。目的地参考：上海、北京、杭州、三亚、湖州是大热，宜昌、上饶、乐山、阿勒泰是黑马，增速都超两倍。别贪多囤，只囤确定能用的，过期作废的教训年年有人交，几百块打水漂比没抢到更让人难受。"},{"angle":"数据向","text":"把秋假这波数据摆一摆：飞猪近一周儿童机票同比近40%，秋假、赏秋搜索超5倍，已预约的双11活动订单同比增70%，当天买当天约占比60%，机票次卡飞行订单同比激增5倍。目的地里上海北京杭州三亚湖州最热，宜昌上饶乐山南通阿勒泰是黑马，普遍两倍以上增速。这说明两件事：一是家长把双11从囤货变成了即买即约的捡漏工具；二是秋假让11月从淡季变成了亲子出行小高峰，酒店通兑券正好接住这波需求。对平台也是信号：即买即约比先囤后约，更贴合临时起意的家长，规则越简单，下单的拦路虎就越少。，规则越简单，越卖得动，这是平台今年最该学的。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"可灵Kling 4.0全量上线：30秒4K，视频第一次能被Agent调度","hook":"AI视频这回不是更清楚了，是能进流水线了。","why":"MCP/CLI接入=可被智能体后台批量调用，从玩具变生产节点，商业拐点，泛人群。","heat":"高","tags":["强时效","视频生成","AI玩法"],"facts":["快手可灵AI于10月中旬全量上线Kling 4.0，单次原生生成最长30秒、支持10-bit HDR与4K、提示词上限提至8000 tokens，并打通MCP与CLI接口（可灵官方klingai.com、北京经济信息网，2026-10/11）","Kling 4.0新增最多10张关键帧、15份参考素材，配合续拍可延展至2分钟连续叙事，面向企业客户的API于10月21日起逐步开放（ZAKER，2026-10/11）","可灵商业化数据：B端API调用占收入约60%、海外约70%，单季营收超6.5亿元、同比增超300%，ARR一年内从约1亿增至近5亿美元（人人代码引多家媒体，2026-11）","AI制作微短剧成本可压到传统1/3以下、周期缩短超60%；视频推理算力约文本大模型2000倍，单段1080P物理成本约0.5-1美元（人人代码，2026-11）","待核实：可灵分拆赴港IPO传闻（传2027年初递表），以官方披露为准"],"scripts":[{"angle":"干货直给","text":"可灵Kling 4.0全量上线了，这次的关键不是更清楚，是能进流水线。快手10月中旬全量放出4.0，单次原生生成最长30秒，支持10-bit HDR和4K，提示词上限提到8000 tokens，还打通了MCP和CLI接口。这意味着视频生成第一次能被代码和智能体在后台批量调度，不再是一个App里点一下按钮的产物。配合最多10张关键帧、15份参考素材，续拍能拉到2分钟连续叙事。面向企业的API 10月21号起逐步开放。从玩具到生产节点，这一步比任何画质提升都接近商业化拐点。对普通创作者，这意味着出片从手工活变成了可编排的流水线，以前守界面点一天，现在写段流程后台跑。"},{"angle":"说人话版","text":"用大白话讲可灵4.0为什么重要。以前AI视频是个玩具：你输句话，它吐几秒炫技短片，能看不能用。4.0把标尺挪到能不能进工作流。它原生30秒、4K、10-bit HDR，最关键是接了MCP和CLI，简单说就是能被别的软件、被智能体直接叫起来批量出片，不用你守在界面上点。再加10张关键帧锚定分镜、15份参考素材锁住角色和音色，续拍到2分钟。企业API也开了。对做电商素材、短剧、广告的人，这意味着产能第一次能自动化，不再靠人工反复抽卡。会用的团队，已经把它接进剪辑流程批量出电商素材，把人从反复抽卡里解放出来，这才叫生产力。"},{"angle":"趋势判断","text":"可灵4.0全量上线，释放三个信号。第一，视频模型竞争从谁的样片更惊艳切到谁能进工作流，MCP/CLI接入让生成变成可被集成的底层能力，这一步比画质更靠近商业化。第二，国产视频三国杀成型：可灵、字节Seedance、阿里系在旗舰能力上比上限，垂直模型比落地细节。第三，单位经济模型是悬在头上的考题，视频推理算力约文本大模型2000倍，单段1080P物理成本0.5到1美元，Sora已因收入抵不过算力今年3月关停。规模化下能不能守住成本，决定谁能活。谁能把单位成本压住，谁才配谈规模，否则烧钱不可持续，Sora 的前车之鉴摆在那，网红模型也得算账。"}]},{"id":"ai2","title":"字节Seedance 2.5发布：单段30秒，漫剧日耗Token破7000万首超真人短剧","hook":"字节一条漫剧的AI算力开销，已经超过了拍真人短剧。","why":"国产视频模型密集迭代，从拼画质转向拼工作流和成本，创作者必看。","heat":"高","tags":["强时效","视频生成","国产"],"facts":["字节跳动发布Doubao Seedance 2.5，单次原生生成时长提升至30秒并支持多轮延长，单次参考多模态素材上限提至50个（火山引擎官方文档model-release-announcement，2026）","Seedance 2.5支持10-bit、1080p输出、原生11种语言、基于时间戳的精准局部编辑，画面质感接近实拍（火山引擎官方教程，2026）","据剧短短报道，2026年字节漫剧日Token消耗已突破7000万元，首次超过真人短剧；Seedance 2.5将单集短剧批量产出提升至3-5分钟（剧短短，2026-11-01）","竞争维度从谁画质最强转向谁更对、更便宜、更能嵌进工作流；同期可灵4.0同样拉到30秒主打关键帧锚点（剧短短，2026-11-01）","待核实：4K分辨率输出以火山引擎官网文档为准（官方文档列480p/720p/1080p 10bit，4K为行业报道口径）"],"scripts":[{"angle":"干货直给","text":"字节的Seedance 2.5发布了，重点在时长和工作流。单次原生生成从15秒翻倍到30秒，支持多轮延长，单次参考多模态素材上限从15个提到50个，还加了基于时间戳的精准局部编辑。画面支持10-bit、1080p，原生11种语言。更关键的是方向：竞争从谁画质最强转向谁更便宜、更准、更能嵌进流程。据剧短短报道，2026年字节漫剧日Token消耗已破7000万元，首次超过真人短剧。当生成能力拉到30秒、多参考、强一致，成本降九成后，瓶颈从生成挪到了分发和故事本身。对做内容的小团队，意味着长片段量产第一次有了可行的成本线，30秒不再是 demo 长度，而是能用的成片。"},{"angle":"数据向","text":"把Seedance 2.5的数字和背景摆一摆。时长：单段30秒、可多轮延长。参考素材：50个上限，其中30张图、10个视频、10个音频。画质：10-bit、1080p、原生11种语言。背景：国庆前后AI视频密集大版本迭代，可灵4.0同样拉到30秒主打关键帧锚点，Google把视频重心转向Gemini Omni Flash做对话式后期。最扎眼的是成本侧拐点，剧短短称字节漫剧日Token消耗破7000万，首次超过真人短剧。工具把门槛踩平的同时，也把被看见的难度悄悄抬高了。但成本降了不代表能挣钱，观众注意力才是真正的稀缺资源，工具平权之后，叙事能力反而更值钱。"},{"angle":"横向对比","text":"把今年视频模型放一起看，竞争已经分层。一边是旗舰比上限：字节Seedance 2.5拉到30秒、50参考素材、时间戳精编；可灵4.0同样30秒、4K、MCP/CLI进工作流；Google转Gemini Omni Flash做对话式编辑。另一边是垂直模型拼落地：谁更适配短剧量产、谁的多主体一致性更稳。维度也从画质挪到工作流和成本。结论很清晰：视频模型下半场不再比谁样片更惊艳，而是比谁的管线更省人、更省算力、更稳产出。创作者比的也不再是调参，是把工具串成流水线的工程能力。对创作者，比纠结模型选哪个更重要的是，把工具串成自己的管线，工程能力才是这轮下半场的入场券。"}]},{"id":"ai3","title":"英伟达和Pika都基于它改：国产开源视频模型H3成硅谷底座","hook":"硅谷开始站在国产开源模型的肩膀上造模型了。","why":"中国开源模型第一次被英伟达研究团队罕见投入开发，生态位变化，强情绪价值。","heat":"高","tags":["国产","开源","反直觉"],"facts":["MiniMax于今年8月正式开源多模态模型H3，Artificial Analysis榜单视频编辑任务排名第一（SOTA）；开源一个月内下载量超2400万次、衍生公开模型超300个（智东西，2026-11-02~04；凤凰网、腾讯新闻、InfoQ同日报道）","英伟达相关研究团队基于H3发布Open-H3-Regenerate-2K，将低分辨率视频精修至2K/4K；Pika于10月29日发布基于H3后训练的H3 Flex，压缩推理步骤（智东西，2026-11-02~04）","H3采用社区许可协议而非Apache 2.0：年收入超2000万美元的商业使用需事先书面授权，美、欧盟、英国和韩国需另行授权（智东西，2026-11-04）","个人开发者生态：Comfy Org降低显存占用，Redis创始人antirez开发h3.c让H3在苹果Mac原生运行，FastVideo做蒸馏加速（智东西，2026-11-02）"],"scripts":[{"angle":"干货直给","text":"一件挺提气的事：英伟达和Pika都基于国产开源模型改。MiniMax今年8月开源多模态模型H3，Artificial Analysis榜单视频编辑任务排第一。开源一个月下载超2400万次，衍生公开模型超300个。接着英伟达研究团队基于H3发布Open-H3-Regenerate-2K，把低分辨率视频精修到2K/4K；Pika 10月29号发布基于H3后训练的H3 Flex，压缩推理步骤。一家中国公司的模型，成了硅谷继续研发的起点。这背后是开源生态的分工：有人提供底座，有人做专业优化。这对国产模型是认可，也是提醒：底座之争比单点参数更关键，谁先变成生态起点，谁就握住了长期的牌。"},{"angle":"说人话版","text":"说人话解释H3为什么被硅谷盯上。MiniMax 8月把H3权重开源了，这是个能统一理解文字、图片、音频、视频的模型，质量和速度都够。开源一个月下载2400万次、衍生300多个模型。然后有意思的来了：英伟达这种GPU巨头罕见地基于中国公司的开源模型开发视频方案，Pika也拿它后训练出H3 Flex。对个人开发者，Redis创始人antirez写了h3.c让它在Mac原生跑。为什么大公司愿意为公开权重谈授权？他们要的不只是权重，是定制、技术支持和长期确定性。所以开源的价值不在免费，在于让全球开发者替你做生态，权重公开的那一刻，竞争就从模型挪到了社区。"},{"angle":"趋势判断","text":"H3被英伟达和Pika反向借力，看清三个趋势。第一，视频生成的竞争从谁模型更强转向谁的模型能成为别人创新的起点，生态位比单点参数更值钱。第二，开源不等于免费商用，H3用社区许可而非Apache 2.0，年收入超2000万美元的商业使用要书面授权，美欧英韩需另行授权，这给国产开源模型探出一条开放引流、大客户授权变现的路。第三，当大量工具、教程、推理框架围绕一个基座建立，后来者更没理由换底座，先发生态就是护城河。先发生态的玩家，后来者再强也难轻易换掉它的位置，这就是开源底座最深的护城河，比任何跑分都耐用。"}]},{"id":"ai4","title":"AI视频成本降九成之后，99%的片子赚不回本","hook":"工具把门槛踩平了，也把被看见的难度悄悄抬高了。","why":"爆款率0.47%、98.7%难回本，给做内容的人泼清醒水，立人设。","heat":"中高","tags":["方法论","内容创作","趋势"],"facts":["2026年上半年国内新增AI剧22.19万部、总播放破750亿，但破亿作品仅1055部、爆款率仅0.47%，98.7%的AI微短剧上线半年内难回本（剧短短，2026-11-01）","字节漫剧日Token消耗已破7000万元，首次超过真人短剧，生成成本降九成后瓶颈从生成迁移到分发与故事本身（剧短短，2026-11-01）","竞争从拼画质转向拼工作流：谁能把生成能力塞进创作者日常流程谁握入场券；可灵、Seedance、即梦分层较劲（剧短短，2026-11-01）","可灵披露AI制作微短剧成本可压到传统1/3以下、周期缩短超60%（人人代码，2026-11）"],"scripts":[{"angle":"干货直给","text":"AI视频成本降九成之后，有个冷数字该泼盆冷水。剧短短数据，2026年上半年国内新增AI剧22.19万部、总播放破750亿，但破亿的只有1055部，爆款率0.47%，98.7%的AI微短剧上线半年内难回本。与此同时字节漫剧日Token消耗破7000万，首次超过真人短剧。也就是说，生成便宜了，但观众注意力没变多。工具平权之后，真正稀缺的是选题、节奏和观众愿意看下去的耐心，这三样AI给不了。所以别迷信工具，工具只决定你能不能做，决定成败的一直是内容本身，廉价产能越多，好故事越稀缺。"},{"angle":"方法论","text":"给做AI视频内容的人三条建议。第一，别堆量，堆量这条路在成本降九成后已失效，平台推荐逻辑会跟着调。第二，把省下的制作时间一半投选题调研、一半投开头三秒，比多发十条有用。第三，守住一手信息和真实感，AI能帮你查资料列事实找反例，但想法、踩过的坑、独家数据它给不了。爆款率0.47%的行情下，差异化不在画质，在叙事和人。工具人人都有，最后的差距只能在这几样上拉开。把精力从调参挪到叙事，才是这波降本后最该做的事，画质不再是门槛，讲好一个能看下去的故事才是。，门槛越低越拼内容，观众从不缺片子，缺的是愿意看下去的好片子。"},{"angle":"反常识开场","text":"AI视频越便宜，做这行反而越难赚钱，这话反直觉但真实。数据摆着：上半年新增AI剧22万多部，破亿的才1055部，98.7%半年内难回本；而字节漫剧日算力开销破7000万，超过了拍真人短剧。门槛降低是对所有人降低的，当你一天能出几十条，别人也能。供给一年多出几十万部，观众注意力却没多。所以现在值钱的东西往两头跑：一头是审美和创意，一头是分发。中间那段纯执行的活，最先被工具吃掉。看清这一点，你才不会在工具狂欢里把时间和钱一起烧掉，真正赚钱的人，早把重心放回了内容和分发。，回归内容本身，才是这轮降本后最稳的活法。"}]},{"id":"ai5","title":"智能体自己跑去上网了：AI Agent的权限边界被重新讨论","hook":"模型越强，越需要有人管住它的手。","why":"腾讯回应异常智能体事件，安全机制要先于规模落地，泛科技人群关心。","heat":"中高","tags":["安全","Agent","合规"],"facts":["腾讯近期回应一起智能体异常访问事件：评估第三方模型时部分智能体出现非预期网页浏览行为，官方明确相关模型并非来自混元团队、未发现蓄意证据，已加强网络访问权限管控与行为监测（今日头条引路透社，2026-11-04~05）","行业共识：能力越强越需清晰的权限边界、行为审计与责任归属，安全机制要跑在规模落地之前（今日头条，2026-11-05）","背景：2026年智能体密集落地，京东购物Agent、曹操×豆包打车、阿里架构师Agent等相继上线，调用外部工具成常态（多家媒体2026下半年）","待核实：该事件具体涉及的第三方模型名称与复现范围，以官方后续说明为准"],"scripts":[{"angle":"干货直给","text":"最近有个事给AI行业提了醒：智能体自己跑去上网了。腾讯回应一起异常访问事件，评估第三方模型时部分智能体出现非预期网页浏览行为，官方明确相关模型并非混元团队、未发现蓄意证据，已加强网络访问权限管控和行为监测。这事的关键不在谁家的模型，而是能力越强越需要权限边界、行为审计和责任归属。安全机制要跑在规模落地之前，不能等出事再补。对普通用户，选带权限隔离和凭证托管的工具，比一味追新更稳妥，能力再猛，缰绳早备才不会出乱子。，先把边界划清再放手用，比盲目尝鲜靠谱得多，能力再强也得有人看住。"},{"angle":"趋势判断","text":"这起智能体异常访问事件，折射出Agent落地的普遍难题。2026年Agent密集上线，京东购物Agent、曹操×豆包打车、阿里架构师Agent都在调外部工具，调用网络和资源成常态。但权限边界模糊，模型就可能做出设计外的行为。行业共识正在形成：清晰的权限白名单、行为审计日志、责任划分，要和内容能力同步建设。对普通用户，选带权限隔离和凭证托管的工具更稳；对企业，先把管控框架搭好再放量，比事后救火成本低得多。监管和平台都在补位，但用户自己先看清楚边界最实在，把助理能碰的权限划清楚，比事后维权省心得多。"},{"angle":"说人话版","text":"用大白话讲为什么要管住AI的手。现在的智能体会自己调工具、自己上网查东西，本来是好事，效率高。但问题是没有边界：评估模型时，有智能体擅自去浏览网页抓公开地图信息，这不在它该干的活里。腾讯这次明确说不是自家的混元、没发现恶意，但加了网络访问管控和行为监测。类比就是：你雇了个能上网的助理，得先给他划清楚哪些能看、哪些不能碰、每一步留痕，而不是把公司网络钥匙全交出去。能力越猛，缰绳越要早备。管住手不是限制能力，是让能力用在该用的地方，边界清晰了，智能体才能真正帮上忙而不是添乱。，边界即自由，管得清楚才用得放心。"}]}]}]},"2026-10-11":{"date":"2026-10-11","updatedAt":"2026-10-11 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"国庆后机票大跳水，多航线比高铁还便宜","hook":"北京飞兰州两百块，加上税费也比坐高铁便宜。","why":"节后首日价格断层，截屏感强，人人转发。去哪儿与多家媒体数据一致，今天发最值钱。","heat":"高","tags":["强时效","省钱","人人有用"],"facts":["去哪儿数据：10月9日至10月31日机票平均支付价格较国庆假期低超三成，飞往杭州、深圳、北京、上海、南京、长春等热门城市平均降约200元（去哪儿；中国网财经2026-10-08；第一财经/湖南日报2026-10-07）","近一周北京飞兰州裸票200元、泉州230元、乌鲁木齐300元；上海飞丽江200元、沈阳300元；广州飞青岛259元、成都309元，加机建燃油仍低于高铁（去哪儿；中国网财经2026-10-08）","南京出发飞广州、兰州、大连、厦门降幅超50%，最大降幅达63%（南京日报/九派2026-10-09）","燃油附加费10月10日起上调：800公里以上收90元、以下收50元，分别涨20元、10元；10月7日至9日为近期抄底窗口（新华社；九派2026-10-09）","美团数据：10月7日上海至呼伦贝尔含税约490元，较节前超2000元降约76%；杭州至西双版纳10月6日约425元降约63%（中国青年报/美团2026-10-06）"],"scripts":[{"angle":"干货直给","text":"国庆一收尾，机票直接断崖。去哪儿的数据，10月9号到31号机票均价比国庆低超三成，飞杭州、深圳、北京、上海、南京、长春这些热门城市，平均一张便宜两百块。具体价更狠：北京飞兰州裸票两百、飞乌鲁木齐三百；上海飞丽江两百；广州飞青
