合京东旅行，携手国航、四川航空、成都航空、东海航空推出「一牌通达·安逸入川」活动，旅客凭登机牌可享全省50家景区专属优惠（达州政府/川观新闻/广元文旅 2026-08）","优惠有效期为乘机日次日0:00起连续7个自然日内有效（含第7日景区营业结束前），须本人证件与登机牌姓名一致、到达机场为四川省内机场（广元文旅 2026-08-10）","覆盖成都、宜宾、雅安、绵阳、眉山、凉山、乐山、广元、达州、巴中、阿坝11个市州；峨眉山、碧峰峡、剑门关、四姑娘山等多家5A在列（四川文旅厅/腾讯新闻 2026-08）","折扣力度：成都天台山、雅安碧峰峡、宜宾兴文石海等门票5折；蜀南竹海、光雾山、剑门关（法定小长假除外）8折；峨眉山中山区40元/人；绵阳九皇山免首道门票；阿坝达古冰川6.6折（四川文旅厅 2026-08）","达州巴山大峡谷套票免50元门票收70元交通、八台山/賨人谷门票5折、龙潭河漂流8折；广元剑门关8折、大蜀道·不夜三国城5折最高（达州政府/广元文旅 2026-08）","待核实：各景区具体预约方式与二消是否参与优惠，以景区官方平台及京东APP搜索「安逸入川」为准"],"scripts":[{"angle":"干货直给","text":"坐飞机去四川玩的人，落地之后别急着把登机牌扔了。8月1号到12月31号，四川文旅厅联合京东旅行，拉着国航、川航、成都航空、东海航空搞了个叫「一牌通达·安逸入川」的活动。你只要坐这四家航司的航班落地四川，凭登机牌加本人身份证，7天之内就能享全省50家景区的专属优惠，覆盖成都、宜宾、乐山、广元、阿坝等11个市州。力度是真不小：天台山、碧峰峡、兴文石海这些门票直接5折，剑门关8折，峨眉山中山区只要40块，绵阳九皇山更是免掉首道门票。有效期从乘机次日0点起算连续7天，而且必须是本人登机牌，别拿家人的去蹭。"},{"angle":"行程规划","text":"想用这张登机牌把四川玩透，可以这么排。第一天飞成都，落地先别扔牌，去天台山门票5折，晚上宽窄巷子逛吃。第二天飞抵广元或者绵阳，广元剑门关8折、昭化古城7.6折，绵阳九皇山免首道门票，顺道去看看唐家河。第三天往阿坝走，四姑娘山三沟联票150元、达古冰川6.6折，雪山草甸一次看够。整条线就靠一张登机牌撬动11个市州50家景区，7天有效期足够你跑两三个城市。提醒一句：每一站的优惠以景区现场为准，有一部分要提前在官方平台预约，登机牌只限本人用，出发前在京东搜「安逸入川」查清楚再走，别到了门口才发现没约上。"},{"angle":"反向劝退","text":"这张登机牌看着挺香，但有三条你别上头。第一，它不是免票，是优惠。绝大多数景区是5折到8折，像九皇山那种免首道门票的属于少数，索道、观光车这些二消还是照收，别以为一张牌就能全程免费。第二，7天有效期卡得很死。从乘机次日0点开始算连续7个自然日，超一天就作废，行程千万别拖。第三，只限本人。登机牌上的姓名要跟身份证一致，想帮家里人蹭优惠，得各自都有票才行。所以它适合本来就要飞四川的人顺手捡漏，专程为了这点优惠跨省飞过去并不划算。最舒服的玩法错峰在9到11月，人少酒店也便宜，登机牌的加成这时候才真的香。"}]},{"id":"tv2","title":"开学前两周是捡漏窗口，酒店能便宜三到五成","hook":"8月18号到28号，学生还没返校、暑期高峰已过，热门目的地酒店降三到五成、景区客流降三到六成。","why":"开学前两周是暑期最后一个宽松窗口，酒店降三到五成、客流降三到六成，对还想带娃出游或自己错峰的人直接有用。数据来自去哪儿、同程、途牛、航旅纵横等平台经多家媒体引用，可作为具体预订参考。","heat":"中高","tags":["错峰","开学季","酒店降价","亲子游","暑期尾声"],"facts":["8月中下旬进入暑期尾声错峰期，多家平台数据显示热门目的地酒店价格较旺季回落30%到50%，景区客流下降约30%到60%（去哪儿/同程 经多家媒体 2026-08）","开学前约两周（约8月18日至28日）是亲子家庭最后一个宽松窗口，不急于返校的学生与出游时间充裕的家庭可享更高性价比（航旅纵横/行业观点 经北京商报 2026-08-11）","8月20日之后被业界视为暑期黄金错峰期，机票与目的地参团价格同步下探（途牛 经中国网 2026-08-11）","避暑游热度仍高：木鸟民宿数据显示三伏天避暑游热度环比上涨180%，连住3天及以上订单占比60%（木鸟民宿 经中国网 2026-08-11）","待核实：具体降价幅度因城市与酒店而异，以各平台实时报价为准"],"scripts":[{"angle":"干货直给","text":"开学前这两周，是暑期最后一个能捡漏的窗口。8月18号到28号，学生还没返校、亲子出游的高峰已经过去，热门目的地的酒店价格比旺季回落了三到五成，景区客流也降了大概三到六成。机票和目的地参团的价格同步往下走，业内把8月20号之后叫做暑期的黄金错峰期。想带娃最后出去玩一趟，或者自己想安安静静溜达一圈，现在订比七八月便宜一大截。不过得提醒一句，这波降价是因城市、因酒店而异的，别拿某一个样本就当成全部，下单之前把同一个城市几家的平台都比一遍再下手，别被低价噱头带节奏。真正省到钱的，是那些提前盯、勤比价的人，暑假尾巴的便宜不等人。"},{"angle":"避坑清单","text":"开学前错峰订酒店，记牢四条。第一，认准时间窗。8月18到28号最松，再往后撞上开学返程和十一预热，价格又该抬头了，别拖到9月初。第二，别只盯房价。同一个城市核心区贵、地铁沿线便宜，郊区民宿可能比市区酒店省一半，带娃的要看通勤方不方便。第三，用学生认证。去哪儿、美团做完学生认证，全季、亚朵这类中端酒店能降到一两百，青旅民宿低到50到80一晚。第四，警惕低价陷阱。价格跳水的时候别冲动去订不可取消的房，先看退改条款，避免临时有变动血本无归。比价加上认证，这波操作能省下真金白银，别嫌麻烦。"},{"angle":"成本账","text":"算笔账你就知道这波到底值不值。七八月旺季的时候，热门城市全季能到四五百，做完学生认证开学前一两百就能拿到；青旅民宿平时八九十，现在五六十。一家三口住三晚，光房费就能省五六百到上千块。再加上机票和团价同步降，北京5天纯玩团比旺季低了大概两成。省下来的钱够你多玩一个景点，或者加一顿像样的。代价是要牺牲一点自由度——避开最高峰，就得接受部分商户歇业、夜游项目减少。对于不赶热闹的人来说，这笔交换相当划算，又安静又省钱，比硬挤在暑期顶上舒服太多，体验反而更好。这波窗口大概就十来天，想走就趁现在，过这村没这店。"}]},{"id":"tv3","title":"国际航线半年新开50条，入境游正变成出行红利","hook":"仅6月我国航司就新开国际航线50条，上半年国际航线客运超4000万人次、同比涨5.7%。","why":"国际航线半年新开50条、入境游客流创新高，是观察出行供给与出境、入境双向便利化的直观窗口。央视新闻一手来源，对计划出国或关注国内文旅升级的人都有参考价值。","heat":"中高","tags":["国际航线","入境游","出境游","免签","航线扩容"],"facts":["2026年以来在升温的入境游需求推动下，我国国际航线网络持续优化；仅6月航空公司就新开国际航线达50条（央视新闻/新闻联播 2026-08-10）","上半年国际航线完成旅客运输量超4000万人次，同比增长5.7%；国航、东航、南航近期新增复航至马德里、米兰、阿姆斯特丹等多条国际航线（央视新闻 2026-08-10）","中外航司国际客运航线通达全球五大洲80个国家177个城市，定期国际航线超1000条（民航局 经央视 2026-07-05）","免签朋友圈扩容叠加APEC会议预热，经深圳口岸出入境外籍人员截至8月4日突破500万人次，较去年提前近两个月；深圳机场前七月出入境外国人达110万人次创同期新高（央视新闻 2026-08-09）","待核实：具体航线班次与票价以各航司及订票平台实时信息为准"],"scripts":[{"angle":"干货直给","text":"今年的国际航线肉眼可见地变密了。央视8月10号报，光是6月这一个月，我国航司就新开了50条国际航线；整个上半年国际航线的客运量超过4000万人次，同比增长5.7%。国航、东航、南航最近陆续新增和复航了到马德里、米兰、阿姆斯特丹这些欧洲线。背后的推手是入境游需求在涨，老外来中国的人多了，航线自然就加密。对普通人意味着两件事：出国的选择更多了、票价也更卷了；入境游火了，国内景区和免税店的服务也在跟着升级。想趁着免签朋友圈扩容去周边国家转一圈，现在的航线比年初好选不少，不用再为了一个目的地折腾转机。"},{"angle":"趋势判断","text":"国际航线半年新开50条，释放的信号不只是多了几条线。第一，入境游在反过来推供给。老外涌入带动航司加密，深圳口岸前七月出入境外国人110万人次，创了同期新高，免签加上APEC预热是催化剂。第二，航司在抢出境恢复的红利。欧洲线一条条复航，说明长途出境的需求回来了，票价竞争只会更激烈。第三，对国内文旅是种倒逼。入境客多了，机场到景区的接驳、多语种服务、即买即退都会跟上。接下来中小城市也可能开更多国际点对点的航线，不止北上广。对普通人的好处很直接：出国更容易、回来也方便，航线网越密，出行的成本和麻烦都往下走。"},{"angle":"说人话版","text":"说句大白话，国际航线变多对你最直接的好处就是：出国玩更方便了，票也可能更便宜。以前想去个欧洲小城得转机折腾半天，现在马德里、米兰、阿姆斯特丹的直飞一条条开。反过来，老外也更容易来中国了，上半年老外来华坐飞机超过4000万人次，同比还涨了。这对咱们也有好处——入境游火了，免税店的即买即退、机场的服务都会升级，你出国回来在机场买东西也更顺。所以不管是自己出去，还是接待来的朋友，这条航线网越织越密，出行成本和麻烦都在往下走，是实打实的便利，不是什么虚的指标。往后航线只会更密，出行的选择也会越来越多，现在规划正合适。"}]},{"id":"tv4","title":"毕业旅行人均一千元，西南烟火线还是齐鲁海岸线","hook":"新浪攻略：成都到重庆4日约714元、青岛到济南5日约620元，学生证半价、准考证多地免票。","why":"毕业旅行预算攻略用具体路线数据（成都重庆714、青岛济南620）和三类省钱凭证，对毕业生及学生党直接可照做。新浪旅游样本数据清晰，且八月下半月正是错峰黄金期，时效吻合。","heat":"中高","tags":["毕业旅行","学生证","人均1000","西南","海岸线"],"facts":["暑期后半程（8月下半月）是毕业旅行错峰黄金期：学生证仍有效、景区人潮已退、住宿价格跳水（新浪旅游 2026-08-09）","路线对比数据：成都到重庆4日游人均约714元；青岛到济南5日游人均约620元，均在千元内（新浪旅游 2026-08-09）","省钱三张牌：学生证国内景区多半价、高铁7.5折且有毕业生专享；全国200多家景区凭高考准考证直接免票（黄山、老君山、长白山等）；完成去哪儿/美团学生认证后全季、亚朵等中端酒店可降到一两百元（新浪旅游 2026-08-09）","西南线适合吃货夜景党（宽窄巷子、洪崖洞对岸江滩免费），齐鲁线适合海滨摄影党（趵突泉学生票20元、八大关免费步行）（新浪旅游 2026-08-09）","待核实：具体花费因出行方式与个人消费而异，数据为攻略样本均值"],"scripts":[{"angle":"干货直给","text":"毕业生想穷游又怕踩雷，看这组数据就行。新浪8月9号整理过：成都到重庆4日游人均大概714元，青岛到济南5日游人均约620元，都在一千块以内。省钱有三张牌可以打：学生证国内景区大多半价、高铁7.5折还有毕业生专享；全国200多家景区凭高考准考证直接免票，黄山、老君山、长白山都在列；去哪儿、美团做完学生认证，全季、亚朵能降到一两百。西南线适合吃货和夜景党，宽窄巷子、洪崖洞对岸的江滩都免费；齐鲁线适合海滨和摄影党，趵突泉学生票20、八大关免费步行。而且八月下半月去最合适，人退了、价格也跳水了。"},{"angle":"成本账","text":"毕业旅行人均一千怎么花，拆开给你看。西南线成都重庆4天：宽窄巷子免费逛，预算全砸在火锅小吃上，高铁两城2小时相连交通费极低，住青旅民宿50到80一晚，4天714元能玩透。齐鲁线青岛济南5天：趵突泉学生票20、八大关免费、信号山5元，沿着红瓦绿树走到海边一路不花钱，住中端认证后一两百，5天620元。最大头的开销是交通和住宿，用学生证和准考证砍掉景区门票这一块，等于白省几百块。所以别一上来就报团，自己用这三张牌组合，千元出头就能跑满5到7天，比跟团自由，还比跟团省钱，体验完全不输。"},{"angle":"行程规划","text":"毕业旅行照这两条线走最稳。路线A是西南烟火线：成都宽窄巷子、火锅，高铁2小时到重庆，洪崖洞对岸大剧院江滩看夜景免费，再去贵阳吃酸汤。路线B是齐鲁海岸线：济南趵突泉20元、大明湖，高铁2小时到青岛，八大关免费步行、信号山5元、海水浴场看日落。两条都适合8月下半月，学生证、准考证还都有效，人潮也已经退了。提前把去哪儿、美团的学生认证做了，锁住低价房，景区门票能半价就半价、能免就免。记得带好学生证和准考证原件，有一部分景区要现场核验，别只带个手机照片，到时候进不去就尴尬了。路线不复杂，照着走基本不会踩坑，放心去。"}]},{"id":"tv5","title":"8月下旬最后一波降价，主角换成了避暑民宿和小城","hook":"途牛：8月中下旬价格降到平季，北京5天纯玩团比旺季降约20%；木鸟避暑热度涨180%、小城订单翻倍。","why":"8月下旬最后一波降价由民宿和小城承接，木鸟避暑热度涨180%、小城订单翻倍，是避暑游从「打卡名城」转向「住凉小城」的结构信号。途牛、木鸟数据经中国网/北京商报引用，对用户选目的地和 timing 有实操价值。","heat":"中高","tags":["错峰","避暑","民宿","小城","8月下旬"],"facts":["途牛：整体看8月中下旬很多价格降到平季，平台上北京5天纯玩团价格比旺季下降约20%（途牛 经中国网/北京商报 2026-08-11）","木鸟民宿：三伏天避暑游热度环比上涨180%，连住3天及以上民宿订单占比60%；温度偏低的西北、西南、东北成避暑黑马，玉溪、曲靖、宜宾、昭通、拉萨、黔西南、六盘水、丹东、喀什、西宁等小城民宿订单均翻倍增长（木鸟民宿 经中国网 2026-08-11）","避暑热度上升最快前十城：云南玉溪、云南曲靖、四川宜宾、云南昭通、西藏拉萨、贵州黔西南、贵州六盘水、辽宁丹东、新疆喀什、青海西宁（木鸟民宿 2026-08-11）","业内观点：8月20日之后是暑期黄金错峰期，不急于返校的学生、时间充裕的家庭可选性价比更高的错峰游（航旅纵横/行业观点 2026-08-11）","待核实：具体团价与民宿价格因产品与城市而异，以平台实时报价为准"],"scripts":[{"angle":"干货直给","text":"8月下旬最后一波降价来了，而且这次的主角从大酒店换成了民宿和小城。途牛说整体8月中下旬价格降到平季，北京5天纯玩团比旺季低了大概两成。木鸟民宿的数据更猛：三伏天避暑游热度环比涨了180%，连住3天以上的订单占了六成。最值得看的是小城——玉溪、曲靖、宜宾、昭通、拉萨、黔西南、六盘水、丹东、喀什、西宁这些地方的民宿订单直接翻倍。原因很简单：这些城凉快，又没有被大景区的拥挤和溢价。想避暑又想省钱，就别再挤大理丽江了，挑一个榜单里的小城住几天民宿，性价比高得多，体验也安静。这波降价不用抢，慢慢挑慢慢比，反而更划算。"},{"angle":"数据向","text":"这组数据说明避暑正在往小城跑。木鸟民宿：避暑热度环比涨180%，连住3天以上的订单占60%，说明大家不是逛一天就走，而是真的住下来。订单翻倍的前十城几乎全是凉都——六盘水19度、西宁高原、拉萨、喀什，温度低又没大景区的溢价。再看途牛那边，8月中下旬团价降到平季、北京5日团降两成，是个整体价格的拐点。两件事放一起看：需求从「打卡名城」转向了「住凉小城」，供给端的民宿刚好承接了这波转移。对游客来说，意味着避开人挤人的性价比之选在县级市；对想做民宿的人，小城凉资源现在正是一个红利窗口，值得盯。"},{"angle":"避坑清单","text":"冲小城避暑民宿，给你三个提醒。第一，别只看热度榜就冲。订单翻倍的小城配套未必跟得上，先查清楚有没有像样的餐馆、药店、打车，别到了才发现买瓶水都费劲。第二，确认凉是真的凉。六盘水、西宁确实低，但同一个省不同海拔差很多，下单前看当地的实时气温，别被「避暑胜地」的标签骗了。第三，连住优惠问清楚。连住3天以上的订单占六成，很多民宿连住有折扣，但退改比单晚严，行程定不下来就先订可改期的再换。八月二十号之后是黄金错峰，早订比临出发便宜，但也别盲目锁死不可退的房，留点余地更稳。宁可多花点时间选，也别为了省一点把自己套牢。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"Meta开源Muse Glimmer，300亿参数端侧Agent能住你电脑","hook":"8月10日 Meta 发布300亿参数开源 Agent 模型 Muse Glimmer，单张消费级显卡就能跑，Apache 2.0 协议。","why":"Meta 把300亿参数 Agent 模型开源到消费级硬件可跑，是端侧 AI 从聊天走向「能干活」的里程碑。多源一致（Meta、少数派、网易、腾讯研究院），对关注本地部署和隐私的人信息密度高。","heat":"高","tags":["Meta","Muse Glimmer","开源","端侧","Agent"],"facts":["8月10日 Meta 旗下 Superintelligence Lab 开源智能体大模型 Muse Glimmer，参数300亿（30B），专为无需云端的本地端侧 Agent 工作流设计（Meta/少数派/网易 2026-08-10至11）","采用 Apache 2.0 协议，权重已上 Hugging Face；经4bit量化仅需24GB显存即可运行且能力不打折，默认上下文窗口128K（Meta技术文档/网易/ZAKER 2026-08-11）","基于旗舰模型 Muse Spark 1.2 蒸馏而来，具备多步链式推理、精准工具调用、错误诊断与自动重试及图文多模态理解（少数派/腾讯研究院 2026-08-11）","在 SWE-Bench、MCP-Atlas 等端到端 Agent 基准超越同尺寸 Gemma4-31B、Qwen3.6-27B；已兼容 OpenClaw 等编排框架，llama.cpp、MLX、ExecuTorch 端侧引擎优化将上线（少数派 2026-08-11）","待核实：消费级硬件上的实际推理速度与精度折损，以社区实测为准"],"scripts":[{"angle":"干货直给","text":"Meta 8月10号开源了一个300亿参数的 Agent 模型，叫 Muse Glimmer，关键词是「端侧」——不用连云，单张消费级的显卡就能跑。它用 Apache 2.0 协议，权重已经上了 Hugging Face，经过4bit量化只要24G显存就能跑，而且能力不打折，默认上下文窗口128K。底层是从旗舰模型 Muse Spark 1.2 蒸馏来的，会多步推理、精准调工具、出错自己重试，还能看懂图。在 SWE-Bench、MCP-Atlas 这类端到端 Agent 的基准上，它压过了同尺寸的 Gemma4-31B 和 Qwen3.6-27B。说白了，一个能住你电脑里、常驻干活的 AI 员工，现在开源了，开发者直接就能拉去用。"},{"angle":"说人话版","text":"过去那些好用的 AI Agent，要么在云端、要么吃大显存，普通人根本玩不起。Muse Glimmer 想把这件事拉下神坛：300亿参数听着大，但量化到20G以内、24G显存就能跑，你家里那张游戏卡大概率带得动。它专门干「智能体」的活——你下个指令，它自己拆步骤、调工具、跑代码、出错了重试，还能结合图片去理解。而且是 Apache 2.0 开源，商用都行，社区能改能分。对开发者来说，等于白得一个本地私人助理的底座；对隐私敏感的人，数据不出本机就是最大的卖点。Meta 这步既是跟开源社区示好，也是想抢端侧 AI 的事实标准，心思很明确。"},{"angle":"趋势判断","text":"Muse Glimmer 开源，是端侧 AI 往「能干活」迈出的实打实一步。之前的端侧模型大多是聊天和补代码，真正能常驻、自主执行多步任务的 Agent，很少开源、还能源消费级硬件跑。Meta 把它压到24G显存、用 Apache 2.0 放出来，等于把「个人电脑变智能体终端」的门槛砍了。接下来两件事会发生：一是社区会基于它做一堆本地助手，微信飞书接入、定时任务、文件自动化；二是端侧和云端分工清晰化，敏感活本地跑、重活上云。对行业来说，端侧 Agent 要成新战场，苹果、谷歌、英伟达都会跟，本地智能体真正落地的年头来了，不是喊口号。"}]},{"id":"ai2","title":"OpenAI发布GPT-5.6 Cyber，尖端网安能力只给防御方","hook":"8月11日 OpenAI 推 GPT-5.6 Cyber，高级网安任务完成率95%，但只向获批防御方开放，分蓝队、红队两阶。","why":"OpenAI 把尖端网安能力只给审核过的防御方、分蓝红两阶，是 AI 安全「分阶授权」的标志事件。官方博客加Chosun加cnBeta加ithinkdiff 多源，95%完成率与真实漏洞发现可核验，对安全行业和普通用户都有解读价值。","heat":"高","tags":["OpenAI","GPT-5.6 Cyber","网络安全","Daybreak","红蓝队"],"facts":["8月11日 OpenAI 发布专门面向漏洞研究、渗透测试、事件响应的网络安全模型 GPT-5.6 Cyber，仅向经审核批准的企业与安全厂商开放，不对普通用户开放（OpenAI官方博客/Chosun/cnBeta 2026-08-11）","将原有 Daybreak 计划拆分为 Daybreak Blue（通用前沿模型 GPT-5.6 Sol，放宽防御性限制）与 Daybreak Red（提供 GPT-5.6 Cyber，用于漏洞研究与利用验证）两阶（OpenAI/Chosun 2026-08-11）","OpenAI 自测「高级网络安全完成率」：GPT-5.6 Cyber 达95%，前代 GPT-5.5 Cyber 为57.3%，开启常规防护的 GPT-5.6 Sol 仅1.5%（OpenAI/ithinkdiff/kocitech 2026-08-11）","已用该模型在真实软件中发现约400个漏洞，含 Chrome V8 引擎两个未公开漏洞（CVE-2026-15903 等），已报告 Google 修复；合作方含 Accenture、Cisco、Cloudflare、CrowdStrike、IBM 等（OpenAI/Chosun/cnBeta 2026-08-11）","待核实：模型 offensive 能力边界与9月1日起强制硬件密钥等管控细节，以 OpenAI 后续 system card 为准"],"scripts":[{"angle":"干货直给","text":"OpenAI 8月11号发了个网络安全专用模型，叫 GPT-5.6 Cyber，但普通人用不了——只向审核过的企业和安全厂商开放。它把原来的 Daybreak 计划拆成了两阶：Blue 给通用前沿模型 GPT-5.6 Sol、放宽防御性限制；Red 才给这个专门的 Cyber 模型，用于漏洞研究和利用验证。在自测里，高级网安任务完成率到了95%，上一代才57.3%，而开了常规防护的 GPT-5.6 Sol 只有1.5%。它已经找出了大约400个真实漏洞，包含 Chrome V8 引擎里两个没公开的漏洞，已经报告给 Google 修。让防御方抢先拿到尖端能力，是这个发布最核心的意图，攻防节奏要先帮防守这边。"},{"angle":"趋势判断","text":"GPT-5.6 Cyber 最该被关注的，是「能力给谁」。OpenAI 把它评级为网安能力 High、没到 Critical，所以敢发，但只给审核过的防御方，9月1号起还要硬件密钥。它用数据说明了一件事：普通模型开了防护只完成1.5%的攻击任务，专用模型能到95%——这中间的差，是真实存在的 offensive 能力，只是被权限和审计关在笼子里。这标志着 AI 安全进入「分阶授权」的时代：基础模型锁死，专业模型给可信的人配审计。对安全行业是福音，对普通人的提醒是，AI 攻防的代差正在拉开，防御这一侧必须更快用上这类工具，否则会越来越被动，差距不会自己缩小。"},{"angle":"说人话版","text":"打个比方：OpenAI 练了一个专门找系统漏洞的 AI，本事很大，但怕被坏人拿去搞破坏，所以不公开卖，只给审核过的正经安全公司用。它把使用资格分成两档，蓝队做常规防守，红队做高难度的漏洞研究。测试里它找漏洞的成功率95%，比上一代高了一大截，已经帮 Google 揪出了 Chrome 里两个隐藏的漏洞。普通人用不上，但你在用的软件、上的网站背后，可能正有安全团队拿它查窟窿，修好才放心。所以对咱们是好事——网安公司手里的武器升级了，你用的产品就更不容易被黑，这层保护是实打实的。模型越强，背后守着你的安全团队越重要，这事值得点赞。"}]},{"id":"ai3","title":"能住进电脑的AI员工：Hermes Agent与网易龙虾","hook":"开源智能体 Hermes Agent 星标约21.7万，网易有道 LobsterAI 龙虾是国内首个100%开源桌面 Agent，个人 AI 助理走向本地化。","why":"Hermes Agent 与网易龙虾代表「本地桌面 Agent」走向个人用户，一个极客向一个小白向，均100%开源、数据留本地。来源含腾讯云、51CTO、极目新闻，对想养个人 AI 助理的人是可落地的玩法清单。","heat":"中高","tags":["Hermes Agent","LobsterAI","桌面Agent","开源","个人助理"],"facts":["Hermes Agent 由 Nous Research 开发、2026年2月开源，MIT 许可，GitHub 星标约21.7万；定位「行动型」智能体，可常驻本地或服务器，通过微信、飞书、Telegram 等20多个平台接收指令并自动执行文件、代码、浏览器任务（Nous Research/kie.ai/腾讯云 2026）","核心差异是自我进化：任务完成后自动提炼可复用 Skill 文件，后续持续优化；内置三层持久记忆与子代理并行（腾讯云开发者社区/kie.ai 2026）","网易有道 LobsterAI（龙虾）2026年2月11日发布，国内大厂首个100%代码开源桌面级 Agent，MIT 协议，5000多个技能覆盖，支持 Windows/Mac/Linux 本地部署（51CTO/网易 2026）","LobsterAI 8月6日宣布面向所有网易用户登录即领5000积分（至8月20日），近期上线多 Agent 协作与 Sites 站点能力（将成果直接部署为网站）；已接入 DeepSeek-V4-Flash（腾讯/极目新闻 2026-08-06）","待核实：Hermes 与 LobsterAI 的具体版本迭代与技能生态规模，以各自官方仓库为准"],"scripts":[{"angle":"干货直给","text":"想养一个住电脑里的 AI 员工，看这两个开源项目。一个是 Hermes Agent，Nous Research 做的，MIT 许可，GitHub 星标大约21.7万，能常驻在本地或者服务器，通过微信、飞书、Telegram 等20多个平台接指令，自动跑文件、代码、浏览器任务。最特别的是会自我进化：干完活自动把经验存成可复用的技能，下次更顺。另一个是网易有道的 LobsterAI 龙虾，国内大厂里第一个100%开源的桌面 Agent，MIT 协议，5000多个技能，Windows、Mac、Linux 都能装。个人 AI 助理，正在从云端走向你的桌面，数据留本地，这点对隐私党很重要。"},{"angle":"工具评测","text":"这俩怎么选。Hermes Agent 偏极客和开发者，命令行起家，强调的是越用越聪明的自我进化能力和跨平台网关，微信飞书都能接，适合想养个长期陪跑的「数字员工」，但它要会配环境、填模型的 API Key。LobsterAI 龙虾偏普通用户，有图形界面，本地桌面自动化开箱即用，5000多个技能覆盖文档、PPT、代码、数据分析，8月还上线了多 Agent 协作和把成果直接发成网站的能力，登录就领5000积分。要折腾选 Hermes，要省事选龙虾。共同点是代码全开源、数据留本地，隐私可控，不想把活儿全交给云端的人，这两个都值得试。"},{"angle":"实操流程","text":"想上手本地 Agent，按这个来。第一步选一个：开发者爱折腾就选 Hermes Agent，一行安装命令加配置模型 Key；新手要图形界面就选网易 LobsterAI 龙虾，下载装好就能用。第二步接入口：Hermes 把微信飞书的 Token 配好，就能用手机发指令；龙虾直接桌面点开，还能接钉钉企微。第三步喂任务：让它们做文件整理、定时报表、网页抓取这类重复活，Hermes 干完会自动沉淀技能、越用越聪明，龙虾用多 Agent 并行出报告。第四步管安全：给最小权限、在沙箱里跑。本地 Agent 最大的爽点是数据不出本机，长期用真的能省下不少时间，不是噱头。"}]},{"id":"ai4","title":"中国开源大模型正在惠及全球，下载量占41%世界第一","hook":"央广网8月11日：中国研发的开源模型下载量已占全球41%跃居世界第一，调用榜前六全是中国团队。","why":"央广网用下载量41%世界第一、调用榜前六全中国等硬数据，呈现中国开源大模型的全球影响力，是本周宏观趋势的权威总结。多源（央广网、量子位、英伟达）一致，适合做行业解读。","heat":"高","tags":["开源大模型","中国AI","MiniMax","Kimi","生态"],"facts":["央广网8月11日报道：中国研发的开源模型下载量已占全球总量的41%，跃居世界第一；在全球主流大模型调用榜单上，排名前六的模型全部来自中国团队（央广网 2026-08-11）","MiniMax 开源 H3 模型后三天冲上 Hugging Face 热度榜首，超百家企业 Day0 接入，在 DesignArena 多图生视频、图生视频、视频编辑三类登顶；Stable Diffusion 创始人 Emad 公开致敬（央广网/量子位 2026-08-11）","国产开源矩阵持续扩容：DeepSeek 新一代模型发布并开源、近3万亿参数的 Kimi K3 贡献前沿智能、千问 Qwen3.8 上线并即将开源（央广网 2026-08-11）","外溢效应数据：美国投资机构统计约八成美国 AI 初创在融资路演中使用中国开源模型；MiniMax 全球企业开发者客户超百万、较半年前增长五倍；黄仁勋多次表态应向中国开源学习（央广网/英伟达 2026-08-11）","待核实：下载量与调用榜口径来自单一媒体引用机构统计，以第三方榜单平台实时数据为准"],"scripts":[{"angle":"干货直给","text":"央广网8月11号报了一组硬数据：中国研发的开源模型下载量，已经占到全球的41%，世界第一；在全球主流大模型的调用榜上，前六名全是中方团队。MiniMax 开源 H3 之后三天就冲上 Hugging Face 热度榜首，超百家企业当天接入，在图生视频、视频编辑等类目登顶，连 Stable Diffusion 的创始人 Emad 都公开致敬。背后是 DeepSeek、近3万亿参数的 Kimi K3、千问 Qwen3.8 接连开源。美国机构统计，大约八成的美国 AI 初创在路演里用中国开源模型。开源这条路，中国模型是真的卷出了全球影响力，不是自嗨，是有第三方数据撑着的。"},{"angle":"趋势判断","text":"中国开源模型占全球下载41%、调用榜前六包圆，这不只是面子上的事。第一，开源在换生态。模型免费放出来，芯片厂做优化、框架第一时间适配、开发者低成本创新，形成一个正循环，单个企业的能力变成群体的竞争力。第二，成本被中国模型打了下来。MiniMax 客户半年涨了五倍、超百万，八成美国初创路演用中国模型，说明性价比成了硬指标。第三，英伟达黄仁勋都表态要向中国开源学习。接下来看闭源阵营怎么应对——中国走通了「以开放赢主动」这条路，全球 AI 创新的版图里，中国的分量只会更重，这个趋势短期挡不住。"},{"angle":"数据向","text":"用三个数看中国开源模型的份量。41%：中国开源模型下载量占全球总量，世界第一。6：全球主流调用榜前六，全是中国团队。80%：美国投资机构统计，大约八成美国 AI 初创在融资路演中用中国开源模型。再加两个佐证：MiniMax H3 开源三天登 Hugging Face 榜首、超百家企业 Day0 接入；其全球客户超百万、半年涨了五倍。这些数串到一起说明一件事——中国大模型不再只是「能用」，而是成了全球开发者默认的底座之一。对国内创业者来说，意味着站在开源肩上做应用的成本，空前地低，机会窗口就在眼前。"}]},{"id":"ai5","title":"阿里千问开放平台上线，在App里@一下就能用服务","hook":"8月10日阿里千问开放平台上线，面向生态伙伴开放手机、PC、AI眼镜三类终端接入，顺丰、自如等已接入。","why":"阿里千问开放平台把第三方服务做成对话里的智能体，是从「聊天模型」转向「服务入口」的关键动作。少数派一手报道、伙伴清单明确，对普通用户和开发者都可直接参考。","heat":"中高","tags":["阿里","千问","开放平台","智能体","生态"],"facts":["8月10日阿里千问开放平台正式上线，面向生态伙伴和开发者开放手机、PC、AI 眼镜三类终端的服务接入（少数派/阿里 2026-08-10）","第三方可创建 AI 智能体，以独立对话空间形态在千问 App 上为用户提供从咨询、推荐到履约的完整服务链路；已接入顺丰速运、自如租房、联想乐享、盈米基金、哈啰租车、飞常准、美的美居等（少数派 2026-08-10）","在千问 App 中用户只需 @相关服务，或点击右上角圆点角标进入对应智能体即可使用；菜鸟、夸克网盘、夸克扫描王等阿里生态产品同步接入（少数派 2026-08-10）","AI 眼镜端开放平台面向开发者提供 Skill 接入与行业定制两种模式，可用自然语言定制 Skill（如为视障人士打造「身边有什么」提醒障碍物）（少数派 2026-08-10）","待核实：开放平台具体开放类目、审核机制与分润规则，以阿里官方文档为准"],"scripts":[{"angle":"干货直给","text":"阿里8月10号上线了千问开放平台，重点是把第三方的智能体接进千问 App。它面向生态伙伴开放手机、PC、AI 眼镜三类终端的接入。说白了就是，顺丰、自如、联想、盈米基金、哈啰租车、飞常准、美的这些伙伴，能在千问里建自己的 AI 智能体，你 @一下或者点右上角的角标就能用——查快递、找房、看航班、控家电，不用再切 App。菜鸟、夸克网盘也接了。这是把千问从「聊天模型」变成「服务入口」，你在一个对话框里把事办了，阿里想做的就是那个中间层，把流量和服务都收在自己这一个口子里。短期看方便，长期看谁掌握入口谁掌握用户，阿里算盘打得很清楚。"},{"angle":"工具评测","text":"千问开放平台值不值得用，看场景。对普通用户：不用装一堆 App，在千问里 @顺丰查快递、@飞常准看航班、@美的控家电，对话即服务，省得来回跳。对开发者：能建智能体接自己的业务，首批开放手机、PC、AI 眼镜三端，眼镜端还能用自然语言定制 Skill，比如给视障人士做「前方有台阶」的提醒。已接入的伙伴覆盖物流、居住、理财、出行、家电十多个领域，起点不低。短板是刚上线，类目和深度还在铺，复杂业务可能不如原生 App 全。日常轻量办事，它够顺手，重度依赖某个垂直 App 的人，暂时还替代不了。等它类目铺开，才是真正能当入口用的那天。"},{"angle":"趋势判断","text":"千问开放平台上线，是大模型从「会聊」走向「能办」的一个信号。过去各家卷的是模型多强，现在卷的是谁能把服务接进来、让用户在一个地方把事办完。阿里用开放平台拉生态伙伴，顺丰、自如、飞常准这些把能力做成智能体塞进千问，是想占住「AI 服务入口」这个位置。这跟微信小程序的逻辑很像——只不过入口变成了对话框。接下来看两点：一是伙伴够不够多、活够不够深；二是别变成又一个广告位。对用户，少装 App、多办事是实打实的方便；对阿里，这是守住入口、建起生态的关键一仗，输赢就看伙伴愿不愿意真把核心能力搬进来。"}]}]}]},"2026-08-10":{"date":"2026-08-10","updatedAt":"2026-08-10 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"京沪高铁能提前60天预约购票了，但这不等于先到先得","hook":"7月20日起京沪高铁京沪铁路试点预约购票，开车前60到17天填需求，20到16天兑现，8月30日起常态化。","why":"12306首次在预售期之前新增预约购票服务，把抢票逻辑从拼手速变成提前报需求、按需配运力。对常走京沪线、要锁中秋国庆车票的人直接有用，且多源权威报道（央视、人民日报、新华社、光明日报、国铁集团）信息一致。","heat":"高","tags":["京沪高铁","12306","预约购票","火车票","中秋国庆"],"facts":["7月20日起，铁路部门在京沪高铁、京沪铁路200多趟列车试点新增火车票「预约购票」服务，旅客可在开车前第60天至第17天填报预约需求（央视新闻/人民日报 2026-07-17；国铁集团客运中心）","铁路12306系统于开车前第20天至第16天兑现预约订单；7月20日至8月29日为过渡期，可依次预约9月15日及以后车票，8月30日起常态化运行（央视新闻/光明日报 2026-07-17）","预约分「精确预约」与「模糊预约」两种：精确选具体车次席别票价，模糊选时间段、时长、席别；每账户可同时提交3个待兑现订单，每单最多19名旅客（国铁集团/光明日报 2026-07-17）","兑现按「长途优先、兼顾中短途」与「先到先得」原则智能匹配；兑现成功须在当日23时前完成支付，逾期自动取消（国铁集团）","仅面向普通旅客，暂不支持超19人团体；30天内连续三次兑现成功但逾期未支付，此后90天该账户禁用预约购票（光明网 2026-07-20）","预约车票退票规则：开车前第20至8天退票核收5%退票费，8天内按既有预售车票退票规则执行","待核实：部分第三方平台推出的「预约购票」辅助功能与12306官方机制是否一致，一切以12306客户端为准"],"scripts":[{"angle":"干货直给","text":"京沪高铁和京沪铁路从7月20号起试点一个新功能，叫预约购票，这是12306头一次在预售期之前就让你填需求。规则很简单：开车前第60天到第17天，你在12306客户端的预约购票专区填想坐的车，第20天到第16天系统统一兑现，兑现成功当天23点前付钱就拿票。7月20号到8月29号是过渡期，这期间只能约9月15号以后的票，8月30号起才常态化。它本质是铁路提前摸你的出行需求再按需调配运力，和平时开售拼手速是两回事。中秋国庆要坐京沪线的，现在打开专区就能先把需求位占上，比等开售当天再抢要主动得多。"},{"angle":"避坑清单","text":"京沪预约购票这个新功能，先记牢四件事再下手。第一，预约不等于抢到。你填的是需求，第20到16天才兑现，按「长途优先、先到先得」智能匹配，兑现成功当天23点前必须付钱，否则订单自动取消；30天内连着三次兑现了又不付，这个账户90天不能再约。第二，两种模式。精确预约选具体车次席别，模糊预约只选时间段和时长，赶时间的用模糊更灵活。第三，认准官方。入口只在12306客户端首页预约购票专区，每账户最多3个待兑现订单、每单最多19人，不支持超19人的大团。第四，别信第三方平台的类似按钮，以12306为准。"},{"angle":"反常识开场","text":"12306这次不是让你抢得更快，而是让你抢得更早、还不一定抢得到。京沪高铁7月20号上线的预约购票，把买票动作拆成两段：开车前60到17天填需求，20到16天系统才兑现，中间隔了快一个月。为什么这样？因为铁路想提前知道大家要去哪，再决定加不加密、调不调编组。所以填了需求不代表有票，兑现那几天才是关键，而且按长途优先、先到先得来分。对普通人的用处是：中秋国庆想坐京沪线的，别等开售那天拼手速了，现在就去预约专区占个需求位，越早填越主动，但别以为填了就等于拿到票，兑现那几天才是真刀真枪分票的时刻。"}]},{"id":"tv2","title":"杭台高铁温玉段开通，玉环结束了不通铁路的历史","hook":"8月8日玉环站开出第一班高铁，杭州东1小时47分直达，台州实现县县通铁路。","why":"一条37公里的新线让海岛玉环迈入高铁时代，并把浙东唐诗之路和滨海旅游串成一条线，游客凭高铁票根能享100多项优惠。时效强、落地清晰、多源权威（新华社、人民网、浙江在线、上铁集团），对短线周边游人群直接有用。","heat":"中高","tags":["杭台高铁","温玉段","玉环","台州","周边游"],"facts":["8月8日杭州经绍兴至台州高铁温岭至玉环段（杭台高铁温玉段）开通运营，玉环从不通铁路直接迈入高铁时代（新华社/人民网/浙江在线 2026-08-08；上铁集团）","玉环站至杭州东站最快1小时47分可达，至温岭站最快13分钟、台州站26分钟、绍兴北1小时26分、上海南3小时03分（上铁集团 2026-08-08）","温玉段新建正线约37公里，设计时速350公里，桥隧比90.34%，设温岭、温岭西、玉环3座车站，开通初期每日开行图定动车16列（上铁集团/人民网 2026-08-08）","这是台州首条由地级市自主牵头建设的高铁，采用PPP模式，玉环是台州唯一原不通铁路的县级市，通车后台州实现「县县通铁路」（人民网 2026-08-08）","玉环策划推出系列文旅活动，整合100多项优惠政策，游客凭高铁票根可享受专属权益，串联大鹿岛、漩门湾湿地等滨海资源（浙江在线/上铁集团 2026-08-08）","待核实：具体票根优惠商户清单与有效期，以玉环文旅及铁路车站现场公告为准"],"scripts":[{"angle":"干货直给","text":"8月8号，杭台高铁温玉段正式开通，第一班G7364从玉环站开出。这条线不长，新建正线只有37公里，设计时速350，但意义不小：玉环这个海岛县级市，之前是台州唯一不通铁路的地方，坐高铁得先坐一小时汽车到温岭换乘，现在直接迈入高铁时代，台州也由此实现县县通铁路。玉环站到杭州东最快1小时47分，到温岭13分钟，到上海南3小时出头。开通初期每天16趟图定动车。想去台州沿海玩、去玉环吃海鲜看海的，现在高铁就能到，而且凭票根还能享当地100多项优惠，住宿和玩都能省一笔，周边游的性价比一下就上来了。"},{"angle":"行程规划","text":"杭台高铁温玉段一开，江浙沪周边游可以这样串。第一天杭州东出发，1小时47分直达玉环，放下行李去漩门湾国家湿地公园看候鸟、到大鹿岛坐船看岩雕，晚上玉环吃海鲜。第二天玉环站13分钟到温岭，转去石塘看千年曙光、七彩小箬村拍照，或者往北去天台、新昌走浙东唐诗之路。这条线把诗词山水和碧海蓝天接上了，还凭高铁票根享100多项优惠。适合两天一晚不赶的周末游。注意初期每天只有16趟车，热门时段提前买，别到了车站才发现没票。带上票根，沿途吃住玩都有专属权益可兑，相当于一张车票撬动整条线消费，很值。"},{"angle":"趋势判断","text":"玉环通高铁，看似一条37公里的小线，其实是长三角补网的一颗棋子。它把浙东唐诗之路和玉环的滨海资源接上了，游客从绍兴、新昌、天台一路南下直达温岭和玉环，诗词山水到碧海蓝天的文旅串联就成立了。更关键的是模式：这条线是我国首条由地级市自主牵头、用PPP模式建的高铁，说明地方修高铁的积极性在往上走，县县通铁路会从长三角先铺开。对游客来说，以后周边游的选择会越来越多，小县城的好山好水不再被交通卡住。高铁票根换优惠这套打法，也会跟着被别的小城复制，周边游的性价比会越来越高，小城旅游的红利才刚开头。"}]},{"id":"tv3","title":"暑运过半4.32亿人次，8月中下旬才是真正的最高峰","hook":"截至7月31日全国铁路已送客4.32亿，预计全程10.1亿，日均1629万，8月下旬迎返程顶。","why":"暑运是观察出行消费最直观的窗口，国铁集团数据权威且多源一致（央视、经济日报、凤凰网、西安网）。能讲清客流高峰时段和买票策略，对正在安排8月出行的人有直接提醒价值。","heat":"中高","tags":["暑运","铁路","客流","出行","错峰"],"facts":["2026年铁路暑运7月1日启动，截至7月31日全国铁路累计发送旅客4.32亿人次，预计全程发送10.1亿人次，日均1629万人次（国铁集团/央视网/经济日报 2026-08-01起）","8月1日至3日单日发送量连续突破1700万人次，8月中下旬将迎返程最高峰，呈「两头高、中间低」的客流曲线（同程数据经多家媒体 2026-08）","暑运期间铁路日均安排开行旅客列车约1.2万列，依托12306大数据动态研判热门方向加开高峰列车（国铁集团）","服务升级：「静音车厢」覆盖超8000列动车组，「爱宠行」拓展至163座高铁车站、364趟动车，「轻装行」覆盖212座车站，旅游计次票增至26款（央视网/凤凰网 2026-08）","7月以来全国铁路累计开行旅游列车357列，亲子游、研学游、红色游、康养游等特色列车增多（国铁集团/西安网 2026-08）","待核实：部分单日峰值与区域分布为媒体引用同程等平台数据，以国铁集团官方通报为准"],"scripts":[{"angle":"干货直给","text":"暑运过半，铁路交出半程答卷：截至7月31号，全国铁路累计发送旅客4.32亿人次，按国铁集团的预期，整个62天暑运要送10.1亿，日均1629万。而且真正的高峰还没到，8月1到3号单日已经连续突破1700万，8月中下旬返程才是顶，客流曲线是两头高、中间低。所以现在8月上旬还算相对宽松，想错峰的抓紧。铁路也加了车，暑运每天开约1.2万列客车，热门方向动态加开。服务上也卷了：静音车厢超8000列，爱宠行扩展到163个站，旅游计次票26款，带娃带宠出行的体验比以前好不少，错峰走正合适。"},{"angle":"避坑清单","text":"8月还在路上的，几个提醒记好。第一，别卡最高峰走。8月中下旬是返程顶，尤其8月21号周五、22号周六、28号周五、30号周日这几个周末最挤，能调就调到周二到周四，或者早晚非高峰车次，票好买人也少。第二，善用捡漏。发车前48小时和前1到2小时是退票回流高峰，没抢到别放弃，设好提醒蹲余票。第三，新生注意。8月1到30号12306有新生预约购票，2026级新生可约8月17到9月14号的学生优惠票，先完成资质核验。第四，大件行李用轻装行，已覆盖212座车站，进站省事不少，带大件出门的人尤其该用上。"},{"angle":"数据向","text":"4.32亿这个半程数字，背后是几个信号。一是出行需求确实旺，暑运全程预计10.1亿，日均1629万，8月头几天已经冲到1700万以上，说明亲子研学、避暑、返乡几股客流叠满了。二是铁路在主动适配，每天1.2万列客车、旅游列车开了357列，静音车厢、爱宠行、轻装行这些精细化服务铺开，是在抢「走得好」的体验。三是「两头高中间低」的曲线很关键：现在8月上旬是中间那段低谷，是全年难得的相对宽松窗口；等8月下旬学生返校、务工返程叠一起，票价和拥挤度都会上来。要出行，这十天最划算，错过就要撞最高峰。"}]},{"id":"tv4","title":"文旅部通报13起强制消费典型案例，纯玩团变购物团被点名","hook":"8月5日文旅部联合网信办公布13起案例，虚构纯玩团、低价揽客收回扣、无证经营全在列。","why":"文旅部这次专项整治直指短视频、直播、社交平台上的非法网络招徕，案例具体、处罚清晰（单案最高罚22.5万并停业整顿），是游客防坑的权威教材。多源一致（文旅部官网、法治网、人民网、腾讯新闻），时效强且受众极广。","heat":"高","tags":["文旅部","强制消费","纯玩团","旅游陷阱","维权"],"facts":["8月5日文化和旅游部公布2026年第五批共13起旅游市场强制消费问题典型案例，覆盖短视频、直播、社交平台等渠道（文旅部官网 mct.gov.cn 2026-08-05；法治网 2026-08-07）","文旅部联合中央网信办开展非法网络招徕专项整治，清理非法网络招徕产品及信息，推进强迫购物线上线下同步治理（文旅部官网 2026-08-05）","案例类型含虚构纯玩团诱导消费、低价揽客收购物回扣、无证经营、虚假宣传等；山西鑫泽鄂尔多斯分公司以低于成本价招徕并安排购物，被罚22.5万元、停业整顿30日，为本次最重处罚（人民网/中国城市报 2026-08-10）","潮州市骏晖旅行社以「纯玩零购物」招徕却安排购物收人头费，被吊销旅行社业务经营许可证（人民网/腾讯新闻 2026-08）","无证经营占比高：个人以99元「济南1日游」等通过社交平台私自组织旅游、无资质违规组织出境游等均被查处（文旅部官网/腾讯新闻 2026-08）","待核实：各地具体处罚执行进度与后续新增案例，以文旅部及属地执法部门通报为准"],"scripts":[{"angle":"干货直给","text":"文旅部8月5号公布13起旅游强制消费典型案例，这次是联合中央网信办专项整治非法网络招徕，重点清理短视频、直播、社交平台上的坑人产品。案例里最典型的是虚构纯玩团：有旅行社在短视频发749元重庆4天3晚，说不用额外花钱，人到了逼你签含自费项目的合同、额外收景区交通费。还有打着「纯玩零购物」低价揽客、实际安排购物收人头费的，直接被吊销执照。最重的一单，山西一家旅行社以低于成本招徕并安排购物，罚了22.5万、停业整顿30天。简单说，凡是短视频上便宜得离谱的纯玩团，先打个问号，多半有坑。"},{"angle":"避坑清单","text":"文旅部这13起案例，照着排雷最清楚。第一，警惕「纯玩零购物」低价团。案例里多家就是拿这个噱头低价揽客，到了当地加购物、收回扣，口号越漂亮越要查资质。第二，别信社交平台的个人团。有人用99元「济南1日游」、无资质组织出境游，都是违法，出了事没保障。第三，看清合同再签字。到集合地才让你签含自费项目的合同，就是典型套路，当场拒签并保留证据。第四，遇强制购物打12345或12301投诉。这波整治就是要线上线下一起管，你投诉有地方接。记住一条：价格明显低于成本，必有猫腻，别贪小便宜，贪便宜才是被套的第一步。"},{"angle":"趋势判断","text":"文旅部这次点名13起案例，信号很明确：治理重点从线下门店转到了短视频和直播间。过去黑旅行社靠门店和传单拉人，现在改在抖音、小红书发低价纯玩团视频，用算法精准投给想省钱的人，到了当地再变卦。所以这次联合网信办专项整治，既要罚旅行社，也要清理平台上的非法招徕信息，等于把坑人的入口也堵上。对游客是好事，但根子还在「贪便宜」——案例里几乎全是低于成本价揽客。监管再严，也拦不住你主动点开那个749元的重庆团。下一步看平台能不能把无证旅行社的号真的封干净，不然换壳又来，监管和平台得打配合战才堵得住。"}]},{"id":"tv5","title":"暑期尾声四川免票接力，广元女儿节全球女性免46家景区","hook":"8月下旬到9月，广元女儿节全球女性免46家A级景区，瓦屋山、兴文石海也接力免票。","why":"暑期最后一周到9月，四川多个景区推出限时免票，且覆盖人群明确（女性、宜宾居民），是错峰出游的高性价比窗口。与历史已覆盖的稻城亚丁免票角度不同（本次是时段接力+特定人群），信息来自四川文旅官方与多地政府公告，时效强。","heat":"中高","tags":["四川","免票","广元女儿节","瓦屋山","错峰"],"facts":["广元市2026女性用户文化生态旅游节（女儿节）8月24日至9月1日举行，期间全球女性免广元46家A级景区门票（广元文旅/四川新闻网 2026-08）","瓦屋山景区8月19日至23日面向所有游客免门票（瓦屋山景区官方 2026-08）","宜宾兴文石海景区8月1日至9月30日面向宜宾市居民免门票（兴文文旅 2026-08）","四川暑期文旅消费持续发力，此前稻城亚丁7月已推8月1日至10月31日全国游客免门票（央视网 2026-08-04），本次为不同时段与人群的接力优惠","待核实：各景区免票是否含观光车、索道等二消项目，及预约方式，以景区官方公告为准"],"scripts":[{"angle":"干货直给","text":"暑期尾巴，四川几个景区接力免票，时机刚好错峰。广元女儿节8月24号到9月1号，全球女性免广元46家A级景区门票，这个范围很大，剑门关、昭化古城这些都在内。瓦屋山8月19到23号对所有游客免门票，就五天，要卡准。宜宾兴文石海8月1号到9月30号对宜宾市居民免票，本地人别错过。注意这些都是门票免费，观光车、索道这类二消一般不含，而且多半要提前在官方渠道预约。和7月稻城亚丁那种全国免三个月不一样，这批是限时、分人群的接力优惠，适合8月底9月初还想出去溜达、又想省门票的人顺手捡漏，比硬凑假期划算，省心又省钱。"},{"angle":"行程规划","text":"想趁四川这批免票错峰，可以这么排。第一站瓦屋山，8月19到23号免门票那五天去，山顶看云海杜鹃、坐索道看瀑布，门票省了但索道要另买。第二站广元，8月24号女儿节开幕后过去，全球女性免46家A级景区，剑门关、昭化古城、千佛崖一路刷，女性用户基本门票全免。如果本身是宜宾人，顺道去兴文石海，8月1到9月30号对宜宾居民免票，看天泉洞和地表石海。整条线8月下旬到9月初走最舒服，伏天过了、学生也开学了，人不挤，还赶上免票尾巴。记得每站提前在景区官微预约，免票也常要预约名额，别到了门口才发现没约上。"},{"angle":"反向劝退","text":"四川这批免票看着香，但有三处别上头。第一，别为了免票硬凑时间。瓦屋山只免8月19到23号五天，广元女儿节免票到9月1号，过期不候，别把行程挤在无效日期。第二，免的是大门票，不是全部。索道、观光车、船票这些二消照收，算总账未必比淡季打折便宜多少，出发前查清楚含什么。第三，预约是硬门槛。这类限时免票基本要官方提前约，不约到现场可能进不去。所以适合本来就打算8月底9月初去四川的人顺手捡漏，专程为免票跨省跑，不一定划算。错峰的核心是躲人，不是只图免门票，别本末倒置，躲人才是错峰的真正目的。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"谷歌开源WeatherNext，气旋预报一下子多争取了一天","hook":"DeepMind把气旋预报模型开源，提前超24小时预警，单个TPU不到1分钟出15天预报。","why":"这是AI气象领域少有的开源+顶刊（Nature 8月6日）+实测落地三重背书，对关注AI应用、防灾和开源生态的人都信息密度高。多源一致（DeepMind官方、Nature、TechNews、Unite.AI），且能讲清「为什么重要」。","heat":"中高","tags":["谷歌","DeepMind","WeatherNext","开源","气象预报"],"facts":["8月6日谷歌DeepMind在Nature发表论文并开源WeatherNext系列模型（含WeatherNext Cyclones、WeatherNext 2、WeatherNext 2-mini），代码与权重免费开放（DeepMind官方/ Nature 2026-08-06；TechNews 2026-08-07）","在2023至2025年气旋上评估，WeatherNext Cyclones相对主流业务模型在路径、强度和风结构上平均多争取超24小时（约一天）预警提前量，相当于十年的气象进展（DeepMind/ Unite.AI 2026-08）","模型仅需28×28公里分辨率输入（比传统强度模型粗约100倍），单个TPU上不到1分钟生成15天概率式预报，2-mini版可在免费Colab单TPU运行（DeepMind/ datanorth.ai 2026-08）","采用Apache 2.0与CC BY 4.0许可，允许商业使用并署名，较此前的GraphCast、GenCast非商用许可更开放（datanorth.ai 2026-08）","2025年大西洋飓风季已与美国国家飓风中心（NHC）、CIRA、英国气象局合作实测，帮助提前预判Melissa的快速增强与登陆（DeepMind/ Unite.AI 2026-08）","待核实：上述为谷歌DeepMind自评估，虽经Nature同行评审并有多机构合著，仍非完全独立第三方复现"],"scripts":[{"angle":"干货直给","text":"谷歌DeepMind 8月6号在Nature发了篇论文，同时把WeatherNext气旋预报模型开源了，包含Cyclones、2、2-mini三个版本，代码和权重都免费开放，而且允许商用。它牛在哪？在2023到2025年的气旋上测，路径、强度、风结构三项平均比主流业务模型多争取超24小时预警，差不多相当于气象界十年的进步。更反直觉的是，它只要28乘28公里这么粗的输入，比传统强度模型细100倍的要求还低，单个TPU上不到1分钟就出15天预报。轻量版在免费Colab里单张TPU就能跑，学生和地方气象台都玩得起，门槛低到意外。"},{"angle":"说人话版","text":"天气预报这事，台风能不能提前一天说，可能就是撤不撤离的差别。谷歌这次开源的WeatherNext，干的就是把气旋预警多往前推一天。过去要更准得堆超高清数据，它偏不，用很粗的28公里网格就做到了，而且一台TPU不到一分钟算完15天。这意味着小地方的气象部门、甚至高校实验室，不用买超算也能跑。许可也大方，Apache 2.0加CC BY 4.0，能商用。去年飓风季它已经和美国国家飓风中心搭着用了，提前预判了Melissa的快速增强。对普通人暂时没感觉，但对防灾和保险这些行业，这是真的能救命省钱的工具，早一天预警就少一天损失。"},{"angle":"趋势判断","text":"WeatherNext开源，是AI气象从「秀指标」走向「能部署」的转折点。谷歌这次把许可从之前GraphCast、GenCast的非商用，直接换成可商用的Apache 2.0和CC BY 4.0，气象局、保险公司、能源交易商终于能把模型塞进自己的产品，而不是只能看论文。更关键的是它推翻了一个老假设：高精度强度预报必须靠超高清分辨率。WeatherNext用粗数据就做到了，说明架构和训练数据才是关键。接下来，地方气象机构和创业公司会在它权重上做本地化微调，小语种、小区域的预报会多起来。开源气象模型，开始跟开源大模型一样卷了，受益的是下游所有防灾场景。"}]},{"id":"ai2","title":"字节SeedRealtime上线，AI第一次能边看边听边说","hook":"豆包全量上线音视频全双工模型，不再靠ASR、视觉、TTS接力，一个模型打通看听说。","why":"这是国内首个规模化落地的音视频全双工模型，把AI从「你问我答」变成「它也在盯着看」，对视频通话、导览、陪伴场景是范式变化。多源一致（字节Seed、凤凰网科技、IT168、每经、科创板日报），且豆包3.82亿月活的落地规模罕见。","heat":"高","tags":["字节","SeedRealtime","豆包","全双工","多模态"],"facts":["8月5日字节跳动Seed团队发布原生音视频全双工大模型SeedRealtime，已在豆包App全量上线，用户更新后通过「打电话」进入视频通话体验（字节Seed/凤凰网科技/科创板日报 2026-08-05）","统一端到端架构原生融合音频、视频和文本，在连续多模态信息流中同步感知、理解、决策、表达，实现「边看、边听、边说」（字节Seed/ IT168 2026-08-06）","三大核心能力：音视频联合理解（靠画面消同音歧义、识别手势指代）、主动交互（持续观察环境并主动出声）、流畅节奏（实时感知对话状态自然接话）（凤凰网科技/腾讯新闻 2026-08-05）","端到端人工评测显示，相比传统ASR+视觉+TTS级联系统，音视频对话节奏问题减少约50%，抢话、回应迟滞、背景杂音误触发明显下降（字节/科创板日报 2026-08-05）","截至2026年6月豆包月活3.82亿、日活超2亿，日均Token调用180万亿，本次是业内首次将音视频全双工铺到该量级（字节Seed/消费日报/ IT168 2026-08）","待核实：端到端时延具体数值与更多开放场景，以字节后续披露为准"],"scripts":[{"angle":"干货直给","text":"字节8月5号发了个新模型SeedRealtime，已经在豆包App全量上线，你更新到最新版、点「打电话」进视频通话就能用。它和以前的AI视频通话不一样：过去是ASR把声音转字、视觉模型看画面、文本模型想、TTS念出来，一环接一环，延迟堆叠。SeedRealtime把声音、画面、文字压进一个端到端模型，能边看边听边说。三个能耐：音视频联合理解，你指屏幕说「这个怎么弄」它结合画面判断指的是什么；主动交互，盯着展品认出来会主动讲解；流畅节奏，你说话时它也在听，不会乱抢话。官方评测说对话节奏问题比级联系统少了一半，体验顺多了。"},{"angle":"工具评测","text":"SeedRealtime值不值得玩，看你能用它干啥。最实用的几个场景：带外国朋友吃饭，它实时把中文菜单和服务员介绍翻成他能懂的话；逛博物馆，它盯着展品认出来主动讲背景；学咖啡机操作，它看画面实时纠错你哪步错了；看论文，它跟着你翻页到指定章节自动提示。底层变化是它不再依赖外部VAD判断轮到谁说话，所以你在嘈杂机场它能分清你是在跟旁人聊还是对它说，不会被背景噪音误触发。代价是得用豆包的视频通话入口，目前是陪伴和导览向，别指望它替你写长文。豆包3.82亿月活，基本是国民级试点了，参与规模行业第一。"},{"angle":"趋势判断","text":"SeedRealtime全量上线，标志着AI交互从「问答」跨到「在场」。过去AI是你说一句它答一句，像打电话按免提。全双工的意思是它一直开着耳朵和眼睛，你说话时它在听，环境变了它会主动出声，比如你操作咖啡机它实时纠错。字节敢把它铺到豆包3.82亿月活上，是业内第一次把音视频全双工做到这个规模，说明端到端多模态的延迟和稳定性已经够日常用了。这对行业的信号是：下一阶段比的不是谁模型大，是谁能一直在真实场景里陪着你、盯着环境、帮你干实事。AI伴侣这个方向，字节抢了先手，后来者得追着这个体验基准跑了。"}]},{"id":"ai3","title":"京东开源JoyAI-Video-Edit，视频能边播边改了","hook":"不是先生成再改，是播放的同时实时改人物换场景，720P下每秒30帧跟得上播放。","why":"这是视频编辑从「生成后处理」转向「流式实时」的标志性开源模型，对电商直播、短视频带货、家装设计有直接的降本价值。多源一致（经济日报、北京日报、新京报、新智元），且有实测和评测背书。","heat":"中高","tags":["京东","JoyAI-Video-Edit","视频编辑","开源","电商直播"],"facts":["8月5日京东开源自研实时流式视频编辑模型JoyAI-Video-Edit，部署代码、技术报告、在线Demo与模型权重同日在Hugging Face和GitHub放出（京东/经济日报/新智元 2026-08-05）","基于全自研JoyAI-Video，在720P分辨率下实现每秒30帧模型推理、系统端到端稳定24FPS，支持任意时长的稳定流式编辑（经济日报/北京日报 2026-08-05）","在OpenVE-Bench通用评测中超越所有流式编辑方法，全局风格、局部替换、局部删除、字幕编辑任务优势突出，对比SANA Streaming、LiveEdit、Xmax-X2.0全面领先（经济日报/新智元 2026-08-05）","实测：输入「将上衣改为粉色」即可实时替换衣物颜色，也可换帽换镜、调材质、转动画风格、换背景，动作略有延时（新京报贝壳财经实测 2026-08-05）","除创作外，可将人手操作视频转为机械手/机械臂训练素材，为具身智能大规模数据合成提供路径（北京日报/经济日报 2026-08-05）","待核实：本地部署的硬件门槛与商用授权细则，以京东开源仓库说明为准"],"scripts":[{"angle":"干货直给","text":"京东8月5号开源了个视频编辑模型JoyAI-Video-Edit，关键词是「流式实时」。以前改视频得先生成或先有素材，再后期处理；它不一样，视频播着你就改着，人物换衣服、场景换背景、画面转风格，全在播放过程中实时完成。技术上有两道坎它跨过去了：一是速度，720P下模型推理每秒30帧、端到端稳定24帧，跟得上正常播放；二是时长，支持任意时长稳定流式，不限制几秒的clip。在OpenVE-Bench评测里，它把SANA Streaming、LiveEdit这些流式方法全超了。代码、权重、Demo同一天放Hugging Face和GitHub，开发者直接拉，开源得很彻底。"},{"angle":"创作者视角","text":"做带货和短视频的，JoyAI-Video-Edit这套实时编辑能直接进工作流。最香的是电商直播：主播试白上衣，观众想看蓝款，不用真换衣服，一句话把画面里衣服实时改成蓝色，当场展示。家装也一样，播到卧室把枕头、床单、灯光当场换一遍。实测里输入「将上衣改为粉色」，画面里整件T恤实时变粉，帽子和墨镜也能戴上去，还能调棉质纹理、转插画风。门槛在提示词写得准不准，同一段视频描述越细出得越对，比如写清「白色圆领纯棉」比只写「白色」稳。对单人小团队，等于省掉反复拍摄和整段返工，一条片子边播边改就成型，产出效率明显高。"},{"angle":"趋势判断","text":"JoyAI-Video-Edit开源，说明视频赛道的竞争焦点从「生成更长更连贯」挪到了「实时可改」。字节Seedance 2.5、MiniMax H3解决的是一口气生更长的片，京东这条线解决的是生成之后怎么即时调。语音那边GPT-Live已经把对话从回合制变成全双工，京东把同样思路搬进视频编辑：你不用等成片出来才知道想改什么，边看边改。更深的意图在具身智能——它能把手操作视频转成机械臂训练素材，一段真机视频扩出一堆样本。京东把它放进「物理世界模型矩阵」，视频编辑只是入口，真正的盘算在机器人数据，开源是为了拉开发者进自己的生态。"}]},{"id":"ai4","title":"腾讯混元Hy ASR 3.0，语音识别开始听懂上下文了","hook":"普通话词错率压到3.34%，靠上下文区分「期终」还是「期中」、致癌还是治癌。","why":"这是语音识别从「听清」到「听懂」的范式升级，对会议转写、字幕、方言输入、客服都有直接价值，且已上线元宝免费开放。多源一致（腾讯云、江南都市报、腾讯新闻、每经、AIHub），数据具体可核验。","heat":"中高","tags":["腾讯","混元","Hy ASR 3.0","语音识别","元宝"],"facts":["8月4日腾讯混元发布新一代语音识别模型Hy ASR 3.0 preview，基于最新大模型Hy3，融合高精度识别与深度语义理解（腾讯云/江南都市报 2026-08-04）","开源评测集上多语种词错误率（WER）约3%：中文普通话3.34%、英语2.62%、粤语3.12%（腾讯云/腾讯新闻 2026-08-04）","覆盖10大方言片区、20余个细分方言；支持热词注入，快速识别品牌名、人名、行业术语（腾讯云/ AIHub 2026-08-04）","靠上下文语义消歧同音词（如「期中考试」与「期终考试」、「致癌物质」与「治癌物质」），长音频错误累积被压低（腾讯新闻/ AIHub 2026-08-04）","已上腾讯云API，元宝首发接入并免费开放方言识别、上下文纠错等功能，WorkBuddy等产品陆续接入（腾讯云/江南都市报 2026-08-04）","待核实：端到端时延与极端口音下的具体表现，以腾讯后续技术报告为准"],"scripts":[{"angle":"干货直给","text":"腾讯混元8月4号发了个语音识别模型Hy ASR 3.0 preview，最大的变化是从「听清」变成「听懂」。以前语音识别是两段式，先听字再猜意，听错了常常兜不回来。它把识别和语义理解做成端到端整体，靠上下文来纠错。数据上，开源评测集里普通话词错率3.34%、英语2.62%、粤语3.12%，都压在3%上下，已经逼近专业人工速记的水平。它能覆盖10大方言片区20多个细分方言，还支持热词注入，品牌名、人名、行业黑话塞进去就能准识别。现在腾讯云有API，元宝里免费开放，按住说话就能体验，普通人体感最明显的是方言和嘈杂环境更稳了。"},{"angle":"实操流程","text":"想用上混元这个语音识别，按这几步。第一，普通用户直接开元宝，更新到最新版，按住说话就能体验方言识别、上下文纠错、嘈杂环境稳定转写，免费。第二，开发者接腾讯云API，一行调用就能把「说话变文字」做得更准，适合做会议纪要、字幕、语音搜索。第三，专业场景用热词注入，把你们公司的品牌、产品名、人名、行业术语加进去，识别准确率立刻上来，不用为个别词反复改模型。第四，长录音放心用，它压低了长音频里的错误累积，半小时录音不会再越听越跑偏。微信语音输入、腾讯会议转写这类国民级场景，接下来都会直接受益，会议纪要让少写错人名。"},{"angle":"趋势判断","text":"Hy ASR 3.0最值得说的，是语音识别的终点可能不再是「更准的听」而是「更对的懂」。它把同音词交给上下文判断，比如「期终考试」还是「期中考试」、「致癌」还是「治癌」，靠语义补对那个词，这恰恰是从听清跨到听懂的标志。底座是混元Hy3大模型，声学侧自研无监督Encoder、语言侧MoE接Hy3，两端联合训练。对行业来说，这意味着语音交互从「能用但别指望准」往「好用」挪了一步，会议纪要让少写错人名、字幕少闹同音笑话。腾讯把它接进元宝和腾讯云，补齐了混元听—说—读—写全模态的一块，微信、会议这些入口马上能用上，全模态拼图也补齐了。"}]},{"id":"ai5","title":"英伟达开源340亿参数智驾模型，要做智驾界的安卓","hook":"Alpamayo 2 Super免费商用开源，让车先思考再行动，车企和开发者都能拿去微调。","why":"这是物理AI/自动驾驶领域少有的大厂开源+可商用模型，黄仁勋亲自站台称「AI下一波是机器人」，对关注自动驾驶、机器人、开源生态的人信息密度高。多源一致（NVIDIA开发者博客、36氪、快科技、Studio Global），且是本周新发布无历史覆盖。","heat":"中高","tags":["英伟达","Alpamayo","自动驾驶","开源","物理AI"],"facts":["当地时间8月4日英伟达宣布推出面向自动驾驶的开源推理模型Alpamayo 2 Super，权重上传Hugging Face，采用Linux基金会旗下OpenMDW许可，允许微调、衍生和商用再分发（NVIDIA开发者博客/36氪/快科技 2026-08-04至06）","总参数约340亿，由320亿参数视觉语言骨干（基于Cosmos 3 Super Reasoner）与约20亿参数动作专家组成，属视觉-语言-动作（VLA）架构，通过强化学习后训练（NVIDIA/36氪 2026-08）","支持360度全周感知，最多7路摄像头，可输出未来轨迹、因果推理链、高层元动作、自动标注等多项结果，面向L4级场景（NVIDIA/ Studio Global AI 2026-08）","黄仁勋在社交平台为模型站台，称AI下一波浪潮属于机器人，自动驾驶是其起点（36氪/快科技 2026-08-06）","Alpamayo系列在Hugging Face下载量已超50万，此前2026年1月CES发布初代Alpamayo 1（Studio Global AI/36氪 2026-08）","待核实：具体推理显存/算力门槛与车端部署实测数据，以英伟达技术文档为准"],"scripts":[{"angle":"干货直给","text":"英伟达8月4号开源了个自动驾驶模型Alpamayo 2 Super，直接放Hugging Face，而且能免费商用。它总参数约340亿，拆成320亿的视觉语言大脑加20亿的动作专家，属于VLA架构，就是让车能看、能想、能行动。它的卖点是「先思考再行动」：最多接7路摄像头做360度感知，输出未来行驶轨迹、为什么这么开的推理链、变道让行这类高层指令，还能顺手给训练数据打标注。底层基于英伟达自家的Cosmos 3世界模型。许可用Linux基金的OpenMDW，车企、供应商、开发者都能拿去微调部署，不用再找英伟达单独授权，门槛低了很多。"},{"angle":"说人话版","text":"自动驾驶最难的从来不是晴天跟车，而是施工改道、行人乱穿、前车违规插队这些长尾场景，没法靠写规则穷举。英伟达这个Alpamayo 2 Super，思路是让模型先理解物理世界再决策，所以它能基于真实驾驶数据生成各种天气、光照、路况的虚拟场景，让车在仿真里经历现实中难采集的极端情况。黄仁勋亲自发推说AI下一波是机器人、自动驾驶是起点，摆明要把智驾模型做成「安卓」——开源底座，谁都能拿来改。对车企是好事，自研智驾不用从零训，站在英伟达权重上微调就行。目前Hugging Face下载已超50万，热度不低，开发者用脚投票了。"},{"angle":"趋势判断","text":"英伟达开源Alpamayo 2 Super，本质是给自动驾驶行业递了一套「开源底座」，想当智驾界的安卓。过去车企自研智驾，数据和算力都卡脖子；现在英伟达把340亿参数的VLA模型免费商用开源，车企、Tier 1、创业公司都能在权重上微调部署，研发周期从月级压到天级。这和它Cosmos世界模型是一套打法：用开放权重绑定生态，你用我的模型，就离不开我的算力。对国内智驾阵营是双刃剑——短期省了自训成本，长期加深了对英伟达栈的依赖。但不可否认，开源让中小玩家也能玩高等级智驾，智驾能力的普及速度会明显加快，行业格局要被搅动。"}]}]}]},"2026-08-09":{"date":"2026-08-09","updatedAt":"2026-08-09 10:00","tracks":[{"id":"travel","name":"旅游攻略","topics":[{"id":"tv1","title":"9月15日起新规施行，出境前这条提醒必须看","hook":"第841号国务院令把出境安全风险防范第一次写成了制度，黑中介要被管起来了。","why":"9月15日施行的《国务院关于出境入境管理的规定》是2013年出境入境管理法后最重要的一次补丁，直接关系每个要出国的人。官方一手来源清晰，能讲清普通人出境前该看什么、防什么，时效性强且受众极广。","heat":"高","tags":["出境","新规","国务院令","安全提醒","中介"],"facts":["第841号国务院令《国务院关于出境入境管理的规定》于2026年6月29日国务院第90次常务会议通过，7月22日李强总理签发，自2026年9月15日起施行（中国政府网 2026-07；人民网 2026-08-03）","规定第一次把中国公民出境安全风险防范写成制度：外交、文旅主管部门及驻外机构及时发布国外安全提醒和旅游目的地安全风险提示；边检和证件审批环节提醒谨慎前往高风险国家，必要时劝阻（中国政府网；人民网 2026-08-03）","规范出境入境中介服务：2018年取消因私出入境中介准入许可后机构数量快速增长，出现违法违规损害权益问题，需完善管理制度（司法部、公安部、国家移民局负责人答记者问 2026-08）","以虚假材料、虚假陈述骗取证件或非法出入境受行政拘留的，移民管理机构可决定自处罚执行完毕之日起6个月至3年以内不准出境（中国政府网；人民网 2026-08-03）","出境入境管理法自2013年施行，本次规定是急用先行层面的配套完善（中国政府网 2026-07）","待核实：具体哪些国家和地区属于「最高风险级别劝阻」的细化名单与判定标准，以官方发布的安全提醒为准"],"scripts":[{"angle":"干货直给","text":"九月十五号起，一份新的国务院令要施行了，第841号《国务院关于出境入境管理的规定》。这份规定6月29号国务院常务会议通过，7月22号李强总理签发，9月15号正式落地。它第一次把中国公民出境安全风险防范写成制度，要求外交、文旅部门和驻外机构及时发国外安全提醒和旅游目的地风险提示。边检和证件审批环节，会提醒你谨慎去高风险国家，必要时直接劝阻。还有一块是管中介，2018年取消准入许可后，因私出入境中介数量猛增，乱象不少，这次把中介服务管理补上。一句话，出国前先看清官方提醒，别被黑中介坑了。"},{"angle":"避坑清单","text":"9月15号新规落地前，出境这几件事先记牢。第一，看清安全提醒。规定要求外交和文旅部门、驻外机构发布国外安全提醒和旅游目的地风险提示，边检办证时会提醒你去不去高风险地区，必要时劝阻，别硬扛。第二，管住中介。2018年取消准入许可后中介数量暴涨，坑人案例不少，选机构认准正规备案，合同条款逐条看。第三，别碰虚假材料。用假邀请函、假证明骗证，移民管理机关可以不发证、不准出境，已经拿到的也可能被撤销。第四，留好底线。因骗取证件或非法出入境被行政拘留的，处罚执行完后6个月到3年内可以限制出境。新规不是限制你出国，是帮你挡掉真风险。"},{"angle":"反常识开场","text":"国家不是限制你出国，是在帮你挡风险。9月15号，第841号国务院令《国务院关于出境入境管理的规定》施行，这是2013年出境入境管理法之后最重要的一次补丁。它把两件事钉死了。一是出境安全风险的防范，外交、文旅部门、驻外机构必须及时发安全提醒和风险提示，边检环节会当面提醒你别去高风险国家，必要时直接劝。二是管中介，过去黑中介靠信息差坑人，这次从制度上补。对普通人最直接的用处：出国前先去查官方安全提醒和风险提示，比听旅行社一句没事靠谱得多。你花几千块报的团，万一目的地正打仗正乱，旅行社可不会替你担责。"}]},{"id":"tv2","title":"赛里木湖自驾改按车收费，8月20日是个分水岭","hook":"75块一人变成120块一辆，人越多越划算，但得卡准8月20号这个时间。","why":"赛里木湖是新疆顶流自驾目的地，收费模式从按人改成按车是实打实的价格变化，直接影响出行成本。官方通报细节清晰（车型分档+过渡期），且关联景区殴打司机事件的整改，话题度和实用价值都高。","heat":"中高","tags":["赛里木湖","自驾","收费","新疆","避坑"],"facts":["此前赛里木湖执行75元/人自驾服务费；8月3日新疆自治区、博尔塔拉蒙古自治州联合工作组通报，将按「人」收费调整为按「车」收费（央广网 2026-08-03；新华社 2026-08-03）","新标准自8月20日0时执行：5座及以下120元/车、6至7座180元/车、8至19座300元/车、20座及以上600元/车（央广网/新华社 2026-08-03）","8月4日0时至新方案执行期间，暂按30元/人收取自驾服务费，因票务系统需升级调整（央广网/新华社 2026-08-03）","同期通报公布景区工作人员殴打旅游车司机事件处理结果：7名工作人员被行政拘留10至15日并各罚款1000元，多名相关领导被问责（央广网/新华社 2026-08-03）","自治区将督促指导全区涉自驾收费服务的旅游景区抓紧制定优化调整方案（新华社 2026-08-03）","央视网8月4日报道，稻城亚丁7月也已推出优化整改，8月1日至10月31日面向全国游客免收景区门票（央视网 2026-08-04）"],"scripts":[{"angle":"干货直给","text":"赛里木湖自驾收费改了，从按人变成按车。以前是75块钱一个人收自驾服务费，8月3号新疆自治区和博尔塔拉州联合工作组通报，改成按车收费，新标准8月20号零点起执行。具体是：5座及以下120块一辆，6到7座180，8到19座300，20座以上600。注意一个过渡期，8月4号零点到新方案执行前这段时间，暂时还按30块一个人收。另外这次通报还公布了之前景区工作人员殴打旅游车司机的处理结果，7个人被行政拘留10到15天，各罚一千，相关领导也被问责。自治区还要推动全区自驾收费景区都出优化方案。去之前看准8月20号这个节点，能省不少。"},{"angle":"成本账","text":"赛里木湖按车收费之后，账怎么算最划算。新规8月20号起：5座及以下120元一辆，6到7座180，8到19座300，20座以上600。对比原来的75块一人，你一眼就明白，人越多越划算。一辆5座车坐满4个人，原来要300，现在120，省180。要是两个人去，原来150，现在还是120，省得少。所以这条新规对家庭游、朋友拼车是实打实的让利，对 solo 或者小两口基本没差，甚至人多到7座以上反而更贵。过渡期还有个细节，8月4号到20号之间暂时按30块一人，这个时候去反而可能比按车便宜，算好日期再走。一句话，满员的车等20号后去，人少的趁过渡期走。"},{"angle":"避坑清单","text":"赛里木湖自驾新规，三个坑先认清。第一，时间坑。按车收费8月20号零点才生效，之前还是75块一人，但8月4号到20号之间临时按30块一人，这段别按新价预期。第二，车型坑。按行驶证核载人数分档，5座和6座差60块，7座和8座又是两个档，你买的什么车、坐几个人，直接决定收费。第三，别被旧攻略骗。网上大量攻略还是75块一人的老标准，导航软件、第三方平台的收费提示可能没更新，以景区窗口和官方公告为准。另外这波调整是因为之前景区殴打司机事件加收费争议引发的整改，同期全区自驾收费景区都要优化，出门前查一下目的地最新公告。"}]},{"id":"tv3","title":"柬埔寨对中国公民免签试行，6.15到10.15这张窗口别错过","hook":"不用签证不花钱，填张电子入境卡就能待14天，还能多次进出。","why":"柬埔寨免签试行期正好覆盖暑期到国庆的出境高峰，且中国驻柬使馆已发领事提醒确认政策，有官方一手来源。但该国电诈网赌风险高，需把免签便利与避险提示一起讲清，实用且能救人。","heat":"中高","tags":["柬埔寨","免签","出境","领事提醒","避险"],"facts":["柬埔寨政府2025年12月2日发布官方文件，2026年6月15日至10月15日对中国公民试行免签，允许停留14天（新华社 2025-12-03；央广网 2025-12-03）","试行期内无需申请签证、无需缴费，只需填写电子入境卡（E-Arrival Card），且可多次入境（新华社 2025-12-03）","中国驻柬使馆2026年6月25日发布领事提醒确认该政策：无论自中国境内还是第三国出发，均可免签入境（中国驻柬使馆 2026-06-25）","柬埔寨旅游部统计：2025年1月至10月吸引中国游客约100万人次（新华社 2025-12-03）","使馆提醒：柬政府禁止口岸官员索要小费，遇索要应明确拒绝并取证；无人机管控严格；遵守宗教习俗；防范网赌电诈、远离高薪招聘（中国驻柬使馆 2026-06-25）","待核实：免签适用的具体陆海空口岸范围与落地执行细节，以柬埔寨官方口岸现场执行为准"],"scripts":[{"angle":"干货直给","text":"柬埔寨对中国公民试行免签了，窗口是今年6月15号到10月15号，整整四个月。这段时间你拿普通护照去柬埔寨，不用办签证，不用交任何费用，只要填一张电子入境卡，能停留14天，还能多次入境。中国驻柬使馆6月25号专门发了领事提醒确认这个政策，不管你从国内走还是从第三国转机都适用。注意几点：电子入境卡可以提前7天在手机App或者网站填；柬方明令禁止口岸官员索要小费，遇到直接拒绝并取证；无人机管控很严，别带；还要远离网赌电诈，别信高薪招聘。柬埔寨旅游部数据，去年前10个月中国游客约100万人次，免签就是冲着这波人来的。"},{"angle":"避坑清单","text":"去柬埔寨免签，这几条踩了就麻烦。第一，别给小费。柬政府一再重申禁止口岸官员索要小费，遇到直接说不给，在保证安全的前提下录证据，回来向中国使馆反映。第二，电子入境卡必须填。免签不等于啥都不用办，落地前7天就能在柬埔寨e-arrival的App或网站填报，到口岸现场填也行，但别漏。第三，无人机别带。柬埔寨对无人机管控极严，未经许可带了就是违规。第四，远离网赌电诈。柬方最近在严打电诈网赌，别信高薪招聘、别替人带行李。第五，尊重宗教习俗，进寺庙王宫着装得体。这趟免签是6月15到10月15的试行，过期就恢复原样，看好日期。"},{"angle":"反常识开场","text":"东南亚免签又多一个，但柬埔寨这个最该看清门道。它给的是6月15到10月15的试行免签，14天停留、多次入境、不收签证费，听着比很多国家都大方。但免签不等于零门槛：你还是得填电子入境卡，还是得走正规口岸，还是得遵守当地法律。真正要提醒的是风险面。柬埔寨是电诈网赌重灾区，使馆提醒里专门强调远离黄赌毒、别信高薪招聘。还有口岸索贿这个老问题，官方口径是明确禁止，遇到别惯着、留证据。所以去柬埔寨玩完全可行，但把它当清迈还是当妙瓦底，心态要分清。免签降低的是手续成本，降不了的是你自己的警惕心。"}]},{"id":"tv4","title":"甘孜317、318终身卡，一次购票管一辈子畅游14个景区","hook":"317女性、318男性，买一次能终身不限次进海螺沟、稻城亚丁等14家景区。","why":"甘孜终身门票是文旅行业标志性事件，用顶流景区做钩子带火全域，价格机制清晰（1091元门票打三折）。对常去川西的人和旅居群体有实际省钱价值，也能讲透景区转型趋势。","heat":"中高","tags":["甘孜","终身门票","川西","稻城亚丁","性价比"],"facts":["2026年1月28日「圣洁甘孜·一生有约」活动首发，317元（海棠卡，女性）、318元（金雕卡，男性）两款终身畅游卡，可终身无限次进入甘孜14家4A及以上景区（甘孜州政府官网 gzz.gov.cn；央视网 2026-08-04）","14家景区单次门票总价1091元，终身卡约为其三分之一，限售100万张，2026年3月1日正式启用（甘孜州政府官网；潮新闻 2026-02-27）","14家含海螺沟(5A)、稻城亚丁(5A)、木格措、甲居藏寨、泸定桥、伍须海、墨石公园、亚拉雪山、勒通古镇、措普沟、红山、印经院、玉龙拉措等（甘孜州政府官网 gzz.gov.cn）","甘孜州文旅局长刘洪披露：2025年全州接待游客超4700万人次，旅游综合收入517亿元，门票收入仅1.6亿元、占比不到0.3%，故推动「去门票化」（潮新闻 2026-02-27）","截至2月24日线上累计销售双卡39.72万张、支付破1.26亿元，线下认购约51万张（潮新闻 2026-02-27）","该卡属实名记名预付凭证，按《单用途商业预付卡管理办法》不设有效期（潮新闻 2026-02-27）"],"scripts":[{"angle":"干货直给","text":"四川甘孜出了张终身门票，317块和318块两款，买一次管一辈子。317是女性专属的海棠卡，318是金雕卡，对应317、318两条国道。凭卡能终身不限次进甘孜14家4A及以上景区，包括海螺沟、稻城亚丁两个5A，还有木格措、甲居藏寨、墨石公园这些4A。这14个景区单次门票加一块是1091块，等于打三折，而且限售100万张，3月1号已经启用。甘孜州自己算过账，2025年全州门票收入才1.6亿，占旅游总收入517亿不到0.3%，所以干脆去门票化，靠住宿餐饮二次消费赚钱。常去川西的人，去两次亚丁加海螺沟就回本了。"},{"angle":"成本账","text":"甘孜这张终身卡到底值不值，算笔账。317或者318块买断14个景区终身入园权，单次门票总和1091，相当于三折。这14家里光海螺沟、稻城亚丁两个5A单买就接近240，你只要再去一个4A比如木格措，基本就回本。适合两类人：一年去甘孜两三次的，和打算长住旅居的。按甘孜官方举例，有自驾爱好者每年去两次，光亚丁和海螺沟门票就500多，办卡318直接省。不适合的是只打算去一次的，那还是买单票划算。另外要注意，这是实名记名预付卡，按法规不设有效期，不用担心换领导不认，但限购100万张，别拖。3月1号已启用，现在去甘孜玩，先去官方小程序买卡再进场。"},{"angle":"趋势判断","text":"甘孜卖终身门票，本质是景区在主动砸自己的门票饭碗，这信号比省钱更重要。2025年甘孜接待游客超4700万，旅游综合收入517亿，但门票收入才1.6亿，占比不到0.3%。门票本来就不再是收入主力，甘孜索性把它当引流工具。用海螺沟、稻城亚丁这两个顶流当钩子，把12个4A小众景区一起带火，让游客从看一个景变成住一阵、吃一桌、买一筐。这套打法跟杭州西湖免费开放是一个逻辑：门票让出去，人留下来，钱花在别处。对游客是实打实划算，对其它还在死守门票的景区，是个倒逼。今年暑期甘孜估计要冲5000万人次，靠的就是这张卡。"}]},{"id":"tv5","title":"贵州全省旅游百日行动，8.1到11.10严打宰客和天价","hook":"12315全程畅通，热门景区还有专人驻点现场调处，现在去是被保护最严的窗口。","why":"暑期贵州是旅游大省，百日行动覆盖面广、五大领域同时发力，官方部署文件完整。对游客是直接的维权武器，可讲清遇到宰客该找谁、留什么证据，时效和实用价值都高。","heat":"中高","tags":["贵州","旅游维权","百日行动","市场监管","宰客"],"facts":["7月31日贵州省市场监管局动员部署，8月1日至11月10日在全省开展「护航旅游安全百日行动」（天眼新闻 2026-08-02；中国质量报/新浪 2026-08-06）","聚焦五大领域：涉旅食品安全、特种设备安全、市场价格秩序、商品质量计量、消费维权服务（天眼新闻 2026-08-02）","价格秩序：严查不执行政府定价、两套菜单、价外加价、虚假打折、捆绑消费、模糊标价，落实特殊人群票价减免，重拳整治「宰客」、天价商品（中国质量报/新浪 2026-08-06）","商品质量：银饰玉器、酱香白酒、农特产品、文创产品拉网排查，打击假冒伪劣、缺斤短两、虚假宣传（中国质量报/新浪 2026-08-06）","消费维权：畅通12315，落实快速受理、核查、处置、反馈，热门景区安排专人驻点现场调处（天眼新闻 2026-08-02）","贵阳市8月3日动员，聚焦五大领域以「零容忍」态度亮剑（贵阳市场监管 2026-08-04）","待核实：行动期间具体查处案例与处罚数据，以各地市场监管部门后续通报为准"],"scripts":[{"angle":"干货直给","text":"贵州从8月1号到11月10号，全省搞一个护航旅游安全百日行动，由省市场监管局统一部署。盯的就是暑期旅游旺季的安全和消费痛点，五大块：食品安全、特种设备、市场价格、商品质量、消费维权。价格这块查得最狠，不执行政府定价、两套菜单、价外加价、虚假打折、捆绑消费、模糊标价全在打击范围，宰客和天价商品顶格处理，特殊人群票价减免必须落实。商品质量重点查银饰玉器、酱香白酒、农特产品、文创，打击假冒伪劣和缺斤短两。消费维权方面12315全程畅通，热门景区还安排专人驻点现场调处。去贵州玩，遇到坑直接12315，现在正是他们严打期。"},{"angle":"避坑清单","text":"贵州旅游百日行动期间，游客怎么借力维权。第一，遇宰客别忍。价外加价、两套菜单、捆绑消费、虚标价格，正是这次重点整治的，保留菜单、付款记录、聊天截图，打12315。第二，买特产认准公平秤。银饰玉器、酱香白酒、农特产品是拉网排查对象，景区商铺和夜市流动摊贩是重点，买之前看有没有配公平秤，离谱低价别碰。第三，特种设备看检验。索道、游乐设施、观光车都在排查带病运行，坐之前留意设备有没有检验标志。第四，食品安全盯后厨。民宿农家乐网红店是重点场所，餐具消毒、食材过期是严查项。第五，热门景区有专人驻点，现场就能调处，别嫌麻烦不开口。"},{"angle":"趋势判断","text":"贵州这一波百日行动，说明旅游监管在从被动接诉变成主动排雷。过去游客被宰，得自己留证据、打投诉、等几天才有回音。现在省局直接把8月1号到11月10号定为专项监管期，食品安全、特种设备、价格、商品质量、维权五条线一起压下去，热门景区还派人驻点现场办。更关键的是它卡准了暑期这个客流高峰，提前把乱象摁住，而不是等舆情爆了再救火。对游客来说，这段时间去贵州是被保护最严的窗口。对其他旅游大省也是个示范：监管前置比事后罚款更能保住口碑。你赶在严打期出行，遇到坑大胆投诉，处理速度和力度都会明显不同。"}]}]},{"id":"ai","name":"AI 资讯与玩法","topics":[{"id":"ai1","title":"谷歌AI一夜洗牌：Jeff Dean离职创业，布林亲自盯Gemini","hook":"27年老将走了，DeepMind创始人交权，Gemini被收进一条更短的指挥链。","why":"这是谷歌AI权力结构的一次标志性地震，有多家科技媒体一手跟进。能讲清顶尖研究者流向、Gemini竞争压力与产品化转向，对关注AI行业的人信息密度高。","heat":"高","tags":["谷歌","DeepMind","Jeff Dean","Gemini","人才流动"],"facts":["8月5日至6日，谷歌调整AI体系核心人物：在谷歌工作27年的首席科学家Jeff Dean离职创业；DeepMind联合创始人Demis Hassabis交出日常管理权，转任Google DeepMind主席和Alphabet首席科学家（腾讯新闻/机器之心 2026-08-06）","Dean与Sanjay Ghemawat、Quoc Le、Oriol Vinyals创办Discovery Loop并任CEO，做AI自动完成科学与工程实验循环（递归式自我改进）；获Radical Ventures、Khosla Ventures、Alphabet投资，谷歌提供至少一年算力并继续合作（腾讯新闻/华尔街见闻 2026-08-06）","原DeepMind CTO Koray Kavukcuoglu升任高级副总裁，直接向皮查伊汇报，接管Gemini研发与交付（腾讯新闻/网易 2026-08-06）","创始人Sergey Brin更直接参与Gemini战略判断和产品推进（腾讯新闻 2026-08-08）","背景：2024年Noam Shazeer请回后又于2026年6月离开加入OpenAI；AlphaFold诺奖得主John Jumper加入Anthropic，Gemini研究人员亦被曝流向Anthropic（腾讯新闻 2026-08-06）","相关消息公布后Alphabet股价下跌约5%（腾讯新闻 2026-08-08）"],"scripts":[{"angle":"干货直给","text":"谷歌AI核心层一夜洗牌。8月5号到6号，谷歌连着动了几个最关键的人。在谷歌干了27年的首席科学家Jeff Dean离职，跟Ghemawat、Quoc Le、Vinyals三个老伙计创办Discovery Loop，做AI自动跑科学实验的循环，谷歌自己投了钱还供算力。DeepMind创始人Hassabis交出日常管理，转去当主席和首席科学家。原CTO Kavukcuoglu升任高级副总裁，直接向皮查伊汇报，接管Gemini研发交付。布林也更深介入Gemini战略。一句话，谷歌把两个最有声望的科学家移出执行层，把Gemini收进更短的指挥链，急着跟OpenAI、Anthropic抢速度。"},{"angle":"趋势判断","text":"谷歌这轮人事地震，本质是前沿模型竞争逼出来的组织收缩。过去DeepMind是谷歌AI的引擎室，研究主导一切。现在不行了，去年秋天Gemini一度领先，之后被OpenAI和Anthropic反超，最新旗舰Gemini 3.5 Pro迟迟不发，股价还跌了5%。谷歌的应对是两条线：把Gemini拉进短指挥链，Hassabis管科研、Kavukcuoglu管交付、布林管战略，皮查伊催速度；同时不硬留人，投资离职者的公司、供算力维持关系。这揭示一个行业现实：顶级研究者用大厂资源换创业控制权，模型公司的护城河正在从论文转向产品和收入。接下来谷歌比拼的不是榜单，是代码工具和企业付费。"},{"angle":"故事切入","text":"一个在谷歌待了27年的技术元老，参与了搜索地基、TPU、Google Brain的人，上周发推说要走了。这个人叫Jeff Dean，8月5号左右谷歌确认他离职，跟三个老搭档去搞Discovery Loop，让AI自己提假设、跑实验、改模型。同一时间，DeepMind的Hassabis把日常交出去当主席，Gemini交给Kavukcuoglu，布林亲自下场盯。这不是普通跳槽，是谷歌AI权力的一次大挪移。背景是Gemini被OpenAI和Anthropic反超、旗舰迟迟不发。对咱们普通人的影响是间接的：你用的谷歌系产品，接下来迭代节奏会变快，但也可能更激进。大厂抢人抢模型，最后都落在你每天用的那个搜索框里。"}]},{"id":"ai2","title":"苹果国行Apple智能接千问，文档上线一天就被撤","hook":"官网第一次写明接阿里千问，不到24小时撤回，客服说还在等审批。","why":"这是Apple智能国行版落地节奏的最新发展，多方媒体跟进且事实链条完整（上线-撤回-客服回应-备案背景）。能讲清「确定要接、但暂不能用」的真实状态，纠正市场误读。","heat":"高","tags":["苹果","Apple智能","千问","阿里","国行"],"facts":["8月8日苹果中国官网Mac使用手册上线《在Mac上配合Apple智能使用千问》，首次以官方文档确认国行Apple智能集成阿里千问（观察者网/深圳商报 2026-08-09）","文档上线不到一天被撤下，页面恢复为「配合Apple智能使用ChatGPT」旧版（观察者网/DoNews 2026-08-09）","苹果客服8月9日回应：目前中国大陆暂时没有AI智能功能，相关功能正在申请中，需国家审批通过才能使用（新浪/搜狐/DoNews 2026-08-09）","7月15日「网信中国」公示生成式AI服务备案名单，苹果技术开发(上海)申报的「Apple智能」完成备案，办结日期7月8日，适用场景为国行iPhone（搜狐/DoNews 2026-08-09）","阿里曾确认千问将作为AI能力集成至Apple智能，覆盖iOS、iPadOS、macOS、visionOS中国用户（深圳商报/搜狐 2026-08-09）","被撤文档显示千问扩展要求macOS 26.6以上，面向大陆版本设备、大陆Apple账户、身处大陆境内，深度整合写作工具与Siri（DoNews/观察者网 2026-08-09）","待核实：有报道称iOS27 Beta2已集成百度视觉搜索，仅为单一知情人士口径，未见官方确认"],"scripts":[{"angle":"干货直给","text":"苹果国行Apple智能跟阿里千问的瓜，一天就反转了。8月8号苹果中国官网Mac使用手册里上线一篇《在Mac上配合Apple智能使用千问》，第一次用官方文档确认国行Apple智能接的是千问。但这篇文档上线不到一天就被撤了，页面退回成配合ChatGPT的旧版。苹果客服8月9号回应：目前中国大陆暂时没有AI智能功能，相关功能在申请中，要等国家审批通过。其实7月15号网信中国已经公示，苹果申报的Apple智能完成备案，办结日期7月8号，适用国行iPhone。备案完了不代表功能开，产品适配和监管审批还得走。所以现在的状态是：确定要接千问，但啥时候能用，没准信。"},{"angle":"避坑清单","text":"苹果千问手册一天就被撤，普通用户别被带节奏。第一，现状是国行Apple智能还没开。客服明确说暂时没有这个功能，在等审批，别信提前说能用的小道消息。第二，备案是真的。7月8号Apple智能完成生成式AI服务备案，7月15号网信中国公示，适用国行iPhone，这是落地的前提条件，已经具备。第三，接千问也基本坐实。撤掉的文档里写得很清楚，千问扩展走macOS 26.6以上，限大陆设备、大陆账户、人在大陆，整合Siri和写作工具。第四，别急着升系统等这个功能，文档撤了说明节奏有变数，以苹果官方公告为准。一句话：要接千问是真，马上能用是假，耐心等审批。"},{"angle":"反常识开场","text":"苹果自己把国行AI的窗户纸捅破又糊上了，这反而比一直藏着更说明问题。8月8号官网文档首次写明Apple智能接阿里千问，不到24小时撤回。为什么撤？客服的说法是功能还在申请、等监管审批。注意，备案其实7月8号就办下来了，也就是说合规的第一道关过了，卡的是产品落地那道关。这种上线又秒撤，苹果不是头一回，3月底国行iPhone设置页也短暂冒出过Apple智能选项然后收回。它反映的是Apple智能国行版的真实处境：框架定了、合作伙伴定了、备案有了，但上线节奏被审批节奏卡着。对国内用户来说，等一个真正好用的国行AI助手，还得再忍一阵。"}]},{"id":"ai3","title":"Grok Imagine Image 2.0发布，xAI图像模型冲到全球第二","hook":"不是只会画图了，魔棒能只改你指的那一块，一次还能参考5张图。","why":"xAI图形模型升级聚焦「编辑而非生成」，是图像模型竞争方向转变的信号。有xAI官方发布与多家科技媒体跟进，功能点具体可演示，对设计、电商、自媒体从业者有直接用法价值。","heat":"中高","tags":["xAI","Grok","图像生成","图像编辑","SpaceXAI"],"facts":["美国时间8月7日，马斯克旗下xAI以SpaceXAI品牌推出Grok Imagine Image 2.0图像模型（虎嗅/IT时代网 2026-08-07/08）","第三方Arena榜单文生图与图像编辑两项均列全球第二，仅次于OpenAI的GPT Image 2（虎嗅/Unite.AI 2026-08-07/08）","已作为Quality Mode部署到grok.com/imagine及Grok的iOS、安卓应用，普通用户可直接用；API标注「即将上线」（虎嗅/Unite.AI）","核心升级：区域级精细编辑（魔棒局部修改、分割选区、背景移除）、多图参考（单次最多5张）、智能排版、9种画幅智能适配（虎嗅/Unite.AI/IT时代网）","内置15+模板覆盖商品拍摄、形象照、电商图、游戏原画、营销海报等商用场景（Unite.AI/DevelopersDigest）","待核实：Arena排名由xAI自行引用公开榜单快照（文生图约1320、图像编辑约1439，GPT Image 2分列1463/1380），非独立第三方评测，名次会浮动"],"scripts":[{"angle":"干货直给","text":"马斯克的xAI把图像模型升级了，8月7号推出Grok Imagine Image 2.0，挂的是SpaceXAI品牌。它现在在第三方Arena榜单的文生图和图像编辑两个项目上都排全球第二，仅次于OpenAI的GPT Image 2。已经作为Quality Mode上到grok.com/imagine和Grok的iOS、安卓App，普通用户直接用，开发者API写的是即将上线。这次重点不是生成而是编辑：魔棒能只改你指的那一块，分割选区、背景移除都能单独操作，一次最多参考5张图，还能智能适配9种画幅。说白了，它想从能画图变成能改图，往专业设计工作流里塞。内置15多个模板，商品图、形象照、电商图、游戏原画、海报都能套。"},{"angle":"工具评测","text":"Grok Imagine Image 2.0值不值得用，看你是玩票还是干活。如果你要的是出张好看的图，它排全球第二，质量够用，而且免费通道已经开在Grok里，不用等API。如果你是做设计、电商、营销，它这次的编辑能力才是重点：魔棒局部改、背景一键抠透明、5张参考图融合、9种画幅智能重绘，外加商品图海报这些预制模板，等于把一部分PS活儿接过去了。短板也有：API还没开，要批量接系统得等；榜单第二是xAI自己引用的Arena快照，不是独立评测，具体分数会浮动。对创作者最实用的玩法是，拿它做电商图和社媒配图，比从头生图省时间，比手修图门槛低。"},{"angle":"趋势判断","text":"图像模型这波竞争，重心从生成挪到了编辑。Grok Imagine Image 2.0排全球第二，但xAI讲的故事不是它画得多好，而是它能改得多准：局部编辑、背景移除、多图参考、智能排版，全是为真实工作场景设计的。这跟OpenAI的GPT Image 2是同一个方向，两家都在抢设计师和营销人的桌面。底层逻辑是，单纯生图已经卷出天花板，能无缝进生产流程的模型才值钱。对普通用户，这意味着AI出图会越来越多地出现在你买的东西的详情页、你刷的 poster 里；对从业者，意味着基础修图岗位的门槛在被拉低。接下来图像模型的卖点，不会是画得多炫，而是能不能直接进你的工作流。"}]},{"id":"ai4","title":"特斯拉车机首次接入第三方大模型，装的是豆包","hook":"马斯克在美国用自家Grok，到了中国却给车装了豆包加DeepSeek。","why":"特斯拉中国首次在车机引入国产大模型，是智能座舱本土化的标志性案例，也有合规与产业分工的深层逻辑。多家汽车媒体跟进，事实链条完整，对车主和汽车行业都有讲解价值。","heat":"中高","tags":["特斯拉","豆包","DeepSeek","OTA","智能座舱"],"facts":["7月31日特斯拉中国向Model 3/Y/S/X分批次推送2026.14.13版车机OTA，首次在国内引入第三方大模型——字节豆包（网通社/太平洋汽车 2026-07-31）","双模型协同：豆包负责导航设定、空调调节、媒体控制、车主手册查询等执行型指令；DeepSeek Chat负责开放域对话；均通过火山引擎接入，2026年4月在上海完成生成式AI备案（今日头条/网通社 2026-07-31）","唤醒词「豆包豆包」，提供薇薇、小何、云舟等音色，预设万事通、音乐爱好者、故事会等角色；需开通高级车载娱乐服务（网通社 2026-07-31）","合规驱动：美国市场马斯克绑定自家Grok（2025年7月启用，需订阅9.9美元/月高级车载娱乐服务包）；中国因合规与本土化短板选择第三方（今日头条 2026-08）","实测：初期灰度版本中豆包以独立App形态集成，暂未获控车权限，控车仍靠原语音助手；完整语音控车需后续版本（今日头条/太平洋汽车 2026-07-31/08）","备案号Shanghai-TeslaCheJiYuYinDaMoXingFuWu-202603020128（太平洋汽车 2026-07-31）"],"scripts":[{"angle":"干货直给","text":"特斯拉中国7月31号开始推送2026.14.13版车机OTA，最大的变化是第一次在国内接了第三方大模型——字节的豆包。这是双模型方案：豆包负责导航、空调、媒体控制、查车主手册这些执行类指令，DeepSeek负责闲聊和开放问答，都通过火山引擎接入，今年4月在上海完成生成式AI备案。唤醒词是豆包豆包，有薇薇、云舟等音色，预设万事通、故事会等角色，但要开通高级车载娱乐服务才能用。为什么不用马斯克自家的Grok？美国市场Grok去年7月就上了，同样要订阅。中国这边是合规和本土化短板，逼着它选了国产模型。"},{"angle":"实操流程","text":"特斯拉车主想用上豆包，按这几步走。第一步，确认你的车在推送范围。7月31号起Model 3、Y、S、X分批次推2026.14.13，新交付车优先，老车陆续收，主要在AMD Ryzen芯片车型上开放。第二步，开通高级车载娱乐服务，这是使用前提，没开用不了。第三步，长按方向盘语音键或者直接喊豆包豆包唤醒，选个音色和角色就能聊。但有个现实提醒：目前灰度版本里豆包更像是个独立聊天App，控车权限还没完全放开，调空调、放音乐这些可能还走原来的语音助手。完整语音控车得等后续版本。所以现在它能陪聊、查信息、讲故事，控车别太指望它。"},{"angle":"反常识开场","text":"坚持AI自研的马斯克，在中国却给车装了豆包，这事得反过来想。特斯拉在美国绑的是自家Grok，要订阅每月9.9美元。到了中国，7月31号推的2026.14.13 OTA却接了字节的豆包加DeepSeek，全走火山引擎合规部署。表面看是国产AI赢了，其实是合规和本土化的硬约束：中文座舱体验、数据合规、监管备案，这些马斯克的自研体系短期补不上。所以这是一次理性妥协，不是谁碾压谁。对车主是好事，终于有能聊的中文助手；对行业更关键，它立了个分工范式——车企守住车辆安全和控车，AI厂商提供座舱交互。以后更多车会照这个模子来。"}]},{"id":"ai5","title":"千问App一口气上五项新功能，还接了Qwen3.8-MAX","hook":"定时任务每天8点自动给你出行业简报，办公助理能自己开浏览器下附件出文档。","why":"千问App这次更新把AI从聊天工具推向个人工作台，五项功能均有官方与多家媒体跟进，且能落到具体用法。对效率党、自媒体和办公人群有直接上手价值。","heat":"中高","tags":["千问","Qwen3.8-MAX","办公助理","定时任务","智能体广场"],"facts":["8月7日千问App和PC端功能上新，推出思考研究、定时任务、办公助理、智能体广场、语音通话五项新功能，支持最新旗舰Qwen3.8-MAX，所有用户免费使用（IT之家/每日经济新闻 2026-08-07）","思考研究：原「深度思考」升级，强化复杂推理、工具调用、信息整合与结构化输出，可把资料生成周报/研究报告（IT之家 2026-08-07）","定时任务：预设执行时间自动完成简报梳理、邮件汇总；如每天8点搜AI/芯片/互联网新闻形成趋势小结（IT之家 2026-08-07）","办公助理：连接备忘录/日历/邮件，操作电脑和浏览器，调用Skill自主完成多步骤任务，直接输出Office文档；手机发起、PC执行跨端协同；专业用户可付费增额度（IT之家/网经社 2026-08-07）","智能体广场：智能寄件、网盘整理、超清扫描、文件查询，首批覆盖物流、房产、本地生活、理财、汽车等十余领域（IT之家 2026-08-07）","Qwen3.8-MAX于8月3日发布，总参数2.4万亿，稀疏MoE架构，上下文长度1M Tokens；同日千问办公(QwenWork)开启公测（今日头条/网经社 2026-08-07）"],"scripts":[{"angle":"干货直给","text":"千问App 8月7号大更新，一口气上了五项功能，还接了最新的Qwen3.8-MAX，全部免费。五项分别是：思考研究、定时任务、办公助理、智能体广场、语音通话。思考研究是原来深度思考的升级，资料丢进去能直接出周报和研究报告。定时任务最好用，设好时间它就自动帮你搜新闻、汇总邮件，比如每天8点把AI和芯片动态推给你。办公助理能连你的备忘录、日历、邮件，自己开浏览器下附件，最后吐出一份Office文档，手机发起、电脑执行。智能体广场有寄件、网盘整理、扫描这些生活服务。Qwen3.8-MAX是8月3号发的，2.4万亿参数，上下文1M。"},{"angle":"实操流程","text":"千问这波新功能，最该先玩的是办公助理和定时任务，跟着做。第一步，打开千问App或PC端，确认已切到Qwen3.8-MAX。第二步，试定时任务：在对话框设每天早上8点，自动搜AI、芯片、互联网新闻并生成趋势小结，之后你每天开App就有简报。第三步，试办公助理：把散在几个文件里的报表丢给它，说要汇总各大区数据，它会自己清洗、对齐、出可用结果，手机发起电脑执行。第四步，用智能体广场，@寄件或网盘整理这类服务处理杂活。第五步，语音通话适合带娃讲题、睡前故事。关键提醒：办公助理专业额度要付费，日常免费够用，重活再考虑加购。"},{"angle":"创作者视角","text":"做自媒体的，千问这五项更新里有俩能直接进工作流。第一个是思考研究，你把采集的素材、竞品链接、数据表一扔，它能按背景、目标、成果、总结的结构出一份完整文档，做选题复盘和周报省一半时间。第二个是定时任务，设成每天8点自动扫AI和短视频行业新闻出小结，你起床就有一手情报，不用自己刷。配合办公助理跨端协同，手机上扔任务、电脑上跑、自动出Office，搬运整理素材的体力活基本能交给它。智能体广场里的文件查询、超清扫描也能接进素材管理。把这些串起来，一个人顶半个运营小组，尤其适合预算有限、要批量产内容的团队。"}]}]}]}}</script>

<script>
/* ================= data ================= */
var K={st:'wb_kb_status_v1',rf:'wb_kb_refs_v1',hs:'wb_kb_history_v1',mt:'wb_kb_meta_v1'};
var PACK_TODAY=JSON.parse(document.getElementById('packToday').textContent);
var PACK_HIST=JSON.parse(document.getElementById('packHistory').textContent);
var ST={},RF=[],HS={},MT={};
var curDate=PACK_TODAY.date,curTrack='all',curSt='all',curPane='today';
var STATES=['new','pick','shot','pub'];
var ST_LABEL={new:'未处理',pick:'已选用',shot:'已拍',pub:'已发'};
var ST_CLS={new:'st-new',pick:'st-pick',shot:'st-shot',pub:'st-pub'};

function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('存储写入失败，建议先导出备份');return false}}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return n<10?'0'+n:''+n}
function daysBetween(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.round((y-x)/86400000)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function wc(s){return (s||'').replace(/\s/g,'').length}
function secOf(s){return Math.round(wc(s)/300*60)}

function boot(){
  ST=lsGet(K.st,{});RF=lsGet(K.rf,[]);HS=lsGet(K.hs,{});MT=lsGet(K.mt,{});
  for(var d in PACK_HIST){if(!HS[d])HS[d]=PACK_HIST[d]}
  HS[PACK_TODAY.date]=PACK_TODAY;
  var keys=Object.keys(HS).sort().reverse();
  if(keys.length>30){keys.slice(30).forEach(function(k){delete HS[k]})}
  lsSet(K.hs,HS);
  curDate=PACK_TODAY.date;
  renderAll();
  checkTip();
}
function packOf(d){return HS[d]||PACK_TODAY}
function allScripts(d){
  var p=packOf(d),out=[];
  (p.tracks||[]).forEach(function(tk){(tk.topics||[]).forEach(function(tp,ti){(tp.scripts||[]).forEach(function(sc,si){
    out.push({id:d+'|'+tk.id+'|'+tp.id+'|'+si,date:d,trackId:tk.id,trackName:tk.name,topic:tp,topicIdx:ti,sc:sc,si:si});
  })})});
  return out;
}
function stOf(id){return (ST[id]&&ST[id].s)||'new'}
function stTs(id){return (ST[id]&&ST[id].t)||null}
function setSt(id,s){
  if(s==='new'){delete ST[id]}else{ST[id]={s:s,t:today()}}
  lsSet(K.st,ST);renderAll();checkTip();
}

/* ================= today ================= */
function buildTodo(){
  var td=today(),items=[];
  Object.keys(HS).sort().reverse().forEach(function(d){
    allScripts(d).forEach(function(x){
      var s=stOf(x.id),t=stTs(x.id);
      if(s==='pub')return;
      if(s==='new'){
        if(d===PACK_TODAY.date)items.push({x:x,kind:'new',od:false,msg:'今天新出的稿，还没看'});
        return;
      }
      var age=t?daysBetween(t,td):0;
      if(s==='pick')items.push({x:x,kind:'pick',od:age>=1,msg:age>=1?('选用了 '+age+' 天还没拍'):'今天选用，等拍'});
      if(s==='shot')items.push({x:x,kind:'shot',od:age>=1,msg:age>=1?('拍完 '+age+' 天还没发'):'今天拍完，等发'});
    })
  });
  items.sort(function(a,b){
    if(a.od!==b.od)return a.od?-1:1;
    var o={shot:0,pick:1,new:2};return o[a.kind]-o[b.kind];
  });
  return items;
}
function renderToday(){
  var items=buildTodo(),od=items.filter(function(i){return i.od});
  var td=PACK_TODAY.date,all=allScripts(td);
  var cnt={new:0,pick:0,shot:0,pub:0};
  all.forEach(function(x){cnt[stOf(x.id)]++});
  var pubAll=0;Object.keys(HS).forEach(function(d){allScripts(d).forEach(function(x){if(stOf(x.id)==='pub')pubAll++})});

  document.getElementById('stats').innerHTML=
    st('今日新稿',all.length,'')+st('待拍',cnt.pick,'')+st('逾期',od.length,'od')+st('累计已发',pubAll,'dn');

  var show=items.slice(0,8);
  document.getElementById('todayN').textContent=items.length?(items.length+' 项待办'):'全部清空';
  document.getElementById('tlist').innerHTML=show.length?show.map(function(i){
    var nx=i.kind==='new'?'pick':(i.kind==='pick'?'shot':'pub');
    var lb=i.kind==='new'?'选用':(i.kind==='pick'?'标已拍':'标已发');
    return '<div class="titem'+(i.od?' od':'')+'">'+
      '<div class="bd"><div class="t">'+esc(i.x.topic.title)+'　·　'+esc(i.x.sc.angle)+'</div>'+
      '<div class="m">'+(i.x.date!==PACK_TODAY.date?('['+i.x.date+'] '):'')+esc(i.msg)+'</div></div>'+
      '<button class="go" onclick="setSt(\''+i.x.id+'\',\''+nx+'\')">'+lb+'</button></div>';
  }).join('')+(items.length>8?'<div style="text-align:center;font-size:12px;color:var(--text3);padding-top:4px">还有 '+(items.length-8)+' 项，去口播稿库看全部</div>':'')
  :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>今天没有待办，去选题池挑几条</div>';

  document.getElementById('navBdg').style.display=od.length?'':'none';
  document.getElementById('navBdg').textContent=od.length;

  var p=PACK_TODAY;
  document.getElementById('ovCnt').textContent=p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题 / '+all.length+' 稿';
  document.getElementById('overview').innerHTML=p.tracks.map(function(tk){
    return '<div class="card tk-'+tk.id+'" style="margin-bottom:12px;padding:13px 14px">'+
      '<div style="font-weight:700;font-size:14.5px;margin-bottom:9px;display:flex;align-items:center;gap:7px">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:var(--'+(tk.id==='travel'?'travel':'ai')+')"></span>'+esc(tk.name)+
      '<span style="margin-left:auto;font-size:11.5px;color:var(--text3);font-weight:600">'+tk.topics.length+' 条</span></div>'+
      tk.topics.map(function(tp,i){
        var done=tp.scripts.filter(function(_,si){return stOf(td+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
        return '<div style="display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.5">'+
          '<span style="color:var(--text3);font-weight:700;font-variant-numeric:tabular-nums;flex:none">'+(i+1)+'</span>'+
          '<span style="flex:1;min-width:0">'+esc(tp.title)+'</span>'+
          '<span style="flex:none;font-size:11px;color:'+(done?'var(--ok)':'var(--text3)')+';font-weight:700">'+done+'/'+tp.scripts.length+'</span></div>';
      }).join('')+'</div>';
  }).join('');
}
function st(l,v,c){return '<div class="stat '+c+'"><b>'+v+'</b><span>'+l+'</span></div>'}

/* ================= topics ================= */
function renderTracks(){
  var p=packOf(curDate);
  var h='<button class="ttab'+(curTrack==='all'?' on':'')+'" data-k="all" onclick="setTrack(\'all\')">全部<span class="s">'+
    p.tracks.reduce(function(a,t){return a+t.topics.length},0)+' 选题</span></button>';
  p.tracks.forEach(function(tk){
    h+='<button class="ttab'+(curTrack===tk.id?' on':'')+'" data-k="'+tk.id+'" onclick="setTrack(\''+tk.id+'\')">'+esc(tk.name)+'<span class="s">'+tk.topics.length+' 选题</span></button>';
  });
  document.getElementById('ttabs1').innerHTML=h;
  document.getElementById('ttabs2').innerHTML=h;
  var f=[['all','全部'],['new','未处理'],['pick','已选用'],['shot','已拍'],['pub','已发']];
  document.getElementById('stfilter').innerHTML=f.map(function(x){
    return '<button class="ttab'+(curSt===x[0]?' on':'')+'" data-k="all" style="font-size:12.5px;padding:8px 4px;min-height:40px" onclick="setStF(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function setTrack(t){curTrack=t;renderTracks();renderTopics();renderScripts()}
function setStF(s){curSt=s;renderTracks();renderScripts()}
function renderTopics(){
  var p=packOf(curDate),h='';
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    h+='<div class="topics-grid">'+tk.topics.map(function(tp,i){
      var fid=tk.id+'_'+tp.id;
      var done=tp.scripts.filter(function(_,si){return stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+si)!=='new'}).length;
      return '<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main">'+
        '<div class="tp-t">'+esc(tp.title)+'</div>'+
        '<div class="tp-tags"><span class="tag hot">热度 '+esc(tp.heat)+'</span>'+
        (tp.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
        '<span class="tag">'+done+'/'+tp.scripts.length+' 已处理</span></div>'+
        '<div class="tp-why"><b>开场钩子：</b>'+esc(tp.hook)+'<br><b>为什么今天做：</b>'+esc(tp.why)+'</div>'+
        '</div></div>'+
        '<div class="fold"><button class="fold-b" onclick="fold(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>事实与数据（'+(tp.facts||[]).length+' 条，念之前先扫一眼）</button>'+
        '<div class="fold-c"><ul class="facts">'+(tp.facts||[]).map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div></div>'+
        '<div class="scripts">'+tp.scripts.map(function(sc,si){return scHtml(tk,tp,sc,si)}).join('')+'</div>'+
        '</div>';
    }).join('')+'</div>';
  });
  document.getElementById('topicList').innerHTML=h||'<div class="card"><div class="empty">这天没有内容</div></div>';
}
function scHtml(tk,tp,sc,si){
  var id=curDate+'|'+tk.id+'|'+tp.id+'|'+si,s=stOf(id),n=wc(sc.text),sec=secOf(sc.text);
  var nx=s==='new'?'pick':(s==='pick'?'shot':(s==='shot'?'pub':'new'));
  var nxL=s==='new'?'选用':(s==='pick'?'标已拍':(s==='shot'?'标已发':'重置'));
  var t=stTs(id),od=(s==='pick'||s==='shot')&&t&&daysBetween(t,today())>=1;
  return '<div class="sc">'+
    '<div class="sc-hd"><span class="sc-a">'+esc(sc.angle)+'</span>'+
    '<span class="sc-m">'+n+' 字 · 约 '+sec+' 秒</span>'+
    '<span class="sc-st '+ST_CLS[s]+'">'+ST_LABEL[s]+(od?' · 逾期':'')+'</span></div>'+
    '<div class="sc-tx" onclick="this.classList.toggle(\'open\')">'+esc(sc.text)+'</div>'+
    '<div class="sc-acts">'+
    '<button class="sbtn pri" onclick="copy(this,'+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>'+
    '<button class="sbtn" onclick="openTele('+q(tp.title+' · '+sc.angle)+','+q(sc.text)+')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M6 8h12M6 12h8"/></svg>念稿</button>'+
    '<button class="sbtn '+(od?'od':(s==='pub'?'act':''))+'" onclick="setSt(\''+id+'\',\''+nx+'\')">'+nxL+'</button>'+
    (s!=='new'?'<button class="sbtn" onclick="setSt(\''+id+'\',\'new\')">撤销</button>':'')+
    '</div></div>';
}
function q(s){return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'')+"'"}
function fold(b){b.classList.toggle('open');b.nextElementSibling.classList.toggle('open')}

function renderScripts(){
  var p=packOf(curDate),h='',n=0;
  p.tracks.forEach(function(tk){
    if(curTrack!=='all'&&curTrack!==tk.id)return;
    tk.topics.forEach(function(tp,i){
      var list=tp.scripts.map(function(sc,si){return {sc:sc,si:si}}).filter(function(o){
        return curSt==='all'||stOf(curDate+'|'+tk.id+'|'+tp.id+'|'+o.si)===curSt;
      });
      if(!list.length)return;
      n+=list.length;
      h+='<div class="card topic tk-'+tk.id+'">'+
        '<div class="tp-hd" style="padding-bottom:0"><div class="tp-idx">'+(i+1)+'</div><div class="tp-main"><div class="tp-t" style="font-size:14.5px">'+esc(tp.title)+'</div></div></div>'+
        '<div class="scripts" style="border-top:none;margin-top:11px">'+list.map(function(o){return scHtml(tk,tp,o.sc,o.si)}).join('')+'</div></div>';
    });
  });
  document.getElementById('scriptList').innerHTML=h||'<div class="card"><div class="empty">没有符合筛选的稿子</div></div>';
}

/* ================= refs ================= */
var rStar=4;
function renderStars(){
  document.getElementById('rStars').innerHTML=[1,2,3,4,5].map(function(i){
    return '<button class="star'+(i<=rStar?' on':'')+'" onclick="rStar='+i+';renderStars()"><svg viewBox="0 0 24 24"><path d="m12 2 2.9 6.3 6.8.9-5 4.7 1.3 6.8L12 17.4 6 20.7l1.3-6.8-5-4.7 6.8-.9z"/></svg></button>';
  }).join('');
}
function addRef(){
  var t=document.getElementById('rTitle').value.trim();
  if(!t){toast('标题得填一下');return}
  RF.unshift({id:'r'+Date.now(),title:t,track:document.getElementById('rTrack').value,
    author:document.getElementById('rAuthor').value.trim(),link:document.getElementById('rLink').value.trim(),
    star:rStar,note:document.getElementById('rNote').value.trim(),date:today()});
  lsSet(K.rf,RF);
  ['rTitle','rAuthor','rLink','rNote'].forEach(function(i){document.getElementById(i).value=''});
  rStar=4;renderStars();renderRefs();toast('已存进灵感库');checkTip();
}
function delRef(id){RF=RF.filter(function(r){return r.id!==id});lsSet(K.rf,RF);renderRefs()}
function renderRefs(){
  document.getElementById('refCnt').textContent=RF.length+' 条';
  var TN={travel:'旅游攻略',ai:'AI 资讯与玩法',other:'其他'};
  document.getElementById('refList').innerHTML=RF.length?RF.map(function(r){
    return '<div class="ref"><div class="ref-h"><div style="flex:1;min-width:0">'+
      '<div class="ref-t">'+esc(r.title)+'</div>'+
      '<div class="ref-m"><span class="tag">'+esc(TN[r.track]||r.track)+'</span>'+
      (r.author?'<span>@'+esc(r.author)+'</span>':'')+
      '<span style="color:#f5a623;letter-spacing:1px">'+'★'.repeat(r.star)+'<span style="color:#dfe3e8">'+'★'.repeat(5-r.star)+'</span></span>'+
      '<span>'+esc(r.date)+'</span></div>'+
      (r.note?'<div class="ref-n">'+esc(r.note)+'</div>':'')+
      (r.link?'<a class="ref-l" href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.link)+'</a>':'')+
      '</div><button class="xbtn" onclick="delRef(\''+r.id+'\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>';
  }).join(''):'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z"/></svg>刷到好片子就存一条，做选题时翻一翻</div>';
}

/* ================= teleprompter ================= */
var teleSize=26,rolling=false,rollT=null,spd=1;
function openTele(t,x){
  document.getElementById('teleTitle').textContent=t;
  document.getElementById('teleTx').textContent=x;
  document.getElementById('teleBd').scrollTop=0;
  document.getElementById('tele').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeTele(){stopRoll();document.getElementById('tele').classList.remove('on');document.body.style.overflow=''}
function teleFont(d){teleSize=Math.max(16,Math.min(52,teleSize+d));document.getElementById('teleTx').style.fontSize=teleSize+'px'}
function toggleRoll(){rolling?stopRoll():startRoll()}
function startRoll(){
  rolling=true;
  document.getElementById('rollBtn').innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>暂停';
  var bd=document.getElementById('teleBd');
  rollT=setInterval(function(){
    bd.scrollTop+=spd*0.6;
    if(bd.scrollTop+bd.clientHeight>=bd.scrollHeight-2)stopRoll();
  },28);
}
function stopRoll(){
  rolling=false;if(rollT)clearInterval(rollT);rollT=null;
  var b=document.getElementById('rollBtn');
  if(b)b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9z"/></svg>自动滚动';
}
function rollSpeed(d){spd=Math.max(.4,Math.min(3,+(spd+d*.2).toFixed(1)));document.getElementById('spdTx').textContent='×'+spd.toFixed(1)}

/* ================= backup ================= */
function doExport(){
  var d={_app:'kouban-workbench',_v:1,_at:new Date().toISOString(),status:ST,refs:RF,history:HS};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='选题台备份_'+today()+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  MT.lastBackup=today();lsSet(K.mt,MT);hideTip();toast('已导出备份文件');
}
function doImport(el){
  var f=el.files&&el.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      if(d.status)ST=Object.assign({},d.status);
      if(d.refs&&d.refs.length!==undefined)RF=d.refs.slice();
      if(d.history)for(var k in d.history){if(!HS[k])HS[k]=d.history[k]}
      HS[PACK_TODAY.date]=PACK_TODAY;
      lsSet(K.st,ST);lsSet(K.rf,RF);lsSet(K.hs,HS);
      renderAll();toast('已恢复：'+Object.keys(ST).length+' 条标记 / '+RF.length+' 条灵感');
    }catch(e){toast('文件读不出来，确认是本站导出的 JSON')}
    el.value='';
  };
  r.readAsText(f);
}
var mkFn=null;
function askClear(){
  openMask('确认清空全部数据？','会删掉所有标记状态（已选用/已拍/已发）、对标灵感库和历史归档。今天的选题和稿子不受影响，会重新加载。这一步撤不回来，建议先点「导出备份」。',function(){
    localStorage.removeItem(K.st);localStorage.removeItem(K.rf);localStorage.removeItem(K.hs);localStorage.removeItem(K.mt);
    ST={};RF=[];HS={};MT={};HS[PACK_TODAY.date]=PACK_TODAY;lsSet(K.hs,HS);
    closeMask();curDate=PACK_TODAY.date;renderAll();toast('已清空');
  });
}
function openMask(t,p,fn){
  document.getElementById('mkT').textContent=t;document.getElementById('mkP').textContent=p;
  mkFn=fn;document.getElementById('mask').classList.add('on');
}
function closeMask(){document.getElementById('mask').classList.remove('on')}
document.getElementById('mkOk').onclick=function(){if(mkFn)mkFn()};
document.getElementById('mask').onclick=function(e){if(e.target===this)closeMask()};

function checkTip(){
  var n=Object.keys(ST).length+RF.length;
  if(n>=30&&MT.lastBackup!==today()&&!MT.tipHidden){
    document.getElementById('tipTx').textContent='数据已经攒到 '+n+' 条了，建议点右上角导出一份备份。换手机、清缓存都不怕。';
    document.getElementById('tipbar').classList.add('on');
  }else{document.getElementById('tipbar').classList.remove('on')}
}
function hideTip(){MT.tipHidden=today();lsSet(K.mt,MT);document.getElementById('tipbar').classList.remove('on')}

/* ================= misc ================= */
function copy(btn,tx){
  var ok=function(){var o=btn.innerHTML;btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>已复制';setTimeout(function(){btn.innerHTML=o},1400);toast('全文已复制，'+wc(tx)+' 字')};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(tx).then(ok,function(){fb()})}else{fb()}
  function fb(){
    var ta=document.createElement('textarea');ta.value=tx;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){toast('复制失败，长按稿子手动选')}
    document.body.removeChild(ta);
  }
}
var tT=null;
function toast(m){
  var e=document.getElementById('toast');e.textContent=m;e.classList.add('on');
  if(tT)clearTimeout(tT);tT=setTimeout(function(){e.classList.remove('on')},2100);
}
function go(p){
  curPane=p;
  document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on')});
  document.getElementById('p-'+p).classList.add('on');
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});
  window.scrollTo(0,0);
}
function switchDate(d){curDate=d;renderDateSel();renderTracks();renderTopics();renderScripts()}
function renderDateSel(){
  var ks=Object.keys(HS).sort().reverse();
  var h=ks.map(function(d){return '<option value="'+d+'"'+(d===curDate?' selected':'')+'>'+d+(d===PACK_TODAY.date?'（最新）':'')+'</option>'}).join('');
  document.getElementById('dateSel').innerHTML=h;
  document.getElementById('dateSel2').innerHTML=h;
  var bg=curDate===PACK_TODAY.date?'<span class="badge-live">今日最新</span>':'<span class="badge-old">历史归档</span>';
  document.getElementById('dateBadge').innerHTML=bg;
  document.getElementById('dateBadge2').innerHTML=bg;
}
function renderAll(){
  document.getElementById('hdSub').textContent=PACK_TODAY.date+' · 更新于 '+(PACK_TODAY.updatedAt||'10:00')+' · 共 '+allScripts(PACK_TODAY.date).length+' 篇稿';
  var ft='数据只存在这台设备的浏览器里，没有上传服务器。换设备 / 清缓存前记得导出备份。<br>每天 10:00 自动更新新一批选题与口播稿。';
  ['foot1','foot2','foot3','foot4'].forEach(function(i){document.getElementById(i).innerHTML=ft});
  renderDateSel();renderTracks();renderToday();renderTopics();renderScripts();renderRefs();renderStars();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeTele();closeMask()}
});
boot();
</script>
